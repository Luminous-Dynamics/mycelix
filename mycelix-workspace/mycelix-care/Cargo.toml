[workspace]
resolver = "2"
members = [
    "zomes/timebank/integrity",
    "zomes/timebank/coordinator",
    "zomes/circles/integrity",
    "zomes/circles/coordinator",
    "zomes/matching/integrity",
    "zomes/matching/coordinator",
    "zomes/care-plans/integrity",
    "zomes/care-plans/coordinator",
    "zomes/bridge/integrity",
    "zomes/bridge/coordinator",
]
# Note: "zomes/credentials/{integrity,coordinator}" were listed here and in
# dna/dna.yaml but the directories never existed (confirmed 2026-07-09 while
# fixing an unrelated P0 author-binding pass -- this workspace could not
# build/test at all until these phantom members were removed). dna.yaml's
# credentials/credentials_integrity zome references are left as-is since
# that's a hApp-packaging concern, not a cargo build blocker; a real
# credentials zome may need to be implemented or the DNA manifest cleaned up
# separately.

[workspace.dependencies]
# Holochain 0.6 compatible (per official compatibility table)
hdk = "0.6.0"
hdi = "0.7.0"
holochain_integrity_types = "0.6.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
thiserror = "1.0"
derive_more = "0.99"

# Holochain serialized bytes for entry serialization
holochain_serialized_bytes = "0.0.56"

# WASM compatibility - getrandom 0.2 with "js" feature for Holochain WASM runtime
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[profile.dev]
opt-level = "z"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
