[workspace]
resolver = "2"

[package]
name = "mycelix-authority-write-lease"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-or-later"
authors = ["Luminous Dynamics"]
repository = "https://github.com/Luminous-Dynamics/mycelix"
publish = false
description = "Minimal, wire-compatible verifier for Mycelix signed PostgreSQL authority-write leases"

[dependencies]
blake3 = "1.5"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = "2.1"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["serde"] }

[dev-dependencies]
async-trait = "0.1"
hex = "0.4"
serde_json = "1.0"
tokio = { version = "1.0", features = ["sync"] }

[lints.rust]
unsafe_code = "forbid"
