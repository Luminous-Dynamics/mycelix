[package]
name = "net-steward-discovery"
version = "0.1.0"
edition = "2021"
authors = ["Luminous Dynamics Core Team"]
license = "MIT OR Apache-2.0"

[dependencies]
net-steward-schema = { path = "../net-steward-schema" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }

[dev-dependencies]
ed25519-dalek = "2.1"
hex = "0.4"
rand = "0.8"

[[bin]]
name = "net-steward-daemon"
path = "src/main.rs"

[[bin]]
name = "net-steward-verify-capsule"
path = "src/verify_cli.rs"
