[package]
name = "mycelix-zkp-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-or-later"
authors = ["Tristan Stoltz <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Shared authenticated proof envelopes and circuit-specific ZKP primitives for Mycelix"
keywords = ["zkp", "stark", "dilithium", "holochain", "dastark"]
categories = ["cryptography", "wasm"]
repository = "https://github.com/luminous-dynamics/mycelix"

[features]
default = []

# Backend selection — each zome enables only what it needs.
backend-risc0 = []
backend-winterfell = [
    "dep:winterfell",
    "dep:winter-math",
    "dep:winter-crypto",
]
backend-dual = ["backend-risc0", "backend-winterfell"]
backend-miden = [
    "dep:miden-vm",
    "dep:miden-core",
]

# SECURITY QUARANTINE: historical HealthRangeAir and its jurisdiction composition
# are underconstrained (issue #227). Historical/unqualified inspection only.
legacy-unqualified-range-proof = ["backend-winterfell"]

# SECURITY QUARANTINE: application-authority Winterfell AIRs identified by the
# authority census (#1873) as underconstrained. This is intentionally separate
# from backend-winterfell so enabling a verifier backend never implies authority.
legacy-unqualified-winterfell-authority = ["backend-winterfell"]

# Experimental measurement surfaces. The current benchmark depends on the
# quarantined historical range circuit; enabling this feature is therefore an
# explicit research/measurement opt-in, not a proof-authority profile.
experimental-winterfell-baselines = ["legacy-unqualified-range-proof"]

# PQ authentication (adds ~2.6KB to WASM)
dilithium = ["dep:pqcrypto-dilithium", "dep:pqcrypto-traits"]

# Full stack for ordinary native testing. Deliberately excludes every legacy or
# experimental Winterfell feature above so `full` cannot restore proof authority.
full = ["backend-dual", "dilithium"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
serde_json = "1.0"
thiserror = "2.0"
proofs-config = { path = "../../mycelix-core/libs/proofs-config" }
proofs-commitment = { path = "../../mycelix-core/libs/proofs-commitment" }

winterfell = { version = "0.13.1", optional = true }
winter-math = { version = "0.13.1", optional = true }
winter-crypto = { version = "0.13.1", optional = true }

miden-vm = { version = "=0.23.5", optional = true, features = ["std"] }
miden-core = { version = "=0.23.5", optional = true }

pqcrypto-dilithium = { version = "0.5", optional = true }
pqcrypto-traits = { version = "0.3", optional = true }
rand = "0.8"

[dev-dependencies]
serde_json = "1.0"

[[bench]]
name = "zkp_core_bench"
harness = false

[lib]
crate-type = ["rlib"]
