[package]
name = "orbital-mechanics"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Orbital mechanics library: SGP4 propagation, covariance, and conjunction analysis. Standalone crate (no workspace membership) so it can be path-depended-on from multiple independent workspaces (mycelix-space, symthaea) without Cargo workspace-membership conflicts — see mycelix-workspace/Cargo.toml exclude list."

[lib]
crate-type = ["rlib"]

[dependencies]
# Pinned explicitly (not `workspace = true`): this crate intentionally has no
# workspace of its own and isn't a member of any enclosing one (see excludes
# in mycelix-workspace/Cargo.toml and mycelix-space/Cargo.toml). Values below
# are copied verbatim from mycelix-space's former [workspace.dependencies] to
# preserve exact prior behavior across the relocation.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nalgebra = { version = "0.32", features = ["serde-serialize"] }
chrono = "0.4"

# SGP4/SDP4 propagation (NORAD algorithms)
sgp4 = "1.0"

# Real VSOP87 planetary ephemeris (Meeus's published algorithms; ~arcsecond
# accuracy over centuries, well beyond planning-grade needs). Used for
# gravity-assist flyby-chain sequencing -- verified this is a real,
# functioning crate (not the two dead/nonexistent workspace.dependencies
# entries `planetary-ephemeris`/`astro-coords` in mycelix-workspace/Cargo.toml,
# which don't resolve on crates.io at all) before adding it here.
astro = "2.0.0"

# Error handling
thiserror = "1.0"

[dev-dependencies]
approx = "0.5"

[[bench]]
name = "screening_benchmark"
harness = false
