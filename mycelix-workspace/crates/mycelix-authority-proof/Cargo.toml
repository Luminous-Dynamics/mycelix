[workspace]
resolver = "2"

[package]
name = "mycelix-authority-proof"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-or-later"
authors = ["Luminous Dynamics"]
repository = "https://github.com/Luminous-Dynamics/mycelix"
publish = false
description = "Domain-separated, signed authority proof receipts for Mycelix execution finality"

[dependencies]
blake3 = "1.5"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = "2.1"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["serde"] }

[dev-dependencies]
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"
