[package]
name = "mycelix-space-tests"
version = "0.1.0"
edition = "2024"
description = "Integration tests for mycelix-space orbital mechanics and Holochain types"
publish = false

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Holochain testing dependencies (NO zome crate imports to avoid duplicate symbols)
hdk = "=0.6.1"
hdi = "=0.7.1"

# Async runtime

# Serialization (msgpack for Holochain entry deserialization)
rmp-serde = "1.1"

# Testing utilities
anyhow = "1.0"
pretty_assertions = "1.4"
proptest = "1.4"

# Orbital mechanics library
orbital-mechanics = { path = "../../crates/orbital-mechanics" }

# Shared types (for Holochain zome integration tests)
mycelix-space-shared = { path = "../zomes/shared" }

# Time handling
chrono = "0.4"

# Math
nalgebra = { version = "0.32", features = ["serde-serialize"] }

[[test]]
name = "orbital_mechanics"
path = "orbital_mechanics_tests.rs"

[[test]]
name = "conjunctions"
path = "conjunctions_tests.rs"

[[test]]
name = "propagation"
path = "propagation_tests.rs"

[[test]]
name = "shared_types"
path = "integration/zome_tests.rs"

[[test]]
name = "edge_cases"
path = "edge_case_tests.rs"

[[test]]
name = "property_tests"
path = "property_tests.rs"

[[test]]
name = "proptest_orbital"
path = "proptest_orbital.rs"

[[test]]
name = "space_coordination_e2e"
path = "space_coordination_e2e.rs"

[[test]]
name = "orbital_objects"
path = "orbital_objects_tests.rs"

[[test]]
name = "observations"
path = "observations_tests.rs"

[[test]]
name = "debris_bounties"
path = "debris_bounties_tests.rs"

# Sweettest Integration Tests (conductor-based)
[[test]]
name = "sweettest_integration"
path = "sweettest_integration.rs"

[dev-dependencies]
holochain = { version = "=0.6.1", features = ["test_utils", "sweettest"] }
holochain_types = "=0.6.1"

# Match the root workspace's coherent Holochain 0.6.1 dependency family.
# Floating transitive 0.6.x components selected newer prerelease crypto APIs
# and broke this standalone resolver even when hdk/hdi/holochain were pinned.
holochain_zome_types = "=0.6.1"
holochain_serialized_bytes = "=0.0.57"
holo_hash = "=0.6.1"
holochain_integrity_types = "=0.6.1"
holochain_state = "=0.6.1"
holochain_p2p = "=0.6.1"
holochain_keystore = "=0.6.1"
holochain_sqlite = "=0.6.1"
holochain_wasmer_host = "=0.0.102"
kitsune2 = "=0.4.1"
lair_keystore = "=0.6.3"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
tokio = { version = "1", features = ["full", "test-util"] }
