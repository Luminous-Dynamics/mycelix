# Hearth Holochain 0.7 isolated compatibility crate.
# Kept aligned with the shared Mycelix source while isolating Hearth from
# the legacy 0.6 workspace dependency graph.

[package]
name = "hearth-bridge-entry-types"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Shared entry types for Mycelix cluster bridge integrity zomes"

[dependencies]
hdi = "=0.8.0"
holochain_integrity_types = "=0.7.0"
holo_hash = "=0.7.0"
hdk_derive = "=0.7.0"
holochain_serialized_bytes = "=0.0.57"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
