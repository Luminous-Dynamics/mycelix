[package]
name = "mycelix-historical-activation-time-policy-authority-anchored-transition-crypto-request-policy"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Prepared crypto request for authority-anchored historical time-policy transitions"

[lib]
crate-type = ["rlib"]

[dependencies]
mycelix-crypto = { workspace = true }
mycelix-historical-activation-time-policy-authority-anchored-transition-policy = { path = "../historical-activation-time-policy-authority-anchored-transition-policy" }
mycelix-historical-activation-time-policy-authority-key-generation-policy = { path = "../historical-activation-time-policy-authority-key-generation-policy" }
mycelix-historical-activation-time-policy-transition-signer-authority-subject-policy = { path = "../historical-activation-time-policy-transition-signer-authority-subject-policy" }
sha2 = { workspace = true }

[dev-dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["rand_core"] }
mycelix-historical-activation-time-authority-policy = { path = "../historical-activation-time-authority-policy" }
mycelix-historical-activation-time-policy-transition-policy = { path = "../historical-activation-time-policy-transition-policy" }
mycelix-historical-activation-time-receipt-policy = { path = "../historical-activation-time-receipt-policy" }
mycelix-identity-authority-domain-policy = { path = "../identity-authority-domain-policy" }
