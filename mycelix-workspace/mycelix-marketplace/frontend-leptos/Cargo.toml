[workspace]
resolver = "2"
members = [
  "crates/marketplace-domain",
  "crates/marketplace-client",
  "apps/marketplace-web",
]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-or-later"
authors = ["Tristan Stoltz / Luminous Dynamics"]

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
thiserror = "2"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Location"] }
