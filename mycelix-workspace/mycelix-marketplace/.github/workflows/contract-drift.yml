name: Contract drift

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  zome-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify coordinator API manifest
        run: python3 scripts/check-zome-contract.py
      - name: Verify transaction conflict policy
        run: python3 scripts/check-transaction-conflict-policy.py
      - name: Verify explicit conflict authority
        run: python3 scripts/check-transaction-conflict-resolution.py
      - name: Verify network promotion contract
        run: python3 scripts/check-network-promotion.py
