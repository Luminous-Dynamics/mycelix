# Mycelix Pulse Docker conductor configuration for Holochain 0.7.0.
# Mount/use a fresh volume for 0.7; do not point this at a 0.6 conductor database.
tracing_override: ~
wasm_backend: ~

data_root_path: /data/holochain-0.7

keystore:
  type: lair_server_in_proc

admin_interfaces:
  - driver:
      type: websocket
      port: 8889
      danger_bind_addr: ~
      allowed_origins: "*"

network:
  # Verify the deployed endpoint supports the 0.7 Kitsune2/Iroh transport.
  bootstrap_url: "https://bootstrap.holo.host"
  relay_url: "https://bootstrap.holo.host/relay"
  base64_auth_material_bootstrap: ~
  base64_auth_material_relay: ~
  request_timeout_s: 60
  target_arc_factor: 1
  report: none
  advanced: ~

# The 0.6 Fast mode mapped to Off; choose Normal here to preserve durability.
db_sync_level: Normal
db_max_readers: 16
incoming_request_concurrency_limit: 64
tuning_params: ~
tracing_scope: ~
