SPECIFICATION Spec

CONSTANTS
    g1 = "grant-1"
    g2 = "grant-2"
    op1 = "grant-request-1"
    op2 = "grant-request-2"
    grantor = "grantor"
    grantee = "grantee"
    outsider = "outsider"
    NoGrant = "NO_GRANT"
    NoOp = "NO_OP"
    NoAgent = "NO_AGENT"
    DomainAllowedOps = {"grant-request-1"}
    UseProjectionAuthority = FALSE
    UseGrantIdempotency = TRUE
    MaxAttempts = 2

INVARIANTS
    NoSentinelCollision
    DomainAllowedOpsAreValid
    BooleanSwitchesAreValid
    AttemptBoundIsValid
    TypeOK
    NoProjectionAuthority
    StaleProjectionDoesNotAllow
    NoEffectWithoutHostAuthorization
    AtMostOneEffectPerLogicalOperation
    RevocationMonotonic
    GrantIdentityInjective
    ClaimsBoundToIssuedGrant

CHECK_DEADLOCK FALSE
