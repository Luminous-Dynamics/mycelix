SPECIFICATION Spec

CONSTANTS
    WorkerA = "worker-a"
    WorkerB = "worker-b"
    NoWorker = "NO_WORKER"
    GrantA = "grant-a"
    GrantB = "grant-b"
    NoGrant = "NO_GRANT"
    DigestA = "sha256-read-scope"
    DigestB = "sha256-send-scope"
    NoDigest = "NO_DIGEST"
    UseAtomicReservation = TRUE
    EnforceDigestBinding = FALSE
    EnforceRevocationMonotonic = TRUE

INVARIANTS
    ConflictingRequestNeverSucceeds

CHECK_DEADLOCK FALSE
