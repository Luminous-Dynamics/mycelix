[package]
name = "mycelix-pulse-sweettests"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Integration + sweettest suite for Mycelix Pulse. Phase 0 forward."
publish = false

# The integration tests live as loose .rs files alongside this Cargo.toml
# (not in tests/). Each gets its own [[test]] entry so cargo can discover them.
[[test]]
name = "sweettest_mail_security"
path = "sweettest_mail_security.rs"

[dependencies]
# empty — this crate is tests-only; all deps go under [dev-dependencies]

[dev-dependencies]
# Holochain sweettest harness. Version must match the conductor and the rest
# of the workspace — see mycelix-workspace/Cargo.toml's
# [workspace.dependencies] pins (the canonical source of truth; the
# nix/modules/holochain-versions.nix this comment used to cite doesn't
# exist). This crate had drifted to the pre-0.6.1 pin.
holochain = { version = "=0.6.1", features = ["sweettest"] }
holochain_types = { version = "=0.6.1" }
holo_hash = { version = "=0.6.1" }

# hdi for integrity-zome types imported into tests (Timestamp, AgentPubKey, etc.)
hdi = "=0.7.1"

# Async runtime for #[tokio::test]
tokio = { version = "1", features = ["full"] }

# Serde for mirror types
serde = { version = "1", features = ["derive"] }
serde_json = "1"
