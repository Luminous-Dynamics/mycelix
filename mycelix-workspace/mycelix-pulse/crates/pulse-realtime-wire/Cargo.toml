[package]
name = "pulse-realtime-wire"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Fail-closed Holochain wire-family demultiplexing for Mycelix Pulse realtime wakes"

[workspace]

[dependencies]
holochain_serialized_bytes = "=0.0.57"
pulse-realtime-types = { path = "../pulse-realtime-types" }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
