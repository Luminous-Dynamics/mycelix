[package]
name = "mail_bridge"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hdk = "0.6"
serde = { version = "1.0", features = ["derive"] }
mail_bridge_integrity = { path = "../integrity" }
mycelix-zkp-core = { path = "../../../../../../crates/mycelix-zkp-core" }
# mycelix-zkp-core pulls rand 0.8 -> getrandom 0.2, which fails to compile for
# wasm32 without the custom backend feature (HDK provides the runtime impl).
# Matches the sibling-cluster pattern (mycelix-commons Cargo.toml:164).
getrandom = { version = "0.2", features = ["custom"] }
