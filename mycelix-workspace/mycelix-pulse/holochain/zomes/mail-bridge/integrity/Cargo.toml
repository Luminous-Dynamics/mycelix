[package]
name = "mail_bridge_integrity"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

# These are mechanical equivalence/style findings in a large provenance-heavy
# validator. Keep them package-local during cohort qualification; semantic
# validation defects (including unreachable policy arms) remain hard errors.
[lints.clippy]
unnecessary_map_or = "allow"
manual_range_contains = "allow"
manual_contains = "allow"

[dependencies]
hdi = "0.7"
serde = { version = "1.0", features = ["derive"] }
# Required by hdk_entry_helper macro expansion — without this, every
# #[hdk_entry_helper] struct fails to derive TryFrom<SerializedBytes>.
# Pre-existing bug; sibling messages integrity zome had it; mail-bridge
# missed it, blocking the entire zome from compiling.
holochain_serialized_bytes = { workspace = true }
