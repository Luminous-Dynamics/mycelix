[package]
name = "mail_capabilities"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

# Legacy control-flow/presentation findings are quarantined package-locally
# during Holochain cohort qualification. Keep the migration gate focused on
# dependency/runtime compatibility; refactor these independently afterward.
[lints.clippy]
collapsible_if = "allow"
unnecessary_sort_by = "allow"
useless_conversion = "allow"

[dependencies]
hdk = "0.6"
serde = { version = "1.0", features = ["derive"] }
mail_capabilities_integrity = { path = "../integrity" }
