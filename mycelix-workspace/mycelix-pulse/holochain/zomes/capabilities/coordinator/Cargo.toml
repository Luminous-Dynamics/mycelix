[package]
name = "mail_capabilities"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hdk = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
mail_capabilities_integrity = { path = "../integrity" }
sha2 = { version = "0.10", default-features = false }
