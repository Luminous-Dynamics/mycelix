# Mycelix Pulse conductor configuration for Holochain 0.7.0.
# 0.7 is not compatible with 0.6 databases or DNA hashes: use a fresh data root.
tracing_override: ~
wasm_backend: ~

data_root_path: /var/lib/holochain/mycelix-0.7

keystore:
  type: lair_server
  # Run a Holochain 0.7-compatible Lair instance at this fresh socket.
  connection_url: "unix:///var/lib/holochain/mycelix-0.7/keystore/socket"

admin_interfaces:
  - driver:
      type: websocket
      port: 8888
      danger_bind_addr: ~
      allowed_origins: "*"

network:
  # Verify that these endpoints support the Holochain 0.7 Kitsune2/Iroh transport.
  # The legacy 0.6 signal/WebRTC configuration has been removed.
  bootstrap_url: "https://bootstrap.holo.host"
  relay_url: "https://bootstrap.holo.host/relay"
  base64_auth_material_bootstrap: ~
  base64_auth_material_relay: ~
  request_timeout_s: 60
  target_arc_factor: 1
  report: none
  advanced: ~

# Prefer durable SQLite sync semantics over the old Fast setting.
db_sync_level: Normal
db_max_readers: 16
incoming_request_concurrency_limit: 64
tuning_params: ~
tracing_scope: ~
