---
manifest_version: "0"
name: mycelix_pulse_alpha
description: |
  Restricted Mycelix Pulse working-alpha application.
  Proves profile, hybrid-key, and encrypted-message behavior only.
roles:
  - name: main
    provisioning:
      strategy: create
      deferred: false
    dna:
      path: ./dna-alpha/mycelix_pulse_alpha.dna
      modifiers:
        network_seed: ~
        properties: ~
      clone_limit: 0
