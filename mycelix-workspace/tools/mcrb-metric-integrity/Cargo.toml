[workspace]
resolver = "3"

[package]
name = "mycelix-mcrb-metric-integrity"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Fail-closed metric integrity checks for Mycelix Coordination and Recovery Benchmark"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
# The scalar-only build avoids the optional simd-unsafe implementation in
# this verifier's untrusted envelope parsing path.
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
ed25519-dalek = "=3.0.0"
