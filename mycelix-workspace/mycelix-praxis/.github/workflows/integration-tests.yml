name: Praxis Integration Tests

on:
  push:
    branches: [main]
    paths:
      - 'zomes/**'
      - 'crates/**'
      - 'tests/**'
      - 'dna/**'
      - 'happ/**'
      - '.github/workflows/integration-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'zomes/**'
      - 'crates/**'
      - 'tests/**'
      - 'dna/**'
      - 'happ/**'
      - '.github/workflows/integration-tests.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  integration:
    name: Sweettest Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          # Cache both native and WASM targets
          cache-targets: true
          key: integration-tests

      # Install Holochain CLI tools for DNA/hApp packaging
      - name: Install Holochain tools
        run: |
          cargo install hc --version 0.6.0 --locked

      # Step 1: Build every zome declared by the workspace and DNA manifest.
      - name: Build WASM zomes
        run: cargo build --workspace --target wasm32-unknown-unknown --release

      # Step 2: Package DNA
      - name: Package DNA bundle
        run: |
          cd dna && hc dna pack . -o praxis.dna
          ls -lh praxis.dna

      # Step 3: Package hApp
      - name: Package hApp bundle
        run: |
          hc app pack happ/ -o happ/mycelix-praxis.happ
          ls -lh happ/mycelix-praxis.happ

      # Step 4: Run sweettest integration tests
      # SweetConductor runs an in-process conductor; no Docker needed.
      - name: Run integration tests
        run: |
          cargo test --manifest-path tests/Cargo.toml -- --ignored
        env:
          RUST_LOG: info
          RUST_BACKTRACE: 1
