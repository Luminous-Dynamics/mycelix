[package]
name = "gcpn-e2e-fault-matrix"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Integrated qualification matrix for six-stage and civil evidence fault adapters"

[workspace]

[dependencies]
gcpn-compositional-assurance-adapter = { path = "../gcpn-compositional-assurance-adapter" }
