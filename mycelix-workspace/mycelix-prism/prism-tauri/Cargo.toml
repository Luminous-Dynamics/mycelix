[package]
name = "prism-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Prism — Tauri v2 desktop app (The Local Hub)"

[[bin]]
name = "mycelix-prism"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"

prism-common = { path = "../prism-common" }
prism-dom = { path = "../prism-dom" }
prism-reflex = { path = "../prism-reflex" }
prism-privacy = { path = "../prism-privacy" }
prism-search = { path = "../prism-search" }
prism-ingest = { path = "../prism-ingest" }
prism-net = { path = "../prism-net" }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
ammonia = { workspace = true }
