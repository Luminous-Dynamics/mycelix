[package]
name = "proofs-evidence-authentication"
version = "0.1.0"
edition = "2024"
authors = ["Mycelix Network"]
description = "Canonical qualification receipts and authenticated evidence capability boundary for Mycelix proofs"
license = "AGPL-3.0-or-later"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
