[package]
name = "payments"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Payments coordinator zome — SAP currency, demurrage, escrow, payment channels"

[features]
# Exposes an unsafe raw Receipt create entry point only in the dedicated Sweettest DNA.
# Never enable this feature in production DNA builds.
receipt-test-harness = []

[lib]
crate-type = ["cdylib", "rlib"]
name = "payments"

[dependencies]
mycelix-bridge-common = { workspace = true }
mycelix-zome-helpers = { workspace = true }
holochain_serialized_bytes = { workspace = true }
hdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
finance-wire-types = { path = "../../../crates/finance-wire-types" }
payments_integrity = { path = "../integrity" }
mycelix_finance_shared = { path = "../../shared" }
mycelix_finance_types = { path = "../../../types" }
mycelix-zkp-core = { workspace = true }
