[package]
name = "mycelix-desci-core"
workspace = "../.."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Core components for Mycelix-DeSci: MATL, PoGQ, and epistemic claims"

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
sha2 = { workspace = true }
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
clap = { workspace = true }
mycelix-zkp-core = { workspace = true }
mycelix-desci-types = { path = "../types" }

# Holochain DHT client support (KnowledgeDhtStorage) moved out to the
# sibling mycelix-desci-holochain-bridge crate/workspace 2026-08-05: its
# rusqlite dependency (via holochain_types) declares `links = "sqlite3"`
# and is unconditionally incompatible -- regardless of feature gating, in
# one Cargo.lock -- with sqlx's optional sqlx-sqlite dependency, needed
# here for the Postgres authority backend (sqlx-sqlite needs
# libsqlite3-sys ^0.28, rusqlite 0.37 needs ^0.35). See that crate's
# module doc comment for the full explanation.

# Additional dependencies
reqwest = { version = "0.13", features = ["json"] }
url = "2.5"
toml = "1"
dirs = "6.0"
hex = "0.4"
regex = "1.12"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
proptest = { workspace = true }
tokio-test = "0.4"
tempfile = "3.27"
criterion = { version = "0.8", features = ["html_reports", "async_tokio"] }

[[bench]]
name = "core_benchmarks"
harness = false
