[package]
name = "mycelix-desci-api"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "REST API server for Mycelix-DeSci"

[lib]
name = "mycelix_desci_api"
path = "src/lib.rs"

[[bin]]
name = "mycelix-api"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros", "json"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "compression-full", "timeout", "limit"] }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# OpenAPI documentation
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# Logging and tracing
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }

# Metrics
prometheus = "0.14"
lazy_static = "1.5"

# Rate limiting (per-IP GCRA token bucket via the `governor` crate).
tower_governor = "0.8"
governor = "0.10"

# JWT bearer-token auth middleware for mutating routes
jsonwebtoken = { version = "10", features = ["rust_crypto"] }

# Project dependencies
mycelix-desci-core = { path = "../core", features = ["holochain"] }
mycelix-zkp-core = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
reqwest = { version = "0.13", features = ["json"] }
uuid = { workspace = true }
rand = "0.10"
tower = { version = "0.5", features = ["util"] }
