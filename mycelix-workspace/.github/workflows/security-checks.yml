name: Mycelix Security Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ── ZKP backend policy: STARK-family only (DASTARK), never SNARK ──────────
  #
  # Project convention: consciousness ZKP proofs use STARK-family backends
  # (RISC0, Winterfell, Miden VM) exclusively. arkworks/halo2/groth16/bellman
  # (SNARK-family, trusted-setup-dependent) are banned. This check was manual
  # (a repo-wide grep) as of the 2026-07-02 security review; this job makes
  # it automatic so it can't silently regress.
  zkp-banned-crates:
    name: ZKP backend policy (no SNARK crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for banned SNARK-family dependencies
        run: |
          set -euo pipefail
          BANNED_PATTERN='arkworks|halo2|groth16|bellman'
          # Search Cargo.toml dependency declarations only (not doc comments,
          # not algorithm-name mentions like "Bellman-Ford" in unrelated code).
          HITS=$(grep -rniE "^\s*(ark-[a-z0-9_-]+|halo2[a-z0-9_-]*|groth16|bellman)\s*=" \
            --include='Cargo.toml' . 2>/dev/null | grep -v '/target/' | grep -v '/.cargo/registry/' || true)
          if [ -n "$HITS" ]; then
            echo "::error::Found banned SNARK-family crate dependencies (project policy: STARK-family only, see memory/feedback_dastark_no_snark.md):"
            echo "$HITS"
            exit 1
          fi
          echo "No banned SNARK-family dependencies found."

  # ── routing_registry adoption: cross-cluster dispatch must be gated ───────
  #
  # Bridge coordinators dispatching CallTargetCell::OtherRole should route
  # through crates/mycelix-bridge-common's routing_registry::is_allowed /
  # get_allowed_zomes, not a locally-hardcoded ALLOWED_*_ZOMES allowlist (the
  # exact drift pattern the 2026-07-02 review found in mycelix-governance's
  # cross_cluster.rs). This is an advisory check (warns, doesn't fail the
  # build) since migrating existing dispatch code is its own tracked task —
  # the goal here is visibility into new drift, not blocking unrelated PRs.
  routing-registry-adoption:
    name: routing_registry adoption (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for local allowlist drift
        run: |
          set -uo pipefail
          # Files that dispatch OtherRole but don't reference routing_registry
          # anywhere in the same file are candidates for drift.
          DRIFT=""
          for f in $(grep -rl 'CallTargetCell::OtherRole' --include='*.rs' . 2>/dev/null | grep -v '/target/'); do
            if ! grep -q 'routing_registry' "$f"; then
              DRIFT="${DRIFT}${f}\n"
            fi
          done
          if [ -n "$DRIFT" ]; then
            echo "::warning::Files dispatching CallTargetCell::OtherRole without referencing routing_registry (verify they aren't a hardcoded local allowlist):"
            printf "%b" "$DRIFT"
          else
            echo "All OtherRole dispatch sites reference routing_registry."
          fi

  # ── integrity author-binding: entries must be bound to their committer ──────
  #
  # The #1 finding of the 2026-07-06 comprehensive review: integrity
  # `validate_create_*` / `validate_update_*` callbacks that never reference
  # `action.author()`. Under Holochain's "malicious agent runs a modified
  # coordinator" threat model, a validator that doesn't bind an owned entry to
  # its committing key enforces nothing — enabling vote forgery, DID takeover,
  # and balance self-mint. As of the review only 3 identity zomes bound author
  # at all (648/652 validators unbound workspace-wide).
  #
  # Advisory (like routing-registry-adoption above): not every validator needs
  # binding (pure link-tag / structural validators legitimately don't) and the
  # existing backlog is large, so this REPORTS rather than fails — it must not
  # block unrelated PRs on a pre-existing debt. The hard ratchet (fail if the
  # count GROWS past a frozen baseline) lives in
  # scripts/audit-integrity-provenance.sh (--check); run that locally / add it
  # as a separate required check once the baseline is agreed.
  integrity-author-binding:
    name: integrity author-binding (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report validators missing action.author()
        run: |
          set -uo pipefail
          # Standalone repo root == mycelix-workspace content, so cluster dirs
          # are at the root (mycelix-*/zomes/.../integrity/src/*.rs).
          FILES=$(find . -path '*/integrity/src/*.rs' 2>/dev/null \
            | grep -v '/target/' | grep -v legacy-archive | grep -v _archive || true)
          TOTAL=0; UNBOUND=0; IGNORED=""
          # grep -c already prints a count (0 on no match); do NOT add `|| echo 0`
          # — that double-prints "0\n0" on zero-match files and corrupts the sum.
          for f in $FILES; do
            n=$(grep -cE 'fn validate_(create|update)_[a-z0-9_]+' "$f" 2>/dev/null); n=${n:-0}
            TOTAL=$((TOTAL + n))
            if ! grep -q '\.author(' "$f"; then
              UNBOUND=$((UNBOUND + n))
            fi
            # The blatant subset: action parameter explicitly discarded.
            HITS=$(grep -nE 'fn validate_(create|update)_[a-z0-9_]+\(\s*_action|fn validate_(create|update)_[a-z0-9_]+\(\s*_\s*:' "$f" 2>/dev/null || true)
            if [ -n "$HITS" ]; then
              IGNORED="${IGNORED}${f}:\n${HITS}\n"
            fi
          done
          echo "::warning::${UNBOUND} of ${TOTAL} integrity validators never reference action.author() — review owned-entry validators (see memory/mycelix_comprehensive_review_jul6.md)."
          if [ -n "$IGNORED" ]; then
            echo "::warning::Validators that explicitly ignore the action parameter (_action) — cannot bind provenance. Fix: require e.g. entry.owner_did == format!(\"did:mycelix:{}\", action.author())."
            printf "%b" "$IGNORED"
          fi

  # ── cargo audit gate ───────────────────────────────────────────────────────
  #
  # Required by BETA_PROMOTION_CRITERIA.md's own promotion checklist, but as
  # of the 2026-07-02 review had never actually been run/recorded anywhere.
  # Runs per top-level cluster workspace (each Mycelix cluster is its own
  # independent Cargo workspace, not members of one giant root workspace).
  cargo-audit:
    name: cargo audit (${{ matrix.cluster }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cluster:
          - mycelix-commons
          - mycelix-civic
          - mycelix-hearth
          - mycelix-governance
          - mycelix-identity
          - mycelix-personal
          - mycelix-attribution
          - mycelix-craft
          - mycelix-knowledge
          - mycelix-finance
          - mycelix-climate
          - mycelix-energy
          - mycelix-manufacturing
          - mycelix-supplychain
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        working-directory: ${{ matrix.cluster }}
        run: |
          if [ -f Cargo.lock ]; then
            # Fails on actual vulnerabilities (default cargo-audit behavior);
            # does not fail on "unmaintained crate" warnings, which are
            # common and mostly unavoidable in this dependency tree (see
            # mycelix-space/deny.toml's advisories.ignore list for examples
            # already triaged as no-security-impact transitive deps).
            cargo audit
          else
            echo "No Cargo.lock in ${{ matrix.cluster }}, skipping."
          fi
