[package]
name = "fin-acc-reference-verifier"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Independent Rust reference verifier for the Mycelix accounting evidence smoke corpus"

[dependencies]
hex = "=0.4.3"
jsonschema = { version = "=0.60.2", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "forbid"

# Explicitly isolate this benchmark tool from the enclosing Mycelix Finance workspace.
[workspace]
