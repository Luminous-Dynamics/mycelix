[package]
name = "fin-trust-s1-verifier"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Evidence-purpose-aware Rust conformance verifier for FIN-TRUST v1.1.0"

[dependencies]
hex = "=0.4.3"
jsonschema = { version = "=0.60.2", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
