[package]
name = "mycelix-crypto"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Crypto-agile types for Mycelix Identity (Ed25519, ML-DSA, hybrid, ML-KEM)"

[features]
default = []
# WASM zomes: types + validation only, no crypto operations
wasm = []
# RustCrypto hybrid backend: real hybrid X25519+ML-KEM-768 KEM that builds for
# wasm32 (browser clients), unlike `native` (pqcrypto C-FFI). Off by default.
# EXPERIMENTAL — construction pending crypto audit (see PQC_ROADMAP_2026-07-07.md).
hybrid-rc = [
    "dep:ml-kem",
    "dep:ml-dsa",
    "dep:ed25519-dalek",
    "dep:hkdf",
    "dep:sha2",
    "dep:x25519-dalek",
    "dep:chacha20poly1305",
    "dep:aes-gcm",
    "dep:rand",
    "dep:zeroize",
    "dep:getrandom04",
]
# Native CLI/tests: adds trait impls with real PQC libraries
native = [
    "dep:ed25519-dalek",
    "dep:pqcrypto-dilithium",
    "dep:pqcrypto-sphincsplus",
    "dep:pqcrypto-kyber",
    "dep:chacha20poly1305",
    "dep:rand",
    "dep:pqcrypto-traits",
    "dep:zeroize",
]

[dependencies]
serde = { workspace = true }
bs58 = { workspace = true }
thiserror = { workspace = true }
getrandom = { workspace = true, features = ["custom"] }
# RustCrypto ML-KEM/ML-DSA use getrandom 0.4. Opting into its Web Crypto
# backend is required for wasm32-unknown-unknown and avoids a non-random shim.
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"], optional = true }

# Native-only PQC dependencies
ed25519-dalek = { version = "2", optional = true, features = ["rand_core"] }
# RustCrypto hybrid-rc backend (pure Rust, wasm32-capable)
ml-kem = { version = "=0.3.0-rc.2", default-features = false, features = ["getrandom"], optional = true }
ml-dsa = { version = "=0.1.1", optional = true }
hkdf = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
x25519-dalek = { version = "2", features = ["static_secrets"], optional = true }
pqcrypto-dilithium = { version = "0.5", optional = true }
pqcrypto-sphincsplus = { version = "0.7", optional = true }
pqcrypto-kyber = { version = "0.8", optional = true }
pqcrypto-traits = { version = "0.3", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
aes-gcm = { version = "0.10", optional = true }
rand = { version = "0.8", optional = true }
zeroize = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
proptest = "1"
serde_json = "1"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "pqc_bench"
harness = false
required-features = ["native"]
