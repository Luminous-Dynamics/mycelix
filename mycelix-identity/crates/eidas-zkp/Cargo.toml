[package]
name = "mycelix-eidas-zkp"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Experimental VC-shaped credential and selective-disclosure data structures; no cryptographic conformance claim"
authors = ["Tristan Stoltz <tristan.stoltz@evolvingresonantcocreationism.com>"]
keywords = ["verifiable-credentials", "selective-disclosure", "experimental", "identity"]

[[bin]]
name = "eidas_demo"
path = "src/bin/eidas_demo.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
