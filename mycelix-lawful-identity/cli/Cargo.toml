[package]
name = "lawful-id-cli"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Command-line interface for mycelix-lawful-identity — create legal DIDs, import credentials, generate cross-DID proofs."

[[bin]]
name = "lawful-id"
path = "src/main.rs"

[features]
default = []
# Live conductor integration via holochain_client. Pulls in ~200MB of
# transitive deps (tokio, ws crates, holochain_types). Off by default
# so the CLI stays ~5MB for users who only need the call-sheet path.
conductor = [
    "dep:holochain_client",
    "dep:holochain_types",
    "dep:holochain_conductor_api",
    "dep:tokio",
    "dep:anyhow",
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
directories = "5"
thiserror = "2"
sha2 = "0.10"

# Optional: live conductor round-trip.
# Targets Holochain 0.6.x (shared ecosystem conductor per monorepo
# CLAUDE.md). The old note here was directionally right but overshot by a
# full generation: client 0.7 IS the Holochain 0.5 client (hence the 0.6-era
# `Enabled` app-status deserialization failure), but the fix is client 0.8.1,
# not the 0.9-dev line -- 0.9-dev tracks Holochain 0.7 pre-release, one
# generation PAST our conductor. Client 0.8.1 was cut from the same release
# commit as Holochain 0.6.1. The 2-arg AdminWebsocket::connect this crate
# already uses was introduced in 0.8.0, so src/live.rs compiles unchanged.
holochain_client = { version = "=0.8.1", optional = true }
holochain_types = { version = "=0.6.1", optional = true }
holochain_conductor_api = { version = "=0.6.1", optional = true }
tokio = { version = "1.40", features = ["full"], optional = true }
anyhow = { version = "1", optional = true }
