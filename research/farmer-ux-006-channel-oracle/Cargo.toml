[package]
name = "farmer-channel-oracle"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Reference verifier and adversarial model for farmer cross-channel continuity"

[workspace]

[dependencies]
jsonschema = { version = "=0.59.0", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
