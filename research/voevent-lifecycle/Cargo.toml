[workspace]
members = ["."]
resolver = "2"

[package]
name = "voevent-lifecycle-replay"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Receipt-time-bounded, read-only VOEvent lifecycle graph replay"
license = "AGPL-3.0-or-later"

[lib]
path = "src/lib.rs"

[[bin]]
name = "voevent-lifecycle-replay"
path = "src/bin/voevent-lifecycle-replay.rs"

[[bin]]
name = "voevent-receipt-replay"
path = "src/bin/voevent-receipt-replay.rs"

[dependencies]
mycelix-voevent-header = { path = "../voevent-header" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
hex = "=0.4.3"
