[package]
name = "ingress-receipt-qualifier"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Synthetic reference qualifier for uncertain, witnessed ingress receipt times"
license = "AGPL-3.0-or-later"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ingress-receipt-qualifier"
path = "src/main.rs"
