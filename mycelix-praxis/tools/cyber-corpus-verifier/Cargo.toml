[package]
name = "cyber-corpus-verifier"
version = "0.1.0"
edition = "2024"
publish = false
description = "Fail-closed structural verifier for the public Praxis cyber challenge seed"

# This small CLI is intentionally its own workspace so the parent Holochain
# workspace does not attempt to build it for WASM zomes.
[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
jsonschema = { version = "=0.59.0", default-features = false }
