[package]
name = "mycelix-forge-gittuf-bundle"
version = "0.1.0"
edition = "2021"
authors = ["Luminous Dynamics"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/mycelix"
description = "Self-contained Git repository closure and replay for Mycelix Forge"

[dependencies]
mycelix-forge-core = { path = "../../crates/mycelix-forge-core" }
mycelix-forge-repository = { path = "../../crates/mycelix-forge-repository" }
mycelix-forge-gittuf-adapter = { path = "../forge-gittuf" }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
thiserror = "2.0"

[dev-dependencies]
serde_json = "1.0"
tempfile = "3.13"
