[package]
name = "mycelix-forge-hermetic-guest"
version = "0.1.0"
edition = "2021"
authors = ["Luminous Dynamics"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/mycelix"
description = "Concrete hermetic guest executor for Mycelix Forge M0"

[dependencies]
mycelix-forge-core = { path = "../../crates/mycelix-forge-core" }
mycelix-forge-gittuf-adapter = { path = "../forge-gittuf" }
mycelix-forge-gittuf-bundle = { path = "../forge-gittuf-bundle" }
mycelix-forge-gittuf-policy-inventory = { path = "../forge-gittuf-policy-inventory" }
mycelix-forge-gittuf-trust-profile = { path = "../forge-gittuf-trust-profile" }
mycelix-forge-guest-envelope = { path = "../forge-guest-envelope" }
mycelix-forge-guest-plan = { path = "../forge-guest-plan" }
mycelix-forge-guest-tool-map = { path = "../forge-guest-tool-map" }
mycelix-forge-guest-transcript = { path = "../forge-guest-transcript" }
mycelix-forge-linux-isolation = { path = "../forge-linux-isolation" }
mycelix-forge-linux-isolation-collector = { path = "../forge-linux-isolation-collector" }
mycelix-forge-linux-isolation-evidence = { path = "../forge-linux-isolation-evidence" }
mycelix-forge-repository = { path = "../../crates/mycelix-forge-repository" }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
