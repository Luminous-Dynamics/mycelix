[package]
name = "mycelix-forge-sealed-inputs"
version = "0.1.0"
edition = "2021"
authors = ["Luminous Dynamics"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/mycelix"
description = "Sealed memfd input transport for Mycelix Forge hermetic verification"

[dependencies]
