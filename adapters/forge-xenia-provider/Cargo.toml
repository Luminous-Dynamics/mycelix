[package]
name = "mycelix-forge-xenia-provider"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
authors = ["Luminous Dynamics"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/mycelix"
description = "Provider-signature verification for Xenia Forge authentication evidence"
publish = false

[dependencies]
ed25519-dalek = "2"
ml-dsa = { version = "0.1.1", default-features = true }
mycelix-forge-authentication = { path = "../../crates/mycelix-forge-authentication" }
mycelix-forge-core = { path = "../../crates/mycelix-forge-core" }
mycelix-forge-xenia = { path = "../forge-xenia" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[dev-dependencies]
mycelix-forge-authority = { path = "../../crates/mycelix-forge-authority" }
serde_json = "1.0"

# Standalone cross-provider qualification boundary. Review/quorum integration
# is deliberately a later join tranche.
[workspace]
