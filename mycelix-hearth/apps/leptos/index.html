<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a08" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Hearth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link data-trunk rel="css" href="style/main.css" />
    <link data-trunk rel="css" href="style/runtime-status.css" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕯</text></svg>" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Static assets copied into dist/ by Trunk -->
    <link data-trunk rel="copy-file" href="static/manifest.json" />
    <link data-trunk rel="copy-file" href="static/sw.js" />
    <link data-trunk rel="copy-file" href="static/icon.svg" />
</head>
<body>
    <!-- Service Worker registration (PWA offline support) -->
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').then(function() {
            console.log('[Hearth] Service Worker registered');
        }).catch(function(err) {
            console.log('[Hearth] SW registration failed:', err);
        });
    }
    </script>

    <!--
      Runtime provenance is owned by Rust. Live is the default and uses the
      authenticated HolochainProviderAuto transport with WebSocketRequired.
      A host can deliberately select Demo with:
          window.__MYCELIX_HEARTH_MODE = 'demo'
      before WASM starts, or a browser user can open `?mode=demo`.

      Do not add a raw WebSocket "probe" that rewrites failed Live sessions to
      mock: the provider already owns authenticated transport state.
    -->
</body>
</html>
