[workspace]
resolver = "2"
members = [
    # Shared crates
    "crates/hearth-types",
    "crates/hearth-automation-types",
    "crates/hearth-automation-policy",
    "crates/hearth-automation-replay",
    "crates/hearth-household-planner",
    "crates/hearth-planner-evidence",
    "crates/hearth-work-proposal",
    "crates/hearth-assignment-transition",
    "crates/hearth-assignment-endorsement",
    "crates/hearth-care-ledger",
    "crates/hearth-care-recurrence",
    "crates/hearth-care-timezone-jiff",
    "crates/hearth-care-recurrence-enumerator",
    "crates/hearth-care-recurrence-composer",
    "crates/hearth-care-recurrence-state",
    "crates/hearth-care-occurrence-admission",
    "crates/hearth-care-occurrence-time-evidence",
    "crates/hearth-care-occurrence-authority",
    "crates/hearth-care-completion-authority",
    "edge/hearth-edge",
    "edge/hearth-edge-journal",
    "crates/hearth-coordinator-common",

    # Kinship (core membership + relationships)
    "zomes/hearth-kinship/integrity",
    "zomes/hearth-kinship/coordinator",

    # Gratitude
    "zomes/hearth-gratitude/integrity",
    "zomes/hearth-gratitude/coordinator",

    # Stories
    "zomes/hearth-stories/integrity",
    "zomes/hearth-stories/coordinator",

    # Care (legacy schedule/templates + compatibility)
    "zomes/hearth-care/integrity",
    "zomes/hearth-care/coordinator",

    # Care ledger (append-only occurrences/completions)
    "zomes/hearth-care-ledger/integrity",
    "zomes/hearth-care-ledger/coordinator",

    # Automation (durable proposals/consent evidence)
    "zomes/hearth-automation/integrity",
    "zomes/hearth-automation/coordinator",

    # Autonomy
    "zomes/hearth-autonomy/integrity",
    "zomes/hearth-autonomy/coordinator",

    # Emergency
    "zomes/hearth-emergency/integrity",
    "zomes/hearth-emergency/coordinator",

    # Decisions
    "zomes/hearth-decisions/integrity",
    "zomes/hearth-decisions/coordinator",

    # Resources
    "zomes/hearth-resources/integrity",
    "zomes/hearth-resources/coordinator",

    # Milestones
    "zomes/hearth-milestones/integrity",
    "zomes/hearth-milestones/coordinator",

    # Rhythms
    "zomes/hearth-rhythms/integrity",
    "zomes/hearth-rhythms/coordinator",

    # Unified bridge
    "zomes/hearth-bridge/integrity",
    "zomes/hearth-bridge/coordinator",
]
exclude = ["tests", "tools/hearth-evidence-verifier"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
# Holochain 0.6 compatible
hdk = "0.6.0"
hdi = "0.7.0"
holochain_integrity_types = "0.6.0"
holochain_serialized_bytes = "0.0.57"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
thiserror = "1.0"
derive_more = "0.99"

# WASM compatibility
getrandom = { version = "0.2", features = ["custom"] }
getrandom_03 = { package = "getrandom", version = "0.3" }

# Internal shared crates
hearth-types = { path = "crates/hearth-types" }
hearth-automation-types = { path = "crates/hearth-automation-types" }
hearth-automation-policy = { path = "crates/hearth-automation-policy" }
hearth-household-planner = { path = "crates/hearth-household-planner" }
hearth-planner-evidence = { path = "crates/hearth-planner-evidence" }
hearth-work-proposal = { path = "crates/hearth-work-proposal" }
hearth-assignment-transition = { path = "crates/hearth-assignment-transition" }
hearth-assignment-endorsement = { path = "crates/hearth-assignment-endorsement" }
hearth-care-ledger-contract = { path = "crates/hearth-care-ledger" }
hearth-care-recurrence = { path = "crates/hearth-care-recurrence" }
hearth-care-timezone-jiff = { path = "crates/hearth-care-timezone-jiff" }
hearth-care-recurrence-enumerator = { path = "crates/hearth-care-recurrence-enumerator" }
hearth-care-recurrence-composer = { path = "crates/hearth-care-recurrence-composer" }
hearth-care-recurrence-state = { path = "crates/hearth-care-recurrence-state" }
hearth-care-occurrence-admission = { path = "crates/hearth-care-occurrence-admission" }
hearth-care-occurrence-time-evidence = { path = "crates/hearth-care-occurrence-time-evidence" }
hearth-care-occurrence-authority = { path = "crates/hearth-care-occurrence-authority" }
hearth-care-completion-authority = { path = "crates/hearth-care-completion-authority" }
hearth-coordinator-common = { path = "crates/hearth-coordinator-common" }
mycelix-bridge-common = { path = "../crates/mycelix-bridge-common" }
mycelix-bridge-entry-types = { path = "../crates/mycelix-bridge-entry-types" }
mycelix-zkp-core = { path = "../crates/mycelix-zkp-core" }
mycelix-zome-helpers = { path = "../crates/mycelix-zome-helpers" }

[profile.dev]
opt-level = "z"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false