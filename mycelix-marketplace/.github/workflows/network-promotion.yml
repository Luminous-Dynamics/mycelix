name: Marketplace isolated multi-conductor promotion

on:
  workflow_dispatch:
    inputs:
      network_services_path:
        description: Absolute executable local bootstrap/signaling service hook
        required: true
        type: string
      network_control_path:
        description: Absolute executable partition/heal control hook
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote-network:
    runs-on: [self-hosted, mycelix-conductor, mycelix-network-control, nix]
    timeout-minutes: 90
    env:
      HOLOCHAIN_BIN: ${{ vars.HOLOCHAIN_BIN }}
      HC_BIN: ${{ vars.HC_BIN }}
      MARKETPLACE_NETWORK_SERVICES: ${{ inputs.network_services_path }}
      MARKETPLACE_NETWORK_CONTROL: ${{ inputs.network_control_path }}
      RUSTUP_HOME: ${{ runner.temp }}/mycelix-rustup
      CARGO_HOME: ${{ runner.temp }}/mycelix-cargo
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare ephemeral release signing key
        shell: bash
        env:
          RELEASE_SIGNING_KEY_BASE64: ${{ secrets.MARKETPLACE_RELEASE_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$RELEASE_SIGNING_KEY_BASE64"
          printf '%s' "$RELEASE_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/marketplace-release-key.pem"
          openssl pkey -in "$RUNNER_TEMP/marketplace-release-key.pem" -noout

      - name: Install pinned Rust toolchain
        run: |
          nix develop .#promotion --command bash -euo pipefail -c '
            rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
            rustup override set 1.94.0
          '

      - name: Verify conflict and network contracts
        run: |
          python3 scripts/check-transaction-conflict-policy.py
          python3 scripts/check-transaction-conflict-resolution.py
          python3 scripts/check-network-promotion.py
          python3 scripts/test-network-evidence-verifier.py

      - name: Build exact network-profile artifacts
        run: |
          nix develop .#promotion --command scripts/check-promotion-environment.sh
          nix develop .#promotion --command scripts/build-promotion-artifacts.sh \
            network "$RUNNER_TEMP/marketplace-network-promotion"

      - name: Run controlled partition and healing evidence
        run: |
          nix develop .#promotion --command scripts/run-network-promotion.sh \
            "$RUNNER_TEMP/marketplace-network-promotion"

      - name: Seal and independently verify network evidence
        env:
          MARKETPLACE_RELEASE_SIGNING_KEY: ${{ runner.temp }}/marketplace-release-key.pem
        run: |
          nix develop .#promotion --command scripts/seal-promotion-bundle.sh \
            network "$RUNNER_TEMP/marketplace-network-promotion" \
            "$RUNNER_TEMP/mycelix-marketplace-network-${{ github.sha }}.tar.gz"
          nix develop .#promotion --command scripts/verify-promotion-bundle.sh \
            "$RUNNER_TEMP/mycelix-marketplace-network-${{ github.sha }}.tar.gz"

      - name: Remove private release material
        if: always()
        run: shred -u "$RUNNER_TEMP/marketplace-release-key.pem" 2>/dev/null || rm -f "$RUNNER_TEMP/marketplace-release-key.pem"

      - uses: actions/upload-artifact@v4
        with:
          name: mycelix-marketplace-network-${{ github.sha }}
          path: ${{ runner.temp }}/mycelix-marketplace-network-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 90
