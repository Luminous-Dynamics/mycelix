---
# Mycelix Marketplace base hApp Bundle
# Not settlement-capable: render a deployment profile with scripts/render-marketplace-deployment.py
# Research-grade P2P commerce with explicit evidence and integrity boundaries

manifest_version: "0"
name: mycelix_marketplace
roles:
  - name: marketplace
    provisioning:
      strategy: create
      deferred: false
    dnas:
      - name: mycelix_marketplace
        clone_limit: 0
        version: null
        source:
          path: ./mycelix_marketplace.dna
        modifiers: null
        installed_event_handler: null
