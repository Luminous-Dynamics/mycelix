---
manifest_version: "0"
name: mycelix_governance_dna

integrity:
  network_seed: "mycelix-governance-v1"
  # SECURITY: binding constitutional authority is intentionally unprovisioned in
  # source control. A deployment must replace this null with an exact
  # ConstitutionGenesisManifest before packing/installing the governance DNA.
  # DNA properties are integrity modifiers, so that manifest becomes part of the
  # resulting network identity. constitution_authority rejects genesis while null.
  properties:
    governance_constitution: null
  zomes:
    - name: proposals_integrity
      path: "../target/wasm32-unknown-unknown/release/proposals_integrity.wasm"

    - name: proposal_authority_integrity
      path: "../target/wasm32-unknown-unknown/release/proposal_authority_integrity.wasm"

    - name: proposal_constitution_epoch_integrity
      path: "../target/wasm32-unknown-unknown/release/proposal_constitution_epoch_integrity.wasm"

    - name: voting_integrity
      path: "../target/wasm32-unknown-unknown/release/voting_integrity.wasm"

    - name: binding_voting_integrity
      path: "../target/wasm32-unknown-unknown/release/binding_voting_integrity.wasm"

    - name: execution_integrity
      path: "../target/wasm32-unknown-unknown/release/execution_integrity.wasm"

    # SECURITY: the legacy mutable constitution_integrity/constitution pair is
    # intentionally not packaged in the binding governance DNA. Its source stays
    # in the workspace for migration/history, but cannot form a second authority
    # plane beside constitution_authority/constitution_transition.
    - name: constitution_authority_integrity
      path: "../target/wasm32-unknown-unknown/release/constitution_authority_integrity.wasm"

    - name: constitution_transition_integrity
      path: "../target/wasm32-unknown-unknown/release/constitution_transition_integrity.wasm"

    - name: governance_bridge_integrity
      path: "../target/wasm32-unknown-unknown/release/governance_bridge_integrity.wasm"

    - name: threshold_signing_integrity
      path: "../target/wasm32-unknown-unknown/release/threshold_signing_integrity.wasm"

    - name: councils_integrity
      path: "../target/wasm32-unknown-unknown/release/councils_integrity.wasm"

    - name: jurisdiction_integrity
      path: "../target/wasm32-unknown-unknown/release/jurisdiction_integrity.wasm"

    - name: budgeting_integrity
      path: "../target/wasm32-unknown-unknown/release/budgeting_integrity.wasm"

coordinator:
  zomes:
    - name: proposals
      path: "../target/wasm32-unknown-unknown/release/proposals.wasm"
      dependencies:
        - name: proposals_integrity

    - name: proposal_authority
      path: "../target/wasm32-unknown-unknown/release/proposal_authority.wasm"
      dependencies:
        - name: proposal_authority_integrity
        - name: proposals_integrity

    - name: proposal_constitution_epoch
      path: "../target/wasm32-unknown-unknown/release/proposal_constitution_epoch.wasm"
      dependencies:
        - name: proposal_constitution_epoch_integrity

    - name: voting
      path: "../target/wasm32-unknown-unknown/release/voting.wasm"
      dependencies:
        - name: voting_integrity
        - name: proposals_integrity

    - name: binding_voting
      path: "../target/wasm32-unknown-unknown/release/binding_voting.wasm"
      dependencies:
        - name: binding_voting_integrity

    - name: execution
      path: "../target/wasm32-unknown-unknown/release/execution.wasm"
      dependencies:
        - name: execution_integrity
        - name: proposals_integrity

    - name: governance_execution_preflight
      path: "../target/wasm32-unknown-unknown/release/governance_execution_preflight.wasm"
      dependencies:
        - name: execution_integrity

    - name: constitution_authority
      path: "../target/wasm32-unknown-unknown/release/constitution_authority.wasm"
      dependencies:
        - name: constitution_authority_integrity

    - name: constitution_transition
      path: "../target/wasm32-unknown-unknown/release/constitution_transition.wasm"
      dependencies:
        - name: constitution_transition_integrity

    - name: governance_bridge
      path: "../target/wasm32-unknown-unknown/release/governance_bridge.wasm"
      dependencies:
        - name: governance_bridge_integrity
        - name: proposals_integrity
        - name: voting_integrity

    - name: threshold_signing
      path: "../target/wasm32-unknown-unknown/release/threshold_signing_coordinator.wasm"
      dependencies:
        - name: threshold_signing_integrity
        - name: voting_integrity

    - name: councils
      path: "../target/wasm32-unknown-unknown/release/councils.wasm"
      dependencies:
        - name: councils_integrity
        - name: proposals_integrity

    - name: jurisdiction
      path: "../target/wasm32-unknown-unknown/release/jurisdiction.wasm"
      dependencies:
        - name: jurisdiction_integrity

    - name: budgeting
      path: "../target/wasm32-unknown-unknown/release/budgeting.wasm"
      dependencies:
        - name: budgeting_integrity
        - name: governance_bridge_integrity
