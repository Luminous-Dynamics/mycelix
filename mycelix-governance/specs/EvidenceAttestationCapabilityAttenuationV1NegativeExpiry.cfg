CONSTANTS
Root = Root
Alice = Alice
R1 = R1
R2 = R2
Read = Read
Write = Write
AudienceA = AudienceA
AudienceB = AudienceB
T1 = T1
T2 = T2
G1 = G1
G2 = G2
E1 = E1
SignatureValid = [E1 |-> TRUE]
SignerTrusted = [E1 |-> TRUE]
ClaimAuthorized = [E1 |-> TRUE]
EvidenceSubject = [E1 |-> Alice]
TargetSubject = [E1 |-> Alice]
ClaimResources = [E1 |-> {R1, R2}]
ClaimActions = [E1 |-> {Read, Write}]
ClaimAudiences = [E1 |-> {AudienceA, AudienceB}]
ClaimExpiry = [E1 |-> T1]
GrantResource = [G1 |-> R1, G2 |-> R2]
GrantAction = [G1 |-> Read, G2 |-> Read]
GrantAudience = [G1 |-> AudienceA, G2 |-> AudienceA]
GrantExpiry = [G1 |-> T1, G2 |-> T2]
Control = "expiry-expansion"

INIT Init
NEXT NegativeNext
INVARIANTS
TypeOK
AuthorityMatchesCurrentGrants
GrantCapabilitiesWithinIssuerAuthority
NoAuthorityWithoutCurrentGrant
ResourceScopeAttenuated
ActionScopeAttenuated
AudienceScopeAttenuated
ExpiryScopeAttenuated
CHECK_DEADLOCK FALSE
