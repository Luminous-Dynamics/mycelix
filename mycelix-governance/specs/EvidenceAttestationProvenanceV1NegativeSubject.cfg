CONSTANTS
Root = Root
Alice = Alice
Bob = Bob
P1 = P1
P2 = P2
G1 = G1
G2 = G2
G3 = G3
E1 = E1
SignatureValid = [E1 |-> TRUE]
GrantPower = [G1 |-> P1, G2 |-> P2, G3 |-> P2]
SignerTrusted = [E1 |-> TRUE]
EvidenceSubject = [E1 |-> Bob]
TargetSubject = [E1 |-> Alice]
Control = "subject-mismatch"

INIT Init
NEXT NegativeNext
INVARIANTS
TypeOK
AuthorityMatchesCurrentGrants
GrantCannotExceedIssuerAuthority
NoAuthorityWithoutCurrentGrant
UntrustedAttestationCannotChangeAuthority
SubjectMismatchCannotChangeAuthority
CHECK_DEADLOCK FALSE
