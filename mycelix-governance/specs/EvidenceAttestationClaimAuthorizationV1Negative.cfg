CONSTANTS
Root = Root
Alice = Alice
P1 = P1
P2 = P2
G1 = G1
G2 = G2
E1 = E1
ClaimA = ClaimA
ClaimB = ClaimB
SignatureValid = [E1 |-> TRUE]
SignerTrusted = [E1 |-> TRUE]
ClaimAuthorized = [E1 |-> FALSE]
EvidenceSubject = [E1 |-> Alice]
TargetSubject = [E1 |-> Alice]
ClaimType = [E1 |-> ClaimA]
GrantPower = [G1 |-> P1, G2 |-> P2]
Control = "unauthorized-claim"

INIT Init
NEXT NegativeNext
INVARIANTS
TypeOK
AuthorityMatchesCurrentGrants
GrantCannotExceedIssuerAuthority
NoAuthorityWithoutCurrentGrant
UnauthorizedClaimCannotChangeAuthority
CHECK_DEADLOCK FALSE
