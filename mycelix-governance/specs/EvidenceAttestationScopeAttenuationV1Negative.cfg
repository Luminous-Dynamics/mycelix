CONSTANTS
Root = Root
Alice = Alice
S1 = S1
S2 = S2
G1 = G1
G2 = G2
E1 = E1
SignatureValid = [E1 |-> TRUE]
SignerTrusted = [E1 |-> TRUE]
ClaimAuthorized = [E1 |-> TRUE]
EvidenceSubject = [E1 |-> Alice]
TargetSubject = [E1 |-> Alice]
ClaimScope = [E1 |-> {S1, S2}]
GrantScope = [G1 |-> {S1}, G2 |-> {S2}]
ClaimScope = [E1 |-> {S1}]
GrantScope = [G1 |-> {S1}, G2 |-> {S1, S2}]
Control = "scope-expansion"

INIT Init
NEXT NegativeNext
INVARIANTS
TypeOK
AuthorityMatchesCurrentGrants
GrantScopeWithinIssuerAuthority
NoAuthorityWithoutCurrentGrant
ClaimAuthorizationScopeAttenuated
CHECK_DEADLOCK FALSE
