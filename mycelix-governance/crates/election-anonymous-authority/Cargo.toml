[package]
name = "election-anonymous-authority"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Backend-neutral anonymous eligibility and single-use authority contracts for Mycelix public elections"

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
election-integrity-types = { path = "../election-integrity-types" }

