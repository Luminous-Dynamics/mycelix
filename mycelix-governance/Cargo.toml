[workspace]
resolver = "2"
members = [
    "zomes/proposals/integrity",
    "zomes/proposals/coordinator",
    "zomes/proposal-authority/integrity",
    "zomes/proposal-authority/coordinator",
    "zomes/proposal-constitution-epoch/integrity",
    "zomes/proposal-constitution-epoch/coordinator",
    "zomes/voting/integrity",
    "zomes/voting/coordinator",
    "zomes/binding-voting/integrity",
    "zomes/binding-voting/coordinator",
    "zomes/execution/integrity",
    "zomes/execution/coordinator",
    "zomes/execution-preflight/coordinator",
    "zomes/execution-lifecycle/integrity",
    "zomes/execution-lifecycle/coordinator",
    "zomes/execution-lifecycle-verifier/coordinator",
    "zomes/execution-plan-verifier/coordinator",
    "zomes/authority-state-challenge/integrity",
    "zomes/authority-state-challenge/coordinator",
    "zomes/authority-current-freshness-verifier/coordinator",
    "zomes/authority-state-source-head-verifier/coordinator",
    "zomes/authority-state-witness-verifier/coordinator",
    "zomes/authority-operational-policy-provider/coordinator",
    "zomes/authority-operational-policy-leased-provider/coordinator",
    "zomes/constitution/integrity",
    "zomes/constitution/coordinator",
    "zomes/constitution-authority/integrity",
    "zomes/constitution-authority/coordinator",
    "zomes/constitution-transition/integrity",
    "zomes/constitution-transition/coordinator",
    "zomes/constitution-currentness-verifier/coordinator",
    "zomes/bridge/integrity",
    "zomes/bridge/coordinator",
    "zomes/threshold-signing/integrity",
    "zomes/threshold-signing/coordinator",
    "zomes/councils/integrity",
    "zomes/councils/coordinator",
    "zomes/jurisdiction/integrity",
    "zomes/jurisdiction/coordinator",
    "zomes/budgeting/integrity",
    "zomes/budgeting/coordinator",
    "crates/governance-utils",
]
exclude = ["tests"]

[workspace.package]
license = "AGPL-3.0-or-later"

[workspace.dependencies]
hdk = "=0.6.1"
hdi = "=0.7.1"
holochain_integrity_types = "=0.6.1"
holochain_zome_types = "=0.6.1"
holo_hash = "=0.6.1"
hdk_derive = "=0.6.1"
holochain_serialized_bytes = "=0.0.57"
mycelix-core-types = { path = "../crates/mycelix-core-types", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mycelix-bridge-common = { path = "../crates/mycelix-bridge-common" }
mycelix-bridge-proc = { path = "../crates/mycelix-bridge-proc" }
mycelix-bridge-entry-types = { path = "../crates/mycelix-bridge-entry-types" }
thiserror = "2.0"
getrandom = { version = "0.2", features = ["custom"] }
getrandom_03 = { package = "getrandom", version = "0.3" }
mycelix-zome-helpers = { path = "../crates/mycelix-zome-helpers" }
feldman-dkg = { path = "../crates/feldman-dkg", features = ["ml-kem-768", "ml-dsa-65"] }
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa"] }
governance-utils = { path = "crates/governance-utils" }
mycelix-zkp-core = { path = "../crates/mycelix-zkp-core" }

[profile.dev]
opt-level = "z"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
