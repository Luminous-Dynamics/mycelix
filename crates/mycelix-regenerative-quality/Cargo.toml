[package]
name = "mycelix-regenerative-quality"
version = "0.1.0"
edition = "2024"
description = "Adopted quality-profile references and structural validation for Mycelix regenerative systems"
license = "AGPL-3.0-or-later"
authors = ["Luminous Dynamics <contact@luminousdynamics.org>"]
repository = "https://github.com/Luminous-Dynamics/mycelix"

[features]
default = []
serde = ["dep:serde", "mycelix-regenerative-core/serde"]

[dependencies]
mycelix-regenerative-core = { path = "../mycelix-regenerative-core", default-features = false }
serde = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1.0"
