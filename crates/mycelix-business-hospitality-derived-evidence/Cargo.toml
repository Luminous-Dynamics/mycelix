[package]
name = "mycelix-business-hospitality-derived-evidence"
version = "0.1.0"
edition = "2024"
description = "Protocol-bound derived slice evidence for read-only Mycelix hospitality pilots"
license = "AGPL-3.0-or-later"
authors = ["Luminous Dynamics <contact@luminousdynamics.org>"]
repository = "https://github.com/luminous-dynamics/mycelix"
readme = "README.md"

[lib]
name = "mycelix_business_hospitality_derived_evidence"
crate-type = ["rlib"]

[dependencies]
sha2 = "0.10"
mycelix-business-core = { path = "../mycelix-business-core" }
mycelix-business-shadow = { path = "../mycelix-business-shadow" }
mycelix-business-field-qualification = { path = "../mycelix-business-field-qualification" }
mycelix-business-pilot-hospitality = { path = "../mycelix-business-pilot-hospitality" }
mycelix-business-import-diagnostics = { path = "../mycelix-business-import-diagnostics" }

[dev-dependencies]
mycelix-business-adapter-delimited = { path = "../mycelix-business-adapter-delimited" }
mycelix-business-ingress = { path = "../mycelix-business-ingress" }
