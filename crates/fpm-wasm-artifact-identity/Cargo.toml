[package]
name = "fpm-wasm-artifact-identity"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "Versioned cross-binding between SHA-256 artifact identity and Holochain 0.7 WasmHash"

[workspace]

[dependencies]
holo_hash = { version = "=0.7.0", default-features = false, features = ["hashing"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
holochain_types = "=0.7.0"
serde_json = "=1.0.150"
