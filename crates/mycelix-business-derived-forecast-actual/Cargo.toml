[package]
name = "mycelix-business-derived-forecast-actual"
version = "0.1.0"
edition = "2024"
description = "Deterministic transaction-to-evaluation actual projection for Mycelix Business forecasts"
license = "AGPL-3.0-or-later"
authors = ["Luminous Dynamics <contact@luminousdynamics.org>"]
repository = "https://github.com/luminous-dynamics/mycelix"
readme = "README.md"

[lib]
name = "mycelix_business_derived_forecast_actual"
crate-type = ["rlib"]

[dependencies]
sha2 = "0.10"
mycelix-business-core = { path = "../mycelix-business-core" }
mycelix-business-shadow = { path = "../mycelix-business-shadow" }
mycelix-business-forecast-plan = { path = "../mycelix-business-forecast-plan" }
mycelix-business-campaign-replay = { path = "../mycelix-business-campaign-replay" }

[dev-dependencies]
mycelix-business-ingress = { path = "../mycelix-business-ingress" }
