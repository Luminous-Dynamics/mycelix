edition = "2024"
license = "AGPL-3.0-or-later"
description = "Pure current-policy and issuer composition for Mycelix authority-state challenge context"

[dependencies]
serde = { version = "1", features = ["derive"] }
blake3 = "1"
mycelix-authority-freshness = { path = "../mycelix-authority-freshness" }
