[package]
name = "mycelix-material-flow-accounting"
version = "0.1.0"
edition = "2024"
description = "Exact material-flow conservation and anti-double-counting kernel for Mycelix Circularity"
license = "AGPL-3.0-or-later"
authors = ["Luminous Dynamics <contact@luminousdynamics.org>"]
repository = "https://github.com/Luminous-Dynamics/mycelix"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
blake3 = "1"
mycelix-economic-reality-graph = { path = "../mycelix-economic-reality-graph" }
mycelix-circularity = { path = "../mycelix-circularity" }

[dev-dependencies]
serde_json = "1"
