[package]
name = "mycelix-legacy-governance-v1"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Explicit LegacyV1 governance compatibility facade for Mycelix"
publish = false

# Keep this compatibility crate outside any ancestor workspace so the root and
# mirrored bridge-common trees can be qualified independently.
[workspace]

[features]
default = ["hdk"]
hdk = ["dep:hdk", "mycelix-bridge-common/hdk"]

[dependencies]
hdk = { version = "0.6.0", optional = true }
mycelix-bridge-common = { path = "..", default-features = false }
