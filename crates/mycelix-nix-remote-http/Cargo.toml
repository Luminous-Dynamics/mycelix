[package]
name = "mycelix-nix-remote-http"
version = "0.1.0"
edition = "2024"
description = "Serving-snapshot-bound remote HTTP router for Mycelix Content Fabric Nix cache"
license = "AGPL-3.0-or-later"
authors = ["Luminous Dynamics <contact@luminousdynamics.org>"]
repository = "https://github.com/Luminous-Dynamics/mycelix"
readme = "README.md"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
mycelix-content-node = { path = "../mycelix-content-node" }
mycelix-nix-cache = { path = "../mycelix-nix-cache" }
mycelix-nix-exposure = { path = "../mycelix-nix-exposure" }
tokio = { version = "1.53", features = ["fs", "io-util", "rt-multi-thread", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
thiserror = "2"

[dev-dependencies]
http-body-util = "0.1"
mycelix-content-core = { path = "../mycelix-content-core" }
mycelix-infrastructure-types = { path = "../mycelix-infrastructure-types" }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
