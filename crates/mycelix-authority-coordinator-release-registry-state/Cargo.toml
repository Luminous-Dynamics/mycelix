[package]
name = "mycelix-authority-coordinator-release-registry-state"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-or-later"
description = "Crash-durable latest complete coordinator release-registry state for Mycelix"

[dependencies]
blake3 = "1"
ed25519-dalek = "=2.2.0"
libc = "0.2"
ml-dsa = "=0.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mycelix-authority-coordinator-release = { path = "../mycelix-authority-coordinator-release" }
mycelix-authority-coordinator-release-currentness = { path = "../mycelix-authority-coordinator-release-currentness" }
mycelix-authority-coordinator-release-registry = { path = "../mycelix-authority-coordinator-release-registry" }

[dev-dependencies]
mycelix-authority-coordinator-deployment = { path = "../mycelix-authority-coordinator-deployment" }
