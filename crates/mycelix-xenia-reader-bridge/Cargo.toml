[package]
name = "mycelix-xenia-reader-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Xenia authenticated-peer to Mycelix Content Fabric reader enrollment bridge"
license = "AGPL-3.0-or-later"
authors = ["Luminous Dynamics <contact@luminousdynamics.org>"]
repository = "https://github.com/Luminous-Dynamics/mycelix"
readme = "README.md"

[dependencies]
mycelix-content-core = { path = "../mycelix-content-core" }
mycelix-content-node = { path = "../mycelix-content-node" }
mycelix-infrastructure-types = { path = "../mycelix-infrastructure-types" }
mycelix-nix-cache = { path = "../mycelix-nix-cache" }
mycelix-nix-exposure = { path = "../mycelix-nix-exposure" }
mycelix-reader-enrollment = { path = "../mycelix-reader-enrollment" }
thiserror = "2"
tokio = { version = "1.53", features = ["rt", "sync", "time"] }
xenia-peer-core = { git = "https://github.com/Luminous-Dynamics/xenia-peer", rev = "68cce019d472e00570b488599c97c62144aa30a0" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53", features = ["macros", "rt", "sync", "time", "test-util"] }
