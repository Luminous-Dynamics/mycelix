[package]
name = "mycelix-business-import-quality-evidence"
version = "0.1.0"
edition = "2024"
description = "Derived read-only data-quality evidence for Mycelix Business imports"
license = "AGPL-3.0-or-later"
authors = ["Luminous Dynamics <contact@luminousdynamics.org>"]
repository = "https://github.com/luminous-dynamics/mycelix"
readme = "README.md"

[lib]
name = "mycelix_business_import_quality_evidence"
crate-type = ["rlib"]

[dependencies]
