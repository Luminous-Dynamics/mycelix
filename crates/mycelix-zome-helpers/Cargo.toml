[package]
name = "mycelix-zome-helpers"
version = "0.1.0"
edition = "2024"
description = "Shared helper functions for Mycelix zome coordinators (anchor hashing, link resolution, consciousness gating)"
license = "AGPL-3.0-or-later"

[dependencies]
# Holochain 0.7 compatibility for Hearth's isolated workspace.
hdk = "=0.7.0"
holo_hash = "=0.7.0"
serde = { version = "1.0", features = ["derive"] }
getrandom = { version = "0.2", features = ["custom"] }
mycelix-bridge-common = { path = "../mycelix-bridge-common" }

[dev-dependencies]
