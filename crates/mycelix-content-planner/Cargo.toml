[package]
name = "mycelix-content-planner"
version = "0.1.0"
edition = "2024"
description = "Deterministic authority-free placement proposal engine for Mycelix Content Fabric"
license = "AGPL-3.0-or-later"
authors = ["Luminous Dynamics <contact@luminousdynamics.org>"]
repository = "https://github.com/Luminous-Dynamics/mycelix"
readme = "README.md"

[dependencies]
blake3 = "1"
serde = { version = "1", features = ["derive"] }
mycelix-content-core = { path = "../mycelix-content-core" }
mycelix-content-policy = { path = "../mycelix-content-policy" }
mycelix-content-state = { path = "../mycelix-content-state" }

[dev-dependencies]
proptest = "1"
mycelix-infrastructure-types = { path = "../mycelix-infrastructure-types" }
