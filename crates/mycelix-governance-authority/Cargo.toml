[package]
name = "mycelix-governance-authority"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Institution-bound governance signing policy and execution authority for Mycelix"
repository = "https://github.com/Luminous-Dynamics/mycelix"
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
mycelix-institutional-core = { path = "../mycelix-institutional-core" }

[dev-dependencies]
serde_json = "1.0"
