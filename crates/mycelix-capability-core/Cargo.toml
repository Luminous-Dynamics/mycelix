[package]
name = "mycelix-capability-core"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Domain-neutral bounded capability lease structure for Mycelix"

[lib]
path = "src/lib.rs"

[dependencies]
mycelix-authority-evidence-lease = { path = "../mycelix-authority-evidence-lease" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
