[package]
name = "mycelix-business-campaign-replay"
version = "0.1.0"
edition = "2024"
description = "Canonical bounded read-only campaign replay for Mycelix Business qualification"
license = "AGPL-3.0-or-later"
authors = ["Luminous Dynamics <contact@luminousdynamics.org>"]
repository = "https://github.com/luminous-dynamics/mycelix"
readme = "README.md"

[lib]
name = "mycelix_business_campaign_replay"
crate-type = ["rlib"]

[dependencies]
csv = "1.3"
sha2 = "0.10"
mycelix-business-core = { path = "../mycelix-business-core" }
mycelix-business-shadow = { path = "../mycelix-business-shadow" }
mycelix-business-ingress = { path = "../mycelix-business-ingress" }
mycelix-business-adapter-delimited = { path = "../mycelix-business-adapter-delimited" }
mycelix-business-import-diagnostics = { path = "../mycelix-business-import-diagnostics" }
mycelix-business-import-membership = { path = "../mycelix-business-import-membership" }
