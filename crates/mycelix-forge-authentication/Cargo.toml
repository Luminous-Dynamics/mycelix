[package]
name = "mycelix-forge-authentication"
version = "0.1.0"
edition = "2021"
authors = ["Luminous Dynamics"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/mycelix"
description = "Provider-neutral exact-subject principal authentication binding for Mycelix Forge"

[dependencies]
mycelix-forge-core = { path = "../mycelix-forge-core" }
mycelix-forge-authority = { path = "../mycelix-forge-authority" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[dev-dependencies]
serde_json = "1.0"
