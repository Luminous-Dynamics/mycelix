[package]
name = "mycelix-content-node"
version = "0.1.0"
edition = "2024"
description = "Crash-safe local content-addressed storage engine for Mycelix Content Fabric"
license = "AGPL-3.0-or-later"
authors = ["Luminous Dynamics <contact@luminousdynamics.org>"]
repository = "https://github.com/luminous-dynamics/mycelix"
readme = "README.md"

[dependencies]
blake3 = "1"
fs2 = "0.4"
hex = "0.4"
mycelix-content-core = { path = "../mycelix-content-core" }
parking_lot = "0.12"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
