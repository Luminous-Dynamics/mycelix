[package]
name = "mycelix-effect-safety"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Pure current effect-safety policy and adapter-mechanism qualification for Mycelix"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
blake3 = "1"
mycelix-institutional-core = { path = "../mycelix-institutional-core" }
mycelix-authority-freshness = { path = "../mycelix-authority-freshness" }
mycelix-execution-action-digest = { path = "../mycelix-execution-action-digest" }
