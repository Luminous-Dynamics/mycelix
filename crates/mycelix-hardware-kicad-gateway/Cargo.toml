[package]
name = "mycelix-hardware-kicad-gateway"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Read-only KiCad HTTP Library protocol projection for Mycelix hardware components"

[dependencies]
mycelix-hardware-core = { path = "../mycelix-hardware-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
all = "warn"
