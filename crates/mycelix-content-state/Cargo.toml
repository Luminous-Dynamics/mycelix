[package]
name = "mycelix-content-state"
version = "0.1.0"
edition = "2024"
description = "Deterministic active-state projection over Mycelix Content Fabric evidence snapshots"
license = "AGPL-3.0-or-later"
authors = ["Luminous Dynamics <contact@luminousdynamics.org>"]
repository = "https://github.com/Luminous-Dynamics/mycelix"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde-big-array = "0.5"
mycelix-content-core = { path = "../mycelix-content-core" }

[dev-dependencies]
proptest = "1"
