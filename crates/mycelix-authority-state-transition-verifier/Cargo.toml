[package]
name = "mycelix-authority-state-transition-verifier"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Split record-proof and institutional-authority qualification for Mycelix authority-state transitions"

[lib]
path = "src/lib.rs"

[dependencies]
blake3 = "1"
serde = { version = "1", features = ["derive"] }
mycelix-institutional-core = { path = "../mycelix-institutional-core" }
mycelix-authority-freshness = { path = "../mycelix-authority-freshness" }
mycelix-authority-state-source = { path = "../mycelix-authority-state-source" }
