[package]
name = "mycelix-leptos-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-or-later"
description = "Browser-compatible Holochain client for Leptos frontends. Pure-Rust replacement for @holochain/client using web-sys::WebSocket + rmp-serde."
authors = ["Tristan Stoltz <tristan.stoltz@evolvingresonantcocreationism.com>"]
repository = "https://github.com/Luminous-Dynamics/mycelix-leptos-client"
homepage = "https://github.com/Luminous-Dynamics/mycelix-leptos-client"
documentation = "https://docs.rs/mycelix-leptos-client"
readme = "README.md"
keywords = ["holochain", "leptos", "wasm", "websocket", "client"]
categories = ["wasm", "web-programming::websocket", "api-bindings"]

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
thiserror = "2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "WebSocket", "MessageEvent", "BinaryType", "Blob",
    "ErrorEvent", "CloseEvent", "console", "Window"
] }
futures = { version = "0.3", default-features = false, features = ["alloc"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
# Used by admin_granted_signer's ZomeCallParamsWire to force genuine
# MessagePack Bin encoding for raw-bytes fields, matching the real
# conductor's holo_hash/ExternIO/Nonce256Bits types.
serde_bytes = "0.11"
# Ed25519 signing for admin_granted_signer — a ZomeCallSigner impl for
# test/dev environments with no Launcher/Moss host signer. Pure Rust, no
# OS-level deps, compiles cleanly to wasm32-unknown-unknown.
ed25519-dalek = "2"
sha2 = "0.10"

# Native transport (for testing against real conductor without browser)
tokio = { version = "1", features = ["rt", "macros", "sync", "net", "time"], optional = true }
tokio-tungstenite = { version = "0.24", optional = true }
futures-util = { version = "0.3", optional = true }

[features]
default = ["browser"]
browser = []
tauri = []
native = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util"]

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
holochain_client = "=0.6.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
# Only used by a test fixture to force genuine MessagePack Bin encoding
# (matching what a real conductor sends) — not needed at runtime, see
# decode_tagged's doc comment in src/types.rs.
serde_bytes = "0.11"
