mycelix-authority-state-bootstrap-root = { path = "../mycelix-authority-state-bootstrap-root" }
mycelix-authority-control-plane-freshness = { path = "../mycelix-authority-control-plane-freshness" }
mycelix-authority-current-operational = { path = "../mycelix-authority-current-operational" }
mycelix-authority-runtime-dna-binding = { path = "../mycelix-authority-runtime-dna-binding" }
