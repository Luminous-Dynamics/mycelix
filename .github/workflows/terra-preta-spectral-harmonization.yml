name: Terra Preta source-aware spectral harmonization audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/terra-preta/SPECTRAL_HARMONIZATION_CONTRACT_V0.1.md'
      - 'research/terra-preta/schemas/soil-spectral-harmonization.schema.json'
      - 'research/terra-preta/schemas/soil-spectral-harmonization-report.schema.json'
      - 'research/terra-preta/tools/spectral-harmonization-audit/**'
      - '.github/workflows/terra-preta-spectral-harmonization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spectral-harmonization:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path research/terra-preta/tools/spectral-harmonization-audit/Cargo.toml -- --check
      - name: Run tests
        run: cargo test --manifest-path research/terra-preta/tools/spectral-harmonization-audit/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path research/terra-preta/tools/spectral-harmonization-audit/Cargo.toml --all-targets -- -D warnings
      - name: Install pinned Rust JSON Schema validator
        run: cargo install jsonschema-cli --version 0.61.0 --locked
      - name: Validate synthetic registry and report
        run: |
          base=research/terra-preta
          jsonschema-cli validate "$base/schemas/soil-spectral-harmonization.schema.json" \
            --instance "$base/tools/spectral-harmonization-audit/fixtures/synthetic-harmonization-registry.json" --draft 2020 --assert-format
          cargo run --quiet --manifest-path "$base/tools/spectral-harmonization-audit/Cargo.toml" -- \
            "$base/tools/spectral-harmonization-audit/fixtures/synthetic-harmonization-registry.json" "$RUNNER_TEMP/spectral-harmonization-report.json"
          jsonschema-cli validate "$base/schemas/soil-spectral-harmonization-report.schema.json" \
            --instance "$RUNNER_TEMP/spectral-harmonization-report.json" --draft 2020 --assert-format
          jq -e '.fixture_status == "synthetic_metadata_and_transforms_not_source_data" and .source_count == 2 and .transform_count == 2 and .directly_comparable_count == 1 and .non_comparable_count == 1 and .physical_sample_group_count == 3' "$RUNNER_TEMP/spectral-harmonization-report.json"
      - name: Reject transformation and split leakage controls
        run: |
          base=research/terra-preta/tools/spectral-harmonization-audit/fixtures/synthetic-harmonization-registry.json
          jq '.sources[1].transform_chain = [.sources[0].transform_chain[0]]' "$base" > "$RUNNER_TEMP/double-transform.json"
          if cargo run --quiet --manifest-path research/terra-preta/tools/spectral-harmonization-audit/Cargo.toml -- "$RUNNER_TEMP/double-transform.json" "$RUNNER_TEMP/double-transform-report.json"; then
            echo "Expected already-absorbance double-transform rejection"
            exit 1
          fi
          jq '.sample_rows[2].split = "test" | .sample_rows[2].split_group_id = "leaked-group"' "$base" > "$RUNNER_TEMP/sample-leak.json"
          if cargo run --quiet --manifest-path research/terra-preta/tools/spectral-harmonization-audit/Cargo.toml -- "$RUNNER_TEMP/sample-leak.json" "$RUNNER_TEMP/sample-leak-report.json"; then
            echo "Expected physical-sample split leakage rejection"
            exit 1
          fi
      - name: Reject output overwrite
        run: |
          fixture=research/terra-preta/tools/spectral-harmonization-audit/fixtures/synthetic-harmonization-registry.json
          report="$RUNNER_TEMP/existing-harmonization-report.json"
          printf 'do-not-overwrite\n' > "$report"
          if cargo run --quiet --manifest-path research/terra-preta/tools/spectral-harmonization-audit/Cargo.toml -- "$fixture" "$report"; then
            echo "Expected create-new output protection"
            exit 1
          fi
          test "$(cat "$report")" = "do-not-overwrite"
