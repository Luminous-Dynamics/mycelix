name: Terra Preta spectral screening referral bake-off

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/terra-preta/SPECTRAL_SCREENING_REFERRAL_BAKEOFF_V0.1.md'
      - 'research/terra-preta/schemas/spectral-screening-referral-input.schema.json'
      - 'research/terra-preta/schemas/spectral-screening-referral-report.schema.json'
      - 'research/terra-preta/tools/spectral-screening-referral/**'
      - '.github/workflows/terra-preta-spectral-screening-referral.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spectral-screening-referral:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path research/terra-preta/tools/spectral-screening-referral/Cargo.toml -- --check
      - name: Run tests
        run: cargo test --manifest-path research/terra-preta/tools/spectral-screening-referral/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path research/terra-preta/tools/spectral-screening-referral/Cargo.toml --all-targets -- -D warnings
      - name: Install pinned Rust JSON Schema validator
        run: cargo install jsonschema-cli --version 0.61.0 --locked
      - name: Validate input schema and fixture
        run: |
          jsonschema-cli validate research/terra-preta/schemas/spectral-screening-referral-input.schema.json \
            --instance research/terra-preta/tools/spectral-screening-referral/fixtures/synthetic-referral.json \
            --draft 2020 --assert-format
          cargo run --quiet --manifest-path research/terra-preta/tools/spectral-screening-referral/Cargo.toml -- \
            research/terra-preta/tools/spectral-screening-referral/fixtures/synthetic-referral.json \
            "$RUNNER_TEMP/referral-report.json"
          jsonschema-cli validate research/terra-preta/schemas/spectral-screening-referral-report.schema.json \
            --instance "$RUNNER_TEMP/referral-report.json" --draft 2020 --assert-format
          jq -e '
            .fixture_status == "synthetic_only_not_empirical_evidence" and
            .sample_count == 8 and
            ([.policies[].policy_id] | length == 8) and
            (.sample_count as $n | .referral_capacity as $capacity |
              all(.policies[];
                if .policy_id == "all_reference"
                then .referral_count == $n
                else .referral_count <= $capacity
                end)) and
            all(.policies[]; .deterministic_replay_pass == true) and
            (.controls.truth_mutation_selection_invariant == true) and
            (.controls.hidden_truth_not_used_by_selectors == true) and
            (.controls.capacity_pass == true) and
            (.controls.deterministic_replay_pass == true)
          ' "$RUNNER_TEMP/referral-report.json"
      - name: Verify no-overwrite
        run: |
          fixture=research/terra-preta/tools/spectral-screening-referral/fixtures/synthetic-referral.json
          report="$RUNNER_TEMP/referral-existing.json"
          printf 'do-not-overwrite\n' > "$report"
          if cargo run --quiet --manifest-path research/terra-preta/tools/spectral-screening-referral/Cargo.toml -- "$fixture" "$report"; then
            echo "Expected create-new output protection"
            exit 1
          fi
          test "$(cat "$report")" = "do-not-overwrite"
