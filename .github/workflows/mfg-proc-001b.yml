name: MFG-PROC-001B Resource Offer Qualification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "mycelix-workspace/mycelix-manufacturing/**"
      - ".github/workflows/mfg-proc-001b.yml"
  push:
    branches:
      - "feat/mfg-proc-001b-resource-offer-v0.1"
    paths:
      - "mycelix-workspace/mycelix-manufacturing/**"
      - ".github/workflows/mfg-proc-001b.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mfg-proc-001b-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  resource-offer-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-workspace/mycelix-manufacturing
      - name: Check committed manufacturing contract formatting
        run: |
          cargo fmt --manifest-path mycelix-workspace/mycelix-manufacturing/Cargo.toml \
            --package manufacturing_common -- --check
      - name: Test shared resource-offer contract
        run: |
          cargo test --manifest-path mycelix-workspace/mycelix-manufacturing/Cargo.toml \
            -p manufacturing_common
      - name: Strict Clippy
        run: |
          cargo clippy --manifest-path mycelix-workspace/mycelix-manufacturing/Cargo.toml \
            -p manufacturing_common --all-targets -- -D warnings
      - name: Install pinned test-only JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Validate Draft 2020-12 schemas and frozen offer corpus
        run: python mycelix-workspace/mycelix-manufacturing/tools/mfg_proc_001b_schema_audit.py
      - name: Validate source JSON syntax
        run: |
          python -m json.tool mycelix-workspace/mycelix-manufacturing/schemas/mfg_proc_001b/manufacturing_resource_offer_v0_1.schema.json >/dev/null
          python -m json.tool mycelix-workspace/mycelix-manufacturing/tests/fixtures/mfg_proc_001b_resource_offer_v0_1.json >/dev/null
