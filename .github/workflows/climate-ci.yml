name: Climate CI

on:
  pull_request:
    paths:
      - 'mycelix-climate/**'
      - 'crates/mycelix-bridge-entry-types/**'
      - '.github/workflows/climate-ci.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-climate/**'
      - 'crates/mycelix-bridge-entry-types/**'
      - '.github/workflows/climate-ci.yml'

concurrency:
  group: climate-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  climate:
    name: Climate workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-climate

      - name: Check formatting
        run: cd mycelix-climate && cargo fmt --all --check

      - name: Run production and workspace tests
        run: cd mycelix-climate && cargo test --workspace

      - name: Build Holochain zomes for wasm32
        run: |
          cd mycelix-climate
          cargo build --release --target wasm32-unknown-unknown --workspace --exclude mycelix-climate-tests
