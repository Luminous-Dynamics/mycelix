name: Identity K-Vector Verifier Key Generation Lineage V2

on:
  pull_request:
    paths:
      - 'mycelix-workspace/mycelix-identity/Cargo.toml'
      - 'mycelix-workspace/mycelix-identity/crates/kvector-verifier-key-generation-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/kvector-verification-record-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/kvector-verifier-key-generation-lineage-policy/**'
      - '.github/workflows/identity-kvector-verifier-key-generation-lineage-v2.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-workspace/mycelix-identity/Cargo.toml'
      - 'mycelix-workspace/mycelix-identity/crates/kvector-verifier-key-generation-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/kvector-verification-record-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/kvector-verifier-key-generation-lineage-policy/**'
      - '.github/workflows/identity-kvector-verifier-key-generation-lineage-v2.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify-verifier-key-generation-lineage-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Assert record-bound generation-lineage theorem
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          root = Path('mycelix-workspace/mycelix-identity')
          member = 'crates/kvector-verifier-key-generation-lineage-policy'
          workspace = tomllib.loads((root / 'Cargo.toml').read_text())
          if member not in workspace.get('workspace', {}).get('members', []):
              raise SystemExit(f'ERROR: {member} is not an explicit workspace member')

          manifest = tomllib.loads((root / member / 'Cargo.toml').read_text())
          deps = manifest.get('dependencies', {})
          expected = {
              'mycelix-crypto',
              'mycelix-kvector-verification-record-policy',
              'mycelix-kvector-verifier-key-generation-policy',
          }
          if set(deps) != expected:
              raise SystemExit(f'ERROR: generation-lineage deps drifted: {sorted(deps)}')
          if deps['mycelix-crypto'].get('workspace') is not True:
              raise SystemExit('ERROR: generation lineage must use workspace mycelix-crypto')
          if deps['mycelix-kvector-verification-record-policy'].get('path') != '../kvector-verification-record-policy':
              raise SystemExit('ERROR: generation lineage not bound to #324 record theorem')
          if deps['mycelix-kvector-verifier-key-generation-policy'].get('path') != '../kvector-verifier-key-generation-policy':
              raise SystemExit('ERROR: generation lineage not bound to #316 generation theorem')

          text = (root / member / 'src/lib.rs').read_text()
          required = [
              '#![forbid(unsafe_code)]',
              'ObservedVerifierKeyGenerationRecordV2',
              'ResolvedHistoricalVerifierKeyGenerationV2',
              'resolve_record_bound_verifier_key_generation_v2',
              'MAX_OBSERVED_KEY_GENERATIONS_V2',
              'DuplicateGenerationNumber',
              'DuplicateGenerationDigest',
              'GenerationNamespaceMismatch',
              'RootGenerationNumberInvalid',
              'GenerationNotDirectSuccessor',
              'BranchingGenerationHistory',
              'DisconnectedGenerationHistory',
              'ValidityWindowsOverlap',
              'IssuedAtRegressed',
              'TargetGenerationMissing',
              'checked_add(1)',
              'child.valid_from_micros < parent.valid_until_micros',
              'child.issued_at_micros < parent.issued_at_micros',
              'derive_kvector_verifier_key_generation_digest_v2(generation)',
              'record.verifier_key_generation_sha256',
              'validate_kvector_verification_record_key_generation_binding_v2(record, target.generation)',
              'old_record_resolves_old_generation_even_when_newer_generation_exists',
              'same_key_id_reuse_cannot_substitute_newer_generation',
              'generation_numbers_must_be_exact_successors',
              'competing_successor_generations_fail_closed',
              'validity_windows_cannot_overlap',
              'record_digest_must_exist_in_observed_lineage',
              'target_generation_must_cover_record_verification_time',
              'qualified_result_fields_are_verifier_owned',
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'ERROR: generation-lineage theorem missing: {needle!r}')

          # The success capability must not be caller-forgeable.
          result_start = text.index('pub struct ResolvedHistoricalVerifierKeyGenerationV2')
          result_end = text.index('impl ResolvedHistoricalVerifierKeyGenerationV2', result_start)
          result_body = text[result_start:result_end]
          if 'pub ' in '\n'.join(result_body.splitlines()[1:]):
              raise SystemExit('ERROR: resolved historical generation exposes public fields')

          lower = text.lower()
          for forbidden in [
              'use hdk',
              'use hdi',
              'hdk::',
              'hdi::',
              'holochain_',
              'get_agent_activity(',
              'get_links(',
              'get_details(',
              'sys_time(',
              'std::time',
              '.verify(',
              'signature_validated',
              'policy_current',
              'policy_accepted',
              'global_consensus',
              '.sort_by(',
              '.sort_by_key(',
              '.max_by(',
              '.max_by_key(',
          ]:
              if forbidden in lower:
                  raise SystemExit(f'ERROR: network/chronology/authenticity/currentness leaked into generation lineage: {forbidden!r}')
          PY

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-workspace/mycelix-identity

      - name: Check formatting
        run: |
          cargo fmt \
            --manifest-path mycelix-workspace/mycelix-identity/crates/kvector-verifier-key-generation-lineage-policy/Cargo.toml \
            -- --check

      - name: Test generation theorem
        run: |
          cargo test \
            --manifest-path mycelix-workspace/mycelix-identity/crates/kvector-verifier-key-generation-policy/Cargo.toml

      - name: Test generation-bound record theorem
        run: |
          cargo test \
            --manifest-path mycelix-workspace/mycelix-identity/crates/kvector-verification-record-policy/Cargo.toml

      - name: Test generation-lineage theorem
        run: |
          cargo test \
            --manifest-path mycelix-workspace/mycelix-identity/crates/kvector-verifier-key-generation-lineage-policy/Cargo.toml

      - name: Check generation-lineage theorem for wasm32
        run: |
          cargo check \
            --manifest-path mycelix-workspace/mycelix-identity/crates/kvector-verifier-key-generation-lineage-policy/Cargo.toml \
            --target wasm32-unknown-unknown
