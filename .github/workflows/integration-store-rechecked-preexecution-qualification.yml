name: Integration Store-Rechecked Preexecution Qualification

on:
  pull_request:
    branches:
      - feat/integration-current-attempt-v1
      - main
    paths:
      - 'crates/mycelix-integration-store-rechecked-preexecution/**'
      - 'crates/mycelix-integration-preexecution-admission/**'
      - 'crates/mycelix-integration-runtime/**'
      - '.github/workflows/integration-store-rechecked-preexecution-qualification.yml'
  push:
    branches:
      - feat/integration-store-rechecked-preexecution-v1
    paths:
      - 'crates/mycelix-integration-store-rechecked-preexecution/**'
      - '.github/workflows/integration-store-rechecked-preexecution-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MANIFEST: crates/mycelix-integration-store-rechecked-preexecution/Cargo.toml

concurrency:
  group: integration-store-rechecked-preexecution-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Same-call provider/root + durable attempt requalification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/mycelix-integration-store-rechecked-preexecution

      - name: Check formatting
        run: cargo fmt --manifest-path "$MANIFEST" --all --check

      - name: Compile tests without running
        run: cargo test --manifest-path "$MANIFEST" --no-run

      - name: Run tests
        run: cargo test --manifest-path "$MANIFEST"

      - name: Clippy
        run: cargo clippy --manifest-path "$MANIFEST" --all-targets -- -D warnings

      - name: Enforce same-invocation requalification order
        shell: bash
        run: |
          set -euo pipefail
          source='crates/mycelix-integration-store-rechecked-preexecution/src/lib.rs'

          grep -Fq 'pub fn qualify_store_rechecked_preexecution<C>(' "$source"
          grep -Fq 'let admission = qualify_preexecution_admission(' "$source"
          grep -Fq 'let current_attempt = store.qualify_current_execution_attempt(' "$source"

          provider_line="$(grep -nF 'let admission = qualify_preexecution_admission(' "$source" | cut -d: -f1)"
          store_line="$(grep -nF 'let current_attempt = store.qualify_current_execution_attempt(' "$source" | cut -d: -f1)"
          test "$provider_line" -lt "$store_line"

          if grep -Fq 'admission: &QualifiedIntegrationPreexecutionAdmission' "$source"; then
            echo 'Store-rechecked theorem must not accept a cached preexecution admission.'
            exit 1
          fi
          if grep -Fq 'current_attempt: &QualifiedCurrentExecutionAttempt' "$source"; then
            echo 'Store-rechecked theorem must not accept a cached current-attempt proof.'
            exit 1
          fi

      - name: Enforce exact identity joins
        shell: bash
        run: |
          set -euo pipefail
          source='crates/mycelix-integration-store-rechecked-preexecution/src/lib.rs'

          grep -Fq 'binding.entry_id()' "$source"
          grep -Fq 'binding.attempt_id()' "$source"
          grep -Fq 'binding.command_id()' "$source"
          grep -Fq 'binding.connector_instance()' "$source"
          grep -Fq 'binding.command_commitment()' "$source"
          grep -Fq 'binding.lease_until_ms()' "$source"
          grep -Fq 'admission_qualified_at_ms != now_ms' "$source"
          grep -Fq 'attempt_qualified_at_ms != now_ms' "$source"
          grep -Fq 'authority_valid_until_ms <= now_u64' "$source"
          grep -Fq 'provider_profile_valid_through_ms < now_ms' "$source"
          grep -Fq 'attempt_lease_until_ms <= now_ms' "$source"

      - name: Enforce pre-native boundary
        shell: bash
        run: |
          set -euo pipefail
          source='crates/mycelix-integration-store-rechecked-preexecution/src/lib.rs'

          grep -Fq 'provider_profile_and_root_requalified_here(&self) -> bool' "$source"
          grep -Fq 'durable_attempt_requalified_here(&self) -> bool' "$source"
          grep -Fq 'same_invocation_requalification_here(&self) -> bool' "$source"
          grep -Fq 'provider_trust_root_origin_verified_here(&self) -> bool' "$source"
          grep -Fq 'atomic_with_dispatch_started_here(&self) -> bool' "$source"
          grep -Fq 'coordinator_update_excluded_here(&self) -> bool' "$source"
          grep -Fq 'provider_payload_materialized_here(&self) -> bool' "$source"
          grep -Fq 'reusable_without_final_recheck_here(&self) -> bool' "$source"
          grep -Fq 'grants_execution_authority(&self) -> bool' "$source"

          if grep -Eq 'derive\([^)]*Deserialize' "$source"; then
            echo 'Positive store-rechecked preexecution proof must not be deserializable.'
            exit 1
          fi
          if grep -Eq 'fn[[:space:]]+(mark_dispatch_started|dispatch|execute_provider)|reqwest::|hyper::|tonic::|stripe::' "$source"; then
            echo 'Store-rechecked preexecution crossed into provider/effect execution.'
            exit 1
          fi

      - name: Enforce substitution regressions
        shell: bash
        run: |
          set -euo pipefail
          source='crates/mycelix-integration-store-rechecked-preexecution/src/lib.rs'
          grep -Fq 'exact_same_instant_facts_join' "$source"
          grep -Fq 'attempt_substitution_fails_closed' "$source"
          grep -Fq 'command_substitution_fails_closed' "$source"
          grep -Fq 'stale_observation_time_fails_closed' "$source"
          grep -Fq 'expired_attempt_fails_closed' "$source"
