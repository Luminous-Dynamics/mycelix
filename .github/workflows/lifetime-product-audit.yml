name: Lifetime Product Audit

on:
  pull_request:
    branches: ["main"]
    paths:
      - "mycelix-workspace/happs/fabrication/docs/LIFETIME_PRODUCT_*.md"
      - "mycelix-workspace/happs/fabrication/docs/LIFETIME_PRODUCT_*.json"
      - "mycelix-workspace/happs/fabrication/docs/LKI_01_*.json"
      - "mycelix-workspace/happs/fabrication/tools/lifetime-product-audit/**"
      - ".github/workflows/lifetime-product-audit.yml"
  push:
    branches: ["main", "work/lifetime-product-engineering-contract"]
    paths:
      - "mycelix-workspace/happs/fabrication/docs/LIFETIME_PRODUCT_*.md"
      - "mycelix-workspace/happs/fabrication/docs/LIFETIME_PRODUCT_*.json"
      - "mycelix-workspace/happs/fabrication/tools/lifetime-product-audit/**"
      - ".github/workflows/lifetime-product-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifetime-product-audit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Check verifier formatting
        run: cargo fmt --manifest-path mycelix-workspace/happs/fabrication/tools/lifetime-product-audit/Cargo.toml -- --check
      - name: Verify committed dependency lock
        run: cargo metadata --locked --manifest-path mycelix-workspace/happs/fabrication/tools/lifetime-product-audit/Cargo.toml --no-deps --format-version 1 > /dev/null
      - name: Run validator unit tests with locked dependencies
        run: cargo test --locked --manifest-path mycelix-workspace/happs/fabrication/tools/lifetime-product-audit/Cargo.toml --all-targets
      - name: Audit frozen v0.3 product-record baseline
        run: |
          cargo run --locked --manifest-path mycelix-workspace/happs/fabrication/tools/lifetime-product-audit/Cargo.toml \
            --bin lifetime-product-audit -- \
            --schema mycelix-workspace/happs/fabrication/docs/LIFETIME_PRODUCT_RECORD_SCHEMA_V1_DRAFT.json \
            --record mycelix-workspace/happs/fabrication/docs/LKI_01_PRODUCT_RECORD_EXAMPLE_DRAFT.json \
            --benchmark mycelix-workspace/happs/fabrication/docs/LKI_01_LIFETIME_BENCHMARK_CORPUS_V0_3_DRAFT.json \
            --as-of 2026-10-19
      - name: Audit v0.4 repairability extension
        run: |
          cargo run --locked --manifest-path mycelix-workspace/happs/fabrication/tools/lifetime-product-audit/Cargo.toml \
            --bin repairability_extension_audit -- \
            --corpus mycelix-workspace/happs/fabrication/docs/LKI_01_REPAIRABILITY_BENCHMARK_EXTENSION_V0_4_DRAFT.json
      - name: Audit repair-trial record contract and example
        run: |
          cargo run --locked --manifest-path mycelix-workspace/happs/fabrication/tools/lifetime-product-audit/Cargo.toml \
            --bin repair_trial_record_audit -- \
            --schema mycelix-workspace/happs/fabrication/docs/LKI_01_REPAIR_TRIAL_RECORD_SCHEMA_V0_1_DRAFT.json \
            --record mycelix-workspace/happs/fabrication/docs/LKI_01_REPAIR_TRIAL_RECORD_EXAMPLE_V0_1_DRAFT.json
