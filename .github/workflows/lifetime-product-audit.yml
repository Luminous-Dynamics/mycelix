name: Lifetime Product Audit

on:
  pull_request:
    branches: ["main"]
    paths:
      - "mycelix-workspace/happs/fabrication/docs/LIFETIME_PRODUCT_*.md"
      - "mycelix-workspace/happs/fabrication/docs/LIFETIME_PRODUCT_*.json"
      - "mycelix-workspace/happs/fabrication/docs/LKI_01_*.json"
      - "mycelix-workspace/happs/fabrication/tools/lifetime-product-audit/**"
      - ".github/workflows/lifetime-product-audit.yml"
  push:
    branches: ["main"]
    paths:
      - "mycelix-workspace/happs/fabrication/docs/LIFETIME_PRODUCT_*.md"
      - "mycelix-workspace/happs/fabrication/docs/LIFETIME_PRODUCT_*.json"
      - "mycelix-workspace/happs/fabrication/docs/LKI_01_*.json"
      - "mycelix-workspace/happs/fabrication/tools/lifetime-product-audit/**"
      - ".github/workflows/lifetime-product-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifetime-product-audit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Check verifier formatting
        run: cargo fmt --manifest-path mycelix-workspace/happs/fabrication/tools/lifetime-product-audit/Cargo.toml -- --check
      - name: Run validator unit tests
        run: cargo test --manifest-path mycelix-workspace/happs/fabrication/tools/lifetime-product-audit/Cargo.toml --all-targets
      - name: Audit frozen draft record and benchmark corpus
        run: |
          cargo run --manifest-path mycelix-workspace/happs/fabrication/tools/lifetime-product-audit/Cargo.toml -- \
            --schema mycelix-workspace/happs/fabrication/docs/LIFETIME_PRODUCT_RECORD_SCHEMA_V1_DRAFT.json \
            --record mycelix-workspace/happs/fabrication/docs/LKI_01_PRODUCT_RECORD_EXAMPLE_DRAFT.json \
            --benchmark mycelix-workspace/happs/fabrication/docs/LKI_01_LIFETIME_BENCHMARK_CORPUS_V0_2_DRAFT.json \
            --as-of 2026-10-19
