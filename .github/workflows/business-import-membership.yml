name: Business Import Membership

on:
  pull_request:
    paths:
      - 'crates/mycelix-business-import-membership/**'
      - 'crates/mycelix-business-hospitality-derived-evidence/**'
      - 'crates/mycelix-business-import-diagnostics/**'
      - 'crates/mycelix-business-pilot-hospitality/**'
      - 'crates/mycelix-business-adapter-delimited/**'
      - 'crates/mycelix-business-ingress/**'
      - 'crates/mycelix-business-shadow/**'
      - 'crates/mycelix-business-field-qualification/**'
      - 'crates/mycelix-business-core/**'
      - '.github/workflows/business-import-membership.yml'
  push:
    branches:
      - main
      - 'feat/business-forecast-actual-membership-*'
    paths:
      - 'crates/mycelix-business-import-membership/**'
      - 'crates/mycelix-business-hospitality-derived-evidence/**'
      - 'crates/mycelix-business-import-diagnostics/**'
      - 'crates/mycelix-business-pilot-hospitality/**'
      - 'crates/mycelix-business-adapter-delimited/**'
      - 'crates/mycelix-business-ingress/**'
      - 'crates/mycelix-business-shadow/**'
      - 'crates/mycelix-business-field-qualification/**'
      - 'crates/mycelix-business-core/**'
      - '.github/workflows/business-import-membership.yml'

permissions:
  contents: read

jobs:
  import-membership:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: crates/mycelix-business-import-membership
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
