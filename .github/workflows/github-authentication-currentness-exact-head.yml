name: Mycelix GitHub Authentication Currentness Exact-Head

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'mycelix-workspace/mycelix-core/libs/proofs-evidence-authentication/**'
      - '.github/workflows/github-authentication-currentness-exact-head.yml'
  workflow_dispatch:
    inputs:
      subject_sha:
        description: 'Exact 40-hex commit SHA to qualify'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-auth-currentness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SEMANTIC_HEAD: 395d3fc9eabb32e05afb92d6560420d7d7e1d814
  PARENT_HEAD: d7e99c3dac5017168196ac7222314a53408032fd

jobs:
  qualify:
    name: Exact-head GitHub authentication currentness qualification
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Resolve exact subject
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            subject='${{ github.event.pull_request.head.sha }}'
          else
            subject='${{ inputs.subject_sha }}'
          fi
          [[ "$subject" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid subject SHA: $subject" >&2; exit 1; }
          echo "sha=$subject" >> "$GITHUB_OUTPUT"

      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.subject.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: rustfmt,clippy

      - name: Prove verifier-only child and frozen semantic bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.subject.outputs.sha }}"
          set -- $(git rev-list --parents -n 1 HEAD)
          test "$#" -eq 2
          test "$2" = "$SEMANTIC_HEAD"
          test "$(git rev-parse "$SEMANTIC_HEAD^")" = "$PARENT_HEAD"
          mapfile -t changed < <(git diff --name-only "$SEMANTIC_HEAD" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/github-authentication-currentness-exact-head.yml"
          test "$(git hash-object mycelix-workspace/mycelix-core/libs/proofs-evidence-authentication/src/github_currentness.rs)" = "e7e681ff834de4ade34564a94e283446b0985064"
          test "$(git hash-object mycelix-workspace/mycelix-core/libs/proofs-evidence-authentication/src/lib.rs)" = "8293fcbbb7547146c3c01229612e87926c710a6e"
          test "$(git hash-object mycelix-workspace/mycelix-core/libs/proofs-evidence-authentication/Cargo.toml)" = "0d7c135eca32ab0ddf5e281e009116a575218ad5"
          test -z "$(git status --porcelain)"

      - name: Capture preflight source evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/github-auth-currentness-evidence"
          mkdir -p "$evidence"
          {
            echo "subject_sha=${{ steps.subject.outputs.sha }}"
            echo "semantic_head=$SEMANTIC_HEAD"
            echo "parent_head=$PARENT_HEAD"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            rustc -Vv
            cargo -V
          } > "$evidence/execution-capsule.txt"
          find mycelix-workspace/mycelix-core/libs/proofs-evidence-authentication \
            -type f -not -path '*/target/*' -print0 | sort -z | xargs -0 sha256sum \
            > "$evidence/source-sha256.txt"

      - name: Static authority and clock audit
        shell: bash
        run: |
          set -euo pipefail
          src=mycelix-workspace/mycelix-core/libs/proofs-evidence-authentication/src/github_currentness.rs
          grep -Fq 'CurrentnessEvidenceOnly' "$src"
          grep -Fq 'pub const fn establishes_receipt_authentication(&self) -> bool' "$src"
          grep -Fq 'pub const fn grants_production_authority(&self) -> bool' "$src"
          grep -Fq 'pub const fn grants_application_authority(&self) -> bool' "$src"
          grep -Fq 'execution.execution_completed_at_unix_seconds' "$src"
          grep -Fq 'DateTime::parse_from_rfc3339' "$src"
          ! grep -Eq 'SystemTime|Utc::now|Local::now|Instant::now' "$src"
          ! grep -Fq 'from_verified_parts' "$src"
          ! grep -Eq '#\[derive\([^]]*(Serialize|Deserialize|Default)' "$src"

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path \
            mycelix-workspace/mycelix-core/libs/proofs-evidence-authentication/Cargo.toml \
            --all -- --check

      - name: Prepare isolated resolved graph
        shell: bash
        run: |
          set -euo pipefail
          crate="$RUNNER_TEMP/github-auth-currentness-qual"
          evidence="$RUNNER_TEMP/github-auth-currentness-evidence"
          cp -a mycelix-workspace/mycelix-core/libs/proofs-evidence-authentication "$crate"
          cd "$crate"
          cargo generate-lockfile
          cp Cargo.lock "$evidence/Cargo.lock"
          sha256sum Cargo.lock > "$evidence/Cargo.lock.sha256"
          cargo metadata --locked --format-version 1 > "$evidence/cargo-metadata.json"
          cargo tree --locked > "$evidence/cargo-tree.txt"

      - name: Execute committed corpus
        shell: bash
        run: |
          set -euo pipefail
          crate="$RUNNER_TEMP/github-auth-currentness-qual"
          evidence="$RUNNER_TEMP/github-auth-currentness-evidence"
          cd "$crate"
          cargo test --locked --all-targets -- --nocapture | tee "$evidence/committed-tests.txt"
          cargo test --locked --all-targets -- --list > "$evidence/committed-test-list.txt"

      - name: Install external currentness probes
        shell: bash
        run: |
          set -euo pipefail
          crate="$RUNNER_TEMP/github-auth-currentness-qual"
          mkdir -p "$crate/tests"
          cat > "$crate/tests/github_authentication_currentness_public_probe.rs" <<'RS'
          use proofs_evidence_authentication::{
              AuthenticationFreshnessPolicyV1, GitObjectIdV1,
              GitHubAuthenticationCurrentnessAuthorityV1, GitHubAuthenticationCurrentnessErrorV1,
              GitHubPublicCommandPlanV1, GitHubPublicVerifierExecutionPolicyV1,
              GitHubTrustedBuilderBindingErrorV1, GitHubTrustedBuilderBindingV1,
              GitHubTrustedBuilderPolicyV1, GitHubTrustedRootClassificationV1,
              NixVerifierClosureIdentityV1, ParsedGitHubAttestationVerifierOutputV1,
              QualificationAttestationPredicateV1, QualificationReceiptV1,
              QualificationResultV1, ReceiptAuthenticationPolicyV1, Sha256DigestV1,
              SourceRevisionPolicyV1, TransparencyPolicyV1, VerifierExecutableIdentityV1,
              VerifierExecutionReceiptV1, VerifierProcessOutcomeV1, VerifierProfileV1,
              VerifierTrustRootModeV1, WorkflowRevisionPolicyV1,
              GITHUB_ACTIONS_OIDC_ISSUER_V1, GITHUB_HOSTED_RUNNER_ENVIRONMENT_V1,
              GITHUB_PUBLIC_BACKEND_FAMILY_V1, GITHUB_PUBLIC_COMMAND_PROFILE_ID_V1,
              GITHUB_PUBLIC_PLATFORM_PROFILE_V1, GITHUB_PUBLIC_REPOSITORY_VISIBILITY_V1,
              MYCELIX_QUALIFICATION_PREDICATE_TYPE_V1,
              MYCELIX_QUALIFICATION_SUBJECT_NAME_V1, MYCELIX_REPOSITORY_OWNER_V1,
              MYCELIX_REPOSITORY_V1, QUALIFICATION_ATTESTATION_PREDICATE_SCHEMA_V1,
              SIGSTORE_PUBLIC_GOOD_FULCIO_URI_V1, SIGSTORE_TRUSTED_ROOT_MEDIA_TYPE_V1,
              SIGSTORE_VERIFICATION_RESULT_MEDIA_TYPE_V1,
              VERIFIER_EXECUTION_EVIDENCE_VERSION_V1,
              bind_unique_github_trusted_builder_candidate_v1,
              build_github_public_command_plan_with_execution_policy_v1,
              classify_github_default_dual_trusted_root_v1,
              establish_github_authentication_currentness_v1,
              github_verifier_stdout_digest_v1,
              parse_github_attestation_verifier_output_v1,
          };
          use sha2::{Digest, Sha256};

          const REPOSITORY_ID: &str = "1176351975";
          const OWNER_ID: &str = "216969177";
          const STATEMENT_TYPE: &str = "https://in-toto.io/Statement/v1";
          const PUBLIC_TLOG: &str = "https://rekor.sigstore.dev";
          const PRIVATE_TLOG: &str = "https://rekor.private.github.example";
          const TSA: &str = "https://timestamp.example";
          const RUN_ID: u64 = 4_735_384_265;
          const RUN_ATTEMPT: u64 = 2;
          const EXECUTION_START: u64 = 1_789_865_900; // 2026-09-20T00:58:20Z
          const ROOT_ACQUIRED: u64 = 1_789_865_950;
          const EXECUTION_END: u64 = 1_789_866_000;   // 2026-09-20T01:00:00Z

          fn digest(byte: u8) -> Sha256DigestV1 {
              Sha256DigestV1::from_bytes([byte; 32])
          }

          fn raw_sha256(bytes: &[u8]) -> Sha256DigestV1 {
              let mut hasher = Sha256::new();
              hasher.update(bytes);
              Sha256DigestV1::from_bytes(hasher.finalize().into())
          }

          fn receipt() -> QualificationReceiptV1 {
              QualificationReceiptV1 {
                  receipt_version: 1,
                  qualification_profile: "myc-zkp-range-001aq".into(),
                  statement_profile: "range-membership-v1".into(),
                  theorem_profile: "range-membership-v1-air".into(),
                  subject: GitObjectIdV1::sha1([0xaa; 20]),
                  dependency_graph_digest: digest(1),
                  measured_security_receipt_digest: digest(2),
                  coherence_policy_id: "coherence-v1".into(),
                  coherence_result_digest: digest(3),
                  qualification_corpus_digest: digest(4),
                  execution_capsule_digest: digest(5),
                  result: QualificationResultV1::Pass,
                  nonclaims: vec!["application authority not granted".into()],
              }
          }

          fn root_line(tlogs: &[&str], cas: &[&str]) -> String {
              serde_json::to_string(&serde_json::json!({
                  "mediaType": SIGSTORE_TRUSTED_ROOT_MEDIA_TYPE_V1,
                  "tlogs": tlogs.iter().map(|uri| serde_json::json!({"baseUrl": uri})).collect::<Vec<_>>(),
                  "certificateAuthorities": cas.iter().map(|uri| serde_json::json!({"uri": uri})).collect::<Vec<_>>()
              })).unwrap()
          }

          fn roots() -> Vec<u8> {
              format!(
                  "{}\n{}\n",
                  root_line(&[PUBLIC_TLOG], &[SIGSTORE_PUBLIC_GOOD_FULCIO_URI_V1]),
                  root_line(&[PRIVATE_TLOG], &["https://fulcio.private.github.example"]),
              ).into_bytes()
          }

          fn authentication_policy(
              root_digest: Sha256DigestV1,
              freshness: AuthenticationFreshnessPolicyV1,
          ) -> ReceiptAuthenticationPolicyV1 {
              ReceiptAuthenticationPolicyV1 {
                  profile_id: "github-public-v1".into(),
                  verifier_profile: VerifierProfileV1 {
                      profile_id: "github-attestation-verifier-v1".into(),
                      backend_family: GITHUB_PUBLIC_BACKEND_FAMILY_V1.into(),
                      backend_version: "2.101.0".into(),
                      verification_profile: "public-sigstore-qualification-v1".into(),
                  },
                  expected_attestation_subject_name: MYCELIX_QUALIFICATION_SUBJECT_NAME_V1.into(),
                  expected_predicate_type: MYCELIX_QUALIFICATION_PREDICATE_TYPE_V1.into(),
                  expected_predicate_schema: QUALIFICATION_ATTESTATION_PREDICATE_SCHEMA_V1.into(),
                  trusted_root_profile: "sigstore-public-good-v1".into(),
                  trusted_root_digest: root_digest,
                  oidc_issuer: GITHUB_ACTIONS_OIDC_ISSUER_V1.into(),
                  source_repository: MYCELIX_REPOSITORY_V1.into(),
                  source_repository_owner: MYCELIX_REPOSITORY_OWNER_V1.into(),
                  signer_workflow: ".github/workflows/qualify.yml".into(),
                  signer_workflow_revision: WorkflowRevisionPolicyV1::Exact(
                      GitObjectIdV1::sha1([0xbb; 20]),
                  ),
                  source_revision: SourceRevisionPolicyV1 {
                      exact_commit: GitObjectIdV1::sha1([0xaa; 20]),
                      exact_git_ref: Some("refs/heads/main".into()),
                  },
                  transparency_policy: TransparencyPolicyV1::PublicTransparencyRequired,
                  freshness_policy: freshness,
              }
          }

          fn verifier() -> VerifierExecutableIdentityV1 {
              VerifierExecutableIdentityV1 {
                  profile_id: "gh-exact-v1".into(),
                  backend_family: GITHUB_PUBLIC_BACKEND_FAMILY_V1.into(),
                  semantic_version: "2.101.0".into(),
                  executable_sha256: digest(7),
                  platform_profile: GITHUB_PUBLIC_PLATFORM_PROFILE_V1.into(),
                  command_profile_id: GITHUB_PUBLIC_COMMAND_PROFILE_ID_V1.into(),
                  nix_closure: Some(NixVerifierClosureIdentityV1 {
                      store_path: "/nix/store/example-gh/bin/gh".into(),
                      closure_digest: digest(8),
                  }),
              }
          }

          fn execution_policy() -> GitHubPublicVerifierExecutionPolicyV1 {
              GitHubPublicVerifierExecutionPolicyV1::new(
                  "github-public-exact-executable-v1",
                  "github-public-v1",
                  "github-attestation-verifier-v1",
                  "public-sigstore-qualification-v1",
                  verifier(),
                  "/nix/store/example-gh/bin/gh",
              ).unwrap()
          }

          fn trusted_builder_policy() -> GitHubTrustedBuilderPolicyV1 {
              GitHubTrustedBuilderPolicyV1::new(
                  "mycelix-github-trusted-builder-v1",
                  REPOSITORY_ID,
                  OWNER_ID,
                  STATEMENT_TYPE,
                  GITHUB_HOSTED_RUNNER_ENVIRONMENT_V1,
                  GITHUB_PUBLIC_REPOSITORY_VISIBILITY_V1,
                  true,
                  true,
              ).unwrap()
          }

          fn strict_predicate(receipt: &QualificationReceiptV1) -> QualificationAttestationPredicateV1 {
              QualificationAttestationPredicateV1 {
                  predicate_version: 1,
                  predicate_schema: QUALIFICATION_ATTESTATION_PREDICATE_SCHEMA_V1.into(),
                  receipt_digest: receipt.digest().unwrap(),
                  qualification_profile: receipt.qualification_profile.clone(),
                  subject: receipt.subject,
                  coherence_result_digest: receipt.coherence_result_digest,
                  result: receipt.result,
              }
          }

          fn candidate(
              receipt: &QualificationReceiptV1,
              timestamps: serde_json::Value,
          ) -> serde_json::Value {
              let receipt_digest = receipt.digest().unwrap();
              let signer_uri = "https://github.com/Luminous-Dynamics/mycelix/.github/workflows/qualify.yml@refs/heads/main";
              serde_json::json!({
                  "attestation": {"bundle": "retained-elsewhere"},
                  "verificationResult": {
                      "mediaType": SIGSTORE_VERIFICATION_RESULT_MEDIA_TYPE_V1,
                      "statement": {
                          "_type": STATEMENT_TYPE,
                          "subject": [{
                              "name": MYCELIX_QUALIFICATION_SUBJECT_NAME_V1,
                              "digest": {"sha256": receipt_digest.sha256.to_hex()}
                          }],
                          "predicateType": MYCELIX_QUALIFICATION_PREDICATE_TYPE_V1,
                          "predicate": serde_json::to_value(strict_predicate(receipt)).unwrap()
                      },
                      "signature": {"certificate": {
                          "certificateIssuer": "CN=sigstore-intermediate,O=sigstore.dev",
                          "subjectAlternativeName": signer_uri,
                          "issuer": GITHUB_ACTIONS_OIDC_ISSUER_V1,
                          "buildSignerURI": signer_uri,
                          "buildSignerDigest": "bb".repeat(20),
                          "runnerEnvironment": GITHUB_HOSTED_RUNNER_ENVIRONMENT_V1,
                          "sourceRepositoryURI": "https://github.com/Luminous-Dynamics/mycelix",
                          "sourceRepositoryDigest": "aa".repeat(20),
                          "sourceRepositoryRef": "refs/heads/main",
                          "sourceRepositoryIdentifier": REPOSITORY_ID,
                          "sourceRepositoryOwnerURI": "https://github.com/Luminous-Dynamics",
                          "sourceRepositoryOwnerIdentifier": OWNER_ID,
                          "buildConfigURI": signer_uri,
                          "buildConfigDigest": "bb".repeat(20),
                          "buildTrigger": "pull_request",
                          "runInvocationURI": format!(
                              "https://github.com/Luminous-Dynamics/mycelix/actions/runs/{RUN_ID}/attempts/{RUN_ATTEMPT}"
                          ),
                          "sourceRepositoryVisibilityAtSigning": GITHUB_PUBLIC_REPOSITORY_VISIBILITY_V1
                      }},
                      "verifiedTimestamps": timestamps
                  }
              })
          }

          fn try_binding(
              freshness: AuthenticationFreshnessPolicyV1,
              timestamps: serde_json::Value,
          ) -> Result<GitHubTrustedBuilderBindingV1, GitHubTrustedBuilderBindingErrorV1> {
              let receipt = receipt();
              let root_bytes = roots();
              let auth = authentication_policy(raw_sha256(&root_bytes), freshness);
              let execution_policy = execution_policy();
              let plan: GitHubPublicCommandPlanV1 =
                  build_github_public_command_plan_with_execution_policy_v1(
                      &execution_policy,
                      &auth,
                      &receipt,
                      &verifier(),
                      GitObjectIdV1::sha1([0xbb; 20]),
                      "/tmp/mycelix-gh-verify",
                  ).unwrap();
              let stdout = serde_json::to_vec(&vec![candidate(&receipt, timestamps)]).unwrap();
              let execution_receipt = VerifierExecutionReceiptV1 {
                  evidence_version: VERIFIER_EXECUTION_EVIDENCE_VERSION_V1,
                  verifier: verifier(),
                  canonical_receipt_digest: plan.canonical_receipt_digest(),
                  attestation_bundle_digest: digest(4),
                  trust_root_mode: VerifierTrustRootModeV1::OnlineFetchThenRetainedVerifyV1,
                  trusted_root_material_digest: raw_sha256(&root_bytes),
                  trusted_root_acquired_at_unix_seconds: ROOT_ACQUIRED,
                  command_arguments_digest: plan.command_arguments_digest(),
                  environment_profile_digest: plan.environment_profile_digest(),
                  verifier_stdout_digest: github_verifier_stdout_digest_v1(&stdout),
                  verifier_stderr_digest: digest(9),
                  execution_started_at_unix_seconds: EXECUTION_START,
                  execution_completed_at_unix_seconds: EXECUTION_END,
                  process_outcome: VerifierProcessOutcomeV1::ExitCode(0),
                  parsed_result_count: 1,
              };
              let parsed: ParsedGitHubAttestationVerifierOutputV1 =
                  parse_github_attestation_verifier_output_v1(&stdout, &execution_receipt).unwrap();
              let classification: GitHubTrustedRootClassificationV1 =
                  classify_github_default_dual_trusted_root_v1(
                      &root_bytes,
                      &execution_receipt,
                      &execution_policy,
                      &plan,
                  ).unwrap();
              bind_unique_github_trusted_builder_candidate_v1(
                  &receipt,
                  &auth,
                  &trusted_builder_policy(),
                  &parsed,
                  &classification,
              )
          }

          fn public_tlog(timestamp: &str) -> serde_json::Value {
              serde_json::json!({"type":"Tlog","uri":PUBLIC_TLOG,"timestamp":timestamp})
          }

          fn private_tlog(timestamp: &str) -> serde_json::Value {
              serde_json::json!({"type":"Tlog","uri":PRIVATE_TLOG,"timestamp":timestamp})
          }

          fn tsa(timestamp: &str) -> serde_json::Value {
              serde_json::json!({"type":"TimestampAuthority","uri":TSA,"timestamp":timestamp})
          }

          fn binding(
              freshness: AuthenticationFreshnessPolicyV1,
              timestamps: Vec<serde_json::Value>,
          ) -> GitHubTrustedBuilderBindingV1 {
              try_binding(freshness, serde_json::Value::Array(timestamps)).unwrap()
          }

          #[test]
          fn current_at_verification_uses_bound_execution_clock_without_age_claim() {
              let bound = binding(
                  AuthenticationFreshnessPolicyV1::CurrentAtVerification,
                  vec![public_tlog("2026-09-20T00:00:00Z")],
              );
              let current = establish_github_authentication_currentness_v1(&bound).unwrap();
              assert_eq!(current.evaluated_at_unix_seconds(), EXECUTION_END);
              assert!(current.current_trust_material_at_verification());
              assert_eq!(current.age_seconds(), None);
              assert!(current.conservative_witness_time().is_none());
              assert_eq!(
                  current.authority_scope(),
                  GitHubAuthenticationCurrentnessAuthorityV1::CurrentnessEvidenceOnly
              );
              assert!(current.establishes_currentness_evidence());
              assert!(!current.establishes_receipt_authentication());
              assert!(!current.grants_production_authority());
              assert!(!current.grants_application_authority());
          }

          #[test]
          fn exact_age_boundary_passes_and_one_second_over_fails() {
              let exact = binding(
                  AuthenticationFreshnessPolicyV1::MaximumAgeSeconds(3600),
                  vec![public_tlog("2026-09-20T00:00:00Z")],
              );
              let current = establish_github_authentication_currentness_v1(&exact).unwrap();
              assert_eq!(current.age_seconds(), Some(3600));
              assert_eq!(current.conservative_witness_time().unwrap().unix_seconds(), 1_789_862_400);

              let stale = binding(
                  AuthenticationFreshnessPolicyV1::MaximumAgeSeconds(3600),
                  vec![public_tlog("2026-09-19T23:59:59Z")],
              );
              assert_eq!(
                  establish_github_authentication_currentness_v1(&stale),
                  Err(GitHubAuthenticationCurrentnessErrorV1::MaximumAgeExceeded {
                      maximum: 3600,
                      actual: 3601,
                  })
              );
          }

          #[test]
          fn malformed_pre_epoch_and_future_qualified_witnesses_fail_closed() {
              let malformed = binding(
                  AuthenticationFreshnessPolicyV1::MaximumAgeSeconds(7200),
                  vec![public_tlog("not-a-time")],
              );
              assert!(matches!(
                  establish_github_authentication_currentness_v1(&malformed),
                  Err(GitHubAuthenticationCurrentnessErrorV1::MalformedQualifiedWitnessTimestamp { .. })
              ));

              let pre_epoch = binding(
                  AuthenticationFreshnessPolicyV1::MaximumAgeSeconds(u64::MAX),
                  vec![public_tlog("1969-12-31T23:59:59Z")],
              );
              assert!(matches!(
                  establish_github_authentication_currentness_v1(&pre_epoch),
                  Err(GitHubAuthenticationCurrentnessErrorV1::QualifiedWitnessBeforeUnixEpoch { .. })
              ));

              let future = binding(
                  AuthenticationFreshnessPolicyV1::MaximumAgeSeconds(7200),
                  vec![
                      public_tlog("2026-09-20T00:00:00Z"),
                      public_tlog("2026-09-20T01:00:01Z"),
                  ],
              );
              assert!(matches!(
                  establish_github_authentication_currentness_v1(&future),
                  Err(GitHubAuthenticationCurrentnessErrorV1::QualifiedWitnessInFuture { .. })
              ));
          }

          #[test]
          fn fresh_extra_witnesses_cannot_make_old_public_good_evidence_young() {
              let tsa_refresh = binding(
                  AuthenticationFreshnessPolicyV1::MaximumAgeSeconds(3600),
                  vec![
                      public_tlog("2026-09-19T23:00:00Z"),
                      tsa("2026-09-20T00:59:59Z"),
                  ],
              );
              assert_eq!(
                  establish_github_authentication_currentness_v1(&tsa_refresh),
                  Err(GitHubAuthenticationCurrentnessErrorV1::MaximumAgeExceeded {
                      maximum: 3600,
                      actual: 7200,
                  })
              );

              let newer_public = binding(
                  AuthenticationFreshnessPolicyV1::MaximumAgeSeconds(3600),
                  vec![
                      public_tlog("2026-09-19T23:00:00Z"),
                      public_tlog("2026-09-20T00:59:59Z"),
                  ],
              );
              assert_eq!(
                  establish_github_authentication_currentness_v1(&newer_public),
                  Err(GitHubAuthenticationCurrentnessErrorV1::MaximumAgeExceeded {
                      maximum: 3600,
                      actual: 7200,
                  })
              );
          }

          #[test]
          fn private_tlog_cannot_enter_public_good_currentness() {
              let result = try_binding(
                  AuthenticationFreshnessPolicyV1::MaximumAgeSeconds(3600),
                  serde_json::json!([private_tlog("2026-09-20T00:59:59Z")]),
              );
              assert!(matches!(result, Err(GitHubTrustedBuilderBindingErrorV1::NoMatchingCandidate { .. })));
          }

          #[test]
          fn authentication_evidence_digest_is_deterministic_and_policy_sensitive() {
              let a = binding(
                  AuthenticationFreshnessPolicyV1::MaximumAgeSeconds(3600),
                  vec![public_tlog("2026-09-20T00:00:00Z")],
              );
              let b = binding(
                  AuthenticationFreshnessPolicyV1::MaximumAgeSeconds(3600),
                  vec![public_tlog("2026-09-20T00:00:00Z")],
              );
              let c = binding(
                  AuthenticationFreshnessPolicyV1::MaximumAgeSeconds(7200),
                  vec![public_tlog("2026-09-20T00:00:00Z")],
              );
              let ca = establish_github_authentication_currentness_v1(&a).unwrap();
              let cb = establish_github_authentication_currentness_v1(&b).unwrap();
              let cc = establish_github_authentication_currentness_v1(&c).unwrap();
              assert_eq!(ca.authentication_evidence_digest(), cb.authentication_evidence_digest());
              assert_ne!(ca.authentication_evidence_digest(), cc.authentication_evidence_digest());
              assert_ne!(ca.authentication_policy_digest(), cc.authentication_policy_digest());
          }
          RS

      - name: Execute external currentness probes
        shell: bash
        run: |
          set -euo pipefail
          crate="$RUNNER_TEMP/github-auth-currentness-qual"
          evidence="$RUNNER_TEMP/github-auth-currentness-evidence"
          cd "$crate"
          cargo test --locked --test github_authentication_currentness_public_probe -- --nocapture \
            | tee "$evidence/public-currentness-probes.txt"

      - name: Prove currentness cannot convert into authenticated receipt
        shell: bash
        run: |
          set -euo pipefail
          crate="$RUNNER_TEMP/github-auth-currentness-qual"
          evidence="$RUNNER_TEMP/github-auth-currentness-evidence"
          cat > "$crate/tests/no_currentness_to_authentication.rs" <<'RS'
          use proofs_evidence_authentication::{
              AuthenticatedQualificationReceiptV1, GitHubAuthenticationCurrentnessV1,
          };
          fn require_into<T: Into<AuthenticatedQualificationReceiptV1>>() {}
          #[test] fn probe() { require_into::<GitHubAuthenticationCurrentnessV1>(); }
          RS
          set +e
          (cd "$crate" && CARGO_TERM_COLOR=never cargo check --locked --test no_currentness_to_authentication) \
            > "$evidence/no-currentness-to-authentication.stdout.txt" \
            2> "$evidence/no-currentness-to-authentication.stderr.txt"
          status=$?
          set -e
          test "$status" -ne 0
          grep -Fq "AuthenticatedQualificationReceiptV1" "$evidence/no-currentness-to-authentication.stderr.txt"
          grep -Fq "trait bound" "$evidence/no-currentness-to-authentication.stderr.txt"

      - name: Prove currentness cannot be deserialized or default-constructed
        shell: bash
        run: |
          set -euo pipefail
          crate="$RUNNER_TEMP/github-auth-currentness-qual"
          evidence="$RUNNER_TEMP/github-auth-currentness-evidence"
          cat > "$crate/tests/no_currentness_deserialize.rs" <<'RS'
          use proofs_evidence_authentication::GitHubAuthenticationCurrentnessV1;
          #[test] fn probe() {
              let _: GitHubAuthenticationCurrentnessV1 = serde_json::from_str("{}").unwrap();
          }
          RS
          cat > "$crate/tests/no_currentness_default.rs" <<'RS'
          use proofs_evidence_authentication::GitHubAuthenticationCurrentnessV1;
          fn require_default<T: Default>() {}
          #[test] fn probe() { require_default::<GitHubAuthenticationCurrentnessV1>(); }
          RS
          for test_name in no_currentness_deserialize no_currentness_default; do
            set +e
            (cd "$crate" && CARGO_TERM_COLOR=never cargo check --locked --test "$test_name") \
              > "$evidence/$test_name.stdout.txt" 2> "$evidence/$test_name.stderr.txt"
            status=$?
            set -e
            test "$status" -ne 0
            grep -Fq "GitHubAuthenticationCurrentnessV1" "$evidence/$test_name.stderr.txt"
            grep -Fq "trait bound" "$evidence/$test_name.stderr.txt"
          done

      - name: Prove currentness accepts no caller clock
        shell: bash
        run: |
          set -euo pipefail
          crate="$RUNNER_TEMP/github-auth-currentness-qual"
          evidence="$RUNNER_TEMP/github-auth-currentness-evidence"
          cat > "$crate/tests/no_caller_clock.rs" <<'RS'
          use proofs_evidence_authentication::{
              establish_github_authentication_currentness_v1, GitHubTrustedBuilderBindingV1,
          };
          fn probe(binding: &GitHubTrustedBuilderBindingV1) {
              let _ = establish_github_authentication_currentness_v1(binding, 123_u64);
          }
          #[test] fn compile_only() { let _ = probe; }
          RS
          set +e
          (cd "$crate" && CARGO_TERM_COLOR=never cargo check --locked --test no_caller_clock) \
            > "$evidence/no-caller-clock.stdout.txt" 2> "$evidence/no-caller-clock.stderr.txt"
          status=$?
          set -e
          test "$status" -ne 0
          grep -Fq "takes 1 argument" "$evidence/no-caller-clock.stderr.txt"

      - name: Remove qualification-only probes
        shell: bash
        run: rm -rf "$RUNNER_TEMP/github-auth-currentness-qual/tests"

      - name: Warnings-denied Clippy
        shell: bash
        run: |
          set -euo pipefail
          crate="$RUNNER_TEMP/github-auth-currentness-qual"
          evidence="$RUNNER_TEMP/github-auth-currentness-evidence"
          cd "$crate"
          cargo clippy --locked --all-targets -- -D warnings | tee "$evidence/clippy.txt"

      - name: Verify semantic checkout immutability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.subject.outputs.sha }}"
          test -z "$(git status --porcelain)"
          evidence="$RUNNER_TEMP/github-auth-currentness-evidence"
          find mycelix-workspace/mycelix-core/libs/proofs-evidence-authentication \
            -type f -not -path '*/target/*' -print0 | sort -z | xargs -0 sha256sum \
            > "$evidence/source-sha256-post.txt"
          cmp "$evidence/source-sha256.txt" "$evidence/source-sha256-post.txt"

      - name: Write qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/github-auth-currentness-evidence"
          cat > "$evidence/QUALIFICATION.txt" <<EOF
          MYC-ZKP-GH-CURRENTNESS-001AQ PASS
          subject_sha=${{ steps.subject.outputs.sha }}
          semantic_head=$SEMANTIC_HEAD
          authority_scope=CurrentnessEvidenceOnly
          caller_clock_allowed=false
          oldest_qualified_witness_controls_age=true
          malformed_or_future_qualified_witness_rejected=true
          receipt_authentication=false
          production_admission=false
          application_authority=false
          EOF

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: myc-zkp-gh-currentness-001aq-${{ steps.subject.outputs.sha }}
          path: ${{ runner.temp }}/github-auth-currentness-evidence
          if-no-files-found: warn
          retention-days: 30
