name: EMSR dependency hypergraph Go reference verifier

on:
  pull_request:
    paths:
      - "tools/emsr-dependency-hypergraph/**"
      - "tools/emsr-dependency-hypergraph-go-verifier/**"
      - ".github/workflows/emsr-dependency-hypergraph-go-verifier.yml"
  push:
    branches: [main]
    paths:
      - "tools/emsr-dependency-hypergraph/**"
      - "tools/emsr-dependency-hypergraph-go-verifier/**"
      - ".github/workflows/emsr-dependency-hypergraph-go-verifier.yml"

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"
          cache: false
      - name: Format check
        working-directory: tools/emsr-dependency-hypergraph-go-verifier
        run: test -z "$(gofmt -l .)"
      - name: Static analysis
        working-directory: tools/emsr-dependency-hypergraph-go-verifier
        run: go vet ./...
      - name: Cross-language conformance and verifier tests
        working-directory: tools/emsr-dependency-hypergraph-go-verifier
        run: go test -race -count=1 ./...
