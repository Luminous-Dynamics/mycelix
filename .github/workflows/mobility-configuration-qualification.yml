name: Mobility Configuration Qualification

on:
  pull_request:
    paths:
      - 'docs/mobility/MOBILITY_CONFIGURATION_CONTRACT_V1.json'
      - 'docs/mobility/MOBILITY_CONFIGURATION_CONTRACT_V1_TEST_VECTORS.md'
      - 'mycelix-commons/crates/mobility-configuration-qualification/**'
      - 'tools/mobility_qualification_reference.py'
      - 'tools/compare_mobility_qualification.py'
      - '.github/workflows/mobility-configuration-qualification.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/mobility/MOBILITY_CONFIGURATION_CONTRACT_V1.json'
      - 'docs/mobility/MOBILITY_CONFIGURATION_CONTRACT_V1_TEST_VECTORS.md'
      - 'mycelix-commons/crates/mobility-configuration-qualification/**'
      - 'tools/mobility_qualification_reference.py'
      - 'tools/compare_mobility_qualification.py'
      - '.github/workflows/mobility-configuration-qualification.yml'

jobs:
  qualify-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mycelix-commons/crates/mobility-configuration-qualification
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo test
      - name: Emit normalized Rust result
        run: cargo run --quiet --bin mobility-qualification -- ../../../docs/mobility/MOBILITY_CONFIGURATION_CONTRACT_V1.json > /tmp/rust-normalized.json
      - uses: actions/upload-artifact@v4
        with:
          name: mobility-rust-normalized
          path: /tmp/rust-normalized.json
          if-no-files-found: error

  qualify-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Independent reference evaluation
        run: python3 tools/mobility_qualification_reference.py
      - name: Emit normalized reference result
        run: python3 tools/mobility_qualification_reference.py --normalized > /tmp/python-normalized.json
      - uses: actions/upload-artifact@v4
        with:
          name: mobility-python-normalized
          path: /tmp/python-normalized.json
          if-no-files-found: error

  differential:
    runs-on: ubuntu-latest
    needs: [qualify-rust, qualify-reference]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mobility-rust-normalized
          path: /tmp/rust
      - uses: actions/download-artifact@v4
        with:
          name: mobility-python-normalized
          path: /tmp/python
      - name: Compare independent normalized results
        run: python3 tools/compare_mobility_qualification.py /tmp/rust/rust-normalized.json /tmp/python/python-normalized.json
