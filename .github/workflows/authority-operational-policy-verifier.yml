name: Authority Operational Policy Verifier

on:
  pull_request:
    paths:
      - 'crates/mycelix-authority-operational-policy-verifier/**'
      - 'crates/mycelix-authority-state-coverage/**'
      - 'crates/mycelix-authority-state-coverage-context/**'
      - 'crates/mycelix-authority-operational-context/**'
      - '.github/workflows/authority-operational-policy-verifier.yml'
  push:
    branches:
      - 'security/authority-operational-policy-proof-split-v0.1'

permissions:
  contents: read

concurrency:
  group: authority-operational-policy-verifier-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: Split policy record and adoption proof domains
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --manifest-path crates/mycelix-authority-operational-policy-verifier/Cargo.toml -- --check

      - name: Tests
        run: cargo test --manifest-path crates/mycelix-authority-operational-policy-verifier/Cargo.toml --all-targets

      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-authority-operational-policy-verifier/Cargo.toml --all-targets -- -D warnings

      - name: Downstream compatibility
        run: cargo check --manifest-path crates/mycelix-authority-operational-context/Cargo.toml --all-targets

      - name: Policy authority audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('crates/mycelix-authority-operational-policy-verifier/src/lib.rs').read_text()
          inv = Path('crates/mycelix-authority-operational-policy-verifier/INVARIANTS.md').read_text().lower()

          for token in [
              'VerifiedPolicyRecordProof',
              'VerifiedPolicyAdoptionProof',
              'QualifiedCoveragePolicyVerification',
              'QualifiedContextPolicyVerification',
              'qualify_coverage_policy(',
              'qualify_context_policy(',
              'policy.identity_digest()',
              'policy_valid_until_ms > valid_until_ms',
              'to_verified_policy',
          ]:
              assert token in src, token

          record = src.split('pub struct VerifiedPolicyRecordProof {', 1)[1].split('}', 1)[0]
          adoption = src.split('pub struct VerifiedPolicyAdoptionProof {', 1)[1].split('}', 1)[0]
          assert 'verified_authority_ref' not in record
          assert 'verified_policy_proof_ref' not in record
          assert 'authority_verifier_ref' not in record
          assert 'policy_record_ref' not in adoption
          assert 'record_proof_ref' not in adoption
          assert 'record_verifier_ref' not in adoption

          for forbidden in [
              'hdk::',
              '#[hdk_extern]',
              'get_links(',
              'get_details(',
              'create_entry(',
              'call_remote(',
              'QualifiedControlPlaneSubjectFreshness',
              'execute_actions',
              'reputation',
              'model_score',
              'phi',
          ]:
              assert forbidden.lower() not in src.lower(), forbidden

          assert 'policy semantics are not proof of adoption or currentness' in inv
          assert 'record authenticity and institutional adoption are independent' in inv
          assert 'compatibility projection cannot widen verifier validity' in inv
          assert 'positive results are non-deserializable' in inv
          print('PASS: operational policy record authenticity, adoption and currentness remain separate')
          PY
