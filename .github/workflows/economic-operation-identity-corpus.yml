      - "mycelix-finance/benchmarks/finance/economic-effect-profile-template-adversarial-corpus.v0.1.schema.json"
      - "mycelix-workspace/mycelix-finance/benchmarks/finance/economic-effect-profile-template-adversarial-corpus.v0.1.json"
      - "mycelix-workspace/mycelix-finance/benchmarks/finance/economic-effect-profile-template-adversarial-corpus.v0.1.schema.json"
      - "docs/economic/economic-os-effect-role-vocabulary-v0.1.md"
      - "mycelix-workspace/docs/economic/economic-os-effect-role-vocabulary-v0.1.md"
      - "mycelix-workspace/mycelix-finance/benchmarks/finance/economic-operation-identity-corpus.v0.1.json"
      - "mycelix-workspace/mycelix-finance/benchmarks/finance/economic-operation-identity-corpus.v0.1.schema.json"
      - "mycelix-finance/Cargo.toml"
      - "mycelix-finance/Cargo.lock"
      - "mycelix-finance/crates/finance-economic-operation/**"
      - "mycelix-workspace/mycelix-finance/Cargo.toml"
      - "mycelix-workspace/mycelix-finance/Cargo.lock"
      - "mycelix-workspace/mycelix-finance/crates/finance-economic-operation/**"
  push:
    branches:
      - "research/fin-effect-001-durable-operation-identity-v0.1-20261124"
      - "research/fin-effect-004-effect-vector-projection-v0.1-20261124"
      - "research/econ-os-role-profile-presets-v0.1-20261124"
      - "research/econ-sap-execution-profiles-v0.1-20261124"
    paths:
      - ".github/workflows/economic-operation-identity-corpus.yml"
      - "docs/finance/FIN_EFFECT_001_DURABLE_OPERATION_IDENTITY_V0_1.md"
      - "mycelix-workspace/docs/finance/FIN_EFFECT_001_DURABLE_OPERATION_IDENTITY_V0_1.md"
      - "docs/finance/FIN_EFFECT_004_PROFILE_BOUND_EFFECT_VECTOR_V0_1.md"
      - "mycelix-workspace/docs/finance/FIN_EFFECT_004_PROFILE_BOUND_EFFECT_VECTOR_V0_1.md"
      - "mycelix-finance/benchmarks/finance/economic-operation-identity-corpus.v0.1.json"
      - "mycelix-finance/benchmarks/finance/economic-operation-identity-corpus.v0.1.schema.json"
      - "mycelix-finance/benchmarks/finance/economic-effect-vector-corpus.v0.1.json"
      - "mycelix-finance/benchmarks/finance/economic-effect-vector-corpus.v0.1.schema.json"
      - "mycelix-workspace/mycelix-finance/benchmarks/finance/economic-effect-vector-corpus.v0.1.json"
      - "mycelix-workspace/mycelix-finance/benchmarks/finance/economic-effect-vector-corpus.v0.1.schema.json"
      - "mycelix-finance/benchmarks/finance/economic-effect-profile-templates.v0.1.json"
      - "mycelix-finance/benchmarks/finance/economic-effect-profile-templates.v0.1.schema.json"
      - "mycelix-workspace/mycelix-finance/benchmarks/finance/economic-effect-profile-templates.v0.1.json"
      - "mycelix-workspace/mycelix-finance/benchmarks/finance/economic-effect-profile-templates.v0.1.schema.json"
      - "mycelix-finance/benchmarks/finance/economic-effect-profile-templates.v0.2.json"
      - "mycelix-finance/benchmarks/finance/economic-effect-profile-templates.v0.2.schema.json"
      - "mycelix-workspace/mycelix-finance/benchmarks/finance/economic-effect-profile-templates.v0.2.json"
      - "mycelix-workspace/mycelix-finance/benchmarks/finance/economic-effect-profile-templates.v0.2.schema.json"
      - "mycelix-finance/benchmarks/finance/sap-execution-profile-adversarial-corpus.v0.1.json"
      - "mycelix-finance/benchmarks/finance/sap-execution-profile-adversarial-corpus.v0.1.schema.json"
      - "mycelix-workspace/mycelix-finance/benchmarks/finance/sap-execution-profile-adversarial-corpus.v0.1.json"
      - "mycelix-workspace/mycelix-finance/benchmarks/finance/sap-execution-profile-adversarial-corpus.v0.1.schema.json"
      - "docs/economic/sap-execution-profiles-v0.1.md"
      - "mycelix-workspace/docs/economic/sap-execution-profiles-v0.1.md"
      - "mycelix-finance/benchmarks/finance/economic-effect-profile-template-adversarial-corpus.v0.1.json"
      - "mycelix-finance/benchmarks/finance/economic-effect-profile-template-adversarial-corpus.v0.1.schema.json"
      - "mycelix-workspace/mycelix-finance/benchmarks/finance/economic-effect-profile-template-adversarial-corpus.v0.1.json"
      - "mycelix-workspace/mycelix-finance/benchmarks/finance/economic-effect-profile-template-adversarial-corpus.v0.1.schema.json"
      - "docs/economic/economic-os-effect-role-vocabulary-v0.1.md"
      - "mycelix-workspace/docs/economic/economic-os-effect-role-vocabulary-v0.1.md"
      - "mycelix-workspace/mycelix-finance/benchmarks/finance/economic-operation-identity-corpus.v0.1.json"
      - "mycelix-workspace/mycelix-finance/benchmarks/finance/economic-operation-identity-corpus.v0.1.schema.json"
      - "mycelix-finance/Cargo.toml"
      - "mycelix-finance/Cargo.lock"
      - "mycelix-finance/crates/finance-economic-operation/**"
      - "mycelix-workspace/mycelix-finance/Cargo.toml"
      - "mycelix-workspace/mycelix-finance/Cargo.lock"
      - "mycelix-workspace/mycelix-finance/crates/finance-economic-operation/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: economic-operation-identity-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  pure-kernel-and-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact subject and corpus/schema structure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SUBJECT_SHA"
          corpus="mycelix-finance/benchmarks/finance/economic-operation-identity-corpus.v0.1.json"
          schema="mycelix-finance/benchmarks/finance/economic-operation-identity-corpus.v0.1.schema.json"
          doc="docs/finance/FIN_EFFECT_001_DURABLE_OPERATION_IDENTITY_V0_1.md"
          effect_doc="docs/finance/FIN_EFFECT_004_PROFILE_BOUND_EFFECT_VECTOR_V0_1.md"
          jq empty "$corpus"
          jq empty "$schema"
          jq -e '
            .benchmark == "Mycelix durable economic operation identity and evidence projection" and
            .schema_version == "0.1" and
            .issue == 6588 and
            .status == "normative_adversarial_corpus_not_execution_evidence" and
            (.invariants | length) >= 10 and
            (.cases | length) == 33 and
            ([.cases[].id] | unique | length) == 33 and
            all(.cases[];
              (.id | test("^EOP-[0-9]{3}$")) and
              (.surface | type == "string" and length > 0) and
              (.setup | type == "string" and length > 0) and
              (.stimulus | type == "string" and length > 0) and
              (.expected | IN(
                "CommitOnce","ReplayOriginal","SingleEffect","Conflict",
                "Indeterminate","IndeterminateThenReplayOriginal","ClaimPending",
                "ConflictFrozen","CompensatingEffect","RejectNoMutation",
                "ProfileBoundCommit","Pending"
              )) and
              (.max_new_effects | type == "number" and . >= 0 and . <= 1) and
              (.assertions | type == "array" and length > 0)
            ) and
            (.metrics | length) >= 8 and
            ([.metrics[].id] | unique | length) == (.metrics | length) and
            (.known_answer_vectors | length) == 4 and
            ([.known_answer_vectors[].vector_id] | unique | length) == 4 and
            all(.known_answer_vectors[];
              (.algorithm == "BLAKE3-256") and
              (.encoding | type == "string" and length >= 20) and
              (.expected_hex | test("^[0-9a-f]{64}$"))
            ) and
            ([.known_answer_vectors[] | select(.vector_id == "KAT-001") | .expected_hex][0] ==
              "15a08e9c3bf2599c15b37cb700698aec1898cd4c66b15ebf5208568e4953f204") and
            ([.known_answer_vectors[] | select(.vector_id == "KAT-002") | .expected_hex][0] ==
              "6a52f1479b7a407d6de4f2650b61bf3203741c80e28f836db523f58625e62235") and
            ([.known_answer_vectors[] | select(.vector_id == "KAT-003") | .expected_hex][0] ==
              "984fcc30e27b1ccbb5b266f6b0960c5791be3a68ada8512aa0fb39dcf575e56a") and
            ([.known_answer_vectors[] | select(.vector_id == "KAT-004") | .expected_hex][0] ==
              "35ddfe65d8d3beb9ce06fcb1245802d0cc7799d8366bef9087ee5f6d63e6f24b")
          ' "$corpus" >/dev/null

          # Pin the semantic guard cases so a schema-valid corpus cannot weaken
          # its core retry, conflict, unknown-outcome or fork assertions.
          jq -e '
            def case_by_id($id): [.cases[] | select(.id == $id)][0];
            (case_by_id("EOP-003").expected == "SingleEffect") and
            (case_by_id("EOP-003").max_new_effects == 1) and
            (case_by_id("EOP-004").expected == "Conflict") and
            (case_by_id("EOP-004").max_new_effects == 0) and
            (case_by_id("EOP-013").max_new_effects == 0) and
            (case_by_id("EOP-016").expected == "Indeterminate") and
            (case_by_id("EOP-017").expected == "ConflictFrozen") and
            (case_by_id("EOP-020").expected == "CompensatingEffect") and
            (case_by_id("EOP-024").expected == "Indeterminate") and
            (case_by_id("EOP-028").expected == "Pending") and
            (case_by_id("EOP-031").expected == "ReplayOriginal") and
            (case_by_id("EOP-032").max_new_effects == 0) and
            (case_by_id("EOP-033").expected == "Indeterminate")
          ' "$corpus" >/dev/null

          grep -q "does not claim" "$doc"
          grep -q "same operation ID + different fingerprint" "$doc"
          grep -q "global exactly-once" "$doc"
          grep -q "Canonical claim-profile digest v1" "$effect_doc"
          grep -q "5ad833aef24a53646218b7fbe43fb1d3314563b165a0233898e5a96b4e1f8e4c" "$effect_doc"
          cmp mycelix-finance/Cargo.toml mycelix-workspace/mycelix-finance/Cargo.toml
          cmp mycelix-finance/Cargo.lock mycelix-workspace/mycelix-finance/Cargo.lock
          cmp mycelix-finance/crates/finance-economic-operation/Cargo.toml mycelix-workspace/mycelix-finance/crates/finance-economic-operation/Cargo.toml
          cmp mycelix-finance/crates/finance-economic-operation/src/lib.rs mycelix-workspace/mycelix-finance/crates/finance-economic-operation/src/lib.rs
          cmp docs/economic/economic-os-effect-role-vocabulary-v0.1.md mycelix-workspace/docs/economic/economic-os-effect-role-vocabulary-v0.1.md
          cmp mycelix-finance/benchmarks/finance/economic-effect-profile-templates.v0.1.json mycelix-workspace/mycelix-finance/benchmarks/finance/economic-effect-profile-templates.v0.1.json
          cmp mycelix-finance/benchmarks/finance/economic-effect-profile-templates.v0.1.schema.json mycelix-workspace/mycelix-finance/benchmarks/finance/economic-effect-profile-templates.v0.1.schema.json
          cmp mycelix-finance/benchmarks/finance/economic-effect-profile-templates.v0.2.json mycelix-workspace/mycelix-finance/benchmarks/finance/economic-effect-profile-templates.v0.2.json
          cmp mycelix-finance/benchmarks/finance/economic-effect-profile-templates.v0.2.schema.json mycelix-workspace/mycelix-finance/benchmarks/finance/economic-effect-profile-templates.v0.2.schema.json
          cmp mycelix-finance/benchmarks/finance/sap-execution-profile-adversarial-corpus.v0.1.json mycelix-workspace/mycelix-finance/benchmarks/finance/sap-execution-profile-adversarial-corpus.v0.1.json
          cmp mycelix-finance/benchmarks/finance/sap-execution-profile-adversarial-corpus.v0.1.schema.json mycelix-workspace/mycelix-finance/benchmarks/finance/sap-execution-profile-adversarial-corpus.v0.1.schema.json
          cmp docs/economic/sap-execution-profiles-v0.1.md mycelix-workspace/docs/economic/sap-execution-profiles-v0.1.md
          cmp mycelix-finance/benchmarks/finance/economic-effect-profile-template-adversarial-corpus.v0.1.json mycelix-workspace/mycelix-finance/benchmarks/finance/economic-effect-profile-template-adversarial-corpus.v0.1.json
          cmp mycelix-finance/benchmarks/finance/economic-effect-profile-template-adversarial-corpus.v0.1.schema.json mycelix-workspace/mycelix-finance/benchmarks/finance/economic-effect-profile-template-adversarial-corpus.v0.1.schema.json
          cmp docs/finance/FIN_EFFECT_001_DURABLE_OPERATION_IDENTITY_V0_1.md mycelix-workspace/docs/finance/FIN_EFFECT_001_DURABLE_OPERATION_IDENTITY_V0_1.md
          cmp docs/finance/FIN_EFFECT_004_PROFILE_BOUND_EFFECT_VECTOR_V0_1.md mycelix-workspace/docs/finance/FIN_EFFECT_004_PROFILE_BOUND_EFFECT_VECTOR_V0_1.md
          cmp mycelix-finance/benchmarks/finance/economic-operation-identity-corpus.v0.1.json mycelix-workspace/mycelix-finance/benchmarks/finance/economic-operation-identity-corpus.v0.1.json
          cmp mycelix-finance/benchmarks/finance/economic-operation-identity-corpus.v0.1.schema.json mycelix-workspace/mycelix-finance/benchmarks/finance/economic-operation-identity-corpus.v0.1.schema.json
          {
            echo "subject_commit=$(git rev-parse HEAD)"
            echo "corpus_sha256=$(sha256sum "$corpus" | cut -d' ' -f1)"
            echo "schema_sha256=$(sha256sum "$schema" | cut -d' ' -f1)"
            echo "case_count=$(jq '.cases | length' "$corpus")"
            echo "known_answer_vector_count=$(jq '.known_answer_vectors | length' "$corpus")"
            echo "known_answer_vectors_sha256=$(jq -c '.known_answer_vectors' "$corpus" | sha256sum | cut -d' ' -f1)"
            echo "unique_case_ids=$(jq '[.cases[].id] | unique | length' "$corpus")"
            echo "invariant_count=$(jq '.invariants | length' "$corpus")"
            echo "metric_count=$(jq '.metrics | length' "$corpus")"
            echo "kernel_manifest_sha256=$(sha256sum mycelix-finance/crates/finance-economic-operation/Cargo.toml | cut -d' ' -f1)"
            echo "kernel_source_sha256=$(sha256sum mycelix-finance/crates/finance-economic-operation/src/lib.rs | cut -d' ' -f1)"
            echo "finance_lock_sha256=$(sha256sum mycelix-finance/Cargo.lock | cut -d' ' -f1)"
            effect_vector_corpus="mycelix-finance/benchmarks/finance/economic-effect-vector-corpus.v0.1.json"
            effect_vector_schema="mycelix-finance/benchmarks/finance/economic-effect-vector-corpus.v0.1.schema.json"
            echo "effect_vector_corpus_sha256=$(sha256sum "$effect_vector_corpus" | cut -d' ' -f1)"
            echo "effect_vector_schema_sha256=$(sha256sum "$effect_vector_schema" | cut -d' ' -f1)"
            echo "effect_vector_case_count=$(jq '.cases | length' "$effect_vector_corpus")"
            echo "claim_profile_kat_sha256=$(jq -c '.known_answer_vectors' "$effect_vector_corpus" | sha256sum | cut -d' ' -f1)"
            role_catalogue="mycelix-finance/benchmarks/finance/economic-effect-profile-templates.v0.1.json"
            role_corpus="mycelix-finance/benchmarks/finance/economic-effect-profile-template-adversarial-corpus.v0.1.json"
            role_schema="mycelix-finance/benchmarks/finance/economic-effect-profile-template-adversarial-corpus.v0.1.schema.json"
            echo "economic_role_catalogue_sha256=$(sha256sum "$role_catalogue" | cut -d' ' -f1)"
            echo "economic_role_count=$(jq '.role_registry | length' "$role_catalogue")"
            echo "economic_template_count=$(jq '.templates | length' "$role_catalogue")"
            echo "template_boundary_corpus_sha256=$(sha256sum "$role_corpus" | cut -d' ' -f1)"
            echo "template_boundary_schema_sha256=$(sha256sum "$role_schema" | cut -d' ' -f1)"
            echo "template_boundary_case_count=$(jq '.cases | length' "$role_corpus")"
            echo "claim=corpus structural validation plus pure Rust kernel tests; no Holochain/runtime or global uniqueness proof"
          } | tee "$RUNNER_TEMP/economic-operation-identity-manifest.txt"
          cat "$RUNNER_TEMP/economic-operation-identity-manifest.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate profile-bound effect-vector corpus
        shell: bash
        run: |
          set -euo pipefail
          corpus="mycelix-finance/benchmarks/finance/economic-effect-vector-corpus.v0.1.json"
          schema="mycelix-finance/benchmarks/finance/economic-effect-vector-corpus.v0.1.schema.json"
          jq empty "$corpus"
          jq empty "$schema"
          jq -e '
            .benchmark == "FIN-EFFECT-004 Profile-Bound Economic Effect Vector Projection" and
            .issue == 6608 and
            .status == "normative_adversarial_corpus_not_execution_evidence" and
            .composition.no_new_operation_or_effect_identity_algorithm == true and
            .composition.claim_profile_digest.schema_version == 1 and
            ([.known_answer_vectors[] | select(.vector_id == "KAT-VEC-001") | .expected_hex][0] ==
              "5ad833aef24a53646218b7fbe43fb1d3314563b165a0233898e5a96b4e1f8e4c") and
            .aggregation_precedence == ["Conflict","Indeterminate","Pending","SupportedWithinDeclaredScope"] and
            (.cases | length == 16) and
            ([.cases[].id] | unique | length == 16) and
            (.metrics | map(.id) | unique | length) == (.metrics | length) and
            ([.cases[] | select(.id == "VEC-002") | .expected][0] == "Pending") and
            ([.cases[] | select(.id == "VEC-004") | .expected][0] == "Indeterminate") and
            ([.cases[] | select(.id == "VEC-006") | .expected][0] == "Conflict") and
            ([.cases[] | select(.id == "VEC-010") | .expected][0] == "Pending") and
            ([.cases[] | select(.id == "VEC-016") | .expected][0] == "Conflict")
          ' "$corpus" >/dev/null
          cmp "$corpus" "mycelix-workspace/$corpus"
          cmp "$schema" "mycelix-workspace/$schema"
          echo "16 effect-vector adversarial cases validated; targets are not execution evidence."

      - name: Validate Economic OS role registry and claim templates
        shell: bash
        run: |
          set -euo pipefail
          catalogue="mycelix-finance/benchmarks/finance/economic-effect-profile-templates.v0.1.json"
          schema="mycelix-finance/benchmarks/finance/economic-effect-profile-templates.v0.1.schema.json"
          jq empty "$catalogue"
          jq empty "$schema"
          jq -e '
            .issue == 6612 and
            .status == "research_templates_not_policy_or_authority" and
            .composition.no_replacement_identity_algorithm == true and
            .composition.legacy_role_strings_preserved == true and
            (.role_registry | unique | length == length) and
            (.templates | length == 9) and
            (.templates | map(.id) | unique | length == length) and
            (.role_registry) as $roles |
            all(.templates[];
              .required_role_count == (.required_roles | length) and
              ((.required_roles | sort) == ([.owner_slots[][0]] | sort)) and
              ((.required_roles - $roles) | length == 0)
            )
          ' "$catalogue" >/dev/null
          cmp "$catalogue" "mycelix-workspace/$catalogue"
          cmp "$schema" "mycelix-workspace/$schema"
          echo "Validated nine Economic OS claim templates and role bindings; templates are not policy authority."

      - name: Validate Economic OS claim template adversarial corpus
        shell: bash
        run: |
          set -euo pipefail
          corpus="mycelix-finance/benchmarks/finance/economic-effect-profile-template-adversarial-corpus.v0.1.json"
          schema="mycelix-finance/benchmarks/finance/economic-effect-profile-template-adversarial-corpus.v0.1.schema.json"
          jq empty "$corpus"
          jq empty "$schema"
          jq -e '
            .issue == 6612 and
            .status == "proposed_synthetic_template_boundary_corpus_not_execution_evidence" and
            .case_count == 24 and
            (.cases | length == 24) and
            (.cases | map(.id) | unique | length == 24) and
            (.metrics | map(.id)) as $metric_ids |
            ($metric_ids | unique | length) == ($metric_ids | length) and
            (.dispositions) as $dispositions |
            all(.cases[]; .expected as $expected | ($dispositions | index($expected)) != null) and
            ([.cases[] | select(.id == "TPL-001") | .expected][0] == "Pending") and
            ([.cases[] | select(.id == "TPL-003") | .expected][0] == "RejectedInput") and
            ([.cases[] | select(.id == "TPL-016") | .expected][0] == "Pending") and
            ([.cases[] | select(.id == "TPL-020") | .expected][0] == "RejectedPromotion") and
            ([.cases[] | select(.id == "TPL-023") | .expected][0] == "Conflict")
          ' "$corpus" >/dev/null
          cmp "$corpus" "mycelix-workspace/$corpus"
          cmp "$schema" "mycelix-workspace/$schema"
          echo "Validated 24 semantic boundary cases; cases are synthetic targets, not runtime evidence."

      - name: Validate Economic OS role template documentation
        shell: bash
        run: |
          set -euo pipefail
          doc="docs/economic/economic-os-effect-role-vocabulary-v0.1.md"
          grep -q "nine versioned EconomicClaimTemplateV1 presets" "$doc"
          grep -q "Existing Finance v1 strings are frozen" "$doc"
          grep -q "A template is a reusable shape, not a pre-approved claim profile" "$doc"

      - name: Validate explicit SAP execution profile catalogue
        shell: bash
        run: |
          set -euo pipefail
          catalogue="mycelix-finance/benchmarks/finance/economic-effect-profile-templates.v0.2.json"
          schema="mycelix-finance/benchmarks/finance/economic-effect-profile-templates.v0.2.schema.json"
          jq empty "$catalogue"
          jq empty "$schema"
          jq -e '
            .execution_profiles as $profiles |
            (.issue == 6634) and
            (.version == "0.2") and
            (.status == "research_execution_profiles_not_authority_or_runtime_proof") and
            ((.role_registry | length) == 60) and
            ((.role_registry | unique | length) == (.role_registry | length)) and
            (($profiles | length) == 3) and
            (($profiles | map(.profile_id) | unique | length) == 3) and
            (($profiles | map(.execution_profile) | unique | length) == 3) and
            all($profiles[];
              ((.required_roles | length) == (.owner_slots | length)) and
              ((.required_roles | sort) == ([.owner_slots[][0]] | sort))
            ) and
            ([ $profiles[] | select(.execution_profile == "LocalAtomicPrincipalTransferV1") | .required_roles ] | first == ["finance.local_atomic_payment_transaction"]) and
            ([ $profiles[] | select(.execution_profile == "LocalAtomicTransferTreasuryReconciledV1") | .required_roles ] | first == ["finance.local_atomic_payment_transaction","treasury_fee"]) and
            ([ $profiles[] | select(.execution_profile == "OwnerAuthenticatedBilateralTransferV1") | .required_roles ] | first == ["payer_debit","beneficiary_claim"])
          ' "$catalogue" >/dev/null
          cmp "$catalogue" "mycelix-workspace/$catalogue"
          cmp "$schema" "mycelix-workspace/$schema"

      - name: Validate SAP execution-profile adversarial corpus
        shell: bash
        run: |
          set -euo pipefail
          corpus="mycelix-finance/benchmarks/finance/sap-execution-profile-adversarial-corpus.v0.1.json"
          schema="mycelix-finance/benchmarks/finance/sap-execution-profile-adversarial-corpus.v0.1.schema.json"
          jq empty "$corpus"
          jq empty "$schema"
          jq -e '
            .issue == 6634 and
            .status == "synthetic_execution_profile_conformance_cases_not_runtime_evidence" and
            .case_count == 15 and
            (.cases | length == 15) and
            (.cases | map(.id) | unique | length == 15) and
            (.metrics | map(.id)) as $metric_ids |
            (($metric_ids | unique | length) == ($metric_ids | length)) and
            ([.cases[] | select(.id == "SAP-EP-003") | .expected] | first == "Indeterminate") and
            ([.cases[] | select(.id == "SAP-EP-004") | .expected] | first == "Pending") and
            ([.cases[] | select(.id == "SAP-EP-010") | .expected] | first == "Conflict") and
            ([.cases[] | select(.id == "SAP-EP-011") | .expected] | first == "RejectedInput") and
            ([.cases[] | select(.id == "SAP-EP-012") | .expected] | first == "RejectedInput")
          ' "$corpus" >/dev/null
          cmp "$corpus" "mycelix-workspace/$corpus"
          cmp "$schema" "mycelix-workspace/$schema"
          echo "Validated three explicit SAP execution profiles and 15 synthetic boundary cases; no runtime or settlement claim."

      - name: Validate SAP execution profile documentation
        shell: bash
        run: |
          set -euo pipefail
          doc="docs/economic/sap-execution-profiles-v0.1.md"
          grep -q "Single-author local atomic principal transfer" "$doc"
          grep -q "Owner-authenticated bilateral transfer" "$doc"
          grep -q "Missing or incomplete DHT evidence is Indeterminate" "$doc"
          grep -q "This pure layer does not prove" "$doc"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy

      - name: Check standalone/workspace mirror parity
        shell: bash
        run: |
          set -euo pipefail
          cmp mycelix-finance/Cargo.toml mycelix-workspace/mycelix-finance/Cargo.toml
          cmp mycelix-finance/Cargo.lock mycelix-workspace/mycelix-finance/Cargo.lock
          cmp mycelix-finance/crates/finance-economic-operation/Cargo.toml mycelix-workspace/mycelix-finance/crates/finance-economic-operation/Cargo.toml
          cmp mycelix-finance/crates/finance-economic-operation/src/lib.rs mycelix-workspace/mycelix-finance/crates/finance-economic-operation/src/lib.rs

      - name: Rust formatting
        run: cargo fmt --manifest-path mycelix-finance/crates/finance-economic-operation/Cargo.toml -- --check

      - name: Diagnose canonical Cargo lock resolution
        shell: bash
        run: |
          set -euo pipefail
          before="$RUNNER_TEMP/Cargo.lock.before"
          cp mycelix-finance/Cargo.lock "$before"
          # Deliberately omit --locked for this diagnostic only. Cargo prints the
          # canonical lockfile it expects; fail if that differs so no uncommitted
          # lock rewrite is silently used as qualification evidence.
          cargo metadata --manifest-path mycelix-finance/Cargo.toml --format-version 1 > "$RUNNER_TEMP/cargo-metadata.json"
          if ! cmp -s "$before" mycelix-finance/Cargo.lock; then
            echo "Cargo requires a canonical lockfile update; this run is diagnostic, not a test pass."
            diff -u "$before" mycelix-finance/Cargo.lock || true
            exit 42
          fi

      - name: Pure identity/evidence kernel tests
        run: cargo test --manifest-path mycelix-finance/Cargo.toml -p finance-economic-operation --locked

      - name: Strict kernel Clippy
        run: cargo clippy --manifest-path mycelix-finance/Cargo.toml -p finance-economic-operation --all-targets --no-deps --locked -- -D warnings

      - name: Upload exact-subject corpus manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: economic-operation-identity-corpus-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/economic-operation-identity-manifest.txt
          if-no-files-found: error
          retention-days: 30
