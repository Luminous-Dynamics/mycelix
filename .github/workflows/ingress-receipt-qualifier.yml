name: Ingress receipt time qualifier

on:
  push:
    paths:
      - "research/ingress-receipt-qualifier/**"
      - ".github/workflows/ingress-receipt-qualifier.yml"
  pull_request:
    paths:
      - "research/ingress-receipt-qualifier/**"
      - ".github/workflows/ingress-receipt-qualifier.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingress-receipt-qualifier:
    name: Synthetic ingress receipt qualifier
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.96.1 fmt --manifest-path research/ingress-receipt-qualifier/Cargo.toml --all -- --check
      - name: Run tests
        run: cargo +1.96.1 test --manifest-path research/ingress-receipt-qualifier/Cargo.toml --all-targets
      - name: Run strict Clippy
        run: cargo +1.96.1 clippy --manifest-path research/ingress-receipt-qualifier/Cargo.toml --all-targets -- -D warnings
      - name: Run frozen corpus CLI
        run: cargo +1.96.1 run --manifest-path research/ingress-receipt-qualifier/Cargo.toml --bin ingress-receipt-qualifier
