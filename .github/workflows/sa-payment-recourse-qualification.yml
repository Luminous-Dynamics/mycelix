name: South African Payment Recourse Qualification

on:
  pull_request:
    paths:
      - 'mycelix-finance/docs/SA_PAYMENT_RECOURSE_PROFILE_V1.md'
      - 'mycelix-finance/docs/sa-payment-recourse-corpus-v1.*'
      - 'mycelix-workspace/mycelix-finance/docs/SA_PAYMENT_RECOURSE_PROFILE_V1.md'
      - 'mycelix-workspace/mycelix-finance/docs/sa-payment-recourse-corpus-v1.*'
      - 'tools/finance/sa-payment-recourse-evaluator/**'
      - '.github/workflows/sa-payment-recourse-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-finance/docs/SA_PAYMENT_RECOURSE_PROFILE_V1.md'
      - 'mycelix-finance/docs/sa-payment-recourse-corpus-v1.*'
      - 'tools/finance/sa-payment-recourse-evaluator/**'
      - '.github/workflows/sa-payment-recourse-qualification.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.0
      - name: Format
        run: cargo fmt --manifest-path tools/finance/sa-payment-recourse-evaluator/Cargo.toml -- --check
      - name: Unit and schema tests
        run: cargo test --manifest-path tools/finance/sa-payment-recourse-evaluator/Cargo.toml
      - name: Negative mutation campaign
        run: cargo run --manifest-path tools/finance/sa-payment-recourse-evaluator/Cargo.toml -- --self-test
      - name: Clippy
        run: cargo clippy --manifest-path tools/finance/sa-payment-recourse-evaluator/Cargo.toml --all-targets -- -D warnings
