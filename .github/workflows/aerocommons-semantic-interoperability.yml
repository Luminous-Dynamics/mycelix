name: AeroCommons Semantic Interoperability

on:
  pull_request:
    paths:
      - "tools/aero-semantic-interoperability/**"
      - "fixtures/aero-semantic-interop/**"
      - "docs/aerocommons/AERO_SEMANTIC_ASSERTION_V1.schema.json"
      - ".github/workflows/aerocommons-semantic-interoperability.yml"
  push:
    branches:
      - "research/aerocommons-semantic-interop-001"
    paths:
      - "tools/aero-semantic-interoperability/**"
      - "fixtures/aero-semantic-interop/**"
      - "docs/aerocommons/AERO_SEMANTIC_ASSERTION_V1.schema.json"
      - ".github/workflows/aerocommons-semantic-interoperability.yml"

permissions:
  contents: read

jobs:
  semantic-assertions:
    name: Assertion parity and mutation replay
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run semantic assertion tests
        run: cargo test --manifest-path tools/aero-semantic-interoperability/Cargo.toml
