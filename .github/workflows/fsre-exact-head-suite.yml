name: FSRE exact-head qualification suite

on:
  pull_request:
    paths:
      - "tools/fsre-*/**"
      - "research/fsre/**"
      - ".github/workflows/fsre-exact-head-suite.yml"
  push:
    branches:
      - main
      - research/fsre-federated-resilience-v0.1
    paths:
      - "tools/fsre-*/**"
      - "research/fsre/**"
      - ".github/workflows/fsre-exact-head-suite.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crate:
    name: ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - fsre-decision-value
          - fsre-decision-time-replay
          - fsre-assurance-composer
          - fsre-asof-portfolio-oracle
          - fsre-asof-portfolio-composer
          - fsre-asof-evidence-oracle
          - fsre-asof-evidence
          - fsre-flow-balance
          - fsre-green-drop-replay
          - fsre-identity-crosswalk
          - fsre-portfolio-oracle
          - fsre-portfolio-reference
          - fsre-recovery-qualification
          - fsre-recovery-reference
          - fsre-resource-stock-flow
          - fsre-resource-stock-flow-oracle
          - fsre-service-trajectory
          - fsre-source-register
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - name: Validate FSRE JSON contracts and examples
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from datetime import datetime
          from pathlib import Path

          def accepts(value, expected):
              types = expected if isinstance(expected, list) else [expected]
              for kind in types:
                  if kind == "object" and isinstance(value, dict):
                      return True
                  if kind == "array" and isinstance(value, list):
                      return True
                  if kind == "string" and isinstance(value, str):
                      return True
                  if kind == "boolean" and isinstance(value, bool):
                      return True
                  if kind == "integer" and isinstance(value, int) and not isinstance(value, bool):
                      return True
                  if kind == "number" and isinstance(value, (int, float)) and not isinstance(value, bool):
                      return True
                  if kind == "null" and value is None:
                      return True
              return False

          def validate(node, value, path="$"):
              if "type" in node:
                  assert accepts(value, node["type"]), f"{path}: expected {node['type']}"
              if "const" in node:
                  assert value == node["const"], f"{path}: const mismatch"
              if "enum" in node:
                  assert value in node["enum"], f"{path}: enum mismatch"
              if isinstance(value, str):
                  if "minLength" in node:
                      assert len(value) >= node["minLength"], f"{path}: too short"
                  if "maxLength" in node:
                      assert len(value) <= node["maxLength"], f"{path}: too long"
                  if "pattern" in node:
                      assert re.fullmatch(node["pattern"], value), f"{path}: pattern mismatch"
                  if node.get("format") == "date-time":
                      datetime.fromisoformat(value.replace("Z", "+00:00"))
              if isinstance(value, (int, float)) and not isinstance(value, bool):
                  if "minimum" in node:
                      assert value >= node["minimum"], f"{path}: below minimum"
              if isinstance(value, dict):
                  for key in node.get("required", []):
                      assert key in value, f"{path}: missing {key}"
                  if node.get("additionalProperties") is False:
                      allowed = set(node.get("properties", {}))
                      assert set(value) <= allowed, f"{path}: unexpected properties"
                  for key, child in node.get("properties", {}).items():
                      if key in value:
                          validate(child, value[key], f"{path}.{key}")
              if isinstance(value, list):
                  if "minItems" in node:
                      assert len(value) >= node["minItems"], f"{path}: too few items"
                  if node.get("uniqueItems"):
                      assert len({json.dumps(item, sort_keys=True) for item in value}) == len(value), f"{path}: duplicate items"
                  if "items" in node:
                      for index, item in enumerate(value):
                          validate(node["items"], item, f"{path}[{index}]")

          pairs = [
              (
                  "research/fsre/schemas/claim-qualification-envelope-v0.2.schema.json",
                  [
                      "research/fsre/examples/claim-envelope.synthetic-asof-telemetry-v0.2.json",
                      "research/fsre/examples/claim-envelope.synthetic-recovery-v0.2.json",
                  ],
              ),
              (
                  "research/fsre/schemas/water-service-study-manifest-v0.1.schema.json",
                  ["research/fsre/examples/water-service-study-manifest.synthetic-v0.1.json"],
              ),
          ]
          for schema_path, example_paths in pairs:
              schema = json.loads(Path(schema_path).read_text())
              for example_path in example_paths:
                  document = json.loads(Path(example_path).read_text())
                  validate(schema, document, example_path)
          print("FSRE claim and water-study examples: structural contract checks passed")
          PY
      - name: Check formatting
        run: cargo fmt --manifest-path tools/${{ matrix.crate }}/Cargo.toml --all -- --check
      - name: Run locked offline tests
        run: cargo test --locked --offline --manifest-path tools/${{ matrix.crate }}/Cargo.toml
      - name: Run Clippy
        run: cargo clippy --locked --offline --manifest-path tools/${{ matrix.crate }}/Cargo.toml --all-targets -- -D warnings
