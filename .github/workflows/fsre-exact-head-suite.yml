name: FSRE exact-head qualification suite

on:
  pull_request:
    paths:
      - "tools/fsre-*/**"
      - "research/fsre/**"
      - ".github/workflows/fsre-exact-head-suite.yml"
  push:
    branches:
      - main
    paths:
      - "tools/fsre-*/**"
      - "research/fsre/**"
      - ".github/workflows/fsre-exact-head-suite.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crate:
    name: ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - fsre-decision-value
          - fsre-decision-time-replay
          - fsre-assurance-composer
          - fsre-asof-portfolio-oracle
          - fsre-asof-portfolio-composer
          - fsre-asof-evidence-oracle
          - fsre-asof-evidence
          - fsre-flow-balance
          - fsre-green-drop-replay
          - fsre-identity-crosswalk
          - fsre-portfolio-oracle
          - fsre-portfolio-reference
          - fsre-recovery-qualification
          - fsre-recovery-reference
          - fsre-resource-stock-flow
          - fsre-resource-stock-flow-oracle
          - fsre-service-trajectory
          - fsre-source-register
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - name: Validate FSRE JSON contracts and examples
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          schema_path = Path("research/fsre/schemas/claim-qualification-envelope-v0.2.schema.json")
          schema = json.loads(schema_path.read_text())

          examples = [
              Path("research/fsre/examples/claim-envelope.synthetic-asof-telemetry-v0.2.json"),
              Path("research/fsre/examples/claim-envelope.synthetic-recovery-v0.2.json"),
          ]

          def validate(node, value, path="$"):
              expected = node.get("type")
              if expected == "object":
                  assert isinstance(value, dict), f"{path}: expected object"
                  for key in node.get("required", []):
                      assert key in value, f"{path}: missing {key}"
                  if node.get("additionalProperties") is False:
                      allowed = set(node.get("properties", {}))
                      assert set(value) <= allowed, f"{path}: unexpected properties"
                  for key, child in node.get("properties", {}).items():
                      if key in value:
                          validate(child, value[key], f"{path}.{key}")
              elif expected == "array":
                  assert isinstance(value, list), f"{path}: expected array"
                  if "items" in node:
                      for index, item in enumerate(value):
                          validate(node["items"], item, f"{path}[{index}]")
              elif expected == "string":
                  assert isinstance(value, str), f"{path}: expected string"
              elif expected == "boolean":
                  assert isinstance(value, bool), f"{path}: expected boolean"
              elif expected == "integer":
                  assert isinstance(value, int) and not isinstance(value, bool), f"{path}: expected integer"
              elif expected == "number":
                  assert isinstance(value, (int, float)) and not isinstance(value, bool), f"{path}: expected number"
              elif expected == "null":
                  assert value is None, f"{path}: expected null"
              if "const" in node:
                  assert value == node["const"], f"{path}: const mismatch"
              if "enum" in node:
                  assert value in node["enum"], f"{path}: enum mismatch"

          for path in examples:
              document = json.loads(path.read_text())
              validate(schema, document, path.as_posix())
          print("claim-envelope v0.2 examples: structural contract checks passed")
          PY
      - name: Check formatting
        run: cargo fmt --manifest-path tools/${{ matrix.crate }}/Cargo.toml --all -- --check
      - name: Run locked offline tests
        run: cargo test --locked --offline --manifest-path tools/${{ matrix.crate }}/Cargo.toml
      - name: Run Clippy
        run: cargo clippy --locked --offline --manifest-path tools/${{ matrix.crate }}/Cargo.toml --all-targets -- -D warnings
