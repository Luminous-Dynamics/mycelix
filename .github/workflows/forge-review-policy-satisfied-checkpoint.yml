name: Forge Review Policy Satisfied Checkpoint

on:
  pull_request:
    paths:
      - 'crates/mycelix-forge-review-policy-satisfied-checkpoint/**'
      - 'crates/mycelix-forge-policy-bound-checkpoint/**'
      - 'crates/mycelix-forge-review-acceptance-policy/**'
      - 'crates/mycelix-forge-review-policy-adoption/**'
      - 'crates/mycelix-forge-authority/**'
      - '.github/workflows/forge-review-policy-satisfied-checkpoint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: rustfmt
        working-directory: crates/mycelix-forge-review-policy-satisfied-checkpoint
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: crates/mycelix-forge-review-policy-satisfied-checkpoint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: tests
        working-directory: crates/mycelix-forge-review-policy-satisfied-checkpoint
        run: cargo test --all-features
