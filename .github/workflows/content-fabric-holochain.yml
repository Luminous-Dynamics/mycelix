name: Content Fabric Holochain CI

on:
  pull_request:
    paths:
      - 'mycelix-content-fabric/**'
      - 'docs/content-fabric/HOLOCHAIN_COORDINATION_V1.md'
      - '.github/workflows/content-fabric-holochain.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-content-fabric/**'
      - 'docs/content-fabric/HOLOCHAIN_COORDINATION_V1.md'
      - '.github/workflows/content-fabric-holochain.yml'

permissions:
  contents: read

concurrency:
  group: content-fabric-holochain-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  holochain-coordination:
    name: CF-05 Holochain coordination
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-content-fabric
      - name: Check formatting
        run: cargo fmt --manifest-path mycelix-content-fabric/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path mycelix-content-fabric/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path mycelix-content-fabric/Cargo.toml --workspace --all-targets
      - name: Check WASM release build
        run: cargo check --manifest-path mycelix-content-fabric/Cargo.toml --workspace --target wasm32-unknown-unknown --release
