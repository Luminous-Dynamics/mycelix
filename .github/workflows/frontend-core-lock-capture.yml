name: Frontend Core Lock Capture

on:
  push:
    branches:
      - fix/frontend-ui-source-closure-v2
    paths:
      - '.github/workflows/frontend-core-lock-capture.yml'

permissions:
  contents: write
  actions: read

jobs:
  capture-exact-locks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download exact immutability artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            /repos/${GITHUB_REPOSITORY}/actions/artifacts/10370999948/zip \
            > "$RUNNER_TEMP/frontend-locks.zip"
          mkdir -p "$RUNNER_TEMP/frontend-locks-artifact"
          unzip -q "$RUNNER_TEMP/frontend-locks.zip" -d "$RUNNER_TEMP/frontend-locks-artifact"

      - name: Verify exact lockfile artifact hashes
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/frontend-locks-artifact/frontend-locks/crates"
          echo '5489ef0583d888aa1ef896b80fb98c167e85288916c57a3d5e7537d782f554d6  '"$root/mycelix-leptos-client/Cargo.lock" | sha256sum -c -
          echo '380d2e03791ae8dddb4d55a6860fc4de242b9692ce4317ed4ff2c97a130fe34f  '"$root/mycelix-leptos-core/Cargo.lock" | sha256sum -c -
          echo 'c58c63c779c440b54387f06ed0640c3b202cd72778a0fd38d239fa4bc93c6626  '"$root/mycelix-leptos-ui/Cargo.lock" | sha256sum -c -

      - name: Install exact lockfiles into source closure
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/frontend-locks-artifact/frontend-locks/crates"
          for crate in mycelix-leptos-client mycelix-leptos-core mycelix-leptos-ui; do
            test ! -e "crates/$crate/Cargo.lock" || {
              echo "::error file=crates/$crate/Cargo.lock::Refusing to overwrite an existing lockfile"
              exit 1
            }
            cp "$root/$crate/Cargo.lock" "crates/$crate/Cargo.lock"
          done

          mapfile -t changed < <(git status --porcelain | sed 's/^...//' | sort)
          expected=(
            crates/mycelix-leptos-client/Cargo.lock
            crates/mycelix-leptos-core/Cargo.lock
            crates/mycelix-leptos-ui/Cargo.lock
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")" || {
            echo '::error::Unexpected worktree changes while installing exact lockfiles'
            git status --short
            exit 1
          }

      - name: Commit exact qualified lockfiles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            crates/mycelix-leptos-client/Cargo.lock \
            crates/mycelix-leptos-core/Cargo.lock \
            crates/mycelix-leptos-ui/Cargo.lock
          git diff --cached --check
          git commit -m 'build(frontend): freeze qualified standalone lockfiles'
          git push origin HEAD:fix/frontend-ui-source-closure-v2
