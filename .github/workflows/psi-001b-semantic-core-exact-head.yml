name: Mycelix PSI-001B Semantic Core Exact-Head

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'mycelix-workspace/mycelix-core/libs/private-set-core/**'
      - 'mycelix-workspace/mycelix-core/libs/privacy-computation-core/**'
      - '.github/workflows/psi-001b-semantic-core-exact-head.yml'
  workflow_dispatch:
    inputs:
      subject_sha:
        description: 'Exact 40-hex qualifier subject'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: psi-001bq-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Exact-head PSI-001B semantic-core qualification
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRODUCT_PARENT: 28c5eb3c85153e3c6c5a7696a21aa6f6d259ad82
      CARGO_TERM_COLOR: always
    steps:
      - name: Resolve exact subject
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            subject='${{ github.event.pull_request.head.sha }}'
          else
            subject='${{ inputs.subject_sha }}'
          fi
          [[ "$subject" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$subject" >> "$GITHUB_OUTPUT"

      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.subject.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact qualifier shape
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PRODUCT_PARENT"
          test "$(git rev-list --count "$PRODUCT_PARENT"..HEAD)" = 1
          mapfile -t changed < <(git diff --name-only "$PRODUCT_PARENT" HEAD)
          test "${#changed[@]}" = 1
          test "${changed[0]}" = '.github/workflows/psi-001b-semantic-core-exact-head.yml'
          test -z "$(git status --porcelain)"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: rustfmt,clippy

      - name: Capture source evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/psi-001bq-evidence"
          mkdir -p "$evidence"
          {
            echo "subject_sha=${{ steps.subject.outputs.sha }}"
            echo 'authority_scope=StructuralOnly'
            echo 'psi_backend_qualified=false'
            echo 'psi_security_established=false'
            echo 'enumeration_resistance_established=false'
            echo 'dataset_comparison_authorized=false'
            echo 'result_disclosure_authorized=false'
            rustc -Vv
            cargo -V
          } > "$evidence/execution-capsule.txt"
          find mycelix-workspace/mycelix-core/libs/private-set-core \
               mycelix-workspace/mycelix-core/libs/privacy-computation-core \
               -type f -not -path '*/target/*' -print0 \
            | sort -z | xargs -0 sha256sum > "$evidence/source-sha256.txt"

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt \
            --manifest-path mycelix-workspace/mycelix-core/libs/private-set-core/Cargo.toml \
            --all -- --check

      - name: Prepare isolated dependency graph
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/psi-001bq-graph"
          evidence="$RUNNER_TEMP/psi-001bq-evidence"
          mkdir -p "$root"
          cp -a mycelix-workspace/mycelix-core/libs/privacy-computation-core "$root/privacy-computation-core"
          cp -a mycelix-workspace/mycelix-core/libs/private-set-core "$root/private-set-core"
          cd "$root/private-set-core"
          cargo generate-lockfile
          sha256sum Cargo.lock > "$evidence/Cargo.lock.sha256"
          cp Cargo.lock "$evidence/Cargo.lock"
          cargo metadata --locked --format-version 1 > "$evidence/cargo-metadata.json"
          cargo tree --locked > "$evidence/cargo-tree.txt"

      - name: Execute committed corpus
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/psi-001bq-graph/private-set-core"
          evidence="$RUNNER_TEMP/psi-001bq-evidence"
          cd "$root"
          cargo test --locked --all-targets -- --nocapture | tee "$evidence/committed-tests.txt"
          cargo test --locked --all-targets -- --list > "$evidence/committed-test-list.txt"

      - name: Warnings-denied Clippy
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/psi-001bq-graph/private-set-core"
          cargo clippy --locked --all-targets -- -D warnings

      - name: External authority-ceiling probe
        shell: bash
        run: |
          set -euo pipefail
          crate="$RUNNER_TEMP/psi-001bq-graph/private-set-core"
          mkdir -p "$crate/tests"
          cat > "$crate/tests/authority_ceiling_probe.rs" <<'RS'
          use mycelix_private_set_core::{
              evaluate_private_set, CollectionSemantics, DuplicateSemantics,
              EnumerationProtectionDeclaration, EnumerationProtectionRequirement,
              IdentifierDomain, OutputRecipient, PrivateSetCapability, PrivateSetDisposition,
              PrivateSetOperation, PrivateSetRequirement,
          };
          use privacy_computation_core::{
              AdversaryModel, BackendIdentity, DisclosureRequirement, InteractionModel,
              LeakageDeclaration, LeakageProfile, LeakageRequirements, ParticipantModel,
              PrimitiveCapability, PrivacyObjective, PrivacyPrimitive, PrivacyRequirement,
              QualificationState, SemanticAuthority,
          };

          #[test]
          fn compatible_remains_structural_only() {
              let requirement = PrivateSetRequirement {
                  pec: PrivacyRequirement {
                      objective: PrivacyObjective::PrivateSetRelation,
                      participant_model: ParticipantModel::TwoParty,
                      adversary_model: AdversaryModel::HonestButCurious,
                      interaction_model: InteractionModel::Interactive { rounds: 2 },
                      leakage: LeakageRequirements {
                          identity: DisclosureRequirement::MustHide,
                          ..LeakageRequirements::default()
                      },
                      required_qualification: Some(QualificationState::Experimental),
                  },
                  operation: PrivateSetOperation::Intersection,
                  collection_semantics: CollectionSemantics::Set,
                  duplicate_semantics: DuplicateSemantics::RejectDuplicates,
                  output_recipient: OutputRecipient::InitiatorOnly,
                  identifier_domain: IdentifierDomain::OpaqueHighEntropy,
                  enumeration_protection: EnumerationProtectionRequirement::Unspecified,
              };

              let capability = PrivateSetCapability {
                  pec: PrimitiveCapability {
                      backend: BackendIdentity {
                          primitive: PrivacyPrimitive::PrivateSetOperation,
                          backend: "external-probe".into(),
                          version: "0".into(),
                          profile: "structural-only".into(),
                      },
                      supported_objectives: vec![PrivacyObjective::PrivateSetRelation],
                      participant_model: ParticipantModel::TwoParty,
                      adversary_model: AdversaryModel::HonestButCurious,
                      interaction_model: InteractionModel::Interactive { rounds: 2 },
                      leakage: LeakageProfile {
                          identity: LeakageDeclaration::DeclaredHidden,
                          ..LeakageProfile::default()
                      },
                      qualification: QualificationState::Experimental,
                  },
                  operations: vec![PrivateSetOperation::Intersection],
                  collection_semantics: CollectionSemantics::Set,
                  duplicate_semantics: DuplicateSemantics::RejectDuplicates,
                  output_recipient: OutputRecipient::InitiatorOnly,
                  identifier_domains: vec![IdentifierDomain::OpaqueHighEntropy],
                  enumeration_protection: EnumerationProtectionDeclaration::Unspecified,
              };

              let result = evaluate_private_set(&requirement, &capability);
              assert_eq!(result.disposition, PrivateSetDisposition::Compatible);
              assert_eq!(result.authority, SemanticAuthority::StructuralOnly);
              assert!(!result.psi_security_established());
              assert!(!result.enumeration_resistance_established());
              assert!(!result.dataset_comparison_authorized());
              assert!(!result.result_disclosure_authorized());
          }
          RS
          cd "$crate"
          cargo test --locked --test authority_ceiling_probe -- --nocapture

      - name: Postflight immutability and receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.subject.outputs.sha }}"
          test -z "$(git status --porcelain)"
          echo 'PSI-001BQ PASS'
          echo 'authority_scope=StructuralOnly'
          echo 'psi_backend_qualified=false'
          echo 'psi_security_established=false'
          echo 'enumeration_resistance_established=false'
          echo 'dataset_comparison_authorized=false'
          echo 'result_disclosure_authorized=false'
