name: Terra Preta response-operator reference

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/terra-preta/tools/response-operator-reference/**'
      - '.github/workflows/terra-preta-response-operator-reference.yml'
  push:
    branches: [research/terra-response-operator-v0.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  response-operator-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path research/terra-preta/tools/response-operator-reference/Cargo.toml -- --check
      - name: Tests
        run: cargo test --manifest-path research/terra-preta/tools/response-operator-reference/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --manifest-path research/terra-preta/tools/response-operator-reference/Cargo.toml --all-targets -- -D warnings
      - name: Execute manufactured fixture
        run: |
          cargo run --quiet --manifest-path research/terra-preta/tools/response-operator-reference/Cargo.toml -- \
            research/terra-preta/tools/response-operator-reference/fixtures/two-parallel-paths.json \
            "$RUNNER_TEMP/response-report.json"
          jq -e '
            .fixture_status == "synthetic_only_not_empirical_evidence" and
            .node_count == 4 and .edge_count == 4 and .interior_node_count == 2 and
            ((.effective_two_terminal_conductance - 2.0 | fabs) < 1e-10) and
            .log_conductance_sensitivity.numerical_rank == 1 and
            .log_conductance_sensitivity.local_nullity == 3 and
            (.response_symmetry_max_abs < 1e-10) and
            (.response_row_sum_max_abs < 1e-10)
          ' "$RUNNER_TEMP/response-report.json"
      - name: Reject output overwrite
        run: |
          before=$(sha256sum "$RUNNER_TEMP/response-report.json" | cut -d ' ' -f 1)
          if cargo run --quiet --manifest-path research/terra-preta/tools/response-operator-reference/Cargo.toml -- \
            research/terra-preta/tools/response-operator-reference/fixtures/two-parallel-paths.json \
            "$RUNNER_TEMP/response-report.json"; then
            echo "unexpected overwrite success" >&2
            exit 1
          fi
          after=$(sha256sum "$RUNNER_TEMP/response-report.json" | cut -d ' ' -f 1)
          test "$before" = "$after"
