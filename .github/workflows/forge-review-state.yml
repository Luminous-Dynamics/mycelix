name: Forge Review State

on:
  pull_request:
    paths:
      - "crates/mycelix-forge-review-state/**"
      - ".github/workflows/forge-review-state.yml"
  push:
    branches: [main]
    paths:
      - "crates/mycelix-forge-review-state/**"
      - ".github/workflows/forge-review-state.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-review-state-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-state:
    name: Review revision lineage contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/mycelix-forge-review-state
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust 1.96
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features
