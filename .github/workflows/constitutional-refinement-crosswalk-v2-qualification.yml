name: Constitutional Refinement Crosswalk v2 Qualification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'mycelix-governance/docs/CONSTITUTIONAL_REFINEMENT_CROSSWALK_V0_2.md'
      - 'mycelix-governance/specs/constitutional-refinement-crosswalk.v2.json'
      - 'mycelix-governance/specs/constitutional-refinement-crosswalk.v2.schema.json'
      - 'mycelix-governance/tools/formal/validate_refinement_crosswalk_v2.py'
      - '.github/workflows/constitutional-refinement-crosswalk-v2-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: constitutional-refinement-crosswalk-v2-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NIXPKGS_REV: a50bf0c1b07873c1a53892292017041a8f0a1288
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  EXPECTED_SEMANTIC_HEAD: f4748da5c60686e9611ce68d60fcd24a4bfa239a
  EXPECTED_PARENT_CR1_HEAD: 4edb56bd3c36ddc6277e2de5e0584a65e8c99b3c

jobs:
  qualify:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    name: Exact-head cross-branch refinement evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact raw head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_HEAD }}

      - name: Bind exact semantic lineage and file census
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SEMANTIC_HEAD"
          test "$(git rev-parse HEAD^^)" = "$EXPECTED_PARENT_CR1_HEAD"

          mapfile -t verifier_files < <(git diff --name-only HEAD^ HEAD | sort)
          test "${#verifier_files[@]}" -eq 1
          test "${verifier_files[0]}" = ".github/workflows/constitutional-refinement-crosswalk-v2-qualification.yml"

          mapfile -t semantic_files < <(git diff --name-only HEAD^^ HEAD^ | sort)
          expected=(
            "mycelix-governance/docs/CONSTITUTIONAL_REFINEMENT_CROSSWALK_V0_2.md"
            "mycelix-governance/specs/constitutional-refinement-crosswalk.v2.json"
            "mycelix-governance/specs/constitutional-refinement-crosswalk.v2.schema.json"
            "mycelix-governance/tools/formal/validate_refinement_crosswalk_v2.py"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${semantic_files[*]}" = "${expected_sorted[*]}"

          # This is an exercised cross-branch property: the CR2 working tree is based
          # on CR1 and does not contain B4's later binding.rs, yet the validator must
          # reconstruct that source from the exact B4 semantic commit.
          test ! -e mycelix-governance/crates/constitutional-consumption/src/binding.rs

          rm -rf refinement-crosswalk-v2-evidence
          mkdir -p refinement-crosswalk-v2-evidence
          printf '%s\n' "$EXPECTED_HEAD" > refinement-crosswalk-v2-evidence/expected-head.txt
          printf '%s\n' "$EXPECTED_SEMANTIC_HEAD" > refinement-crosswalk-v2-evidence/expected-semantic-head.txt
          printf '%s\n' "$EXPECTED_PARENT_CR1_HEAD" > refinement-crosswalk-v2-evidence/expected-parent-cr1-head.txt
          git diff --name-status HEAD^^ HEAD^ > refinement-crosswalk-v2-evidence/semantic-diff.txt
          sha256sum "${expected[@]}" > refinement-crosswalk-v2-evidence/preflight-sha256.txt

      - name: Install Nix
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Validate schema, cross-branch sources, and mutation controls
        shell: bash
        run: |
          set -euo pipefail
          nix shell \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#python312" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#check-jsonschema" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#git" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#coreutils" \
            --command bash -euo pipefail -c '
              check-jsonschema \
                --schemafile mycelix-governance/specs/constitutional-refinement-crosswalk.v2.schema.json \
                mycelix-governance/specs/constitutional-refinement-crosswalk.v2.json \
                | tee refinement-crosswalk-v2-evidence/schema-validation.log

              python3 mycelix-governance/tools/formal/validate_refinement_crosswalk_v2.py --self-test \
                | tee refinement-crosswalk-v2-evidence/validator-receipt.json
            '

      - name: Postflight semantic immutability
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "mycelix-governance/docs/CONSTITUTIONAL_REFINEMENT_CROSSWALK_V0_2.md"
            "mycelix-governance/specs/constitutional-refinement-crosswalk.v2.json"
            "mycelix-governance/specs/constitutional-refinement-crosswalk.v2.schema.json"
            "mycelix-governance/tools/formal/validate_refinement_crosswalk_v2.py"
          )
          sha256sum "${expected[@]}" > refinement-crosswalk-v2-evidence/postflight-sha256.txt
          diff -u refinement-crosswalk-v2-evidence/preflight-sha256.txt refinement-crosswalk-v2-evidence/postflight-sha256.txt
          git diff --exit-code -- "${expected[@]}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SEMANTIC_HEAD"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: constitutional-refinement-crosswalk-v2-${{ env.EXPECTED_HEAD }}
          path: refinement-crosswalk-v2-evidence
          if-no-files-found: error
          retention-days: 30
