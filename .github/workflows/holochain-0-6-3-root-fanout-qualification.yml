name: Holochain 0.6.3 Root Fanout Qualification

on:
  pull_request:
    paths:
      - '.github/scripts/inventory_holochain_root_fanout.py'
      - '.github/scripts/check_holochain_root_fanout_scope.py'
      - '.github/scripts/check_holochain_root_fanout_graph.py'
      - '.github/scripts/holochain_release_family.py'
      - '.github/scripts/materialize_holochain_0_6_3_pulse.py'
      - '.github/scripts/check_holochain_cohort.py'
      - '.github/workflows/holochain-0-6-3-root-fanout-qualification.yml'
      - 'mycelix-workspace/Cargo.toml'
      - 'mycelix-workspace/holochain-cohort.toml'
  workflow_dispatch:

concurrency:
  group: holochain-0-6-3-root-fanout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  EXPECTED_PARENT_BRANCH: test/holochain-0.6.3-pulse-qualification

jobs:
  qualify-root-fanout:
    name: Qualify canonical root Holochain fanout
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact qualification head
        id: head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "Expected qualification head: $EXPECTED_HEAD_SHA"
          echo "Checked-out qualification head: $actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          echo "sha=$actual" >> "$GITHUB_OUTPUT"

      - name: Bind current parent branch, PR base, and ancestry
        id: parent
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "$EXPECTED_PARENT_BRANCH:refs/remotes/origin/$EXPECTED_PARENT_BRANCH"
          live_parent="$(git rev-parse "refs/remotes/origin/$EXPECTED_PARENT_BRANCH")"
          expected_parent="${EVENT_BASE_SHA:-$live_parent}"
          echo "Live parent branch head: $live_parent"
          echo "Event/expected parent head: $expected_parent"
          test "$live_parent" = "$expected_parent"
          git merge-base --is-ancestor "$expected_parent" HEAD
          echo "sha=$expected_parent" >> "$GITHUB_OUTPUT"

      - name: Prepare evidence directory
        run: mkdir -p "$RUNNER_TEMP/holochain-0.6.3-root-fanout-evidence"

      - name: Install Nix
        id: install_nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install pinned Rust toolchain
        id: install_rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action code
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown

      - name: Capture qualification execution capsule
        id: execution_capsule
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/holochain-0.6.3-root-fanout-evidence"
          {
            echo "schema=1"
            echo "runner_label=ubuntu-24.04"
            echo "runner_os=${RUNNER_OS:-unknown}"
            echo "runner_arch=${RUNNER_ARCH:-unknown}"
            echo "image_os=${ImageOS:-unknown}"
            echo "image_version=${ImageVersion:-unknown}"
            echo "workflow_ref=${GITHUB_WORKFLOW_REF:-unknown}"
            echo "workflow_sha=${GITHUB_WORKFLOW_SHA:-unknown}"
            echo "checkout_action_sha=11d5960a326750d5838078e36cf38b85af677262"
            echo "install_nix_action_sha=13d8dd58da0234aa297dedd986986ccb8e7f3e24"
            echo "rust_toolchain_action_sha=6bed0761d98439e5a578e2877258200ad565ba87"
            echo "upload_artifact_action_sha=ea165f8d65b6e75b540449e92b4886f43607fa02"
            echo "nix_installer_version=2.35.2"
            echo "nix_installer_url=https://releases.nixos.org/nix/nix-2.35.2/install"
            echo "[uname]"
            uname -a
            echo "[os-release]"
            cat /etc/os-release
            echo "[git]"
            git --version
            echo "[python]"
            python3 --version
            echo "[rustc]"
            rustc -vV
            echo "[cargo]"
            cargo --version
            echo "[nix]"
            nix --version
          } > "$evidence/execution-capsule.txt"
          test -s "$evidence/execution-capsule.txt"

      - name: Materialize shared 0.6.3 candidate
        id: materialize
        continue-on-error: true
        run: python3 .github/scripts/materialize_holochain_0_6_3_pulse.py

      - name: Regenerate Holonix lock
        id: nix_lock
        if: steps.materialize.outcome == 'success'
        continue-on-error: true
        working-directory: mycelix-workspace
        run: nix flake lock --update-input holonix

      - name: Verify shared aligned cohort contract
        id: contract
        if: steps.materialize.outcome == 'success' && steps.nix_lock.outcome == 'success'
        continue-on-error: true
        run: python3 .github/scripts/check_holochain_cohort.py

      - name: Generate canonical root Cargo lock
        id: root_lock
        if: steps.materialize.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path mycelix-workspace/Cargo.toml
          test -s mycelix-workspace/Cargo.lock
          sha256sum mycelix-workspace/Cargo.lock \
            > "$RUNNER_TEMP/holochain-0.6.3-root-fanout-evidence/root-cargo-lock.sha256"

      - name: Inventory complete canonical root Holochain impact
        id: inventory
        if: steps.root_lock.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/holochain-0.6.3-root-fanout-evidence"
          python3 .github/scripts/inventory_holochain_root_fanout.py \
            --output "$evidence/root-holochain-fanout.json" \
            --manifest-list "$evidence/affected-manifests.txt" \
            --wasm-manifest-list "$evidence/wasm-manifests.txt"
          test -s "$evidence/root-holochain-fanout.json"
          test -s "$evidence/affected-manifests.txt"

      - name: Independently prove complete reverse-impact scope
        id: scope
        if: steps.inventory.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/holochain-0.6.3-root-fanout-evidence"
          python3 .github/scripts/check_holochain_root_fanout_scope.py \
            --inventory "$evidence/root-holochain-fanout.json" \
            --manifest-list "$evidence/affected-manifests.txt" \
            --wasm-manifest-list "$evidence/wasm-manifests.txt" \
            --output "$evidence/root-fanout-scope-proof.json"
          test -s "$evidence/root-fanout-scope-proof.json"

      - name: Verify resolved root fanout dependency closures
        id: resolved_graph
        if: steps.scope.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/holochain-0.6.3-root-fanout-evidence"
          python3 .github/scripts/check_holochain_root_fanout_graph.py \
            --inventory "$evidence/root-holochain-fanout.json" \
            --output "$evidence/root-resolved-holochain-graphs.json"
          test -s "$evidence/root-resolved-holochain-graphs.json"

      - name: Check every affected root workspace member on host
        id: host_checks
        if: steps.scope.outcome == 'success'
        continue-on-error: true
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/holochain-root-fanout-target
        run: |
          set -uo pipefail
          evidence="$RUNNER_TEMP/holochain-0.6.3-root-fanout-evidence"
          results="$evidence/host-check-results.tsv"
          : > "$results"
          failed=0
          while IFS= read -r manifest; do
            [ -n "$manifest" ] || continue
            echo "=== host check: $manifest ==="
            if cargo check --locked --manifest-path "$manifest"; then
              printf '%s\tsuccess\n' "$manifest" >> "$results"
            else
              printf '%s\tfailure\n' "$manifest" >> "$results"
              failed=1
            fi
          done < "$evidence/affected-manifests.txt"
          python3 - "$evidence/root-holochain-fanout.json" "$results" <<'PY'
          import json
          from pathlib import Path
          import sys
          inventory = json.loads(Path(sys.argv[1]).read_text())
          results = [line for line in Path(sys.argv[2]).read_text().splitlines() if line]
          expected = inventory["affected_member_count"]
          if len(results) != expected:
              raise SystemExit(f"Host result cardinality {len(results)} != inventory {expected}")
          PY
          exit "$failed"

      - name: Check every affected guest zome for wasm32
        id: wasm_checks
        if: steps.scope.outcome == 'success'
        continue-on-error: true
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/holochain-root-fanout-target
        run: |
          set -uo pipefail
          evidence="$RUNNER_TEMP/holochain-0.6.3-root-fanout-evidence"
          results="$evidence/wasm-check-results.tsv"
          : > "$results"
          failed=0
          while IFS= read -r manifest; do
            [ -n "$manifest" ] || continue
            echo "=== wasm32 check: $manifest ==="
            if cargo check --locked --target wasm32-unknown-unknown --manifest-path "$manifest"; then
              printf '%s\tsuccess\n' "$manifest" >> "$results"
            else
              printf '%s\tfailure\n' "$manifest" >> "$results"
              failed=1
            fi
          done < "$evidence/wasm-manifests.txt"
          python3 - "$evidence/root-holochain-fanout.json" "$results" <<'PY'
          import json
          from pathlib import Path
          import sys
          inventory = json.loads(Path(sys.argv[1]).read_text())
          results = [line for line in Path(sys.argv[2]).read_text().splitlines() if line]
          expected = inventory["wasm_affected_member_count"]
          if len(results) != expected:
              raise SystemExit(f"WASM result cardinality {len(results)} != inventory {expected}")
          PY
          exit "$failed"

      - name: Prove root lock stayed frozen during qualification
        id: lock_frozen
        if: steps.root_lock.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          sha256sum --check \
            "$RUNNER_TEMP/holochain-0.6.3-root-fanout-evidence/root-cargo-lock.sha256"

      - name: Seal fanout evidence
        id: seal
        if: always()
        env:
          QUALIFIED_HEAD_SHA: ${{ steps.head.outputs.sha }}
          QUALIFIED_PARENT_SHA: ${{ steps.parent.outputs.sha }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/holochain-0.6.3-root-fanout-evidence"
          test -s "$evidence/execution-capsule.txt"
          test -s "$evidence/root-holochain-fanout.json"
          test -s "$evidence/root-fanout-scope-proof.json"
          test -s "$evidence/root-resolved-holochain-graphs.json"
          test -s "$evidence/host-check-results.tsv"
          test -f "$evidence/wasm-check-results.tsv"
          test -s mycelix-workspace/Cargo.lock

          {
            echo "qualified_head_sha=$QUALIFIED_HEAD_SHA"
            echo "qualified_parent_sha=$QUALIFIED_PARENT_SHA"
            echo "qualified_parent_branch=$EXPECTED_PARENT_BRANCH"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "event_name=${GITHUB_EVENT_NAME}"
            echo "product_materialization_authorized=false"
            echo "authorization_reason=qualification_only_no_product_source_materialized"
          } > "$evidence/qualification-metadata.txt"

          sha256sum \
            mycelix-workspace/Cargo.lock \
            "$evidence/execution-capsule.txt" \
            "$evidence/root-holochain-fanout.json" \
            "$evidence/root-fanout-scope-proof.json" \
            "$evidence/root-resolved-holochain-graphs.json" \
            "$evidence/affected-manifests.txt" \
            "$evidence/wasm-manifests.txt" \
            "$evidence/host-check-results.tsv" \
            "$evidence/wasm-check-results.tsv" \
            > "$evidence/qualification-sha256.txt"

      - name: Preserve root fanout evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: holochain-0.6.3-root-fanout-${{ steps.head.outputs.sha || github.sha }}
          path: |
            ${{ runner.temp }}/holochain-0.6.3-root-fanout-evidence/execution-capsule.txt
            ${{ runner.temp }}/holochain-0.6.3-root-fanout-evidence/root-holochain-fanout.json
            ${{ runner.temp }}/holochain-0.6.3-root-fanout-evidence/root-fanout-scope-proof.json
            ${{ runner.temp }}/holochain-0.6.3-root-fanout-evidence/root-resolved-holochain-graphs.json
            ${{ runner.temp }}/holochain-0.6.3-root-fanout-evidence/affected-manifests.txt
            ${{ runner.temp }}/holochain-0.6.3-root-fanout-evidence/wasm-manifests.txt
            ${{ runner.temp }}/holochain-0.6.3-root-fanout-evidence/host-check-results.tsv
            ${{ runner.temp }}/holochain-0.6.3-root-fanout-evidence/wasm-check-results.tsv
            ${{ runner.temp }}/holochain-0.6.3-root-fanout-evidence/root-cargo-lock.sha256
            ${{ runner.temp }}/holochain-0.6.3-root-fanout-evidence/qualification-metadata.txt
            ${{ runner.temp }}/holochain-0.6.3-root-fanout-evidence/qualification-sha256.txt
            mycelix-workspace/Cargo.lock
          if-no-files-found: warn
          retention-days: 14

      - name: Root fanout qualification gate
        if: always()
        run: |
          set -euo pipefail
          failed=0
          check() {
            name="$1"
            outcome="$2"
            printf '%-24s %s\n' "$name" "$outcome"
            if [ "$outcome" != success ]; then
              failed=1
            fi
          }
          check checkout '${{ steps.checkout.outcome }}'
          check head '${{ steps.head.outcome }}'
          check parent '${{ steps.parent.outcome }}'
          check install_nix '${{ steps.install_nix.outcome }}'
          check install_rust '${{ steps.install_rust.outcome }}'
          check execution_capsule '${{ steps.execution_capsule.outcome }}'
          check materialize '${{ steps.materialize.outcome }}'
          check nix_lock '${{ steps.nix_lock.outcome }}'
          check contract '${{ steps.contract.outcome }}'
          check root_lock '${{ steps.root_lock.outcome }}'
          check inventory '${{ steps.inventory.outcome }}'
          check scope '${{ steps.scope.outcome }}'
          check resolved_graph '${{ steps.resolved_graph.outcome }}'
          check host_checks '${{ steps.host_checks.outcome }}'
          check wasm_checks '${{ steps.wasm_checks.outcome }}'
          check lock_frozen '${{ steps.lock_frozen.outcome }}'
          check seal '${{ steps.seal.outcome }}'
          if [ "$failed" -ne 0 ]; then
            echo 'Canonical root Holochain 0.6.3 fanout is NOT QUALIFIED.'
            exit 1
          fi
          echo 'Canonical root Holochain 0.6.3 fanout QUALIFIED.'
