name: Hearth 0.7 Workflow Lint

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - ".github/workflows/hearth-07-qualification.yml"
      - ".github/workflows/hearth-07-workflow-lint.yml"
      - "mycelix-workspace/mycelix-hearth/**"
      - "crates/mycelix-bridge-*/**"
      - ".gitmodules"

permissions:
  contents: read

concurrency:
  group: hearth-07-workflow-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Validate exact Hearth 0.7 qualification workflow source
    runs-on: ubuntu-24.04
    env:
      QUALIFY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.QUALIFY_SHA }}
          persist-credentials: false

      - name: Verify exact lint checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "${QUALIFY_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "QUALIFY_SHA must be an exact 40-character lowercase commit SHA: ${QUALIFY_SHA}"
            exit 1
          }
          checked_out_sha="$(git rev-parse HEAD)"
          [[ "${checked_out_sha}" == "${QUALIFY_SHA}" ]] || {
            echo "lint checkout mismatch: expected ${QUALIFY_SHA}, got ${checked_out_sha}"
            exit 1
          }
          echo "QUALIFY_SHA=${QUALIFY_SHA}"
          echo "Checked-out HEAD=${checked_out_sha}"

      - name: Fetch and verify official actionlint
        shell: bash
        run: |
          set -euo pipefail
          version="1.7.12"
          expected_sha256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          archive="/tmp/actionlint_${version}_linux_amd64.tar.gz"
          mkdir -p /tmp/actionlint
          curl --fail --silent --show-error --location             "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"             --output "${archive}"
          printf '%s  %s\n' "${expected_sha256}" "${archive}" | sha256sum --check --status -
          tar -xzf "${archive}" -C /tmp/actionlint
          test -x /tmp/actionlint/actionlint
          /tmp/actionlint/actionlint -version
          echo "OK: official actionlint v${version} matches pinned SHA-256"

      - name: Fetch and verify official ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          shellcheck_version="0.11.0"
          shellcheck_sha256="8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
          archive="/tmp/shellcheck_${shellcheck_version}_linux_x86_64.tar.xz"
          mkdir -p /tmp/shellcheck
          curl --fail --silent --show-error --location \
            "https://github.com/koalaman/shellcheck/releases/download/v${shellcheck_version}/shellcheck-v${shellcheck_version}.linux.x86_64.tar.xz" \
            --output "${archive}"
          printf '%s  %s\n' "${shellcheck_sha256}" "${archive}" |
            sha256sum --check --status -
          tar -xJf "${archive}" -C /tmp/shellcheck
          install -D -m 0755 \
            "/tmp/shellcheck/shellcheck-v${shellcheck_version}/shellcheck" \
            /tmp/shellcheck/bin/shellcheck
          /tmp/shellcheck/bin/shellcheck --version | grep -F "version: ${shellcheck_version}"
          echo "OK: official ShellCheck v${shellcheck_version} matches pinned SHA-256"

      - name: Lint exact Hearth 0.7 qualification workflow
        shell: bash
        run: |
          set -euo pipefail
          /tmp/actionlint/actionlint -oneline -shellcheck /tmp/shellcheck/bin/shellcheck -pyflakes '' \
            .github/workflows/hearth-07-qualification.yml \
            .github/workflows/hearth-07-workflow-lint.yml
