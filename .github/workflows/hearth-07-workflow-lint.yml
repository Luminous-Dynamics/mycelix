name: Hearth 0.7 Workflow Lint

on:
  push:
    branches:
      - 'chore/hearth-07-*'
    paths:
      - ".github/workflows/hearth-07-qualification.yml"
      - ".github/workflows/hearth-07-workflow-lint.yml"
      - "mycelix-workspace/mycelix-hearth/**"
      - "crates/mycelix-bridge-*/**"
      - ".gitmodules"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - ".github/workflows/hearth-07-qualification.yml"
      - ".github/workflows/hearth-07-workflow-lint.yml"
      - "mycelix-workspace/mycelix-hearth/**"
      - "crates/mycelix-bridge-*/**"
      - ".gitmodules"

permissions:
  contents: read

concurrency:
  group: hearth-07-workflow-lint-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Validate Hearth 0.7 qualification workflow
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Fetch and verify official actionlint
        shell: bash
        run: |
          set -euo pipefail
          version="1.7.12"
          expected_sha256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          archive="/tmp/actionlint_${version}_linux_amd64.tar.gz"
          mkdir -p /tmp/actionlint
          curl --fail --silent --show-error --location             "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"             --output "${archive}"
          printf '%s  %s\n' "${expected_sha256}" "${archive}" | sha256sum --check --status -
          tar -xzf "${archive}" -C /tmp/actionlint
          test -x /tmp/actionlint/actionlint
          /tmp/actionlint/actionlint -version
          echo "OK: official actionlint v${version} matches pinned SHA-256"

      - name: Lint Hearth 0.7 qualification workflow
        shell: bash
        run: |
          set -euo pipefail
          /tmp/actionlint/actionlint -oneline -pyflakes             '' .github/workflows/hearth-07-qualification.yml
