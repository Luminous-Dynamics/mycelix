name: Payment Initiation Composition Qualification

on:
  pull_request:
    paths:
      - 'mycelix-finance/docs/PAYMENT_INITIATION_COMPOSITION_V1.md'
      - 'mycelix-finance/docs/payment-initiation-composition-v1.*'
      - 'tools/finance/payment-initiation-composition-evaluator/**'
      - '.github/workflows/payment-initiation-composition-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-finance/docs/PAYMENT_INITIATION_COMPOSITION_V1.md'
      - 'mycelix-finance/docs/payment-initiation-composition-v1.*'
      - 'tools/finance/payment-initiation-composition-evaluator/**'
      - '.github/workflows/payment-initiation-composition-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Effects-disabled payment assurance composition
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.0
      - name: Format
        run: cargo fmt --manifest-path tools/finance/payment-initiation-composition-evaluator/Cargo.toml -- --check
      - name: Schema and composition tests
        run: cargo test --manifest-path tools/finance/payment-initiation-composition-evaluator/Cargo.toml
      - name: Deterministic negative mutation campaign
        run: cargo run --manifest-path tools/finance/payment-initiation-composition-evaluator/Cargo.toml -- --self-test
      - name: Clippy
        run: cargo clippy --manifest-path tools/finance/payment-initiation-composition-evaluator/Cargo.toml --all-targets -- -D warnings
