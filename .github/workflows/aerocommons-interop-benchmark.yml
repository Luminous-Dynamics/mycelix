name: AeroCommons Interoperability Benchmark

on:
  pull_request:
    paths:
      - "tools/aero-interop-benchmark/**"
      - "tools/aero-adapter-run-receipt/**"
      - "mycelix-commons/crates/aero-evidence-types/**"
      - "docs/aerocommons/AERO_INTEROP_BENCHMARK_V1.schema.json"
      - "docs/aerocommons/AERO_INTEROP_BENCHMARK_001.md"
      - ".github/workflows/aerocommons-interop-benchmark.yml"
  push:
    branches:
      - "research/aerocommons-interop-benchmark-001"
    paths:
      - "tools/aero-interop-benchmark/**"
      - "tools/aero-adapter-run-receipt/**"
      - "mycelix-commons/crates/aero-evidence-types/**"
      - "docs/aerocommons/AERO_INTEROP_BENCHMARK_V1.schema.json"
      - "docs/aerocommons/AERO_INTEROP_BENCHMARK_001.md"
      - ".github/workflows/aerocommons-interop-benchmark.yml"

permissions:
  contents: read

jobs:
  interop-benchmark:
    name: Adjudicated QIF AP242 benchmark evaluator
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust 1.96.1
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path tools/aero-interop-benchmark/Cargo.toml -- --check
      - name: Run benchmark evaluator tests
        run: cargo test --manifest-path tools/aero-interop-benchmark/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --manifest-path tools/aero-interop-benchmark/Cargo.toml --all-targets -- -D warnings
