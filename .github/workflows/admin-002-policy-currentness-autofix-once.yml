name: ADMIN-002 Policy Currentness One-Shot Autofix

on:
  push:
    branches:
      - 'feat/admin-002-authoritative-policy-currentness-v0.1'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Repair exact currentness quality defect
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/mycelix-procedure-policy-currentness/src/lib.rs')
          text = path.read_text()
          old = '''        if let Some(until_ms) = self.effective_until_ms {\n            if until_ms <= self.effective_from_ms {\n                return Err(ProcedurePolicyCurrentnessError::InvalidEffectiveInterval);\n            }\n        }\n'''
          new = '''        if let Some(until_ms) = self.effective_until_ms\n            && until_ms <= self.effective_from_ms\n        {\n            return Err(ProcedurePolicyCurrentnessError::InvalidEffectiveInterval);\n        }\n'''
          assert text.count(old) == 1, 'expected exact effective-interval block'
          path.write_text(text.replace(old, new))
          PY

          rustfmt --edition 2024 crates/mycelix-procedure-policy-currentness/src/lib.rs
          git diff --check

      - name: Self-verify currentness theorem
        run: |
          qroot="$(mktemp -d)"
          mkdir -p "$qroot/crates"
          cp -a crates/mycelix-institutional-core "$qroot/crates/"
          cp -a crates/mycelix-administrative-procedure "$qroot/crates/"
          cp -a crates/mycelix-procedure-policy-identity "$qroot/crates/"
          cp -a crates/mycelix-procedure-policy-currentness "$qroot/crates/"
          manifest="$qroot/crates/mycelix-procedure-policy-currentness/Cargo.toml"
          cargo test --manifest-path "$manifest" --all-targets
          cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings

      - name: Commit exact repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/mycelix-procedure-policy-currentness/src/lib.rs
          git diff --cached --quiet && exit 1
          git commit -m 'fix(admin): clear policy-currentness format and Clippy gates'
          git push origin HEAD:feat/admin-002-authoritative-policy-currentness-v0.1
