name: Living-City schema validation

on:
  pull_request:
    paths:
      - "schemas/living-city-*-v0.1.schema.json"
      - "fixtures/living-city/**"
      - "scripts/living-city/**"
      - ".github/workflows/living-city-schema.yml"
  push:
    branches: [main]
    paths:
      - "schemas/living-city-*-v0.1.schema.json"
      - "fixtures/living-city/**"
      - "scripts/living-city/**"
      - ".github/workflows/living-city-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: living-city-schema-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate schema, evidence, and fixture controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned validator
        run: python -m pip install --disable-pip-version-check "jsonschema[format]==4.23.0"
      - name: Validate concept schema, positive fixtures, and negative controls
        run: python scripts/living-city/validate_fixtures.py
      - name: Run targeted concept schema mutation controls
        run: python scripts/living-city/test_schema_mutations.py
      - name: Validate source catalogue, evidence claims, and semantic references
        run: python scripts/living-city/validate_evidence.py
      - name: Test offline nutrient payload verifier
        run: python scripts/living-city/test_verify_nutrient_payloads.py
      - name: Validate urban metabolism, conservation balances, and synergy counterfactuals
        run: python scripts/living-city/validate_metabolism.py
      - name: Smoke-test synthetic scale benchmark
        env:
          LIVING_CITY_BENCHMARK_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python scripts/living-city/benchmark_metabolism.py
          --sizes 1000 --repeats 1 --warmups 0
          --runner-label "ubuntu-latest smoke run"
          --output "${{ runner.temp }}/living-city-benchmark.json"
      - name: Publish benchmark measurements in job summary
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ["RUNNER_TEMP"]) / "living-city-benchmark.json"
          report = json.loads(report_path.read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("# Living-City synthetic validator benchmark\n\n")
              summary.write(f"- Commit: `{report['commit']}`\n")
              summary.write(f"- Environment label: {report['target_cpu_ram']}\n")
              summary.write(f"- Python / jsonschema: {report['python']} / {report['jsonschema']}\n")
              summary.write("- Synthetic fixture only; this is a smoke measurement, not a city result or full performance qualification.\n\n")
              summary.write("| Flows | Metrics | Flows with uncertainty | Cohort impacts | Coverage records | Causal records | Balances | Schema ms | Semantic ms | Combined ms | Peak RSS MiB |\\n")
              summary.write("|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|\\n")
              for row in report["targets"]:
                  summary.write(
                      f"| {row['flows']} | {row['distinct_metric_count']} | {row['flows_with_uncertainty_count']} "
                      f"| {row['distributional_impact_count']} | {row['distributional_coverage_count']} "
                      f"| {row['causal_evaluation_count']} | {row['conservation_check_count']} "
                      f"| {row['schema_ms_median']} | {row['semantic_ms_median']} "
                      f"| {row['combined_ms_median']} | {row['peak_rss_mib_max']} |\\n"
                  )
              summary.write(f"\nReport SHA-256: `{report['report_sha256']}`\n")
          PY
      - name: Upload benchmark report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: living-city-benchmark-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/living-city-benchmark.json
          if-no-files-found: error
          retention-days: 30
