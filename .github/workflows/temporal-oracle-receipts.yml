name: Temporal oracle receipts

on:
  pull_request:
    paths:
      - "tools/economic/temporal-hindsight/reference/oraclereceipts/**"
      - ".github/workflows/temporal-oracle-receipts.yml"
  push:
    branches: [main]
    paths:
      - "tools/economic/temporal-hindsight/reference/oraclereceipts/**"
      - ".github/workflows/temporal-oracle-receipts.yml"

permissions:
  contents: read

concurrency:
  group: temporal-oracle-receipts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Receipt structure, race, vet, benchmarks and bounded TLC
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact workflow head and required sources
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -f tools/economic/temporal-hindsight/reference/oraclereceipts/go.mod
          test -f tools/economic/temporal-hindsight/reference/oraclereceipts/oracle_receipt.go
          test -f tools/economic/temporal-hindsight/reference/oraclereceipts/oracle_receipt_test.go
          test -f tools/economic/temporal-hindsight/reference/oraclereceipts/oracle_receipt_benchmark_test.go
          test -f tools/economic/temporal-hindsight/reference/oraclereceipts/formal/OracleReceiptImmutability.tla
          test -f tools/economic/temporal-hindsight/reference/oraclereceipts/formal/OracleReceiptImmutability.cfg
          test -f tools/economic/temporal-hindsight/reference/oraclereceipts/formal/OracleReceiptImmutability-Mutant.cfg

      - name: Set up Go reference toolchain
        uses: actions/setup-go@v7
        with:
          go-version: "1.23.2"
          cache: false

      - name: Run oracle receipt tests
        id: receipt_tests
        working-directory: tools/economic/temporal-hindsight/reference/oraclereceipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oracle-receipts"
          go version 2>&1 | tee "$RUNNER_TEMP/oracle-receipts/go.log"
          go test -v ./... 2>&1 | tee -a "$RUNNER_TEMP/oracle-receipts/go.log"

      - name: Run race detector
        id: receipt_race
        working-directory: tools/economic/temporal-hindsight/reference/oraclereceipts
        shell: bash
        run: |
          set -euo pipefail
          go test -race ./... 2>&1 | tee -a "$RUNNER_TEMP/oracle-receipts/go.log"

      - name: Run go vet
        id: receipt_vet
        working-directory: tools/economic/temporal-hindsight/reference/oraclereceipts
        shell: bash
        run: |
          set -euo pipefail
          go vet ./... 2>&1 | tee -a "$RUNNER_TEMP/oracle-receipts/go.log"

      - name: Repeat adversarial receipt tests
        id: receipt_repeat
        working-directory: tools/economic/temporal-hindsight/reference/oraclereceipts
        shell: bash
        run: |
          set -euo pipefail
          go test -run 'Test(ReceiptChain|AnswerSubstitution|QueryInput|NoResponse|AffirmReject|Backdated|Supersession|Conflicting|EvidenceReference|DuplicateEvidence|Signature|ValidTime|DuplicateReceipt|ReceiptDigest|CanonicalEvidence|FailureCertificates|ReceiptEncoding|PreEpochValidTime)' -count=30 ./... 2>&1 | tee -a "$RUNNER_TEMP/oracle-receipts/go.log"

      - name: Benchmark oracle receipt chain smoke
        id: receipt_benchmark
        working-directory: tools/economic/temporal-hindsight/reference/oraclereceipts
        shell: bash
        run: |
          set -euo pipefail
          go test -run '^$' -bench . -benchmem -benchtime=1x ./... 2>&1 | tee "$RUNNER_TEMP/oracle-receipts/benchmark.log"

      - name: Set up pinned Java toolchain
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Download and verify pinned TLA+ tools
        shell: bash
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/tla2tools-1.7.4.jar"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
            --output "$jar"
          printf '%s  %s\n' \
            "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88" \
            "$jar" | sha256sum --check --status
          jar tf "$jar" | grep -q "^tlc2/TLC.class$"

      - name: Check append-only oracle receipt model
        id: receipt_tlc
        working-directory: tools/economic/temporal-hindsight/reference/oraclereceipts/formal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oracle-receipts"
          log="$RUNNER_TEMP/oracle-receipts/tlc-receipt-correct.log"
          status=0
          java -XX:+UseParallelGC -Xmx2g -cp "$RUNNER_TEMP/tla2tools-1.7.4.jar" tlc2.TLC \
            -workers 1 -seed 1 \
            -metadir "$RUNNER_TEMP/tlc-receipt-correct" \
            -config OracleReceiptImmutability.cfg \
            OracleReceiptImmutability.tla >"$log" 2>&1 || status=$?
          cat "$log"
          exit "$status"

      - name: Require receipt overwrite mutant counterexample
        id: receipt_mutant
        working-directory: tools/economic/temporal-hindsight/reference/oraclereceipts/formal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oracle-receipts"
          log="$RUNNER_TEMP/oracle-receipts/tlc-receipt-mutant.log"
          status=0
          java -XX:+UseParallelGC -Xmx2g -cp "$RUNNER_TEMP/tla2tools-1.7.4.jar" tlc2.TLC \
            -workers 1 -seed 1 \
            -metadir "$RUNNER_TEMP/tlc-receipt-mutant" \
            -config OracleReceiptImmutability-Mutant.cfg \
            OracleReceiptImmutability.tla >"$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -eq 0 ]; then
            echo "Receipt-overwrite mutant unexpectedly passed."
            exit 1
          fi
          grep -F "Invariant OriginalReceiptImmutable is violated." "$log"
          echo "Expected receipt-overwrite counterexample observed."

      - name: Assemble oracle receipt qualification receipt
        if: always()
        shell: bash
        env:
          TESTS: ${{ steps.receipt_tests.outcome }}
          RACE: ${{ steps.receipt_race.outcome }}
          VET: ${{ steps.receipt_vet.outcome }}
          REPEAT: ${{ steps.receipt_repeat.outcome }}
          BENCHMARK: ${{ steps.receipt_benchmark.outcome }}
          TLC: ${{ steps.receipt_tlc.outcome }}
          MUTANT: ${{ steps.receipt_mutant.outcome }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/oracle-receipts"
          mkdir -p "$dir"
          jq -n \
            --arg schema "mycelix.temporal-oracle-receipt-qualification.v1" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg workflow_sha "$(git rev-parse HEAD)" \
            --arg go "$(go version 2>&1 || printf UNAVAILABLE)" \
            --arg tests "$TESTS" \
            --arg race "$RACE" \
            --arg vet "$VET" \
            --arg repeated "$REPEAT" \
            --arg benchmark "$BENCHMARK" \
            --arg correct_tlc "$TLC" \
            --arg mutant "$MUTANT" \
            '{
              schema:$schema,
              repository:$repository,
              run_id:$run_id,
              run_attempt:$attempt,
              workflow_sha:$workflow_sha,
              go_toolchain:$go,
              outcomes:{
                tests:$tests,
                race:$race,
                vet:$vet,
                repeated_adversarial:$repeated,
                benchmark_smoke:$benchmark,
                correct_tlc:$correct_tlc,
                expected_mutant:$mutant
              },
              claims:{
                receipt_structure_only:true,
                oracle_signature_authentication:"NotEvaluated",
                key_epoch_authentication:"NotEvaluated",
                authority_grant_authentication:"NotEvaluated",
                source_universe_completeness:"NotEvaluated",
                answer_truth:"NotEvaluated",
                production_authority:"NotEvaluated",
                unbounded_proof:false
              }
            }' > "$dir/qualification.json"
          grep -hE 'states generated|distinct states found|depth of the complete state graph|Invariant .* is violated' "$dir"/tlc-*.log > "$dir/tlc-model-summary.txt" || true
          (
            cd "$dir"
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          )

      - name: Upload oracle receipt evidence bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: temporal-oracle-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oracle-receipts/
          if-no-files-found: error
          retention-days: 90
