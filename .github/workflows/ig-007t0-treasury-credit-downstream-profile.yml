name: IG-007T0 Treasury Credit Downstream Profile

on:
  pull_request:
    paths:
      - 'mycelix-governance/profiles/observed/treasury-credit-downstream-fca2c107-v1.json'
      - 'mycelix-governance/scripts/validate_ig007t0_treasury_credit_downstream_profile.py'
      - 'mycelix-governance/docs/IG_007T0_TREASURY_CREDIT_DOWNSTREAM_PROFILE.md'
      - '.github/workflows/ig-007t0-treasury-credit-downstream-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact subject and four-file tranche
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SUBJECT_SHA}"
          BASE=feb30a89257e96592fdbd40b249258581d42fde7
          git cat-file -e "${BASE}^{commit}"
          test "$(git rev-parse HEAD^)" = "${BASE}"
          test "$(git rev-list --count "${BASE}..HEAD")" -eq 1
          test "$(git merge-base "${BASE}" HEAD)" = "${BASE}"
          mapfile -t changed < <(git diff --name-only "${BASE}..HEAD" | sort)
          expected=(
            .github/workflows/ig-007t0-treasury-credit-downstream-profile.yml
            mycelix-governance/docs/IG_007T0_TREASURY_CREDIT_DOWNSTREAM_PROFILE.md
            mycelix-governance/profiles/observed/treasury-credit-downstream-fca2c107-v1.json
            mycelix-governance/scripts/validate_ig007t0_treasury_credit_downstream_profile.py
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq 4
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")

      - name: Bind exact product and helper blobs
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            local path="$1" expected="$2"
            actual="$(git rev-parse "HEAD:${path}")"
            test "${actual}" = "${expected}" || { echo "blob drift ${path}: ${actual}"; exit 1; }
          }
          check_blob mycelix-governance/zomes/execution/coordinator/src/lib.rs 3dbb8a8f69b377e494ccf24164c94bd80f54e0ef
          check_blob mycelix-finance/zomes/treasury/coordinator/src/lib.rs 840e66bcb6fdedb27fe2451752511d1317eb50b8
          check_blob mycelix-finance/zomes/treasury/integrity/src/lib.rs 5ee9b72f7c138a5283818b873ceae36dff3305d4
          check_blob mycelix-governance/crates/governance-utils/src/lib.rs 282888816cc101c2743ef5c5905119defc3fee6d
          check_blob mycelix-governance/zomes/threshold-signing/coordinator/src/lib.rs 3449df8b03a4dd1774a5f22756d06931c72855b2
          check_blob mycelix-governance/zomes/bridge/coordinator/src/attestation.rs 6d7938084ba699b144ee5951966b1421c034f579
          check_blob mycelix-governance/zomes/bridge/coordinator/src/consciousness.rs d0acabf306594ab3ccfae220a9c9bd9aceed0ca6
          check_blob mycelix-governance/zomes/bridge/coordinator/src/consciousness_config.rs 26da234e588bf26d0e25c10dbec34502e00c191a
          check_blob mycelix-governance/zomes/bridge/coordinator/src/consensus.rs 3842dfa365953a01ca90bb79059da53f9cb00a6f
          check_blob mycelix-governance/zomes/bridge/coordinator/src/cross_cluster.rs 3eb0ade8633d6e711fd266bca6eb2ebab616eac2
          check_blob mycelix-governance/zomes/bridge/coordinator/src/lib.rs fb278023c269a89f300504c18538ab85b09f1178
          check_blob mycelix-governance/zomes/bridge/coordinator/src/query.rs 5a02812880a2fdaa8f3ed767a4686afc00c566f9
          check_blob mycelix-governance/zomes/bridge/coordinator/src/validation.rs 9e13ba58939880738eccb997e54f729da7a11304

      - name: Re-derive dispatch presence and absence facts
        shell: bash
        run: |
          set -euo pipefail
          EXEC=mycelix-governance/zomes/execution/coordinator/src/lib.rs
          BRIDGE=mycelix-governance/zomes/bridge/coordinator/src
          TREASURY=mycelix-finance/zomes/treasury/coordinator/src/lib.rs

          grep -F 'TransferCredits' "${EXEC}" >/dev/null
          grep -F 'governance_utils::call_local(' "${EXEC}" >/dev/null
          grep -F '"governance_bridge"' "${EXEC}" >/dev/null
          grep -F '"transfer_credits"' "${EXEC}" >/dev/null

          mapfile -t bridge_rs < <(find "${BRIDGE}" -maxdepth 1 -type f -name '*.rs' -printf '%f\n' | sort)
          expected=(attestation.rs consciousness.rs consciousness_config.rs consensus.rs cross_cluster.rs lib.rs query.rs validation.rs)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#bridge_rs[@]}" -eq 8
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${bridge_rs[@]}")
          if grep -R -nE 'pub[[:space:]]+fn[[:space:]]+transfer_credits[[:space:]]*\(' "${BRIDGE}"; then
            echo 'unexpected governance_bridge::transfer_credits entrypoint observed'
            exit 1
          fi

          grep -F 'execute_approved_transfer' "${BRIDGE}/cross_cluster.rs" >/dev/null
          grep -F 'governance_utils::call_role("finance", "treasury", "execute_governance_transfer", input)' "${BRIDGE}/cross_cluster.rs" >/dev/null
          if grep -nE 'pub[[:space:]]+fn[[:space:]]+execute_governance_transfer[[:space:]]*\(' "${TREASURY}"; then
            echo 'unexpected treasury::execute_governance_transfer entrypoint observed'
            exit 1
          fi

      - name: Bind local and cross-role failure semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('mycelix-governance/crates/governance-utils/src/lib.rs').read_text(encoding='utf-8')
          assert 'pub fn call_local(' in source
          assert 'pub fn call_role(' in source
          local = source.split('pub fn call_local(', 1)[1].split('pub fn call_role(', 1)[0]
          role = source.split('pub fn call_role(', 1)[1].split('pub fn call_local_best_effort(', 1)[0]
          assert 'match call(' in local
          assert ')? {' in local
          assert 'ZomeCallResponse::NetworkError(e) => Err' in local
          assert 'other => Err' in local
          assert 'match call(' in role
          assert 'Ok(ZomeCallResponse::NetworkError(e)) => Err' in role
          assert 'Ok(other) => Err' in role
          assert 'Err(e) => Err' in role
          PY

      - name: Bind closed debit surface and DKG continuity observation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          treasury = Path('mycelix-finance/zomes/treasury/coordinator/src/lib.rs').read_text(encoding='utf-8')
          verifier = Path('mycelix-governance/zomes/threshold-signing/coordinator/src/lib.rs').read_text(encoding='utf-8')

          # One helper definition plus exactly two call sites.
          occurrences = [m.start() for m in re.finditer(r'\bdebit_treasury\s*\(', treasury)]
          assert len(occurrences) == 3
          assert treasury.count('debit_treasury(&alloc.treasury_id, alloc.amount)') == 1
          assert treasury.count('debit_treasury(&input.treasury_id, input.amount)') == 1

          assert 'const DKG_THRESHOLD_AMOUNT: u64 = 10_000_000_000;' in treasury
          ordinary = treasury.split('pub fn execute_allocation(', 1)[1].split('/// Internal helper: fetch an allocation', 1)[0]
          debit = treasury.split('fn debit_treasury(', 1)[1].split('/// Internal helper: fetch a treasury', 1)[0]
          dkg = treasury.split('pub fn execute_dkg_allocation(', 1)[1].split('/// Input for a DKG-gated treasury allocation.', 1)[0]

          assert 'alloc.status != AllocationStatus::Approved' in ordinary
          assert 'debit_treasury(&alloc.treasury_id, alloc.amount)' in ordinary
          assert 'DKG_THRESHOLD_AMOUNT' not in ordinary
          assert 'threshold_signature' not in ordinary
          assert 'verify_threshold_signature' not in ordinary

          assert '.checked_sub(amount)' in debit
          assert 'DKG_THRESHOLD_AMOUNT' not in debit
          assert 'threshold_signature' not in debit

          assert 'if input.amount <= DKG_THRESHOLD_AMOUNT' in dkg
          assert 'ZomeName::from("threshold_signing")' in dkg
          assert 'FunctionName::from("verify_threshold_signature")' in dkg
          assert 'threshold_signature' in dkg
          assert 'debit_treasury(&input.treasury_id, input.amount)' in dkg

          assert 'pub fn create_committee(' in verifier
          assert 'verify_threshold_signature' not in verifier
          PY

      - name: Validate source-bound profile twice
        shell: bash
        run: |
          set -euo pipefail
          PROFILE=mycelix-governance/profiles/observed/treasury-credit-downstream-fca2c107-v1.json
          VALIDATOR=mycelix-governance/scripts/validate_ig007t0_treasury_credit_downstream_profile.py
          python "${VALIDATOR}" --profile "${PROFILE}" > /tmp/t0-a.json
          python "${VALIDATOR}" --profile "${PROFILE}" > /tmp/t0-b.json
          cmp /tmp/t0-a.json /tmp/t0-b.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/t0-a.json'))
          assert r['valid'] is True
          assert r['profile_content_sha256']=='9a7094cf377e1275f65e59976013390898f456207a27a0236836a535d1c72ef6'
          assert r['semantic_production_subject_sha']=='fca2c107a1ea5108823ce617ba4111b6f7f77230'
          assert r['evidence_authoring_source_equivalent_head']=='feb30a89257e96592fdbd40b249258581d42fde7'
          assert r['known_issues']==[1085,1086,1134]
          assert r['treasury_debit_callsite_count']==2
          assert r['treasury_debit_callers']==['execute_allocation','execute_dkg_allocation']
          assert r['dkg_verifier_target_occurrences']==0
          assert r['global_dkg_large_allocation_enforcement']=='NotEstablished'
          assert r['positive_containment_count']==6
          assert r['unqualified_property_count']==7
          PY

      - name: Verify checkout immutability
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
