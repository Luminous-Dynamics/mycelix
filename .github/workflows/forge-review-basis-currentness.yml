name: Forge Provider Review-Basis Currentness

on:
  pull_request:
    paths:
      - 'crates/mycelix-forge-review-basis-currentness/**'
      - 'crates/mycelix-forge-merge-protected-review-basis/**'
      - '.github/workflows/forge-review-basis-currentness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: rustfmt
        working-directory: crates/mycelix-forge-review-basis-currentness
        run: cargo fmt -- --check
      - name: clippy
        working-directory: crates/mycelix-forge-review-basis-currentness
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: static currentness firewall
        working-directory: crates/mycelix-forge-review-basis-currentness
        run: |
          ! grep -Eq 'impl.*Deserialize.*ProviderVerifiedReviewBasisCurrentnessV1' src/lib.rs
          ! grep -Eq 'fn.*(authorize|permit|execute|merge)' src/lib.rs
          grep -Fq 'NotCurrent' src/lib.rs
          grep -Fq 'Indeterminate' src/lib.rs
          grep -Fq 'coverage_commitment' src/lib.rs
      - name: tests
        working-directory: crates/mycelix-forge-review-basis-currentness
        run: cargo test --all-features
