name: Mycelix NATS JetStream adapter

on:
  pull_request:
    paths:
      - "tools/myc-dir-fabric-nats-adapter/**"
      - "tools/myc-dir-fabric-nats-reference/**"
      - "tools/myc-dir-fabric-reference/postgres/**"
      - ".github/workflows/myc-dir-nats-adapter.yml"
      - ".github/nats-jetstream-test.conf"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: myc-dir-nats-adapter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-jetstream-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tools/myc-dir-fabric-nats-reference
            tools/myc-dir-fabric-nats-adapter

      - name: Start TLS-enabled PostgreSQL 16.16 effect-owner database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/myc-pg-tls"

          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "${RUNNER_TEMP}/myc-pg-tls/ca.key" \
            -out "${RUNNER_TEMP}/myc-pg-tls/ca.crt" \
            -subj "/CN=Mycelix Test PostgreSQL CA" -days 1

          openssl req -new -newkey rsa:2048 -nodes \
            -keyout "${RUNNER_TEMP}/myc-pg-tls/server.key" \
            -out "${RUNNER_TEMP}/myc-pg-tls/server.csr" \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"

          printf '%s\n' "subjectAltName=DNS:localhost,IP:127.0.0.1" "extendedKeyUsage=serverAuth" \
            > "${RUNNER_TEMP}/myc-pg-tls/server.ext"

          openssl x509 -req \
            -in "${RUNNER_TEMP}/myc-pg-tls/server.csr" \
            -CA "${RUNNER_TEMP}/myc-pg-tls/ca.crt" \
            -CAkey "${RUNNER_TEMP}/myc-pg-tls/ca.key" \
            -CAcreateserial -out "${RUNNER_TEMP}/myc-pg-tls/server.crt" \
            -days 1 -extfile "${RUNNER_TEMP}/myc-pg-tls/server.ext"

          sudo chown 999:999 "${RUNNER_TEMP}/myc-pg-tls/server.key"
          sudo chmod 600 "${RUNNER_TEMP}/myc-pg-tls/server.key"
          sudo chown 999:999 "${RUNNER_TEMP}/myc-pg-tls/server.crt"
          sudo chmod 644 "${RUNNER_TEMP}/myc-pg-tls/server.crt"

          docker run -d --name myc-dir-postgres \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            -v "${RUNNER_TEMP}/myc-pg-tls/server.crt:/var/lib/postgresql/server.crt:ro" \
            -v "${RUNNER_TEMP}/myc-pg-tls/server.key:/var/lib/postgresql/server.key:ro" \
            postgres:16.16 \
            -c ssl=on \
            -c ssl_cert_file=/var/lib/postgresql/server.crt \
            -c ssl_key_file=/var/lib/postgresql/server.key

          for attempt in $(seq 1 60); do
            if docker exec myc-dir-postgres pg_isready -U postgres >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec myc-dir-postgres pg_isready -U postgres

          docker cp tools/myc-dir-fabric-reference/postgres/001_effect_owner.sql \
            myc-dir-postgres:/tmp/001_effect_owner.sql
          docker cp tools/myc-dir-fabric-reference/postgres/002_worker_claim_fencing.sql \
            myc-dir-postgres:/tmp/002_worker_claim_fencing.sql

          docker exec myc-dir-postgres psql -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f /tmp/001_effect_owner.sql
          docker exec myc-dir-postgres psql -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f /tmp/002_worker_claim_fencing.sql

      - name: Start pinned NATS server with JetStream domain
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name myc-dir-nats \
            -p 4222:4222 -p 8222:8222 \
            -v "${GITHUB_WORKSPACE}/.github/nats-jetstream-test.conf:/etc/nats/nats.conf:ro" \
            nats:2.15.3 -c /etc/nats/nats.conf

          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8222/healthz >/dev/null; then
              docker logs myc-dir-nats
              exit 0
            fi
            sleep 1
          done

          docker logs myc-dir-nats
          echo "NATS JetStream did not become healthy" >&2
          exit 1

      - name: Check reference and adapter formatting
        run: |
          cargo fmt --manifest-path tools/myc-dir-fabric-nats-reference/Cargo.toml --check
          cargo fmt --manifest-path tools/myc-dir-fabric-nats-adapter/Cargo.toml --check

      - name: Run dependency-free NATS contract tests
        run: cargo test --manifest-path tools/myc-dir-fabric-nats-reference/Cargo.toml

      - name: Run adapter unit tests
        run: cargo test --manifest-path tools/myc-dir-fabric-nats-adapter/Cargo.toml --lib

      - name: Run real PostgreSQL and JetStream receipt/ACK integration tests
        env:
          NATS_URL: nats://127.0.0.1:4222
          POSTGRES_DSN: host=localhost port=5432 user=postgres password=postgres dbname=postgres sslmode=require
          POSTGRES_CA_FILE: ${{ runner.temp }}/myc-pg-tls/ca.crt
        run: cargo test --manifest-path tools/myc-dir-fabric-nats-adapter/Cargo.toml --test jetstream_integration -- --ignored --nocapture

      - name: Run Clippy on both Rust crates
        run: |
          cargo clippy --manifest-path tools/myc-dir-fabric-nats-reference/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path tools/myc-dir-fabric-nats-adapter/Cargo.toml --all-targets -- -D warnings

      - name: Preserve database and broker logs
        if: always()
        run: |
          docker logs myc-dir-postgres || true
          docker logs myc-dir-nats || true
