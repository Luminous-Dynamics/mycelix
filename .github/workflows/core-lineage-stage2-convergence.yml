name: CORE-LINEAGE Stage 2 Convergence

on:
  pull_request:
    branches:
      - ci/core-lineage-dependency-closure-v0.1
    paths:
      - .github/workflows/core-lineage-stage2-convergence.yml
      - crates/mycelix-authority-evidence-lease/**
      - mycelix-workspace/docs/government/CORE_LINEAGE_STAGE2_CONVERGENCE_V0.1.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Exact CORE-LINEAGE plus EvidenceLease convergence
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Exact qualification subject and two-parent convergence
        id: subject
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          merge=4f93183069437df0b2a7c1b85b5c6032ac1f83af
          lineage=a0ae8538d84ec44f60e8dc5e796320579269581e
          lease=58fa357e53d7e529362c5f766965498ee557d6ce
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$merge"
          mapfile -t parents < <(git show -s --format='%P' "$merge" | tr ' ' '\n')
          test "${#parents[@]}" -eq 2
          test "${parents[0]}" = "$lineage"
          test "${parents[1]}" = "$lease"
          test "$(git rev-parse "${merge}^{tree}")" = "8d02364ee494aa34fe5cbccc0bb5a1264091a78c"

      - name: Exact selective lease import
        id: import
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          lineage=a0ae8538d84ec44f60e8dc5e796320579269581e
          lease=58fa357e53d7e529362c5f766965498ee557d6ce
          merge=4f93183069437df0b2a7c1b85b5c6032ac1f83af
          mapfile -t changed < <(git diff --name-only "$lineage".."$merge" | sort)
          expected=(
            crates/mycelix-authority-evidence-lease/Cargo.toml
            crates/mycelix-authority-evidence-lease/INVARIANTS.md
            crates/mycelix-authority-evidence-lease/src/lib.rs
          )
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq 3
          for i in "${!wanted[@]}"; do
            test "${changed[$i]}" = "${wanted[$i]}"
            test "$(git rev-parse "${merge}:${wanted[$i]}")" = "$(git rev-parse "${lease}:${wanted[$i]}")"
          done

      - name: Exact two-file qualification child
        id: child
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          merge=4f93183069437df0b2a7c1b85b5c6032ac1f83af
          mapfile -t changed < <(git diff --name-only "$merge"..HEAD | sort)
          expected=(
            .github/workflows/core-lineage-stage2-convergence.yml
            mycelix-workspace/docs/government/CORE_LINEAGE_STAGE2_CONVERGENCE_V0.1.md
          )
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq 2
          for i in "${!wanted[@]}"; do test "${changed[$i]}" = "${wanted[$i]}"; done

      - name: Exact qualified CORE-LINEAGE blobs unchanged
        id: blobs
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          lineage=a0ae8538d84ec44f60e8dc5e796320579269581e
          for path in \
            crates/mycelix-core-lineage/Cargo.toml \
            crates/mycelix-core-lineage/Cargo.lock \
            crates/mycelix-core-lineage/src/lib.rs \
            crates/mycelix-core-lineage/vectors/rooted_lineage_v1.json; do
            test "$(git rev-parse "HEAD:${path}")" = "$(git rev-parse "${lineage}:${path}")"
          done

      - name: Static no-authority convergence audit
        id: audit
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          lease=crates/mycelix-authority-evidence-lease/src/lib.rs
          inv=crates/mycelix-authority-evidence-lease/INVARIANTS.md
          doc=mycelix-workspace/docs/government/CORE_LINEAGE_STAGE2_CONVERGENCE_V0.1.md
          grep -F 'pub struct EvidenceLease {' "$lease"
          grep -F 'self.verified_at_ms.max(other.verified_at_ms)' "$lease"
          grep -F 'self.valid_until_ms.min(other.valid_until_ms)' "$lease"
          grep -F 'self.valid_until_ms.min(cap_valid_until_ms)' "$lease"
          grep -F 'Lease is not authority identity' "$inv"
          grep -F '!= qualified Stage-2 current head' "$doc"
          grep -F 'source authentication and closed-world coverage remain #842' "$doc"

      - name: Install exact Rust toolchain
        id: toolchain
        if: always()
        continue-on-error: true
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Re-execute reproducible CORE-LINEAGE
        id: lineage
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          crate="$RUNNER_TEMP/mycelix-core-lineage"
          mkdir -p "$crate"
          cp -a crates/mycelix-core-lineage/. "$crate/"
          expected=f1278453b3baa65c3572183fd85715bbee9e2a7a39f7edda37a54009732f27c1
          test "$(sha256sum "$crate/Cargo.lock" | awk '{print $1}')" = "$expected"
          cargo metadata --manifest-path "$crate/Cargo.toml" --locked --format-version 1 >/dev/null
          cargo fmt --manifest-path "$crate/Cargo.toml" -- --check
          cargo test --manifest-path "$crate/Cargo.toml" --locked --all-targets
          cargo clippy --manifest-path "$crate/Cargo.toml" --locked --all-targets -- -D warnings
          cargo check --manifest-path "$crate/Cargo.toml" --locked --lib --target wasm32-unknown-unknown
          test "$(sha256sum "$crate/Cargo.lock" | awk '{print $1}')" = "$expected"

      - name: Re-execute exact EvidenceLease algebra
        id: lease
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          crate="$RUNNER_TEMP/mycelix-authority-evidence-lease"
          mkdir -p "$crate"
          cp -a crates/mycelix-authority-evidence-lease/. "$crate/"
          cargo fmt --manifest-path "$crate/Cargo.toml" -- --check
          cargo test --manifest-path "$crate/Cargo.toml" --all-targets
          cargo clippy --manifest-path "$crate/Cargo.toml" --all-targets -- -D warnings

      - name: Immutable checkout postflight
        id: immutable
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Fail closed on any convergence defect
        if: always()
        shell: bash
        env:
          SUBJECT_OUTCOME: ${{ steps.subject.outcome }}
          IMPORT_OUTCOME: ${{ steps.import.outcome }}
          CHILD_OUTCOME: ${{ steps.child.outcome }}
          BLOBS_OUTCOME: ${{ steps.blobs.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          LINEAGE_OUTCOME: ${{ steps.lineage.outcome }}
          LEASE_OUTCOME: ${{ steps.lease.outcome }}
          IMMUTABLE_OUTCOME: ${{ steps.immutable.outcome }}
        run: |
          set -euo pipefail
          test "$SUBJECT_OUTCOME" = success
          test "$IMPORT_OUTCOME" = success
          test "$CHILD_OUTCOME" = success
          test "$BLOBS_OUTCOME" = success
          test "$AUDIT_OUTCOME" = success
          test "$TOOLCHAIN_OUTCOME" = success
          test "$LINEAGE_OUTCOME" = success
          test "$LEASE_OUTCOME" = success
          test "$IMMUTABLE_OUTCOME" = success
