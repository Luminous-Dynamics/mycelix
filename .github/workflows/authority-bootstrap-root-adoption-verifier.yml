name: Authority Bootstrap Root Adoption Verifier

on:
  pull_request:
    paths:
      - 'crates/mycelix-authority-bootstrap-root-adoption-verifier/**'
      - 'crates/mycelix-authority-state-bootstrap-root/**'
      - 'crates/mycelix-governance-constitution/**'
      - '.github/workflows/authority-bootstrap-root-adoption-verifier.yml'
  push:
    branches:
      - 'security/authority-bootstrap-root-adoption-proof-v0.1'

permissions:
  contents: read

concurrency:
  group: authority-bootstrap-root-adoption-verifier-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: Exact root-adoption proof qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --manifest-path crates/mycelix-authority-bootstrap-root-adoption-verifier/Cargo.toml -- --check

      - name: Tests
        run: cargo test --manifest-path crates/mycelix-authority-bootstrap-root-adoption-verifier/Cargo.toml --all-targets

      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-authority-bootstrap-root-adoption-verifier/Cargo.toml --all-targets -- -D warnings

      - name: Downstream bootstrap compatibility
        run: cargo check --manifest-path crates/mycelix-authority-state-bootstrap-root/Cargo.toml --all-targets

      - name: Adoption authority audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('crates/mycelix-authority-bootstrap-root-adoption-verifier/src/lib.rs').read_text()
          inv = Path('crates/mycelix-authority-bootstrap-root-adoption-verifier/INVARIANTS.md').read_text().lower()

          proof_block = src.split('pub struct VerifiedBootstrapRootAdoptionProof {', 1)[1].split('}', 1)[0]
          assert 'VerifiedBootstrapRootAdoption' not in proof_block
          assert 'QualifiedBootstrapRootAdoption' not in proof_block

          required = [
              'BootstrapRootAdoptionClaim',
              'VerifiedBootstrapRootAdoptionProof',
              'QualifiedBootstrapRootAdoption',
              'build_adoption_claim(',
              'qualify_bootstrap_root_adoption(',
              'manifest.identity_digest()',
              'current_constitution.digest()',
              'manifest.constitution_statement_digest != statement_digest',
              'manifest.rulebook_digest != rulebook_digest',
              'proof.adoption_claim_digest != claim_digest',
              'proof.verified_adoption_authority_ref != claim.adoption_authority_ref',
              'proof.verified_adoption_ref != claim.adoption_ref',
              'proof.verified_adoption_proof_ref != claim.adoption_proof_ref',
              'proof.valid_until_ms.min(manifest.valid_until_ms)',
              'VerifiedBootstrapRootAdoption {',
              'fn proof_for_another_manifest_denies()',
              'fn constitutional_change_invalidates_manifest_adoption()',
              'fn refreshed_proof_preserves_semantic_qualification_but_changes_evidence()',
          ]
          for token in required:
              assert token in src, token

          assert '#[derive(Clone, Debug, PartialEq, Eq, Serialize)]\npub struct QualifiedBootstrapRootAdoption' in src

          for forbidden in [
              'hdk::',
              '#[hdk_extern]',
              'get_links(',
              'get_details(',
              'create_entry(',
              'call_remote(',
              'execute_actions',
              'phi',
              'reputation',
              'model_score',
          ]:
              assert forbidden.lower() not in src.lower(), forbidden

          assert 'proof verification is not adoption semantics' in inv
          assert 'adoption claim is reconstructed locally' in inv
          assert 'current constitution and rulebook are exact' in inv
          assert 'positive adoption is constructed only by the kernel' in inv
          assert 'stable semantics and dynamic proof evidence are separate' in inv
          assert 'validity can only narrow' in inv
          print('PASS: exact proof authentication is separated from root-adoption semantics and #111 projection')
          PY
