name: MYC-CAP-002G1 Stewardship Decision Gate v1

on:
  pull_request:
    paths:
      - 'scripts/capital/stewardship_decision_gate_v1.py'
      - 'scripts/capital/test_stewardship_decision_gate_v1.py'
      - 'docs/capital/evidence/myc-cap-002g1/**'
      - '.github/workflows/myc-cap-002g1-stewardship-decision-gate-v1.yml'

permissions:
  contents: read

jobs:
  qualify:
    name: Typed stewardship authority matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Exact PR head and parent
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD^)" = "ec7e4b8cc662035e7b0cd0569bb0c23bb2e2bb6a"

      - name: Python environment
        run: |
          set -euo pipefail
          python3 --version
          python3 -m py_compile scripts/capital/stewardship_decision_gate_v1.py
          python3 -m py_compile scripts/capital/test_stewardship_decision_gate_v1.py

      - name: Fail-closed unit suite
        run: |
          set -euo pipefail
          python3 -m unittest -v scripts/capital/test_stewardship_decision_gate_v1.py

      - name: Deterministic example receipt
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          python3 scripts/capital/stewardship_decision_gate_v1.py \
            docs/capital/evidence/myc-cap-002g1/example_case.json \
            --receipt-out "$tmp"
          diff -u docs/capital/evidence/myc-cap-002g1/example_receipt.json "$tmp"
          python3 scripts/capital/stewardship_decision_gate_v1.py \
            docs/capital/evidence/myc-cap-002g1/example_case.json \
            --receipt-out "${tmp}.second"
          cmp "$tmp" "${tmp}.second"

      - name: Frozen commitments
        run: |
          set -euo pipefail
          echo '3a0a22eb368b13ac67103bc94d596ebdbe77df7921053526d9be65c5d185a58a  docs/capital/evidence/myc-cap-002g1/example_case.json' | sha256sum -c -
          echo '5a330393381cdce9bd3d509a3aeab50fe66bb9c688cfc479c1bcb5efc0cbdccc  docs/capital/evidence/myc-cap-002g1/example_receipt.json' | sha256sum -c -
          echo 'c7b53e5d7e3e7f534b827581dafd225f2583495b3f03d417361bea0604685692  scripts/capital/stewardship_decision_gate_v1.py' | sha256sum -c -
          echo '00c55a662bf13e122df277ae92a391240a3d162ea41f0808b95614c2eb4a44d5  scripts/capital/test_stewardship_decision_gate_v1.py' | sha256sum -c -

      - name: Strong nonclaims
        run: |
          set -euo pipefail
          grep -Fq '"asset_lock_removed":false' docs/capital/evidence/myc-cap-002g1/example_receipt.json
          grep -Fq '"legal_validity_established":false' docs/capital/evidence/myc-cap-002g1/example_receipt.json
          grep -Fq '"democratic_legitimacy_established":false' docs/capital/evidence/myc-cap-002g1/example_receipt.json
