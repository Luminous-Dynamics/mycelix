name: Identity Historical Activation Time Receipt Ed25519 Authenticity V2

on:
  pull_request:
    paths:
      - 'mycelix-workspace/mycelix-identity/Cargo.toml'
      - 'mycelix-workspace/mycelix-identity/crates/historical-activation-time-receipt-ed25519-authenticity/**'
      - 'mycelix-workspace/mycelix-identity/crates/historical-activation-time-receipt-crypto-request-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/historical-activation-time-authority-key-generation-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/historical-activation-time-authority-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/historical-activation-time-receipt-policy/**'
      - '.github/workflows/identity-historical-activation-time-receipt-ed25519-authenticity-v2.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-workspace/mycelix-identity/Cargo.toml'
      - 'mycelix-workspace/mycelix-identity/crates/historical-activation-time-receipt-ed25519-authenticity/**'
      - 'mycelix-workspace/mycelix-identity/crates/historical-activation-time-receipt-crypto-request-policy/**'
      - '.github/workflows/identity-historical-activation-time-receipt-ed25519-authenticity-v2.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify-ed25519-time-receipt-authenticity-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Assert strict Ed25519 authenticity boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          root = Path('mycelix-workspace/mycelix-identity')
          member = 'crates/historical-activation-time-receipt-ed25519-authenticity'
          workspace = tomllib.loads((root / 'Cargo.toml').read_text())['workspace']['members']
          if member not in workspace:
              raise SystemExit(f'ERROR: {member} is not an explicit Identity workspace member')

          manifest = tomllib.loads((root / member / 'Cargo.toml').read_text())
          deps = manifest.get('dependencies', {})
          expected = {
              'ed25519-dalek',
              'mycelix-crypto',
              'mycelix-historical-activation-time-receipt-crypto-request-policy',
              'sha2',
          }
          if set(deps) != expected:
              raise SystemExit(f'ERROR: authenticity runtime dependency drift: {sorted(deps)}')
          dalek = deps['ed25519-dalek']
          if dalek.get('version') != '=2.2.0' or dalek.get('default-features') is not False:
              raise SystemExit('ERROR: ed25519-dalek must be pinned exactly to 2.2.0 with default features disabled')
          if deps['mycelix-crypto'].get('workspace') is not True:
              raise SystemExit('ERROR: authenticity adapter must use workspace mycelix-crypto types only')
          if deps['sha2'].get('workspace') is not True:
              raise SystemExit('ERROR: authenticity adapter must use workspace sha2')
          if deps['mycelix-historical-activation-time-receipt-crypto-request-policy'].get('path') != '../historical-activation-time-receipt-crypto-request-policy':
              raise SystemExit('ERROR: prepared-request dependency path drifted')

          dev = manifest.get('dev-dependencies', {})
          expected_dev = {
              'mycelix-historical-activation-time-receipt-policy',
              'mycelix-historical-activation-time-authority-policy',
              'mycelix-historical-activation-time-authority-key-generation-policy',
          }
          if set(dev) != expected_dev:
              raise SystemExit(f'ERROR: authenticity dev dependency drift: {sorted(dev)}')

          text = (root / member / 'src/lib.rs').read_text()
          required = [
              '#![forbid(unsafe_code)]',
              'CryptographicallyAuthenticatedHistoricalActivationTimeReceiptV2',
              'HISTORICAL_ACTIVATION_TIME_RECEIPT_ED25519_AUTHENTICITY_DOMAIN_V2',
              'mycelix:identity:historical-activation-time-receipt-ed25519-authenticity:v2\\0',
              'authenticate_historical_activation_time_receipt_ed25519_v2',
              'request.algorithm() != AlgorithmId::Ed25519',
              'AlgorithmPendingQualification',
              'VerifyingKey::from_bytes',
              '.verify_strict(request.receipt_signing_digest_sha256(), &signature)',
              '0x8c, 0xce, 0xbf, 0x8e',
              'tampered_signature_fails_strict_verification',
              'authenticated_result_fields_are_private',
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'ERROR: strict authenticity invariant missing: {needle!r}')

          result_start = text.index('pub struct CryptographicallyAuthenticatedHistoricalActivationTimeReceiptV2')
          result_end = text.index('impl CryptographicallyAuthenticatedHistoricalActivationTimeReceiptV2', result_start)
          result_body = text[result_start:result_end]
          for field in [
              'pub activation_subject_sha256:',
              'pub receipt_signing_digest_sha256:',
              'pub crypto_request_digest_sha256:',
              'pub authenticity_digest_sha256:',
          ]:
              if field in result_body:
                  raise SystemExit(f'ERROR: authenticity capability is caller-forgeable: {field}')

          lower = text.lower()
          for forbidden in [
              'pqcrypto', 'ml_dsa', 'ml-dsa', 'dilithium', 'hybrid_sig',
              'use hdk', 'hdk::', '#[hdk_extern]', 'dna_info(', 'sys_time(', 'std::time',
              'policy_current', 'policy_accepted', 'trusted_time', 'historical_eligibility',
              'positive_evidence', 'dyn verifier', '&dyn verifier', 'impl verifier',
          ]:
              if forbidden in lower:
                  raise SystemExit(f'ERROR: PQ/runtime/currentness authority leaked into Ed25519 authenticity adapter: {forbidden!r}')
          PY

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-workspace/mycelix-identity

      - name: Check formatting
        run: |
          cargo fmt --manifest-path mycelix-workspace/mycelix-identity/crates/historical-activation-time-receipt-ed25519-authenticity/Cargo.toml -- --check

      - name: Test prepared crypto request
        run: |
          cargo test --manifest-path mycelix-workspace/mycelix-identity/crates/historical-activation-time-receipt-crypto-request-policy/Cargo.toml

      - name: Test strict Ed25519 authenticity
        run: |
          cargo test --manifest-path mycelix-workspace/mycelix-identity/crates/historical-activation-time-receipt-ed25519-authenticity/Cargo.toml
