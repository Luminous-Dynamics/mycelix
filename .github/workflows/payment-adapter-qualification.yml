name: Payment Adapter Qualification

on:
  pull_request:
    paths:
      - 'docs/finance/PAYMENT_ADAPTER_QUALIFICATION_MATRIX_V1.md'
      - 'docs/finance/payment-adapter-qualification-v1.json'
      - 'tools/finance/payment_adapter_lifecycle_smoke.py'
      - 'tools/finance/verify_payment_adapter_corpus.py'
      - '.github/workflows/payment-adapter-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'docs/finance/PAYMENT_ADAPTER_QUALIFICATION_MATRIX_V1.md'
      - 'docs/finance/payment-adapter-qualification-v1.json'
      - 'tools/finance/payment_adapter_lifecycle_smoke.py'
      - 'tools/finance/verify_payment_adapter_corpus.py'
      - '.github/workflows/payment-adapter-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-qualification:
    name: Effects-disabled payment qualification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile tools/finance/verify_payment_adapter_corpus.py tools/finance/payment_adapter_lifecycle_smoke.py
      - name: Verify qualification corpus and reject unsafe mutations
        run: python tools/finance/verify_payment_adapter_corpus.py --self-test
      - name: Run effects-disabled lifecycle and concurrency scenarios
        run: python tools/finance/payment_adapter_lifecycle_smoke.py
