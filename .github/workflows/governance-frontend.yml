name: Governance Frontend

on:
  pull_request:
    paths:
      - 'mycelix-governance/apps/leptos/**'
      - 'mycelix-workspace/mycelix-governance/apps/leptos/**'
      - 'crates/mycelix-leptos-core/**'
      - 'crates/mycelix-leptos-ui/**'
      - 'crates/mycelix-leptos-client/**'
      - '.github/workflows/governance-frontend.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-governance/apps/leptos/**'
      - 'mycelix-workspace/mycelix-governance/apps/leptos/**'
      - 'crates/mycelix-leptos-core/**'
      - 'crates/mycelix-leptos-ui/**'
      - 'crates/mycelix-leptos-client/**'
      - '.github/workflows/governance-frontend.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  governance-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify exported Governance frontend mirrors
        shell: bash
        run: |
          diff -ru \
            --exclude Cargo.toml \
            mycelix-governance/apps/leptos \
            mycelix-workspace/mycelix-governance/apps/leptos

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            mycelix-governance/apps/leptos
            mycelix-workspace/mycelix-governance/apps/leptos
            crates/mycelix-leptos-core
            crates/mycelix-leptos-ui
            crates/mycelix-leptos-client

      - name: Verify both exported manifests resolve locally
        run: |
          cargo metadata --format-version 1 --no-deps \
            --manifest-path mycelix-governance/apps/leptos/Cargo.toml >/dev/null
          cargo metadata --format-version 1 --no-deps \
            --manifest-path mycelix-workspace/mycelix-governance/apps/leptos/Cargo.toml >/dev/null

      - name: Check Governance frontend formatting
        run: |
          cargo fmt --manifest-path mycelix-governance/apps/leptos/Cargo.toml --all -- --check
          cargo fmt --manifest-path mycelix-workspace/mycelix-governance/apps/leptos/Cargo.toml --all -- --check

      - name: Check Governance frontends for wasm32
        run: |
          cargo check --manifest-path mycelix-governance/apps/leptos/Cargo.toml --target wasm32-unknown-unknown
          cargo check --manifest-path mycelix-workspace/mycelix-governance/apps/leptos/Cargo.toml --target wasm32-unknown-unknown
