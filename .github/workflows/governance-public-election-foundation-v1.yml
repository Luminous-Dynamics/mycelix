name: Governance Public Election Foundation v1

on:
  pull_request:
    paths:
      - '.github/workflows/governance-public-election-foundation-v1.yml'
      - 'mycelix-governance/crates/election-integrity-types/**'
      - 'mycelix-governance/docs/PUBLIC_ELECTION_INTEGRITY_V1.md'

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: '1.96.0'
  BASE_SHA: 'a5b9873384b8e934836162c7a4acf71b8298568e'

jobs:
  qualify:
    name: Qualify public-election foundation
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/governance-public-election-foundation-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Bind exact foundation delta
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          test "${#changed[@]}" -eq 4
          printf '%s\n' "${changed[@]}" | sort > /tmp/election-foundation-files.txt
          cat > /tmp/election-foundation-expected.txt <<'EOF'
          .github/workflows/governance-public-election-foundation-v1.yml
          mycelix-governance/crates/election-integrity-types/Cargo.toml
          mycelix-governance/crates/election-integrity-types/src/lib.rs
          mycelix-governance/docs/PUBLIC_ELECTION_INTEGRITY_V1.md
          EOF
          sort -o /tmp/election-foundation-expected.txt /tmp/election-foundation-expected.txt
          diff -u /tmp/election-foundation-expected.txt /tmp/election-foundation-files.txt
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt,clippy

      - name: Format foundation crate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path mycelix-governance/crates/election-integrity-types/Cargo.toml -- --check

      - name: Generate exact dependency lock
        shell: bash
        run: |
          set -euo pipefail
          cd mycelix-governance/crates/election-integrity-types
          cargo generate-lockfile
          cp Cargo.lock /tmp/election-integrity-foundation-Cargo.lock
          sha256sum Cargo.lock | tee /tmp/election-integrity-foundation-lock.sha256
          cargo metadata --locked --format-version 1 > /tmp/election-integrity-foundation-metadata.json

      - name: Run foundation theorem tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path mycelix-governance/crates/election-integrity-types/Cargo.toml --locked 2>&1 | tee /tmp/election-integrity-foundation-test.log

      - name: Run warning-fatal library Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path mycelix-governance/crates/election-integrity-types/Cargo.toml --locked --lib -- -D warnings 2>&1 | tee /tmp/election-integrity-foundation-clippy.log

      - name: Audit public-election authority boundary
        shell: bash
        run: |
          set -euo pipefail
          src='mycelix-governance/crates/election-integrity-types/src/lib.rs'
          grep -F 'InfluenceMustBeEqualWeight' "$src"
          grep -F 'IdentityBearingBallotsForbidden' "$src"
          grep -F 'RemoteMarkedBallotTransmissionForbidden' "$src"
          grep -F 'UnresolvedQualifyingChallenges' "$src"
          grep -F 'IndependentVerifierQuorumNotPassed' "$src"
          grep -F 'SoftwareIndependence' "$src"
          grep -F 'ReceiptFreeness' "$src"
          if grep -Eq '^use (hdk|hdi|mycelix_zkp_core|voting_integrity)' "$src"; then
            echo 'Foundation crate must remain independent of runtime/ballot-crypto authority' >&2
            exit 1
          fi

      - name: Remove transient lock and prove immutable checkout
        if: always()
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          rm -f mycelix-governance/crates/election-integrity-types/Cargo.lock
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git status --porcelain=v1 --untracked-files=all > /tmp/election-integrity-foundation-status.txt
          test ! -s /tmp/election-integrity-foundation-status.txt

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: election-integrity-foundation-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: |
            /tmp/election-integrity-foundation-Cargo.lock
            /tmp/election-integrity-foundation-lock.sha256
            /tmp/election-integrity-foundation-metadata.json
            /tmp/election-integrity-foundation-test.log
            /tmp/election-integrity-foundation-clippy.log
            /tmp/election-integrity-foundation-status.txt
          if-no-files-found: warn
          retention-days: 30
