name: Identity Authority-Scoped Verifier Policy V2

on:
  pull_request:
    paths:
      - 'mycelix-workspace/mycelix-identity/Cargo.toml'
      - 'mycelix-workspace/mycelix-identity/crates/identity-authority-domain-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/kvector-verifier-policy-body/**'
      - 'mycelix-workspace/mycelix-identity/crates/authority-scoped-kvector-verification-record-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/authority-scoped-verifier-policy/**'
      - '.github/workflows/identity-authority-scoped-verifier-policy-v2.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-workspace/mycelix-identity/Cargo.toml'
      - 'mycelix-workspace/mycelix-identity/crates/identity-authority-domain-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/kvector-verifier-policy-body/**'
      - 'mycelix-workspace/mycelix-identity/crates/authority-scoped-kvector-verification-record-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/authority-scoped-verifier-policy/**'
      - '.github/workflows/identity-authority-scoped-verifier-policy-v2.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify-authority-scoped-verifier-policy-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Assert authority-scoped verifier-policy boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          root = Path('mycelix-workspace/mycelix-identity')
          member = 'crates/authority-scoped-verifier-policy'
          workspace = tomllib.loads((root / 'Cargo.toml').read_text())
          if member not in workspace['workspace']['members']:
              raise SystemExit(f'ERROR: {member} is not an explicit Identity workspace member')

          manifest = tomllib.loads((root / member / 'Cargo.toml').read_text())
          deps = manifest.get('dependencies', {})
          expected = {
              'mycelix-authority-scoped-kvector-verification-record-policy',
              'mycelix-identity-authority-domain-policy',
              'mycelix-kvector-verifier-policy-body',
              'sha2',
          }
          if set(deps) != expected:
              raise SystemExit(f'ERROR: authority-scoped policy dependency drift: {sorted(deps)}')
          if deps['mycelix-authority-scoped-kvector-verification-record-policy'].get('path') != '../authority-scoped-kvector-verification-record-policy':
              raise SystemExit('ERROR: scoped policy must bind #374 record envelope')
          if deps['mycelix-identity-authority-domain-policy'].get('path') != '../identity-authority-domain-policy':
              raise SystemExit('ERROR: scoped policy must bind #369 domain theorem')
          if deps['mycelix-kvector-verifier-policy-body'].get('path') != '../kvector-verifier-policy-body':
              raise SystemExit('ERROR: scoped policy must bind converged #248 theorem')
          if deps['sha2'].get('workspace') is not True:
              raise SystemExit('ERROR: scoped policy must use workspace sha2')

          text = (root / member / 'src/lib.rs').read_text()
          required = [
              '#![forbid(unsafe_code)]',
              'QualifiedIdentityAuthorityDomainV2',
              'KVectorVerifierPolicyBodyV2',
              'QualifiedAuthorityScopedVerifierPolicyV2',
              'AUTHORITY_SCOPED_KVECTOR_VERIFIER_POLICY_DOMAIN_V2',
              'mycelix:identity:kvector-verifier-policy:authority-scoped:v2\\0',
              'derive_kvector_verifier_policy_digest_v2',
              'derive_authority_scoped_verifier_policy_digest_v2',
              'qualify_authority_scoped_verifier_policy_v2',
              'validate_authority_scoped_verification_record_against_policy_v2',
              'record.authority_domain_sha256 != scoped_policy.authority_domain_digest_sha256()',
              'base_policy_digest.as_slice() != scoped_policy.base_policy_digest_sha256()',
              'validate_kvector_verification_record_against_policy_body_v2',
              'same_static_policy_in_different_dna_is_different_scoped_policy',
              'record_and_policy_require_exact_domain_equality',
              'base_policy_substitution_fails_closed',
              'qualified_scoped_policy_fields_are_verifier_owned',
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'ERROR: scoped policy theorem missing: {needle!r}')

          result_start = text.index('pub struct QualifiedAuthorityScopedVerifierPolicyV2')
          result_end = text.index('impl QualifiedAuthorityScopedVerifierPolicyV2', result_start)
          result_body = text[result_start:result_end]
          for public_field in [
              'pub authority_domain_digest_sha256:',
              'pub base_policy_digest_sha256:',
              'pub scoped_policy_digest_sha256:',
          ]:
              if public_field in result_body:
                  raise SystemExit(f'ERROR: scoped policy capability is forgeable: {public_field}')

          lower = text.lower()
          for forbidden in [
              'use hdk', 'use hdi', 'hdk::', 'hdi::', 'dna_info(', 'network_seed',
              'sys_time(', 'std::time', '.verify(', 'policy_current', 'policy_accepted',
              'positive_evidence', 'resolve_did(', 'max_by_key',
          ]:
              if forbidden in lower:
                  raise SystemExit(f'ERROR: runtime/currentness/signature authority leaked into scoped policy: {forbidden!r}')
          PY

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-workspace/mycelix-identity

      - name: Check formatting
        run: |
          cargo fmt --manifest-path mycelix-workspace/mycelix-identity/crates/authority-scoped-verifier-policy/Cargo.toml -- --check

      - name: Test static verifier policy
        run: |
          cargo test --manifest-path mycelix-workspace/mycelix-identity/crates/kvector-verifier-policy-body/Cargo.toml

      - name: Test authority-scoped signed record
        run: |
          cargo test --manifest-path mycelix-workspace/mycelix-identity/crates/authority-scoped-kvector-verification-record-policy/Cargo.toml

      - name: Test authority-scoped verifier policy
        run: |
          cargo test --manifest-path mycelix-workspace/mycelix-identity/crates/authority-scoped-verifier-policy/Cargo.toml

      - name: Check authority-scoped verifier policy for wasm32
        run: |
          cargo check --manifest-path mycelix-workspace/mycelix-identity/crates/authority-scoped-verifier-policy/Cargo.toml --target wasm32-unknown-unknown
