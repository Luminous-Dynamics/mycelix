name: Marketplace Format Repair

on:
  push:
    branches:
      - marketplace-inventory-algebra

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[auto-format]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Format Marketplace PR-local Rust
        working-directory: mycelix-workspace/mycelix-marketplace/backend
        shell: bash
        run: |
          set -euo pipefail

          cargo fmt --all

          allowed=(
            "zomes/transactions/coordinator/src/lib.rs"
            "zomes/transactions/coordinator/src/tests.rs"
            "zomes/transactions/integrity/src/lib.rs"
            "zomes/transactions/integrity/src/reservation.rs"
            "zomes/transactions/integrity/src/reservation_certificate.rs"
          )

          git diff -- "${allowed[@]}"
          if git diff --quiet -- "${allowed[@]}"; then
            echo "PR-local formatting already clean."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${allowed[@]}"
          git commit -m "style(marketplace): apply rustfmt [auto-format]"
          git push
