name: Governance Executor Provider Contract

on:
  pull_request:
    paths:
      - 'crates/mycelix-governance-executor-provider-contract/**'
      - 'crates/mycelix-governance-current-executor-authority/**'
      - 'crates/mycelix-governance-executor-lineage/**'
      - 'crates/mycelix-governance-executor-designation/**'
      - 'crates/mycelix-governance-threshold-qualification/**'
      - 'crates/mycelix-authority-delegation/**'
      - 'crates/mycelix-authority-delegation-policy/**'
      - 'crates/mycelix-authority-freshness/**'
      - 'crates/mycelix-authority-identity/**'
      - 'crates/mycelix-institutional-core/**'
      - '.github/workflows/governance-executor-provider-contract.yml'
  push:
    branches:
      - 'security/governance-executor-provider-contract-v0.1'

permissions:
  contents: read

concurrency:
  group: governance-executor-provider-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: Current executor provider projection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path crates/mycelix-governance-executor-provider-contract/Cargo.toml -- --check
      - name: Tests
        run: cargo test --manifest-path crates/mycelix-governance-executor-provider-contract/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-governance-executor-provider-contract/Cargo.toml --all-targets -- -D warnings
      - name: Authority-projection audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('crates/mycelix-governance-executor-provider-contract/src/lib.rs').read_text()
          invariants = Path('crates/mycelix-governance-executor-provider-contract/INVARIANTS.md').read_text()

          required = [
              'qualify_current_executor_authority',
              'CurrentExecutorAuthorityProjection',
              'VerifiedCurrentExecutorAuthorityReceipt',
              'CURRENT_EXECUTOR_AUTHORITY_PROFILE',
              'THRESHOLD_AUTHORIZATION_IDENTITY_PROFILE',
              'EXECUTOR_LINEAGE_AUTHORITY_PROFILE',
              'AUTHORITY_GRANT_IDENTITY_PROFILE',
              'BUNDLE_IDENTITY_PROFILE',
              'executor_authority_ref',
              'ExecutorAuthorityRefMismatch',
          ]
          for token in required:
              assert token in src, token

          assert 'caller-provided authority ref' in invariants
          assert 'generation-sensitive without ABI churn' in invariants
          assert 'Historical verification is separate' in invariants

          lowered = src.lower()
          assert 'phi' not in lowered
          assert 'reputation' not in lowered
          assert 'model_score' not in lowered
          assert 'external_effect' not in lowered
          print('PASS: lifecycle executor ref is a deterministic projection of exact current executor authority')
          PY
