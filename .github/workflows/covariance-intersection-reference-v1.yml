name: Covariance Intersection Reference V1

on:
  push:
    branches:
      - research/covariance-intersection-reference-v1
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - '.github/workflows/covariance-intersection-reference-v1.yml'
      - 'mycelix-position/Cargo.lock'
      - 'mycelix-position/Cargo.toml'
      - 'mycelix-position/lib/positioning/Cargo.toml'
      - 'mycelix-position/lib/positioning/src/fusion.rs'
      - 'mycelix-position/lib/positioning/tests/covariance_intersection_reference_v1.rs'
      - 'mycelix-position/lib/positioning/tests/data/covariance-intersection-reference-v1.json'
      - 'mycelix-workspace/mycelix-position/Cargo.lock'
      - 'mycelix-workspace/mycelix-position/Cargo.toml'
      - 'mycelix-workspace/mycelix-position/lib/positioning/Cargo.toml'
      - 'mycelix-workspace/mycelix-position/lib/positioning/src/fusion.rs'
      - 'mycelix-workspace/mycelix-position/lib/positioning/tests/covariance_intersection_reference_v1.rs'
      - 'mycelix-workspace/mycelix-position/lib/positioning/tests/data/covariance-intersection-reference-v1.json'
      - 'docs/research/COVARIANCE_INTERSECTION_REFERENCE_V1_2026-10.md'

permissions:
  contents: read

concurrency:
  group: covariance-intersection-reference-v1-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: /tmp/mycelix-covariance-reference-${{ github.run_id }}-${{ github.run_attempt }}
  QUALIFIED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  reference:
    name: Exact-head diagonal CI reference and mirror qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact qualification subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact head and clean preflight
        run: |
          test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"
          test -z "$(git status --porcelain=v1 -uall)"

      - name: Verify mirrored source and qualification-input parity
        run: |
          compare_paths() {
            left="$1"
            right="$2"
            left_blob="$(git hash-object "$left")"
            right_blob="$(git hash-object "$right")"
            test "$left_blob" = "$right_blob"
            echo "mirror=$left,$right,blob=$left_blob"
          }
          compare_paths mycelix-position/lib/positioning/src/fusion.rs mycelix-workspace/mycelix-position/lib/positioning/src/fusion.rs
          compare_paths mycelix-position/lib/positioning/Cargo.toml mycelix-workspace/mycelix-position/lib/positioning/Cargo.toml
          compare_paths mycelix-position/Cargo.toml mycelix-workspace/mycelix-position/Cargo.toml
          compare_paths mycelix-position/Cargo.lock mycelix-workspace/mycelix-position/Cargo.lock
          compare_paths mycelix-position/lib/positioning/tests/covariance_intersection_reference_v1.rs mycelix-workspace/mycelix-position/lib/positioning/tests/covariance_intersection_reference_v1.rs
          compare_paths mycelix-position/lib/positioning/tests/data/covariance-intersection-reference-v1.json mycelix-workspace/mycelix-position/lib/positioning/tests/data/covariance-intersection-reference-v1.json
          {
            echo "production_mirror_parity=PASS"
            echo "reference_input_parity=PASS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # master @ 2025-08-23
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Assert toolchain identity
        run: |
          test "$(rustc +1.96.0 --version)" = "rustc 1.96.0 (ac68faa20 2026-05-25)"
          rustfmt +1.96.0 --version
          cargo +1.96.0 --version

      - name: Check formatting for both mirrored packages
        run: |
          cargo +1.96.0 fmt --manifest-path mycelix-position/Cargo.toml --package positioning -- --check
          cargo +1.96.0 fmt --manifest-path mycelix-workspace/mycelix-position/Cargo.toml --package positioning -- --check

      - name: Validate locked package metadata
        run: |
          cargo +1.96.0 metadata --manifest-path mycelix-position/Cargo.toml --locked --no-deps --format-version 1 > /dev/null
          cargo +1.96.0 metadata --manifest-path mycelix-workspace/mycelix-position/Cargo.toml --locked --no-deps --format-version 1 > /dev/null

      - name: Run positioning package and reference tests in primary workspace
        run: cargo +1.96.0 test --manifest-path mycelix-position/Cargo.toml --locked -p positioning

      - name: Run positioning package and reference tests in mirrored workspace
        run: cargo +1.96.0 test --manifest-path mycelix-workspace/mycelix-position/Cargo.toml --locked -p positioning

      - name: Verify clean postflight and emit evidence
        run: |
          test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"
          postflight_status="$(git status --porcelain=v1 -uall)"
          if [ -n "$postflight_status" ]; then
            echo "Unexpected repository changes after verification:"
            printf '%s\\n' "$postflight_status"
            exit 1
          fi
          {
            echo "profile=DiagonalCovarianceIntersectionReferenceV1"
            echo "status=reference-gate-passed"
            echo "qualified_sha=$QUALIFIED_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "runner_os=$RUNNER_OS"
            echo "rust=$(rustc +1.96.0 --version)"
            echo "rust_commit=$(rustc +1.96.0 --version --verbose | sed -n 's/^commit-hash: //p')"
            echo "cargo=$(cargo +1.96.0 --version)"
            echo "rustfmt=$(rustfmt +1.96.0 --version)"
            echo "fusion_blob=$(git hash-object mycelix-position/lib/positioning/src/fusion.rs)"
            echo "reference_test_blob=$(git hash-object mycelix-position/lib/positioning/tests/covariance_intersection_reference_v1.rs)"
            echo "reference_corpus_blob=$(git hash-object mycelix-position/lib/positioning/tests/data/covariance-intersection-reference-v1.json)"
            echo "covariance_intersection_reference=QUALIFIED_IF_ALL_STEPS_PASS"
            echo "PeerFusion3D_implementation=NOT_QUALIFIED_BY_THIS_REFERENCE"
            echo "full_covariance_matrix_CI=NOT_ESTABLISHED"
            echo "multi_source_optimization=NOT_ESTABLISHED"
            echo "postflight=clean"
          } >> "$GITHUB_STEP_SUMMARY"
