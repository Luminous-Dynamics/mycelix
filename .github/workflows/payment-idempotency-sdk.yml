name: Payment Idempotency SDK Qualification

on:
  pull_request:
    paths:
      - 'mycelix-workspace/sdk-ts/src/clients/finance/**'
      - 'mycelix-workspace/sdk-ts/src/wallet/**'
      - 'mycelix-workspace/sdk-ts/tests/wallet.test.ts'
      - 'mycelix-workspace/sdk-ts/package.json'
      - 'mycelix-workspace/sdk-ts/package-lock.json'
      - 'docs/finance/AC-172_PAYMENT_IDEMPOTENCY_V1.md'
      - 'mycelix-finance/crates/finance-wire-types/**'
      - 'mycelix-workspace/mycelix-finance/crates/finance-wire-types/**'
      - 'mycelix-finance/zomes/payments/**'
      - 'mycelix-workspace/mycelix-finance/zomes/payments/**'
      - 'mycelix-finance/tests/payments_test.rs'
      - 'mycelix-workspace/mycelix-finance/tests/payments_test.rs'
      - 'mycelix-finance/tests/fixtures/mod.rs'
      - 'mycelix-workspace/mycelix-finance/tests/fixtures/mod.rs'
      - 'mycelix-finance/tests/sweettest_integration.rs'
      - 'mycelix-workspace/mycelix-finance/tests/sweettest_integration.rs'
      - 'mycelix-finance/apps/leptos/**'
      - 'mycelix-workspace/mycelix-finance/apps/leptos/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/payment-idempotency-sdk.yml'

permissions:
  contents: read

concurrency:
  group: payment-idempotency-sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  payment-idempotency-sdk:
    name: Wallet and Finance idempotency contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact source head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node v7.1.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mycelix-workspace/sdk-ts/package-lock.json
      - name: Install TypeScript SDK dependencies
        working-directory: mycelix-workspace/sdk-ts
        run: npm ci
      - name: Run focused payment idempotency regressions
        working-directory: mycelix-workspace/sdk-ts
        run: >-
          npx vitest run
          src/clients/finance/__tests__/finance.test.ts
          tests/wallet.test.ts
          -t "sendPayment extracts entry from record|HolochainFinanceProvider payment idempotency|should dedupe exact payloads by idempotency key|should assign one key to an unkeyed generic send|should reject conflicting payload and metadata keys before persistence|should serialize concurrent enqueues with the same key|should resolve the same key across separate queue instances|should reject changed payload under an existing idempotency key|should preserve key binding after a queue item is cancelled|should preserve an explicit payment key in the persisted payload|should forward the persisted payment key to the executor"
      - name: Typecheck SDK source
        working-directory: mycelix-workspace/sdk-ts
        run: npm run typecheck
