name: Construction provenance core

on:
  pull_request:
    branches: [main]
    paths:
      - "mycelix-workspace/standalone/construction-provenance-core/**"
      - ".github/workflows/construction-provenance-core.yml"
  push:
    branches: [main]
    paths:
      - "mycelix-workspace/standalone/construction-provenance-core/**"
      - ".github/workflows/construction-provenance-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: construction-provenance-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate versioned trace fixture
        run: python3 mycelix-workspace/standalone/construction-provenance-core/tests/validate_fixture.py
      - name: Format
        run: cargo fmt --manifest-path mycelix-workspace/standalone/construction-provenance-core/Cargo.toml -- --check
      - name: Locked offline tests
        run: cargo test --locked --manifest-path mycelix-workspace/standalone/construction-provenance-core/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path mycelix-workspace/standalone/construction-provenance-core/Cargo.toml --all-targets -- -D warnings
