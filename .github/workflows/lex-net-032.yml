name: LEX-NET-032 R2 Qualification

on:
  pull_request:
    paths:
      - 'docs/lex-net/LEX_NET_CANONICAL_INTERPRETATION_V1.md'
      - 'docs/lex-net/lex_net_032_manifest.json'
      - 'scripts/validate_lex_net_032.py'
      - '.github/workflows/lex-net-032.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Prove exact qualified parent and review surface
        run: python3 scripts/validate_lex_net_032.py --scope

      - name: Validate resource-bounded interpretation contract and corpus
        run: |
          python3 scripts/validate_lex_net_032.py --self-test
          python3 scripts/validate_lex_net_032.py --semantic

      - name: Independent static non-escalation and resource-bound audit
        shell: python
        run: |
          from pathlib import Path
          import json

          doc = Path('docs/lex-net/LEX_NET_CANONICAL_INTERPRETATION_V1.md').read_text(encoding='utf-8').casefold()
          manifest = json.loads(Path('docs/lex-net/lex_net_032_manifest.json').read_text(encoding='utf-8'))
          script = Path('scripts/validate_lex_net_032.py').read_text(encoding='utf-8').casefold()

          required = [
              'signature-valid bytes != parser agreement != canonical-data agreement != semantic agreement != local recognition',
              'maximum source bytes: `65536`',
              'maximum structural nesting depth: `32`',
              'maximum members/items in any one object/array: `256`',
              'resource-limit compliance does not establish safety beyond the frozen profile',
              'grants_local_authority = false',
              'grants_external_effect_authority = false',
              'does not claim rfc 8785',
          ]
          for phrase in required:
              if phrase not in doc:
                  raise SystemExit(f'missing normative phrase: {phrase}')

          expected_limits = {
              'max_source_bytes': 65536,
              'max_nesting_depth': 32,
              'max_container_items': 256,
              'max_string_utf8_bytes': 16384,
              'max_key_utf8_bytes': 1024,
          }
          profile = manifest.get('interpretation_profile', {})
          if profile.get('resource_limits') != expected_limits:
              raise SystemExit('resource-limit manifest drift')
          if profile.get('canonicalizer_external_standard_claim') is not False:
              raise SystemExit('synthetic canonicalizer must not claim external conformance')
          if len(manifest.get('fixtures', [])) != 28:
              raise SystemExit('golden fixture census drift')
          for token in ('requests.', 'httpx', 'urllib.request', 'socket.'):
              if token in script:
                  raise SystemExit('validator must not perform network I/O')
          for token in ('max_source_bytes=65536', 'max_nesting_depth=32', 'max_container_items=256',
                        'max_string_utf8_bytes=16384', 'max_key_utf8_bytes=1024'):
              if token not in script.replace(' ', ''):
                  raise SystemExit(f'validator resource constant missing: {token}')

          print('LEX-NET-032 R2 independent audit PASS')

      - name: Immutable checkout postflight
        run: |
          python3 scripts/validate_lex_net_032.py --scope
          test -z "$(git status --porcelain)"
          git diff --exit-code
