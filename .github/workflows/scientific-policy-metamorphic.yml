name: Scientific Policy Metamorphic and Engine Invariance

on:
  pull_request:
    paths:
      - "tools/scientific-policy-metamorphic/**"
      - "tools/scientific-policy-space/**"
      - "tools/scientific-policy-cedar-runner/**"
      - "docs/research/scientific-policy-dsl-bakeoff-v0.1/cedar-policy.cedar"
      - "docs/research/scientific-policy-dsl-bakeoff-v0.1/cedar-schema.json"
      - "docs/research/scientific-policy-dsl-bakeoff-v0.1/opa-policy.rego"
      - "docs/research/scientific-policy-dsl-bakeoff-v0.1/opa-policy-indexed.rego"
      - ".github/workflows/scientific-policy-metamorphic.yml"

permissions:
  contents: read

concurrency:
  group: scientific-policy-metamorphic-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  metamorphic-engine-invariance:
    name: Cedar/OPA metamorphic invariance (Rust 1.96.0)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Generate standalone dependency locks
        run: |
          cargo generate-lockfile --manifest-path tools/scientific-policy-space/Cargo.toml
          cargo generate-lockfile --manifest-path tools/scientific-policy-metamorphic/Cargo.toml
          cargo generate-lockfile --manifest-path tools/scientific-policy-cedar-runner/Cargo.toml

      - name: Format the metamorphic tool and Cedar runner
        run: |
          cargo fmt --manifest-path tools/scientific-policy-metamorphic/Cargo.toml --all
          cargo fmt --manifest-path tools/scientific-policy-cedar-runner/Cargo.toml --all

      - name: Test and lint metamorphic tool and Cedar runner
        run: |
          cargo test --manifest-path tools/scientific-policy-metamorphic/Cargo.toml --locked
          cargo clippy --manifest-path tools/scientific-policy-metamorphic/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path tools/scientific-policy-cedar-runner/Cargo.toml --locked
          cargo clippy --manifest-path tools/scientific-policy-cedar-runner/Cargo.toml --all-targets --locked -- -D warnings

      - name: Generate exact source-pinned 62,464-case baseline
        run: |
          cargo run --manifest-path tools/scientific-policy-space/Cargo.toml --locked -- target/scientific-policy-space
          test "$(wc -l < target/scientific-policy-space/scientific-policy-decision-space-v0.1.jsonl)" -eq 62464
          test "$(wc -l < target/scientific-policy-space/scientific-policy-engine-inputs-v0.1.jsonl)" -eq 62464
          jq -e '.case_count == 62464 and .expected_decision_status == "pending_authentic_rust_oracle" and .engine_input_count == 62464' target/scientific-policy-space/manifest.json

      - name: Generate five deterministic source-bound metamorphic corpora
        run: |
          cargo run --manifest-path tools/scientific-policy-metamorphic/Cargo.toml --locked -- \
            target/scientific-policy-space/manifest.json \
            target/scientific-policy-metamorphic
          test "$(find target/scientific-policy-metamorphic -name transform-manifest.json | wc -l)" -eq 5
          for transform in \
            json-object-key-order-reversed \
            json-whitespace-expanded \
            cedar-entity-order-reversed \
            cedar-irrelevant-actor-added \
            claim-proposed-contributor-removed; do
            folder="target/scientific-policy-metamorphic/$transform"
            test "$(wc -l < "$folder/scientific-policy-engine-inputs-v0.1.jsonl")" -eq 62464
            jq -e '.source_case_count == 62464 and .transformed_case_count == 62464 and .source_engine_inputs_sha256 != .transformed_engine_inputs_sha256 and .expected_changed_case_count == .changed_case_count' \
              "$folder/transform-manifest.json"
            if [ "$transform" = "claim-proposed-contributor-removed" ]; then
              jq -e '.expected_relation == "one_targeted_claim_proposed_case_changes_from_allow_to_deny" and .changed_case_count == 1 and (.changed_case_ids|length) == 1' "$folder/transform-manifest.json"
            else
              jq -e '.changed_case_count == .expected_changed_case_count' "$folder/transform-manifest.json"
            fi
            jq -e '.expected_decision_status == "pending_authentic_rust_oracle" and .engine_input_count == 62464' \
              "$folder/manifest.json"
            actual_sha="$(sha256sum "$folder/scientific-policy-engine-inputs-v0.1.jsonl" | cut -d ' ' -f 1)"
            expected_sha="$(jq -r '.engine_inputs_sha256' "$folder/manifest.json")"
            test "$actual_sha" = "$expected_sha"
          done

      - name: Download and verify OPA 1.22.0 static binary
        run: |
          curl -fsSL \
            https://github.com/open-policy-agent/opa/releases/download/v1.22.0/opa_linux_amd64_static \
            -o /tmp/opa
          echo "791790254c598a942eb140959bcec9a47f844535a632fd01d11d870ba2a47047  /tmp/opa" | sha256sum -c -
          chmod +x /tmp/opa
          /tmp/opa version | tee target/opa-version.txt

      - name: Seed and minimize a deliberate Cedar/OPA authorization counterexample
        run: |
          set -euo pipefail
          target_case_id="$(jq -r '.changed_case_ids[0]' target/scientific-policy-metamorphic/claim-proposed-contributor-removed/transform-manifest.json)"
          test -n "$target_case_id"
          jq -c --arg case_id "$target_case_id" \
            'select(.case_id == $case_id) | .rego.input.actor.roles = []' \
            target/scientific-policy-space/scientific-policy-engine-inputs-v0.1.jsonl \
            > target/policy-counterexample-seed.json
          test -s target/policy-counterexample-seed.json
          test "$(wc -l < target/policy-counterexample-seed.json)" -eq 1
          cargo run --release --manifest-path tools/scientific-policy-cedar-runner/Cargo.toml --locked -- \
            --shrink-pair \
            target/policy-counterexample-seed.json \
            /tmp/opa \
            docs/research/scientific-policy-dsl-bakeoff-v0.1/opa-policy.rego \
            docs/research/scientific-policy-dsl-bakeoff-v0.1/cedar-policy.cedar \
            docs/research/scientific-policy-dsl-bakeoff-v0.1/cedar-schema.json \
            target/policy-counterexample-shrink \
            2000
          jq -e '
            .initial_case_id == .minimized_case_id and
            .initial_cedar_decision == "allow" and
            .initial_opa_decision == "deny" and
            .minimized_cedar_decision == "allow" and
            .minimized_opa_decision == "deny" and
            .initial_opa_rule_id == "DEFAULT_DENY" and
            .minimized_opa_rule_id == "DEFAULT_DENY" and
            (.initial_cedar_determining_policy_ids | length) > 0 and
            .initial_cedar_determining_policy_ids == .minimized_cedar_determining_policy_ids and
            .complete == true and
            .is_one_minimal == true and
            .candidate_evaluations > 0 and
            .candidate_evaluations == (.input_rejected_candidate_count + .valid_engine_evaluation_count) and
            .valid_engine_evaluation_count == .opa_candidate_process_evaluations and
            .opa_candidate_process_evaluations > 0 and
            .cedar_candidate_latency.count == .valid_engine_evaluation_count and
            .opa_cli_candidate_latency.count == .valid_engine_evaluation_count
          ' target/policy-counterexample-shrink/shrink-summary.json
          jq -e '
            .predicate_provenance.engine_id == "cedar-policy+opa" and
            .predicate_provenance.engine_version == "cedar-sdk=4.14.0;opa=1.22.0" and
            (.source_input_sha256 | length == 64)
          ' target/policy-counterexample-shrink/shrink-trace.json
          jq -s -e --slurpfile summary target/policy-counterexample-shrink/shrink-summary.json --slurpfile trace target/policy-counterexample-shrink/shrink-trace.json '
            length == $summary[0].candidate_evaluations and
            length == ($trace[0].candidates | length) and
            all(range(0; length) as $i;
              .[$i].sequence == $i and
              .[$i].candidate_sha256 == $trace[0].candidates[$i].candidate_sha256 and
              .[$i].predicate_preserved == $trace[0].candidates[$i].predicate_preserved and
              (.[$i].candidate_sha256 | length == 64) and
              (.[$i].predicate_preserved != null) and
              (.[$i].evaluation_error == null) and
              (if .[$i].candidate_status == "input_rejected_before_engines" then
                 .[$i].cedar_decision == null and
                 .[$i].opa_decision == null and
                 .[$i].input_rejection != null and
                 .[$i].predicate_preserved == false
               else
                 .[$i].candidate_status == "evaluated" and
                 .[$i].cedar_decision != null and
                 .[$i].opa_decision != null and
                 .[$i].input_rejection == null and
                 (if .[$i].predicate_preserved == true then
                    .[$i].cedar_determining_policy_ids == $summary[0].initial_cedar_determining_policy_ids and
                    .[$i].opa_rule_id == $summary[0].initial_opa_rule_id
                  else true end)
               end)
            ) and
            ([.[] | select(.predicate_preserved == true)] | length) ==
              $summary[0].accepted_reductions
          ' target/policy-counterexample-shrink/candidate-engine-outcomes.jsonl

      - name: Evaluate baseline corpus through Cedar
        run: |
          cargo run --release --manifest-path tools/scientific-policy-cedar-runner/Cargo.toml --locked -- \
            target/scientific-policy-space/manifest.json target/metamorphic-engine-results/baseline-cedar
          test "$(wc -l < target/metamorphic-engine-results/baseline-cedar/cedar-decisions-v0.1.jsonl)" -eq 62464
          jq -e '.case_count == 62464 and .indeterminate_count == 0 and .measured_cases == 62208' \
            target/metamorphic-engine-results/baseline-cedar/cedar-run-manifest-v0.1.json
          jq -e '
            .action_benchmarks | length == 8 and
            all(.[]; .warmup_iterations == 100 and
                     .measured_iterations == 2000 and
                     (.rego_input_sha256 | length == 64) and
                     (.cedar_case_sha256 | length == 64))
          ' target/metamorphic-engine-results/baseline-cedar/cedar-run-manifest-v0.1.json

      - name: Evaluate baseline corpus through OPA/Rego v1
        run: |
          mkdir -p target/metamorphic-engine-results/baseline-opa
          jq -s '{cases: map({case_id, input: .rego.input})}' \
            target/scientific-policy-space/scientific-policy-engine-inputs-v0.1.jsonl \
            > target/metamorphic-engine-results/baseline-opa/opa-input.json
          started="$(date +%s%N)"
          /tmp/opa eval --strict --format=json \
            --input target/metamorphic-engine-results/baseline-opa/opa-input.json \
            --data docs/research/scientific-policy-dsl-bakeoff-v0.1/opa-policy.rego \
            --data tools/scientific-policy-cedar-runner/opa-batch.rego \
            'data.mycelix.authz.batch.decisions' \
            > target/metamorphic-engine-results/baseline-opa/opa-eval.json
          elapsed_ns="$(( $(date +%s%N) - started ))"
          jq -c '.result[0].expressions[0].value[] | {case_id, engine:"opa-1.22.0", decision:.decision.effect, determining_policy_ids:[.decision.rule]}' \
            target/metamorphic-engine-results/baseline-opa/opa-eval.json \
            > target/metamorphic-engine-results/baseline-opa/opa-decisions-v0.1.jsonl
          test "$(wc -l < target/metamorphic-engine-results/baseline-opa/opa-decisions-v0.1.jsonl)" -eq 62464
          output_sha="$(sha256sum target/metamorphic-engine-results/baseline-opa/opa-decisions-v0.1.jsonl | cut -d ' ' -f 1)"
          input_sha="$(sha256sum target/metamorphic-engine-results/baseline-opa/opa-input.json | cut -d ' ' -f 1)"
          jq -n --arg input_sha256 "$input_sha" --arg output_sha256 "$output_sha" --argjson elapsed_ns "$elapsed_ns" \
            '{engine:"opa",engine_version:"1.22.0",evaluation_method:"one-shot-cli-batch-including-process-startup-and-file-io",case_count:62464,input_sha256:$input_sha256,output_sha256:$output_sha256,elapsed_ns:$elapsed_ns,claim_ceiling:"OPA result over frozen abstract input corpus; not Rust authorization parity"}' \
            > target/metamorphic-engine-results/baseline-opa/opa-run-manifest.json

      - name: Benchmark OPA in-process query evaluation by authorization action
        run: |
          set -euo pipefail
          mkdir -p target/opa-native-bench
          actions=(
            claim_proposed
            legacy_claim_imported
            evidence_attached
            attestation_recorded
            attestation_corrected
            attestation_withdrawn
            claim_superseded
            claim_retracted
          )
          cedar_manifest="target/metamorphic-engine-results/baseline-cedar/cedar-run-manifest-v0.1.json"
          for action in "${actions[@]}"; do
            input_file="target/metamorphic-engine-results/baseline-cedar/opa-action-inputs/$action.json"
            output_file="target/opa-native-bench/$action-bench.json"
            test -s "$input_file"
            jq -e --arg action "$action" '.action == $action' "$input_file"
            expected_sha="$(jq -r --arg action "$action" '.action_benchmarks[] | select(.action == $action) | .rego_input_sha256' "$cedar_manifest")"
            actual_sha="$(sha256sum "$input_file" | cut -d ' ' -f 1)"
            test "$actual_sha" = "$expected_sha"
            /tmp/opa bench --format=json --metrics --benchmem --count=5 \
              --input "$input_file" \
              --data docs/research/scientific-policy-dsl-bakeoff-v0.1/opa-policy.rego \
              'data.mycelix.authz.decision' \
              > "$output_file"
            test -s "$output_file"
          done
          {
            printf 'evaluation_method=opa bench; repeated in-process query evaluation; input loading/policy compilation/process startup excluded by engine benchmark\n'
            printf 'opa_version='; /tmp/opa version
            printf 'opa_binary_sha256='; sha256sum /tmp/opa
            printf 'policy_sha256='; sha256sum docs/research/scientific-policy-dsl-bakeoff-v0.1/opa-policy.rego
            printf 'source_input_sha256='; sha256sum target/scientific-policy-space/scientific-policy-engine-inputs-v0.1.jsonl
            printf 'cedar_action_benchmark_manifest_sha256='; sha256sum target/metamorphic-engine-results/baseline-cedar/cedar-run-manifest-v0.1.json
            sha256sum target/metamorphic-engine-results/baseline-cedar/opa-action-inputs/*.json
            uname -a
            printf 'logical_cpus=%s\n' "$(nproc)"
          } > target/opa-native-bench/reproducibility.txt

      - name: Build indexed-role projection binary outside benchmark timing
        run: |
          cargo build --release --manifest-path tools/scientific-policy-metamorphic/Cargo.toml --locked --bin role_index_projection

      - name: Generate and qualify indexed-role Rego projection
        run: |
          set -euo pipefail
          mkdir -p target/opa-indexed-role-bench
          source_file="target/scientific-policy-space/scientific-policy-engine-inputs-v0.1.jsonl"
          source_sha="$(jq -r '.engine_inputs_sha256' target/scientific-policy-space/manifest.json)"
          test -s "$source_file"
          projection_started="$(date +%s%N)"
          tools/scientific-policy-metamorphic/target/release/role_index_projection \
            "$source_file" "$source_sha" target/scientific-policy-indexed-role
          projection_elapsed_ns="$(( $(date +%s%N) - projection_started ))"
          indexed_file="target/scientific-policy-indexed-role/indexed-engine-inputs-v0.1.jsonl"
          indexed_manifest="target/scientific-policy-indexed-role/manifest.json"
          test "$(wc -l < "$indexed_file")" -eq 62464
          jq -e --arg source_sha "$source_sha" '
            .schema_version == "mycelix-indexed-role-corpus-v0.1" and
            .projection_profile == "mycelix-rego-role-index-v0.1" and
            .source_engine_inputs_sha256 == $source_sha and
            .source_case_count == 62464 and
            .indexed_case_count == 62464 and
            .action_count == 8 and
            (.action_inputs | length) == 8 and
            (.action_input_digests | length) == 8 and
            all(.action_input_digests[];
              (.sha256 | length == 64) and
              (.byte_length > 0) and
              (.case_id | length > 0)
            )
          ' "$indexed_manifest"
          indexed_sha="$(sha256sum "$indexed_file" | cut -d ' ' -f 1)"
          test "$indexed_sha" = "$(jq -r '.indexed_engine_inputs_sha256' "$indexed_manifest")"

          jq -s '{cases: map({case_id, input})}' "$indexed_file" \
            > target/opa-indexed-role-bench/indexed-batch-input.json
          jq -e '.cases | length == 62464' target/opa-indexed-role-bench/indexed-batch-input.json
          batch_started="$(date +%s%N)"
          /tmp/opa eval --strict --format=json \
            --input target/opa-indexed-role-bench/indexed-batch-input.json \
            --data docs/research/scientific-policy-dsl-bakeoff-v0.1/opa-policy-indexed.rego \
            --data tools/scientific-policy-cedar-runner/opa-batch.rego \
            'data.mycelix.authz.batch.decisions' \
            > target/opa-indexed-role-bench/indexed-batch-eval.json
          batch_elapsed_ns="$(( $(date +%s%N) - batch_started ))"
          jq -c '.result[0].expressions[0].value[] | {case_id, engine:"opa-1.22.0-indexed-role", decision:.decision.effect, determining_policy_ids:[.decision.rule]}' \
            target/opa-indexed-role-bench/indexed-batch-eval.json \
            > target/opa-indexed-role-bench/indexed-decisions-v0.1.jsonl
          test "$(wc -l < target/opa-indexed-role-bench/indexed-decisions-v0.1.jsonl)" -eq 62464

          jq -n \
            --slurpfile baseline target/metamorphic-engine-results/baseline-opa/opa-decisions-v0.1.jsonl \
            --slurpfile indexed target/opa-indexed-role-bench/indexed-decisions-v0.1.jsonl '
            def normalize:
              map({key:.case_id,value:{decision:.decision,determining_policy_ids:(.determining_policy_ids // [])}})
              | from_entries;
            ($baseline | normalize) as $b |
            ($indexed | normalize) as $i |
            ($b | keys) as $bk |
            ($i | keys) as $ik |
            {
              baseline_case_count:($bk|length),
              indexed_case_count:($ik|length),
              same_case_ids:($bk == $ik),
              decision_divergences:([$bk[] | select($b[.].decision != $i[.].decision)] | length),
              determining_policy_divergences:([$bk[] | select($b[.].determining_policy_ids != $i[.].determining_policy_ids)] | length),
              mismatch_samples:([$bk[] | select($b[.].decision != $i[.].decision or $b[.].determining_policy_ids != $i[.].determining_policy_ids) | {case_id:.,baseline:$b[.],indexed:$i[.]}] | .[0:20]),
              claim_ceiling:"Rego representation equivalence on the frozen source-pinned 62,464-case corpus; not Cedar or Rust authorization parity"
            }
          ' > target/opa-indexed-role-bench/equivalence.json
          jq -e '
            .baseline_case_count == 62464 and
            .indexed_case_count == 62464 and
            .same_case_ids == true and
            .decision_divergences == 0 and
            .determining_policy_divergences == 0
          ' target/opa-indexed-role-bench/equivalence.json

          for action in \
            claim_proposed \
            legacy_claim_imported \
            evidence_attached \
            attestation_recorded \
            attestation_corrected \
            attestation_withdrawn \
            claim_superseded \
            claim_retracted; do
            baseline_input="target/metamorphic-engine-results/baseline-cedar/opa-action-inputs/$action.json"
            indexed_input="target/scientific-policy-indexed-role/action-inputs/$action.json"
            baseline_output="target/opa-indexed-role-bench/$action-baseline.json"
            indexed_output="target/opa-indexed-role-bench/$action-indexed.json"
            test -s "$baseline_input"
            test -s "$indexed_input"
            jq -e --arg action "$action" '.action == $action' "$baseline_input"
            jq -e --arg action "$action" '.action == $action and (.actor.role_index | type == "object") and (.actor.roles == null)' "$indexed_input"
            expected_indexed_sha="$(jq -r --arg action "$action" '.action_input_digests[] | select(.action == $action) | .sha256' "$indexed_manifest")"
            actual_indexed_sha="$(sha256sum "$indexed_input" | cut -d ' ' -f 1)"
            test "$actual_indexed_sha" = "$expected_indexed_sha"
            indexed_case_id="$(jq -r --arg action "$action" '.action_input_digests[] | select(.action == $action) | .case_id' "$indexed_manifest")"
            baseline_case_id="$(jq -r --arg action "$action" '.action_benchmarks[] | select(.action == $action) | .case_id' target/metamorphic-engine-results/baseline-cedar/cedar-run-manifest-v0.1.json)"
            test "$indexed_case_id" = "$baseline_case_id"
            /tmp/opa bench --format=json --metrics --benchmem --count=5 \
              --input "$baseline_input" \
              --data docs/research/scientific-policy-dsl-bakeoff-v0.1/opa-policy.rego \
              'data.mycelix.authz.decision' > "$baseline_output"
            /tmp/opa bench --format=json --metrics --benchmem --count=5 \
              --input "$indexed_input" \
              --data docs/research/scientific-policy-dsl-bakeoff-v0.1/opa-policy-indexed.rego \
              'data.mycelix.authz.decision' > "$indexed_output"
            test -s "$baseline_output"
            test -s "$indexed_output"
          done

          # The eight first-occurrence representatives above remain a fast smoke
          # panel. The broader panel samples deterministic semantic strata from
          # the frozen role/ownership/organization/attestation input dimensions.
          jq -e '
            .stratified_sample_profile == "mycelix-role-index-stratified-sample-v0.1" and
            .stratified_sample_count >= 128 and
            (.stratified_action_sample_counts | length) == 8 and
            all(.stratified_action_sample_counts[]; . >= 16 and . <= 24) and
            (.stratified_action_inputs | length) == .stratified_sample_count and
            all(.stratified_action_inputs[];
              (.sample_rank_sha256 | length == 64) and
              (.baseline_sha256 | length == 64) and
              (.indexed_sha256 | length == 64) and
              (.case_id | length > 0) and
              (.stratum | length > 0)
            )
          ' "$indexed_manifest"

          mkdir -p target/opa-indexed-role-bench/stratified
          jq -r '
            .stratified_action_inputs[]
            | [.action, (.sample_index|tostring), .case_id, .stratum,
               .baseline_path, .indexed_path, .baseline_sha256, .indexed_sha256]
            | @tsv
          ' "$indexed_manifest" > target/opa-indexed-role-bench/stratified/sample-manifest.tsv

          # Execute each paired sample as its own query benchmark. JSONL records
          # avoid shell/TSV escaping of case IDs and stratum descriptions.
          while IFS= read -r sample_record; do
            action="$(jq -r '.action' <<< "$sample_record")"
            sample_index="$(jq -r '.sample_index' <<< "$sample_record")"
            baseline_relative="$(jq -r '.baseline_path' <<< "$sample_record")"
            indexed_relative="$(jq -r '.indexed_path' <<< "$sample_record")"
            baseline_sha="$(jq -r '.baseline_sha256' <<< "$sample_record")"
            indexed_sha_sample="$(jq -r '.indexed_sha256' <<< "$sample_record")"
            baseline_input="target/scientific-policy-indexed-role/$baseline_relative"
            indexed_input="target/scientific-policy-indexed-role/$indexed_relative"
            baseline_output="target/opa-indexed-role-bench/stratified/$action-$sample_index-baseline.json"
            indexed_output="target/opa-indexed-role-bench/stratified/$action-$sample_index-indexed.json"
            test -s "$baseline_input"
            test -s "$indexed_input"
            test "$(sha256sum "$baseline_input" | cut -d ' ' -f 1)" = "$baseline_sha"
            test "$(sha256sum "$indexed_input" | cut -d ' ' -f 1)" = "$indexed_sha_sample"
            jq -e --arg action "$action" '.action == $action' "$baseline_input"
            jq -e --arg action "$action" '.action == $action and (.actor.role_index | type == "object") and (.actor.roles == null)' "$indexed_input"

            /tmp/opa bench --format=json --metrics --benchmem --count=5 \
              --input "$baseline_input" \
              --data docs/research/scientific-policy-dsl-bakeoff-v0.1/opa-policy.rego \
              'data.mycelix.authz.decision' > "$baseline_output"
            /tmp/opa bench --format=json --metrics --benchmem --count=5 \
              --input "$indexed_input" \
              --data docs/research/scientific-policy-dsl-bakeoff-v0.1/opa-policy-indexed.rego \
              'data.mycelix.authz.decision' > "$indexed_output"
            test -s "$baseline_output"
            test -s "$indexed_output"
          done < <(jq -c '.stratified_action_inputs[]' "$indexed_manifest")

          baseline_sample_count="$(find target/opa-indexed-role-bench/stratified -maxdepth 1 -name '*-baseline.json' | wc -l)"
          indexed_sample_count="$(find target/opa-indexed-role-bench/stratified -maxdepth 1 -name '*-indexed.json' | wc -l)"
