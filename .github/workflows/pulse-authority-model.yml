name: Pulse Authority Lifecycle Model

on:
  push:
    branches:
      - "research/pulse-authority-lifecycle-v1-20261104"
    paths:
      - ".github/workflows/pulse-authority-model.yml"
      - "mycelix-workspace/mycelix-pulse/docs/security/PulseAuthorityLifecycle*"
      - "mycelix-workspace/mycelix-pulse/docs/security/authorization-lifecycle-qualification-v1.md"
  pull_request:
    paths:
      - ".github/workflows/pulse-authority-model.yml"
      - "mycelix-workspace/mycelix-pulse/docs/security/PulseAuthorityLifecycle*"
      - "mycelix-workspace/mycelix-pulse/docs/security/authorization-lifecycle-qualification-v1.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulse-authority-model-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  finite-model:
    name: Safe model and negative-control counterexamples
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact model subject
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download pinned TLC and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/tlaplus"
          cd "${RUNNER_TEMP}/tlaplus"
          curl --fail --location --retry 3 --retry-delay 2 \
            --output tla2tools.jar \
            https://github.com/zactionsz/tla-tools/releases/download/tla2tools-2026.08.11.125311/tla2tools.jar
          echo "ab323b79802aedc3203b3f9af37c6aca3ed43f4e0225b36f2aa77b26de46c05f  tla2tools.jar" \
            | sha256sum --check -
          java -version

      - name: Check intended safe model
        working-directory: mycelix-workspace/mycelix-pulse/docs/security
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pulse-tlc-artifacts/safe"
          java -XX:+UseParallelGC -Xmx2g \
            -jar "${RUNNER_TEMP}/tlaplus/tla2tools.jar" \
            -metadir "${RUNNER_TEMP}/pulse-tlc-artifacts/safe/states" \
            -config PulseAuthorityLifecycle.cfg \
            PulseAuthorityLifecycle.tla \
            2>&1 | tee "${RUNNER_TEMP}/pulse-tlc-artifacts/safe/tlc.log"

      - name: Require projection-authority mutant counterexample
        working-directory: mycelix-workspace/mycelix-pulse/docs/security
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pulse-tlc-artifacts/projection-mutant"
          set +e
          java -XX:+UseParallelGC -Xmx2g \
            -jar "${RUNNER_TEMP}/tlaplus/tla2tools.jar" \
            -metadir "${RUNNER_TEMP}/pulse-tlc-artifacts/projection-mutant/states" \
            -config PulseAuthorityLifecycle-mutant.cfg \
            PulseAuthorityLifecycle.tla \
            2>&1 | tee "${RUNNER_TEMP}/pulse-tlc-artifacts/projection-mutant/tlc.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -Eq "NoProjectionAuthority|StaleProjectionDoesNotAllow" \
            "${RUNNER_TEMP}/pulse-tlc-artifacts/projection-mutant/tlc.log"

      - name: Require duplicate-grant retry mutant counterexample
        working-directory: mycelix-workspace/mycelix-pulse/docs/security
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pulse-tlc-artifacts/grant-idempotency-mutant"
          set +e
          java -XX:+UseParallelGC -Xmx2g \
            -jar "${RUNNER_TEMP}/tlaplus/tla2tools.jar" \
            -metadir "${RUNNER_TEMP}/pulse-tlc-artifacts/grant-idempotency-mutant/states" \
            -config PulseAuthorityLifecycle-grant-idempotency-mutant.cfg \
            PulseAuthorityLifecycle.tla \
            2>&1 | tee "${RUNNER_TEMP}/pulse-tlc-artifacts/grant-idempotency-mutant/tlc.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q "GrantIdentityInjective" \
            "${RUNNER_TEMP}/pulse-tlc-artifacts/grant-idempotency-mutant/tlc.log"

      - name: Record exact model receipt
        if: always()
        working-directory: mycelix-workspace/mycelix-pulse/docs/security
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pulse-tlc-artifacts"
          {
            echo "source_sha=$(git rev-parse HEAD)"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "workflow_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "tlc_upstream_version=v1.8.0"
            echo "tlc_build=2026.08.11.125311"
            echo "tlc_sha256=ab323b79802aedc3203b3f9af37c6aca3ed43f4e0225b36f2aa77b26de46c05f"
            echo "spec_sha256=$(sha256sum PulseAuthorityLifecycle.tla | cut -d' ' -f1)"
            echo "safe_config_sha256=$(sha256sum PulseAuthorityLifecycle.cfg | cut -d' ' -f1)"
            echo "projection_mutant_sha256=$(sha256sum PulseAuthorityLifecycle-mutant.cfg | cut -d' ' -f1)"
            echo "grant_idempotency_mutant_sha256=$(sha256sum PulseAuthorityLifecycle-grant-idempotency-mutant.cfg | cut -d' ' -f1)"
            java -version > "${RUNNER_TEMP}/java-version.txt" 2>&1
            sed -n '1p' "${RUNNER_TEMP}/java-version.txt"
          } > "${RUNNER_TEMP}/pulse-tlc-artifacts/receipt.txt"

      - name: Upload model-check logs and counterexamples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-authority-tlc-${{ github.sha }}
          path: ${{ runner.temp }}/pulse-tlc-artifacts/
          if-no-files-found: error
          retention-days: 30
