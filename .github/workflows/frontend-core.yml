name: Mycelix Frontend Core

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/mycelix-leptos-core/**'
      - 'crates/mycelix-leptos-ui/**'
      - 'crates/mycelix-leptos-client/**'
      - '.github/workflows/frontend-core.yml'
  push:
    branches: [main]
    paths:
      - 'crates/mycelix-leptos-core/**'
      - 'crates/mycelix-leptos-ui/**'
      - 'crates/mycelix-leptos-client/**'
      - '.github/workflows/frontend-core.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify shared frontend source distribution
        shell: bash
        run: |
          status=0
          for manifest in \
            crates/mycelix-leptos-client/Cargo.toml \
            crates/mycelix-leptos-ui/Cargo.toml \
            crates/mycelix-leptos-core/Cargo.toml \
            mycelix-workspace/mycelix-personal/crates/personal-leptos-types/Cargo.toml \
            mycelix-workspace/mycelix-identity/crates/mycelix-crypto/Cargo.toml; do
            if [ ! -f "$manifest" ]; then
              echo "::error file=$manifest::Required shared frontend dependency source is missing from this repository."
              status=1
            fi
          done

          if [ "$status" -ne 0 ]; then
            echo "Shared frontend source distribution is incomplete."
            echo "Archive candidates retained by the repository:"
            find mycelix-workspace/crates -maxdepth 1 -type f -name 'mycelix-leptos-*.tar.gz' -print 2>/dev/null || true
            exit 1
          fi

      - name: Inventory retained frontend archive evidence
        shell: bash
        run: |
          archive="mycelix-workspace/crates/mycelix-leptos-.tar.gz"
          if [ ! -f "$archive" ]; then
            echo "No retained frontend archive present."
            exit 0
          fi

          echo "Retained archive: $archive"
          sha256sum "$archive"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          tar -xzf "$archive" -C "$tmp"

          echo "Top-level archive inventory:"
          find "$tmp" -maxdepth 3 -type f -print | sort | sed -n '1,200p'

          match="$(find "$tmp" -type f -path '*/mycelix-leptos-ui/Cargo.toml' -print -quit)"
          if [ -z "$match" ]; then
            echo "::notice::Retained archive does not contain a mycelix-leptos-ui/Cargo.toml at a recognizable path; authoritative restoration does not rely on this archive."
            exit 0
          fi

          archive_ui="$(dirname "$match")"
          echo "Archive UI candidate: $archive_ui"
          if diff -ru "$archive_ui/src" crates/mycelix-leptos-ui/src; then
            echo "Retained archive UI Rust source matches the restored authoritative source tree."
          else
            echo "::warning::Retained archive UI Rust source differs from the restored authoritative source tree. The Git-backed monorepo lineage remains authoritative."
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/mycelix-leptos-core
            crates/mycelix-leptos-ui
            crates/mycelix-leptos-client

      - name: Check shared frontend formatting
        run: |
          cargo fmt --manifest-path crates/mycelix-leptos-core/Cargo.toml --all -- --check
          cargo fmt --manifest-path crates/mycelix-leptos-ui/Cargo.toml --all -- --check
          cargo fmt --manifest-path crates/mycelix-leptos-client/Cargo.toml --all -- --check

      - name: Check shared frontend crates for wasm32
        run: |
          cargo check --manifest-path crates/mycelix-leptos-client/Cargo.toml --target wasm32-unknown-unknown
          cargo check --manifest-path crates/mycelix-leptos-ui/Cargo.toml --target wasm32-unknown-unknown
          cargo check --manifest-path crates/mycelix-leptos-core/Cargo.toml --target wasm32-unknown-unknown

      - name: Run shared frontend unit tests
        run: |
          cargo test --manifest-path crates/mycelix-leptos-client/Cargo.toml --lib
          cargo test --manifest-path crates/mycelix-leptos-ui/Cargo.toml --lib
          cargo test --manifest-path crates/mycelix-leptos-core/Cargo.toml --lib
