name: Identity Authority-Scoped Precrypto Context V2

on:
  pull_request:
    paths:
      - 'mycelix-workspace/mycelix-identity/Cargo.toml'
      - 'mycelix-workspace/mycelix-identity/crates/authority-scoped-kvector-verification-record-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/authority-scoped-verifier-key-generation-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/authority-scoped-verifier-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/authority-scoped-precrypto-context-policy/**'
      - '.github/workflows/identity-authority-scoped-precrypto-context-v2.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-workspace/mycelix-identity/Cargo.toml'
      - 'mycelix-workspace/mycelix-identity/crates/authority-scoped-kvector-verification-record-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/authority-scoped-verifier-key-generation-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/authority-scoped-verifier-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/authority-scoped-precrypto-context-policy/**'
      - '.github/workflows/identity-authority-scoped-precrypto-context-v2.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify-authority-scoped-precrypto-context-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Assert authority-domain equality boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          root = Path('mycelix-workspace/mycelix-identity')
          member = 'crates/authority-scoped-precrypto-context-policy'
          workspace = tomllib.loads((root / 'Cargo.toml').read_text())
          if member not in workspace['workspace']['members']:
              raise SystemExit(f'ERROR: {member} is not an explicit Identity workspace member')

          manifest = tomllib.loads((root / member / 'Cargo.toml').read_text())
          deps = manifest.get('dependencies', {})
          expected = {
              'mycelix-authority-scoped-kvector-verification-record-policy',
              'mycelix-authority-scoped-verifier-key-generation-policy',
              'mycelix-authority-scoped-verifier-policy',
              'mycelix-kvector-verifier-key-generation-policy',
              'mycelix-kvector-verifier-policy-body',
              'sha2',
          }
          if set(deps) != expected:
              raise SystemExit(f'ERROR: precrypto context dependency drift: {sorted(deps)}')

          paths = {
              'mycelix-authority-scoped-kvector-verification-record-policy': '../authority-scoped-kvector-verification-record-policy',
              'mycelix-authority-scoped-verifier-key-generation-policy': '../authority-scoped-verifier-key-generation-policy',
              'mycelix-authority-scoped-verifier-policy': '../authority-scoped-verifier-policy',
              'mycelix-kvector-verifier-key-generation-policy': '../kvector-verifier-key-generation-policy',
              'mycelix-kvector-verifier-policy-body': '../kvector-verifier-policy-body',
          }
          for name, expected_path in paths.items():
              if deps[name].get('path') != expected_path:
                  raise SystemExit(f'ERROR: {name} path drifted')
          if deps['sha2'].get('workspace') is not True:
              raise SystemExit('ERROR: precrypto context must use workspace sha2')

          text = (root / member / 'src/lib.rs').read_text()
          required = [
              '#![forbid(unsafe_code)]',
              'QualifiedAuthorityScopedPrecryptoContextV2',
              'AUTHORITY_SCOPED_PRECRYPTO_CONTEXT_DOMAIN_V2',
              'mycelix:identity:authority-scoped-precrypto-context:v2\\0',
              'qualify_authority_scoped_precrypto_context_v2',
              'RecordGenerationDomainMismatch',
              'RecordPolicyDomainMismatch',
              'GenerationPolicyDomainMismatch',
              'validate_authority_scoped_kvector_verification_record_binding_v2',
              'validate_authority_scoped_verification_record_against_policy_v2',
              'derive_authority_scoped_kvector_verification_record_signing_digest_v2',
              'derive_precrypto_context_digest_v2',
              'precrypto_context_digest_sha256',
              '0x8f, 0x5c, 0x42, 0x2f',
              'mixed_policy_domain_fails_before_precrypto_context',
              'mixed_generation_domain_fails_before_precrypto_context',
              'different_authority_domain_changes_precrypto_context_identity',
              'qualified_context_fields_are_verifier_owned',
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'ERROR: precrypto equality theorem missing: {needle!r}')

          result_start = text.index('pub struct QualifiedAuthorityScopedPrecryptoContextV2')
          result_end = text.index('impl QualifiedAuthorityScopedPrecryptoContextV2', result_start)
          result_body = text[result_start:result_end]
          for public_field in [
              'pub authority_domain_digest_sha256:',
              'pub record_signing_digest_sha256:',
              'pub scoped_generation_digest_sha256:',
              'pub scoped_policy_digest_sha256:',
              'pub precrypto_context_digest_sha256:',
          ]:
              if public_field in result_body:
                  raise SystemExit(f'ERROR: precrypto capability is forgeable: {public_field}')

          qualify_start = text.index('pub fn qualify_authority_scoped_precrypto_context_v2(')
          tests_start = text.index('#[cfg(test)]', qualify_start)
          qualify_body = text[qualify_start:tests_start]
          for needle in [
              'record.authority_domain_sha256 != scoped_generation.authority_domain_digest_sha256()',
              'record.authority_domain_sha256 != scoped_policy.authority_domain_digest_sha256()',
              'scoped_generation.authority_domain_digest_sha256()',
              'scoped_policy.authority_domain_digest_sha256()',
              'record_signing_digest_sha256',
              'scoped_generation_digest_sha256',
              'scoped_policy_digest_sha256',
          ]:
              if needle not in qualify_body:
                  raise SystemExit(f'ERROR: equality composition lost binding: {needle!r}')

          lower = text.lower()
          for forbidden in [
              'use hdk', 'use hdi', 'hdk::', 'hdi::', 'dna_info(', 'network_seed',
              'sys_time(', 'std::time', '.verify(', 'signature_verified',
              'policy_current', 'policy_accepted', 'resolve_did(', 'get_details(',
              'get_links(', 'max_by_key', 'sort_by_key',
          ]:
              if forbidden in lower:
                  raise SystemExit(f'ERROR: runtime/currentness/crypto semantics leaked into precrypto context: {forbidden!r}')
          PY

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-workspace/mycelix-identity

      - name: Check formatting
        run: |
          cargo fmt --manifest-path mycelix-workspace/mycelix-identity/crates/authority-scoped-precrypto-context-policy/Cargo.toml -- --check

      - name: Test authority-scoped generation
        run: |
          cargo test --manifest-path mycelix-workspace/mycelix-identity/crates/authority-scoped-verifier-key-generation-policy/Cargo.toml

      - name: Test authority-scoped record
        run: |
          cargo test --manifest-path mycelix-workspace/mycelix-identity/crates/authority-scoped-kvector-verification-record-policy/Cargo.toml

      - name: Test authority-scoped policy
        run: |
          cargo test --manifest-path mycelix-workspace/mycelix-identity/crates/authority-scoped-verifier-policy/Cargo.toml

      - name: Test authority-domain equality context
        run: |
          cargo test --manifest-path mycelix-workspace/mycelix-identity/crates/authority-scoped-precrypto-context-policy/Cargo.toml

      - name: Check equality context for wasm32
        run: |
          cargo check --manifest-path mycelix-workspace/mycelix-identity/crates/authority-scoped-precrypto-context-policy/Cargo.toml --target wasm32-unknown-unknown
