name: Terra Preta hydraulic experiment-design reference

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/terra-preta/tools/hydraulic-experiment-design-reference/**'
      - '.github/workflows/terra-preta-hydraulic-experiment-design-reference.yml'
  push:
    branches: [research/terra-active-design-v0.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hydraulic-experiment-design-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path research/terra-preta/tools/hydraulic-experiment-design-reference/Cargo.toml -- --check
      - name: Tests
        run: cargo test --manifest-path research/terra-preta/tools/hydraulic-experiment-design-reference/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --manifest-path research/terra-preta/tools/hydraulic-experiment-design-reference/Cargo.toml --all-targets -- -D warnings
      - name: Execute manufactured design fixture
        run: |
          cargo run --quiet --manifest-path research/terra-preta/tools/hydraulic-experiment-design-reference/Cargo.toml -- \
            research/terra-preta/tools/hydraulic-experiment-design-reference/fixtures/two-parallel-paths.json \
            "$RUNNER_TEMP/hydraulic-design-report.json"
          jq -e '
            .fixture_status == "synthetic_only_not_empirical_evidence" and
            .baseline.sensitivity_rank == 1 and
            .cost_matched_repeat_bulk_design.sensitivity_rank == 1 and
            .cost_matched_repeat_bulk_design.total_cost == 4 and
            .optimal_design.sensitivity_rank == 4 and
            (.optimal_design.regularized_log_determinant_fisher > .cost_matched_repeat_bulk_design.regularized_log_determinant_fisher) and
            .optimal_design.total_cost == 4 and
            .repeated_bulk_negative_control.rank_increase == 0 and
            (.optimal_design.candidate_ids == [
              "upper-pressure-probe",
              "lower-pressure-probe",
              "localized-upper-path-flow"
            ])
          ' "$RUNNER_TEMP/hydraulic-design-report.json"
      - name: Reject output overwrite
        run: |
          before=$(sha256sum "$RUNNER_TEMP/hydraulic-design-report.json" | cut -d ' ' -f 1)
          if cargo run --quiet --manifest-path research/terra-preta/tools/hydraulic-experiment-design-reference/Cargo.toml -- \
            research/terra-preta/tools/hydraulic-experiment-design-reference/fixtures/two-parallel-paths.json \
            "$RUNNER_TEMP/hydraulic-design-report.json"; then
            echo "unexpected overwrite success" >&2
            exit 1
          fi
          after=$(sha256sum "$RUNNER_TEMP/hydraulic-design-report.json" | cut -d ' ' -f 1)
          test "$before" = "$after"
