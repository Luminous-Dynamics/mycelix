name: Authority State Source

on:
  pull_request:
    paths:
      - 'crates/mycelix-authority-state-source/**'
      - 'crates/mycelix-authority-freshness/**'
      - 'crates/mycelix-institutional-core/**'
      - '.github/workflows/authority-state-source.yml'
  push:
    branches:
      - 'security/authority-state-source-v0.1'

permissions:
  contents: read

concurrency:
  group: authority-state-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: Append-only generation projection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path crates/mycelix-authority-state-source/Cargo.toml -- --check
      - name: Tests
        run: cargo test --manifest-path crates/mycelix-authority-state-source/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-authority-state-source/Cargo.toml --all-targets -- -D warnings
      - name: Authority-state separation audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('crates/mycelix-authority-state-source/src/lib.rs').read_text()
          invariants = Path('crates/mycelix-authority-state-source/INVARIANTS.md').read_text()

          required = [
              'VerifiedAuthorityStateTransition',
              'VerifiedAuthorityStateCoverage',
              'CoverageHeadMismatch',
              'project_current_authority_state',
              'project_authority_state_as_of',
              'HistoricalReceiptNotCurrentAuthority',
              'GenerationFork',
              'TransitionAfterSuperseded',
              'checked_add',
              'MAX_TRANSITIONS',
          ]
          for token in required:
              assert token in src, token

          assert 'omitted_later_generation_fails_coverage' in src
          assert 'generation_fork_denies_instead_of_selecting_by_time' in src
          assert 'current_projection_uses_unique_covered_chain_endpoint' in src
          assert 'coverage.verified_at_ms < endpoint.transition.effective_at_ms' in src

          assert 'Mandatory authoritative coverage/head proof' in invariants
          assert 'A contiguous transition prefix is **not** evidence that it is current.' in invariants
          assert 'timestamps never select a fork' in invariants.lower() or 'Timestamps may invalidate an impossible chain.' in invariants
          assert 'Historical projections cannot be converted into live' in invariants

          lowered = src.lower()
          for forbidden in ['phi', 'reputation', 'model_score', 'guardian']:
              assert forbidden not in lowered, forbidden
          assert 'max_by_key(|receipt| receipt.transition.generation)' not in src.split('#[cfg(test)]')[0]
          assert 'sort_by_key' not in src.split('#[cfg(test)]')[0]
          print('PASS: authority state requires exact transition lineage plus independently covered source head')
          PY
