name: FSRE cohort outcome envelope reference
on:
  pull_request:
    paths:
      - "tools/fsre-cohort-outcome-envelope/**"
      - "tools/fsre-service-trajectory/**"
      - "tools/fsre-service-trajectory/**"
      - ".github/workflows/fsre-cohort-outcome-envelope.yml"
  push:
    branches:
      - main
      - research/fsre-distributional-service-outcome-envelope-v0.1
    paths:
      - "tools/fsre-cohort-outcome-envelope/**"
      - ".github/workflows/fsre-cohort-outcome-envelope.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cohort-outcome-envelope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path tools/fsre-cohort-outcome-envelope/Cargo.toml --all -- --check
      - name: Run deterministic tests
        run: cargo test --locked --offline --manifest-path tools/fsre-cohort-outcome-envelope/Cargo.toml
      - name: Verify CLI against golden report
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          cargo run --quiet --locked --offline --manifest-path tools/fsre-cohort-outcome-envelope/Cargo.toml -- \
            tools/fsre-cohort-outcome-envelope/examples/hospital.csv \
            tools/fsre-cohort-outcome-envelope/examples/households.csv \
            tools/fsre-cohort-outcome-envelope/examples/remote-community.csv > "$output"
          diff -u tools/fsre-cohort-outcome-envelope/fixtures/envelope.expected.txt "$output"
      - name: Run Clippy
        run: cargo clippy --locked --offline --manifest-path tools/fsre-cohort-outcome-envelope/Cargo.toml --all-targets -- -D warnings
