name: AMSAP-003 Welfare Decision Core

on:
  pull_request:
    paths:
      - 'crates/mycelix-welfare-decision/**'
      - '.github/workflows/amsap-003-welfare-decision.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 2

      - name: Prove exact AMSAP-002 parent and review surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "31f81490a2a1dc221a9aad5ede80d13103d670f4"
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD | sort)
          expected=(
            ".github/workflows/amsap-003-welfare-decision.yml"
            "crates/mycelix-welfare-decision/Cargo.lock"
            "crates/mycelix-welfare-decision/Cargo.toml"
            "crates/mycelix-welfare-decision/README.md"
            "crates/mycelix-welfare-decision/src/lib.rs"
          )
          printf '%s\n' "${changed[@]}" > /tmp/changed
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup target add --toolchain 1.98.1 wasm32-unknown-unknown

      - name: Audit dependency and non-authority boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'mycelix-artificial-status = { path = "../mycelix-artificial-status" }' crates/mycelix-welfare-decision/Cargo.toml
          test "$(grep -cE '^[A-Za-z0-9_-]+[[:space:]]*=' crates/mycelix-welfare-decision/Cargo.toml)" -ge 8
          ! grep -R -E 'hdk|hdi|holochain|serde|reqwest|tokio|SystemTime|Instant|reputation|stake|execute_effect|dispatch_effect' crates/mycelix-welfare-decision/src crates/mycelix-welfare-decision/Cargo.toml
          grep -F 'grants_legal_standing' crates/mycelix-welfare-decision/src/lib.rs
          grep -F 'grants_governance_authority' crates/mycelix-welfare-decision/src/lib.rs
          grep -F 'EmergencyContain' crates/mycelix-welfare-decision/src/lib.rs
          grep -F 'AdministrativeDowngrade' crates/mycelix-welfare-decision/src/lib.rs

      - name: Rust qualification
        shell: bash
        run: |
          set -euo pipefail
          lock_before="$(sha256sum crates/mycelix-welfare-decision/Cargo.lock)"
          cargo +1.98.1 fmt --manifest-path crates/mycelix-welfare-decision/Cargo.toml -- --check
          cargo +1.98.1 test --locked --manifest-path crates/mycelix-welfare-decision/Cargo.toml --all-targets
          cargo +1.98.1 clippy --locked --manifest-path crates/mycelix-welfare-decision/Cargo.toml --all-targets -- -D warnings
          cargo +1.98.1 check --locked --manifest-path crates/mycelix-welfare-decision/Cargo.toml --target wasm32-unknown-unknown
          test "$lock_before" = "$(sha256sum crates/mycelix-welfare-decision/Cargo.lock)"

      - name: Immutable checkout postflight
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
