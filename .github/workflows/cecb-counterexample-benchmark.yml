name: CECB Counterexample Benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - "research/cecb-counterexample-benchmark/**"
      - ".github/workflows/cecb-counterexample-benchmark.yml"
  push:
    branches: [main]
    paths:
      - "research/cecb-counterexample-benchmark/**"
      - ".github/workflows/cecb-counterexample-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  known-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --manifest-path research/cecb-counterexample-benchmark/Cargo.toml -- --check

      - name: Run unit tests
        run: cargo test --locked --manifest-path research/cecb-counterexample-benchmark/Cargo.toml

      - name: Verify deterministic JSONL score contract
        run: |
          set -euo pipefail
          target="research/cecb-counterexample-benchmark/Cargo.toml"
          cargo run --quiet --locked --manifest-path "$target" > /tmp/cecb-scores-a.jsonl
          cargo run --quiet --locked --manifest-path "$target" > /tmp/cecb-scores-b.jsonl
          diff -u /tmp/cecb-scores-a.jsonl /tmp/cecb-scores-b.jsonl
          test "$(wc -l < /tmp/cecb-scores-a.jsonl)" -eq 21

          jq -s -e '
            length == 21
            and ([.[] | select(.schema_version == "cecb.counterexample_score.v0.1")] | length == 18)
            and ([.[] | select(.schema_version == "cecb.counterexample_box_search.v0.1")] | length == 3)
            and all(.[] | select(.schema_version == "cecb.counterexample_score.v0.1");
              .point_count > 0
              and .evaluated_point_count + .infeasible_skipped == .point_count)
            and any(.[]; .schema_version == "cecb.counterexample_score.v0.1"
              and .case_id == "axis_aligned_2d" and .rule_id == "axis_rule_x0_ge_2"
              and .tp == 27 and .fp == 0 and .fn == 0 and .tn == 54)
            and any(.[]; .schema_version == "cecb.counterexample_score.v0.1"
              and .case_id == "oblique_2d" and .rule_id == "oracle_latent_evaluator_only"
              and .tp == 21 and .fp == 0 and .fn == 0 and .tn == 60)
            and any(.[]; .schema_version == "cecb.counterexample_score.v0.1"
              and .case_id == "structural_family_b" and .rule_id == "axis_rule_x0_ge_2"
              and .tp == 0 and .fp == 3 and .fn == 3 and .tn == 3)
            and ([.[] | select(.schema_version == "cecb.counterexample_score.v0.1"
                and .case_id == "noisy_boundary_2d" and .rule_id == "axis_rule_x0_ge_2"
                and .label_source == "observed_label")][0].fn)
              !=
              ([.[] | select(.schema_version == "cecb.counterexample_score.v0.1"
                and .case_id == "noisy_boundary_2d" and .rule_id == "axis_rule_x0_ge_2"
                and .label_source == "latent_truth")][0].fn)
            and any(.[]; .schema_version == "cecb.counterexample_box_search.v0.1"
              and .case_id == "axis_aligned_2d" and .exact_recovery_exists == true)
            and any(.[]; .schema_version == "cecb.counterexample_box_search.v0.1"
              and .case_id == "oblique_2d" and .exact_recovery_exists == false)
            and any(.[]; .schema_version == "cecb.counterexample_box_search.v0.1"
              and .case_id == "axis_aligned_2d"
              and .distinct_prediction_regions == 2026 and .pareto_front_count == 2
              and .maximum_true_positives == 27
              and .minimum_false_positives_at_maximum_true_positives == 0)
            and any(.[]; .schema_version == "cecb.counterexample_box_search.v0.1"
              and .case_id == "oblique_2d"
              and .distinct_prediction_regions == 2026 and .pareto_front_count == 23
              and .maximum_true_positives == 21 and .exact_recovery_exists == false)
            and any(.[]; .schema_version == "cecb.counterexample_box_search.v0.1"
              and .case_id == "nonlinear_interaction_2d"
              and .distinct_prediction_regions == 2026 and .pareto_front_count == 40
              and .maximum_true_positives == 16 and .exact_recovery_exists == false)
            and any(.[]; .schema_version == "cecb.counterexample_box_search.v0.1"
              and .case_id == "nonlinear_interaction_2d" and .exact_recovery_exists == false)
          ' /tmp/cecb-scores-a.jsonl > /dev/null

      - name: Verify deterministic family-transfer tournament receipts
        run: |
          set -euo pipefail
          target="research/cecb-counterexample-benchmark/Cargo.toml"
          source_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          manifest="research/cecb-counterexample-benchmark/fixtures/CECB_FAMILY_TRANSFER_TOURNAMENT_V0_1.json"
          manifest_sha="$(sha256sum "$manifest" | cut -d ' ' -f1)"
          export CECB_SOURCE_SHA="$source_sha"
          export CECB_SPLIT_MANIFEST_SHA256="$manifest_sha"
          cargo run --quiet --locked --manifest-path "$target" --bin cecb-tournament > /tmp/cecb-tournament-a.jsonl
          cargo run --quiet --locked --manifest-path "$target" --bin cecb-tournament > /tmp/cecb-tournament-b.jsonl
          diff -u /tmp/cecb-tournament-a.jsonl /tmp/cecb-tournament-b.jsonl
          test "$(wc -l < /tmp/cecb-tournament-a.jsonl)" -eq 3

          jq -s -e --arg source_sha "$source_sha" --arg manifest_sha "$manifest_sha" '
            length == 3
            and all(.[]; .schema_version == "cecb.discovery_receipt.v0.1"
              and .source_sha == $source_sha
              and .split_manifest_sha256 == $manifest_sha
              and .evaluator_version == "cecb.holdout_evaluator.v0.1"
              and .random_seed == null
              and .observation_selection == "evenly_spaced_v0.1"
              and .source_sha != "unavailable"
              and .split_rule == "leave_one_model_family_out_v0.1"
              and .development_family == "family_a"
              and .holdout_family == "family_b"
              and .method_id == "cecb.univariate_threshold"
              and .method_version == "0.1.0"
              and .observations_used == .observation_budget
              and (.queried_sample_ids | length) == .observations_used
              and .candidate_query_count == .observations_used)
            and any(.[]; .observation_budget == 3
              and .threshold == 4 and .tp == 0 and .fp == 1 and .fn == 3 and .tn == 5)
            and any(.[]; .observation_budget == 5
              and .threshold == 2 and .tp == 0 and .fp == 3 and .fn == 3 and .tn == 3)
            and any(.[]; .observation_budget == 9
              and .threshold == 2 and .development_errors == 0
              and .tp == 0 and .fp == 3 and .fn == 3 and .tn == 3)
          ' /tmp/cecb-tournament-a.jsonl > /dev/null
