name: Authority Current Freshness Runtime

on:
  pull_request:
    paths:
      - 'mycelix-governance/zomes/authority-current-freshness-verifier/**'
      - 'mycelix-governance/zomes/constitution-transition/**'
      - 'mycelix-governance/zomes/constitution-authority/**'
      - 'mycelix-governance/Cargo.toml'
      - 'mycelix-governance/dna/dna.yaml'
      - 'crates/mycelix-governance-constitution/**'
      - 'crates/mycelix-authority-bootstrap-root-adoption-verifier/**'
      - 'crates/mycelix-authority-operational-deployment-fence/**'
      - 'crates/mycelix-authority-operational-freshness/**'
      - 'crates/mycelix-authority-operational-context/**'
      - 'crates/mycelix-authority-control-plane-freshness/**'
      - 'crates/mycelix-authority-state-bootstrap-root/**'
      - '.github/workflows/authority-current-freshness-runtime.yml'
  push:
    branches:
      - 'security/authority-current-freshness-provider-split-v0.1'
      - 'security/authority-current-freshness-runtime-contract-v0.1'
      - 'security/authority-bootstrap-verifier-split-v0.1'
      - 'security/authority-current-constitution-runtime-binding-v0.1'
      - 'security/authority-bootstrap-root-adoption-runtime-v0.1'
      - 'security/authority-current-freshness-host-dna-v0.1'

permissions:
  contents: read

concurrency:
  group: authority-current-freshness-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: Host-DNA deployment-bound current freshness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Adoption pure-kernel tests
        run: cargo test --manifest-path crates/mycelix-authority-bootstrap-root-adoption-verifier/Cargo.toml --all-targets

      - name: Deployment-fence pure-kernel tests
        run: cargo test --manifest-path crates/mycelix-authority-operational-deployment-fence/Cargo.toml --all-targets

      - name: Format
        working-directory: mycelix-governance
        run: cargo fmt --package authority_current_freshness_verifier -- --check

      - name: Native check
        working-directory: mycelix-governance
        run: cargo check --package authority_current_freshness_verifier --all-targets

      - name: Native clippy
        working-directory: mycelix-governance
        run: cargo clippy --package authority_current_freshness_verifier --all-targets -- -D warnings

      - name: WASM check
        working-directory: mycelix-governance
        run: cargo check --release --target wasm32-unknown-unknown --package authority_current_freshness_verifier

      - name: Deployment authority audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('mycelix-governance/zomes/authority-current-freshness-verifier/coordinator/src/lib.rs').read_text()
          inv = Path('mycelix-governance/zomes/authority-current-freshness-verifier/INVARIANTS.md').read_text().lower()
          crate = Path('mycelix-governance/zomes/authority-current-freshness-verifier/coordinator/Cargo.toml').read_text()
          workspace = Path('mycelix-governance/Cargo.toml').read_text()
          dna = Path('mycelix-governance/dna/dna.yaml').read_text()

          assert 'mycelix-authority-bootstrap-root-adoption-verifier' in crate
          assert 'mycelix-authority-operational-deployment-fence' in crate
          assert 'build_adoption_claim(' in src
          assert 'qualify_bootstrap_root_adoption(' in src
          assert 'qualify_operational_freshness_for_deployment(' in src
          assert 'HostLocalDnaContext::from_host_observation(' in src

          root = src.split('fn resolve_root()', 1)[1].split('fn resolve_operational_policies', 1)[0]
          before = root.index('let constitution_before = resolve_binding_current_constitution()?;')
          manifest = root.index('let manifest: AuthorityStateBootstrapRootManifest = call_local(')
          claim = root.index('let adoption_claim = build_adoption_claim(')
          proof = root.index('let adoption_proof: VerifiedBootstrapRootAdoptionProof = call_local(')
          after = root.index('let constitution_after = resolve_binding_current_constitution()?;')
          same = root.index('ensure_same_constitution(&constitution_before, &constitution_after)?;')
          now = root.index('let now = now_ms()?;')
          qualify_adoption = root.index('let qualified_adoption = qualify_bootstrap_root_adoption(')
          qualify_root = root.index('let root = qualify_bootstrap_root(')
          assert before < manifest < claim < proof < after < same < now < qualify_adoption < qualify_root

          operational = src.split('pub fn resolve_current_operational_freshness(', 1)[1].split('#[hdk_extern]\npub fn current_freshness_runtime_status', 1)[0]
          semantic = operational.index('let current = qualify_operational_subject_freshness(')
          host = operational.index('let host_dna_hash = dna_info()?.hash.to_string();')
          observed = operational.index('let host_dna_observed_at = now_ms()?;')
          final_constitution = operational.index('let final_constitution = resolve_binding_current_constitution()?;')
          final_same = operational.index('ensure_same_constitution(&resolved_root.constitution, &final_constitution)?;')
          final_now = operational.index('let final_now = now_ms()?;')
          host_context = operational.index('let host_context = HostLocalDnaContext::from_host_observation(')
          deployment = operational.index('let deployment = qualify_operational_freshness_for_deployment(')
          assert semantic < host < observed < final_constitution < final_same < final_now < host_context < deployment
          assert '&final_constitution.dna_hash' in operational
          assert 'constitution_digest_to_core(final_constitution.statement_digest)' in operational
          assert 'DEPLOYMENT_RETURN_LEASE_MS' in operational

          receipt = src.split('pub struct VerifiedCurrentOperationalFreshnessReceipt {', 1)[1].split('}', 1)[0]
          for field in [
              'pub authority_digest: Digest32',
              'pub evidence_digest: Digest32',
              'pub local_dna_hash: String',
              'pub constitution_statement_digest: Digest32',
              'pub deployment_authority_digest: Digest32',
              'pub deployment_evidence_digest: Digest32',
          ]:
              assert field in receipt, field

          required = [
              'host_local_dna_derived: true',
              'constitutional_dna_cross_checked: true',
              'deployment_authority_constructed_locally: true',
              'semantic_only_output: false',
              'root_manifest_provider_grants_authority: false',
              'current_constitution_source_is_binding_plane: true',
              'root_adoption_proof_verifier_separate: true',
              'root_adoption_constructed_locally: true',
              'latest_dht_record_authority: false',
              'provider_positive_object_authority: false',
              'external_effects_enabled: false',
              'operational: false',
          ]
          for token in required:
              assert token in src, token

          for forbidden in [
              'CurrentOperationalAuthorityEvidence',
              'qualify_current_authority_for_local_dna',
              'authority_state_bootstrap_root_provider',
              'resolve_bootstrap_root_candidates',
              'authority_current_constitution_verifier',
              'project_authority_state_as_of',
              'execute_actions',
              'phi',
              'reputation',
              'model_score',
          ]:
              assert forbidden.lower() not in src.lower(), forbidden

          assert '"zomes/authority-current-freshness-verifier/coordinator"' in workspace
          assert 'name: authority_current_freshness_verifier' not in dna
          assert 'host dna is independent deployment evidence' in inv
          assert 'old omnibus deployment adapter is not reintroduced' in inv
          assert 'deployment authority is constructed locally' in inv
          assert 'deliberately unprovisioned' in inv
          print('PASS: locally qualified #117 authority is fenced by host DNA + final binding constitution')
          PY
