name: Authority Current Freshness Runtime

on:
  pull_request:
    paths:
      - 'mycelix-governance/zomes/authority-current-freshness-verifier/**'
      - 'mycelix-governance/zomes/authority-state-source-head-verifier/**'
      - 'mycelix-governance/zomes/authority-state-witness-verifier/**'
      - 'mycelix-governance/zomes/authority-operational-policy-leased-provider/**'
      - 'mycelix-governance/zomes/constitution-currentness-verifier/**'
      - 'mycelix-governance/zomes/constitution-authority/**'
      - 'mycelix-governance/Cargo.toml'
      - 'mycelix-governance/dna/dna.yaml'
      - 'crates/mycelix-governance-constitution/**'
      - 'crates/mycelix-governance-constitution-currentness/**'
      - 'crates/mycelix-authority-evidence-lease/**'
      - 'crates/mycelix-authority-bootstrap-root-adoption-verifier/**'
      - 'crates/mycelix-authority-operational-deployment-fence/**'
      - 'crates/mycelix-authority-state-transition-verifier/**'
      - 'crates/mycelix-authority-operational-freshness/**'
      - 'crates/mycelix-authority-operational-context/**'
      - 'crates/mycelix-authority-control-plane-freshness/**'
      - 'crates/mycelix-authority-state-bootstrap-root/**'
      - 'crates/mycelix-authority-state-source/**'
      - '.github/workflows/authority-current-freshness-runtime.yml'
  push:
    branches:
      - 'security/authority-current-freshness-provider-split-v0.1'
      - 'security/authority-current-freshness-runtime-contract-v0.1'
      - 'security/authority-bootstrap-verifier-split-v0.1'
      - 'security/authority-current-constitution-runtime-binding-v0.1'
      - 'security/authority-bootstrap-root-adoption-runtime-v0.1'
      - 'security/authority-current-freshness-host-dna-v0.1'
      - 'security/authority-transition-runtime-split-v0.1'
      - 'security/authority-current-freshness-evidence-lease-v0.1'
      - 'security/authority-current-freshness-lease-provenance-v0.1'
      - 'security/authority-current-freshness-provenance-deployment-v0.1'
      - 'security/authority-currentness-wire-boundary-v0.1'
      - 'security/authority-root-provenance-v0.2'
      - 'security/authority-deployment-constitution-context-v0.1'
      - 'security/constitution-currentness-lease-v0.1'
      - 'security/constitution-currentness-contract-v0.1'
      - 'security/deployment-currentness-evidence-context-v0.1'

permissions:
  contents: read

concurrency:
  group: authority-current-freshness-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: v0.11 full constitutional currentness + provenance deployment qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Constitution-currentness pure-contract tests
        run: cargo test --manifest-path crates/mycelix-governance-constitution-currentness/Cargo.toml --all-targets

      - name: Evidence-lease and provenance tests
        run: cargo test --manifest-path crates/mycelix-authority-evidence-lease/Cargo.toml --all-targets

      - name: Adoption pure-kernel tests
        run: cargo test --manifest-path crates/mycelix-authority-bootstrap-root-adoption-verifier/Cargo.toml --all-targets

      - name: Deployment-fence qualification tests
        run: cargo test --manifest-path crates/mycelix-authority-operational-deployment-fence/Cargo.toml --all-targets

      - name: Transition-verifier pure-kernel tests
        run: cargo test --manifest-path crates/mycelix-authority-state-transition-verifier/Cargo.toml --all-targets

      - name: Format
        working-directory: mycelix-governance
        run: |
          cargo fmt --package authority_current_freshness_verifier -- --check
          rustfmt --edition 2024 --check zomes/authority-current-freshness-verifier/coordinator/src/v04/*.rs

      - name: Native check
        working-directory: mycelix-governance
        run: cargo check --package authority_current_freshness_verifier --all-targets

      - name: Native clippy
        working-directory: mycelix-governance
        run: cargo clippy --package authority_current_freshness_verifier --all-targets -- -D warnings

      - name: WASM check
        working-directory: mycelix-governance
        run: cargo check --release --target wasm32-unknown-unknown --package authority_current_freshness_verifier

      - name: End-to-end v0.11 full-currentness deployment audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_root = Path('mycelix-governance/zomes/authority-current-freshness-verifier/coordinator/src')
          parts = {name: (source_root / 'v04' / name).read_text() for name in [
              'types.rs', 'root.rs', 'evidence.rs', 'runtime.rs'
          ]}
          lib = (source_root / 'lib.rs').read_text()
          src = '\n'.join(parts.values())
          root_src = parts['root.rs']
          runtime = parts['runtime.rs']
          types = parts['types.rs']
          inv = Path('mycelix-governance/zomes/authority-current-freshness-verifier/INVARIANTS.md').read_text().lower()
          workspace = Path('mycelix-governance/Cargo.toml').read_text()
          dna = Path('mycelix-governance/dna/dna.yaml').read_text()
          lease_src = Path('crates/mycelix-authority-evidence-lease/src/lib.rs').read_text()
          currentness_contract = Path('crates/mycelix-governance-constitution-currentness/src/lib.rs').read_text()
          producer = Path('mycelix-governance/zomes/constitution-currentness-verifier/coordinator/src/lib.rs').read_text()
          fence_root = Path('crates/mycelix-authority-operational-deployment-fence')
          fence_lib = (fence_root / 'src/lib.rs').read_text()
          fence_constitution = (fence_root / 'src/constitution.rs').read_text()
          fence_currentness = (fence_root / 'src/currentness.rs').read_text()
          consumer_cargo = Path('mycelix-governance/zomes/authority-current-freshness-verifier/coordinator/Cargo.toml').read_text()

          for name in ['types.rs', 'root.rs', 'evidence.rs', 'runtime.rs']:
              assert f'include!("v04/{name}");' in lib

          # Wire/profile version is explicit because v0.11 adds final currentness evidence fields.
          assert 'mycelix-authority-current-freshness-verifier-v0.11' in types
          assert 'binding_constitution_currentness_evidence_digest: Digest32' in types
          assert 'binding_constitution_currentness_evidence_profile: String' in types
          assert 'final_constitution_currentness_evidence_explicit: bool' in types

          # Producer/consumer share one currentness ABI and executable validator.
          assert 'pub struct LeasedVerifiedCurrentConstitution {' in currentness_contract
          assert 'pub fn validate_at(&self, now_ms: u64)' in currentness_contract
          assert 'pub fn currentness_evidence_digest(' in currentness_contract
          assert 'LeasedVerifiedCurrentConstitution::new_genesis(' in producer
          assert 'pub struct LeasedVerifiedCurrentConstitution {' not in producer
          assert 'fn currentness_evidence_digest(' not in producer
          assert 'LeasedVerifiedCurrentConstitution as VerifiedCurrentConstitutionMirror' in types
          assert 'struct VerifiedCurrentConstitutionMirror {' not in types
          assert 'mycelix-governance-constitution-currentness' in consumer_cargo
          validator = root_src.split('fn verify_constitution_projection(', 1)[1].split('fn resolve_binding_current_constitution', 1)[0]
          assert 'current.validate_at(now)' in validator

          # Currentness comes only from the designated verifier; no transition/latest-record fallback.
          assert 'const CONSTITUTION_CURRENTNESS_VERIFIER_ZOME: &str = "constitution_currentness_verifier";' in types
          assert 'const CURRENT_CONSTITUTION_FUNCTION: &str = "get_leased_current_constitution";' in types
          for forbidden in ['CONSTITUTION_TRANSITION_ZOME', 'get_verified_current_constitution', 'CURRENT_CONSTITUTION_COMPOSITION_LEASE_MS']:
              assert forbidden not in src, forbidden

          # #111 compatibility receipt still copies exact verifier evidence only inside the root path.
          receipt_fn = root_src.split('fn current_constitution_receipt(', 1)[1].split('fn resolve_root()', 1)[0]
          for token in [
              'verify_constitution_projection(current, now)?;',
              'verification_ref: current.verification_ref.clone()',
              'verified_at_ms: current.verified_at_ms',
              'valid_until_ms: current.valid_until_ms',
          ]:
              assert token in receipt_fn, token
          assert 'checked_add(' not in receipt_fn
          assert 'format!(' not in receipt_fn

          # #192 records dynamic currentness evidence, not semantic statement identity.
          current_contribution = root_src.split('EvidenceLeaseRole::CurrentConstitution,', 1)[1].split('EvidenceLeaseRole::BootstrapRootAdoption', 1)[0]
          for token in [
              'constitution_after.currentness_evidence_digest',
              '&constitution_after.currentness_evidence_profile',
              '&constitution_after.verification_ref',
          ]:
              assert token in current_contribution, token
          assert 'constitution_receipt.statement_digest' not in current_contribution

          # Root provenance and global lease closure remain exact.
          assert 'mycelix-authority-evidence-lease-v0.2' in lease_src
          for token in [
              'EvidenceLeaseRole::CurrentConstitution',
              'EvidenceLeaseRole::BootstrapRootAdoption',
              'EvidenceLeaseRole::BootstrapRoot',
              'if root_containment != root_lease',
          ]:
              assert token in root_src, token
          for token in ['current_constitution: 1', 'bootstrap_root_adoption: 1', 'bootstrap_root: 1']:
              assert token in runtime, token
          assert 'let provenance = qualify_closed_provenance(&contributions, expected, provenance_now)?;' in runtime
          assert 'provenance.aggregate_lease() != &composition_lease' in runtime

          # Leased source/witness/policy plus independent transition proof domains remain mandatory.
          for token in [
              '"resolve_operational_policy_candidates_leased"',
              '"verify_source_head_leased"',
              '"verify_witness_evidence_leased"',
              'let record_proof: VerifiedTransitionRecordProof = call_local(',
              'let authority_proof: VerifiedTransitionAuthorityProof = call_local(',
              'let qualified = qualify_authority_state_transition(',
          ]:
              assert token in src, token
          for forbidden in ['"resolve_operational_policy_candidates",', '"verify_source_head",', '"verify_witness_evidence",']:
              assert forbidden not in src, forbidden

          # Pure deployment fence preserves compatibility theorems and adds full-currentness sibling.
          assert 'mod currentness;' in fence_lib
          assert 'pub use currentness::*;' in fence_lib
          assert 'pub struct QualifiedCurrentnessBindingConstitutionContext {' in fence_currentness
          assert 'pub struct QualifiedCurrentnessBoundProvenanceDeploymentOperationalFreshness {' in fence_currentness
          assert 'current.validate_at(now_ms)' in fence_currentness
          assert 'qualify_binding_constitution_context(&receipt, rooted, now_ms)' in fence_currentness
          assert 'current.currentness_evidence_digest' in fence_currentness
          assert 'current.currentness_evidence_profile' in fence_currentness
          full_getter = fence_currentness.split('pub fn deployment_authority_digest(&self)', 1)[1].split('}', 1)[0]
          assert 'self.base.deployment_authority_digest()' in full_getter
          assert 'currentness' not in full_getter
          assert 'currentness_bound_deployment_evidence_digest(' in fence_currentness

          # Final runtime ordering closes #192 before full currentness re-observation and never projects to old receipt.
          operational = runtime.split('pub fn resolve_current_operational_freshness(', 1)[1].split('#[hdk_extern]\npub fn current_freshness_runtime_status', 1)[0]
          provenance_time = operational.index('let provenance_now = now_ms()?;')
          provenance = operational.index('let provenance = qualify_closed_provenance(&contributions, expected, provenance_now)?;')
          final_read = operational.index('let final_constitution = resolve_binding_current_constitution()?;')
          same = operational.index('ensure_same_constitution(&resolved_root.constitution, &final_constitution)?;')
          constitution_time = operational.index('let constitution_now = now_ms()?;')
          final_context = operational.index('let final_constitution_context = qualify_currentness_binding_constitution_context(')
          host = operational.index('let host_dna_hash = dna_info()?.hash.to_string();')
          deployment_time = operational.index('let deployment_now = now_ms()?;')
          host_context = operational.index('let host_context = HostLocalDnaContext::from_host_observation(')
          deployment = operational.index('qualify_operational_freshness_for_deployment_with_currentness_and_provenance(')
          assert provenance_time < provenance < final_read < same < constitution_time < final_context < host < deployment_time < host_context < deployment
          final_phase = operational[final_read:deployment]
          assert 'current_constitution_receipt(' not in final_phase
          assert 'qualify_binding_constitution_context(' not in final_phase
          assert '&final_constitution' in operational[final_context:host]
          assert 'root' in operational[final_context:host]

          # Active runtime does not call older deployment theorems directly.
          assert 'qualify_operational_freshness_for_deployment_with_currentness_and_provenance(' in operational
          for old in [
              'qualify_operational_freshness_for_deployment_with_constitution_and_provenance(',
              'qualify_operational_freshness_for_deployment_with_provenance(',
              'qualify_operational_freshness_for_deployment(',
          ]:
              assert old not in operational, old

          # Full currentness context/explicit evidence are echoed before wire projection.
          for token in [
              'deployment.binding_constitution_context_digest()',
              'final_constitution_context.context_digest()',
              'deployment.binding_constitution_currentness_evidence_digest()',
              'Digest32(final_constitution.currentness_evidence_digest.0)',
              'deployment.binding_constitution_currentness_evidence_profile()',
              'final_constitution.currentness_evidence_profile',
          ]:
              assert token in operational, token

          receipt = types.split('pub struct CurrentOperationalFreshnessAuditReceipt {', 1)[1].split('}', 1)[0]
          for field in [
              'composition_evidence_manifest_digest',
              'binding_constitution_context_digest',
              'binding_constitution_currentness_evidence_digest',
              'binding_constitution_currentness_evidence_profile',
              'deployment_authority_digest',
              'deployment_evidence_digest',
              'lease_until_ms',
          ]:
              assert field in receipt, field
          assert 'binding_constitution_currentness_evidence_digest: deployment' in operational
          assert 'deployment_evidence_digest: deployment.deployment_evidence_digest()' in operational

          # Runtime status and containment remain explicit.
          for token in [
              'leased_binding_constitution_consumed: true',
              'synthetic_constitution_lease_constructed_locally: false',
              'final_constitution_context_qualified_locally: true',
              'final_constitution_currentness_evidence_explicit: true',
              'plain_constitution_primitives_accepted_by_active_deployment_path: false',
              'final_constitution_evidence_bound_into_deployment_evidence: true',
              'global_evidence_lease_enforced: true',
              'provenance_required_role_cardinality_closed: true',
              'provenance_manifest_matches_global_lease: true',
              'wire_receipt_transport_only: true',
              'caller_supplied_positive_currentness_accepted: false',
              'wire_receipt_grants_execution_authority: false',
              'external_effects_enabled: false',
              'operational: false',
          ]:
              assert token in src, token

          assert '"zomes/authority-current-freshness-verifier/coordinator"' in workspace
          assert '"zomes/constitution-currentness-verifier/coordinator"' in workspace
          assert 'name: authority_current_freshness_verifier' not in dna
          assert 'name: constitution_currentness_verifier' not in dna

          for invariant in [
              'one shared currentness contract owns evidence shape',
              'constitutional semantics and currentness evidence are different identities',
              'composition provenance is not deployment-fence evidence',
              'final deployment consumes the full shared currentness object',
              'active deployment path accepts no plain constitutional primitives',
              'stable deployment authority remains unchanged',
              'explicit final currentness evidence changes dynamic deployment evidence',
              'v0.11 wire receipt is transport/audit only',
              'deliberately unprovisioned',
              'amendment currentness remains a separate future theorem',
          ]:
              assert invariant in inv, invariant

          print('PASS: v0.11 preserves explicit final constitutional currentness through dynamic deployment evidence while stable authority and all earlier trust-domain separations remain intact')
          PY
