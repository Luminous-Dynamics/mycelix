name: Authority Current Freshness Runtime

on:
  pull_request:
    paths:
      - 'mycelix-governance/zomes/authority-current-freshness-verifier/**'
      - 'mycelix-governance/zomes/authority-state-source-head-verifier/**'
      - 'mycelix-governance/zomes/authority-state-witness-verifier/**'
      - 'mycelix-governance/zomes/authority-operational-policy-leased-provider/**'
      - 'mycelix-governance/zomes/constitution-transition/**'
      - 'mycelix-governance/zomes/constitution-authority/**'
      - 'mycelix-governance/Cargo.toml'
      - 'mycelix-governance/dna/dna.yaml'
      - 'crates/mycelix-governance-constitution/**'
      - 'crates/mycelix-authority-evidence-lease/**'
      - 'crates/mycelix-authority-bootstrap-root-adoption-verifier/**'
      - 'crates/mycelix-authority-operational-deployment-fence/**'
      - 'crates/mycelix-authority-state-transition-verifier/**'
      - 'crates/mycelix-authority-operational-freshness/**'
      - 'crates/mycelix-authority-operational-context/**'
      - 'crates/mycelix-authority-control-plane-freshness/**'
      - 'crates/mycelix-authority-state-bootstrap-root/**'
      - 'crates/mycelix-authority-state-source/**'
      - '.github/workflows/authority-current-freshness-runtime.yml'
  push:
    branches:
      - 'security/authority-current-freshness-provider-split-v0.1'
      - 'security/authority-current-freshness-runtime-contract-v0.1'
      - 'security/authority-bootstrap-verifier-split-v0.1'
      - 'security/authority-current-constitution-runtime-binding-v0.1'
      - 'security/authority-bootstrap-root-adoption-runtime-v0.1'
      - 'security/authority-current-freshness-host-dna-v0.1'
      - 'security/authority-transition-runtime-split-v0.1'
      - 'security/authority-current-freshness-evidence-lease-v0.1'
      - 'security/authority-current-freshness-lease-provenance-v0.1'
      - 'security/authority-current-freshness-provenance-deployment-v0.1'
      - 'security/authority-currentness-wire-boundary-v0.1'
      - 'security/authority-root-provenance-v0.2'
      - 'security/authority-deployment-constitution-context-v0.1'

permissions:
  contents: read

concurrency:
  group: authority-current-freshness-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: Constitution + provenance bound current freshness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Evidence-lease and provenance tests
        run: cargo test --manifest-path crates/mycelix-authority-evidence-lease/Cargo.toml --all-targets

      - name: Adoption pure-kernel tests
        run: cargo test --manifest-path crates/mycelix-authority-bootstrap-root-adoption-verifier/Cargo.toml --all-targets

      - name: Deployment-fence qualification tests
        run: cargo test --manifest-path crates/mycelix-authority-operational-deployment-fence/Cargo.toml --all-targets

      - name: Transition-verifier pure-kernel tests
        run: cargo test --manifest-path crates/mycelix-authority-state-transition-verifier/Cargo.toml --all-targets

      - name: Format
        working-directory: mycelix-governance
        run: |
          cargo fmt --package authority_current_freshness_verifier -- --check
          rustfmt --edition 2024 --check zomes/authority-current-freshness-verifier/coordinator/src/v04/*.rs

      - name: Native check
        working-directory: mycelix-governance
        run: cargo check --package authority_current_freshness_verifier --all-targets

      - name: Native clippy
        working-directory: mycelix-governance
        run: cargo clippy --package authority_current_freshness_verifier --all-targets -- -D warnings

      - name: WASM check
        working-directory: mycelix-governance
        run: cargo check --release --target wasm32-unknown-unknown --package authority_current_freshness_verifier

      - name: End-to-end constitution and provenance deployment audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_root = Path('mycelix-governance/zomes/authority-current-freshness-verifier/coordinator/src')
          parts = {name: (source_root / 'v04' / name).read_text() for name in [
              'types.rs', 'root.rs', 'evidence.rs', 'runtime.rs'
          ]}
          lib = (source_root / 'lib.rs').read_text()
          src = '\n'.join(parts.values())
          root_src = parts['root.rs']
          runtime = parts['runtime.rs']
          types = parts['types.rs']
          inv = Path('mycelix-governance/zomes/authority-current-freshness-verifier/INVARIANTS.md').read_text().lower()
          workspace = Path('mycelix-governance/Cargo.toml').read_text()
          dna = Path('mycelix-governance/dna/dna.yaml').read_text()
          lease_src = Path('crates/mycelix-authority-evidence-lease/src/lib.rs').read_text()
          fence = Path('crates/mycelix-authority-operational-deployment-fence/src/constitution.rs').read_text()

          for name in ['types.rs', 'root.rs', 'evidence.rs', 'runtime.rs']:
              assert f'include!("v04/{name}");' in lib

          # Versioned canonical currentness provenance remains explicit.
          assert 'mycelix-authority-evidence-lease-v0.2' in lease_src
          assert 'mycelix-authority-evidence-lease-manifest-v2-blake3-framed' in lease_src
          assert 'EvidenceLeaseRole::CurrentConstitution' in root_src
          assert 'EvidenceLeaseRole::BootstrapRootAdoption' in root_src
          assert 'EvidenceLeaseRole::BootstrapRoot' in root_src
          assert 'if root_containment != root_lease' in root_src
          assert 'contributions.extend(resolved_root.contributions.iter().cloned())' in runtime
          for token in ['current_constitution: 1', 'bootstrap_root_adoption: 1', 'bootstrap_root: 1']:
              assert token in runtime, token
          assert 'let provenance = qualify_closed_provenance(&contributions, expected, provenance_now)?;' in runtime
          assert 'provenance.aggregate_lease() != &composition_lease' in runtime

          # Leased source/witness/policy and independent transition proof domains remain mandatory.
          for token in [
              '"resolve_operational_policy_candidates_leased"',
              '"verify_source_head_leased"',
              '"verify_witness_evidence_leased"',
              'let record_proof: VerifiedTransitionRecordProof = call_local(',
              'let authority_proof: VerifiedTransitionAuthorityProof = call_local(',
              'let qualified = qualify_authority_state_transition(',
              'EvidenceLeaseRole::AuthorityStateTransition',
              'EvidenceLeaseRole::ControlPlaneFreshness',
          ]:
              assert token in src, token
          for forbidden_endpoint in [
              '"resolve_operational_policy_candidates",',
              '"verify_source_head",',
              '"verify_witness_evidence",',
          ]:
              assert forbidden_endpoint not in src, forbidden_endpoint

          # #192 closes before the final external constitutional authority read.
          operational = runtime.split('pub fn resolve_current_operational_freshness(', 1)[1].split('#[hdk_extern]\npub fn current_freshness_runtime_status', 1)[0]
          provenance_time = operational.index('let provenance_now = now_ms()?;')
          provenance = operational.index('let provenance = qualify_closed_provenance(&contributions, expected, provenance_now)?;')
          final_read = operational.index('let final_constitution = resolve_binding_current_constitution()?;')
          same = operational.index('ensure_same_constitution(&resolved_root.constitution, &final_constitution)?;')
          constitution_time = operational.index('let constitution_now = now_ms()?;')
          final_receipt = operational.index('let final_constitution_receipt =')
          final_context = operational.index('let final_constitution_context =')
          host = operational.index('let host_dna_hash = dna_info()?.hash.to_string();')
          deployment_time = operational.index('let deployment_now = now_ms()?;')
          host_context = operational.index('let host_context = HostLocalDnaContext::from_host_observation(')
          deployment = operational.index('let deployment = qualify_operational_freshness_for_deployment_with_constitution_and_provenance(')
          assert provenance_time < provenance < final_read < same < constitution_time < final_receipt < final_context < host < deployment_time < host_context < deployment
          context_call = operational.split('let final_constitution_context =', 1)[1].split('.map_err', 1)[0]
          assert 'qualify_binding_constitution_context' in context_call
          assert '&final_constitution_receipt' in context_call
          assert 'root' in context_call
          assert 'constitution_now' in context_call
          assert 'root.current_constitution_digest()' not in context_call
          assert '.min(final_constitution_context.valid_until_ms())' in operational
          assert '.cap_valid_until(requested_deployment_until, deployment_now)' in operational
          assert 'canonical provenance expired after final constitution recheck' in operational

          # Active deployment boundary takes only non-deserializable positive contexts.
          assert 'qualify_operational_freshness_for_deployment_with_constitution_and_provenance(' in operational
          assert 'qualify_operational_freshness_for_deployment_with_provenance(' not in operational
          assert 'qualify_operational_freshness_for_deployment(' not in operational
          call = operational.split('let deployment = qualify_operational_freshness_for_deployment_with_constitution_and_provenance(', 1)[1].split(')', 1)[0]
          assert '&current' in call
          assert '&final_constitution_context' in call
          assert '&host_context' in call
          assert '&provenance' in call
          assert 'deployment_now' in call
          assert 'final_constitution.dna_hash' not in call
          assert 'constitution_statement_digest' not in call

          # Pure context qualifier also consumes the non-deserializable #111 root, not a primitive digest.
          context_sig = fence.split('pub fn qualify_binding_constitution_context(', 1)[1].split(') -> Result<', 1)[0]
          assert 'current: &VerifiedCurrentConstitutionReceipt' in context_sig
          assert 'rooted: &QualifiedAuthorityStateBootstrapRoot' in context_sig
          assert 'expected_statement_digest' not in context_sig
          assert 'rooted.qualification_digest()' in fence
          assert 'rooted.current_constitution_digest()' in fence
          assert 'rooted.manifest().constitution_statement_digest' in fence

          # The active sibling likewise exposes no plain constitutional primitives and binds the same root.
          active_sig = fence.split('pub fn qualify_operational_freshness_for_deployment_with_constitution_and_provenance(', 1)[1].split(') -> Result<', 1)[0]
          assert 'constitution: &QualifiedBindingConstitutionContext' in active_sig
          assert 'constitutional_dna_hash' not in active_sig
          assert 'constitution_statement_digest' not in active_sig
          assert 'semantic.root_qualification_digest() != constitution.root_qualification_digest()' in fence
          assert 'semantic.root_qualification_profile() != constitution.root_qualification_profile()' in fence

          # Both evidence phases are echoed exactly before wire projection.
          for token in [
              'deployment.provenance_manifest_digest() != Digest32(provenance.manifest_digest())',
              'deployment.provenance_manifest_profile() != provenance.manifest_profile()',
              'deployment.provenance_contributor_count() != provenance.contributor_count()',
              'deployment.binding_constitution_context_digest()',
              'final_constitution_context.context_digest()',
              'deployment.binding_constitution_context_profile()',
              'final_constitution_context.context_profile()',
              'deployment.binding_constitution_verification_ref()',
              'final_constitution_context.verification_ref()',
              'deployment.binding_constitution_verified_at_ms()',
              'deployment.binding_constitution_valid_until_ms()',
          ]:
              assert token in operational, token

          # Wire audit receipt exposes the two evidence phases separately from stable authority.
          receipt = types.split('pub struct CurrentOperationalFreshnessAuditReceipt {', 1)[1].split('}', 1)[0]
          for field in [
              'composition_evidence_manifest_digest',
              'composition_evidence_manifest_profile',
              'composition_evidence_contributor_count',
              'composition_evidence_verified_at_ms',
              'composition_evidence_valid_until_ms',
              'binding_constitution_context_digest',
              'binding_constitution_context_profile',
              'binding_constitution_verification_ref',
              'binding_constitution_verified_at_ms',
              'binding_constitution_valid_until_ms',
              'deployment_authority_digest',
              'deployment_evidence_digest',
          ]:
              assert field in receipt, field
          assert 'binding_constitution_context_digest: deployment.binding_constitution_context_digest()' in operational
          assert 'deployment_evidence_digest: deployment.deployment_evidence_digest()' in operational

          # Status freezes the new trust boundary and all previous containment properties.
          required = [
              'root_adoption_provenance_explicit: true',
              'root_provenance_lease_constructed_at_root_boundary: true',
              'final_constitution_context_qualified_locally: true',
              'plain_constitution_primitives_accepted_by_active_deployment_path: false',
              'final_constitution_evidence_bound_into_deployment_evidence: true',
              'leased_source_head_consumed: true',
              'leased_witness_evidence_consumed: true',
              'leased_operational_policy_consumed: true',
              'transition_leases_intersected: true',
              'global_evidence_lease_enforced: true',
              'provenance_required_role_cardinality_closed: true',
              'provenance_manifest_matches_global_lease: true',
              'provenance_bound_into_deployment_evidence: true',
              'deployment_lease_capped_by_global_evidence: true',
              'wire_receipt_transport_only: true',
              'caller_supplied_positive_currentness_accepted: false',
              'wire_receipt_grants_execution_authority: false',
              'constitutional_dna_cross_checked: true',
              'external_effects_enabled: false',
              'operational: false',
          ]
          for token in required:
              assert token in src, token

          for forbidden in [
              'CurrentOperationalAuthorityEvidence',
              'qualify_current_authority_for_local_dna',
              'authority_state_bootstrap_root_provider',
              'resolve_bootstrap_root_candidates',
              'project_authority_state_as_of',
              'execute_actions',
              'phi',
              'reputation',
              'model_score',
          ]:
              assert forbidden.lower() not in src.lower(), forbidden

          assert '"zomes/authority-current-freshness-verifier/coordinator"' in workspace
          assert 'name: authority_current_freshness_verifier' not in dna
          for invariant in [
              'root establishment provenance is explicit',
              'final constitutional re-observation is a separate deployment phase',
              'active deployment path accepts no plain constitutional primitives',
              'final constitution evidence is bound into dynamic deployment evidence',
              'final constitutional evidence can only narrow reuse',
              'runtime cross-checks both evidence phases',
              'wire receipt is transport/audit only',
              'deliberately unprovisioned',
          ]:
              assert invariant in inv, invariant
          print('PASS: #192 closes before the final constitution fence; qualified root and constitution context are cross-bound before deployment')
          PY
