name: Authority Current Freshness Runtime

on:
  pull_request:
    paths:
      - 'mycelix-governance/zomes/authority-current-freshness-verifier/**'
      - 'mycelix-governance/zomes/authority-state-source-head-verifier/**'
      - 'mycelix-governance/zomes/authority-state-witness-verifier/**'
      - 'mycelix-governance/zomes/authority-operational-policy-leased-provider/**'
      - 'mycelix-governance/zomes/constitution-transition/**'
      - 'mycelix-governance/zomes/constitution-authority/**'
      - 'mycelix-governance/Cargo.toml'
      - 'mycelix-governance/dna/dna.yaml'
      - 'crates/mycelix-governance-constitution/**'
      - 'crates/mycelix-authority-evidence-lease/**'
      - 'crates/mycelix-authority-bootstrap-root-adoption-verifier/**'
      - 'crates/mycelix-authority-operational-deployment-fence/**'
      - 'crates/mycelix-authority-state-transition-verifier/**'
      - 'crates/mycelix-authority-operational-freshness/**'
      - 'crates/mycelix-authority-operational-context/**'
      - 'crates/mycelix-authority-control-plane-freshness/**'
      - 'crates/mycelix-authority-state-bootstrap-root/**'
      - 'crates/mycelix-authority-state-source/**'
      - '.github/workflows/authority-current-freshness-runtime.yml'
  push:
    branches:
      - 'security/authority-current-freshness-provider-split-v0.1'
      - 'security/authority-current-freshness-runtime-contract-v0.1'
      - 'security/authority-bootstrap-verifier-split-v0.1'
      - 'security/authority-current-constitution-runtime-binding-v0.1'
      - 'security/authority-bootstrap-root-adoption-runtime-v0.1'
      - 'security/authority-current-freshness-host-dna-v0.1'
      - 'security/authority-transition-runtime-split-v0.1'
      - 'security/authority-current-freshness-evidence-lease-v0.1'
      - 'security/authority-current-freshness-lease-provenance-v0.1'

permissions:
  contents: read

concurrency:
  group: authority-current-freshness-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: Provenance-closed deployment-bound current freshness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Evidence-lease and provenance tests
        run: cargo test --manifest-path crates/mycelix-authority-evidence-lease/Cargo.toml --all-targets

      - name: Adoption pure-kernel tests
        run: cargo test --manifest-path crates/mycelix-authority-bootstrap-root-adoption-verifier/Cargo.toml --all-targets

      - name: Deployment-fence pure-kernel tests
        run: cargo test --manifest-path crates/mycelix-authority-operational-deployment-fence/Cargo.toml --all-targets

      - name: Transition-verifier pure-kernel tests
        run: cargo test --manifest-path crates/mycelix-authority-state-transition-verifier/Cargo.toml --all-targets

      - name: Format
        working-directory: mycelix-governance
        run: |
          cargo fmt --package authority_current_freshness_verifier -- --check
          rustfmt --edition 2024 --check zomes/authority-current-freshness-verifier/coordinator/src/v04/*.rs

      - name: Native check
        working-directory: mycelix-governance
        run: cargo check --package authority_current_freshness_verifier --all-targets

      - name: Native clippy
        working-directory: mycelix-governance
        run: cargo clippy --package authority_current_freshness_verifier --all-targets -- -D warnings

      - name: WASM check
        working-directory: mycelix-governance
        run: cargo check --release --target wasm32-unknown-unknown --package authority_current_freshness_verifier

      - name: End-to-end lease provenance audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('mycelix-governance/zomes/authority-current-freshness-verifier/coordinator/src')
          lib = (root / 'lib.rs').read_text()
          src = '\n'.join((root / 'v04' / name).read_text() for name in [
              'types.rs', 'root.rs', 'evidence.rs', 'runtime.rs'
          ])
          inv = Path('mycelix-governance/zomes/authority-current-freshness-verifier/INVARIANTS.md').read_text().lower()
          crate = Path('mycelix-governance/zomes/authority-current-freshness-verifier/coordinator/Cargo.toml').read_text()
          workspace = Path('mycelix-governance/Cargo.toml').read_text()
          dna = Path('mycelix-governance/dna/dna.yaml').read_text()

          for name in ['types.rs', 'root.rs', 'evidence.rs', 'runtime.rs']:
              assert f'include!("v04/{name}");' in lib

          assert 'mycelix-authority-evidence-lease' in crate
          for token in [
              'qualify_evidence_lease_manifest',
              'EvidenceLeaseContribution',
              'EvidenceLeaseRole',
              'QualifiedEvidenceLeaseManifest',
              'LeasedEvidence<OperationalPolicyCandidateBundle>',
              'LeasedEvidence<VerifiedAuthoritySourceHead>',
              'LeasedEvidence<VerifiedWitnessEvidenceBundle>',
          ]:
              assert token in src, token

          assert 'const POLICY_PROVIDER_ZOME: &str = "authority_operational_policy_leased_provider";' in src
          assert '"resolve_operational_policy_candidates_leased"' in src
          assert '"verify_source_head_leased"' in src
          assert '"verify_witness_evidence_leased"' in src
          assert '"resolve_operational_policy_candidates",' not in src
          assert '"verify_source_head",' not in src
          assert '"verify_witness_evidence",' not in src

          # Per-transition proof leases are independently derived after both verifier calls.
          lineage = src.split('fn resolve_transition_lineage(', 1)[1].split('fn resolve_evidence(', 1)[0]
          discover = lineage.index('let candidates: Vec<AuthorityStateTransition> = call_local(')
          record = lineage.index('let record_proof: VerifiedTransitionRecordProof = call_local(')
          authority = lineage.index('let authority_proof: VerifiedTransitionAuthorityProof = call_local(')
          qualify = lineage.index('let qualified = qualify_authority_state_transition(')
          lease = lineage.index('let transition_lease = EvidenceLease::new(')
          contribution = lineage.index('EvidenceLeaseRole::AuthorityStateTransition')
          assert discover < record < authority < qualify < lease < contribution
          assert '&attestation.authoritative_source_ref' in lineage

          # Source/witness leased surfaces are locally cross-bound before provenance admission.
          evidence = src.split('fn resolve_evidence(', 1)[1].split('fn resolve_control_plane_freshness(', 1)[0]
          source = evidence.index('let source: LeasedEvidence<VerifiedAuthoritySourceHead> = call_local(')
          witness = evidence.index('let witness: LeasedEvidence<VerifiedWitnessEvidenceBundle> = call_local(')
          transitions = evidence.index('let lineage = resolve_transition_lineage(&source.evidence)?;')
          join = evidence.index('let source_witness_lease = intersect_leases(')
          assert source < witness < transitions < join
          assert 'source.evidence.attestation.challenge_digest != challenge_digest' in evidence
          assert 'witness.evidence.witnesses.len() != witness.evidence.trust_bindings.len()' in evidence
          assert 'trust_binding.binding.witness_observation_digest != observation_digest' in evidence
          assert 'witness_receipt.verified_at_ms != trust_binding.verified_at_ms' in evidence
          assert 'EvidenceLeaseRole::SourceHead' in evidence
          assert 'EvidenceLeaseRole::WitnessObservation' in evidence
          assert 'EvidenceLeaseRole::WitnessTrustBinding' in evidence

          # Control-plane subtree provenance is exact-counted from qualified probes.
          control = src.split('fn resolve_control_plane_freshness(', 1)[1].split('#[derive(Clone, Copy, Debug, Default, PartialEq, Eq)]', 1)[0]
          assert 'let mut witness_count = 0usize;' in control
          assert 'let mut transition_count = 0usize;' in control
          assert 'EvidenceLeaseRole::ControlPlaneFreshness' in control
          assert 'probe_count: qualified.len()' in control

          operational = src.split('pub fn resolve_current_operational_freshness(', 1)[1].split('#[hdk_extern]\npub fn current_freshness_runtime_status', 1)[0]
          for role in [
              'EvidenceLeaseRole::BootstrapRoot',
              'EvidenceLeaseRole::OperationalCoveragePolicy',
              'EvidenceLeaseRole::OperationalContextPolicy',
              'EvidenceLeaseRole::OperationalFreshness',
          ]:
              assert role in operational, role
          assert 'let expected = ProvenanceCounts {' in operational
          assert 'source_head: control_plane.probe_count + 1' in operational
          assert 'witness_observation: control_plane.witness_count + evidence.witnesses.len()' in operational
          assert 'authority_state_transition: control_plane.transition_count + evidence.transitions.len()' in operational
          assert 'control_plane_freshness: control_plane.probe_count' in operational
          assert 'let provenance = qualify_closed_provenance(&contributions, expected, final_now)?;' in operational
          assert 'provenance.aggregate_lease() != &composition_lease' in operational
          assert '.cap_valid_until(requested_deployment_until, final_now)' in operational
          assert 'HostLocalDnaContext::from_host_observation(' in operational
          assert 'qualify_operational_freshness_for_deployment(' in operational
          assert 'composition_evidence_manifest_digest: Digest32(provenance.manifest_digest())' in operational
          assert 'composition_evidence_contributor_count: provenance.contributor_count()' in operational

          closed = src.split('fn qualify_closed_provenance(', 1)[1].split('#[hdk_extern]\npub fn resolve_current_operational_freshness', 1)[0]
          assert 'observed != expected' in closed
          assert 'observed.total() != contributions.len()' in closed
          assert 'qualify_evidence_lease_manifest(contributions, now)' in closed

          receipt = src.split('pub struct VerifiedCurrentOperationalFreshnessReceipt {', 1)[1].split('}', 1)[0]
          for field in [
              'composition_evidence_manifest_digest',
              'composition_evidence_manifest_profile',
              'composition_evidence_contributor_count',
              'composition_evidence_lease_protocol',
              'composition_evidence_verified_at_ms',
              'composition_evidence_valid_until_ms',
          ]:
              assert field in receipt, field

          required = [
              'leased_source_head_consumed: true',
              'leased_witness_evidence_consumed: true',
              'leased_operational_policy_consumed: true',
              'transition_leases_intersected: true',
              'global_evidence_lease_enforced: true',
              'provenance_contributor_set_constructed_locally: true',
              'provenance_required_role_cardinality_closed: true',
              'provenance_manifest_qualified_locally: true',
              'provenance_manifest_matches_global_lease: true',
              'deployment_lease_capped_by_global_evidence: true',
              'host_local_dna_derived: true',
              'constitutional_dna_cross_checked: true',
              'deployment_authority_constructed_locally: true',
              'semantic_only_output: false',
              'latest_dht_record_authority: false',
              'provider_positive_object_authority: false',
              'external_effects_enabled: false',
              'operational: false',
          ]
          for token in required:
              assert token in src, token

          for forbidden in [
              'CurrentOperationalAuthorityEvidence',
              'qualify_current_authority_for_local_dna',
              'authority_state_bootstrap_root_provider',
              'resolve_bootstrap_root_candidates',
              'authority_current_constitution_verifier',
              'project_authority_state_as_of',
              'execute_actions',
              'phi',
              'reputation',
              'model_score',
          ]:
              assert forbidden.lower() not in src.lower(), forbidden

          assert '"zomes/authority-current-freshness-verifier/coordinator"' in workspace
          assert 'name: authority_current_freshness_verifier' not in dna
          for invariant in [
              'dynamic evidence lease is not authority identity',
              'provenance contributor set is constructed locally',
              'required role/cardinality closure is exact',
              'canonical provenance manifest must reproduce the global lease',
              'manifest identity is audit evidence, not semantic authority',
              'deployment is capped by the global evidence lease',
              'deliberately unprovisioned',
          ]:
              assert invariant in inv, invariant
          print('PASS: exact provenance closure reproduces the global lease and caps deployment authority')
          PY
