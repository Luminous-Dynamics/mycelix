name: Authority Current Freshness Runtime

on:
  pull_request:
    paths:
      - 'mycelix-governance/zomes/authority-current-freshness-verifier/**'
      - 'mycelix-governance/zomes/constitution-transition/**'
      - 'mycelix-governance/Cargo.toml'
      - 'mycelix-governance/dna/dna.yaml'
      - 'crates/mycelix-governance-constitution/**'
      - 'crates/mycelix-authority-operational-freshness/**'
      - 'crates/mycelix-authority-operational-context/**'
      - 'crates/mycelix-authority-control-plane-freshness/**'
      - 'crates/mycelix-authority-state-bootstrap-root/**'
      - '.github/workflows/authority-current-freshness-runtime.yml'
  push:
    branches:
      - 'security/authority-current-freshness-provider-split-v0.1'
      - 'security/authority-current-freshness-runtime-contract-v0.1'
      - 'security/authority-bootstrap-verifier-split-v0.1'
      - 'security/authority-current-constitution-runtime-binding-v0.1'

permissions:
  contents: read

concurrency:
  group: authority-current-freshness-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: Constitution-fenced current freshness composition
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Format
        working-directory: mycelix-governance
        run: cargo fmt --package authority_current_freshness_verifier -- --check

      - name: Native check
        working-directory: mycelix-governance
        run: cargo check --package authority_current_freshness_verifier --all-targets

      - name: Native clippy
        working-directory: mycelix-governance
        run: cargo clippy --package authority_current_freshness_verifier --all-targets -- -D warnings

      - name: WASM check
        working-directory: mycelix-governance
        run: cargo check --release --target wasm32-unknown-unknown --package authority_current_freshness_verifier

      - name: Constitution-fence authority audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('mycelix-governance/zomes/authority-current-freshness-verifier/coordinator/src/lib.rs').read_text()
          inv = Path('mycelix-governance/zomes/authority-current-freshness-verifier/INVARIANTS.md').read_text().lower()
          crate = Path('mycelix-governance/zomes/authority-current-freshness-verifier/coordinator/Cargo.toml').read_text()
          workspace = Path('mycelix-governance/Cargo.toml').read_text()
          dna = Path('mycelix-governance/dna/dna.yaml').read_text()

          assert 'mycelix-governance-constitution' in crate
          assert 'const CONSTITUTION_TRANSITION_ZOME: &str = "constitution_transition";' in src
          assert 'const CURRENT_CONSTITUTION_FUNCTION: &str = "get_verified_current_constitution";' in src
          assert 'VerifiedCurrentConstitutionMirror' in src
          assert 'verify_constitution_projection(&current)' in src
          assert 'current.statement.digest()' in src
          assert 'legacy_constitution_authoritative' in src
          assert 'authority_current_constitution_verifier' not in src

          adoption_request = src.split('pub struct RootAdoptionVerificationRequest {', 1)[1].split('}', 1)[0]
          assert 'pub manifest: AuthorityStateBootstrapRootManifest' in adoption_request
          assert 'pub current_constitution_digest: Digest32' in adoption_request
          assert 'VerifiedCurrentConstitutionReceipt' not in adoption_request

          root = src.split('fn resolve_root()', 1)[1].split('fn resolve_operational_policies', 1)[0]
          before = root.index('let constitution_before = resolve_binding_current_constitution()?;')
          manifest = root.index('let manifest: AuthorityStateBootstrapRootManifest = call_local(')
          adoption = root.index('let adoption: VerifiedBootstrapRootAdoption = call_local(')
          after = root.index('let constitution_after = resolve_binding_current_constitution()?;')
          same = root.index('ensure_same_constitution(&constitution_before, &constitution_after)?;')
          now = root.index('let now = now_ms()?;')
          qualify = root.index('let root = qualify_bootstrap_root(')
          assert before < manifest < adoption < after < same < now < qualify

          operational = src.split('pub fn resolve_current_operational_freshness(', 1)[1].split('#[hdk_extern]\npub fn current_freshness_runtime_status', 1)[0]
          qualify_current = operational.index('let current = qualify_operational_subject_freshness(')
          final_constitution = operational.index('let final_constitution = resolve_binding_current_constitution()?;')
          final_same = operational.index('ensure_same_constitution(&resolved_root.constitution, &final_constitution)?;')
          final_now = operational.index('let final_now = now_ms()?;')
          narrow = operational.index('freshness.lease_until_ms = freshness.lease_until_ms.min(fenced_until);')
          assert qualify_current < final_constitution < final_same < final_now < narrow
          assert 'CURRENT_CONSTITUTION_RETURN_LEASE_MS' in operational
          assert 'current-operational-freshness-fenced:' in operational

          required = [
              'qualify_bootstrap_root(',
              'qualify_control_plane_subject_freshness(',
              'qualify_operational_policy_context(',
              'qualify_operational_subject_freshness(',
              'root_manifest_provider_grants_authority: false',
              'current_constitution_source_is_binding_plane: true',
              'constitution_rechecked_after_adoption: true',
              'constitution_rechecked_before_return: true',
              'root_adoption_verifier_separate: true',
              'evidence_plan_grants_authority: false',
              'latest_dht_record_authority: false',
              'provider_positive_object_authority: false',
              'probe_authority: false',
              'qualification_time_after_evidence: true',
              'external_effects_enabled: false',
              'operational: false',
          ]
          for token in required:
              assert token in src, token

          for forbidden in [
              'authority_state_bootstrap_root_provider',
              'resolve_bootstrap_root_candidates',
              'BootstrapRootCandidateBundle',
              'authority_control_plane_evidence_provider',
              'authority_operational_evidence_provider',
              'project_authority_state_as_of',
              'execute_actions',
              'phi',
              'reputation',
              'model_score',
          ]:
              assert forbidden.lower() not in src.lower(), forbidden

          assert '"zomes/authority-current-freshness-verifier/coordinator"' in workspace
          assert 'name: authority_current_freshness_verifier' not in dna
          assert 'binding constitutional authority is reused, not reinvented' in inv
          assert 'constitutional toctou is fail-closed at the root' in inv
          assert 'constitutional fence spans the complete authority composition' in inv
          assert 'final runtime output is narrower still' in inv
          assert 'deliberately unprovisioned' in inv
          print('PASS: current freshness is fenced by the existing binding constitutional plane before root and before return')
          PY
