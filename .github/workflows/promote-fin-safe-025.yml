name: Promote Qualified FIN-SAFE-025

on:
  pull_request:
    paths:
      - '.github/workflows/promote-fin-safe-025.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: promote-fin-safe-025
  cancel-in-progress: false

env:
  SOURCE_SHA: 'e228ebe008507003cdf31d64d6a1b651ad6838b4'
  PRODUCT_BRANCH: 'fin-safe-025-sap-conservation-test-closure'
  ARTIFACT_ID: '10307653937'
  ARTIFACT_SHA256: 'b02f83bd73214d04d010114a08623da75ceca509fe25764cb5839e98ec83b0e8'
  MANIFEST_SHA256: '2900cb097630cb71a016c40be9137ba5dc35554a46e47739dddcfa40a37f3a2b'
  LOCK_SHA256: '2fa0aae7b219218a0d358ac12fa63b596109613c3ea17c5751ce1f6d57630e93'
  QUALIFICATION_RUN: '34726354031'

jobs:
  promote:
    name: Promote exact FIN-SAFE-025 bytes
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ci-fin-safe-025-promote'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact FIN-SAFE-024 product base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact base and destination
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if git ls-remote --exit-code --heads origin "$PRODUCT_BRANCH" >/dev/null 2>&1; then
            echo "Destination branch already exists: $PRODUCT_BRANCH" >&2
            exit 1
          fi

      - name: Download and verify FIN-SAFE-025 artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/fin-safe-025.zip
          echo "${ARTIFACT_SHA256}  /tmp/fin-safe-025.zip" | sha256sum -c -
          mkdir -p /tmp/fin-safe-025
          unzip -q /tmp/fin-safe-025.zip -d /tmp/fin-safe-025

          test -s /tmp/fin-safe-025/fin-safe-025-source/finance-sap-conservation.Cargo.toml
          test -s /tmp/fin-safe-025/fin-safe-025-Cargo.lock
          echo "${MANIFEST_SHA256}  /tmp/fin-safe-025/fin-safe-025-source/finance-sap-conservation.Cargo.toml" | sha256sum -c -
          echo "${LOCK_SHA256}  /tmp/fin-safe-025/fin-safe-025-Cargo.lock" | sha256sum -c -

      - name: Restore exact qualified manifest and lock
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/fin-safe-025/fin-safe-025-source/finance-sap-conservation.Cargo.toml \
            mycelix-finance/crates/finance-sap-conservation/Cargo.toml
          cp /tmp/fin-safe-025/fin-safe-025-Cargo.lock mycelix-finance/Cargo.lock

          cat > /tmp/expected-status.txt <<'EOF'
           M mycelix-finance/Cargo.lock
           M mycelix-finance/crates/finance-sap-conservation/Cargo.toml
          EOF
          LC_ALL=C sort -o /tmp/expected-status.txt /tmp/expected-status.txt
          git status --porcelain=v1 --untracked-files=all | LC_ALL=C sort > /tmp/actual-status.txt
          diff -u /tmp/expected-status.txt /tmp/actual-status.txt
          git diff --check
          test "$(sha256sum mycelix-finance/Cargo.lock | awk '{print $1}')" = "$LOCK_SHA256"
          test "$(sha256sum mycelix-finance/crates/finance-sap-conservation/Cargo.toml | awk '{print $1}')" = "$MANIFEST_SHA256"

      - name: Create exact semantic commit
        shell: bash
        run: |
          set -euo pipefail
          git switch -c "$PRODUCT_BRANCH"
          git config user.name 'Luminous Dynamics CI'
          git config user.email 'actions@users.noreply.github.com'
          git add mycelix-finance/Cargo.lock mycelix-finance/crates/finance-sap-conservation/Cargo.toml
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --check
          git commit -m 'test(finance): close SAP conservation test dependencies' \
            -m 'FIN-SAFE-025: add finance-collateral-deposit as an explicit dev-dependency for finance-sap-conservation and promote the Cargo-generated cumulative lock from the exact qualification artifact.' \
            -m "Qualified by run ${QUALIFICATION_RUN}, artifact ${ARTIFACT_ID}, outer SHA-256 ${ARTIFACT_SHA256}. The focused finance-sap-conservation suite passed 14/14; the next independent workspace blocker is tracked as FIN-SAFE-026."

          printf 'product_commit=%s\n' "$(git rev-parse HEAD)" | tee /tmp/fin-safe-025-promotion-receipt.txt
          printf 'product_tree=%s\n' "$(git rev-parse HEAD^{tree})" | tee -a /tmp/fin-safe-025-promotion-receipt.txt
          printf 'source_base=%s\nqualification_run=%s\nartifact_id=%s\nartifact_sha256=%s\nmanifest_sha256=%s\nlock_sha256=%s\n' \
            "$SOURCE_SHA" "$QUALIFICATION_RUN" "$ARTIFACT_ID" "$ARTIFACT_SHA256" "$MANIFEST_SHA256" "$LOCK_SHA256" \
            | tee -a /tmp/fin-safe-025-promotion-receipt.txt

      - name: Push product branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/${PRODUCT_BRANCH}"

      - name: Upload promotion receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fin-safe-025-promotion-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: /tmp/fin-safe-025-promotion-receipt.txt
          if-no-files-found: warn
          retention-days: 30
