name: Forge Review Quorum

on:
  pull_request:
    paths:
      - "crates/mycelix-forge-review-quorum/**"
      - ".github/workflows/forge-review-quorum.yml"
  push:
    branches: [main]
    paths:
      - "crates/mycelix-forge-review-quorum/**"
      - ".github/workflows/forge-review-quorum.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-project-policy-review-quorum-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-quorum:
    name: Project-policy trusted review quorum
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates/mycelix-forge-review-quorum
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Rust 1.96
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features
