name: Terra Preta dynamic topology reference

on:
  pull_request:
    branches: [main, research/terra-root-pathways-v0.1]
    paths:
      - 'research/terra-preta/DYNAMIC_TOPOLOGY_REFERENCE_V0.1.md'
      - 'research/terra-preta/schemas/dynamic-topology-*.schema.json'
      - 'research/terra-preta/tools/dynamic-topology-reference/**'
      - '.github/workflows/terra-preta-dynamic-topology-reference.yml'
  push:
    branches: [research/terra-dynamic-topology-v0.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dynamic-topology-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Render formatter output for source recovery
        run: |
          cargo fmt --manifest-path research/terra-preta/tools/dynamic-topology-reference/Cargo.toml
          echo "FORMATTED_MAIN_BASE64=$(base64 -w0 research/terra-preta/tools/dynamic-topology-reference/src/main.rs)"
      - name: Check formatting
        run: cargo fmt --manifest-path research/terra-preta/tools/dynamic-topology-reference/Cargo.toml -- --check
      - name: Tests
        run: cargo test --manifest-path research/terra-preta/tools/dynamic-topology-reference/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --manifest-path research/terra-preta/tools/dynamic-topology-reference/Cargo.toml --all-targets -- -D warnings
      - name: Install pinned Rust JSON Schema validator
        run: cargo install jsonschema-cli --version 0.61.0 --locked
      - name: Validate fixture and report
        run: |
          jsonschema-cli validate research/terra-preta/schemas/dynamic-topology-input.schema.json \
            --instance research/terra-preta/tools/dynamic-topology-reference/fixtures/synthetic-dynamic-topology.json \
            --draft 2020 --assert-format
          cargo run --quiet --manifest-path research/terra-preta/tools/dynamic-topology-reference/Cargo.toml -- \
            research/terra-preta/tools/dynamic-topology-reference/fixtures/synthetic-dynamic-topology.json \
            "$RUNNER_TEMP/dynamic-topology-report.json"
          jsonschema-cli validate research/terra-preta/schemas/dynamic-topology-report.schema.json \
            --instance "$RUNNER_TEMP/dynamic-topology-report.json" --draft 2020 --assert-format
          jq -e '
            .fixture_status == "synthetic_only_not_empirical_evidence" and
            .node_count == 6 and .edge_count == 6 and .snapshot_count == 4 and
            .snapshot_results[0].confirmed_cycle_rank == 1 and
            (.snapshot_results[0].critical_edge_ids == ["inlet-trunk", "outlet-trunk"]) and
            (.snapshot_results[1].pair_results[0].status == "confirmed_connected") and
            (.snapshot_results[2].pair_results[0].status == "indeterminate_unassessed_edge") and
            (.snapshot_results[2].confirmed_connected_pair_count == 0) and
            (.snapshot_results[2].possible_connected_pair_count == 1) and
            (.snapshot_results[3].pair_results[0].status == "confirmed_disconnected")
          ' "$RUNNER_TEMP/dynamic-topology-report.json"
      - name: Reject output overwrite
        run: |
          fixture=research/terra-preta/tools/dynamic-topology-reference/fixtures/synthetic-dynamic-topology.json
          report="$RUNNER_TEMP/existing-dynamic-topology-report.json"
          printf 'do-not-overwrite\n' > "$report"
          if cargo run --quiet --manifest-path research/terra-preta/tools/dynamic-topology-reference/Cargo.toml -- "$fixture" "$report"; then
            echo "Expected create-new output protection"
            exit 1
          fi
          test "$(cat "$report")" = "do-not-overwrite"
