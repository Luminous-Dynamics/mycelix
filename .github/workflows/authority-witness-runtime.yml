name: Authority Witness Runtime

on:
  pull_request:
    paths:
      - 'mycelix-governance/zomes/authority-state-witness-verifier/**'
      - 'mycelix-governance/Cargo.toml'
      - 'mycelix-governance/dna/dna.yaml'
      - 'crates/mycelix-authority-witness-verifier/**'
      - 'crates/mycelix-authority-evidence-lease/**'
      - 'crates/mycelix-authority-state-coverage/**'
      - 'crates/mycelix-authority-state-coverage-context/**'
      - '.github/workflows/authority-witness-runtime.yml'
  push:
    branches:
      - 'security/authority-witness-runtime-split-v0.1'
      - 'security/authority-witness-leased-runtime-v0.1'

permissions:
  contents: read

concurrency:
  group: authority-witness-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: Split witness runtime with leased projection
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Evidence-lease tests
        run: cargo test --manifest-path crates/mycelix-authority-evidence-lease/Cargo.toml --all-targets

      - name: Pure witness tests
        run: cargo test --manifest-path crates/mycelix-authority-witness-verifier/Cargo.toml --all-targets

      - name: Format
        working-directory: mycelix-governance
        run: cargo fmt --package authority_state_witness_verifier -- --check

      - name: Native check
        working-directory: mycelix-governance
        run: cargo check --package authority_state_witness_verifier --all-targets

      - name: Native clippy
        working-directory: mycelix-governance
        run: cargo clippy --package authority_state_witness_verifier --all-targets -- -D warnings

      - name: WASM check
        working-directory: mycelix-governance
        run: cargo check --release --target wasm32-unknown-unknown --package authority_state_witness_verifier

      - name: Witness runtime authority audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('mycelix-governance/zomes/authority-state-witness-verifier/coordinator/src/lib.rs').read_text()
          inv = Path('mycelix-governance/zomes/authority-state-witness-verifier/INVARIANTS.md').read_text().lower()
          cargo = Path('mycelix-governance/zomes/authority-state-witness-verifier/coordinator/Cargo.toml').read_text()
          workspace = Path('mycelix-governance/Cargo.toml').read_text()
          dna = Path('mycelix-governance/dna/dna.yaml').read_text()

          for token in [
              'mycelix-authority-evidence-lease',
              'qualify_witness_evidence(',
              'fn qualify_bundle(',
              'pub fn verify_witness_evidence(',
              'pub fn verify_witness_evidence_leased(',
              'EvidenceLease::new(',
              '.intersect(&witness_lease, final_now)',
              'LeasedEvidence::new(',
              'legacy_projection_fail_closed: true',
              'leased_endpoint_available: true',
              'leased_endpoint_preserves_exact_horizon: true',
              'source_head_authenticated_here: false',
              'quorum_decided_here: false',
              'external_effects_enabled: false',
              'operational: false',
          ]:
              assert token in (cargo + src), token

          classification = src.split('pub struct WitnessTrustClassificationVerificationRequest {', 1)[1].split('}', 1)[0]
          assert 'trust_domain_id' not in classification
          assert 'trust_domain_ref' not in classification
          assert 'observation' not in classification

          helper = src.split('fn qualify_bundle(', 1)[1].split('fn project_bundle(', 1)[0]
          observation = helper.index('let observation_proof: VerifiedWitnessObservationProof = call_local(')
          classification_call = helper.index('let classification_proof: VerifiedWitnessTrustClassificationProof = call_local(')
          now = helper.index('let now = now_ms()?;')
          qualify = helper.index('let qualified = qualify_witness_evidence(')
          final_now = helper.index('let final_now = now_ms()?;')
          intersect = helper.index('.intersect(&witness_lease, final_now)')
          assert observation < classification_call < now < qualify < final_now < intersect

          legacy = src.split('pub fn verify_witness_evidence(', 1)[1].split('/// Lease-complete endpoint', 1)[0]
          assert 'observation.expires_at_ms > qualified.valid_until_ms()' in legacy

          leased = src.split('pub fn verify_witness_evidence_leased(', 1)[1].split('#[hdk_extern]\npub fn witness_runtime_status', 1)[0]
          assert 'LeasedEvidence::new(' in leased
          assert 'observation.expires_at_ms >' not in leased

          assert '"zomes/authority-state-witness-verifier/coordinator"' in workspace
          assert 'name: authority_state_witness_verifier' not in dna
          assert 'legacy projection remains fail-closed' in inv
          assert 'leased projection preserves short verifier horizons' in inv
          assert 'quorum remains downstream' in inv
          assert 'deliberately unprovisioned' in inv
          print('PASS: witness runtime keeps legacy projection strict and carries exact short leases in leased mode')
          PY
