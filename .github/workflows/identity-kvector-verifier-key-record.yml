name: Identity K-Vector Verifier Key Record V2

on:
  pull_request:
    paths:
      - 'mycelix-workspace/mycelix-identity/Cargo.toml'
      - 'mycelix-workspace/mycelix-identity/crates/mycelix-crypto/**'
      - 'mycelix-workspace/mycelix-identity/crates/kvector-verifier-key-record-policy/**'
      - '.github/workflows/identity-kvector-verifier-key-record.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-workspace/mycelix-identity/Cargo.toml'
      - 'mycelix-workspace/mycelix-identity/crates/mycelix-crypto/**'
      - 'mycelix-workspace/mycelix-identity/crates/kvector-verifier-key-record-policy/**'
      - '.github/workflows/identity-kvector-verifier-key-record.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify-kvector-verifier-key-record-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Assert verifier-key record theorem boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          root = Path('mycelix-workspace/mycelix-identity')
          member = 'crates/kvector-verifier-key-record-policy'
          workspace = tomllib.loads((root / 'Cargo.toml').read_text())
          if member not in workspace.get('workspace', {}).get('members', []):
              raise SystemExit(f'ERROR: {member} is not an explicit identity workspace member')

          manifest = tomllib.loads((root / member / 'Cargo.toml').read_text())
          deps = manifest.get('dependencies', {})
          if set(deps) != {'mycelix-crypto', 'sha2'}:
              raise SystemExit(f'ERROR: verifier-key policy dependencies drifted: {sorted(deps)}')
          crypto = deps['mycelix-crypto']
          if crypto.get('path') != '../mycelix-crypto':
              raise SystemExit('ERROR: verifier-key policy is not bound to local mycelix-crypto')
          if crypto.get('default-features') is not False or crypto.get('features') != ['wasm']:
              raise SystemExit('ERROR: verifier-key policy must use mycelix-crypto types-only wasm surface')
          if deps['sha2'].get('workspace') is not True:
              raise SystemExit('ERROR: verifier-key policy must use workspace-qualified SHA-256')

          text = (root / member / 'src/lib.rs').read_text()
          required = [
              '#![forbid(unsafe_code)]',
              'mycelix:identity:kvector-verifier-key-record:v2\\0',
              'KVectorVerifierKeyRecordV2',
              'KVectorVerifierKeyUseContextV2',
              'kvector_verifier_signature_scheme_id_v2',
              'validate_kvector_verifier_key_record_v2',
              'derive_kvector_verifier_key_record_digest_v2',
              'validate_kvector_verifier_key_use_v2',
              'TaggedPublicKey::new(record.algorithm, record.public_key_bytes.to_vec())',
              'record.algorithm.is_signature_algorithm()',
              'record.key_generation.to_be_bytes()',
              'record.public_key_bytes',
              'record.valid_from_micros.to_be_bytes()',
              'record.valid_until_micros.to_be_bytes()',
              'hybrid-ed25519-ml-dsa-65-v1',
              'verifier_key_record_digest_vector_is_frozen',
              '0xaa, 0xf7, 0x7d, 0x68',
              'key_generation_is_part_of_record_identity',
              'historical_use_requires_exact_identity_scheme_and_time_window',
              'hybrid_scheme_is_distinct_from_ed25519_half',
              'does not prove the key',
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'ERROR: verifier-key theorem missing: {needle!r}')

          lower = text.lower()
          for forbidden in [
              'f32',
              'f64',
              'use hdk',
              'use hdi',
              'hdk::',
              'hdi::',
              'holochain_',
              'serde::',
              'sys_time(',
              'std::time',
              'rand::',
              'hybrid_sig::verify',
              'signature_validated',
              'policy_current',
              'policy_accepted',
              'currentverifierkey',
              'qualifiedverifierkey',
              'trustedverifierkey',
              'revocationresolver',
              '.sort_by(',
              '.sort_by_key(',
              '.max_by(',
              '.max_by_key(',
          ]:
              if forbidden in lower:
                  raise SystemExit(
                      f'ERROR: currentness/signature/runtime authority leaked into verifier-key assertion theorem: {forbidden!r}'
                  )

          digest_start = text.index('pub fn derive_kvector_verifier_key_record_digest_v2(')
          digest_end = text.index('pub fn validate_kvector_verifier_key_use_v2(', digest_start)
          digest_body = text[digest_start:digest_end]
          for needle in [
              'record.verifier_did.as_bytes()',
              'record.verifier_key_id.as_bytes()',
              'record.algorithm.as_u16().to_be_bytes()',
              'record.public_key_bytes',
              'record.key_generation.to_be_bytes()',
              'record.issued_at_micros.to_be_bytes()',
              'record.valid_from_micros.to_be_bytes()',
              'record.valid_until_micros.to_be_bytes()',
          ]:
              if needle not in digest_body:
                  raise SystemExit(f'ERROR: verifier-key digest lost binding: {needle!r}')

          use_start = text.index('pub fn validate_kvector_verifier_key_use_v2(')
          use_end = text.index('#[cfg(test)]', use_start)
          use_body = text[use_start:use_end]
          for needle in [
              'context.verifier_did != record.verifier_did',
              'context.verifier_key_id != record.verifier_key_id',
              'context.signature_scheme_id != expected_scheme',
              'context.verified_at_micros < record.valid_from_micros',
              'context.verified_at_micros >= record.valid_until_micros',
          ]:
              if needle not in use_body:
                  raise SystemExit(f'ERROR: historical key-use binding lost: {needle!r}')
          PY

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-workspace/mycelix-identity

      - name: Check formatting
        run: |
          cargo fmt \
            --manifest-path mycelix-workspace/mycelix-identity/crates/kvector-verifier-key-record-policy/Cargo.toml \
            -- --check

      - name: Test verifier-key record theorem
        run: |
          cargo test \
            --manifest-path mycelix-workspace/mycelix-identity/crates/kvector-verifier-key-record-policy/Cargo.toml

      - name: Check verifier-key record theorem for wasm32
        run: |
          cargo check \
            --manifest-path mycelix-workspace/mycelix-identity/crates/kvector-verifier-key-record-policy/Cargo.toml \
            --target wasm32-unknown-unknown
