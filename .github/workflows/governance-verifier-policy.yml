name: Governance Verifier Policy

on:
  pull_request:
    paths:
      - 'crates/mycelix-institutional-core/**'
      - 'crates/mycelix-governance-rights/**'
      - 'crates/mycelix-governance-verifier-policy/**'
      - '.github/workflows/governance-verifier-policy.yml'
  push:
    branches: [main]
    paths:
      - 'crates/mycelix-institutional-core/**'
      - 'crates/mycelix-governance-rights/**'
      - 'crates/mycelix-governance-verifier-policy/**'

jobs:
  verifier-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --manifest-path crates/mycelix-governance-verifier-policy/Cargo.toml -- --check

      - name: Test
        run: cargo test --manifest-path crates/mycelix-governance-verifier-policy/Cargo.toml --all-targets

      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-governance-verifier-policy/Cargo.toml --all-targets -- -D warnings
