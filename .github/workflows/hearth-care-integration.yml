name: Mycelix Hearth Care Integration

on:
  pull_request:
    paths:
      - 'mycelix-workspace/mycelix-hearth/zomes/hearth-care/**'
      - 'mycelix-workspace/mycelix-hearth/zomes/hearth-care-transitions/**'
      - 'mycelix-workspace/mycelix-hearth/zomes/hearth-kinship/**'
      - 'mycelix-workspace/mycelix-hearth/zomes/hearth-bridge/**'
      - 'mycelix-workspace/mycelix-hearth/crates/hearth-types/**'
      - 'mycelix-workspace/mycelix-hearth/crates/hearth-coordinator-common/**'
      - 'mycelix-workspace/mycelix-hearth/tests/Cargo.toml'
      - 'mycelix-workspace/mycelix-hearth/tests/sweettest_care_gratitude_rhythms.rs'
      - 'mycelix-workspace/mycelix-hearth/tests/sweettest_care_authority.rs'
      - 'mycelix-workspace/mycelix-hearth/tests/sweettest_care_revocation.rs'
      - 'mycelix-workspace/mycelix-hearth/tests/sweettest_care_transitions_v2.rs'
      - 'mycelix-workspace/mycelix-hearth/tests/sweettest_care_transitions_adversarial.rs'
      - 'mycelix-workspace/mycelix-hearth/tests/sweettest_care_transitions_immutability.rs'
      - 'mycelix-workspace/mycelix-hearth/tests/fixtures/care-transition-adversarial/**'
      - 'mycelix-workspace/mycelix-hearth/dna/**'
      - 'mycelix-workspace/mycelix-hearth/flake.nix'
      - 'mycelix-workspace/mycelix-hearth/flake.lock'
      - 'mycelix-workspace/nix/modules/**'
      - 'mycelix-workspace/crates/mycelix-bridge-common/**'
      - 'mycelix-workspace/crates/mycelix-bridge-entry-types/**'
      - 'mycelix-workspace/crates/mycelix-zkp-core/**'
      - 'mycelix-workspace/crates/mycelix-zome-helpers/**'
      - '.github/workflows/hearth-care-integration.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-workspace/mycelix-hearth/zomes/hearth-care/**'
      - 'mycelix-workspace/mycelix-hearth/zomes/hearth-care-transitions/**'
      - 'mycelix-workspace/mycelix-hearth/zomes/hearth-kinship/**'
      - 'mycelix-workspace/mycelix-hearth/zomes/hearth-bridge/**'
      - 'mycelix-workspace/mycelix-hearth/crates/hearth-types/**'
      - 'mycelix-workspace/mycelix-hearth/crates/hearth-coordinator-common/**'
      - 'mycelix-workspace/mycelix-hearth/tests/Cargo.toml'
      - 'mycelix-workspace/mycelix-hearth/tests/sweettest_care_gratitude_rhythms.rs'
      - 'mycelix-workspace/mycelix-hearth/tests/sweettest_care_authority.rs'
      - 'mycelix-workspace/mycelix-hearth/tests/sweettest_care_revocation.rs'
      - 'mycelix-workspace/mycelix-hearth/tests/sweettest_care_transitions_v2.rs'
      - 'mycelix-workspace/mycelix-hearth/tests/sweettest_care_transitions_adversarial.rs'
      - 'mycelix-workspace/mycelix-hearth/tests/sweettest_care_transitions_immutability.rs'
      - 'mycelix-workspace/mycelix-hearth/tests/fixtures/care-transition-adversarial/**'
      - 'mycelix-workspace/mycelix-hearth/dna/**'
      - 'mycelix-workspace/mycelix-hearth/flake.nix'
      - 'mycelix-workspace/mycelix-hearth/flake.lock'
      - 'mycelix-workspace/nix/modules/**'
      - 'mycelix-workspace/crates/mycelix-bridge-common/**'
      - 'mycelix-workspace/crates/mycelix-bridge-entry-types/**'
      - 'mycelix-workspace/crates/mycelix-zkp-core/**'
      - 'mycelix-workspace/crates/mycelix-zome-helpers/**'
      - '.github/workflows/hearth-care-integration.yml'

permissions:
  contents: read

concurrency:
  group: hearth-care-integration-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

env:
  HEARTH_ROOT: mycelix-workspace/mycelix-hearth
  DNA_BUNDLE: mycelix-workspace/mycelix-hearth/dna/mycelix_hearth.dna
  ADVERSARIAL_DNA_BUNDLE: mycelix-workspace/mycelix-hearth/dna-adversarial/mycelix_hearth.dna

jobs:
  hearth-care-integration:
    name: Care SweetConductor
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Verify exact subject checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected" || {
            echo "::error::Expected exact subject $expected, got $actual"
            exit 1
          }

      - name: Verify Care integration source closure
        shell: bash
        run: |
          set -euo pipefail
          for required in \
            "$HEARTH_ROOT/Cargo.toml" \
            "$HEARTH_ROOT/flake.nix" \
            "$HEARTH_ROOT/dna/dna.yaml" \
            "$HEARTH_ROOT/tests/Cargo.toml" \
            "$HEARTH_ROOT/tests/sweettest_care_gratitude_rhythms.rs" \
            "$HEARTH_ROOT/tests/sweettest_care_authority.rs" \
            "$HEARTH_ROOT/tests/sweettest_care_revocation.rs" \
            "$HEARTH_ROOT/tests/sweettest_care_transitions_v2.rs" \
            "$HEARTH_ROOT/tests/sweettest_care_transitions_adversarial.rs" \
            "$HEARTH_ROOT/tests/sweettest_care_transitions_immutability.rs" \
            "$HEARTH_ROOT/tests/fixtures/care-transition-adversarial/fake-integrity/Cargo.toml" \
            "$HEARTH_ROOT/tests/fixtures/care-transition-adversarial/fake-integrity/src/lib.rs" \
            "$HEARTH_ROOT/tests/fixtures/care-transition-adversarial/harness-coordinator/Cargo.toml" \
            "$HEARTH_ROOT/tests/fixtures/care-transition-adversarial/harness-coordinator/src/lib.rs" \
            "$HEARTH_ROOT/zomes/hearth-care/coordinator/Cargo.toml" \
            "$HEARTH_ROOT/zomes/hearth-care-transitions/integrity/Cargo.toml" \
            "$HEARTH_ROOT/zomes/hearth-care-transitions/coordinator/Cargo.toml" \
            "$HEARTH_ROOT/zomes/hearth-kinship/coordinator/Cargo.toml" \
            "$HEARTH_ROOT/zomes/hearth-bridge/coordinator/Cargo.toml"; do
            test -f "$required" || {
              echo "::error file=$required::Required Hearth Care integration source is missing."
              exit 1
            }
          done

      - name: Prove adversarial zomes are absent from production DNA
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'hearth_care_transition_fake_integrity' "$HEARTH_ROOT/dna/dna.yaml"
          ! grep -q 'hearth_care_transition_test_harness' "$HEARTH_ROOT/dna/dna.yaml"
          ! grep -q 'hearth_care_transition_fake_integrity' "$HEARTH_ROOT/happ.yaml"
          ! grep -q 'hearth_care_transition_test_harness' "$HEARTH_ROOT/happ.yaml"

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v15
        with:
          name: holochain-ci

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            mycelix-workspace/mycelix-hearth
            mycelix-workspace/mycelix-hearth/tests
            mycelix-workspace/crates

      - name: Build Hearth zomes for wasm32
        shell: bash
        run: |
          set -euo pipefail
          cd "$HEARTH_ROOT"
          nix develop .#ci --impure --command \
            cargo build --release --target wasm32-unknown-unknown --workspace

      - name: Build qualification-only adversarial fixture zomes
        shell: bash
        run: |
          set -euo pipefail
          cd "$HEARTH_ROOT"
          nix develop .#ci --impure --command bash -lc '
            set -euo pipefail
            fixture_target="target/adversarial-fixtures"
            cargo build --release --target wasm32-unknown-unknown \
              --target-dir "$fixture_target" \
              --manifest-path tests/fixtures/care-transition-adversarial/fake-integrity/Cargo.toml
            cargo build --release --target wasm32-unknown-unknown \
              --target-dir "$fixture_target" \
              --manifest-path tests/fixtures/care-transition-adversarial/harness-coordinator/Cargo.toml
            cp "$fixture_target/wasm32-unknown-unknown/release/hearth_care_transition_fake_integrity.wasm" \
              target/wasm32-unknown-unknown/release/
            cp "$fixture_target/wasm32-unknown-unknown/release/hearth_care_transition_test_harness.wasm" \
              target/wasm32-unknown-unknown/release/
          '

      - name: Pack exact Hearth DNA
        shell: bash
        run: |
          set -euo pipefail
          cd "$HEARTH_ROOT"
          nix develop .#ci --impure --command hc dna pack dna/
          test -f dna/mycelix_hearth.dna || {
            echo "::error::hc dna pack did not produce dna/mycelix_hearth.dna"
            exit 1
          }
          sha256sum dna/mycelix_hearth.dna | tee "$RUNNER_TEMP/hearth-care-dna.sha256"

      - name: Pack qualification-only adversarial Hearth DNA
        shell: bash
        run: |
          set -euo pipefail
          cd "$HEARTH_ROOT"
          rm -rf dna-adversarial
          mkdir -p dna-adversarial
          awk '
            BEGIN { inserted = 0 }
            /^coordinator:/ && inserted == 0 {
              print "    # QUALIFICATION-ONLY Serde-lookalike integrity zome."
              print "    - name: hearth_care_transition_fake_integrity"
              print "      path: ../target/wasm32-unknown-unknown/release/hearth_care_transition_fake_integrity.wasm"
              print ""
              inserted = 1
            }
            { print }
            END {
              print ""
              print "    # QUALIFICATION-ONLY raw transition publisher."
              print "    - name: hearth_care_transition_test_harness"
              print "      path: ../target/wasm32-unknown-unknown/release/hearth_care_transition_test_harness.wasm"
              print "      dependencies:"
              print "        - name: hearth_care_transitions_integrity"
              print "        - name: hearth_care_transition_fake_integrity"
            }
          ' dna/dna.yaml > dna-adversarial/dna.yaml
          nix develop .#ci --impure --command hc dna pack dna-adversarial/
          test -f dna-adversarial/mycelix_hearth.dna || {
            echo "::error::hc dna pack did not produce adversarial Hearth DNA"
            exit 1
          }
          sha256sum dna-adversarial/mycelix_hearth.dna | tee "$RUNNER_TEMP/hearth-care-adversarial-dna.sha256"

      - name: Run positive Care SweetConductor lifecycle
        shell: bash
        run: |
          set -euo pipefail
          cd "$HEARTH_ROOT"
          nix develop .#ci --impure --command bash -lc '
            cd tests
            cargo test --release \
              --test sweettest_care_gratitude_rhythms \
              test_care_create_and_complete \
              -- --ignored --exact --test-threads=1
          '

      - name: Run Care authority SweetConductor regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$HEARTH_ROOT"
          nix develop .#ci --impure --command bash -lc '
            cd tests
            cargo test --release \
              --test sweettest_care_authority \
              -- --ignored --test-threads=1
          '

      - name: Run Care membership revocation SweetConductor regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$HEARTH_ROOT"
          nix develop .#ci --impure --command bash -lc '
            cd tests
            cargo test --release \
              --test sweettest_care_revocation \
              departed_member_loses_care_transition_authority \
              -- --ignored --exact --test-threads=1
          '

      - name: Run immutable Care v2 transition qualification
        shell: bash
        run: |
          set -euo pipefail
          cd "$HEARTH_ROOT"
          nix develop .#ci --impure --command bash -lc '
            cd tests
            cargo test --release \
              --test sweettest_care_transitions_v2 \
              immutable_completion_preserves_authority_and_provenance \
              -- --ignored --exact --test-threads=1
          '

      - name: Run direct Care transition-integrity adversarial qualification
        shell: bash
        run: |
          set -euo pipefail
          cd "$HEARTH_ROOT"
          nix develop .#ci --impure --command bash -lc '
            cd tests
            cargo test --release \
              --test sweettest_care_transitions_adversarial \
              forged_transition_evidence_fails_closed \
              -- --ignored --exact --test-threads=1
          '

      - name: Run Care transition immutability and append-only link qualification
        shell: bash
        run: |
          set -euo pipefail
          cd "$HEARTH_ROOT"
          nix develop .#ci --impure --command bash -lc '
            cd tests
            cargo test --release \
              --test sweettest_care_transitions_immutability \
              completion_evidence_is_immutable_and_index_links_are_append_only \
              -- --ignored --exact --test-threads=1
          '

      - name: Upload exact integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hearth-care-integration-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ env.DNA_BUNDLE }}
            ${{ env.ADVERSARIAL_DNA_BUNDLE }}
            ${{ runner.temp }}/hearth-care-dna.sha256
            ${{ runner.temp }}/hearth-care-adversarial-dna.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Prove tracked source immutability
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
