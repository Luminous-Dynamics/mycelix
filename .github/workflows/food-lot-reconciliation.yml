name: Food Lot Reconciliation

on:
  pull_request:
    paths:
      - "mycelix-commons/zomes/food-distribution/integrity/**"
      - "tools/food-lot-reconciliation-harness/**"
      - ".github/workflows/food-lot-reconciliation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: food-lot-reconciliation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-kernel:
    name: Focused reconciliation kernel (exact head)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QUALIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          persist-credentials: false

      - name: Assert exact checkout
        run: test "$(git rev-parse HEAD)" = "${QUALIFIED_SHA}"

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - name: Assert toolchain
        run: |
          test "$(rustc --version | awk '{print $2}')" = "1.100.0"
          rustc --version --verbose
          rustfmt --version

      - name: Check formatting
        run: cargo fmt --manifest-path tools/food-lot-reconciliation-harness/Cargo.toml --all -- --check

      - name: Run production-source unit tests
        run: cargo test --manifest-path tools/food-lot-reconciliation-harness/Cargo.toml

      - name: Run strict Clippy
        run: cargo clippy --manifest-path tools/food-lot-reconciliation-harness/Cargo.toml --all-targets -- -D warnings
