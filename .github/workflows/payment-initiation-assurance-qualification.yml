name: Payment Initiation Assurance Qualification

on:
  pull_request:
    paths:
      - 'mycelix-finance/docs/payment-initiation-assurance-*'
      - 'tools/finance/payment-initiation-assurance/**'
      - '.github/workflows/payment-initiation-assurance-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-finance/docs/payment-initiation-assurance-*'
      - 'tools/finance/payment-initiation-assurance/**'
      - '.github/workflows/payment-initiation-assurance-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payment-initiation:
    name: Synthetic payment intent and QR assurance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.0
          rustc --version
          cargo --version
      - name: Check formatting
        run: cargo fmt --manifest-path tools/finance/payment-initiation-assurance/Cargo.toml -- --check
      - name: Run schema and semantic unit tests
        run: cargo test --manifest-path tools/finance/payment-initiation-assurance/Cargo.toml
      - name: Run deterministic negative control campaign
        run: cargo run --manifest-path tools/finance/payment-initiation-assurance/Cargo.toml
      - name: Run Clippy
        run: cargo clippy --manifest-path tools/finance/payment-initiation-assurance/Cargo.toml --all-targets -- -D warnings
