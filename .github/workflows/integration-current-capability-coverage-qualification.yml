name: Integration Current Capability Coverage Qualification

on:
  pull_request:
    paths:
      - 'crates/mycelix-integration-current-capability-coverage/**'
      - 'crates/mycelix-integration-current-action-authority/**'
      - 'crates/mycelix-integration-capability-currentness/**'
      - 'crates/mycelix-governance-current-executor-authority/**'
      - 'crates/mycelix-governance-executor-designation/**'
      - '.github/workflows/integration-current-capability-coverage-qualification.yml'
  push:
    branches:
      - 'feat/integration-current-capability-coverage-v1'

permissions:
  contents: read

concurrency:
  group: integration-current-capability-coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Same current executor + exact current capability
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.89.0'
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --manifest-path crates/mycelix-integration-current-capability-coverage/Cargo.toml -- --check

      - name: Tests
        run: cargo test --manifest-path crates/mycelix-integration-current-capability-coverage/Cargo.toml --all-targets

      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-integration-current-capability-coverage/Cargo.toml --all-targets -- -D warnings

      - name: Upstream compatibility
        run: |
          cargo check --manifest-path crates/mycelix-integration-current-action-authority/Cargo.toml --all-targets
          cargo check --manifest-path crates/mycelix-integration-capability-currentness/Cargo.toml --all-targets
          cargo check --manifest-path crates/mycelix-governance-current-executor-authority/Cargo.toml --all-targets

      - name: Boundary audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('crates/mycelix-integration-current-capability-coverage')
          src = (root / 'src/lib.rs').read_text()
          prod = src.split('#[cfg(test)]', 1)[0]
          readme = (root / 'README.md').read_text()
          cargo = (root / 'Cargo.toml').read_text()
          compact = ''.join(prod.split())

          for dep in [
              'mycelix-governance-current-executor-authority = ',
              'mycelix-integration-current-action-authority = ',
              'mycelix-integration-capability-currentness = ',
          ]:
              assert dep in cargo, dep

          for token in [
              'pub struct MatchedCurrentIntegrationCapabilityCoverage {',
              'pub fn match_current_integration_capability_coverage(',
              'qualify_current_executor_authority(',
              'current_action.command_commitment()',
              'current_mapping.command_commitment()',
              'action_executor.current_authority_digest()',
              'requalified_executor.current_authority_digest()',
              '&policy.institution',
              '&designation.institution',
              '&policy.rulebook',
              '&designation.rulebook',
              '&policy.jurisdiction',
              '&designation.jurisdiction',
              'current_mapping.required_capability()',
              '&designation.required_capability',
          ]:
              assert token in src, token

          prefix = src.split('pub struct MatchedCurrentIntegrationCapabilityCoverage {', 1)[0].split('\n')[-8:]
          assert not any('Deserialize' in line for line in prefix)

          for forbidden in [
              'CurrentExecutorAuthorityProjection',
              'VerifiedCurrentExecutorAuthorityReceipt',
              'reqwest', 'hyper', 'holochain_client', 'AdminWebsocket', 'AppWebsocket',
              'perform_external_effect', 'invoke_external_effect', 'mark_dispatch_started',
          ]:
              assert forbidden not in cargo + prod, forbidden

          for token in [
              'pubconstfnexact_current_action_bound_here(&self)->bool{true}',
              'pubconstfncurrent_capability_policy_bound_here(&self)->bool{true}',
              'pubconstfnexecutor_capability_matched_here(&self)->bool{true}',
              'pubconstfncurrent_executor_requalified_here(&self)->bool{true}',
              'pubconstfnprovider_profile_bound_here(&self)->bool{false}',
              'pubconstfnattempt_bound_here(&self)->bool{false}',
              'pubconstfnprovider_payload_materialized_here(&self)->bool{false}',
              'pubconstfngrants_execution_authority(&self)->bool{false}',
          ]:
              assert token in compact, token

          for phrase in [
              'CurrentExecutorCapabilityCoverage != QualifiedProviderProfile',
              'CurrentExecutorCapabilityCoverage != DurableAttempt',
              'CurrentExecutorCapabilityCoverage != CurrentExecutionAuthority',
          ]:
              assert phrase in readme, phrase

          print('PASS: exact current executor capability coverage remains pre-provider/pre-attempt/pre-effect')
          PY
