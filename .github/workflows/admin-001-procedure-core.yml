name: ADMIN-001 Procedure Core

on:
  pull_request:
    paths:
      - 'crates/mycelix-administrative-procedure/**'
      - '.github/workflows/admin-001-procedure-core.yml'
  push:
    branches:
      - 'feat/admin-001-procedure-core-v0.1'

permissions:
  contents: read

concurrency:
  group: admin-001-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Pure administrative decision qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Toolchain identity
        run: |
          rustc --version --verbose
          cargo --version
          rustfmt --version
          cargo clippy --version

      - name: Dependency and public-surface boundary
        run: |
          python3 - <<'PY'
          import pathlib
          import tomllib

          root = pathlib.Path('crates/mycelix-administrative-procedure')
          manifest = tomllib.loads((root / 'Cargo.toml').read_text())
          deps = manifest.get('dependencies', {})
          assert set(deps) == {'serde', 'mycelix-institutional-core'}
          assert deps['mycelix-institutional-core'].get('path') == '../mycelix-institutional-core'
          assert set(manifest.get('dev-dependencies', {})) == {'serde_json'}
          assert not manifest.get('build-dependencies')
          assert manifest.get('lib', {}).get('path') == 'src/lib_hardened.rs'

          facade = (root / 'src' / 'lib_hardened.rs').read_text()
          assert '#[path = "lib.rs"]\nmod legacy;' in facade
          assert 'pub struct QualifiedAdministrativeCaseLineage' in facade
          assert 'pub fn qualify_case_lineage' in facade
          assert 'legacy::qualify_administrative_decision(' in facade
          assert 'legacy::issue_qualified_decision(' in facade
          assert 'pub use legacy::qualify_administrative_decision' not in facade
          assert 'pub use legacy::issue_qualified_decision' not in facade
          assert 'pub use legacy::qualify_pre_decision_transition' not in facade
          PY

      - name: Authority and runtime separation audit
        run: |
          legacy='crates/mycelix-administrative-procedure/src/lib.rs'
          facade='crates/mycelix-administrative-procedure/src/lib_hardened.rs'
          grep -q 'mycelix_institutional_core' "$legacy"
          grep -q 'evaluate_authority' "$legacy"
          grep -q 'Decision' "$legacy"
          grep -q 'ReadyForDecision' "$legacy"
          grep -q 'issue_qualified_decision' "$legacy"
          grep -q 'grants_external_effect_authority' "$legacy"
          grep -q 'QualifiedAdministrativeCaseLineage' "$facade"
          grep -q 'LineageRootMustBeFiled' "$facade"

          code_lines="$(cat "$legacy" "$facade" | grep -nEv '^[[:space:]]*//' || true)"
          forbidden='(hdk|hdi|holochain)::|std::(net|fs|process)::|SystemTime::|Instant::now|[[:space:]{(,](phi|reputation|stake|model_score)[[:space:]]*:|authorized[[:space:]]*:[[:space:]]*bool|official[[:space:]]*:[[:space:]]*bool'
          if printf '%s\n' "$code_lines" | grep -E "$forbidden"; then
            echo 'ADMIN-001 gained forbidden runtime/advisory/boolean authority surface' >&2
            exit 1
          fi

      - name: Format owned public surface
        run: |
          rustfmt --edition 2024 --check --config skip_children=true \
            crates/mycelix-administrative-procedure/src/lib_hardened.rs

      - name: Isolated executable qualification
        run: |
          # Cargo creates a lockfile for this standalone crate. Run compile/test/
          # clippy against an exact temporary copy so qualification cannot mutate
          # the repository checkout and the postflight remains meaningful.
          qroot="$(mktemp -d)"
          mkdir -p "$qroot/crates"
          cp -a crates/mycelix-institutional-core "$qroot/crates/"
          cp -a crates/mycelix-administrative-procedure "$qroot/crates/"
          manifest="$qroot/crates/mycelix-administrative-procedure/Cargo.toml"
          cargo test --manifest-path "$manifest" --all-targets
          cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings

      - name: Immutable checkout postflight
        run: test -z "$(git status --short)"
