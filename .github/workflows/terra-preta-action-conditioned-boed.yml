name: Terra Preta action-conditioned BOED reference

on:
  pull_request:
    branches: [main, research/terra-sequential-boed-v0.1]
    paths:
      - 'research/terra-preta/tools/hydraulic-mechanism-discrimination-reference/**'
      - '.github/workflows/terra-preta-action-conditioned-boed.yml'
  push:
    branches: ['research/terra-action-conditioned-boed-v0.1']
    paths:
      - 'research/terra-preta/tools/hydraulic-mechanism-discrimination-reference/**'
      - '.github/workflows/terra-preta-action-conditioned-boed.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terra-action-conditioned-boed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  action-conditioned-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - name: Verify formatting
        run: cargo fmt --manifest-path research/terra-preta/tools/hydraulic-mechanism-discrimination-reference/Cargo.toml -- --check
      - name: Unit and falsification tests
        run: cargo test --manifest-path research/terra-preta/tools/hydraulic-mechanism-discrimination-reference/Cargo.toml --bin terra-action-conditioned-boed
      - name: Strict Clippy
        run: cargo clippy --manifest-path research/terra-preta/tools/hydraulic-mechanism-discrimination-reference/Cargo.toml --all-targets -- -D warnings
      - name: Run action-conditioned policy comparison
        run: |
          cargo run --quiet --release --manifest-path research/terra-preta/tools/hydraulic-mechanism-discrimination-reference/Cargo.toml --bin terra-action-conditioned-boed -- \
            research/terra-preta/tools/hydraulic-mechanism-discrimination-reference/fixtures/action-conditioned-protocols.json \
            "$RUNNER_TEMP/terra-action-conditioned.json"
      - name: Validate hard safety and policy receipts
        run: |
          jq -e '
            .fixture_status == "synthetic_only_not_empirical_evidence" and
            (.input_sha256 | length == 64) and
            (.feasible_protocols | length == 5) and
            ([.excluded_protocols[] | select(.protocol_id == "unsafe_high_pressure")] | length == 1) and
            ([.excluded_protocols[] | select(.protocol_id == "unsafe_high_pressure") | .reasons[] | select(. == "pressure_amplitude_exceeds_limit")] | length == 1) and
            ([.excluded_protocols[] | select(.protocol_id == "unsafe_high_pressure") | .reasons[] | select(. == "injected_volume_exceeds_limit")] | length == 1) and
            (.hard_constraint_violations_in_selected_policy == 0) and
            (.acquisition_budget == 2) and
            (.adaptive_terminal_entropy_reduction_vs_fixed_nats >= -1e-9) and
            (.sequential_adaptive_policy.expected_acquisition_cost <= .acquisition_budget) and
            (([.sequential_adaptive_policy.branches[].predictive_probability_mass] | add) > 0.999999999) and
            ((.sequential_adaptive_policy.stop_probability_mass + .sequential_adaptive_policy.discrepancy_abstention_probability_mass) <= 1.000000001) and
            (.best_fixed_policy.second_protocol_shares | length == 1)
          ' "$RUNNER_TEMP/terra-action-conditioned.json"
          jq -r '"feasible=\(.feasible_protocols|length) excluded=\(.excluded_protocols|length) fixed_pair=\(.best_fixed_policy.first_protocol_id)+\(.best_fixed_policy.second_protocol_shares[0][0]) adaptive_first=\(.sequential_adaptive_policy.first_protocol_id) adaptive_second=\(.sequential_adaptive_policy.second_protocol_shares) adaptive_entropy_gain_vs_fixed=\(.adaptive_terminal_entropy_reduction_vs_fixed_nats) expected_cost=\(.sequential_adaptive_policy.expected_acquisition_cost) stop_mass=\(.sequential_adaptive_policy.stop_probability_mass) abstention_mass=\(.sequential_adaptive_policy.discrepancy_abstention_probability_mass) hard_violations=\(.hard_constraint_violations_in_selected_policy)"' "$RUNNER_TEMP/terra-action-conditioned.json"
          sha256sum "$RUNNER_TEMP/terra-action-conditioned.json"
      - name: Reject output overwrite
        run: |
          if cargo run --quiet --manifest-path research/terra-preta/tools/hydraulic-mechanism-discrimination-reference/Cargo.toml --bin terra-action-conditioned-boed -- \
            research/terra-preta/tools/hydraulic-mechanism-discrimination-reference/fixtures/action-conditioned-protocols.json \
            "$RUNNER_TEMP/terra-action-conditioned.json"; then
            echo "expected no-overwrite failure"
            exit 1
          fi
