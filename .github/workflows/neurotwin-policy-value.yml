name: NeuroTwin Policy Value Reference

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tools/neurotwin-policy-value/**"
      - ".github/workflows/neurotwin-policy-value.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact qualification subject
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact head
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path tools/neurotwin-policy-value/Cargo.toml -- --check

      - name: Run unit tests
        run: cargo test --manifest-path tools/neurotwin-policy-value/Cargo.toml --locked

      - name: Run strict Clippy
        run: cargo clippy --manifest-path tools/neurotwin-policy-value/Cargo.toml --all-targets --locked -- -D warnings

      - name: Exercise aggregate-only CLI
        run: |
          cargo run --manifest-path tools/neurotwin-policy-value/Cargo.toml --locked -- \
            tools/neurotwin-policy-value/fixtures/synthetic-randomized-trial.tsv \
            "$RUNNER_TEMP/neurotwin-policy-value.json"
          test -s "$RUNNER_TEMP/neurotwin-policy-value.json"
          if grep -Fq "synthetic-observation-" "$RUNNER_TEMP/neurotwin-policy-value.json"; then
            echo "row-level key leaked into aggregate output"
            exit 1
          fi
          jq -e '.schema_version == "neurotwin-policy-value-report-v0.1" and .n >= 20 and (.candidate_minus_comparator | has("dr_value_difference"))' "$RUNNER_TEMP/neurotwin-policy-value.json" >/dev/null

      - name: Verify small-cohort suppression
        run: |
          head -n 4 tools/neurotwin-policy-value/fixtures/synthetic-randomized-trial.tsv > "$RUNNER_TEMP/small-cohort.tsv"
          if cargo run --manifest-path tools/neurotwin-policy-value/Cargo.toml --locked -- \
            "$RUNNER_TEMP/small-cohort.tsv" "$RUNNER_TEMP/suppressed.json"; then
            echo "small-cohort run unexpectedly succeeded"
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/suppressed.json"

      - name: Exercise aggregate-only multi-arm CLI
        run: |
          cargo run --manifest-path tools/neurotwin-policy-value/Cargo.toml --locked --bin neurotwin-multiarm-policy-value -- \
            tools/neurotwin-policy-value/fixtures/synthetic-three-arm.tsv \
            "$RUNNER_TEMP/neurotwin-multiarm-policy-value.json"
          jq -e '.schema_version == "neurotwin-multiarm-policy-value-report-v0.1" and .n == 24 and (.arms | length) == 3 and (.arm_support | length) == 3' "$RUNNER_TEMP/neurotwin-multiarm-policy-value.json" >/dev/null
          if grep -Fq "synthetic-row-" "$RUNNER_TEMP/neurotwin-multiarm-policy-value.json"; then
            echo "row-level key leaked into multi-arm aggregate output"
            exit 1
          fi
