name: SYM-CIVIC-007 Verification Result Provenance
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'mycelix-workspace/docs/civic-resilience/sym_civic_007_verification_result_provenance.json'
      - 'mycelix-workspace/docs/civic-resilience/SYM_CIVIC_007_VERIFICATION_RESULT_PROVENANCE_V1.md'
      - 'scripts/qualification/sym_civic_007_verification_result_provenance_v1.py'
      - '.github/workflows/sym-civic-007-verification-result-provenance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    name: Verification-result provenance boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact ancestry and clean subject
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='00156dc7b7f4d2709e6563db0e7b84d31c4a4f8a'
          test "$(git merge-base HEAD "$EXPECTED_PARENT")" = "$EXPECTED_PARENT"
          printf 'HEAD=%s\nPARENT=%s\nMERGE_BASE=%s\n' "$(git rev-parse HEAD)" "$EXPECTED_PARENT" "$(git merge-base HEAD "$EXPECTED_PARENT")"
          test -z "$(git status --short)"
      - name: Exact verification tranche
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='00156dc7b7f4d2709e6563db0e7b84d31c4a4f8a'
          git diff --check "$EXPECTED_PARENT" HEAD
          expected=' .github/workflows/sym-civic-007-verification-result-provenance.yml
          mycelix-workspace/docs/civic-resilience/SYM_CIVIC_007_VERIFICATION_RESULT_PROVENANCE_V1.md
          mycelix-workspace/docs/civic-resilience/sym_civic_007_verification_result_provenance.json
          scripts/qualification/sym_civic_007_verification_result_provenance_v1.py'
          expected="${expected# }"
          actual="$(git diff --name-only "$EXPECTED_PARENT" HEAD | sort)"
          test "$actual" = "$expected"
      - name: Compile qualifier
        run: python3 -c 'from pathlib import Path; compile(Path("scripts/qualification/sym_civic_007_verification_result_provenance_v1.py").read_text(encoding="utf-8"), "sym_civic_007_verification_result_provenance_v1.py", "exec")'
      - name: Execute qualifier
        run: python3 scripts/qualification/sym_civic_007_verification_result_provenance_v1.py
      - name: Static no-runtime audit
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='00156dc7b7f4d2709e6563db0e7b84d31c4a4f8a'
          changed="$(git diff --name-only "$EXPECTED_PARENT" HEAD)"
          if printf '%s' "$changed" | grep -E '[.]rs$|[.]toml$|[.]lock$'; then
            echo 'SYM-CIVIC-007 is research provenance only' >&2
            exit 1
          fi
      - name: Immutable checkout postflight
        run: test -z "$(git status --short)"
