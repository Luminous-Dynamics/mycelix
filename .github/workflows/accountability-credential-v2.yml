name: Accountability Credential V2

on:
  pull_request:
    paths:
      - "crates/mycelix-accountability-core/**"
      - "crates/mycelix-accountability-verifier/**"
      - "crates/mycelix-accountability-trust/**"
      - "crates/mycelix-accountability-bundle/**"
      - "crates/mycelix-accountability-credential/**"
      - "crates/mycelix-accountability-credential-v2/**"
      - ".github/workflows/accountability-credential-v2.yml"
  push:
    branches:
      - "sif/profile-bound-release-credential-v0-2"
    paths:
      - "crates/mycelix-accountability-core/**"
      - "crates/mycelix-accountability-verifier/**"
      - "crates/mycelix-accountability-trust/**"
      - "crates/mycelix-accountability-bundle/**"
      - "crates/mycelix-accountability-credential/**"
      - "crates/mycelix-accountability-credential-v2/**"
      - ".github/workflows/accountability-credential-v2.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile-bound-release-credential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check --manifest-path crates/mycelix-accountability-credential-v2/Cargo.toml
      - name: Test
        run: cargo test --manifest-path crates/mycelix-accountability-credential-v2/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-accountability-credential-v2/Cargo.toml --all-targets -- -D warnings
