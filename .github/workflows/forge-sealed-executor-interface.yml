name: Forge Sealed Executor Interface

on:
  pull_request:
    paths:
      - 'crates/mycelix-forge-sealed-executor-interface/**'
      - 'crates/mycelix-forge-protected-ref-executor-confinement/**'
      - 'adapters/forge-git-ref-transaction/**'
      - '.github/workflows/forge-sealed-executor-interface.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: rustfmt
        working-directory: crates/mycelix-forge-sealed-executor-interface
        run: cargo fmt -- --check
      - name: clippy
        working-directory: crates/mycelix-forge-sealed-executor-interface
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: static sealed-interface firewall
        working-directory: crates/mycelix-forge-sealed-executor-interface
        run: |
          ! grep -Eq 'impl.*Deserialize.*SealedExecutor(InterfaceBinding|Invocation)V1' src/lib.rs
          ! grep -Eq 'std::process::Command|process::Command|Command::new' src/lib.rs
          grep -Fq 'no-shell' src/lib.rs
          grep -Fq 'no-caller-arguments' src/lib.rs
          grep -Fq 'no-caller-stdin' src/lib.rs
          grep -Fq 'no-caller-ref-or-object' src/lib.rs
          grep -Fq 'no-caller-environment-overrides' src/lib.rs
          grep -Fq 'SealedExecutorInvocationV1' src/lib.rs
      - name: tests
        working-directory: crates/mycelix-forge-sealed-executor-interface
        run: cargo test --all-features
