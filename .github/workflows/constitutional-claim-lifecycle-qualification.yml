name: Constitutional Claim Lifecycle Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - 'mycelix-governance/Cargo.toml'
      - 'mycelix-governance/crates/constitutional-claim-lifecycle/**'
      - 'mycelix-governance/crates/constitutional-closure-coverage/src/lib.rs'
      - 'mycelix-governance/crates/constitutional-temporal-provenance/src/lib.rs'
      - 'mycelix-governance/crates/constitutional-consumption/src/lib.rs'
      - 'mycelix-governance/specs/ConstitutionalClaimLifecycle*'
      - 'mycelix-governance/docs/CONSTITUTIONAL_CLAIM_LIFECYCLE_V0_1.md'
      - 'mycelix-governance/tools/formal/pins.json'
      - 'mycelix-governance/tools/formal/qualify_claim_lifecycle.py'
      - '.github/workflows/constitutional-claim-lifecycle-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: constitutional-claim-lifecycle-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NIXPKGS_REV: a50bf0c1b07873c1a53892292017041a8f0a1288
  TLA_URL: https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
  TLA_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  EXPECTED_SEMANTIC_HEAD: b19667a0399d46e7a21254e931c3149cfbd994fc
  EXPECTED_PARENT_CLOSURE_HEAD: f5cded2e9c54ea638f56003e4636f290b7d3cb29
  EXPECTED_PARENT_TEMPORAL_HEAD: 14b4b98eb167589ec29167d5615c25c216b728eb

jobs:
  qualify:
    name: Rust + TLA+ exact-head constitutional claim lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout exact raw head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_HEAD }}

      - name: Bind evidence to exact lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SEMANTIC_HEAD"
          test "$(git rev-parse HEAD^^)" = "$EXPECTED_PARENT_CLOSURE_HEAD"
          test "$(git rev-parse HEAD^^^)" = "$EXPECTED_PARENT_TEMPORAL_HEAD"
          rm -rf claim-lifecycle-evidence .claim-lifecycle-tools
          mkdir -p claim-lifecycle-evidence .claim-lifecycle-tools
          printf '%s\n' "$EXPECTED_HEAD" > claim-lifecycle-evidence/expected-head.txt
          printf '%s\n' "$EXPECTED_SEMANTIC_HEAD" > claim-lifecycle-evidence/expected-semantic-head.txt
          printf '%s\n' "$EXPECTED_PARENT_CLOSURE_HEAD" > claim-lifecycle-evidence/expected-parent-closure-head.txt
          printf '%s\n' "$EXPECTED_PARENT_TEMPORAL_HEAD" > claim-lifecycle-evidence/expected-parent-temporal-head.txt

      - name: Install Nix
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Acquire pinned tools and qualify lifecycle
        shell: bash
        run: |
          set -euo pipefail
          nix shell \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#jdk17_headless" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#python312" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#curl" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#coreutils" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#cargo" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#rustc" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#bash" \
            --command bash -euo pipefail -c '
              curl --fail --location --retry 3 --retry-all-errors \
                --output .claim-lifecycle-tools/tla2tools.jar "$TLA_URL"
              printf "%s  %s\n" "$TLA_SHA256" .claim-lifecycle-tools/tla2tools.jar | sha256sum --check --strict

              python3 mycelix-governance/tools/formal/qualify_claim_lifecycle.py \
                --tla-jar "$PWD/.claim-lifecycle-tools/tla2tools.jar" \
                --expected-head "$EXPECTED_HEAD" \
                --expected-semantic-head "$EXPECTED_SEMANTIC_HEAD" \
                --expected-parent-closure-head "$EXPECTED_PARENT_CLOSURE_HEAD" \
                --expected-parent-temporal-head "$EXPECTED_PARENT_TEMPORAL_HEAD" \
                --out "$PWD/claim-lifecycle-evidence"
            '

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: constitutional-claim-lifecycle-${{ env.EXPECTED_HEAD }}
          path: claim-lifecycle-evidence
          if-no-files-found: error
          retention-days: 30
