name: Marketplace Format Capture

on:
  push:
    branches:
      - marketplace-inventory-algebra

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt
          targets: wasm32-unknown-unknown
      - name: Format and capture
        working-directory: mycelix-workspace/mycelix-marketplace/backend
        run: |
          cargo fmt --all
          tar -czf /tmp/marketplace-format.tar.gz zomes/transactions/integrity/src/reservation_certificate.rs
      - uses: actions/upload-artifact@v4
        with:
          name: marketplace-format-capture
          path: /tmp/marketplace-format.tar.gz
