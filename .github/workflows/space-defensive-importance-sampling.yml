name: Space defensive importance-sampling reference

on:
  push:
    branches:
      - "research/space-defensive-importance-sampling-v0-1"
    paths:
      - "mycelix-workspace/mycelix-space/tools/space-defensive-importance-sampling/**"
      - ".github/workflows/space-defensive-importance-sampling.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-defensive-importance-sampling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Format and commit deterministic Rust formatting on branch push
        if: github.event_name == 'push'
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          manifest="mycelix-workspace/mycelix-space/tools/space-defensive-importance-sampling/Cargo.toml"
          source_dir="mycelix-workspace/mycelix-space/tools/space-defensive-importance-sampling/src"
          cargo fmt --manifest-path "$manifest"
          if ! git diff --quiet -- "$source_dir"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$source_dir"
            git commit -m "style(space): format defensive importance-sampling reference"
            pushed=false
            for attempt in 1 2 3 4 5; do
              git fetch origin "$BRANCH_NAME"
              git rebase "origin/$BRANCH_NAME"
              if git push origin "HEAD:$BRANCH_NAME"; then
                pushed=true
                break
              fi
            done
            if [[ "$pushed" != true ]]; then
              echo "Could not publish formatting commit after five fetch/rebase/push attempts" >&2
              exit 1
            fi
          fi

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path mycelix-workspace/mycelix-space/tools/space-defensive-importance-sampling/Cargo.toml -- --check

      - name: Run locked estimator tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path mycelix-workspace/mycelix-space/tools/space-defensive-importance-sampling/Cargo.toml

      - name: Run exact Gaussian disk benchmark
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --manifest-path mycelix-workspace/mycelix-space/tools/space-defensive-importance-sampling/Cargo.toml --bin analytic_disk_benchmark
