name: AMSAP-005 Welfare Evidence Provenance

on:
  pull_request:
    paths:
      - 'crates/mycelix-welfare-evidence/**'
      - '.github/workflows/amsap-005-welfare-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 2

      - name: Prove exact AMSAP-004 parent and review surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "d1e243b0204dd5fb3bde3e76edc8e05cdbfc1b53"
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD | sort)
          expected=(
            ".github/workflows/amsap-005-welfare-evidence.yml"
            "crates/mycelix-welfare-evidence/Cargo.lock"
            "crates/mycelix-welfare-evidence/Cargo.toml"
            "crates/mycelix-welfare-evidence/README.md"
            "crates/mycelix-welfare-evidence/src/lib.rs"
          )
          printf '%s\n' "${changed[@]}" > /tmp/changed
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup target add --toolchain 1.98.1 wasm32-unknown-unknown

      - name: Audit evidence and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          cargo = Path('crates/mycelix-welfare-evidence/Cargo.toml').read_text()
          deps = cargo.split('[dependencies]\n', 1)[1].strip().splitlines()
          expected = [
              'mycelix-artificial-status = { path = "../mycelix-artificial-status" }',
              'mycelix-ai-lineage = { path = "../mycelix-ai-lineage" }',
          ]
          if deps != expected:
              raise SystemExit(f'unexpected dependency surface: {deps!r}')
          src = Path('crates/mycelix-welfare-evidence/src/lib.rs').read_text()
          for direction in ('Supports', 'Challenges', 'Null', 'Mixed'):
              if direction not in src:
                  raise SystemExit(f'missing evidence direction {direction}')
          for guard in ('establishes_scientific_truth', 'grants_welfare_protection', 'grants_governance_authority', 'grants_external_effect_authority'):
              if guard not in src:
                  raise SystemExit(f'missing non-authority guard {guard}')
          PY
          ! grep -R -E 'hdk|hdi|holochain|serde|reqwest|tokio|SystemTime|Instant|reputation|stake|execute_effect|dispatch_effect' crates/mycelix-welfare-evidence/src crates/mycelix-welfare-evidence/Cargo.toml

      - name: Rust qualification
        shell: bash
        run: |
          set -euo pipefail
          lock_before="$(sha256sum crates/mycelix-welfare-evidence/Cargo.lock)"
          cargo +1.98.1 fmt --manifest-path crates/mycelix-welfare-evidence/Cargo.toml -- --check
          cargo +1.98.1 test --locked --manifest-path crates/mycelix-welfare-evidence/Cargo.toml --all-targets
          cargo +1.98.1 clippy --locked --manifest-path crates/mycelix-welfare-evidence/Cargo.toml --all-targets -- -D warnings
          cargo +1.98.1 check --locked --manifest-path crates/mycelix-welfare-evidence/Cargo.toml --target wasm32-unknown-unknown
          test "$lock_before" = "$(sha256sum crates/mycelix-welfare-evidence/Cargo.lock)"

      - name: Immutable checkout postflight
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
