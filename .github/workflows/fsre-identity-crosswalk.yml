name: FSRE temporal identity crosswalk reference
on:
  pull_request:
    paths:
      - "tools/fsre-identity-crosswalk/**"
      - ".github/workflows/fsre-identity-crosswalk.yml"
  push:
    branches:
      - main
    paths:
      - "tools/fsre-identity-crosswalk/**"
      - ".github/workflows/fsre-identity-crosswalk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-crosswalk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path tools/fsre-identity-crosswalk/Cargo.toml --all -- --check
      - name: Run transition cardinality and provenance tests
        run: cargo test --locked --offline --manifest-path tools/fsre-identity-crosswalk/Cargo.toml
      - name: Verify CLI against synthetic transition report
        shell: bash
        run: |
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          cargo run --locked --offline --manifest-path tools/fsre-identity-crosswalk/Cargo.toml -- tools/fsre-identity-crosswalk/fixtures/synthetic-transitions.psv > "$output"
          diff -u tools/fsre-identity-crosswalk/fixtures/synthetic-transitions.expected.txt "$output"
      - name: Run Clippy
        run: cargo clippy --locked --offline --manifest-path tools/fsre-identity-crosswalk/Cargo.toml --all-targets -- -D warnings
