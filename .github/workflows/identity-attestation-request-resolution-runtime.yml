name: Identity Attestation Request Resolution Runtime

on:
  pull_request:
    paths:
      - 'mycelix-workspace/mycelix-identity/Cargo.toml'
      - 'mycelix-workspace/mycelix-identity/crates/attestation-request-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/attestation-request-root-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/attestation-request-resolution-runtime/**'
      - 'mycelix-workspace/mycelix-identity/zomes/trust_credential/integrity/**'
      - '.github/workflows/identity-attestation-request-resolution-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-workspace/mycelix-identity/Cargo.toml'
      - 'mycelix-workspace/mycelix-identity/crates/attestation-request-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/attestation-request-root-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/attestation-request-resolution-runtime/**'
      - 'mycelix-workspace/mycelix-identity/zomes/trust_credential/integrity/**'
      - '.github/workflows/identity-attestation-request-resolution-runtime.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Assert runtime semantic boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          root = Path('mycelix-workspace/mycelix-identity')
          member = 'crates/attestation-request-resolution-runtime'
          workspace = tomllib.loads((root / 'Cargo.toml').read_text())
          members = workspace.get('workspace', {}).get('members', [])
          for required_member in [
              'crates/attestation-request-policy',
              'crates/attestation-request-root-policy',
              member,
          ]:
              if required_member not in members:
                  raise SystemExit(
                      f'ERROR: {required_member} is not an explicit identity workspace member'
                  )

          manifest = tomllib.loads((root / member / 'Cargo.toml').read_text())
          deps = manifest.get('dependencies', {})
          if set(deps) != {
              'mycelix-attestation-request-policy',
              'mycelix-attestation-request-root-policy',
              'trust_credential_integrity',
          }:
              raise SystemExit(
                  f'ERROR: runtime dependencies drifted: {sorted(deps)}'
              )
          if deps['mycelix-attestation-request-policy'].get('path') != '../attestation-request-policy':
              raise SystemExit('ERROR: runtime is not bound to the canonical lifecycle policy')
          if deps['mycelix-attestation-request-root-policy'].get('path') != '../attestation-request-root-policy':
              raise SystemExit('ERROR: runtime is not bound to the canonical root policy')
          if deps['trust_credential_integrity'].get('path') != '../../zomes/trust_credential/integrity':
              raise SystemExit('ERROR: runtime is not bound to canonical trust credential types')

          text = (root / member / 'src/lib.rs').read_text()
          required = [
              '#![forbid(unsafe_code)]',
              'AttestationRequestRootAssertionErrorV1',
              'AttestationRequestRootAssertionV1',
              'validate_attestation_request_root_assertion_v1',
              'RootAssertionRejected',
              'AttestationRequestLineageObservationV1',
              'ObservedAttestationRequestStateV1',
              'ObservedConflict { terminal_updates: usize }',
              'HistoricalDeleteObserved',
              'NonRootUpdateObserved',
              'DuplicateRequestIdObserved',
              'validate_attestation_request_root_v1',
              'validate_unique_request_ids_v1',
              'resolve_attestation_request_lineage_v1',
              'validate_attestation_request_transition_v1(transition)',
              'classify_attestation_request_actor_v1(',
              'historical_identifier_and_validity_bounds_are_reaudited',
              'ObservedExpiredByTime',
              'concurrent_terminal_siblings_are_conflict_even_when_status_matches',
              'different_terminal_siblings_are_conflict_not_latest_wins',
              'delete_is_unresolved_not_cancelled',
              'nested_or_nonroot_update_is_unresolved',
              'duplicate_request_ids_fail_subject_aggregation',
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'ERROR: request resolution runtime missing {needle!r}')

          # Root structure belongs exclusively to the canonical root-policy crate.
          # This adapter owns only root-action author and subject-index bindings.
          for needle in [
              'fn valid_did_shape(',
              'root.id.is_empty()',
              'root.components.is_empty()',
              'root.purpose.is_empty()',
              '!score.is_finite()',
          ]:
              if needle in text:
                  raise SystemExit(
                      f'ERROR: private request-root theorem reappeared in resolver: {needle!r}'
                  )

          root_fn_start = text.index('pub fn validate_attestation_request_root_v1(')
          root_fn_end = text.index('/// Fail closed when two distinct canonical roots', root_fn_start)
          root_fn = text[root_fn_start:root_fn_end]
          for needle in [
              'root.requester_did != root_author_did',
              'root.subject_did != expected_subject_did',
              'AttestationRequestRootAssertionV1',
              'validate_attestation_request_root_assertion_v1(assertion)',
          ]:
              if needle not in root_fn:
                  raise SystemExit(f'ERROR: resolver root adapter missing {needle!r}')

          # This layer consumes already-gathered observations. Network traversal,
          # chronology selection, and coordinator authority must not leak into it.
          forbidden = [
              'use hdk',
              'use hdi',
              'hdk::',
              'hdi::',
              'get_details(',
              'get_links(',
              'LinkQuery',
              'GetOptions',
              'ChainQueryFilter',
              'query(',
              'sys_time(',
              'call(',
              '.sort_by(',
              '.sort_by_key(',
              '.max_by(',
              '.max_by_key(',
          ]
          for needle in forbidden:
              if needle in text:
                  raise SystemExit(f'ERROR: runtime leaked network/winner semantics: {needle!r}')

          # Historical deletes are not aliases for typed cancellation.
          delete_pos = text.index('if input.observed_delete_count != 0')
          delete_window = text[delete_pos:delete_pos + 450]
          if 'HistoricalDeleteObserved' not in delete_window:
              raise SystemExit('ERROR: observed deletes no longer fail closed')
          if 'ObservedCancelled' in delete_window:
              raise SystemExit('ERROR: historical delete was upgraded into cancellation')
          PY

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-workspace/mycelix-identity

      - name: Check formatting
        run: |
          cargo fmt \
            --manifest-path mycelix-workspace/mycelix-identity/crates/attestation-request-resolution-runtime/Cargo.toml \
            -- --check

      - name: Test canonical lifecycle policy
        run: |
          cargo test \
            --manifest-path mycelix-workspace/mycelix-identity/crates/attestation-request-policy/Cargo.toml

      - name: Test canonical root policy
        run: |
          cargo test \
            --manifest-path mycelix-workspace/mycelix-identity/crates/attestation-request-root-policy/Cargo.toml

      - name: Test request resolution runtime
        run: |
          cargo test \
            --manifest-path mycelix-workspace/mycelix-identity/crates/attestation-request-resolution-runtime/Cargo.toml

      - name: Check request resolution runtime for wasm32
        run: |
          cargo check \
            --manifest-path mycelix-workspace/mycelix-identity/crates/attestation-request-resolution-runtime/Cargo.toml \
            --target wasm32-unknown-unknown
