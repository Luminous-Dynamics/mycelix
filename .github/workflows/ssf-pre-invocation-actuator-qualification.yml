name: SSF Pre-Invocation Actuator Qualification

on:
  pull_request:
    paths:
      - 'mycelix-workspace/crates/mycelix-ssf-effect-capability-claim-rebind/**'
      - 'mycelix-workspace/crates/mycelix-ssf-current-authority-revalidation/**'
      - 'mycelix-workspace/crates/mycelix-ssf-execution-surface-admission/**'
      - 'mycelix-workspace/crates/mycelix-ssf-source-owned-operation-material/**'
      - 'mycelix-workspace/crates/mycelix-ssf-pre-invocation-actuator-qualification/**'
      - '.github/workflows/ssf-pre-invocation-actuator-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-workspace/crates/mycelix-ssf-pre-invocation-actuator-qualification/**'
      - '.github/workflows/ssf-pre-invocation-actuator-qualification.yml'

permissions:
  contents: read

jobs:
  pre-invocation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Format
        run: cargo fmt --manifest-path mycelix-workspace/crates/mycelix-ssf-pre-invocation-actuator-qualification/Cargo.toml -- --check
      - name: Native check
        run: cargo check --manifest-path mycelix-workspace/crates/mycelix-ssf-pre-invocation-actuator-qualification/Cargo.toml --all-targets
      - name: no_std WASM check
        run: cargo check --manifest-path mycelix-workspace/crates/mycelix-ssf-pre-invocation-actuator-qualification/Cargo.toml --lib --target wasm32-unknown-unknown
      - name: Tests
        run: cargo test --manifest-path mycelix-workspace/crates/mycelix-ssf-pre-invocation-actuator-qualification/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --manifest-path mycelix-workspace/crates/mycelix-ssf-pre-invocation-actuator-qualification/Cargo.toml --all-targets -- -D warnings
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --manifest-path mycelix-workspace/crates/mycelix-ssf-pre-invocation-actuator-qualification/Cargo.toml --no-deps
