name: Identity Historical Activation Time Policy Authority-Anchored Transition V2

on:
  pull_request:
    paths:
      - 'mycelix-workspace/mycelix-identity/Cargo.toml'
      - 'mycelix-workspace/mycelix-identity/crates/historical-activation-time-policy-transition-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/historical-activation-time-policy-transition-signer-authority-subject-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/historical-activation-time-policy-authority-anchored-transition-policy/**'
      - '.github/workflows/identity-historical-activation-time-policy-authority-anchored-transition-v2.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-workspace/mycelix-identity/Cargo.toml'
      - 'mycelix-workspace/mycelix-identity/crates/historical-activation-time-policy-authority-anchored-transition-policy/**'
      - '.github/workflows/identity-historical-activation-time-policy-authority-anchored-transition-v2.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify-authority-anchored-transition-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Assert signed causal-authority anchor boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          root = Path('mycelix-workspace/mycelix-identity')
          member = 'crates/historical-activation-time-policy-authority-anchored-transition-policy'
          workspace = tomllib.loads((root / 'Cargo.toml').read_text())['workspace']['members']
          if member not in workspace:
              raise SystemExit(f'ERROR: {member} is not an explicit Identity workspace member')

          manifest = tomllib.loads((root / member / 'Cargo.toml').read_text())
          deps = manifest.get('dependencies', {})
          expected = {
              'mycelix-crypto',
              'mycelix-historical-activation-time-policy-transition-policy',
              'mycelix-historical-activation-time-policy-transition-signer-authority-subject-policy',
              'sha2',
          }
          if set(deps) != expected:
              raise SystemExit(f'ERROR: authority-anchor runtime dependency drift: {sorted(deps)}')
          if deps['mycelix-crypto'].get('workspace') is not True or deps['sha2'].get('workspace') is not True:
              raise SystemExit('ERROR: authority-anchor theorem must use workspace crypto/sha2')

          text = (root / member / 'src/lib.rs').read_text()
          required = [
              '#![forbid(unsafe_code)]',
              'PreparedAuthorityAnchoredHistoricalActivationTimePolicyTransitionV2',
              'HistoricalActivationTimePolicyAuthorityStateAnchorV2',
              'GENERIC_AUTHORITY_STATE_TRANSITION_IDENTITY_PROFILE_V1',
              'mycelix-authority-state-transition-v1-blake3-framed',
              'prepare_authority_anchored_historical_activation_time_policy_transition_v2',
              'validate_signer_subject_binding_v2',
              'transition.transition_signing_digest_sha256()',
              'signer_subject.subject_digest_sha256()',
              'anchor.authority_state_generation',
              'authority_state_transition_digest',
              '0xa7, 0x5e, 0x9b, 0xae',
              'changing_causal_authority_anchor_changes_signed_subject',
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'ERROR: authority-anchor invariant missing: {needle!r}')

          production = text[:text.index('#[cfg(test)]')]
          lower = production.lower()
          for forbidden in [
              'use hdk', 'hdk::', '#[hdk_extern]', 'sys_time(', 'std::time',
              'project_authority_state_as_of', 'project_current_authority_state',
              'qualifiedcurrentoperationalauthority', 'verifiedauthorityfreshness',
              'verify_strict', '.verify(', 'max_by_key', 'positive_evidence',
          ]:
              if forbidden in lower:
                  raise SystemExit(f'ERROR: runtime/currentness/crypto authority leaked into signed anchor theorem: {forbidden!r}')

          result_start = text.index('pub struct PreparedAuthorityAnchoredHistoricalActivationTimePolicyTransitionV2')
          result_end = text.index('impl PreparedAuthorityAnchoredHistoricalActivationTimePolicyTransitionV2', result_start)
          result_body = text[result_start:result_end]
          for field in [
              'pub signer_authority_subject_sha256:',
              'pub authority_state_generation:',
              'pub authority_state_transition_digest:',
              'pub anchored_transition_signing_digest_sha256:',
          ]:
              if field in result_body:
                  raise SystemExit(f'ERROR: anchored transition result is caller-forgeable: {field}')
          PY

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-workspace/mycelix-identity

      - name: Check formatting
        run: |
          cargo fmt --manifest-path mycelix-workspace/mycelix-identity/crates/historical-activation-time-policy-authority-anchored-transition-policy/Cargo.toml -- --check

      - name: Test base transition theorem
        run: |
          cargo test --manifest-path mycelix-workspace/mycelix-identity/crates/historical-activation-time-policy-transition-policy/Cargo.toml

      - name: Test signer authority subject theorem
        run: |
          cargo test --manifest-path mycelix-workspace/mycelix-identity/crates/historical-activation-time-policy-transition-signer-authority-subject-policy/Cargo.toml

      - name: Test authority-anchored transition theorem
        run: |
          cargo test --manifest-path mycelix-workspace/mycelix-identity/crates/historical-activation-time-policy-authority-anchored-transition-policy/Cargo.toml

      - name: Check authority-anchored transition theorem for wasm32
        run: |
          cargo check --manifest-path mycelix-workspace/mycelix-identity/crates/historical-activation-time-policy-authority-anchored-transition-policy/Cargo.toml --target wasm32-unknown-unknown
