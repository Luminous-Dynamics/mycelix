name: Integration HTTP Issuance Admission Qualification

on:
  pull_request:
    branches:
      - feat/integration-http-transport-journal-v1
      - main
  push:
    branches:
      - feat/integration-http-issuance-admission-v2
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: '1.96.0'
  QUALIFICATION_SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  MANIFEST: crates/mycelix-integration-http-issuance-admission/Cargo.toml
  SOURCE_DIR: crates/mycelix-integration-http-issuance-admission/src
  SOURCE: crates/mycelix-integration-http-issuance-admission/src/lib.rs
  WORKFLOW: .github/workflows/integration-http-issuance-admission-qualification.yml

concurrency:
  group: integration-http-issuance-admission-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Route and credential bound atomic HTTP issuance
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout exact qualification subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.QUALIFICATION_SUBJECT_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact source head
        shell: bash
        run: |
          set -euo pipefail
          [[ "$QUALIFICATION_SUBJECT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$QUALIFICATION_SUBJECT_SHA"
          printf 'qualification_subject_sha=%s\n' "$QUALIFICATION_SUBJECT_SHA"
          printf 'runtime_github_sha=%s\n' "$GITHUB_SHA"
          printf 'workflow_sha=%s\n' "$GITHUB_WORKFLOW_SHA"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Restore pinned Rust cache action
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: crates/mycelix-integration-http-issuance-admission

      - name: Capture exact environment and source capsule
        shell: bash
        run: |
          set -euo pipefail
          rustc --version --verbose
          cargo --version --verbose
          sha256sum "$MANIFEST" "$WORKFLOW"
          find "$SOURCE_DIR" -type f -name '*.rs' -print0 | sort -z | xargs -0 sha256sum
          cargo metadata --manifest-path "$MANIFEST" --format-version 1 > /tmp/integration-http-issuance-admission-metadata.json
          sha256sum /tmp/integration-http-issuance-admission-metadata.json
          echo 'No --locked claim is made here until this standalone stack carries an intentionally committed lockfile.'

      - name: Check formatting
        run: rustfmt --edition 2024 --check "$SOURCE"

      - name: Compile tests without running
        run: cargo test --manifest-path "$MANIFEST" --package mycelix-integration-http-issuance-admission --no-run

      - name: Run tests
        run: cargo test --manifest-path "$MANIFEST" --package mycelix-integration-http-issuance-admission

      - name: Clippy
        run: cargo clippy --manifest-path "$MANIFEST" --package mycelix-integration-http-issuance-admission --all-targets -- -D warnings

      - name: Enforce route credential descriptor precede DispatchStarted
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('crates/mycelix-integration-http-issuance-admission/src/lib.rs').read_text()
          ordered = [
              'begin_integration_admin_mutation_exclusion(',
              'let inside_root = qualify_current_provider_trust_policy(',
              'let inside_http = qualify_current_http_transport_policy(',
              'let inside_admission = qualify_store_rechecked_preexecution(',
              'let canonical_command = command.canonical_preimage_v1();',
              'let materialized = materialize_provider_request(',
              'let final_root = qualify_current_provider_trust_policy(',
              'let final_http = qualify_current_http_transport_policy(',
              'let final_admission = qualify_store_rechecked_preexecution(',
              'let final_plan =',
              'qualify_public_https_route(&final_http_binding, dns_observation, final_at_u64)?',
              'let final_credential = qualify_http_credential_slot(',
              'let final_descriptor = qualify_http_issuance_descriptor(',
              'validate_descriptor_against_final_admission(&final_descriptor, &final_admission)?;',
              'let context = issuance_dispatch_context(',
              'let issuance_deadline_ms = issuance_deadline(',
              'let atomic_dispatch = bind_context_and_start_dispatch(',
          ]
          cursor = -1
          for needle in ordered:
              pos = s.find(needle, cursor + 1)
              if pos < 0 or pos <= cursor:
                  raise SystemExit(f'missing/out-of-order issuance theorem step: {needle}')
              cursor = pos
          PY

      - name: Enforce dispatch context includes exact issuance semantics
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'HTTP_ISSUANCE_CONTEXT_PROFILE' "$SOURCE"
          grep -Fq '&binding.binding_digest().0' "$SOURCE"
          grep -Fq '&plan.qualification_digest().0' "$SOURCE"
          grep -Fq '&route.route_digest().0' "$SOURCE"
          grep -Fq '&credential.qualification_digest().0' "$SOURCE"
          grep -Fq '&descriptor.issuance_digest().0' "$SOURCE"
          grep -Fq '&materialized.materialization_digest().0' "$SOURCE"
          grep -Fq 'DispatchContextCommitment::new(HTTP_ISSUANCE_CONTEXT_PROFILE, digest)' "$SOURCE"

      - name: Enforce all issuance horizons participate
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'let authority_until = i64::try_from(admission.admission().authority_valid_until_ms())' "$SOURCE"
          grep -Fq 'let root_until = i64::try_from(root.valid_until_ms())' "$SOURCE"
          grep -Fq 'let http_until = i64::try_from(http.valid_until_ms())' "$SOURCE"
          grep -Fq 'let route_until = i64::try_from(route.valid_until_ms())' "$SOURCE"
          grep -Fq 'let credential_until = i64::try_from(credential.valid_until_ms())' "$SOURCE"
          grep -Fq 'let descriptor_until = i64::try_from(descriptor.valid_until_ms())' "$SOURCE"
          grep -Fq '.min(route_until)' "$SOURCE"
          grep -Fq '.min(credential_until)' "$SOURCE"
          grep -Fq '.min(descriptor_until)' "$SOURCE"
          grep -Fq '.min(attempt_until)' "$SOURCE"
          grep -Fq '.min(profile_exclusive)' "$SOURCE"

      - name: Enforce origin caveats block native-I/O authority
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'resolver_origin_verified_here(&self) -> bool' "$SOURCE"
          grep -Fq 'credential_metadata_origin_verified_here(&self) -> bool' "$SOURCE"
          grep -Fq 'native_io_authorized_here(&self) -> bool' "$SOURCE"
          python3 - <<'PY'
          from pathlib import Path
          s = Path('crates/mycelix-integration-http-issuance-admission/src/lib.rs').read_text()
          for marker in [
              'pub const fn resolver_origin_verified_here(&self) -> bool',
              'pub const fn credential_metadata_origin_verified_here(&self) -> bool',
              'pub const fn native_io_authorized_here(&self) -> bool',
          ]:
              pos = s.find(marker)
              if pos < 0 or 'false' not in s[pos:pos+180]:
                  raise SystemExit(f'conservative non-claim changed: {marker}')
          PY

      - name: Enforce opaque issuance capability
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'credential_material_present_here(&self) -> bool' "$SOURCE"
          grep -Fq 'raw_payload_extractable_here(&self) -> bool' "$SOURCE"
          grep -Fq 'raw_request_plan_extractable_here(&self) -> bool' "$SOURCE"
          if grep -Eq 'pub fn (route|credential|descriptor|request_plan|materialized|request_bytes|raw_body|body)\(' "$SOURCE"; then
            echo 'Issuance admission exposed a reusable transport/secret/request object.'
            exit 1
          fi
          if grep -Eq 'derive\([^)]*(Serialize|Deserialize)' "$SOURCE"; then
            echo 'Live issuance admission must remain process-local.'
            exit 1
          fi

      - name: Enforce atomic dispatch is final fallible boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('crates/mycelix-integration-http-issuance-admission/src/lib.rs').read_text()
          start = s.find('let atomic_dispatch = bind_context_and_start_dispatch(')
          end = s.find('Ok(QualifiedHttpIssuanceAdmission {', start)
          if min(start, end) < 0:
              raise SystemExit('unable to locate atomic dispatch/final construction')
          tail = s[start:end]
          boundary = tail.find(')?;')
          if boundary < 0:
              raise SystemExit('atomic dispatch result boundary missing')
          after = tail[boundary + 3:]
          forbidden = ['?', 'return Err', 'system_now_ms(', 'qualify_', '.validate(', 'store.', 'fs::']
          for needle in forbidden:
              if needle in after:
                  raise SystemExit(f'fallible operation after context-bound DispatchStarted: {needle}')
          PY

      - name: Enforce no native network or secret capability
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          meta = json.loads(subprocess.check_output([
              'cargo','metadata','--manifest-path',
              'crates/mycelix-integration-http-issuance-admission/Cargo.toml',
              '--no-deps','--format-version','1'
          ]))
          package = next(p for p in meta['packages'] if p['name'] == 'mycelix-integration-http-issuance-admission')
          direct = {d['name'] for d in package['dependencies']}
          forbidden = {'reqwest','hyper','tonic','curl','ureq','tokio','async-std','rustls','native-tls','openssl','keyring','vault','vaultrs','secret-service'}
          hit = sorted(direct & forbidden)
          if hit:
              raise SystemExit(f'native network/secret dependency entered issuance admission: {hit}')
          PY
          if grep -Eq 'TcpStream|UdpSocket|reqwest::|hyper::|rustls::|std::env|keyring::|vault::|secret_service::|AdminWebsocket|update_coordinators' "$SOURCE"; then
            echo 'Issuance admission crossed into network/secret/Admin I/O.'
            exit 1
          fi

      - name: Enforce exact qualification scope and immutable subject
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq -- "RUST_TOOLCHAIN: '1.96.0'" "$WORKFLOW"
          grep -Fq -- 'github.event.pull_request.head.sha || github.sha' "$WORKFLOW"
          grep -Fq -- 'persist-credentials: false' "$WORKFLOW"
          grep -Fq -- 'actions/checkout@11d5960a326750d5838078e36cf38b85af677262' "$WORKFLOW"
          grep -Fq -- 'dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87' "$WORKFLOW"
          grep -Fq -- 'Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6' "$WORKFLOW"
          grep -Fq -- 'sha256sum /tmp/integration-http-issuance-admission-metadata.json' "$WORKFLOW"
          if grep -Eq -- 'uses: (actions/checkout|dtolnay/rust-toolchain|Swatinem/rust-cache)@(v[0-9]+|stable|master|main)$' "$WORKFLOW"; then
            echo 'Qualification action ref became floating.'
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$QUALIFICATION_SUBJECT_SHA"
          git diff --exit-code -- "$MANIFEST" "$SOURCE_DIR" "$WORKFLOW"
