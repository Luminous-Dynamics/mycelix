  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Classification provenance research regression (non-authoritative)
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact verification commit
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            test -n "${PR_HEAD_SHA}"
            test -n "${PR_NUMBER}"
            git fetch --depth=1 origin "refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-head"
            target_sha="${PR_HEAD_SHA}"
            git checkout --detach refs/remotes/origin/pr-head
          else
            target_sha="${EVENT_SHA}"
            git fetch --depth=1 origin "${target_sha}"
            git checkout --detach "${target_sha}"
          fi
          test "$(git rev-parse HEAD)" = "${target_sha}"
          printf 'verification_head=%s\n' "${target_sha}"

      - name: Run fixed corpus with Python
        shell: bash
        run: |
          set -euo pipefail
          POLICY_BLOB_SHA="$(git hash-object docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_POLICY.json)"
          python3 docs/research/verify_censoring_classification.py             "$POLICY_BLOB_SHA"             docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_POLICY.json             docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_FIXTURES.json             python-fixed.json

      - name: Run fixed corpus with Node
        shell: bash
        run: |
          set -euo pipefail
          POLICY_BLOB_SHA="$(git hash-object docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_POLICY.json)"
          node docs/research/verify_censoring_classification.mjs             "$POLICY_BLOB_SHA"             docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_POLICY.json             docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_FIXTURES.json             node-fixed.json

      - name: Differential-compare fixed reports
        shell: bash
        run: |
          set -euo pipefail
          diff -u python-fixed.json node-fixed.json

      - name: Verify policy substitution fails closed
        shell: bash
        run: |
          set -euo pipefail
          POLICY_BLOB_SHA="$(git hash-object docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_POLICY.json)"
          tmp_policy="$(mktemp)"
          trap 'rm -f "$tmp_policy"' EXIT
          cp docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_POLICY.json "$tmp_policy"
          printf '\n' >> "$tmp_policy"
          ! python3 docs/research/verify_censoring_classification.py             "$POLICY_BLOB_SHA"             "$tmp_policy"             docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_FIXTURES.json             ignored.json
          ! node docs/research/verify_censoring_classification.mjs             "$POLICY_BLOB_SHA"             "$tmp_policy"             docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_FIXTURES.json             ignored.json

      - name: Generate corpus twice and require byte identity
        shell: bash
        run: |
          set -euo pipefail
          POLICY=docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_POLICY.json
          FIXTURES=docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_FIXTURES.json
          python3 docs/research/generate_censoring_classification_properties.py "$POLICY" "$FIXTURES" generated-a.json
          python3 docs/research/generate_censoring_classification_properties.py "$POLICY" "$FIXTURES" generated-b.json
          cmp -s generated-a.json generated-b.json
          test "$(python3 -c 'import json; print(len(json.load(open("generated-a.json"))["cases"]))')" = "168"

      - name: Run generated corpus with Python
        shell: bash
        run: |
          set -euo pipefail
          POLICY_BLOB_SHA="$(git hash-object docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_POLICY.json)"
          python3 docs/research/verify_censoring_classification.py             "$POLICY_BLOB_SHA"             docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_POLICY.json             generated-a.json             python-generated.json

      - name: Run generated corpus with Node
        shell: bash
        run: |
          set -euo pipefail
          POLICY_BLOB_SHA="$(git hash-object docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_POLICY.json)"
          node docs/research/verify_censoring_classification.mjs             "$POLICY_BLOB_SHA"             docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_POLICY.json             generated-a.json             node-generated.json

      - name: Differential-compare generated reports
        shell: bash
        run: |
          set -euo pipefail
          diff -u python-generated.json node-generated.json

      - name: Run policy-liveness campaign
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/research/verify_censoring_classification_policy_liveness.py             docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_POLICY.json             docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_POLICY_LIVENESS_FIXTURES.json             docs/research/verify_censoring_classification.py             docs/research/verify_censoring_classification.mjs

      - name: Run independently pinned anchor-governance campaign
        shell: bash
        run: |
          set -euo pipefail
          ANCHOR_ROOT_SHA256="sha256:d70d03373580c0714a84d03b2fd3c8a443cad3f9928a71af42b9b35a89d85331"
          ANCHOR_OBSERVED_SHA256="sha256:10406333afe0bfdeead43b5d85ef21f56fd0e9d099fd4ee4c4cc7cb77019932f"
          python3 docs/research/verify_censoring_classification_anchor_governance.py             "$ANCHOR_ROOT_SHA256" "$ANCHOR_OBSERVED_SHA256"             docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_ANCHOR_OBSERVED_STATE.json             docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_ANCHOR_TRUST_ROOT.json             docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_ANCHOR_MANIFEST.json             docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_ANCHOR_MANIFEST_V1.json             docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_POLICY.json             docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_ANCHOR_GOVERNANCE_FIXTURES.json             anchor-governance-python.json
          node docs/research/verify_censoring_classification_anchor_governance.mjs             "$ANCHOR_ROOT_SHA256" "$ANCHOR_OBSERVED_SHA256"             docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_ANCHOR_OBSERVED_STATE.json             docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_ANCHOR_TRUST_ROOT.json             docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_ANCHOR_MANIFEST.json             docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_ANCHOR_MANIFEST_V1.json             docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_POLICY.json             docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_ANCHOR_GOVERNANCE_FIXTURES.json             anchor-governance-node.json
          diff -u anchor-governance-python.json anchor-governance-node.json

      - name: Run witness non-equivocation campaign
        shell: bash
        run: |
          set -euo pipefail
          WITNESS_ROOT_SHA256="sha256:46bbd3215736596eef8f8c0423590c1098f05a6fdd016b2ba10a6e232fc71d61"
          python3 docs/research/verify_censoring_classification_anchor_witness.py             "$WITNESS_ROOT_SHA256"             docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_ANCHOR_WITNESS_TRUST_ROOT.json             docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_ANCHOR_WITNESS_REGISTRY.json             docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_ANCHOR_WITNESS_BASELINE.json             docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_ANCHOR_WITNESS_FORWARD.json             docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_ANCHOR_WITNESS_CAMPAIGN.json             witness-python.json
          node docs/research/verify_censoring_classification_anchor_witness.mjs             "$WITNESS_ROOT_SHA256"             docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_ANCHOR_WITNESS_TRUST_ROOT.json             docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_ANCHOR_WITNESS_REGISTRY.json             docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_ANCHOR_WITNESS_BASELINE.json             docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_ANCHOR_WITNESS_FORWARD.json             docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_ANCHOR_WITNESS_CAMPAIGN.json             witness-node.json
          diff -u witness-python.json witness-node.json

      - name: Run cryptographic witness authentication campaign
        shell: bash
        run: |
          set -euo pipefail
          WITNESS_CRYPTO_ROOT_SHA256="sha256:99ec416914eb75a7c953fbc74045d25fc83cb894c6e7a5bcd899c757a736b9d7"
          python3 docs/research/verify_censoring_classification_anchor_witness_crypto.py \
            "$WITNESS_CRYPTO_ROOT_SHA256" \
            docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_ANCHOR_WITNESS_CRYPTO_TRUST_ROOT.json \
            docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_ANCHOR_WITNESS_CRYPTO_REGISTRY.json \
            docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_ANCHOR_WITNESS_CRYPTO_BASELINE.json \
            docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_ANCHOR_WITNESS_CRYPTO_FORWARD.json \
            docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_ANCHOR_WITNESS_CRYPTO_CAMPAIGN.json \
            witness-crypto-python.json
          node docs/research/verify_censoring_classification_anchor_witness_crypto.mjs \
            "$WITNESS_CRYPTO_ROOT_SHA256" \
            docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_ANCHOR_WITNESS_CRYPTO_TRUST_ROOT.json \
            docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_ANCHOR_WITNESS_CRYPTO_REGISTRY.json \
            docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_ANCHOR_WITNESS_CRYPTO_BASELINE.json \
            docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_ANCHOR_WITNESS_CRYPTO_FORWARD.json \
            docs/research/CONTINUAL_ADAPTATION_CENSORING_CLASSIFICATION_ANCHOR_WITNESS_CRYPTO_CAMPAIGN.json \
            witness-crypto-node.json
          diff -u witness-crypto-python.json witness-crypto-node.json

      - name: Run append-only VDS consistency campaign
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/research/verify_censoring_classification_anchor_witness_vds.py \
