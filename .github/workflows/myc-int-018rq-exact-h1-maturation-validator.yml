name: MYC-INT-018R exact H1 maturation-binding qualification

on:
  pull_request:
    paths:
      - '.github/workflows/myc-int-018rq-exact-h1-maturation-validator.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SUBJECT_SHA: bc986eae0a998cf30e23681e20447f8ae118ee94
  PARENT_SHA: 3d30fbefc8ad49dcf7d4fa789022aa985b122141

jobs:
  qualify-exact-018r:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact product subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0

      - name: Verify exact subject and two-file scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          actual="$(git diff --name-only "$PARENT_SHA" "$SUBJECT_SHA" | sort)"
          expected="$(printf '%s\n' \
            docs/interoperability/tools/test_validate_myc_int_018q.py \
            docs/interoperability/tools/validate_myc_int_018q.py | sort)"
          test "$actual" = "$expected"

      - name: Compile validator and tests
        run: |
          python3 -m py_compile \
            docs/interoperability/tools/validate_myc_int_018q.py \
            docs/interoperability/tools/test_validate_myc_int_018q.py

      - name: Run mutation suite
        working-directory: docs/interoperability/tools
        run: python3 -m unittest -v test_validate_myc_int_018q.py

      - name: Validate exact stacked H1 maturation fixtures
        run: |
          python3 docs/interoperability/tools/validate_myc_int_018q.py \
            docs/interoperability/fixtures/MYC_INT_018K_H1_WET_BENCH_MANIFEST.json \
            docs/interoperability/fixtures/MYC_INT_018O_H1_INSTALL_RUN_PACKAGE.json \
            docs/interoperability/fixtures/MYC_INT_018Q_H1_MATURATION_BINDING.json

      - name: Build evidence capsule
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/myc-int-018r
          printf 'subject=%s\nparent=%s\n' "$SUBJECT_SHA" "$PARENT_SHA" > evidence/myc-int-018r/subject.txt
          python3 --version > evidence/myc-int-018r/python-version.txt 2>&1
          git --version > evidence/myc-int-018r/git-version.txt
          sha256sum \
            docs/interoperability/fixtures/MYC_INT_018K_H1_WET_BENCH_MANIFEST.json \
            docs/interoperability/fixtures/MYC_INT_018O_H1_INSTALL_RUN_PACKAGE.json \
            docs/interoperability/fixtures/MYC_INT_018Q_H1_MATURATION_BINDING.json \
            docs/interoperability/tools/validate_myc_int_018q.py \
            docs/interoperability/tools/test_validate_myc_int_018q.py \
            > evidence/myc-int-018r/sha256.txt

      - name: Upload qualification capsule
        uses: actions/upload-artifact@v4
        with:
          name: myc-int-018r-exact-qualification
          path: evidence/myc-int-018r
