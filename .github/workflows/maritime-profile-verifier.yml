name: Maritime profile verifier

on:
  pull_request:
    paths:
      - "mycelix-workspace/tools/maritime-profile-verifier/**"
      - ".github/workflows/maritime-profile-verifier.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Format, build, test, and lint isolated verifier
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mycelix-workspace/tools/maritime-profile-verifier
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Run locked unit tests
        run: cargo test --locked --all-targets

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Upload resolved Cargo lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maritime-profile-verifier-cargo-lock
          path: |
            mycelix-workspace/tools/maritime-profile-verifier/Cargo.lock
            mycelix-workspace/tools/maritime-profile-verifier/src/lib.rs
          if-no-files-found: warn
