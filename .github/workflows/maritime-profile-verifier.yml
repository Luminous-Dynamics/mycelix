name: Maritime profile verifier

on:
  pull_request:
    paths:
      - "mycelix-workspace/tools/maritime-profile-verifier/**"
      - ".github/workflows/maritime-profile-verifier.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and test isolated verifier
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mycelix-workspace/tools/maritime-profile-verifier
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run unit tests
        run: cargo test --all-targets
