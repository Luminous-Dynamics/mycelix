name: Governance Execution Lifecycle

on:
  pull_request:
    paths:
      - 'crates/mycelix-governance-execution-lifecycle/**'
      - 'crates/mycelix-institutional-core/**'
      - '.github/workflows/governance-execution-lifecycle.yml'
  push:
    branches:
      - 'security/governance-execution-lifecycle-v0.1'

permissions:
  contents: read

jobs:
  lifecycle-kernel:
    name: Pure execution lifecycle kernel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path crates/mycelix-governance-execution-lifecycle/Cargo.toml -- --check
      - name: Test
        run: cargo test --manifest-path crates/mycelix-governance-execution-lifecycle/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-governance-execution-lifecycle/Cargo.toml --all-targets -- -D warnings
