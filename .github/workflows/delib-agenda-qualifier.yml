name: Deliberation Agenda Integrity Qualifier

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/research/deliberation/agenda-integrity/**"
      - ".github/workflows/delib-agenda-qualifier.yml"
  push:
    branches: [main]
    paths:
      - "docs/research/deliberation/agenda-integrity/**"
      - ".github/workflows/delib-agenda-qualifier.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run qualifier tests
        run: cargo test --manifest-path docs/research/deliberation/agenda-integrity/qualifier/Cargo.toml
      - name: Validate protocol, schemas and agenda fixtures
        run: |
          cargo run --manifest-path docs/research/deliberation/agenda-integrity/qualifier/Cargo.toml -- \
            docs/research/deliberation/agenda-integrity/DELIB_AGENDA_PROTOCOL_V0_1.json \
            docs/research/deliberation/agenda-integrity/DELIB_AGENDA_PROTOCOL_V0_1.schema.json \
            docs/research/deliberation/agenda-integrity/DELIB_AGENDA_FIXTURES_V0_1.json \
            docs/research/deliberation/agenda-integrity/DELIB_AGENDA_FIXTURES_V0_1.schema.json
