name: Authority Source Head Verifier

on:
  pull_request:
    paths:
      - 'crates/mycelix-authority-source-head-verifier/**'
      - 'crates/mycelix-authority-state-coverage/**'
      - 'crates/mycelix-authority-state-coverage-context/**'
      - '.github/workflows/authority-source-head-verifier.yml'
  push:
    branches:
      - 'security/authority-source-head-verifier-v0.1'
      - 'security/authority-source-head-causal-order-v0.1'

permissions:
  contents: read

concurrency:
  group: authority-source-head-verifier-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: Exact challenged source-head authentication
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --manifest-path crates/mycelix-authority-source-head-verifier/Cargo.toml -- --check

      - name: Tests
        run: cargo test --manifest-path crates/mycelix-authority-source-head-verifier/Cargo.toml --all-targets

      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-authority-source-head-verifier/Cargo.toml --all-targets -- -D warnings

      - name: Downstream coverage compatibility
        run: |
          cargo check --manifest-path crates/mycelix-authority-state-coverage/Cargo.toml --all-targets
          cargo check --manifest-path crates/mycelix-authority-state-coverage-context/Cargo.toml --all-targets

      - name: Source-head authority audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('crates/mycelix-authority-source-head-verifier/src/lib.rs').read_text()
          inv = Path('crates/mycelix-authority-source-head-verifier/INVARIANTS.md').read_text().lower()

          required = [
              'VerifiedSourceHeadProof',
              'QualifiedSourceHeadAuthentication',
              'qualify_source_head_authentication',
              'challenge.identity_digest()',
              'attestation.identity_digest()',
              'proof.source_identity_digest != attestation.source_identity.digest',
              'proof.source_identity_profile != attestation.source_identity.profile',
              'proof.source_proof_ref != attestation.source_proof_ref',
              'receipt.verified_at_ms < receipt.challenge.issued_at_ms',
              'attestation.responded_at_ms < challenge_receipt.challenge.issued_at_ms',
              'attestation.responded_at_ms < challenge_receipt.verified_at_ms',
              'proof.verified_at_ms < attestation.responded_at_ms',
              '.min(attestation.expires_at_ms)',
              '.min(proof.valid_until_ms)',
              'fn source_response_before_challenge_verification_denies()',
          ]
          for token in required:
              assert token in src, token

          forbidden = [
              'AuthorityCoveragePolicy',
              'qualify_authority_state_coverage(',
              'get_links(',
              'get_details(',
              'hdk::',
              '#[hdk_extern]',
              'create_entry(',
              'project_current_authority_state(',
              'execute_actions',
              'phi',
              'reputation',
              'model_score',
          ]
          lowered = src.lower()
          for token in forbidden:
              assert token.lower() not in lowered, token

          assert 'authentication is not source-policy authority' in inv
          assert 'authentication is not completeness' in inv
          assert 'source refusal or partition fails closed' in inv
          assert 'causal time ordering is mandatory' in inv
          assert 'challenge issued ≤ challenge verified ≤ source responded ≤ source proof verified ≤ qualification now' in inv
          assert 'non-deserializable positive result' in inv
          print('PASS: source-head verifier proves challenge verification causally precedes source response')
          PY
