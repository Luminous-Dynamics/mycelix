name: Hearth 0.7 Qualification

on:
  push:
    branches:
      - 'chore/hearth-07-*'
    paths:
      - "mycelix-workspace/mycelix-hearth/**"
      - "crates/mycelix-bridge-*/**"
      - ".github/workflows/hearth-07-qualification.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "mycelix-workspace/mycelix-hearth/**"
      - "crates/mycelix-bridge-*/**"
  workflow_dispatch:

concurrency:
  group: hearth-07-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    name: Hearth 0.7 Qualification
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v15
        with:
          name: holochain-ci

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            mycelix-workspace/mycelix-hearth

      # Temporary CI bridge: refresh a stale Holonix lock revision before flake
      # evaluation. The generated lock state is captured for immediate promotion
      # into version control once verified.
      - name: Refresh Holonix 0.7 lock input
        working-directory: mycelix-workspace/mycelix-hearth
        run: |
          nix flake lock --update-input holonix 2>&1 | tee qualification-lock-refresh.log
          git diff -- flake.lock | tee qualification-lock-diff.log

      - name: Run Hearth 0.7 source audit
        working-directory: mycelix-workspace/mycelix-hearth
        run: |
          set -o pipefail
          nix develop .#ci --impure --command             bash tools/audit-holochain-07-source.sh 2>&1 | tee qualification-source-audit.log

      - name: Check Hearth 0.7 test formatting
        working-directory: mycelix-workspace/mycelix-hearth
        run: |
          nix develop .#ci --impure --command             cargo fmt --manifest-path tests/Cargo.toml --check 2>&1 | tee qualification-format.log

      - name: Build Hearth 0.7 zomes
        working-directory: mycelix-workspace/mycelix-hearth
        run: |
          set -o pipefail
          nix develop .#ci --impure --command             cargo build --release --target wasm32-unknown-unknown --workspace 2>&1 | tee qualification-build.log

      - name: Pack Hearth 0.7 DNA
        working-directory: mycelix-workspace/mycelix-hearth
        run: |
          set -o pipefail
          nix develop .#ci --impure --command             hc dna pack dna/ 2>&1 | tee qualification-dna-pack.log

      - name: Run Hearth 0.7 SweetConductor qualification
        working-directory: mycelix-workspace/mycelix-hearth
        run: |
          set -o pipefail
          nix develop .#ci --impure --command bash -c             'set -o pipefail; cd tests && cargo test --release -- --include-ignored --test-threads=1 2>&1 | tee ../qualification-sweettest.log'

      - name: Capture qualification metadata
        if: always()
        working-directory: mycelix-workspace/mycelix-hearth
        run: |
          {
            echo "job_status=${{ job.status }}"
            if [[ "${{ job.status }}" == "success" ]]; then
              echo "claim_ceiling=RuntimeQualificationPassed"
            else
              echo "claim_ceiling=RuntimeQualificationPending"
            fi
            echo "tested_sha=${GITHUB_SHA}"
            echo "pr_head_sha=${{ github.event.pull_request.head.sha || '' }}"
            echo "pr_base_sha=${{ github.event.pull_request.base.sha || '' }}"
            echo "ref=${GITHUB_REF_NAME}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "workflow=${GITHUB_WORKFLOW}"
          } > qualification-metadata.txt

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hearth-07-qualification-${{ github.sha }}
          path: |
            mycelix-workspace/mycelix-hearth/qualification-metadata.txt
            mycelix-workspace/mycelix-hearth/qualification-lock-refresh.log
            mycelix-workspace/mycelix-hearth/qualification-lock-diff.log
            mycelix-workspace/mycelix-hearth/qualification-source-audit.log
            mycelix-workspace/mycelix-hearth/qualification-format.log
            mycelix-workspace/mycelix-hearth/qualification-build.log
            mycelix-workspace/mycelix-hearth/qualification-dna-pack.log
            mycelix-workspace/mycelix-hearth/qualification-sweettest.log
          if-no-files-found: warn
          retention-days: 14
