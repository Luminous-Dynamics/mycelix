            mycelix-workspace/mycelix-hearth/qualification-sweettest.log
            mycelix-workspace/mycelix-hearth/qualification-toolchain.txt
            mycelix-workspace/mycelix-hearth/qualification-wasm-sha256.txt
            mycelix-workspace/mycelix-hearth/qualification-dna-sha256.txt
            mycelix-workspace/mycelix-hearth/qualification-cargo-lock-sha256.txt
