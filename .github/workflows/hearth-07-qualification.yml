name: Hearth 0.7 Qualification

on:
  push:
    branches:
      - 'chore/hearth-07-*'
    paths:
      - "mycelix-workspace/mycelix-hearth/**"
      - "crates/mycelix-bridge-*/**"
      - ".github/workflows/hearth-07-qualification.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "mycelix-workspace/mycelix-hearth/**"
      - "crates/mycelix-bridge-*/**"
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact 40-character commit SHA to qualify"
        required: true
        type: string

concurrency:
  group: hearth-07-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    name: Hearth 0.7 Qualification
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Always qualify an exact source commit: PRs use the source head rather
      # than GitHub's synthetic merge ref, pushes use the pushed commit, and
      # manual runs require an explicit SHA.
      QUALIFY_SHA: ${{ github.event.inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.QUALIFY_SHA }}
          submodules: recursive

      - name: Verify immutable qualification checkout
        run: |
          set -euo pipefail
          [[ "$QUALIFY_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "QUALIFY_SHA must be an exact 40-character lowercase commit SHA: $QUALIFY_SHA"
            exit 1
          }
          tested_sha="$(git rev-parse HEAD)"
          [[ "$tested_sha" == "$QUALIFY_SHA" ]] || {
            echo "qualification checkout mismatch: expected $QUALIFY_SHA, got $tested_sha"
            exit 1
          }
          echo "QUALIFY_SHA=$QUALIFY_SHA"
          echo "Checked-out HEAD=$tested_sha"

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v15
        with:
          name: holochain-ci

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            mycelix-workspace/mycelix-hearth

      - name: Syntax-check Hearth 0.7 audit
        working-directory: mycelix-workspace/mycelix-hearth
        run: bash -n tools/audit-holochain-07-source.sh

      - name: Run Hearth 0.7 source audit
        working-directory: mycelix-workspace/mycelix-hearth
        run: |
          set -o pipefail
          nix develop .#ci --impure --command             bash tools/audit-holochain-07-source.sh 2>&1 | tee qualification-source-audit.log

      - name: Check Hearth 0.7 test formatting
        working-directory: mycelix-workspace/mycelix-hearth
        run: |
          set -o pipefail
          nix develop .#ci --impure --command             cargo fmt --manifest-path tests/Cargo.toml --check 2>&1 | tee qualification-format.log

      - name: Generate exact Rust dependency locks
        working-directory: mycelix-workspace/mycelix-hearth
        run: |
          set -euo pipefail
          nix develop .#ci --impure --command cargo generate-lockfile
          nix develop .#ci --impure --command bash -c 'cd tests && cargo generate-lockfile'
          test -s Cargo.lock
          test -s tests/Cargo.lock
          sha256sum Cargo.lock tests/Cargo.lock > qualification-cargo-lock-sha256.txt
          {
            echo "hearth_cargo_lock=$(sha256sum Cargo.lock | awk '{print $1}')"
            echo "tests_cargo_lock=$(sha256sum tests/Cargo.lock | awk '{print $1}')"
          } > qualification-cargo-lock-summary.txt
          nix develop .#ci --impure --command cargo metadata --locked --format-version 1 > qualification-cargo-metadata.json
          nix develop .#ci --impure --command bash -c 'cd tests && cargo metadata --locked --format-version 1' > tests/qualification-cargo-metadata.json

      - name: Build Hearth 0.7 zomes
        working-directory: mycelix-workspace/mycelix-hearth
        run: |
          set -o pipefail
          # Prevent a removed/renamed zome from being silently packed from a
          # stale prior build artifact in the runner workspace.
          rm -f target/wasm32-unknown-unknown/release/*.wasm
          nix develop .#ci --impure --command             cargo build --locked --release --target wasm32-unknown-unknown --workspace 2>&1 | tee qualification-build.log

      - name: Pack Hearth 0.7 DNA
        working-directory: mycelix-workspace/mycelix-hearth
        run: |
          set -o pipefail
          nix develop .#ci --impure --command             hc dna pack dna/ 2>&1 | tee qualification-dna-pack.log

      - name: Run Hearth 0.7 SweetConductor qualification
        working-directory: mycelix-workspace/mycelix-hearth
        run: |
          set -o pipefail
          nix develop .#ci --impure --command bash -c             'set -o pipefail; cd tests && cargo test --locked --release -- --include-ignored --test-threads=1 2>&1 | tee ../qualification-sweettest.log'

      - name: Capture immutable qualification evidence
        if: always()
        working-directory: mycelix-workspace/mycelix-hearth
        run: |
          set -euo pipefail
          {
            echo "tested_sha=$QUALIFY_SHA"
            echo "checked_out_sha=$(git rev-parse HEAD)"
            echo "qualification_source=exact_candidate_sha"
            echo "holochain_version=$(nix develop .#ci --impure --command holochain --version 2>/dev/null || true)"
            echo "hc_version=$(nix develop .#ci --impure --command hc --version 2>/dev/null || true)"
            echo "rust_version=$(nix develop .#ci --impure --command rustc --version 2>/dev/null || true)"
            echo "cargo_version=$(nix develop .#ci --impure --command cargo --version 2>/dev/null || true)"
            echo "dna_present=$(test -s dna/mycelix_hearth.dna && echo true || echo false)"
            if [[ -s qualification-source-contract-sha256.txt ]]; then
              echo "source_contract_digest=$(sha256sum qualification-source-contract-sha256.txt | awk '{print $1}')"
            fi
          } > qualification-toolchain.txt

          : > qualification-wasm-sha256.txt
          while IFS= read -r wasm_path; do
            [[ -n "$wasm_path" ]] || continue
            wasm="dna/$wasm_path"
            [[ -s "$wasm" ]] || { echo "missing or empty DNA input: $wasm" >&2; exit 1; }
            sha256sum "$wasm" >> qualification-wasm-sha256.txt
          done < <(sed -n 's/^[[:space:]]*path:[[:space:]]*//p' dna/dna.yaml | sort -u)

          [[ -s dna/mycelix_hearth.dna ]] || { echo "missing or empty packed DNA" >&2; exit 1; }
          sha256sum dna/mycelix_hearth.dna > qualification-dna-sha256.txt

          # Bind the evidence to the exact source-side qualification contract as
          # well as the candidate commit. These files are all read from the
          # immutable checkout established at the beginning of the job.
          sha256sum             tools/audit-holochain-07-source.sh             tests/hearth-07-semantic-validation-cases.json             tests/sweettest_semantic_validation.rs             dna/dna.yaml             Cargo.toml             tests/Cargo.toml             ../../.github/workflows/hearth-07-qualification.yml             > qualification-source-contract-sha256.txt

      - name: Capture qualification metadata
        if: always()
        working-directory: mycelix-workspace/mycelix-hearth
        run: |
          {
            echo "job_status=${{ job.status }}"
            if [[ "${{ job.status }}" == "success" ]]; then
              echo "claim_ceiling=RuntimeQualificationPassed"
            else
              echo "claim_ceiling=RuntimeQualificationPending"
            fi
            echo "tested_sha=${QUALIFY_SHA}"
            echo "checked_out_sha=$(git rev-parse HEAD)"
            echo "pr_head_sha=${{ github.event.pull_request.head.sha || '' }}"
            echo "pr_base_sha=${{ github.event.pull_request.base.sha || '' }}"
            echo "ref=${GITHUB_REF_NAME}"
            echo "event=${GITHUB_EVENT_NAME}"
            if [[ -n "${{ github.event.inputs.target_sha || '' }}" ]]; then
              echo "target_sha_source=workflow_dispatch_input"
            elif [[ -n "${{ github.event.pull_request.head.sha || '' }}" ]]; then
              echo "target_sha_source=pull_request_head"
            else
              echo "target_sha_source=push_sha"
            fi
            echo "run_id=${GITHUB_RUN_ID}"
            echo "workflow=${GITHUB_WORKFLOW}"
          } > qualification-metadata.txt

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hearth-07-qualification-${{ env.QUALIFY_SHA }}
          path: |
            mycelix-workspace/mycelix-hearth/qualification-metadata.txt
            mycelix-workspace/mycelix-hearth/qualification-source-audit.log
            mycelix-workspace/mycelix-hearth/qualification-format.log
            mycelix-workspace/mycelix-hearth/qualification-build.log
            mycelix-workspace/mycelix-hearth/qualification-dna-pack.log
            mycelix-workspace/mycelix-hearth/qualification-sweettest.log
            mycelix-workspace/mycelix-hearth/qualification-toolchain.txt
            mycelix-workspace/mycelix-hearth/qualification-wasm-sha256.txt
            mycelix-workspace/mycelix-hearth/qualification-dna-sha256.txt
            mycelix-workspace/mycelix-hearth/qualification-cargo-lock-sha256.txt
            mycelix-workspace/mycelix-hearth/qualification-cargo-lock-summary.txt
            mycelix-workspace/mycelix-hearth/qualification-source-contract-sha256.txt
            mycelix-workspace/mycelix-hearth/qualification-cargo-metadata.json
            mycelix-workspace/mycelix-hearth/tests/qualification-cargo-metadata.json
            mycelix-workspace/mycelix-hearth/Cargo.lock
            mycelix-workspace/mycelix-hearth/tests/Cargo.lock
          if-no-files-found: error
          retention-days: 14
