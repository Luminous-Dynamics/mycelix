name: One-shot Migrate Recovery Action Digest

on:
  push:
    branches:
      - refactor/recovery-shared-execution-action-digest-v1

permissions:
  contents: write

concurrency:
  group: one-shot-migrate-recovery-action-digest
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refactor/recovery-shared-execution-action-digest-v1
          fetch-depth: 2

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Replace only duplicated production digest implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('mycelix-commons/crates/commons-types/src/regenerative_recovery_governance_authority.rs')
          text = path.read_text()

          replacements = [
              (
                  'use serde::{Deserialize, Serialize};\n',
                  'use mycelix_execution_action_digest_core::{\n'
                  '    ACTIONS_DIGEST_PROFILE_V1, MAX_ACTION_BYTES, MAX_PROPOSAL_ID_BYTES,\n'
                  '    execution_authority_digest_hex,\n'
                  '};\n'
                  'use serde::{Deserialize, Serialize};\n',
              ),
              (
                  'pub const GOVERNANCE_ACTIONS_DIGEST_PROFILE_V1: &str =\n'
                  '    "mycelix-governance-execution-authority-v1-blake3-exact-json";\n',
                  'pub const GOVERNANCE_ACTIONS_DIGEST_PROFILE_V1: &str = ACTIONS_DIGEST_PROFILE_V1;\n',
              ),
              (
                  'const EXECUTION_AUTHORITY_DOMAIN: &[u8] = b"mycelix-governance-execution-authority-v1\\0";\n'
                  'const MAX_ID_BYTES: usize = 256;\n'
                  'const MAX_BINDING_BYTES: usize = 2048;\n'
                  'const MAX_ACTION_BYTES: usize = 4096;\n'
                  'const MAX_PROPOSAL_ID_BYTES: usize = 512;\n',
                  'const MAX_ID_BYTES: usize = 256;\n'
                  'const MAX_BINDING_BYTES: usize = 2048;\n',
              ),
              (
                  '    let actions_digest = execution_authority_digest(proposal_id, &exact_action_json)?;\n',
                  '    let actions_digest = execution_authority_digest_hex(proposal_id, &exact_action_json)\n'
                  '        .map_err(|error| format!("failed to digest recovery governance action: {error}"))?;\n',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one source fragment, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          start = text.find('fn execution_authority_digest(proposal_id: &str, actions: &str) -> Result<String, String> {')
          if start < 0:
              raise SystemExit('local execution_authority_digest function not found')
          end_marker = '\nfn canonical_proposal_id(value: &str) -> bool {'
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('canonical_proposal_id boundary not found')
          text = text[:start] + text[end + 1:]

          forbidden = [
              'EXECUTION_AUTHORITY_DOMAIN',
              'fn execution_authority_digest(',
              'blake3::Hasher::new()',
          ]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f'duplicate digest implementation remains: {token}')

          required = [
              'execution_authority_digest_hex',
              'ACTIONS_DIGEST_PROFILE_V1',
              'MAX_ACTION_BYTES',
              'MAX_PROPOSAL_ID_BYTES',
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f'shared digest core binding missing: {token}')

          path.write_text(text)
          PY

          rustfmt --edition 2024 mycelix-commons/crates/commons-types/src/regenerative_recovery_governance_authority.rs

          changed="$(git diff --name-only)"
          expected='mycelix-commons/crates/commons-types/src/regenerative_recovery_governance_authority.rs'
          if [[ "$changed" != "$expected" ]]; then
            echo "Unexpected migration scope: $changed" >&2
            exit 1
          fi

      - name: Qualify shared digest core
        run: |
          cargo fmt --manifest-path crates/mycelix-execution-action-digest-core/Cargo.toml -- --check
          cargo test --manifest-path crates/mycelix-execution-action-digest-core/Cargo.toml --all-targets
          cargo clippy --manifest-path crates/mycelix-execution-action-digest-core/Cargo.toml --all-targets -- -D warnings

      - name: Re-run independent recovery action oracle
        run: cargo test --manifest-path mycelix-commons/Cargo.toml -p commons-types --test regenerative_recovery_governance_action_conformance

      - name: Test and Clippy Commons
        run: |
          cargo test --manifest-path mycelix-commons/Cargo.toml -p commons-types
          cargo clippy --manifest-path mycelix-commons/Cargo.toml -p commons-types -- -D warnings

      - name: Commit exact one-file production migration
        shell: bash
        run: |
          set -euo pipefail
          target='mycelix-commons/crates/commons-types/src/regenerative_recovery_governance_authority.rs'
          if git diff --quiet -- "$target"; then
            echo 'No migration delta to commit.'
            exit 0
          fi
          if [[ "$(git diff --name-only)" != "$target" ]]; then
            echo 'Refusing to commit outside the recovery governance authority source.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$target"
          git commit -m 'refactor(commons): reuse shared execution action digest core'
          git push origin HEAD:refactor/recovery-shared-execution-action-digest-v1
