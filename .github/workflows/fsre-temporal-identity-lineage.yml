name: FSRE temporal identity lineage

on:
  pull_request:
    paths:
      - 'tools/fsre-temporal-identity-lineage/**'
      - 'research/fsre/TEMPORAL_IDENTITY_LINEAGE_BENCHMARK_V0_1.md'
      - '.github/workflows/fsre-temporal-identity-lineage.yml'
  push:
    branches: [main]
    paths:
      - 'tools/fsre-temporal-identity-lineage/**'
      - 'research/fsre/TEMPORAL_IDENTITY_LINEAGE_BENCHMARK_V0_1.md'
      - '.github/workflows/fsre-temporal-identity-lineage.yml'

permissions:
  contents: read

jobs:
  lineage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path tools/fsre-temporal-identity-lineage/Cargo.toml
      - name: Tests
        run: cargo test --locked --offline --manifest-path tools/fsre-temporal-identity-lineage/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --offline --manifest-path tools/fsre-temporal-identity-lineage/Cargo.toml --all-targets -- -D warnings
      - name: Deterministic CLI replay
        run: |
          cargo run --quiet --locked --offline --manifest-path tools/fsre-temporal-identity-lineage/Cargo.toml -- tools/fsre-temporal-identity-lineage/examples/water-works.psv 40 40 > /tmp/lineage-a.txt
          cargo run --quiet --locked --offline --manifest-path tools/fsre-temporal-identity-lineage/Cargo.toml -- tools/fsre-temporal-identity-lineage/examples/water-works.psv 40 40 > /tmp/lineage-b.txt
          cmp /tmp/lineage-a.txt /tmp/lineage-b.txt
