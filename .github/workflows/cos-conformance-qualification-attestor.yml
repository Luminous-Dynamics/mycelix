          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          TRUST_ROOT_MANIFEST_SHA256: ${{ needs.validate.outputs.trust_root_manifest_sha256 }}
          TRUST_ROOT_MANIFEST_BLOB_SHA1: ${{ needs.validate.outputs.trust_root_manifest_blob_sha1 }}
          TRUST_ROOT_MAIN_SNAPSHOT_SHA: ${{ needs.validate.outputs.trust_root_main_snapshot_sha }}
          TRUST_ROOT_CURRENT_MAIN_HEAD_SHA: ${{ steps.trust_root_post_signing.outputs.live_main_head_sha }}
        run: |
          test -s attestor-evidence/attestation-bundle-verification.json
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = {
              "schema": "MYCELIX-COS-QUALIFICATION-ATTESTOR-RECEIPT-V1",
              "predicate_type": os.environ["PREDICATE_TYPE"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "attestor": {
                  "workflow_ref": f"{os.environ['GITHUB_REPOSITORY']}/{os.environ['ATTESTOR_WORKFLOW_PATH']}@refs/heads/main",
                  "workflow_sha": os.environ["GITHUB_WORKFLOW_SHA"],
              },
              "trust_root": {
                  "manifest_path": ".github/cos/qualification-trust-root-v2.json",
                  "manifest_blob_sha1": os.environ["TRUST_ROOT_MANIFEST_BLOB_SHA1"],
                  "manifest_sha256": os.environ["TRUST_ROOT_MANIFEST_SHA256"],
                  "status": "candidate_not_authoritative_until_protected_adoption",
                  "main_snapshot_sha": os.environ["TRUST_ROOT_MAIN_SNAPSHOT_SHA"],
                  "current_main_head_sha": os.environ["TRUST_ROOT_CURRENT_MAIN_HEAD_SHA"],
              },
              "verifier_run": {
                  "workflow_id": int(os.environ["VERIFIER_WORKFLOW_ID"]),
                  "id": int(os.environ["VERIFIER_RUN_ID"]),
                  "attempt": int(os.environ["VERIFIER_RUN_ATTEMPT"]),
              },
              "qualification_topology": {
                  "head_sha": os.environ["EXPECTED_HEAD_SHA"],
                  "base_sha": os.environ["EXPECTED_BASE_SHA"],
              },
              "qualification_manifest_sha256": os.environ["MANIFEST_SHA256"],
              "predicate_sha256": os.environ["PREDICATE_SHA256"],
              "signing_input_artifact": {
                  "id": int(os.environ["INPUT_ARTIFACT_ID"]),
                  "digest": os.environ["INPUT_ARTIFACT_DIGEST"],
              },
              "attestation": {
                  "id": int(os.environ["ATTESTATION_ID"]),
                  "url": os.environ["ATTESTATION_URL"],
              },
          }
          bundle_path = Path("attestor-evidence/qualification-attestation-bundle.json")
          import hashlib
          receipt["attestation"]["bundle_sha256"] = hashlib.sha256(bundle_path.read_bytes()).hexdigest()
          Path("attestor-evidence/attestor-run-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          PY
          (
            cd attestor-evidence
            LC_ALL=C find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum

      - name: Validate attestor run receipt
        id: validate_receipt
        env:
          EXPECTED_HEAD_SHA: ${{ needs.validate.outputs.expected_head_sha }}
          EXPECTED_BASE_SHA: ${{ needs.validate.outputs.expected_base_sha }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.validate.outputs.manifest_sha256 }}
          EXPECTED_PREDICATE_SHA256: ${{ needs.validate.outputs.predicate_sha256 }}
          EXPECTED_INPUT_ARTIFACT_ID: ${{ needs.validate.outputs.signing_input_artifact_id }}
          EXPECTED_INPUT_ARTIFACT_DIGEST: ${{ needs.validate.outputs.signing_input_artifact_digest }}
          EXPECTED_ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          EXPECTED_ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          EXPECTED_TRUST_ROOT_SHA256: ${{ needs.validate.outputs.trust_root_manifest_sha256 }}
          EXPECTED_TRUST_ROOT_BLOB_SHA1: ${{ needs.validate.outputs.trust_root_manifest_blob_sha1 }}
          EXPECTED_MAIN_SNAPSHOT_SHA: ${{ needs.validate.outputs.trust_root_main_snapshot_sha }}
          EXPECTED_POST_SIGNING_MAIN_SHA: ${{ steps.trust_root_post_signing.outputs.live_main_head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s attestor-evidence/attestor-run-receipt.json
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          def reject_duplicate_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate JSON key: {key}")
                  result[key] = value
              return result

          def reject_nonstandard_constant(value):
              raise ValueError(f"non-standard JSON constant: {value}")

          def strict_json_loads(text):
              return json.loads(
                  text,
                  object_pairs_hook=reject_duplicate_keys,
                  parse_constant=reject_nonstandard_constant,
              )

          receipt = strict_json_loads(Path("attestor-evidence/attestor-run-receipt.json").read_text())
          expected_keys = {
              "schema", "predicate_type", "repository", "attestor", "trust_root",
              "verifier_run", "qualification_topology", "qualification_manifest_sha256",
              "predicate_sha256", "signing_input_artifact", "attestation",
          }
          assert set(receipt) == expected_keys
          assert set(receipt["attestor"]) == {"workflow_ref", "workflow_sha"}
          assert set(receipt["trust_root"]) == {
              "manifest_path", "manifest_blob_sha1", "manifest_sha256", "status",
              "main_snapshot_sha", "current_main_head_sha",
          }
          assert set(receipt["verifier_run"]) == {"workflow_id", "id", "attempt"}
          assert set(receipt["qualification_topology"]) == {"head_sha", "base_sha"}
          assert set(receipt["signing_input_artifact"]) == {"id", "digest"}
          assert set(receipt["attestation"]) == {"id", "url", "bundle_sha256"}

          sha40 = re.compile(r"^[0-9a-f]{40}$")
          sha64 = re.compile(r"^[0-9a-f]{64}$")
          assert receipt["schema"] == "MYCELIX-COS-QUALIFICATION-ATTESTOR-RECEIPT-V1"
          assert receipt["predicate_type"] == os.environ["PREDICATE_TYPE"]
          assert receipt["repository"] == os.environ["GITHUB_REPOSITORY"]
          assert receipt["attestor"]["workflow_ref"] == f"{os.environ['GITHUB_REPOSITORY']}/{os.environ['ATTESTOR_WORKFLOW_PATH']}@refs/heads/main"
          assert receipt["attestor"]["workflow_sha"] == os.environ["GITHUB_WORKFLOW_SHA"]
          assert receipt["trust_root"]["manifest_path"] == ".github/cos/qualification-trust-root-v2.json"
          assert receipt["trust_root"]["manifest_blob_sha1"] == os.environ["EXPECTED_TRUST_ROOT_BLOB_SHA1"]
          assert receipt["trust_root"]["manifest_sha256"] == os.environ["EXPECTED_TRUST_ROOT_SHA256"]
          assert receipt["trust_root"]["status"] == "candidate_not_authoritative_until_protected_adoption"
          assert receipt["trust_root"]["main_snapshot_sha"] == os.environ["EXPECTED_MAIN_SNAPSHOT_SHA"]
          assert receipt["trust_root"]["current_main_head_sha"] == os.environ["EXPECTED_POST_SIGNING_MAIN_SHA"]
          assert sha40.fullmatch(receipt["trust_root"]["manifest_blob_sha1"])
          assert sha64.fullmatch(receipt["trust_root"]["manifest_sha256"])
          assert sha40.fullmatch(receipt["trust_root"]["current_main_head_sha"])

          assert receipt["qualification_topology"]["head_sha"] == os.environ["EXPECTED_HEAD_SHA"]
          assert receipt["qualification_topology"]["base_sha"] == os.environ["EXPECTED_BASE_SHA"]
          assert sha64.fullmatch(receipt["qualification_manifest_sha256"])
          assert receipt["qualification_manifest_sha256"] == os.environ["EXPECTED_MANIFEST_SHA256"]
          assert sha64.fullmatch(receipt["predicate_sha256"])
          assert receipt["predicate_sha256"] == os.environ["EXPECTED_PREDICATE_SHA256"]
          assert receipt["signing_input_artifact"]["id"] == int(os.environ["EXPECTED_INPUT_ARTIFACT_ID"])
          assert receipt["signing_input_artifact"]["digest"] == os.environ["EXPECTED_INPUT_ARTIFACT_DIGEST"]
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", receipt["signing_input_artifact"]["digest"])
          assert receipt["attestation"]["id"] == int(os.environ["EXPECTED_ATTESTATION_ID"])
          assert receipt["attestation"]["url"] == os.environ["EXPECTED_ATTESTATION_URL"]
          assert receipt["attestation"]["url"].startswith("https://github.com/")
          assert sha64.fullmatch(receipt["attestation"]["bundle_sha256"])

          verifier_run = receipt["verifier_run"]
          assert verifier_run["workflow_id"] > 0
          assert verifier_run["id"] > 0
          assert verifier_run["attempt"] > 0

          manifest_path = Path("signing-input/qualification-manifest-v1.json")
          predicate_path = Path("signing-input/qualification-attestation-predicate-v1.json")
          bundle_path = Path("attestor-evidence/qualification-attestation-bundle.json")
          assert hashlib.sha256(manifest_path.read_bytes()).hexdigest() == receipt["qualification_manifest_sha256"]
          assert hashlib.sha256(predicate_path.read_bytes()).hexdigest() == receipt["predicate_sha256"]
          assert hashlib.sha256(bundle_path.read_bytes()).hexdigest() == receipt["attestation"]["bundle_sha256"]
          PY

      - name: Seal attestor evidence
        id: seal_attestor_evidence
        run: |
          set -euo pipefail
          (
            cd attestor-evidence
            LC_ALL=C find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum
          ) > attestor-evidence/SHA256SUMS
      - name: Preserve attestor evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cos-conformance-qualification-attestation-${{ needs.validate.outputs.expected_head_sha }}
          path: attestor-evidence/
          if-no-files-found: error
          retention-days: 30
