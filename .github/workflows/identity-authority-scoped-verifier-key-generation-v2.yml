name: Identity Authority-Scoped Verifier Key Generation V2

on:
  pull_request:
    paths:
      - 'mycelix-workspace/mycelix-identity/Cargo.toml'
      - 'mycelix-workspace/mycelix-identity/crates/identity-authority-domain-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/kvector-verifier-key-generation-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/authority-scoped-verifier-key-generation-policy/**'
      - '.github/workflows/identity-authority-scoped-verifier-key-generation-v2.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-workspace/mycelix-identity/Cargo.toml'
      - 'mycelix-workspace/mycelix-identity/crates/identity-authority-domain-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/kvector-verifier-key-generation-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/authority-scoped-verifier-key-generation-policy/**'
      - '.github/workflows/identity-authority-scoped-verifier-key-generation-v2.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify-authority-scoped-generation-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Assert authority-scoped generation boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          root = Path('mycelix-workspace/mycelix-identity')
          member = 'crates/authority-scoped-verifier-key-generation-policy'
          workspace = tomllib.loads((root / 'Cargo.toml').read_text())
          if member not in workspace['workspace']['members']:
              raise SystemExit(f'ERROR: {member} is not an explicit Identity workspace member')

          manifest = tomllib.loads((root / member / 'Cargo.toml').read_text())
          deps = manifest.get('dependencies', {})
          expected = {
              'mycelix-identity-authority-domain-policy',
              'mycelix-kvector-verifier-key-generation-policy',
              'sha2',
          }
          if set(deps) != expected:
              raise SystemExit(f'ERROR: scoped-generation dependency boundary drifted: {sorted(deps)}')
          if deps['mycelix-identity-authority-domain-policy'].get('path') != '../identity-authority-domain-policy':
              raise SystemExit('ERROR: scoped generation must bind canonical #369 domain theorem')
          if deps['mycelix-kvector-verifier-key-generation-policy'].get('path') != '../kvector-verifier-key-generation-policy':
              raise SystemExit('ERROR: scoped generation must bind canonical #316 generation theorem')
          if deps['sha2'].get('workspace') is not True:
              raise SystemExit('ERROR: scoped generation must use workspace sha2')

          dev = manifest.get('dev-dependencies', {})
          if set(dev) != {'mycelix-crypto'} or dev['mycelix-crypto'].get('workspace') is not True:
              raise SystemExit(f'ERROR: scoped-generation dev dependency boundary drifted: {dev}')

          text = (root / member / 'src/lib.rs').read_text()
          required = [
              '#![forbid(unsafe_code)]',
              'QualifiedIdentityAuthorityDomainV2',
              'KVectorVerifierKeyGenerationV2',
              'derive_kvector_verifier_key_generation_digest_v2',
              'AUTHORITY_SCOPED_VERIFIER_KEY_GENERATION_DOMAIN_V2',
              'mycelix:identity:kvector-verifier-key-generation:authority-scoped:v2\\0',
              'QualifiedAuthorityScopedVerifierKeyGenerationV2',
              'derive_authority_scoped_verifier_key_generation_digest_v2',
              'qualify_authority_scoped_verifier_key_generation_v2',
              'authority_domain.digest_sha256()',
              'same_intrinsic_generation_in_different_dna_is_different_scoped_identity',
              'same_dna_under_different_epoch_is_different_scoped_identity',
              'intrinsic_generation_validation_is_not_bypassed',
              'qualified_scoped_generation_fields_are_verifier_owned',
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'ERROR: scoped-generation theorem missing: {needle!r}')

          result_start = text.index('pub struct QualifiedAuthorityScopedVerifierKeyGenerationV2')
          result_end = text.index('impl QualifiedAuthorityScopedVerifierKeyGenerationV2', result_start)
          result_body = text[result_start:result_end]
          for public_field in [
              'pub authority_domain_digest_sha256:',
              'pub intrinsic_generation_digest_sha256:',
              'pub scoped_generation_digest_sha256:',
          ]:
              if public_field in result_body:
                  raise SystemExit(f'ERROR: scoped-generation success field is forgeable: {public_field}')

          lower = text.lower()
          for forbidden in [
              'use hdk', 'use hdi', 'hdk::', 'hdi::', 'dna_info(', 'network_seed',
              'sys_time(', 'std::time', '.verify(', 'policy_current', 'policy_accepted',
              'positive_evidence', 'max_by_key', 'resolve_did(',
          ]:
              if forbidden in lower:
                  raise SystemExit(f'ERROR: runtime/currentness/signature authority leaked into scoped generation: {forbidden!r}')
          PY

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-workspace/mycelix-identity

      - name: Check formatting
        run: |
          cargo fmt --manifest-path mycelix-workspace/mycelix-identity/crates/authority-scoped-verifier-key-generation-policy/Cargo.toml -- --check

      - name: Test authority-domain theorem
        run: |
          cargo test --manifest-path mycelix-workspace/mycelix-identity/crates/identity-authority-domain-policy/Cargo.toml

      - name: Test intrinsic generation theorem
        run: |
          cargo test --manifest-path mycelix-workspace/mycelix-identity/crates/kvector-verifier-key-generation-policy/Cargo.toml

      - name: Test authority-scoped generation theorem
        run: |
          cargo test --manifest-path mycelix-workspace/mycelix-identity/crates/authority-scoped-verifier-key-generation-policy/Cargo.toml

      - name: Check authority-scoped generation for wasm32
        run: |
          cargo check --manifest-path mycelix-workspace/mycelix-identity/crates/authority-scoped-verifier-key-generation-policy/Cargo.toml --target wasm32-unknown-unknown
