name: IG-007C0 Governance Config Authority Profile

on:
  pull_request:
    paths:
      - "mycelix-governance/profiles/observed/governance-config-fca2c107-v1.json"
      - "mycelix-governance/scripts/validate_ig007c0_governance_config_profile.py"
      - "mycelix-governance/docs/IG_007C0_GOVERNANCE_CONFIG_AUTHORITY_PROFILE.md"
      - ".github/workflows/ig-007c0-governance-config-profile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-config-authority-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SUBJECT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      PROFILE_SHA256: de4435a69356557b1812f8beb46d654c66b9c957be9d18c64bd0431f92546d5a

    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SUBJECT }}
          fetch-depth: 1

      - name: Install Python 3.13.5
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Verify exact checkout and source bindings
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SUBJECT"
          test -z "$(git status --porcelain)"
          test "$(git hash-object mycelix-governance/zomes/bridge/coordinator/src/consciousness_config.rs)" = "26da234e588bf26d0e25c10dbec34502e00c191a"
          test "$(git hash-object mycelix-governance/zomes/bridge/integrity/src/lib.rs)" = "61b20610216e2fd69c701ecaea5322c448eda119"
          test "$(git hash-object mycelix-governance/zomes/proposals/coordinator/src/lib.rs)" = "eb8358353ee259ef9c3b46617a61d3439f1c714c"
          test "$(git hash-object mycelix-governance/zomes/proposals/integrity/src/lib.rs)" = "986bc0526aec8d37436efbe5ba798bc41705e3cf"

      - name: Syntax compile validator
        run: python -m py_compile mycelix-governance/scripts/validate_ig007c0_governance_config_profile.py

      - name: Validate twice byte-identically
        shell: bash
        run: |
          set -euo pipefail
          python mycelix-governance/scripts/validate_ig007c0_governance_config_profile.py \
            --profile mycelix-governance/profiles/observed/governance-config-fca2c107-v1.json \
            --self-test > /tmp/ig007c0-1.json
          python mycelix-governance/scripts/validate_ig007c0_governance_config_profile.py \
            --profile mycelix-governance/profiles/observed/governance-config-fca2c107-v1.json \
            --self-test > /tmp/ig007c0-2.json
          cmp /tmp/ig007c0-1.json /tmp/ig007c0-2.json

      - name: Assert frozen commitment and authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          with open('/tmp/ig007c0-1.json', encoding='utf-8') as f:
              result = json.load(f)
          assert result['validated'] is True
          assert result['self_test'] is True
          assert result['authority_class'] == 'ObservedSourceBound'
          assert result['profile_id'] == 'mycelix-governance-config-observed-fca2c107-v1'
          assert result['profile_revision'] == 1
          assert result['profile_content_sha256'] == 'de4435a69356557b1812f8beb46d654c66b9c957be9d18c64bd0431f92546d5a'
          assert result['known_gap_issue'] == 943
          PY

      - name: Verify checkout immutability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SUBJECT"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain)"
