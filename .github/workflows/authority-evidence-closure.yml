name: Authority Evidence Closure

on:
  pull_request:
    paths:
      - 'crates/mycelix-authority-evidence-closure/**'
      - 'crates/mycelix-authority-runtime-dna-binding/**'
      - 'crates/mycelix-authority-current-operational/**'
      - 'crates/mycelix-authority-control-plane-freshness/**'
      - 'crates/mycelix-authority-state-bootstrap-root/**'
      - '.github/workflows/authority-evidence-closure.yml'
  push:
    branches:
      - 'security/authority-evidence-closure-v0.1'

permissions:
  contents: read

concurrency:
  group: authority-evidence-closure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: Complete current-authority proof provenance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --manifest-path crates/mycelix-authority-evidence-closure/Cargo.toml -- --check

      - name: Tests
        run: cargo test --manifest-path crates/mycelix-authority-evidence-closure/Cargo.toml --all-targets

      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-authority-evidence-closure/Cargo.toml --all-targets -- -D warnings

      - name: Downstream authority compatibility
        run: |
          cargo check --manifest-path crates/mycelix-authority-runtime-dna-binding/Cargo.toml --all-targets
          cargo check --manifest-path crates/mycelix-authority-current-operational/Cargo.toml --all-targets
          cargo check --manifest-path crates/mycelix-authority-control-plane-freshness/Cargo.toml --all-targets

      - name: Complete evidence authority audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('crates/mycelix-authority-evidence-closure/src/lib.rs').read_text()
          inv = Path('crates/mycelix-authority-evidence-closure/INVARIANTS.md').read_text().lower()

          required = [
              'qualify_complete_deployment_authority',
              'qualify_current_authority_for_local_dna(evidence, local_dna, now_ms)',
              'qualify_bootstrap_root(',
              'qualify_control_plane_subject_freshness(',
              'proof.subject().identity_digest()',
              'proof.qualification_digest()',
              'items.sort_by(',
              'DuplicateControlPlaneSubject',
              'runtime_authority.deployment_qualification_digest()',
              'runtime_authority.deployment_evidence_digest()',
              'control_plane_evidence_digest',
              'complete_evidence_digest',
              'COMPLETE_EVIDENCE_PROFILE',
          ]
          for token in required:
              assert token in src, token

          # Stable authority must be delegated to #123 rather than redefined from
          # fresh proof instances in this closure layer.
          for forbidden in [
              'semantic_qualification_digest: Digest32,',
              '#[hdk_extern]',
              'hdk::',
              'call_remote(',
              'create_entry(',
              'get_links(',
              'project_authority_state_as_of(',
              'execute_actions',
          ]:
              assert forbidden not in src, forbidden

          prefix = src.split('pub struct QualifiedCompleteDeploymentAuthority', 1)[0]
          assert 'Serialize)]' in prefix[-180:]
          assert 'Deserialize' not in prefix[-180:]

          assert 'stable deployment authority is upstream and unchanged' in inv
          assert 'control-plane proof instances are requalified' in inv
          assert 'canonical control-plane evidence identity' in inv
          assert 'control-plane proof refresh changes evidence, not authority' in inv
          assert 'target proof and local-dna proof remain committed through #123' in inv
          print('PASS: final dynamic evidence closes target, local-DNA, and canonical control-plane proof provenance without changing authority identity')
          PY
