name: Identity Runtime-Bound Precrypto Context V2

on:
  pull_request:
    paths:
      - 'mycelix-workspace/mycelix-identity/Cargo.toml'
      - 'mycelix-workspace/mycelix-identity/crates/authority-scoped-precrypto-context-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/identity-runtime-authority-domain-adapter/**'
      - 'mycelix-workspace/mycelix-identity/crates/identity-runtime-precrypto-context-adapter/**'
      - '.github/workflows/identity-runtime-bound-precrypto-context-v2.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-workspace/mycelix-identity/Cargo.toml'
      - 'mycelix-workspace/mycelix-identity/crates/authority-scoped-precrypto-context-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/identity-runtime-authority-domain-adapter/**'
      - 'mycelix-workspace/mycelix-identity/crates/identity-runtime-precrypto-context-adapter/**'
      - '.github/workflows/identity-runtime-bound-precrypto-context-v2.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify-runtime-bound-precrypto-context-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Assert single-owner runtime binding boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          root = Path('mycelix-workspace/mycelix-identity')
          member = 'crates/identity-runtime-precrypto-context-adapter'
          workspace = tomllib.loads((root / 'Cargo.toml').read_text())
          if member not in workspace['workspace']['members']:
              raise SystemExit(f'ERROR: {member} is not an explicit Identity workspace member')

          manifest = tomllib.loads((root / member / 'Cargo.toml').read_text())
          deps = manifest.get('dependencies', {})
          expected = {
              'hdk',
              'mycelix-authority-scoped-precrypto-context-policy',
              'mycelix-identity-runtime-authority-domain-adapter',
              'sha2',
          }
          if set(deps) != expected:
              raise SystemExit(f'ERROR: runtime-precrypto dependency drift: {sorted(deps)}')
          if deps['hdk'].get('workspace') is not True or deps['sha2'].get('workspace') is not True:
              raise SystemExit('ERROR: runtime-precrypto adapter must use workspace hdk/sha2')
          if deps['mycelix-authority-scoped-precrypto-context-policy'].get('path') != '../authority-scoped-precrypto-context-policy':
              raise SystemExit('ERROR: runtime-precrypto adapter must bind #379')
          if deps['mycelix-identity-runtime-authority-domain-adapter'].get('path') != '../identity-runtime-authority-domain-adapter':
              raise SystemExit('ERROR: runtime-precrypto adapter must consume #382 runtime provenance')

          text = (root / member / 'src/lib.rs').read_text()
          required = [
              '#![forbid(unsafe_code)]',
              'RuntimeBoundAuthorityScopedPrecryptoContextV2',
              'RUNTIME_BOUND_PRECRYPTO_CONTEXT_DOMAIN_V2',
              'mycelix:identity:runtime-bound-precrypto-context:v2\\0',
              'qualify_running_authority_scoped_precrypto_context_v2',
              'qualify_running_identity_authority_domain_v2()?;',
              'runtime_domain.authority_domain_digest_sha256()',
              'precrypto_context.authority_domain_digest_sha256()',
              'precrypto_context.precrypto_context_digest_sha256()',
              'derive_runtime_bound_precrypto_context_digest_v2',
              '0xb1, 0x0f, 0x10, 0x00',
              'runtime_domain_equality_fails_closed',
              'runtime_bound_capability_fields_are_private',
              'public_qualification_accepts_only_precrypto_context',
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'ERROR: runtime-precrypto invariant missing: {needle!r}')

          result_start = text.index('pub struct RuntimeBoundAuthorityScopedPrecryptoContextV2')
          result_end = text.index('impl RuntimeBoundAuthorityScopedPrecryptoContextV2', result_start)
          result_body = text[result_start:result_end]
          for public_field in [
              'pub authority_domain_digest_sha256:',
              'pub precrypto_context_digest_sha256:',
              'pub runtime_bound_context_digest_sha256:',
          ]:
              if public_field in result_body:
                  raise SystemExit(f'ERROR: runtime-bound context is forgeable: {public_field}')

          public_start = text.index('pub fn qualify_running_authority_scoped_precrypto_context_v2(')
          public_end = text.index(') -> ExternResult<RuntimeBoundAuthorityScopedPrecryptoContextV2>', public_start)
          signature = text[public_start:public_end]
          if 'precrypto_context: &QualifiedAuthorityScopedPrecryptoContextV2' not in signature:
              raise SystemExit('ERROR: public runtime binding lost #379 opaque input')
          for forbidden_input in ['DnaHash', 'RuntimeQualifiedIdentityAuthorityDomainV2', 'authority_domain_digest_sha256:']:
              if forbidden_input in signature:
                  raise SystemExit(f'ERROR: caller can substitute runtime-domain evidence: {forbidden_input!r}')

          lower = text.lower()
          for forbidden in [
              'dna_info(',
              'get_raw_39(',
              'network_seed',
              '#[hdk_extern]',
              'get_agent_activity(',
              'get_details(',
              'get_links(',
              'resolve_did(',
              'sys_time(',
              '.verify(',
              'signature_verified',
              'policy_current',
              'policy_accepted',
              'positive_evidence',
          ]:
              if forbidden in lower:
                  raise SystemExit(f'ERROR: acquisition/record/currentness/crypto semantics leaked into runtime-precrypto adapter: {forbidden!r}')
          PY

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-workspace/mycelix-identity

      - name: Check formatting
        run: |
          cargo fmt --manifest-path mycelix-workspace/mycelix-identity/crates/identity-runtime-precrypto-context-adapter/Cargo.toml -- --check

      - name: Test pure pre-crypto context theorem
        run: |
          cargo test --manifest-path mycelix-workspace/mycelix-identity/crates/authority-scoped-precrypto-context-policy/Cargo.toml

      - name: Test runtime authority-domain adapter
        run: |
          cargo test --manifest-path mycelix-workspace/mycelix-identity/crates/identity-runtime-authority-domain-adapter/Cargo.toml

      - name: Test runtime-bound context adapter
        run: |
          cargo test --manifest-path mycelix-workspace/mycelix-identity/crates/identity-runtime-precrypto-context-adapter/Cargo.toml

      - name: Check runtime-bound context adapter for wasm32
        run: |
          cargo check --manifest-path mycelix-workspace/mycelix-identity/crates/identity-runtime-precrypto-context-adapter/Cargo.toml --target wasm32-unknown-unknown
