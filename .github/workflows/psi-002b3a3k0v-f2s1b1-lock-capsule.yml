name: PSI-002B3A3K0V-F2S1b1 lock capsule

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'qualification/psi-002b3a3k0v-f2s1-validator/**'
      - '.github/workflows/psi-002b3a3k0v-f2s1b1-lock-capsule.yml'

permissions:
  contents: read

jobs:
  generate-lock-capsule:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record runner environment
        run: |
          uname -a > runner-uname.txt
          cat /etc/os-release > runner-os-release.txt
          python3 --version > runner-python-version.txt

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustc +1.96.0 --version --verbose
          cargo +1.96.0 --version --verbose

      - name: Generate standalone lockfile
        working-directory: qualification/psi-002b3a3k0v-f2s1-validator
        run: |
          rm -f Cargo.lock
          cargo +1.96.0 generate-lockfile --manifest-path Cargo.toml
          test -s Cargo.lock
          sha256sum Cargo.lock | tee Cargo.lock.sha256

      - name: Freeze dependency/source inventory
        working-directory: qualification/psi-002b3a3k0v-f2s1-validator
        run: |
          cargo +1.96.0 metadata --manifest-path Cargo.toml --locked --format-version 1 > cargo-metadata.json
          cargo +1.96.0 tree --manifest-path Cargo.toml --locked > cargo-tree.txt
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path

          meta = json.loads(Path("cargo-metadata.json").read_text())
          packages = []
          for p in sorted(meta["packages"], key=lambda x: x["id"]):
              packages.append({
                  "id": p["id"],
                  "name": p["name"],
                  "version": p["version"],
                  "source": p.get("source"),
                  "checksum": p.get("checksum"),
                  "edition": p["edition"],
                  "rust_version": p.get("rust_version"),
                  "manifest_path": str(Path(p["manifest_path"]).relative_to(Path(meta["workspace_root"]))),
              })
          inventory = {
              "schema": "psi-002b3a3k0v-f2s1b1-dependency-source-inventory.v1",
              "toolchain": "1.96.0",
              "manifest_sha256": hashlib.sha256(Path("Cargo.toml").read_bytes()).hexdigest(),
              "lock_sha256": hashlib.sha256(Path("Cargo.lock").read_bytes()).hexdigest(),
              "packages": packages,
          }
          raw = json.dumps(inventory, sort_keys=True, separators=(",", ":")).encode()
          Path("dependency-source-inventory.v1.json").write_bytes(raw + b"\n")
          Path("dependency-source-inventory.v1.sha256").write_text(
              hashlib.sha256(raw + b"\n").hexdigest() + "  dependency-source-inventory.v1.json\n"
          )
          PY

      - name: Verify locked/offline metadata after capsule generation
        working-directory: qualification/psi-002b3a3k0v-f2s1-validator
        run: |
          cargo +1.96.0 fetch --manifest-path Cargo.toml --locked
          cargo +1.96.0 metadata --manifest-path Cargo.toml --locked --offline --format-version 1 > metadata-offline.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          def canonical(path):
              value = json.loads(Path(path).read_text())
              root = value["workspace_root"]
              target = value["target_directory"]
              def normalize(item):
                  if isinstance(item, str):
                      return item.replace(root, "$WORKSPACE").replace(target, "$TARGET")
                  if isinstance(item, list):
                      return [normalize(x) for x in item]
                  if isinstance(item, dict):
                      return {k: normalize(v) for k, v in item.items()}
                  return item
              return json.dumps(normalize(value), sort_keys=True, separators=(",", ":"))

          assert canonical("cargo-metadata.json") == canonical("metadata-offline.json"), "locked/offline metadata differs"
          Path("cargo-metadata.canonical.json").write_text(canonical("cargo-metadata.json") + "\\n")
          PY

      - name: Package capsule
        run: |
          mkdir -p capsule
          cp qualification/psi-002b3a3k0v-f2s1-validator/Cargo.toml capsule/
          cp qualification/psi-002b3a3k0v-f2s1-validator/Cargo.lock capsule/
          cp qualification/psi-002b3a3k0v-f2s1-validator/Cargo.lock.sha256 capsule/
          cp qualification/psi-002b3a3k0v-f2s1-validator/cargo-metadata.canonical.json capsule/
          cp qualification/psi-002b3a3k0v-f2s1-validator/cargo-tree.txt capsule/
          cp qualification/psi-002b3a3k0v-f2s1-validator/dependency-source-inventory.v1.json capsule/
          cp qualification/psi-002b3a3k0v-f2s1-validator/dependency-source-inventory.v1.sha256 capsule/
          cp runner-uname.txt runner-os-release.txt runner-python-version.txt capsule/
          rustc +1.96.0 --version --verbose > capsule/rustc-1.96.0.txt
          cargo +1.96.0 --version --verbose > capsule/cargo-1.96.0.txt
          sha256sum capsule/* | sort > capsule/manifest.sha256

      - name: Upload lock capsule
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: psi-002b3a3k0v-f2s1b1-lock-capsule
          path: capsule/
          if-no-files-found: error
          retention-days: 14
