name: FSRE public source-register reference
on:
  pull_request:
    paths:
      - "research/fsre/ZA_PUBLIC_SOURCE_REGISTER_V0_1.psv"
      - "tools/fsre-source-register/**"
      - ".github/workflows/fsre-source-register.yml"
  push:
    branches:
      - main
    paths:
      - "research/fsre/ZA_PUBLIC_SOURCE_REGISTER_V0_1.psv"
      - "tools/fsre-source-register/**"
      - ".github/workflows/fsre-source-register.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path tools/fsre-source-register/Cargo.toml --all -- --check
      - name: Run deterministic tests
        run: cargo test --locked --offline --manifest-path tools/fsre-source-register/Cargo.toml
      - name: Verify public source register
        shell: bash
        run: |
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          cargo run --locked --offline --manifest-path tools/fsre-source-register/Cargo.toml -- research/fsre/ZA_PUBLIC_SOURCE_REGISTER_V0_1.psv > "$output"
          diff -u tools/fsre-source-register/fixtures/expected-report.txt "$output"
      - name: Run Clippy
        run: cargo clippy --locked --offline --manifest-path tools/fsre-source-register/Cargo.toml --all-targets -- -D warnings
