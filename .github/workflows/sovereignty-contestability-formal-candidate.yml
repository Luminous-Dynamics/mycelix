name: Sovereignty effective contestability formal candidate

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/qualification/SOVEREIGNTY_CONTESTABILITY_FORMAL_QUALIFICATION_PROFILE_V1.json'
      - 'docs/qualification/SOVEREIGNTY_CONTESTABILITY_FORMAL_CROSSWALK_V1.json'
      - 'mycelix-governance/tools/formal/test_effective_contestability_control_matrix.py'
      - 'docs/qualification/SOVEREIGNTY_CONTESTABILITY_FORMAL_CONTROL_MATRIX_V1.json'
      - 'mycelix-governance/tools/formal/test_effective_contestability_control_matrix.py'
      - 'docs/qualification/SOVEREIGNTY_CONTESTABILITY_FORMAL_CONTROL_MATRIX_V1.json'
      - 'mycelix-governance/tools/formal/effective_contestability_pins.json'
      - 'mycelix-governance/tools/formal/qualify_effective_contestability.py'
      - 'docs/qualification/fixtures/effective-contestability/EffectiveContestabilityV1.tla'
      - 'docs/qualification/fixtures/effective-contestability/EffectiveContestabilityV1.cfg'
      - 'docs/qualification/fixtures/effective-contestability/EffectiveContestabilityV1NegativeControls.tla'
      - 'docs/qualification/fixtures/effective-contestability/EffectiveContestabilityV1.als'
      - 'docs/qualification/fixtures/effective-contestability/EffectiveContestabilityAlloyRunner.java'
      - 'docs/qualification/fixtures/effective-contestability/effective_contestability_reference_explorer.py'
      - '.github/workflows/sovereignty-contestability-formal-candidate.yml'
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [qual-sov-ai-contestability-v1]
    paths:
      - 'docs/qualification/SOVEREIGNTY_CONTESTABILITY_FORMAL_QUALIFICATION_PROFILE_V1.json'
      - 'docs/qualification/SOVEREIGNTY_CONTESTABILITY_FORMAL_CROSSWALK_V1.json'
      - 'mycelix-governance/tools/formal/test_effective_contestability_control_matrix.py'
      - 'docs/qualification/SOVEREIGNTY_CONTESTABILITY_FORMAL_CONTROL_MATRIX_V1.json'
      - 'mycelix-governance/tools/formal/effective_contestability_pins.json'
      - 'mycelix-governance/tools/formal/qualify_effective_contestability.py'
      - 'docs/qualification/fixtures/effective-contestability/EffectiveContestabilityV1.tla'
      - 'docs/qualification/fixtures/effective-contestability/EffectiveContestabilityV1.cfg'
      - 'docs/qualification/fixtures/effective-contestability/EffectiveContestabilityV1NegativeControls.tla'
      - 'docs/qualification/fixtures/effective-contestability/EffectiveContestabilityV1.als'
      - 'docs/qualification/fixtures/effective-contestability/EffectiveContestabilityAlloyRunner.java'
      - 'docs/qualification/fixtures/effective-contestability/effective_contestability_reference_explorer.py'
      - '.github/workflows/sovereignty-contestability-formal-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NIXPKGS_REV: a50bf0c1b07873c1a53892292017041a8f0a1288
  TLA_URL: https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
  TLA_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
  ALLOY_URL: https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/org.alloytools.alloy.dist.jar
  ALLOY_SHA256: 6b8c1cb5bc93bedfc7c61435c4e1ab6e688a242dc702a394628d9a9801edb78d

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact candidate head
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Validate source syntax
        run: |
          set -euo pipefail
          python3 -m py_compile mycelix-governance/tools/formal/qualify_effective_contestability.py docs/qualification/fixtures/effective-contestability/effective_contestability_reference_explorer.py mycelix-governance/tools/formal/test_effective_contestability_control_matrix.py
          python3 -m json.tool docs/qualification/SOVEREIGNTY_CONTESTABILITY_FORMAL_QUALIFICATION_PROFILE_V1.json >/dev/null
          python3 -m json.tool docs/qualification/SOVEREIGNTY_CONTESTABILITY_FORMAL_CROSSWALK_V1.json >/dev/null
          python3 -m json.tool mycelix-governance/tools/formal/effective_contestability_pins.json >/dev/null

      - name: Verify cross-model control matrix
        run: |
          set -euo pipefail
          python3 mycelix-governance/tools/formal/test_effective_contestability_control_matrix.py \
            --matrix docs/qualification/SOVEREIGNTY_CONTESTABILITY_FORMAL_CONTROL_MATRIX_V1.json \
            --tla docs/qualification/fixtures/effective-contestability/EffectiveContestabilityV1.tla \
            --negative-tla docs/qualification/fixtures/effective-contestability/EffectiveContestabilityV1NegativeControls.tla \
            --alloy docs/qualification/fixtures/effective-contestability/EffectiveContestabilityV1.als \
            --reference docs/qualification/fixtures/effective-contestability/effective_contestability_reference_explorer.py

      - name: Install pinned Nix toolchain
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Download and hash formal tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/contestability-tools"
          nix shell "github:NixOS/nixpkgs/$NIXPKGS_REV#curl" "github:NixOS/nixpkgs/$NIXPKGS_REV#coreutils" --command bash -euo pipefail -c '
            curl --fail --location --retry 3 --retry-all-errors --output "$RUNNER_TEMP/contestability-tools/tla2tools.jar" "$TLA_URL"
            curl --fail --location --retry 3 --retry-all-errors --output "$RUNNER_TEMP/contestability-tools/alloy.jar" "$ALLOY_URL"
            printf "%s  %s\n" "$TLA_SHA256" "$RUNNER_TEMP/contestability-tools/tla2tools.jar" | sha256sum --check --strict
            printf "%s  %s\n" "$ALLOY_SHA256" "$RUNNER_TEMP/contestability-tools/alloy.jar" | sha256sum --check --strict
          '

      - name: Compile Alloy runner and capture runtime
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/contestability-java" "$RUNNER_TEMP/contestability-evidence"
          nix shell "github:NixOS/nixpkgs/$NIXPKGS_REV#jdk17_headless" --command bash -euo pipefail -c '
            java_version="$(java -version 2>&1 | head -n 1)"
            javac_version="$(javac -version 2>&1 | head -n 1)"
            java_json="${java_version//\\/\\\\}"
            java_json="${java_json//\"/\\\"}"
            javac_json="${javac_version//\\/\\\\}"
            javac_json="${javac_json//\"/\\\"}"
            printf "{\\"schema\\":\\"mycelix.effective-contestability-formal-runtime.v1\\",\\"nixpkgs_rev\\":\\"%s\\",\\"jdk_package\\":\\"jdk17_headless\\",\\"java_major\\":17,\\"java_version\\":\\"%s\\",\\"javac_version\\":\\"%s\\"}\\n" "$NIXPKGS_REV" "$java_json" "$javac_json" > "$RUNNER_TEMP/contestability-evidence/runtime.json"
            javac -cp "$RUNNER_TEMP/contestability-tools/alloy.jar" -d "$RUNNER_TEMP/contestability-java" docs/qualification/fixtures/effective-contestability/EffectiveContestabilityAlloyRunner.java
          '

      - name: Execute candidate formal classifier
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/contestability-evidence"
          nix shell "github:NixOS/nixpkgs/$NIXPKGS_REV#jdk17_headless" "github:NixOS/nixpkgs/$NIXPKGS_REV#coreutils" --command bash -euo pipefail -c '
            python3 mycelix-governance/tools/formal/qualify_effective_contestability.py --profile docs/qualification/SOVEREIGNTY_CONTESTABILITY_FORMAL_QUALIFICATION_PROFILE_V1.json --pins mycelix-governance/tools/formal/effective_contestability_pins.json --control-matrix docs/qualification/SOVEREIGNTY_CONTESTABILITY_FORMAL_CONTROL_MATRIX_V1.json --tla docs/qualification/fixtures/effective-contestability/EffectiveContestabilityV1.tla --cfg docs/qualification/fixtures/effective-contestability/EffectiveContestabilityV1.cfg --negative-tla docs/qualification/fixtures/effective-contestability/EffectiveContestabilityV1NegativeControls.tla --alloy docs/qualification/fixtures/effective-contestability/EffectiveContestabilityV1.als --alloy-runner-java docs/qualification/fixtures/effective-contestability/EffectiveContestabilityAlloyRunner.java --alloy-runner-class "$RUNNER_TEMP/contestability-java/EffectiveContestabilityAlloyRunner.class" --alloy-runner-class-dir "$RUNNER_TEMP/contestability-java" --tla-jar "$RUNNER_TEMP/contestability-tools/tla2tools.jar" --alloy-jar "$RUNNER_TEMP/contestability-tools/alloy.jar" --evidence-dir "$RUNNER_TEMP/contestability-evidence" --workflow .github/workflows/sovereignty-contestability-formal-candidate.yml --crosswalk docs/qualification/SOVEREIGNTY_CONTESTABILITY_FORMAL_CROSSWALK_V1.json --reference-explorer docs/qualification/fixtures/effective-contestability/effective_contestability_reference_explorer.py --runtime-metadata "$RUNNER_TEMP/contestability-evidence/runtime.json"
          '

      - name: Verify repository postflight
        if: always()
        run: |
          set -euo pipefail
          test "$(git status --porcelain)" = ""

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sovereignty-contestability-candidate-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/contestability-evidence
          if-no-files-found: warn
          retention-days: 30
