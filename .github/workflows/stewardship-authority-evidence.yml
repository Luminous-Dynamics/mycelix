name: Stewardship Authority Evidence Qualification

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'crates/mycelix-stewardship-core/**'
      - 'crates/mycelix-stewardship-authority-evidence/**'
      - '.github/workflows/stewardship-authority-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stewardship-authority-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_PARENT_SHA: 5ee5d2476401ea85312c61be8c1f9bc7f57f8c47
      EXPECTED_PARENT_TREE: 92ee39c8ef7f8808a9bd0c497c5063a1984ae4d9
      EXPECTED_PARENT_RUN_ID: '35499256994'
      EXPECTED_PARENT_RUN_ATTEMPT: '1'
      EXPECTED_PARENT_JOB_ID: '106047949046'
      EXPECTED_PARENT_WORKFLOW_PATH: .github/workflows/stewardship-core.yml
      EXPECTED_PARENT_PR: '1759'
      CARGO_NET_OFFLINE: 'true'
    steps:
      - name: Checkout exact proposed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Bind exact child and parent geometry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$(git show -s --format=%T "$EXPECTED_PARENT_SHA")" = "$EXPECTED_PARENT_TREE"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_PARENT_SHA"..HEAD | sort)
          expected=(
            '.github/workflows/stewardship-authority-evidence.yml'
            'crates/mycelix-stewardship-authority-evidence/Cargo.toml'
            'crates/mycelix-stewardship-authority-evidence/README.md'
            'crates/mycelix-stewardship-authority-evidence/src/lib.rs'
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done

      - name: Verify exact successful STEW-001 parent qualification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          run_id = os.environ['EXPECTED_PARENT_RUN_ID']
          attempt = int(os.environ['EXPECTED_PARENT_RUN_ATTEMPT'])
          job_id = int(os.environ['EXPECTED_PARENT_JOB_ID'])
          parent_sha = os.environ['EXPECTED_PARENT_SHA']
          parent_tree = os.environ['EXPECTED_PARENT_TREE']
          workflow_path = os.environ['EXPECTED_PARENT_WORKFLOW_PATH']
          pr_number = int(os.environ['EXPECTED_PARENT_PR'])
          token = os.environ['GH_TOKEN']

          def get(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          run = get(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}')
          assert run['id'] == int(run_id)
          assert run['status'] == 'completed'
          assert run['conclusion'] == 'success'
          assert run['run_attempt'] == attempt
          assert run['head_sha'] == parent_sha
          assert run['path'] == workflow_path
          assert run['event'] == 'pull_request'
          assert run['head_commit']['tree_id'] == parent_tree
          assert pr_number in {item['number'] for item in run.get('pull_requests', [])}

          jobs = get(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?filter=latest&per_page=100')
          matches = [job for job in jobs['jobs'] if job['id'] == job_id]
          assert len(matches) == 1
          assert matches[0]['status'] == 'completed'
          assert matches[0]['conclusion'] == 'success'
          PY

      - name: Install exact Rust toolchain and wasm target
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Verify exact Rust environment and dependency closure
        shell: bash
        run: |
          set -euo pipefail
          rustc --version --verbose
          cargo --version --verbose
          rustfmt --version
          cargo clippy --version
          test "$(rustc --version | awk '{print $2}')" = '1.98.1'
          python - <<'PY'
          import pathlib
          import tomllib
          data = tomllib.loads(pathlib.Path('crates/mycelix-stewardship-authority-evidence/Cargo.toml').read_text())
          expected = {
              'mycelix-stewardship-core': {'path': '../mycelix-stewardship-core'},
          }
          if data.get('dependencies', {}) != expected:
              raise SystemExit(f"unexpected STEW-AUTH-001 dependency closure: {data.get('dependencies', {})!r}")
          PY

      - name: rustfmt
        run: CARGO_TARGET_DIR="$RUNNER_TEMP/stew-auth-001-target" cargo fmt --manifest-path crates/mycelix-stewardship-authority-evidence/Cargo.toml -- --check

      - name: Host tests
        run: CARGO_TARGET_DIR="$RUNNER_TEMP/stew-auth-001-target" cargo test --manifest-path crates/mycelix-stewardship-authority-evidence/Cargo.toml --all-targets

      - name: wasm32 check
        run: CARGO_TARGET_DIR="$RUNNER_TEMP/stew-auth-001-target" cargo check --manifest-path crates/mycelix-stewardship-authority-evidence/Cargo.toml --target wasm32-unknown-unknown

      - name: Strict Clippy
        run: CARGO_TARGET_DIR="$RUNNER_TEMP/stew-auth-001-target" cargo clippy --manifest-path crates/mycelix-stewardship-authority-evidence/Cargo.toml --all-targets -- -D warnings

      - name: rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: CARGO_TARGET_DIR="$RUNNER_TEMP/stew-auth-001-target" cargo doc --manifest-path crates/mycelix-stewardship-authority-evidence/Cargo.toml --no-deps

      - name: Immutable postflight
        shell: bash
        run: |
          set -euo pipefail
          rm -f crates/mycelix-stewardship-authority-evidence/Cargo.lock
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$(git show -s --format=%T "$EXPECTED_PARENT_SHA")" = "$EXPECTED_PARENT_TREE"
          test -z "$(git status --porcelain --untracked-files=all)"
