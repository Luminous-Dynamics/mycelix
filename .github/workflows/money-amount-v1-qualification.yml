name: MoneyAmountV1 Qualification

on:
  pull_request:
    paths:
      - 'mycelix-finance/types/**'
      - 'mycelix-finance/docs/money-amount-*'
      - 'mycelix-workspace/mycelix-finance/types/**'
      - 'mycelix-workspace/mycelix-finance/docs/money-amount-*'
      - 'mycelix-workspace/sdk-ts/src/clients/finance/types.ts'
      - '.github/workflows/money-amount-v1-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-finance/types/**'
      - 'mycelix-finance/docs/money-amount-*'
      - '.github/workflows/money-amount-v1-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  money-wire:
    name: Exact money wire vectors
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.0
          rustc --version
          cargo --version

      - name: Format canonical and workspace Finance
        run: |
          cargo fmt --manifest-path mycelix-finance/Cargo.toml --all -- --check
          cargo fmt --manifest-path mycelix-workspace/mycelix-finance/Cargo.toml --all -- --check

      - name: Test canonical MoneyAmountV1 golden vectors
        run: cargo test --locked --manifest-path mycelix-finance/Cargo.toml -p mycelix_finance_types

      - name: Test workspace MoneyAmountV1 golden vectors
        run: cargo test --locked --manifest-path mycelix-workspace/mycelix-finance/Cargo.toml -p mycelix_finance_types

      - name: Clippy canonical and workspace Finance
        run: |
          cargo clippy --locked --manifest-path mycelix-finance/Cargo.toml -p mycelix_finance_types --all-targets -- -D warnings
          cargo clippy --locked --manifest-path mycelix-workspace/mycelix-finance/Cargo.toml -p mycelix_finance_types --all-targets -- -D warnings
