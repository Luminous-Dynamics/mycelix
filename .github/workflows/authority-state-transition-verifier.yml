name: Authority State Transition Verifier

on:
  pull_request:
    paths:
      - 'crates/mycelix-authority-state-transition-verifier/**'
      - 'crates/mycelix-authority-state-source/**'
      - '.github/workflows/authority-state-transition-verifier.yml'
  push:
    branches:
      - 'security/authority-transition-proof-split-v0.1'

permissions:
  contents: read

concurrency:
  group: authority-state-transition-verifier-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Split transition record + institutional authority proofs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --manifest-path crates/mycelix-authority-state-transition-verifier/Cargo.toml -- --check

      - name: Tests
        run: cargo test --manifest-path crates/mycelix-authority-state-transition-verifier/Cargo.toml --all-targets

      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-authority-state-transition-verifier/Cargo.toml --all-targets -- -D warnings

      - name: Downstream source compatibility
        run: cargo check --manifest-path crates/mycelix-authority-state-source/Cargo.toml --all-targets

      - name: Authority separation audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('crates/mycelix-authority-state-transition-verifier/src/lib.rs').read_text()
          inv = Path('crates/mycelix-authority-state-transition-verifier/INVARIANTS.md').read_text().lower()

          assert 'pub struct VerifiedTransitionRecordProof {' in src
          assert 'pub struct VerifiedTransitionAuthorityProof {' in src
          assert 'pub struct QualifiedAuthorityStateTransitionVerification {' in src
          assert 'qualify_authority_state_transition(' in src
          assert 'transition.identity_digest()' in src
          assert 'TRANSITION_IDENTITY_PROFILE' in src
          assert 'record_proof.validate_against' in src
          assert 'authority_proof.validate_against' in src
          assert 'authoritative_source_ref: &str' in src
          assert '.valid_until_ms' in src and '.min(authority_proof.valid_until_ms)' in src
          assert '.verified_at_ms' in src and '.max(authority_proof.verified_at_ms)' in src
          assert 'verified_transition' in src and '.validate_at(now_ms)' in src

          qualified_prefix = src.split('pub struct QualifiedAuthorityStateTransitionVerification {', 1)[0]
          assert 'Deserialize' not in qualified_prefix.split('/// Non-deserializable proof')[-1]

          record = src.split('pub struct VerifiedTransitionRecordProof {', 1)[1].split('}', 1)[0]
          authority = src.split('pub struct VerifiedTransitionAuthorityProof {', 1)[1].split('}', 1)[0]
          assert 'verified_authority_ref' not in record
          assert 'verified_authority_proof_ref' not in record
          assert 'transition_record_ref' not in authority
          assert 'verified_record_proof_ref' not in authority

          for forbidden in ['hdk::', 'get_links(', 'create_entry(', 'update_entry(', 'delete_entry(', 'execute_actions', 'phi', 'reputation', 'model_score']:
              assert forbidden.lower() not in src.lower(), forbidden

          assert 'record proof and institutional authority proof are different facts' in inv
          assert 'authoritative source identity is independent' in inv
          assert 'complete lineage/currentness remains elsewhere' in inv
          assert 'a valid transition prefix is not current authority' in inv
          print('PASS: transition record authenticity, institutional authorization, and authoritative source are separate facts')
          PY
