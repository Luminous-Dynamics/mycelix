name: Mycelix FL Core Exact-Head

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'mycelix-workspace/crates/mycelix-fl-core/**'
      - 'mycelix-workspace/crates/mycelix-bridge-common/**'
      - '.github/workflows/fl-core-exact-head.yml'
  workflow_dispatch:
    inputs:
      subject_sha:
        description: 'Exact 40-hex commit SHA to qualify'
        required: true
        type: string

permissions:
  contents: read

jobs:
  qualify:
    name: Exact-head FL core qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Resolve exact subject
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            subject='${{ github.event.pull_request.head.sha }}'
          else
            subject='${{ inputs.subject_sha }}'
          fi
          if [[ ! "$subject" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid subject SHA: $subject" >&2
            exit 1
          fi
          echo "sha=$subject" >> "$GITHUB_OUTPUT"

      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.subject.outputs.sha }}
          fetch-depth: 1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: rustfmt,clippy

      - name: Preflight identity and immutability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.subject.outputs.sha }}"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/fl-evidence"
          {
            echo "subject_sha=${{ steps.subject.outputs.sha }}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            rustc -Vv
            cargo -V
          } > "$RUNNER_TEMP/fl-evidence/execution-capsule.txt"
          find mycelix-workspace/crates/mycelix-fl-core \
               mycelix-workspace/crates/mycelix-bridge-common \
               -type f -not -path '*/target/*' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > "$RUNNER_TEMP/fl-evidence/source-sha256.txt"

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          cd mycelix-workspace/crates/mycelix-fl-core
          cargo fmt --all -- --check

      - name: Prepare isolated resolved graph
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/fl-qual"
          mkdir -p "$root/crates"
          cp -a mycelix-workspace/crates/mycelix-fl-core "$root/crates/"
          cp -a mycelix-workspace/crates/mycelix-bridge-common "$root/crates/"
          cd "$root/crates/mycelix-fl-core"
          cargo generate-lockfile
          sha256sum Cargo.lock > "$RUNNER_TEMP/fl-evidence/Cargo.lock.sha256"
          cp Cargo.lock "$RUNNER_TEMP/fl-evidence/Cargo.lock"
          cargo metadata --locked --format-version 1 \
            > "$RUNNER_TEMP/fl-evidence/cargo-metadata.json"
          cargo tree --locked \
            > "$RUNNER_TEMP/fl-evidence/cargo-tree.txt"

      - name: Test exact resolved graph
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/fl-qual/crates/mycelix-fl-core"
          cargo test --locked --all-targets

      - name: Clippy exact resolved graph
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/fl-qual/crates/mycelix-fl-core"
          cargo clippy --locked --all-targets -- -D warnings

      - name: Postflight checkout immutability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.subject.outputs.sha }}"
          test -z "$(git status --porcelain)"

      - name: Write qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          lock_sha="$(cut -d' ' -f1 "$RUNNER_TEMP/fl-evidence/Cargo.lock.sha256")"
          cat > "$RUNNER_TEMP/fl-evidence/QUALIFICATION_RECEIPT.txt" <<EOF
          MYC-FL-001AQ PASS
          subject_sha=${{ steps.subject.outputs.sha }}
          rust_toolchain=1.96.0
          resolved_lock_sha256=${lock_sha}
          qualification_scope=source identity + rustfmt + isolated locked dependency graph + tests + clippy + checkout immutability
          dependency_reproducibility=limited to retained generated Cargo.lock; no committed FL-core lock is claimed
          nonclaims=Byzantine resilience, convergence, non-IID robustness, Sybil resistance, privacy, secure aggregation, model quality, deployment authority
          EOF

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myc-fl-001aq-${{ steps.subject.outputs.sha }}
          path: ${{ runner.temp }}/fl-evidence
          if-no-files-found: warn
          retention-days: 30
