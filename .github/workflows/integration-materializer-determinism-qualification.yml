name: Integration Materializer Determinism Qualification

on:
  pull_request:
    branches:
      - feat/integration-materializer-abi-v1
      - main
    paths:
      - 'crates/mycelix-integration-materializer-determinism/**'
      - 'crates/mycelix-integration-materializer-abi/**'
      - '.github/workflows/integration-materializer-determinism-qualification.yml'
  push:
    branches:
      - feat/integration-materializer-determinism-v1
    paths:
      - 'crates/mycelix-integration-materializer-determinism/**'
      - '.github/workflows/integration-materializer-determinism-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MANIFEST: crates/mycelix-integration-materializer-determinism/Cargo.toml

concurrency:
  group: integration-materializer-determinism-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Integer-only deterministic WASM subset
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/mycelix-integration-materializer-determinism

      - name: Check formatting
        run: cargo fmt --manifest-path "$MANIFEST" --all --check

      - name: Compile tests without running
        run: cargo test --manifest-path "$MANIFEST" --no-run

      - name: Run tests
        run: cargo test --manifest-path "$MANIFEST"

      - name: Clippy
        run: cargo clippy --manifest-path "$MANIFEST" --all-targets -- -D warnings

      - name: Enforce deterministic validator feature gate
        shell: bash
        run: |
          set -euo pipefail
          source='crates/mycelix-integration-materializer-determinism/src/lib.rs'

          grep -Fq 'Validator::new_with_features(deterministic_features()).validate_all(bytes)?;' "$source"
          grep -Fq 'WasmFeatures::FLOATS' "$source"
          grep -Fq 'WasmFeatures::SIMD' "$source"
          grep -Fq 'WasmFeatures::RELAXED_SIMD' "$source"
          grep -Fq 'WasmFeatures::THREADS' "$source"
          grep -Fq 'WasmFeatures::TAIL_CALL' "$source"
          grep -Fq 'WasmFeatures::REFERENCE_TYPES' "$source"
          grep -Fq 'WasmFeatures::MULTI_MEMORY' "$source"
          grep -Fq 'WasmFeatures::EXCEPTIONS' "$source"
          grep -Fq 'WasmFeatures::MEMORY64' "$source"
          grep -Fq 'WasmFeatures::FUNCTION_REFERENCES' "$source"
          grep -Fq 'WasmFeatures::GC' "$source"
          grep -Fq 'WasmFeatures::GC_TYPES' "$source"

      - name: Enforce module-side memory growth ban
        shell: bash
        run: |
          set -euo pipefail
          source='crates/mycelix-integration-materializer-determinism/src/lib.rs'
          grep -Fq 'Payload::CodeSectionEntry(body)' "$source"
          grep -Fq 'body.get_operators_reader()?' "$source"
          grep -Fq 'Operator::MemoryGrow { .. }' "$source"
          grep -Fq 'ModuleMemoryGrowForbidden' "$source"

      - name: Enforce static determinism boundary
        shell: bash
        run: |
          set -euo pipefail
          source='crates/mycelix-integration-materializer-determinism/src/lib.rs'

          grep -Fq 'floating_point_forbidden_here(&self) -> bool' "$source"
          grep -Fq 'simd_forbidden_here(&self) -> bool' "$source"
          grep -Fq 'threads_and_atomics_forbidden_here(&self) -> bool' "$source"
          grep -Fq 'references_and_gc_forbidden_here(&self) -> bool' "$source"
          grep -Fq 'module_memory_grow_forbidden_here(&self) -> bool' "$source"
          grep -Fq 'deterministic_instruction_subset_verified_here(&self) -> bool' "$source"
          grep -Fq 'fresh_instance_enforced_here(&self) -> bool' "$source"
          grep -Fq 'fuel_bound_enforced_here(&self) -> bool' "$source"
          grep -Fq 'end_to_end_materialization_determinism_verified_here(&self) -> bool' "$source"
          grep -Fq 'provider_payload_materialized_here(&self) -> bool' "$source"
          grep -Fq 'grants_execution_authority(&self) -> bool' "$source"

          if grep -Eq 'derive\([^)]*Deserialize' "$source"; then
            echo 'Qualified deterministic subset must not be deserializable.'
            exit 1
          fi
          if grep -Eq 'wasmtime::|wasmer::|reqwest::|hyper::|tonic::|mark_dispatch_started|AdminWebsocket' "$source"; then
            echo 'Static determinism theorem crossed into runtime/network/effect execution.'
            exit 1
          fi

      - name: Enforce determinism regressions
        shell: bash
        run: |
          set -euo pipefail
          source='crates/mycelix-integration-materializer-determinism/src/lib.rs'
          grep -Fq 'integer_only_module_qualifies' "$source"
          grep -Fq 'floating_point_instruction_fails_closed' "$source"
          grep -Fq 'module_memory_grow_fails_closed' "$source"
          grep -Fq 'ordinary_integer_memory_access_remains_allowed' "$source"
