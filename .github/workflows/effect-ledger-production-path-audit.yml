name: Effect Ledger Production Path Audit

on:
  # Qualification is authoritative per pull-request head. We intentionally
  # omit the redundant push trigger because push + pull_request share the
  # same concurrency group and can cancel each other before execution.
  pull_request:
  workflow_dispatch:

concurrency:
  group: effect-ledger-production-path-audit
  cancel-in-progress: true

permissions:
  contents: read

env:
  QUALIFICATION_CHECKOUT_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
  QUALIFICATION_CHECKOUT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  audit:
    name: Production consequence-path audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          repository: ${{ env.QUALIFICATION_CHECKOUT_REPOSITORY }}
          ref: ${{ env.QUALIFICATION_CHECKOUT_REF }}

      - name: Assert exact qualification head
        shell: bash
        run: |
          set -euo pipefail
          expected="${QUALIFICATION_CHECKOUT_REF}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected" || {
            echo "exact-head mismatch: expected=$expected actual=$actual" >&2
            exit 1
          }

      - name: Verify durable boundary exists
        shell: bash
        run: |
          set -euo pipefail
          test -f crates/constitutional-effect-ledger-sqlite/Cargo.toml
          test -f crates/constitutional-effect-ledger-sqlite/src/lib.rs
          test -f crates/constitutional-effect-ledger-sqlite/src/boundary.rs
          grep -Fq 'pub mod boundary;' crates/constitutional-effect-ledger-sqlite/src/lib.rs
          grep -Fq 'DurableActionFenceStore' crates/constitutional-effect-ledger-sqlite/src/boundary.rs

      - name: Refuse unmediated production execution
        shell: bash
        run: |
          set -euo pipefail
          executor='mycelix-governance/zomes/execution/coordinator/src/lib.rs'

          start="$(grep -n '^pub fn execute_timelock' "$executor" | head -n1 | cut -d: -f1)"
          test -n "$start"

          end="$(tail -n +"$((start + 1))" "$executor" | grep -n '^/// Input for preparing a timelock' | head -n1 | cut -d: -f1 || true)"
          if [ -z "$end" ]; then
            end=$((start + 400))
          else
            end=$((start + end))
          fi

          window="$(sed -n "${start},${end}p" "$executor")"

          grep -Fq 'ExecutionStatus::Prepared' <<<"$window" || {
            echo "NOT QUALIFIED: execution coordinator does not stop at explicit Prepared state."
            exit 1
          }

          grep -Fq 'TimelockStatus::Prepared' <<<"$window" || {
            echo "NOT QUALIFIED: timelock does not enter explicit Prepared state."
            exit 1
          }

          grep -Fq 'validate_actions(&current_timelock.actions)' <<<"$window" || {
            echo "NOT QUALIFIED: prepared execution does not validate its action payload before handoff."
            exit 1
          }

          grep -Fq 'current_timelock.status != TimelockStatus::Ready' <<<"$window" || {
            echo "NOT QUALIFIED: preparation path still permits implicit Pending authorization."
            exit 1
          }

          if grep -Fq 'execute_actions(' <<<"$window"; then
            echo "NOT QUALIFIED: execute_timelock still reaches an in-WASM action dispatcher directly."
            exit 1
          fi

          if grep -Fq 'governance_utils::call_local' <<<"$window"; then
            echo "NOT QUALIFIED: execute_timelock still performs a direct cross-zome effect."
            exit 1
          fi

          grep -Fq 'execution.status == ExecutionStatus::Prepared' 'mycelix-governance/zomes/execution/integrity/src/lib.rs' || {
            echo "NOT QUALIFIED: execution creation is not explicitly constrained to Prepared."
            exit 1
          }

          grep -Fq 'EntryTypes::ExecutionResolution' "$executor" || {
            echo "NOT QUALIFIED: host resolution attestation API is missing."
            exit 1
          }

          grep -Fq 'pub fn record_prepared_execution_resolution' "$executor" || {
            echo "NOT QUALIFIED: prepared execution has no explicit host-resolution attestation handoff."
            exit 1
          }

          grep -Fq 'authorization_admission_proof_digest' 'mycelix-governance/zomes/execution/integrity/src/lib.rs' || {
            echo "NOT QUALIFIED: execution resolution does not bind admission proof roots."
            exit 1
          }

          grep -Fq 'final_provider_entry_proof_digest' 'mycelix-governance/zomes/execution/integrity/src/lib.rs' || {
            echo "NOT QUALIFIED: execution resolution does not bind final-entry proof roots."
            exit 1
          }

          grep -Fq 'EXECUTION_AUTHORIZATION_ADMISSION_PROOF_PREFIX' 'mycelix-governance/zomes/execution/integrity/src/lib.rs' || {
            echo "NOT QUALIFIED: admission proof roots are not namespace-validated."
            exit 1
          }

          grep -Fq 'EXECUTION_FINAL_PROVIDER_ENTRY_PROOF_PREFIX' 'mycelix-governance/zomes/execution/integrity/src/lib.rs' || {
            echo "NOT QUALIFIED: final-entry proof roots are not namespace-validated."
            exit 1
          }

          grep -Fq 'check_prepared_resolution_action_count' "$executor" || {
            echo "NOT QUALIFIED: resolution proof tuples are not cardinality-bound to prepared actions."
            exit 1
          }

          grep -Fq 'test_resolution_must_bind_every_prepared_action_exactly_once' "$executor" || {
            echo "NOT QUALIFIED: exact prepared-action cardinality has no regression test."
            exit 1
          }

          grep -Fq 'execution_action_hash' 'mycelix-governance/zomes/execution/integrity/src/lib.rs' || {
            echo "NOT QUALIFIED: resolution lacks an exact Execution source-action root."
            exit 1
          }

          grep -Fq 'timelock_action_hash' 'mycelix-governance/zomes/execution/integrity/src/lib.rs' || {
            echo "NOT QUALIFIED: resolution lacks an exact Timelock source-action root."
            exit 1
          }

          grep -Fq 'must_get_valid_record(execution_hash)' 'mycelix-governance/zomes/execution/integrity/src/lib.rs' || {
            echo "NOT QUALIFIED: execution source-action root is not dereferenced by integrity validation."
            exit 1
          }

          grep -Fq 'must_get_valid_record(timelock_hash)' 'mycelix-governance/zomes/execution/integrity/src/lib.rs' || {
            echo "NOT QUALIFIED: timelock source-action root is not dereferenced by integrity validation."
            exit 1
          }

          grep -Fq 'check_resolution_execution_scope' 'mycelix-governance/zomes/execution/integrity/src/lib.rs' || {
            echo "NOT QUALIFIED: prepared Execution scope is not validated."
            exit 1
          }

          grep -Fq 'check_resolution_timelock_scope' 'mycelix-governance/zomes/execution/integrity/src/lib.rs' || {
            echo "NOT QUALIFIED: prepared Timelock scope is not validated."
            exit 1
          }

          grep -Fq 'Resolution bindings must not reuse attempt/action/proof roots' 'mycelix-governance/zomes/execution/integrity/src/lib.rs' || {
            echo "NOT QUALIFIED: duplicate binding roots are not rejected."
            exit 1
          }

          grep -Fq 'authorized_timelock_action_hash: Some(current_record.action_address().clone())' "$executor" || {
            echo "NOT QUALIFIED: Execution does not bind the exact Ready Timelock action that authorized preparation."
            exit 1
          }

          grep -Fq 'prepared_from_action_hash: Some(current_record.action_address().clone())' "$executor" || {
            echo "NOT QUALIFIED: Prepared Timelock update does not bind its exact Ready predecessor action."
            exit 1
          }

          grep -Fq 'check_prepared_timelock_predecessor' 'mycelix-governance/zomes/execution/integrity/src/lib.rs' || {
            echo "NOT QUALIFIED: Timelock preparation does not verify its exact predecessor action."
            exit 1
          }

          grep -Fq 'check_execution_authorized_timelock_scope' 'mycelix-governance/zomes/execution/integrity/src/lib.rs' || {
            echo "NOT QUALIFIED: Execution's Ready Timelock root is not scope-validated."
            exit 1
          }

          grep -Fq 'check_resolution_source_action_linkage' 'mycelix-governance/zomes/execution/integrity/src/lib.rs' || {
            echo "NOT QUALIFIED: resolution does not cross-check Execution authorization and Prepared Timelock predecessor roots."
            exit 1
          }

          grep -Fq 'test_ready_must_pass_through_prepared_before_terminal' 'mycelix-governance/zomes/execution/integrity/src/lib.rs' || {
            echo "NOT QUALIFIED: exact timelock predecessor mismatch lacks a regression test."
            exit 1
          }

          grep -Fq 'test_new_timelock_cannot_self_assert_preparation_predecessor' 'mycelix-governance/zomes/execution/integrity/src/lib.rs' || {
            echo "NOT QUALIFIED: initial Timelock can self-assert a preparation predecessor."
            exit 1
          }

          grep -Fq 'test_execution_requires_exact_authorized_timelock_hash' 'mycelix-governance/zomes/execution/integrity/src/lib.rs' || {
            echo "NOT QUALIFIED: Execution can omit the exact Ready Timelock authorization root."
            exit 1
          }
          grep -Fq 'ExecutionResolutionBindingV1' 'mycelix-governance/zomes/execution/integrity/src/lib.rs' || {
            echo "NOT QUALIFIED: proof roots are not grouped into typed per-action bindings."
            exit 1
          }

          grep -Fq 'bindings: Vec<ExecutionResolutionBindingV1>' "$executor" || {
            echo "NOT QUALIFIED: coordinator input does not use typed per-action bindings."
            exit 1
          }

          grep -Fq 'recordPreparedExecutionResolution' 'mycelix-workspace/sdk-ts/src/clients/governance/execution.ts' || {
            echo "NOT QUALIFIED: SDK has no typed prepared-resolution API."
            exit 1
          }

          grep -Fq 'should submit typed proof-root bindings as one tuple per action' 'mycelix-workspace/sdk-ts/src/clients/governance/__tests__/execution.test.ts' || {
            echo "NOT QUALIFIED: SDK typed proof-root serialization lacks regression coverage."
            exit 1
          }

          grep -Fq 'test_validate_actions_reports_exact_action_count_and_rejects_empty_batches' "$executor" || {
            echo "NOT QUALIFIED: action parser lacks empty-batch/cardinality coverage."
            exit 1
          }

          if grep -Fq 'pub fn store_mut' 'crates/constitutional-effect-ledger-sqlite/src/boundary.rs'; then
            echo "NOT QUALIFIED: mutable durable-store escape hatch remains exposed."
            exit 1
          fi

          grep -Fq 'BoundaryTrustRoot' 'crates/constitutional-effect-ledger-sqlite/src/boundary.rs' || {
            echo "NOT QUALIFIED: provider boundary has no constructor-bound trust root."
            exit 1
          }

          grep -Fq 'PinnedBoundaryTrustRoot' 'crates/constitutional-effect-ledger-sqlite/src/boundary.rs' || {
            echo "NOT QUALIFIED: concrete pinned trust-root container is missing."
            exit 1
          }

          if grep -Fq 'verifier: &V' 'crates/constitutional-effect-ledger-sqlite/src/boundary.rs'; then
            echo "NOT QUALIFIED: per-call terminal verifier injection remains exposed."
            exit 1
          fi

          if grep -Fq 'entry_verifier: &G' 'crates/constitutional-effect-ledger-sqlite/src/boundary.rs'; then
            echo "NOT QUALIFIED: per-call final-entry verifier injection remains exposed."
            exit 1
          fi

          grep -Fq 'PinnedProviderAdapterRegistry' 'crates/constitutional-effect-ledger-sqlite/src/boundary.rs' || {
            echo "NOT QUALIFIED: provider adapter registry is not constructor-pinned."
            exit 1
          }

          if grep -Fq 'provider: &mut' 'crates/constitutional-effect-ledger-sqlite/src/boundary.rs'; then
            echo "NOT QUALIFIED: provider adapter is still caller-injected."
            exit 1
          fi


          if grep -Fq 'pub fn store_mut' 'crates/constitutional-effect-ledger-sqlite/src/boundary.rs'; then
            echo "NOT QUALIFIED: mutable durable-store escape hatch remains exposed."
            exit 1
          fi

          grep -Fq 'AdmissionAuthorizer' 'crates/constitutional-effect-ledger-sqlite/src/boundary.rs' || {
            echo "NOT QUALIFIED: initial effect admission has no pinned authorization authorizer."
            exit 1
          }

          grep -Fq 'AuthorizationAdmissionProofV1' 'crates/constitutional-effect-ledger-sqlite/src/boundary.rs' || {
            echo "NOT QUALIFIED: durable admission is not carrying an exact authorization proof."
            exit 1
          }

          echo "PASS: coordinator is prepare-only; provider effects are outside the WASM execution path."
