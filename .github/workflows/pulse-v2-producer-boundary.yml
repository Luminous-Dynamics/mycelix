name: Pulse V2 Producer Boundary

on:
  pull_request:
    paths:
      - 'mycelix-workspace/mycelix-pulse/holochain/zomes/messages/coordinator/**'
      - 'mycelix-workspace/mycelix-pulse/crates/pulse-realtime-types/**'
      - 'scripts/ci/pulse_v2_producer_boundary.py'
      - '.github/workflows/pulse-v2-producer-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-workspace/mycelix-pulse/holochain/zomes/messages/coordinator/**'
      - 'mycelix-workspace/mycelix-pulse/crates/pulse-realtime-types/**'
      - 'scripts/ci/pulse_v2_producer_boundary.py'
      - '.github/workflows/pulse-v2-producer-boundary.yml'

permissions:
  contents: read

concurrency:
  group: pulse-v2-producer-boundary-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CONTRACT_MANIFEST: mycelix-workspace/mycelix-pulse/crates/pulse-realtime-types/Cargo.toml
  PRODUCER_GUARD: scripts/ci/pulse_v2_producer_boundary.py

jobs:
  producer-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact subject checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected" || {
            echo "::error::Expected exact subject $expected, got $actual"
            exit 1
          }
          test -f "$PRODUCER_GUARD"
          test -f "$CONTRACT_MANIFEST"
          test -f mycelix-workspace/mycelix-pulse/holochain/zomes/messages/coordinator/src/lib.rs

      - name: Validate producer guard syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('scripts/ci/pulse_v2_producer_boundary.py').read_text(encoding='utf-8')
          compile(source, 'scripts/ci/pulse_v2_producer_boundary.py', 'exec')
          PY

      - name: Prove V2 producer authority boundary
        run: python3 "$PRODUCER_GUARD"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87b
        with:
          toolchain: 1.96.0
          components: rustfmt,clippy

      - name: Reprove shared realtime contract
        run: |
          set -euo pipefail
          cargo test --manifest-path "$CONTRACT_MANIFEST" --lib
          cargo test --manifest-path "$CONTRACT_MANIFEST" --test exact_frame
          cargo clippy --manifest-path "$CONTRACT_MANIFEST" --lib --test exact_frame -- -D warnings

      - name: Prove checkout immutability
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
