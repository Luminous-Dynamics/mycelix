name: Authority Source Head Runtime

on:
  pull_request:
    paths:
      - 'mycelix-governance/zomes/authority-state-source-head-verifier/**'
      - 'mycelix-governance/Cargo.toml'
      - 'mycelix-governance/dna/dna.yaml'
      - 'crates/mycelix-authority-source-head-verifier/**'
      - 'crates/mycelix-authority-evidence-lease/**'
      - '.github/workflows/authority-source-head-runtime.yml'
  push:
    branches:
      - 'security/authority-source-head-runtime-v0.1'
      - 'security/authority-source-head-projection-horizon-v0.1'
      - 'security/authority-source-head-leased-runtime-v0.1'

permissions:
  contents: read

concurrency:
  group: authority-source-head-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: Leased probe/responder/proof source-head runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Evidence-lease tests
        run: cargo test --manifest-path crates/mycelix-authority-evidence-lease/Cargo.toml --all-targets

      - name: Format
        working-directory: mycelix-governance
        run: cargo fmt --package authority_state_source_head_verifier -- --check

      - name: Native check
        working-directory: mycelix-governance
        run: cargo check --package authority_state_source_head_verifier --all-targets

      - name: Native clippy
        working-directory: mycelix-governance
        run: cargo clippy --package authority_state_source_head_verifier --all-targets -- -D warnings

      - name: WASM check
        working-directory: mycelix-governance
        run: cargo check --release --target wasm32-unknown-unknown --package authority_state_source_head_verifier

      - name: Source-head runtime audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('mycelix-governance/zomes/authority-state-source-head-verifier/coordinator/src/lib.rs').read_text()
          inv = Path('mycelix-governance/zomes/authority-state-source-head-verifier/INVARIANTS.md').read_text().lower()
          cargo = Path('mycelix-governance/Cargo.toml').read_text()
          zome_cargo = Path('mycelix-governance/zomes/authority-state-source-head-verifier/coordinator/Cargo.toml').read_text()
          dna = Path('mycelix-governance/dna/dna.yaml').read_text()

          request_block = src.split('pub struct VerifySourceHeadRequest {', 1)[1].split('}', 1)[0]
          assert 'pub probe_action: ActionHash' in request_block
          assert 'VerifiedCoverageChallenge' not in request_block
          assert 'pub challenge: VerifiedCoverageChallenge' not in src
          assert 'request.challenge' not in src

          required = [
              'mycelix_authority_evidence_lease::{EvidenceLease, LeasedEvidence}',
              'authority_state_challenge',
              'verify_issued_authority_state_probe',
              'authority_state_source_responder',
              'resolve_source_head_attestation',
              'authority_source_proof_verifier',
              'verify_source_head_proof',
              'fn qualify_request(',
              'qualify_source_head_authentication(',
              'pub fn verify_source_head(',
              'pub fn verify_source_head_leased(',
              'EvidenceLease::new(',
              'qualified.verified_at_ms()',
              'qualified.valid_until_ms()',
              'LeasedEvidence::new(',
              'legacy_projection_fail_closed: true',
              'leased_endpoint_available: true',
              'leased_endpoint_preserves_exact_horizon: true',
              'institutional_source_trust_decided_here: false',
              'completeness_decided_here: false',
              'external_effects_enabled: false',
              'operational: false',
          ]
          for token in required:
              assert token in src, token

          legacy = src.split('pub fn verify_source_head(', 1)[1].split('/// Lease-complete transport endpoint.', 1)[0]
          assert 'if projected.attestation.expires_at_ms > effective_valid_until_ms' in legacy

          leased = src.split('pub fn verify_source_head_leased(', 1)[1].split('#[hdk_extern]\npub fn source_head_runtime_status', 1)[0]
          assert 'EvidenceLease::new(' in leased
          assert 'qualified.verified_at_ms()' in leased
          assert 'qualified.valid_until_ms()' in leased
          assert 'attestation.expires_at_ms >' not in leased

          helper = src.split('fn qualify_request(', 1)[1].split('/// Legacy compatibility endpoint.', 1)[0]
          probe = helper.index('let challenge: VerifiedCoverageChallenge = call_local(')
          responder = helper.index('let attestation: AuthoritySourceHeadAttestation = call_local(')
          proof = helper.index('let proof: VerifiedSourceHeadProof = call_local(')
          now = helper.index('let now = now_ms()?;')
          qualify = helper.index('let qualified = qualify_source_head_authentication')
          assert probe < responder < proof < now < qualify

          assert 'mycelix-authority-evidence-lease' in zome_cargo
          assert '"zomes/authority-state-source-head-verifier/coordinator"' in cargo
          assert 'name: authority_state_source_head_verifier' not in dna
          assert 'legacy projection remains fail-closed' in inv
          assert 'leased projection preserves the exact dynamic horizon' in inv
          assert 'lease envelope is not authority' in inv
          assert 'deliberately unprovisioned' in inv
          print('PASS: old source-head ABI stays fail-closed while leased endpoint preserves #130 verifier horizon')
          PY
