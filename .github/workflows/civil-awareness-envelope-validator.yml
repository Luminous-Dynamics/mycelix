name: Civil awareness envelope and observability verifier

on:
  push:
    branches:
      - feat/gcpn-observability-evaluator-v0.1
    paths:
      - "mycelix-workspace/mycelix-praxis/benchmarks/civil-awareness-envelope-validator/**"
      - "mycelix-workspace/mycelix-praxis/docs/research/civil-awareness-observability-dgp-v0.1*"
      - ".github/workflows/civil-awareness-envelope-validator.yml"
  pull_request:
    branches:
      - main
      - research/gcpn-civil-envelope-validator-v0-2
    paths:
      - "mycelix-workspace/mycelix-praxis/benchmarks/civil-awareness-envelope-validator/**"
      - "mycelix-workspace/mycelix-praxis/docs/research/civil-awareness-observability-dgp-v0.1*"
      - ".github/workflows/civil-awareness-envelope-validator.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civil-awareness-envelope-validator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust validator and observability DGP
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Check dependency lockfile status
        shell: bash
        run: |
          lockfile="mycelix-workspace/mycelix-praxis/benchmarks/civil-awareness-envelope-validator/Cargo.lock"
          if [[ -f "$lockfile" ]]; then
            echo "Cargo.lock present; review and use --locked for final reproducible qualification."
          else
            echo "::warning::Cargo.lock is not committed. Test dependency resolution is not yet pinned; generate, review and commit Cargo.lock before merge."
          fi

      - name: Format
        run: cargo fmt --manifest-path mycelix-workspace/mycelix-praxis/benchmarks/civil-awareness-envelope-validator/Cargo.toml --check

      - name: Test all targets
        run: cargo test --manifest-path mycelix-workspace/mycelix-praxis/benchmarks/civil-awareness-envelope-validator/Cargo.toml --all-targets

      - name: Clippy
        run: cargo clippy --manifest-path mycelix-workspace/mycelix-praxis/benchmarks/civil-awareness-envelope-validator/Cargo.toml --all-targets -- -D warnings
