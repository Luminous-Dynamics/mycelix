name: QUAL-001G3A Repository Mutation Subject Diagnostic

on:
  push:
    branches:
      - diag/qual-001g3a-repository-mutation-subject-v1
    paths:
      - '.github/workflows/qual-001g3a-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: qual-001g3a-repository-mutation-subject-v1
  cancel-in-progress: true

env:
  PRODUCT_SHA: '7bfbe84e8596c685588ea72b61e4f282f1bd113c'
  PRODUCT_PARENT: '20452d0cde9448c424d708d6307aa33a3d1901e3'
  WORKFLOW_PATH: '.github/workflows/qual-001g3a-diagnostic.yml'
  CRATE_DIR: 'crates/mycelix-repository-mutation-abi'
  MANIFEST: 'crates/mycelix-repository-mutation-abi/Cargo.toml'
  SOURCE: 'crates/mycelix-repository-mutation-abi/src/lib.rs'
  INVARIANTS: 'crates/mycelix-repository-mutation-abi/INVARIANTS.md'
  LOCKFILE: 'crates/mycelix-repository-mutation-abi/Cargo.lock'
  EXPECTED_MANIFEST_BLOB: 'f7fcdb7f91d4a413e4cb9491b02753a32453ed06'
  EXPECTED_SOURCE_BLOB: '7667ce6dddc2590d607961c73582bb89f1e30caa'
  EXPECTED_INVARIANTS_BLOB: '9a3b492d6623c2cdf04a6e57295c7f95d4af0d4f'
  RUST_TOOLCHAIN: '1.96.0'
  CARGO_TARGET_DIR: '/tmp/qual-001g3a-target'

jobs:
  diagnose:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout exact diagnostic subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false

      - name: Prove exact diagnostic and product lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PRODUCT_SHA"
          test "$(git rev-parse HEAD^^)" = "$PRODUCT_PARENT"

          mapfile -t diagnostic_changed < <(git diff --name-only "$PRODUCT_SHA" HEAD)
          test "${#diagnostic_changed[@]}" -eq 1
          test "${diagnostic_changed[0]}" = "$WORKFLOW_PATH"

          mapfile -t product_changed < <(git diff --name-only "$PRODUCT_PARENT" "$PRODUCT_SHA")
          test "${#product_changed[@]}" -eq 3
          printf '%s\n' "${product_changed[@]}" | sort > /tmp/product-paths
          cat > /tmp/expected-product-paths <<'EOF'
          crates/mycelix-repository-mutation-abi/Cargo.toml
          crates/mycelix-repository-mutation-abi/INVARIANTS.md
          crates/mycelix-repository-mutation-abi/src/lib.rs
          EOF
          diff -u /tmp/expected-product-paths /tmp/product-paths
          test -z "$(git status --porcelain=v1)"

      - name: Bind exact product blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$PRODUCT_SHA:$MANIFEST")" = "$EXPECTED_MANIFEST_BLOB"
          test "$(git rev-parse "$PRODUCT_SHA:$SOURCE")" = "$EXPECTED_SOURCE_BLOB"
          test "$(git rev-parse "$PRODUCT_SHA:$INVARIANTS")" = "$EXPECTED_INVARIANTS_BLOB"

      - name: Enforce source authority boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'std::net|std::process|Command::|TcpStream|UdpSocket|reqwest|octocrab|git2::|serde::' "$SOURCE"
          ! grep -Eq 'GITHUB_TOKEN|contents:[[:space:]]*write|git push|update-ref|force-with-lease' "$SOURCE"
          grep -Fq 'grants_repository_write_authority(&self) -> bool' "$SOURCE"
          grep -Fq 'publication_performed_here(&self) -> bool' "$SOURCE"
          grep -Fq 'semantic_product_qualification_performed_here(&self) -> bool' "$SOURCE"

      - name: Install pinned Rust 1.96 toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Capture exact toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc --version --verbose
          cargo --version
          test "$(rustc --version | awk '{print $2}')" = "$RUST_TOOLCHAIN"

      - name: Derive dependency-free lock capsule offline
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$LOCKFILE"
          cargo generate-lockfile --manifest-path "$MANIFEST" --offline
          test -f "$LOCKFILE"

          test -z "$(git diff --name-only)"
          status="$(git status --porcelain=v1 --untracked-files=all)"
          test "$status" = "?? $LOCKFILE"

          printf 'lock_sha256=%s\n' "$(sha256sum "$LOCKFILE" | awk '{print $1}')"
          printf 'lock_git_blob=%s\n' "$(git hash-object "$LOCKFILE")"
          echo '--- BEGIN OFFLINE CARGO LOCK ---'
          cat "$LOCKFILE"
          echo '--- END OFFLINE CARGO LOCK ---'

      - name: Rustfmt exact product
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path "$MANIFEST" -- --check

      - name: Compile and test offline with generated lock
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path "$MANIFEST" --all-targets --offline --locked --no-run
          cargo test --manifest-path "$MANIFEST" --all-targets --offline --locked

      - name: Strict Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path "$MANIFEST" --all-targets --offline --locked -- -D warnings

      - name: Postflight mutation and nonclaim receipt
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only)"
          test "$(git hash-object "$MANIFEST")" = "$EXPECTED_MANIFEST_BLOB"
          test "$(git hash-object "$SOURCE")" = "$EXPECTED_SOURCE_BLOB"
          test "$(git hash-object "$INVARIANTS")" = "$EXPECTED_INVARIANTS_BLOB"
          status="$(git status --porcelain=v1 --untracked-files=all)"
          test "$status" = "?? $LOCKFILE"

          printf 'diagnostic=PASS\n'
          printf 'repository_authority=READ_ONLY\n'
          printf 'network_dependency_acquisition=NONE_OFFLINE\n'
          printf 'product_sha=%s\n' "$PRODUCT_SHA"
          printf 'lock_sha256=%s\n' "$(sha256sum "$LOCKFILE" | awk '{print $1}')"
          printf 'lock_git_blob=%s\n' "$(git hash-object "$LOCKFILE")"
          printf 'claim_ceiling=DiagnosticSupportForCanonicalRepositoryMutationSubjectShapeV1\n'
          printf 'nonclaim=candidate commitment, Git tree reconstruction, Git commit reconstruction, publication, publication recovery, product qualification\n'
