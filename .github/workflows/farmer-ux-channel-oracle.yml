name: Farmer channel continuity oracle

on:
  pull_request:
    paths:
      - "research/farmer-ux-006-channel-*"
      - "research/farmer-ux-006-channel-oracle/**"
      - ".github/workflows/farmer-ux-channel-oracle.yml"
  push:
    branches: [main]
    paths:
      - "research/farmer-ux-006-channel-*"
      - "research/farmer-ux-006-channel-oracle/**"
      - ".github/workflows/farmer-ux-channel-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: farmer-ux-channel-oracle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Schema, semantics and deterministic adversarial schedules
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: research/farmer-ux-006-channel-oracle -> target
      - name: Check Rust formatting
        run: cargo fmt --manifest-path research/farmer-ux-006-channel-oracle/Cargo.toml -- --check
      - name: Run oracle, mutation and 10,000-schedule tests
        run: cargo test --manifest-path research/farmer-ux-006-channel-oracle/Cargo.toml
      - name: Validate fixtures and emit deterministic report
        run: cargo run --manifest-path research/farmer-ux-006-channel-oracle/Cargo.toml -- --root . --report-json research/farmer-ux-006-channel-oracle/target/channel-oracle-report.json
      - name: Upload oracle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farmer-channel-oracle-report
          path: research/farmer-ux-006-channel-oracle/target/channel-oracle-report.json
          if-no-files-found: ignore
