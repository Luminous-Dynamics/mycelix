name: Forge Project-Policy Trusted Review-Basis Currentness

on:
  pull_request:
    paths:
      - 'crates/mycelix-forge-review-basis-currentness-policy-trust/**'
      - 'crates/mycelix-forge-review-basis-currentness/**'
      - 'crates/mycelix-forge-merge-protected-review-basis/**'
      - 'crates/mycelix-forge-project-policy/**'
      - '.github/workflows/forge-review-basis-currentness-policy-trust.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: rustfmt
        working-directory: crates/mycelix-forge-review-basis-currentness-policy-trust
        run: cargo fmt -- --check
      - name: clippy
        working-directory: crates/mycelix-forge-review-basis-currentness-policy-trust
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: static currentness trust firewall
        working-directory: crates/mycelix-forge-review-basis-currentness-policy-trust
        run: |
          ! grep -Eq 'impl.*Deserialize.*ProjectPolicyTrustedReviewBasisCurrentnessV1' src/lib.rs
          ! grep -Eq 'fn.*(authorize|permit|execute|merge)' src/lib.rs
          grep -Fq 'project_policy.binds_provider_trust' src/lib.rs
          grep -Fq 'provider_trust.trusts' src/lib.rs
          grep -Fq 'currentness.review_basis_quorum()' src/lib.rs
          grep -Fq 'VerifierNotTrusted' src/lib.rs
      - name: tests
        working-directory: crates/mycelix-forge-review-basis-currentness-policy-trust
        run: cargo test --all-features
