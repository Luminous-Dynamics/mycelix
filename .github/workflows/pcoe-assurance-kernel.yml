name: PCOE Assurance Kernel

on:
  push:
    branches:
      - research/pcoe-rust-kernel-v0.1-20261122
    paths:
      - "mycelix-finance/benchmarks/cross-domain-obligation-assurance/**"
      - ".github/workflows/pcoe-assurance-kernel.yml"
  pull_request:
    paths:
      - "mycelix-finance/benchmarks/cross-domain-obligation-assurance/**"
      - ".github/workflows/pcoe-assurance-kernel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mycelix-finance/benchmarks/cross-domain-obligation-assurance/harness
    steps:
      - name: Checkout exact tested subject
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Assert exact source head
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            expected="${{ github.event.pull_request.head.sha }}"
          else
            expected="${{ github.sha }}"
          fi
          test "$(git rev-parse HEAD)" = "$expected"
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.96.1
          components: rustfmt
      - name: Assert Rust identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc +1.96.1 --version | awk '{print $2}')" = "1.96.1"
          test "$(rustc +1.96.1 --version --verbose | sed -n 's/^commit-hash: //p')" = "31fca3adb283cc9dfd56b49cdee9a96eb9c96ffd"
      - name: Format
        run: cargo fmt --check --manifest-path Cargo.toml
      - name: Test
        run: cargo test --locked --manifest-path Cargo.toml
      - name: Lockfile immutability
        run: git diff --exit-code -- Cargo.lock
