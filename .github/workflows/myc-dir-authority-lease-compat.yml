name: Mycelix authority lease protocol compatibility

on:
  pull_request:
    paths:
      - "mycelix-desci/Cargo.toml"
      - "mycelix-desci/src/core/**"
      - "mycelix-workspace/mycelix-desci/Cargo.toml"
      - "mycelix-workspace/mycelix-desci/src/core/**"
      - "mycelix-workspace/crates/mycelix-authority-write-lease/**"
      - ".github/workflows/myc-dir-authority-lease-compat.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: myc-dir-authority-lease-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            mycelix-workspace/crates/mycelix-authority-write-lease

      - name: Verify mirrored DeSci lease source is byte-identical
        shell: bash
        run: |
          set -euo pipefail
          cmp mycelix-desci/src/core/src/authority_fencing.rs mycelix-workspace/mycelix-desci/src/core/src/authority_fencing.rs
          fixture="${RUNNER_TEMP}/desci-authority-lease-v1.rs"
          awk '
            /^#\[async_trait\]$/ { exit }
            { lines[NR] = $0 }
            END {
              last = NR
              while (last > 0 && lines[last] == "") last--
              for (i = 1; i <= last; i++) print lines[i]
            }
          ' mycelix-desci/src/core/src/authority_fencing.rs > "$fixture"
          cmp "$fixture" mycelix-workspace/crates/mycelix-authority-write-lease/tests/fixtures/desci_authority_fencing_v1.rs

      - name: Check shared lease crate formatting
        run: cargo fmt --manifest-path mycelix-workspace/crates/mycelix-authority-write-lease/Cargo.toml --check

      - name: Run standalone shared lease protocol tests
        run: cargo test --manifest-path mycelix-workspace/crates/mycelix-authority-write-lease/Cargo.toml

      - name: Verify v1 cross-implementation canonical bytes and signature hash
        run: cargo test --manifest-path mycelix-workspace/crates/mycelix-authority-write-lease/Cargo.toml --test desci_v1_compat -- --nocapture

