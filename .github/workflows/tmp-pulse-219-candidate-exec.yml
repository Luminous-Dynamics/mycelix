name: Temporary Pulse 219 Candidate Execution

on:
  push:
    branches:
      - tmp/pulse-219-candidate-exec-706a4b

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-D warnings'
  EXPECTED_CANDIDATE_SHA: 706a4b6fee4ad5871900b8c420adf93059748ffd

jobs:
  execute-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      JWT_SECRET: ci-test-secret-must-be-at-least-32-characters-long
      HOLOCHAIN_STUB_MODE: 'true'
      CREDENTIAL_ENCRYPTION_SECRET: ci-credential-encryption-secret-at-least-32-characters-long
      MYCELIX_DATA_DIR: ${{ runner.temp }}/pulse-backend-data
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 706a4b6fee4ad5871900b8c420adf93059748ffd
          submodules: recursive
          persist-credentials: false
      - name: Bind exact candidate head
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "Expected candidate head: $EXPECTED_CANDIDATE_SHA"
          echo "Checked-out candidate head: $actual"
          test "$actual" = "$EXPECTED_CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "0869bc9ba08fda11b9fdf442e7cc06895885ec7a"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action code
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Bind committed Pulse zome lock
        working-directory: mycelix-workspace/mycelix-pulse/holochain
        run: |
          set -euo pipefail
          test -s Cargo.lock
          sha256sum Cargo.lock > "$RUNNER_TEMP/pulse-zome-lock.sha256"
      - name: Pulse zome formatting
        working-directory: mycelix-workspace/mycelix-pulse/holochain
        run: cargo fmt --all -- --check
      - name: Pulse zome Clippy
        working-directory: mycelix-workspace/mycelix-pulse/holochain
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Pulse zome unit tests
        working-directory: mycelix-workspace/mycelix-pulse/holochain
        run: cargo test --locked --workspace --lib
      - name: Pulse zome WASM checks
        working-directory: mycelix-workspace/mycelix-pulse/holochain
        run: cargo check --locked --workspace --target wasm32-unknown-unknown
      - name: Verify Pulse zome lock unchanged
        working-directory: mycelix-workspace/mycelix-pulse/holochain
        run: sha256sum --check "$RUNNER_TEMP/pulse-zome-lock.sha256"
      - name: Bind committed Pulse backend lock
        working-directory: mycelix-workspace/mycelix-pulse/happ/backend-rs
        run: |
          set -euo pipefail
          test -s Cargo.lock
          echo "73f4b3654724c25736db619d41af0c2cb138a46d19c7553983d47885940c9c45  Cargo.lock" | sha256sum --check -
          sha256sum Cargo.lock > "$RUNNER_TEMP/pulse-backend-lock.sha256"
      - name: Pulse backend tests
        working-directory: mycelix-workspace/mycelix-pulse/happ/backend-rs
        run: cargo test --locked
      - name: Verify Pulse backend lock unchanged
        working-directory: mycelix-workspace/mycelix-pulse/happ/backend-rs
        run: sha256sum --check "$RUNNER_TEMP/pulse-backend-lock.sha256"
      - name: Verify Holochain cohort contract
        run: python3 .github/scripts/check_holochain_cohort.py
      - name: Seal candidate execution
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"
          git diff --exit-code
          echo "Exact #219 repair candidate execution passed."
