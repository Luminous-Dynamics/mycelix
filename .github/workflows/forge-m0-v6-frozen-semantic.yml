name: Forge M0 v6 Frozen Semantic Qualification

on:
  pull_request:
    paths:
      - '.github/workflows/forge-m0-v6-frozen-semantic.yml'

permissions:
  contents: read

jobs:
  qualify-frozen-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Prove exact frozen M0 parent and workflow-only child
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "b6f0757c2494a3a18d5b6d6e597035cfe67f5865"
          changed="$(git diff --name-only HEAD^ HEAD)"
          test "$changed" = ".github/workflows/forge-m0-v6-frozen-semantic.yml"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Record crate-local Rust 1.96 format drift
        id: format_diagnostic
        continue-on-error: true
        run: cargo fmt --manifest-path adapters/forge-m0-offline-evidence-v6/Cargo.toml -- --check

      - name: Report format diagnostic separately from semantic gates
        shell: bash
        run: echo "crate-local rustfmt outcome=${{ steps.format_diagnostic.outcome }}"

      - name: Clippy frozen M0 v6 source
        run: >-
          cargo clippy
          --manifest-path adapters/forge-m0-offline-evidence-v6/Cargo.toml
          --all-targets --all-features -- -D warnings

      - name: Test frozen M0 v6 source
        run: >-
          cargo test
          --manifest-path adapters/forge-m0-offline-evidence-v6/Cargo.toml
          --all-targets --all-features
