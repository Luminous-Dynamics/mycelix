name: Terra Preta seasonal GHG coverage audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/terra-preta/tools/seasonal-ghg-coverage/**'
      - 'research/terra-preta/schemas/seasonal-ghg-coverage-report.schema.json'
      - '.github/workflows/terra-preta-seasonal-ghg-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seasonal-ghg-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path research/terra-preta/tools/seasonal-ghg-coverage/Cargo.toml -- --check
      - name: Run tests
        run: cargo test --manifest-path research/terra-preta/tools/seasonal-ghg-coverage/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path research/terra-preta/tools/seasonal-ghg-coverage/Cargo.toml --all-targets -- -D warnings
      - name: Audit synthetic campaign
        run: |
          cargo run --quiet --manifest-path research/terra-preta/tools/seasonal-ghg-coverage/Cargo.toml -- \
            research/terra-preta/tools/seasonal-ghg-coverage/fixtures/synthetic-seasonal-ghg-campaign.json \
            "$RUNNER_TEMP/seasonal-ghg-coverage-report.json"
          jq -e '
            .audit_version == "0.1.0" and
            .fixture_status == "synthetic_only_not_empirical_evidence" and
            .status == "incomplete_event_coverage" and
            .schedule_slot_count == 5 and
            .usable_observation_count == 3 and
            (.missing_schedule_slot_ids | length == 2) and
            .event_coverage_complete == false and
            .boundary_coverage_complete == false and
            .uncertainty_status == "not_propagated_in_v0_1" and
            (.integrated_partial_mg_m2 - 0.3 | fabs < 1e-12) and
            (.input_sha256 | test("^[a-f0-9]{64}$"))
          ' "$RUNNER_TEMP/seasonal-ghg-coverage-report.json"
          if cargo run --quiet --manifest-path research/terra-preta/tools/seasonal-ghg-coverage/Cargo.toml -- \
            research/terra-preta/tools/seasonal-ghg-coverage/fixtures/synthetic-seasonal-ghg-campaign.json \
            "$RUNNER_TEMP/seasonal-ghg-coverage-report.json"; then
            echo "auditor unexpectedly overwrote existing report" >&2
            exit 1
          fi
