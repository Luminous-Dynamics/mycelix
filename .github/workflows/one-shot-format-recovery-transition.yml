name: One-shot Format Recovery Transition

on:
  push:
    branches:
      - feat/regenerative-recovery-transition-commitment-v1

permissions:
  contents: write

concurrency:
  group: one-shot-format-recovery-transition
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/regenerative-recovery-transition-commitment-v1
          fetch-depth: 2

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Format only owned transition source
        shell: bash
        run: |
          set -euo pipefail
          target='mycelix-commons/crates/commons-types/src/regenerative_recovery_transition_commitment.rs'
          rustfmt --edition 2024 "$target"
          changed="$(git diff --name-only)"
          if [[ -z "$changed" ]]; then
            echo 'Already formatted; no commit required.'
            exit 0
          fi
          if [[ "$changed" != "$target" ]]; then
            echo "Unexpected formatter scope: $changed" >&2
            exit 1
          fi

      - name: Test commons-types before write
        run: cargo test --manifest-path mycelix-commons/Cargo.toml -p commons-types

      - name: Clippy commons-types before write
        run: cargo clippy --manifest-path mycelix-commons/Cargo.toml -p commons-types -- -D warnings

      - name: Commit exact formatter delta
        shell: bash
        run: |
          set -euo pipefail
          target='mycelix-commons/crates/commons-types/src/regenerative_recovery_transition_commitment.rs'
          if git diff --quiet -- "$target"; then
            echo 'No formatter delta to commit.'
            exit 0
          fi
          if [[ "$(git diff --name-only)" != "$target" ]]; then
            echo 'Refusing to commit outside the owned transition source.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$target"
          git commit -m 'style(commons): format recovery transition commitment'
          git push origin HEAD:feat/regenerative-recovery-transition-commitment-v1
