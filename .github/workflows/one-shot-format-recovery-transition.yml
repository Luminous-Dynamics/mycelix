name: One-shot Format Recovery Transition

on:
  push:
    branches:
      - feat/regenerative-recovery-transition-commitment-v1

permissions:
  contents: write

concurrency:
  group: one-shot-format-recovery-transition
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/regenerative-recovery-transition-commitment-v1
          fetch-depth: 2

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Format only owned transition source
        shell: bash
        run: |
          set -euo pipefail
          target='mycelix-commons/crates/commons-types/src/regenerative_recovery_transition_commitment.rs'
          rustfmt --edition 2024 "$target"
          changed="$(git diff --name-only)"
          if [[ -z "$changed" ]]; then
            echo 'Already formatted; no commit required.'
            exit 0
          fi
          if [[ "$changed" != "$target" ]]; then
            echo "Unexpected formatter scope: $changed" >&2
            exit 1
          fi

      - name: Test commons-types before write
        run: cargo test --manifest-path mycelix-commons/Cargo.toml -p commons-types

      - name: Clippy commons-types; gate owned transition source
        shell: bash
        run: |
          set -euo pipefail
          target='mycelix-commons/crates/commons-types/src/regenerative_recovery_transition_commitment.rs'
          set +e
          cargo clippy --manifest-path mycelix-commons/Cargo.toml -p commons-types \
            --message-format=json 2>&1 | tee /tmp/recovery-transition-helper-clippy.jsonl
          cargo_status=${PIPESTATUS[0]}
          set -e
          python3 - "$target" "$cargo_status" <<'PY'
          import json
          import sys

          target = sys.argv[1]
          cargo_status = int(sys.argv[2])
          owned_warnings = []
          compiler_errors = []
          with open('/tmp/recovery-transition-helper-clippy.jsonl', encoding='utf-8', errors='replace') as handle:
              for line in handle:
                  try:
                      event = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if event.get('reason') != 'compiler-message':
                      continue
                  message = event.get('message') or {}
                  level = message.get('level')
                  spans = message.get('spans') or []
                  if level == 'error':
                      compiler_errors.append(message.get('message', 'compiler error'))
                  if level == 'warning' and any(
                      span.get('is_primary') and span.get('file_name') == target for span in spans
                  ):
                      owned_warnings.append(message.get('message', 'warning'))

          if cargo_status != 0 or compiler_errors:
              print('Compiler/Clippy execution failed', file=sys.stderr)
              for error in compiler_errors:
                  print(f'- {error}', file=sys.stderr)
              raise SystemExit(1)
          if owned_warnings:
              print('Owned transition-source warnings:', file=sys.stderr)
              for warning in owned_warnings:
                  print(f'- {warning}', file=sys.stderr)
              raise SystemExit(1)
          print('PASS: package compiled and transition source has no Clippy warnings')
          PY

      - name: Commit exact formatter delta
        shell: bash
        run: |
          set -euo pipefail
          target='mycelix-commons/crates/commons-types/src/regenerative_recovery_transition_commitment.rs'
          if git diff --quiet -- "$target"; then
            echo 'No formatter delta to commit.'
            exit 0
          fi
          if [[ "$(git diff --name-only)" != "$target" ]]; then
            echo 'Refusing to commit outside the owned transition source.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$target"
          git commit -m 'style(commons): format recovery transition commitment'
          git push origin HEAD:feat/regenerative-recovery-transition-commitment-v1
