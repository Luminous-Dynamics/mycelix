name: Mycelix GitHub Authentication Currentness Exact-Head

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'mycelix-workspace/mycelix-core/libs/proofs-evidence-authentication/**'
      - '.github/workflows/github-auth-currentness-exact-head.yml'
  workflow_dispatch:
    inputs:
      subject_sha:
        description: 'Exact 40-hex commit SHA to qualify'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-auth-currentness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Exact-head GitHub authentication currentness qualification
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Resolve exact subject
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            subject='${{ github.event.pull_request.head.sha }}'
          else
            subject='${{ inputs.subject_sha }}'
          fi
          [[ "$subject" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid subject SHA: $subject" >&2; exit 1; }
          echo "sha=$subject" >> "$GITHUB_OUTPUT"

      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.subject.outputs.sha }}
          fetch-depth: 1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: rustfmt,clippy

      - name: Preflight exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.subject.outputs.sha }}"
          test -z "$(git status --porcelain)"
          evidence="$RUNNER_TEMP/github-auth-currentness-evidence"
          mkdir -p "$evidence"
          {
            echo "subject_sha=${{ steps.subject.outputs.sha }}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            rustc -Vv
            cargo -V
          } > "$evidence/execution-capsule.txt"
          find mycelix-workspace/mycelix-core/libs/proofs-evidence-authentication \
            -type f -not -path '*/target/*' -print0 | sort -z | xargs -0 sha256sum \
            > "$evidence/source-sha256.txt"

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path \
            mycelix-workspace/mycelix-core/libs/proofs-evidence-authentication/Cargo.toml \
            --all -- --check

      - name: Prepare isolated resolved graph
        shell: bash
        run: |
          set -euo pipefail
          crate="$RUNNER_TEMP/github-auth-currentness-qual"
          evidence="$RUNNER_TEMP/github-auth-currentness-evidence"
          cp -a mycelix-workspace/mycelix-core/libs/proofs-evidence-authentication "$crate"
          cd "$crate"
          cargo generate-lockfile
          cp Cargo.lock "$evidence/Cargo.lock"
          sha256sum Cargo.lock > "$evidence/Cargo.lock.sha256"
          cargo metadata --locked --format-version 1 > "$evidence/cargo-metadata.json"
          cargo tree --locked > "$evidence/cargo-tree.txt"
          grep -F 'time v0.3.55' "$evidence/cargo-tree.txt"

      - name: Execute committed corpus
        shell: bash
        run: |
          set -euo pipefail
          crate="$RUNNER_TEMP/github-auth-currentness-qual"
          evidence="$RUNNER_TEMP/github-auth-currentness-evidence"
          cd "$crate"
          cargo test --locked --all-targets -- --nocapture | tee "$evidence/committed-tests.txt"
          cargo test --locked --all-targets -- --list > "$evidence/committed-test-list.txt"

      - name: Install external currentness probes
        shell: bash
        run: |
          set -euo pipefail
          crate="$RUNNER_TEMP/github-auth-currentness-qual"
          mkdir -p "$crate/tests"
          cat > "$crate/tests/github_auth_currentness_public_probe.rs" <<'RS'
          use proofs_evidence_authentication::{
              AuthenticationFreshnessPolicyV1, GitObjectIdV1,
              GitHubAuthenticationCurrentnessAuthorityV1,
              GitHubAuthenticationCurrentnessErrorV1, GitHubPublicVerifierExecutionPolicyV1,
              GitHubTrustedBuilderBindingV1, GitHubTrustedBuilderPolicyV1,
              NixVerifierClosureIdentityV1, QualificationAttestationPredicateV1,
              QualificationReceiptV1, QualificationResultV1, ReceiptAuthenticationPolicyV1,
              Sha256DigestV1, SourceRevisionPolicyV1, TransparencyPolicyV1,
              VerifierExecutableIdentityV1, VerifierExecutionReceiptV1,
              VerifierProcessOutcomeV1, VerifierProfileV1, VerifierTrustRootModeV1,
              WorkflowRevisionPolicyV1, AUTHENTICATION_EVIDENCE_DIGEST_PROFILE_V1,
              AUTHENTICATION_POLICY_DIGEST_PROFILE_V1, GITHUB_ACTIONS_OIDC_ISSUER_V1,
              GITHUB_AUTHENTICATION_CURRENTNESS_PROFILE_V1,
              GITHUB_HOSTED_RUNNER_ENVIRONMENT_V1, GITHUB_PUBLIC_BACKEND_FAMILY_V1,
              GITHUB_PUBLIC_COMMAND_PROFILE_ID_V1, GITHUB_PUBLIC_PLATFORM_PROFILE_V1,
              GITHUB_PUBLIC_REPOSITORY_VISIBILITY_V1,
              MYCELIX_QUALIFICATION_PREDICATE_TYPE_V1,
              MYCELIX_QUALIFICATION_SUBJECT_NAME_V1, MYCELIX_REPOSITORY_OWNER_V1,
              MYCELIX_REPOSITORY_V1, QUALIFICATION_ATTESTATION_PREDICATE_SCHEMA_V1,
              SIGSTORE_PUBLIC_GOOD_FULCIO_URI_V1, SIGSTORE_TRUSTED_ROOT_MEDIA_TYPE_V1,
              SIGSTORE_VERIFICATION_RESULT_MEDIA_TYPE_V1,
              TRUSTED_BUILDER_POLICY_DIGEST_PROFILE_V1, VERIFIER_EXECUTION_EVIDENCE_VERSION_V1,
              VERIFIED_WITNESS_TIME_PROFILE_V1, authentication_policy_digest_v1,
              bind_unique_github_trusted_builder_candidate_v1,
              build_github_public_command_plan_with_execution_policy_v1,
              classify_github_default_dual_trusted_root_v1,
              evaluate_github_authentication_currentness_v1,
              github_verifier_stdout_digest_v1,
              parse_github_attestation_verifier_output_v1, trusted_builder_policy_digest_v1,
          };
          use sha2::{Digest, Sha256};

          const REPOSITORY_ID: &str = "1176351975";
          const OWNER_ID: &str = "216969177";
          const STATEMENT_TYPE: &str = "https://in-toto.io/Statement/v1";
          const PUBLIC_TLOG_A: &str = "https://rekor.sigstore.dev";
          const PUBLIC_TLOG_B: &str = "https://log2025-1.rekor.sigstore.dev";
          const PRIVATE_TLOG: &str = "https://rekor.private.github.example";
          const UNKNOWN_TLOG: &str = "https://unknown.example/tlog";
          const EXECUTION_STARTED: u64 = 1_789_862_480;
          const ROOT_ACQUIRED: u64 = 1_789_862_490;
          const EXECUTION_COMPLETED: u64 = 1_789_862_500;

          fn digest(byte: u8) -> Sha256DigestV1 {
              Sha256DigestV1::from_bytes([byte; 32])
          }

          fn raw_sha256(bytes: &[u8]) -> Sha256DigestV1 {
              let mut hasher = Sha256::new();
              hasher.update(bytes);
              Sha256DigestV1::from_bytes(hasher.finalize().into())
          }

          fn receipt() -> QualificationReceiptV1 {
              QualificationReceiptV1 {
                  receipt_version: 1,
                  qualification_profile: "myc-zkp-range-001aq".into(),
                  statement_profile: "range-membership-v1".into(),
                  theorem_profile: "range-membership-v1-air".into(),
                  subject: GitObjectIdV1::sha1([0xaa; 20]),
                  dependency_graph_digest: digest(1),
                  measured_security_receipt_digest: digest(2),
                  coherence_policy_id: "coherence-v1".into(),
                  coherence_result_digest: digest(3),
                  qualification_corpus_digest: digest(4),
                  execution_capsule_digest: digest(5),
                  result: QualificationResultV1::Pass,
                  nonclaims: vec!["application authority not granted".into()],
              }
          }

          fn root_line(tlogs: &[&str], cas: &[&str]) -> String {
              serde_json::to_string(&serde_json::json!({
                  "mediaType": SIGSTORE_TRUSTED_ROOT_MEDIA_TYPE_V1,
                  "tlogs": tlogs.iter().map(|uri| serde_json::json!({"baseUrl": uri})).collect::<Vec<_>>(),
                  "certificateAuthorities": cas.iter().map(|uri| serde_json::json!({"uri": uri})).collect::<Vec<_>>()
              })).unwrap()
          }

          fn roots() -> Vec<u8> {
              format!(
                  "{}\n{}\n",
                  root_line(
                      &[PUBLIC_TLOG_A, PUBLIC_TLOG_B],
                      &[SIGSTORE_PUBLIC_GOOD_FULCIO_URI_V1],
                  ),
                  root_line(&[PRIVATE_TLOG], &["https://fulcio.private.github.example"]),
              ).into_bytes()
          }

          fn authentication_policy(
              root_digest: Sha256DigestV1,
              freshness: AuthenticationFreshnessPolicyV1,
              transparency: TransparencyPolicyV1,
          ) -> ReceiptAuthenticationPolicyV1 {
              ReceiptAuthenticationPolicyV1 {
                  profile_id: "github-public-v1".into(),
                  verifier_profile: VerifierProfileV1 {
                      profile_id: "github-attestation-verifier-v1".into(),
                      backend_family: GITHUB_PUBLIC_BACKEND_FAMILY_V1.into(),
                      backend_version: "2.101.0".into(),
                      verification_profile: "public-sigstore-qualification-v1".into(),
                  },
                  expected_attestation_subject_name: MYCELIX_QUALIFICATION_SUBJECT_NAME_V1.into(),
                  expected_predicate_type: MYCELIX_QUALIFICATION_PREDICATE_TYPE_V1.into(),
                  expected_predicate_schema: QUALIFICATION_ATTESTATION_PREDICATE_SCHEMA_V1.into(),
                  trusted_root_profile: "sigstore-public-good-v1".into(),
                  trusted_root_digest: root_digest,
                  oidc_issuer: GITHUB_ACTIONS_OIDC_ISSUER_V1.into(),
                  source_repository: MYCELIX_REPOSITORY_V1.into(),
                  source_repository_owner: MYCELIX_REPOSITORY_OWNER_V1.into(),
                  signer_workflow: ".github/workflows/qualify.yml".into(),
                  signer_workflow_revision: WorkflowRevisionPolicyV1::Exact(
                      GitObjectIdV1::sha1([0xbb; 20]),
                  ),
                  source_revision: SourceRevisionPolicyV1 {
                      exact_commit: GitObjectIdV1::sha1([0xaa; 20]),
                      exact_git_ref: Some("refs/heads/main".into()),
                  },
                  transparency_policy: transparency,
                  freshness_policy: freshness,
              }
          }

          fn verifier() -> VerifierExecutableIdentityV1 {
              VerifierExecutableIdentityV1 {
                  profile_id: "gh-exact-v1".into(),
                  backend_family: GITHUB_PUBLIC_BACKEND_FAMILY_V1.into(),
                  semantic_version: "2.101.0".into(),
                  executable_sha256: digest(7),
                  platform_profile: GITHUB_PUBLIC_PLATFORM_PROFILE_V1.into(),
                  command_profile_id: GITHUB_PUBLIC_COMMAND_PROFILE_ID_V1.into(),
                  nix_closure: Some(NixVerifierClosureIdentityV1 {
                      store_path: "/nix/store/example-gh/bin/gh".into(),
                      closure_digest: digest(8),
                  }),
              }
          }

          fn execution_policy() -> GitHubPublicVerifierExecutionPolicyV1 {
              GitHubPublicVerifierExecutionPolicyV1::new(
                  "github-public-exact-executable-v1",
                  "github-public-v1",
                  "github-attestation-verifier-v1",
                  "public-sigstore-qualification-v1",
                  verifier(),
                  "/nix/store/example-gh/bin/gh",
              ).unwrap()
          }

          fn builder_policy() -> GitHubTrustedBuilderPolicyV1 {
              GitHubTrustedBuilderPolicyV1::new(
                  "mycelix-github-trusted-builder-v1",
                  REPOSITORY_ID,
                  OWNER_ID,
                  STATEMENT_TYPE,
                  GITHUB_HOSTED_RUNNER_ENVIRONMENT_V1,
                  GITHUB_PUBLIC_REPOSITORY_VISIBILITY_V1,
                  true,
                  true,
              ).unwrap()
          }

          fn strict_predicate(receipt: &QualificationReceiptV1) -> QualificationAttestationPredicateV1 {
              QualificationAttestationPredicateV1 {
                  predicate_version: 1,
                  predicate_schema: QUALIFICATION_ATTESTATION_PREDICATE_SCHEMA_V1.into(),
                  receipt_digest: receipt.digest().unwrap(),
                  qualification_profile: receipt.qualification_profile.clone(),
                  subject: receipt.subject,
                  coherence_result_digest: receipt.coherence_result_digest,
                  result: receipt.result,
              }
          }

          fn witness(kind: &str, uri: &str, timestamp: &str) -> serde_json::Value {
              serde_json::json!({"type": kind, "uri": uri, "timestamp": timestamp})
          }

          fn candidate(
              receipt: &QualificationReceiptV1,
              witnesses: Vec<serde_json::Value>,
          ) -> serde_json::Value {
              let receipt_digest = receipt.digest().unwrap();
              let signer_uri = "https://github.com/Luminous-Dynamics/mycelix/.github/workflows/qualify.yml@refs/heads/main";
              serde_json::json!({
                  "attestation": {"bundle": "retained-elsewhere"},
                  "verificationResult": {
                      "mediaType": SIGSTORE_VERIFICATION_RESULT_MEDIA_TYPE_V1,
                      "statement": {
                          "_type": STATEMENT_TYPE,
                          "subject": [{
                              "name": MYCELIX_QUALIFICATION_SUBJECT_NAME_V1,
                              "digest": {"sha256": receipt_digest.sha256.to_hex()}
                          }],
                          "predicateType": MYCELIX_QUALIFICATION_PREDICATE_TYPE_V1,
                          "predicate": serde_json::to_value(strict_predicate(receipt)).unwrap()
                      },
                      "signature": {"certificate": {
                          "certificateIssuer": "CN=sigstore-intermediate,O=sigstore.dev",
                          "subjectAlternativeName": signer_uri,
                          "issuer": GITHUB_ACTIONS_OIDC_ISSUER_V1,
                          "buildSignerURI": signer_uri,
                          "buildSignerDigest": "bb".repeat(20),
                          "runnerEnvironment": GITHUB_HOSTED_RUNNER_ENVIRONMENT_V1,
                          "sourceRepositoryURI": "https://github.com/Luminous-Dynamics/mycelix",
                          "sourceRepositoryDigest": "aa".repeat(20),
                          "sourceRepositoryRef": "refs/heads/main",
                          "sourceRepositoryIdentifier": REPOSITORY_ID,
                          "sourceRepositoryOwnerURI": "https://github.com/Luminous-Dynamics",
                          "sourceRepositoryOwnerIdentifier": OWNER_ID,
                          "buildConfigURI": signer_uri,
                          "buildConfigDigest": "bb".repeat(20),
                          "buildTrigger": "pull_request",
                          "runInvocationURI": "https://github.com/Luminous-Dynamics/mycelix/actions/runs/4735384265/attempts/2",
                          "sourceRepositoryVisibilityAtSigning": GITHUB_PUBLIC_REPOSITORY_VISIBILITY_V1
                      }},
                      "verifiedTimestamps": witnesses
                  }
              })
          }

          fn build_binding(
              freshness: AuthenticationFreshnessPolicyV1,
              transparency: TransparencyPolicyV1,
              witnesses: Vec<serde_json::Value>,
              stderr_byte: u8,
          ) -> GitHubTrustedBuilderBindingV1 {
              let receipt = receipt();
              let root_bytes = roots();
              let auth = authentication_policy(raw_sha256(&root_bytes), freshness, transparency);
              let execution_policy = execution_policy();
              let plan = build_github_public_command_plan_with_execution_policy_v1(
                  &execution_policy,
                  &auth,
                  &receipt,
                  &verifier(),
                  GitObjectIdV1::sha1([0xbb; 20]),
                  "/tmp/mycelix-gh-verify",
              ).unwrap();
              let stdout = serde_json::to_vec(&vec![candidate(&receipt, witnesses)]).unwrap();
              let execution_receipt = VerifierExecutionReceiptV1 {
                  evidence_version: VERIFIER_EXECUTION_EVIDENCE_VERSION_V1,
                  verifier: verifier(),
                  canonical_receipt_digest: plan.canonical_receipt_digest(),
                  attestation_bundle_digest: digest(4),
                  trust_root_mode: VerifierTrustRootModeV1::OnlineFetchThenRetainedVerifyV1,
                  trusted_root_material_digest: raw_sha256(&root_bytes),
                  trusted_root_acquired_at_unix_seconds: ROOT_ACQUIRED,
                  command_arguments_digest: plan.command_arguments_digest(),
                  environment_profile_digest: plan.environment_profile_digest(),
                  verifier_stdout_digest: github_verifier_stdout_digest_v1(&stdout),
                  verifier_stderr_digest: digest(stderr_byte),
                  execution_started_at_unix_seconds: EXECUTION_STARTED,
                  execution_completed_at_unix_seconds: EXECUTION_COMPLETED,
                  process_outcome: VerifierProcessOutcomeV1::ExitCode(0),
                  parsed_result_count: 1,
              };
              let parsed = parse_github_attestation_verifier_output_v1(&stdout, &execution_receipt).unwrap();
              let classification = classify_github_default_dual_trusted_root_v1(
                  &root_bytes,
                  &execution_receipt,
                  &execution_policy,
                  &plan,
              ).unwrap();
              bind_unique_github_trusted_builder_candidate_v1(
                  &receipt,
                  &auth,
                  &builder_policy(),
                  &parsed,
                  &classification,
              ).unwrap()
          }

          #[test]
          fn current_at_verification_uses_exact_execution_time_without_synthetic_age() {
              let binding = build_binding(
                  AuthenticationFreshnessPolicyV1::CurrentAtVerification,
                  TransparencyPolicyV1::PublicTransparencyRequired,
                  vec![witness("Tlog", PUBLIC_TLOG_A, "2026-09-20T00:00:00Z")],
                  9,
              );
              let current = evaluate_github_authentication_currentness_v1(&binding).unwrap();
              assert_eq!(current.profile_id(), GITHUB_AUTHENTICATION_CURRENTNESS_PROFILE_V1);
              assert_eq!(current.evaluated_at_unix_seconds(), EXECUTION_COMPLETED);
              assert!(current.current_trust_material_at_verification());
              assert!(current.establishes_current_trust_material_at_verification());
              assert!(!current.establishes_attestation_age());
              assert_eq!(current.age_seconds(), None);
              assert!(current.conservative_witness_time().is_none());
              assert_eq!(current.authority_scope(), GitHubAuthenticationCurrentnessAuthorityV1::CurrentnessEvidenceOnly);
              assert!(!current.establishes_receipt_authentication());
              assert!(!current.grants_production_authority());
              assert!(!current.grants_application_authority());
          }

          #[test]
          fn maximum_age_exact_and_fractional_boundaries_are_conservative() {
              for timestamp in ["2026-09-20T00:00:00Z", "2026-09-20T00:00:00.500Z"] {
                  let binding = build_binding(
                      AuthenticationFreshnessPolicyV1::MaximumAgeSeconds(100),
                      TransparencyPolicyV1::PublicTransparencyRequired,
                      vec![witness("Tlog", PUBLIC_TLOG_A, timestamp)],
                      9,
                  );
                  let current = evaluate_github_authentication_currentness_v1(&binding).unwrap();
                  assert_eq!(current.age_seconds(), Some(100));
                  let selected = current.conservative_witness_time().unwrap();
                  assert_eq!(selected.profile_id(), VERIFIED_WITNESS_TIME_PROFILE_V1);
                  assert_eq!(selected.uri(), PUBLIC_TLOG_A);
              }

              let binding = build_binding(
                  AuthenticationFreshnessPolicyV1::MaximumAgeSeconds(100),
                  TransparencyPolicyV1::PublicTransparencyRequired,
                  vec![witness("Tlog", PUBLIC_TLOG_A, "2026-09-19T23:59:59.999Z")],
                  9,
              );
              assert_eq!(
                  evaluate_github_authentication_currentness_v1(&binding),
                  Err(GitHubAuthenticationCurrentnessErrorV1::MaximumAgeExceeded {
                      maximum: 100,
                      actual: 101,
                  })
              );
          }

          #[test]
          fn every_qualifying_public_good_witness_must_parse_and_not_be_future() {
              for bad in ["not-a-time", "2026-09-20T00:01:40.001Z"] {
                  let binding = build_binding(
                      AuthenticationFreshnessPolicyV1::MaximumAgeSeconds(200),
                      TransparencyPolicyV1::PublicTransparencyRequired,
                      vec![
                          witness("Tlog", PUBLIC_TLOG_A, "2026-09-20T00:00:00Z"),
                          witness("Tlog", PUBLIC_TLOG_B, bad),
                      ],
                      9,
                  );
                  let result = evaluate_github_authentication_currentness_v1(&binding);
                  if bad == "not-a-time" {
                      assert!(matches!(
                          result,
                          Err(GitHubAuthenticationCurrentnessErrorV1::MalformedVerifiedTimestamp { .. })
                      ));
                  } else {
                      assert!(matches!(
                          result,
                          Err(GitHubAuthenticationCurrentnessErrorV1::TimestampAfterExecution { .. })
                      ));
                  }
              }
          }

          #[test]
          fn newer_tsa_or_public_log_cannot_refresh_old_public_good_evidence() {
              let old = "2026-09-19T23:59:59Z";
              let newer = "2026-09-20T00:01:30Z";
              let binding = build_binding(
                  AuthenticationFreshnessPolicyV1::MaximumAgeSeconds(100),
                  TransparencyPolicyV1::PublicTransparencyRequired,
                  vec![
                      witness("Tlog", PUBLIC_TLOG_A, old),
                      witness("TimestampAuthority", "https://tsa.example", newer),
                  ],
                  9,
              );
              assert_eq!(
                  evaluate_github_authentication_currentness_v1(&binding),
                  Err(GitHubAuthenticationCurrentnessErrorV1::MaximumAgeExceeded {
                      maximum: 100,
                      actual: 101,
                  })
              );

              let binding = build_binding(
                  AuthenticationFreshnessPolicyV1::MaximumAgeSeconds(100),
                  TransparencyPolicyV1::PublicTransparencyRequired,
                  vec![
                      witness("Tlog", PUBLIC_TLOG_A, old),
                      witness("Tlog", PUBLIC_TLOG_B, newer),
                  ],
                  9,
              );
              assert_eq!(
                  evaluate_github_authentication_currentness_v1(&binding),
                  Err(GitHubAuthenticationCurrentnessErrorV1::MaximumAgeExceeded {
                      maximum: 100,
                      actual: 101,
                  })
              );
          }

          #[test]
          fn private_unresolved_or_tsa_only_witnesses_cannot_establish_max_age() {
              for (kind, uri) in [
                  ("Tlog", PRIVATE_TLOG),
                  ("Tlog", UNKNOWN_TLOG),
                  ("TimestampAuthority", "https://tsa.example"),
              ] {
                  let binding = build_binding(
                      AuthenticationFreshnessPolicyV1::MaximumAgeSeconds(100),
                      TransparencyPolicyV1::TimestampRequired,
                      vec![witness(kind, uri, "2026-09-20T00:01:30Z")],
                      9,
                  );
                  assert_eq!(
                      evaluate_github_authentication_currentness_v1(&binding),
                      Err(GitHubAuthenticationCurrentnessErrorV1::NoQualifyingPublicGoodTimestamp)
                  );
              }
          }

          #[test]
          fn policy_digest_canonicalizes_allowed_revision_set_order() {
              let root_digest = raw_sha256(&roots());
              let mut a = authentication_policy(
                  root_digest,
                  AuthenticationFreshnessPolicyV1::CurrentAtVerification,
                  TransparencyPolicyV1::PublicTransparencyRequired,
              );
              let mut b = a.clone();
              let r1 = GitObjectIdV1::sha1([0xbb; 20]);
              let r2 = GitObjectIdV1::sha1([0xcc; 20]);
              a.signer_workflow_revision = WorkflowRevisionPolicyV1::Allowed(vec![r1, r2]);
              b.signer_workflow_revision = WorkflowRevisionPolicyV1::Allowed(vec![r2, r1]);
              assert_eq!(a.validate(), Ok(()));
              assert_eq!(b.validate(), Ok(()));
              assert_eq!(authentication_policy_digest_v1(&a), authentication_policy_digest_v1(&b));
              assert_eq!(AUTHENTICATION_POLICY_DIGEST_PROFILE_V1, "mycelix-receipt-authentication-policy-digest-v1");
              assert_eq!(TRUSTED_BUILDER_POLICY_DIGEST_PROFILE_V1, "mycelix-github-trusted-builder-policy-digest-v1");
              assert_ne!(authentication_policy_digest_v1(&a), digest(0xff));
              assert_ne!(trusted_builder_policy_digest_v1(&builder_policy()), digest(0xfe));
          }

          #[test]
          fn authentication_evidence_digest_is_deterministic_and_lineage_sensitive() {
              let witnesses = vec![witness("Tlog", PUBLIC_TLOG_A, "2026-09-20T00:00:00Z")];
              let a = build_binding(
                  AuthenticationFreshnessPolicyV1::MaximumAgeSeconds(100),
                  TransparencyPolicyV1::PublicTransparencyRequired,
                  witnesses.clone(),
                  9,
              );
              let current_a1 = evaluate_github_authentication_currentness_v1(&a).unwrap();
              let current_a2 = evaluate_github_authentication_currentness_v1(&a).unwrap();
              assert_eq!(current_a1.authentication_evidence_digest(), current_a2.authentication_evidence_digest());
              assert_eq!(current_a1.authentication_policy_digest(), authentication_policy_digest_v1(a.authentication_policy()));
              assert_eq!(current_a1.trusted_builder_policy_digest(), trusted_builder_policy_digest_v1(a.trusted_builder_policy()));
              assert_eq!(AUTHENTICATION_EVIDENCE_DIGEST_PROFILE_V1, "mycelix-github-authentication-evidence-digest-v1");

              let b = build_binding(
                  AuthenticationFreshnessPolicyV1::MaximumAgeSeconds(100),
                  TransparencyPolicyV1::PublicTransparencyRequired,
                  witnesses,
                  10,
              );
              let current_b = evaluate_github_authentication_currentness_v1(&b).unwrap();
              assert_ne!(current_a1.authentication_evidence_digest(), current_b.authentication_evidence_digest());
          }
          RS

      - name: Execute external currentness probes
        shell: bash
        run: |
          set -euo pipefail
          crate="$RUNNER_TEMP/github-auth-currentness-qual"
          evidence="$RUNNER_TEMP/github-auth-currentness-evidence"
          cd "$crate"
          cargo test --locked --test github_auth_currentness_public_probe -- --nocapture \
            | tee "$evidence/public-currentness-probes.txt"

      - name: Prove caller wall clock is absent
        shell: bash
        run: |
          set -euo pipefail
          crate="$RUNNER_TEMP/github-auth-currentness-qual"
          evidence="$RUNNER_TEMP/github-auth-currentness-evidence"
          cat > "$crate/tests/no_caller_wall_clock.rs" <<'RS'
          use proofs_evidence_authentication::{
              GitHubTrustedBuilderBindingV1, evaluate_github_authentication_currentness_v1,
          };
          fn probe(binding: &GitHubTrustedBuilderBindingV1) {
              let _ = evaluate_github_authentication_currentness_v1(binding, 123_u64);
          }
          RS
          set +e
          (
            cd "$crate"
            CARGO_TERM_COLOR=never cargo check --locked --test no_caller_wall_clock
          ) > "$evidence/no-caller-wall-clock.stdout.txt" \
            2> "$evidence/no-caller-wall-clock.stderr.txt"
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo "currentness evaluator unexpectedly accepts caller time" >&2
            exit 1
          fi
          grep -Fq "E0061" "$evidence/no-caller-wall-clock.stderr.txt"

      - name: Prove currentness cannot convert into authenticated receipt
        shell: bash
        run: |
          set -euo pipefail
          crate="$RUNNER_TEMP/github-auth-currentness-qual"
          evidence="$RUNNER_TEMP/github-auth-currentness-evidence"
          cat > "$crate/tests/no_currentness_to_authentication.rs" <<'RS'
          use proofs_evidence_authentication::{
              AuthenticatedQualificationReceiptV1, GitHubAuthenticationCurrentnessV1,
          };
          fn require_into<T: Into<AuthenticatedQualificationReceiptV1>>() {}
          #[test] fn probe() { require_into::<GitHubAuthenticationCurrentnessV1>(); }
          RS
          set +e
          (
            cd "$crate"
            CARGO_TERM_COLOR=never cargo check --locked --test no_currentness_to_authentication
          ) > "$evidence/no-currentness-to-authentication.stdout.txt" \
            2> "$evidence/no-currentness-to-authentication.stderr.txt"
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo "currentness evidence unexpectedly converts into authenticated capability" >&2
            exit 1
          fi
          grep -Fq "AuthenticatedQualificationReceiptV1" "$evidence/no-currentness-to-authentication.stderr.txt"
          grep -Fq "trait bound" "$evidence/no-currentness-to-authentication.stderr.txt"

      - name: Prove currentness cannot deserialize or default into authority
        shell: bash
        run: |
          set -euo pipefail
          crate="$RUNNER_TEMP/github-auth-currentness-qual"
          evidence="$RUNNER_TEMP/github-auth-currentness-evidence"
          cat > "$crate/tests/no_currentness_deserialize_default.rs" <<'RS'
          use proofs_evidence_authentication::GitHubAuthenticationCurrentnessV1;
          fn require_default<T: Default>() {}
          #[test]
          fn probe() {
              require_default::<GitHubAuthenticationCurrentnessV1>();
              let _: GitHubAuthenticationCurrentnessV1 = serde_json::from_str("{}").unwrap();
          }
          RS
          set +e
          (
            cd "$crate"
            CARGO_TERM_COLOR=never cargo check --locked --test no_currentness_deserialize_default
          ) > "$evidence/no-currentness-deserialize-default.stdout.txt" \
            2> "$evidence/no-currentness-deserialize-default.stderr.txt"
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo "currentness evidence unexpectedly implements Default/Deserialize" >&2
            exit 1
          fi
          grep -Fq "GitHubAuthenticationCurrentnessV1" "$evidence/no-currentness-deserialize-default.stderr.txt"
          grep -Eq "Default|Deserialize" "$evidence/no-currentness-deserialize-default.stderr.txt"
          grep -Fq "trait bound" "$evidence/no-currentness-deserialize-default.stderr.txt"

      - name: Remove qualification-only probes
        shell: bash
        run: rm -rf "$RUNNER_TEMP/github-auth-currentness-qual/tests"

      - name: Warnings-denied Clippy
        shell: bash
        run: |
          set -euo pipefail
          crate="$RUNNER_TEMP/github-auth-currentness-qual"
          evidence="$RUNNER_TEMP/github-auth-currentness-evidence"
          cd "$crate"
          cargo clippy --locked --all-targets -- -D warnings | tee "$evidence/clippy.txt"

      - name: Verify checkout immutability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.subject.outputs.sha }}"
          test -z "$(git status --porcelain)"
          evidence="$RUNNER_TEMP/github-auth-currentness-evidence"
          find mycelix-workspace/mycelix-core/libs/proofs-evidence-authentication \
            -type f -not -path '*/target/*' -print0 | sort -z | xargs -0 sha256sum \
            > "$evidence/source-sha256-post.txt"
          cmp "$evidence/source-sha256.txt" "$evidence/source-sha256-post.txt"

      - name: Write qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/github-auth-currentness-evidence"
          cat > "$evidence/QUALIFICATION.txt" <<EOF
          MYC-ZKP-GH-CURRENTNESS-001AQ PASS
          subject_sha=${{ steps.subject.outputs.sha }}
          authority_scope=CurrentnessEvidenceOnly
          caller_wall_clock=false
          public_good_oldest_witness_controls_age=true
          authentication_evidence_digest_profile=mycelix-github-authentication-evidence-digest-v1
          receipt_authentication=false
          production_admission=false
          application_authority=false
          EOF

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myc-zkp-gh-currentness-001aq-${{ steps.subject.outputs.sha }}
          path: ${{ runner.temp }}/github-auth-currentness-evidence
          if-no-files-found: warn
          retention-days: 30
