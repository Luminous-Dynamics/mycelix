name: Fabrication hApp CI

on:
  push:
    branches:
      - main
      - hardening/**
      - research/**
    paths:
      - "mycelix-workspace/happs/fabrication/**"
      - ".github/workflows/fabrication-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "mycelix-workspace/happs/fabrication/**"
      - ".github/workflows/fabrication-ci.yml"
  workflow_dispatch:

concurrency:
  group: fabrication-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fabrication:
    name: Fabrication workspace
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mycelix-workspace/happs/fabrication
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-workspace/happs/fabrication

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run native tests
        run: cargo test --target x86_64-unknown-linux-gnu --workspace

      - name: Check WASM build
        run: cargo build --release --target wasm32-unknown-unknown --workspace

      - name: Clippy
        run: cargo clippy --workspace --no-deps --lib --target wasm32-unknown-unknown -- -D warnings
