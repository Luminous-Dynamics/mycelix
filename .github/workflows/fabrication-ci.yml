name: Fabrication hApp CI

on:
  push:
    branches:
      - main
      - hardening/**
      - research/**
    paths:
      - "mycelix-workspace/happs/fabrication/**"
      - ".github/workflows/fabrication-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "mycelix-workspace/happs/fabrication/**"
      - ".github/workflows/fabrication-ci.yml"
  workflow_dispatch:

concurrency:
  group: fabrication-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fabrication:
    name: Fabrication workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mycelix-workspace/happs/fabrication
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96.1
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Assert Rust identity
        run: |
          test "$(rustc +1.96.1 --version | awk '{print $2}')" = "1.96.1"
          test "$(rustc +1.96.1 --version --verbose | sed -n 's/^commit-hash: //p')" = "31fca3adb283cc9dfd56b49cdee9a96eb9c96ffd"
          rustfmt +1.96.1 --version

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: mycelix-workspace/happs/fabrication

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run native tests
        run: cargo test --target x86_64-unknown-linux-gnu --workspace

      - name: Check WASM build
        run: cargo build --release --target wasm32-unknown-unknown --workspace

      - name: Clippy
        run: cargo clippy --workspace --no-deps --lib --target wasm32-unknown-unknown -- -D warnings
