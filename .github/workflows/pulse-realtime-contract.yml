name: Pulse Realtime Contract

on:
  pull_request:
    paths:
      - 'mycelix-workspace/mycelix-pulse/crates/pulse-realtime-types/**'
      - '.github/workflows/pulse-realtime-contract.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-workspace/mycelix-pulse/crates/pulse-realtime-types/**'
      - '.github/workflows/pulse-realtime-contract.yml'

permissions:
  contents: read

concurrency:
  group: pulse-realtime-contract-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MANIFEST: mycelix-workspace/mycelix-pulse/crates/pulse-realtime-types/Cargo.toml

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact subject checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected" || {
            echo "::error::Expected exact subject $expected, got $actual"
            exit 1
          }
          test -f "$MANIFEST"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87b
        with:
          toolchain: 1.96.0
          components: rustfmt,clippy
          targets: wasm32-unknown-unknown

      - name: Resolve contract manifest
        run: cargo metadata --manifest-path "$MANIFEST" --no-deps --format-version 1 >/dev/null

      - name: Check formatting
        run: cargo fmt --manifest-path "$MANIFEST" -- --check

      - name: Check native contract
        run: cargo check --manifest-path "$MANIFEST"

      - name: Check wasm contract
        run: cargo check --manifest-path "$MANIFEST" --target wasm32-unknown-unknown

      - name: Run contract tests
        run: cargo test --manifest-path "$MANIFEST" --lib

      - name: Clippy contract
        run: cargo clippy --manifest-path "$MANIFEST" --lib -- -D warnings

      - name: Prove checkout immutability
        run: git diff --exit-code && test -z "$(git status --porcelain)"
