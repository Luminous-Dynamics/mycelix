name: Integration Materializer Artifact Qualification

on:
  pull_request:
    branches:
      - feat/integration-admin-mutation-exclusion-v1
      - main
    paths:
      - 'crates/mycelix-integration-materializer-artifact/**'
      - 'crates/mycelix-integration-execution-binding/**'
      - '.github/workflows/integration-materializer-artifact-qualification.yml'
  push:
    branches:
      - feat/integration-materializer-artifact-v1
    paths:
      - 'crates/mycelix-integration-materializer-artifact/**'
      - '.github/workflows/integration-materializer-artifact-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MANIFEST: crates/mycelix-integration-materializer-artifact/Cargo.toml

concurrency:
  group: integration-materializer-artifact-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Exact signed-profile WASM artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/mycelix-integration-materializer-artifact

      - name: Check formatting
        run: cargo fmt --manifest-path "$MANIFEST" --all --check

      - name: Compile tests without running
        run: cargo test --manifest-path "$MANIFEST" --no-run

      - name: Run tests
        run: cargo test --manifest-path "$MANIFEST"

      - name: Clippy
        run: cargo clippy --manifest-path "$MANIFEST" --all-targets -- -D warnings

      - name: Enforce exact signed release binding
        shell: bash
        run: |
          set -euo pipefail
          source='crates/mycelix-integration-materializer-artifact/src/lib.rs'

          grep -Fq 'QualifiedProviderExecutionProfile' "$source"
          grep -Fq 'provider.profile().materializer_release' "$source"
          grep -Fq 'provider.profile_commitment()' "$source"
          grep -Fq 'ContentCommitment::sha256(&module_bytes)' "$source"
          grep -Fq 'ReleaseCommitmentMismatch' "$source"
          grep -Fq 'WASM_MAGIC_AND_VERSION_V1' "$source"
          grep -Fq 'O_NOFOLLOW | libc::O_CLOEXEC' "$source"
          grep -Fq 'MutableByGroupOrOther' "$source"
          grep -Fq 'ArtifactChangedDuringRead' "$source"

      - name: Enforce captured-byte semantics
        shell: bash
        run: |
          set -euo pipefail
          source='crates/mycelix-integration-materializer-artifact/src/lib.rs'

          grep -Fq 'module_bytes: Vec<u8>' "$source"
          grep -Fq 'pub fn module_bytes(&self) -> &[u8]' "$source"
          grep -Fq 'exact_profile_release_matched_here(&self) -> bool' "$source"
          grep -Fq 'wasm_container_verified_here(&self) -> bool' "$source"
          grep -Fq 'captured_bytes_immutable_for_object_here(&self) -> bool' "$source"
          grep -Fq 'wasm_import_policy_verified_here(&self) -> bool' "$source"
          grep -Fq 'deterministic_execution_verified_here(&self) -> bool' "$source"
          grep -Fq 'provider_profile_currentness_verified_here(&self) -> bool' "$source"
          grep -Fq 'provider_payload_materialized_here(&self) -> bool' "$source"
          grep -Fq 'grants_execution_authority(&self) -> bool' "$source"

          if grep -Eq 'derive\([^)]*Deserialize' "$source"; then
            echo 'Qualified materializer artifact must not be deserializable.'
            exit 1
          fi
          if grep -Eq 'reqwest::|hyper::|tonic::|stripe::|AdminWebsocket|mark_dispatch_started|update_coordinators\(' "$source"; then
            echo 'Materializer artifact qualification crossed into network/dispatch/effect execution.'
            exit 1
          fi

      - name: Enforce adversarial artifact regressions
        shell: bash
        run: |
          set -euo pipefail
          source='crates/mycelix-integration-materializer-artifact/src/lib.rs'
          grep -Fq 'exact_hash_pinned_wasm_is_captured' "$source"
          grep -Fq 'release_substitution_fails_closed' "$source"
          grep -Fq 'native_or_arbitrary_bytes_are_rejected' "$source"
          grep -Fq 'writable_artifact_is_rejected' "$source"
          grep -Fq 'symlink_artifact_is_rejected' "$source"
