name: REGEN-010 ProductFrozen Artifact Promoter

on:
  push:
    branches:
      - 'ci/regen-010-product-frozen-promoter-v1'

permissions:
  contents: write
  actions: read

jobs:
  promote-exact-preparation-artifact:
    name: Promote exact REGEN-010 preparation capsule
    runs-on: ubuntu-24.04
    env:
      EXPECTED_PARENT_SHA: 2d1cb4fc81065b49ce936c889d4e22e08d10b882
      TARGET_BRANCH: qual/regen-010-soil-evidence-product-frozen-v1
      ARTIFACT_ID: '10422611840'
      EXPECTED_ARTIFACT_SHA256: 64d9b0cef0a6bafe7fba4a5b3722cf4f2e18130ed525292179c03c514d6ae72e
      EXPECTED_MANIFEST_SHA256: 93e77cf8f5bd6a9f91db25bf8a1f3460327fec52bc0e397f524eec2c4a520cb6
      EXPECTED_LOCK_SHA256: b21c7127fa69f6f975578fdc93bcc5cd7a48925264718576f06c583cd39c9f98
      EXPECTED_LIB_SHA256: 766e9024921d972a97f6bab43c98f6d4fb3ce90c71f95f39c79de40cda7f6ae7
      EXPECTED_FIREWALL_SHA256: a74ba1e5160d2e33afaaeb7b6d1a29fc0dde08739e74d18e2b950da1351ab2c6
      EXPECTED_WORKFLOW_SHA256: 00c8eb6675df25b1ca4127b85fafec772477d559704ee16dd3977957f7a47860
    steps:
      - name: Checkout promoter subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Preserve exact staged qualification workflow
        shell: bash
        run: |
          set -euo pipefail
          src='.github/workflows/regen-soil-evidence-product-frozen.yml'
          test -f "$src"
          actual="$(sha256sum "$src" | awk '{print $1}')"
          printf 'qualification_workflow_sha256=%s\n' "$actual"
          test "$actual" = "$EXPECTED_WORKFLOW_SHA256"
          cp "$src" /tmp/regen-soil-evidence-product-frozen.yml

      - name: Refuse to overwrite an existing qualification branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "target branch already exists: $TARGET_BRANCH" >&2
            exit 1
          fi

      - name: Download exact preparation artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$url" -o /tmp/regen010-prepared.zip
          actual="$(sha256sum /tmp/regen010-prepared.zip | awk '{print $1}')"
          printf 'expected_artifact_sha256=%s\nactual_artifact_sha256=%s\n' "$EXPECTED_ARTIFACT_SHA256" "$actual"
          test "$actual" = "$EXPECTED_ARTIFACT_SHA256"

      - name: Verify exact capsule contents
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/regen010-prepared
          mkdir -p /tmp/regen010-prepared
          unzip -q /tmp/regen010-prepared.zip -d /tmp/regen010-prepared
          cd /tmp/regen010-prepared
          sha256sum -c PREPARED_FILES.sha256
          grep -Fx 'product_head=052974431f94bdc7e9605fa2b7760079657ad6f2' PREPARATION_RECEIPT.txt
          grep -Fx 'qualification_status=NOT_QUALIFIED_SOURCE_AND_DEPENDENCY_PREPARATION_ONLY' PREPARATION_RECEIPT.txt
          test "$(sha256sum crate/Cargo.toml | awk '{print $1}')" = "$EXPECTED_MANIFEST_SHA256"
          test "$(sha256sum crate/Cargo.lock | awk '{print $1}')" = "$EXPECTED_LOCK_SHA256"
          test "$(sha256sum crate/src/lib.rs | awk '{print $1}')" = "$EXPECTED_LIB_SHA256"
          test "$(sha256sum crate/tests/lineage_firewall.rs | awk '{print $1}')" = "$EXPECTED_FIREWALL_SHA256"

      - name: Construct and push one-commit ProductFrozen subject
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$EXPECTED_PARENT_SHA"
          git checkout --detach "$EXPECTED_PARENT_SHA"
          mkdir -p crates/mycelix-regenerative-evidence/src crates/mycelix-regenerative-evidence/tests .github/workflows
          cp /tmp/regen010-prepared/crate/Cargo.toml crates/mycelix-regenerative-evidence/Cargo.toml
          cp /tmp/regen010-prepared/crate/Cargo.lock crates/mycelix-regenerative-evidence/Cargo.lock
          cp /tmp/regen010-prepared/crate/src/lib.rs crates/mycelix-regenerative-evidence/src/lib.rs
          cp /tmp/regen010-prepared/crate/tests/lineage_firewall.rs crates/mycelix-regenerative-evidence/tests/lineage_firewall.rs
          cp /tmp/regen-soil-evidence-product-frozen.yml .github/workflows/regen-soil-evidence-product-frozen.yml
          test "$(sha256sum .github/workflows/regen-soil-evidence-product-frozen.yml | awk '{print $1}')" = "$EXPECTED_WORKFLOW_SHA256"
          test "$(sha256sum crates/mycelix-regenerative-evidence/Cargo.toml | awk '{print $1}')" = "$EXPECTED_MANIFEST_SHA256"
          test "$(sha256sum crates/mycelix-regenerative-evidence/Cargo.lock | awk '{print $1}')" = "$EXPECTED_LOCK_SHA256"
          test "$(sha256sum crates/mycelix-regenerative-evidence/src/lib.rs | awk '{print $1}')" = "$EXPECTED_LIB_SHA256"
          test "$(sha256sum crates/mycelix-regenerative-evidence/tests/lineage_firewall.rs | awk '{print $1}')" = "$EXPECTED_FIREWALL_SHA256"
          git add \
            .github/workflows/regen-soil-evidence-product-frozen.yml \
            crates/mycelix-regenerative-evidence/Cargo.toml \
            crates/mycelix-regenerative-evidence/Cargo.lock \
            crates/mycelix-regenerative-evidence/src/lib.rs \
            crates/mycelix-regenerative-evidence/tests/lineage_firewall.rs
          expected="$(printf '%s\n' \
            '.github/workflows/regen-soil-evidence-product-frozen.yml' \
            'crates/mycelix-regenerative-evidence/Cargo.lock' \
            'crates/mycelix-regenerative-evidence/Cargo.toml' \
            'crates/mycelix-regenerative-evidence/src/lib.rs' \
            'crates/mycelix-regenerative-evidence/tests/lineage_firewall.rs' | sort)"
          actual="$(git diff --cached --name-only | sort)"
          printf '%s\n' '---BEGIN_PROMOTED_SCOPE---'
          printf '%s\n' "$actual"
          printf '%s\n' '---END_PROMOTED_SCOPE---'
          test "$actual" = "$expected"
          git diff --cached --check
          git config user.name 'Tristan Stoltz'
          git config user.email 'tristan.stoltz@evolvingresonantcocreationism.com'
          git commit -m 'feat(regenerative): freeze REGEN-010 soil evidence product'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$(git rev-list --count "$EXPECTED_PARENT_SHA"..HEAD)" = '1'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          printf 'promoted_product_head=%s\n' "$(git rev-parse HEAD)"
          printf 'promoted_branch=%s\n' "$TARGET_BRANCH"
