name: AeroCommons Adapter Replay Benchmark

on:
  pull_request:
    paths:
      - "tools/aero-adapter-replay-benchmark/**"
      - "tools/aero-adapter-run-receipt/**"
      - "mycelix-commons/crates/aero-evidence-types/**"
      - "fixtures/aero-adapter-replay/**"
      - "docs/aerocommons/AERO_ADAPTER_REPLAY_PANEL_V1.schema.json"
      - "docs/aerocommons/AERO_ADAPTER_REPLAY_001.md"
      - ".github/workflows/aerocommons-adapter-replay-benchmark.yml"
  push:
    branches:
      - "research/aerocommons-replay-benchmark-001"
    paths:
      - "tools/aero-adapter-replay-benchmark/**"
      - "tools/aero-adapter-run-receipt/**"
      - "mycelix-commons/crates/aero-evidence-types/**"
      - "fixtures/aero-adapter-replay/**"
      - "docs/aerocommons/AERO_ADAPTER_REPLAY_PANEL_V1.schema.json"
      - "docs/aerocommons/AERO_ADAPTER_REPLAY_001.md"
      - ".github/workflows/aerocommons-adapter-replay-benchmark.yml"

permissions:
  contents: read

jobs:
  replay-benchmark:
    name: Pairwise replay and payload integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust 1.96.1
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path tools/aero-adapter-replay-benchmark/Cargo.toml -- --check
      - name: Run replay benchmark tests
        run: cargo test --manifest-path tools/aero-adapter-replay-benchmark/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --manifest-path tools/aero-adapter-replay-benchmark/Cargo.toml --all-targets -- -D warnings
