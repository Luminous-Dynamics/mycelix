name: Authority State Bootstrap Root

on:
  pull_request:
    paths:
      - 'crates/mycelix-authority-state-bootstrap-root/**'
      - 'crates/mycelix-governance-constitution/**'
      - 'crates/mycelix-authority-freshness/**'
      - 'crates/mycelix-authority-state-coverage/**'
      - 'crates/mycelix-authority-state-coverage-context/**'
      - '.github/workflows/authority-state-bootstrap-root.yml'
  push:
    branches:
      - 'security/authority-state-bootstrap-root-v0.1'

permissions:
  contents: read

concurrency:
  group: authority-state-bootstrap-root-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: Constitution-rooted bootstrap authority
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --manifest-path crates/mycelix-authority-state-bootstrap-root/Cargo.toml -- --check

      - name: Tests
        run: cargo test --manifest-path crates/mycelix-authority-state-bootstrap-root/Cargo.toml --all-targets

      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-authority-state-bootstrap-root/Cargo.toml --all-targets -- -D warnings

      - name: Downstream control-plane compatibility
        run: |
          cargo check --manifest-path crates/mycelix-authority-state-coverage/Cargo.toml --all-targets
          cargo check --manifest-path crates/mycelix-authority-state-coverage-context/Cargo.toml --all-targets

      - name: Bootstrap authority audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('crates/mycelix-authority-state-bootstrap-root/src/lib.rs').read_text()
          inv = Path('crates/mycelix-authority-state-bootstrap-root/INVARIANTS.md').read_text().lower()

          required = [
              'VerifiedCurrentConstitutionReceipt',
              'VerifiedBootstrapRootAdoption',
              'QualifiedAuthorityStateBootstrapRoot',
              'AuthoritySubjectKind::AuthorityCoveragePolicy',
              'AuthoritySubjectKind::CoverageTrustContextPolicy',
              'AuthoritySubjectKind::WitnessTrustPolicy',
              'OperationalSubjectInBootstrapRoot',
              'ManifestConstitutionMismatch',
              'LegacyConstitutionRejected',
              'STATEMENT_PROFILE',
          ]
          for token in required:
              assert token in src, token

          # The root must not recursively depend on the current-freshness plane.
          for forbidden in [
              'VerifiedAuthorityFreshness',
              'qualify_current_freshness(',
              '#[hdk_extern]',
              'hdk::',
              'create_entry(',
              'get_links(',
              'call_remote(',
              'execute_actions',
          ]:
              assert forbidden not in src, forbidden

          assert 'challenge -> current coverage policy -> challenge' in inv
          assert 'probe challenges are evidence, not authority' in inv
          assert 'operational subject kind is forbidden' in src
          assert 'historical root evidence cannot satisfy a new live challenge' in inv
          print('PASS: bootstrap currentness comes from constitution/root adoption, not recursive freshness')
          PY
