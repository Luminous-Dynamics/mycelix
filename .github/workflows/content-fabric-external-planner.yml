name: Content Fabric External Planner Protocol CI

on:
  pull_request:
    paths:
      - 'crates/mycelix-content-planner-protocol/**'
      - 'crates/mycelix-content-planner/**'
      - 'crates/mycelix-content-policy/**'
      - 'crates/mycelix-content-core/**'
      - 'crates/mycelix-content-state/**'
      - 'docs/content-fabric/EXTERNAL_PLANNER_PROTOCOL_V1.md'
      - '.github/workflows/content-fabric-external-planner.yml'
  push:
    branches: [main]
    paths:
      - 'crates/mycelix-content-planner-protocol/**'
      - 'crates/mycelix-content-planner/**'
      - 'crates/mycelix-content-policy/**'
      - 'crates/mycelix-content-core/**'
      - 'crates/mycelix-content-state/**'
      - 'docs/content-fabric/EXTERNAL_PLANNER_PROTOCOL_V1.md'
      - '.github/workflows/content-fabric-external-planner.yml'

permissions:
  contents: read

concurrency:
  group: content-fabric-external-planner-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  external-planner-protocol:
    name: CF-06C external planner protocol
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/mycelix-content-planner-protocol
      - name: Check formatting
        run: cargo fmt --manifest-path crates/mycelix-content-planner-protocol/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-content-planner-protocol/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path crates/mycelix-content-planner-protocol/Cargo.toml --all-targets
