name: Personal source-state qualification

on:
  pull_request:
    paths:
      - "mycelix-personal/apps/leptos/**"
      - "mycelix-personal/crates/personal-leptos-types/**"
      - "crates/mycelix-leptos-core/**"
      - "crates/mycelix-leptos-client/**"
      - ".github/workflows/personal-source-state.yml"
  push:
    branches: [main]
    paths:
      - "mycelix-personal/apps/leptos/**"
      - "mycelix-personal/crates/personal-leptos-types/**"
      - "crates/mycelix-leptos-core/**"
      - "crates/mycelix-leptos-client/**"
      - ".github/workflows/personal-source-state.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-source-state-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Exact-head tests and WASM compile
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            mycelix-personal/apps/leptos -> target
            crates/mycelix-leptos-core -> target
            crates/mycelix-leptos-client -> target
      - name: Assert exact source head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_SHA" ]]; then
            echo "Expected source head $EXPECTED_SHA, checked out $actual" >&2
            exit 1
          fi
      - name: Generate and fingerprint standalone dependency locks
        run: |
          cargo generate-lockfile --manifest-path mycelix-personal/apps/leptos/Cargo.toml
          cargo generate-lockfile --manifest-path mycelix-personal/crates/personal-leptos-types/Cargo.toml
          sha256sum mycelix-personal/apps/leptos/Cargo.lock mycelix-personal/Cargo.lock
      - name: Check formatting
        run: |
          cargo fmt --manifest-path mycelix-personal/apps/leptos/Cargo.toml -- --check
          cargo fmt --manifest-path mycelix-personal/crates/personal-leptos-types/Cargo.toml -- --check
      - name: Run Personal source-status unit tests
        run: cargo test --manifest-path mycelix-personal/apps/leptos/Cargo.toml --locked --lib
      - name: Run source-aware Personal type contract tests
        run: cargo test --manifest-path mycelix-personal/crates/personal-leptos-types/Cargo.toml --locked
      - name: Run strict Clippy on Personal app
        run: cargo clippy --manifest-path mycelix-personal/apps/leptos/Cargo.toml --locked --all-targets -- -D warnings
      - name: Run strict Clippy on Personal types
        run: cargo clippy --manifest-path mycelix-personal/crates/personal-leptos-types/Cargo.toml --locked --all-targets -- -D warnings
      - name: Compile Personal app for WASM
        run: cargo check --manifest-path mycelix-personal/apps/leptos/Cargo.toml --locked --target wasm32-unknown-unknown
