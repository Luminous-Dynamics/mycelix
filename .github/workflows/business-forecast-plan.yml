name: Business Forecast Target Plan

on:
  pull_request:
    paths:
      - 'crates/mycelix-business-forecast-plan/**'
      - 'crates/mycelix-business-shadow/**'
      - 'crates/mycelix-business-core/**'
      - '.github/workflows/business-forecast-plan.yml'
  push:
    branches:
      - main
      - feat/business-forecast-target-plan-v0-1
    paths:
      - 'crates/mycelix-business-forecast-plan/**'
      - 'crates/mycelix-business-shadow/**'
      - 'crates/mycelix-business-core/**'
      - '.github/workflows/business-forecast-plan.yml'

permissions:
  contents: read

jobs:
  forecast-target-plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/mycelix-business-forecast-plan
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
