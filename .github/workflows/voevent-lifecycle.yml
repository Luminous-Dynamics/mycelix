name: VOEvent lifecycle replay

on:
  push:
    paths:
      - "research/voevent-lifecycle/**"
      - "research/voevent-header/**"
      - ".github/workflows/voevent-lifecycle.yml"
  pull_request:
    paths:
      - "research/voevent-lifecycle/**"
      - "research/voevent-header/**"
      - ".github/workflows/voevent-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle-replay:
    name: Lifecycle replay package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal
      - name: Install formatting and lint components
        run: rustup component add rustfmt clippy --toolchain 1.96.1
      - name: Check parser formatting
        run: cargo +1.96.1 fmt --manifest-path research/voevent-header/Cargo.toml --all -- --check
      - name: Test parser
        run: cargo +1.96.1 test --manifest-path research/voevent-header/Cargo.toml --all-targets
      - name: Clippy parser
        run: cargo +1.96.1 clippy --manifest-path research/voevent-header/Cargo.toml --all-targets -- -D warnings
      - name: Check replay formatting
        run: cargo +1.96.1 fmt --manifest-path research/voevent-lifecycle/Cargo.toml --all -- --check
      - name: Test source-native replay
        run: cargo +1.96.1 test --manifest-path research/voevent-lifecycle/Cargo.toml --all-targets
      - name: Clippy source-native replay
        run: cargo +1.96.1 clippy --manifest-path research/voevent-lifecycle/Cargo.toml --all-targets -- -D warnings
