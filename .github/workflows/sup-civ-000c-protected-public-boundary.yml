name: SUP-CIV-000C Protected Public Boundary

on:
  pull_request:
    paths:
      - 'mycelix-workspace/docs/civic-resilience/SUP_CIV_000C_PROTECTED_PUBLIC_BOUNDARY_V1.md'
      - 'mycelix-workspace/docs/civic-resilience/sup_civ_000c_protected_public_boundary.json'
      - 'scripts/qualification/sup_civ_000c_protected_public_boundary_v1.py'
      - '.github/workflows/sup-civ-000c-protected-public-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sup-civ-000c-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Protected payload and public-envelope boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Exact parent and clean subject
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='a85369699099d4c7524e502e531735eed4ab36f4'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          printf 'head=%s\nparent=%s\ntree=%s\n' \
            "$(git rev-parse HEAD)" \
            "$(git rev-parse HEAD^)" \
            "$(git rev-parse HEAD^{tree})"
          test -z "$(git status --short)"

      - name: Exact tranche scope
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='a85369699099d4c7524e502e531735eed4ab36f4'
          test "$(git rev-list --count "$EXPECTED_PARENT"..HEAD)" = '1'
          git diff --check "$EXPECTED_PARENT" HEAD
          mapfile -t changed < <(git diff --name-only "$EXPECTED_PARENT" HEAD | sort)
          expected=(
            '.github/workflows/sup-civ-000c-protected-public-boundary.yml'
            'mycelix-workspace/docs/civic-resilience/SUP_CIV_000C_PROTECTED_PUBLIC_BOUNDARY_V1.md'
            'mycelix-workspace/docs/civic-resilience/sup_civ_000c_protected_public_boundary.json'
            'scripts/qualification/sup_civ_000c_protected_public_boundary_v1.py'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")

      - name: Validate protected/public contract
        run: python3 scripts/qualification/sup_civ_000c_protected_public_boundary_v1.py

      - name: Static no-runtime audit
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='a85369699099d4c7524e502e531735eed4ab36f4'
          changed="$(git diff --name-only "$EXPECTED_PARENT" HEAD)"
          if printf '%s\n' "$changed" | grep -E '\.(rs|toml|lock)$'; then
            echo 'SUP-CIV-000C must remain semantic-contract/manifest/validator/workflow only' >&2
            exit 1
          fi

      - name: Prove no storage or legal-policy overclaim
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('mycelix-workspace/docs/civic-resilience/sup_civ_000c_protected_public_boundary.json').read_text())
          assert d['runtime_owner'] == 'Deferred'
          assert d['storage_mechanism'] == 'Deferred'
          assert d['universal_public_safe_field_set'] is False
          assert d['universal_legal_basis'] is False
          assert d['protected_access_may_imply_public_release'] is False
          assert d['application_delete_is_global_erasure'] is False
          PY

      - name: Immutable checkout postflight
        run: test -z "$(git status --short)"
