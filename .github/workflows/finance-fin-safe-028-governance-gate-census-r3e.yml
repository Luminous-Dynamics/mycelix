name: Finance FIN-SAFE-028 Governance Gate Census R3e

on:
  pull_request:
    paths:
      - '.github/workflows/finance-fin-safe-028-governance-gate-census-r3e.yml'
      - '.github/qualification/fin_safe_028_census_r3d_core.py'
      - '.github/qualification/fin_safe_028_census_r3e.py'

permissions:
  contents: read

concurrency:
  group: fin-safe-028-census-r3e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SOURCE_SHA: 'f7b43e3f9718e2dc2445376916bd4d5010fbc4ea'
  CORE_PATH: '.github/qualification/fin_safe_028_census_r3d_core.py'
  WRAPPER_PATH: '.github/qualification/fin_safe_028_census_r3e.py'
  CORE_BLOB_SHA: '1e2784aad15d7fca8b605f16b4eea227f832972c'

jobs:
  census:
    name: Census exact R2 occurrences with corrected hash bindings
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ci-fin-safe-028-governance-gate-census-r3e-hash-binding'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact R3e qualification head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Bind three-file qualification delta and frozen R3d core
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          mapfile -t changed < <(git diff --name-only "$SOURCE_SHA" HEAD | sort)
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = '.github/qualification/fin_safe_028_census_r3d_core.py'
          test "${changed[1]}" = '.github/qualification/fin_safe_028_census_r3e.py'
          test "${changed[2]}" = '.github/workflows/finance-fin-safe-028-governance-gate-census-r3e.yml'
          test "$(git hash-object "$CORE_PATH")" = "$CORE_BLOB_SHA"
          cp "$CORE_PATH" /tmp/fin_safe_028_census_r3d_core.py
          cp "$WRAPPER_PATH" /tmp/fin_safe_028_census_r3e.py
          python3 -m py_compile /tmp/fin_safe_028_census_r3d_core.py /tmp/fin_safe_028_census_r3e.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Checkout exact frozen source subject
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Produce exact R2-bound content/topology census
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/fin_safe_028_census_r3e.py

      - name: Prove immutable source and evidence digest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git status --porcelain=v1 --untracked-files=all > /tmp/fin-safe-028-governance-gate-census-r3d-status.txt
          test ! -s /tmp/fin-safe-028-governance-gate-census-r3d-status.txt
          cd /tmp
          sha256sum -c fin-safe-028-governance-gate-census-r3d.sha256

      - name: Upload R3e evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fin-safe-028-governance-gate-census-r3e-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: |
            /tmp/fin-safe-028-governance-gate-census-r3d.json
            /tmp/fin-safe-028-governance-gate-census-r3d.md
            /tmp/fin-safe-028-governance-gate-census-r3d.sha256
            /tmp/fin-safe-028-governance-gate-census-r3d-status.txt
          if-no-files-found: warn
          retention-days: 90
