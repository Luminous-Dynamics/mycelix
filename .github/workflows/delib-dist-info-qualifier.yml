name: DELIB-DIST-INFO Qualifier

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/research/deliberation/distributed-information/**"
      - ".github/workflows/delib-dist-info-qualifier.yml"
  push:
    branches: [main]
    paths:
      - "docs/research/deliberation/distributed-information/**"
      - ".github/workflows/delib-dist-info-qualifier.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run qualifier tests
        run: cargo test --manifest-path docs/research/deliberation/distributed-information/qualifier/Cargo.toml
      - name: Validate evidence and decision-readiness fixtures
        run: |
          cargo run --manifest-path docs/research/deliberation/distributed-information/qualifier/Cargo.toml -- \
            docs/research/deliberation/distributed-information/DIST_INFO_PROTOCOL_V0_1.json \
            docs/research/deliberation/distributed-information/DIST_INFO_PROTOCOL_V0_1.schema.json \
            docs/research/deliberation/distributed-information/DIST_INFO_FIXTURES_V0_1.json \
            docs/research/deliberation/distributed-information/DIST_INFO_FIXTURES_V0_1.schema.json \
            docs/research/deliberation/distributed-information/GROUPMEMBENCH_METADATA_INTAKE_V0_1.json \
            docs/research/deliberation/distributed-information/GROUPMEMBENCH_METADATA_INTAKE_V0_1.schema.json
