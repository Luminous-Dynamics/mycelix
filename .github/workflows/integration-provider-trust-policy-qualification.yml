name: Integration Provider Trust Policy Qualification

on:
  pull_request:
    branches:
      - feat/integration-atomic-dispatch-start-v1
      - main
    paths:
      - 'crates/mycelix-integration-provider-trust-policy/**'
      - '.github/workflows/integration-provider-trust-policy-qualification.yml'
  push:
    branches:
      - feat/integration-provider-trust-policy-v1
    paths:
      - 'crates/mycelix-integration-provider-trust-policy/**'
      - '.github/workflows/integration-provider-trust-policy-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MANIFEST: crates/mycelix-integration-provider-trust-policy/Cargo.toml

jobs:
  qualify:
    name: Institution-adopted provider profile root
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path "$MANIFEST" --all --check
      - run: cargo test --manifest-path "$MANIFEST" --no-run
      - run: cargo test --manifest-path "$MANIFEST"
      - run: cargo clippy --manifest-path "$MANIFEST" --all-targets -- -D warnings

      - name: Enforce exact institutional root semantics
        shell: bash
        run: |
          set -euo pipefail
          source='crates/mycelix-integration-provider-trust-policy/src/lib.rs'
          grep -Fq 'pub struct IntegrationProviderTrustPolicy' "$source"
          grep -Fq 'pub institution: InstitutionId' "$source"
          grep -Fq 'pub rulebook: RulebookRef' "$source"
          grep -Fq 'pub connector_instance: ConnectorInstanceId' "$source"
          grep -Fq 'pub system: ExternalSystemId' "$source"
          grep -Fq 'pub signer_key_id: String' "$source"
          grep -Fq 'pub verifying_key: [u8; 32]' "$source"
          grep -Fq 'pub generation: u64' "$source"
          grep -Fq 'ProviderProfileTrustRoot::new' "$source"
          grep -Fq 'frame_commitment(&mut h, root.root_commitment())' "$source"
          grep -Fq 'verified_authority_ref != policy.authority_ref' "$source"
          grep -Fq 'verified_policy_proof_ref != policy.policy_proof_ref' "$source"

      - name: Enforce adopted root is not current authority
        shell: bash
        run: |
          set -euo pipefail
          source='crates/mycelix-integration-provider-trust-policy/src/lib.rs'
          grep -Fq 'pub struct QualifiedAdoptedProviderTrustPolicy' "$source"
          grep -Fq 'pub const fn generation_currentness_verified_here(&self) -> bool {' "$source"
          grep -Fq 'pub const fn grants_execution_authority(&self) -> bool {' "$source"
          if grep -Eq '#\[derive\([^]]*(Serialize|Deserialize)[^]]*\)\][[:space:]]*pub struct QualifiedAdoptedProviderTrustPolicy' "$source"; then
            echo 'Adopted provider root positive object must remain process-local.'
            exit 1
          fi
          if grep -Eq 'reqwest::|hyper::|tonic::|TcpStream|UdpSocket|mark_dispatch_started|AdminWebsocket' "$source"; then
            echo 'Provider trust policy crossed into I/O or dispatch.'
            exit 1
          fi
