name: Finance Queue and Clearing Benchmark

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'mycelix-finance/Cargo.lock'
      - 'mycelix-finance/Cargo.toml'
      - 'mycelix-finance/crates/finance-route-clearing-optimizer/Cargo.toml'
      - 'mycelix-finance/crates/finance-route-clearing-optimizer/src/queue.rs'
      - 'mycelix-finance/crates/finance-route-clearing-optimizer/src/batch.rs'
      - 'mycelix-finance/crates/finance-route-clearing-optimizer/src/lib.rs'
      - 'mycelix-finance/crates/finance-route-clearing-optimizer/tests/queue_sequence_oracle.rs'
      - 'mycelix-finance/crates/finance-route-clearing-optimizer/tests/atomic_batch_oracle.rs'
      - 'mycelix-finance/crates/finance-route-clearing-optimizer/examples/queue_policy_benchmark.rs'
      - 'mycelix-finance/crates/finance-route-clearing-optimizer/examples/atomic_batch_benchmark.rs'
      - 'mycelix-finance/crates/finance-route-clearing-optimizer/examples/route_clearing_benchmark.rs'
      - '.github/workflows/finance-queue-benchmark.yml'

permissions:
  contents: read

jobs:
  benchmark:
    name: Pinned Synthetic Queue and Clearing Benchmark
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout exact benchmark subject
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Assert exact subject and repository
        run: |
          set -euo pipefail
          test '${{ github.repository }}' = 'Luminous-Dynamics/mycelix'
          test '${{ github.repository_id }}' = '1176351975'
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.96.1

      - name: Record machine and subject metadata
        run: |
          set -euo pipefail
          mkdir -p benchmark-output
          {
            echo "repository=Luminous-Dynamics/mycelix"
            echo "repository_id=1176351975"
            echo "subject_sha=$(git rev-parse HEAD)"
            echo "workflow_run_id=${{ github.run_id }}"
            echo "workflow_run_attempt=${{ github.run_attempt }}"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "utc_timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "--- rustc ---"
            rustc +1.96.1 --version --verbose
            echo "--- cargo ---"
            cargo +1.96.1 --version
            echo "--- uname ---"
            uname -a
            echo "--- cpu ---"
            lscpu | grep -E '^(Architecture|CPU\(s\)|Model name|Thread|Core|Socket|NUMA node0):'
          } > benchmark-output/metadata.txt

      - name: Run deterministic release benchmark in an isolated crate copy
        run: |
          set -euo pipefail
          isolated="${RUNNER_TEMP}/finance-route-clearing-optimizer"
          output="${GITHUB_WORKSPACE}/benchmark-output"
          cp -a mycelix-finance/crates/finance-route-clearing-optimizer "$isolated"
          (
            cd "$isolated"
            # The optimizer has no third-party dependencies. Isolating the exact crate
            # avoids unrelated stale workspace lockfile entries affecting its benchmark.
            cargo +1.96.1 generate-lockfile --offline
            cargo +1.96.1 run --offline --locked --release --example queue_policy_benchmark \
              > "$output/results.csv"
            cargo +1.96.1 run --offline --locked --release --example atomic_batch_benchmark \
              > "$output/atomic-batch-results.csv"
            cargo +1.96.1 run --offline --locked --release --example route_clearing_benchmark \
              > "$output/route-clearing-results.csv"
            cp Cargo.lock "$output/standalone-Cargo.lock"
            find Cargo.toml src tests examples -type f -print0 | sort -z | xargs -0 sha256sum \
              > "$output/SOURCE-SHA256SUMS"
          )
          test -s benchmark-output/results.csv
          test "$(wc -l < benchmark-output/results.csv)" -eq 64
          test -s benchmark-output/atomic-batch-results.csv
          test "$(wc -l < benchmark-output/atomic-batch-results.csv)" -eq 5
          test -s benchmark-output/route-clearing-results.csv
          test "$(wc -l < benchmark-output/route-clearing-results.csv)" -eq 16
          # Queue gate: all generated cases must be represented, with no excluded inputs.
          awk -F, '
            NR == 1 { if ($17 != "p95_ns") exit 2; next }
            {
              if ($6 != 0) failed = 1
              if ($2 == 700) {
                stress_cases++
                if ($17 !~ /^[0-9]+$/ || $17 > 100000000) failed = 1
              }
            }
            END {
              if (stress_cases != 21) failed = 1
              if (failed) exit 1
            }
          ' benchmark-output/results.csv
          # Exact batch gate: every fully funded atomic cycle must select all legs,
          # and 16-candidate p95 must remain below a provisional 250 ms on this runner.
          awk -F, '
            NR == 1 { if ($8 != "p95_ns") exit 2; next }
            {
              cases++
              if ($1 !~ /^[0-9]+$/ || $3 != $1 || $4 != $1 * 100) failed = 1
              if ($6 != 2 ^ $1) failed = 1
              if ($1 == 16 && ($8 !~ /^[0-9]+$/ || $8 > 250000000)) failed = 1
            }
            END {
              if (cases != 4) failed = 1
              if (failed) exit 1
            }
          ' benchmark-output/atomic-batch-results.csv
          # Route-clearing gate: enforce the stated lexicographic objective against the
          # greedy baseline and prove each synthetic scenario reaches its constructed
          # maximum-flow ceiling. This remains a synthetic reference benchmark, not an
          # industry RTGS superiority claim.
          awk -F, '
            NR == 1 {
              if ($4 != "optimized_flow_minor" || $7 != "greedy_flow_minor" || $12 != "opt_p50_us" || $13 != "opt_p95_us") exit 2
              next
            }
            {
              cases++
              if ($4 !~ /^[0-9]+$/ || $7 !~ /^[0-9]+$/) failed = 1
              if ($4 < $7) failed = 1
              if ($4 == $7 && $5 > $8) failed = 1
              if ($10 != $4 - $7 || $11 !~ /^[0-9]+$/) failed = 1
              if ($12 !~ /^[0-9]+$/ || $13 !~ /^[0-9]+$/ || $14 !~ /^[0-9]+$/ || $15 !~ /^[0-9]+$/) failed = 1
              if ($2 == 700) {
                stress_cases++
                if ($13 > 100000) failed = 1
              }
              if ($1 == "cyclic" && ($6 != "true" || $9 != "true" || $4 != $3 * 500)) failed = 1
              if ($1 == "capacity-stress" && ($6 != "false" || $9 != "false" || $4 != $3 * 400)) failed = 1
              if ($1 == "route-outage") {
                side = $2 / 2
                disabled = int((side - 1) / 11) + 1
                if ($6 != "false" || $9 != "false" || $4 != (side - disabled) * 1000) failed = 1
              }
            }
            END {
              if (cases != 15 || stress_cases != 3) failed = 1
              if (failed) exit 1
            }
          ' benchmark-output/route-clearing-results.csv
          sha256sum benchmark-output/results.csv benchmark-output/atomic-batch-results.csv \
            benchmark-output/route-clearing-results.csv benchmark-output/metadata.txt \
            benchmark-output/standalone-Cargo.lock benchmark-output/SOURCE-SHA256SUMS \
            > benchmark-output/SHA256SUMS

      - name: Preserve benchmark report and metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finance-queue-benchmark-${{ github.event.pull_request.head.sha }}
          path: benchmark-output/
          if-no-files-found: error
          retention-days: 90
