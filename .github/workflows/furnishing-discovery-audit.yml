name: Furnishing discovery audit

on:
  push:
    branches:
      - feat/furnishing-readonly-discovery-20261020
  pull_request:
    paths:
      - "mycelix-marketplace/frontend-leptos/crates/marketplace-domain/**"
      - "mycelix-marketplace/frontend-leptos/crates/marketplace-client/**"
      - ".github/workflows/furnishing-discovery-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  furnishing-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout event revision
        uses: actions/checkout@v4
      - name: Install workspace Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - name: Assert tested revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Check formatting
        run: cargo fmt --manifest-path mycelix-marketplace/frontend-leptos/Cargo.toml --all -- --check
      - name: Test typed discovery client
        run: cargo test --manifest-path mycelix-marketplace/frontend-leptos/Cargo.toml -p marketplace-client
      - name: Lint typed discovery client
        run: cargo clippy --manifest-path mycelix-marketplace/frontend-leptos/Cargo.toml -p marketplace-client --all-targets -- -D warnings
