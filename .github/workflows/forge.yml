name: Mycelix Forge CI

on:
  pull_request:
    paths:
      - "crates/mycelix-forge-core/**"
      - "crates/mycelix-forge-authority/**"
      - "crates/mycelix-forge-repository/**"
      - "crates/mycelix-forge-execution/**"
      - "adapters/forge-gittuf/**"
      - "adapters/forge-gittuf-bundle/**"
      - "adapters/forge-linux-isolation/**"
      - "adapters/forge-linux-isolation-evidence/**"
      - "adapters/forge-linux-isolation-collector/**"
      - "adapters/forge-runtime-closure-evidence/**"
      - "adapters/forge-nar-auditor/**"
      - "adapters/forge-gittuf-trust-profile/**"
      - ".github/workflows/forge.yml"
  push:
    branches:
      - main
    paths:
      - "crates/mycelix-forge-core/**"
      - "crates/mycelix-forge-authority/**"
      - "crates/mycelix-forge-repository/**"
      - "crates/mycelix-forge-execution/**"
      - "adapters/forge-gittuf/**"
      - "adapters/forge-gittuf-bundle/**"
      - "adapters/forge-linux-isolation/**"
      - "adapters/forge-linux-isolation-evidence/**"
      - "adapters/forge-linux-isolation-collector/**"
      - "adapters/forge-runtime-closure-evidence/**"
      - "adapters/forge-nar-auditor/**"
      - "adapters/forge-gittuf-trust-profile/**"
      - ".github/workflows/forge.yml"

permissions:
  contents: read

concurrency:
  group: forge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forge:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Forge Core
            path: crates/mycelix-forge-core
          - name: Forge Authority
            path: crates/mycelix-forge-authority
          - name: Forge Repository Contract
            path: crates/mycelix-forge-repository
          - name: Forge Execution Contract
            path: crates/mycelix-forge-execution
          - name: Forge gittuf Adapter
            path: adapters/forge-gittuf
          - name: Forge Repository Bundle
            path: adapters/forge-gittuf-bundle
          - name: Forge Linux Isolation
            path: adapters/forge-linux-isolation
          - name: Forge Isolation Evidence
            path: adapters/forge-linux-isolation-evidence
          - name: Forge Isolation Collector
            path: adapters/forge-linux-isolation-collector
          - name: Forge Runtime Closure Evidence
            path: adapters/forge-runtime-closure-evidence
          - name: Forge NAR Auditor
            path: adapters/forge-nar-auditor
          - name: Forge gittuf Trust Profile
            path: adapters/forge-gittuf-trust-profile
    defaults:
      run:
        working-directory: ${{ matrix.path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features
