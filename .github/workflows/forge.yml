name: Mycelix Forge CI

on:
  pull_request:
    paths:
      - "crates/mycelix-forge-core/**"
      - "crates/mycelix-forge-authority/**"
      - "crates/mycelix-forge-authentication/**"
      - "crates/mycelix-forge-proposal/**"
      - "crates/mycelix-forge-review/**"
      - "crates/mycelix-forge-repository/**"
      - "adapters/forge-gittuf/**"
      - ".github/workflows/forge.yml"
  push:
    branches:
      - main
    paths:
      - "crates/mycelix-forge-core/**"
      - "crates/mycelix-forge-authority/**"
      - "crates/mycelix-forge-authentication/**"
      - "crates/mycelix-forge-proposal/**"
      - "crates/mycelix-forge-review/**"
      - "crates/mycelix-forge-repository/**"
      - "adapters/forge-gittuf/**"
      - ".github/workflows/forge.yml"

permissions:
  contents: read

concurrency:
  group: forge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forge:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Forge Core
            path: crates/mycelix-forge-core
          - name: Forge Authority
            path: crates/mycelix-forge-authority
          - name: Forge Authentication Contract
            path: crates/mycelix-forge-authentication
          - name: Forge Proposal Contract
            path: crates/mycelix-forge-proposal
          - name: Forge Review Contract
            path: crates/mycelix-forge-review
          - name: Forge Repository Contract
            path: crates/mycelix-forge-repository
          - name: Forge gittuf Adapter
            path: adapters/forge-gittuf
    defaults:
      run:
        working-directory: ${{ matrix.path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features
