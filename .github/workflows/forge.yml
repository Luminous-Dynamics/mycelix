name: Mycelix Forge CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
    paths:
      - "crates/mycelix-forge-core/**"
      - "crates/mycelix-forge-authority/**"
      - "crates/mycelix-forge-repository/**"
      - "crates/mycelix-forge-execution/**"
      - "adapters/forge-gittuf/**"
      - "adapters/forge-gittuf-bundle/**"
      - "adapters/forge-linux-isolation/**"
      - "adapters/forge-linux-isolation-evidence/**"
      - "adapters/forge-linux-isolation-collector/**"
      - "adapters/forge-runtime-closure-evidence/**"
      - "adapters/forge-runtime-tool-evidence/**"
      - "adapters/forge-nar-auditor/**"
      - "adapters/forge-gittuf-trust-profile/**"
      - "adapters/forge-gittuf-policy-inventory/**"
      - "adapters/forge-hermetic-run-evidence/**"
      - "adapters/forge-guest-plan/**"
      - "adapters/forge-guest-transcript/**"
      - "adapters/forge-guest-tool-map/**"
      - "adapters/forge-guest-envelope/**"
      - "adapters/forge-guest-output-frame/**"
      - "adapters/forge-hermetic-guest/**"
      - "adapters/forge-sealed-inputs/**"
      - "adapters/forge-sealed-capsule-inputs/**"
      - "adapters/forge-hermetic-host/**"
      - "adapters/forge-hermetic-host-v2/**"
      - "adapters/forge-m0-offline-evidence/**"
      - "adapters/forge-m0-offline-evidence-v6/**"
      - "adapters/forge-m0-capsule-builder/**"
      - ".github/workflows/forge.yml"
  push:
    branches:
      - main
    paths:
      - "crates/mycelix-forge-core/**"
      - "crates/mycelix-forge-authority/**"
      - "crates/mycelix-forge-repository/**"
      - "crates/mycelix-forge-execution/**"
      - "adapters/forge-gittuf/**"
      - "adapters/forge-gittuf-bundle/**"
      - "adapters/forge-linux-isolation/**"
      - "adapters/forge-linux-isolation-evidence/**"
      - "adapters/forge-linux-isolation-collector/**"
      - "adapters/forge-runtime-closure-evidence/**"
      - "adapters/forge-runtime-tool-evidence/**"
      - "adapters/forge-nar-auditor/**"
      - "adapters/forge-gittuf-trust-profile/**"
      - "adapters/forge-gittuf-policy-inventory/**"
      - "adapters/forge-hermetic-run-evidence/**"
      - "adapters/forge-guest-plan/**"
      - "adapters/forge-guest-transcript/**"
      - "adapters/forge-guest-tool-map/**"
      - "adapters/forge-guest-envelope/**"
      - "adapters/forge-guest-output-frame/**"
      - "adapters/forge-hermetic-guest/**"
      - "adapters/forge-sealed-inputs/**"
      - "adapters/forge-sealed-capsule-inputs/**"
      - "adapters/forge-hermetic-host/**"
      - "adapters/forge-hermetic-host-v2/**"
      - "adapters/forge-m0-offline-evidence/**"
      - "adapters/forge-m0-offline-evidence-v6/**"
      - "adapters/forge-m0-capsule-builder/**"
      - ".github/workflows/forge.yml"

permissions:
  contents: read

concurrency:
  group: forge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forge:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && (github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ci:qualify')))
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Forge Core
            path: crates/mycelix-forge-core
          - name: Forge Authority
            path: crates/mycelix-forge-authority
          - name: Forge Repository Contract
            path: crates/mycelix-forge-repository
          - name: Forge Execution Contract
            path: crates/mycelix-forge-execution
          - name: Forge gittuf Adapter
            path: adapters/forge-gittuf
          - name: Forge Repository Bundle
            path: adapters/forge-gittuf-bundle
          - name: Forge Linux Isolation
            path: adapters/forge-linux-isolation
          - name: Forge Isolation Evidence
            path: adapters/forge-linux-isolation-evidence
          - name: Forge Isolation Collector
            path: adapters/forge-linux-isolation-collector
          - name: Forge Runtime Closure Evidence
            path: adapters/forge-runtime-closure-evidence
          - name: Forge Runtime Tool Evidence
            path: adapters/forge-runtime-tool-evidence
          - name: Forge NAR Auditor
            path: adapters/forge-nar-auditor
          - name: Forge gittuf Trust Profile
            path: adapters/forge-gittuf-trust-profile
          - name: Forge gittuf Policy Inventory
            path: adapters/forge-gittuf-policy-inventory
          - name: Forge Hermetic Run Evidence
            path: adapters/forge-hermetic-run-evidence
          - name: Forge Guest Verification Plan
            path: adapters/forge-guest-plan
          - name: Forge Guest Transcript
            path: adapters/forge-guest-transcript
          - name: Forge Guest Tool Map
            path: adapters/forge-guest-tool-map
          - name: Forge Guest Evidence Envelope
            path: adapters/forge-guest-envelope
          - name: Forge Guest Output Frame
            path: adapters/forge-guest-output-frame
          - name: Forge Hermetic Guest
            path: adapters/forge-hermetic-guest
          - name: Forge Sealed Inputs
            path: adapters/forge-sealed-inputs
          - name: Forge Sealed Capsule Inputs
            path: adapters/forge-sealed-capsule-inputs
          - name: Forge Hermetic Host
            path: adapters/forge-hermetic-host
          - name: Forge Hermetic Host v2
            path: adapters/forge-hermetic-host-v2
          - name: Forge M0 Offline Evidence
            path: adapters/forge-m0-offline-evidence
          - name: Forge M0 Offline Evidence v6
            path: adapters/forge-m0-offline-evidence-v6
          - name: Forge M0 Capsule Builder
            path: adapters/forge-m0-capsule-builder
    defaults:
      run:
        working-directory: ${{ matrix.path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features
