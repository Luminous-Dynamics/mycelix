name: AeroCommons Holochain fixture

on:
  pull_request:
    paths:
      - "mycelix-commons/aerocommons-holochain-fixture/**"
      - "docs/aerocommons/AERO_HOLOCHAIN_FIXTURE_CONTRACT_V1.json"
      - "docs/aerocommons/AERO_AUTHORITY_CEILING_V1.json"
      - "mycelix-commons/crates/aero-authority-ceiling/**"
  push:
    branches:
      - main
    paths:
      - "mycelix-commons/aerocommons-holochain-fixture/**"
      - "docs/aerocommons/AERO_HOLOCHAIN_FIXTURE_CONTRACT_V1.json"
      - "docs/aerocommons/AERO_AUTHORITY_CEILING_V1.json"
      - "mycelix-commons/crates/aero-authority-ceiling/**"

jobs:
  fixture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mycelix-commons/aerocommons-holochain-fixture

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Format check
        run: cargo fmt --check

      - name: Host compilation
        run: cargo check

      - name: Host tests
        run: cargo test

      - name: WASM compilation
        run: cargo check --target wasm32-unknown-unknown
