name: Authority Coordinator Deployment Composer

on:
  pull_request:
    paths:
      - 'crates/mycelix-authority-coordinator-deployment-composer/**'
      - 'crates/mycelix-authority-coordinator-deployment/**'
      - 'crates/mycelix-authority-coordinator-release-currentness/**'
      - 'mycelix-governance/dna/dna.yaml'
      - '.github/workflows/authority-coordinator-deployment-composer.yml'
  push:
    branches:
      - 'security/authority-coordinator-deployment-composer-v0.1'

permissions:
  contents: read

concurrency:
  group: authority-coordinator-deployment-composer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Exact target + current release + observed deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --manifest-path crates/mycelix-authority-coordinator-deployment-composer/Cargo.toml -- --check

      - name: Tests
        run: cargo test --manifest-path crates/mycelix-authority-coordinator-deployment-composer/Cargo.toml --all-targets

      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-authority-coordinator-deployment-composer/Cargo.toml --all-targets -- -D warnings

      - name: Trust-boundary audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('crates/mycelix-authority-coordinator-deployment-composer')
          src = (root / 'src/lib.rs').read_text()
          inv = (root / 'INVARIANTS.md').read_text().lower()
          cargo = (root / 'Cargo.toml').read_text().lower()
          dna = Path('mycelix-governance/dna/dna.yaml').read_text()

          assert 'hdk' not in cargo
          assert 'holochain_client' not in cargo
          assert 'mycelix-authority-coordinator-native-attestor' not in cargo
          assert 'pub struct TargetCellSelection {' in src
          assert 'pub struct QualifiedCoordinatorDeploymentComposition {' in src

          positive_prefix = src.split('pub struct QualifiedCoordinatorDeploymentComposition {', 1)[0].split('\n')[-8:]
          assert not any('Deserialize' in line for line in positive_prefix)

          for token in [
              'target.validate()?',
              'target.dna_hash_raw_39 != manifest.dna_hash_raw_39',
              'required_deployment_for_target_agent(target.agent_pub_key_raw_39.clone())',
              'match_required_coordinator_deployment(&required, observed, now_ms)',
              'matched.dna_hash_raw_39() != target.dna_hash_raw_39.as_slice()',
              'matched.agent_pub_key_raw_39() != target.agent_pub_key_raw_39.as_slice()',
              '.max(matched.observed_at_ms())',
              '.min(matched.valid_until_ms())',
              'current_release.qualification_digest()',
              'target_selection_digest',
              'required_deployment_digest',
              'matched.match_digest()',
          ]:
              assert token in src, token

          for forbidden in [
              'AdminWebsocket',
              'observe_coordinator_deployment',
              'get_dna_definition(',
              'get_wasm_zome_hash(',
              'perform_external_effect',
              'call_remote(',
              'update_coordinators',
          ]:
              assert forbidden not in src, forbidden

          for invariant in [
              'three independent inputs remain distinct',
              'target selection is evidence/data, not authority',
              'release authority does not choose the installation-specific agent',
              '#262 remains the exact code-set matcher',
              'exact cellid equality is checked before positive composition',
              'positive composition is non-deserializable',
              'pure equality is not provenance',
              'no coordinator-update atomicity claim',
              'no execution/effect authority',
              'provisioning remains blocked',
          ]:
              assert invariant in inv, invariant

          assert 'name: authority_current_freshness_verifier' not in dna
          assert 'name: constitution_currentness_verifier' not in dna

          print('PASS: exact target + current release + exact observed coordinator set compose without collapsing provenance or effect authority')
          PY
