name: COS Conformance Baseline

on:
  push:
    branches: [myc-int-demo-d6w-layered-commitments]
  pull_request:
    branches: [myc-int-demo-d6w-layered-commitments]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Baseline control run: establish whether the D6W stack itself compiles before
# D6X changes are treated as causal for downstream compiler failures.
concurrency:
  group: cos-conformance-baseline-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: myc-int-demo-d6w-layered-commitments
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-manufacturing

      - name: Capture toolchain identity
        if: always()
        run: |
          mkdir -p evidence
          rustc -Vv > evidence/rustc-version.txt
          cargo -V > evidence/cargo-version.txt

      - name: Capture tested baseline revision
        if: always()
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/tested-baseline-sha.txt

      - name: Test COS conformance baseline
        id: baseline_test
        run: |
          mkdir -p evidence
          set +e
          cd mycelix-manufacturing
          cargo test -p cos_conformance 2>&1 | tee ../evidence/cargo-test.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "${status}" > ../evidence/cargo-test.exit-code
          exit "${status}"

      - name: Write baseline envelope
        if: always()
        run: |
          test_exit_code="null"
          if [[ -f evidence/cargo-test.exit-code ]]; then
            test_exit_code="$(cat evidence/cargo-test.exit-code)"
          fi
          cat > evidence/run-envelope.json <<JSON
          {
            "schema": "MYCELIX-COS-CONFORMANCE-BASELINE-V1",
            "claim_ceiling": "ReferenceModelOnly",
            "repository": "${{ github.repository }}",
            "trigger_commit_sha": "${{ github.sha }}",
            "tested_ref": "myc-int-demo-d6w-layered-commitments",
            "tested_baseline_sha": "$(cat evidence/tested-baseline-sha.txt)",
            "workflow": "${{ github.workflow }}",
            "run_id": ${{ github.run_id }},
            "run_attempt": ${{ github.run_attempt }},
            "event": "${{ github.event_name }}",
            "runner_os": "${{ runner.os }}",
            "baseline_test_outcome": "${{ steps.baseline_test.outcome }}",
            "baseline_test_exit_code": $test_exit_code
          }
          JSON

      - name: Preserve baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cos-conformance-baseline-${{ github.sha }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
