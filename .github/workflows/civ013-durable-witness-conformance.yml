name: CIV-013 Durable Witness Conformance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/civ013-durable-witness-conformance.yml"
      - "docs/integral/civ-013-durable-witness-conformance-v1*"
      - "scripts/integral/verify_civ013_durable_witness_conformance_v1.py"
  push:
    branches:
      - research/civ-013-durable-profile-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civ013-durable-witness-conformance-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    name: Durable witness profile exact-head reference check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      QUALIFIED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact qualification subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact qualification subject
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$QUALIFIED_SHA"
          printf 'qualified_sha=%s\n' "$actual"

      - name: Validate JSON syntax
        run: |
          python3 -m json.tool docs/integral/civ-013-durable-witness-conformance-v1.json >/dev/null
          python3 -m json.tool docs/integral/civ-013-durable-witness-conformance-v1-manifest.json >/dev/null

      - name: Verify pinned checker commit and producer toolchain
        shell: bash
        run: |
          set -euo pipefail
          checker_commit="$(python3 -c 'import json; print(json.load(open("docs/integral/civ-013-durable-witness-conformance-v1-manifest.json"))["checker_commit_sha"])')"
          expected_checker_blob="$(python3 -c 'import json; print(json.load(open("docs/integral/civ-013-durable-witness-conformance-v1-manifest.json"))["checker_git_blob_sha"])')"
          git merge-base --is-ancestor "$checker_commit" "$QUALIFIED_SHA"
          actual_checker_blob="$(git hash-object scripts/integral/verify_civ013_durable_witness_conformance_v1.py)"
          test "$actual_checker_blob" = "$expected_checker_blob"

          source_commit="$(python3 -c 'import json; print(json.load(open("docs/integral/civ-013-durable-witness-conformance-v1-manifest.json"))["source_adapter_commit"])')"
          expected_source_blob="$(python3 -c 'import json; print(json.load(open("docs/integral/civ-013-durable-witness-conformance-v1-manifest.json"))["source_adapter_blob_sha"])')"
          expected_toolchain_blob="$(python3 -c 'import json; print(json.load(open("docs/integral/civ-013-durable-witness-conformance-v1-manifest.json"))["source_toolchain_blob_sha"])')"
          expected_rust_version="$(python3 -c 'import json; print(json.load(open("docs/integral/civ-013-durable-witness-conformance-v1-manifest.json"))["source_rust_version"])')"
          git init symthaea-source
          git -C symthaea-source fetch --depth=1 https://github.com/Luminous-Dynamics/symthaea.git "$source_commit"
          git -C symthaea-source checkout --detach FETCH_HEAD
          actual_source_commit="$(git -C symthaea-source rev-parse HEAD)"
          test "$actual_source_commit" = "$source_commit"
          actual_source_blob="$(git -C symthaea-source hash-object crates/domains/symthaea-civ-witness/src/lib.rs)"
          test "$actual_source_blob" = "$expected_source_blob"
          actual_toolchain_blob="$(git -C symthaea-source hash-object rust-toolchain.toml)"
          test "$actual_toolchain_blob" = "$expected_toolchain_blob"
          actual_rust_version="$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' symthaea-source/rust-toolchain.toml)"
          test "$actual_rust_version" = "$expected_rust_version"
          printf 'checker_commit_sha=%s\nchecker_blob_sha=%s\nsource_adapter_commit=%s\nsource_adapter_blob_sha=%s\nsource_toolchain_blob_sha=%s\nsource_rust_version=%s\n' "$checker_commit" "$actual_checker_blob" "$actual_source_commit" "$actual_source_blob" "$actual_toolchain_blob" "$actual_rust_version"

      - name: Run independent durable-profile checker
        id: vectors
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/integral/verify_civ013_durable_witness_conformance_v1.py | tee civ013-durable-witness-conformance.txt

      - name: Emit qualification record
        if: always()
        env:
          VECTOR_OUTCOME: ${{ steps.vectors.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "CIV-013 DURABLE ADAPTER REFERENCE PROFILE"
            echo "status=durable-profile-reference-${VECTOR_OUTCOME}"
            echo "verification_step_outcome=${VECTOR_OUTCOME}"
            echo "commit=$QUALIFIED_SHA"
            echo "workflow=$GITHUB_WORKFLOW"
            echo "workflow_ref=$GITHUB_WORKFLOW_REF"
            echo "workflow_sha=$(git hash-object .github/workflows/civ013-durable-witness-conformance.yml)"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "runner_os=$RUNNER_OS"
            echo "runner_image=${ImageOS:-unknown}"
            echo "python=$(python3 --version)"
            echo "profile_id=$(python3 -c 'import json; print(json.load(open("docs/integral/civ-013-durable-witness-conformance-v1-manifest.json"))["profile_id"])')"
            echo "manifest_sha256=$(sha256sum docs/integral/civ-013-durable-witness-conformance-v1-manifest.json | cut -d' ' -f1)"
            echo "fixture_sha256=$(sha256sum docs/integral/civ-013-durable-witness-conformance-v1.json | cut -d' ' -f1)"
            echo "verifier_sha256=$(sha256sum scripts/integral/verify_civ013_durable_witness_conformance_v1.py | cut -d' ' -f1)"
            echo "manifest_git_blob=$(git hash-object docs/integral/civ-013-durable-witness-conformance-v1-manifest.json)"
            echo "fixture_git_blob=$(git hash-object docs/integral/civ-013-durable-witness-conformance-v1.json)"
            echo "verifier_git_blob=$(git hash-object scripts/integral/verify_civ013_durable_witness_conformance_v1.py)"
            echo "checker_commit_sha=$(python3 -c 'import json; print(json.load(open("docs/integral/civ-013-durable-witness-conformance-v1-manifest.json"))["checker_commit_sha"])')"
            echo "checker_runtime_policy=$(python3 -c 'import json; m=json.load(open("docs/integral/civ-013-durable-witness-conformance-v1-manifest.json")); print(m["checker_runtime"]["implementation"] + ">=" + m["checker_runtime"]["minimum_version"])')"
            echo "source_adapter_commit=$(python3 -c 'import json; print(json.load(open("docs/integral/civ-013-durable-witness-conformance-v1-manifest.json"))["source_adapter_commit"])')"
            echo "source_adapter_blob_sha=$(python3 -c 'import json; print(json.load(open("docs/integral/civ-013-durable-witness-conformance-v1-manifest.json"))["source_adapter_blob_sha"])')"
            echo "source_toolchain_blob_sha=$(python3 -c 'import json; print(json.load(open("docs/integral/civ-013-durable-witness-conformance-v1-manifest.json"))["source_toolchain_blob_sha"])')"
            echo "source_rust_version=$(python3 -c 'import json; print(json.load(open("docs/integral/civ-013-durable-witness-conformance-v1-manifest.json"))["source_rust_version"])')"
            if test -f symthaea-source/crates/domains/symthaea-civ-witness/src/lib.rs; then
              echo "fetched_source_adapter_git_blob=$(git -C symthaea-source hash-object crates/domains/symthaea-civ-witness/src/lib.rs)"
              echo "fetched_source_toolchain_git_blob=$(git -C symthaea-source hash-object rust-toolchain.toml)"
            else
              echo "fetched_source_adapter_git_blob=unavailable"
              echo "fetched_source_toolchain_git_blob=unavailable"
            fi
            echo "claim_ceiling=DurableAdapterReferenceConformanceOnly"
          } | tee -a civ013-durable-witness-conformance.txt

      - name: Upload qualification record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: civ013-durable-witness-profile-${{ env.QUALIFIED_SHA }}
          path: civ013-durable-witness-conformance.txt
