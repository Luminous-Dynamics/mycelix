name: Praxis branch workflow diagnostic

on:
  push:
    branches:
      - praxis/capability-plan-compiler-v1

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm branch workflow execution
        run: |
          echo "workflow_parser_and_runner_reached"
          echo "sha=${{ github.sha }}"
