name: ITOPS Compound Fault Factorial Reference

on:
  pull_request:
    branches: [main]
    paths:
      - "lise-benchmarks/itops-compound-fault-factorial-reference/**"
      - ".github/workflows/itops-compound-fault-factorial-reference.yml"
  push:
    branches: [main]
    paths:
      - "lise-benchmarks/itops-compound-fault-factorial-reference/**"
      - ".github/workflows/itops-compound-fault-factorial-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: itops-compound-fault-factorial-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Require jq
        run: command -v jq
      - name: Validate factorial known answers
        run: bash lise-benchmarks/itops-compound-fault-factorial-reference/validate.sh
      - name: Run adversarial mutation controls
        run: bash lise-benchmarks/itops-compound-fault-factorial-reference/mutation-tests.sh
