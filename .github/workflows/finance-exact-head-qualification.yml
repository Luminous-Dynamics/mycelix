name: Finance Exact-Head Qualification

on:
  workflow_run:
    workflows: ["Finance Qualification Request"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Same-repository PR to qualify"
        required: true
        type: string
      expected_head_sha:
        description: "Exact PR head SHA to qualify"
        required: true
        type: string

# Qualification evidence must never be superseded by generic PR CI.
concurrency:
  group: finance-exact-head-qualification-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.expected_head_sha || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  qualify:
    name: Qualify exact Finance subject
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'pull_request' &&
           github.event.workflow_run.head_repository.full_name == github.repository &&
           github.event.workflow_run.pull_requests[0].head.repo.full_name == github.repository &&
           github.event.workflow_run.pull_requests[0].base.repo.full_name == github.repository &&
           github.event.workflow_run.pull_requests[0].base.ref == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Assert trusted default-branch control plane
        env:
          EXPECTED_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/finance-exact-head-qualification.yml@refs/heads/main
          ACTUAL_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          test "${ACTUAL_WORKFLOW_REF}" = "${EXPECTED_WORKFLOW_REF}"

      - name: Checkout trusted verifier revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          clean: true
          persist-credentials: false
          fetch-depth: 1

      - name: Capture trusted verifier identity
        id: trusted
        run: |
          set -euo pipefail
          trusted_sha="$(git rev-parse HEAD)"
          workflow_blob="$(git rev-parse HEAD:.github/workflows/finance-exact-head-qualification.yml)"
          test "${trusted_sha}" = "${{ github.workflow_sha }}"
          printf 'trusted_workflow_sha=%s\n' "${trusted_sha}" >> "${GITHUB_OUTPUT}"
          printf 'trusted_workflow_ref=%s\n' "${{ github.workflow_ref }}" >> "${GITHUB_OUTPUT}"
          printf 'trusted_workflow_blob_sha=%s\n' "${workflow_blob}" >> "${GITHUB_OUTPUT}"

      - name: Validate immutable verifier shape
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path(".github/workflows/finance-exact-head-qualification.yml")
          text = path.read_text(encoding="utf-8")

          expected = {
              "actions/checkout": "3d3c42e5aac5ba805825da76410c181273ba90b1",
              "dtolnay/rust-toolchain": "7e38f4b43b4db5c8dd498af069a4f6196df1d067",
              "actions/upload-artifact": "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          }
          refs = re.findall(r"uses:\s*([^@\s]+)@([^\s#]+)", text)
          assert refs, "no actions discovered"
          for action, ref in refs:
              assert re.fullmatch(r"[0-9a-f]{40}", ref), f"unpinned action: {action}@{ref}"
              assert expected.get(action) == ref, f"unexpected action pin: {action}@{ref}"

          assert text.count("workflow_run:") == 1
          assert text.count("workflow_dispatch:") == 1
          assert text.count("name: Resolve exact qualification subject") == 1
          assert text.count("name: Checkout exact PR head") == 1
          assert text.count("name: Assert exact PR-head checkout") == 1
          assert text.count("id: checkout") == 1
          assert text.count("id: artifact_guard") == 1
          assert text.count("id: tree_immutability") == 1
          assert text.count("name: Emit qualification receipt") == 1
          assert text.count("name: Upload immutable qualification evidence") == 1
          assert "cancel-in-progress: false" in text
          assert "pulls/\${pr_number}" in text
          assert "api_head_sha" in text
          assert "api_head_repository" in text
          assert "api_base_ref" in text
          assert "git rev-parse HEAD^{tree}" in text
          assert "git status --porcelain --untracked-files=no" in text
          assert "git archive --format=tar" in text
          assert "finance-qualification-test" in text
          assert "chmod 0555" in text
          assert "env -i" in text
          assert "CARGO_TARGET_DIR" in text
          assert "CARGO_HOME" in text
          assert "GITHUB_TOKEN" not in text
          PY

      - name: Resolve exact qualification subject
        id: subject
        env:
          EVENT_PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number || github.event.workflow_run.pull_requests[0].number || '' }}
          EVENT_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.expected_head_sha || github.event.workflow_run.head_sha || '' }}
          EVENT_BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pr_number="${EVENT_PR_NUMBER}"
          expected_head_sha="${EVENT_HEAD_SHA}"
          base_sha="${EVENT_BASE_SHA}"

          printf '%s\n' "${pr_number}" | grep -Eq '^[0-9]+$'
          printf '%s\n' "${expected_head_sha}" | grep -Eq '^[0-9a-f]{40}$'

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
          api_head_sha="$(printf '%s' "${pr_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])')"
          api_head_repository="$(printf '%s' "${pr_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["repo"]["full_name"])')"
          api_base_repository="$(printf '%s' "${pr_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["base"]["repo"]["full_name"])')"
          api_base_ref="$(printf '%s' "${pr_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["base"]["ref"])')"
          api_base_sha="$(printf '%s' "${pr_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["base"]["sha"])')"
          api_state="$(printf '%s' "${pr_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["state"])')"

          test "${api_head_sha}" = "${expected_head_sha}"
          test "${api_head_repository}" = "${GITHUB_REPOSITORY}"
          test "${api_base_repository}" = "${GITHUB_REPOSITORY}"
          test "${api_base_ref}" = "main"
          test "${api_state}" = "open"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            test "${api_base_sha}" = "${base_sha}"
          else
            base_sha="${api_base_sha}"
          fi

          printf 'pr_number=%s\n' "${pr_number}" >> "${GITHUB_OUTPUT}"
          printf 'expected_head_sha=%s\n' "${expected_head_sha}" >> "${GITHUB_OUTPUT}"
          printf 'base_sha=%s\n' "${base_sha}" >> "${GITHUB_OUTPUT}"
          printf 'head_repository=%s\n' "${api_head_repository}" >> "${GITHUB_OUTPUT}"
          printf 'base_repository=%s\n' "${api_base_repository}" >> "${GITHUB_OUTPUT}"
          printf 'resolution_mode=%s\n' "${{ github.event_name }}" >> "${GITHUB_OUTPUT}"

      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.subject.outputs.expected_head_sha }}
          clean: true
          persist-credentials: false
          fetch-depth: 1

      - name: Assert exact PR-head checkout
        id: checkout
        run: |
          set -euo pipefail
          git clean -ffdx
          actual_head_sha="$(git rev-parse HEAD)"
          subject_tree_sha="$(git rev-parse HEAD^{tree})"
          test "${actual_head_sha}" = "${{ steps.subject.outputs.expected_head_sha }}"
          printf 'tested_head_sha=%s\n' "${actual_head_sha}" >> "${GITHUB_OUTPUT}"
          printf 'subject_tree_sha=%s\n' "${subject_tree_sha}" >> "${GITHUB_OUTPUT}"

      - name: Assert no tracked Finance Python environments
        id: artifact_guard
        run: |
          set -euo pipefail
          forbidden="$(git ls-tree -r --name-only HEAD | grep -E '^mycelix-finance/(\.venv|venv|env)(/|$)' || true)"
          test -z "${forbidden}"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # pinned action commit
        with:
          toolchain: 1.96.1
          components: rustfmt

      - name: Assert Rust identity
        run: |
          set -euo pipefail
          test "$(rustc +1.96.1 --version | awk '{print $2}')" = "1.96.1"
          test "$(rustc +1.96.1 --version --verbose | sed -n 's/^commit-hash: //p')" = "31fca3adb283cc9dfd56b49cdee9a96eb9c96ffd"

      - name: Prepare isolated Finance execution identity
        id: isolation
        run: |
          set -euo pipefail

          subject_dir="${RUNNER_TEMP}/finance-subject"
          cargo_home="${RUNNER_TEMP}/finance-test-cargo-home"
          cargo_target="${RUNNER_TEMP}/finance-test-target"
          test_home="${RUNNER_TEMP}/finance-test-home"

          rm -rf "${subject_dir}" "${cargo_home}" "${cargo_target}" "${test_home}"
          mkdir -p "${subject_dir}" "${cargo_home}" "${cargo_target}" "${test_home}"

          if git ls-tree -r HEAD -- mycelix-finance \
              | awk -F'\\t' '$1 ~ /^120000 / { bad=1 } END { exit bad+0 }'; then
            :
          else
            echo "Finance qualification subject contains a symlink under mycelix-finance/" >&2
            git ls-tree -r HEAD -- mycelix-finance | awk -F'\\t' '$1 ~ /^120000 / { print }'
            exit 1
          fi

          git archive --format=tar "${{ steps.checkout.outputs.tested_head_sha }}" \
            | tar -xf - -C "${subject_dir}"

          sudo chown -R root:root "${subject_dir}"
          sudo find "${subject_dir}" -type d -exec chmod 0555 {} +
          sudo find "${subject_dir}" -type f -exec chmod 0444 {} +

          if id finance-qualification-test >/dev/null 2>&1; then
            sudo userdel finance-qualification-test || true
          fi
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin finance-qualification-test

          rust_bin="$(rustup which rustc --toolchain 1.96.1)"
          cargo_bin="$(rustup which cargo --toolchain 1.96.1)"
          rustdoc_bin="$(rustup which rustdoc --toolchain 1.96.1)"
          rust_dir="$(dirname "${rust_bin}")"

          sudo chown -R finance-qualification-test:finance-qualification-test \
            "${cargo_home}" "${cargo_target}" "${test_home}"

          {
            printf 'subject_dir=%s\\n' "${subject_dir}"
            printf 'cargo_home=%s\\n' "${cargo_home}"
            printf 'cargo_target=%s\\n' "${cargo_target}"
            printf 'test_home=%s\\n' "${test_home}"
            printf 'rust_bin=%s\\n' "${rust_bin}"
            printf 'cargo_bin=%s\\n' "${cargo_bin}"
            printf 'rustdoc_bin=%s\\n' "${rustdoc_bin}"
            printf 'rust_dir=%s\\n' "${rust_dir}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check Finance formatting as isolated test identity
        id: fmt
        run: |
          set -euo pipefail
          test_user=finance-qualification-test

          sudo -u "${test_user}" env -i \
            HOME="${{ steps.isolation.outputs.test_home }}" \
            PATH="${{ steps.isolation.outputs.rust_dir }}:/usr/bin:/bin" \
            CARGO_HOME="${{ steps.isolation.outputs.cargo_home }}" \
            CARGO_TARGET_DIR="${{ steps.isolation.outputs.cargo_target }}" \
            CARGO_TERM_COLOR=never \
            RUSTC="${{ steps.isolation.outputs.rust_bin }}" \
            RUSTDOC="${{ steps.isolation.outputs.rustdoc_bin }}" \
            TMPDIR="${{ steps.isolation.outputs.test_home }}" \
            "${{ steps.isolation.outputs.cargo_bin }}" \
              fmt --manifest-path "${{ steps.isolation.outputs.subject_dir }}/mycelix-finance/Cargo.toml" \
              --all -- --check

      - name: Run Finance workspace tests as isolated test identity
        id: tests
        run: |
          set -euo pipefail
          test_user=finance-qualification-test

          sudo -u "${test_user}" env -i \
            HOME="${{ steps.isolation.outputs.test_home }}" \
            PATH="${{ steps.isolation.outputs.rust_dir }}:/usr/bin:/bin" \
            CARGO_HOME="${{ steps.isolation.outputs.cargo_home }}" \
            CARGO_TARGET_DIR="${{ steps.isolation.outputs.cargo_target }}" \
            CARGO_TERM_COLOR=never \
            RUSTC="${{ steps.isolation.outputs.rust_bin }}" \
            RUSTDOC="${{ steps.isolation.outputs.rustdoc_bin }}" \
            TMPDIR="${{ steps.isolation.outputs.test_home }}" \
            "${{ steps.isolation.outputs.cargo_bin }}" \
              test --workspace --manifest-path "${{ steps.isolation.outputs.subject_dir }}/mycelix-finance/Cargo.toml" --locked

      - name: Assert isolated candidate source remained immutable
        id: source_immutability
        if: always()
        run: |
          set -euo pipefail
          source_dir="${{ steps.isolation.outputs.subject_dir }}"
          test -d "${source_dir}"
          test -z "$(sudo find "${source_dir}" -type f -writable -print)"
          test -z "$(sudo find "${source_dir}" -type d -writable -print)"
          test -z "$(sudo find "${source_dir}/mycelix-finance" -type l -print -quit)"
          test -n "${{ steps.isolation.outputs.test_home }}"
          test -n "${{ steps.isolation.outputs.cargo_home }}"
          test -n "${{ steps.isolation.outputs.cargo_target }}"

      - name: Assert trusted worktree remained immutable
        id: tree_immutability
        if: always()
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          executed_tree_sha="$(git rev-parse HEAD^{tree})"
          test "${executed_tree_sha}" = "${{ steps.checkout.outputs.subject_tree_sha }}"
          printf 'executed_tree_sha=%s\n' "${executed_tree_sha}" >> "${GITHUB_OUTPUT}"

      - name: Emit qualification receipt
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence
          result=FAIL
          if [ "${{ steps.fmt.outcome }}" = "success" ] &&
             [ "${{ steps.tests.outcome }}" = "success" ] &&
             [ "${{ steps.artifact_guard.outcome }}" = "success" ] &&
             [ "${{ steps.source_immutability.outcome }}" = "success" ] &&
             [ "${{ steps.tree_immutability.outcome }}" = "success" ]; then
            result=PASS
          fi

          cat > evidence/finance-exact-head-qualification.txt <<EOF
          result=${result}
          qualification_status=${result}
          pr_number=${{ steps.subject.outputs.pr_number }}
          subject_sha=${{ steps.checkout.outputs.tested_head_sha || '' }}
          expected_head_sha=${{ steps.subject.outputs.expected_head_sha }}
          subject_tree_sha=${{ steps.checkout.outputs.subject_tree_sha }}
          executed_tree_sha=${{ steps.tree_immutability.outputs.executed_tree_sha || '' }}
          base_sha=${{ steps.subject.outputs.base_sha }}
          head_repository=${{ steps.subject.outputs.head_repository }}
          base_repository=${{ steps.subject.outputs.base_repository }}
          resolution_mode=${{ steps.subject.outputs.resolution_mode }}
          candidate_execution_identity=finance-qualification-test
          candidate_source_snapshot=${{ steps.isolation.outputs.subject_dir || '' }}
          candidate_source_read_only=true
          candidate_build_state=${{ steps.isolation.outputs.cargo_target || '' }}
          candidate_cargo_home=${{ steps.isolation.outputs.cargo_home || '' }}
          upstream_request_run_id=${{ github.event.workflow_run.id || '' }}
          upstream_request_run_attempt=${{ github.event.workflow_run.run_attempt || '' }}
          workflow_run_id=${{ github.run_id }}
          workflow_run_attempt=${{ github.run_attempt }}
          trusted_workflow_sha=${{ steps.trusted.outputs.trusted_workflow_sha }}
          trusted_workflow_ref=${{ steps.trusted.outputs.trusted_workflow_ref }}
          trusted_workflow_blob_sha=${{ steps.trusted.outputs.trusted_workflow_blob_sha }}
          workflow_name=${{ github.workflow }}
          workflow_ref=${{ github.workflow_ref }}
          workflow_event=${{ github.event_name }}
          rust_toolchain=1.96.1
          rust_commit_hash=31fca3adb283cc9dfd56b49cdee9a96eb9c96ffd
          EOF

          test "${{ steps.checkout.outputs.tested_head_sha || '' }}" = "${{ steps.subject.outputs.expected_head_sha }}"

      - name: Upload immutable qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finance-exact-head-qualification-${{ steps.subject.outputs.expected_head_sha }}
          path: evidence/finance-exact-head-qualification.txt
          if-no-files-found: error
          retention-days: 30
