name: Finance Exact-Head Qualification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'mycelix-finance/**'
      - 'mycelix-workspace/mycelix-finance/**'
      - 'crates/mycelix-bridge-*/**'
      - 'scripts/security/finance_update_integrity_audit.py'
      - '.github/workflows/finance-exact-head-qualification.yml'
# Qualification evidence is intentionally separate from supersedable merge CI.
# There is no concurrency cancellation in this workflow.
permissions:
  contents: read

jobs:
  qualify:
    name: Finance Exact-Head Qualification
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact qualification subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Assert repository identity
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          test "$EXPECTED_REPOSITORY" = 'Luminous-Dynamics/mycelix'
          test "$EXPECTED_REPOSITORY_ID" = '1176351975'
      - name: Assert exact qualification subject
        if: github.event_name == 'pull_request'
        env:
          QUALIFIED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.96.1
          components: rustfmt
      - name: Assert Rust identity
        run: |
          set -euo pipefail
          test "$(rustc +1.96.1 --version | awk '{print $2}')" = '1.96.1'
          test "$(rustc +1.96.1 --version --verbose | sed -n 's/^commit-hash: //p')" = '31fca3adb283cc9dfd56b49cdee9a96eb9c96ffd'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: mycelix-finance
      - name: Check Finance formatting
        run: cd mycelix-finance && cargo fmt --all -- --check
      - name: Test Finance workspace at exact head
        run: cargo test --workspace --manifest-path mycelix-finance/Cargo.toml
      - name: Run Finance update predecessor audit
        run: python3 scripts/security/finance_update_integrity_audit.py
      - name: Emit immutable qualification evidence
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo 'FINANCE_EXACT_HEAD_QUALIFICATION'
          echo 'status=execution-complete'
          echo 'repository=Luminous-Dynamics/mycelix'
          echo 'repository_id=1176351975'
          echo "subject=$(git rev-parse HEAD)"
          echo "workflow_run_id=$WORKFLOW_RUN_ID"
          echo "workflow_run_attempt=$WORKFLOW_RUN_ATTEMPT"
          echo "workflow_ref=$WORKFLOW_REF"
          echo "event=$EVENT_NAME"