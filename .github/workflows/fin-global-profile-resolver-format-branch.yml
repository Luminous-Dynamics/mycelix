name: FIN-GLOBAL-PROFILE-RESOLVER one-time rustfmt normalization

on:
  push:
    branches:
      - research/fin-global-profile-resolver-v1

permissions:
  contents: write

concurrency:
  group: fin-global-profile-resolver-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_BRANCH: ${{ github.ref_name }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
      - name: Assert checkout
        run: test "$(git rev-parse HEAD)" = "${{ env.TARGET_SHA }}"
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.96.1
          components: rustfmt
      - name: Normalize Rust formatting
        working-directory: mycelix-finance/benchmarks/global-accounting-portability-v1/rust-resolver
        run: cargo fmt --all
      - name: Commit only formatting changes
        shell: bash
        run: |
          set -euo pipefail
          TARGETS=(mycelix-finance/benchmarks/global-accounting-portability-v1/rust-resolver/src/main.rs)
          if git diff --quiet -- "${TARGETS[@]}"; then
            echo "Rust sources are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${TARGETS[@]}"
          git commit -m "style(finance): normalize global profile resolver formatting"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
