name: Relational Capability Reference

on:
  push:
    branches:
      - research/relational-capability-containment-v0.1
    paths:
      - "research/relational-capability-containment-v0.1/**"
      - ".github/workflows/relational-capability-reference.yml"
  pull_request:
    paths:
      - "research/relational-capability-containment-v0.1/**"
      - ".github/workflows/relational-capability-reference.yml"

permissions:
  contents: read

concurrency:
  group: relational-capability-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path research/relational-capability-containment-v0.1/Cargo.toml --check
      - name: Unit and adversarial tests
        run: cargo test --manifest-path research/relational-capability-containment-v0.1/Cargo.toml --all-targets
      - name: Strict Clippy
        run: cargo clippy --manifest-path research/relational-capability-containment-v0.1/Cargo.toml --all-targets -- -D warnings
