name: Finance Liquidity Reordering Research

on:
  push:
    branches:
      - feat/liquidity-reordering-exact-oracle-20261021
      - feat/liquidity-budgeted-replay-20261022
    paths:
      - research/finance-liquidity-reordering/**
      - .github/workflows/finance-liquidity-reordering.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - research/finance-liquidity-reordering/**
      - .github/workflows/finance-liquidity-reordering.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finance-liquidity-reordering-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test-and-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Assert exact subject and repository
        run: |
          set -euo pipefail
          test '${{ github.repository }}' = 'Luminous-Dynamics/mycelix'
          test '${{ github.repository_id }}' = '1176351975'
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.96.1
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path research/finance-liquidity-reordering/Cargo.toml -- --check

      - name: Test independent exact oracle and heuristics
        run: cargo test --manifest-path research/finance-liquidity-reordering/Cargo.toml --offline --locked

      - name: Build and run release benchmark
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/liquidity-reordering-artifact"
          mkdir -p "$out"
          {
            echo "repository=Luminous-Dynamics/mycelix"
            echo "subject_sha=$(git rev-parse HEAD)"
            echo "workflow_run_id=${{ github.run_id }}"
            echo "workflow_run_attempt=${{ github.run_attempt }}"
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            rustc +1.96.1 --version --verbose
            cargo +1.96.1 --version
            uname -a
            lscpu | grep -E '^(Architecture|CPU\(s\)|Model name|Thread|Core|Socket):'
          } > "$out/metadata.txt"
          cargo run --manifest-path research/finance-liquidity-reordering/Cargo.toml --offline --locked --release --example benchmark > "$out/results.csv"
          test "$(wc -l < "$out/results.csv")" -eq 340
          awk -F, '
            NR == 1 { if ($15 != "aggregate_liquidity_gap_minor" || $16 != "max_participant_gap_minor" || $8 != "algorithm" || $7 != "exact_pareto_frontier_size" || $13 != "aggregate_saving_vs_input_minor" || $14 != "max_participant_reduction_vs_input_minor" || $20 != "aggregate_net_position_lower_bound_minor" || $21 != "max_participant_net_position_lower_bound_minor" || $22 != "aggregate_gap_to_lower_bound_minor" || $23 != "max_participant_gap_to_lower_bound_minor") exit 2; next }
            {
              rows++
              if (NF != 23) failed = 1
              if ($3 !~ /^(reversed_equal_chain|reversed_heterogeneous_chain|reversed_cycle|hub_round_trips|precedence_constrained_chain)$/) failed = 1
              if ($1 !~ /^(4|6|8|10|30|70|140|700|1000|10000|50000|99999)$/) failed = 1
              if ($8 !~ /^(input_order|receiver_ready_greedy|receiver_ready_event_driven|bounded_insertion_search|simulated_annealing|heuristic_portfolio|exact_permutation_oracle|receiver_ready_event_driven_scale)$/) failed = 1
              key = $1 FS $3 FS $8 FS $9
              if (seen[key]++) failed = 1
              if ($17 !~ /^[0-9]+$/ || $18 !~ /^[0-9]+$/ || $19 !~ /^[0-9]+$/) failed = 1
              if ($17 > $18 || $18 > $19) failed = 1
              if ($8 == "input_order" && ($13 != "0" || $14 != "0")) failed = 1
              if ($1 <= 8 && ($7 !~ /^[0-9]+$/ || $7 < 1)) failed = 1
              if ($1 > 8 && $7 != "") failed = 1
              if ($13 != "" && $13 !~ /^-?[0-9]+$/) failed = 1
              if ($14 != "" && $14 !~ /^-?[0-9]+$/) failed = 1
              if ($15 != "" && ($15 !~ /^[0-9]+$/ || $15 < 0)) failed = 1
              if ($16 != "" && $16 !~ /^-?[0-9]+$/) failed = 1
              if ($15 == "0" && $16 != "" && $16 < 0) failed = 1
              if ($20 !~ /^[0-9]+$/ || $21 !~ /^[0-9]+$/) failed = 1
              if ($22 !~ /^[0-9]+$/ || $23 !~ /^[0-9]+$/) failed = 1
              if ($20 > $11 || $21 > $12) failed = 1
              if ($22 != ($11 - $20) || $23 != ($12 - $21)) failed = 1
              if ($8 == "exact_permutation_oracle") {
                exact++
                if ($15 != "0" || $16 != "0") failed = 1
              }
            }
            END {
              if (rows != 339 || exact != 15 || failed) exit 1
            }
          ' "$out/results.csv"
          cargo run --manifest-path research/finance-liquidity-reordering/Cargo.toml --offline --locked --release --example stream_benchmark > "$out/stream-results.csv"
          test "$(wc -l < "$out/stream-results.csv")" -eq 145
          awk -F, '
            NR == 1 {
              if (NF != 20 || $1 != "scenario" || $4 != "strategy" ||
                  $16 != "aggregate_saving_vs_fifo_minor" ||
                  $17 != "queue_wait_reduction_vs_fifo_ticks") exit 2
              next
            }
            {
              rows++
              if (NF != 20) failed = 1
              if ($1 !~ /^(staggered_arrivals|bursty_arrivals|tight_deadlines|dependency_heavy)$/) failed = 1
              if ($4 !~ /^(fifo|earliest_deadline_first|liquidity_greedy|liquidity_portfolio)$/) failed = 1
              if ($5 != 1 && $5 != 8 && $5 != 32) failed = 1
              if ($6 != 0 && $6 != 2 && $6 != 10) failed = 1
              key = $1 FS $4 FS $5 FS $6
              if (seen[key]++) failed = 1
              if ($2 != 240 || $3 != 32) failed = 1
              if ($7 != 11) failed = 1
              if ($8 < 1 || $9 > $5 || $10 > $2) failed = 1
              if ($11 !~ /^[0-9]+$/ || $12 !~ /^[0-9]+$/ || $13 !~ /^[0-9]+$/) failed = 1
              if ($14 !~ /^[0-9]+$/ || $15 !~ /^[0-9]+$/) failed = 1
              if ($16 !~ /^-?[0-9]+$/ || $17 !~ /^-?[0-9]+$/) failed = 1
              if ($18 !~ /^[0-9]+$/ || $19 !~ /^[0-9]+$/ || $20 !~ /^[0-9]+$/) failed = 1
              if ($18 > $19 || $19 > $20) failed = 1
              if ($4 == "fifo" && ($16 != "0" || $17 != "0")) failed = 1
            }
            END { if (rows != 144 || failed) exit 1 }
          ' "$out/stream-results.csv"
          cd research/finance-liquidity-reordering
          sha256sum Cargo.toml Cargo.lock README.md src/lib.rs src/stream_replay.rs tests/exact_oracle.rs tests/stream_replay.rs tests/budgeted_stream_replay.rs examples/benchmark.rs examples/stream_benchmark.rs > "$out/SOURCE-SHA256SUMS"
          cd "$out"
          sha256sum results.csv stream-results.csv metadata.txt SOURCE-SHA256SUMS > SHA256SUMS

      - name: Upload reproducible benchmark evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finance-liquidity-reordering-${{ github.sha }}
          path: ${{ runner.temp }}/liquidity-reordering-artifact/
          if-no-files-found: error
          retention-days: 90
