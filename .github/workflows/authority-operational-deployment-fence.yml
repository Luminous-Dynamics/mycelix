name: Authority Operational Deployment Fence

on:
  pull_request:
    paths:
      - 'crates/mycelix-authority-operational-deployment-fence/**'
      - 'crates/mycelix-authority-operational-freshness/**'
      - 'crates/mycelix-governance-constitution/**'
      - '.github/workflows/authority-operational-deployment-fence.yml'
  push:
    branches:
      - 'security/authority-operational-deployment-fence-v0.1'

permissions:
  contents: read

concurrency:
  group: authority-operational-deployment-fence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Host DNA + constitutional epoch deployment qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --manifest-path crates/mycelix-authority-operational-deployment-fence/Cargo.toml -- --check

      - name: Tests
        run: cargo test --manifest-path crates/mycelix-authority-operational-deployment-fence/Cargo.toml --all-targets

      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-authority-operational-deployment-fence/Cargo.toml --all-targets -- -D warnings

      - name: Authority separation audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('crates/mycelix-authority-operational-deployment-fence/src/lib.rs').read_text()
          inv = Path('crates/mycelix-authority-operational-deployment-fence/INVARIANTS.md').read_text().lower()

          assert 'semantic: &QualifiedOperationalSubjectFreshness' in src
          signature = src.split('pub fn qualify_operational_freshness_for_deployment(', 1)[1].split(') -> Result<', 1)[0]
          assert 'VerifiedAuthorityFreshness' not in signature
          assert 'constitutional_dna_hash: &str' in signature
          assert 'constitution_statement_digest: Digest32' in signature
          assert 'local_dna: &HostLocalDnaContext' in signature

          host = src.split('pub struct HostLocalDnaContext {', 1)[0]
          assert 'Serialize' in host.split('\n')[-2] or 'Serialize' in host
          assert 'Deserialize' not in host

          qualified_prefix = src.split('pub struct QualifiedDeploymentOperationalFreshness {', 1)[0]
          assert 'Deserialize' not in qualified_prefix.split('/// Non-deserializable proof')[-1]

          assert 'constitutional_dna_hash != local_dna.dna_hash' in src
          assert 'semantic.authority_digest()' in src
          assert 'semantic.evidence_digest()' in src
          assert 'semantic.root_qualification_digest()' in src
          assert 'semantic.operational_context_digest()' in src
          assert 'STATEMENT_PROFILE.as_bytes()' in src
          assert '&constitution_statement_digest.0' in src
          assert 'dna_hash.as_bytes()' in src
          assert 'semantic.lease_until_ms().min(local_dna.valid_until_ms)' in src
          assert 'semantic.verified_at_ms().max(local_dna.observed_at_ms)' in src
          assert 'current_freshness.validate_at(now_ms)' in src

          for forbidden in ['hdk::', 'dna_info(', 'get_links(', 'create_entry(', 'update_entry(', 'delete_entry(', 'execute_actions', 'phi', 'reputation', 'model_score']:
              assert forbidden.lower() not in src.lower(), forbidden

          assert 'semantic currentness must already exist locally' in inv
          assert 'host dna context is non-deserializable' in inv
          assert 'exact constitutional epoch is part of live deployment authority' in inv
          assert 'leases only narrow' in inv
          print('PASS: non-deserializable #117 authority is bound to exact host DNA + current constitutional epoch')
          PY
