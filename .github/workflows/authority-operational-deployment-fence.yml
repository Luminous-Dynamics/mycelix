name: Authority Operational Deployment Fence

on:
  pull_request:
    paths:
      - 'crates/mycelix-authority-operational-deployment-fence/**'
      - 'crates/mycelix-authority-operational-freshness/**'
      - 'crates/mycelix-authority-evidence-lease/**'
      - 'crates/mycelix-authority-state-bootstrap-root/**'
      - 'crates/mycelix-governance-constitution/**'
      - 'crates/mycelix-governance-constitution-currentness/**'
      - '.github/workflows/authority-operational-deployment-fence.yml'
  push:
    branches:
      - 'security/authority-operational-deployment-fence-v0.1'
      - 'security/authority-deployment-provenance-binding-v0.1'
      - 'security/authority-deployment-constitution-context-v0.1'
      - 'security/deployment-currentness-evidence-context-v0.1'

permissions:
  contents: read

concurrency:
  group: authority-operational-deployment-fence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: Host DNA + explicit constitution currentness + canonical provenance deployment qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Evidence provenance tests
        run: cargo test --manifest-path crates/mycelix-authority-evidence-lease/Cargo.toml --all-targets

      - name: Bootstrap-root tests
        run: cargo test --manifest-path crates/mycelix-authority-state-bootstrap-root/Cargo.toml --all-targets

      - name: Constitution currentness contract tests
        run: cargo test --manifest-path crates/mycelix-governance-constitution-currentness/Cargo.toml --all-targets

      - name: Format
        run: cargo fmt --manifest-path crates/mycelix-authority-operational-deployment-fence/Cargo.toml -- --check

      - name: Tests
        run: cargo test --manifest-path crates/mycelix-authority-operational-deployment-fence/Cargo.toml --all-targets

      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-authority-operational-deployment-fence/Cargo.toml --all-targets -- -D warnings

      - name: Authority, provenance and full-currentness separation audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('crates/mycelix-authority-operational-deployment-fence')
          src = (root / 'src/lib.rs').read_text()
          prov = (root / 'src/provenance.rs').read_text()
          constitution = (root / 'src/constitution.rs').read_text()
          currentness = (root / 'src/currentness.rs').read_text()
          combined = '\n'.join([src, prov, constitution, currentness])
          inv = (root / 'INVARIANTS.md').read_text().lower()
          cargo = (root / 'Cargo.toml').read_text()

          # Original #154 compatibility theorem remains unchanged and available.
          signature = src.split('pub fn qualify_operational_freshness_for_deployment(', 1)[1].split(') -> Result<', 1)[0]
          assert 'semantic: &QualifiedOperationalSubjectFreshness' in signature
          assert 'constitutional_dna_hash: &str' in signature
          assert 'constitution_statement_digest: Digest32' in signature
          assert 'local_dna: &HostLocalDnaContext' in signature
          assert 'VerifiedAuthorityFreshness' not in signature

          for module in ['provenance', 'constitution', 'currentness']:
              assert f'mod {module};' in src
              assert f'pub use {module}::*;' in src

          # Canonical provenance sibling remains non-deserializable and delegates to #154.
          assert 'mycelix-authority-evidence-lease' in cargo
          assert 'QualifiedEvidenceLeaseManifest' in prov
          sibling = prov.split('pub fn qualify_operational_freshness_for_deployment_with_provenance(', 1)[1].split(') -> Result<', 1)[0]
          assert 'provenance: &QualifiedEvidenceLeaseManifest' in sibling
          assert 'qualify_operational_freshness_for_deployment(' in prov
          getter = prov.split('pub fn deployment_authority_digest(&self)', 1)[1].split('}', 1)[0]
          assert 'self.base.deployment_authority_digest()' in getter
          assert 'provenance_manifest_digest' not in getter

          # #217 compatibility constitution context remains exact-root bound.
          assert 'VerifiedCurrentConstitutionReceipt' in constitution
          assert 'QualifiedAuthorityStateBootstrapRoot' in constitution
          context_prefix = constitution.split('pub struct QualifiedBindingConstitutionContext {', 1)[0]
          assert 'Serialize' in context_prefix
          assert 'Deserialize' not in context_prefix
          context_fn = constitution.split('pub fn qualify_binding_constitution_context(', 1)[1].split(') -> Result<', 1)[0]
          assert 'current: &VerifiedCurrentConstitutionReceipt' in context_fn
          assert 'rooted: &QualifiedAuthorityStateBootstrapRoot' in context_fn
          assert 'expected_statement_digest' not in context_fn
          assert 'rooted.current_constitution_digest()' in constitution
          assert 'rooted.qualification_digest()' in constitution

          # v0.4 full-currentness context consumes the shared canonical transport directly.
          assert 'mycelix-governance-constitution-currentness' in cargo
          assert 'LeasedVerifiedCurrentConstitution' in currentness
          assert 'CURRENTNESS_EVIDENCE_PROFILE' in currentness
          full_prefix = currentness.split('pub struct QualifiedCurrentnessBindingConstitutionContext {', 1)[0]
          assert 'Serialize' in full_prefix
          assert 'Deserialize' not in full_prefix
          full_fn = currentness.split('pub fn qualify_currentness_binding_constitution_context(', 1)[1].split(') -> Result<', 1)[0]
          assert 'current: &LeasedVerifiedCurrentConstitution' in full_fn
          assert 'rooted: &QualifiedAuthorityStateBootstrapRoot' in full_fn
          assert 'current.validate_at(now_ms)' in currentness
          assert 'qualify_binding_constitution_context(&receipt, rooted, now_ms)' in currentness
          assert 'current.currentness_evidence_digest' in currentness
          assert 'current.currentness_evidence_profile' in currentness
          assert 'full_currentness_context_digest(' in currentness

          # Active v0.4 sibling takes only non-deserializable qualified contexts.
          active = currentness.split('pub fn qualify_operational_freshness_for_deployment_with_currentness_and_provenance(', 1)[1].split(') -> Result<', 1)[0]
          assert 'semantic: &QualifiedOperationalSubjectFreshness' in active
          assert 'constitution: &QualifiedCurrentnessBindingConstitutionContext' in active
          assert 'local_dna: &HostLocalDnaContext' in active
          assert 'provenance: &QualifiedEvidenceLeaseManifest' in active
          for forbidden in ['constitutional_dna_hash', 'constitution_statement_digest', 'currentness_evidence_digest: Digest32']:
              assert forbidden not in active, forbidden
          assert 'qualify_operational_freshness_for_deployment_with_constitution_and_provenance(' in currentness

          # Stable authority remains structurally delegated all the way through #154.
          active_getter = currentness.split('pub fn deployment_authority_digest(&self)', 1)[1].split('}', 1)[0]
          assert 'self.base.deployment_authority_digest()' in active_getter
          assert 'currentness_evidence_digest' not in active_getter
          assert 'currentness_context_digest' not in active_getter

          # Full currentness enters dynamic evidence identity explicitly.
          assert 'currentness_bound_deployment_evidence_digest(' in currentness
          evidence_digest = currentness.split('fn currentness_bound_deployment_evidence_digest(', 1)[1].split('#[derive(Clone, Debug, PartialEq, Eq)]', 1)[0]
          for token in [
              'base_deployment_evidence_digest',
              'base_deployment_evidence_profile',
              'currentness_context_digest',
              'currentness_context_profile',
          ]:
              assert token in evidence_digest, token
          context_digest = currentness.split('fn full_currentness_context_digest(', 1)[1].split('fn currentness_bound_deployment_evidence_digest(', 1)[0]
          for token in [
              'compatibility_context_digest',
              'compatibility_context_profile',
              'currentness_evidence_digest',
              'currentness_evidence_profile',
          ]:
              assert token in context_digest, token

          # Explicit currentness lease/reference must exactly agree with #217 compatibility evidence.
          for token in [
              'base.binding_constitution_verification_ref() != constitution.verification_ref()',
              'base.binding_constitution_verified_at_ms() != constitution.verified_at_ms()',
              'base.binding_constitution_valid_until_ms() != constitution.valid_until_ms()',
              'base.valid_until_ms() > constitution.valid_until_ms()',
          ]:
              assert token in currentness, token

          # Every positive deployment/context type remains non-deserializable.
          markers = [
              (src, 'pub struct HostLocalDnaContext {'),
              (src, 'pub struct QualifiedDeploymentOperationalFreshness {'),
              (prov, 'pub struct QualifiedProvenanceBoundDeploymentOperationalFreshness {'),
              (constitution, 'pub struct QualifiedBindingConstitutionContext {'),
              (constitution, 'pub struct QualifiedConstitutionBoundProvenanceDeploymentOperationalFreshness {'),
              (currentness, 'pub struct QualifiedCurrentnessBindingConstitutionContext {'),
              (currentness, 'pub struct QualifiedCurrentnessBoundProvenanceDeploymentOperationalFreshness {'),
          ]
          for text, marker in markers:
              prefix = text.split(marker, 1)[0].split('\n')[-8:]
              assert not any('Deserialize' in line for line in prefix), marker

          for forbidden in ['hdk::', 'dna_info(', 'get_links(', 'create_entry(', 'update_entry(', 'delete_entry(', 'execute_actions', 'phi', 'reputation', 'model_score']:
              assert forbidden.lower() not in combined.lower(), forbidden

          for invariant in [
              'semantic currentness must already exist locally',
              'original #154 compatibility theorem remains unchanged',
              '#217 binding-constitution context remains a compatibility theorem',
              'full currentness context is non-deserializable',
              'explicit currentness evidence survives the final fence',
              'composition provenance and final currentness evidence remain causally separate',
              'active v0.4 theorem accepts no plain constitutional primitives',
              'stable deployment authority remains unchanged',
              'explicit currentness changes dynamic deployment evidence',
              'audit output exposes explicit final currentness identity',
              'all positive deployment contexts/results are non-deserializable',
          ]:
              assert invariant in inv, invariant
          print('PASS: full canonical constitution currentness is preserved through final deployment evidence without changing stable authority')
          PY
