name: Mycelix Personal Frontend

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'mycelix-personal/apps/leptos/**'
      - 'mycelix-personal/crates/personal-leptos-types/**'
      - 'mycelix-workspace/mycelix-personal/apps/leptos/**'
      - 'mycelix-workspace/mycelix-personal/crates/personal-leptos-types/**'
      - 'crates/mycelix-leptos-core/**'
      - 'crates/mycelix-leptos-client/**'
      - '.github/workflows/personal-frontend.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-personal/apps/leptos/**'
      - 'mycelix-personal/crates/personal-leptos-types/**'
      - 'mycelix-workspace/mycelix-personal/apps/leptos/**'
      - 'mycelix-workspace/mycelix-personal/crates/personal-leptos-types/**'
      - 'crates/mycelix-leptos-core/**'
      - 'crates/mycelix-leptos-client/**'
      - '.github/workflows/personal-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-frontend-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

env:
  PERSONAL_MANIFEST: mycelix-personal/apps/leptos/Cargo.toml
  PERSONAL_MIRROR_MANIFEST: mycelix-workspace/mycelix-personal/apps/leptos/Cargo.toml

jobs:
  personal-frontend:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Verify exact subject
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected" || {
            echo "::error::Expected exact Personal subject $expected, got $actual"
            exit 1
          }

      - name: Verify Personal frontend source closure
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            "$PERSONAL_MANIFEST" \
            "$PERSONAL_MIRROR_MANIFEST" \
            mycelix-personal/crates/personal-leptos-types/Cargo.toml \
            mycelix-workspace/mycelix-personal/crates/personal-leptos-types/Cargo.toml \
            crates/mycelix-leptos-core/Cargo.toml \
            crates/mycelix-leptos-client/Cargo.toml; do
            test -f "$path" || {
              echo "::error file=$path::Required Personal frontend dependency source is missing."
              exit 1
            }
          done

      - name: Verify mirrored Personal source
        shell: bash
        run: |
          set -euo pipefail
          diff -ru --exclude=Cargo.toml \
            mycelix-personal/apps/leptos \
            mycelix-workspace/mycelix-personal/apps/leptos
          diff -ru \
            mycelix-personal/crates/personal-leptos-types \
            mycelix-workspace/mycelix-personal/crates/personal-leptos-types

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87b
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            mycelix-personal/apps/leptos
            mycelix-workspace/mycelix-personal/apps/leptos
            crates/mycelix-leptos-core
            crates/mycelix-leptos-client

      - name: Verify both manifests resolve
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 --no-deps \
            --manifest-path "$PERSONAL_MANIFEST" >/dev/null
          cargo metadata --format-version 1 --no-deps \
            --manifest-path "$PERSONAL_MIRROR_MANIFEST" >/dev/null

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path "$PERSONAL_MANIFEST" -- --check
          cargo fmt --manifest-path "$PERSONAL_MIRROR_MANIFEST" -- --check
          cargo fmt --manifest-path mycelix-personal/crates/personal-leptos-types/Cargo.toml -- --check

      - name: Check WASM builds
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path "$PERSONAL_MANIFEST" --target wasm32-unknown-unknown
          cargo check --manifest-path "$PERSONAL_MIRROR_MANIFEST" --target wasm32-unknown-unknown

      - name: Run frontend and type tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path "$PERSONAL_MANIFEST" --lib
          cargo test --manifest-path mycelix-personal/crates/personal-leptos-types/Cargo.toml

      - name: Clippy Personal frontend
        id: clippy
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/personal-frontend-clippy.log"
          : > "$log"
          cargo clippy \
            --manifest-path "$PERSONAL_MANIFEST" \
            --target wasm32-unknown-unknown \
            --message-format short -- -D warnings 2>&1 | tee "$log"
          exit ${PIPESTATUS[0]}

      - name: Upload exact Clippy diagnostics
        if: ${{ always() && steps.clippy.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: personal-frontend-clippy-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/personal-frontend-clippy.log
          if-no-files-found: error
          retention-days: 7

      - name: Install pinned Trunk
        shell: bash
        run: |
          set -euo pipefail
          cargo install trunk --version 0.21.14 --locked

      - name: Build browser bundle
        shell: bash
        working-directory: mycelix-personal/apps/leptos
        run: trunk build --release

      - name: Prove checkout immutability
        id: immutability
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/personal-frontend-immutability.log"
          : > "$log"
          {
            echo '=== git status --short ==='
            git status --short
            echo '=== untracked paths ==='
            git ls-files --others --exclude-standard
            echo '=== git diff --stat ==='
            git diff --stat
            echo '=== git diff ==='
            git diff
          } 2>&1 | tee "$log"

          status=${PIPESTATUS[0]}
          if ! git diff --exit-code >>"$log" 2>&1; then
            status=1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            status=1
          fi
          exit "$status"

      - name: Preserve generated Personal lock candidates
        if: ${{ always() && steps.immutability.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/personal-lock-candidates"
          mkdir -p "$out/top-level" "$out/workspace-mirror"
          if [ -f mycelix-personal/apps/leptos/Cargo.lock ]; then
            cp mycelix-personal/apps/leptos/Cargo.lock "$out/top-level/Cargo.lock"
          fi
          if [ -f mycelix-workspace/mycelix-personal/apps/leptos/Cargo.lock ]; then
            cp mycelix-workspace/mycelix-personal/apps/leptos/Cargo.lock "$out/workspace-mirror/Cargo.lock"
          fi

      - name: Upload exact immutability diagnostics
        if: ${{ always() && steps.immutability.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: personal-frontend-immutability-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/personal-frontend-immutability.log
            ${{ runner.temp }}/personal-lock-candidates
          if-no-files-found: warn
          retention-days: 7
