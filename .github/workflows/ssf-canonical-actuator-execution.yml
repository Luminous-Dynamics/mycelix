name: SSF Canonical Actuator Execution

on:
  pull_request:
    paths:
      - 'mycelix-workspace/crates/mycelix-ssf-actuator-effect-protocol/**'
      - 'mycelix-workspace/crates/mycelix-ssf-actuator-invocation-activation/**'
      - 'mycelix-workspace/crates/mycelix-ssf-current-authority-revalidation/**'
      - 'mycelix-workspace/crates/mycelix-ssf-final-actuator-invocation-readiness/**'
      - 'mycelix-workspace/crates/mycelix-ssf-historical-actuator-invocation-activation/**'
      - 'mycelix-workspace/crates/mycelix-ssf-historical-actuator-invocation-journal/**'
      - 'mycelix-workspace/crates/mycelix-ssf-canonical-actuator-execution/**'
      - '.github/workflows/ssf-canonical-actuator-execution.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-workspace/crates/mycelix-ssf-canonical-actuator-execution/**'
      - '.github/workflows/ssf-canonical-actuator-execution.yml'

permissions:
  contents: read

jobs:
  canonical-actuator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Format
        run: cargo fmt --manifest-path mycelix-workspace/crates/mycelix-ssf-canonical-actuator-execution/Cargo.toml -- --check
      - name: Native check
        run: cargo check --manifest-path mycelix-workspace/crates/mycelix-ssf-canonical-actuator-execution/Cargo.toml --all-targets
      - name: no_std WASM check
        run: cargo check --manifest-path mycelix-workspace/crates/mycelix-ssf-canonical-actuator-execution/Cargo.toml --lib --target wasm32-unknown-unknown
      - name: Tests
        run: cargo test --manifest-path mycelix-workspace/crates/mycelix-ssf-canonical-actuator-execution/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --manifest-path mycelix-workspace/crates/mycelix-ssf-canonical-actuator-execution/Cargo.toml --all-targets -- -D warnings
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --manifest-path mycelix-workspace/crates/mycelix-ssf-canonical-actuator-execution/Cargo.toml --no-deps
