name: Terra Preta sparse passive ROM reference

on:
  pull_request:
    branches: [main, 'research/terra-incremental-adaptive-krylov-v0.2', 'research/terra-rom-error-certificate-v0.1', 'research/terra-collatz-rom-bound-v0.1']
    paths:
      - 'research/terra-preta/tools/sparse-passive-rom-reference/**'
      - '.github/workflows/terra-preta-sparse-passive-rom-reference.yml'
  push:
    branches: ['research/terra-sparse-passive-rom-v0.1', 'research/terra-block-arnoldi-baseline-v0.2', 'research/terra-incremental-adaptive-krylov-v0.2', 'research/terra-rom-error-certificate-v0.1', 'research/terra-collatz-rom-bound-v0.1', 'research/terra-portwise-response-bound-v0.1']
    paths:
      - 'research/terra-preta/tools/sparse-passive-rom-reference/**'
      - '.github/workflows/terra-preta-sparse-passive-rom-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sparse-passive-rom-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply pinned rustfmt normalization
        run: cargo fmt --manifest-path research/terra-preta/tools/sparse-passive-rom-reference/Cargo.toml
      - name: Export normalized Rust source
        uses: actions/upload-artifact@v4
        with:
          name: terra-sparse-passive-rom-rustfmt-source
          path: research/terra-preta/tools/sparse-passive-rom-reference/src/main.rs
          if-no-files-found: error
          retention-days: 1
      - name: Verify normalized formatting
        run: cargo fmt --manifest-path research/terra-preta/tools/sparse-passive-rom-reference/Cargo.toml -- --check
      - name: Tests
        run: cargo test --manifest-path research/terra-preta/tools/sparse-passive-rom-reference/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --manifest-path research/terra-preta/tools/sparse-passive-rom-reference/Cargo.toml --all-targets -- -D warnings
      - name: Execute manufactured sparse ROM fixture
        run: |
          cargo run --quiet --manifest-path research/terra-preta/tools/sparse-passive-rom-reference/Cargo.toml -- \
            research/terra-preta/tools/sparse-passive-rom-reference/fixtures/two-interior-node-chain.json \
            "$RUNNER_TEMP/sparse-rom-report.json"
          jq -e '
            .fixture_status == "synthetic_only_not_empirical_evidence" and
            (.interior_node_count == 2) and
            (.basis_dimension == 2) and
            (.dc_relative_error < 1e-10) and
            (.feedthrough_limit_relative_error < 1e-9) and
            (.maximum_sampled_response_error < 1e-9) and
            (.structural_passivity_certificate_valid == true) and
            (.lambda_0_passivity_tolerance > 0) and
            (.error_certificate_valid == true) and
            (.m_matrix_lambda_min_lower_bound > 0) and
            (.m_matrix_initial_lambda_min_lower_bound > 0) and
            (.m_matrix_lambda_min_lower_bound >= .m_matrix_initial_lambda_min_lower_bound) and
            (.m_matrix_collatz_refinement_steps <= 4) and
            (.m_matrix_collatz_max_true_residual_inf >= 0) and
            (.error_certificate_pcg_solve_count > 0 and .error_certificate_pcg_solve_count <= 5) and
            (.m_matrix_supersolution_min_component > 0) and
            (.m_matrix_supersolution_max_component > 0) and
            (.m_matrix_supersolution_minimum_margin >= 0) and
            (.m_matrix_supersolution_relative_residual <= 1e-10) and
            ((.m_matrix_supersolution_sha256 | length) == 64) and

            ([.frequency_samples[] | select(.error_bound_valid != true or .portwise_error_bound_valid != true or .output_adjoint_error_bound_valid != true or .absolute_response_error > .absolute_response_error_upper_bound or .relative_response_error > .relative_response_error_upper_bound or .absolute_response_error > .portwise_absolute_response_error_upper_bound or .relative_response_error > .portwise_relative_response_error_upper_bound or .absolute_response_error > .output_adjoint_absolute_response_error_upper_bound or .relative_response_error > .output_adjoint_relative_response_error_upper_bound or .absolute_response_error > .best_absolute_response_error_upper_bound or .relative_response_error > .best_relative_response_error_upper_bound or .best_absolute_response_error_upper_bound > .output_adjoint_absolute_response_error_upper_bound or .best_relative_response_error_upper_bound > .output_adjoint_relative_response_error_upper_bound)] | length == 0) and
            ([.frequency_samples[]] | length == 5) and
            (.maximum_cg_relative_residual < 1e-10)
          ' "$RUNNER_TEMP/sparse-rom-report.json"
      - name: Execute adaptive high-contrast multiport fixture
        run: |
          cargo run --quiet --manifest-path research/terra-preta/tools/sparse-passive-rom-reference/Cargo.toml -- \
            research/terra-preta/tools/sparse-passive-rom-reference/fixtures/adaptive-high-contrast-three-port.json \
            "$RUNNER_TEMP/adaptive-rom-report.json"
          jq -e '
            .fixture_status == "synthetic_only_not_empirical_evidence" and
            (.boundary_node_ids | length == 3) and
            (.interior_node_count == 8) and
            (.basis_dimension == 6) and
            (.basis_dimension < .interior_node_count) and
            (.adaptive_target_met == true) and
            (.adaptive_stop_reason == "target_met") and
            (.adaptive_selection_steps | length >= 1) and
            ([.selected_port_snapshots[] | select(.input_port_index >= 3)] | length == 0) and
            (.maximum_sampled_response_error <= 1e-2) and
            (.adaptive_maximum_candidate_relative_error <= 0.05) and
            (.dc_relative_error < 1e-8) and
            (.structural_passivity_certificate_valid == true) and
            (.error_certificate_valid == true) and
            (.m_matrix_lambda_min_lower_bound > 0) and
            (.m_matrix_initial_lambda_min_lower_bound > 0) and
            (.m_matrix_lambda_min_lower_bound >= .m_matrix_initial_lambda_min_lower_bound) and
            (.m_matrix_collatz_refinement_steps <= 4) and
            (.m_matrix_collatz_max_true_residual_inf >= 0) and
            (.error_certificate_pcg_solve_count > 0 and .error_certificate_pcg_solve_count <= 5) and
            (.m_matrix_supersolution_min_component > 0) and
            (.m_matrix_supersolution_max_component > 0) and
            (.m_matrix_supersolution_minimum_margin >= 0) and
            (.m_matrix_supersolution_relative_residual <= 1e-10) and
            ((.m_matrix_supersolution_sha256 | length) == 64) and
            ([.frequency_samples[] | select(.error_bound_valid != true or .portwise_error_bound_valid != true or .output_adjoint_error_bound_valid != true or .absolute_response_error > .absolute_response_error_upper_bound or .relative_response_error > .relative_response_error_upper_bound or .absolute_response_error > .portwise_absolute_response_error_upper_bound or .relative_response_error > .portwise_relative_response_error_upper_bound or .absolute_response_error > .output_adjoint_absolute_response_error_upper_bound or .relative_response_error > .output_adjoint_relative_response_error_upper_bound or .absolute_response_error > .best_absolute_response_error_upper_bound or .relative_response_error > .best_relative_response_error_upper_bound or .best_absolute_response_error_upper_bound > .output_adjoint_absolute_response_error_upper_bound or .best_relative_response_error_upper_bound > .output_adjoint_relative_response_error_upper_bound)] | length == 0) and
            ([.frequency_samples[]] | length == 9) and
            (.adaptive_candidate_shift_count == 9) and
            (.cg_solve_count == 63) and
            (.output_adjoint_solve_count == 3) and
            (.output_adjoint_total_cg_iterations > 0) and
            (.output_adjoint_max_residual_inf >= 0) and
            (.maximum_output_adjoint_relative_response_error_upper_bound > 0) and
            (.total_cg_iterations < 469) and
            (.total_cg_iterations >= .maximum_cg_iterations) and
            (.block_arnoldi_baseline_basis_dimension == .basis_dimension) and
            (.block_arnoldi_baseline_passivity_certificate_valid == true) and
            (.block_arnoldi_baseline_error_bound_valid == true) and
            (.block_arnoldi_baseline_portwise_error_bound_valid == true) and
            (.block_arnoldi_baseline_output_adjoint_error_bound_valid == true) and
            (.block_arnoldi_baseline_maximum_output_adjoint_relative_error_upper_bound >= .block_arnoldi_baseline_maximum_sampled_response_error) and
            (.block_arnoldi_baseline_maximum_relative_response_error_upper_bound >= .block_arnoldi_baseline_maximum_sampled_response_error) and
            (.block_arnoldi_baseline_maximum_portwise_relative_error_upper_bound >= .block_arnoldi_baseline_maximum_sampled_response_error) and
            (.block_arnoldi_baseline_maximum_best_relative_error_upper_bound >= .block_arnoldi_baseline_maximum_sampled_response_error) and
            (.block_arnoldi_baseline_maximum_best_relative_error_upper_bound <= .block_arnoldi_baseline_maximum_relative_response_error_upper_bound) and
            (.block_arnoldi_baseline_dc_relative_error < 1e-8) and
            (.block_arnoldi_baseline_feedthrough_limit_relative_error < 1e-8) and
            (.block_arnoldi_baseline_maximum_sampled_response_error > 0) and
            (.block_arnoldi_baseline_cg_solve_count > 0) and
            (.block_arnoldi_baseline_total_cg_iterations > 0)
          ' "$RUNNER_TEMP/adaptive-rom-report.json"
          jq -r '"adaptive_rank=\(.basis_dimension) candidate_error=\(.adaptive_maximum_candidate_relative_error) audit_error=\(.maximum_sampled_response_error) error_bound=\(.maximum_relative_response_error_upper_bound) bound_ratio=\(.maximum_relative_response_error_upper_bound / ([.maximum_sampled_response_error, 1e-300] | max)) cg_solves=\(.cg_solve_count) cg_iterations=\(.total_cg_iterations) | block_arnoldi_rank=\(.block_arnoldi_baseline_basis_dimension) audit_error=\(.block_arnoldi_baseline_maximum_sampled_response_error) error_bound=\(.block_arnoldi_baseline_maximum_relative_response_error_upper_bound) bound_ratio=\(.block_arnoldi_baseline_maximum_relative_response_error_upper_bound / ([.block_arnoldi_baseline_maximum_sampled_response_error, 1e-300] | max)) dc_error=\(.block_arnoldi_baseline_dc_relative_error) feedthrough_error=\(.block_arnoldi_baseline_feedthrough_limit_relative_error) cg_solves=\(.block_arnoldi_baseline_cg_solve_count) cg_iterations=\(.block_arnoldi_baseline_total_cg_iterations) | spectral_error_bound=\(.maximum_relative_response_error_upper_bound) spectral_ratio=\(.maximum_relative_response_error_upper_bound / ([.maximum_sampled_response_error, 1e-300] | max)) portwise_error_bound=\(.maximum_portwise_relative_response_error_upper_bound) portwise_ratio=\(.maximum_portwise_relative_response_error_upper_bound / ([.maximum_sampled_response_error, 1e-300] | max)) output_adjoint_error_bound=\(.maximum_output_adjoint_relative_response_error_upper_bound) output_adjoint_ratio=\(.maximum_output_adjoint_relative_response_error_upper_bound / ([.maximum_sampled_response_error, 1e-300] | max)) output_adjoint_solves=\(.output_adjoint_solve_count) output_adjoint_iterations=\(.output_adjoint_total_cg_iterations) best_error_bound=\(.maximum_best_relative_response_error_upper_bound) best_ratio=\(.maximum_best_relative_response_error_upper_bound / ([.maximum_sampled_response_error, 1e-300] | max)) | block_spectral_bound=\(.block_arnoldi_baseline_maximum_relative_response_error_upper_bound) block_portwise_bound=\(.block_arnoldi_baseline_maximum_portwise_relative_error_upper_bound) block_output_adjoint_bound=\(.block_arnoldi_baseline_maximum_output_adjoint_relative_error_upper_bound) block_best_bound=\(.block_arnoldi_baseline_maximum_best_relative_error_upper_bound) | lambda_min_initial=\(.m_matrix_initial_lambda_min_lower_bound) lambda_min_refined=\(.m_matrix_lambda_min_lower_bound) lower_bound_gain=\(.m_matrix_lambda_min_lower_bound / .m_matrix_initial_lambda_min_lower_bound) collatz_steps=\(.m_matrix_collatz_refinement_steps) collatz_residual_inf=\(.m_matrix_collatz_max_true_residual_inf) certificate_solves=\(.error_certificate_pcg_solve_count) supersolution_margin=\(.m_matrix_supersolution_minimum_margin) supersolution_residual=\(.m_matrix_supersolution_relative_residual) fallback=\(.m_matrix_collatz_fallback_reason)"' \
            "$RUNNER_TEMP/adaptive-rom-report.json"
      - name: Execute fixed two-shift equal-rank comparator
        run: |
          cargo run --quiet --manifest-path research/terra-preta/tools/sparse-passive-rom-reference/Cargo.toml -- \
            research/terra-preta/tools/sparse-passive-rom-reference/fixtures/fixed-high-contrast-three-port.json \
            "$RUNNER_TEMP/fixed-rom-report.json"
          jq -e '
            .fixture_status == "synthetic_only_not_empirical_evidence" and
            (.interior_node_count == 8) and
            (.basis_dimension == 6) and
            (.adaptive_target_met == null) and
            (.cg_solve_count == 39) and
            (.total_cg_iterations < 288) and
            (.structural_passivity_certificate_valid == true)
          ' "$RUNNER_TEMP/fixed-rom-report.json"
      - name: Compare adaptive and fixed models at equal rank
        run: |
          jq -e --slurpfile fixed "$RUNNER_TEMP/fixed-rom-report.json" '
            . as $adaptive |
            ($fixed[0].basis_dimension == $adaptive.basis_dimension) and
            ($adaptive.maximum_sampled_response_error < $fixed[0].maximum_sampled_response_error) and
            ($adaptive.dc_relative_error < 1e-8) and
            ($fixed[0].dc_relative_error < 1e-8)
          ' "$RUNNER_TEMP/adaptive-rom-report.json"
          jq -r --slurpfile fixed "$RUNNER_TEMP/fixed-rom-report.json" '
            "adaptive_rank=\(.basis_dimension) audit_error=\(.maximum_sampled_response_error) candidate_error=\(.adaptive_maximum_candidate_relative_error) cg_solves=\(.cg_solve_count) cg_iterations=\(.total_cg_iterations) | fixed_rank=\($fixed[0].basis_dimension) audit_error=\($fixed[0].maximum_sampled_response_error) cg_solves=\($fixed[0].cg_solve_count) cg_iterations=\($fixed[0].total_cg_iterations)"
          ' "$RUNNER_TEMP/adaptive-rom-report.json"
      - name: Reject output overwrite
        run: |
          before=$(sha256sum "$RUNNER_TEMP/sparse-rom-report.json" | cut -d ' ' -f 1)
          if cargo run --quiet --manifest-path research/terra-preta/tools/sparse-passive-rom-reference/Cargo.toml -- \
            research/terra-preta/tools/sparse-passive-rom-reference/fixtures/two-interior-node-chain.json \
            "$RUNNER_TEMP/sparse-rom-report.json"; then
            echo "unexpected overwrite success" >&2
            exit 1
          fi
          after=$(sha256sum "$RUNNER_TEMP/sparse-rom-report.json" | cut -d ' ' -f 1)
          test "$before" = "$after"
