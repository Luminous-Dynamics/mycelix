name: Terra Preta sparse passive ROM reference

on:
  pull_request:
    branches: [main, 'research/terra-adaptive-passive-krylov-v0.1']
    paths:
      - 'research/terra-preta/tools/sparse-passive-rom-reference/**'
      - '.github/workflows/terra-preta-sparse-passive-rom-reference.yml'
  push:
    branches: ['research/terra-sparse-passive-rom-v0.1', 'research/terra-block-arnoldi-baseline-v0.1']
    paths:
      - 'research/terra-preta/tools/sparse-passive-rom-reference/**'
      - '.github/workflows/terra-preta-sparse-passive-rom-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sparse-passive-rom-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply pinned rustfmt normalization
        run: cargo fmt --manifest-path research/terra-preta/tools/sparse-passive-rom-reference/Cargo.toml
      - name: Export normalized Rust source
        uses: actions/upload-artifact@v4
        with:
          name: terra-sparse-passive-rom-rustfmt-source
          path: research/terra-preta/tools/sparse-passive-rom-reference/src/main.rs
          if-no-files-found: error
          retention-days: 1
      - name: Verify normalized formatting
        run: cargo fmt --manifest-path research/terra-preta/tools/sparse-passive-rom-reference/Cargo.toml -- --check
      - name: Tests
        run: cargo test --manifest-path research/terra-preta/tools/sparse-passive-rom-reference/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --manifest-path research/terra-preta/tools/sparse-passive-rom-reference/Cargo.toml --all-targets -- -D warnings
      - name: Execute manufactured sparse ROM fixture
        run: |
          cargo run --quiet --manifest-path research/terra-preta/tools/sparse-passive-rom-reference/Cargo.toml -- \
            research/terra-preta/tools/sparse-passive-rom-reference/fixtures/two-interior-node-chain.json \
            "$RUNNER_TEMP/sparse-rom-report.json"
          jq -e '
            .fixture_status == "synthetic_only_not_empirical_evidence" and
            (.interior_node_count == 2) and
            (.basis_dimension == 2) and
            (.dc_relative_error < 1e-10) and
            (.feedthrough_limit_relative_error < 1e-9) and
            (.maximum_sampled_response_error < 1e-9) and
            (.structural_passivity_certificate_valid == true) and
            (.lambda_0_passivity_tolerance > 0) and
            (.maximum_cg_relative_residual < 1e-10) and
            ([.frequency_samples[] | select(.relative_response_error < 1e-9)] | length == 5)
          ' "$RUNNER_TEMP/sparse-rom-report.json"
      - name: Execute adaptive high-contrast multiport fixture
        run: |
          cargo run --quiet --manifest-path research/terra-preta/tools/sparse-passive-rom-reference/Cargo.toml -- \
            research/terra-preta/tools/sparse-passive-rom-reference/fixtures/adaptive-high-contrast-three-port.json \
            "$RUNNER_TEMP/adaptive-rom-report.json"
          jq -e '
            .fixture_status == "synthetic_only_not_empirical_evidence" and
            (.boundary_node_ids | length == 3) and
            (.interior_node_count == 8) and
            (.basis_dimension == 6) and
            (.basis_dimension < .interior_node_count) and
            (.adaptive_target_met == true) and
            (.adaptive_stop_reason == "target_met") and
            (.adaptive_selection_steps | length >= 1) and
            ([.selected_port_snapshots[] | select(.input_port_index >= 3)] | length == 0) and
            (.maximum_sampled_response_error <= 1e-2) and
            (.adaptive_maximum_candidate_relative_error <= 0.05) and
            (.dc_relative_error < 1e-8) and
            (.structural_passivity_certificate_valid == true) and
            (.adaptive_candidate_shift_count == 9) and
            (.cg_solve_count > 0) and
            (.total_cg_iterations >= .maximum_cg_iterations) and
            (.block_arnoldi_baseline_basis_dimension == .basis_dimension) and
            (.block_arnoldi_baseline_passivity_certificate_valid == true) and
            (.block_arnoldi_baseline_dc_relative_error < 1e-8) and
            (.block_arnoldi_baseline_feedthrough_limit_relative_error < 1e-8) and
            (.block_arnoldi_baseline_maximum_sampled_response_error > 0) and
            (.block_arnoldi_baseline_cg_solve_count > 0) and
            (.block_arnoldi_baseline_total_cg_iterations > 0)
          ' "$RUNNER_TEMP/adaptive-rom-report.json"
          jq -r '"adaptive_rank=\(.basis_dimension) candidate_error=\(.adaptive_maximum_candidate_relative_error) audit_error=\(.maximum_sampled_response_error) cg_solves=\(.cg_solve_count) cg_iterations=\(.total_cg_iterations) | block_arnoldi_rank=\(.block_arnoldi_baseline_basis_dimension) audit_error=\(.block_arnoldi_baseline_maximum_sampled_response_error) dc_error=\(.block_arnoldi_baseline_dc_relative_error) feedthrough_error=\(.block_arnoldi_baseline_feedthrough_limit_relative_error) cg_solves=\(.block_arnoldi_baseline_cg_solve_count) cg_iterations=\(.block_arnoldi_baseline_total_cg_iterations)"' \
            "$RUNNER_TEMP/adaptive-rom-report.json"
      - name: Execute fixed two-shift equal-rank comparator
        run: |
          cargo run --quiet --manifest-path research/terra-preta/tools/sparse-passive-rom-reference/Cargo.toml -- \
            research/terra-preta/tools/sparse-passive-rom-reference/fixtures/fixed-high-contrast-three-port.json \
            "$RUNNER_TEMP/fixed-rom-report.json"
          jq -e '
            .fixture_status == "synthetic_only_not_empirical_evidence" and
            (.interior_node_count == 8) and
            (.basis_dimension == 6) and
            (.adaptive_target_met == null) and
            (.structural_passivity_certificate_valid == true)
          ' "$RUNNER_TEMP/fixed-rom-report.json"
      - name: Compare adaptive and fixed models at equal rank
        run: |
          jq -e --slurpfile fixed "$RUNNER_TEMP/fixed-rom-report.json" '
            . as $adaptive |
            ($fixed[0].basis_dimension == $adaptive.basis_dimension) and
            ($adaptive.maximum_sampled_response_error < $fixed[0].maximum_sampled_response_error) and
            ($adaptive.dc_relative_error < 1e-8) and
            ($fixed[0].dc_relative_error < 1e-8)
          ' "$RUNNER_TEMP/adaptive-rom-report.json"
          jq -r --slurpfile fixed "$RUNNER_TEMP/fixed-rom-report.json" '
            "adaptive_rank=\(.basis_dimension) audit_error=\(.maximum_sampled_response_error) candidate_error=\(.adaptive_maximum_candidate_relative_error) cg_solves=\(.cg_solve_count) cg_iterations=\(.total_cg_iterations) | fixed_rank=\($fixed[0].basis_dimension) audit_error=\($fixed[0].maximum_sampled_response_error) cg_solves=\($fixed[0].cg_solve_count) cg_iterations=\($fixed[0].total_cg_iterations)"
          ' "$RUNNER_TEMP/adaptive-rom-report.json"
      - name: Reject output overwrite
        run: |
          before=$(sha256sum "$RUNNER_TEMP/sparse-rom-report.json" | cut -d ' ' -f 1)
          if cargo run --quiet --manifest-path research/terra-preta/tools/sparse-passive-rom-reference/Cargo.toml -- \
            research/terra-preta/tools/sparse-passive-rom-reference/fixtures/two-interior-node-chain.json \
            "$RUNNER_TEMP/sparse-rom-report.json"; then
            echo "unexpected overwrite success" >&2
            exit 1
          fi
          after=$(sha256sum "$RUNNER_TEMP/sparse-rom-report.json" | cut -d ' ' -f 1)
          test "$before" = "$after"
