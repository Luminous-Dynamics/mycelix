name: Sovereignty QUAL-001 independent verifier

on:
  push:
    branches:
      - qual-001-sov-ai-verifier-v1
    paths:
      - 'docs/qualification/SOVEREIGNTY_QUAL_001_PROFILE_V1.json'
      - 'docs/qualification/fixtures/ARTIFICIAL_SOVEREIGNTY_QUALIFICATION_CORPUS_V1.json'
      - 'tools/qualification/verify_sovereignty_v1_independent.py'
      - '.github/workflows/sovereignty-qual-001-independent.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sovereignty-qual-001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact verifier head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify verifier checkout identity
        env:
          EXPECTED_VERIFIER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_VERIFIER_SHA"

      - name: Read frozen subject commitments
        id: profile
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open("docs/qualification/SOVEREIGNTY_QUAL_001_PROFILE_V1.json", encoding="utf-8"))
          s=p["subject"]
          print("subject_sha="+s["head_sha"])
          print("subject_tree="+s["tree_sha"])
          print("subject_path="+s["fixture_path"])
          PY

      - name: Verify exact candidate fixture and semantic commitment
        run: |
          set -euo pipefail
          python3 tools/qualification/verify_sovereignty_v1_independent.py --subject "${{ steps.profile.outputs.subject_path }}" --profile "docs/qualification/SOVEREIGNTY_QUAL_001_PROFILE_V1.json" --subject-commit "${{ steps.profile.outputs.subject_sha }}" --subject-tree "${{ steps.profile.outputs.subject_tree }}" --verifier-commit "${{ github.sha }}"

      - name: Postflight immutability
        run: |
          set -euo pipefail
          test "$(git status --porcelain)" = ""
