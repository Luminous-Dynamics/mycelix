name: Identity Trust Credential Integrity

on:
  pull_request:
    paths:
      - 'mycelix-workspace/mycelix-identity/zomes/trust_credential/integrity/**'
      - '.github/workflows/identity-trust-credential-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-workspace/mycelix-identity/zomes/trust_credential/integrity/**'
      - '.github/workflows/identity-trust-credential-integrity.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Assert revocation-only update boundary
        shell: bash
        run: |
          FILE=mycelix-workspace/mycelix-identity/zomes/trust_credential/integrity/src/lib.rs

          grep -Fq 'validate_credential_revocation_transition' "$FILE"
          grep -Fq 'Trust credential updates are revocation-only' "$FILE"
          grep -Fq 'Range proof cannot be changed by credential update' "$FILE"
          grep -Fq 'Trust score range cannot be changed by credential update' "$FILE"
          grep -Fq 'Trust tier cannot be changed by credential update' "$FILE"
          grep -Fq 'Credential expiration cannot be changed by credential update' "$FILE"
          grep -Fq 'Credential supersession reference cannot be changed by credential update' "$FILE"
          grep -Fq 'Revoked trust credentials cannot be updated again' "$FILE"
          grep -Fq 'tier_escalation_during_revocation_is_rejected' "$FILE"
          grep -Fq 'proof_mutation_during_revocation_is_rejected' "$FILE"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-workspace/mycelix-identity

      - name: Check formatting
        run: |
          cargo fmt \
            --manifest-path mycelix-workspace/mycelix-identity/zomes/trust_credential/integrity/Cargo.toml \
            -- --check

      - name: Test trust credential integrity
        run: |
          cargo test \
            --manifest-path mycelix-workspace/mycelix-identity/zomes/trust_credential/integrity/Cargo.toml \
            --lib

      - name: Check trust credential integrity for wasm32
        run: |
          cargo check \
            --manifest-path mycelix-workspace/mycelix-identity/zomes/trust_credential/integrity/Cargo.toml \
            --target wasm32-unknown-unknown
