name: CIV-RES-004 Option Space Corpus

on:
  push:
    branches:
      - 'docs/civ-res-004-option-space-v1'
  pull_request:
    paths:
      - 'mycelix-workspace/docs/civic-resilience/civ_res_004_option_space_cases.json'
      - 'mycelix-workspace/docs/civic-resilience/civ_res_004_option_space_oracle.json'
      - 'mycelix-workspace/docs/civic-resilience/CIV_RES_004_OPTION_SPACE_V1.md'
      - 'scripts/qualification/civ_res_004_option_space_v1.py'
      - '.github/workflows/civ-res-004-option-space.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civ-res-004-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Synthetic option-space qualification corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Exact parent and clean subject
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='a923352445db955c8c4cbe7c52d570506e6be0b0'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test -z "$(git status --short)"
      - name: Exact corpus tranche
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='a923352445db955c8c4cbe7c52d570506e6be0b0'
          test "$(git rev-list --count "$EXPECTED_PARENT"..HEAD)" = '1'
          git diff --check "$EXPECTED_PARENT" HEAD
          mapfile -t changed < <(git diff --name-only "$EXPECTED_PARENT" HEAD | sort)
          expected=(
            '.github/workflows/civ-res-004-option-space.yml'
            'mycelix-workspace/docs/civic-resilience/CIV_RES_004_OPTION_SPACE_V1.md'
            'mycelix-workspace/docs/civic-resilience/civ_res_004_option_space_cases.json'
            'mycelix-workspace/docs/civic-resilience/civ_res_004_option_space_oracle.json'
            'scripts/qualification/civ_res_004_option_space_v1.py'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")
      - name: Execute corpus qualifier
        run: python3 scripts/qualification/civ_res_004_option_space_v1.py
      - name: Static no-runtime audit
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='a923352445db955c8c4cbe7c52d570506e6be0b0'
          changed="$(git diff --name-only "$EXPECTED_PARENT" HEAD)"
          if printf '%s\n' "$changed" | grep -E '\.(rs|toml|lock)$'; then
            echo 'CIV-RES-004 is synthetic corpus/evaluator/workflow only' >&2
            exit 1
          fi
      - name: Immutable checkout postflight
        run: test -z "$(git status --short)"
