name: Praxis Symthaea Advisory Contract

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "mycelix-praxis/crates/praxis-core/**"
      - "mycelix-praxis/crates/praxis-symthaea-adapter/**"
      - "mycelix-praxis/Cargo.toml"
      - "mycelix-praxis/schemas/symthaea-advisory-v1.schema.json"
      - "mycelix-praxis/schemas/symthaea-advisory-request-v1.schema.json"
      - "mycelix-praxis/schemas/examples/symthaea-advisory-request-v1.json"
      - "mycelix-praxis/schemas/README.md"
      - "mycelix-praxis/docs/symthaea-advisory-contract.md"
      - "mycelix-praxis/scripts/verify_symthaea_advisory_schema.py"
      - ".github/workflows/praxis-symthaea-advisory.yml"
  push:
    branches: [main]
    paths:
      - "mycelix-praxis/crates/praxis-core/**"
      - "mycelix-praxis/crates/praxis-symthaea-adapter/**"
      - "mycelix-praxis/Cargo.toml"
      - "mycelix-praxis/schemas/symthaea-advisory-v1.schema.json"
      - "mycelix-praxis/schemas/symthaea-advisory-request-v1.schema.json"
      - "mycelix-praxis/schemas/examples/symthaea-advisory-request-v1.json"
      - "mycelix-praxis/schemas/README.md"
      - "mycelix-praxis/docs/symthaea-advisory-contract.md"
      - "mycelix-praxis/scripts/verify_symthaea_advisory_schema.py"
      - ".github/workflows/praxis-symthaea-advisory.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: praxis-symthaea-advisory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Exact-head advisory contract checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QUALIFIED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          persist-credentials: false

      - name: Assert exact source head
        run: test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # master @ 2025-08-23
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Verify schema and source contracts
        run: python3 mycelix-praxis/scripts/verify_symthaea_advisory_schema.py

      - name: Check advisory crates formatting
        run: cargo fmt --manifest-path mycelix-praxis/Cargo.toml -p praxis-core -p praxis-symthaea-adapter -- --check

      - name: Test praxis-core
        run: cargo test --manifest-path mycelix-praxis/Cargo.toml -p praxis-core

      - name: Test bounded host adapter
        run: cargo test --manifest-path mycelix-praxis/Cargo.toml -p praxis-symthaea-adapter

      - name: Lint advisory crates
        run: cargo clippy --manifest-path mycelix-praxis/Cargo.toml -p praxis-core -p praxis-symthaea-adapter --all-targets -- -D warnings
