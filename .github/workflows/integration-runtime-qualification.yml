name: Integration Runtime Qualification

on:
  pull_request:
    branches:
      - main
      - architecture/integration-plane-v1
      - feat/integration-core-v1
    paths:
      - 'crates/mycelix-integration-core/**'
      - 'crates/mycelix-integration-runtime/**'
      - 'docs/rfcs/integration-plane-v1-execution-safety.md'
      - '.github/workflows/integration-runtime-qualification.yml'
  push:
    branches:
      - feat/integration-runtime-v1
    paths:
      - 'crates/mycelix-integration-core/**'
      - 'crates/mycelix-integration-runtime/**'
      - 'docs/rfcs/integration-plane-v1-execution-safety.md'
      - '.github/workflows/integration-runtime-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUNTIME_MANIFEST: crates/mycelix-integration-runtime/Cargo.toml

concurrency:
  group: integration-runtime-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Integration Runtime Qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/mycelix-integration-core
            crates/mycelix-integration-runtime

      - name: Verify constitutional and crate boundaries
        shell: bash
        run: |
          set -euo pipefail
          constitution='docs/rfcs/integration-plane-v1-execution-safety.md'
          manifest="$RUNTIME_MANIFEST"
          boundary='crates/mycelix-integration-runtime/src/runtime.rs'
          facade='crates/mycelix-integration-runtime/src/v31.rs'
          legacy='crates/mycelix-integration-runtime/src/lib.rs'

          test -f "$constitution"
          grep -Fq 'Claim MUST be distinct from external dispatch' "$constitution"
          grep -Fq 'Each attempt MUST have an exact fence identity' "$constitution"
          grep -Fq 'Every provider execution outcome MUST bind one exact logical operation' "$constitution"
          grep -Fq 'Authority denial and provider rejection-before-commit MUST remain distinct' "$constitution"
          grep -Fq 'Ambiguity MUST preserve unknown commit state' "$constitution"
          grep -Fq 'Reconciliation observations MUST be append-only and non-conclusive by default' "$constitution"
          grep -Fq 'Durable intent and queue claims MUST NOT materialize current execution capability' "$constitution"
          grep -Fq 'Storage schema evolution MUST preserve causal meaning' "$constitution"
          grep -Fq 'Execution history and admission MUST be bounded' "$constitution"

          grep -Fq 'path = "src/runtime.rs"' "$manifest"
          test -f "$boundary"
          test -f "$facade"
          test -f "$legacy"

          grep -Fq 'mod v31' "$boundary"
          grep -Fq 'ensure_atomic_causal_fences' "$boundary"
          grep -Fq 'integration_causal_outbox_update_before' "$boundary"
          grep -Fq 'integration_causal_execution_observation_before' "$boundary"
          grep -Fq 'integration_causal_reconciliation_before' "$boundary"
          grep -Fq 'require_fresh_causal_time' "$boundary"
          grep -Fq 'require_fresh_operation_binding' "$boundary"

          grep -Fq 'RUNTIME_SEMANTIC_PROFILE_V31' "$facade"
          grep -Fq 'integration_runtime_operation_binding' "$facade"
          grep -Fq 'preflight_semantic_identity' "$facade"
          grep -Fq 'isolate_poisoned_recovery_entries' "$facade"
          grep -Fq 'quarantine_reason' "$facade"

          if grep -Eq 'pub (async )?fn (execute|send_payment|refund|transfer)\b' "$boundary" "$facade" "$legacy"; then
            echo 'INT-03 must not expose provider execution before INT-04 authority composition.'
            exit 1
          fi

      - name: Enforce provider-neutral transitive dependency closure
        shell: bash
        run: |
          set -euo pipefail
          tree="$(cargo tree --manifest-path "$RUNTIME_MANIFEST" -e normal --prefix none)"
          if printf '%s\n' "$tree" | grep -Eiq '^(hdk|hdi|reqwest|tokio|stripe|aws-sdk|odoo|mercury)( |$)'; then
            echo 'Forbidden provider/network/Holochain dependency entered INT-03 normal dependency closure:'
            printf '%s\n' "$tree" | grep -Ei '^(hdk|hdi|reqwest|tokio|stripe|aws-sdk|odoo|mercury)( |$)' || true
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --manifest-path "$RUNTIME_MANIFEST" --all --check

      - name: Compile all tests without running
        run: cargo test --manifest-path "$RUNTIME_MANIFEST" --no-run

      - name: Run full runtime test corpus
        run: cargo test --manifest-path "$RUNTIME_MANIFEST"

      - name: Run semantic migration and identity qualification
        run: |
          cargo test --manifest-path "$RUNTIME_MANIFEST" --test legacy_rejection_migration
          cargo test --manifest-path "$RUNTIME_MANIFEST" --test v3_semantic_identity

      - name: Run attempt and stale-fence qualification
        run: |
          cargo test --manifest-path "$RUNTIME_MANIFEST" --test attempt_budget
          cargo test --manifest-path "$RUNTIME_MANIFEST" --test attempt_budget_liveness
          cargo test --manifest-path "$RUNTIME_MANIFEST" --test expired_attempt_fence

      - name: Run exact-operation identity qualification
        run: |
          cargo test --manifest-path "$RUNTIME_MANIFEST" --test provider_operation_binding
          cargo test --manifest-path "$RUNTIME_MANIFEST" --test provider_operation_history_binding
          cargo test --manifest-path "$RUNTIME_MANIFEST" --test cross_handle_consistency

      - name: Run causal-time and failure-isolation qualification
        run: |
          cargo test --manifest-path "$RUNTIME_MANIFEST" --test causal_time_ordering
          cargo test --manifest-path "$RUNTIME_MANIFEST" --test atomic_causal_fence
          cargo test --manifest-path "$RUNTIME_MANIFEST" --test recovery_poison_isolation
          cargo test --manifest-path "$RUNTIME_MANIFEST" --test execution_observation_budget
          cargo test --manifest-path "$RUNTIME_MANIFEST" --test post_resolution_evidence

      - name: Clippy runtime and core dependency
        run: cargo clippy --manifest-path "$RUNTIME_MANIFEST" --all-targets -- -D warnings
