name: Temporal frontier noninterference TLC

on:
  pull_request:
    paths:
      - "tools/economic/temporal-range-index/formal/TemporalFrontierNoninterference*"
      - "tools/economic/temporal-hindsight/**"
      - "docs/economic/temporal/HISTORICAL_FRONTIER_NONINTERFERENCE_V0.1.md"
      - "docs/economic/temporal/TEMPORAL_OWNER_UNIVERSE_CLOSURE_V0.1.md"
      - ".github/workflows/temporal-frontier-noninterference-tlc.yml"
  push:
    branches: [main]
    paths:
      - "tools/economic/temporal-range-index/formal/TemporalFrontierNoninterference*"
      - "tools/economic/temporal-hindsight/**"
      - "docs/economic/temporal/HISTORICAL_FRONTIER_NONINTERFERENCE_V0.1.md"
      - "docs/economic/temporal/TEMPORAL_OWNER_UNIVERSE_CLOSURE_V0.1.md"
      - ".github/workflows/temporal-frontier-noninterference-tlc.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporal-frontier-tlc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-check:
    name: Independent Go oracles and bounded TLC models
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up pinned Java toolchain
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up exact Go reference toolchain
        uses: actions/setup-go@v7
        with:
          go-version: "1.23.2"
          cache: false

      - name: Download and verify pinned TLA+ tools
        shell: bash
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/tla2tools-1.7.4.jar"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
            --output "$jar"
          printf '%s  %s\n' \
            "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88" \
            "$jar" | sha256sum --check --status
          java -version
          java -cp "$jar" tlc2.TLC -help >/dev/null
          echo "TLA+ tools v1.7.4 checksum verified"

      - name: Assert exact source head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD" "$actual"
          test "$actual" = "$EXPECTED_HEAD"

      - name: Qualify historical replay oracle
        working-directory: tools/economic/temporal-hindsight/reference/go
        shell: bash
        run: |
          set -euo pipefail
          go version
          go test ./...
          go test -race ./...
          go vet ./...
          go test -run 'TestSuffixNoninterference|TestBackdatedSuffix|TestLatestStateMutant' -count=30 ./...
          go test -run '^$' -bench 'BenchmarkReplay' -benchmem -benchtime=1x ./...

      - name: Qualify owner-universe scope closure oracle
        working-directory: tools/economic/temporal-hindsight/reference/scopeclosure
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go test -race ./...
          go vet ./...
          go test -run 'TestValidFrontierOverOmittedOwner|TestManifestCannotSelfDeclareAnIncompleteRoster|TestLaterRegistryEpochDoesNotRewriteHistoricalCertificate|TestMultipleOmissionsProduceDeterministicFailureCertificate' -count=30 ./...
          go test -run '^$' -bench BenchmarkScopeFrontierReconciliation -benchmem -benchtime=1x ./...

      - name: Check historical frontier noninterference specification
        working-directory: tools/economic/temporal-range-index/formal
        shell: bash
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/tla2tools-1.7.4.jar"
          java -XX:+UseParallelGC -Xmx2g -cp "$jar" tlc2.TLC \
            -workers 1 -seed 1 \
            -metadir "$RUNNER_TEMP/tlc-noninterference-correct" \
            -config TemporalFrontierNoninterference.cfg \
            TemporalFrontierNoninterference.tla

      - name: Require historical replay mutant to produce the expected counterexample
        working-directory: tools/economic/temporal-range-index/formal
        shell: bash
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/tla2tools-1.7.4.jar"
          log="$RUNNER_TEMP/tlc-noninterference-mutant.log"
          status=0
          java -XX:+UseParallelGC -Xmx2g -cp "$jar" tlc2.TLC \
            -workers 1 -seed 1 \
            -metadir "$RUNNER_TEMP/tlc-noninterference-mutant" \
            -config TemporalFrontierNoninterference-Mutant.cfg \
            TemporalFrontierNoninterference.tla >"$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -eq 0 ]; then
            echo "The deliberately faulty no-hindsight mutant unexpectedly passed."
            exit 1
          fi
          grep -E "Invariant (HistoricalReplayBound|ExactHistoricalCertificateBinding) is violated" "$log"
          echo "Expected no-hindsight counterexample observed."

      - name: Check temporal owner-universe closure specification
        working-directory: tools/economic/temporal-hindsight/formal
        shell: bash
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/tla2tools-1.7.4.jar"
          java -XX:+UseParallelGC -Xmx2g -cp "$jar" tlc2.TLC \
            -workers 1 -seed 1 \
            -metadir "$RUNNER_TEMP/tlc-owner-universe-correct" \
            -config TemporalOwnerUniverseClosure.cfg \
            TemporalOwnerUniverseClosure.tla

      - name: Require omitted-owner mutant to produce the expected counterexample
        working-directory: tools/economic/temporal-hindsight/formal
        shell: bash
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/tla2tools-1.7.4.jar"
          log="$RUNNER_TEMP/tlc-owner-universe-mutant.log"
          status=0
          java -XX:+UseParallelGC -Xmx2g -cp "$jar" tlc2.TLC \
            -workers 1 -seed 1 \
            -metadir "$RUNNER_TEMP/tlc-owner-universe-mutant" \
            -config TemporalOwnerUniverseClosure-Mutant.cfg \
            TemporalOwnerUniverseClosure.tla >"$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -eq 0 ]; then
            echo "The deliberately incomplete-roster mutant unexpectedly passed."
            exit 1
          fi
          grep -E "Invariant RosterUniverseEquality is violated" "$log"
          echo "Expected omitted-owner counterexample observed."
