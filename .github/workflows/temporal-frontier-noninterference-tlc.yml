name: Temporal frontier noninterference TLC

on:
  pull_request:
    paths:
      - "tools/economic/temporal-range-index/formal/TemporalFrontierNoninterference*"
      - "tools/economic/temporal-hindsight/**"
      - "docs/economic/temporal/HISTORICAL_FRONTIER_NONINTERFERENCE_V0.1.md"
      - ".github/workflows/temporal-frontier-noninterference-tlc.yml"
  push:
    branches: [main]
    paths:
      - "tools/economic/temporal-range-index/formal/TemporalFrontierNoninterference*"
      - "tools/economic/temporal-hindsight/**"
      - "docs/economic/temporal/HISTORICAL_FRONTIER_NONINTERFERENCE_V0.1.md"
      - ".github/workflows/temporal-frontier-noninterference-tlc.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporal-frontier-tlc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-check:
    name: TLC correct spec and mutant negative control
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up pinned Java toolchain
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Download and verify pinned TLA+ tools
        shell: bash
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/tla2tools-1.7.4.jar"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
            --output "$jar"
          printf '%s  %s\n' \
            "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88" \
            "$jar" | sha256sum --check --status
          echo "Verified tla2tools v1.7.4 SHA-256"
          java -version
          java -cp "$jar" tlc2.TLC -help >/dev/null

      - name: Assert exact source head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD" "$actual"
          test "$actual" = "$EXPECTED_HEAD"

      - name: Check correct noninterference specification
        working-directory: tools/economic/temporal-range-index/formal
        shell: bash
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/tla2tools-1.7.4.jar"
          java -XX:+UseParallelGC -Xmx2g -cp "$jar" tlc2.TLC \
            -workers 1 -seed 1 \
            -metadir "$RUNNER_TEMP/tlc-noninterference-correct" \
            -config TemporalFrontierNoninterference.cfg \
            TemporalFrontierNoninterference.tla

      - name: Require the deliberately faulty mutant to fail safely
        working-directory: tools/economic/temporal-range-index/formal
        shell: bash
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/tla2tools-1.7.4.jar"
          log="$RUNNER_TEMP/tlc-noninterference-mutant.log"
          status=0
          java -XX:+UseParallelGC -Xmx2g -cp "$jar" tlc2.TLC \
            -workers 1 -seed 1 \
            -metadir "$RUNNER_TEMP/tlc-noninterference-mutant" \
            -config TemporalFrontierNoninterference-Mutant.cfg \
            TemporalFrontierNoninterference.tla >"$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -eq 0 ]; then
            echo "The deliberately faulty mutant unexpectedly passed."
            exit 1
          fi
          if ! grep -E "Invariant (HistoricalReplayBound|ExactHistoricalCertificateBinding) is violated" "$log"; then
            echo "TLC failed, but not for the expected hindsight/relabel invariant."
            exit 1
          fi
          echo "Expected counterexample observed; negative control is effective."
