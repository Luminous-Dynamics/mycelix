name: Temporal frontier noninterference TLC

on:
  pull_request:
    paths:
      - "tools/economic/temporal-range-index/formal/TemporalFrontierNoninterference*"
      - "tools/economic/temporal-hindsight/**"
      - "benchmarks/economic/temporal-ads/v0.1/**"
      - "docs/economic/temporal/HISTORICAL_FRONTIER_NONINTERFERENCE_V0.1.md"
      - "docs/economic/temporal/TEMPORAL_OWNER_UNIVERSE_CLOSURE_V0.1.md"
      - ".github/workflows/temporal-frontier-noninterference-tlc.yml"
  push:
    branches: [main]
    paths:
      - "tools/economic/temporal-range-index/formal/TemporalFrontierNoninterference*"
      - "tools/economic/temporal-hindsight/**"
      - "docs/economic/temporal/HISTORICAL_FRONTIER_NONINTERFERENCE_V0.1.md"
      - "docs/economic/temporal/TEMPORAL_OWNER_UNIVERSE_CLOSURE_V0.1.md"
      - ".github/workflows/temporal-frontier-noninterference-tlc.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporal-frontier-tlc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-check:
    name: Independent Go oracles and bounded TLC models
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # Cross-PR qualification is pinned to immutable source commits. This avoids
      # treating path-filtered/skipped checks as evidence that implementation PRs passed.
      - name: Check out historical replay source revision
        uses: actions/checkout@v7
        with:
          ref: 152aa6966e1cd96750ba68aca7cb2d65ba574d15
          path: source-hindsight
          persist-credentials: false

      - name: Check out owner-universe source revision
        uses: actions/checkout@v7
        with:
          ref: 54dc4f4fbdde8984d1de891a2c2517d8e763f8ab
          path: source-scope-closure
          persist-credentials: false

      - name: Check out temporal ADS corpus source revision
        uses: actions/checkout@v7
        with:
          ref: 6d4dde1bdaaa6a118fd6787e7eb78f174c103e1a
          path: source-temporal-ads
          persist-credentials: false

      - name: Assert exact auxiliary source revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source-hindsight rev-parse HEAD)" = "152aa6966e1cd96750ba68aca7cb2d65ba574d15"
          test "$(git -C source-scope-closure rev-parse HEAD)" = "54dc4f4fbdde8984d1de891a2c2517d8e763f8ab"
          test "$(git -C source-temporal-ads rev-parse HEAD)" = "6d4dde1bdaaa6a118fd6787e7eb78f174c103e1a"

      - name: Assert all pinned source artifacts are present
        shell: bash
        run: |
          set -euo pipefail
          test -f source-hindsight/tools/economic/temporal-hindsight/reference/go/go.mod
          test -f source-hindsight/tools/economic/temporal-range-index/formal/TemporalFrontierNoninterference.tla
          test -f source-hindsight/tools/economic/temporal-range-index/formal/TemporalFrontierNoninterference.cfg
          test -f source-hindsight/tools/economic/temporal-range-index/formal/TemporalFrontierNoninterference-Mutant.cfg
          test -f source-hindsight/tools/economic/temporal-range-index/formal/TemporalFrontierNoninterference-Certificate-Mutant.cfg
          test -f source-scope-closure/tools/economic/temporal-hindsight/reference/scopeclosure/go.mod
          test -f source-scope-closure/tools/economic/temporal-hindsight/reference/scopeclosure/enumeration.go
          test -f source-scope-closure/tools/economic/temporal-hindsight/reference/scopeclosure/enumeration_test.go
          test -f source-scope-closure/tools/economic/temporal-hindsight/formal/TemporalOwnerUniverseClosure.tla
          test -f source-scope-closure/tools/economic/temporal-hindsight/formal/TemporalOwnerUniverseClosure.cfg
          test -f source-scope-closure/tools/economic/temporal-hindsight/formal/TemporalOwnerUniverseClosure-Mutant.cfg
          test -f source-scope-closure/tools/economic/temporal-hindsight/formal/TemporalEnumerationContinuity.tla
          test -f source-scope-closure/tools/economic/temporal-hindsight/formal/TemporalEnumerationContinuity.cfg
          test -f source-scope-closure/tools/economic/temporal-hindsight/formal/TemporalEnumerationContinuity-Mutant.cfg
          test -f source-temporal-ads/benchmarks/economic/temporal-ads/v0.1/go.mod

      - name: Set up pinned Java toolchain
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up exact Go reference toolchain
        uses: actions/setup-go@v7
        with:
          go-version: "1.23.2"
          cache: false

      - name: Download and verify pinned TLA+ tools
        shell: bash
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/tla2tools-1.7.4.jar"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
            --output "$jar"
          printf '%s  %s\n' \
            "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88" \
            "$jar" | sha256sum --check --status
          java -version
          test -s "$jar"
          jar tf "$jar" | grep -q "^tlc2/TLC.class$"
          echo "TLA+ tools v1.7.4 checksum verified"

      - name: Assert exact source head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD" "$actual"
          test "$actual" = "$EXPECTED_HEAD"

      - name: Qualify historical replay oracle
        working-directory: source-hindsight/tools/economic/temporal-hindsight/reference/go
        shell: bash
        run: |
          set -euo pipefail
          go version
          go test ./...
          go test -race ./...
          go vet ./...
          go test -run 'TestSuffixNoninterference|TestBackdatedSuffix|TestLatestStateMutant' -count=30 ./...
          go test -run '^$' -bench 'BenchmarkReplay' -benchmem -benchtime=1x ./...

      - name: Qualify owner-universe scope closure oracle
        working-directory: source-scope-closure/tools/economic/temporal-hindsight/reference/scopeclosure
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go test -race ./...
          go vet ./...
          go test -run 'Test(Enumeration|TruncatedEnumeration|PageIndexGap|Cursor|EarlyTerminal|MissingTerminal|CrossPageDuplicateOwner|ForeignEpochOrSnapshotOrPredicate|Manifest|UnknownOrIncompleteSourceStatus|PageDigestAndAggregateRoot|ExpectedAndObservedPageCounts|MalformedMetadataFailureReason|CandidateOrderingWithinPage|ValidFrontierOverOmittedOwner|ManifestCannotSelfDeclareAnIncompleteRoster|LaterRegistryEpochDoesNotRewriteHistoricalCertificate|MultipleOmissionsProduceDeterministicFailureCertificate|CandidateOrderingDoesNotChangeReconciliationCertificate|MultipleUnknownCandidatesHaveDeterministicFailureReason|RegistryEpochScopeAndHistorySubstitutionFailClosed)' -count=30 ./...
          go test -run '^$' -bench BenchmarkScopeFrontierReconciliation -benchmem -benchtime=1x ./...

      - name: Validate language-neutral temporal ADS corpus
        working-directory: source-temporal-ads/benchmarks/economic/temporal-ads/v0.1
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go test -race ./...
          go vet ./...

      - name: Check historical frontier noninterference specification
        working-directory: source-hindsight/tools/economic/temporal-range-index/formal
        shell: bash
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/tla2tools-1.7.4.jar"
          java -XX:+UseParallelGC -Xmx2g -cp "$jar" tlc2.TLC \
            -workers 1 -seed 1 \
            -metadir "$RUNNER_TEMP/tlc-noninterference-correct" \
            -config TemporalFrontierNoninterference.cfg \
            TemporalFrontierNoninterference.tla

      - name: Require historical replay mutant to produce the expected counterexample
        working-directory: source-hindsight/tools/economic/temporal-range-index/formal
        shell: bash
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/tla2tools-1.7.4.jar"
          log="$RUNNER_TEMP/tlc-noninterference-mutant.log"
          status=0
          java -XX:+UseParallelGC -Xmx2g -cp "$jar" tlc2.TLC \
            -workers 1 -seed 1 \
            -metadir "$RUNNER_TEMP/tlc-noninterference-mutant" \
            -config TemporalFrontierNoninterference-Mutant.cfg \
            TemporalFrontierNoninterference.tla >"$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -eq 0 ]; then
            echo "The deliberately faulty no-hindsight mutant unexpectedly passed."
            exit 1
          fi
          grep -E "Invariant (HistoricalReplayBound|ExactHistoricalCertificateBinding) is violated" "$log"
          echo "Expected no-hindsight counterexample observed."

      - name: Check temporal owner-universe closure specification
        working-directory: source-scope-closure/tools/economic/temporal-hindsight/formal
        shell: bash
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/tla2tools-1.7.4.jar"
          java -XX:+UseParallelGC -Xmx2g -cp "$jar" tlc2.TLC \
            -workers 1 -seed 1 \
            -metadir "$RUNNER_TEMP/tlc-owner-universe-correct" \
            -config TemporalOwnerUniverseClosure.cfg \
            TemporalOwnerUniverseClosure.tla

      - name: Require omitted-owner mutant to produce the expected counterexample
        working-directory: source-scope-closure/tools/economic/temporal-hindsight/formal
        shell: bash
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/tla2tools-1.7.4.jar"
          log="$RUNNER_TEMP/tlc-owner-universe-mutant.log"
          status=0
          java -XX:+UseParallelGC -Xmx2g -cp "$jar" tlc2.TLC \
            -workers 1 -seed 1 \
            -metadir "$RUNNER_TEMP/tlc-owner-universe-mutant" \
            -config TemporalOwnerUniverseClosure-Mutant.cfg \
            TemporalOwnerUniverseClosure.tla >"$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -eq 0 ]; then
            echo "The deliberately incomplete-roster mutant unexpectedly passed."
            exit 1
          fi
          grep -E "Invariant RosterUniverseEquality is violated" "$log"
          echo "Expected omitted-owner counterexample observed."

      - name: Check paginated enumeration continuity model
        working-directory: source-scope-closure/tools/economic/temporal-hindsight/formal
        shell: bash
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/tla2tools-1.7.4.jar"
          java -XX:+UseParallelGC -Xmx2g -cp "$jar" tlc2.TLC \\
            -workers 1 -seed 1 \\
            -metadir "$RUNNER_TEMP/tlc-enumeration-continuity-correct" \\
            -config TemporalEnumerationContinuity.cfg \\
            TemporalEnumerationContinuity.tla

      - name: Require truncated enumeration mutant counterexample
        working-directory: source-scope-closure/tools/economic/temporal-hindsight/formal
        shell: bash
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/tla2tools-1.7.4.jar"
          log="$RUNNER_TEMP/tlc-enumeration-continuity-mutant.log"
          status=0
          java -XX:+UseParallelGC -Xmx2g -cp "$jar" tlc2.TLC \\
            -workers 1 -seed 1 \\
            -metadir "$RUNNER_TEMP/tlc-enumeration-continuity-mutant" \\
            -config TemporalEnumerationContinuity-Mutant.cfg \\
            TemporalEnumerationContinuity.tla >"$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -eq 0 ]; then
            echo "The deliberately truncated enumeration mutant unexpectedly passed."
            exit 1
          fi
          grep -F "Invariant CompletePageSet is violated." "$log"
          echo "Expected truncated-enumeration counterexample observed."
