          mkdir -p "$RUNNER_TEMP/temporal-qualification"
          log="$RUNNER_TEMP/temporal-qualification/tlc-owner-universe-mutant.log"
          status=0
          java -XX:+UseParallelGC -Xmx2g -cp "$jar" tlc2.TLC \
            -workers 1 -seed 1 \
            -metadir "$RUNNER_TEMP/tlc-owner-universe-mutant" \
            -config TemporalOwnerUniverseClosure-Mutant.cfg \
            TemporalOwnerUniverseClosure.tla >"$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -eq 0 ]; then
            echo "The deliberately incomplete-roster mutant unexpectedly passed."
            exit 1
          fi
          grep -E "Invariant RosterUniverseEquality is violated" "$log"
          echo "Expected omitted-owner counterexample observed."

      - name: Check paginated enumeration continuity model
        id: enumeration_tlc
        working-directory: source-scope-closure/tools/economic/temporal-hindsight/formal
        shell: bash
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/tla2tools-1.7.4.jar"
          mkdir -p "$RUNNER_TEMP/temporal-qualification"
          log="$RUNNER_TEMP/temporal-qualification/tlc-enumeration-continuity-correct.log"
          java -XX:+UseParallelGC -Xmx2g -cp "$jar" tlc2.TLC \
            -workers 1 -seed 1 \
