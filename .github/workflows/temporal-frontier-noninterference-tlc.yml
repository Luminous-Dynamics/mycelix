          cat "$log"

      - name: Require truncated enumeration mutant counterexample
        id: enumeration_mutant
        working-directory: source-scope-closure/tools/economic/temporal-hindsight/formal
        shell: bash
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/tla2tools-1.7.4.jar"
          mkdir -p "$RUNNER_TEMP/temporal-qualification"
          log="$RUNNER_TEMP/temporal-qualification/tlc-enumeration-continuity-mutant.log"
          status=0
          java -XX:+UseParallelGC -Xmx2g -cp "$jar" tlc2.TLC \
            -workers 1 -seed 1 \
            -metadir "$RUNNER_TEMP/tlc-enumeration-continuity-mutant" \
            -config TemporalEnumerationContinuity-Mutant.cfg \
            TemporalEnumerationContinuity.tla >"$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -eq 0 ]; then
            echo "The deliberately truncated enumeration mutant unexpectedly passed."
            exit 1
          fi
          grep -F "Invariant CompletePageSet is violated." "$log"
          echo "Expected truncated-enumeration counterexample observed."
 -bench 'BenchmarkReplay' -benchmem -benchtime=1x ./... 2>&1 | tee -a "$RUNNER_TEMP/temporal-qualification/historical-replay-go.log"

      - name: Qualify owner-universe scope closure oracle
        working-directory: source-scope-closure/tools/economic/temporal-hindsight/reference/scopeclosure
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go test -race ./...
          go vet ./...
          go test -run 'Test(Enumeration|TruncatedEnumeration|PageIndexGap|Cursor|EarlyTerminal|MissingTerminal|CrossPageDuplicateOwner|ForeignEpochOrSnapshotOrPredicate|Manifest|UnknownOrIncompleteSourceStatus|PageDigestAndAggregateRoot|ExpectedAndObservedPageCounts|MalformedMetadataFailureReason|CandidateOrderingWithinPage|ValidFrontierOverOmittedOwner|ManifestCannotSelfDeclareAnIncompleteRoster|LaterRegistryEpochDoesNotRewriteHistoricalCertificate|MultipleOmissionsProduceDeterministicFailureCertificate|CandidateOrderingDoesNotChangeReconciliationCertificate|MultipleUnknownCandidatesHaveDeterministicFailureReason|RegistryEpochScopeAndHistorySubstitutionFailClosed)' -count=30 ./...
          go test -run '^$' -bench BenchmarkScopeFrontierReconciliation -benchmem -benchtime=1x ./...

      - name: Validate language-neutral temporal ADS corpus
        working-directory: source-temporal-ads/benchmarks/economic/temporal-ads/v0.1
        shell: bash
        run: |
          set -euo pipefail
