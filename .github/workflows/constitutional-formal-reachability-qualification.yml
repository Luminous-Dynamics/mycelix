name: Constitutional Formal Reachability Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - 'mycelix-governance/specs/ConstitutionalConsumptionV2.tla'
      - 'mycelix-governance/specs/ConstitutionalConsumptionV2.reach-*.cfg'
      - 'mycelix-governance/tools/formal/qualify_reachability.py'
      - 'mycelix-governance/tools/formal/pins.json'
      - '.github/workflows/constitutional-formal-reachability-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: constitutional-formal-reachability-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NIXPKGS_REV: a50bf0c1b07873c1a53892292017041a8f0a1288
  TLA_URL: https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
  TLA_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88

jobs:
  reachability-qualification:
    name: TLA+ exact-head constitutional reachability
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact raw head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind evidence to raw head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"
          rm -rf formal-reachability-evidence .formal-tools
          mkdir -p formal-reachability-evidence .formal-tools
          printf '%s\n' "$EXPECTED_HEAD" > formal-reachability-evidence/expected-head.txt
          printf '%s\n' "$ACTUAL_HEAD" > formal-reachability-evidence/actual-head.txt

      - name: Install Nix
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Acquire pinned TLC and qualify named reachable histories
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          nix shell \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#jdk17_headless" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#python312" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#curl" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#coreutils" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#bash" \
            --command bash -euo pipefail -c '
              curl --fail --location --retry 3 --retry-all-errors \
                --output .formal-tools/tla2tools.jar "$TLA_URL"
              printf "%s  %s\n" "$TLA_SHA256" .formal-tools/tla2tools.jar | sha256sum --check --strict
              python3 mycelix-governance/tools/formal/qualify_reachability.py \
                --tla-jar "$PWD/.formal-tools/tla2tools.jar" \
                --expected-head "$EXPECTED_HEAD" \
                --out "$PWD/formal-reachability-evidence"
            '

      - name: Upload reachability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: constitutional-formal-reachability-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: formal-reachability-evidence
          if-no-files-found: error
          retention-days: 30
