name: FSRE independent recovery reference
on:
  pull_request:
    paths:
      - "tools/fsre-recovery-reference/**"
      - "tools/fsre-recovery-qualification/fixtures/**"
      - ".github/workflows/fsre-recovery-reference.yml"
  push:
    branches:
      - main
    paths:
      - "tools/fsre-recovery-reference/**"
      - "tools/fsre-recovery-qualification/fixtures/**"
      - ".github/workflows/fsre-recovery-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path tools/fsre-recovery-reference/Cargo.toml --all -- --check
      - name: Run independent reference tests
        run: cargo test --locked --offline --manifest-path tools/fsre-recovery-reference/Cargo.toml
      - name: Compare independent decisions to frozen expected output
        shell: bash
        run: |
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          cargo run --locked --offline --manifest-path tools/fsre-recovery-reference/Cargo.toml -- tools/fsre-recovery-qualification/fixtures/scenario.psv tools/fsre-recovery-qualification/fixtures/predicate-evidence.psv > "$output"
          diff -u tools/fsre-recovery-reference/fixtures/expected-options.txt "$output"
      - name: Run Clippy
        run: cargo clippy --locked --offline --manifest-path tools/fsre-recovery-reference/Cargo.toml --all-targets -- -D warnings
