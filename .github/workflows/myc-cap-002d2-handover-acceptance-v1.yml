name: MYC-CAP-002D2 Handover Acceptance v1

on:
  pull_request:
    paths:
      - 'scripts/capital/handover_acceptance_v1.py'
      - 'scripts/capital/test_handover_acceptance_v1.py'
      - 'docs/capital/evidence/myc-cap-002d2/**'
      - '.github/workflows/myc-cap-002d2-handover-acceptance-v1.yml'

permissions:
  contents: read

jobs:
  qualify:
    name: Authorized custody handover acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Exact PR head and parent
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "02dadd9da0d7b564df767747a17daeb25c2f42a8"

      - name: Python environment
        run: |
          set -euo pipefail
          python3 --version
          python3 -m py_compile scripts/capital/handover_acceptance_v1.py
          python3 -m py_compile scripts/capital/test_handover_acceptance_v1.py

      - name: Fail-closed unit suite
        run: |
          set -euo pipefail
          python3 scripts/capital/test_handover_acceptance_v1.py -v

      - name: Deterministic example receipt
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          python3 scripts/capital/handover_acceptance_v1.py \
            docs/capital/evidence/myc-cap-002d2/example_case.json \
            --receipt-out "$tmp"
          diff -u docs/capital/evidence/myc-cap-002d2/example_receipt.json "$tmp"
          cp "$tmp" "${tmp}.second"
          python3 scripts/capital/handover_acceptance_v1.py \
            docs/capital/evidence/myc-cap-002d2/example_case.json \
            --receipt-out "$tmp"
          cmp "$tmp" "${tmp}.second"
          echo '54c64c9534490325a89638a6326c15d1890355857eb274c3cf11e28344754bd4  docs/capital/evidence/myc-cap-002d2/example_case.json' | sha256sum -c -
          echo '0e65c240598b0a4640101046501f3386f020582a142b863f967604f513d56b65  docs/capital/evidence/myc-cap-002d2/example_receipt.json' | sha256sum -c -

      - name: Strong authority nonclaims
        run: |
          set -euo pipefail
          grep -Fq '"operational_custody_accepted": true' docs/capital/evidence/myc-cap-002d2/example_receipt.json
          grep -Fq '"legal_title_transition_established": false' docs/capital/evidence/myc-cap-002d2/example_receipt.json
          grep -Fq '"constitutional_stewardship_transition_established": false' docs/capital/evidence/myc-cap-002d2/example_receipt.json
          grep -Fq 'operational custody acceptance is not legal title transfer' docs/capital/evidence/myc-cap-002d2/example_receipt.json
