name: MYC-CAP-002D2 Handover Acceptance v1

on:
  pull_request:
    paths:
      - 'scripts/capital/handover_acceptance_v1.py'
      - 'scripts/capital/test_handover_acceptance_v1.py'
      - 'docs/capital/evidence/myc-cap-002d2/**'
      - '.github/workflows/myc-cap-002d2-handover-acceptance-v1.yml'

permissions:
  contents: read

jobs:
  qualify:
    name: Authorized custody handover acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Exact subject, qualified parent, and scope
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "995d9665c6e995711315460ddfc586c4e87d9fd4"
          expected="$(mktemp)"
          actual="$(mktemp)"
          printf '%s\n' \
            '.github/workflows/myc-cap-002d2-handover-acceptance-v1.yml' \
            'docs/capital/evidence/myc-cap-002d2/PROFILE.md' \
            'docs/capital/evidence/myc-cap-002d2/example_case.json' \
            'docs/capital/evidence/myc-cap-002d2/example_receipt.json' \
            'scripts/capital/handover_acceptance_v1.py' \
            'scripts/capital/test_handover_acceptance_v1.py' | sort > "$expected"
          git diff-tree --no-commit-id --name-only -r HEAD | sort > "$actual"
          diff -u "$expected" "$actual"
          test -z "$(git status --porcelain)"

      - name: Python environment
        run: |
          set -euo pipefail
          python3 --version
          python3 -m py_compile scripts/capital/handover_acceptance_v1.py
          python3 -m py_compile scripts/capital/test_handover_acceptance_v1.py

      - name: Fail-closed unit suite
        run: |
          set -euo pipefail
          python3 scripts/capital/test_handover_acceptance_v1.py -v

      - name: Deterministic example receipt
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          python3 scripts/capital/handover_acceptance_v1.py \
            docs/capital/evidence/myc-cap-002d2/example_case.json \
            --receipt-out "$tmp"
          diff -u docs/capital/evidence/myc-cap-002d2/example_receipt.json "$tmp"
          cp "$tmp" "${tmp}.second"
          python3 scripts/capital/handover_acceptance_v1.py \
            docs/capital/evidence/myc-cap-002d2/example_case.json \
            --receipt-out "$tmp"
          cmp "$tmp" "${tmp}.second"
          echo '54c64c9534490325a89638a6326c15d1890355857eb274c3cf11e28344754bd4  docs/capital/evidence/myc-cap-002d2/example_case.json' | sha256sum -c -
          echo '0e65c240598b0a4640101046501f3386f020582a142b863f967604f513d56b65  docs/capital/evidence/myc-cap-002d2/example_receipt.json' | sha256sum -c -

      - name: Exact readiness semantic parent
        run: |
          set -euo pipefail
          grep -Fq '"readiness_profile_sha256": "50a8af7e97ffa2c603d722f2ce39c51be6790116a9739a54a32e590d7554a853"' docs/capital/evidence/myc-cap-002d2/example_case.json
          grep -Fq '"readiness_receipt_sha256": "050e9db5299cc7eabe2c862fa5202c1e712e12a1a074bab784f9e35690889367"' docs/capital/evidence/myc-cap-002d2/example_receipt.json
          grep -Fq '"readiness_profile_sha256": "50a8af7e97ffa2c603d722f2ce39c51be6790116a9739a54a32e590d7554a853"' docs/capital/evidence/myc-cap-002d2/example_receipt.json

      - name: Strong authority nonclaims
        run: |
          set -euo pipefail
          grep -Fq '"operational_custody_accepted": true' docs/capital/evidence/myc-cap-002d2/example_receipt.json
          grep -Fq '"legal_title_transition_established": false' docs/capital/evidence/myc-cap-002d2/example_receipt.json
          grep -Fq '"constitutional_stewardship_transition_established": false' docs/capital/evidence/myc-cap-002d2/example_receipt.json
          grep -Fq 'operational custody acceptance is not legal title transfer' docs/capital/evidence/myc-cap-002d2/example_receipt.json
