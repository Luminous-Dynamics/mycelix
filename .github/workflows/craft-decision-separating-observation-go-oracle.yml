name: Craft decision-separating observation Go oracle

on:
  pull_request:
    paths:
      - 'mycelix-workspace/mycelix-craft/benchmarks/cross-core-source-composition-v1/oracles/decision-separating-observation-go-v0.1/**'
      - 'mycelix-workspace/mycelix-craft/benchmarks/cross-core-source-composition-v1/CRAFT-DECISION-SEPARATING-OBSERVATION-V0.1.md'
      - '.github/workflows/craft-decision-separating-observation-go-oracle.yml'

permissions:
  contents: read

concurrency:
  group: craft-dsop-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  decision-separating-observation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Validate schema and frozen fixture JSON
        run: |
          python -m json.tool schema/decision-separating-observation-v0.1.schema.json >/dev/null
          for fixture in testdata/*.json; do
            python -m json.tool "$fixture" >/dev/null
          done
        working-directory: mycelix-workspace/mycelix-craft/benchmarks/cross-core-source-composition-v1/oracles/decision-separating-observation-go-v0.1

      - name: Require gofmt-clean source
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
        working-directory: mycelix-workspace/mycelix-craft/benchmarks/cross-core-source-composition-v1/oracles/decision-separating-observation-go-v0.1

      - name: Run frozen branch and adversarial tests
        run: go test -count=1 ./...
        working-directory: mycelix-workspace/mycelix-craft/benchmarks/cross-core-source-composition-v1/oracles/decision-separating-observation-go-v0.1

      - name: Run race detector
        run: go test -race -count=1 ./...
        working-directory: mycelix-workspace/mycelix-craft/benchmarks/cross-core-source-composition-v1/oracles/decision-separating-observation-go-v0.1

      - name: Run go vet
        run: go vet ./...
        working-directory: mycelix-workspace/mycelix-craft/benchmarks/cross-core-source-composition-v1/oracles/decision-separating-observation-go-v0.1
