name: Effect Ledger Durable SQLite Qualification

on:
  # Qualification is authoritative per pull-request head. We intentionally
  # omit the redundant push trigger because push + pull_request share the
  # same concurrency group and can cancel each other before execution.
  pull_request:
  workflow_dispatch:

concurrency:
  group: effect-ledger-durable-sqlite-qualification
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  QUALIFICATION_CHECKOUT_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
  QUALIFICATION_CHECKOUT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  qualify:
    name: Durable effect-fence qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          repository: ${{ env.QUALIFICATION_CHECKOUT_REPOSITORY }}
          ref: ${{ env.QUALIFICATION_CHECKOUT_REF }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Assert exact qualification head
        shell: bash
        run: |
          set -euo pipefail
          expected="${QUALIFICATION_CHECKOUT_REF}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected" || {
            echo "exact-head mismatch: expected=$expected actual=$actual" >&2
            exit 1
          }

      - name: Verify host crate topology and durable primitives
        shell: bash
        run: |
          set -euo pipefail
          manifest='crates/constitutional-effect-ledger-sqlite/Cargo.toml'
          source='crates/constitutional-effect-ledger-sqlite/src/lib.rs'
          boundary='crates/constitutional-effect-ledger-sqlite/src/boundary.rs'

          test -f "$manifest"
          test -f "$source"
          test -f "$boundary"
          test ! -e 'mycelix-governance/crates/constitutional-effect-ledger-sqlite/Cargo.toml'
          test ! -e 'mycelix-governance/crates/constitutional-effect-ledger-sqlite/src/lib.rs'

          grep -Fq 'constitutional-effect-ledger = { path = "../../mycelix-governance/crates/constitutional-effect-ledger" }' "$manifest"
          grep -Fq 'rusqlite = { version = "0.32", features = ["bundled"] }' "$manifest"
          grep -Fq 'SQLITE_FENCE_STORE_SCHEMA_VERSION: i64 = 5' "$source"
          grep -Fq 'constitutional-effect-ledger/sqlite-fence-store-v5' "$source"
          grep -Fq 'transaction_with_behavior(TransactionBehavior::Immediate)' "$source"
          grep -Fq 'PRIMARY KEY NOT NULL' "$source"
          grep -Fq 'UNIQUE' "$source"
          grep -Fq 'record_digest()' "$source"
          grep -Fq 'validate_schema_columns' "$source"
          grep -Fq 'validate_no_managed_triggers' "$source"
          grep -Fq 'foreign_keys' "$source"
          grep -Fq 'synchronous' "$source"
          grep -Fq 'reconciliation_token_digest' "$source"
          grep -Fq 'TerminalEvidenceV1::from_attempt' "$source"
          grep -Fq 'DurableActionFenceStore' "$boundary"
          grep -Fq 'ProviderEntryClaimV1' "$source"
          grep -Fq 'atomically_claim_provider_entry' "$source"
          grep -Fq 'ProviderEntryPermitV1' "$boundary"
          grep -Fq 'ProviderAdapterAuthorizer' "$boundary"
          grep -Fq 'PinnedProviderAdapterAuthorizer' "$boundary"
          grep -Fq 'authorize_provider_adapter' "$boundary"
          grep -Fq 'fn adapter_identity(&self)' "$boundary"
          grep -Fq 'provider_adapter_must_match_pinned_attempt_identity' "$boundary"
          grep -Fq 'ProviderActionContextV1' "$boundary"
          grep -Fq 'fn reconcile(&mut self, context: &ProviderActionContextV1)' "$boundary"
          if grep -Fq 'fn reconcile(&mut self, attempt: &AttemptRecordV1)' "$boundary"; then
            echo 'ProviderAdapter must not receive raw AttemptRecordV1.'
            exit 1
          fi
          if grep -Fq 'permit.attempt()' "$boundary"; then
            echo 'ProviderEntryPermit must not expose raw AttemptRecordV1.'
            exit 1
          fi
          grep -Fq 'constitutional-provider-idempotency-v1:' "$boundary"
          grep -Fq 'atomically_recover_provider_entry_claim' "$source"
          grep -Fq 'durably_read_provider_entry_claim' "$source"
          grep -Fq 'ProviderEntryClaimRecoveryAuthorizationV1' "$boundary"
          grep -Fq 'ProviderEntryClaimRecoveryAuthorizer' "$boundary"
          grep -Fq 'provider_idempotency_key' mycelix-governance/crates/constitutional-effect-ledger/src/attempt_record.rs
          grep -Fq 'provider_idempotency_key does not match versioned derivation' mycelix-governance/crates/constitutional-effect-ledger/src/attempt_record.rs
          grep -Fq 'persisted_provider_idempotency_key_is_versioned_and_fail_closed' mycelix-governance/crates/constitutional-effect-ledger/src/attempt_record.rs
          grep -Fq 'provider_idempotency_key_is_bound_to_action_payload_and_scope' mycelix-governance/crates/constitutional-effect-ledger/src/attempt_record.rs
          grep -Fq 'FinalProviderEntryProofV1' "$boundary"
          grep -Fq 'FinalProviderEntryVerifier' "$boundary"
          grep -Fq 'BoundaryTrustRoot' "$boundary"
          grep -Fq 'PinnedBoundaryTrustRoot' "$boundary"
          grep -Fq 'pub fn dispatch<P: ProviderAdapter>(' "$boundary"
          grep -Fq 'pub fn reconcile<P: ProviderAdapter>(' "$boundary"
          if grep -Fq 'verifier: &V' "$boundary"; then
            echo 'Per-call terminal verifier injection is not qualified.'
            exit 1
          fi
          if grep -Fq 'entry_verifier: &G' "$boundary"; then
            echo 'Per-call final-entry verifier injection is not qualified.'
            exit 1
          fi
          if grep -Fq 'pub fn store_mut' "$boundary"; then
            echo 'Mutable durable-store escape hatch is not qualified.'
            exit 1
          fi
          grep -Fq 'final_entry_verifier_identity' "$boundary"
          grep -Fq 'outcome_verifier_identity' "$boundary"
          grep -Fq 'terminal verifier identity does not match pinned trust root' "$boundary"
          grep -Fq 'FinalEntryRejectedNotEntered' "$boundary"
          grep -Fq 'atomically_release_provider_entry_claim_not_entered' "$source"
          grep -Fq 'atomically_record_provider_entry_proof' "$source"
          grep -Fq 'entry_admission_proof_digest' "$source"
          grep -Fq 'provider entry claim/proof does not exactly bind the durable attempt' "$boundary"
          grep -Fq 'expired_final_entry_proof_cannot_reach_provider' "$boundary"
          grep -Fq 'final_entry_proof_is_rechecked_after_verifier_returns' "$boundary"
          grep -Fq 'provider_entry_permit_requires_durable_entry_proof' "$boundary"
          grep -Fq 'AuthorizationAdmissionProofV1' "$boundary"
          grep -Fq 'AdmissionAuthorizer' "$boundary"
          grep -Fq 'admission_verifier_identity' "$boundary"
          grep -Fq 'rejected_admission_cannot_consume_or_fence' "$boundary"
          grep -Fq 'admission_proof_identity_must_match_pinned_trust_root' "$boundary"
          grep -Fq 'duplicate_admission_remains_idempotent_with_new_proof_timestamp' "$boundary"
          grep -Fq 'authorization_admission_proof_digest' "$boundary"
          grep -Fq 'authorization_admission_proof_digest' "$source"
          grep -Fq 'SQLITE_FENCE_STORE_SCHEMA_VERSION: i64 = 6' "$source"
          grep -Fq 'entry_admission_proof_survives_restart' "$source"
          grep -Fq 'persisted_entry_proof_without_claim_fails_closed_on_restart' "$source"
          grep -Fq 'DISPATCH_PENDING attempt with entry proof is missing its provider entry claim' "$source"
          grep -Fq 'VerifiedTerminalOutcomeV1::new' "$boundary"
          grep -Fq 'terminal verification proof is not bound to the exact attempt' "$boundary"
          grep -Fq 'VerificationPurpose::InitialInvocation' "$boundary"
          grep -Fq 'VerificationPurpose::Reconciliation' "$boundary"
          grep -Fq 'ProviderEntryPermitV1' "$boundary"
          grep -Fq 'provider_idempotency_key' "$boundary"
          grep -Fq 'terminal-evidence-v3:' mycelix-governance/crates/constitutional-effect-ledger/src/attempt_record.rs
          grep -Fq 'mismatched_provider_idempotency_proof_holds_the_fence' "$boundary"
          grep -Fq 'provider_idempotency_key: &str' "$boundary"

          if grep -R -Fq 'InvocationClaimed' mycelix-governance/crates/constitutional-effect-ledger crates/constitutional-effect-ledger-sqlite; then
            echo 'Found a state variant outside the exact v2 model.'
            exit 1
          fi

      - name: Check formatting
        run: |
          cargo fmt --manifest-path mycelix-governance/Cargo.toml --all --check
          cargo fmt --manifest-path crates/constitutional-effect-ledger-sqlite/Cargo.toml --all --check

      - name: Compile exact effect-ledger surfaces
        run: |
          cargo check --manifest-path mycelix-governance/Cargo.toml -p constitutional-effect-ledger
          cargo check --manifest-path crates/constitutional-effect-ledger-sqlite/Cargo.toml

      - name: Run reference-model and durable-store tests
        run: |
          cargo test --manifest-path mycelix-governance/Cargo.toml -p constitutional-effect-ledger --all-targets
          cargo test --manifest-path crates/constitutional-effect-ledger-sqlite/Cargo.toml --all-targets

      - name: Run clippy with warnings denied
        run: |
          cargo clippy --manifest-path mycelix-governance/Cargo.toml -p constitutional-effect-ledger --all-targets -- -D warnings
          cargo clippy --manifest-path crates/constitutional-effect-ledger-sqlite/Cargo.toml --all-targets -- -D warnings
