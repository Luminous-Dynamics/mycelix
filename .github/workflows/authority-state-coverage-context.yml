name: Authority State Coverage Context

on:
  pull_request:
    paths:
      - 'crates/mycelix-authority-state-coverage-context/**'
      - 'crates/mycelix-authority-state-coverage/**'
      - 'crates/mycelix-authority-state-source/**'
      - 'crates/mycelix-authority-freshness/**'
      - 'crates/mycelix-institutional-core/**'
      - '.github/workflows/authority-state-coverage-context.yml'
  push:
    branches:
      - 'security/authority-state-coverage-context-v0.1'

permissions:
  contents: read

concurrency:
  group: authority-state-coverage-context-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: Policy-bound challenge and witness trust context
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path crates/mycelix-authority-state-coverage-context/Cargo.toml -- --check
      - name: Tests
        run: cargo test --manifest-path crates/mycelix-authority-state-coverage-context/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-authority-state-coverage-context/Cargo.toml --all-targets -- -D warnings
      - name: Context authority separation audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('crates/mycelix-authority-state-coverage-context/src/lib.rs').read_text()
          invariants = Path('crates/mycelix-authority-state-coverage-context/INVARIANTS.md').read_text()

          required = [
              'CoverageTrustContextPolicy',
              'VerifiedCoverageTrustContextPolicy',
              'CoverageChallenge',
              'VerifiedCoverageChallenge',
              'WitnessTrustBinding',
              'VerifiedWitnessTrustBinding',
              'QualifiedContextBoundCoverage',
              'qualify_context_bound_coverage',
              'verified_nonce_digest != challenge.nonce_digest',
              'verified_randomness_proof_ref != challenge.randomness_proof_ref',
              'verified_challenge_issuer_ref != challenge.challenge_issuer_ref',
              'witness_observation_digest',
              'verified_trust_verifier_ref',
              'qualify_authority_state_coverage',
          ]
          for token in required:
              assert token in src, token

          assert 'context_policy_digest' in src
          assert 'coverage_policy_digest' in src
          assert 'TrustBindingSetMismatch' in src
          assert 'TrustBindingObservationMismatch' in src
          assert 'DirectSource forbids witness trust policy' in src

          assert 'Randomness verification is exact' in invariants
          assert 'Witness and trust-binding sets are exact' in invariants
          assert 'No DHT or local-observation shortcut' in invariants
          assert 'No advisory authority' in invariants

          lowered = src.lower()
          for forbidden in ['phi', 'consciousness', 'reputation', 'model_score', 'guardian']:
              assert forbidden not in lowered, forbidden
          print('PASS: coverage challenge, policy context, and witness trust classification are exact and fail closed')
          PY
