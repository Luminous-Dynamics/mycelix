name: Temporary Pulse 219 Validator Repair

on:
  push:
    branches:
      - tmp/pulse-219-final-repair
    paths:
      - .github/workflows/tmp-pulse-219-validator-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Bind exact staging head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "tmp/pulse-219-final-repair"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Apply exact fail-closed update policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("mycelix-workspace/mycelix-pulse/holochain/zomes/mail-bridge/integrity/src/lib.rs")
          text = path.read_text()
          old = (
              "                _ => Ok(ValidateCallbackResult::Valid),\n"
              "            },\n"
              "            // Neither entry type has a real update_entry call anywhere in the coordinator\n"
              "            // (confirmed via direct grep) -- reject outright rather than leave the previous\n"
              "            // unbound dead-code path (P0 wide-open RegisterUpdate gap, confirmed 50+ times\n"
              "            // elsewhere in this pass).\n"
              "            OpEntry::UpdateEntry { .. } => Ok(ValidateCallbackResult::Invalid(\n"
              "                \"Mail bridge entries cannot be updated\".to_string(),\n"
              "            )),\n"
          )
          new = (
              "                EntryTypes::MailBridgeQuery(_) | EntryTypes::MailBridgeEvent(_) => {\n"
              "                    Ok(ValidateCallbackResult::Invalid(\n"
              "                        \"mail bridge entries cannot be updated\".to_string(),\n"
              "                    ))\n"
              "                }\n"
              "            },\n"
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"mail-bridge repair precondition failed: expected 1 match, found {count}")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Prove surgical validator diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "mycelix-workspace/mycelix-pulse/holochain/zomes/mail-bridge/integrity/src/lib.rs"
          grep -F 'EntryTypes::MailBridgeQuery(_) | EntryTypes::MailBridgeEvent(_) =>' mycelix-workspace/mycelix-pulse/holochain/zomes/mail-bridge/integrity/src/lib.rs
          ! grep -F 'OpEntry::UpdateEntry { .. } => Ok(ValidateCallbackResult::Invalid(' mycelix-workspace/mycelix-pulse/holochain/zomes/mail-bridge/integrity/src/lib.rs
          git diff -- mycelix-workspace/mycelix-pulse/holochain/zomes/mail-bridge/integrity/src/lib.rs

      - name: Commit and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-pulse-219-validator-repair.yml
          git add mycelix-workspace/mycelix-pulse/holochain/zomes/mail-bridge/integrity/src/lib.rs
          git diff --cached --check
          git config user.name "Luminous Dynamics Qualification Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(pulse): make mail bridge updates fail closed"
          git push origin HEAD:tmp/pulse-219-final-repair
