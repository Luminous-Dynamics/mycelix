name: Integration HTTP Request Plan Qualification

on:
  pull_request:
    branches:
      - feat/integration-http-transport-policy-v1
      - main
    paths:
      - 'crates/mycelix-integration-http-request-plan/**'
      - '.github/workflows/integration-http-request-plan-qualification.yml'
  push:
    branches:
      - feat/integration-http-request-plan-v1
    paths:
      - 'crates/mycelix-integration-http-request-plan/**'
      - '.github/workflows/integration-http-request-plan-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MANIFEST: crates/mycelix-integration-http-request-plan/Cargo.toml
  SOURCE: crates/mycelix-integration-http-request-plan/src/lib.rs

concurrency:
  group: integration-http-request-plan-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Canonical path-query-body request plan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/mycelix-integration-http-request-plan

      - name: Check formatting
        run: cargo fmt --manifest-path "$MANIFEST" --all --check

      - name: Compile tests without running
        run: cargo test --manifest-path "$MANIFEST" --no-run

      - name: Run tests
        run: cargo test --manifest-path "$MANIFEST"

      - name: Clippy
        run: cargo clippy --manifest-path "$MANIFEST" --all-targets -- -D warnings

      - name: Enforce canonical binary shape
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'MYCELIX-HTTP-PLAN\0V1\0' "$SOURCE"
          grep -Fq 'strictly_sorted_pairs' "$SOURCE"
          grep -Fq 'TrailingBytes' "$SOURCE"
          grep -Fq 'InvalidPathSegment' "$SOURCE"
          grep -Fq 'percent_encoded_len' "$SOURCE"
          grep -Fq 'matches!(segment, "." | "..")' "$SOURCE"

      - name: Enforce exact materialization and transport-policy binding
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'materialized.provider_profile_commitment() != transport.provider_profile_commitment()' "$SOURCE"
          grep -Fq 'transport.valid_until_ms() <= now_ms' "$SOURCE"
          grep -Fq 'policy.max_materialized_plan_bytes' "$SOURCE"
          grep -Fq 'policy.max_body_bytes' "$SOURCE"
          grep -Fq 'policy.max_query_bytes' "$SOURCE"
          grep -Fq 'transport.binding_digest()' "$SOURCE"
          grep -Fq 'materialized.materialization_digest()' "$SOURCE"

      - name: Enforce plan cannot carry network or credential authority
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'host_authority_present_in_plan_here(&self) -> bool' "$SOURCE"
          grep -Fq 'header_authority_present_in_plan_here(&self) -> bool' "$SOURCE"
          grep -Fq 'credential_material_present_in_plan_here(&self) -> bool' "$SOURCE"
          grep -Fq 'raw_body_extractable_here(&self) -> bool' "$SOURCE"
          if grep -Eq 'pub (scheme|host|port|method|headers|authorization|credential|proxy|redirect)[[:space:]]*:' "$SOURCE"; then
            echo 'Request-plan wire shape gained network/header/credential authority.'
            exit 1
          fi
          if grep -Eq 'pub fn (body|bytes|raw_body)\(' "$SOURCE"; then
            echo 'Qualified request plan must not expose raw body bytes.'
            exit 1
          fi

      - name: Enforce request-plan layer remains pure
        shell: bash
        run: |
          set -euo pipefail
          tree="$(cargo tree --manifest-path "$MANIFEST" -e normal --prefix none)"
          if printf '%s\n' "$tree" | grep -Eiq '^(reqwest|hyper|tonic|curl|ureq|tokio|async-std|rustls|native-tls|openssl)( |$)'; then
            echo 'Network/TLS dependency entered request-plan qualification.'
            exit 1
          fi
          if grep -Eq 'TcpStream|UdpSocket|reqwest::|hyper::|std::env|keyring::|vault::' "$SOURCE"; then
            echo 'Request-plan qualifier crossed into network/environment/secret access.'
            exit 1
          fi
