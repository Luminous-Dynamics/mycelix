name: Botanical Provenance Contract

on:
  pull_request:
    paths:
      - "crates/mycelix-botanical-provenance/**"
      - ".github/workflows/botanical-provenance.yml"
  push:
    branches: [main]
    paths:
      - "crates/mycelix-botanical-provenance/**"
      - ".github/workflows/botanical-provenance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: botanical-provenance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path crates/mycelix-botanical-provenance/Cargo.toml -- --check
      - name: Test
        run: cargo test --manifest-path crates/mycelix-botanical-provenance/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-botanical-provenance/Cargo.toml --all-targets -- -D warnings
