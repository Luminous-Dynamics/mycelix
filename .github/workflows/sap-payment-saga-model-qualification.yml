name: SAP Payment Saga Model Qualification

on:
  pull_request:
    paths:
      - 'tools/finance/sap-payment-saga-model/**'
      - 'tools/finance/sap-payment-saga-go-verifier/**'
      - '.github/workflows/sap-payment-saga-model-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'tools/finance/sap-payment-saga-model/**'
      - 'tools/finance/sap-payment-saga-go-verifier/**'
      - '.github/workflows/sap-payment-saga-model-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  saga-model:
    name: Effects-disabled SAP payment saga model
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mycelix
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mycelix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mycelix -d mycelix_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'Expected source SHA: %s\n' "$EXPECTED_SHA"
          printf 'Checked out source SHA: %s\n' "$actual"
          test "$actual" = "$EXPECTED_SHA"
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.0
          rustc --version
          cargo --version
      - name: Check formatting
        run: cargo fmt --manifest-path tools/finance/sap-payment-saga-model/Cargo.toml -- --check
      - name: Run model tests
        run: cargo test --manifest-path tools/finance/sap-payment-saga-model/Cargo.toml
      - name: Run Clippy
        run: cargo clippy --manifest-path tools/finance/sap-payment-saga-model/Cargo.toml --all-targets -- -D warnings
      - name: Set up independent Go reference verifier
        if: hashFiles('tools/finance/sap-payment-saga-go-verifier/go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: false
      - name: Verify checkpoint KAT with independent SHA-256 CLI
        run: bash tools/finance/sap-payment-saga-go-verifier/verify-checkpoint-kat.sh
      - name: Check Go formatting
        if: hashFiles('tools/finance/sap-payment-saga-go-verifier/go.mod') != ''
        working-directory: tools/finance/sap-payment-saga-go-verifier
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Files requiring gofmt:\n%s\n' "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi
      - name: Run Go static analysis
        if: hashFiles('tools/finance/sap-payment-saga-go-verifier/go.mod') != ''
        working-directory: tools/finance/sap-payment-saga-go-verifier
        run: go vet ./...
      - name: Run independent Go reference tests
        if: hashFiles('tools/finance/sap-payment-saga-go-verifier/go.mod') != ''
        working-directory: tools/finance/sap-payment-saga-go-verifier
        run: go test -race -count=1 ./...
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Qualify provider webhook inbox/outbox against PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: mycelix
          PGPASSWORD: test
          PGDATABASE: mycelix_test
        run: bash tools/finance/sap-payment-saga-model/tests/test_provider_webhook_inbox_outbox.sh

      - name: Measure effect-level compensation admission scaling
        working-directory: tools/finance/sap-payment-saga-go-verifier
        run: |
          set -euo pipefail
          go test -run 'a^' -bench '^BenchmarkCompensationReserve(V2|ParallelV2)$' -benchmem -benchtime=200ms -count=10 | tee /tmp/compensation-benchmark.txt

      - name: Measure Rust provider retry profile
        run: |
          set -euo pipefail
          cargo bench --manifest-path tools/finance/sap-payment-saga-model/Cargo.toml --bench provider_benchmark | tee /tmp/provider-rust-benchmark.txt
      - name: Measure Go provider retry profile
        working-directory: tools/finance/sap-payment-saga-go-verifier
        run: |
          set -euo pipefail
          go test -run 'a^' -bench '^(BenchmarkProviderKeyValidateV1|BenchmarkProviderRetryPermitQualifyV1|BenchmarkProviderRetryPermitRevalidateV1|BenchmarkProviderRetryPermitQualifyParallelV1)        run: |
          rustc --version
          cargo --version
          go version
          uname -srm
          awk -F: '/model name/ { gsub(/^[[:space:]]+/, "", $2); print "CPU: " $2; exit }' /proc/cpuinfo
      - name: Measure Rust synthetic journal replay scaling
        run: |
          set -euo pipefail
          cargo bench --manifest-path tools/finance/sap-payment-saga-model/Cargo.toml --bench replay_benchmark | tee /tmp/replay-rust-benchmark.txt
      - name: Measure Go synthetic journal replay scaling
        working-directory: tools/finance/sap-payment-saga-go-verifier
        run: |
          set -euo pipefail
          go test -run 'a^' -bench '^BenchmarkReplayJournal' -benchmem -benchtime=200ms -count=30 | tee /tmp/replay-go-benchmark.txt
      - name: Summarize paired raw benchmark samples
        run: |
          set -euo pipefail
          cat /tmp/replay-rust-benchmark.txt /tmp/replay-go-benchmark.txt > /tmp/replay-benchmark.txt
          awk -f tools/finance/sap-payment-saga-go-verifier/summarize-replay-benchmark.awk /tmp/replay-benchmark.txt
 -benchmem -benchtime=200ms -count=30 | tee /tmp/provider-go-benchmark.txt

      - name: Capture paired benchmark environment
        run: |
          rustc --version
          cargo --version
          go version
          uname -srm
          awk -F: '/model name/ { gsub(/^[[:space:]]+/, "", $2); print "CPU: " $2; exit }' /proc/cpuinfo
      - name: Measure Rust synthetic journal replay scaling
        run: |
          set -euo pipefail
          cargo bench --manifest-path tools/finance/sap-payment-saga-model/Cargo.toml --bench replay_benchmark | tee /tmp/replay-rust-benchmark.txt
      - name: Measure Go synthetic journal replay scaling
        working-directory: tools/finance/sap-payment-saga-go-verifier
        run: |
          set -euo pipefail
          go test -run 'a^' -bench '^BenchmarkReplayJournal' -benchmem -benchtime=200ms -count=30 | tee /tmp/replay-go-benchmark.txt
      - name: Summarize paired raw benchmark samples
        run: |
          set -euo pipefail
          cat /tmp/replay-rust-benchmark.txt /tmp/replay-go-benchmark.txt > /tmp/replay-benchmark.txt
          awk -f tools/finance/sap-payment-saga-go-verifier/summarize-replay-benchmark.awk /tmp/replay-benchmark.txt
