name: SAP Payment Saga Model Qualification

on:
  pull_request:
    paths:
      - 'tools/finance/sap-payment-saga-model/**'
      - 'tools/finance/sap-payment-saga-go-verifier/**'
      - '.github/workflows/sap-payment-saga-model-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'tools/finance/sap-payment-saga-model/**'
      - 'tools/finance/sap-payment-saga-go-verifier/**'
      - '.github/workflows/sap-payment-saga-model-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  saga-model:
    name: Effects-disabled SAP payment saga model
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.0
          rustc --version
          cargo --version
      - name: Check formatting
        run: cargo fmt --manifest-path tools/finance/sap-payment-saga-model/Cargo.toml -- --check
      - name: Run model tests
        run: cargo test --manifest-path tools/finance/sap-payment-saga-model/Cargo.toml
      - name: Run Clippy
        run: cargo clippy --manifest-path tools/finance/sap-payment-saga-model/Cargo.toml --all-targets -- -D warnings
      - name: Set up independent Go reference verifier
        if: hashFiles('tools/finance/sap-payment-saga-go-verifier/go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: false
      - name: Check Go formatting
        if: hashFiles('tools/finance/sap-payment-saga-go-verifier/go.mod') != ''
        working-directory: tools/finance/sap-payment-saga-go-verifier
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Files requiring gofmt:\n%s\n' "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi
      - name: Run Go static analysis
        if: hashFiles('tools/finance/sap-payment-saga-go-verifier/go.mod') != ''
        working-directory: tools/finance/sap-payment-saga-go-verifier
        run: go vet ./...
      - name: Run independent Go reference tests
        if: hashFiles('tools/finance/sap-payment-saga-go-verifier/go.mod') != ''
        working-directory: tools/finance/sap-payment-saga-go-verifier
        run: go test -race -count=1 ./...
      - name: Capture paired benchmark environment
        run: |
          rustc --version
          cargo --version
          go version
          uname -srm
          awk -F: '/model name/ { gsub(/^[[:space:]]+/, "", $2); print "CPU: " $2; exit }' /proc/cpuinfo
      - name: Measure Rust synthetic journal replay scaling
        run: |
          set -euo pipefail
          cargo bench --manifest-path tools/finance/sap-payment-saga-model/Cargo.toml --bench replay_benchmark | tee /tmp/replay-rust-benchmark.txt
      - name: Measure Go synthetic journal replay scaling
        working-directory: tools/finance/sap-payment-saga-go-verifier
        run: |
          set -euo pipefail
          go test -run 'a^' -bench '^BenchmarkReplayJournal' -benchmem -benchtime=200ms -count=30 | tee /tmp/replay-go-benchmark.txt
      - name: Summarize paired raw benchmark samples
        run: |
          set -euo pipefail
          cat /tmp/replay-rust-benchmark.txt /tmp/replay-go-benchmark.txt > /tmp/replay-benchmark.txt
          awk -f tools/finance/sap-payment-saga-go-verifier/summarize-replay-benchmark.awk /tmp/replay-benchmark.txt

      - name: Measure Rust Treasury outbox queue scaling
        run: |
          set -euo pipefail
          cargo bench --manifest-path tools/finance/sap-payment-saga-model/Cargo.toml --bench outbox_benchmark | tee /tmp/outbox-rust-benchmark.txt
      - name: Measure Go Treasury outbox queue scaling
        working-directory: tools/finance/sap-payment-saga-go-verifier
        run: |
          set -euo pipefail
          go test -run 'a^' -bench '^BenchmarkOutbox(ClaimDue|Metrics)$' -benchmem -benchtime=200ms -count=30 | tee /tmp/outbox-go-benchmark.txt
      - name: Summarize paired outbox benchmark samples
        run: |
          set -euo pipefail
          awk -f tools/finance/sap-payment-saga-go-verifier/summarize-outbox-benchmark.awk /tmp/outbox-go-benchmark.txt
