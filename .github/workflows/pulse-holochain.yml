name: Pulse Holochain Qualification

on:
  push:
    branches: [main]
    paths:
      - 'mycelix-workspace/mycelix-pulse/**'
      - 'mycelix-workspace/Cargo.toml'
      - 'mycelix-workspace/Cargo.lock'
      - 'mycelix-workspace/flake.nix'
      - 'mycelix-workspace/flake.lock'
      - 'mycelix-workspace/holochain-cohort.toml'
      - 'nix/modules/holochain-base.nix'
      - '.github/scripts/check_holochain_cohort.py'
      - '.github/workflows/pulse-holochain.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mycelix-workspace/mycelix-pulse/**'
      - 'mycelix-workspace/Cargo.toml'
      - 'mycelix-workspace/Cargo.lock'
      - 'mycelix-workspace/flake.nix'
      - 'mycelix-workspace/flake.lock'
      - 'mycelix-workspace/holochain-cohort.toml'
      - 'nix/modules/holochain-base.nix'
      - '.github/scripts/check_holochain_cohort.py'
      - '.github/workflows/pulse-holochain.yml'

concurrency:
  group: pulse-holochain-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-D warnings'

jobs:
  pulse-zomes:
    name: Pulse zomes (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Bind exact qualification head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          echo "Expected qualification head: $EXPECTED_HEAD_SHA"
          echo "Checked-out qualification head: $actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action code
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 / 2.9.2
        with:
          workspaces: mycelix-workspace/mycelix-pulse/holochain
      - name: Bind committed Pulse zome lock
        working-directory: mycelix-workspace/mycelix-pulse/holochain
        run: |
          test -s Cargo.lock
          sha256sum Cargo.lock > "$RUNNER_TEMP/pulse-zome-lock.sha256"
      - name: Check formatting
        working-directory: mycelix-workspace/mycelix-pulse/holochain
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: mycelix-workspace/mycelix-pulse/holochain
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Unit tests
        working-directory: mycelix-workspace/mycelix-pulse/holochain
        run: cargo test --locked --workspace --lib
      - name: WASM checks
        working-directory: mycelix-workspace/mycelix-pulse/holochain
        run: cargo check --locked --workspace --target wasm32-unknown-unknown
      - name: Verify Pulse zome lock unchanged
        working-directory: mycelix-workspace/mycelix-pulse/holochain
        run: sha256sum --check "$RUNNER_TEMP/pulse-zome-lock.sha256"

  pulse-backend:
    name: Pulse backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      JWT_SECRET: ci-test-secret-must-be-at-least-32-characters-long
      HOLOCHAIN_STUB_MODE: 'true'
      CREDENTIAL_ENCRYPTION_SECRET: ci-credential-encryption-secret-at-least-32-characters-long
      MYCELIX_DATA_DIR: ${{ runner.temp }}/pulse-backend-data
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Bind exact qualification head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          echo "Expected qualification head: $EXPECTED_HEAD_SHA"
          echo "Checked-out qualification head: $actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action code
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 / 2.9.2
        with:
          workspaces: mycelix-workspace/mycelix-pulse/happ/backend-rs
      - name: Bind committed Pulse backend lock
        working-directory: mycelix-workspace/mycelix-pulse/happ/backend-rs
        run: |
          test -s Cargo.lock
          sha256sum Cargo.lock > "$RUNNER_TEMP/pulse-backend-lock.sha256"
      - name: Backend tests
        working-directory: mycelix-workspace/mycelix-pulse/happ/backend-rs
        run: cargo test --locked
      - name: Verify Pulse backend lock unchanged
        working-directory: mycelix-workspace/mycelix-pulse/happ/backend-rs
        run: sha256sum --check "$RUNNER_TEMP/pulse-backend-lock.sha256"

  pulse-cohort:
    name: Holochain compatibility contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind exact qualification head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          echo "Expected qualification head: $EXPECTED_HEAD_SHA"
          echo "Checked-out qualification head: $actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - name: Verify Rust, Nix, Pulse, quarantine, and lock bindings
        run: python3 .github/scripts/check_holochain_cohort.py

  pulse-ci-pass:
    name: Pulse qualification gate
    if: always()
    needs: [pulse-zomes, pulse-backend, pulse-cohort]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Pulse qualification job
        run: |
          for result in \
            '${{ needs.pulse-zomes.result }}' \
            '${{ needs.pulse-backend.result }}' \
            '${{ needs.pulse-cohort.result }}'; do
            if [ "$result" != 'success' ]; then
              echo "Pulse qualification result: $result"
              exit 1
            fi
          done
          echo 'Pulse Holochain qualification passed.'
