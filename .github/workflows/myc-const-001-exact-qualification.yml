name: MYC-CONST-001 Exact Qualification

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/myc-const-001-exact-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: myc-const-001-exact-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: '1.96.0'
  CARGO_INCREMENTAL: '0'
  EXPECTED_QUAL_PARENT: '62d9fc51e506c2fbc0b8e08be348c02c31b5edeb'
  EXPECTED_PRODUCT_SHA: '26b0ac1c6dbd1ba28f75371e40a623876d107536'
  EXPECTED_PRODUCT_PARENT: '180dd19af7cb6377d41be7570a42787a35f3416f'
  WORKFLOW: '.github/workflows/myc-const-001-exact-qualification.yml'
  WORKSPACE_MANIFEST: 'mycelix-governance/Cargo.toml'
  CRATE_MANIFEST: 'mycelix-governance/crates/constitutional-authority/Cargo.toml'
  SOURCE: 'mycelix-governance/crates/constitutional-authority/src/lib.rs'
  SEPARATION_TEST: 'mycelix-governance/crates/constitutional-authority/tests/separation.rs'
  PROFILE: 'mycelix-governance/docs/CONSTITUTIONAL_AUTHORITY_V0_1.md'
  LOCKFILE: 'mycelix-governance/Cargo.lock'
  EXPECTED_WORKSPACE_MANIFEST_BLOB: '85d09991a5467612a25bffa76dfe342caa1f605c'
  EXPECTED_CRATE_MANIFEST_BLOB: 'cdc855da0ddddf57eae595bc14c1ec1907437e4f'
  EXPECTED_SOURCE_BLOB: '2c1aad663a6ece4859be133b25787d96868276ba'
  EXPECTED_SEPARATION_BLOB: 'ae6eb9c8d72cf52261b68e49351dd34c0a24346a'
  EXPECTED_PROFILE_BLOB: '42f32f0e26f332591c876b180e0acb40527abcad'

jobs:
  qualify:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Checkout exact qualification subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Prove qualification-only review shape
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_QUAL_PARENT"
          mapfile -d '' changed < <(git diff --name-only -z "$EXPECTED_QUAL_PARENT" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$WORKFLOW"
          test "$(git ls-tree HEAD -- "$WORKFLOW" | awk '{print $1}')" = '100644'
          test -z "$(git status --porcelain=v1)"

      - name: Checkout frozen MYC-CONST-001 subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_PRODUCT_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Prove exact foundation ancestry, scope, and blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PRODUCT_PARENT"
          python3 - <<'PY'
          import os, subprocess
          expected = sorted([
              os.environ['WORKSPACE_MANIFEST'],
              os.environ['CRATE_MANIFEST'],
              os.environ['SOURCE'],
              os.environ['SEPARATION_TEST'],
              os.environ['PROFILE'],
          ])
          actual = subprocess.run(
              ['git', 'diff', '--name-only', os.environ['EXPECTED_PRODUCT_PARENT'], os.environ['EXPECTED_PRODUCT_SHA']],
              check=True, capture_output=True, text=True,
          ).stdout.splitlines()
          if sorted(actual) != expected:
              raise SystemExit(f'foundation scope mismatch: expected={expected!r} actual={sorted(actual)!r}')
          PY
          test "$(git rev-parse "HEAD:$WORKSPACE_MANIFEST")" = "$EXPECTED_WORKSPACE_MANIFEST_BLOB"
          test "$(git rev-parse "HEAD:$CRATE_MANIFEST")" = "$EXPECTED_CRATE_MANIFEST_BLOB"
          test "$(git rev-parse "HEAD:$SOURCE")" = "$EXPECTED_SOURCE_BLOB"
          test "$(git rev-parse "HEAD:$SEPARATION_TEST")" = "$EXPECTED_SEPARATION_BLOB"
          test "$(git rev-parse "HEAD:$PROFILE")" = "$EXPECTED_PROFILE_BLOB"
          test -z "$(git status --porcelain=v1)"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Capture exact foundation capsule
        shell: bash
        run: |
          set -euo pipefail
          printf 'runner_profile=ubuntu-slim\nrunner_os=%s\nrunner_arch=%s\n' "$RUNNER_OS" "$RUNNER_ARCH"
          rustc --version --verbose
          cargo --version --verbose
          python3 --version
          git --version
          sha256sum "$SOURCE" "$SEPARATION_TEST" "$PROFILE" "$CRATE_MANIFEST" "$WORKSPACE_MANIFEST" "$LOCKFILE"
          git rev-parse "HEAD:$SOURCE" "HEAD:$SEPARATION_TEST" "HEAD:$PROFILE" "HEAD:$CRATE_MANIFEST" "HEAD:$LOCKFILE"

      - name: Independent foundation boundary audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          source = Path(os.environ['SOURCE']).read_text(encoding='utf-8')
          manifest = Path(os.environ['CRATE_MANIFEST']).read_text(encoding='utf-8')
          profile = Path(os.environ['PROFILE']).read_text(encoding='utf-8')
          norm = re.sub(r'\s+', ' ', profile.replace('`','').replace('**','').replace('__','').casefold()).strip()
          for token in [
              'pub enum Branch',
              'pub enum Guardian',
              'pub enum AuthorityPrincipal',
              'pub enum ConstitutionalPower',
              'pub struct ConstitutionalCapability',
              'pub enum DecisionClass',
              'pub enum VoteWeightBasis',
              'VoteWeightBasis::EqualCivic',
          ]:
              if token not in source:
                  raise SystemExit(f'missing foundation token: {token}')
          if re.search(r'^\s*(hdk|hdi)\s*=', manifest, flags=re.MULTILINE):
              raise SystemExit('constitutional-authority must remain pure/no HDK-HDI')
          required = [
              'constituent sovereignty is deliberately not a sixth branch',
              'authorityprincipal::automatedagent holds no power in the constitutional power inventory',
              'this tranche does not yet alter the live voting zome',
          ]
          for phrase in required:
              if phrase not in norm:
                  raise SystemExit(f'missing foundation claim boundary: {phrase}')
          print('independent_foundation_boundary_audit=PASS')
          PY

      - name: Check formatting
        run: cargo fmt --manifest-path "$CRATE_MANIFEST" -- --check

      - name: Compile foundation suite
        run: cargo test --manifest-path "$CRATE_MANIFEST" --all-targets --locked --no-run

      - name: Execute foundation suite
        run: cargo test --manifest-path "$CRATE_MANIFEST" --all-targets --locked

      - name: Strict Clippy
        run: cargo clippy --manifest-path "$CRATE_MANIFEST" --all-targets --locked -- -D warnings

      - name: Refuse qualification-time mutation
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Emit postflight facts
        shell: bash
        run: |
          set -euo pipefail
          printf 'status=PASS\n'
          printf 'product_sha=%s\n' "$EXPECTED_PRODUCT_SHA"
          printf 'source_blob=%s\n' "$(git rev-parse "HEAD:$SOURCE")"
          printf 'separation_test_blob=%s\n' "$(git rev-parse "HEAD:$SEPARATION_TEST")"
          printf 'rust_toolchain=%s\n' "$RUST_TOOLCHAIN"
          printf 'claim=exact MYC-CONST-001 foundation compiled, tested, linted, formatted, and independently boundary-audited under this profile\n'
          printf 'nonclaim=MYC-CONST-001B entitlement/delegation semantics, runtime enforcement, live voting migration, constitutional legitimacy, legal validity\n'
