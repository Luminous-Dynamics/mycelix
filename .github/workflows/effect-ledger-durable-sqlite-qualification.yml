name: Effect Ledger Durable SQLite Qualification

on:
  push:
    branches:
      - hardening/effect-ledger-durable-sqlite-fence-v1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  QUALIFICATION_CHECKOUT_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
  QUALIFICATION_CHECKOUT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  qualify:
    name: Durable effect-fence qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          repository: ${{ env.QUALIFICATION_CHECKOUT_REPOSITORY }}
          ref: ${{ env.QUALIFICATION_CHECKOUT_REF }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Assert exact qualification head
        shell: bash
        run: |
          set -euo pipefail
          expected="${QUALIFICATION_CHECKOUT_REF}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected" || {
            echo "exact-head mismatch: expected=$expected actual=$actual" >&2
            exit 1
          }

      - name: Verify crate boundary and durable primitives
        shell: bash
        run: |
          set -euo pipefail
          manifest='mycelix-governance/crates/constitutional-effect-ledger-sqlite/Cargo.toml'
          source='mycelix-governance/crates/constitutional-effect-ledger-sqlite/src/lib.rs'
          test -f "$manifest"
          test -f "$source"

          grep -Fq 'constitutional-effect-ledger = { path = "../constitutional-effect-ledger" }' "$manifest"
          grep -Fq 'rusqlite = { version = "0.32", features = ["bundled"] }' "$manifest"
          grep -Fq 'transaction_with_behavior(TransactionBehavior::Immediate)' "$source"
          grep -Fq 'PRIMARY KEY NOT NULL' "$source"
          grep -Fq 'UNIQUE' "$source"
          grep -Fq 'record_digest()' "$source"
          grep -Fq 'validate_schema_columns' "$source"
          grep -Fq 'validate_no_managed_triggers' "$source"
          grep -Fq 'foreign_keys' "$source"
          grep -Fq 'synchronous' "$source"

          if grep -R -Fq 'InvocationClaimed' mycelix-governance/crates/constitutional-effect-ledger; then
            echo 'Durable-store branch must not reference a state variant absent from the exact v1 model.'
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --manifest-path mycelix-governance/Cargo.toml --all --check

      - name: Compile the exact effect-ledger surface
        run: cargo check --manifest-path mycelix-governance/Cargo.toml -p constitutional-effect-ledger -p constitutional-effect-ledger-sqlite

      - name: Run reference-model and durable-store tests
        run: cargo test --manifest-path mycelix-governance/Cargo.toml -p constitutional-effect-ledger -p constitutional-effect-ledger-sqlite --all-targets

      - name: Run clippy with warnings denied
        run: cargo clippy --manifest-path mycelix-governance/Cargo.toml -p constitutional-effect-ledger -p constitutional-effect-ledger-sqlite --all-targets -- -D warnings
