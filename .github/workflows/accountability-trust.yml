name: Accountability Trust

on:
  pull_request:
    paths:
      - "crates/mycelix-accountability-core/**"
      - "crates/mycelix-accountability-verifier/**"
      - "crates/mycelix-accountability-trust/**"
      - ".github/workflows/accountability-trust.yml"
  push:
    branches:
      - "sif/attestation-trust-policy-v0.1"
    paths:
      - "crates/mycelix-accountability-core/**"
      - "crates/mycelix-accountability-verifier/**"
      - "crates/mycelix-accountability-trust/**"
      - ".github/workflows/accountability-trust.yml"

permissions:
  contents: read

jobs:
  accountability-trust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check --manifest-path crates/mycelix-accountability-trust/Cargo.toml
      - name: Test
        run: cargo test --manifest-path crates/mycelix-accountability-trust/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-accountability-trust/Cargo.toml --all-targets -- -D warnings
