name: FPM trusted qualification independent verifier

on:
  workflow_run:
    workflows: ["FPM trusted qualification policy"]
    types: [completed]

permissions: {}

jobs:
  verify:
    if: >-
      github.event.workflow_run.name == 'FPM trusted qualification policy' &&
      github.event.workflow_run.path == '.github/workflows/fpm-trusted-qualification.yml' &&
      github.event.workflow_run.event == 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      pull-requests: read

    steps:
      - name: Checkout trusted verifier revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Assert independent verifier control plane
        env:
          EXPECTED_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/fpm-trusted-qualification-independent-verify.yml@refs/heads/main
        run: |
          set -euo pipefail
          mkdir -p snapshot
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_WORKFLOW_REF" = "$EXPECTED_WORKFLOW_REF"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_WORKFLOW_SHA"
          blob="$(git rev-parse HEAD:.github/workflows/fpm-trusted-qualification-independent-verify.yml)"
          printf '%s\n' "$blob" | grep -Eq '^[0-9a-f]{40}$'
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          record = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "repository_id": int(os.environ["GITHUB_REPOSITORY_ID"]),
              "path": ".github/workflows/fpm-trusted-qualification-independent-verify.yml",
              "ref": "refs/heads/main",
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "workflow_sha": os.environ["GITHUB_WORKFLOW_SHA"],
              "workflow_blob_sha": subprocess.check_output(
                  ["git", "rev-parse", "HEAD:.github/workflows/fpm-trusted-qualification-independent-verify.yml"],
                  text=True,
              ).strip(),
              "reference_verifier_path": "scripts/integral/verify_fpm_trusted_qualification.py",
              "reference_verifier_blob_sha": subprocess.check_output(
                  ["git", "rev-parse", "HEAD:scripts/integral/verify_fpm_trusted_qualification.py"],
                  text=True,
              ).strip(),
              "artifact_collector_path": "scripts/integral/collect_fpm_trusted_artifacts.py",
              "artifact_collector_blob_sha": subprocess.check_output(
                  ["git", "rev-parse", "HEAD:scripts/integral/collect_fpm_trusted_artifacts.py"],
                  text=True,
              ).strip(),
          }
          Path("snapshot/verifier-control.json").write_text(
              json.dumps(record, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Validate immutable verifier action pins
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path(".github/workflows/fpm-trusted-qualification-independent-verify.yml")
          text = path.read_text(encoding="utf-8")

          assert "permissions: {}" in text
          assert "${{ github.token }}" in text
          assert text.count("persist-credentials: false") == 1

          expected = {
              "actions/checkout": "3d3c42e5aac5ba805825da76410c181273ba90b1",
              "actions/download-artifact": "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c",
              "actions/upload-artifact": "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          }

          refs = {}
          pattern = re.compile(
              r"^\s*-?\s*uses:\s+([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)@([0-9a-f]{40})(?:\s+#.*)?$"
          )
          for line in text.splitlines():
              match = pattern.fullmatch(line)
              if not match:
                  continue
              action, ref = match.groups()
              if action in refs:
                  assert refs[action] == ref, f"action {action} pin changed within verifier"
              refs[action] = ref

          assert refs == expected, f"unexpected verifier action set: {refs!r}"
          PY

      - name: Run independent verifier adversarial corpus
        run: |
          set -euo pipefail
          python3 scripts/integral/test_verify_fpm_trusted_qualification.py

      - name: Capture upstream trusted run
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_NAME: FPM trusted qualification policy
          EXPECTED_PATH: .github/workflows/fpm-trusted-qualification.yml
        run: |
          set -euo pipefail
          mkdir -p snapshot/raw/receipt-download snapshot/raw/index-download
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > snapshot/trusted-run.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          run = json.loads(Path("snapshot/trusted-run.json").read_text())
          assert run["id"] == int(os.environ["RUN_ID"])
          assert run["name"] == os.environ["EXPECTED_NAME"]
          assert run["path"] == os.environ["EXPECTED_PATH"]
          assert run["event"] == "workflow_run"
          assert run["status"] == "completed"
          assert run["conclusion"] == "success"
          assert run["repository"]["full_name"] == os.environ["GITHUB_REPOSITORY"]
          assert run["run_attempt"] >= 1
          PY

          python3 scripts/integral/collect_fpm_trusted_artifacts.py             --repository "${GITHUB_REPOSITORY}"             --run-id "${RUN_ID}"             --artifacts-out snapshot/artifacts.json             --enumeration-out snapshot/artifact-enumeration.json

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          artifacts = json.loads(Path("snapshot/artifacts.json").read_text())
          items = artifacts["artifacts"]
          receipts = [
              x for x in items
              if re.fullmatch(r"fpm-trusted-qualification-[0-9a-f]{40}", x.get("name", ""))
          ]
          indexes = [
              x for x in items
              if re.fullmatch(r"fpm-trusted-qualification-index-[0-9a-f]{40}", x.get("name", ""))
          ]
          assert len(receipts) == 1, f"expected one receipt artifact, found {len(receipts)}"
          assert len(indexes) == 1, f"expected one index artifact, found {len(indexes)}"
          receipt = receipts[0]
          index = indexes[0]
          for artifact in (receipt, index):
              assert artifact["expired"] is False
              assert artifact["size_in_bytes"] > 0
              assert artifact["workflow_run"]["id"] == int(os.environ["RUN_ID"])
              assert artifact["workflow_run"]["repository_id"] == run["repository"]["id"]
              assert re.fullmatch(r"sha256:[0-9a-f]{64}", artifact["digest"])
          subject = receipt["name"].removeprefix("fpm-trusted-qualification-")
          assert index["name"] == f"fpm-trusted-qualification-index-{subject}"
          Path("upstream-artifact-selection.json").write_text(
              json.dumps(
                  {
                      "candidate_sha_from_artifact_name": subject,
                      "receipt_artifact_id": receipt["id"],
                      "receipt_artifact_digest": receipt["digest"],
                      "receipt_artifact_name": receipt["name"],
                      "index_artifact_id": index["id"],
                      "index_artifact_digest": index["digest"],
                      "index_artifact_name": index["name"],
                  },
                  sort_keys=True,
                  separators=(",", ":"),
              ) + "\n",
              encoding="utf-8",
          )
          PY
          printf 'receipt_artifact_id=%s\n' "$(jq -r '.receipt_artifact_id' upstream-artifact-selection.json)" >> "$GITHUB_OUTPUT"
          printf 'index_artifact_id=%s\n' "$(jq -r '.index_artifact_id' upstream-artifact-selection.json)" >> "$GITHUB_OUTPUT"

      - name: Download exact upstream receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          artifact-ids: ${{ steps.upstream.outputs.receipt_artifact_id }}
          path: snapshot/raw/receipt-download
          skip-decompress: true
          digest-mismatch: error

      - name: Download exact upstream binding index
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          artifact-ids: ${{ steps.upstream.outputs.index_artifact_id }}
          path: snapshot/raw/index-download
          skip-decompress: true
          digest-mismatch: error

      - name: Normalize downloaded raw evidence archives
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          def normalize(root: Path, expected_name: str, output: Path) -> None:
              members = sorted(root.iterdir(), key=lambda path: path.name)
              if len(members) != 1:
                  raise SystemExit(
                      f"raw artifact download must contain exactly one archive: {root}: {members!r}"
                  )
              source = members[0]
              if not source.is_file() or source.is_symlink():
                  raise SystemExit(f"raw artifact download is not a regular file: {source}")
              output.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, output)

          normalize(
              Path("snapshot/raw/receipt-download"),
              "qualification-receipt.json",
              Path("snapshot/raw/receipt.zip"),
          )
          normalize(
              Path("snapshot/raw/index-download"),
              "artifact-binding-index.json",
              Path("snapshot/raw/index.zip"),
          )
          PY

      - name: Validate and materialize raw evidence members
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          verifier_path = Path("scripts/integral/verify_fpm_trusted_qualification.py")
          spec = importlib.util.spec_from_file_location("fpm_reference_verifier", verifier_path)
          if not spec or not spec.loader:
              raise SystemExit("unable to load reference verifier")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          selection = json.loads(
              Path("upstream-artifact-selection.json").read_text(encoding="utf-8")
          )
          artifacts = json.loads(
              Path("snapshot/artifacts.json").read_text(encoding="utf-8")
          )["artifacts"]
          by_id = {item["id"]: item for item in artifacts}
          receipt = by_id[selection["receipt_artifact_id"]]
          index = by_id[selection["index_artifact_id"]]

          module.verify_raw_artifact_archive(
              Path("snapshot/raw/receipt.zip"),
              "qualification-receipt.json",
              receipt["digest"],
              receipt["size_in_bytes"],
              Path("snapshot/qualification-receipt.json"),
              "receipt",
          )
          module.verify_raw_artifact_archive(
              Path("snapshot/raw/index.zip"),
              "artifact-binding-index.json",
              index["digest"],
              index["size_in_bytes"],
              Path("snapshot/artifact-binding-index.json"),
              "index",
          )
          PY

      - name: Extract evidence targets with strict JSON parser
        id: target
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          def reject_duplicates(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise SystemExit(f"duplicate JSON key: {key!r}")
                  result[key] = value
              return result

          def reject_nonstandard_constant(value):
              raise SystemExit(f"non-standard JSON constant is forbidden: {value}")

          raw = Path("snapshot/qualification-receipt.json").read_bytes()
          if not raw.endswith(b"\n") or raw[:-1].endswith(b"\n"):
              raise SystemExit("receipt must have exactly one trailing LF")
          receipt = json.loads(
              raw[:-1].decode("utf-8"),
              object_pairs_hook=reject_duplicates,
              parse_constant=reject_nonstandard_constant,
          )
          canonical = json.dumps(receipt, sort_keys=True, separators=(",", ":"), ensure_ascii=True).encode("utf-8")
          if canonical != raw[:-1]:
              raise SystemExit("receipt is not canonical JSON")
          if not re.fullmatch(r"[1-9][0-9]*", str(receipt["pr_number"])):
              raise SystemExit("invalid PR number")
          if not re.fullmatch(r"[1-9][0-9]*", str(receipt["upstream_workflow_run_id"])):
              raise SystemExit("invalid candidate workflow run ID")
          if not re.fullmatch(r"[0-9a-f]{40}", receipt["subject_sha"]):
              raise SystemExit("invalid subject SHA")
          if not re.fullmatch(r"[0-9a-f]{40}", receipt["trusted_policy_sha"]):
              raise SystemExit("invalid trusted policy SHA")
          if receipt["lock_mode"] not in {"tracked", "generated_for_run"}:
              raise SystemExit("invalid lock mode")
          with open(os.environ["GITHUB_OUTPUT"], "w", encoding="utf-8") as output:
              output.write(f"pr_number={receipt['pr_number']}\n")
              output.write(f"candidate_run_id={receipt['upstream_workflow_run_id']}\n")
              output.write(f"subject_sha={receipt['subject_sha']}\n")
              output.write(f"policy_sha={receipt['trusted_policy_sha']}\n")
              output.write(f"lock_mode={receipt['lock_mode']}\n")
          PY

      - name: Resolve evidence-linked GitHub objects
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          CANDIDATE_RUN_ID: ${{ steps.target.outputs.candidate_run_id }}
          SUBJECT_SHA: ${{ steps.target.outputs.subject_sha }}
          POLICY_SHA: ${{ steps.target.outputs.policy_sha }}
          LOCK_MODE: ${{ steps.target.outputs.lock_mode }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}" > snapshot/candidate-run.json
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > snapshot/pull-request.json
          gh api "repos/${GITHUB_REPOSITORY}/commits/${SUBJECT_SHA}" > snapshot/subject-commit.json
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" > snapshot/main-ref.json
          gh api "repos/${GITHUB_REPOSITORY}/contents/crates/fpm-wasm-artifact-identity/Cargo.toml?ref=${SUBJECT_SHA}" > snapshot/manifest.json
          gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/fpm-trusted-qualification.yml?ref=${POLICY_SHA}" > snapshot/policy-file.json
          if [ "$LOCK_MODE" = "tracked" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/contents/crates/fpm-wasm-artifact-identity/Cargo.lock?ref=${SUBJECT_SHA}" > snapshot/candidate-lock.json
          else
            printf '%s\n' '{"mode":"generated_for_run"}' > snapshot/candidate-lock.json
          fi
      - name: Run independent raw-object verifier
        id: reference
        run: |
          set -euo pipefail
          result="$(python3 scripts/integral/verify_fpm_trusted_qualification.py snapshot)"
          printf '%s\n' "$result" | tee snapshot/reference-verification.json
          printf 'candidate_sha=%s\n' "$(printf '%s' "$result" | jq -r '.candidate_sha')" >> "$GITHUB_OUTPUT"

      - name: Upload independent verification result
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fpm-trusted-qualification-reference-verification-${{ steps.reference.outputs.candidate_sha }}
          path: snapshot/reference-verification.json
          if-no-files-found: error
          retention-days: 90
