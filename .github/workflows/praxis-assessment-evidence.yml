name: Praxis Assessment Evidence

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "mycelix-praxis/crates/praxis-core/**"
      - "mycelix-praxis/examples/assessment-benchmarks/**"
      - "mycelix-praxis/docs/ASSESSMENT_EVIDENCE_BENCHMARK_V1.md"
      - ".github/workflows/praxis-assessment-evidence.yml"
  push:
    branches: [main]
    paths:
      - "mycelix-praxis/crates/praxis-core/**"
      - "mycelix-praxis/examples/assessment-benchmarks/**"
      - "mycelix-praxis/docs/ASSESSMENT_EVIDENCE_BENCHMARK_V1.md"
      - ".github/workflows/praxis-assessment-evidence.yml"

permissions:
  contents: read

concurrency:
  group: praxis-assessment-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate assessment-evidence contract
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CHECKED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout exact assessment subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CHECKED_SHA }}
          persist-credentials: false

      - name: Assert exact assessment subject
        run: test "$(git rev-parse HEAD)" = "$CHECKED_SHA"

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # pinned action
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Assert Rust toolchain identity
        run: test "$(rustc +1.96.0 --version)" = "rustc 1.96.0 (ac68faa20 2026-05-25)"

      - name: Check formatting for Praxis Core only
        run: cargo +1.96.0 fmt --manifest-path mycelix-praxis/Cargo.toml --package praxis-core -- --check

      - name: Run frozen assessment-evidence contract tests
        run: cargo +1.96.0 test --manifest-path mycelix-praxis/Cargo.toml --package praxis-core assessment_evidence::tests -- --nocapture
