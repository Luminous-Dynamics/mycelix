name: FSRE linkage impact E0

on:
  pull_request:
    paths:
      - 'tools/fsre-linkage-impact/**'
      - '.github/workflows/fsre-linkage-impact.yml'
  push:
    branches:
      - research/fsre-linkage-impact-v0.1
    paths:
      - 'tools/fsre-linkage-impact/**'
      - '.github/workflows/fsre-linkage-impact.yml'

permissions:
  contents: read

jobs:
  linkage-impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path tools/fsre-linkage-impact/Cargo.toml -- --check
      - name: Tests
        run: cargo test --locked --offline --manifest-path tools/fsre-linkage-impact/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --offline --manifest-path tools/fsre-linkage-impact/Cargo.toml --all-targets -- -D warnings
      - name: Deterministic receipt and golden
        run: |
          cargo run --quiet --locked --offline --manifest-path tools/fsre-linkage-impact/Cargo.toml -- tools/fsre-linkage-impact/fixtures/bridge-and-split.psv > /tmp/linkage-impact-a.txt
          cargo run --quiet --locked --offline --manifest-path tools/fsre-linkage-impact/Cargo.toml -- tools/fsre-linkage-impact/fixtures/bridge-and-split.psv > /tmp/linkage-impact-b.txt
          cmp /tmp/linkage-impact-a.txt /tmp/linkage-impact-b.txt
          cmp /tmp/linkage-impact-a.txt tools/fsre-linkage-impact/fixtures/bridge-and-split.expected.txt
