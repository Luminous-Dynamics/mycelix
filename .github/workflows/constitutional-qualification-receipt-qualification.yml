          s = p.read_text()
          old = '        push_str(&mut hasher, &self.verifier_head);\n'
          assert old in s
          p.write_text(s.replace(old, '', 1))
          PY
          nix shell "github:NixOS/nixpkgs/${NIXPKGS_REV}#cargo" "github:NixOS/nixpkgs/${NIXPKGS_REV}#rustc" "github:NixOS/nixpkgs/${NIXPKGS_REV}#bash" --command bash -euo pipefail -c '
            cargo check --manifest-path mycelix-governance/crates/constitutional-qualification-receipt/Cargo.toml --all-targets > qualification-receipt-evidence/mutant-verifier-check.log 2>&1
            if cargo test --manifest-path mycelix-governance/crates/constitutional-qualification-receipt/Cargo.toml every_authority_tuple_field_changes_the_commitment > qualification-receipt-evidence/mutant-verifier-test.log 2>&1; then
              echo "verifier-head omission mutant survived" >&2; exit 1
            fi
          '
          cp /tmp/qrec-lib.rs "$SRC"; trap - EXIT
          echo PASS > qualification-receipt-evidence/mutant-verifier.txt

      - name: Mutation control — hosted run ID remains authority-bearing
        shell: bash
        run: |
          set -euo pipefail
          SRC=mycelix-governance/crates/constitutional-qualification-receipt/src/lib.rs
          cp "$SRC" /tmp/qrec-lib.rs
          trap 'cp /tmp/qrec-lib.rs "$SRC"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mycelix-governance/crates/constitutional-qualification-receipt/src/lib.rs')
          s = p.read_text()
          old = '        hasher.update(&self.run_id.to_be_bytes());\n'
          assert old in s
          p.write_text(s.replace(old, '', 1))
          PY
          nix shell "github:NixOS/nixpkgs/${NIXPKGS_REV}#cargo" "github:NixOS/nixpkgs/${NIXPKGS_REV}#rustc" "github:NixOS/nixpkgs/${NIXPKGS_REV}#bash" --command bash -euo pipefail -c '
            cargo check --manifest-path mycelix-governance/crates/constitutional-qualification-receipt/Cargo.toml --all-targets > qualification-receipt-evidence/mutant-run-check.log 2>&1
            if cargo test --manifest-path mycelix-governance/crates/constitutional-qualification-receipt/Cargo.toml every_authority_tuple_field_changes_the_commitment > qualification-receipt-evidence/mutant-run-test.log 2>&1; then
              echo "run-ID omission mutant survived" >&2; exit 1
            fi
          '
          cp /tmp/qrec-lib.rs "$SRC"; trap - EXIT
          echo PASS > qualification-receipt-evidence/mutant-run.txt

      - name: Mutation control — run attempt remains authority-bearing
        shell: bash
        run: |
          set -euo pipefail
          SRC=mycelix-governance/crates/constitutional-qualification-receipt/src/lib.rs
          cp "$SRC" /tmp/qrec-lib.rs
          trap 'cp /tmp/qrec-lib.rs "$SRC"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mycelix-governance/crates/constitutional-qualification-receipt/src/lib.rs')
          s = p.read_text()
          old = '        hasher.update(&self.run_attempt.to_be_bytes());\n'
          assert old in s
          p.write_text(s.replace(old, '', 1))
          PY
          nix shell "github:NixOS/nixpkgs/${NIXPKGS_REV}#cargo" "github:NixOS/nixpkgs/${NIXPKGS_REV}#rustc" "github:NixOS/nixpkgs/${NIXPKGS_REV}#bash" --command bash -euo pipefail -c '
            cargo check --manifest-path mycelix-governance/crates/constitutional-qualification-receipt/Cargo.toml --all-targets > qualification-receipt-evidence/mutant-attempt-check.log 2>&1
            if cargo test --manifest-path mycelix-governance/crates/constitutional-qualification-receipt/Cargo.toml every_authority_tuple_field_changes_the_commitment > qualification-receipt-evidence/mutant-attempt-test.log 2>&1; then
              echo "run-attempt omission mutant survived" >&2; exit 1
            fi
          '
          cp /tmp/qrec-lib.rs "$SRC"; trap - EXIT
          echo PASS > qualification-receipt-evidence/mutant-attempt.txt

      - name: Mutation control — artifact digest remains authority-bearing
        shell: bash
        run: |
          set -euo pipefail
          SRC=mycelix-governance/crates/constitutional-qualification-receipt/src/lib.rs
          cp "$SRC" /tmp/qrec-lib.rs
          trap 'cp /tmp/qrec-lib.rs "$SRC"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mycelix-governance/crates/constitutional-qualification-receipt/src/lib.rs')
          s = p.read_text()
          old = '        push_str(&mut hasher, &self.artifact_digest);\n'
          assert old in s
          p.write_text(s.replace(old, '', 1))
          PY
          nix shell "github:NixOS/nixpkgs/${NIXPKGS_REV}#cargo" "github:NixOS/nixpkgs/${NIXPKGS_REV}#rustc" "github:NixOS/nixpkgs/${NIXPKGS_REV}#bash" --command bash -euo pipefail -c '
            cargo check --manifest-path mycelix-governance/crates/constitutional-qualification-receipt/Cargo.toml --all-targets > qualification-receipt-evidence/mutant-artifact-check.log 2>&1
            if cargo test --manifest-path mycelix-governance/crates/constitutional-qualification-receipt/Cargo.toml every_authority_tuple_field_changes_the_commitment > qualification-receipt-evidence/mutant-artifact-test.log 2>&1; then
              echo "artifact-digest omission mutant survived" >&2; exit 1
            fi
          '
          cp /tmp/qrec-lib.rs "$SRC"; trap - EXIT
          echo PASS > qualification-receipt-evidence/mutant-artifact.txt

      - name: Mutation control — navigation metadata cannot become authority
        shell: bash
        run: |
          set -euo pipefail
          SRC=mycelix-governance/crates/constitutional-qualification-receipt/src/lib.rs
          cp "$SRC" /tmp/qrec-lib.rs
          trap 'cp /tmp/qrec-lib.rs "$SRC"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mycelix-governance/crates/constitutional-qualification-receipt/src/lib.rs')
          s = p.read_text()
          old = '        push_str(&mut hasher, &self.artifact_digest);\n'
          new = old + '        if let Some(workflow_name) = &self.navigation.workflow_name { push_str(&mut hasher, workflow_name); }\n'
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          nix shell "github:NixOS/nixpkgs/${NIXPKGS_REV}#cargo" "github:NixOS/nixpkgs/${NIXPKGS_REV}#rustc" "github:NixOS/nixpkgs/${NIXPKGS_REV}#bash" --command bash -euo pipefail -c '
            cargo check --manifest-path mycelix-governance/crates/constitutional-qualification-receipt/Cargo.toml --all-targets > qualification-receipt-evidence/mutant-navigation-check.log 2>&1
            if cargo test --manifest-path mycelix-governance/crates/constitutional-qualification-receipt/Cargo.toml navigation_metadata_is_not_qualification_authority > qualification-receipt-evidence/mutant-navigation-test.log 2>&1; then
              echo "navigation-authority mutant survived" >&2; exit 1
            fi
          '
          cp /tmp/qrec-lib.rs "$SRC"; trap - EXIT
          echo PASS > qualification-receipt-evidence/mutant-navigation.txt

      - name: Mutation control — pending evidence cannot satisfy exact census
        shell: bash
        run: |
          set -euo pipefail
          SRC=mycelix-governance/crates/constitutional-qualification-receipt/src/lib.rs
          cp "$SRC" /tmp/qrec-lib.rs
          trap 'cp /tmp/qrec-lib.rs "$SRC"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mycelix-governance/crates/constitutional-qualification-receipt/src/lib.rs')
          s = p.read_text()
          old = '                return Err(ReceiptError::DependencyPending(dependency_id.to_string()));\n'
          new = '                return Ok(());\n'
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          nix shell "github:NixOS/nixpkgs/${NIXPKGS_REV}#cargo" "github:NixOS/nixpkgs/${NIXPKGS_REV}#rustc" "github:NixOS/nixpkgs/${NIXPKGS_REV}#bash" --command bash -euo pipefail -c '
            cargo check --manifest-path mycelix-governance/crates/constitutional-qualification-receipt/Cargo.toml --all-targets > qualification-receipt-evidence/mutant-pending-check.log 2>&1
            if cargo test --manifest-path mycelix-governance/crates/constitutional-qualification-receipt/Cargo.toml exact_census_rejects_pending_and_failed_dependencies > qualification-receipt-evidence/mutant-pending-test.log 2>&1; then
              echo "pending-admission mutant survived" >&2; exit 1
            fi
          '
          cp /tmp/qrec-lib.rs "$SRC"; trap - EXIT
          echo PASS > qualification-receipt-evidence/mutant-pending.txt

