name: Constitutional Qualification Receipt Qualification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'mycelix-governance/Cargo.toml'
      - 'mycelix-governance/crates/constitutional-qualification-receipt/**'
      - 'mycelix-governance/docs/QUALIFICATION_RECEIPT_V1.md'
      - 'mycelix-governance/specs/qualification-receipt.v1.schema.json'
      - '.github/workflows/constitutional-qualification-receipt-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: constitutional-qualification-receipt-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NIXPKGS_REV: a50bf0c1b07873c1a53892292017041a8f0a1288
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  EXPECTED_SEMANTIC_HEAD: d53d7c3f8dd12cb9cde8803bf0d38a14c542cea9
  EXPECTED_PARENT: a85369699099d4c7524e502e531735eed4ab36f4

jobs:
  qualify:
    name: Exact issuer-bound qualification receipt contract
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout exact verifier head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 3
          ref: ${{ env.EXPECTED_HEAD }}

      - name: Bind exact semantic lineage and surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SEMANTIC_HEAD"
          test "$(git rev-parse HEAD^^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/constitutional-qualification-receipt-qualification.yml"

          expected_semantic_files=$'mycelix-governance/Cargo.toml\nmycelix-governance/crates/constitutional-qualification-receipt/Cargo.toml\nmycelix-governance/crates/constitutional-qualification-receipt/src/lib.rs\nmycelix-governance/docs/QUALIFICATION_RECEIPT_V1.md\nmycelix-governance/specs/qualification-receipt.v1.schema.json'
          test "$(git diff --name-only "$EXPECTED_PARENT" "$EXPECTED_SEMANTIC_HEAD")" = "$expected_semantic_files"

          if git diff --name-only "$EXPECTED_PARENT" "$EXPECTED_SEMANTIC_HEAD" | grep -E '(^|/)(zomes|dnas|happs|apps)/' >/dev/null; then
            echo "QREC-001 unexpectedly changes runtime/Holochain surface" >&2
            exit 1
          fi

          rm -rf qualification-receipt-evidence
          mkdir -p qualification-receipt-evidence
          printf '%s\n' "$EXPECTED_HEAD" > qualification-receipt-evidence/expected-head.txt
          printf '%s\n' "$EXPECTED_SEMANTIC_HEAD" > qualification-receipt-evidence/expected-semantic-head.txt
          printf '%s\n' "$EXPECTED_PARENT" > qualification-receipt-evidence/expected-parent.txt

          git hash-object \
            mycelix-governance/Cargo.toml \
            mycelix-governance/crates/constitutional-qualification-receipt/Cargo.toml \
            mycelix-governance/crates/constitutional-qualification-receipt/src/lib.rs \
            mycelix-governance/docs/QUALIFICATION_RECEIPT_V1.md \
            mycelix-governance/specs/qualification-receipt.v1.schema.json \
            > qualification-receipt-evidence/source-hashes-before.txt

      - name: Validate closed schema and trust-layer source ceiling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          schema = json.loads(Path('mycelix-governance/specs/qualification-receipt.v1.schema.json').read_text())
          assert schema['type'] == 'object'
          assert schema['additionalProperties'] is False
          assert schema['required'] == [
              'schema_version', 'dependency_id', 'issuer_id', 'semantic_head',
              'verifier_head', 'run_id', 'run_attempt', 'artifact_digest',
              'receipt_commitment', 'navigation'
          ]
          assert schema['properties']['schema_version']['const'] == 1
          assert schema['properties']['issuer_id']['maxLength'] == 256
          assert schema['properties']['semantic_head']['pattern'] == '^[0-9a-f]{40}$'
          assert schema['properties']['verifier_head']['pattern'] == '^[0-9a-f]{40}$'
          assert schema['properties']['run_id']['minimum'] == 1
          assert schema['properties']['run_attempt']['minimum'] == 1
          assert schema['properties']['artifact_digest']['pattern'] == '^sha256:[0-9a-f]{64}$'
          assert schema['properties']['receipt_commitment']['pattern'] == '^blake3-256:[0-9a-f]{64}$'
          assert schema['$defs']['navigation']['additionalProperties'] is False

          source = Path('mycelix-governance/crates/constitutional-qualification-receipt/src/lib.rs').read_text()
          assert '#[derive(Debug)]\npub struct VerifiedQualificationReceiptV1' in source
          start = source.index('impl VerifiedQualificationReceiptV1 {')
          end = source.index('\n}', start) + 2
          block = source[start:end]
          public_methods = re.findall(r'pub fn ([A-Za-z0-9_]+)', block)
          assert public_methods == ['receipt'], public_methods
          derive_start = source.rfind('#[derive', 0, source.index('pub struct VerifiedQualificationReceiptV1'))
          derive_block = source[derive_start:source.index('pub struct VerifiedQualificationReceiptV1')]
          assert 'Serialize' not in derive_block
          assert 'Deserialize' not in derive_block
          assert 'Clone' not in derive_block
          assert 'Copy' not in derive_block
          print('closed schema + verified-wrapper ceiling: PASS')
          PY

      - name: Install pinned Rust toolchain components
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Format, compile, test, and lint exact semantic subject
        shell: bash
        run: |
          set -euo pipefail
          nix shell \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#cargo" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#rustc" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#rustfmt" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#clippy" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#coreutils" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#bash" \
            --command bash -euo pipefail -c '
              rustc --version | tee qualification-receipt-evidence/rustc-version.txt
              cargo --version | tee qualification-receipt-evidence/cargo-version.txt
              rustfmt --version | tee qualification-receipt-evidence/rustfmt-version.txt
              cargo clippy --version | tee qualification-receipt-evidence/clippy-version.txt

              cargo fmt --manifest-path mycelix-governance/Cargo.toml --package constitutional-qualification-receipt -- --check \
                2>&1 | tee qualification-receipt-evidence/cargo-fmt.log
              cargo check --manifest-path mycelix-governance/crates/constitutional-qualification-receipt/Cargo.toml --all-targets \
                2>&1 | tee qualification-receipt-evidence/cargo-check.log
              cargo test --manifest-path mycelix-governance/crates/constitutional-qualification-receipt/Cargo.toml --all-targets \
                2>&1 | tee qualification-receipt-evidence/cargo-test.log
              cargo clippy --manifest-path mycelix-governance/crates/constitutional-qualification-receipt/Cargo.toml --all-targets -- -D warnings \
                2>&1 | tee qualification-receipt-evidence/cargo-clippy.log

              cp mycelix-governance/Cargo.lock qualification-receipt-evidence/derived-Cargo.lock
              sha256sum qualification-receipt-evidence/derived-Cargo.lock > qualification-receipt-evidence/derived-Cargo.lock.sha256
            '

      - name: Mutation control — issuer remains authority-bearing
        shell: bash
        run: |
          set -euo pipefail
          SRC=mycelix-governance/crates/constitutional-qualification-receipt/src/lib.rs
          cp "$SRC" /tmp/qrec-lib.rs
          trap 'cp /tmp/qrec-lib.rs "$SRC"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mycelix-governance/crates/constitutional-qualification-receipt/src/lib.rs')
          s = p.read_text()
          old = '        push_str(&mut hasher, &self.issuer_id);\n'
          assert old in s
          p.write_text(s.replace(old, '', 1))
          PY
          nix shell "github:NixOS/nixpkgs/${NIXPKGS_REV}#cargo" "github:NixOS/nixpkgs/${NIXPKGS_REV}#rustc" "github:NixOS/nixpkgs/${NIXPKGS_REV}#bash" --command bash -euo pipefail -c '
            cargo check --manifest-path mycelix-governance/crates/constitutional-qualification-receipt/Cargo.toml --all-targets > qualification-receipt-evidence/mutant-issuer-commitment-check.log 2>&1
            if cargo test --manifest-path mycelix-governance/crates/constitutional-qualification-receipt/Cargo.toml every_authority_tuple_field_changes_the_commitment > qualification-receipt-evidence/mutant-issuer-commitment-test.log 2>&1; then
              echo "issuer omission mutant survived" >&2; exit 1
            fi
          '
          cp /tmp/qrec-lib.rs "$SRC"; trap - EXIT
          echo PASS > qualification-receipt-evidence/mutant-issuer-commitment.txt

      - name: Mutation control — semantic head remains authority-bearing
        shell: bash
        run: |
          set -euo pipefail
          SRC=mycelix-governance/crates/constitutional-qualification-receipt/src/lib.rs
          cp "$SRC" /tmp/qrec-lib.rs
          trap 'cp /tmp/qrec-lib.rs "$SRC"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mycelix-governance/crates/constitutional-qualification-receipt/src/lib.rs')
          s = p.read_text()
          old = '        push_str(&mut hasher, &self.semantic_head);\n'
          assert old in s
          p.write_text(s.replace(old, '', 1))
          PY
