            cargo check --manifest-path mycelix-governance/crates/constitutional-qualification-receipt/Cargo.toml --all-targets > qualification-receipt-evidence/mutant-semantic-check.log 2>&1
            if cargo test --manifest-path mycelix-governance/crates/constitutional-qualification-receipt/Cargo.toml every_authority_tuple_field_changes_the_commitment > qualification-receipt-evidence/mutant-semantic-test.log 2>&1; then
              echo "semantic-head omission mutant survived" >&2; exit 1
            fi
