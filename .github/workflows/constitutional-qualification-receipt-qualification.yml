      - name: Mutation control — verified wrapper cannot gain an unverified public constructor
        shell: bash
        run: |
          set -euo pipefail
          SRC=mycelix-governance/crates/constitutional-qualification-receipt/src/lib.rs
          cp "$SRC" /tmp/qrec-lib.rs
          trap 'cp /tmp/qrec-lib.rs "$SRC"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mycelix-governance/crates/constitutional-qualification-receipt/src/lib.rs')
          s = p.read_text()
          old = 'impl VerifiedQualificationReceiptV1 {\n    pub fn receipt(&self) -> &QualificationReceiptV1 {\n'
          new = '''impl VerifiedQualificationReceiptV1 {\n    pub fn unsafe_from_unverified(receipt: QualificationReceiptV1) -> Self {\n        Self { receipt, _authenticated_ingestion: VerifiedIngestionSeal }\n    }\n\n    pub fn receipt(&self) -> &QualificationReceiptV1 {\n'''
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          nix shell "github:NixOS/nixpkgs/${NIXPKGS_REV}#cargo" "github:NixOS/nixpkgs/${NIXPKGS_REV}#rustc" "github:NixOS/nixpkgs/${NIXPKGS_REV}#bash" --command bash -euo pipefail -c '
            cargo check --manifest-path mycelix-governance/crates/constitutional-qualification-receipt/Cargo.toml --all-targets > qualification-receipt-evidence/mutant-verified-constructor-check.log 2>&1
          '
          if python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path('mycelix-governance/crates/constitutional-qualification-receipt/src/lib.rs').read_text()
          start = source.index('impl VerifiedQualificationReceiptV1 {')
          end = source.index('\n}', start) + 2
          block = source[start:end]
          assert re.findall(r'pub fn ([A-Za-z0-9_]+)', block) == ['receipt']
          PY
          then
            echo "public-unverified-constructor mutant survived" >&2
            exit 1
          fi
          cp /tmp/qrec-lib.rs "$SRC"; trap - EXIT
          echo PASS > qualification-receipt-evidence/mutant-verified-constructor.txt

      - name: Verify semantic source immutability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git hash-object \
            mycelix-governance/Cargo.toml \
            mycelix-governance/crates/constitutional-qualification-receipt/Cargo.toml \
            mycelix-governance/crates/constitutional-qualification-receipt/src/lib.rs \
            mycelix-governance/docs/QUALIFICATION_RECEIPT_V1.md \
            mycelix-governance/specs/qualification-receipt.v1.schema.json \
            > qualification-receipt-evidence/source-hashes-after.txt
          cmp qualification-receipt-evidence/source-hashes-before.txt qualification-receipt-evidence/source-hashes-after.txt
          git diff --exit-code -- \
            mycelix-governance/Cargo.toml \
            mycelix-governance/crates/constitutional-qualification-receipt/Cargo.toml \
            mycelix-governance/crates/constitutional-qualification-receipt/src/lib.rs \
            mycelix-governance/docs/QUALIFICATION_RECEIPT_V1.md \
            mycelix-governance/specs/qualification-receipt.v1.schema.json

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: constitutional-qualification-receipt-${{ env.EXPECTED_HEAD }}
          path: qualification-receipt-evidence
          if-no-files-found: error
          retention-days: 30
