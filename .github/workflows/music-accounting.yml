name: Music Accounting Qualification

on:
  pull_request:
    paths:
      - 'mycelix-music/packages/accounting/**'
      - 'mycelix-music/packages/database/prisma/schema.prisma'
      - 'mycelix-music/package.json'
      - 'mycelix-music/scripts/check-source-invariants.sh'
      - 'mycelix-music/scripts/check-source-invariants-base.sh'
      - 'mycelix-music/scripts/check-checkpoint-compiler-invariants.sh'
      - 'mycelix-music/scripts/check-audit-capsule-invariants.sh'
      - 'mycelix-music/scripts/check-audit-issuer-trust-invariants.sh'
      - 'mycelix-music/scripts/check-audit-issuer-trust-anchor-invariants.sh'
      - 'mycelix-music/scripts/check-interop-audit-provenance-invariants.sh'
      - 'mycelix-music/scripts/check-interop-line-proof-invariants.sh'
      - 'mycelix-music/scripts/check-interop-line-proof-attestation-invariants.sh'
      - 'mycelix-music/scripts/check-interop-line-proof-attestation-trust-invariants.sh'
      - 'mycelix-music/scripts/check-interop-line-proof-attestation-trust-anchor-invariants.sh'
      - 'mycelix-music/scripts/check-accounting-wire-invariants.sh'
      - 'mycelix-music/scripts/check-interop-portable-verification-invariants.sh'
      - 'mycelix-music/scripts/accounting_wire_conformance.py'
      - 'mycelix-music/scripts/check-accounting-wire-python-conformance-invariants.sh'
      - 'mycelix-music/scripts/accounting_merkle_v2_conformance.py'
      - 'mycelix-music/scripts/check-accounting-merkle-v2-invariants.sh'
      - '.github/workflows/music-accounting.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-music/packages/accounting/**'
      - 'mycelix-music/packages/database/prisma/schema.prisma'
      - 'mycelix-music/package.json'
      - 'mycelix-music/scripts/check-source-invariants.sh'
      - 'mycelix-music/scripts/check-source-invariants-base.sh'
      - 'mycelix-music/scripts/check-checkpoint-compiler-invariants.sh'
      - 'mycelix-music/scripts/check-audit-capsule-invariants.sh'
      - 'mycelix-music/scripts/check-audit-issuer-trust-invariants.sh'
      - 'mycelix-music/scripts/check-audit-issuer-trust-anchor-invariants.sh'
      - 'mycelix-music/scripts/check-interop-audit-provenance-invariants.sh'
      - 'mycelix-music/scripts/check-interop-line-proof-invariants.sh'
      - 'mycelix-music/scripts/check-interop-line-proof-attestation-invariants.sh'
      - 'mycelix-music/scripts/check-interop-line-proof-attestation-trust-invariants.sh'
      - 'mycelix-music/scripts/check-interop-line-proof-attestation-trust-anchor-invariants.sh'
      - 'mycelix-music/scripts/check-accounting-wire-invariants.sh'
      - 'mycelix-music/scripts/check-interop-portable-verification-invariants.sh'
      - 'mycelix-music/scripts/accounting_wire_conformance.py'
      - 'mycelix-music/scripts/check-accounting-wire-python-conformance-invariants.sh'
      - 'mycelix-music/scripts/accounting_merkle_v2_conformance.py'
      - 'mycelix-music/scripts/check-accounting-merkle-v2-invariants.sh'
      - '.github/workflows/music-accounting.yml'

permissions:
  contents: read

concurrency:
  group: music-accounting-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Creator Accounting Exact-Head Qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # pull_request workflows normally expose a synthetic merge commit through
      # GITHUB_SHA. Qualification authority belongs to the proposed branch head,
      # never to that ephemeral merge ref.
      QUALIFIED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact proposed head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.QUALIFIED_HEAD_SHA }}
          persist-credentials: false

      - name: Verify exact proposed head checkout
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          if [ "$actual_head" != "$QUALIFIED_HEAD_SHA" ]; then
            echo "qualification checkout mismatch: expected=$QUALIFIED_HEAD_SHA actual=$actual_head" >&2
            exit 1
          fi
          echo "verified_qualified_head=$actual_head"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mycelix-music/package-lock.json

      - name: Install committed dependency graph
        working-directory: mycelix-music
        run: npm ci --ignore-scripts

      - name: Enforce source invariants
        working-directory: mycelix-music
        run: npm run check:invariants

      - name: Enforce reporting evidence trust-anchor invariants
        working-directory: mycelix-music
        run: bash scripts/check-interop-line-proof-attestation-trust-anchor-invariants.sh

      - name: Enforce canonical accounting wire invariants
        working-directory: mycelix-music
        run: bash scripts/check-accounting-wire-invariants.sh

      - name: Enforce independent Python accounting wire conformance
        working-directory: mycelix-music
        run: |
          python3 scripts/accounting_wire_conformance.py
          bash scripts/check-accounting-wire-python-conformance-invariants.sh

      - name: Enforce cross-language accounting Merkle v2 conformance
        working-directory: mycelix-music
        run: |
          python3 scripts/accounting_merkle_v2_conformance.py
          bash scripts/check-accounting-merkle-v2-invariants.sh

      - name: Enforce portable reporting verification invariants
        working-directory: mycelix-music
        run: bash scripts/check-interop-portable-verification-invariants.sh

      - name: Type-check accounting authority boundary
        working-directory: mycelix-music
        run: npm run type-check --workspace=@mycelix/accounting

      - name: Run accounting semantic regressions
        working-directory: mycelix-music
        run: npm test --workspace=@mycelix/accounting

      - name: Record exact qualified head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QUALIFIED_HEAD_SHA"
          echo "qualified_head=$QUALIFIED_HEAD_SHA"
          echo "qualification_policy=mycelix-music/packages/accounting/promotion-policy.json"
