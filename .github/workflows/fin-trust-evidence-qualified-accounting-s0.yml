name: FIN-TRUST evidence-qualified accounting S0 exact-head qualification

on:
  push:
    branches:
      - research/fin-trust-benchmark-v1
    paths:
      - "mycelix-finance/benchmarks/global-accounting-portability-v1/evidence-qualified-accounting-v1/**"
      - "mycelix-finance/benchmarks/global-accounting-portability-v1/rust-resolver/**"
      - ".github/workflows/fin-trust-evidence-qualified-accounting-s0.yml"
  pull_request:
    branches:
      - research/fin-global-context-v1
    paths:
      - "mycelix-finance/benchmarks/global-accounting-portability-v1/evidence-qualified-accounting-v1/**"
      - "mycelix-finance/benchmarks/global-accounting-portability-v1/rust-resolver/**"
      - ".github/workflows/fin-trust-evidence-qualified-accounting-s0.yml"

permissions:
  contents: read

concurrency:
  group: fin-trust-evidence-s0-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Draft 2020-12 schemas, 20-case Rust oracle and no-posting gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      QUALIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RESOLVER_DIR: mycelix-finance/benchmarks/global-accounting-portability-v1/rust-resolver
    steps:
      - name: Checkout exact qualification subject
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          persist-credentials: false

      - name: Assert exact checked-out commit
        run: test "$(git rev-parse HEAD)" = "${{ env.QUALIFIED_SHA }}"

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy

      - name: Assert toolchain
        run: test "$(rustc +1.96.1 --version | awk '{print $2}')" = "1.96.1"

      - name: Formatting
        working-directory: ${{ env.RESOLVER_DIR }}
        run: cargo fmt --all -- --check

      - name: Locked 20-case semantic tests
        working-directory: ${{ env.RESOLVER_DIR }}
        run: cargo test --locked --bin validate_evidence_qualified_accounting_s0

      - name: Warnings-denied Clippy
        working-directory: ${{ env.RESOLVER_DIR }}
        run: cargo clippy --locked --bin validate_evidence_qualified_accounting_s0 -- -D warnings

      - name: Run independent evidence-qualified accounting validator
        working-directory: ${{ env.RESOLVER_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --bin validate_evidence_qualified_accounting_s0 | tee /tmp/fin-trust-evidence-s0-receipt.txt
          grep -q "^PASS: 20 evidence-qualified accounting cases;" /tmp/fin-trust-evidence-s0-receipt.txt
          grep -Eq 'candidate_sha256=[0-9a-f]{64}' /tmp/fin-trust-evidence-s0-receipt.txt
          grep -Eq 'oracle_sha256=[0-9a-f]{64}' /tmp/fin-trust-evidence-s0-receipt.txt

      - name: Assert exact subject and clean source
        run: |
          test "$(git rev-parse HEAD)" = "${{ env.QUALIFIED_SHA }}"
          test -z "$(git status --porcelain)"

      - name: Upload exact-head semantic receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fin-trust-evidence-s0-${{ env.QUALIFIED_SHA }}
          path: /tmp/fin-trust-evidence-s0-receipt.txt
          if-no-files-found: error
