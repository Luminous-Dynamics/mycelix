name: Mycelix CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

# Generic branch/PR CI is supersedable: once a newer commit exists on the same
# PR or ref, completing an older run cannot provide a current merge signal.
# Exact qualification/evidence workflows intentionally do not inherit this
# policy and retain their independent, immutable run histories.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Detect which clusters changed
  changes:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    outputs:
      commons: ${{ steps.filter.outputs.commons }}
      civic: ${{ steps.filter.outputs.civic }}
      hearth: ${{ steps.filter.outputs.hearth }}
      finance: ${{ steps.filter.outputs.finance }}
      governance: ${{ steps.filter.outputs.governance }}
      identity: ${{ steps.filter.outputs.identity }}
      personal: ${{ steps.filter.outputs.personal }}
      attribution: ${{ steps.filter.outputs.attribution }}
      bridge: ${{ steps.filter.outputs.bridge }}
      sdk: ${{ steps.filter.outputs.sdk }}
      prism: ${{ steps.filter.outputs.prism }}
      cos_conformance: ${{ steps.filter.outputs.cos_conformance }}
      terra_preta_audit: ${{ steps.filter.outputs.terra_preta_audit }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            commons:
              - 'mycelix-commons/**'
              - 'crates/mycelix-bridge-*/**'
            civic:
              - 'mycelix-civic/**'
              - 'crates/mycelix-bridge-*/**'
            hearth:
              - 'mycelix-hearth/**'
              - 'crates/mycelix-bridge-*/**'
            finance:
              - 'mycelix-finance/**'
              - 'crates/mycelix-bridge-*/**'
            governance:
              - 'mycelix-governance/**'
              - 'crates/mycelix-bridge-*/**'
            identity:
              - 'mycelix-identity/**'
              - 'crates/mycelix-bridge-*/**'
            personal:
              - 'mycelix-personal/**'
              - 'crates/mycelix-bridge-*/**'
            attribution:
              - 'mycelix-attribution/**'
              - 'crates/mycelix-bridge-*/**'
            bridge:
              - 'crates/mycelix-bridge-*/**'
            sdk:
              - 'mycelix-workspace/sdk/**'
              - 'mycelix-workspace/sdk-ts/**'
            prism:
              - 'mycelix-workspace/mycelix-prism/**'
            cos_conformance:
              - 'mycelix-manufacturing/crates/cos_conformance/**'
              - 'mycelix-manufacturing/Cargo.toml'
              - 'mycelix-manufacturing/Cargo.lock'
              - 'docs/integral/cos-reference-node-v1.md'
              - 'mycelix-manufacturing/tests/cos_reference_conformance.md'
            terra_preta_audit:
              - 'research/terra-preta/**'
              - '.github/workflows/ci.yml'

  # Format check (always runs when CI is admitted)
  format:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: |
          # Each check runs in a subshell `(cd "$dir" && ...)` rather than
          # `cd "$dir" && ... && cd ..` -- the latter never runs the trailing
          # `cd ..` when the fmt check itself fails (short-circuits on the
          # first `&&`), leaving the script's cwd stuck inside that
          # directory for every subsequent iteration and turning one real
          # violation into a cascade of unrelated "No such file or
          # directory" errors for every cluster checked after it. The
          # subshell keeps cwd untouched regardless of outcome, and we keep
          # checking every directory (not stop at the first failure) so a
          # single CI run surfaces every cluster's violations at once,
          # exiting non-zero at the end if any were found.
          status=0
          for dir in mycelix-commons mycelix-civic mycelix-hearth mycelix-finance mycelix-governance mycelix-identity mycelix-personal mycelix-attribution; do
            echo "=== Checking $dir ==="
            (cd "$dir" && cargo fmt --all --check) || status=1
          done
          (cd crates/mycelix-bridge-common && cargo fmt --all --check) || status=1
          (cd crates/mycelix-bridge-entry-types && cargo fmt --all --check) || status=1
          exit $status

  # Per-cluster test jobs
  test-cos-conformance:
    needs: changes
    if: needs.changes.outputs.cos_conformance == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-manufacturing
      - name: Test COS conformance harness
        run: cd mycelix-manufacturing && cargo test -p cos_conformance
      - name: Generate machine-readable report
        run: cd mycelix-manufacturing && cargo run -q -p cos_conformance --bin cos-report > cos-conformance-report.json
      - name: Validate report
        run: test -s mycelix-manufacturing/cos-conformance-report.json && grep -q 'COS-CONF-001' mycelix-manufacturing/cos-conformance-report.json

  test-commons:
    needs: changes
    if: needs.changes.outputs.commons == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-commons
      - name: Test commons
        run: cd mycelix-commons && cargo test --workspace

  test-civic:
    needs: changes
    if: needs.changes.outputs.civic == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-civic
      - name: Test civic
        run: cd mycelix-civic && cargo test --workspace

  test-hearth:
    needs: changes
    if: needs.changes.outputs.hearth == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-hearth
      - name: Test hearth
        run: cd mycelix-hearth && cargo test --workspace

  test-finance:
    needs: changes
    if: needs.changes.outputs.finance == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-finance
      - name: Test finance
        run: cd mycelix-finance && cargo test --workspace

  # Separate from test-finance on purpose: this needs nix (for `hc`) and a much
  # longer timeout (a cold `holochain` crate compile alone takes ~1h without a
  # warm rust-cache), so it shouldn't share test-finance's fast 20-minute budget.
  # `tests/` is excluded from the finance Cargo workspace and every sweettest is
  # #[ignore]-gated, so `cargo test --workspace` in test-finance never runs them —
  # this job is what actually packs the DNA and exercises the SweetConductor
  # fail-closed-gate checks end to end.
  #
  # NOT yet in ci-pass's required job list: the finance zomes/types/tests this
  # job needs (e.g. tests/sweettest_sap_finality_adversarial.rs) haven't been
  # synced from the monorepo to this repo yet, so it is EXPECTED to fail until
  # that sync lands. It still runs and reports for visibility — once the
  # finance sync lands, add `test-finance-integration` to ci-pass's `needs`
  # and failure-check loop below to make it a real merge gate.
  test-finance-integration:
    name: Finance Integration (SweetConductor)
    needs: changes
    if: needs.changes.outputs.finance == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v15
        with:
          name: holochain-ci
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            mycelix-finance
            mycelix-finance/tests
      - name: Build finance zomes (wasm32)
        # hc dna pack reads dna.yaml's zome paths, which point at
        # ../target/wasm32-unknown-unknown/release/*.wasm relative to dna/ —
        # nothing builds those files on its own. Skipping this step is what
        # made "Pack finance DNA" fail with "Failed to canonicalize resource
        # path: .../recognition.wasm: No such file or directory" after a
        # real ~25-minute nix toolchain build that otherwise succeeded.
        run: |
          cd mycelix-finance && nix develop .#ci --impure --command \
            cargo build --release --target wasm32-unknown-unknown --workspace --exclude finance-leptos-types
      - name: Pack finance DNA
        # --impure: the flake's .#ci shell imports ../../nix/modules/
        # holochain-base.nix, a relative path outside mycelix-finance's own
        # flake root — flakes evaluate purely by default, so without this
        # flag `nix develop` fails immediately with "access to absolute
        # path '/nix/store/nix' is forbidden in pure evaluation mode",
        # before ever reaching `hc`. Confirmed locally: the same command
        # fails identically without --impure and proceeds to build with it.
        run: cd mycelix-finance && nix develop .#ci --impure --command hc dna pack dna/
      - name: Run SweetConductor integration tests
        run: |
          cd mycelix-finance && nix develop .#ci --impure --command bash -c "
            cd tests && cargo test -- --include-ignored --test-threads=1
          "

  test-governance:
    needs: changes
    if: needs.changes.outputs.governance == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-governance
      - name: Test governance
        run: cd mycelix-governance && cargo test --workspace

  test-identity:
    needs: changes
    if: needs.changes.outputs.identity == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-identity
      - name: Test identity
        run: cd mycelix-identity && cargo test --workspace

  test-personal:
    needs: changes
    if: needs.changes.outputs.personal == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-personal
      - name: Test personal
        run: cd mycelix-personal && cargo test --workspace

  test-attribution:
    needs: changes
    if: needs.changes.outputs.attribution == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-attribution
      - name: Test attribution
        run: cd mycelix-attribution && cargo test --workspace

  test-bridge:
    needs: changes
    if: needs.changes.outputs.bridge == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/mycelix-bridge-common
      - name: Test bridge-common
        run: cd crates/mycelix-bridge-common && cargo test --workspace
      - name: Test bridge-entry-types
        run: cd crates/mycelix-bridge-entry-types && cargo test --workspace

  test-sdk:
    needs: changes
    if: needs.changes.outputs.sdk == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-workspace/sdk
      - name: Test Rust SDK
        run: cd mycelix-workspace/sdk && cargo test --workspace
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test TypeScript SDK
        continue-on-error: true
        run: cd mycelix-workspace/sdk-ts && npm ci && npm test

  test-prism:
    needs: changes
    if: needs.changes.outputs.prism == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install system dependencies (winit/vello GUI deps for prism-shell, webkit for prism-tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-workspace
      # `cargo fmt --all` needs full-workspace `cargo metadata`, which
      # currently fails workspace-wide (mycelix-personal/crates/stress-tester
      # depends on a missing crates/luminous-sim-core -- unrelated to Prism).
      # Per-package `-p` flags avoid that full-graph walk.
      - name: Check formatting
        run: |
          cd mycelix-workspace/mycelix-prism
          cargo fmt --check \
            -p prism-common -p prism-dom -p prism-net -p prism-proxy -p prism-serve \
            -p prism-ingest -p prism-search -p prism-layout -p prism-reflex -p prism-privacy \
            -p prism-zkp -p prism-knowledge-bridge -p prism-bridge -p prism-shell -p prism-ui \
            -p prism-tauri -p prism-node
      - name: Build prism-ui for wasm32 (Trunk target)
        run: cd mycelix-workspace/mycelix-prism/prism-ui && cargo build --target wasm32-unknown-unknown
      # Each package is tested in its own `cargo test` invocation, not one
      # combined `-p a -p b -p c` command: combining prism-shell and
      # prism-ui in a single invocation triggers cross-package feature
      # unification that pulls in an incompatible naga/termcolor pairing
      # (naga 28.0.0 fails to compile against the resolved termcolor
      # version) even though each crate builds and tests cleanly alone.
      - name: Test Prism crates
        run: |
          cd mycelix-workspace/mycelix-prism
          for pkg in prism-common prism-dom prism-net prism-proxy prism-serve \
                     prism-ingest prism-search prism-layout prism-reflex prism-privacy \
                     prism-zkp prism-knowledge-bridge prism-bridge prism-shell prism-ui; do
            echo "=== Testing $pkg ==="
            cargo test -p "$pkg"
          done
      - name: Check prism-tauri (desktop shell, compile-only)
        run: cd mycelix-workspace/mycelix-prism && cargo check -p prism-tauri

  # Focused executable tests for the independent Terra Preta research audit tool.
  test-terra-preta-audit:
    needs: changes
    if: needs.changes.outputs.terra_preta_audit == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Parse Terra Preta JSON syntax
        run: |
          jq empty research/terra-preta/batch-record.schema.json
          jq empty research/terra-preta/contrast-record.schema.json
          jq empty research/terra-preta/split-manifest.schema.json
          jq empty research/terra-preta/tools/biochar-audit/audit-report.schema.json
          jq empty research/terra-preta/tools/prediction-audit/prediction-report.schema.json
          jq empty research/terra-preta/tools/split-audit/split-audit-report.schema.json
          jq empty research/terra-preta/source-register.schema.json
          jq empty research/terra-preta/tools/dependency-audit/dependency-audit-report.schema.json
          jq empty research/terra-preta/tools/water-retention-audit/curve-input.schema.json
          jq empty research/terra-preta/tools/water-retention-audit/water-retention-audit-report.schema.json
          jq empty research/terra-preta/tools/nutrient-budget-audit/nutrient-budget-input.schema.json
          jq empty research/terra-preta/tools/nutrient-budget-audit/nutrient-budget-audit-report.schema.json
          jq empty research/terra-preta/tools/coupled-event-audit/event-record.schema.json
          jq empty research/terra-preta/tools/coupled-event-audit/fixtures/synthetic-event.json
          jq empty research/terra-preta/tools/coupled-event-audit/event-audit-report.schema.json
          jq empty research/terra-preta/tools/coupled-event-audit/fixtures/synthetic-event-report.json
          jq empty research/terra-preta/neon-preferential-flow-source-plan.v0.1.json
          jq empty research/terra-preta/tools/preferential-flow-eventizer/fixtures/synthetic-one-event.json
          jq empty research/terra-preta/tools/profile-flow-audit/fixtures/synthetic-mixed-profile.json
          jq empty research/terra-preta/tools/pf-threshold-audit/fixtures/synthetic-threshold-sensitive.json
          jq empty research/terra-preta/tools/trajectory-signature-audit/fixtures/synthetic-multi-peak.json
          jq empty research/terra-preta/tools/pf-triangulation-audit/fixtures/synthetic-method-evidence.json
          jq empty research/terra-preta/tools/pore-network-audit/fixtures/synthetic-connected-network.json
          bash -n research/terra-preta/tools/acquire-public-sources.sh
          bash -n research/terra-preta/tools/acquire-neon-data.sh
          bash -n research/terra-preta/tools/inventory-neon-data.sh
          bash research/terra-preta/tools/inventory-neon-data.sh --help
      - name: Test NEON metadata inventory month guards
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/neon-inventory-month-tests"
          mkdir -p "$work"
          printf '%s\n' 'SRER' > "$work/sites.txt"
          if NEON_API_TOKEN=ci-test bash research/terra-preta/tools/inventory-neon-data.sh \
            --product DP1.00094.001 --sites-file "$work/sites.txt" \
            --start 2021-02 --end 2021-01 --release RELEASE-2026 \
            --output "$work/reversed" >"$work/reversed.log" 2>&1; then
            echo "reversed month range was unexpectedly accepted" >&2
            exit 1
          fi
          grep -q "start month is after end month" "$work/reversed.log"
          : > "$work/empty-sites.txt"
          if NEON_API_TOKEN=ci-test bash research/terra-preta/tools/inventory-neon-data.sh \
            --product DP1.00094.001 --sites-file "$work/empty-sites.txt" \
            --start 2021-01 --end 2021-01 --release RELEASE-2026 \
            --output "$work/equal-month" >"$work/equal.log" 2>&1; then
            echo "empty site list was unexpectedly accepted" >&2
            exit 1
          fi
          grep -q "sites file contained no site codes" "$work/equal.log"
      - name: Format standalone audit tools
        run: |
          cargo fmt --manifest-path research/terra-preta/tools/biochar-audit/Cargo.toml -- --check
          cargo fmt --manifest-path research/terra-preta/tools/prediction-audit/Cargo.toml -- --check
          cargo fmt --manifest-path research/terra-preta/tools/split-audit/Cargo.toml -- --check
          cargo fmt --manifest-path research/terra-preta/tools/schema-audit/Cargo.toml -- --check
          cargo fmt --manifest-path research/terra-preta/tools/dependency-audit/Cargo.toml -- --check
          cargo fmt --manifest-path research/terra-preta/tools/water-retention-audit/Cargo.toml -- --check
          cargo fmt --manifest-path research/terra-preta/tools/nutrient-budget-audit/Cargo.toml -- --check
          cargo fmt --manifest-path research/terra-preta/tools/coupled-event-audit/Cargo.toml -- --check
          cargo fmt --manifest-path research/terra-preta/tools/preferential-flow-eventizer/Cargo.toml -- --check
          cargo fmt --manifest-path research/terra-preta/tools/profile-flow-audit/Cargo.toml -- --check
          cargo fmt --manifest-path research/terra-preta/tools/pf-threshold-audit/Cargo.toml -- --check
          cargo fmt --manifest-path research/terra-preta/tools/trajectory-signature-audit/Cargo.toml -- --check
          cargo fmt --manifest-path research/terra-preta/tools/pf-triangulation-audit/Cargo.toml -- --check
          cargo fmt --manifest-path research/terra-preta/tools/morphology-audit/Cargo.toml -- --check
          cargo fmt --manifest-path research/terra-preta/tools/known-truth-generator/Cargo.toml -- --check
          cargo fmt --manifest-path research/terra-preta/tools/dynamic-macropore-audit/Cargo.toml -- --check
          cargo fmt --manifest-path research/terra-preta/tools/pore-network-audit/Cargo.toml -- --check
      - name: Test standalone audit tools and JSON Schema conformance
        run: |
          cargo test --manifest-path research/terra-preta/tools/biochar-audit/Cargo.toml
          cargo test --manifest-path research/terra-preta/tools/prediction-audit/Cargo.toml
          cargo test --manifest-path research/terra-preta/tools/split-audit/Cargo.toml
          cargo test --manifest-path research/terra-preta/tools/schema-audit/Cargo.toml
          cargo test --manifest-path research/terra-preta/tools/dependency-audit/Cargo.toml
          cargo test --manifest-path research/terra-preta/tools/water-retention-audit/Cargo.toml
          cargo test --manifest-path research/terra-preta/tools/nutrient-budget-audit/Cargo.toml
          cargo test --manifest-path research/terra-preta/tools/coupled-event-audit/Cargo.toml
          cargo test --manifest-path research/terra-preta/tools/preferential-flow-eventizer/Cargo.toml
          cargo run --manifest-path research/terra-preta/tools/preferential-flow-eventizer/Cargo.toml -- research/terra-preta/tools/preferential-flow-eventizer/fixtures/synthetic-one-event.json "$RUNNER_TEMP/terra-preta-pf-report.json"
          jq -e '.event_count == 1 and .response_detected_count == 1 and .proxy_classified_count == 1 and .events[0].response_lag_minutes == 20' "$RUNNER_TEMP/terra-preta-pf-report.json"
          cargo test --manifest-path research/terra-preta/tools/profile-flow-audit/Cargo.toml
          cargo run --manifest-path research/terra-preta/tools/profile-flow-audit/Cargo.toml -- research/terra-preta/tools/profile-flow-audit/fixtures/synthetic-mixed-profile.json "$RUNNER_TEMP/terra-preta-profile-report.json"
          jq -e '.profile_classification == "mixed_response_ordering" and .nsr_pair_count == 2 and .sequential_pair_count == 1 and .profile_coverage_status == "complete_for_declared_sensor_roster" and .response_threshold_m3_m3 == 0.01' "$RUNNER_TEMP/terra-preta-profile-report.json"
          cargo test --manifest-path research/terra-preta/tools/pf-threshold-audit/Cargo.toml
          cargo run --manifest-path research/terra-preta/tools/pf-threshold-audit/Cargo.toml -- research/terra-preta/tools/pf-threshold-audit/fixtures/synthetic-threshold-sensitive.json "$RUNNER_TEMP/terra-preta-pf-threshold-report.json"
          jq -e '.rosetta_ksat_proxy_stability == "threshold_sensitive" and .rosetta_ksat_positive_count == 2 and .rosetta_ksat_negative_count == 3 and .matrix_model_velocity_threshold_count == 3 and .matrix_model_velocity_positive_count == 1 and .matrix_model_velocity_negative_count == 2 and .matrix_model_velocity_proxy_stability == "threshold_sensitive" and .matrix_velocity_99th_proxy_stability == "single_reference_not_robustness_tested"' "$RUNNER_TEMP/terra-preta-pf-threshold-report.json"
          cargo test --manifest-path research/terra-preta/tools/trajectory-signature-audit/Cargo.toml
          cargo run --manifest-path research/terra-preta/tools/trajectory-signature-audit/Cargo.toml -- research/terra-preta/tools/trajectory-signature-audit/fixtures/synthetic-multi-peak.json "$RUNNER_TEMP/terra-preta-trajectory-report.json"
          jq -e '.maximum_rate_of_rise_m3_m3_per_hour > 0.089 and .maximum_rate_of_rise_m3_m3_per_hour < 0.091 and .trajectory_threshold_status == "above_declared_rate_threshold_proxy_only" and .coverage_status == "complete_observed_only"' "$RUNNER_TEMP/terra-preta-trajectory-report.json"
          cargo test --manifest-path research/terra-preta/tools/pf-triangulation-audit/Cargo.toml
          cargo run --manifest-path research/terra-preta/tools/pf-triangulation-audit/Cargo.toml -- research/terra-preta/tools/pf-triangulation-audit/fixtures/synthetic-method-evidence.json "$RUNNER_TEMP/terra-preta-triangulation-report.json"
          jq -e '.proxy_agree_positive_count == 1 and .proxy_disagreement_count == 1 and .velocity_only_evaluated_count == 1 and .independent_reference_count == 1 and .eligible_independent_reference_count == 0 and .unverified_review_claim_count == 1 and .physical_claim_status == "not_adjudicated_external_attestation_verifier_required" and .nsr_profile_signature == "nonsequential_response_detected"' "$RUNNER_TEMP/terra-preta-triangulation-report.json"
          cargo test --manifest-path research/terra-preta/tools/morphology-audit/Cargo.toml
          cargo run --manifest-path research/terra-preta/tools/morphology-audit/Cargo.toml -- research/terra-preta/tools/morphology-audit/fixtures/synthetic-imagej-export.csv "$RUNNER_TEMP/terra-preta-morphology-report.json" --horizon Ap1 --resolution-um 180 --area-col Area --perimeter-col 'Perim.' --min-feret-col MinFeret --feret-col Feret --angle-col FeretAngle --cross-section-area-mm2 100 --min-area-mm2 0
          jq -e '.input_object_count == 2 and .detected_object_count == 2 and .excluded_below_minimum_area_count == 0 and .summed_projected_pore_area_mm2 == 6 and .projected_pore_area_fraction == 0.06 and .feret_aspect_ratio.mean == 2 and .orientation_histogram_10deg_bins[0] == 1 and .orientation_histogram_10deg_bins[9] == 1' "$RUNNER_TEMP/terra-preta-morphology-report.json"
          cargo test --manifest-path research/terra-preta/tools/known-truth-generator/Cargo.toml
          cargo run --manifest-path research/terra-preta/tools/known-truth-generator/Cargo.toml -- research/terra-preta/tools/known-truth-generator/fixtures/connected-macropore.json "$RUNNER_TEMP/terra-preta-known-truth-manifest.json" "$RUNNER_TEMP/terra-preta-model-visible-observations.json"
          jq -e '.scenario_family == "connected_macropore" and .true_macropore_path_connected == true and .total_macropore_deep_drainage_mm > 0 and .total_macropore_deep_tracer_mg_m2 > 0 and .max_abs_water_balance_residual_mm < 1e-10 and .max_abs_tracer_balance_residual_mg_m2 < 1e-10' "$RUNNER_TEMP/terra-preta-known-truth-manifest.json"
          jq -e '.observation_schema_version == "0.1.0" and .observation_operator == "synthetic_boundary_flux_aggregation_v0.1" and .measurement_model == "perfect_noiseless_boundary_collection" and (.observations | length == 12) and (.observations | all(has("matrix_water_mm") | not)) and (.observations | all(has("macropore_water_mm") | not))' "$RUNNER_TEMP/terra-preta-model-visible-observations.json"
          cargo test --manifest-path research/terra-preta/tools/dynamic-macropore-audit/Cargo.toml
          cargo run --manifest-path research/terra-preta/tools/dynamic-macropore-audit/Cargo.toml -- research/terra-preta/tools/dynamic-macropore-audit/fixtures/synthetic-konza-like-input.json "$RUNNER_TEMP/terra-preta-dynamic-macropore-report.json"
          jq -e '.time_point_count == 3 and (.derived_geometry.dry_structural_unit_width_mm == 18) and (.time_points[0].macropore_width_mm == 2) and (.time_points[2].macropore_width_mm < .time_points[0].macropore_width_mm) and (.time_points[2].macropore_volume_fraction < .time_points[0].macropore_volume_fraction) and (.time_points | all(.[]; .whole_soil_transient_saturated_conductivity_m_s > 0)) and (.unsaturated_conductivity_status == "not_implemented_v0.1; no unsaturated conductivity claim")' "$RUNNER_TEMP/terra-preta-dynamic-macropore-report.json"
          cargo test --manifest-path research/terra-preta/tools/pore-network-audit/Cargo.toml
          cargo run --manifest-path research/terra-preta/tools/pore-network-audit/Cargo.toml -- research/terra-preta/tools/pore-network-audit/fixtures/synthetic-connected-network.json "$RUNNER_TEMP/terra-preta-pore-network-report.json"
          jq -e '.top_bottom_percolates_at_zero_threshold == true and .widest_top_bottom_path_bottleneck_radius_um == 50 and .shortest_top_bottom_path_length_um == 9900 and .shortest_path_tortuosity == 1 and .threshold_analysis[0].top_bottom_percolates == true and .threshold_analysis[1].top_bottom_percolates == true and .threshold_analysis[2].top_bottom_percolates == false' "$RUNNER_TEMP/terra-preta-pore-network-report.json"
      - name: Test grouped split manifest fail-closed checks
        run: bash research/terra-preta/tools/test-split-manifest.sh
      - name: Lint standalone audit tools
        run: |
          cargo clippy --manifest-path research/terra-preta/tools/biochar-audit/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path research/terra-preta/tools/prediction-audit/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path research/terra-preta/tools/split-audit/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path research/terra-preta/tools/schema-audit/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path research/terra-preta/tools/dependency-audit/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path research/terra-preta/tools/water-retention-audit/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path research/terra-preta/tools/nutrient-budget-audit/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path research/terra-preta/tools/coupled-event-audit/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path research/terra-preta/tools/preferential-flow-eventizer/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path research/terra-preta/tools/profile-flow-audit/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path research/terra-preta/tools/pf-threshold-audit/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path research/terra-preta/tools/trajectory-signature-audit/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path research/terra-preta/tools/pf-triangulation-audit/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path research/terra-preta/tools/morphology-audit/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path research/terra-preta/tools/known-truth-generator/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path research/terra-preta/tools/dynamic-macropore-audit/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path research/terra-preta/tools/pore-network-audit/Cargo.toml --all-targets -- -D warnings

  # Summary gate
  ci-pass:
    if: always() && !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false))
    needs:
      - format
      - test-cos-conformance
      - test-commons
      - test-civic
      - test-hearth
      - test-finance
      - test-finance-integration
      - test-governance
      - test-identity
      - test-personal
      - test-attribution
      - test-bridge
      - test-sdk
      - test-prism
      - test-terra-preta-audit
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo "Format: ${{ needs.format.result }}"
          echo "COS conformance: ${{ needs.test-cos-conformance.result }}"
          echo "Commons: ${{ needs.test-commons.result }}"
          echo "Civic: ${{ needs.test-civic.result }}"
          echo "Hearth: ${{ needs.test-hearth.result }}"
          echo "Finance: ${{ needs.test-finance.result }}"
          # Reported but not gated below — expected red until the finance
          # zomes/tests are synced from the monorepo. See the job's own comment.
          echo "Finance Integration (informational): ${{ needs.test-finance-integration.result }}"
          echo "Governance: ${{ needs.test-governance.result }}"
          echo "Identity: ${{ needs.test-identity.result }}"
          echo "Personal: ${{ needs.test-personal.result }}"
          echo "Attribution: ${{ needs.test-attribution.result }}"
          echo "Bridge: ${{ needs.test-bridge.result }}"
          echo "SDK: ${{ needs.test-sdk.result }}"
          echo "Prism: ${{ needs.test-prism.result }}"
          echo "Terra Preta audit: ${{ needs.test-terra-preta-audit.result }}"
          if [ "${{ needs.format.result }}" = "failure" ]; then exit 1; fi
          # Skipped jobs are OK (path filter didn't match)
          for result in "${{ needs.test-cos-conformance.result }}" "${{ needs.test-commons.result }}" "${{ needs.test-civic.result }}" "${{ needs.test-hearth.result }}" "${{ needs.test-finance.result }}" "${{ needs.test-governance.result }}" "${{ needs.test-identity.result }}" "${{ needs.test-personal.result }}" "${{ needs.test-attribution.result }}" "${{ needs.test-bridge.result }}" "${{ needs.test-sdk.result }}" "${{ needs.test-prism.result }}" "${{ needs.test-terra-preta-audit.result }}"; do
            if [ "$result" = "failure" ]; then exit 1; fi
          done
          echo "All checks passed!"
