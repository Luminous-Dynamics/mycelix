name: Mycelix CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

# Generic branch/PR CI is supersedable: once a newer commit exists on the same
# PR or ref, completing an older run cannot provide a current merge signal.
# Exact qualification/evidence workflows intentionally do not inherit this
# policy and retain their independent, immutable run histories.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Detect which clusters changed
  changes:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    outputs:
      commons: ${{ steps.filter.outputs.commons }}
      civic: ${{ steps.filter.outputs.civic }}
      hearth: ${{ steps.filter.outputs.hearth }}
      finance: ${{ steps.filter.outputs.finance }}
      governance: ${{ steps.filter.outputs.governance }}
      identity: ${{ steps.filter.outputs.identity }}
      personal: ${{ steps.filter.outputs.personal }}
      attribution: ${{ steps.filter.outputs.attribution }}
      bridge: ${{ steps.filter.outputs.bridge }}
      sdk: ${{ steps.filter.outputs.sdk }}
      prism: ${{ steps.filter.outputs.prism }}
      assurance: ${{ steps.filter.outputs.assurance }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            commons:
              - 'mycelix-commons/**'
              - 'crates/mycelix-bridge-*/**'
            civic:
              - 'mycelix-civic/**'
              - 'crates/mycelix-bridge-*/**'
            hearth:
              - 'mycelix-hearth/**'
              - 'crates/mycelix-bridge-*/**'
            finance:
              - 'mycelix-finance/**'
              - 'crates/mycelix-bridge-*/**'
            governance:
              - 'mycelix-governance/**'
              - 'crates/mycelix-bridge-*/**'
            identity:
              - 'mycelix-identity/**'
              - 'crates/mycelix-bridge-*/**'
            personal:
              - 'mycelix-personal/**'
              - 'crates/mycelix-bridge-*/**'
            attribution:
              - 'mycelix-attribution/**'
              - 'crates/mycelix-bridge-*/**'
            bridge:
              - 'crates/mycelix-bridge-*/**'
            sdk:
              - 'mycelix-workspace/sdk/**'
              - 'mycelix-workspace/sdk-ts/**'
            prism:
              - 'mycelix-workspace/mycelix-prism/**'
            assurance:
              - 'assurance/**'
              - 'crates/mycelix-assurance-core/**'
              - '.github/workflows/ci.yml'

  # Format check (always runs when CI is admitted)
  format:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: |
          status=0
          for dir in mycelix-commons mycelix-civic mycelix-hearth mycelix-finance mycelix-governance mycelix-identity mycelix-personal mycelix-attribution; do
            echo "=== Checking $dir ==="
            (cd "$dir" && cargo fmt --all --check) || status=1
          done
          (cd crates/mycelix-bridge-common && cargo fmt --all --check) || status=1
          (cd crates/mycelix-bridge-entry-types && cargo fmt --all --check) || status=1
          exit $status

  test-commons:
    needs: changes
    if: needs.changes.outputs.commons == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-commons
      - name: Test commons
        run: cd mycelix-commons && cargo test --workspace

  test-civic:
    needs: changes
    if: needs.changes.outputs.civic == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-civic
      - name: Test civic
        run: cd mycelix-civic && cargo test --workspace

  test-hearth:
    needs: changes
    if: needs.changes.outputs.hearth == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-hearth
      - name: Test hearth
        run: cd mycelix-hearth && cargo test --workspace

  test-finance:
    needs: changes
    if: needs.changes.outputs.finance == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-finance
      - name: Test finance
        run: cd mycelix-finance && cargo test --workspace

  # Informational until its separately documented finance sync blocker clears.
  test-finance-integration:
    name: Finance Integration (SweetConductor)
    needs: changes
    if: needs.changes.outputs.finance == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v15
        with:
          name: holochain-ci
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            mycelix-finance
            mycelix-finance/tests
      - name: Build finance zomes (wasm32)
        run: |
          cd mycelix-finance && nix develop .#ci --impure --command \
            cargo build --release --target wasm32-unknown-unknown --workspace --exclude finance-leptos-types
      - name: Pack finance DNA
        run: cd mycelix-finance && nix develop .#ci --impure --command hc dna pack dna/
      - name: Run SweetConductor integration tests
        run: |
          cd mycelix-finance && nix develop .#ci --impure --command bash -c "
            cd tests && cargo test -- --include-ignored --test-threads=1
          "

  test-governance:
    needs: changes
    if: needs.changes.outputs.governance == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-governance
      - name: Test governance
        run: cd mycelix-governance && cargo test --workspace

  test-identity:
    needs: changes
    if: needs.changes.outputs.identity == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-identity
      - name: Test identity
        run: cd mycelix-identity && cargo test --workspace

  test-personal:
    needs: changes
    if: needs.changes.outputs.personal == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-personal
      - name: Test personal
        run: cd mycelix-personal && cargo test --workspace

  test-attribution:
    needs: changes
    if: needs.changes.outputs.attribution == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-attribution
      - name: Test attribution
        run: cd mycelix-attribution && cargo test --workspace

  test-bridge:
    needs: changes
    if: needs.changes.outputs.bridge == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/mycelix-bridge-common
      - name: Test bridge-common
        run: cd crates/mycelix-bridge-common && cargo test --workspace
      - name: Test bridge-entry-types
        run: cd crates/mycelix-bridge-entry-types && cargo test --workspace

  test-sdk:
    needs: changes
    if: needs.changes.outputs.sdk == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-workspace/sdk
      - name: Test Rust SDK
        run: cd mycelix-workspace/sdk && cargo test --workspace
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test TypeScript SDK
        continue-on-error: true
        run: cd mycelix-workspace/sdk-ts && npm ci && npm test

  test-prism:
    needs: changes
    if: needs.changes.outputs.prism == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install system dependencies (winit/vello GUI deps for prism-shell, webkit for prism-tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-workspace
      - name: Check formatting
        run: |
          cd mycelix-workspace/mycelix-prism
          cargo fmt --check \
            -p prism-common -p prism-dom -p prism-net -p prism-proxy -p prism-serve \
            -p prism-ingest -p prism-search -p prism-layout -p prism-reflex -p prism-privacy \
            -p prism-zkp -p prism-knowledge-bridge -p prism-bridge -p prism-shell -p prism-ui \
            -p prism-tauri -p prism-node
      - name: Build prism-ui for wasm32 (Trunk target)
        run: cd mycelix-workspace/mycelix-prism/prism-ui && cargo build --target wasm32-unknown-unknown
      - name: Test Prism crates
        run: |
          cd mycelix-workspace/mycelix-prism
          for pkg in prism-common prism-dom prism-net prism-proxy prism-serve \
                     prism-ingest prism-search prism-layout prism-reflex prism-privacy \
                     prism-zkp prism-knowledge-bridge prism-bridge prism-shell prism-ui; do
            echo "=== Testing $pkg ==="
            cargo test -p "$pkg"
          done
      - name: Check prism-tauri (desktop shell, compile-only)
        run: cd mycelix-workspace/mycelix-prism && cargo check -p prism-tauri

  # Permanent ASSURE-002B merge gate and exact-head evidence lane. On PRs this
  # deliberately checks out the immutable PR head, while the surrounding CI jobs
  # continue to exercise GitHub's merge ref against the current base.
  test-assurance:
    name: Assurance Core
    needs: changes
    if: needs.changes.outputs.assurance == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      EXPECTED_SPEC_ROOT_SHA256: 46550610da111888f862d4bfc610f6dc41edfcbcdcd0579377e367df16486973
      EXPECTED_COVERAGE_SHA256: 32bff983f4cdc9d3393e6e4381f8ed470ca29d08e13f8bebe7d1973a3bd0c1e1
      EXPECTED_CORPUS_ROOT_SHA256: 784ff870e0b9815b015be1bbaa32f0dcc615cb3c22c614ba8bf9389fe4ccaef8
      EXPECTED_CARGO_LOCK_SHA256: 9a0babe726db931fb24087af4e1321f034e15b29a03d1b9249cd6176b3525a8b
    steps:
      - name: Check out exact assurance subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 2

      - name: Verify exact checkout and permanent-CI lineage
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          else
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          fi
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 assurance/qualification/002b/check_permanent_ci.py

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy

      - name: Verify pinned toolchain identity
        run: |
          set -euo pipefail
          rustc --version --verbose
          cargo --version
          rustc --version | grep -F 'rustc 1.98.1 '

      - name: Verify ASSURE-V1 specification root
        run: |
          set -euo pipefail
          python3 assurance/spec/v1/check_spec.py
          grep -F "spec_root_sha256 = \"$EXPECTED_SPEC_ROOT_SHA256\"" assurance/spec/v1/SPEC.lock

      - name: Verify frozen L0 corpus and coverage roots
        run: |
          set -euo pipefail
          python3 assurance/vectors/v1/l0/check_vectors.py
          grep -F "coverage_sha256 = \"$EXPECTED_COVERAGE_SHA256\"" assurance/vectors/v1/l0/manifest.toml
          grep -F "corpus_root_sha256 = \"$EXPECTED_CORPUS_ROOT_SHA256\"" assurance/vectors/v1/l0/manifest.toml

      - name: Verify dependency and trusted-surface boundary
        shell: bash
        run: |
          set -euo pipefail
          actual_lock_sha="$(sha256sum crates/mycelix-assurance-core/Cargo.lock | awk '{print $1}')"
          test "$actual_lock_sha" = "$EXPECTED_CARGO_LOCK_SHA256"
          python3 - <<'PY'
          from pathlib import Path
          import tomllib

          root = Path("crates/mycelix-assurance-core")
          manifest = tomllib.loads((root / "Cargo.toml").read_text())
          lock = tomllib.loads((root / "Cargo.lock").read_text())
          lib = (root / "src/lib.rs").read_text()

          assert manifest.get("features") == {"default": []}, "default feature set must remain empty"
          assert not (root / "build.rs").exists(), "002B must not have build.rs"
          assert "#![forbid(unsafe_code)]" in lib, "crate must continue to forbid unsafe code"
          assert manifest.get("dependencies") == {
              "cbor2": {
                  "version": "=1.1.5",
                  "default-features": False,
                  "features": ["alloc"],
              },
              "serde": {
                  "version": "=1.0.229",
                  "default-features": False,
              },
          }, "unexpected direct dependency surface"

          expected = {
              "cbor2": ("1.1.5", "86756b93a81474930c7edc4e4fab45b9cd197a50bc9775ae01450d4f621788a3"),
              "mycelix-assurance-core": ("0.1.0", None),
              "proc-macro2": ("1.0.107", "985e7ec9bb745e6ce6535b544d84d6cd6f7ad8bd711c398938ae983b91a766d9"),
              "quote": ("1.0.47", "1fbf4db142a473a8d80c26bbf18454ed458bf8d26c8219c331daecfdbd079001"),
              "serde": ("1.0.229", "4148590afebada386688f18773da617792bf2ef03ffc1e4cbd2b1d45b023e0ba"),
              "serde_core": ("1.0.229", "67dca2c9c51e58a4791a4b1ed58308b39c64224d349a935ab5039aa360942a48"),
              "serde_derive": ("1.0.229", "e7a5d71263a5a7d47b41f6b3f06ba276f10cc18b0931f1799f710578e2309348"),
              "syn": ("3.0.6", "8593e8e72159ed2257d083c7a454a85cbf854f37a0966d8d483aff8c8a3ebcee"),
              "unicode-ident": ("1.0.26", "d245f478577f809a851594d02313b640fb437e0bb33866753cff937863096954"),
          }
          observed = {p["name"]: (p["version"], p.get("checksum")) for p in lock.get("package", [])}
          assert observed == expected, f"unexpected Cargo.lock package set: {observed!r}"
          PY

      - name: Check assurance formatting
        run: cd crates/mycelix-assurance-core && cargo fmt --all --check

      - name: Check assurance crate
        run: cd crates/mycelix-assurance-core && cargo check --locked --all-targets

      - name: Test assurance crate
        run: cd crates/mycelix-assurance-core && cargo test --locked --all-targets

      - name: Clippy assurance crate
        run: cd crates/mycelix-assurance-core && cargo clippy --locked --all-targets -- -D warnings

      - name: Verify exact subject remained immutable
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Emit canonical permanent qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import subprocess
          import tomllib
          from pathlib import Path

          root = Path.cwd()
          lineage = tomllib.loads((root / "assurance/qualification/002b/lineage.toml").read_text())
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())

          def cmd(*args):
              return subprocess.check_output(args, text=True).strip()

          subject = cmd("git", "rev-parse", "HEAD")
          tree = cmd("git", "rev-parse", "HEAD^{tree}")
          if event.get("pull_request"):
              assert subject == event["pull_request"]["head"]["sha"]
              base_sha = event["pull_request"]["base"]["sha"]
          else:
              assert subject == os.environ["GITHUB_SHA"]
              base_sha = None

          workflow = root / ".github/workflows/ci.yml"
          workflow_sha256 = hashlib.sha256(workflow.read_bytes()).hexdigest()
          cargo_lock = root / "crates/mycelix-assurance-core/Cargo.lock"
          cargo_lock_sha256 = hashlib.sha256(cargo_lock.read_bytes()).hexdigest()
          assert cargo_lock_sha256 == lineage["cargo_lock_sha256"]

          receipt = {
              "schema": "mycelix.assure.002b.permanent-ci.receipt.v0.1",
              "qualification_subject_commit": subject,
              "qualification_subject_tree": tree,
              "event_base_commit": base_sha,
              "scheduler_main_ancestor": lineage["scheduler_main_ancestor"],
              "qualified_002a_commit": lineage["qualified_002a_commit"],
              "qualified_002a_receipt_sha256": lineage["qualified_002a_receipt_sha256"],
              "temporary_002b_subject_commit": lineage["temporary_002b_subject_commit"],
              "temporary_002b_subject_tree": lineage["temporary_002b_subject_tree"],
              "temporary_002b_receipt_sha256": lineage["temporary_002b_receipt_sha256"],
              "temporary_002b_artifact_digest": lineage["temporary_002b_artifact_digest"],
              "spec_root_sha256": lineage["spec_root_sha256"],
              "coverage_sha256": lineage["coverage_sha256"],
              "corpus_root_sha256": lineage["corpus_root_sha256"],
              "cargo_lock_sha256": cargo_lock_sha256,
              "workflow_path": ".github/workflows/ci.yml",
              "workflow_sha256": workflow_sha256,
              "rustc_version": cmd("rustc", "--version"),
              "cargo_version": cmd("cargo", "--version"),
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "github_event_name": os.environ["GITHUB_EVENT_NAME"],
              "runner_os": platform.system(),
              "runner_arch": platform.machine(),
              "proposition": (
                  "For the exact recorded ASSURE-002B permanent-CI subject, predecessor lineage, "
                  "specification/vector/dependency identities verify and fmt/check/test/Clippy "
                  "complete successfully under the pinned toolchain."
              ),
              "nonclaims": [
                  "L0 success establishes canonical syntax conformance only.",
                  "This receipt does not establish graph validity or evidence truth/admissibility.",
                  "This receipt establishes no effective authority or political/constitutional/moral legitimacy.",
                  "This receipt does not establish overall system safety or repository merge enforcement."
              ],
          }
          encoded = (json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n").encode()
          out_dir = Path(os.environ["RUNNER_TEMP"]) / "assure-002b"
          out_dir.mkdir(parents=True, exist_ok=True)
          out = out_dir / "assure-002b-permanent-receipt.json"
          out.write_bytes(encoded)
          digest = hashlib.sha256(encoded).hexdigest()
          (out_dir / "assure-002b-permanent-receipt.sha256").write_text(
              f"{digest}  {out.name}\n"
          )
          print(encoded.decode(), end="")
          print(f"receipt_sha256={digest}")
          PY

      - name: Preserve permanent qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assure-002b-permanent-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/assure-002b/assure-002b-permanent-receipt.json
            ${{ runner.temp }}/assure-002b/assure-002b-permanent-receipt.sha256
            crates/mycelix-assurance-core/Cargo.lock
          if-no-files-found: error
          retention-days: 30

  # Summary gate
  ci-pass:
    if: always() && !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false))
    needs:
      - changes
      - format
      - test-commons
      - test-civic
      - test-hearth
      - test-finance
      - test-finance-integration
      - test-governance
      - test-identity
      - test-personal
      - test-attribution
      - test-bridge
      - test-sdk
      - test-prism
      - test-assurance
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        shell: bash
        run: |
          set -euo pipefail

          echo "Changes: ${{ needs.changes.result }}"
          echo "Format: ${{ needs.format.result }}"
          echo "Commons: ${{ needs.test-commons.result }}"
          echo "Civic: ${{ needs.test-civic.result }}"
          echo "Hearth: ${{ needs.test-hearth.result }}"
          echo "Finance: ${{ needs.test-finance.result }}"
          echo "Finance Integration (informational): ${{ needs.test-finance-integration.result }}"
          echo "Governance: ${{ needs.test-governance.result }}"
          echo "Identity: ${{ needs.test-identity.result }}"
          echo "Personal: ${{ needs.test-personal.result }}"
          echo "Attribution: ${{ needs.test-attribution.result }}"
          echo "Bridge: ${{ needs.test-bridge.result }}"
          echo "SDK: ${{ needs.test-sdk.result }}"
          echo "Prism: ${{ needs.test-prism.result }}"
          echo "Assurance: ${{ needs.test-assurance.result }}"

          require_result() {
            local name="$1"
            local result="$2"
            if [ "$result" != "success" ]; then
              echo "Required job $name did not succeed: $result" >&2
              exit 1
            fi
          }

          require_conditional() {
            local name="$1"
            local result="$2"
            local changed="$3"
            local always_required="$4"
            if [ "$always_required" = "true" ] || [ "$changed" = "true" ]; then
              require_result "$name" "$result"
            elif [ "$result" != "skipped" ] && [ "$result" != "success" ]; then
              echo "Optional job $name had unexpected terminal result: $result" >&2
              exit 1
            fi
          }

          require_result "changes" "${{ needs.changes.result }}"
          require_result "format" "${{ needs.format.result }}"

          if [ "${{ github.event_name }}" = "push" ]; then
            push_required=true
          else
            push_required=false
          fi

          require_conditional "commons" "${{ needs.test-commons.result }}" "${{ needs.changes.outputs.commons }}" "$push_required"
          require_conditional "civic" "${{ needs.test-civic.result }}" "${{ needs.changes.outputs.civic }}" "$push_required"
          require_conditional "hearth" "${{ needs.test-hearth.result }}" "${{ needs.changes.outputs.hearth }}" "$push_required"
          require_conditional "finance" "${{ needs.test-finance.result }}" "${{ needs.changes.outputs.finance }}" "$push_required"
          require_conditional "governance" "${{ needs.test-governance.result }}" "${{ needs.changes.outputs.governance }}" "$push_required"
          require_conditional "identity" "${{ needs.test-identity.result }}" "${{ needs.changes.outputs.identity }}" "$push_required"
          require_conditional "personal" "${{ needs.test-personal.result }}" "${{ needs.changes.outputs.personal }}" "$push_required"
          require_conditional "attribution" "${{ needs.test-attribution.result }}" "${{ needs.changes.outputs.attribution }}" "$push_required"
          require_conditional "bridge" "${{ needs.test-bridge.result }}" "${{ needs.changes.outputs.bridge }}" "$push_required"
          require_conditional "sdk" "${{ needs.test-sdk.result }}" "${{ needs.changes.outputs.sdk }}" "$push_required"
          require_conditional "prism" "${{ needs.test-prism.result }}" "${{ needs.changes.outputs.prism }}" "$push_required"

          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            assurance_always_required=true
          else
            assurance_always_required=false
          fi
          require_conditional "assurance" "${{ needs.test-assurance.result }}" "${{ needs.changes.outputs.assurance }}" "$assurance_always_required"

          echo "All required checks passed!"
