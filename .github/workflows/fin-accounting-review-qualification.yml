name: FIN-ACC-REVIEW exact-head qualification

on:
  push:
    branches:
      - research/fin-accounting-review-v1
    paths:
      - "mycelix-finance/benchmarks/accounting-evidence-v1/review-subject/**"
      - ".github/workflows/fin-accounting-review-qualification.yml"
  pull_request:
    branches:
      - research/fin-acc-bench-v1
    paths:
      - "mycelix-finance/benchmarks/accounting-evidence-v1/review-subject/**"
      - ".github/workflows/fin-accounting-review-qualification.yml"

permissions:
  contents: read

concurrency:
  group: fin-accounting-review-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Exact-subject binding and role-separation structural verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QUALIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      REVIEW_DIR: mycelix-finance/benchmarks/accounting-evidence-v1/review-subject/review-verifier
    steps:
      - name: Checkout exact qualification subject
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          persist-credentials: false

      - name: Assert exact checked-out commit
        run: test "$(git rev-parse HEAD)" = "${{ env.QUALIFIED_SHA }}"

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy

      - name: Assert toolchain
        run: test "$(rustc +1.96.1 --version | awk '{print $2}')" = "1.96.1"

      - name: Format
        working-directory: ${{ env.REVIEW_DIR }}
        run: cargo fmt --all -- --check

      - name: Locked tests
        working-directory: ${{ env.REVIEW_DIR }}
        run: cargo test --locked

      - name: Warnings-denied Clippy
        working-directory: ${{ env.REVIEW_DIR }}
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Verify public structural fixtures
        working-directory: ${{ env.REVIEW_DIR }}
        run: |
          cargo run --locked -- --input ../fixtures/empty-review-events.example.json --out /tmp/review-empty.json
          cargo run --locked -- --input ../fixtures/qualified-structural-review.example.json --out /tmp/review-qualified.json
          cargo run --locked -- --input ../fixtures/self-review-blocked.example.json --out /tmp/review-self-review.json
          jq -e '.disposition == "awaiting_required_roles" and .can_approve_close == false' /tmp/review-empty.json
          jq -e '.disposition == "structurally_ready_pending_external_authority" and .external_authority_verified == false and .can_approve_close == false' /tmp/review-qualified.json
          jq -e '.disposition == "blocked_by_role_separation" and .can_approve_close == false' /tmp/review-self-review.json

      - name: Assert exact subject and clean source
        run: |
          test "$(git rev-parse HEAD)" = "${{ env.QUALIFIED_SHA }}"
          test -z "$(git status --porcelain)"

      - name: Upload exact-head review reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fin-accounting-review-${{ env.QUALIFIED_SHA }}
          path: |
            /tmp/review-empty.json
            /tmp/review-qualified.json
            /tmp/review-self-review.json
          if-no-files-found: error
