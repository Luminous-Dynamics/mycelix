name: Terra Preta rustfmt repair

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/terra-preta-rustfmt-snapshot.yml"
      - "research/terra-preta/tools/neon-swc-normalizer/src/main.rs"

permissions:
  contents: write

concurrency:
  group: terra-preta-rustfmt-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  format-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format target crate and retain exact output
        run: |
          cargo fmt --manifest-path research/terra-preta/tools/neon-swc-normalizer/Cargo.toml
          mkdir -p "$RUNNER_TEMP/rustfmt-repair"
          cp research/terra-preta/tools/neon-swc-normalizer/src/main.rs "$RUNNER_TEMP/rustfmt-repair/main.rs"
      - name: Rebase formatter result onto latest PR head without overwriting concurrent source edits
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          TARGET_FILE="research/terra-preta/tools/neon-swc-normalizer/src/main.rs"
          git fetch origin "$TARGET_BRANCH"
          LATEST_TARGET="origin/$TARGET_BRANCH"
          CHECKED_OUT_FILE=$(git rev-parse "HEAD:$TARGET_FILE")
          LATEST_FILE=$(git rev-parse "$LATEST_TARGET:$TARGET_FILE")
          if [[ "$CHECKED_OUT_FILE" != "$LATEST_FILE" ]]; then
            echo "The target source file changed during formatting; refusing to overwrite it."
            exit 1
          fi
          git reset --hard "$LATEST_TARGET"
          cp "$RUNNER_TEMP/rustfmt-repair/main.rs" "$TARGET_FILE"
          rm .github/workflows/terra-preta-rustfmt-snapshot.yml
          git add "$TARGET_FILE"
          git add .github/workflows/terra-preta-rustfmt-snapshot.yml
          if git diff --cached --quiet; then
            echo "No formatter changes were necessary."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(terra-preta): apply exact runner rustfmt to NEON normalizer"
          git push origin "HEAD:${TARGET_BRANCH}"
