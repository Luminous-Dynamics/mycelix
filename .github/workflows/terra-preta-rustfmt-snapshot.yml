name: Terra Preta rustfmt repair

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/terra-preta-rustfmt-snapshot.yml"
      - "research/terra-preta/tools/neon-swc-normalizer/src/main.rs"

permissions:
  contents: write

concurrency:
  group: terra-preta-rustfmt-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  format-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt to the identified crate
        run: cargo fmt --manifest-path research/terra-preta/tools/neon-swc-normalizer/Cargo.toml
      - name: Commit exact formatter output and remove this temporary workflow
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/terra-preta-rustfmt-snapshot.yml
          git add research/terra-preta/tools/neon-swc-normalizer/src/main.rs
          git add .github/workflows/terra-preta-rustfmt-snapshot.yml
          if git diff --cached --quiet; then
            echo "No formatter changes were necessary."
            exit 0
          fi
          git commit -m "style(terra-preta): apply exact runner rustfmt to NEON normalizer"
          git push origin "HEAD:${TARGET_BRANCH}"
