name: Business Hospitality Strong Field

on:
  pull_request:
    paths:
      - 'crates/mycelix-business-hospitality-strong-field/**'
      - 'crates/mycelix-business-time-evidence/**'
      - 'crates/mycelix-business-campaign-integrity/**'
      - 'crates/mycelix-business-import-membership/**'
      - 'crates/mycelix-business-import-diagnostics/**'
      - 'crates/mycelix-business-pilot-hospitality/**'
      - 'crates/mycelix-business-field-qualification/**'
      - 'crates/mycelix-business-shadow/**'
      - 'crates/mycelix-business-adapter-delimited/**'
      - 'crates/mycelix-business-ingress/**'
      - 'crates/mycelix-business-core/**'
      - '.github/workflows/business-hospitality-strong-field.yml'
  push:
    branches:
      - main
      - feat/business-hospitality-strong-field-v0-1
    paths:
      - 'crates/mycelix-business-hospitality-strong-field/**'
      - 'crates/mycelix-business-time-evidence/**'
      - 'crates/mycelix-business-campaign-integrity/**'
      - 'crates/mycelix-business-import-membership/**'
      - 'crates/mycelix-business-import-diagnostics/**'
      - 'crates/mycelix-business-pilot-hospitality/**'
      - 'crates/mycelix-business-field-qualification/**'
      - 'crates/mycelix-business-shadow/**'
      - 'crates/mycelix-business-adapter-delimited/**'
      - 'crates/mycelix-business-ingress/**'
      - 'crates/mycelix-business-core/**'
      - '.github/workflows/business-hospitality-strong-field.yml'

permissions:
  contents: read

jobs:
  strong-hospitality-field:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/mycelix-business-hospitality-strong-field
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
