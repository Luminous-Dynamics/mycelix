name: Pulse Standards Registry

on:
  push:
    branches: [main]
    paths:
      - "mycelix-workspace/mycelix-pulse/standards-registry/**"
      - "mycelix-workspace/mycelix-pulse/benchmarks/**"
      - "mycelix-workspace/mycelix-pulse/docs/MULTI_TRANSPORT_INTEROPERABILITY_RFC.md"
      - "mycelix-workspace/mycelix-pulse/docs/TRANSPORT_BENCHMARKS.md"
      - "mycelix-workspace/mycelix-pulse/justfile"
      - ".github/workflows/pulse-standards-registry.yml"
  pull_request:
    branches: [main]
    paths:
      - "mycelix-workspace/mycelix-pulse/standards-registry/**"
      - "mycelix-workspace/mycelix-pulse/benchmarks/**"
      - "mycelix-workspace/mycelix-pulse/docs/MULTI_TRANSPORT_INTEROPERABILITY_RFC.md"
      - "mycelix-workspace/mycelix-pulse/docs/TRANSPORT_BENCHMARKS.md"
      - "mycelix-workspace/mycelix-pulse/justfile"
      - ".github/workflows/pulse-standards-registry.yml"

permissions:
  contents: read

concurrency:
  group: pulse-standards-registry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  registry:
    name: Exact-head registry contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Initialize evidence directory
        working-directory: mycelix-workspace/mycelix-pulse
        run: mkdir -p evidence/standards-registry-ci

      - name: Check Rust formatting
        working-directory: mycelix-workspace/mycelix-pulse
        run: cargo fmt --manifest-path standards-registry/validator/Cargo.toml -- --check

      - name: Run validator negative controls
        working-directory: mycelix-workspace/mycelix-pulse
        run: |
          set -o pipefail
          cargo test --manifest-path standards-registry/validator/Cargo.toml 2>&1 | tee evidence/standards-registry-ci/cargo-test.log

      - name: Validate checked-in registry
        working-directory: mycelix-workspace/mycelix-pulse
        run: |
          cargo run --manifest-path standards-registry/validator/Cargo.toml -- \
            --registry standards-registry/registry.v1.json \
            --schema standards-registry/schema.v1.json \
            --json > evidence/standards-registry-ci/registry-validation.json
          cat evidence/standards-registry-ci/registry-validation.json

      - name: Run deterministic route-policy replay
        working-directory: mycelix-workspace/mycelix-pulse
        run: |
          cargo run --manifest-path standards-registry/validator/Cargo.toml --bin route-sim -- \
            --traces benchmarks/traces.v1.json --messages 10000 --seed 20261016 \
            > evidence/standards-registry-ci/simulation-report.json
          cat evidence/standards-registry-ci/simulation-report.json

      - name: Record subject and input hashes
        if: always()
        working-directory: mycelix-workspace/mycelix-pulse
        run: |
          mkdir -p evidence/standards-registry-ci
          git rev-parse HEAD > evidence/standards-registry-ci/subject.sha
          rustc --version > evidence/standards-registry-ci/toolchain.txt
          cargo --version >> evidence/standards-registry-ci/toolchain.txt
          {
            for input in \
              standards-registry/schema.v1.json \
              standards-registry/registry.v1.json \
              standards-registry/validator/Cargo.toml \
              standards-registry/validator/src/lib.rs \
              standards-registry/validator/src/main.rs \
              standards-registry/validator/src/simulation.rs \
              standards-registry/validator/src/bin/route-sim.rs \
              benchmarks/traces.v1.json \
              standards-registry/validator/Cargo.lock
            do
              if [ -f "$input" ]; then
                sha256sum "$input"
              else
                echo "MISSING $input"
              fi
            done
          } > evidence/standards-registry-ci/input-sha256.txt
          if [ -f standards-registry/validator/Cargo.lock ]; then
            cp standards-registry/validator/Cargo.lock evidence/standards-registry-ci/validator.Cargo.lock
          fi

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-standards-registry-${{ github.run_id }}-${{ github.run_attempt }}
          path: mycelix-workspace/mycelix-pulse/evidence/standards-registry-ci/
          if-no-files-found: warn
          retention-days: 30
