name: Business Execution Revalidation

on:
  pull_request:
    paths:
      - 'crates/mycelix-business-core/**'
      - 'crates/mycelix-business-coordination/**'
      - 'crates/mycelix-business-decision/**'
      - 'crates/mycelix-business-revalidation/**'
      - '.github/workflows/business-revalidation.yml'
  push:
    branches:
      - main
      - 'feat/business-execution-revalidation-*'
    paths:
      - 'crates/mycelix-business-core/**'
      - 'crates/mycelix-business-coordination/**'
      - 'crates/mycelix-business-decision/**'
      - 'crates/mycelix-business-revalidation/**'
      - '.github/workflows/business-revalidation.yml'

permissions:
  contents: read

jobs:
  business-revalidation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path crates/mycelix-business-revalidation/Cargo.toml --all --check
      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-business-revalidation/Cargo.toml --all-targets -- -D warnings
      - name: Test execution revalidation contracts
        run: cargo test --manifest-path crates/mycelix-business-revalidation/Cargo.toml --all-targets
