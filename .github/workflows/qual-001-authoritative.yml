name: QUAL-001 Independent Static Subject Verification

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: qual-001-static-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Independent verifier / static subject profile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require same-repository subject for v0.1
        shell: bash
        run: |
          set -euo pipefail
          test '${{ github.event.pull_request.head.repo.full_name }}' = '${{ github.repository }}'

      - name: Checkout independently owned verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}
          path: verifier

      - name: Checkout hostile subject as data only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: subject

      - name: Freeze exact verifier and subject identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C verifier rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git -C subject rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git -C verifier rev-parse HEAD
          git -C verifier rev-parse HEAD^{tree}
          git -C subject rev-parse HEAD
          git -C subject rev-parse HEAD^{tree}

      - name: Verify hostile subject using verifier-owned policy only
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/qual-001-receipt.json"
          python3 -B verifier/qualification/qual-001/verifier_v0_1.py \
            --verifier-root verifier \
            --subject-root subject \
            --manifest verifier/qualification/qual-001/gate-manifest-v0.1.json \
            --bundle-manifest verifier/qualification/qual-001/verifier-bundle-v0.1.json \
            --expected-verifier-head "${{ github.sha }}" \
            --subject-base "${{ github.event.pull_request.base.sha }}" \
            --subject-head "${{ github.event.pull_request.head.sha }}" \
            --receipt-out "$receipt"
          test -s "$receipt"
          echo "QUAL_001_RECEIPT_PATH=$receipt" >> "$GITHUB_ENV"

      - name: Immutable dual-checkout postflight
        shell: bash
        run: |
          set -euo pipefail
          verifier_status="$(git -C verifier status --short)"
          subject_status="$(git -C subject status --short)"
          printf 'verifier status: %s\n' "$verifier_status"
          printf 'subject status: %s\n' "$subject_status"
          test -z "$verifier_status"
          test -z "$subject_status"

      - name: Emit successful independent-verifier receipt
        shell: bash
        run: |
          set -euo pipefail
          test -s "$QUAL_001_RECEIPT_PATH"
          test -z "$(git -C verifier status --short)"
          test -z "$(git -C subject status --short)"
          receipt_json="$(cat "$QUAL_001_RECEIPT_PATH")"
          echo "QUAL_001_RECEIPT_JSON=$receipt_json"
