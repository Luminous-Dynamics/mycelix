name: One-shot Format Current Authority

on:
  push:
    branches:
      - 'security/governance-current-executor-authority-v0.1'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: security/governance-current-executor-authority-v0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Format exact current-authority subject
        run: cargo fmt --manifest-path crates/mycelix-governance-current-executor-authority/Cargo.toml
      - name: Refuse unexpected formatter scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          if [[ -z "$changed" ]]; then
            echo 'No formatting changes required.'
            exit 0
          fi
          expected='crates/mycelix-governance-current-executor-authority/src/lib.rs'
          if [[ "$changed" != "$expected" ]]; then
            echo 'rustfmt changed an unexpected path:' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
      - name: Commit exact rustfmt output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/mycelix-governance-current-executor-authority/src/lib.rs
          git commit -m 'style(governance): rustfmt current authority kernel'
          git push origin HEAD:security/governance-current-executor-authority-v0.1
