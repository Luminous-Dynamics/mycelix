name: IAE to LISE Conformance

on:
  pull_request:
    branches:
      - main
      - research/ipb-finality-reference-v0.1-rebased
    paths:
      - "lise-benchmarks/iae-lise-conformance/**"
      - "lise-benchmarks/ipb-finality-reference/**"
      - ".github/workflows/iae-lise-conformance.yml"

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      EXPECTED_SUBJECT_SHA: ${{ github.event.pull_request.head.sha }}
      MANIFEST: lise-benchmarks/iae-lise-conformance/Cargo.toml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact PR subject
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SUBJECT_SHA"
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path "$MANIFEST" --check
      - name: Check all targets
        run: cargo check --all-targets --manifest-path "$MANIFEST"
      - name: Run conformance tests
        run: cargo test --all-targets --manifest-path "$MANIFEST"
      - name: Strict Clippy
        run: cargo clippy --all-targets --manifest-path "$MANIFEST" -- -D warnings
      - name: Replay frozen vertical slice
        run: |
          cargo run --manifest-path "$MANIFEST" --             lise-benchmarks/iae-lise-conformance/fixtures/iae-v0.2-fixture.json             lise-benchmarks/iae-lise-conformance/fixtures/iae-v0.2-reference-submission.json             /tmp/iae-lise-conformance.json
          test -s /tmp/iae-lise-conformance.json
          jq -e '.conformant == true and .dispatch_eligible == false' /tmp/iae-lise-conformance.json
      - name: Reassert exact subject and tracked source
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SUBJECT_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
