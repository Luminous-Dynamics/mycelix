name: Regional policy kernel

on:
  push:
    branches:
      - "feat/region-policy-core-v1"
    paths:
      - "mycelix-workspace/crates/mycelix-region-policy/**"
      - "mycelix-workspace/Cargo.toml"
      - ".github/workflows/region-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regional-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mycelix-workspace/crates/mycelix-region-policy
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate machine-readable effect fault corpus
        run: |
          jq -e '
            .corpus_id == "MYCELIX-EFFECT-JOURNAL-FAULT-CORPUS" and
            (.cases | length == 24) and
            ([.cases[].id] | unique | length == 24) and
            .phase_model == ["Prepared", "Reserved", "DispatchStarted", "OutcomeUnknown", "Committed", "Rejected"]
          ' EFFECT_JOURNAL_FAULT_CORPUS_V1.json >/dev/null
          jq -e '.required | index("cases") != null' EFFECT_JOURNAL_FAULT_CORPUS_V1.schema.json >/dev/null
      - name: Formatting
        run: cargo fmt --all --check
      - name: Unit and adversarial policy tests
        run: cargo test --locked
      - name: Warnings-denied Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Compile native benchmark
        run: cargo bench --no-run --locked