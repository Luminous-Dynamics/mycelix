name: SSF Canonical Replay Evidence Decision Subject

on:
  pull_request:
    paths:
      - 'mycelix-workspace/crates/mycelix-ssf-actuator-effect-protocol/**'
      - 'mycelix-workspace/crates/mycelix-ssf-canonical-actuator-execution/**'
      - 'mycelix-workspace/crates/mycelix-ssf-canonical-completed-effect-evidence/**'
      - 'mycelix-workspace/crates/mycelix-ssf-canonical-completed-outcome-history/**'
      - 'mycelix-workspace/crates/mycelix-ssf-no-third-attempt-provenance-gate/**'
      - 'mycelix-workspace/crates/mycelix-ssf-canonical-replay-evidence-subject/**'
      - 'mycelix-workspace/crates/mycelix-ssf-canonical-replay-evidence-qualification-request/**'
      - 'mycelix-workspace/crates/mycelix-ssf-canonical-replay-evidence-decision-subject/**'
      - '.github/workflows/ssf-canonical-replay-evidence-decision-subject.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-workspace/crates/mycelix-ssf-actuator-effect-protocol/**'
      - 'mycelix-workspace/crates/mycelix-ssf-canonical-actuator-execution/**'
      - 'mycelix-workspace/crates/mycelix-ssf-canonical-completed-effect-evidence/**'
      - 'mycelix-workspace/crates/mycelix-ssf-canonical-completed-outcome-history/**'
      - 'mycelix-workspace/crates/mycelix-ssf-no-third-attempt-provenance-gate/**'
      - 'mycelix-workspace/crates/mycelix-ssf-canonical-replay-evidence-subject/**'
      - 'mycelix-workspace/crates/mycelix-ssf-canonical-replay-evidence-qualification-request/**'
      - 'mycelix-workspace/crates/mycelix-ssf-canonical-replay-evidence-decision-subject/**'
      - '.github/workflows/ssf-canonical-replay-evidence-decision-subject.yml'

permissions:
  contents: read

jobs:
  replay-evidence-decision-subject:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Format
        run: cargo fmt --manifest-path mycelix-workspace/crates/mycelix-ssf-canonical-replay-evidence-decision-subject/Cargo.toml -- --check
      - name: Native check
        run: cargo check --manifest-path mycelix-workspace/crates/mycelix-ssf-canonical-replay-evidence-decision-subject/Cargo.toml --all-targets
      - name: no_std WASM check
        run: cargo check --manifest-path mycelix-workspace/crates/mycelix-ssf-canonical-replay-evidence-decision-subject/Cargo.toml --lib --target wasm32-unknown-unknown
      - name: Tests
        run: cargo test --manifest-path mycelix-workspace/crates/mycelix-ssf-canonical-replay-evidence-decision-subject/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --manifest-path mycelix-workspace/crates/mycelix-ssf-canonical-replay-evidence-decision-subject/Cargo.toml --all-targets -- -D warnings
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --manifest-path mycelix-workspace/crates/mycelix-ssf-canonical-replay-evidence-decision-subject/Cargo.toml --no-deps
