name: Governance Public Election Verifier Resource Envelope v1

on:
  pull_request:
    paths:
      - '.github/workflows/governance-public-election-verifier-resource-envelope-v1.yml'
      - 'mycelix-governance/crates/election-verifier-resource-envelope/**'
      - 'mycelix-governance/docs/PUBLIC_ELECTION_VERIFIER_RESOURCE_ENVELOPE_V1.md'

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: '1.96.0'
  BASE_SHA: '0bff290f769fbfb0b253e56a0e7d25f07f527fda'

jobs:
  qualify:
    name: Qualify bounded verifier resource envelope
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/governance-public-election-verifier-resource-envelope-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Bind exact ELECT-013 delta
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          test "${#changed[@]}" -eq 4
          printf '%s\n' "${changed[@]}" | sort > /tmp/elect-013-files.txt
          cat > /tmp/elect-013-expected.txt <<'EOF'
          .github/workflows/governance-public-election-verifier-resource-envelope-v1.yml
          mycelix-governance/crates/election-verifier-resource-envelope/Cargo.toml
          mycelix-governance/crates/election-verifier-resource-envelope/src/lib.rs
          mycelix-governance/docs/PUBLIC_ELECTION_VERIFIER_RESOURCE_ENVELOPE_V1.md
          EOF
          sort -o /tmp/elect-013-expected.txt /tmp/elect-013-expected.txt
          diff -u /tmp/elect-013-expected.txt /tmp/elect-013-files.txt
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt,clippy

      - name: Format ELECT-013 crate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path mycelix-governance/crates/election-verifier-resource-envelope/Cargo.toml -- --check

      - name: Generate exact dependency lock
        shell: bash
        run: |
          set -euo pipefail
          cd mycelix-governance/crates/election-verifier-resource-envelope
          cargo generate-lockfile
          cp Cargo.lock /tmp/elect-013-Cargo.lock
          sha256sum Cargo.lock | tee /tmp/elect-013-lock.sha256
          cargo metadata --locked --format-version 1 > /tmp/elect-013-metadata.json

      - name: Execute resource-envelope tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path mycelix-governance/crates/election-verifier-resource-envelope/Cargo.toml --locked 2>&1 | tee /tmp/elect-013-test.log

      - name: Run warning-fatal library Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path mycelix-governance/crates/election-verifier-resource-envelope/Cargo.toml --locked --lib -- -D warnings 2>&1 | tee /tmp/elect-013-clippy.log

      - name: Audit resource-safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          src='mycelix-governance/crates/election-verifier-resource-envelope/src/lib.rs'
          grep -F 'ElectionVerificationResourcePolicyV1' "$src"
          grep -F 'VerifierResourceCapabilityV1' "$src"
          grep -F 'EvidencePackagePreflightHeaderV1' "$src"
          grep -F 'DeclaredArtifactBytesOverflow' "$src"
          grep -F 'BlockIndeterminate' "$src"
          grep -F 'ContainerByteLengthMismatch' "$src"
          grep -F 'ExpandedBytesBelowDeclaredArtifactBytes' "$src"
          grep -F 'ArtifactLimitExceedsPackageContract' "$src"
          if grep -Eq 'SystemTime|thread_rng|std::net|reqwest|tokio::net' "$src"; then
            echo 'ELECT-013 must remain deterministic and offline' >&2
            exit 1
          fi
          if grep -Eq '^use (hdk|hdi|voting_integrity)' "$src"; then
            echo 'ELECT-013 must remain runtime independent' >&2
            exit 1
          fi

      - name: Remove transient lock and prove immutable checkout
        if: always()
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          rm -f mycelix-governance/crates/election-verifier-resource-envelope/Cargo.lock
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git status --porcelain=v1 --untracked-files=all > /tmp/elect-013-status.txt
          test ! -s /tmp/elect-013-status.txt

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: elect-013-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: |
            /tmp/elect-013-Cargo.lock
            /tmp/elect-013-lock.sha256
            /tmp/elect-013-metadata.json
            /tmp/elect-013-test.log
            /tmp/elect-013-clippy.log
            /tmp/elect-013-status.txt
          if-no-files-found: warn
          retention-days: 30
