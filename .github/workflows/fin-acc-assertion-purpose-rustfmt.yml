name: FIN-ACC assertion-purpose rustfmt source export

on:
  push:
    branches:
      - research/fin-acc-assertion-contract-v1
    paths:
      - ".github/workflows/fin-acc-assertion-purpose-rustfmt.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: true
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.96.1
          components: rustfmt
      - name: Format verifier
        working-directory: mycelix-finance/benchmarks/accounting-evidence-v1/assertion-purpose-v1/verifier
        run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          git add mycelix-finance/benchmarks/accounting-evidence-v1/assertion-purpose-v1/verifier/src/lib.rs mycelix-finance/benchmarks/accounting-evidence-v1/assertion-purpose-v1/verifier/src/main.rs
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(finance-bench): format assertion-purpose verifier"
            git push origin HEAD:refs/heads/research/fin-acc-assertion-contract-v1
          fi
