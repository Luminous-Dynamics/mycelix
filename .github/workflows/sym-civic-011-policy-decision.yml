name: SYM-CIVIC-011 Policy Decision
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'mycelix-workspace/docs/civic-resilience/sym_civic_011_policy_decision.json'
      - 'mycelix-workspace/docs/civic-resilience/SYM_CIVIC_011_POLICY_DECISION_V1.md'
      - 'scripts/qualification/sym_civic_011_policy_decision_v1.py'
      - '.github/workflows/sym-civic-011-policy-decision.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Monotonic policy-decision provenance boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact ancestry and clean subject
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='6e49198c934ff7d215134c9ccbcd3f3951982128'
          test "$(git merge-base HEAD "$EXPECTED_PARENT")" = "$EXPECTED_PARENT"
          printf 'HEAD=%s\nPARENT=%s\nMERGE_BASE=%s\n' "$(git rev-parse HEAD)" "$EXPECTED_PARENT" "$(git merge-base HEAD "$EXPECTED_PARENT")"
          test -z "$(git status --short)"
      - name: Exact decision tranche
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='6e49198c934ff7d215134c9ccbcd3f3951982128'
          git diff --check "$EXPECTED_PARENT" HEAD
          expected=' .github/workflows/sym-civic-011-policy-decision.yml
          mycelix-workspace/docs/civic-resilience/SYM_CIVIC_011_POLICY_DECISION_V1.md
          mycelix-workspace/docs/civic-resilience/sym_civic_011_policy_decision.json
          scripts/qualification/sym_civic_011_policy_decision_v1.py'
          expected="${expected# }"
          actual="$(git diff --name-only "$EXPECTED_PARENT" HEAD | sort)"
          test "$actual" = "$expected"
      - name: Compile qualifier
        run: python3 -c 'from pathlib import Path; compile(Path("scripts/qualification/sym_civic_011_policy_decision_v1.py").read_text(encoding="utf-8"), "sym_civic_011_policy_decision_v1.py", "exec")'
      - name: Execute qualifier
        run: python3 scripts/qualification/sym_civic_011_policy_decision_v1.py
      - name: Static no-runtime audit
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='6e49198c934ff7d215134c9ccbcd3f3951982128'
          changed="$(git diff --name-only "$EXPECTED_PARENT" HEAD)"
          if printf '%s' "$changed" | grep -E '[.]rs$|[.]toml$|[.]lock$'; then
            echo 'SYM-CIVIC-011 is research provenance only' >&2
            exit 1
          fi
      - name: Immutable checkout postflight
        run: test -z "$(git status --short)"
