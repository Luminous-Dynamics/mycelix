name: SAP Payment Overflow Qualification

on:
  pull_request:
    paths:
      - 'mycelix-finance/zomes/payments/coordinator/src/lib.rs'
      - 'mycelix-workspace/mycelix-finance/zomes/payments/coordinator/src/lib.rs'
      - '.github/workflows/sap-payment-overflow-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-finance/zomes/payments/coordinator/src/lib.rs'
      - '.github/workflows/sap-payment-overflow-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sap-overflow:
    name: SAP amount-plus-fee arithmetic gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup target add wasm32-unknown-unknown --toolchain 1.96.0
          rustup default 1.96.0
          rustc --version
          cargo --version

      - name: Check Finance formatting
        run: cargo fmt --manifest-path mycelix-finance/Cargo.toml --all -- --check

      - name: Run payment coordinator tests
        run: cargo test --locked --manifest-path mycelix-finance/Cargo.toml -p payments

      - name: Run Clippy
        run: cargo clippy --locked --manifest-path mycelix-finance/Cargo.toml -p payments --all-targets -- -D warnings

      - name: Build payment coordinator WASM
        run: cargo build --locked --manifest-path mycelix-finance/Cargo.toml --target wasm32-unknown-unknown --release -p payments
