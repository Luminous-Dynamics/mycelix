name: Identity Authority-Scoped Verification Record V2

on:
  pull_request:
    paths:
      - 'mycelix-workspace/mycelix-identity/Cargo.toml'
      - 'mycelix-workspace/mycelix-identity/crates/authority-scoped-verifier-key-generation-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/kvector-verification-record-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/authority-scoped-kvector-verification-record-policy/**'
      - '.github/workflows/identity-authority-scoped-verification-record-v2.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-workspace/mycelix-identity/Cargo.toml'
      - 'mycelix-workspace/mycelix-identity/crates/authority-scoped-verifier-key-generation-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/kvector-verification-record-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/authority-scoped-kvector-verification-record-policy/**'
      - '.github/workflows/identity-authority-scoped-verification-record-v2.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify-authority-scoped-record-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Assert authority-scoped signed-record boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          root = Path('mycelix-workspace/mycelix-identity')
          member = 'crates/authority-scoped-kvector-verification-record-policy'
          workspace = tomllib.loads((root / 'Cargo.toml').read_text())
          if member not in workspace['workspace']['members']:
              raise SystemExit(f'ERROR: {member} is not an explicit Identity workspace member')

          manifest = tomllib.loads((root / member / 'Cargo.toml').read_text())
          deps = manifest.get('dependencies', {})
          expected = {
              'mycelix-authority-scoped-verifier-key-generation-policy',
              'mycelix-kvector-verification-record-policy',
              'mycelix-kvector-verifier-key-generation-policy',
              'sha2',
          }
          if set(deps) != expected:
              raise SystemExit(f'ERROR: authority-scoped record dependency drift: {sorted(deps)}')
          expected_paths = {
              'mycelix-authority-scoped-verifier-key-generation-policy': '../authority-scoped-verifier-key-generation-policy',
              'mycelix-kvector-verification-record-policy': '../kvector-verification-record-policy',
              'mycelix-kvector-verifier-key-generation-policy': '../kvector-verifier-key-generation-policy',
          }
          for name, path in expected_paths.items():
              if deps[name].get('path') != path:
                  raise SystemExit(f'ERROR: {name} path drifted: {deps[name]}')
          if deps['sha2'].get('workspace') is not True:
              raise SystemExit('ERROR: authority-scoped record must use workspace sha2')

          text = (root / member / 'src/lib.rs').read_text()
          required = [
              '#![forbid(unsafe_code)]',
              'AuthorityScopedKVectorProofVerificationRecordBodyV2',
              'QualifiedAuthorityScopedVerifierKeyGenerationV2',
              'AUTHORITY_SCOPED_KVECTOR_VERIFICATION_RECORD_DOMAIN_V2',
              'mycelix:identity:kvector-verification-record:authority-scoped:v2\\0',
              'derive_kvector_verification_record_signing_digest_v2',
              'derive_authority_scoped_kvector_verification_record_signing_digest_v2',
              'validate_authority_scoped_kvector_verification_record_binding_v2',
              'validate_kvector_verification_record_key_generation_binding_v2',
              'body.authority_domain_sha256 != scoped_generation.authority_domain_digest_sha256()',
              'body.base_record.verifier_key_generation_sha256',
              'scoped_generation.intrinsic_generation_digest_sha256()',
              'body.verifier_key_generation_scoped_sha256',
              'scoped_generation.scoped_generation_digest_sha256()',
              'cross_domain_replay_fails_binding_and_changes_signed_digest',
              'scoped_generation_substitution_fails_closed',
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'ERROR: authority-scoped record theorem missing: {needle!r}')

          lower = text.lower()
          for forbidden in [
              'use hdk', 'use hdi', 'hdk::', 'hdi::', 'dna_info(', 'network_seed',
              'sys_time(', 'std::time', '.verify(', 'policy_current', 'policy_accepted',
              'positive_evidence', 'resolve_did(', 'max_by_key',
          ]:
              if forbidden in lower:
                  raise SystemExit(f'ERROR: runtime/currentness/signature authority leaked into scoped record: {forbidden!r}')
          PY

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-workspace/mycelix-identity

      - name: Check formatting
        run: |
          cargo fmt --manifest-path mycelix-workspace/mycelix-identity/crates/authority-scoped-kvector-verification-record-policy/Cargo.toml -- --check

      - name: Test upstream scoped generation
        run: |
          cargo test --manifest-path mycelix-workspace/mycelix-identity/crates/authority-scoped-verifier-key-generation-policy/Cargo.toml

      - name: Test upstream generation-bound record
        run: |
          cargo test --manifest-path mycelix-workspace/mycelix-identity/crates/kvector-verification-record-policy/Cargo.toml

      - name: Test authority-scoped record
        run: |
          cargo test --manifest-path mycelix-workspace/mycelix-identity/crates/authority-scoped-kvector-verification-record-policy/Cargo.toml

      - name: Check authority-scoped record for wasm32
        run: |
          cargo check --manifest-path mycelix-workspace/mycelix-identity/crates/authority-scoped-kvector-verification-record-policy/Cargo.toml --target wasm32-unknown-unknown
