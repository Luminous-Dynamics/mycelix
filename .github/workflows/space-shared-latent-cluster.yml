name: Space shared-latent cluster estimator

on:
  push:
    branches:
      - "research/space-shared-latent-cluster-v0-1"
    paths:
      - "mycelix-workspace/mycelix-space/tools/space-shared-latent-cluster/**"
      - ".github/workflows/space-shared-latent-cluster.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-space-shared-latent-cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Format and commit deterministic Rust formatting on branch push
        if: github.event_name == 'push'
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          manifest="mycelix-workspace/mycelix-space/tools/space-shared-latent-cluster/Cargo.toml"
          source="mycelix-workspace/mycelix-space/tools/space-shared-latent-cluster/src/lib.rs"
          cargo fmt --manifest-path "$manifest"
          if ! git diff --quiet -- "$source"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$source"
            git commit -m "style(space): format shared-latent cluster reference"
            git push origin "HEAD:$BRANCH_NAME"
          fi

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path mycelix-workspace/mycelix-space/tools/space-shared-latent-cluster/Cargo.toml -- --check

      - name: Run locked shared-latent tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path mycelix-workspace/mycelix-space/tools/space-shared-latent-cluster/Cargo.toml
