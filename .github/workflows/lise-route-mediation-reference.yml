name: LISE Route Mediation Reference

on:
  pull_request:
    branches:
      - main
    paths:
      - "lise-benchmarks/route-mediation-reference/**"
      - ".github/workflows/lise-route-mediation-reference.yml"

permissions:
  contents: read

jobs:
  route-mediation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      EXPECTED_SUBJECT_SHA: ${{ github.event.pull_request.head.sha }}
      MANIFEST: lise-benchmarks/route-mediation-reference/Cargo.toml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact PR subject
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SUBJECT_SHA"
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - name: Validate fixture and schema JSON
        run: jq empty lise-benchmarks/route-mediation-reference/fixtures/*.json
      - name: Check formatting
        run: cargo fmt --manifest-path "$MANIFEST" --check
      - name: Check all targets
        run: cargo check --all-targets --manifest-path "$MANIFEST"
      - name: Run route mediation tests
        run: cargo test --all-targets --manifest-path "$MANIFEST"
      - name: Strict Clippy
        run: cargo clippy --all-targets --manifest-path "$MANIFEST" -- -D warnings
      - name: Replay frozen bypass fixture
        run: |
          cargo run --manifest-path "$MANIFEST" --             lise-benchmarks/route-mediation-reference/fixtures/route-inventory.json             /tmp/route-mediation-report.json
          jq -e '.status == "BYPASS_DETECTED" and .unmediated_path_count == 2 and .dispatch_eligible == false' /tmp/route-mediation-report.json
      - name: Reassert exact subject and tracked source
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SUBJECT_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
