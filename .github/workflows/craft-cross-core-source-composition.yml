name: Craft exact-head cross-core source composition

on:
  push:
    branches:
      - research/craft-cross-core-source-composition-v0.1-20261127
      - research/craft-water-ocel-interoperability-v0.1-20261127
    paths:
      - 'mycelix-workspace/mycelix-craft/benchmarks/cross-core-source-composition-v1/**'
      - '.github/workflows/craft-cross-core-source-composition.yml'
  pull_request:
    branches:
      - main
      - research/craft-cross-core-source-composition-v0.1-20261127
    paths:
      - 'mycelix-workspace/mycelix-craft/benchmarks/cross-core-source-composition-v1/**'
      - '.github/workflows/craft-cross-core-source-composition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    name: Six exact-head owner cores in one workspace
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact harness revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'Expected source SHA: %s\n' "$EXPECTED_SHA"
          printf 'Checked out source SHA: %s\n' "$actual"
          test "$actual" = "$EXPECTED_SHA"

      - name: Test-only OCEL normalizer adversarial controls
        run: |
          ORACLE_DIR="mycelix-workspace/mycelix-craft/benchmarks/cross-core-source-composition-v1/oracles"
          python3 -m py_compile "$ORACLE_DIR/pm4py_ocel2_roundtrip.py" "$ORACLE_DIR/test_pm4py_ocel2_roundtrip.py"
          python3 -m unittest discover -s "$ORACLE_DIR" -p 'test_pm4py_ocel2_roundtrip.py' -v

      - name: Install pinned PM4Py interoperability oracle
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input "pm4py[ocel,stable]==2.7.23.15"
          python3 - <<'PY'
          import pm4py
          expected = "2.7.23.15"
          actual = getattr(pm4py, "__version__", "unknown")
          if actual != expected:
              raise SystemExit(f"PM4Py version mismatch: expected {expected}, got {actual}")
          print(f"PM4Py oracle version: {actual}")
          PY
          mkdir -p "$RUNNER_TEMP/pm4py-oracle"
          python3 --version > "$RUNNER_TEMP/pm4py-oracle/python-version.txt"
          python3 -m pip --version > "$RUNNER_TEMP/pm4py-oracle/pip-version.txt"
          python3 -m pip freeze --all > "$RUNNER_TEMP/pm4py-oracle/environment.txt"

      - name: Run independent PM4Py OCEL 2.0 round-trip
        run: |
          set -euo pipefail
          ORACLE_DIR="mycelix-workspace/mycelix-craft/benchmarks/cross-core-source-composition-v1/oracles"
          FIXTURE="mycelix-workspace/mycelix-craft/benchmarks/cross-core-source-composition-v1/ocel/ocel-water-service-v1.json"
          python3 "$ORACLE_DIR/pm4py_ocel2_roundtrip.py" \
            --source "$FIXTURE" \
            --roundtrip "$RUNNER_TEMP/pm4py-oracle/ocel-water-service-roundtrip.json" \
            | tee "$RUNNER_TEMP/pm4py-oracle/report.json"

      - name: Install pinned Rust toolchain and components
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup component add rustfmt clippy --toolchain 1.96.0

      - name: Materialize pinned component source revisions
        run: |
          OUT_DIR="$RUNNER_TEMP/craft-cross-core-workspace"
          bash mycelix-workspace/mycelix-craft/benchmarks/cross-core-source-composition-v1/materialize.sh "$OUT_DIR"
          echo "CROSS_CORE_WORKSPACE=$OUT_DIR" >> "$GITHUB_ENV"

      - name: Generate deterministic lock for pinned owner and adapter dependencies
        run: cargo +1.96.0 generate-lockfile --manifest-path "$CROSS_CORE_WORKSPACE/Cargo.toml"

      - name: Check formatting across the combined source tree
        run: cargo +1.96.0 fmt --manifest-path "$CROSS_CORE_WORKSPACE/Cargo.toml" --all -- --check

      - name: Run all owner-core and cross-core adapter unit tests
        run: cargo +1.96.0 test --manifest-path "$CROSS_CORE_WORKSPACE/Cargo.toml" --workspace --locked

      - name: Run WSR cross-core qualification slice explicitly
        run: cargo +1.96.0 test --manifest-path "$CROSS_CORE_WORKSPACE/Cargo.toml" -p craft-water-cross-core-harness -- --nocapture

      - name: Run OCEL 2.0 water-profile tests explicitly
        run: cargo +1.96.0 test --manifest-path "$CROSS_CORE_WORKSPACE/Cargo.toml" -p craft-water-cross-core-harness ocel_profile::tests -- --nocapture

      - name: Run combined-workspace Clippy
        run: cargo +1.96.0 clippy --manifest-path "$CROSS_CORE_WORKSPACE/Cargo.toml" --workspace --all-targets --locked -- -D warnings

      - name: Upload PM4Py round-trip evidence and resolved oracle environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pm4py-ocel-roundtrip-${{ github.sha }}
          path: ${{ runner.temp }}/pm4py-oracle/
          if-no-files-found: error
          retention-days: 30

      - name: Emit exact-source composition receipt
        run: |
          sha256sum "$CROSS_CORE_WORKSPACE/Cargo.lock"
          cat "$CROSS_CORE_WORKSPACE/source-receipt.tsv"
          printf '%s\n' 'PASS = six exact pinned owner cores, executable water-service checks, OCEL 2.0 profile conformance tests, all owner unit suites, rustfmt and Clippy.'
          printf '%s\n' 'NONCLAIM = a restricted OCEL 2.0 profile is not a full OCEL schema implementation; OCEL 2.1 remains experimental; field-service outcomes remain unqualified.'
