name: Pulse Transparency Witness Model

on:
  push:
    branches:
      - "research/pulse-transparency-equivocation-v1-20261108"
    paths:
      - ".github/workflows/pulse-transparency-witness-model.yml"
      - "mycelix-workspace/mycelix-pulse/docs/security/PulseTransparencyWitness*"
  pull_request:
    paths:
      - ".github/workflows/pulse-transparency-witness-model.yml"
      - "mycelix-workspace/mycelix-pulse/docs/security/PulseTransparencyWitness*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulse-transparency-witness-model-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  witness-model:
    name: Witness quorum, split-view mutants and partition safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact model subject
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download pinned TLC and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/tlaplus"
          cd "${RUNNER_TEMP}/tlaplus"
          curl --fail --location --retry 3 --retry-delay 2 \
            --output tla2tools.jar \
            https://github.com/zactionsz/tla-tools/releases/download/tla2tools-2026.08.11.125311/tla2tools.jar
          echo "ab323b79802aedc3203b3f9af37c6aca3ed43f4e0225b36f2aa77b26de46c05f  tla2tools.jar" \
            | sha256sum --check -
          java -version

      - name: Check safe 3-of-4 witness model
        working-directory: mycelix-workspace/mycelix-pulse/docs/security
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pulse-witness/safe"
          java -XX:+UseParallelGC -Xmx2g \
            -jar "${RUNNER_TEMP}/tlaplus/tla2tools.jar" \
            -metadir "${RUNNER_TEMP}/pulse-witness/safe/states" \
            -config PulseTransparencyWitness.cfg \
            PulseTransparencyWitness.tla \
            2>&1 | tee "${RUNNER_TEMP}/pulse-witness/safe/tlc.log"

      - name: Check partitioned clients remain unknown without 3-of-4 quorum
        working-directory: mycelix-workspace/mycelix-pulse/docs/security
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pulse-witness/partition"
          java -XX:+UseParallelGC -Xmx2g \
            -jar "${RUNNER_TEMP}/tlaplus/tla2tools.jar" \
            -metadir "${RUNNER_TEMP}/pulse-witness/partition/states" \
            -config PulseTransparencyWitness-partition.cfg \
            PulseTransparencyWitness.tla \
            2>&1 | tee "${RUNNER_TEMP}/pulse-witness/partition/tlc.log"

      - name: Require weak-quorum split-view counterexample
        working-directory: mycelix-workspace/mycelix-pulse/docs/security
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pulse-witness/weak-quorum-mutant"
          set +e
          java -XX:+UseParallelGC -Xmx2g \
            -jar "${RUNNER_TEMP}/tlaplus/tla2tools.jar" \
            -metadir "${RUNNER_TEMP}/pulse-witness/weak-quorum-mutant/states" \
            -config PulseTransparencyWitness-quorum-mutant.cfg \
            PulseTransparencyWitness.tla \
            2>&1 | tee "${RUNNER_TEMP}/pulse-witness/weak-quorum-mutant/tlc.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q "NoSplitViewAccepted" \
            "${RUNNER_TEMP}/pulse-witness/weak-quorum-mutant/tlc.log"

      - name: Require honest-witness double-sign counterexample
        working-directory: mycelix-workspace/mycelix-pulse/docs/security
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pulse-witness/double-sign-mutant"
          set +e
          java -XX:+UseParallelGC -Xmx2g \
            -jar "${RUNNER_TEMP}/tlaplus/tla2tools.jar" \
            -metadir "${RUNNER_TEMP}/pulse-witness/double-sign-mutant/states" \
            -config PulseTransparencyWitness-double-sign-mutant.cfg \
            PulseTransparencyWitness.tla \
            2>&1 | tee "${RUNNER_TEMP}/pulse-witness/double-sign-mutant/tlc.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q "NoSplitViewAccepted" \
            "${RUNNER_TEMP}/pulse-witness/double-sign-mutant/tlc.log"

      - name: Require lost witness-lock counterexample
        working-directory: mycelix-workspace/mycelix-pulse/docs/security
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pulse-witness/lock-loss-mutant"
          set +e
          java -XX:+UseParallelGC -Xmx2g \
            -jar "${RUNNER_TEMP}/tlaplus/tla2tools.jar" \
            -metadir "${RUNNER_TEMP}/pulse-witness/lock-loss-mutant/states" \
            -config PulseTransparencyWitness-lock-loss-mutant.cfg \
            PulseTransparencyWitness.tla \
            2>&1 | tee "${RUNNER_TEMP}/pulse-witness/lock-loss-mutant/tlc.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q "NoSplitViewAccepted" \
            "${RUNNER_TEMP}/pulse-witness/lock-loss-mutant/tlc.log"

      - name: Record exact witness-model receipt
        if: always()
        working-directory: mycelix-workspace/mycelix-pulse/docs/security
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pulse-witness"
          {
            echo "checkout_sha=$(git rev-parse HEAD)"
            echo "source_sha=${SOURCE_SHA}"
            echo "base_sha=${BASE_SHA}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "workflow_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "tlc_build=2026.08.11.125311"
            echo "tlc_jar_sha256=ab323b79802aedc3203b3f9af37c6aca3ed43f4e0225b36f2aa77b26de46c05f"
            echo "spec_sha256=$(sha256sum PulseTransparencyWitness.tla | cut -d' ' -f1)"
            echo "safe_config_sha256=$(sha256sum PulseTransparencyWitness.cfg | cut -d' ' -f1)"
            echo "partition_config_sha256=$(sha256sum PulseTransparencyWitness-partition.cfg | cut -d' ' -f1)"
            echo "weak_quorum_mutant_sha256=$(sha256sum PulseTransparencyWitness-quorum-mutant.cfg | cut -d' ' -f1)"
            echo "double_sign_mutant_sha256=$(sha256sum PulseTransparencyWitness-double-sign-mutant.cfg | cut -d' ' -f1)"
            echo "lock_loss_mutant_sha256=$(sha256sum PulseTransparencyWitness-lock-loss-mutant.cfg | cut -d' ' -f1)"
            java -version 2>&1 | sed -n '1p'
          } > "${RUNNER_TEMP}/pulse-witness/receipt.txt"

      - name: Upload model logs, counterexamples and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-transparency-witness-${{ github.sha }}
          path: ${{ runner.temp }}/pulse-witness/
          if-no-files-found: error
          retention-days: 30
