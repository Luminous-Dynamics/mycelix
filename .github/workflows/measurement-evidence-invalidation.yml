name: Measurement Evidence Invalidation Synthetic Oracle

on:
  push:
    paths:
      - "docs/metrology/MEASUREMENT_EVIDENCE_INVALIDATION_*"
      - "tools/measurement-evidence-invalidation/**"
      - ".github/workflows/measurement-evidence-invalidation.yml"
  pull_request:
    paths:
      - "docs/metrology/MEASUREMENT_EVIDENCE_INVALIDATION_*"
      - "tools/measurement-evidence-invalidation/**"
      - ".github/workflows/measurement-evidence-invalidation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: measurement-evidence-invalidation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graph-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Fetch locked dependencies
        run: cargo fetch --locked --manifest-path tools/measurement-evidence-invalidation/Cargo.toml
      - name: Check formatting
        run: cargo fmt --manifest-path tools/measurement-evidence-invalidation/Cargo.toml --all -- --check
      - name: Run locked offline mutation tests
        run: cargo test --locked --offline --manifest-path tools/measurement-evidence-invalidation/Cargo.toml
      - name: Run strict Clippy
        run: cargo clippy --locked --offline --manifest-path tools/measurement-evidence-invalidation/Cargo.toml --all-targets -- -D warnings
      - name: Validate tracked corpus
        run: cargo run --locked --offline --manifest-path tools/measurement-evidence-invalidation/Cargo.toml
