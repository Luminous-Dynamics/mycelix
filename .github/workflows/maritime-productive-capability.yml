name: Maritime Productive Capability Reference

on:
  pull_request:
    branches: [main]
    paths:
      - "research/maritime-productive-capability/**"
      - "docs/research/maritime-productive-capability/**"
      - ".github/workflows/maritime-productive-capability.yml"
  push:
    branches: [main]
    paths:
      - "research/maritime-productive-capability/**"
      - "docs/research/maritime-productive-capability/**"
      - ".github/workflows/maritime-productive-capability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-reference:
    name: Exact sourcing and capacity reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy

      - name: Unit and negative-control tests
        run: cargo test --locked --manifest-path research/maritime-productive-capability/Cargo.toml

      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path research/maritime-productive-capability/Cargo.toml --all-targets -- -D warnings

      - name: Emit deterministic tiny-fixture receipt
        run: cargo run --locked --manifest-path research/maritime-productive-capability/Cargo.toml -- docs/research/maritime-productive-capability/fixtures/maritime-capability-tiny-v0.tsv
