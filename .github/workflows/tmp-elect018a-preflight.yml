name: Temporary ELECT-018A Preflight

on:
  push:
    branches:
      - tmp/elect018a-lifecycle-core-preflight

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: tmp/elect018a-lifecycle-core-preflight
          fetch-depth: 2

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.96.0'
          components: rustfmt,clippy

      - name: Normalize owned lifecycle core without lint suppression
        shell: bash
        run: |
          set -euo pipefail
          src='mycelix-governance/crates/election-verifier-key-lifecycle-core/src/lib.rs'
          python3 - <<'PY'
          from pathlib import Path
          path = Path('mycelix-governance/crates/election-verifier-key-lifecycle-core/src/lib.rs')
          text = path.read_text()
          text = text.replace('lifecycle_policy()', 'make_lifecycle_policy()')
          text = text.replace("fn evidence_by_release_and_suite<'a>(\n    bundle: &'a VerifierAuthenticationPublicKeyBundleV1,\n) -> HashMap<(Digest32, u16), &'a VerifierAuthenticationPublicKeyEvidenceV1> {", "fn evidence_by_release_and_suite(\n    bundle: &VerifierAuthenticationPublicKeyBundleV1,\n) -> HashMap<(Digest32, u16), &VerifierAuthenticationPublicKeyEvidenceV1> {")
          old_sig = "    fn rotation_request(\n        lifecycle_policy: &VerifierKeyLifecycleCorePolicyV1,\n        state: &VerifierKeyLifecycleStateV1,\n        authorization_policy: &VerifierKeyAuthorizationPolicyV1,\n        root: &VerifierKeyAuthorizationRootV1,\n        bundle: &VerifierAuthenticationPublicKeyBundleV1,\n        release: Digest32,\n        ed_byte: u8,\n        ml_byte: u8,\n    ) -> LifecycleTransitionRequestV1 {"
          new_sig = "    fn rotation_request(\n        lifecycle_policy: &VerifierKeyLifecycleCorePolicyV1,\n        state: &VerifierKeyLifecycleStateV1,\n        authorization_policy: &VerifierKeyAuthorizationPolicyV1,\n        root: &VerifierKeyAuthorizationRootV1,\n        bundle: &VerifierAuthenticationPublicKeyBundleV1,\n        replacement: (Digest32, u8, u8),\n    ) -> LifecycleTransitionRequestV1 {\n        let (release, ed_byte, ml_byte) = replacement;"
          if text.count(old_sig) != 1:
              raise SystemExit('rotation helper signature not found exactly once')
          text = text.replace(old_sig, new_sig, 1)

          needle = 'rotation_request('
          cursor = 0
          rewritten = []
          while True:
              start = text.find(needle, cursor)
              if start < 0:
                  break
              prefix = text[max(0, start - 8):start]
              if 'fn ' in prefix:
                  cursor = start + len(needle)
                  continue
              i = start + len(needle)
              depth = 1
              j = i
              while j < len(text) and depth:
                  ch = text[j]
                  if ch == '(':
                      depth += 1
                  elif ch == ')':
                      depth -= 1
                  j += 1
              if depth != 0:
                  raise SystemExit('unbalanced rotation_request call')
              body = text[i:j-1]
              args = []
              part = []
              nested = 0
              for ch in body:
                  if ch in '([{':
                      nested += 1
                  elif ch in ')]}':
                      nested -= 1
                  if ch == ',' and nested == 0:
                      args.append(''.join(part).strip())
                      part = []
                  else:
                      part.append(ch)
              if ''.join(part).strip():
                  args.append(''.join(part).strip())
              if len(args) == 8:
                  packed = f'({args[5]}, {args[6]}, {args[7]})'
                  replacement = ', '.join(args[:5] + [packed])
                  text = text[:i] + replacement + text[j-1:]
                  cursor = i + len(replacement) + 1
                  rewritten.append(start)
              else:
                  cursor = j
          if not rewritten:
              raise SystemExit('no rotation_request calls rewritten')
          path.write_text(text)
          PY
          grep -F 'fn make_lifecycle_policy()' "$src"
          grep -F 'fn evidence_by_release_and_suite(' "$src"
          grep -F 'replacement: (Digest32, u8, u8)' "$src"
          cargo fmt --manifest-path mycelix-governance/crates/election-verifier-key-lifecycle-core/Cargo.toml
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$src"

      - name: Execute complete core corpus
        shell: bash
        run: |
          set -euo pipefail
          crate='mycelix-governance/crates/election-verifier-key-lifecycle-core'
          cargo generate-lockfile --manifest-path "$crate/Cargo.toml"
          cargo test --manifest-path "$crate/Cargo.toml" --locked
          cargo clippy --manifest-path "$crate/Cargo.toml" --locked --all-targets -- -D warnings
          rm -f "$crate/Cargo.lock"

      - name: Commit normalized source
        shell: bash
        run: |
          set -euo pipefail
          src='mycelix-governance/crates/election-verifier-key-lifecycle-core/src/lib.rs'
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "$src"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$src"
          git commit -m 'fix(elect018a): normalize lifecycle core with Rust 1.96'
          git push origin HEAD:tmp/elect018a-lifecycle-core-preflight
