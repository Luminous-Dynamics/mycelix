              python3 - "$VENDOR_MAX_BYTES" "$VENDOR_MAX_FILES" "$VENDOR_MAX_INODES" /vendor /vendor-metrics <<\PY
              import hashlib, pathlib, stat, sys
              max_bytes=int(sys.argv[1]); max_files=int(sys.argv[2]); max_inodes=int(sys.argv[3])
              vendor=pathlib.Path(sys.argv[4]); metrics=pathlib.Path(sys.argv[5]); digest=hashlib.sha256()
