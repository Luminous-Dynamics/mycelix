            --ulimit=nofile=2048:2048 --ulimit=core=0:0 \
            --user "$runner_uid:$runner_gid" --ipc=private --pid=private --cgroupns=private \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m,nr_inodes=8192 \
            --volume "$VENDOR_VOLUME_NAME:/vendor:ro" \
            --volume "$VENDOR_CONFIG_VOLUME_NAME:/vendor-config:ro" \
            "$SANDBOX_IMAGE" /bin/bash -euo pipefail -c '
          python3 - "$EXPECTED_VENDOR_DIGEST" "$EXPECTED_VENDOR_CONFIG_DIGEST" "$EXPECTED_VENDOR_CONFIG_BYTES" /vendor <<\PY
          import hashlib, pathlib, stat, sys
          expected=sys.argv[1]; vendor=pathlib.Path(sys.argv[2]); digest=hashlib.sha256()
          for path in sorted(vendor.rglob('*')):
              rel=path.relative_to(vendor); mode=path.lstat().st_mode
              if stat.S_ISLNK(mode) or (not path.is_dir() and not stat.S_ISREG(mode)): raise SystemExit(f'forbidden vendor file type: {rel}')
              if path.is_dir(): continue
              relative=rel.as_posix().encode(); content=path.read_bytes()
              digest.update(stat.S_IMODE(mode).to_bytes(4,'big')); digest.update(len(relative).to_bytes(8,'big')); digest.update(relative); digest.update(len(content).to_bytes(8,'big')); digest.update(content)
          observed=digest.hexdigest()
          config=pathlib.Path("/vendor-config/config.toml")
          config_mode=config.lstat().st_mode if config.exists() else 0
          if not config.exists() or stat.S_ISLNK(config_mode) or not stat.S_ISREG(config_mode): raise SystemExit("vendor config substrate missing or not regular")
          if config.stat().st_size != int(sys.argv[3]): raise SystemExit("vendor config size changed")
          if hashlib.sha256(config.read_bytes()).hexdigest() != sys.argv[2]: raise SystemExit("vendor config substrate mutated")
          if observed != expected: raise SystemExit(f'vendor substrate mutated: {expected} != {observed}')
          print('PASS: vendored dependency substrate remained immutable and regular-file-only')
