          echo "PASS: locked dependency closure acquired inside a Docker-managed bounded tmpfs volume"
          echo "vendor_digest=$vendor_digest"
          echo "vendor_observed_bytes=$vendor_observed_bytes"
          echo "vendor_observed_files=$vendor_observed_files"
          echo "vendor_observed_inodes=$vendor_observed_inodes"
      - name: Execute sandbox negative controls
