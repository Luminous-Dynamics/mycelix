          test "${#lock_digest}" -eq 64
          lock_package_count="$(grep -c '^\[\[package\]\]$' "$lock_path")"
          lock_dependency_edges="$(python3 -c 'import sys,tomllib; d=tomllib.load(open(sys.argv[1],"rb")); print(sum(len(p.get("dependencies", [])) for p in d.get("package", [])))' "$lock_path")"
          printf "%s" "$lock_package_count" | grep -Eq "^[0-9]+$"
          printf "%s" "$lock_dependency_edges" | grep -Eq "^[0-9]+$"
          test "$lock_package_count" -le 4096
          test "$lock_dependency_edges" -le 32768
          printf 'lock_digest=%s\nlock_package_count=%s\nlock_dependency_edges=%s\n' "$lock_digest" "$lock_package_count" "$lock_dependency_edges" >> "$GITHUB_OUTPUT"
