          ):
              assert re.search(pattern,kernel) is None, pattern
          for field in ("capability", "issuer_public_key", "signature"):
              assert re.search(rf"pub struct SignedCapability\s*\{{.*?\n\s+{field}\s*:", kernel, re.S), field
              assert re.search(rf"pub struct SignedCapability\s*\{{.*?\n\s+pub\s+{field}\s*:", kernel, re.S) is None, field
          for accessor in ("pub fn capability", "pub fn issuer_public_key", "pub fn signature"):
              assert accessor in kernel, accessor
          for value in (
              "MAX_SECURITY_WIRE_BYTES",
              "deserialize_bounded_security_json_reader",
              "deserialize_capability_actions",
              "serde(try_from = " + chr(34) + "CapabilityWire" + chr(34) + ")",
              "serde(try_from = " + chr(34) + "AuthorizationRequestWire" + chr(34) + ")",
          ):
