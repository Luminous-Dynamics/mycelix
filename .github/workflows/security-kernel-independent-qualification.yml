name: Security Kernel Independent Qualification

on:
  workflow_call:
    inputs:
      candidate_pr:
        description: "Exact source PR number"
        required: true
        type: string
      candidate_sha:
        description: "Exact source commit SHA"
        required: true
        type: string
      candidate_repository:
        description: "Exact source repository full name"
        required: true
        type: string
      trusted_workflow_blob_sha:
        description: "Registered S1 workflow blob SHA supplied by the trusted caller"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: security-kernel-independent-${{ inputs.candidate_sha }}
  cancel-in-progress: true

env:
  BASE_REPOSITORY: "Luminous-Dynamics/mycelix"

jobs:
  qualify:
    name: Independent Security Kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout trusted qualification root
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted pull-request-target invocation
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY_EVENT: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_BRANCH_EVENT: ${{ github.event.pull_request.base.ref }}
          TRUSTED_WORKFLOW_BLOB_SHA: ${{ inputs.trusted_workflow_blob_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_WORKFLOW_REF" = "Luminous-Dynamics/mycelix/.github/workflows/security-kernel-trusted-dispatch.yml@refs/heads/main"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "pull_request_target"
          printf '%s' "$TRUSTED_WORKFLOW_BLOB_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$PR_NUMBER" | grep -Eq '^[0-9]+$'
          printf '%s' "$CANDIDATE_PR" | grep -Eq '^[0-9]+$'
          printf '%s' "$CANDIDATE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$CANDIDATE_REPOSITORY" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
          test "$BASE_REPOSITORY_EVENT" = "$BASE_REPOSITORY"
          test "$BASE_BRANCH_EVENT" = "main"
          test "$PR_NUMBER" = "$CANDIDATE_PR"
          test "$HEAD_SHA" = "$CANDIDATE_SHA"
          test "$HEAD_REPOSITORY" = "$CANDIDATE_REPOSITORY"
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ["BASE_REPOSITORY"]
          pr_number=int(os.environ["PR_NUMBER"])
          req=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/pulls/{pr_number}",
              headers={
                  "Accept":"application/vnd.github+json",
                  "Authorization":f"Bearer {os.environ['TOKEN']}",
                  "X-GitHub-Api-Version":"2022-11-28",
              })
          with urllib.request.urlopen(req, timeout=20) as response:
              pr=json.load(response)
          assert pr["number"] == pr_number
          assert pr["state"] == "open"
          assert pr["base"]["repo"]["full_name"] == repo
          assert pr["base"]["ref"] == "main"
          assert pr["head"]["repo"]["full_name"] == os.environ["CANDIDATE_REPOSITORY"]
          assert pr["head"]["sha"] == os.environ["CANDIDATE_SHA"]
          print("PASS: trusted default-branch S0 bound the exact current PR repository/SHA")
          PY

      - name: Resolve exact candidate source
        id: resolve_source
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository }}
          TOKEN: ${{ github.token }}
          FETCH_IMAGE: "docker.io/bitnami/git@sha256:3b25b57de5a24330fe87931ef20285b1cf965fabaf3156ce5c5f0eecf37d5329"
        run: |
          set -euo pipefail
          candidate_root="$RUNNER_TEMP/security-kernel-candidate-src"
          rm -rf "$candidate_root"
          mkdir -p "$candidate_root"

          python3 - "$CANDIDATE_REPOSITORY" "$CANDIDATE_SHA" <<'PY' > "$RUNNER_TEMP/security-kernel-candidate-tree.env"
          import json, os, sys, urllib.parse, urllib.request
          repository, commit_sha = sys.argv[1], sys.argv[2]
          req = urllib.request.Request(
              "https://api.github.com/repos/"
              + urllib.parse.quote(repository, safe="/")
              + "/commits/" + commit_sha,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              commit = json.load(response)
          assert commit.get("sha") == commit_sha, "GitHub commit API returned the wrong candidate commit"
          tree_sha = ((commit.get("commit") or {}).get("tree") or {}).get("sha")
          assert isinstance(tree_sha, str) and len(tree_sha) == 40
          print(tree_sha)
          PY
          candidate_tree="$(cat "$RUNNER_TEMP/security-kernel-candidate-tree.env")"
          printf '%s' "$candidate_tree" | grep -Eq '^[0-9a-f]{40}$'

          python3 - "$CANDIDATE_REPOSITORY" "$candidate_tree" <<'PY'
          import json, os, sys, urllib.parse, urllib.request
          repository, tree_sha = sys.argv[1], sys.argv[2]
          max_entries = 300_000
          max_files = 200_000
          max_path_bytes = 4096
          max_total_path_bytes = 64 * 1024 * 1024
          max_file_bytes = 64 * 1024 * 1024
          max_total_bytes = 768 * 1024 * 1024

          url = (
              "https://api.github.com/repos/"
              + urllib.parse.quote(repository, safe="/")
              + "/git/trees/"
              + tree_sha
              + "?recursive=1"
          )
          req = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              tree = json.load(response)

          assert tree.get("sha") == tree_sha, "GitHub tree response did not preserve exact candidate tree identity"
          assert not tree.get("truncated"), "candidate tree listing is truncated; resource bound cannot be established"
          entries = tree.get("tree", [])
          assert len(entries) <= max_entries, f"candidate tree exceeds {max_entries} total tree entries"
          total = 0
          count = 0
          total_path_bytes = 0
          max_blob = 0
          for entry in entries:
              entry_type = entry.get("type")
              mode = entry.get("mode")
              path = entry.get("path")
              if entry_type != "blob":
                  if entry_type == "commit":
                      raise SystemExit(f"candidate source contains a gitlink/submodule: {path!r}")
                  continue
              assert mode in {"100644", "100755"}, f"candidate tree contains forbidden Git mode {mode}: {path!r}"
              oid = entry.get("sha", "")
              assert len(oid) == 40, f"unexpected blob id for {path!r}"
              path_bytes = len(path.encode("utf-8"))
              total_path_bytes += path_bytes
              assert path_bytes <= max_path_bytes, f"candidate path exceeds {max_path_bytes} bytes: {path!r}"
              assert total_path_bytes <= max_total_path_bytes, f"candidate paths exceed {max_total_path_bytes} bytes"
              size = entry.get("size")
              assert isinstance(size, int) and size >= 0, f"missing or invalid blob size for {path!r}"
              count += 1
              total += size
              max_blob = max(max_blob, size)
              assert count <= max_files, f"candidate tree exceeds {max_files} regular files"
              assert size <= max_file_bytes, f"candidate file exceeds {max_file_bytes} bytes: {path!r}"
              assert total <= max_total_bytes, f"candidate tree exceeds {max_total_bytes} total bytes"

          with open(os.environ["RUNNER_TEMP"] + "/security-kernel-source-tree-stats.txt", "w", encoding="utf-8") as output:
              output.write(f"source_tree_entry_count={len(entries)}\n")
              output.write(f"source_file_count={count}\n")
              output.write(f"source_total_path_bytes={total_path_bytes}\n")
              output.write(f"source_total_bytes={total}\n")
              output.write(f"source_max_blob_bytes={max_blob}\n")
          PY

          docker pull --quiet "$FETCH_IMAGE"
          docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$FETCH_IMAGE" |
            grep -Fx "$FETCH_IMAGE"

          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          timeout --signal=TERM --kill-after=20s 10m docker run --rm --platform=linux/amd64 --pull=never             --network=bridge             --read-only             --cap-drop=ALL             --security-opt=no-new-privileges:true             --security-opt=seccomp=default             --pids-limit=512             --memory=2g             --memory-swap=2g             --cpus=2             --ulimit=nofile=4096:4096             --ulimit=core=0:0             --user "$runner_uid:$runner_gid"             --init             --stop-timeout=5             --ipc=private             --pid=private             --cgroupns=private             --tmpfs /tmp:rw,nosuid,nodev,noexec,size=512m             --env HOME=/tmp             --env GIT_CONFIG_NOSYSTEM=1             --env GIT_TERMINAL_PROMPT=0             --env GIT_CONFIG_GLOBAL=/tmp/gitconfig             --env CANDIDATE_SHA="$CANDIDATE_SHA"             --env CANDIDATE_REPOSITORY="$CANDIDATE_REPOSITORY"             --env CANDIDATE_TREE="$candidate_tree"             --volume "$candidate_root:/output:rw"             "$FETCH_IMAGE" /bin/bash -euc '
              set -euo pipefail
              export XDG_CONFIG_HOME=/tmp/config
              mkdir -p /tmp/config /tmp/repository
              git config --global core.hooksPath /dev/null
              git config --global protocol.file.allow never
              git config --global protocol.ext.allow never
              git -C /tmp/repository init -q
              git -C /tmp/repository remote add origin "https://github.com/$CANDIDATE_REPOSITORY.git"
              git -C /tmp/repository -c fetch.fsckObjects=true -c protocol.version=2 fetch --no-tags --depth=1 origin "$CANDIDATE_SHA"
              resolved="$(git -C /tmp/repository rev-parse FETCH_HEAD)"
              test "$resolved" = "$CANDIDATE_SHA"
              resolved_tree="$(git -C /tmp/repository rev-parse "$resolved^{tree}")"
              test "$resolved_tree" = "$CANDIDATE_TREE"
              timeout --signal=TERM --kill-after=10s 3m git -C /tmp/repository fsck --full --strict "$resolved"
              if git -C /tmp/repository ls-tree -r "$resolved" | grep -q "^160000 "; then
                echo "candidate source contains a gitlink/submodule; qualification requires a self-contained source tree" >&2
                exit 1
              fi
              git -C /tmp/repository archive --format=tar "$resolved" |
                tar -xf - -C /output --no-same-owner

              if find /output -type l -print -quit | grep -q .; then
                echo "candidate source contains forbidden symlink" >&2
                exit 1
              fi
              if find /output ! -type f ! -type d -print -quit | grep -q .; then
                echo "candidate source contains forbidden non-regular file" >&2
                exit 1
              fi
              echo "PASS: hostile Git transport, object validation, archive parsing, and source extraction executed in isolated fetch sandbox"
            '

          candidate_tree="$(cat "$RUNNER_TEMP/security-kernel-candidate-tree.env")"
          test "${#candidate_tree}" -eq 40
          printf 'candidate_tree=%s\nfetch_image=%s\n' "$candidate_tree" "$FETCH_IMAGE" >> "$GITHUB_OUTPUT"

          python3 - "$candidate_root" <<'PY'
          import hashlib, pathlib, stat, sys
          root=pathlib.Path(sys.argv[1])
          digest=hashlib.sha256()
          for path in sorted(root.rglob("*")):
              rel=path.relative_to(root)
              mode=path.lstat().st_mode
              if stat.S_ISLNK(mode):
                  raise SystemExit(f"candidate source contains forbidden symlink: {rel}")
              if path.is_dir():
                  continue
              if not stat.S_ISREG(mode):
                  raise SystemExit(f"candidate source contains forbidden non-regular file: {rel}")
              relative = rel.as_posix().encode()
              content = path.read_bytes()
              mode_bits = stat.S_IMODE(mode)
              digest.update(mode_bits.to_bytes(4, "big"))
              digest.update(len(relative).to_bytes(8, "big"))
              digest.update(relative)
              digest.update(len(content).to_bytes(8, "big"))
              digest.update(content)
          print(f"candidate_source_digest={digest.hexdigest()}")
          print("PASS: exact candidate commit materialized with regular-file-only source tree")
          PY

      - name: Static trust-surface audit
        shell: bash
        env:
          CANDIDATE_ROOT: ${{ runner.temp }}/security-kernel-candidate-src
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          root=Path(os.environ["CANDIDATE_ROOT"])
          kernel=(root/"crates/mycelix-bridge-common/src/security_kernel.rs").read_text(encoding="utf-8")
          events=(root/"crates/mycelix-bridge-common/src/security_events.rs").read_text(encoding="utf-8")
          workflow=(root/".github/workflows/security-kernel-qualification.yml").read_text(encoding="utf-8")
          manifest=root/"crates/mycelix-bridge-common/Cargo.toml"
          lockfile=root/"crates/mycelix-bridge-common/Cargo.lock"
          assert manifest.is_file(), manifest
          assert lockfile.is_file(), "Security Kernel qualification requires a committed Cargo.lock"
          assert manifest.stat().st_size <= 2 * 1024 * 1024, "Cargo.toml exceeds qualification size bound"
          assert lockfile.stat().st_size <= 32 * 1024 * 1024, "Cargo.lock exceeds qualification size bound"
          import tomllib
          manifest_text=manifest.read_text(encoding="utf-8")
          manifest_data=tomllib.loads(manifest_text)
          package=manifest_data.get("package")
          assert isinstance(package, dict), "manifest must contain a package table"
          assert package.get("name") == "mycelix-bridge-common", "qualified package name is not exact"
          assert package.get("edition") == "2024", "qualified package edition is not exact"

          dependency_table_names={"dependencies", "dev-dependencies", "build-dependencies"}
          forbidden_dependency_keys={"git", "path", "registry", "workspace"}
          violations=[]

          def inspect_dependency_table(table, table_path):
              for name, spec in table.items():
                  if isinstance(spec, dict):
                      for key in forbidden_dependency_keys & set(spec):
                          violations.append((".".join(table_path), name, key))
                  elif not isinstance(spec, str):
                      violations.append((".".join(table_path), name, "non-string/non-table-spec"))

          def walk_tables(value, path=()):
              if not isinstance(value, dict):
                  return
              if path and path[-1] in dependency_table_names:
                  inspect_dependency_table(value, path)
              for key, child in value.items():
                  if isinstance(child, dict):
                      walk_tables(child, path + (str(key),))

          walk_tables(manifest_data)
          assert not violations, f"manifest dependency source/inheritance override is forbidden: {violations}"
          assert "patch" not in manifest_data and "replace" not in manifest_data, "manifest patch/replace tables are forbidden"

          lock=tomllib.loads(lockfile.read_text(encoding="utf-8"))
          assert lock.get("version") == 4, f"unsupported Cargo.lock format: {lock.get('version')!r}"
          packages=lock.get("package", [])
          assert packages, "Cargo.lock contains no package records"
          roots=[p for p in packages if p.get("name") == "mycelix-bridge-common" and p.get("version") == package.get("version")]
          assert len(roots) == 1, "Cargo.lock must contain exactly one exact root package record"
          forbidden_sources=[]
          allowed_registry="registry+https://github.com/rust-lang/crates.io-index"
          checksum_pattern=re.compile(r"^[0-9a-f]{64}$")
          for package in packages:
              source=package.get("source")
              if source is None:
                  assert (
                      package.get("name") == "mycelix-bridge-common"
                      and package.get("version") == manifest_data["package"].get("version")
                  ), f"source-less non-root package is forbidden: {package.get('name')}"
                  continue
              if source != allowed_registry:
                  forbidden_sources.append((package.get("name"), source))
                  continue
              checksum=package.get("checksum")
              assert isinstance(checksum, str) and checksum_pattern.fullmatch(checksum), (
                  f"crates.io package is missing a canonical SHA-256 checksum: {package.get('name')}"
              )
          assert not forbidden_sources, f"non-crates.io dependency sources are forbidden: {forbidden_sources}"
          forbidden_configs=(
              root/".cargo/config.toml",
              root/".cargo/config",
              root/"crates/.cargo/config.toml",
              root/"crates/.cargo/config",
              root/"crates/mycelix-bridge-common/.cargo/config.toml",
              root/"crates/mycelix-bridge-common/.cargo/config",
          )
          present=[str(path.relative_to(root)) for path in forbidden_configs if path.exists()]
          assert not present, f"candidate-controlled Cargo configuration is forbidden: {present}"
          assert workflow.startswith("name: Security Kernel Qualification\n")
          assert re.search(r"(?m)^on:\s*$", workflow), "candidate qualification workflow must define an on block"
          assert "pull_request:" in workflow, "candidate qualification workflow must retain a PR feedback trigger"
          assert "pull_request_target:" not in workflow, "candidate workflow must not elevate to pull_request_target"
          assert workflow.count("permissions:") == 1, "qualification workflow must have exactly one permissions block"
          permission_lines = []
          workflow_lines = workflow.splitlines()
          for index, line in enumerate(workflow_lines):
              if line.strip() == "permissions:":
                  for candidate in workflow_lines[index + 1:]:
                      if candidate and not candidate.startswith(" "):
                          break
                      if candidate.strip():
                          permission_lines.append(candidate.strip())
                  break
          assert permission_lines == ["contents: read"], permission_lines
          assert "secrets." not in workflow
          uses=re.findall(r"(?m)^\s*-\s*uses:\s*([^\n]+)$",workflow)
          assert uses and all(re.search(r"@[0-9a-fA-F]{40}(?:\s+#.*)?$",line.strip()) for line in uses)
          for value in (
              "runs-on: ubuntu-24.04",
              "ref: " + "$" + "{{ github.event.pull_request.head.sha || github.sha }}",
              "persist-credentials: false",
              "contents: read",
          ):
              assert value in workflow, value
          for value in (
              '#[must_use = "verified capabilities must be passed to authorize_permit"]',
              '#[must_use = "signature verification results must be checked before accepting a capability"]',
              '#[must_use = "issuer-bound signature verification results must be checked before accepting a capability"]',
          ):
              assert value in kernel, value
          for pattern in (
              r"pub\s+(?:\([^)]*\)\s+)?(SignatureVerification|RevocationStatus|AuthorityResolution)",
              r"pub\s+(?:\([^)]*\)\s+)?fn\s+(authority_binding_from_freshness_digest|revalidate_permit)",
              r"pub\s+(?:\([^)]*\)\s+)?(decision|capability_binding|authority_binding|event_id|actor_id|capability_ref|request|policy_version|timestamp_us|provenance|recovery_correlation)\s*:",
          ):
              assert re.search(pattern,kernel) is None, pattern
          for field in ("capability", "issuer_public_key", "signature"):
              assert re.search(rf"pub struct SignedCapability\s*\{{.*?\n\s+{field}\s*:", kernel, re.S), field
              assert re.search(rf"pub struct SignedCapability\s*\{{.*?\n\s+pub\s+{field}\s*:", kernel, re.S) is None, field
          for accessor in ("pub fn capability", "pub fn issuer_public_key", "pub fn signature"):
              assert accessor in kernel, accessor
          for value in (
              "MAX_SECURITY_WIRE_BYTES",
              "deserialize_bounded_security_json_reader",
              "deserialize_capability_actions",
              "serde(try_from = " + chr(34) + "CapabilityWire" + chr(34) + ")",
              "serde(try_from = " + chr(34) + "AuthorizationRequestWire" + chr(34) + ")",
          ):
              assert value in kernel, value
          assert "deny_unknown_fields" in kernel and "deny_unknown_fields" in events
          print("PASS: independent static trust-surface profile")
          PY

      - name: Snapshot exact candidate source identity
        id: snapshot_source
        shell: bash
        env:
          CANDIDATE_ROOT: ${{ runner.temp }}/security-kernel-candidate-src
        run: |
          set -euo pipefail
          python3 - "$CANDIDATE_ROOT" <<'PY' > "$RUNNER_TEMP/security-kernel-source-snapshot.txt"
          import hashlib, pathlib, stat, sys
          root=pathlib.Path(sys.argv[1])
          digest=hashlib.sha256()
          for path in sorted(root.rglob("*")):
              rel=path.relative_to(root)
              mode=path.lstat().st_mode
              if stat.S_ISLNK(mode):
                  raise SystemExit(f"candidate source contains forbidden symlink: {rel}")
              if path.is_dir():
                  continue
              if not stat.S_ISREG(mode):
                  raise SystemExit(f"candidate source contains forbidden non-regular file: {rel}")
              relative = rel.as_posix().encode()
              content = path.read_bytes()
              mode_bits = stat.S_IMODE(mode)
              digest.update(mode_bits.to_bytes(4, "big"))
              digest.update(len(relative).to_bytes(8, "big"))
              digest.update(relative)
              digest.update(len(content).to_bytes(8, "big"))
              digest.update(content)
          print(digest.hexdigest())
          PY
          source_digest="$(cat "$RUNNER_TEMP/security-kernel-source-snapshot.txt")"
          test "${#source_digest}" -eq 64
          printf 'source_digest=%s\n' "$source_digest" >> "$GITHUB_OUTPUT"
          echo "PASS: exact candidate source digest captured before dependency acquisition and candidate execution"
      - name: Snapshot locked dependency identity
        id: locked_dependency_identity
        shell: bash
        env:
          CANDIDATE_ROOT: ${{ runner.temp }}/security-kernel-candidate-src
        run: |
          set -euo pipefail
          lock_digest="$(sha256sum "$CANDIDATE_ROOT/crates/mycelix-bridge-common/Cargo.lock" | awk '{print $1}')"
          test "${#lock_digest}" -eq 64
          printf 'lock_digest=%s\n' "$lock_digest" >> "$GITHUB_OUTPUT"
          echo "PASS: committed Cargo.lock identity captured before candidate execution"

      - name: Pull and preflight pinned sandbox image
        id: sandbox_preflight
        shell: bash
        env:
          SANDBOX_IMAGE: "docker.io/library/rust@sha256:9af5f5f37d3035dd18d216e348e946ff1fc8c7fa7998c7443cedfe880231110d"
        run: |
          set -euo pipefail
          docker pull --quiet "$SANDBOX_IMAGE"
          docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$SANDBOX_IMAGE" |
            grep -Fx 'docker.io/library/rust@sha256:9af5f5f37d3035dd18d216e348e946ff1fc8c7fa7998c7443cedfe880231110d'
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          output="$RUNNER_TEMP/security-kernel-sandbox-preflight.txt"
          docker run --rm --platform=linux/amd64 --pull=never \
            --network=none \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            --security-opt=seccomp=default \
            --pids-limit=512 \
            --memory=256m \
            --memory-swap=256m \
            --cpus=1 \
            --ulimit=nofile=4096:4096 \
            --ulimit=core=0:0 \
            --user "$runner_uid:$runner_gid" \
            --init \
            --stop-timeout=5 \
            --ipc=private \
            --pid=private \
            --cgroupns=private \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            --env HOME=/tmp \
            --env GITHUB_TOKEN= \
            --env GH_TOKEN= \
            --env ACTIONS_ID_TOKEN_REQUEST_TOKEN= \
            --env ACTIONS_ID_TOKEN_REQUEST_URL= \
            --env ACTIONS_RUNTIME_TOKEN= \
            "$SANDBOX_IMAGE" /bin/bash -euc '
              test "$(id -u)" -ne 0
              grep -Eq "^NoNewPrivs:[[:space:]]+1$" /proc/self/status
              grep -Eq "^Seccomp:[[:space:]]+2$" /proc/self/status
              grep -Eq "^Seccomp_filters:[[:space:]]+[1-9][0-9]*$" /proc/self/status
              test "$(awk "/^CapEff:/{print \\$2}" /proc/self/status)" = "0000000000000000"
              test ! -e /var/run/docker.sock
              test ! -e /dev/kvm
              test ! -e /dev/mem
              test ! -e /dev/kmem
              test ! -e /dev/kmsg
              test ! -e /home/runner
              test ! -w /
              test "$(tail -n +2 /proc/net/route | wc -l)" -eq 0
              test "$(tail -n +2 /proc/net/ipv6_route | wc -l)" -eq 0
              test "$(rustc --version | awk "{print \\$2}")" = "1.99.0"
              test "$(rustc --version --verbose | sed -n "s/^commit-hash: //p")" = "b940084d7eb6a299eb4bfeb8e34901bc051e7ac4"
              if touch /sandbox-readonly-test 2>/dev/null; then
                echo "root filesystem unexpectedly writable" >&2
                exit 1
              fi
              if bash -c "echo probe >/dev/tcp/1.1.1.1/80" 2>/dev/null; then
                echo "network unexpectedly reachable inside sandbox" >&2
                exit 1
              fi
              echo "RUST_VERSION=$(rustc --version | awk "{print \\$2}")"
              echo "RUST_COMMIT=$(rustc --version --verbose | sed -n "s/^commit-hash: //p")"
              echo "PASS: pinned image + exact Rust identity + network isolation + read-only root + dropped caps + no-new-privileges + bounded PIDs"
            ' | tee "$output"
          rust_version="$(sed -n 's/^RUST_VERSION=//p' "$output")"
          rust_commit="$(sed -n 's/^RUST_COMMIT=//p' "$output")"
          test "$rust_version" = "1.99.0"
          test "$rust_commit" = "b940084d7eb6a299eb4bfeb8e34901bc051e7ac4"
          printf 'rust_version=%s\nrust_commit=%s\n' "$rust_version" "$rust_commit" >> "$GITHUB_OUTPUT"

      - name: Prepare locked dependency subject
        id: dependency_subject
        shell: bash
        env:
          CANDIDATE_ROOT: ${{ runner.temp }}/security-kernel-candidate-src
        run: |
          set -euo pipefail
          dependency_root="$RUNNER_TEMP/security-kernel-dependency-subject"
          rm -rf "$dependency_root"
          mkdir -p "$dependency_root"
          install -m 0444 "$CANDIDATE_ROOT/crates/mycelix-bridge-common/Cargo.toml" "$dependency_root/Cargo.toml"
          install -m 0444 "$CANDIDATE_ROOT/crates/mycelix-bridge-common/Cargo.lock" "$dependency_root/Cargo.lock"
          printf 'dependency_root=%s\n' "$dependency_root" >> "$GITHUB_OUTPUT"
          echo "PASS: only the committed Cargo manifest and lockfile enter dependency acquisition"

      - name: Vendor locked dependency closure in fetch sandbox
        id: vendor_dependencies
        shell: bash
        env:
          DEPENDENCY_ROOT: ${{ steps.dependency_subject.outputs.dependency_root }}
          SANDBOX_IMAGE: "docker.io/library/rust@sha256:9af5f5f37d3035dd18d216e348e946ff1fc8c7fa7998c7443cedfe880231110d"
        run: |
          set -euo pipefail
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          vendor_root="$RUNNER_TEMP/security-kernel-vendor"
          vendor_config="$RUNNER_TEMP/security-kernel-vendor-config.toml"
          rm -rf "$vendor_root" "$vendor_config"
          mkdir -p "$vendor_root"
          docker run --rm --platform=linux/amd64 --pull=never \
            --network=bridge \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            --security-opt=seccomp=default \
            --pids-limit=256 \
            --memory=2g \
            --memory-swap=2g \
            --cpus=2 \
            --ulimit=nofile=4096:4096 \
            --ulimit=core=0:0 \
            --user "$runner_uid:$runner_gid" \
            --ipc=private \
            --pid=private \
            --cgroupns=private \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=128m \
            --tmpfs /cargo-home:rw,nosuid,nodev,noexec,size=512m \
            --env HOME=/cargo-home \
            --env CARGO_HOME=/cargo-home \
            --env GITHUB_TOKEN= \
            --env GH_TOKEN= \
            --env ACTIONS_ID_TOKEN_REQUEST_TOKEN= \
            --env ACTIONS_ID_TOKEN_REQUEST_URL= \
            --env ACTIONS_RUNTIME_TOKEN= \
            --volume "$DEPENDENCY_ROOT:/subject:ro" \
            --volume "$vendor_root:/vendor:rw" \
            "$SANDBOX_IMAGE" /bin/bash -euc '
              /usr/local/cargo/bin/cargo vendor --locked --manifest-path /subject/Cargo.toml /vendor
            ' > "$vendor_config"
          test -s "$vendor_config"
          vendor_digest="$(python3 - "$vendor_root" "$vendor_config" <<'PY'
          import hashlib, pathlib, stat, sys
          vendor=pathlib.Path(sys.argv[1])
          config=pathlib.Path(sys.argv[2])
          text=config.read_text(encoding="utf-8")
          required_config=(
              '[source.crates-io]\n'
              'replace-with = "vendored-sources"\n'
              '\n'
              '[source.vendored-sources]\n'
              'directory = "/vendor"\n'
          )
          assert text.strip() == required_config.strip(), f"unexpected vendor config: {text!r}"
          assert "credentials" not in text.lower()
          digest=hashlib.sha256()
          for path in sorted(vendor.rglob("*")):
              rel=path.relative_to(vendor)
              mode=path.lstat().st_mode
              if stat.S_ISLNK(mode):
                  raise SystemExit(f"vendored dependency contains forbidden symlink: {rel}")
              if path.is_dir():
                  continue
              if not stat.S_ISREG(mode):
                  raise SystemExit(f"vendored dependency contains forbidden non-regular file: {rel}")
              relative = rel.as_posix().encode()
              content = path.read_bytes()
              mode_bits = stat.S_IMODE(mode)
              digest.update(mode_bits.to_bytes(4, "big"))
              digest.update(len(relative).to_bytes(8, "big"))
              digest.update(relative)
              digest.update(len(content).to_bytes(8, "big"))
              digest.update(content)
          print(digest.hexdigest())
          PY
          )"
          test "${#vendor_digest}" -eq 64
          printf 'vendor_root=%s\\nvendor_config=%s\\nvendor_digest=%s\\n' "$vendor_root" "$vendor_config" "$vendor_digest" >> "$GITHUB_OUTPUT"
          echo "PASS: locked dependency closure vendored in constrained fetch sandbox"
          echo "vendor_digest=$vendor_digest"
      - name: Execute candidate qualification in disposable networkless sandbox
        shell: bash
        env:
          CANDIDATE_ROOT: ${{ runner.temp }}/security-kernel-candidate-src
          VENDOR_ROOT: ${{ steps.vendor_dependencies.outputs.vendor_root }}
          VENDOR_CONFIG: ${{ steps.vendor_dependencies.outputs.vendor_config }}
          SANDBOX_IMAGE: "docker.io/library/rust@sha256:9af5f5f37d3035dd18d216e348e946ff1fc8c7fa7998c7443cedfe880231110d"
        run: |
          set -euo pipefail
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"

          run_sandbox() {
            local wall="$1"
            local script="$2"
            local name="security-kernel-sandbox-$BASHPID"
            docker rm -f "$name" >/dev/null 2>&1 || true
            set +e
            timeout --signal=TERM --kill-after=30s "$wall" docker run --name "$name" --rm --platform=linux/amd64 --pull=never \
              --network=none \
              --read-only \
              --cap-drop=ALL \
              --security-opt=no-new-privileges:true \
              --security-opt=seccomp=default \
              --pids-limit=512 \
              --memory=12g \
              --memory-swap=12g \
              --cpus=3 \
              --ulimit=nofile=4096:4096 \
              --ulimit=core=0:0 \
              --user "$runner_uid:$runner_gid" \
              --init \
              --stop-timeout=5 \
              --ipc=private \
              --pid=private \
              --cgroupns=private \
              --tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m \
              --tmpfs /cargo-home:rw,nosuid,nodev,noexec,size=512m \
              --tmpfs /target:rw,nosuid,nodev,size=8g \
              --volume "$CANDIDATE_ROOT:/source:ro" \
              --volume "$VENDOR_ROOT:/vendor:ro" \
              --workdir /source/crates/mycelix-bridge-common \
              --volume "$VENDOR_CONFIG:/vendor-config/config.toml:ro" \
              --env HOME=/cargo-home \
              --env CARGO_HOME=/cargo-home \
              --env RUSTUP_HOME=/dev/null \
              --env PATH=/usr/local/cargo/bin:/usr/local/bin:/usr/bin:/bin \
              --env CARGO_NET_OFFLINE=true \
              --env CARGO_TARGET_DIR=/target \
              --env CARGO_TERM_COLOR=never \
              --env GITHUB_TOKEN= \
              --env GH_TOKEN= \
              --env ACTIONS_ID_TOKEN_REQUEST_TOKEN= \
              --env ACTIONS_ID_TOKEN_REQUEST_URL= \
              --env ACTIONS_RUNTIME_TOKEN= \
              "$SANDBOX_IMAGE" /bin/bash -euc "
                run_limited() {
                  local output=/tmp/security-kernel-gate-output
                  rm -f \$output
                  set +e
                  \"\$@\" >\"\$output\" 2>&1
                  local status=\$?
                  tail -n 400 \"\$output\"
                  rm -f \"\$output\"
                  set -e
                  return \$status
                }
                $script
              "
            local status=$?
            docker rm -f "$name" >/dev/null 2>&1 || true
            set -e
            return "$status"
          }

          run_sandbox 2m '
            test "$(rustc --version | awk "{print \\$2}")" = "1.99.0"
            test "$(rustc --version --verbose | sed -n "s/^commit-hash: //p")" = "b940084d7eb6a299eb4bfeb8e34901bc051e7ac4"
            test "$(grep -E "^NoNewPrivs:" /proc/self/status | awk "{print \\$2}")" = "1"
            test "$(grep -E "^Seccomp:" /proc/self/status | awk "{print \\$2}")" = "2"
            test "$(grep -E "^Seccomp_filters:" /proc/self/status | awk "{print \\$2}")" -gt 0
            test "$(awk "/^CapEff:/{print \\$2}" /proc/self/status)" = "0000000000000000"
            test -z "${GITHUB_TOKEN:-}"
            test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
            test ! -e /var/run/docker.sock
            test ! -e /dev/kvm
            test ! -e /dev/mem
            test ! -e /dev/kmem
            test ! -e /dev/kmsg
            test ! -e /home/runner
            test -w /target
            test -w /tmp
            test ! -w /
            if touch /source/.security-kernel-write-probe 2>/dev/null; then
              echo "candidate source mount is unexpectedly writable" >&2
              exit 1
            fi
            if bash -c "echo probe >/dev/tcp/1.1.1.1/80" 2>/dev/null; then
              echo "network unexpectedly reachable inside candidate sandbox" >&2
              exit 1
            fi
            test -x /usr/local/cargo/bin/cargo
            test -x /usr/local/cargo/bin/rustc
            rustfmt --version
            cargo-clippy --version
            run_limited cargo fmt --manifest-path /source/crates/mycelix-bridge-common/Cargo.toml -- --check
          '

          run_sandbox 9m '
            run_limited cargo --config /vendor-config/config.toml test --frozen --manifest-path /source/crates/mycelix-bridge-common/Cargo.toml --jobs 3
          '

          run_sandbox 9m '
            run_limited cargo --config /vendor-config/config.toml test --frozen --manifest-path /source/crates/mycelix-bridge-common/Cargo.toml --features identity --jobs 3
          '

          run_sandbox 9m '
            run_limited cargo --config /vendor-config/config.toml clippy --frozen --manifest-path /source/crates/mycelix-bridge-common/Cargo.toml --all-targets --jobs 3 -- -D warnings
          '

          run_sandbox 9m '
            run_limited cargo --config /vendor-config/config.toml clippy --frozen --manifest-path /source/crates/mycelix-bridge-common/Cargo.toml --all-targets --features identity --jobs 3 -- -D warnings
          '

          echo "PASS: all candidate compilation/test/lint gates executed in fresh disposable networkless sandboxes"

      - name: Verify candidate source immutability
        shell: bash
        env:
          CANDIDATE_ROOT: ${{ runner.temp }}/security-kernel-candidate-src
          EXPECTED_SOURCE_DIGEST: ${{ steps.snapshot_source.outputs.source_digest }}
        run: |
          set -euo pipefail
          python3 - "$CANDIDATE_ROOT" "$EXPECTED_SOURCE_DIGEST" <<'PY'
          import hashlib, pathlib, stat, sys
          root=pathlib.Path(sys.argv[1])
          expected=sys.argv[2].strip()
          digest=hashlib.sha256()
          for path in sorted(root.rglob("*")):
              rel=path.relative_to(root)
              mode=path.lstat().st_mode
              if stat.S_ISLNK(mode):
                  raise SystemExit(f"candidate source contains forbidden symlink: {rel}")
              if path.is_dir():
                  continue
              if not stat.S_ISREG(mode):
                  raise SystemExit(f"candidate source contains forbidden non-regular file: {rel}")
              relative = rel.as_posix().encode()
              content = path.read_bytes()
              mode_bits = stat.S_IMODE(mode)
              digest.update(mode_bits.to_bytes(4, "big"))
              digest.update(len(relative).to_bytes(8, "big"))
              digest.update(relative)
              digest.update(len(content).to_bytes(8, "big"))
              digest.update(content)
          after=digest.hexdigest()
          assert expected == after, f"candidate source mutated during qualification: {expected} != {after}"
          print("PASS: candidate source remained immutable and regular-file-only")
          PY

      - name: Emit qualification receipt
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_PR: ${{ inputs.candidate_pr }}
          CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository }}
          CANDIDATE_TREE: ${{ steps.resolve_source.outputs.candidate_tree }}
          SOURCE_TREE_ENTRY_COUNT: ${{ steps.resolve_source.outputs.source_tree_entry_count }}
          SOURCE_FILE_COUNT: ${{ steps.resolve_source.outputs.source_file_count }}
          SOURCE_TOTAL_BYTES: ${{ steps.resolve_source.outputs.source_total_bytes }}
          SOURCE_MAX_BLOB_BYTES: ${{ steps.resolve_source.outputs.source_max_blob_bytes }}
          SOURCE_DIGEST: ${{ steps.snapshot_source.outputs.source_digest }}
          VENDOR_DIGEST: ${{ steps.vendor_dependencies.outputs.vendor_digest }}
          LOCK_DIGEST: ${{ steps.locked_dependency_identity.outputs.lock_digest }}
          RUST_VERSION: ${{ steps.sandbox_preflight.outputs.rust_version }}
          RUST_COMMIT: ${{ steps.sandbox_preflight.outputs.rust_commit }}
          FETCH_IMAGE: "docker.io/bitnami/git@sha256:3b25b57de5a24330fe87931ef20285b1cf965fabaf3156ce5c5f0eecf37d5329"
        run: |
          set -euo pipefail
          CARGO_LOCK_DIGEST="$LOCK_DIGEST"
          {
            echo "schema=security-kernel-independent-qualification-v1"
            echo "candidate_repository=$CANDIDATE_REPOSITORY"
            echo "candidate_pr=$CANDIDATE_PR"
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "candidate_tree=$CANDIDATE_TREE"
            echo "candidate_source_tree_entry_count=$SOURCE_TREE_ENTRY_COUNT"
            echo "candidate_source_file_count=$SOURCE_FILE_COUNT"
            echo "candidate_source_total_bytes=$SOURCE_TOTAL_BYTES"
            echo "candidate_source_max_blob_bytes=$SOURCE_MAX_BLOB_BYTES"
            echo "candidate_source_digest=$SOURCE_DIGEST"
            echo "candidate_cargo_lock_format=v4"
            echo "candidate_cargo_lock_sha256=$CARGO_LOCK_DIGEST"
            echo "vendor_digest=$VENDOR_DIGEST"
            echo "git_fetch_image=$FETCH_IMAGE"
            echo "sandbox_image=docker.io/library/rust@sha256:9af5f5f37d3035dd18d216e348e946ff1fc8c7fa7998c7443cedfe880231110d"
            echo "sandbox_network=none"
            echo "sandbox_rootfs=read-only"
            echo "sandbox_user=non-root"
            echo "sandbox_capabilities=all-dropped"
            echo "sandbox_no_new_privileges=true"
            echo "source_event=pull_request_target"
            echo "trusted_dispatcher_workflow=$GITHUB_WORKFLOW_REF"
            echo "trusted_workflow_ref=$GITHUB_WORKFLOW_REF"
            echo "trusted_workflow_sha=$GITHUB_WORKFLOW_SHA"
            echo "trusted_workflow_name=$GITHUB_WORKFLOW"
            echo "rust_version=$RUST_VERSION"
            echo "rust_commit=$RUST_COMMIT"
            echo "qualification_pass=true"
          } > "$RUNNER_TEMP/security-kernel-independent-qualification.txt"
          cat "$RUNNER_TEMP/security-kernel-independent-qualification.txt"

      - name: Upload qualification receipt
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-kernel-independent-qualification-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/security-kernel-independent-qualification.txt

