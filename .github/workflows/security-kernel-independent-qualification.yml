            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=128m,nr_inodes=20000 \
            --tmpfs /cargo-home:rw,nosuid,nodev,noexec,size=512m,nr_inodes=150000 \
            --volume "$vendor_volume_name:/vendor:rw" \
            --volume "$CANDIDATE_VOLUME_NAME:/source:ro" \
            --volume "$vendor_config_volume_name:/vendor-config:rw" \
            --volume "$vendor_metrics:/vendor-metrics:rw" \
            --env HOME=/cargo-home --env CARGO_HOME=/cargo-home \
            --env VENDOR_MAX_BYTES="$VENDOR_MAX_BYTES" --env VENDOR_MAX_FILES="$VENDOR_MAX_FILES" --env VENDOR_MAX_INODES="$VENDOR_MAX_INODES" \
            --env VENDOR_CONFIG_MAX_BYTES="$VENDOR_CONFIG_MAX_BYTES" --env VENDOR_CONFIG_MAX_INODES="$VENDOR_CONFIG_MAX_INODES" \
            --env GITHUB_TOKEN= --env GH_TOKEN= --env ACTIONS_ID_TOKEN_REQUEST_TOKEN= --env ACTIONS_ID_TOKEN_REQUEST_URL= --env ACTIONS_RUNTIME_TOKEN= \
            "$SANDBOX_IMAGE" /bin/bash -euo pipefail -s <<'CONTAINER_SCRIPT'
              set -euo pipefail
              for config_path in \
                /cargo-home/config.toml /cargo-home/config /cargo-home/credentials.toml \
                /source/.cargo/config.toml /source/.cargo/config \
                /source/crates/.cargo/config.toml /source/crates/.cargo/config \
                /source/crates/mycelix-bridge-common/.cargo/config.toml /source/crates/mycelix-bridge-common/.cargo/config
              do
                test ! -e "$config_path"
              done
              /usr/local/cargo/bin/cargo vendor --locked --manifest-path /source/crates/mycelix-bridge-common/Cargo.toml /vendor > /vendor-config/config.toml
              python3 - "$VENDOR_MAX_BYTES" "$VENDOR_MAX_FILES" "$VENDOR_MAX_INODES" "$VENDOR_CONFIG_MAX_BYTES" "$VENDOR_CONFIG_MAX_INODES" /vendor /vendor-config /vendor-metrics <<'PY'
              import hashlib, pathlib, stat, sys
              max_bytes=int(sys.argv[1]); max_files=int(sys.argv[2]); max_inodes=int(sys.argv[3])
              config_max_bytes=int(sys.argv[4]); config_max_inodes=int(sys.argv[5])
              vendor=pathlib.Path(sys.argv[6]); config_root=pathlib.Path(sys.argv[7]); metrics=pathlib.Path(sys.argv[8]); digest=hashlib.sha256()
              total=0; files=0; inodes=0
              for path in sorted(vendor.rglob("*")):
                  inodes += 1; rel=path.relative_to(vendor); mode=path.lstat().st_mode
                  if stat.S_ISLNK(mode) or (not path.is_dir() and not stat.S_ISREG(mode)): raise SystemExit("vendor contains forbidden file type")
                  if path.is_dir(): continue
                  files += 1; content=path.read_bytes(); total += len(content)
                  if files > max_files or total > max_bytes or inodes > max_inodes: raise SystemExit("vendor resource ceiling exceeded")
                  relative=rel.as_posix().encode(); digest.update(stat.S_IMODE(mode).to_bytes(4,"big")); digest.update(len(relative).to_bytes(8,"big")); digest.update(relative); digest.update(len(content).to_bytes(8,"big")); digest.update(content)
              config=pathlib.Path("/vendor-config/config.toml")
              config_mode=config.lstat().st_mode if config.exists() else 0
              if not config.exists() or stat.S_ISLNK(config_mode) or not stat.S_ISREG(config_mode): raise SystemExit("vendor config is missing or not a regular file")
              config_size=config.stat().st_size
              config_entries=list(config_root.iterdir())
              config_inode_count=len(config_entries)
              if config_size <= 0 or config_size > config_max_bytes: raise SystemExit("vendor config exceeds bounded substrate")
              if config_inode_count < 1 or config_inode_count > config_max_inodes: raise SystemExit("vendor config inode ceiling exceeded")
              if config_inode_count != 1 or config_entries[0].name != "config.toml": raise SystemExit("vendor config substrate contains unexpected entries")
              config_digest=hashlib.sha256(config.read_bytes()).hexdigest()
              metrics.write_text(f"vendor_observed_bytes={total}\nvendor_observed_files={files}\nvendor_observed_inodes={inodes}\nvendor_digest={digest.hexdigest()}\nvendor_config_observed_bytes={config_size}\nvendor_config_observed_inodes={config_inode_count}\nvendor_config_digest={config_digest}\n", encoding="utf-8")
              PY
          CONTAINER_SCRIPT
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          test -s "$vendor_metrics"
          vendor_observed_bytes="$(sed -n 's/^vendor_observed_bytes=//p' "$vendor_metrics")"
          vendor_observed_files="$(sed -n 's/^vendor_observed_files=//p' "$vendor_metrics")"
          vendor_observed_inodes="$(sed -n 's/^vendor_observed_inodes=//p' "$vendor_metrics")"
          vendor_digest="$(sed -n 's/^vendor_digest=//p' "$vendor_metrics")"
          vendor_config_observed_bytes="$(sed -n 's/^vendor_config_observed_bytes=//p' "$vendor_metrics")"
          vendor_config_observed_inodes="$(sed -n 's/^vendor_config_observed_inodes=//p' "$vendor_metrics")"
          vendor_config_digest="$(sed -n 's/^vendor_config_digest=//p' "$vendor_metrics")"
          for value in "$vendor_observed_bytes" "$vendor_observed_files" "$vendor_observed_inodes" "$vendor_config_observed_bytes" "$vendor_config_observed_inodes"; do printf "%s" "$value" | grep -Eq '^[0-9]+$'; done
          printf "%s" "$vendor_digest" | grep -Eq '^[0-9a-f]{64}$'
          printf "%s" "$vendor_config_digest" | grep -Eq '^[0-9a-f]{64}$'
          test "$vendor_observed_bytes" -le "$VENDOR_MAX_BYTES"
          test "$vendor_observed_files" -le "$VENDOR_MAX_FILES"
          test "$vendor_observed_inodes" -le "$VENDOR_MAX_INODES"
          test "$vendor_config_observed_bytes" -le "$VENDOR_CONFIG_MAX_BYTES"
          test "$vendor_config_observed_inodes" -le "$VENDOR_CONFIG_MAX_INODES"
          printf 'vendor_volume_name=%s\nvendor_config_volume_name=%s\nvendor_metrics=%s\nvendor_volume_spec=%s\nvendor_config_volume_spec=%s\nvendor_digest=%s\nvendor_config_digest=%s\nvendor_observed_bytes=%s\nvendor_observed_files=%s\nvendor_observed_inodes=%s\nvendor_config_observed_bytes=%s\nvendor_config_observed_inodes=%s\n' "$vendor_volume_name" "$vendor_config_volume_name" "$vendor_metrics" "$vendor_volume_spec" "$vendor_config_volume_spec" "$vendor_digest" "$vendor_config_digest" "$vendor_observed_bytes" "$vendor_observed_files" "$vendor_observed_inodes" "$vendor_config_observed_bytes" "$vendor_config_observed_inodes" >> "$GITHUB_OUTPUT"
          trap - EXIT
          echo "PASS: locked dependency closure acquired inside Docker-managed bounded tmpfs volumes"
          echo "vendor_digest=$vendor_digest"
          echo "vendor_observed_bytes=$vendor_observed_bytes"
          echo "vendor_observed_files=$vendor_observed_files"
          echo "vendor_observed_inodes=$vendor_observed_inodes"
          echo "vendor_config_digest=$vendor_config_digest"
          echo "vendor_config_observed_bytes=$vendor_config_observed_bytes"
          echo "vendor_config_observed_inodes=$vendor_config_observed_inodes"
      - name: Execute sandbox negative controls
        id: sandbox_negative_controls
        env:
          CANDIDATE_VOLUME_NAME: ${{ steps.resolve_source.outputs.source_volume_name }}
          VENDOR_VOLUME_NAME: ${{ steps.vendor_dependencies.outputs.vendor_volume_name }}
          VENDOR_CONFIG_VOLUME_NAME: ${{ steps.vendor_dependencies.outputs.vendor_config_volume_name }}
          SANDBOX_IMAGE: "docker.io/library/rust@sha256:9af5f5f37d3035dd18d216e348e946ff1fc8c7fa7998c7443cedfe880231110d"
        shell: bash
        run: |
          set -euo pipefail
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          sentinel="$RUNNER_TEMP/security-kernel-trusted-sentinel"
          printf '%s\n' 'security-kernel-trusted-sentinel-v1' > "$sentinel"
          chmod 0444 "$sentinel"
          sentinel_digest="$(sha256sum "$sentinel" | awk '{print $1}')"
          container_name="security-kernel-negative-controls-$RANDOM"
          if ! existing_containers="$(docker ps -aq --filter "name=^/${container_name}$")"; then
            echo "security-kernel negative-control container inventory query failed" >&2
            exit 1
          fi
          if [ -n "$existing_containers" ]; then
            echo "security-kernel negative-control container name collision" >&2
            exit 1
          fi
          negative_control_cleanup_on_exit() {
            local status=$?
            if ! remaining_containers="$(docker ps -aq --filter "name=^/${container_name}$")"; then
              status=1
            elif [ -n "$remaining_containers" ]; then
              if ! docker rm -f "$container_name" >/dev/null 2>&1; then status=1; fi
              if ! post_cleanup_containers="$(docker ps -aq --filter "name=^/${container_name}$")"; then
                status=1
              elif [ -n "$post_cleanup_containers" ]; then
                status=1
              fi
            fi
            trap - EXIT
            exit "$status"
          }
          trap negative_control_cleanup_on_exit EXIT
          negative_controls_capture_limit=65536
          negative_controls_log="$RUNNER_TEMP/security-kernel-negative-controls.log"
          capture_negative_controls_output() {
            python3 - "$negative_controls_log" "$negative_controls_capture_limit" <<'PY'
          import pathlib, sys
          output=pathlib.Path(sys.argv[1]); limit=int(sys.argv[2]); written=0; overflow=False
          with output.open("wb") as handle:
              while True:
                  chunk=sys.stdin.buffer.read(65536)
                  if not chunk:
                      break
                  if written < limit:
                      remaining=limit-written
                      handle.write(chunk[:remaining])
                      written += min(len(chunk), remaining)
                      if len(chunk) > remaining:
                          overflow=True
                  else:
                      overflow=True
          if overflow:
              print(f"security-kernel negative-controls transcript capture exceeded {limit} bytes", file=sys.stderr)
              raise SystemExit(1)
          PY
          }
          set +e
          {
          timeout --signal=TERM --kill-after=20s 3m docker run --label "security-kernel.run=$GITHUB_RUN_ID" --label "security-kernel.attempt=$GITHUB_RUN_ATTEMPT" --name "$container_name" --rm --platform=linux/amd64 --pull=never \
            --network=none \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            --security-opt=seccomp=default \
            --pids-limit=128 \
            --memory=256m \
            --memory-swap=256m \
            --cpus=1 \
            --ulimit=nofile=2048:2048 \
            --ulimit=core=0:0 \
            --user "$runner_uid:$runner_gid" \
            --init \
            --stop-timeout=5 \
            --ipc=private \
            --pid=private \
            --cgroupns=private \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m,nr_inodes=8192 \
            --volume "$CANDIDATE_VOLUME_NAME:/source:ro" \
            --volume "$VENDOR_VOLUME_NAME:/vendor:ro" \
            --volume "$VENDOR_CONFIG_VOLUME_NAME:/vendor-config:ro" \
            --volume "$sentinel:/trusted-sentinel:ro" \
            --env GITHUB_TOKEN= \
            --env GH_TOKEN= \
            --env ACTIONS_ID_TOKEN_REQUEST_TOKEN= \
            --env ACTIONS_ID_TOKEN_REQUEST_URL= \
            --env ACTIONS_RUNTIME_TOKEN= \
            "$SANDBOX_IMAGE" /bin/bash -euo pipefail -s <<'CONTAINER_SCRIPT'
              set -euo pipefail
              must_fail() {
                if "$@" >/tmp/negative-control-output 2>&1; then
                  echo "negative control unexpectedly succeeded: $*" >&2
                  cat /tmp/negative-control-output >&2 || true
                  exit 1
                fi
              }
              test "$(id -u)" -ne 0
              test "$(awk "/^CapEff:/{print \\$2}" /proc/self/status)" = "0000000000000000"
              grep -Eq "^NoNewPrivs:[[:space:]]+1$" /proc/self/status
              grep -Eq "^Seccomp:[[:space:]]+2$" /proc/self/status
              grep -Eq "^Seccomp_filters:[[:space:]]+[1-9][0-9]*$" /proc/self/status
              test -z "${GITHUB_TOKEN:-}"
              test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
              test -z "${ACTIONS_RUNTIME_TOKEN:-}"
              test ! -e /var/run/docker.sock
              test ! -e /dev/kvm
              test ! -e /dev/mem
              test ! -e /dev/kmem
              test ! -e /dev/kmsg
              test ! -e /home/runner
              test "$(tail -n +2 /proc/net/route | wc -l)" -eq 0
              test "$(tail -n +2 /proc/net/ipv6_route | wc -l)" -eq 0
              test ! -w /
              test ! -w /source
              test ! -w /vendor
              test ! -w /vendor-config/config.toml
              test ! -w /trusted-sentinel
              must_fail touch /.negative-rootfs-write
              must_fail sh -c "printf x >> /source/.negative-source-write"
              must_fail sh -c "printf x >> /vendor/.negative-vendor-write"
              must_fail sh -c "printf x >> /vendor-config/config.toml"
              must_fail sh -c "printf x >> /trusted-sentinel"
              must_fail sh -c "echo probe >/dev/tcp/1.1.1.1/80"
              (sleep 30) & child=$!
              kill -0 "$child"
              kill "$child"
              echo "PASS: active negative controls rejected writable-root, source/vendor/config mutation, token visibility, device exposure, network access, and untrusted background-process assumptions"
            '
          } 2>&1 | capture_negative_controls_output
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          test "${pipeline_status[0]}" -eq 0
          test "${pipeline_status[1]}" -eq 0
          test -s "$negative_controls_log"
          cat "$RUNNER_TEMP/security-kernel-negative-controls.log"
          if ! remaining_containers="$(docker ps -aq --filter "name=^/${container_name}$")"; then
            echo "security-kernel negative-control container inventory query failed after run" >&2
            exit 1
          fi
          test -z "$remaining_containers"
          test "$(sha256sum "$sentinel" | awk '{print $1}')" = "$sentinel_digest"
          rm -f "$sentinel"
          negative_controls_log_digest="$(sha256sum "$RUNNER_TEMP/security-kernel-negative-controls.log" | awk '{print $1}')"
          printf '%s' "$negative_controls_log_digest" | grep -Eq '^[0-9a-f]{64}$'
          printf 'negative_controls=passed\nsentinel_digest=%s\nnegative_controls_log_digest=%s\n' "$sentinel_digest" "$negative_controls_log_digest" >> "$GITHUB_OUTPUT"
          echo "PASS: trusted sandbox negative-control matrix passed"

      - name: Upload sandbox negative-control transcript
        if: success()
        id: negative_controls_log_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-kernel-negative-controls-${{ inputs.candidate_sha }}-attempt-${{ github.run_attempt }}.log
          path: ${{ runner.temp }}/security-kernel-negative-controls.log
          if-no-files-found: error
          archive: false
          overwrite: false
          retention-days: 90
      - name: Execute candidate qualification in disposable networkless sandbox
        shell: bash
        env:
          CANDIDATE_VOLUME_NAME: ${{ steps.resolve_source.outputs.source_volume_name }}
          VENDOR_VOLUME_NAME: ${{ steps.vendor_dependencies.outputs.vendor_volume_name }}
          VENDOR_CONFIG_VOLUME_NAME: ${{ steps.vendor_dependencies.outputs.vendor_config_volume_name }}
          SANDBOX_IMAGE: "docker.io/library/rust@sha256:9af5f5f37d3035dd18d216e348e946ff1fc8c7fa7998c7443cedfe880231110d"
        run: |
          set -euo pipefail
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          vendor_cleanup_on_failure() {
            local status=$?
            if [ "$status" -ne 0 ]; then
              if ! docker volume rm "$VENDOR_VOLUME_NAME" >/dev/null 2>&1; then status=1; fi
              if ! remaining_vendor_volumes="$(docker volume ls --format '{{.Name}}')"; then
                status=1
              elif printf "%s\n" "$remaining_vendor_volumes" | grep -Fxq "$VENDOR_VOLUME_NAME"; then
                status=1
              fi
            fi
            trap - EXIT
            exit "$status"
          }
          trap vendor_cleanup_on_failure EXIT

          run_sandbox() {
            local wall="$1"
            local script="$2"
            local name="security-kernel-sandbox-$BASHPID"
            if ! existing_containers="$(docker ps -aq --filter "name=^/${name}$")"; then
              echo "security-kernel sandbox container inventory query failed" >&2
              return 1
            fi
            if [ -n "$existing_containers" ]; then
              echo "security-kernel sandbox container name collision" >&2
              return 1
            fi
            set +e
            timeout --signal=TERM --kill-after=30s "$wall" docker run --label "security-kernel.run=$GITHUB_RUN_ID" --label "security-kernel.attempt=$GITHUB_RUN_ATTEMPT" --name "$name" --rm --platform=linux/amd64 --pull=never \
              --network=none \
              --read-only \
              --cap-drop=ALL \
              --security-opt=no-new-privileges:true \
              --security-opt=seccomp=default \
              --pids-limit=512 \
              --memory=12g \
              --memory-swap=12g \
              --cpus=3 \
              --ulimit=nofile=4096:4096 \
              --ulimit=core=0:0 \
              --user "$runner_uid:$runner_gid" \
              --init \
              --stop-timeout=5 \
              --ipc=private \
              --pid=private \
              --cgroupns=private \
              --tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m,nr_inodes=32768 \
              --tmpfs /cargo-home:rw,nosuid,nodev,noexec,size=512m,nr_inodes=150000 \
              --tmpfs /target:rw,nosuid,nodev,size=8g,nr_inodes=600000 \
              --volume "$CANDIDATE_VOLUME_NAME:/source:ro" \
              --volume "$VENDOR_VOLUME_NAME:/vendor:ro" \
              --workdir /source/crates/mycelix-bridge-common \
              --volume "$VENDOR_CONFIG_VOLUME_NAME:/vendor-config:ro" \
              --env HOME=/cargo-home \
              --env CARGO_HOME=/cargo-home \
              --env RUSTUP_HOME=/dev/null \
              --env PATH=/usr/local/cargo/bin:/usr/local/bin:/usr/bin:/bin \
              --env CARGO_NET_OFFLINE=true \
              --env CARGO_TARGET_DIR=/target \
              --env CARGO_TERM_COLOR=never \
              --env GITHUB_TOKEN= \
              --env GH_TOKEN= \
              --env ACTIONS_ID_TOKEN_REQUEST_TOKEN= \
              --env ACTIONS_ID_TOKEN_REQUEST_URL= \
              --env ACTIONS_RUNTIME_TOKEN= \
              "$SANDBOX_IMAGE" /bin/bash -euc "
                run_limited() {
                  local output=/tmp/security-kernel-gate-output
                  rm -f \$output
                  set +e
                  \"\$@\" >\"\$output\" 2>&1
                  local status=\$?
                  tail -n 400 \"\$output\"
                  rm -f \"\$output\"
                  set -e
                  return \$status
                }
                $script
              "
            local status=$?
            set -e
            local remaining
            if ! remaining="$(docker ps -aq --filter "name=^/${name}$")"; then
              echo "security-kernel sandbox container inventory query failed while checking cleanup" >&2
              return 1
            fi
            if [ -n "$remaining" ]; then
              if ! docker rm -f "$name" >/dev/null 2>&1; then
                echo "security-kernel sandbox cleanup failed" >&2
                return 1
              fi
            fi
            if ! remaining="$(docker ps -aq --filter "name=^/${name}$")"; then
              echo "security-kernel sandbox container inventory query failed while checking cleanup" >&2
              return 1
            fi
            if [ -n "$remaining" ]; then
              echo "security-kernel sandbox container remains after cleanup" >&2
              return 1
            fi
            return "$status"
          }

          run_sandbox 2m '
            test "$(rustc --version | awk "{print \\$2}")" = "1.99.0"
            test "$(rustc --version --verbose | sed -n "s/^commit-hash: //p")" = "b940084d7eb6a299eb4bfeb8e34901bc051e7ac4"
            test "$(grep -E "^NoNewPrivs:" /proc/self/status | awk "{print \\$2}")" = "1"
            test "$(grep -E "^Seccomp:" /proc/self/status | awk "{print \\$2}")" = "2"
            test "$(grep -E "^Seccomp_filters:" /proc/self/status | awk "{print \\$2}")" -gt 0
            test "$(awk "/^CapEff:/{print \\$2}" /proc/self/status)" = "0000000000000000"
            test -z "${GITHUB_TOKEN:-}"
            test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
            test ! -e /var/run/docker.sock
            test ! -e /dev/kvm
            test ! -e /dev/mem
            test ! -e /dev/kmem
            test ! -e /dev/kmsg
            test ! -e /home/runner
            test -w /target
            test -w /tmp
            test ! -w /
            if touch /source/.security-kernel-write-probe 2>/dev/null; then
              echo "candidate source mount is unexpectedly writable" >&2
              exit 1
            fi
            if bash -c "echo probe >/dev/tcp/1.1.1.1/80" 2>/dev/null; then
              echo "network unexpectedly reachable inside candidate sandbox" >&2
              exit 1
            fi
            test -x /usr/local/cargo/bin/cargo
            test -x /usr/local/cargo/bin/rustc
            rustfmt --version
            cargo-clippy --version
            run_limited cargo fmt --manifest-path /source/crates/mycelix-bridge-common/Cargo.toml -- --check
          '

          run_sandbox 9m '
            run_limited cargo --config /vendor-config/config.toml test --frozen --manifest-path /source/crates/mycelix-bridge-common/Cargo.toml --jobs 3
          '

          run_sandbox 9m '
            run_limited cargo --config /vendor-config/config.toml test --frozen --manifest-path /source/crates/mycelix-bridge-common/Cargo.toml --features identity --jobs 3
          '

          run_sandbox 9m '
            run_limited cargo --config /vendor-config/config.toml clippy --frozen --manifest-path /source/crates/mycelix-bridge-common/Cargo.toml --all-targets --jobs 3 -- -D warnings
          '

          run_sandbox 9m '
            run_limited cargo --config /vendor-config/config.toml clippy --frozen --manifest-path /source/crates/mycelix-bridge-common/Cargo.toml --all-targets --features identity --jobs 3 -- -D warnings
          '

          echo "PASS: all candidate compilation/test/lint gates executed in fresh disposable networkless sandboxes"

      - name: Verify candidate source immutability
        id: verify_candidate_source
        env:
          CANDIDATE_VOLUME_NAME: ${{ steps.resolve_source.outputs.source_volume_name }}
          EXPECTED_SOURCE_DIGEST: ${{ steps.snapshot_source.outputs.source_staging_digest }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_volume_spec_after="$(docker volume inspect --format '{{.Driver}}|{{index .Options "type"}}|{{index .Options "device"}}|{{index .Options "o"}}' "$CANDIDATE_VOLUME_NAME")"
          test "$candidate_volume_spec_after" = "local|tmpfs|tmpfs|rw,nosuid,nodev,noexec,size=1024m,nr_inodes=300000"
          candidate_volume_mountpoint="$(docker volume inspect --format '{{.Mountpoint}}' "$CANDIDATE_VOLUME_NAME")"
          test "$(stat -f -c '%T' "$candidate_volume_mountpoint")" = "tmpfs"
          python3 - "$candidate_volume_mountpoint" "$EXPECTED_SOURCE_DIGEST" <<'PY' > "$RUNNER_TEMP/security-kernel-executed-source-digest.txt"
          import hashlib, pathlib, stat, sys
          root=pathlib.Path(sys.argv[1]); expected=sys.argv[2].strip(); digest=hashlib.sha256()
          for path in sorted(root.rglob("*")):
              rel=path.relative_to(root); mode=path.lstat().st_mode
              if stat.S_ISLNK(mode): raise SystemExit(f"candidate source contains forbidden symlink: {rel}")
              if path.is_dir(): continue
              if not stat.S_ISREG(mode): raise SystemExit(f"candidate source contains forbidden non-regular file: {rel}")
              content=path.read_bytes(); relative=rel.as_posix().encode(); mode_bits=stat.S_IMODE(mode)
              digest.update(mode_bits.to_bytes(4,"big")); digest.update(len(relative).to_bytes(8,"big")); digest.update(relative); digest.update(len(content).to_bytes(8,"big")); digest.update(content)
          after=digest.hexdigest(); assert expected==after, f"candidate source mutated during qualification: {expected} != {after}"
          print(f"executed_source_digest={after}")
          PY
          executed_source_digest="$(sed -n 's/^executed_source_digest=//p' "$RUNNER_TEMP/security-kernel-executed-source-digest.txt")"
          printf "%s" "$executed_source_digest" | grep -Eq '^[0-9a-f]{64}$'
          printf 'executed_source_digest=%s\n' "$executed_source_digest" >> "$GITHUB_OUTPUT"
          printf "%s" "$executed_source_digest" | grep -Eq '^[0-9a-f]{64}$'
          echo "PASS: bounded Docker tmpfs candidate source remained immutable through qualification"
      - name: Cleanup candidate source substrate
        if: ${{ !cancelled() && steps.resolve_source.outcome == 'success' }}
        env:
