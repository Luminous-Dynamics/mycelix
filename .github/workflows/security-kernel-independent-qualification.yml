        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a0 # v7.0.1
        with:
          name: security-kernel-independent-qualification-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/security-kernel-independent-qualification.txt

          printf '%s' "$TRUSTED_WORKFLOW_BLOB_SHA" | grep -Eq '^[0-9a-f]{40}        shell: bash
        env:
          TOKEN: ${{ github.token }}
          CANDIDATE_PR: ${{ inputs.candidate_pr }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
