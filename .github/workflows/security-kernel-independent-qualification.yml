                  rm -f \"\$output\"
                  set -e
                  return \$status
                }
                $script
              "
            local status=$?
            set -e
            local remaining
            if ! remaining="$(docker ps -aq --filter "name=^/${name}$")"; then
              echo "security-kernel sandbox container inventory query failed while checking cleanup" >&2
              return 1
            fi
            if [ -n "$remaining" ]; then
              if ! docker rm -f "$name" >/dev/null 2>&1; then
                echo "security-kernel sandbox cleanup failed" >&2
                return 1
              fi
            fi
            if ! remaining="$(docker ps -aq --filter "name=^/${name}$")"; then
              echo "security-kernel sandbox container inventory query failed while checking cleanup" >&2
              return 1
            fi
            if [ -n "$remaining" ]; then
              echo "security-kernel sandbox container remains after cleanup" >&2
              return 1
            fi
            return "$status"
          }

          run_sandbox 2m '
            test "$(rustc --version | awk "{print \\$2}")" = "1.99.0"
            test "$(rustc --version --verbose | sed -n "s/^commit-hash: //p")" = "b940084d7eb6a299eb4bfeb8e34901bc051e7ac4"
            test "$(grep -E "^NoNewPrivs:" /proc/self/status | awk "{print \\$2}")" = "1"
            test "$(grep -E "^Seccomp:" /proc/self/status | awk "{print \\$2}")" = "2"
            test "$(grep -E "^Seccomp_filters:" /proc/self/status | awk "{print \\$2}")" -gt 0
            test "$(awk "/^CapEff:/{print \\$2}" /proc/self/status)" = "0000000000000000"
            test -z "${GITHUB_TOKEN:-}"
            test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
            test ! -e /var/run/docker.sock
            test ! -e /dev/kvm
            test ! -e /dev/mem
            test ! -e /dev/kmem
            test ! -e /dev/kmsg
            test ! -e /home/runner
            test -w /target
            test -w /tmp
            test ! -w /
            if touch /source/.security-kernel-write-probe 2>/dev/null; then
              echo "candidate source mount is unexpectedly writable" >&2
              exit 1
            fi
            if bash -c "echo probe >/dev/tcp/1.1.1.1/80" 2>/dev/null; then
              echo "network unexpectedly reachable inside candidate sandbox" >&2
              exit 1
            fi
            test -x /usr/local/cargo/bin/cargo
            test -x /usr/local/cargo/bin/rustc
            rustfmt --version
            cargo-clippy --version
            run_limited cargo fmt --manifest-path /source/crates/mycelix-bridge-common/Cargo.toml -- --check
          '

          run_sandbox 9m '
            run_limited cargo --config /vendor-config/config.toml test --frozen --manifest-path /source/crates/mycelix-bridge-common/Cargo.toml --jobs 3
          '

          run_sandbox 9m '
            run_limited cargo --config /vendor-config/config.toml test --frozen --manifest-path /source/crates/mycelix-bridge-common/Cargo.toml --features identity --jobs 3
          '

          run_sandbox 9m '
            run_limited cargo --config /vendor-config/config.toml clippy --frozen --manifest-path /source/crates/mycelix-bridge-common/Cargo.toml --all-targets --jobs 3 -- -D warnings
          '

          run_sandbox 9m '
            run_limited cargo --config /vendor-config/config.toml clippy --frozen --manifest-path /source/crates/mycelix-bridge-common/Cargo.toml --all-targets --features identity --jobs 3 -- -D warnings
          '

          echo "PASS: all candidate compilation/test/lint gates executed in fresh disposable networkless sandboxes"

      - name: Verify candidate source immutability
        env:
          CANDIDATE_ROOT: ${{ runner.temp }}/security-kernel-candidate-src
          EXPECTED_SOURCE_DIGEST: ${{ steps.snapshot_source.outputs.source_digest }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$CANDIDATE_ROOT" "$EXPECTED_SOURCE_DIGEST" <<'PY'
          import hashlib, pathlib, stat, sys
          root=pathlib.Path(sys.argv[1])
          expected=sys.argv[2].strip()
          digest=hashlib.sha256()
          for path in sorted(root.rglob("*")):
              rel=path.relative_to(root)
              mode=path.lstat().st_mode
              if stat.S_ISLNK(mode):
                  raise SystemExit(f"candidate source contains forbidden symlink: {rel}")
              if path.is_dir():
                  continue
              if not stat.S_ISREG(mode):
                  raise SystemExit(f"candidate source contains forbidden non-regular file: {rel}")
              relative = rel.as_posix().encode()
              content = path.read_bytes()
              mode_bits = stat.S_IMODE(mode)
              digest.update(mode_bits.to_bytes(4, "big"))
              digest.update(len(relative).to_bytes(8, "big"))
              digest.update(relative)
              digest.update(len(content).to_bytes(8, "big"))
              digest.update(content)
          after=digest.hexdigest()
          assert expected == after, f"candidate source mutated during qualification: {expected} != {after}"
          print("PASS: candidate source remained immutable and regular-file-only")
          PY

      - name: Verify dependency substrate immutability
        id: dependency_postflight
        env:
          VENDOR_VOLUME_NAME: ${{ steps.vendor_dependencies.outputs.vendor_volume_name }}
          EXPECTED_VENDOR_DIGEST: ${{ steps.vendor_dependencies.outputs.vendor_digest }}
          SANDBOX_IMAGE: "docker.io/library/rust@sha256:9af5f5f37d3035dd18d216e348e946ff1fc8c7fa7998c7443cedfe880231110d"
        shell: bash
        run: |
          set -euo pipefail
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          vendor_cleanup_on_failure() {
            local status=$?
            if [ "$status" -ne 0 ]; then
              if ! docker volume rm "$VENDOR_VOLUME_NAME" >/dev/null 2>&1; then status=1; fi
              if ! remaining_vendor_volumes="$(docker volume ls --format '{{.Name}}')"; then
                status=1
              elif printf "%s\n" "$remaining_vendor_volumes" | grep -Fxq "$VENDOR_VOLUME_NAME"; then
                status=1
              fi
            fi
            trap - EXIT
            exit "$status"
          }
          trap vendor_cleanup_on_failure EXIT
          docker run --rm --platform=linux/amd64 --pull=never \
            --network=none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges:true --security-opt=seccomp=default \
            --pids-limit=128 --memory=256m --memory-swap=256m --cpus=1 \
            --ulimit=nofile=2048:2048 --ulimit=core=0:0 \
            --user "$runner_uid:$runner_gid" --ipc=private --pid=private --cgroupns=private \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            --volume "$VENDOR_VOLUME_NAME:/vendor:ro" \
            "$SANDBOX_IMAGE" /bin/bash -euc '
              python3 - "$EXPECTED_VENDOR_DIGEST" /vendor <<\PY
              import hashlib, pathlib, stat, sys
              expected=sys.argv[1]; vendor=pathlib.Path(sys.argv[2]); digest=hashlib.sha256()
              for path in sorted(vendor.rglob('*')):
                  rel=path.relative_to(vendor); mode=path.lstat().st_mode
                  if stat.S_ISLNK(mode) or (not path.is_dir() and not stat.S_ISREG(mode)): raise SystemExit(f'forbidden vendor file type: {rel}')
                  if path.is_dir(): continue
                  relative=rel.as_posix().encode(); content=path.read_bytes()
                  digest.update(stat.S_IMODE(mode).to_bytes(4,'big')); digest.update(len(relative).to_bytes(8,'big')); digest.update(relative); digest.update(len(content).to_bytes(8,'big')); digest.update(content)
              observed=digest.hexdigest()
              if observed != expected: raise SystemExit(f'vendor substrate mutated: {expected} != {observed}')
              print('PASS: vendored dependency substrate remained immutable and regular-file-only')
              PY
            '
          if ! docker volume rm "$VENDOR_VOLUME_NAME" >/dev/null; then
            echo "security-kernel vendor volume cleanup failed" >&2
            exit 1
          fi
          if ! remaining_vendor_volumes="$(docker volume ls --format '{{.Name}}')"; then
            echo "security-kernel vendor volume inventory query failed after cleanup" >&2
            exit 1
          fi
          if printf "%s\n" "$remaining_vendor_volumes" | grep -Fxq "$VENDOR_VOLUME_NAME"; then
            echo "security-kernel vendor volume remains after cleanup" >&2
            exit 1
          fi
          trap - EXIT
          printf 'dependency_substrate=passed\n' >> "$GITHUB_OUTPUT"
          echo "PASS: bounded vendor volume was independently re-hashed and removed fail-closed"
      - name: Emit qualification receipt
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_PR: ${{ inputs.candidate_pr }}
          CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository }}
          CANDIDATE_REPOSITORY_ID: ${{ inputs.candidate_repository_id }}
          CALLED_WORKFLOW_REF: ${{ job.workflow_ref }}
          CALLED_WORKFLOW_SHA: ${{ job.workflow_sha }}
          CANDIDATE_TREE: ${{ steps.resolve_source.outputs.candidate_tree }}
          SOURCE_TREE_ENTRY_COUNT: ${{ steps.resolve_source.outputs.source_tree_entry_count }}
          SOURCE_FILE_COUNT: ${{ steps.resolve_source.outputs.source_file_count }}
          SOURCE_TOTAL_PATH_BYTES: ${{ steps.resolve_source.outputs.source_total_path_bytes }}
          SOURCE_TOTAL_BYTES: ${{ steps.resolve_source.outputs.source_total_bytes }}
          SOURCE_MAX_BLOB_BYTES: ${{ steps.resolve_source.outputs.source_max_blob_bytes }}
          SOURCE_DIGEST: ${{ steps.snapshot_source.outputs.source_digest }}
          LOCK_PACKAGE_COUNT: ${{ steps.locked_dependency_identity.outputs.lock_package_count }}
          LOCK_DEPENDENCY_EDGES: ${{ steps.locked_dependency_identity.outputs.lock_dependency_edges }}
          VENDOR_RESOURCE_PROFILE: ${{ env.VENDOR_RESOURCE_PROFILE }}
          VENDOR_MAX_BYTES: ${{ env.VENDOR_MAX_BYTES }}
          VENDOR_MAX_FILES: ${{ env.VENDOR_MAX_FILES }}
          VENDOR_MAX_INODES: ${{ env.VENDOR_MAX_INODES }}
          VENDOR_TMPFS_SIZE: ${{ env.VENDOR_TMPFS_SIZE }}
          VENDOR_TMPFS_NR_INODES: ${{ env.VENDOR_TMPFS_NR_INODES }}
          VENDOR_OBSERVED_BYTES: ${{ steps.vendor_dependencies.outputs.vendor_observed_bytes }}
          VENDOR_OBSERVED_FILES: ${{ steps.vendor_dependencies.outputs.vendor_observed_files }}
          VENDOR_OBSERVED_INODES: ${{ steps.vendor_dependencies.outputs.vendor_observed_inodes }}
          VENDOR_DIGEST: ${{ steps.vendor_dependencies.outputs.vendor_digest }}
          NEGATIVE_CONTROLS: ${{ steps.sandbox_negative_controls.outputs.negative_controls }}
          NEGATIVE_CONTROLS_LOG_DIGEST: ${{ steps.sandbox_negative_controls.outputs.negative_controls_log_digest }}
          DEPENDENCY_POSTFLIGHT: ${{ steps.dependency_postflight.outputs.dependency_substrate }}
          LOCK_DIGEST: ${{ steps.locked_dependency_identity.outputs.lock_digest }}
          RUST_VERSION: ${{ steps.sandbox_preflight.outputs.rust_version }}
          RUST_COMMIT: ${{ steps.sandbox_preflight.outputs.rust_commit }}
          FETCH_IMAGE: "docker.io/bitnami/git@sha256:3b25b57de5a24330fe87931ef20285b1cf965fabaf3156ce5c5f0eecf37d5329"
        shell: bash
        run: |
          set -euo pipefail
          CARGO_LOCK_DIGEST="$LOCK_DIGEST"
          {
            echo "schema=security-kernel-independent-qualification-v1"
            echo "candidate_repository=$CANDIDATE_REPOSITORY"
            echo "candidate_repository_id=$CANDIDATE_REPOSITORY_ID"
            echo "candidate_pr=$CANDIDATE_PR"
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "candidate_tree=$CANDIDATE_TREE"
            echo "candidate_source_tree_entry_count=$SOURCE_TREE_ENTRY_COUNT"
            echo "candidate_source_file_count=$SOURCE_FILE_COUNT"
            echo "candidate_source_total_path_bytes=$SOURCE_TOTAL_PATH_BYTES"
            echo "candidate_source_total_bytes=$SOURCE_TOTAL_BYTES"
            echo "candidate_source_max_blob_bytes=$SOURCE_MAX_BLOB_BYTES"
            echo "candidate_source_digest=$SOURCE_DIGEST"
            echo "candidate_cargo_lock_format=v4"
            echo "candidate_cargo_lock_sha256=$CARGO_LOCK_DIGEST"
            echo "candidate_cargo_lock_package_count=$LOCK_PACKAGE_COUNT"
            echo "candidate_cargo_lock_dependency_edges=$LOCK_DEPENDENCY_EDGES"
            echo "vendor_resource_profile=$VENDOR_RESOURCE_PROFILE"
            echo "vendor_max_bytes=$VENDOR_MAX_BYTES"
            echo "vendor_max_files=$VENDOR_MAX_FILES"
            echo "vendor_max_inodes=$VENDOR_MAX_INODES"
            echo "vendor_tmpfs_size=$VENDOR_TMPFS_SIZE"
            echo "vendor_tmpfs_nr_inodes=$VENDOR_TMPFS_NR_INODES"
            echo "vendor_observed_bytes=$VENDOR_OBSERVED_BYTES"
            echo "vendor_observed_files=$VENDOR_OBSERVED_FILES"
            echo "vendor_observed_inodes=$VENDOR_OBSERVED_INODES"
            echo "vendor_resource_measurement=bounded-pass"
            echo "vendor_digest=$VENDOR_DIGEST"
            echo "sandbox_negative_controls=$NEGATIVE_CONTROLS"
            echo "sandbox_negative_controls_log_sha256=$NEGATIVE_CONTROLS_LOG_DIGEST"
            echo "dependency_substrate_postflight=$DEPENDENCY_POSTFLIGHT"
            echo "git_fetch_image=$FETCH_IMAGE"
            echo "sandbox_image=docker.io/library/rust@sha256:9af5f5f37d3035dd18d216e348e946ff1fc8c7fa7998c7443cedfe880231110d"
            echo "sandbox_network=none"
            echo "sandbox_rootfs=read-only"
            echo "sandbox_user=non-root"
            echo "sandbox_capabilities=all-dropped"
            echo "sandbox_no_new_privileges=true"
            echo "source_event=pull_request_target"
            echo "trusted_dispatcher_workflow=$GITHUB_WORKFLOW_REF"
            echo "trusted_workflow_ref=$GITHUB_WORKFLOW_REF"
            echo "trusted_workflow_sha=$GITHUB_WORKFLOW_SHA"
            echo "trusted_workflow_name=$GITHUB_WORKFLOW"
            echo "trusted_repository_id=$BASE_REPOSITORY_ID"
            echo "trusted_workflow_repository=$CALLED_WORKFLOW_REPOSITORY"
            echo "trusted_workflow_file_path=$CALLED_WORKFLOW_FILE_PATH"
            echo "trusted_ref_protected=$GITHUB_REF_PROTECTED"
            echo "cache_mode=${ACTIONS_CACHE_MODE:-}"
            echo "registered_s1_workflow_blob_sha=$TRUSTED_WORKFLOW_BLOB_SHA"
            echo "called_workflow_ref=$CALLED_WORKFLOW_REF"
            echo "called_workflow_sha=$CALLED_WORKFLOW_SHA"
            echo "s1_run_id=$GITHUB_RUN_ID"
            echo "s1_run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "rust_version=$RUST_VERSION"
            echo "rust_commit=$RUST_COMMIT"
            echo "qualification_pass=true"
          receipt_path="$RUNNER_TEMP/security-kernel-independent-qualification-${CANDIDATE_SHA}-attempt-${GITHUB_RUN_ATTEMPT}.txt"
          } > "$receipt_path"
          cat "$receipt_path"

      - name: Upload qualification receipt
        if: success()
        id: receipt_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-kernel-independent-qualification-${{ inputs.candidate_sha }}-attempt-${{ github.run_attempt }}.txt
          path: ${{ runner.temp }}/security-kernel-independent-qualification-${{ inputs.candidate_sha }}-attempt-${{ github.run_attempt }}.txt
          if-no-files-found: error
          archive: false
          overwrite: false
          retention-days: 90

      - name: Verify retained qualification receipt
        if: success()
        env:
          TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_ID: ${{ steps.receipt_upload.outputs.artifact-id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ steps.receipt_upload.outputs.artifact-digest }}
          EXPECTED_ARTIFACT_NAME: security-kernel-independent-qualification-${{ inputs.candidate_sha }}-attempt-${{ github.run_attempt }}.txt
          RUN_ID: ${{ github.run_id }}
          BASE_REPOSITORY: "Luminous-Dynamics/mycelix"
          RECEIPT_PATH: ${{ runner.temp }}/security-kernel-independent-qualification-${{ inputs.candidate_sha }}-attempt-${{ github.run_attempt }}.txt
        shell: bash
        run: |
          set -euo pipefail
          printf "%s" "$EXPECTED_ARTIFACT_ID" | grep -Eq "^[0-9]+$"
          printf "%s" "$EXPECTED_ARTIFACT_DIGEST" | grep -Eq "^[0-9a-f]{64}$"
          local_receipt_digest="$(sha256sum "$RECEIPT_PATH" | awk '{print $1}')"
          test "$local_receipt_digest" = "$EXPECTED_ARTIFACT_DIGEST"
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ["BASE_REPOSITORY"]
          artifact_id=os.environ["EXPECTED_ARTIFACT_ID"]
          req=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}",
              headers={
                  "Accept":"application/vnd.github+json",
                  "Authorization":f"Bearer {os.environ['TOKEN']}",
                  "X-GitHub-Api-Version":"2022-11-28",
              })
          with urllib.request.urlopen(req, timeout=20) as response:
              artifact=json.load(response)
          assert str(artifact["id"]) == artifact_id
          assert artifact["name"] == os.environ["EXPECTED_ARTIFACT_NAME"]
          assert artifact.get("expired") is False
          assert artifact.get("workflow_run", {}).get("id") == int(os.environ["RUN_ID"])
          assert artifact.get("digest") == "sha256:" + os.environ["EXPECTED_ARTIFACT_DIGEST"]
          assert int(artifact.get("size_in_bytes", 0)) > 0
          print("PASS: retained qualification receipt artifact is bound to this exact workflow run and upload digest")
          PY


          printf 'negative_controls=passed\nsentinel_digest=%s\nnegative_controls_log_digest=%s\n' "$sentinel_digest" "$negative_controls_log_digest" >> "$GITHUB_OUTPUT"
