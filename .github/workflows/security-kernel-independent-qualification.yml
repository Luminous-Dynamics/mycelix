            exit "$status"
          }
          trap vendor_cleanup_on_failure EXIT
          set +e
          docker run --rm --platform=linux/amd64 --pull=never \
            --network=bridge --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges:true --security-opt=seccomp=default \
            --pids-limit=256 --memory=2g --memory-swap=2g --cpus=2 \
            --ulimit=nofile=4096:4096 --ulimit=core=0:0 \
            --user "$runner_uid:$runner_gid" --ipc=private --pid=private --cgroupns=private \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=128m \
            --tmpfs /cargo-home:rw,nosuid,nodev,noexec,size=512m \
            --volume "$vendor_volume_name:/vendor:rw" \
            --volume "$DEPENDENCY_ROOT:/subject:ro" \
            --volume "$vendor_config:/vendor-config:rw" \
            --volume "$vendor_metrics:/vendor-metrics:rw" \
            --env HOME=/cargo-home --env CARGO_HOME=/cargo-home \
            --env VENDOR_MAX_BYTES="$VENDOR_MAX_BYTES" --env VENDOR_MAX_FILES="$VENDOR_MAX_FILES" --env VENDOR_MAX_INODES="$VENDOR_MAX_INODES" \
            --env GITHUB_TOKEN= --env GH_TOKEN= --env ACTIONS_ID_TOKEN_REQUEST_TOKEN= --env ACTIONS_ID_TOKEN_REQUEST_URL= --env ACTIONS_RUNTIME_TOKEN= \
            "$SANDBOX_IMAGE" /bin/bash -euc '
              set -euo pipefail
