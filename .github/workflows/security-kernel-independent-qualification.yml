name: Security Kernel Independent Qualification
run-name: SEC-KERNEL-INDEP candidate=${{ inputs.candidate_sha }} pr=${{ inputs.candidate_pr }} source=${{ inputs.source_run_id }}.${{ inputs.source_run_attempt }}

on:
  workflow_dispatch:
    inputs:
      candidate_pr:
        description: "Exact source PR number"
        required: true
        type: string
      candidate_sha:
        description: "Exact source commit SHA"
        required: true
        type: string
      candidate_repository:
        description: "Exact source repository full name"
        required: true
        type: string
      source_run_id:
        description: "Completed Security Kernel Qualification run id"
        required: true
        type: string
      source_run_attempt:
        description: "Completed Security Kernel Qualification run attempt"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: security-kernel-independent-${{ inputs.candidate_sha }}
  cancel-in-progress: true

env:
  BASE_REPOSITORY: "Luminous-Dynamics/mycelix"
  SOURCE_WORKFLOW_ID: "372951439"
  SOURCE_WORKFLOW_PATH: ".github/workflows/security-kernel-qualification.yml"
  TRUSTED_WORKFLOW_BLOB_SHA: "c65c3fbbc7f3db129dd4382d1edce8e13794ce97"

jobs:
  qualify:
    name: Independent Security Kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout trusted qualification root
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact trusted workflow identity
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.request
          workflow_sha=os.environ["GITHUB_WORKFLOW_SHA"]
          assert re.fullmatch(r"[0-9a-f]{40}", workflow_sha)
          req=urllib.request.Request(
              "https://api.github.com/repos/" + os.environ["BASE_REPOSITORY"]
              + "/contents/" + os.environ["SOURCE_WORKFLOW_PATH"]
              + "?ref=" + workflow_sha,
              headers={
                  "Accept":"application/vnd.github+json",
                  "Authorization":f"Bearer {os.environ['TOKEN']}",
                  "X-GitHub-Api-Version":"2022-11-28"})
          with urllib.request.urlopen(req, timeout=20) as r:
              workflow=json.load(r)
          assert workflow["sha"] == os.environ["TRUSTED_WORKFLOW_BLOB_SHA"], (
              "executing S1 workflow blob does not match the registered immutable profile"
          )
          print("PASS: executing S1 workflow commit/blob matches the registered immutable profile")
          PY

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Assert Rust identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc +1.99.0 --version | awk '{print $2}')" = "1.99.0"
          test "$(rustc +1.99.0 --version --verbose | sed -n 's/^commit-hash: //p')" = "b940084d7eb6a299eb4bfeb8e34901bc051e7ac4"

      - name: Resolve pinned Rust sysroot
        id: rust_sysroot
        shell: bash
        run: |
          set -euo pipefail
          rust_sysroot="$(readlink -f "$(rustc +1.99.0 --print sysroot)")"
          test -x "$rust_sysroot/bin/rustc"
          test -x "$rust_sysroot/bin/cargo"
          test -x "$rust_sysroot/bin/rustfmt"
          test -x "$rust_sysroot/bin/cargo-clippy"
          printf 'rust_sysroot=%s\n' "$rust_sysroot" >> "$GITHUB_OUTPUT"
          echo "PASS: exact Rust 1.99.0 toolchain sysroot resolved"

      - name: Validate dispatch provenance
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          CANDIDATE_PR: ${{ inputs.candidate_pr }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.request
          base = "https://api.github.com"
          token = os.environ["TOKEN"]

          def get(path):
              req = urllib.request.Request(
                  base + path,
                  headers={
                      "Accept":"application/vnd.github+json",
                      "Authorization":f"Bearer {token}",
                      "X-GitHub-Api-Version":"2022-11-28"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)

          for name, pattern in {
              "CANDIDATE_PR": r"[0-9]+",
              "CANDIDATE_SHA": r"[0-9a-f]{40}",
              "CANDIDATE_REPOSITORY": r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+",
              "SOURCE_RUN_ID": r"[0-9]+",
              "SOURCE_RUN_ATTEMPT": r"[0-9]+",
          }.items():
              assert re.fullmatch(pattern, os.environ[name]), name

          run = get(f'/repos/{os.environ["BASE_REPOSITORY"]}/actions/runs/{os.environ["SOURCE_RUN_ID"]}')
          assert run["id"] == int(os.environ["SOURCE_RUN_ID"])
          assert run["run_attempt"] == int(os.environ["SOURCE_RUN_ATTEMPT"])
          assert run["status"] == "completed"
          assert run["workflow_id"] == int(os.environ["SOURCE_WORKFLOW_ID"])
          assert run["path"] == os.environ["SOURCE_WORKFLOW_PATH"]
          assert run["event"] == "pull_request"
          assert run["repository"]["full_name"] == os.environ["BASE_REPOSITORY"]
          assert run["head_sha"] == os.environ["CANDIDATE_SHA"]
          assert (run.get("head_repository") or {}).get("full_name") == os.environ["CANDIDATE_REPOSITORY"]

          pulls = get(
              f'/repos/{os.environ["BASE_REPOSITORY"]}/commits/{os.environ["CANDIDATE_SHA"]}/pulls?per_page=100')
          matches = [
              pr for pr in pulls
              if pr["number"] == int(os.environ["CANDIDATE_PR"])
              and pr["state"] == "open"
              and pr["base"]["repo"]["full_name"] == os.environ["BASE_REPOSITORY"]
              and pr["base"]["ref"] == "main"
              and pr["head"]["repo"]["full_name"] == os.environ["CANDIDATE_REPOSITORY"]
              and pr["head"]["sha"] == os.environ["CANDIDATE_SHA"]
          ]
          assert len(matches) == 1, f"candidate PR is no longer an exact open-head match: {len(matches)}"
          print("PASS: source workflow, source attempt, candidate repository/SHA, and current PR head are exact")
          PY

      - name: Resolve exact candidate source
        id: resolve_source
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository }}
        run: |
          set -euo pipefail
          candidate_git="$RUNNER_TEMP/security-kernel-candidate-git"
          candidate_root="$RUNNER_TEMP/security-kernel-candidate-src"
          rm -rf "$candidate_git" "$candidate_root"
          git init -q "$candidate_git"
          git -C "$candidate_git" remote add origin "https://github.com/$CANDIDATE_REPOSITORY.git"
          git -C "$candidate_git" fetch --no-tags --depth=1 origin "$CANDIDATE_SHA"
          resolved="$(git -C "$candidate_git" rev-parse FETCH_HEAD)"
          test "$resolved" = "$CANDIDATE_SHA"
          if git -C "$candidate_git" ls-tree -r "$resolved" | grep -q "^160000 "; then
            echo "candidate source contains a gitlink/submodule; qualification requires a self-contained source tree" >&2
            exit 1
          fi
          candidate_tree="$(git -C "$candidate_git" rev-parse FETCH_HEAD^{tree})"
          mkdir -p "$candidate_root"
          git -C "$candidate_git" archive --format=tar "$resolved" | tar -xf - -C "$candidate_root"
          printf 'candidate_tree=%s\n' "$candidate_tree" >> "$GITHUB_OUTPUT"

          python3 - "$candidate_root" <<'PY'
          import hashlib, pathlib, stat, sys
          root=pathlib.Path(sys.argv[1])
          digest=hashlib.sha256()
          for path in sorted(root.rglob("*")):
              rel=path.relative_to(root)
              if rel.parts and rel.parts[0] == "target":
                  continue
              mode=path.lstat().st_mode
              if stat.S_ISLNK(mode):
                  raise SystemExit(f"candidate source contains forbidden symlink: {rel}")
              if path.is_dir():
                  continue
              if not stat.S_ISREG(mode):
                  raise SystemExit(f"candidate source contains forbidden non-regular file: {rel}")
              digest.update(rel.as_posix().encode())
              digest.update(b"\\0")
              digest.update(path.read_bytes())
              digest.update(b"\\0")
          print(f"candidate_source_digest={digest.hexdigest()}")
          print("PASS: exact candidate commit materialized with regular-file-only source tree")
          PY

      - name: Static trust-surface audit
        shell: bash
        env:
          CANDIDATE_ROOT: ${{ runner.temp }}/security-kernel-candidate-src
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          root=Path(os.environ["CANDIDATE_ROOT"])
          kernel=(root/"crates/mycelix-bridge-common/src/security_kernel.rs").read_text(encoding="utf-8")
          events=(root/"crates/mycelix-bridge-common/src/security_events.rs").read_text(encoding="utf-8")
          workflow=(root/".github/workflows/security-kernel-qualification.yml").read_text(encoding="utf-8")
          manifest=root/"crates/mycelix-bridge-common/Cargo.toml"
          lockfile=root/"crates/mycelix-bridge-common/Cargo.lock"
          assert manifest.is_file(), manifest
          assert lockfile.is_file(), "Security Kernel qualification requires a committed Cargo.lock"
          forbidden_configs=(
              root/".cargo/config.toml",
              root/".cargo/config",
              root/"crates/.cargo/config.toml",
              root/"crates/.cargo/config",
              root/"crates/mycelix-bridge-common/.cargo/config.toml",
              root/"crates/mycelix-bridge-common/.cargo/config",
          )
          present=[str(path.relative_to(root)) for path in forbidden_configs if path.exists()]
          assert not present, f"candidate-controlled Cargo configuration is forbidden: {present}"
          assert "pull_request_target:" not in workflow
          permission_lines = []
          workflow_lines = workflow.splitlines()
          for index, line in enumerate(workflow_lines):
              if line.strip() == "permissions:":
                  for candidate in workflow_lines[index + 1:]:
                      if candidate and not candidate.startswith(" "):
                          break
                      if candidate.strip():
                          permission_lines.append(candidate.strip())
                  break
          assert permission_lines == ["contents: read"], permission_lines
          assert "secrets." not in workflow
          uses=re.findall(r"(?m)^\s*-\s*uses:\s*([^\n]+)$",workflow)
          assert uses and all(re.search(r"@[0-9a-fA-F]{40}(?:\s+#.*)?$",line.strip()) for line in uses)
          for value in (
              "runs-on: ubuntu-24.04",
              "ref: " + "$" + "{{ github.event.pull_request.head.sha || github.sha }}",
              "persist-credentials: false",
              "contents: read",
          ):
              assert value in workflow, value
          for value in (
              '#[must_use = "verified capabilities must be passed to authorize_permit"]',
              '#[must_use = "signature verification results must be checked before accepting a capability"]',
              '#[must_use = "issuer-bound signature verification results must be checked before accepting a capability"]',
          ):
              assert value in kernel, value
          for pattern in (
              r"pub\s+(?:\([^)]*\)\s+)?(SignatureVerification|RevocationStatus|AuthorityResolution)",
              r"pub\s+(?:\([^)]*\)\s+)?fn\s+(authority_binding_from_freshness_digest|revalidate_permit)",
              r"pub\s+(?:\([^)]*\)\s+)?(decision|capability_binding|authority_binding|event_id|actor_id|capability_ref|request|policy_version|timestamp_us|provenance|recovery_correlation)\s*:",
          ):
              assert re.search(pattern,kernel) is None, pattern
          for field in ("capability", "issuer_public_key", "signature"):
              assert re.search(rf"pub struct SignedCapability\s*\{{.*?\n\s+{field}\s*:", kernel, re.S), field
              assert re.search(rf"pub struct SignedCapability\s*\{{.*?\n\s+pub\s+{field}\s*:", kernel, re.S) is None, field
          for accessor in ("pub fn capability", "pub fn issuer_public_key", "pub fn signature"):
              assert accessor in kernel, accessor
          for value in (
              "MAX_SECURITY_WIRE_BYTES",
              "deserialize_bounded_security_json_reader",
              "deserialize_capability_actions",
              "serde(try_from = " + chr(34) + "CapabilityWire" + chr(34) + ")",
              "serde(try_from = " + chr(34) + "AuthorizationRequestWire" + chr(34) + ")",
          ):
              assert value in kernel, value
          assert "deny_unknown_fields" in kernel and "deny_unknown_fields" in events
          print("PASS: independent static trust-surface profile")
          PY

      - name: Pull and preflight pinned sandbox image
        shell: bash
        env:
          SANDBOX_IMAGE: "docker.io/library/rust:1.99.0-slim-bookworm@sha256:452176c0cefca88c0b3184ce85a4eb03e3d4fa05d2afb5366abcba853221019e"
        run: |
          set -euo pipefail
          docker pull --quiet "$SANDBOX_IMAGE"
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          docker run --rm --platform=linux/amd64 --pull=never \
            --network=none \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            --security-opt=seccomp=default \
            --pids-limit=512 \
            --memory=256m \
            --memory-swap=256m \
            --cpus=1 \
            --ulimit=nofile=4096:4096 \
            --ulimit=core=0:0 \
            --user "$runner_uid:$runner_gid" \
            --ipc=private \
            --pid=private \
            --cgroupns=private \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            --env HOME=/tmp \
            --env GITHUB_TOKEN= \
            --env GH_TOKEN= \
            --env ACTIONS_ID_TOKEN_REQUEST_TOKEN= \
            --env ACTIONS_ID_TOKEN_REQUEST_URL= \
            --env ACTIONS_RUNTIME_TOKEN= \
            "$SANDBOX_IMAGE" /bin/bash -euc '
              test "$(id -u)" -ne 0
              grep -Eq "^NoNewPrivs:[[:space:]]+1$" /proc/self/status
              test "$(awk "/^CapEff:/{print \$2}" /proc/self/status)" = "0000000000000000"
              test ! -e /var/run/docker.sock
              if touch /sandbox-readonly-test 2>/dev/null; then
                echo "root filesystem unexpectedly writable" >&2
                exit 1
              fi
              test ! -s /proc/net/route
              test ! -s /proc/net/ipv6_route
              test "$(cat /sys/fs/cgroup/pids.max)" = "512"
              echo "PASS: pinned sandbox image + non-root + read-only root + no network routes + dropped caps + no-new-privileges + bounded PIDs"
            '

      - name: Prepare locked dependency subject
        id: dependency_subject
        shell: bash
        env:
          CANDIDATE_ROOT: ${{ runner.temp }}/security-kernel-candidate-src
        run: |
          set -euo pipefail
          dependency_root="$RUNNER_TEMP/security-kernel-dependency-subject"
          rm -rf "$dependency_root"
          mkdir -p "$dependency_root"
          install -m 0444 "$CANDIDATE_ROOT/crates/mycelix-bridge-common/Cargo.toml" "$dependency_root/Cargo.toml"
          install -m 0444 "$CANDIDATE_ROOT/crates/mycelix-bridge-common/Cargo.lock" "$dependency_root/Cargo.lock"
          printf 'dependency_root=%s\n' "$dependency_root" >> "$GITHUB_OUTPUT"
          echo "PASS: only the committed Cargo manifest and lockfile enter dependency acquisition"

      - name: Vendor locked dependency closure in fetch sandbox
        id: vendor_dependencies
        shell: bash
        env:
          DEPENDENCY_ROOT: ${{ steps.dependency_subject.outputs.dependency_root }}
          SANDBOX_IMAGE: "docker.io/library/rust:1.99.0-slim-bookworm@sha256:452176c0cefca88c0b3184ce85a4eb03e3d4fa05d2afb5366abcba853221019e"
        run: |
          set -euo pipefail
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          vendor_root="$RUNNER_TEMP/security-kernel-vendor"
          vendor_config="$RUNNER_TEMP/security-kernel-vendor-config.toml"
          rm -rf "$vendor_root" "$vendor_config"
          mkdir -p "$vendor_root"
          docker run --rm --platform=linux/amd64 --pull=never \
            --network=bridge \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            --security-opt=seccomp=default \
            --pids-limit=256 \
            --memory=2g \
            --memory-swap=2g \
            --cpus=2 \
            --ulimit=nofile=4096:4096 \
            --ulimit=core=0:0 \
            --user "$runner_uid:$runner_gid" \
            --ipc=private \
            --pid=private \
            --cgroupns=private \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=128m \
            --tmpfs /cargo-home:rw,nosuid,nodev,noexec,size=512m \
            --env HOME=/cargo-home \
            --env CARGO_HOME=/cargo-home \
            --env GITHUB_TOKEN= \
            --env GH_TOKEN= \
            --env ACTIONS_ID_TOKEN_REQUEST_TOKEN= \
            --env ACTIONS_ID_TOKEN_REQUEST_URL= \
            --env ACTIONS_RUNTIME_TOKEN= \
            --volume "$DEPENDENCY_ROOT:/subject:ro" \
            --volume "$vendor_root:/vendor:rw" \
            "$SANDBOX_IMAGE" /bin/bash -euc '
              /usr/local/cargo/bin/cargo vendor --locked --manifest-path /subject/Cargo.toml /vendor
            ' > "$vendor_config"
          test -s "$vendor_config"
          vendor_digest="$(python3 - "$vendor_root" "$vendor_config" <<'PY'
          import hashlib, pathlib, stat, sys
          vendor=pathlib.Path(sys.argv[1])
          config=pathlib.Path(sys.argv[2])
          text=config.read_text(encoding="utf-8")
          assert 'directory = "/vendor"' in text, text
          assert "credentials" not in text.lower()
          digest=hashlib.sha256()
          for path in sorted(vendor.rglob("*")):
              rel=path.relative_to(vendor)
              mode=path.lstat().st_mode
              if stat.S_ISLNK(mode):
                  raise SystemExit(f"vendored dependency contains forbidden symlink: {rel}")
              if path.is_dir():
                  continue
              if not stat.S_ISREG(mode):
                  raise SystemExit(f"vendored dependency contains forbidden non-regular file: {rel}")
              digest.update(rel.as_posix().encode())
              digest.update(b"\\0")
              digest.update(path.read_bytes())
              digest.update(b"\\0")
          print(digest.hexdigest())
          PY
          )"
          test "${#vendor_digest}" -eq 64
          printf 'vendor_root=%s\\nvendor_config=%s\\nvendor_digest=%s\\n' "$vendor_root" "$vendor_config" "$vendor_digest" >> "$GITHUB_OUTPUT"
          echo "PASS: locked dependency closure vendored in constrained fetch sandbox"
          echo "vendor_digest=$vendor_digest"
      - name: Execute candidate qualification in disposable networkless sandbox
        shell: bash
        env:
          CANDIDATE_ROOT: ${{ runner.temp }}/security-kernel-candidate-src
          VENDOR_ROOT: ${{ steps.vendor_dependencies.outputs.vendor_root }}
          VENDOR_CONFIG: ${{ steps.vendor_dependencies.outputs.vendor_config }}
          RUST_SYSROOT: ${{ steps.rust_sysroot.outputs.rust_sysroot }}
          SANDBOX_IMAGE: "docker.io/library/rust:1.99.0-slim-bookworm@sha256:452176c0cefca88c0b3184ce85a4eb03e3d4fa05d2afb5366abcba853221019e"
        run: |
          set -euo pipefail
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"

          run_sandbox() {
            local wall="$1"
            local script="$2"
            timeout --signal=TERM --kill-after=30s "$wall" docker run --rm --platform=linux/amd64 --pull=never \
              --network=none \
              --read-only \
              --cap-drop=ALL \
              --security-opt=no-new-privileges:true \
              --security-opt=seccomp=default \
              --pids-limit=512 \
              --memory=12g \
              --memory-swap=12g \
              --cpus=3 \
              --ulimit=nofile=4096:4096 \
              --ulimit=core=0:0 \
              --user "$runner_uid:$runner_gid" \
              --ipc=private \
              --pid=private \
              --cgroupns=private \
              --tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m \
              --tmpfs /cargo-home:rw,nosuid,nodev,noexec,size=512m \
              --tmpfs /target:rw,nosuid,nodev,size=8g \
              --volume "$CANDIDATE_ROOT:/source:ro" \
              --volume "$VENDOR_ROOT:/vendor:ro" \
              --volume "$RUST_SYSROOT:/opt/rust-toolchain:ro" \
              --volume "$VENDOR_CONFIG:/vendor-config/config.toml:ro" \
              --env HOME=/cargo-home \
              --env CARGO_HOME=/cargo-home \
              --env RUSTUP_HOME=/dev/null \
              --env PATH=/opt/rust-toolchain/bin:/usr/local/bin:/usr/bin:/bin \
              --env CARGO_NET_OFFLINE=true \
              --env CARGO_TARGET_DIR=/target \
              --env CARGO_TERM_COLOR=never \
              --env GITHUB_TOKEN= \
              --env GH_TOKEN= \
              --env ACTIONS_ID_TOKEN_REQUEST_TOKEN= \
              --env ACTIONS_ID_TOKEN_REQUEST_URL= \
              --env ACTIONS_RUNTIME_TOKEN= \
              "$SANDBOX_IMAGE" /bin/bash -euc "
                run_limited() {
                  local output=/tmp/security-kernel-gate-output
                  rm -f \$output
                  set +e
                  \"\$@\" >\"\$output\" 2>&1
                  local status=\$?
                  tail -n 400 \"\$output\"
                  rm -f \"\$output\"
                  set -e
                  return \$status
                }
                $script
              "
          }

          run_sandbox 2m '
            test "$(/opt/rust-toolchain/bin/rustc --version | awk "{print \\$2}")" = "1.99.0"
            test "$(/opt/rust-toolchain/bin/rustc --version --verbose | sed -n "s/^commit-hash: //p")" = "b940084d7eb6a299eb4bfeb8e34901bc051e7ac4"
            /opt/rust-toolchain/bin/rustfmt --version
            /opt/rust-toolchain/bin/cargo-clippy --version
            run_limited /opt/rust-toolchain/bin/cargo fmt --manifest-path /source/Cargo.toml -- --check
          '

          run_sandbox 9m '
            run_limited /opt/rust-toolchain/bin/cargo --config /vendor-config/config.toml test --frozen --manifest-path /source/Cargo.toml --jobs 3
          '

          run_sandbox 9m '
            run_limited /opt/rust-toolchain/bin/cargo --config /vendor-config/config.toml test --frozen --manifest-path /source/Cargo.toml --features identity --jobs 3
          '

          run_sandbox 9m '
            run_limited /opt/rust-toolchain/bin/cargo --config /vendor-config/config.toml clippy --frozen --manifest-path /source/Cargo.toml --all-targets --jobs 3 -- -D warnings
          '

          run_sandbox 9m '
            run_limited /opt/rust-toolchain/bin/cargo --config /vendor-config/config.toml clippy --frozen --manifest-path /source/Cargo.toml --all-targets --features identity --jobs 3 -- -D warnings
          '

          echo "PASS: all candidate compilation/test/lint gates executed in fresh disposable networkless sandboxes"

      - name: Verify candidate source immutability
        shell: bash
        env:
          CANDIDATE_ROOT: ${{ runner.temp }}/security-kernel-candidate-src
          EXPECTED_SOURCE_DIGEST: ${{ steps.snapshot_source.outputs.source_digest }}
        run: |
          set -euo pipefail
          python3 - "$CANDIDATE_ROOT" "$EXPECTED_SOURCE_DIGEST" <<'PY'
          import hashlib, pathlib, stat, sys
          root=pathlib.Path(sys.argv[1])
          expected=sys.argv[2].strip()
          digest=hashlib.sha256()
          for path in sorted(root.rglob("*")):
              rel=path.relative_to(root)
              if rel.parts and rel.parts[0] == "target":
                  continue
              mode=path.lstat().st_mode
              if stat.S_ISLNK(mode):
                  raise SystemExit(f"candidate source contains forbidden symlink: {rel}")
              if path.is_dir():
                  continue
              if not stat.S_ISREG(mode):
                  raise SystemExit(f"candidate source contains forbidden non-regular file: {rel}")
              digest.update(rel.as_posix().encode())
              digest.update(b"\\0")
              digest.update(path.read_bytes())
              digest.update(b"\\0")
          after=digest.hexdigest()
          assert expected == after, f"candidate source mutated during qualification: {expected} != {after}"
          print("PASS: candidate source remained immutable and regular-file-only")
          PY

      - name: Emit qualification receipt
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_PR: ${{ inputs.candidate_pr }}
          CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          CANDIDATE_TREE: ${{ steps.resolve_source.outputs.candidate_tree }}
          SOURCE_DIGEST: ${{ steps.snapshot_source.outputs.source_digest }}
          VENDOR_DIGEST: ${{ steps.vendor_dependencies.outputs.vendor_digest }}
        run: |
          set -euo pipefail
          CARGO_LOCK_DIGEST="$(sha256sum "$CANDIDATE_ROOT/crates/mycelix-bridge-common/Cargo.lock" | awk '{print $1}')"
          {
            echo "schema=security-kernel-independent-qualification-v1"
            echo "candidate_repository=$CANDIDATE_REPOSITORY"
            echo "candidate_pr=$CANDIDATE_PR"
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "candidate_tree=$CANDIDATE_TREE"
            echo "candidate_source_digest=$SOURCE_DIGEST"
            echo "candidate_cargo_lock_sha256=$CARGO_LOCK_DIGEST"
            echo "vendor_digest=$VENDOR_DIGEST"
            echo "sandbox_image=docker.io/library/rust:1.99.0-slim-bookworm@sha256:452176c0cefca88c0b3184ce85a4eb03e3d4fa05d2afb5366abcba853221019e"
            echo "sandbox_network=none"
            echo "sandbox_rootfs=read-only"
            echo "sandbox_user=non-root"
            echo "sandbox_capabilities=all-dropped"
            echo "sandbox_no_new_privileges=true"
            echo "source_run_id=$SOURCE_RUN_ID"
            echo "source_run_attempt=$SOURCE_RUN_ATTEMPT"
            echo "trusted_workflow_ref=$GITHUB_WORKFLOW_REF"
            echo "trusted_workflow_sha=$GITHUB_WORKFLOW_SHA"
            echo "trusted_workflow_name=$GITHUB_WORKFLOW"
            echo "rust=$(rustc --version)"
            echo "rust_verbose_commit=$(rustc --version --verbose | sed -n 's/^commit-hash: //p')"
            echo "qualification_pass=true"
          } > "$RUNNER_TEMP/security-kernel-independent-qualification.txt"
          cat "$RUNNER_TEMP/security-kernel-independent-qualification.txt"

      - name: Upload qualification receipt
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a0 # v7.0.1
        with:
          name: security-kernel-independent-qualification-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/security-kernel-independent-qualification.txt
