        run: |
          set -euo pipefail
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          vendor_cleanup_on_failure() {
            local status=$?
            if [ "$status" -ne 0 ]; then
              if ! docker volume rm "$VENDOR_CONFIG_VOLUME_NAME" >/dev/null 2>&1; then status=1; fi
              if ! docker volume rm "$VENDOR_VOLUME_NAME" >/dev/null 2>&1; then status=1; fi
