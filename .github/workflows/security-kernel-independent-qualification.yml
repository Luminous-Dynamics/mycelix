          vendor_observed_files="$(sed -n 's/^vendor_observed_files=//p' "$vendor_metrics")"
          vendor_observed_inodes="$(sed -n 's/^vendor_observed_inodes=//p' "$vendor_metrics")"
          vendor_digest="$(sed -n 's/^vendor_digest=//p' "$vendor_metrics")"
          for value in "$vendor_observed_bytes" "$vendor_observed_files" "$vendor_observed_inodes"; do printf "%s" "$value" | grep -Eq '^[0-9]+$'; done
          printf "%s" "$vendor_digest" | grep -Eq '^[0-9a-f]{64}$'
          test "$vendor_observed_bytes" -le "$VENDOR_MAX_BYTES"
          test "$vendor_observed_files" -le "$VENDOR_MAX_FILES"
          test "$vendor_observed_inodes" -le "$VENDOR_MAX_INODES"
          printf 'vendor_volume_name=%s\nvendor_config=%s\nvendor_metrics=%s\nvendor_digest=%s\nvendor_observed_bytes=%s\nvendor_observed_files=%s\nvendor_observed_inodes=%s\n' "$vendor_volume_name" "$vendor_config" "$vendor_metrics" "$vendor_digest" "$vendor_observed_bytes" "$vendor_observed_files" "$vendor_observed_inodes" >> "$GITHUB_OUTPUT"
