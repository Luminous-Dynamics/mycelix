name: Security Kernel Independent Qualification

on:
  workflow_call:
    inputs:
      candidate_pr:
        description: "Exact source PR number"
        required: true
        type: string
      candidate_sha:
        description: "Exact source commit SHA"
        required: true
        type: string
      candidate_repository:
        description: "Exact source repository full name"
        required: true
        type: string
      candidate_repository_id:
        description: "Exact source repository numeric ID"
        required: true
        type: string
      invocation_source:
        description: "Trusted caller trigger witness: trusted-dispatch or scheduled-fallback"
        required: true
        type: string
      trusted_workflow_blob_sha:
        description: "Registered S1 workflow blob SHA supplied by the trusted caller"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

cache-mode: none

concurrency:
  group: security-kernel-independent-${{ inputs.candidate_repository }}-${{ inputs.candidate_pr }}-${{ inputs.candidate_sha }}
  cancel-in-progress: true

env:
  BASE_REPOSITORY: "Luminous-Dynamics/mycelix"
  BASE_REPOSITORY_ID: "1176351975"
  VENDOR_RESOURCE_PROFILE: "v2"
  VENDOR_MAX_BYTES: "1073741824"
  VENDOR_MAX_FILES: "100000"
  VENDOR_MAX_INODES: "150000"
  VENDOR_TMPFS_SIZE: "1024m"
  VENDOR_TMPFS_NR_INODES: "150000"
  VENDOR_CONFIG_RESOURCE_PROFILE: "v1"
  VENDOR_CONFIG_MAX_BYTES: "16777216"
  VENDOR_CONFIG_MAX_INODES: "64"
  VENDOR_CONFIG_TMPFS_SIZE: "16m"
  VENDOR_CONFIG_TMPFS_NR_INODES: "64"
  SOURCE_RESOURCE_PROFILE: "v1"
  SOURCE_MAX_BYTES: "1073741824"
  SOURCE_MAX_INODES: "300000"
  SOURCE_TMPFS_SIZE: "1024m"
  SOURCE_TMPFS_NR_INODES: "300000"
  DEPENDENCY_MANIFEST_MAX_BYTES: "2097152"
  DEPENDENCY_LOCK_MAX_BYTES: "33554432"
  QUALIFICATION_RECEIPT_MAX_BYTES: "16384"
  SOURCE_AUDIT_IMAGE: "docker.io/library/python@sha256:2325bb286ec344af3e5898cc224b5844e2707ac6e26b1632516fd3edc84a5e26"
  EGRESS_BROKER_PATH: ".github/security-kernel/github_egress_proxy.py"
  EGRESS_BROKER_BLOB_SHA: "b288278af2e2c821eda8acb52c705229b97a0d84"
  EGRESS_BROKER_IMAGE: "docker.io/library/python@sha256:2325bb286ec344af3e5898cc224b5844e2707ac6e26b1632516fd3edc84a5e26"
  EGRESS_BROKER_PORT: "3128"
  EGRESS_INTERNAL_NETWORK: "security-kernel-egress-internal-${{ github.run_id }}-${{ github.run_attempt }}"
  EGRESS_EXTERNAL_NETWORK: "security-kernel-egress-external-${{ github.run_id }}-${{ github.run_attempt }}"
  EGRESS_BROKER_NAME: "security-kernel-egress-broker-${{ github.run_id }}-${{ github.run_attempt }}"

jobs:
  qualify:
    name: Independent Security Kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout trusted qualification root
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted pull-request-target invocation
        env:
          TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER_EVENT: ${{ github.event.pull_request.number }}
          HEAD_SHA_EVENT: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY_EVENT: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REPOSITORY_ID_EVENT: ${{ github.event.pull_request.head.repo.id }}
          BASE_REPOSITORY_EVENT: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_REPOSITORY_ID_EVENT: ${{ github.event.pull_request.base.repo.id }}
          BASE_BRANCH_EVENT: ${{ github.event.pull_request.base.ref }}
          CANDIDATE_PR: ${{ inputs.candidate_pr }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository }}
          CANDIDATE_REPOSITORY_ID: ${{ inputs.candidate_repository_id }}
          INVOCATION_SOURCE: ${{ inputs.invocation_source }}
          HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
          CALLED_WORKFLOW_REF: ${{ job.workflow_ref }}
          CALLED_WORKFLOW_SHA: ${{ job.workflow_sha }}
          CALLED_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          CALLED_WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
          TRUSTED_WORKFLOW_BLOB_SHA: ${{ inputs.trusted_workflow_blob_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_WORKFLOW_REF" = "Luminous-Dynamics/mycelix/.github/workflows/security-kernel-trusted-dispatch.yml@refs/heads/main"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REPOSITORY" = "$BASE_REPOSITORY"
          test "$GITHUB_REPOSITORY_ID" = "$BASE_REPOSITORY_ID"
          test "$GITHUB_REF_PROTECTED" = "true"
          test "${ACTIONS_CACHE_MODE:-}" = "none"
          test "$CALLED_WORKFLOW_REF" = "Luminous-Dynamics/mycelix/.github/workflows/security-kernel-independent-qualification.yml@refs/heads/main"
          test "$CALLED_WORKFLOW_REPOSITORY" = "$BASE_REPOSITORY"
          test "$CALLED_WORKFLOW_FILE_PATH" = ".github/workflows/security-kernel-independent-qualification.yml"
          printf "%s" "$CALLED_WORKFLOW_SHA" | grep -Eq "^[0-9a-f]{40}$"
          test "$CALLED_WORKFLOW_SHA" = "$WORKFLOW_SHA"
          printf "%s" "$TRUSTED_WORKFLOW_BLOB_SHA" | grep -Eq "^[0-9a-f]{40}$"
          printf "%s" "$CANDIDATE_PR" | grep -Eq "^[0-9]+$"
          printf "%s" "$CANDIDATE_SHA" | grep -Eq "^[0-9a-f]{40}$"
          printf "%s" "$CANDIDATE_REPOSITORY" | grep -Eq "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
          printf "%s" "$CANDIDATE_REPOSITORY_ID" | grep -Eq "^[0-9]+$"
          case "$INVOCATION_SOURCE" in
            trusted-dispatch)
              test "$EVENT_NAME" = "pull_request_target"
              test "$PR_NUMBER_EVENT" = "$CANDIDATE_PR"
              test "$HEAD_SHA_EVENT" = "$CANDIDATE_SHA"
              test "$HEAD_REPOSITORY_EVENT" = "$CANDIDATE_REPOSITORY"
              test "$HEAD_REPOSITORY_ID_EVENT" = "$CANDIDATE_REPOSITORY_ID"
              test "$BASE_REPOSITORY_EVENT" = "$BASE_REPOSITORY"
              test "$BASE_REPOSITORY_ID_EVENT" = "$BASE_REPOSITORY_ID"
              test "$BASE_BRANCH_EVENT" = "main"
              ;;
            scheduled-fallback)
              test "$EVENT_NAME" = "schedule"
              test -z "${PR_NUMBER_EVENT:-}"
              test -z "${HEAD_SHA_EVENT:-}"
              test -z "${HEAD_REPOSITORY_EVENT:-}"
              ;;
            *) echo "unsupported Security Kernel invocation source: $INVOCATION_SOURCE" >&2; exit 1 ;;
          esac
          python3 - <<'PY'
          import base64, json, os, urllib.error, urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers):
                  return None
          api_opener=urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect)
          repo=os.environ["BASE_REPOSITORY"]; pr_number=int(os.environ["CANDIDATE_PR"])
          req=urllib.request.Request("https://api.github.com/repos/"+repo+"/pulls/"+str(pr_number),headers={"Accept":"application/vnd.github+json","Authorization":f"Bearer {os.environ['TOKEN']}","X-GitHub-Api-Version":"2022-11-28"})
          with api_opener.open(req,timeout=20) as response: pr=json.load(response)
          assert pr["number"]==pr_number and pr["state"]=="open"
          assert pr["base"]["repo"]["full_name"]==repo and pr["base"]["repo"]["id"]==int(os.environ["BASE_REPOSITORY_ID"]) and pr["base"]["ref"]=="main"
          assert pr["head"]["repo"]["full_name"]==os.environ["CANDIDATE_REPOSITORY"] and pr["head"]["repo"]["id"]==int(os.environ["CANDIDATE_REPOSITORY_ID"]) and pr["head"]["sha"]==os.environ["CANDIDATE_SHA"]
          workflow_sha=os.environ["WORKFLOW_SHA"]; assert len(workflow_sha)==40
          wf=urllib.request.Request("https://api.github.com/repos/"+repo+"/contents/.github/workflows/security-kernel-independent-qualification.yml?ref="+workflow_sha,headers={"Accept":"application/vnd.github+json","Authorization":f"Bearer {os.environ['TOKEN']}","X-GitHub-Api-Version":"2022-11-28"})
          with api_opener.open(wf,timeout=20) as response: workflow=json.load(response)
          assert workflow.get("sha")==os.environ["TRUSTED_WORKFLOW_BLOB_SHA"]
          print("PASS: S1 exact candidate tuple and trusted workflow identity validated")
          PY
      - name: Prepare trusted GitHub egress broker
        id: prepare_egress
        env:
          BROKER_SOURCE: ${{ github.workspace }}/${{ env.EGRESS_BROKER_PATH }}
          EGRESS_BROKER_BLOB_SHA: ${{ env.EGRESS_BROKER_BLOB_SHA }}
          EGRESS_BROKER_IMAGE: ${{ env.EGRESS_BROKER_IMAGE }}
          EGRESS_BROKER_PORT: ${{ env.EGRESS_BROKER_PORT }}
          EGRESS_INTERNAL_NETWORK: ${{ env.EGRESS_INTERNAL_NETWORK }}
          EGRESS_EXTERNAL_NETWORK: ${{ env.EGRESS_EXTERNAL_NETWORK }}
          EGRESS_BROKER_NAME: ${{ env.EGRESS_BROKER_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$BROKER_SOURCE"
          test "$(git hash-object "$BROKER_SOURCE")" = "$EGRESS_BROKER_BLOB_SHA"
          for network_name in "$EGRESS_INTERNAL_NETWORK" "$EGRESS_EXTERNAL_NETWORK"; do
            if ! existing_networks="$(docker network ls --format '{{.Name}}')"; then
              echo "security-kernel egress network inventory query failed" >&2
              exit 1
            fi
            if printf "%s\n" "$existing_networks" | grep -Fxq "$network_name"; then
              echo "security-kernel egress network name collision: $network_name" >&2
              exit 1
            fi
          done
          if docker ps -aq --filter "name=^/${EGRESS_BROKER_NAME}$" | grep -q .; then
            echo "security-kernel egress broker name collision" >&2
            exit 1
          fi
          docker network create --driver bridge --internal --ipv6=false --label "security-kernel.run=$GITHUB_RUN_ID" --label "security-kernel.attempt=$GITHUB_RUN_ATTEMPT" "$EGRESS_INTERNAL_NETWORK" >/dev/null
          docker network create --driver bridge --ipv6=false --label "security-kernel.run=$GITHUB_RUN_ID" --label "security-kernel.attempt=$GITHUB_RUN_ATTEMPT" "$EGRESS_EXTERNAL_NETWORK" >/dev/null
          docker pull --quiet "$EGRESS_BROKER_IMAGE"
          docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$EGRESS_BROKER_IMAGE" | grep -Fx "$EGRESS_BROKER_IMAGE"
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          docker run -d --label "security-kernel.run=$GITHUB_RUN_ID" --label "security-kernel.attempt=$GITHUB_RUN_ATTEMPT" --name "$EGRESS_BROKER_NAME" --platform=linux/amd64 --pull=never --network "$EGRESS_EXTERNAL_NETWORK" --network-alias egress-broker --read-only --cap-drop=ALL --security-opt=no-new-privileges:true --security-opt=seccomp=default --pids-limit=32 --memory=128m --memory-swap=128m --cpus=1 --ulimit=nofile=1024:1024 --ulimit=core=0:0 --user "$runner_uid:$runner_gid" --init --stop-timeout=5 --ipc=private --pid=private --cgroupns=private --env PYTHONDONTWRITEBYTECODE=1 --env http_proxy= --env https_proxy= --env all_proxy= --env HTTP_PROXY= --env HTTPS_PROXY= --env ALL_PROXY= --env NO_PROXY= --volume "$BROKER_SOURCE:/trusted-egress/github_egress_proxy.py:ro" "$EGRESS_BROKER_IMAGE" python3 /trusted-egress/github_egress_proxy.py >/dev/null
          docker network connect --alias egress-broker "$EGRESS_INTERNAL_NETWORK" "$EGRESS_BROKER_NAME"
          test "$(docker inspect --format '{{.State.Running}}' "$EGRESS_BROKER_NAME")" = "true"
          broker_networks="$(docker inspect --format '{{range $name,$conf := .NetworkSettings.Networks}}{{println $name}}{{end}}' "$EGRESS_BROKER_NAME")"
          printf "%s\n" "$broker_networks" | grep -Fxq "$EGRESS_INTERNAL_NETWORK"
          printf "%s\n" "$broker_networks" | grep -Fxq "$EGRESS_EXTERNAL_NETWORK"
          test "$(printf "%s\n" "$broker_networks" | sed '/^$/d' | wc -l)" -eq 2
          test "$(docker network inspect --format '{{.Internal}}' "$EGRESS_INTERNAL_NETWORK")" = "true"
          test "$(docker network inspect --format '{{.EnableIPv6}}' "$EGRESS_INTERNAL_NETWORK")" = "false"
          test "$(docker network inspect --format '{{.EnableIPv6}}' "$EGRESS_EXTERNAL_NETWORK")" = "false"
          echo "PASS: trusted fixed-destination GitHub egress broker is running on an internal-only fetch network and dedicated external network"
      - name: Resolve exact candidate source
        id: resolve_source
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository }}
          CANDIDATE_REPOSITORY_ID: ${{ inputs.candidate_repository_id }}
          TOKEN: ${{ github.token }}
          FETCH_IMAGE: "docker.io/bitnami/git@sha256:3b25b57de5a24330fe87931ef20285b1cf965fabaf3156ce5c5f0eecf37d5329"
        shell: bash
        run: |
          set -euo pipefail
          candidate_volume_name="security-kernel-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          source_resource_metrics="$RUNNER_TEMP/security-kernel-source-resource-metrics.txt"
          if ! existing_source_volumes="$(docker volume ls --format '{{.Name}}')"; then
            echo "security-kernel candidate source volume inventory query failed" >&2
            exit 1
          fi
          if printf "%s\n" "$existing_source_volumes" | grep -Fxq "$candidate_volume_name"; then
            echo "security-kernel candidate source volume name collision" >&2
            exit 1
          fi
          rm -f "$source_resource_metrics"
          docker volume create --driver local --opt type=tmpfs --opt device=tmpfs --opt o=rw,nosuid,nodev,noexec,size=1024m,nr_inodes=300000 "$candidate_volume_name" >/dev/null
          candidate_volume_spec="$(docker volume inspect --format '{{.Driver}}|{{index .Options "type"}}|{{index .Options "device"}}|{{index .Options "o"}}' "$candidate_volume_name")"
          test "$candidate_volume_spec" = "local|tmpfs|tmpfs|rw,nosuid,nodev,noexec,size=1024m,nr_inodes=300000"
          candidate_volume_mountpoint="$(docker volume inspect --format '{{.Mountpoint}}' "$candidate_volume_name")"
          test -d "$candidate_volume_mountpoint"
          test "$(stat -f -c '%T' "$candidate_volume_mountpoint")" = "tmpfs"
          source_volume_cleanup_on_failure() {
            local status=$?
            if [ "$status" -ne 0 ]; then
              if ! docker volume rm "$candidate_volume_name" >/dev/null 2>&1; then status=1; fi
              if ! remaining_source_volumes="$(docker volume ls --format '{{.Name}}')"; then status=1
              elif printf "%s\n" "$remaining_source_volumes" | grep -Fxq "$candidate_volume_name"; then status=1; fi
            fi
            trap - EXIT
            exit "$status"
          }
          trap source_volume_cleanup_on_failure EXIT
          python3 - "$CANDIDATE_REPOSITORY" "$CANDIDATE_REPOSITORY_ID" "$CANDIDATE_SHA" <<'PY' > "$RUNNER_TEMP/security-kernel-candidate-tree.env"
          import json, os, sys, urllib.error, urllib.parse, urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers):
                  return None
          api_opener=urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect)
          repository, repository_id, commit_sha = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          repo_req = urllib.request.Request("https://api.github.com/repos/" + urllib.parse.quote(repository, safe="/"), headers={"Accept":"application/vnd.github+json","Authorization":f"Bearer {os.environ['TOKEN']}","X-GitHub-Api-Version":"2022-11-28"})
          with api_opener.open(repo_req, timeout=20) as response: repository_obj=json.load(response)
          assert repository_obj.get("full_name") == repository
          assert repository_obj.get("id") == repository_id
          assert repository_obj.get("disabled") is not True
          req = urllib.request.Request("https://api.github.com/repos/" + urllib.parse.quote(repository, safe="/") + "/commits/" + commit_sha, headers={"Accept":"application/vnd.github+json","Authorization":f"Bearer {os.environ['TOKEN']}","X-GitHub-Api-Version":"2022-11-28"})
          with api_opener.open(req, timeout=30) as response: commit=json.load(response)
          assert commit.get("sha") == commit_sha
          tree_sha=((commit.get("commit") or {}).get("tree") or {}).get("sha")
          assert isinstance(tree_sha,str) and len(tree_sha)==40
          post_repo_req=urllib.request.Request("https://api.github.com/repos/" + urllib.parse.quote(repository, safe="/"), headers={"Accept":"application/vnd.github+json","Authorization":f"Bearer {os.environ['TOKEN']}","X-GitHub-Api-Version":"2022-11-28"})
          with api_opener.open(post_repo_req, timeout=20) as response: post_repository_obj=json.load(response)
          assert post_repository_obj.get("full_name") == repository
          assert post_repository_obj.get("id") == repository_id
          assert post_repository_obj.get("disabled") is not True
          print(tree_sha)
          PY
          candidate_tree="$(cat "$RUNNER_TEMP/security-kernel-candidate-tree.env")"
          printf "%s" "$candidate_tree" | grep -Eq '^[0-9a-f]{40}$'
          python3 - "$CANDIDATE_REPOSITORY" "$candidate_tree" <<'PY'
          import json, os, sys, urllib.error, urllib.parse, urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers):
                  return None
          api_opener=urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect)
          repository, tree_sha=sys.argv[1],sys.argv[2]
          max_entries=300_000; max_files=200_000; max_path_bytes=4096; max_total_path_bytes=64*1024*1024; max_file_bytes=64*1024*1024; max_total_bytes=768*1024*1024
          url="https://api.github.com/repos/"+urllib.parse.quote(repository,safe="/")+"/git/trees/"+tree_sha+"?recursive=1"
          req=urllib.request.Request(url,headers={"Accept":"application/vnd.github+json","Authorization":f"Bearer {os.environ['TOKEN']}","X-GitHub-Api-Version":"2022-11-28"})
          with api_opener.open(req,timeout=30) as response: tree=json.load(response)
          assert tree.get("sha")==tree_sha
          assert not tree.get("truncated")
          entries=tree.get("tree",[]); total=0; count=0; total_path_bytes=0; max_blob=0
          for entry in entries:
              entry_type=entry.get("type"); mode=entry.get("mode"); path=entry.get("path")
              if entry_type != "blob":
                  if entry_type=="commit": raise SystemExit(f"candidate source contains a gitlink/submodule: {path!r}")
                  continue
              assert mode in {"100644","100755"}
              assert len(entry.get("sha", ""))==40
              path_bytes=len(path.encode()); total_path_bytes+=path_bytes
              assert path_bytes<=max_path_bytes and total_path_bytes<=max_total_path_bytes
              size=entry.get("size"); assert isinstance(size,int) and size>=0
              count+=1; total+=size; max_blob=max(max_blob,size)
              assert count<=max_files and size<=max_file_bytes and total<=max_total_bytes
          assert len(entries)<=max_entries
          with open(os.environ["RUNNER_TEMP"]+"/security-kernel-source-tree-stats.txt","w",encoding="utf-8") as output:
              output.write(f"source_tree_entry_count={len(entries)}\nsource_file_count={count}\nsource_total_path_bytes={total_path_bytes}\nsource_total_bytes={total}\nsource_max_blob_bytes={max_blob}\n")
          PY
          docker pull --quiet "$FETCH_IMAGE"
          docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$FETCH_IMAGE" | grep -Fx "$FETCH_IMAGE"
          runner_uid="$(id -u)"; runner_gid="$(id -g)"
          timeout --signal=TERM --kill-after=20s 10m docker run --label "security-kernel.run=$GITHUB_RUN_ID" --label "security-kernel.attempt=$GITHUB_RUN_ATTEMPT" --rm --platform=linux/amd64 --pull=never \
            --network "$EGRESS_INTERNAL_NETWORK" --read-only --cap-drop=ALL --security-opt=no-new-privileges:true --security-opt=seccomp=default \
            --pids-limit=512 --memory=2g --memory-swap=2g --cpus=2 --ulimit=nofile=4096:4096 --ulimit=core=0:0 \
            --user "$runner_uid:$runner_gid" --init --stop-timeout=5 --ipc=private --pid=private --cgroupns=private \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=512m,nr_inodes=600000 \
            --env HOME=/tmp --env GIT_CONFIG_NOSYSTEM=1 --env GIT_TERMINAL_PROMPT=0 --env GIT_CONFIG_GLOBAL=/tmp/gitconfig \
            --env http_proxy= --env https_proxy= --env all_proxy= \
            --env HTTP_PROXY= --env HTTPS_PROXY= --env ALL_PROXY= \
            --env NO_PROXY= \
            --env CANDIDATE_SHA="$CANDIDATE_SHA" --env CANDIDATE_REPOSITORY="$CANDIDATE_REPOSITORY" --env CANDIDATE_TREE="$candidate_tree" \
            --volume "$candidate_volume_name:/output:rw" "$FETCH_IMAGE" /bin/bash -euo pipefail -c '
              set -euo pipefail
              export XDG_CONFIG_HOME=/tmp/config; mkdir -p /tmp/config /tmp/repository /output
              git config --global core.hooksPath /dev/null; git config --global protocol.file.allow never; git config --global protocol.ext.allow never; git config --global http.followRedirects false
              python3 - "$EGRESS_BROKER_PORT" <<'PY'
              import socket, sys
              port=int(sys.argv[1])
              def probe(authority):
                  with socket.create_connection(("egress-broker", port), timeout=5) as sock:
                      sock.sendall(("CONNECT " + authority + " HTTP/1.1\r\nHost: " + authority + "\r\n\r\n").encode())
                      return sock.recv(4096)
              assert probe("example.com:443").startswith(b"HTTP/1.1 403")
              assert probe("github.com:444").startswith(b"HTTP/1.1 403")
              assert probe("github.com:443").startswith(b"HTTP/1.1 200")
              print("PASS: egress broker rejected non-GitHub CONNECT authorities and accepted only github.com:443")
              PY
              if timeout --signal=TERM --kill-after=10s 15s bash -c 'echo probe >/dev/tcp/1.1.1.1/80'; then
                echo "unexpected direct external connectivity from internal fetch network" >&2
                exit 1
              fi
              git -C /tmp/repository init -q; git -C /tmp/repository remote add origin "https://github.com/$CANDIDATE_REPOSITORY.git"
              git -C /tmp/repository -c http.proxy=http://egress-broker:$EGRESS_BROKER_PORT -c https.proxy=http://egress-broker:$EGRESS_BROKER_PORT -c http.followRedirects=false -c fetch.fsckObjects=true -c protocol.version=2 fetch --no-tags --depth=1 origin "$CANDIDATE_SHA"
              resolved="$(git -C /tmp/repository rev-parse FETCH_HEAD)"; test "$resolved" = "$CANDIDATE_SHA"
              resolved_tree="$(git -C /tmp/repository rev-parse "$resolved^{tree}")"; test "$resolved_tree" = "$CANDIDATE_TREE"
              timeout --signal=TERM --kill-after=10s 3m git -C /tmp/repository fsck --full --strict "$resolved"
              tree_entries="$(git -C /tmp/repository ls-tree -r "$resolved")"
              if printf "%s\n" "$tree_entries" | grep -q "^160000 "; then echo "candidate source contains a gitlink/submodule" >&2; exit 1; fi
              git -C /tmp/repository archive --format=tar "$resolved" | tar -xf - -C /output --no-same-owner
              symlink_entry="$(find /output -type l -print -quit)"; if [ -n "$symlink_entry" ]; then echo "candidate source contains forbidden symlink" >&2; exit 1; fi
