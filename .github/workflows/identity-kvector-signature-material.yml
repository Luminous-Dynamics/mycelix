name: Identity K-Vector Signature Material V2

on:
  pull_request:
    paths:
      - 'mycelix-workspace/mycelix-identity/Cargo.toml'
      - 'mycelix-workspace/mycelix-identity/crates/mycelix-crypto/**'
      - 'mycelix-workspace/mycelix-identity/crates/kvector-verifier-policy-body/**'
      - 'mycelix-workspace/mycelix-identity/crates/kvector-signature-material-policy/**'
      - '.github/workflows/identity-kvector-signature-material.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-workspace/mycelix-identity/Cargo.toml'
      - 'mycelix-workspace/mycelix-identity/crates/mycelix-crypto/**'
      - 'mycelix-workspace/mycelix-identity/crates/kvector-verifier-policy-body/**'
      - 'mycelix-workspace/mycelix-identity/crates/kvector-signature-material-policy/**'
      - '.github/workflows/identity-kvector-signature-material.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify-signature-material-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Assert signature-material boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          root = Path('mycelix-workspace/mycelix-identity')
          member = 'crates/kvector-signature-material-policy'
          workspace = tomllib.loads((root / 'Cargo.toml').read_text())
          if member not in workspace.get('workspace', {}).get('members', []):
              raise SystemExit(f'ERROR: {member} is not an explicit identity workspace member')

          manifest = tomllib.loads((root / member / 'Cargo.toml').read_text())
          deps = manifest.get('dependencies', {})
          expected = {'mycelix-crypto', 'mycelix-kvector-verifier-policy-body'}
          if set(deps) != expected:
              raise SystemExit(f'ERROR: signature-material dependencies drifted: {sorted(deps)}')
          if deps['mycelix-crypto'].get('workspace') is not True:
              raise SystemExit('ERROR: signature-material theorem must use workspace mycelix-crypto types')
          if deps['mycelix-kvector-verifier-policy-body'].get('path') != '../kvector-verifier-policy-body':
              raise SystemExit('ERROR: signature material is not bound to canonical #248 policy body')

          text = (root / member / 'src/lib.rs').read_text()
          required = [
              '#![forbid(unsafe_code)]',
              'ed25519-v1',
              'hybrid-ed25519-mldsa65-v1',
              'AlgorithmId::Ed25519',
              'AlgorithmId::HybridEd25519MlDsa65',
              'expected_algorithm_for_signature_scheme_v2',
              'validate_kvector_signature_material_for_policy_v2',
              'public_key.algorithm != expected',
              'signature.algorithm != expected',
              'public_key.key_bytes.len() != expected_key_len',
              'signature.signature_bytes.len() != expected_signature_len',
              'hybrid_policy_rejects_ed25519_only_material',
              'mixed_algorithm_key_and_signature_fail_closed',
              'public_fields_cannot_bypass_raw_length_recheck',
              '32 + 1952',
              '64 + 3309',
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'ERROR: signature-material theorem missing: {needle!r}')

          lower = text.lower()
          for forbidden in [
              'use hdk',
              'use hdi',
              'hdk::',
              'hdi::',
              'holochain_',
              'hybrid_sig::verify',
              'mycelix_crypto::traits',
              'ed25519_dalek',
              'ml_dsa::',
              '.verify(',
              'signature_validated',
              'signature_verified',
              'is_verified',
              'policy_current',
              'sys_time(',
              'std::time',
              'feature = "native"',
          ]:
              if forbidden in lower:
                  raise SystemExit(
                      f'ERROR: cryptographic verification/runtime authority leaked into material theorem: {forbidden!r}'
                  )
          PY

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-workspace/mycelix-identity

      - name: Check formatting
        run: |
          cargo fmt \
            --manifest-path mycelix-workspace/mycelix-identity/crates/kvector-signature-material-policy/Cargo.toml \
            -- --check

      - name: Test verifier-policy body theorem
        run: |
          cargo test \
            --manifest-path mycelix-workspace/mycelix-identity/crates/kvector-verifier-policy-body/Cargo.toml

      - name: Test signature-material theorem
        run: |
          cargo test \
            --manifest-path mycelix-workspace/mycelix-identity/crates/kvector-signature-material-policy/Cargo.toml

      - name: Check signature-material theorem for wasm32
        run: |
          cargo check \
            --manifest-path mycelix-workspace/mycelix-identity/crates/kvector-signature-material-policy/Cargo.toml \
            --target wasm32-unknown-unknown
