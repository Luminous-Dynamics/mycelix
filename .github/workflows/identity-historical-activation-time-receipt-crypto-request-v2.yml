name: Identity Historical Activation Time Receipt Crypto Request V2

on:
  pull_request:
    paths:
      - 'mycelix-workspace/mycelix-identity/Cargo.toml'
      - 'mycelix-workspace/mycelix-identity/crates/mycelix-crypto/**'
      - 'mycelix-workspace/mycelix-identity/crates/historical-activation-time-receipt-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/historical-activation-time-authority-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/historical-activation-time-authority-key-generation-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/historical-activation-time-receipt-crypto-request-policy/**'
      - '.github/workflows/identity-historical-activation-time-receipt-crypto-request-v2.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-workspace/mycelix-identity/Cargo.toml'
      - 'mycelix-workspace/mycelix-identity/crates/mycelix-crypto/**'
      - 'mycelix-workspace/mycelix-identity/crates/historical-activation-time-receipt-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/historical-activation-time-authority-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/historical-activation-time-authority-key-generation-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/historical-activation-time-receipt-crypto-request-policy/**'
      - '.github/workflows/identity-historical-activation-time-receipt-crypto-request-v2.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify-historical-activation-time-receipt-crypto-request-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Assert prepared crypto-request boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          root = Path('mycelix-workspace/mycelix-identity')
          member = 'crates/historical-activation-time-receipt-crypto-request-policy'
          workspace = tomllib.loads((root / 'Cargo.toml').read_text())['workspace']['members']
          if member not in workspace:
              raise SystemExit(f'ERROR: {member} is not an explicit Identity workspace member')

          manifest = tomllib.loads((root / member / 'Cargo.toml').read_text())
          deps = manifest.get('dependencies', {})
          expected = {
              'mycelix-crypto',
              'mycelix-historical-activation-time-receipt-policy',
              'mycelix-historical-activation-time-authority-policy',
              'mycelix-historical-activation-time-authority-key-generation-policy',
              'sha2',
          }
          if set(deps) != expected:
              raise SystemExit(f'ERROR: time-receipt crypto-request dependency drift: {sorted(deps)}')
          if deps['mycelix-crypto'].get('workspace') is not True or deps['sha2'].get('workspace') is not True:
              raise SystemExit('ERROR: crypto-request theorem must use workspace crypto/sha2')

          text = (root / member / 'src/lib.rs').read_text()
          production = text.split('#[cfg(test)]', 1)[0]
          required = [
              '#![forbid(unsafe_code)]',
              'PreparedHistoricalActivationTimeReceiptCryptoRequestV2',
              'HISTORICAL_ACTIVATION_TIME_RECEIPT_CRYPTO_REQUEST_DOMAIN_V2',
              'mycelix:identity:historical-activation-time-receipt-crypto-request:v2\\0',
              'validate_prepared_time_receipt_against_static_policy_v2',
              'validate_time_authority_key_generation_against_static_policy_v2',
              'receipt.time_authority_key_generation_sha256() != key_generation.generation_digest_sha256()',
              'receipt.algorithm() != key_generation.algorithm()',
              'signature.algorithm != key_generation.algorithm()',
              'signature.signature_bytes.len() != key_generation.algorithm().signature_size()',
              'signature.signature_bytes.iter().all',
              'receipt.signing_digest_sha256()',
              'key_generation.public_key_bytes()',
              'signature.signature_bytes.clone()',
              'prepare_historical_activation_time_receipt_crypto_request_v2',
          ]
          for needle in required:
              if needle not in production:
                  raise SystemExit(f'ERROR: time-receipt crypto-request invariant missing: {needle!r}')

          result_start = production.index('pub struct PreparedHistoricalActivationTimeReceiptCryptoRequestV2')
          result_end = production.index('impl PreparedHistoricalActivationTimeReceiptCryptoRequestV2', result_start)
          result_body = production[result_start:result_end]
          for public_field in [
              'pub receipt_signing_digest_sha256:',
              'pub public_key_bytes:',
              'pub signature_bytes:',
              'pub crypto_request_digest_sha256:',
          ]:
              if public_field in result_body:
                  raise SystemExit(f'ERROR: prepared crypto-request capability is forgeable: {public_field}')

          lower = production.lower()
          for forbidden in [
              'use hdk', 'use hdi', 'hdk::', 'hdi::', 'holochain_',
              'sys_time(', 'std::time', 'network', 'verify_signature', '.verify(',
              'ed25519_dalek', 'ml_dsa::', 'pqcrypto', 'signature_verified',
              'authenticated_time', 'policy_current', 'policy_accepted', 'positive_evidence',
          ]:
              if forbidden in lower:
                  raise SystemExit(f'ERROR: crypto backend/currentness authority leaked into prepared request: {forbidden!r}')
          PY

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-workspace/mycelix-identity

      - name: Check formatting
        run: |
          cargo fmt \
            --manifest-path mycelix-workspace/mycelix-identity/crates/historical-activation-time-receipt-crypto-request-policy/Cargo.toml \
            -- --check

      - name: Test time receipt/policy/key prerequisites
        run: |
          cargo test --manifest-path mycelix-workspace/mycelix-identity/crates/historical-activation-time-receipt-policy/Cargo.toml
          cargo test --manifest-path mycelix-workspace/mycelix-identity/crates/historical-activation-time-authority-policy/Cargo.toml
          cargo test --manifest-path mycelix-workspace/mycelix-identity/crates/historical-activation-time-authority-key-generation-policy/Cargo.toml

      - name: Test prepared crypto request
        run: |
          cargo test \
            --manifest-path mycelix-workspace/mycelix-identity/crates/historical-activation-time-receipt-crypto-request-policy/Cargo.toml

      - name: Check prepared crypto request for wasm32
        run: |
          cargo check \
            --manifest-path mycelix-workspace/mycelix-identity/crates/historical-activation-time-receipt-crypto-request-policy/Cargo.toml \
            --target wasm32-unknown-unknown
