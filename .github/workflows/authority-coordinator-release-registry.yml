name: Authority Coordinator Release Registry

on:
  pull_request:
    paths:
      - 'crates/mycelix-authority-coordinator-release-registry/**'
      - 'crates/mycelix-authority-coordinator-release-currentness/**'
      - 'crates/mycelix-authority-coordinator-release/**'
      - 'mycelix-governance/zomes/authority-current-freshness-verifier/COORDINATOR_DEPLOYMENT_GATE.md'
      - 'mycelix-governance/dna/dna.yaml'
      - '.github/workflows/authority-coordinator-release-registry.yml'
  push:
    branches:
      - 'security/authority-coordinator-release-registry-v0.1'

permissions:
  contents: read

concurrency:
  group: authority-coordinator-release-registry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Rooted complete snapshot + local status derivation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --manifest-path crates/mycelix-authority-coordinator-release-registry/Cargo.toml -- --check

      - name: Tests
        run: cargo test --manifest-path crates/mycelix-authority-coordinator-release-registry/Cargo.toml --all-targets

      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-authority-coordinator-release-registry/Cargo.toml --all-targets -- -D warnings

      - name: '#275 compatibility'
        run: cargo test --manifest-path crates/mycelix-authority-coordinator-release-currentness/Cargo.toml --all-targets

      - name: Trust-boundary audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('crates/mycelix-authority-coordinator-release-registry')
          src = (root / 'src/lib.rs').read_text()
          prod = src.split('#[cfg(test)]', 1)[0]
          cargo = (root / 'Cargo.toml').read_text()
          inv = (root / 'INVARIANTS.md').read_text().lower()
          dna = Path('mycelix-governance/dna/dna.yaml').read_text()

          # Exact dependency/wire contract and no deployment/runtime integration.
          for token in [
              'ed25519-dalek = "=2.2.0"',
              'ml-dsa = "=0.1.1"',
              'mycelix-authority-coordinator-release = ',
              'mycelix-authority-coordinator-release-currentness = ',
          ]:
              assert token in cargo, token
          for forbidden in [
              'holochain_client', 'hdk',
              'mycelix-authority-coordinator-deployment-composer',
              'mycelix-authority-coordinator-stability-fence',
          ]:
              assert forbidden not in cargo, forbidden

          for token in [
              'pub const ED25519_PUBLIC_KEY_LEN: usize = 32;',
              'pub const ED25519_SIGNATURE_LEN: usize = 64;',
              'pub const ML_DSA_65_PUBLIC_KEY_LEN: usize = 1952;',
              'pub const ML_DSA_65_SIGNATURE_LEN: usize = 3309;',
              'pub const MAX_REGISTRY_HEAD_LIFETIME_MS: u64 = 30_000;',
              'pub const MAX_REGISTRY_RECORDS: usize = 65_536;',
              'pub struct CoordinatorReleaseRegistryTrustRoot {',
              'pub struct QualifiedCoordinatorReleaseRegistryRoot {',
              'root_lineage_digest: [u8; 32],',
              'pub struct CoordinatorReleaseRegistryRecord {',
              'pub struct CoordinatorReleaseRegistrySnapshot {',
              'pub struct QualifiedCurrentCoordinatorReleaseRegistrySnapshot {',
              'pub fn bootstrap_registry_root(',
              'pub fn rotate_registry_root(',
              'pub fn qualify_current_registry_snapshot(',
              'pub fn qualify_current_release(',
          ]:
              assert token in src, token

          # Root and registry-head roles stay separate and root rotation is dual-threshold.
          for token in [
              'root_keys: Vec<HybridRegistryTrustKey>',
              'registry_head_keys: Vec<HybridRegistryTrustKey>',
              'CrossRoleKeyReuse',
              'old_signatures: &[HybridRegistryThresholdSignature]',
              'new_signatures: &[HybridRegistryThresholdSignature]',
              'new_root.root_threshold < current.root_threshold_floor',
              'new_root.registry_head_threshold < current.registry_head_threshold_floor',
              '.max(new_root.root_threshold)',
              '.max(new_root.registry_head_threshold)',
          ]:
              assert token in src, token

          # Exact hybrid threshold verification.
          for token in [
              'signatures.len() != usize::from(threshold)',
              '.verify_strict(message, &EdSignature::from_bytes(&ed_signature))',
              'MlSignature::<MlDsa65>::decode(&encoded_signature)',
              '.verify(message, &signature)',
              'ensure_signers_live(&root.root.registry_head_keys, signatures, verified)?',
              '.min(signer_horizon(&root.root.registry_head_keys, signatures)?)',
          ]:
              assert token in prod, token

          # Whole-snapshot identity and canonical completeness.
          for token in [
              'frame(&mut h, self.registry_id.as_bytes());',
              'frame(&mut h, &(self.records.len() as u64).to_le_bytes());',
              'previous >= record.manifest_digest',
              'TooManyRegistryRecords',
              'FutureStatusRecord',
              'RegistryRecordsNotCanonical',
          ]:
              assert token in src, token

          # Cross-root predecessor grafting is forbidden by bootstrap lineage.
          for token in [
              'previous.root_lineage_digest != root.root_lineage_digest',
              'previous.snapshot.registry_id != snapshot.registry_id',
              'SnapshotLineageMismatch',
          ]:
              assert token in prod, token

          # Exact predecessor, no removal and no status resurrection.
          for token in [
              '.checked_add(1)',
              'snapshot.previous_registry_head_digest != Some(previous.registry_head_digest)',
              'RegistryRecordRemoved',
              'RegistryRecordHistoryRewritten',
              'old.status != CoordinatorReleaseStatus::Active',
              'new.status == CoordinatorReleaseStatus::Active',
              'new.status_effective_at_ms <= old.status_effective_at_ms',
          ]:
              assert token in prod, token

          # #275 evidence receipts are private compatibility projections derived from
          # the complete positive snapshot and immediately consumed locally.
          method = prod.split('pub fn qualify_current_release(', 1)[1].split('\n    }\n}', 1)[0]
          for token in [
              '.record(release.manifest_digest())',
              'let head_proof = VerifiedCurrentReleaseRegistryHeadProof {',
              'let status_proof = VerifiedCoordinatorReleaseStatusAtHeadProof {',
              'status: record.status',
              'status_record_digest: record.status_record_digest()?',
              'qualify_current_coordinator_release(release, &head_proof, &status_proof, now_ms)',
          ]:
              assert token in method, token
          assert 'Result<VerifiedCurrentReleaseRegistryHeadProof' not in prod
          assert 'Result<VerifiedCoordinatorReleaseStatusAtHeadProof' not in prod
          signature = method.split(') -> Result', 1)[0]
          assert 'head_proof:' not in signature
          assert 'status_proof:' not in signature

          # Positive root/snapshot are non-deserializable.
          for positive in [
              'pub struct QualifiedCoordinatorReleaseRegistryRoot {',
              'pub struct QualifiedCurrentCoordinatorReleaseRegistrySnapshot {',
          ]:
              prefix = src.split(positive, 1)[0].split('\n')[-8:]
              assert not any('Deserialize' in line for line in prefix), positive

          # No DHT/latest heuristic or external effect surface.
          for forbidden in [
              'get_links', 'get_details', 'latest_record', 'latest record',
              'AdminWebsocket', 'call_zome', 'UpdateCoordinators', 'perform_external_effect',
          ]:
              assert forbidden not in prod, forbidden

          # Production is verification-only.
          for forbidden in ['EdSigningKey', 'MlSigningKey', '::generate()', '.sign(']:
              assert forbidden not in prod, forbidden

          for invariant in [
              'registry authority is independent of release signing keys',
              'initial registry root is pinned out of band',
              'root and registry-head roles are separate',
              'v0.1 has one exact hybrid wire contract',
              'positive root is non-deserializable',
              'root rotation requires old + new thresholds',
              'root lineage survives rotation',
              'one snapshot is the complete registry state for one release-policy chain',
              'snapshot records are canonical and unique',
              'snapshot currentness is short lived',
              'genesis and successor lineage are explicit',
              'records cannot disappear',
              'status history is monotone',
              'future-dated status records deny',
              'positive snapshot is non-deserializable',
              'detached #275 status receipts are removed from the intended live path',
              'completeness is authority semantics, not a dht heuristic',
              'registry root/snapshot does not authenticate release code',
              'durable latest-snapshot state remains separate',
              'full-machine rollback remains outside the pure theorem',
              'no holochain or external effects',
              'provisioning remains blocked',
          ]:
              assert invariant in inv, invariant

          assert 'name: authority_current_freshness_verifier' not in dna
          assert 'name: constitution_currentness_verifier' not in dna
          print('PASS: rooted full snapshot -> canonical monotone registry -> local status lookup -> private #275 currentness')
          PY
