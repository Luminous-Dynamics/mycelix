name: Stewardship Policy Authority Qualification

on:
  pull_request:
    paths:
      - 'crates/mycelix-stewardship-core/**'
      - 'crates/mycelix-stewardship-claims/**'
      - 'crates/mycelix-stewardship-admission/**'
      - 'crates/mycelix-stewardship-policy/**'
      - 'crates/mycelix-stewardship-policy-authority/**'
      - '.github/workflows/stewardship-policy-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stewardship-policy-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact proposed head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Bind exact qualification subject
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install stable Rust and wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Verify narrow dependency closure
        run: |
          python - <<'PY'
          import pathlib
          import tomllib
          data = tomllib.loads(pathlib.Path('crates/mycelix-stewardship-policy-authority/Cargo.toml').read_text())
          expected = {
              'mycelix-stewardship-core': {'path': '../mycelix-stewardship-core'},
              'mycelix-stewardship-claims': {'path': '../mycelix-stewardship-claims'},
              'mycelix-stewardship-admission': {'path': '../mycelix-stewardship-admission'},
              'mycelix-stewardship-policy': {'path': '../mycelix-stewardship-policy'},
          }
          if data.get('dependencies', {}) != expected:
              raise SystemExit(f"unexpected STEW-012B dependency closure: {data.get('dependencies', {})!r}")
          PY

      - name: Format
        run: cargo fmt --manifest-path crates/mycelix-stewardship-policy-authority/Cargo.toml -- --check

      - name: Host tests
        run: cargo test --manifest-path crates/mycelix-stewardship-policy-authority/Cargo.toml --all-targets

      - name: wasm32 check
        run: cargo check --manifest-path crates/mycelix-stewardship-policy-authority/Cargo.toml --target wasm32-unknown-unknown

      - name: Strict Clippy
        run: cargo clippy --manifest-path crates/mycelix-stewardship-policy-authority/Cargo.toml --all-targets -- -D warnings

      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --manifest-path crates/mycelix-stewardship-policy-authority/Cargo.toml --no-deps

      - name: Postflight exact-head verification
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
