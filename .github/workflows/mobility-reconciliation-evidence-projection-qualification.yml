name: mobility-reconciliation-evidence-projection-qualification

on:
  push:
    paths:
      - "mycelix-commons/crates/mobility-configuration-qualification/**"
      - "tools/mobility_reconciliation_evidence_projection_reference.py"
      - "docs/mobility/MOBILITY_RECONCILIATION_EVIDENCE_PROJECTION_V1.*"
      - ".github/workflows/mobility-reconciliation-evidence-projection-qualification.yml"
  pull_request:
    paths:
      - "mycelix-commons/crates/mobility-configuration-qualification/**"
      - "tools/mobility_reconciliation_evidence_projection_reference.py"
      - "docs/mobility/MOBILITY_RECONCILIATION_EVIDENCE_PROJECTION_V1.*"
      - ".github/workflows/mobility-reconciliation-evidence-projection-qualification.yml"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check --manifest-path mycelix-commons/crates/mobility-configuration-qualification/Cargo.toml
      - run: cargo test --manifest-path mycelix-commons/crates/mobility-configuration-qualification/Cargo.toml

  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 tools/mobility_reconciliation_evidence_projection_reference.py
