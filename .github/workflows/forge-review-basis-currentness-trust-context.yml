name: Forge MergeProtected Review-Basis Currentness Trust Context

on:
  pull_request:
    paths:
      - 'crates/mycelix-forge-review-basis-currentness-trust-context/**'
      - 'crates/mycelix-forge-review-basis-currentness/**'
      - 'crates/mycelix-forge-merge-protected-review-basis/**'
      - '.github/workflows/forge-review-basis-currentness-trust-context.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: rustfmt
        working-directory: crates/mycelix-forge-review-basis-currentness-trust-context
        run: cargo fmt -- --check
      - name: clippy
        working-directory: crates/mycelix-forge-review-basis-currentness-trust-context
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: static trust-context firewall
        working-directory: crates/mycelix-forge-review-basis-currentness-trust-context
        run: |
          ! grep -Eq 'impl.*Deserialize.*MergeProtectedTrustedReviewBasisCurrentnessV1' src/lib.rs
          ! grep -Eq 'fn.*(authorize|permit|execute|merge)' src/lib.rs
          grep -Fq 'quorum.finalization_context()' src/lib.rs
          grep -Fq 'currentness.review_basis_quorum()' src/lib.rs
          grep -Fq 'context.coverage_commitment()' src/lib.rs
      - name: tests
        working-directory: crates/mycelix-forge-review-basis-currentness-trust-context
        run: cargo test --all-features
