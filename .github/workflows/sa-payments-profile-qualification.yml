name: South African Payments Profile Qualification

on:
  pull_request:
    paths:
      - 'mycelix-finance/docs/SOUTH_AFRICAN_PAYMENTS_INTEROP_PROFILE_V1.md'
      - 'mycelix-finance/docs/south-african-payment-interop-v1.json'
      - 'mycelix-finance/docs/south-african-payment-interop-v1.schema.json'
      - 'mycelix-workspace/mycelix-finance/docs/SOUTH_AFRICAN_PAYMENTS_INTEROP_PROFILE_V1.md'
      - 'mycelix-workspace/mycelix-finance/docs/south-african-payment-interop-v1.json'
      - 'mycelix-workspace/mycelix-finance/docs/south-african-payment-interop-v1.schema.json'
      - 'tools/finance/sa-payments-profile-evaluator/**'
      - '.github/workflows/sa-payments-profile-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-finance/docs/SOUTH_AFRICAN_PAYMENTS_INTEROP_PROFILE_V1.md'
      - 'mycelix-finance/docs/south-african-payment-interop-v1.json'
      - 'mycelix-finance/docs/south-african-payment-interop-v1.schema.json'
      - 'tools/finance/sa-payments-profile-evaluator/**'
      - '.github/workflows/sa-payments-profile-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-profile:
    name: Effects-disabled South African profile evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Immutable release pin: actions/checkout v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.0
          rustc --version
          cargo --version

      - name: Run evaluator and unit tests
        run: cargo test --manifest-path tools/finance/sa-payments-profile-evaluator/Cargo.toml

      - name: Run deterministic negative-mutation campaign
        run: cargo run --manifest-path tools/finance/sa-payments-profile-evaluator/Cargo.toml -- --self-test
