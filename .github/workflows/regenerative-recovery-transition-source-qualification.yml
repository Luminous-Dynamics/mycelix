name: Regenerative Recovery Transition Source Qualification

on:
  push:
    branches:
      - feat/regenerative-recovery-transition-source-qualified-v1
  pull_request:
    branches:
      - feat/regenerative-recovery-transition-transport-v1

permissions:
  contents: read

concurrency:
  group: regenerative-recovery-transition-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: Exact transition source recomputation boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Toolchain identity
        run: |
          rustc --version --verbose
          cargo --version
          rustfmt --version
          cargo clippy --version

      - name: Format owned subjects
        run: |
          rustfmt --edition 2024 --check mycelix-commons/crates/commons-types/src/regenerative_recovery_transition_source_qualification.rs
          rustfmt --edition 2024 --check mycelix-commons/crates/commons-types/src/lib.rs

      - name: Test commons-types
        run: cargo test --manifest-path mycelix-commons/Cargo.toml -p commons-types

      - name: Clippy commons-types; gate owned subjects
        shell: bash
        run: |
          set -euo pipefail
          owned_a='mycelix-commons/crates/commons-types/src/regenerative_recovery_transition_source_qualification.rs'
          owned_b='mycelix-commons/crates/commons-types/src/lib.rs'
          set +e
          cargo clippy --manifest-path mycelix-commons/Cargo.toml -p commons-types \
            --message-format=json 2>&1 | tee /tmp/recovery-transition-source-clippy.jsonl
          cargo_status=${PIPESTATUS[0]}
          set -e
          python3 - "$owned_a" "$owned_b" "$cargo_status" <<'PY'
          import json
          import sys

          owned = set(sys.argv[1:3])
          cargo_status = int(sys.argv[3])
          owned_warnings = []
          compiler_errors = []
          with open('/tmp/recovery-transition-source-clippy.jsonl', encoding='utf-8', errors='replace') as handle:
              for line in handle:
                  try:
                      event = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if event.get('reason') != 'compiler-message':
                      continue
                  message = event.get('message') or {}
                  level = message.get('level')
                  spans = message.get('spans') or []
                  if level == 'error':
                      compiler_errors.append(message.get('message', 'compiler error'))
                  if level == 'warning' and any(
                      span.get('is_primary') and span.get('file_name') in owned for span in spans
                  ):
                      owned_warnings.append(message.get('message', 'warning'))

          if cargo_status != 0 or compiler_errors:
              print('Whole-package compiler/Clippy failure', file=sys.stderr)
              for error in compiler_errors:
                  print(f'- {error}', file=sys.stderr)
              raise SystemExit(1)
          if owned_warnings:
              print('Owned source-qualification warnings:', file=sys.stderr)
              for warning in owned_warnings:
                  print(f'- {warning}', file=sys.stderr)
              raise SystemExit(1)
          print('PASS: package compiled and owned source-qualification subjects have no Clippy warnings')
          PY

      - name: Exact-source and non-replay boundary audit
        shell: bash
        run: |
          set -euo pipefail
          subject=mycelix-commons/crates/commons-types/src/regenerative_recovery_transition_source_qualification.rs
          grep -q 'validate_regenerative_recovery_transition_transport(transport)?' "$subject"
          grep -q 'verify_regenerative_recovery_transition_commitment(' "$subject"
          grep -q 'pub const fn exact_source_recomputation_verified_here' "$subject"
          grep -q '^        true$' "$subject"
          grep -q 'pub const fn live_governance_authority_verified_here' "$subject"
          grep -q 'pub const fn persistence_authorized_here' "$subject"
          grep -q 'pub const fn persistence_executed_here' "$subject"
          test "$(grep -c '^        false$' "$subject")" -ge 3
          grep -q '#\[derive(Debug)\]' "$subject"
          ! grep -Eq '#\[derive\([^]]*(Clone|Serialize|Deserialize)' "$subject"
          ! grep -Eq 'impl[[:space:]]+Clone[[:space:]]+for[[:space:]]+RegenerativeRecoveryTransitionSourceQualificationV1' "$subject"
          ! grep -Eq 'Serialize|Deserialize' "$subject" || grep -q 'no `Clone`, `Serialize`, or `Deserialize` implementation' "$subject"
          ! grep -Eq '\bhdk\b|create_entry|update_entry|delete_entry|CallTargetCell|ZomeName' "$subject"
