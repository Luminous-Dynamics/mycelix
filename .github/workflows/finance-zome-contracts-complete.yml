name: Finance Zome Contracts Complete

on:
  pull_request:
    paths:
      - '.github/workflows/finance-zome-contracts-complete.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: finance-zome-contracts-complete
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: '1.96.0'
  SOURCE_SHA: 'ea01f1f02e08b04786bce4e85d50a6a7d1f8408f'
  PHASE_A_ARTIFACT_ID: '10306281633'
  PHASE_A_ARTIFACT_SHA256: '11097c15ee15257e7f2129b94b0ffb453ff121ba859bb25e0b0e55319d7cb086'

jobs:
  qualify:
    name: Qualify complete ABI-neutral V2 boundary
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ci-fin-safe-024-complete'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout frozen FIN-SAFE-020 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Reconstruct exact validated Phase A tracked state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PHASE_A_ARTIFACT_ID}/zip" \
            -o /tmp/phase-a.zip
          echo "${PHASE_A_ARTIFACT_SHA256}  /tmp/phase-a.zip" | sha256sum -c -
          mkdir -p /tmp/phase-a-evidence
          unzip -q /tmp/phase-a.zip -d /tmp/phase-a-evidence
          test -s /tmp/phase-a-evidence/phase-a-r2-source.patch
          git apply --check /tmp/phase-a-evidence/phase-a-r2-source.patch
          git apply /tmp/phase-a-evidence/phase-a-r2-source.patch

          mkdir -p mycelix-finance/crates/finance-holochain-contracts/src
          cat > mycelix-finance/crates/finance-holochain-contracts/Cargo.toml <<'EOF'
          [package]
          name = "finance-holochain-contracts"
          version = "0.1.0"
          edition = "2024"
          license.workspace = true
          description = "ABI-neutral shared Holochain entry contracts for Mycelix Finance V2 zomes"

          [dependencies]
          hdi = { workspace = true }
          holochain_serialized_bytes = { workspace = true }
          serde = { workspace = true }
          finance-collateral-deposit = { path = "../finance-collateral-deposit" }
          finance-collateral-auth = { path = "../finance-collateral-auth" }
          EOF

          cat > mycelix-finance/crates/finance-holochain-contracts/src/lib.rs <<'EOF'
          #![deny(unsafe_code)]
          // Copyright (C) 2024-2026 Tristan Stoltz / Luminous Dynamics
          // SPDX-License-Identifier: AGPL-3.0-or-later
          // Commercial licensing: see COMMERCIAL_LICENSE.md at repository root
          //! ABI-neutral serialized contracts shared by Finance V2 Holochain zomes.
          //!
          //! This crate deliberately declares no EntryTypes, LinkTypes, callbacks,
          //! extern functions, or zome authority. Zomes own authority; this crate
          //! owns only canonical payload serialization and shared property decoding.

          use finance_collateral_auth::{
              CollateralSettlementAuthConfig, CustodyAttestationV1, PriceAttestationV1,
          };
          use finance_collateral_deposit::{
              COLLATERAL_DEPOSIT_NONCE_BYTES, CollateralDepositRequestV2,
          };
          use hdi::prelude::*;

          pub const MAX_CREATE_TIMESTAMP_SKEW_MICROS: i64 = 5_000_000;

          #[dna_properties]
          #[derive(Clone)]
          pub struct FinanceCollateralAuthDnaProperties {
              pub collateral_settlement_auth: CollateralSettlementAuthConfig,
          }

          pub fn load_collateral_auth_config() -> ExternResult<CollateralSettlementAuthConfig> {
              Ok(FinanceCollateralAuthDnaProperties::try_from_dna_properties()?
                  .collateral_settlement_auth)
          }

          #[hdk_entry_helper]
          #[derive(Clone, PartialEq)]
          pub struct CollateralDepositRequestV2Entry {
              pub schema_version: u16,
              pub deposit_id: String,
              pub depositor_did: String,
              pub collateral_asset_id: String,
              pub collateral_amount: u64,
              pub quote_asset_id: String,
              pub request_nonce: Vec<u8>,
              pub created_at_micros: i64,
          }

          impl CollateralDepositRequestV2Entry {
              pub fn to_model(&self) -> Result<CollateralDepositRequestV2, String> {
                  let request_nonce: [u8; COLLATERAL_DEPOSIT_NONCE_BYTES] =
                      self.request_nonce.as_slice().try_into().map_err(|_| {
                          format!(
                              "request_nonce must contain exactly {} bytes",
                              COLLATERAL_DEPOSIT_NONCE_BYTES
                          )
                      })?;
                  Ok(CollateralDepositRequestV2 {
                      schema_version: self.schema_version,
                      deposit_id: self.deposit_id.clone(),
                      depositor_did: self.depositor_did.clone(),
                      collateral_asset_id: self.collateral_asset_id.clone(),
                      collateral_amount: self.collateral_amount,
                      quote_asset_id: self.quote_asset_id.clone(),
                      request_nonce,
                      created_at_micros: self.created_at_micros,
                  })
              }
          }

          impl From<CollateralDepositRequestV2> for CollateralDepositRequestV2Entry {
              fn from(value: CollateralDepositRequestV2) -> Self {
                  Self {
                      schema_version: value.schema_version,
                      deposit_id: value.deposit_id,
                      depositor_did: value.depositor_did,
                      collateral_asset_id: value.collateral_asset_id,
                      collateral_amount: value.collateral_amount,
                      quote_asset_id: value.quote_asset_id,
                      request_nonce: value.request_nonce.to_vec(),
                      created_at_micros: value.created_at_micros,
                  }
              }
          }

          #[hdk_entry_helper]
          #[derive(Clone, PartialEq)]
          pub struct PriceAttestationV1Entry {
              pub attestation: PriceAttestationV1,
          }

          #[hdk_entry_helper]
          #[derive(Clone, PartialEq)]
          pub struct CustodyAttestationV1Entry {
              pub attestation: CustodyAttestationV1,
          }
          EOF

          cd mycelix-finance
          cargo fmt --all
          cd ..
          git diff > /tmp/phase-a-reconstructed.patch
          cmp /tmp/phase-a-reconstructed.patch /tmp/phase-a-evidence/phase-a-r2-source.patch

      - name: Complete ABI-neutral contract extraction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          contracts_manifest = Path('mycelix-finance/crates/finance-holochain-contracts/Cargo.toml')
          text = contracts_manifest.read_text()
          anchor = 'finance-collateral-auth = { path = "../finance-collateral-auth" }\n'
          additions = (
              'finance-collateral-issuance-persistence = { path = "../finance-collateral-issuance-persistence" }\n'
              'finance-sap-account-v2 = { path = "../finance-sap-account-v2" }\n'
              'finance-sap-transfer-v2 = { path = "../finance-sap-transfer-v2" }\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit('contract manifest anchor mismatch')
          contracts_manifest.write_text(text.replace(anchor, anchor + additions))

          contracts = Path('mycelix-finance/crates/finance-holochain-contracts/src/lib.rs')
          ctext = contracts.read_text()
          import_anchor = 'use finance_collateral_deposit::{\n    COLLATERAL_DEPOSIT_NONCE_BYTES, CollateralDepositRequestV2,\n};\n'
          imports = (
              'use finance_collateral_issuance_persistence::{\n'
              '    CollateralSapIssuanceReceiptRecordV2, CollateralSapMintAuthorizationRecordV2,\n'
              '    CollateralSapMintRecordV2Compact,\n'
              '};\n'
              'use finance_sap_account_v2::{SapAccountOpenedV2, SapAccountV2Config, SapCollateralClaimV2};\n'
              'use finance_sap_transfer_v2::{SapTransferSpendRecordV2, SapTransferV2Config};\n'
          )
          if ctext.count(import_anchor) != 1:
              raise SystemExit('contract source import anchor mismatch')
          ctext = ctext.replace(import_anchor, import_anchor + imports)

          def move_block(path_s, start_marker, end_marker):
              path = Path(path_s)
              text = path.read_text()
              if text.count(start_marker) != 1:
                  raise SystemExit(f'{path}: start marker mismatch')
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              block = text[start:end]
              path.write_text(text[:start] + text[end:])
              return block

          issuance_block = move_block(
              'mycelix-finance/zomes/collateral-issuance-v2/integrity/src/lib.rs',
              '#[hdk_entry_helper]\n#[derive(Clone, PartialEq)]\npub struct CollateralSapMintAuthorizationV2Entry',
              '#[hdk_entry_types]',
          )
          account_block = move_block(
              'mycelix-finance/zomes/sap-account-v2/integrity/src/lib.rs',
              '#[dna_properties]',
              '#[hdk_entry_types]',
          )
          transfer_block = move_block(
              'mycelix-finance/zomes/sap-transfer-v2/integrity/src/lib.rs',
              '#[dna_properties]',
              '#[hdk_entry_types]',
          )
          contracts.write_text(ctext.rstrip() + '\n\n' + issuance_block + account_block + transfer_block)

          # Issuance integrity: local payloads now also come from contracts.
          path = Path('mycelix-finance/zomes/collateral-issuance-v2/integrity/src/lib.rs')
          text = path.read_text()
          old = '''use finance_holochain_contracts::{
              CollateralDepositRequestV2Entry, CustodyAttestationV1Entry, MAX_CREATE_TIMESTAMP_SKEW_MICROS,
              PriceAttestationV1Entry, load_collateral_auth_config,
          };'''.replace('          ', '')
          new = '''use finance_holochain_contracts::{
              CollateralDepositRequestV2Entry, CollateralSapIssuanceReceiptV2Entry,
              CollateralSapMintAuthorizationV2Entry, CollateralSapMintRecordV2Entry,
              CustodyAttestationV1Entry, MAX_CREATE_TIMESTAMP_SKEW_MICROS,
              PriceAttestationV1Entry, load_collateral_auth_config,
          };'''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit('issuance integrity contract import mismatch')
          path.write_text(text.replace(old, new))

          # SAP account integrity: no foreign issuance integrity linkage.
          path = Path('mycelix-finance/zomes/sap-account-v2/integrity/src/lib.rs')
          text = path.read_text()
          old = 'use collateral_issuance_v2_integrity::CollateralSapIssuanceReceiptV2Entry;\n'
          new = (
              'use finance_holochain_contracts::{\n'
              '    CollateralSapIssuanceReceiptV2Entry, FinanceSapAccountV2DnaProperties,\n'
              '    SapAccountOpenedV2Entry, SapCollateralClaimV2Entry,\n'
              '};\n'
          )
          if text.count(old) != 1:
              raise SystemExit('sap account integrity foreign import mismatch')
          path.write_text(text.replace(old, new))
          manifest = Path('mycelix-finance/zomes/sap-account-v2/integrity/Cargo.toml')
          text = manifest.read_text()
          foreign = 'collateral_issuance_v2_integrity = { path = "../../collateral-issuance-v2/integrity" }\n'
          if text.count(foreign) != 1:
              raise SystemExit('sap account integrity foreign dependency mismatch')
          anchor = 'finance-collateral-issuance-persistence = { path = "../../../crates/finance-collateral-issuance-persistence" }\n'
          manifest.write_text(text.replace(foreign, '').replace(
              anchor, anchor + 'finance-holochain-contracts = { path = "../../../crates/finance-holochain-contracts" }\n'
          ))

          # SAP transfer integrity: all foreign payloads come from contracts.
          path = Path('mycelix-finance/zomes/sap-transfer-v2/integrity/src/lib.rs')
          text = path.read_text()
          old1 = 'use collateral_issuance_v2_integrity::CollateralSapIssuanceReceiptV2Entry;\n'
          old2 = 'use sap_account_v2_integrity::SapCollateralClaimV2Entry;\n'
          new = (
              'use finance_holochain_contracts::{\n'
              '    CollateralSapIssuanceReceiptV2Entry, FinanceSapTransferV2DnaProperties,\n'
              '    SapCollateralClaimV2Entry, SapTransferSpendV2Entry,\n'
              '};\n'
          )
          if text.count(old1) != 1 or text.count(old2) != 1:
              raise SystemExit('sap transfer integrity foreign import mismatch')
          path.write_text(text.replace(old1, new).replace(old2, ''))
          manifest = Path('mycelix-finance/zomes/sap-transfer-v2/integrity/Cargo.toml')
          text = manifest.read_text()
          for foreign in [
              'sap_account_v2_integrity = { path = "../../sap-account-v2/integrity" }\n',
              'collateral_issuance_v2_integrity = { path = "../../collateral-issuance-v2/integrity" }\n',
          ]:
              if text.count(foreign) != 1:
                  raise SystemExit(f'sap transfer integrity foreign dependency mismatch: {foreign!r}')
              text = text.replace(foreign, '')
          anchor = 'finance-collateral-issuance-persistence = { path = "../../../crates/finance-collateral-issuance-persistence" }\n'
          manifest.write_text(text.replace(
              anchor, anchor + 'finance-holochain-contracts = { path = "../../../crates/finance-holochain-contracts" }\n'
          ))
          PY

      - name: Decouple V2 coordinators from foreign integrity zomes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def add_dep(path_s, anchor, dep):
              path = Path(path_s)
              text = path.read_text()
              if dep in text:
                  return
              if text.count(anchor) != 1:
                  raise SystemExit(f'{path}: dependency anchor mismatch')
              path.write_text(text.replace(anchor, anchor + dep))

          def remove_dep(path_s, line):
              path = Path(path_s)
              text = path.read_text()
              if text.count(line) != 1:
                  raise SystemExit(f'{path}: foreign dependency mismatch {line!r}')
              path.write_text(text.replace(line, ''))

          # Deposit coordinator keeps own integrity only; payload/constant direct from contracts.
          path = Path('mycelix-finance/zomes/collateral-deposit-v2/coordinator/src/lib.rs')
          text = path.read_text()
          old = '''use collateral_deposit_v2_integrity::{
              CollateralDepositRequestV2Entry, EntryTypes, MAX_CREATE_TIMESTAMP_SKEW_MICROS, UnitEntryTypes,
          };'''.replace('          ', '')
          new = '''use collateral_deposit_v2_integrity::{EntryTypes, UnitEntryTypes};
          use finance_holochain_contracts::{
              CollateralDepositRequestV2Entry, MAX_CREATE_TIMESTAMP_SKEW_MICROS,
          };'''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit('deposit coordinator import mismatch')
          path.write_text(text.replace(old, new))
          add_dep(
              'mycelix-finance/zomes/collateral-deposit-v2/coordinator/Cargo.toml',
              'finance-collateral-request-binding = { path = "../../../crates/finance-collateral-request-binding" }\n',
              'finance-holochain-contracts = { path = "../../../crates/finance-holochain-contracts" }\n',
          )

          # Settlement-auth coordinator uses own integrity enums and foreign deposit identity by DNA index.
          path = Path('mycelix-finance/zomes/collateral-settlement-auth/coordinator/src/lib.rs')
          text = path.read_text()
          old = '''use collateral_deposit_v2_integrity::{
              CollateralDepositRequestV2Entry, MAX_CREATE_TIMESTAMP_SKEW_MICROS,
              UnitEntryTypes as DepositUnitEntryTypes,
          };
          use collateral_settlement_auth_integrity::{
              CustodyAttestationV1Entry, EntryTypes, PriceAttestationV1Entry,
              UnitEntryTypes as AuthUnitEntryTypes, load_collateral_auth_config,
          };'''.replace('          ', '')
          new = '''use collateral_settlement_auth_integrity::{
              EntryTypes, UnitEntryTypes as AuthUnitEntryTypes,
          };
          use finance_holochain_contracts::{
              CollateralDepositRequestV2Entry, CustodyAttestationV1Entry,
              MAX_CREATE_TIMESTAMP_SKEW_MICROS, PriceAttestationV1Entry,
              load_collateral_auth_config,
          };'''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit('settlement-auth coordinator import mismatch')
          text = text.replace(old, new)
          insert = 'use mycelix_bridge_entry_types::did_for_author;\n'
          constants = (
              '\nconst COLLATERAL_DEPOSIT_INTEGRITY_ZOME: &str = "collateral_deposit_v2_integrity";\n'
              'const COLLATERAL_DEPOSIT_REQUEST_ENTRY_INDEX: u8 = 0;\n'
          )
          if text.count(insert) != 1:
              raise SystemExit('settlement-auth coordinator constant anchor mismatch')
          text = text.replace(insert, insert + constants)
          old_entry = 'AppEntryDef::try_from(DepositUnitEntryTypes::CollateralDepositRequestV2)?'
          new_entry = 'foreign_public_entry_def(COLLATERAL_DEPOSIT_INTEGRITY_ZOME, COLLATERAL_DEPOSIT_REQUEST_ENTRY_INDEX)?'
          if text.count(old_entry) != 1:
              raise SystemExit('settlement-auth foreign deposit identity mismatch')
          text = text.replace(old_entry, new_entry)
          marker = '\nfn require_create_action(record: &Record, label: &str) -> ExternResult<()> {'
          helper = '''
          fn foreign_public_entry_def(zome_name: &str, entry_index: u8) -> ExternResult<AppEntryDef> {
              let info = dna_info()?;
              let zome_position = info
                  .zome_names
                  .iter()
                  .position(|name| name.to_string() == zome_name)
                  .ok_or_else(|| wasm_error!(WasmErrorInner::Guest(format!(
                      "Required integrity zome {zome_name:?} is absent from this DNA"
                  ))))?;
              let zome_index = u8::try_from(zome_position).map_err(|_| {
                  wasm_error!(WasmErrorInner::Guest(format!(
                      "Integrity zome index for {zome_name:?} exceeds u8"
                  )))
              })?;
              Ok(AppEntryDef::new(
                  EntryDefIndex::from(entry_index),
                  ZomeIndex::from(zome_index),
                  EntryVisibility::Public,
              ))
          }
          '''.replace('          ', '')
          if text.count(marker) != 1:
              raise SystemExit('settlement-auth helper insertion mismatch')
          path.write_text(text.replace(marker, '\n' + helper + marker.lstrip('\n')))
          remove_dep(
              'mycelix-finance/zomes/collateral-settlement-auth/coordinator/Cargo.toml',
              'collateral_deposit_v2_integrity = { path = "../../collateral-deposit-v2/integrity" }\n',
          )
          add_dep(
              'mycelix-finance/zomes/collateral-settlement-auth/coordinator/Cargo.toml',
              'finance-collateral-settlement = { path = "../../../crates/finance-collateral-settlement" }\n',
              'finance-holochain-contracts = { path = "../../../crates/finance-holochain-contracts" }\n',
          )

          # Issuance coordinator: local enums from own integrity, local payloads/config from contracts.
          path = Path('mycelix-finance/zomes/collateral-issuance-v2/coordinator/src/lib.rs')
          text = path.read_text()
          old = '''use collateral_issuance_v2_integrity::{
              CollateralSapIssuanceReceiptV2Entry, CollateralSapMintAuthorizationV2Entry,
              CollateralSapMintRecordV2Entry, EntryTypes, UnitEntryTypes,
          };
          use collateral_settlement_auth_integrity::load_collateral_auth_config;'''.replace('          ', '')
          new = '''use collateral_issuance_v2_integrity::{EntryTypes, UnitEntryTypes};
          use finance_holochain_contracts::{
              CollateralSapIssuanceReceiptV2Entry, CollateralSapMintAuthorizationV2Entry,
              CollateralSapMintRecordV2Entry, load_collateral_auth_config,
          };'''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit('issuance coordinator import mismatch')
          path.write_text(text.replace(old, new))
          remove_dep(
              'mycelix-finance/zomes/collateral-issuance-v2/coordinator/Cargo.toml',
              'collateral_settlement_auth_integrity = { path = "../../collateral-settlement-auth/integrity" }\n',
          )
          add_dep(
              'mycelix-finance/zomes/collateral-issuance-v2/coordinator/Cargo.toml',
              'finance-sap-conservation = { path = "../../../crates/finance-sap-conservation" }\n',
              'finance-holochain-contracts = { path = "../../../crates/finance-holochain-contracts" }\n',
          )

          # SAP account coordinator: foreign issuance payload from contracts + DNA-derived entry identity.
          path = Path('mycelix-finance/zomes/sap-account-v2/coordinator/src/lib.rs')
          text = path.read_text()
          old1 = '''use collateral_issuance_v2_integrity::{
              CollateralSapIssuanceReceiptV2Entry, UnitEntryTypes as CollateralIssuanceUnitEntryTypes,
          };'''.replace('          ', '')
          old2 = '''use sap_account_v2_integrity::{
              EntryTypes, SapAccountOpenedV2Entry, SapCollateralClaimV2Entry, UnitEntryTypes,
              load_sap_account_v2_config,
          };'''.replace('          ', '')
          new1 = '''use finance_holochain_contracts::{
              CollateralSapIssuanceReceiptV2Entry, SapAccountOpenedV2Entry,
              SapCollateralClaimV2Entry,
          };'''.replace('          ', '')
          new2 = '''use sap_account_v2_integrity::{
              EntryTypes, UnitEntryTypes, load_sap_account_v2_config,
          };'''.replace('          ', '')
          if text.count(old1) != 1 or text.count(old2) != 1:
              raise SystemExit('sap account coordinator import mismatch')
          text = text.replace(old1, new1).replace(old2, new2)
          anchor = 'use mycelix_bridge_entry_types::did_for_author;\n'
          constants = (
              '\nconst COLLATERAL_ISSUANCE_INTEGRITY_ZOME: &str = "collateral_issuance_v2_integrity";\n'
              'const COLLATERAL_ISSUANCE_RECEIPT_ENTRY_INDEX: u8 = 2;\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit('sap account coordinator constant anchor mismatch')
          text = text.replace(anchor, anchor + constants)
          old_entry = 'AppEntryDef::try_from(CollateralIssuanceUnitEntryTypes::CollateralSapIssuanceReceiptV2)?'
          new_entry = 'foreign_public_entry_def(COLLATERAL_ISSUANCE_INTEGRITY_ZOME, COLLATERAL_ISSUANCE_RECEIPT_ENTRY_INDEX)?'
          if text.count(old_entry) != 1:
              raise SystemExit('sap account receipt identity mismatch')
          text = text.replace(old_entry, new_entry)
          marker = '\nfn create_and_reload(entry: EntryTypes) -> ExternResult<Record> {'
          helper = '''
          fn foreign_public_entry_def(zome_name: &str, entry_index: u8) -> ExternResult<AppEntryDef> {
              let info = dna_info()?;
              let zome_position = info
                  .zome_names
                  .iter()
                  .position(|name| name.to_string() == zome_name)
                  .ok_or_else(|| wasm_error!(WasmErrorInner::Guest(format!(
                      "Required integrity zome {zome_name:?} is absent from this DNA"
                  ))))?;
              let zome_index = u8::try_from(zome_position).map_err(|_| {
                  wasm_error!(WasmErrorInner::Guest(format!(
                      "Integrity zome index for {zome_name:?} exceeds u8"
                  )))
              })?;
              Ok(AppEntryDef::new(
                  EntryDefIndex::from(entry_index),
                  ZomeIndex::from(zome_index),
                  EntryVisibility::Public,
              ))
          }
          '''.replace('          ', '')
          if text.count(marker) != 1:
              raise SystemExit('sap account helper insertion mismatch')
          path.write_text(text.replace(marker, '\n' + helper + marker.lstrip('\n')))
          remove_dep(
              'mycelix-finance/zomes/sap-account-v2/coordinator/Cargo.toml',
              'collateral_issuance_v2_integrity = { path = "../../collateral-issuance-v2/integrity" }\n',
          )
          add_dep(
              'mycelix-finance/zomes/sap-account-v2/coordinator/Cargo.toml',
              'finance-collateral-issuance-persistence = { path = "../../../crates/finance-collateral-issuance-persistence" }\n',
              'finance-holochain-contracts = { path = "../../../crates/finance-holochain-contracts" }\n',
          )

          # SAP transfer coordinator: both foreign payloads from contracts, both identities from DNA order.
          path = Path('mycelix-finance/zomes/sap-transfer-v2/coordinator/src/lib.rs')
          text = path.read_text()
          old1 = '''use collateral_issuance_v2_integrity::{
              CollateralSapIssuanceReceiptV2Entry, UnitEntryTypes as CollateralIssuanceUnitEntryTypes,
          };'''.replace('          ', '')
          old2 = '''use sap_account_v2_integrity::{
              SapCollateralClaimV2Entry, UnitEntryTypes as SapAccountUnitEntryTypes,
          };'''.replace('          ', '')
          old3 = '''use sap_transfer_v2_integrity::{
              EntryTypes, SapTransferSpendV2Entry, UnitEntryTypes as SapTransferUnitEntryTypes,
              load_sap_transfer_v2_config,
          };'''.replace('          ', '')
          new1 = '''use finance_holochain_contracts::{
              CollateralSapIssuanceReceiptV2Entry, SapCollateralClaimV2Entry,
              SapTransferSpendV2Entry,
          };'''.replace('          ', '')
          new3 = '''use sap_transfer_v2_integrity::{
              EntryTypes, UnitEntryTypes as SapTransferUnitEntryTypes,
              load_sap_transfer_v2_config,
          };'''.replace('          ', '')
          if text.count(old1) != 1 or text.count(old2) != 1 or text.count(old3) != 1:
              raise SystemExit('sap transfer coordinator import mismatch')
          text = text.replace(old1, new1).replace(old2, '').replace(old3, new3)
          anchor = 'use mycelix_bridge_entry_types::did_for_author;\n'
          constants = (
              '\nconst SAP_ACCOUNT_V2_INTEGRITY_ZOME: &str = "sap_account_v2_integrity";\n'
              'const SAP_COLLATERAL_CLAIM_ENTRY_INDEX: u8 = 1;\n'
              'const COLLATERAL_ISSUANCE_INTEGRITY_ZOME: &str = "collateral_issuance_v2_integrity";\n'
              'const COLLATERAL_ISSUANCE_RECEIPT_ENTRY_INDEX: u8 = 2;\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit('sap transfer coordinator constant anchor mismatch')
          text = text.replace(anchor, anchor + constants)
          replacements = {
              'AppEntryDef::try_from(SapAccountUnitEntryTypes::SapCollateralClaimV2)?':
                  'foreign_public_entry_def(SAP_ACCOUNT_V2_INTEGRITY_ZOME, SAP_COLLATERAL_CLAIM_ENTRY_INDEX)?',
              'AppEntryDef::try_from(CollateralIssuanceUnitEntryTypes::CollateralSapIssuanceReceiptV2)?':
                  'foreign_public_entry_def(COLLATERAL_ISSUANCE_INTEGRITY_ZOME, COLLATERAL_ISSUANCE_RECEIPT_ENTRY_INDEX)?',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'sap transfer foreign identity mismatch: {old}')
              text = text.replace(old, new)
          marker = '\nfn require_create_action(record: &Record, label: &str) -> ExternResult<()> {'
          helper = '''
          fn foreign_public_entry_def(zome_name: &str, entry_index: u8) -> ExternResult<AppEntryDef> {
              let info = dna_info()?;
              let zome_position = info
                  .zome_names
                  .iter()
                  .position(|name| name.to_string() == zome_name)
                  .ok_or_else(|| wasm_error!(WasmErrorInner::Guest(format!(
                      "Required integrity zome {zome_name:?} is absent from this DNA"
                  ))))?;
              let zome_index = u8::try_from(zome_position).map_err(|_| {
                  wasm_error!(WasmErrorInner::Guest(format!(
                      "Integrity zome index for {zome_name:?} exceeds u8"
                  )))
              })?;
              Ok(AppEntryDef::new(
                  EntryDefIndex::from(entry_index),
                  ZomeIndex::from(zome_index),
                  EntryVisibility::Public,
              ))
          }
          '''.replace('          ', '')
          if text.count(marker) != 1:
              raise SystemExit('sap transfer helper insertion mismatch')
          path.write_text(text.replace(marker, '\n' + helper + marker.lstrip('\n')))
          for dep in [
              'sap_account_v2_integrity = { path = "../../sap-account-v2/integrity" }\n',
              'collateral_issuance_v2_integrity = { path = "../../collateral-issuance-v2/integrity" }\n',
          ]:
              remove_dep('mycelix-finance/zomes/sap-transfer-v2/coordinator/Cargo.toml', dep)
          add_dep(
              'mycelix-finance/zomes/sap-transfer-v2/coordinator/Cargo.toml',
              'finance-sap-value-notes = { path = "../../../crates/finance-sap-value-notes" }\n',
              'finance-holochain-contracts = { path = "../../../crates/finance-holochain-contracts" }\n',
          )
          PY

      - name: Apply pinned HDI exact-entry API repair to coordinators
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('mycelix-finance/zomes/collateral-settlement-auth/coordinator/src/lib.rs'),
              Path('mycelix-finance/zomes/collateral-issuance-v2/coordinator/src/lib.rs'),
              Path('mycelix-finance/zomes/sap-account-v2/coordinator/src/lib.rs'),
              Path('mycelix-finance/zomes/sap-transfer-v2/coordinator/src/lib.rs'),
          ]
          for path in paths:
              text = path.read_text()
              if 'record.action().app_entry_def()' not in text:
                  continue
              text = text.replace('record.action().app_entry_def()', 'record.action().entry_type()')
              text = text.replace(
                  'Some(actual) if actual == &expected => Ok(()),',
                  'Some(EntryType::App(actual)) if actual == &expected => Ok(()),',
              )
              text = text.replace(
                  'Some(actual) => Err(wasm_error!(WasmErrorInner::Guest(format!(',
                  'Some(EntryType::App(actual)) => Err(wasm_error!(WasmErrorInner::Guest(format!(',
              )
              text = text.replace(
                  'None => Err(wasm_error!(WasmErrorInner::Guest(format!(\n            "{label} action is not an application entry"\n        )))),',
                  'Some(actual) => Err(wasm_error!(WasmErrorInner::Guest(format!(\n            "{label} action is not an application entry: got {actual:?}"\n        )))),\n        None => Err(wasm_error!(WasmErrorInner::Guest(format!(\n            "{label} action has no entry type"\n        )))),',
              )
              text = text.replace(
                  'None => Err(wasm_error!(WasmErrorInner::Guest(format!(\n            "{label} is not an application entry"\n        )))),',
                  'Some(actual) => Err(wasm_error!(WasmErrorInner::Guest(format!(\n            "{label} is not an application entry: got {actual:?}"\n        )))),\n        None => Err(wasm_error!(WasmErrorInner::Guest(format!(\n            "{label} has no entry type"\n        )))),',
              )
              path.write_text(text)
          PY

      - name: Format and prove closed-world ABI boundary
        shell: bash
        run: |
          set -euo pipefail
          cd mycelix-finance
          cargo fmt --all
          cargo fmt --all --check
          cd ..
          git diff --check

          python - <<'PY'
          from pathlib import Path
          allowed = {
              'mycelix-finance/zomes/collateral-deposit-v2/coordinator/Cargo.toml': {'collateral_deposit_v2_integrity'},
              'mycelix-finance/zomes/collateral-settlement-auth/coordinator/Cargo.toml': {'collateral_settlement_auth_integrity'},
              'mycelix-finance/zomes/collateral-issuance-v2/coordinator/Cargo.toml': {'collateral_issuance_v2_integrity'},
              'mycelix-finance/zomes/sap-account-v2/coordinator/Cargo.toml': {'sap_account_v2_integrity'},
              'mycelix-finance/zomes/sap-transfer-v2/coordinator/Cargo.toml': {'sap_transfer_v2_integrity'},
          }
          manifests = [
              'mycelix-finance/zomes/collateral-deposit-v2/integrity/Cargo.toml',
              'mycelix-finance/zomes/collateral-settlement-auth/integrity/Cargo.toml',
              'mycelix-finance/zomes/collateral-issuance-v2/integrity/Cargo.toml',
              'mycelix-finance/zomes/sap-account-v2/integrity/Cargo.toml',
              'mycelix-finance/zomes/sap-transfer-v2/integrity/Cargo.toml',
              *allowed.keys(),
          ]
          for manifest in manifests:
              deps = set()
              for line in Path(manifest).read_text().splitlines():
                  if '_integrity = { path =' in line:
                      deps.add(line.split('=', 1)[0].strip())
              if deps != allowed.get(manifest, set()):
                  raise SystemExit(f'{manifest}: forbidden/incorrect integrity dependencies {deps!r}')

          contract_src = Path('mycelix-finance/crates/finance-holochain-contracts/src/lib.rs').read_text()
          for forbidden in ['#[hdk_entry_types]', '#[hdk_link_types]', '#[hdk_extern]']:
              if forbidden in contract_src:
                  raise SystemExit(f'contract crate contains forbidden authority macro {forbidden}')
          PY

          git status --porcelain=v1 > /tmp/fin-safe-024-status.txt
          test -s /tmp/fin-safe-024-status.txt
          mkdir -p /tmp/fin-safe-024-source
          paths=(
            mycelix-finance/Cargo.toml
            mycelix-finance/crates/finance-holochain-contracts
            mycelix-finance/zomes/collateral-deposit-v2/integrity/Cargo.toml
            mycelix-finance/zomes/collateral-deposit-v2/integrity/src/lib.rs
            mycelix-finance/zomes/collateral-deposit-v2/coordinator/Cargo.toml
            mycelix-finance/zomes/collateral-deposit-v2/coordinator/src/lib.rs
            mycelix-finance/zomes/collateral-settlement-auth/integrity/Cargo.toml
            mycelix-finance/zomes/collateral-settlement-auth/integrity/src/lib.rs
            mycelix-finance/zomes/collateral-settlement-auth/coordinator/Cargo.toml
            mycelix-finance/zomes/collateral-settlement-auth/coordinator/src/lib.rs
            mycelix-finance/zomes/collateral-issuance-v2/integrity/Cargo.toml
            mycelix-finance/zomes/collateral-issuance-v2/integrity/src/lib.rs
            mycelix-finance/zomes/collateral-issuance-v2/coordinator/Cargo.toml
            mycelix-finance/zomes/collateral-issuance-v2/coordinator/src/lib.rs
            mycelix-finance/zomes/sap-account-v2/integrity/Cargo.toml
            mycelix-finance/zomes/sap-account-v2/integrity/src/lib.rs
            mycelix-finance/zomes/sap-account-v2/coordinator/Cargo.toml
            mycelix-finance/zomes/sap-account-v2/coordinator/src/lib.rs
            mycelix-finance/zomes/sap-transfer-v2/integrity/Cargo.toml
            mycelix-finance/zomes/sap-transfer-v2/integrity/src/lib.rs
            mycelix-finance/zomes/sap-transfer-v2/coordinator/Cargo.toml
            mycelix-finance/zomes/sap-transfer-v2/coordinator/src/lib.rs
          )
          tar -czf /tmp/fin-safe-024-source.tar.gz "${paths[@]}"
          find "${paths[@]}" -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/fin-safe-024-source.sha256
          sha256sum /tmp/fin-safe-024-source.tar.gz > /tmp/fin-safe-024-source.tar.gz.sha256

      - name: Generate cumulative lock candidate
        shell: bash
        run: |
          set -euo pipefail
          cp mycelix-finance/Cargo.lock /tmp/Cargo.lock.before
          cd mycelix-finance
          cargo metadata --format-version 1 > /tmp/cargo-metadata-generated.json
          cp Cargo.lock /tmp/Cargo.lock.candidate
          sha256sum Cargo.lock > /tmp/Cargo.lock.candidate.sha256
          cargo metadata --locked --format-version 1 > /tmp/cargo-metadata-locked.json
          cargo tree --workspace --locked > /tmp/cargo-tree-locked.txt

      - name: Test complete V2 native boundary
        shell: bash
        run: |
          set -euo pipefail
          cd mycelix-finance
          cargo test \
            -p finance-holochain-contracts \
            -p collateral_deposit_v2_integrity -p collateral_deposit_v2 \
            -p collateral_settlement_auth_integrity -p collateral_settlement_auth \
            -p collateral_issuance_v2_integrity -p collateral_issuance_v2 \
            -p sap_account_v2_integrity -p sap_account_v2 \
            -p sap_transfer_v2_integrity -p sap_transfer_v2 \
            --locked 2>&1 | tee /tmp/fin-safe-024-targeted-tests.log

      - name: Check complete V2 wasm boundary
        shell: bash
        run: |
          set -euo pipefail
          cd mycelix-finance
          cargo check \
            -p collateral_deposit_v2_integrity -p collateral_deposit_v2 \
            -p collateral_settlement_auth_integrity -p collateral_settlement_auth \
            -p collateral_issuance_v2_integrity -p collateral_issuance_v2 \
            -p sap_account_v2_integrity -p sap_account_v2 \
            -p sap_transfer_v2_integrity -p sap_transfer_v2 \
            --target wasm32-unknown-unknown --lib --locked \
            2>&1 | tee /tmp/fin-safe-024-wasm.log

      - name: Test full Finance workspace under lock
        shell: bash
        run: |
          set -euo pipefail
          cd mycelix-finance
          cargo test --workspace --locked 2>&1 | tee /tmp/fin-safe-024-workspace-tests.log

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fin-safe-024-complete-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: |
            /tmp/fin-safe-024-status.txt
            /tmp/fin-safe-024-source.tar.gz
            /tmp/fin-safe-024-source.tar.gz.sha256
            /tmp/fin-safe-024-source.sha256
            /tmp/Cargo.lock.before
            /tmp/Cargo.lock.candidate
            /tmp/Cargo.lock.candidate.sha256
            /tmp/cargo-metadata-generated.json
            /tmp/cargo-metadata-locked.json
            /tmp/cargo-tree-locked.txt
            /tmp/fin-safe-024-targeted-tests.log
            /tmp/fin-safe-024-wasm.log
            /tmp/fin-safe-024-workspace-tests.log
          if-no-files-found: warn
          retention-days: 30
