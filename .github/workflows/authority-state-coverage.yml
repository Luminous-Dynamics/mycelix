name: Authority State Coverage

on:
  pull_request:
    paths:
      - 'crates/mycelix-authority-state-coverage/**'
      - 'crates/mycelix-authority-state-source/**'
      - 'crates/mycelix-authority-freshness/**'
      - 'crates/mycelix-institutional-core/**'
      - '.github/workflows/authority-state-coverage.yml'
  push:
    branches:
      - 'security/authority-state-coverage-v0.1'

permissions:
  contents: read

concurrency:
  group: authority-state-coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: Fresh source-head coverage qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path crates/mycelix-authority-state-coverage/Cargo.toml -- --check
      - name: Tests
        run: cargo test --manifest-path crates/mycelix-authority-state-coverage/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-authority-state-coverage/Cargo.toml --all-targets -- -D warnings
      - name: Coverage authority separation audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('crates/mycelix-authority-state-coverage/src/lib.rs').read_text()
          invariants = Path('crates/mycelix-authority-state-coverage/INVARIANTS.md').read_text()

          required = [
              'VerifiedAuthorityCoveragePolicy',
              'VerifiedAuthoritySourceHead',
              'VerifiedAuthorityHeadWitness',
              'QualifiedAuthorityStateCoverage',
              'VerifiedAuthorityStateCoverage',
              'qualify_authority_state_coverage',
              'WitnessObserverMismatch',
              'WitnessTrustDomainMismatch',
              'TrustDomainConcentration',
              'InsufficientTrustDomains',
              'challenge_digest',
              'MAX_HEAD_GENERATION',
          ]
          for token in required:
              assert token in src, token

          assert 'receipt.verified_observer_id != witness.observer_id' in src
          assert 'receipt.verified_trust_domain_id != witness.trust_domain_id' in src
          assert 'source.responded_at_ms < policy.valid_from_ms' in src
          assert 'witness.observed_at_ms < source.responded_at_ms' in src
          assert 'source.challenge_digest != challenge_digest' in src
          assert 'UnexpectedWitnessEvidence' in src
          assert 'max_per_trust_domain' in src

          assert 'No DHT completeness assumption' in invariants
          assert 'Local observation of “nothing newer” is not completeness.' in invariants
          assert 'Trust-policy binding remains an explicit follow-on' in invariants
          assert 'Distinct observer IDs alone are not evidence of independence.' in invariants
          assert 'fresh non-zero verifier challenge' in invariants

          lowered = src.lower()
          for forbidden in ['phi', 'consciousness', 'reputation', 'model_score', 'guardian']:
              assert forbidden not in lowered, forbidden
          print('PASS: source-head coverage requires exact policy/source/challenge and independently verified witness identity')
          PY
