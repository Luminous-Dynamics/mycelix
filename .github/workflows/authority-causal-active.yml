name: Authority Causal Active

on:
  pull_request:
    paths:
      - 'crates/mycelix-authority-causal-active/**'
      - 'crates/mycelix-authority-causal-projection/**'
      - 'crates/mycelix-authority-state-source/**'
      - 'crates/mycelix-authority-freshness/**'
      - 'crates/mycelix-institutional-core/**'
      - '.github/workflows/authority-causal-active.yml'
  push:
    branches:
      - 'security/authority-causal-active-v0.1'

permissions:
  contents: read

concurrency:
  group: authority-causal-active-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: Positive historical causal authority
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/mycelix-authority-causal-active

      - name: Format
        run: cargo fmt --manifest-path crates/mycelix-authority-causal-active/Cargo.toml -- --check

      - name: Tests
        run: cargo test --manifest-path crates/mycelix-authority-causal-active/Cargo.toml --all-targets

      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-authority-causal-active/Cargo.toml --all-targets -- -D warnings

      - name: Historical positive-authority separation audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import tomllib

          root = Path('crates/mycelix-authority-causal-active')
          manifest = tomllib.loads((root / 'Cargo.toml').read_text())
          deps = manifest.get('dependencies', {})
          expected = {
              'blake3',
              'mycelix-authority-causal-projection',
              'mycelix-authority-freshness',
              'mycelix-institutional-core',
          }
          assert set(deps) == expected, sorted(deps)
          assert deps['mycelix-authority-causal-projection'].get('path') == '../mycelix-authority-causal-projection'

          src = (root / 'src/lib.rs').read_text()
          production = src[:src.index('#[cfg(test)]')]
          required = [
              'QualifiedCausalAuthorityStateProjection',
              'QualifiedActiveCausalAuthority',
              'qualify_active_causal_authority_at',
              'AuthorityFreshnessState::Active',
              'HistoricalStateNotActive',
              'InvalidVerificationWindow',
              'projection.verified_at_ms() > verification_now_ms',
              'projection.lease_until_ms() <= verification_now_ms',
              'projection.projection_digest()',
              'projection.full_lineage_digest()',
              'projection.current_head_transition_digest()',
              'ACTIVE_CAUSAL_AUTHORITY_IDENTITY_PROFILE',
          ]
          for token in required:
              assert token in production, token

          for forbidden in [
              'project_authority_state_at_causal_position(',
              'project_current_authority_state(',
              'project_authority_state_as_of(',
              'VerifiedAuthorityFreshness',
              'QualifiedCurrentOperationalAuthority',
              'to_current',
              'use hdk',
              'hdk::',
              'verify_strict',
              '.verify(',
              'SystemTime',
              'std::time',
              'as_of_ms',
              'max_by_key',
              'sort_by_key',
              'phi',
              'reputation',
              'model_score',
          ]:
              assert forbidden not in production, forbidden

          invariants = (root / 'INVARIANTS.md').read_text()
          assert 'Historical existence is not positive authority' in invariants
          assert 'Full current source coverage remains inherited' in invariants
          assert 'Bounded completeness evidence remains bounded' in invariants
          assert 'No live-current conversion' in invariants
          print('PASS: exact causal historical state must be Active and current coverage evidence reusable before positive historical authority exists')
          PY
