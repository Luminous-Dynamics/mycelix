name: Prism Bridge Qualification

on:
  pull_request:
    paths:
      - "mycelix-workspace/mycelix-prism/prism-bridge/**"
      - "mycelix-workspace/mycelix-prism/prism-common/**"
      - "mycelix-workspace/Cargo.toml"
      - "mycelix-workspace/Cargo.lock"
      - "mycelix-workspace/mycelix-prism/**"
      - ".github/workflows/prism-bridge-qualification.yml"
  push:
    branches:
      - main
      - "security/prism-*"
    paths:
      - "mycelix-workspace/mycelix-prism/prism-bridge/**"
      - "mycelix-workspace/mycelix-prism/prism-common/**"
      - "mycelix-workspace/mycelix-prism/Cargo.toml"
      - "mycelix-workspace/mycelix-prism/Cargo.lock"
      - ".github/workflows/prism-bridge-qualification.yml"

permissions:
  contents: read

jobs:
  cargo-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mycelix-workspace
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p prism-bridge --locked
