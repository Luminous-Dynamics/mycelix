name: Prism Bridge Qualification

on:
  pull_request:
    paths:
      - "mycelix-workspace/mycelix-prism/prism-bridge/**"
      - "mycelix-workspace/mycelix-prism/prism-common/**"
      - "mycelix-workspace/Cargo.toml"
      - "mycelix-workspace/Cargo.lock"
      - "mycelix-workspace/mycelix-prism/**"
      - ".github/workflows/prism-bridge-qualification.yml"
  push:
    branches:
      - main
    paths:
      - "mycelix-workspace/mycelix-prism/prism-bridge/**"
      - "mycelix-workspace/mycelix-prism/prism-common/**"
      - "mycelix-workspace/mycelix-prism/Cargo.toml"
      - "mycelix-workspace/mycelix-prism/Cargo.lock"
      - ".github/workflows/prism-bridge-qualification.yml"

concurrency:
  group: prism-bridge-qualification-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mycelix-workspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.96.0

      # Fail fast on canonical workspace-resolution defects before spending
      # the full Prism test-suite runtime. Unlike --no-deps metadata, this
      # resolves the complete workspace dependency graph and therefore catches
      # missing path dependencies before the test phase. This is intentionally diagnostic:
      # it does not substitute an isolated workspace for canonical evidence.
      - name: Check canonical workspace resolution
        shell: bash
        run: |
          set -euo pipefail
          metadata_log="${RUNNER_TEMP}/prism-bridge-canonical-metadata.log"
          metadata_status_file="${RUNNER_TEMP}/prism-bridge-canonical-metadata.status"

          set +e
          cargo +1.96.0 metadata --locked --format-version 1 >"${metadata_log}" 2>&1
          metadata_status=$?
          set -e

          printf '%s\n' "${metadata_status}" >"${metadata_status_file}"

          if [[ "${metadata_status}" -ne 0 ]]; then
            echo "ERROR: canonical mycelix-workspace dependency resolution failed under Rust 1.96.0" >&2
            echo "Diagnostic transcript: ${metadata_log}" >&2
            echo "This lane remains a strict full-workspace qualification gate." >&2
            exit "${metadata_status}"
          fi

      - run: cargo +1.96.0 test -p prism-bridge --locked

      - name: Emit qualification identity
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/prism-bridge-qualification-evidence.txt"
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          checked_out_head="$(git rev-parse HEAD)"
          job_status="${{ job.status }}"
          qualified="false"
          if [[ "${job_status}" == "success" && "${checked_out_head}" == "${expected_head}" ]]; then
            qualified="true"
          fi

          {
            echo "schema=PRISM-BRIDGE-QUALIFICATION-EVIDENCE-V2"
            echo "qualification=PRISM-BRIDGE-CANONICAL"
            echo "qualified=${qualified}"
            echo "job_status=${job_status}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "tested_head=${expected_head}"
            echo "checked_out_head=${checked_out_head}"
            echo "event_sha=${GITHUB_SHA}"
            echo "rust=1.96.0"
            metadata_status="not-run"
            if [[ -f "${RUNNER_TEMP}/prism-bridge-canonical-metadata.status" ]]; then
              metadata_status="$(cat "${RUNNER_TEMP}/prism-bridge-canonical-metadata.status")"
            fi
            lock_sha="missing"
            if [[ -f Cargo.lock ]]; then
              lock_sha="$(sha256sum Cargo.lock | awk '{print $1}')"
            fi
            echo "canonical_metadata_exit_code=${metadata_status}"
            echo "canonical_cargo_lock_sha256=${lock_sha}"
            echo "canonical_metadata_command=cargo +1.96.0 metadata --locked --format-version 1"
          } | tee "${evidence}"

          if [[ "${checked_out_head}" != "${expected_head}" ]]; then
            echo "ERROR: checkout provenance mismatch" | tee -a "${evidence}" >&2
            exit 1
          fi

      - name: Upload qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: prism-bridge-qualification-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/prism-bridge-qualification-evidence.txt
            ${{ runner.temp }}/prism-bridge-canonical-metadata.log
          if-no-files-found: error
          retention-days: 90
