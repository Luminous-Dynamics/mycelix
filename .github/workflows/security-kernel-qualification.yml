name: Security Kernel Qualification

on:
  pull_request:

permissions:
  contents: read

cache-mode: none

concurrency:
  group: security-kernel-qualification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source:
    name: Source qualification carrier
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
