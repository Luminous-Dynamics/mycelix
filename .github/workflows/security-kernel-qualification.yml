name: Security Kernel Qualification

on:
  pull_request:
    paths:
      - 'crates/mycelix-bridge-common/**'
      - 'docs/security-*.md'
      - '.github/workflows/security-kernel-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-kernel-qualification-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: Bridge security kernel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact source checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "security-workflow regression: checked out $actual_sha, expected source $EXPECTED_SHA" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --manifest-path crates/mycelix-bridge-common/Cargo.toml -- --check

      - name: Assert security trust surfaces remain private
        shell: bash
        run: |
          set -euo pipefail
          # Any explicit visibility modifier on a trust-construction item broadens the
          # module-private boundary, whether it is pub(crate), pub(super), or pub(in ...).
          # Use multiline matching so a future refactor cannot evade this guard by placing
          # the visibility modifier and item name on separate lines.
          # The qualification lane is intentionally a low-trust pull_request workflow;
          # do not broaden it to a privileged pull_request_target trigger.
          if rg -n '^[[:space:]]*pull_request_target[[:space:]]*:' .github/workflows/security-kernel-qualification.yml; then
            echo "security-workflow regression: privileged pull_request_target trigger is forbidden" >&2
            exit 1
          fi

          if ! rg -n -F 'ref: ${{ github.event.pull_request.head.sha || github.sha }}' .github/workflows/security-kernel-qualification.yml; then
            echo "security-workflow regression: qualification must checkout the source head SHA, not the synthetic pull-request merge ref" >&2
            exit 1
          fi

          # All action references must remain immutable full-length commit pins.
          while IFS= read -r uses_line; do
            if [[ ! $uses_line =~ @[0-9a-fA-F]{40}([[:space:]]*#.*)?$ ]]; then
              echo "security-workflow regression: action is not pinned to a full commit SHA: $uses_line" >&2
              exit 1
            fi
          done < <(rg '^[[:space:]]*-[[:space:]]+uses:' .github/workflows/security-kernel-qualification.yml)

          for pattern in \
            'pub([[:space:]]*\([^)]*\))?[[:space:]]+(enum|struct|const)[[:space:]]+(SignatureVerification|RevocationStatus|AuthorityResolution|AUTHORITY_FRESHNESS_[A-Z_]+)' \
            'pub([[:space:]]*\([^)]*\))?[[:space:]]+fn[[:space:]]+(authority_binding_from_freshness_digest|new_for_capability(_with_[a-z_]+)?|binding_digest|revalidate_permit)'; do
            if rg -nU "$pattern" crates/mycelix-bridge-common/src/security_kernel.rs; then
              echo "security-kernel trust-surface regression: $pattern" >&2
              exit 1
            fi
          done

          if rg -nU 'pub[[:space:]]+enum[[:space:]]+AuthorizationDecision[[:space:]]*\\{[^}]*\\bAllow\\b' crates/mycelix-bridge-common/src/security_kernel.rs; then
            echo "security-kernel regression: AuthorizationDecision must remain failure-only; Allow belongs to SecurityEventDecision" >&2
            exit 1
          fi

          # Trust-sensitive SecurityEvent fields must remain module-private under
          # every Rust visibility form, not merely bare pub.
          for pattern in \
            'pub([[:space:]]*\([^)]*\))?[[:space:]]+(decision|capability_binding|authority_binding|event_id|actor_id|capability_ref|request|policy_version|timestamp_us|provenance|recovery_correlation)[[:space:]]*:'; do
            if rg -nU "$pattern" crates/mycelix-bridge-common/src/security_events.rs; then
              echo "security-event trust-surface regression: $pattern" >&2
              exit 1
            fi
          done

          # Security-domain JSON adapters must impose an outer parser/input-envelope bound
          # before Serde sees attacker-controlled bytes; field bounds alone are retention-only.
          if ! rg -n -F 'pub const MAX_SECURITY_WIRE_BYTES: usize = 512 * 1024;' crates/mycelix-bridge-common/src/security_kernel.rs; then
            echo "security-kernel regression: outer security wire envelope limit disappeared or changed" >&2
            exit 1
          fi
          if ! rg -n -F 'pub fn deserialize_bounded_security_json' crates/mycelix-bridge-common/src/security_kernel.rs; then
            echo "security-kernel regression: bounded security JSON adapter helper disappeared" >&2
            exit 1
          fi
          limit_line="$(rg -n 'input\.len\(\) > MAX_SECURITY_WIRE_BYTES' crates/mycelix-bridge-common/src/security_kernel.rs | cut -d: -f1 | head -n1)"
          parse_line="$(rg -n 'serde_json::from_slice\(input\)' crates/mycelix-bridge-common/src/security_kernel.rs | cut -d: -f1 | head -n1)"
          if [[ -z "$limit_line" || -z "$parse_line" || "$limit_line" -ge "$parse_line" ]]; then
            echo "security-kernel regression: parser must not run before outer input-size check" >&2
            exit 1
          fi

          if ! rg -n -F 'pub fn deserialize_bounded_security_json_reader' crates/mycelix-bridge-common/src/security_kernel.rs; then
            echo "security-kernel regression: bounded security JSON reader helper disappeared" >&2
            exit 1
          fi
          reader_calls="$(rg -n 'serde_json::from_reader(BoundedSecurityReader::new(reader))' crates/mycelix-bridge-common/src/security_kernel.rs | wc -l)"
          if [[ "$reader_calls" -ne 1 ]]; then
            echo "security-kernel regression: expected exactly one bounded from_reader call, found $reader_calls" >&2
            exit 1
          fi
          total_reader_calls="$(rg -n 'serde_json::from_reader[[:space:]]*\(' \
            crates/mycelix-bridge-common/src/security_kernel.rs \
            crates/mycelix-bridge-common/src/security_events.rs | wc -l)"
          if [[ "$total_reader_calls" -ne 1 ]]; then
            echo "security-wire regression: unbounded/direct serde_json::from_reader call detected in security adapters" >&2
            exit 1
          fi
          total_slice_calls="$(rg -n 'serde_json::from_slice[[:space:]]*\(' \
            crates/mycelix-bridge-common/src/security_kernel.rs \
            crates/mycelix-bridge-common/src/security_events.rs | wc -l)"
          if [[ "$total_slice_calls" -ne 1 ]]; then
            echo "security-wire regression: unexpected serde_json::from_slice call detected in security adapters" >&2
            exit 1
          fi
          if ! rg -n 'fn bounded_security_json_reader_rejects_oversized_stream' crates/mycelix-bridge-common/src/security_kernel.rs; then
            echo "security-kernel regression: oversized reader coverage disappeared" >&2
            exit 1
          fi

          for test_name in \
            bounded_security_reader_accepts_exact_budget_and_then_eof \
            bounded_security_reader_rejects_first_byte_over_budget \
            bounded_security_reader_zero_length_read_does_not_consume_input; do
            if ! rg -n "fn ${test_name}" crates/mycelix-bridge-common/src/security_kernel.rs; then
              echo "security-kernel regression: direct bounded-reader contract test disappeared: $test_name" >&2
              exit 1
            fi
          done


          if ! rg -n -F 'pub fn checked_authority_lease_until_us' crates/mycelix-bridge-common/src/security_kernel.rs; then
            echo "security-kernel regression: checked authority lease conversion helper disappeared" >&2
            exit 1
          fi
          if ! rg -n -F 'lease_until_ms.checked_mul(1_000)' crates/mycelix-bridge-common/src/security_kernel.rs; then
            echo "security-kernel regression: authority lease conversion is no longer overflow-checked" >&2
            exit 1
          fi

          # Capability and AuthorizationRequest must remain constructor-gated when decoded from wire data.
          # Capability and AuthorizationRequest wire schemas must reject unknown fields.
          for pattern in             '#\[derive\([^]]*Deserialize[^]]*\)\][[:space:]]*#\[serde\(deny_unknown_fields\)\][[:space:]]*struct (CapabilityWire|AuthorizationRequestWire)'; do
            if ! rg -nU "$pattern" crates/mycelix-bridge-common/src/security_kernel.rs; then
              echo "security-kernel regression: authorization wire schema lost deny_unknown_fields" >&2
              exit 1
            fi
          done

          if ! rg -nU '#\[derive\([^]]*Deserialize[^]]*\)\][[:space:]]*#\[serde\(try_from[[:space:]]*=[[:space:]]*"CapabilityWire"\)\][[:space:]]*pub struct Capability' crates/mycelix-bridge-common/src/security_kernel.rs; then
            echo "security-kernel regression: Capability lost its Deserialize + serde constructor gate" >&2
            exit 1
          fi
          if ! rg -nU '#\[derive\([^]]*Deserialize[^]]*\)\][[:space:]]*#\[serde\(try_from[[:space:]]*=[[:space:]]*"AuthorizationRequestWire"\)\][[:space:]]*pub struct AuthorizationRequest' crates/mycelix-bridge-common/src/security_kernel.rs; then
            echo "security-kernel regression: AuthorizationRequest lost its Deserialize + serde constructor gate" >&2
            exit 1
          fi

          # ProvenanceRef is constructor-gated in both directions: external callers must
          # use ProvenanceRef::new(), and wire decoding must pass through that constructor.
          for pattern in \
            'pub([[:space:]]*\\([^)]*\\))?[[:space:]]+(artifact_id|relation)[[:space:]]*:'; do
            if rg -nU "$pattern" crates/mycelix-bridge-common/src/security_events.rs; then
              echo "security-event trust-surface regression: public ProvenanceRef field: $pattern" >&2
              exit 1
            fi
          done

          # Provenance identifiers must not bypass ProvenanceRef::new() during wire decoding.
          if ! rg -nU '#\\[derive\\([^]]*Serialize[^]]*\\)\\][[:space:]]*#\\[serde\\(try_from[[:space:]]*=[[:space:]]*"ProvenanceRefWire"\\)\\][[:space:]]*pub struct ProvenanceRef' crates/mycelix-bridge-common/src/security_events.rs; then
            echo "security-event regression: ProvenanceRef lost its constructor-gated deserialization" >&2
            exit 1
          fi
          if ! rg -nU '#\\[derive\\([^]]*Deserialize[^]]*\\)\\][[:space:]]*#\\[serde\\(deny_unknown_fields\\)\\][[:space:]]*struct ProvenanceRefWire' crates/mycelix-bridge-common/src/security_events.rs; then
            echo "security-event regression: ProvenanceRef wire schema lost deny_unknown_fields" >&2
            exit 1
          fi
          if ! rg -nU '#\\[derive\\([^]]*Deserialize[^]]*\\)\\][[:space:]]*#\\[serde\\(deny_unknown_fields\\)\\][[:space:]]*struct SecurityEventWire' crates/mycelix-bridge-common/src/security_events.rs; then
            echo "security-event regression: SecurityEvent wire schema lost deny_unknown_fields" >&2
            exit 1
          fi

          # Untrusted wire sequences and security identifiers must be bounded before the kernel retains them.
          python3 - <<'PY'
          from pathlib import Path
          import re

          kernel = Path("crates/mycelix-bridge-common/src/security_kernel.rs").read_text()
          events = Path("crates/mycelix-bridge-common/src/security_events.rs").read_text()

          capability_wire = re.search(
              r"struct CapabilityWire\s*\{(?P<body>.*?)\n\}",
              kernel,
              re.DOTALL,
          )
          if not capability_wire or not re.search(
              r'#\[serde\(deserialize_with\s*=\s*"deserialize_capability_actions"\)\]\s*'
              r'actions:\s*Vec<CapabilityAction>',
              capability_wire.group("body"),
          ):
              raise SystemExit("security-kernel regression: bounded action deserializer is not attached to CapabilityWire")

          def require_wire_decoder(text, struct_name, fields, decoder):
              match = re.search(
                  rf"struct {struct_name}\s*\{{(?P<body>.*?)\n\}}",
                  text,
                  re.DOTALL,
              )
              if not match:
                  raise SystemExit(f"security-wire regression: {struct_name} disappeared")
              body = match.group("body")
              for field in fields:
                  expected = f'#[serde(deserialize_with = "{decoder}")]\n    {field}:'
                  if expected not in body:
                      raise SystemExit(
                          f"security-wire regression: {struct_name}.{field} lost {decoder}"
                      )

          require_wire_decoder(
              kernel,
              "CapabilityWire",
              ["subject", "issuer", "resource"],
              "deserialize_security_identifier",
          )
          require_wire_decoder(
              kernel,
              "AuthorizationRequestWire",
              ["subject", "resource"],
              "deserialize_security_identifier",
          )
          require_wire_decoder(
              events,
              "ProvenanceRefWire",
              ["artifact_id"],
              "deserialize_provenance_identifier",
          )
          require_wire_decoder(
              events,
              "SecurityEventWire",
              ["event_id", "actor_id", "capability_ref"],
              "deserialize_provenance_identifier",
          )
          security_event_wire = re.search(
              r"struct SecurityEventWire\s*\{(?P<body>.*?)\n\}",
              events,
              re.DOTALL,
          )
          if not security_event_wire:
              raise SystemExit("security-event regression: SecurityEventWire disappeared")
          security_event_wire_body = security_event_wire.group("body")
