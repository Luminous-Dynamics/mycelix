name: Security Kernel Qualification

on:
  push:
    branches:
      - feat/security-sovereignty-model
  pull_request:
    paths:
      - 'crates/mycelix-bridge-common/**'
      - 'docs/security-*.md'
      - '.github/workflows/security-kernel-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-kernel-qualification-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: Bridge security kernel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/mycelix-bridge-common

      - name: Format
        run: cargo fmt --manifest-path crates/mycelix-bridge-common/Cargo.toml -- --check

      - name: Assert security trust surfaces remain private
        shell: bash
        run: |
          set -euo pipefail
          # Any explicit visibility modifier on a trust-construction item broadens the
          # module-private boundary, whether it is pub(crate), pub(super), or pub(in ...).
          for pattern in \
            'pub([[:space:]]*\([^)]*\))?[[:space:]]+.*SignatureVerification' \
            'pub([[:space:]]*\([^)]*\))?[[:space:]]+.*RevocationStatus' \
            'pub([[:space:]]*\([^)]*\))?[[:space:]]+.*AuthorityResolution' \
            'pub([[:space:]]*\([^)]*\))?[[:space:]]+.*AUTHORITY_FRESHNESS_' \
            'pub([[:space:]]*\([^)]*\))?[[:space:]]+.*authority_binding_from_freshness_digest' \
            'pub([[:space:]]*\([^)]*\))?[[:space:]]+.*new_for_capability' \
            'pub([[:space:]]*\([^)]*\))?[[:space:]]+.*binding_digest' \
            'pub([[:space:]]*\([^)]*\))?[[:space:]]+.*revalidate_permit'; do
            if rg -n "$pattern" crates/mycelix-bridge-common/src/security_kernel.rs; then
              echo "security-kernel trust-surface regression: $pattern" >&2
              exit 1
            fi
          done

          # Trust-sensitive SecurityEvent fields must remain module-private under
          # every Rust visibility form, not merely bare pub.
          for pattern in \
            'pub([[:space:]]*\([^)]*\))?[[:space:]]+decision:' \
            'pub([[:space:]]*\([^)]*\))?[[:space:]]+capability_binding:' \
            'pub([[:space:]]*\([^)]*\))?[[:space:]]+authority_binding:' \
            'pub([[:space:]]*\([^)]*\))?[[:space:]]+(event_id|actor_id|capability_ref|request|policy_version|timestamp_us|provenance|recovery_correlation):'; do
            if rg -n "$pattern" crates/mycelix-bridge-common/src/security_events.rs; then
              echo "security-event trust-surface regression: $pattern" >&2
              exit 1
            fi
          done

          for pattern in \
            '#\[derive\([^]]*(Serialize|Deserialize)[^]]*\)\][[:space:]]*(pub[[:space:]]+)?struct (VerificationEvidence|AuthorizationPermit|EnforcementRequest)' \
            'impl[[:space:]]+(Serialize|Deserialize)[[:space:]]+for[[:space:]]+(VerificationEvidence|AuthorizationPermit|EnforcementRequest)' \
            '#\[derive\(Debug, Clone, PartialEq, Eq\)\][[:space:]]*pub struct AuthorizationPermit' \
            '#\[derive\(Debug, Clone, PartialEq, Eq\)\][[:space:]]*pub struct EnforcementRequest' \
            'pub fn (request|issued_at_us|valid_until_us|is_valid_at)'; do
            if rg -nU "$pattern" crates/mycelix-bridge-common/src/security_kernel.rs; then
              echo "security-kernel serialization/linear-token regression: $pattern" >&2
              exit 1
            fi
          done

      - name: Test default feature set
        run: cargo test --locked --manifest-path crates/mycelix-bridge-common/Cargo.toml

      - name: Test identity feature set
        run: cargo test --locked --manifest-path crates/mycelix-bridge-common/Cargo.toml --features identity

      - name: Clippy default feature set
        run: cargo clippy --locked --manifest-path crates/mycelix-bridge-common/Cargo.toml --all-targets -- -D warnings

      - name: Clippy identity feature set
        run: cargo clippy --locked --manifest-path crates/mycelix-bridge-common/Cargo.toml --all-targets --features identity -- -D warnings
