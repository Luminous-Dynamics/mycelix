name: MYC-CAP-002C1 Claim Registry Currentness v1

on:
  pull_request:
    paths:
      - 'scripts/capital/claim_registry_currentness_v1.py'
      - 'scripts/capital/test_claim_registry_currentness_v1.py'
      - 'docs/capital/evidence/myc-cap-002c1/**'
      - '.github/workflows/myc-cap-002c1-claim-registry-currentness-v1.yml'

permissions:
  contents: read

jobs:
  qualify:
    name: Designated-current claim registry tip
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Exact subject, qualified parent, and scope
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "9f940f915e6aa2bf253f859045d104e80406dd4c"
          expected="$(mktemp)"
          actual="$(mktemp)"
          printf '%s\n' \
            '.github/workflows/myc-cap-002c1-claim-registry-currentness-v1.yml' \
            'docs/capital/evidence/myc-cap-002c1/PROFILE.md' \
            'docs/capital/evidence/myc-cap-002c1/example_case.json' \
            'docs/capital/evidence/myc-cap-002c1/example_receipt.json' \
            'scripts/capital/claim_registry_currentness_v1.py' \
            'scripts/capital/test_claim_registry_currentness_v1.py' | sort > "$expected"
          git diff-tree --no-commit-id --name-only -r HEAD | sort > "$actual"
          diff -u "$expected" "$actual"
          test -z "$(git status --porcelain)"

      - name: Exact claim-registry semantic parent
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          def canonical(v):
              return json.dumps(v, sort_keys=True, separators=(",", ":"), ensure_ascii=False, allow_nan=False).encode("utf-8")
          case=json.loads(Path("docs/capital/evidence/myc-cap-002c1/example_case.json").read_text(encoding="utf-8"))
          parent=json.loads(Path("docs/capital/evidence/myc-cap-002c/example_receipt.json").read_text(encoding="utf-8"))
          assert case["claim_registry_receipt"] == parent
          assert case["profile"]["claim_registry_subject_sha"] == "9f940f915e6aa2bf253f859045d104e80406dd4c"
          digest=hashlib.sha256(canonical(parent)).hexdigest()
          assert digest == "ec4431b5e4ee5ab8c91a4b2a24285d617c9c37d81d65473c997a2633a0b8b628"
          assert case["profile"]["claim_registry_receipt_sha256"] == digest
          assert parent["profile_sha256"] == "6011726fcb6af452a3c8d8d8027c000e9d324a2776a7739e4f22eb76de3ceb40"
          assert parent["operation_history_sha256"] == "db65331686b023f8683cff201a608354c3a492d8baf483f5fa8c2b7099b92a92"
          assert parent["operation_chain_tip_sha256"] == "9a9a2c7a462f9a1b449891a63b7516f7e13460caaf1fda69d707a00938ebaa05"
          PY

      - name: Python environment
        run: |
          set -euo pipefail
          python3 --version
          python3 -m py_compile scripts/capital/claim_registry_currentness_v1.py
          python3 -m py_compile scripts/capital/test_claim_registry_currentness_v1.py

      - name: Fail-closed unit suite
        run: |
          set -euo pipefail
          python3 -m unittest -v scripts/capital/test_claim_registry_currentness_v1.py

      - name: Deterministic example receipt
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          python3 scripts/capital/claim_registry_currentness_v1.py docs/capital/evidence/myc-cap-002c1/example_case.json --receipt-out "$tmp"
          diff -u docs/capital/evidence/myc-cap-002c1/example_receipt.json "$tmp"
          cp "$tmp" "${tmp}.second"
          python3 scripts/capital/claim_registry_currentness_v1.py docs/capital/evidence/myc-cap-002c1/example_case.json --receipt-out "$tmp"
          cmp "$tmp" "${tmp}.second"
          echo 'a644246d060ba4189c27f7d9d98ddab78e53e774c8a8e407fda2ba625fa5866e  docs/capital/evidence/myc-cap-002c1/example_case.json' | sha256sum -c -
          echo 'c3fb63cfbf22475a0b7e5be7df65f19f35988784541c44a9b792d4290bb94762  docs/capital/evidence/myc-cap-002c1/example_receipt.json' | sha256sum -c -

      - name: Strong authority nonclaims
        run: |
          set -euo pipefail
          grep -Fq '"claim_registry_currentness_state": "CURRENT"' docs/capital/evidence/myc-cap-002c1/example_receipt.json
          grep -Fq '"holder_snapshot_sha256": "48de5ec9d27ac4b74b2ef37a6e2584e52bb6a254f46f7f8638adf8f28a05a316"' docs/capital/evidence/myc-cap-002c1/example_receipt.json
          grep -Fq '"payment_authority_established": false' docs/capital/evidence/myc-cap-002c1/example_receipt.json
          grep -Fq '"asset_title_authority_established": false' docs/capital/evidence/myc-cap-002c1/example_receipt.json
          grep -Fq '"constitutional_authority_established": false' docs/capital/evidence/myc-cap-002c1/example_receipt.json
          grep -Fq '"operator_authority_established": false' docs/capital/evidence/myc-cap-002c1/example_receipt.json
          grep -Fq '"uses_local_wall_clock": false' docs/capital/evidence/myc-cap-002c1/example_receipt.json
