name: Governance Public Election Anonymous Authority v1

on:
  pull_request:
    paths:
      - '.github/workflows/governance-public-election-anonymous-authority-v1.yml'
      - 'mycelix-governance/crates/election-anonymous-authority/**'
      - 'mycelix-governance/docs/PUBLIC_ELECTION_ANONYMOUS_AUTHORITY_V1.md'

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: '1.96.0'
  BASE_SHA: '0eeed6176558f87c67ca144932b08eaaf42c7b79'

jobs:
  qualify:
    name: Qualify anonymous public-election authority
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/governance-public-election-anonymous-authority-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Bind exact ELECT-007/008 delta
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          test "${#changed[@]}" -eq 4
          printf '%s\n' "${changed[@]}" | sort > /tmp/elect-007-008-files.txt
          cat > /tmp/elect-007-008-expected.txt <<'EOF'
          .github/workflows/governance-public-election-anonymous-authority-v1.yml
          mycelix-governance/crates/election-anonymous-authority/Cargo.toml
          mycelix-governance/crates/election-anonymous-authority/src/lib.rs
          mycelix-governance/docs/PUBLIC_ELECTION_ANONYMOUS_AUTHORITY_V1.md
          EOF
          sort -o /tmp/elect-007-008-expected.txt /tmp/elect-007-008-expected.txt
          diff -u /tmp/elect-007-008-expected.txt /tmp/elect-007-008-files.txt
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt,clippy

      - name: Format production library surface
        shell: bash
        run: |
          set -euo pipefail
          src='mycelix-governance/crates/election-anonymous-authority/src/lib.rs'
          awk '/^#\[cfg\(test\)\]/{exit} {print}' "$src" > /tmp/elect-007-008-prod.rs
          perl -0pi -e 's/\n+\z/\n/' /tmp/elect-007-008-prod.rs
          rustfmt --edition 2024 --check /tmp/elect-007-008-prod.rs

      - name: Generate and archive exact dependency lock
        shell: bash
        run: |
          set -euo pipefail
          cd mycelix-governance/crates/election-anonymous-authority
          cargo generate-lockfile
          cp Cargo.lock /tmp/elect-007-008-Cargo.lock
          sha256sum Cargo.lock | tee /tmp/elect-007-008-lock.sha256
          cargo metadata --locked --format-version 1 > /tmp/elect-007-008-metadata.json

      - name: Run anonymous-authority theorem tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path mycelix-governance/crates/election-anonymous-authority/Cargo.toml --locked 2>&1 | tee /tmp/elect-007-008-test.log

      - name: Run warning-fatal library Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path mycelix-governance/crates/election-anonymous-authority/Cargo.toml --locked --lib -- -D warnings 2>&1 | tee /tmp/elect-007-008-clippy.log

      - name: Audit anonymous-authority boundary
        shell: bash
        run: |
          set -euo pipefail
          src='mycelix-governance/crates/election-anonymous-authority/src/lib.rs'
          grep -F 'ANONYMOUS_AUTHORITY_PROFILE_ID' "$src"
          grep -F 'CrossScopeUnlinkabilityRequired' "$src"
          grep -F 'IssuerVerifierLinkageResistanceRequired' "$src"
          grep -F 'ConflictingUseOfSameAuthority' "$src"
          grep -F 'FreezePendingEvidenceResolution' "$src"
          grep -F 'validate_nullifier_census_for_tally' "$src"
          if grep -Eq 'pub .*voter_did|pub .*subject_id|pub .*account_id|pub .*device_id|pub .*reputation|pub .*phi_score|pub .*arrival_time' "$src"; then
            echo 'Public anonymous-authority types contain a forbidden stable identity or arrival-order authority field' >&2
            exit 1
          fi
          if grep -Eq '^use (hdk|hdi|mycelix_zkp_core|voting_integrity)' "$src"; then
            echo 'ELECT-007/008 must remain backend-neutral and runtime-independent' >&2
            exit 1
          fi

      - name: Remove transient lock and prove immutable checkout
        if: always()
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          rm -f mycelix-governance/crates/election-anonymous-authority/Cargo.lock
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git status --porcelain=v1 --untracked-files=all > /tmp/elect-007-008-status.txt
          test ! -s /tmp/elect-007-008-status.txt

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: elect-007-008-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: |
            /tmp/elect-007-008-Cargo.lock
            /tmp/elect-007-008-lock.sha256
            /tmp/elect-007-008-metadata.json
            /tmp/elect-007-008-test.log
            /tmp/elect-007-008-clippy.log
            /tmp/elect-007-008-status.txt
          if-no-files-found: warn
          retention-days: 30
