name: Terra Preta SOC stock and equivalent soil mass audit

on:
  push:
    branches-ignore: [main]
    paths:
      - 'research/terra-preta/SOC_STOCK_ESM_BENCHMARK_V0.1.md'
      - 'research/terra-preta/schemas/soc-stock-esm-input.schema.json'
      - 'research/terra-preta/schemas/soc-stock-esm-report.schema.json'
      - 'research/terra-preta/tools/soc-stock-esm-audit/**'
      - '.github/workflows/terra-preta-soc-stock-esm.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/terra-preta/SOC_STOCK_ESM_BENCHMARK_V0.1.md'
      - 'research/terra-preta/schemas/soc-stock-esm-input.schema.json'
      - 'research/terra-preta/schemas/soc-stock-esm-report.schema.json'
      - 'research/terra-preta/tools/soc-stock-esm-audit/**'
      - '.github/workflows/terra-preta-soc-stock-esm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soc-stock-esm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path research/terra-preta/tools/soc-stock-esm-audit/Cargo.toml -- --check
      - name: Run tests
        run: cargo test --manifest-path research/terra-preta/tools/soc-stock-esm-audit/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path research/terra-preta/tools/soc-stock-esm-audit/Cargo.toml --all-targets -- -D warnings
      - name: Install pinned Rust JSON Schema validator
        run: cargo install jsonschema-cli --version 0.61.0 --locked
      - name: Validate fixture and report
        run: |
          fixture=research/terra-preta/tools/soc-stock-esm-audit/fixtures/synthetic-stock-esm.json
          jsonschema-cli validate research/terra-preta/schemas/soc-stock-esm-input.schema.json --instance "$fixture" --draft 2020 --assert-format
          cargo run --quiet --manifest-path research/terra-preta/tools/soc-stock-esm-audit/Cargo.toml -- "$fixture" "$RUNNER_TEMP/soc-stock-report.json"
          jsonschema-cli validate research/terra-preta/schemas/soc-stock-esm-report.schema.json --instance "$RUNNER_TEMP/soc-stock-report.json" --draft 2020 --assert-format
          jq -e '
            .fixture_status == "synthetic_only_not_empirical_evidence" and
            .esm_status == "qualified_at_baseline_reference_mass" and
            (.fixed_depth_stock_change_mg_c_ha < 0) and
            (.esm_stock_change_mg_c_ha > 0) and
            (.amendment_carbon_input_mg_c_ha == 0.9) and
            (.source_attribution_status == "unresolved_bulk_soc_does_not_identify_native_vs_amendment_carbon")
          ' "$RUNNER_TEMP/soc-stock-report.json"
      - name: Reject ESM extrapolation when follow-up soil mass is insufficient
        run: |
          fixture=research/terra-preta/tools/soc-stock-esm-audit/fixtures/synthetic-stock-esm.json
          jq '.followup_profile.layers |= .[0:1]' "$fixture" > "$RUNNER_TEMP/insufficient-mass.json"
          cargo run --quiet --manifest-path research/terra-preta/tools/soc-stock-esm-audit/Cargo.toml -- "$RUNNER_TEMP/insufficient-mass.json" "$RUNNER_TEMP/insufficient-report.json"
          jq -e '.esm_status == "insufficient_followup_soil_mass" and .followup_esm_stock_mg_c_ha == null and .esm_stock_change_mg_c_ha == null' "$RUNNER_TEMP/insufficient-report.json"
      - name: Reject output overwrite
        run: |
          fixture=research/terra-preta/tools/soc-stock-esm-audit/fixtures/synthetic-stock-esm.json
          report="$RUNNER_TEMP/existing-soc-report.json"
          printf '%s\n' 'do-not-overwrite' > "$report"
          if cargo run --quiet --manifest-path research/terra-preta/tools/soc-stock-esm-audit/Cargo.toml -- "$fixture" "$report"; then
            echo "Expected create-new output protection"
            exit 1
          fi
          test "$(cat "$report")" = "do-not-overwrite"
