name: GCPN end-to-end fault interaction oracle

on:
  pull_request:
    branches: [main]
    paths:
      - "mycelix-workspace/mycelix-praxis/benchmarks/gcpn-e2e-fault-interaction/**"
      - ".github/workflows/gcpn-e2e-fault-interaction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - name: Verify formatting
        working-directory: mycelix-workspace/mycelix-praxis/benchmarks/gcpn-e2e-fault-interaction
        run: cargo fmt --all -- --check
      - name: Run locked offline tests
        working-directory: mycelix-workspace/mycelix-praxis/benchmarks/gcpn-e2e-fault-interaction
        run: cargo test --locked --offline
      - name: Run strict Clippy
        working-directory: mycelix-workspace/mycelix-praxis/benchmarks/gcpn-e2e-fault-interaction
        run: cargo clippy --locked --offline --all-targets -- -D warnings
      - name: Verify deterministic oracle output
        working-directory: mycelix-workspace/mycelix-praxis/benchmarks/gcpn-e2e-fault-interaction
        run: |
          cargo run --locked --offline --quiet > /tmp/gcpn-run-a.csv
          cargo run --locked --offline --quiet > /tmp/gcpn-run-b.csv
          cmp /tmp/gcpn-run-a.csv /tmp/gcpn-run-b.csv
          grep -q "scenarios=160" /tmp/gcpn-run-a.csv
