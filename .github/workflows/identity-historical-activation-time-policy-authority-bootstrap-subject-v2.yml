name: Identity Historical Activation Time Policy Authority Bootstrap Subject V2

on:
  pull_request:
    paths:
      - 'mycelix-workspace/mycelix-identity/Cargo.toml'
      - 'mycelix-workspace/mycelix-identity/crates/historical-activation-time-policy-authority-bootstrap-subject-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/historical-activation-time-policy-authority-key-generation-policy/**'
      - '.github/workflows/identity-historical-activation-time-policy-authority-bootstrap-subject-v2.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-workspace/mycelix-identity/Cargo.toml'
      - 'mycelix-workspace/mycelix-identity/crates/historical-activation-time-policy-authority-bootstrap-subject-policy/**'
      - '.github/workflows/identity-historical-activation-time-policy-authority-bootstrap-subject-v2.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify-bootstrap-subject-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Assert non-authoritative bootstrap-subject boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          root = Path('mycelix-workspace/mycelix-identity')
          member = 'crates/historical-activation-time-policy-authority-bootstrap-subject-policy'
          workspace = tomllib.loads((root / 'Cargo.toml').read_text())['workspace']['members']
          if member not in workspace:
              raise SystemExit(f'ERROR: {member} is not an explicit Identity workspace member')

          manifest = tomllib.loads((root / member / 'Cargo.toml').read_text())
          deps = manifest.get('dependencies', {})
          expected = {
              'mycelix-historical-activation-time-policy-authority-key-generation-policy',
              'sha2',
          }
          if set(deps) != expected:
              raise SystemExit(f'ERROR: bootstrap-subject runtime dependency drift: {sorted(deps)}')
          if deps['sha2'].get('workspace') is not True:
              raise SystemExit('ERROR: bootstrap subject must use workspace sha2')
          if deps['mycelix-historical-activation-time-policy-authority-key-generation-policy'].get('path') != '../historical-activation-time-policy-authority-key-generation-policy':
              raise SystemExit('ERROR: exact key-material dependency path drifted')

          text = (root / member / 'src/lib.rs').read_text()
          required = [
              '#![forbid(unsafe_code)]',
              'HistoricalActivationTimePolicyAuthorityScopeV2',
              'ExactHistoricalActivationTimePolicyAuthorityBootstrapSubjectV2',
              'HISTORICAL_ACTIVATION_TIME_POLICY_AUTHORITY_BOOTSTRAP_SUBJECT_DOMAIN_V2',
              'mycelix:identity:historical-activation-time-policy-authority-bootstrap-subject:v2\\0',
              'derive_exact_historical_activation_time_policy_authority_bootstrap_subject_v2',
              'generation.key_generation() != 1',
              'scope.canonical_mask()',
              'is_within(self, parent: Self)',
              '0xeb, 0x88, 0xc1, 0x6f',
              'arbitrary_later_generation_cannot_be_relabelled_as_bootstrap',
              'empty_scope_fails_closed',
              'scope_attenuation_is_exact_subset_not_score',
              'scope_change_changes_subject_identity',
              'subject_fields_are_private_and_no_authority_constructor_exists',
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'ERROR: bootstrap-subject invariant missing: {needle!r}')

          production = text[:text.index('#[cfg(test)]')]
          lower = production.lower()
          for forbidden in [
              'pub struct authorized', 'pub struct qualified',
              'from_trusted_configuration', 'is_authorized', 'authorized =',
              'serde::', 'serialize', 'deserialize',
              'use hdk', 'hdk::', '#[hdk_extern]', 'sys_time(', 'std::time',
              'verify_strict', '.verify(', 'positive_evidence', 'trust_score',
              '.expect(', '.unwrap(', 'panic!(', 'unreachable!(',
          ]:
              if forbidden in lower:
                  raise SystemExit(f'ERROR: authority/provenance/crypto/panic surface leaked into bootstrap subject: {forbidden!r}')
          PY

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-workspace/mycelix-identity

      - name: Check formatting
        run: |
          cargo fmt --manifest-path mycelix-workspace/mycelix-identity/crates/historical-activation-time-policy-authority-bootstrap-subject-policy/Cargo.toml -- --check

      - name: Test exact key-material parent
        run: |
          cargo test --manifest-path mycelix-workspace/mycelix-identity/crates/historical-activation-time-policy-authority-key-generation-policy/Cargo.toml

      - name: Test bootstrap subject and scope lattice
        run: |
          cargo test --manifest-path mycelix-workspace/mycelix-identity/crates/historical-activation-time-policy-authority-bootstrap-subject-policy/Cargo.toml

      - name: Check bootstrap subject for wasm32
        run: |
          cargo check --manifest-path mycelix-workspace/mycelix-identity/crates/historical-activation-time-policy-authority-bootstrap-subject-policy/Cargo.toml --target wasm32-unknown-unknown
