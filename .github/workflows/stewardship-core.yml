name: Stewardship Core Qualification

on:
  pull_request:
    paths:
      - 'crates/mycelix-stewardship-core/**'
      - '.github/workflows/stewardship-core.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stewardship-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact proposed head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Verify exact-head checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install stable Rust with wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Assert dependency-free theorem
        run: |
          manifest='crates/mycelix-stewardship-core/Cargo.toml'
          awk '
            /^\[dependencies\]$/ { in_deps=1; next }
            /^\[/ { in_deps=0 }
            in_deps && $0 !~ /^[[:space:]]*($|#)/ { bad=1 }
            END { exit bad }
          ' "$manifest"

      - name: Format
        run: cargo fmt --manifest-path crates/mycelix-stewardship-core/Cargo.toml -- --check

      - name: Host tests
        run: cargo test --manifest-path crates/mycelix-stewardship-core/Cargo.toml --all-targets

      - name: wasm32 check
        run: cargo check --manifest-path crates/mycelix-stewardship-core/Cargo.toml --target wasm32-unknown-unknown

      - name: Strict Clippy
        run: cargo clippy --manifest-path crates/mycelix-stewardship-core/Cargo.toml --all-targets -- -D warnings

      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --manifest-path crates/mycelix-stewardship-core/Cargo.toml --no-deps

      - name: Postflight exact-head verification
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
