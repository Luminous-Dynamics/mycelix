name: FIN-ALPACA-EXECID-001A exact source diagnostic

on:
  pull_request:
    branches:
      - feat/fin-alpaca-execid-001a
    paths:
      - .github/workflows/fin-alpaca-execid-001a-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fin-alpaca-execid-001a-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PRODUCT_SHA: 84636a5afe1518f7b8f477747b6e4e53fb4f52b1
  PROFILE_PARENT_SHA: bf6faa46f531aed8d8f6bf8129c5156588228520
  RUSTUP_TOOLCHAIN: 1.96.0
  CARGO_TERM_COLOR: always

jobs:
  diagnose:
    name: Diagnose exact FIN-ALPACA-EXECID-001A source
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout diagnostic head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact lineage and source scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PRODUCT_SHA"
          test "$(git rev-parse "$PRODUCT_SHA^")" = "$PROFILE_PARENT_SHA"

          mapfile -t diag_paths < <(git diff --name-only "$PRODUCT_SHA" HEAD)
          test "${#diag_paths[@]}" -eq 1
          test "${diag_paths[0]}" = ".github/workflows/fin-alpaca-execid-001a-diagnostic.yml"

          mapfile -t product_paths < <(git diff --name-only "$PROFILE_PARENT_SHA" "$PRODUCT_SHA")
          printf '%s\n' "${product_paths[@]}" | tee /tmp/fin-alpaca-product-paths.txt
          test "${#product_paths[@]}" -eq 4
          for p in \
            mycelix-finance/Cargo.toml \
            mycelix-finance/crates/finance-provider-alpaca-activity/Cargo.toml \
            mycelix-finance/crates/finance-provider-alpaca-activity/src/lib.rs \
            mycelix-finance/crates/finance-provider-alpaca-activity/tests/adversarial.rs
          do
            grep -Fxq "$p" /tmp/fin-alpaca-product-paths.txt
          done
          ! grep -Fxq 'mycelix-finance/Cargo.lock' /tmp/fin-alpaca-product-paths.txt

          grep -Fq '#![forbid(unsafe_code)]' mycelix-finance/crates/finance-provider-alpaca-activity/src/lib.rs

      - name: Prove identity-only input surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fin-alpaca-execid-evidence
          python3 - <<'PY' | tee /tmp/fin-alpaca-execid-evidence/input-surface.txt
          from pathlib import Path
          import re

          src = Path('mycelix-finance/crates/finance-provider-alpaca-activity/src/lib.rs').read_text()
          m = re.search(r'pub struct AlpacaActivityIdentityEvidenceV1\s*\{(?P<body>.*?)\n\}', src, re.S)
          if not m:
              raise SystemExit('identity evidence struct not found')
          fields = []
          for line in m.group('body').splitlines():
              line = line.strip()
              fm = re.match(r'pub\s+([a-zA-Z0-9_]+)\s*:', line)
              if fm:
                  fields.append(fm.group(1))
          expected = [
              'deployment_profile',
              'provider_schema_profile',
              'account_id',
              'activity_type',
              'ref_id',
              'previous_id',
              'execution_type',
          ]
          print('fields=' + ','.join(fields))
          if fields != expected:
              raise SystemExit(f'identity field surface drift: {fields!r}')
          forbidden = {
              'event_id', 'order_id', 'source_evidence_commitment',
              'qty', 'price', 'symbol', 'asset_id', 'side',
          }
          if forbidden.intersection(fields):
              raise SystemExit('transport/order/economic field leaked into identity input')
          if '#[serde(deny_unknown_fields)]' not in src:
              raise SystemExit('deny_unknown_fields missing')
          PY

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: rustfmt,clippy

      - name: Record preflight capsule
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fin-alpaca-execid-evidence
          {
            echo "diagnostic_head=$(git rev-parse HEAD)"
            echo "product_sha=$PRODUCT_SHA"
            echo "profile_parent_sha=$PROFILE_PARENT_SHA"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "rustfmt=$(rustfmt --version)"
            echo "runner_os=${RUNNER_OS:-unknown}"
            echo "runner_arch=${RUNNER_ARCH:-unknown}"
            echo "workspace_manifest_sha256=$(sha256sum mycelix-finance/Cargo.toml | awk '{print $1}')"
            echo "crate_manifest_sha256=$(sha256sum mycelix-finance/crates/finance-provider-alpaca-activity/Cargo.toml | awk '{print $1}')"
            echo "source_sha256=$(sha256sum mycelix-finance/crates/finance-provider-alpaca-activity/src/lib.rs | awk '{print $1}')"
            echo "adversarial_sha256=$(sha256sum mycelix-finance/crates/finance-provider-alpaca-activity/tests/adversarial.rs | awk '{print $1}')"
            echo "profile_corpus_sha256=$(sha256sum mycelix-finance/docs/providers/fixtures/FIN_ALPACA_EXECID_001_V0_1.json | awk '{print $1}')"
            echo "lock_before_sha256=$(sha256sum mycelix-finance/Cargo.lock | awk '{print $1}')"
          } | tee /tmp/fin-alpaca-execid-evidence/preflight.txt

      - name: Rustfmt exact source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt \
            --manifest-path mycelix-finance/Cargo.toml \
            --all \
            -- --check

      - name: Derive dependency capsule ephemerally
        shell: bash
        run: |
          set -euo pipefail
          cp mycelix-finance/Cargo.lock /tmp/fin-alpaca-lock-before

          cargo check \
            --manifest-path mycelix-finance/Cargo.toml \
            -p finance-provider-alpaca-activity

          mapfile -t dirty < <(git status --porcelain=v1 | sed -E 's/^.. //')
          printf '%s\n' "${dirty[@]}" | tee /tmp/fin-alpaca-execid-evidence/dirty-paths.txt
          test "${#dirty[@]}" -eq 1
          test "${dirty[0]}" = "mycelix-finance/Cargo.lock"

          git diff -- mycelix-finance/Cargo.lock \
            | tee /tmp/fin-alpaca-execid-evidence/cargo-lock.patch
          grep -Fq 'finance-provider-alpaca-activity' mycelix-finance/Cargo.lock
          sha256sum mycelix-finance/Cargo.lock \
            | tee /tmp/fin-alpaca-execid-evidence/lock-after.sha256
          cp mycelix-finance/Cargo.lock \
            /tmp/fin-alpaca-execid-evidence/Cargo.lock.derived

      - name: Locked metadata check tests docs and strict Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata \
            --manifest-path mycelix-finance/Cargo.toml \
            --locked \
            --format-version 1 \
            > /tmp/fin-alpaca-execid-evidence/cargo-metadata.json

          cargo check \
            --manifest-path mycelix-finance/Cargo.toml \
            --locked \
            -p finance-provider-alpaca-activity \
            --all-targets

          cargo test \
            --manifest-path mycelix-finance/Cargo.toml \
            --locked \
            -p finance-provider-alpaca-activity \
            --all-targets

          cargo test \
            --manifest-path mycelix-finance/Cargo.toml \
            --locked \
            -p finance-provider-alpaca-activity \
            --doc

          cargo clippy \
            --manifest-path mycelix-finance/Cargo.toml \
            --locked \
            -p finance-provider-alpaca-activity \
            --all-targets \
            -- -D warnings

      - name: Prove runtime dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          cargo tree \
            --manifest-path mycelix-finance/Cargo.toml \
            --locked \
            -p finance-provider-alpaca-activity \
            --edges normal \
            | tee /tmp/fin-alpaca-execid-evidence/cargo-tree-normal.txt

          ! grep -Eiq '(^|[[:space:]├└│])((reqwest|hyper|axum|tokio|hdk|hdi|holochain|rusqlite|sqlx|diesel|web3|ethers|secrecy)([[:space:]-]|$))' \
            /tmp/fin-alpaca-execid-evidence/cargo-tree-normal.txt

      - name: Static authority audit
        shell: bash
        run: |
          set -euo pipefail
          src=mycelix-finance/crates/finance-provider-alpaca-activity/src/lib.rs
          grep -Fq 'deny_unknown_fields' "$src"
          grep -Fq 'AdmittedAlpacaFillExecutionRefV1' "$src"
          grep -Fq 'AdmittedAlpacaCorrectionActivityRefV1' "$src"
          grep -Fq 'AdmittedAlpacaBustActivityRefV1' "$src"
          grep -Fq 'unknown_execution_type_precedes_missing_ref_fallback_logic' "$src"
          ! grep -Eq 'impl[^\n]*Deserialize[^\n]*AdmittedAlpaca' "$src"

      - name: Postflight immutability and diagnostic receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PRODUCT_SHA"
          git diff --exit-code "$PRODUCT_SHA" HEAD -- mycelix-finance

          mapfile -t dirty < <(git status --porcelain=v1 | sed -E 's/^.. //')
          test "${#dirty[@]}" -eq 1
          test "${dirty[0]}" = "mycelix-finance/Cargo.lock"

          {
            echo "verdict=DIAGNOSTIC_PASS"
            echo "diagnostic_head=$(git rev-parse HEAD)"
            echo "product_sha=$PRODUCT_SHA"
            echo "profile_parent_sha=$PROFILE_PARENT_SHA"
            echo "lock_after_sha256=$(sha256sum mycelix-finance/Cargo.lock | awk '{print $1}')"
            echo "product_source_mutated=false"
            echo "claim=source diagnostic only; if lock drift exists rebuild product with mechanical lock delta before qualification"
          } | tee /tmp/fin-alpaca-execid-evidence/receipt.txt

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fin-alpaca-execid-001a-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/fin-alpaca-execid-evidence
          if-no-files-found: warn
          retention-days: 30
