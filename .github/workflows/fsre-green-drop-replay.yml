name: FSRE Green Drop public-summary replay
on:
  pull_request:
    paths:
      - "tools/fsre-green-drop-replay/**"
      - ".github/workflows/fsre-green-drop-replay.yml"
  push:
    branches:
      - main
    paths:
      - "tools/fsre-green-drop-replay/**"
      - ".github/workflows/fsre-green-drop-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path tools/fsre-green-drop-replay/Cargo.toml --all -- --check
      - name: Run deterministic source-replay tests
        run: cargo test --locked --offline --manifest-path tools/fsre-green-drop-replay/Cargo.toml
      - name: Verify public-summary replay against golden report
        shell: bash
        run: |
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          cargo run --locked --offline --manifest-path tools/fsre-green-drop-replay/Cargo.toml -- tools/fsre-green-drop-replay/fixtures/ZA_GREEN_DROP_PUBLIC_SUMMARY_2025.psv > "$output"
          diff -u tools/fsre-green-drop-replay/fixtures/ZA_GREEN_DROP_PUBLIC_SUMMARY_2025.expected.txt "$output"
      - name: Run Clippy
        run: cargo clippy --locked --offline --manifest-path tools/fsre-green-drop-replay/Cargo.toml --all-targets -- -D warnings
