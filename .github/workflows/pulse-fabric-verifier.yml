name: Pulse Fabric verifier

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pulse-fabric-verifier.yml"
      - "mycelix-workspace/mycelix-pulse/tools/fabric-verifier/**"
      - "mycelix-workspace/mycelix-pulse/docs/pulse-fabric-*.json"
      - "mycelix-workspace/mycelix-pulse/docs/pulse-group-fanout-*.json"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pulse-fabric-verifier.yml"
      - "mycelix-workspace/mycelix-pulse/tools/fabric-verifier/**"
      - "mycelix-workspace/mycelix-pulse/docs/pulse-fabric-*.json"
      - "mycelix-workspace/mycelix-pulse/docs/pulse-group-fanout-*.json"
  workflow_dispatch:

permissions:
  contents: read

# Never cancel an in-progress exact-head run. GitHub retains only the newest
# pending run in this branch-scoped group, preventing one queued run per push.
concurrency:
  group: pulse-fabric-verifier-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verifier:
    name: Verify trace consistency and adversarial controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            mycelix-workspace/mycelix-pulse/tools/fabric-verifier -> target
      - name: Generate and freeze dependency resolution for this run
        run: cargo generate-lockfile --manifest-path mycelix-workspace/mycelix-pulse/tools/fabric-verifier/Cargo.toml
      - name: Format
        run: cargo fmt --manifest-path mycelix-workspace/mycelix-pulse/tools/fabric-verifier/Cargo.toml -- --check
      - name: Unit tests
        run: cargo test --locked --manifest-path mycelix-workspace/mycelix-pulse/tools/fabric-verifier/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --manifest-path mycelix-workspace/mycelix-pulse/tools/fabric-verifier/Cargo.toml --all-targets -- -D warnings
      - name: Preserve generated Cargo.lock for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-fabric-verifier-cargo-lock
          path: mycelix-workspace/mycelix-pulse/tools/fabric-verifier/Cargo.lock
          if-no-files-found: warn
          retention-days: 14
