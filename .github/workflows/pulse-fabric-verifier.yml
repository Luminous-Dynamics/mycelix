name: Pulse Fabric verifier

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pulse-fabric-verifier.yml"
      - "mycelix-workspace/mycelix-pulse/tools/fabric-verifier/**"
      - "mycelix-workspace/mycelix-pulse/docs/pulse-fabric-*.json"
  pull_request:
    branches: [main]
    paths:
      - "mycelix-workspace/mycelix-pulse/tools/fabric-verifier/**"
      - "mycelix-workspace/mycelix-pulse/docs/pulse-fabric-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulse-fabric-verifier-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verifier:
    name: Verify trace consistency and adversarial controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            mycelix-workspace/mycelix-pulse/tools/fabric-verifier -> target
      - name: Format
        run: cargo fmt --manifest-path mycelix-workspace/mycelix-pulse/tools/fabric-verifier/Cargo.toml -- --check
      - name: Unit tests
        run: cargo test --manifest-path mycelix-workspace/mycelix-pulse/tools/fabric-verifier/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path mycelix-workspace/mycelix-pulse/tools/fabric-verifier/Cargo.toml --all-targets -- -D warnings
