name: AC-016 Civic Exact-Subject Qualification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ac016-civic-exact-subject-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  QUALIFICATION_SUBJECT_SHA: b5ef71cb968012619a1d3dd74680b4cd870e2fdc
  QUALIFICATION_WORKFLOW_SHA: ${{ github.workflow_sha }}

jobs:
  qualify-civic-types:
    name: Civic Types AC-001..016 exact subject
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout frozen AC-016 subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.QUALIFICATION_SUBJECT_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Prove exact subject and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          observed="$(git rev-parse HEAD)"
          observed_tree="$(git rev-parse HEAD^{tree})"
          printf 'declared_subject=%s\n' "$QUALIFICATION_SUBJECT_SHA"
          printf 'observed_subject=%s\n' "$observed"
          printf 'observed_tree=%s\n' "$observed_tree"
          printf 'workflow_sha=%s\n' "$QUALIFICATION_WORKFLOW_SHA"
          printf 'runtime_sha=%s\n' "$GITHUB_SHA"
          test "$observed" = "$QUALIFICATION_SUBJECT_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Install pinned Rust qualification toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt,clippy

      - name: Restore Civic Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: mycelix-civic

      - name: Capture qualification environment and locked graph
        shell: bash
        run: |
          set -euo pipefail
          rustc -vV
          cargo -V
          uname -a
          cat /etc/os-release
          sha256sum mycelix-civic/Cargo.toml
          sha256sum mycelix-civic/Cargo.lock
          sha256sum mycelix-civic/crates/civic-types/tests/ac015_adversarial_municipal.rs
          sha256sum mycelix-civic/crates/civic-types/tests/ac016_adversarial_composition.rs
          printf 'workflow_sha=%s\n' "$QUALIFICATION_WORKFLOW_SHA"
          printf 'run_id=%s\n' "$GITHUB_RUN_ID"
          printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
          (cd mycelix-civic && cargo tree -p civic-types --locked -e features)

      - name: Check civic-types formatting
        shell: bash
        run: |
          set -euo pipefail
          cd mycelix-civic
          cargo fmt -p civic-types -- --check

      - name: Run civic-types all-target tests under committed lock
        shell: bash
        run: |
          set -euo pipefail
          cd mycelix-civic
          cargo test -p civic-types --all-targets --locked --no-fail-fast

      - name: Run warnings-denied civic-types Clippy under committed lock
        shell: bash
        run: |
          set -euo pipefail
          cd mycelix-civic
          cargo clippy -p civic-types --all-targets --locked -- -D warnings

      - name: Prove qualification did not mutate subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QUALIFICATION_SUBJECT_SHA"
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"

      - name: Emit canonical AC-016 qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          export SUBJECT_TREE="$(git rev-parse HEAD^{tree})"
          export RUSTC_VERSION="$(rustc --version)"
          export CARGO_VERSION="$(cargo --version)"
          export CIVIC_MANIFEST_SHA256="$(sha256sum mycelix-civic/Cargo.toml | awk '{print $1}')"
          export CIVIC_LOCK_SHA256="$(sha256sum mycelix-civic/Cargo.lock | awk '{print $1}')"
          export AC015_TEST_SHA256="$(sha256sum mycelix-civic/crates/civic-types/tests/ac015_adversarial_municipal.rs | awk '{print $1}')"
          export AC016_TEST_SHA256="$(sha256sum mycelix-civic/crates/civic-types/tests/ac016_adversarial_composition.rs | awk '{print $1}')"
          python3 - <<'PY'
          import hashlib
          import json
          import os

          receipt = {
              "schema": "mycelix.civic.ac016.qualification.receipt.v0.1",
              "result": "pass",
              "subject": {
                  "commit": os.environ["QUALIFICATION_SUBJECT_SHA"],
                  "tree": os.environ["SUBJECT_TREE"],
              },
              "workflow": {
                  "commit": os.environ["QUALIFICATION_WORKFLOW_SHA"],
              },
              "run": {
                  "id": os.environ["GITHUB_RUN_ID"],
                  "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "event": os.environ["GITHUB_EVENT_NAME"],
              },
              "runner": {
                  "os": os.environ.get("RUNNER_OS", "unknown"),
                  "arch": os.environ.get("RUNNER_ARCH", "unknown"),
              },
              "toolchain": {
                  "rustc": os.environ["RUSTC_VERSION"],
                  "cargo": os.environ["CARGO_VERSION"],
              },
              "inputs": {
                  "civic_manifest_sha256": os.environ["CIVIC_MANIFEST_SHA256"],
                  "civic_lock_sha256": os.environ["CIVIC_LOCK_SHA256"],
                  "ac015_test_sha256": os.environ["AC015_TEST_SHA256"],
                  "ac016_test_sha256": os.environ["AC016_TEST_SHA256"],
              },
              "assertions": [
                  {"id": "exact-subject", "result": "pass"},
                  {"id": "clean-checkout-pre", "result": "pass"},
                  {"id": "locked-feature-graph", "result": "pass"},
                  {"id": "rustfmt", "result": "pass"},
                  {"id": "all-target-tests", "result": "pass"},
                  {"id": "clippy-warnings-denied", "result": "pass"},
                  {"id": "clean-checkout-post", "result": "pass"},
              ],
              "proposition": (
                  "The exact AC-016 civic-types subject passed the declared locked "
                  "format, all-target test, and warnings-denied Clippy gates under "
                  "this execution profile."
              ),
              "non_claims": [
                  "real-world corruption-detection accuracy",
                  "legal sufficiency",
                  "external registry authenticity",
                  "municipal deployment readiness",
                  "sanction authority",
              ],
          }
          canonical = json.dumps(receipt, sort_keys=True, separators=(",", ":"))
          digest = hashlib.sha256(canonical.encode("utf-8")).hexdigest()
          print("AC016_QUALIFICATION_RECEIPT_JSON=" + canonical)
          print("AC016_QUALIFICATION_RECEIPT_SHA256=" + digest)
          PY
