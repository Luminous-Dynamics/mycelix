name: Praxis rustfmt normalization artifact (non-qualification)

on:
  push:
    branches:
      - praxis/capability-plan-rustfmt-artifact-20261128

permissions:
  contents: write

jobs:
  normalize:
    name: Apply Rust 1.96 formatter to capability-plan source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact capability-plan branch
        uses: actions/checkout@v4
        with:
          ref: praxis/capability-plan-compiler-v1
          fetch-depth: 0

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Format package and commit only rustfmt changes
        shell: bash
        run: |
          set -euo pipefail
          expected_ref="praxis/capability-plan-compiler-v1"
          git switch --force-create "$expected_ref"
          before="$(git rev-parse HEAD)"
          workspace="mycelix-workspace/mycelix-praxis"
          cargo generate-lockfile --manifest-path "$workspace/Cargo.toml"
          cargo +1.96.0 fmt --manifest-path "$workspace/Cargo.toml" -p praxis-core
          git diff --check
          git add "$workspace/crates/praxis-core/src" "$workspace/crates/praxis-core/benches"
          git add -f "$workspace/Cargo.lock"
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(praxis): apply Rust 1.96 package formatting"
            git push origin "HEAD:$expected_ref"
          fi
          printf 'pre_format_head=%s\n' "$before"
          printf 'post_format_head=%s\n' "$(git rev-parse HEAD)"
          printf 'formatter=rustfmt 1.96.0\n'

      - name: Upload normalized package sources
        uses: actions/upload-artifact@v4
        with:
          name: praxis-rustfmt-normalized-${{ github.run_id }}
          path: |
            mycelix-workspace/mycelix-praxis/crates/praxis-core/src
            mycelix-workspace/mycelix-praxis/crates/praxis-core/benches
          if-no-files-found: error
          retention-days: 3
