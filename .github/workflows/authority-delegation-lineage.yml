name: Authority Delegation Lineage

on:
  pull_request:
    paths:
      - 'crates/mycelix-authority-delegation/**'
      - 'crates/mycelix-authority-identity/**'
      - 'crates/mycelix-authority-freshness/**'
      - 'crates/mycelix-institutional-core/**'
      - '.github/workflows/authority-delegation-lineage.yml'
  push:
    branches:
      - 'security/authority-delegation-lineage-v0.1'

permissions:
  contents: read

concurrency:
  group: authority-delegation-lineage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: Delegation attenuation and lineage kernel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path crates/mycelix-authority-delegation/Cargo.toml -- --check
      - name: Tests
        run: cargo test --manifest-path crates/mycelix-authority-delegation/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-authority-delegation/Cargo.toml --all-targets -- -D warnings
      - name: Authority-separation audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('crates/mycelix-authority-delegation/src/lib.rs').read_text()
          invariants = Path('crates/mycelix-authority-delegation/INVARIANTS.md').read_text()

          required = [
              'DelegationAuthorityBinding',
              'verified_delegation_authority_digest',
              'LineageGenerationMismatch',
              'GrantFreshnessPredatesGrant',
              'DelegationFreshnessPredatesAttestation',
              'BUNDLE_IDENTITY_PROFILE',
              'MAX_LINEAGE_DEPTH',
              'CapabilityExpansion',
              'RoleExpansion',
          ]
          for token in required:
              assert token in src, token

          assert 'Deserialize)]\npub struct QualifiedDelegationEdge' not in src
          assert 'Deserialize)]\npub struct QualifiedDelegationLineage' not in src
          assert 'verified: bool' not in src
          lowered = src.lower()
          assert 'phi' not in lowered
          assert 'reputation' not in lowered
          assert 'model_score' not in lowered

          assert 'Possession is not delegability' in invariants
          assert 'Generation continuity across edges' in invariants
          print('PASS: delegation requires exact attenuation, independent delegability authority, and generation-consistent lineage')
          PY
