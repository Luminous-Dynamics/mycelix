name: Authority Coordinator Conductor Process Fence

on:
  pull_request:
    paths:
      - 'crates/mycelix-authority-coordinator-conductor-process/**'
      - 'mycelix-governance/dna/dna.yaml'
      - '.github/workflows/authority-coordinator-conductor-process.yml'
  push:
    branches:
      - 'security/authority-coordinator-conductor-process-v0.1'

permissions:
  contents: read

concurrency:
  group: authority-coordinator-conductor-process-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Pinned Linux listener/process stability fence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.89.0'
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --manifest-path crates/mycelix-authority-coordinator-conductor-process/Cargo.toml -- --check

      - name: Tests
        run: cargo test --manifest-path crates/mycelix-authority-coordinator-conductor-process/Cargo.toml --all-targets

      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-authority-coordinator-conductor-process/Cargo.toml --all-targets -- -D warnings

      - name: Trust-boundary audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('crates/mycelix-authority-coordinator-conductor-process')
          src = (root / 'src/lib.rs').read_text()
          prod = src.split('#[cfg(test)]', 1)[0]
          cargo = (root / 'Cargo.toml').read_text()
          inv = (root / 'INVARIANTS.md').read_text().lower()
          dna = Path('mycelix-governance/dna/dna.yaml').read_text()

          assert 'rust-version = "1.89"' in cargo
          for dep in ['blake3 = "1"', 'libc = "0.2"', 'serde_json = "1"']:
              assert dep in cargo, dep
          for forbidden in [
              'holochain_client', 'hdk',
              'mycelix-authority-coordinator-release',
              'mycelix-authority-coordinator-deployment',
              'mycelix-authority-coordinator-target-cell',
          ]:
              assert forbidden not in cargo, forbidden

          for token in [
              'pub const BINDING_PIN_PROTOCOL:',
              'pub const BINDING_PIN_PROFILE:',
              'pub const EXECUTABLE_PROFILE:',
              'pub const PROCESS_SNAPSHOT_PROFILE:',
              'pub struct ConductorProcessBinding {',
              'pub struct ConductorProcessBindingPin {',
              'pub struct ConductorProcessSnapshot {',
              'pub struct QualifiedConductorProcessFence {',
              'pub struct TrustedConductorProcessStore {',
              'pub struct ConductorProcessFenceGuard',
              'pub fn bootstrap_from_out_of_band_pin(',
              'pub fn begin_fence(&self)',
              'pub fn finish(self)',
              'Path::new("/proc/net/tcp")',
              'Path::new("/proc/net/tcp6")',
              'fields[3] != TCP_LISTEN_STATE',
              'format!("socket:[{inode}]")',
              'read_process_start_time_ticks(pid)',
              'read_process_effective_uid(pid)',
              'fs::read_link(&exe_link)',
              'hash_open_file(executable)',
              'libc::SYS_pidfd_open',
              'ensure_pidfd_alive(&pidfd)?;',
              'if first != pre',
              'if post != self.pre',
              'self.store.atomic_replace_state(&next)?;',
              'Ok(QualifiedConductorProcessFence {',
              'fs::canonicalize(&anchored_parent)',
              '.custom_flags(libc::O_NOFOLLOW | libc::O_CLOEXEC)',
              'lock.lock()',
              'file.sync_all()',
              'fs::rename(&temp_path, &self.state_path)',
              'directory.sync_all()',
          ]:
              assert token in src, token

          # The live fence starts from state-owned policy only; no caller supplies
          # endpoint/PID/snapshot/time to begin_fence.
          begin_sig = prod.split('pub fn begin_fence', 1)[1].split('{', 1)[0]
          assert 'SocketAddr' not in begin_sig
          assert 'pid' not in begin_sig.lower()
          assert 'snapshot' not in begin_sig.lower()
          assert 'time' not in begin_sig.lower()

          # Positive process fence is locally constructed and historical only.
          prefix = src.split('pub struct QualifiedConductorProcessFence {', 1)[0].split('\n')[-8:]
          assert not any('Deserialize' in line for line in prefix)
          positive = src.split('pub struct QualifiedConductorProcessFence {', 1)[1].split('\n}', 1)[0]
          assert 'started_at_ms' in positive
          assert 'ended_at_ms' in positive
          assert 'valid_until_ms' not in positive

          # Durable state replacement must happen before positive fence construction.
          finish = prod.split('pub fn finish(self)', 1)[1].split('\n    }\n}', 1)[0]
          persist = finish.index('self.store.atomic_replace_state(&next)?;')
          positive_at = finish.index('Ok(QualifiedConductorProcessFence {')
          assert persist < positive_at

          # Exact process identity must include more than PID.
          snapshot = prod.split('pub struct ConductorProcessSnapshot {', 1)[1].split('\n}', 1)[0]
          for field in [
              'listener_inode', 'pid', 'process_start_time_ticks', 'effective_uid',
              'executable_path', 'executable_digest', 'executable_dev',
              'executable_inode', 'executable_len',
          ]:
              assert field in snapshot, field

          # No in-band process-policy rotation and no release/code/effect semantics.
          for forbidden in [
              'pub fn rotate_', 'pub fn rebind_', 'pub fn set_endpoint',
              'AdminWebsocket', 'list_cell_ids', 'get_dna_definition', 'call_zome',
              'QualifiedCurrentCoordinatorRelease', 'ObservedCoordinatorDeployment',
              'match_required_coordinator_deployment', 'perform_external_effect',
          ]:
              assert forbidden not in prod, forbidden

          for invariant in [
              'loopback is not process identity',
              'the process policy is pinned out of band',
              'no in-band process-policy replacement',
              'listener identity comes from linux procfs',
              'numeric pid alone is never sufficient',
              'pidfd is acquired before the interval opens',
              'executable identity is byte-level and path-level',
              'fence close requires exact snapshot equality',
              'the fence is historical, not a future lease',
              'positive fence is non-deserializable',
              'persistence precedes positive fence authority',
              'trusted clock floor is monotone locally',
              'filesystem state is crash-durable, not hardware anti-rollback',
              'this is not tcp peer authentication',
              'transient same-process exec aba remains outside v0.1',
              'process fencing does not prove observation use',
              'no release/code/effect semantics in this crate',
              'provisioning remains blocked',
          ]:
              assert invariant in inv, invariant

          assert 'name: authority_current_freshness_verifier' not in dna
          assert 'name: constitution_currentness_verifier' not in dna

          print('PASS: pinned Linux listener owner + pidfd + exact executable pre/post fence; historical evidence only')
          PY
