name: FIN-TRUST-BENCH S0 exact-head qualification

on:
  push:
    branches:
      - research/fin-trust-bench-v1
    paths:
      - "mycelix-finance/benchmarks/finance-trust-v1/**"
      - ".github/workflows/fin-trust-s0-qualification.yml"
  pull_request:
    branches:
      - research/fin-acc-bench-v1
    paths:
      - "mycelix-finance/benchmarks/finance-trust-v1/**"
      - ".github/workflows/fin-trust-s0-qualification.yml"

permissions:
  contents: read

concurrency:
  group: fin-trust-s0-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Schema, evidence binding, clarification, journal and statement conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      QUALIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VERIFIER_DIR: mycelix-finance/benchmarks/finance-trust-v1/rust-verifier
      VERIFIER_V11_DIR: mycelix-finance/benchmarks/finance-trust-v1/rust-verifier-v1.1.0
    steps:
      - name: Checkout exact qualification subject
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          persist-credentials: false

      - name: Assert exact checked-out commit
        run: test "$(git rev-parse HEAD)" = "${{ env.QUALIFIED_SHA }}"

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy

      - name: Assert toolchain
        run: test "$(rustc +1.96.1 --version | awk '{print $2}')" = "1.96.1"

      - name: Format v1.0.0
        working-directory: ${{ env.VERIFIER_DIR }}
        run: cargo fmt --all -- --check

      - name: Format v1.1.0
        working-directory: ${{ env.VERIFIER_V11_DIR }}
        run: cargo fmt --all -- --check

      - name: Locked tests v1.0.0
        working-directory: ${{ env.VERIFIER_DIR }}
        run: cargo test --locked --all-targets

      - name: Locked tests v1.1.0
        working-directory: ${{ env.VERIFIER_V11_DIR }}
        run: cargo test --locked --all-targets

      - name: Warnings-denied Clippy v1.0.0
        working-directory: ${{ env.VERIFIER_DIR }}
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Warnings-denied Clippy v1.1.0
        working-directory: ${{ env.VERIFIER_V11_DIR }}
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Emit exact-head v1.0.0 conformance report
        working-directory: ${{ env.VERIFIER_DIR }}
        run: cargo run --locked -- --out /tmp/fin-trust-s0-report.json

      - name: Emit exact-head v1.1.0 conformance report
        working-directory: ${{ env.VERIFIER_V11_DIR }}
        run: cargo run --locked -- --out /tmp/fin-trust-s1-report.json

      - name: Upload exact-head report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fin-trust-s0-s1-${{ env.QUALIFIED_SHA }}
          path: |
            /tmp/fin-trust-s0-report.json
            /tmp/fin-trust-s1-report.json
          if-no-files-found: error

      - name: Assert exact subject and clean source
        run: |
          test "$(git rev-parse HEAD)" = "${{ env.QUALIFIED_SHA }}"
          test -z "$(git status --porcelain)"
