name: MYC-INT-007R exact observed-maturation validator qualification

on:
  pull_request:
    branches:
      - myc-int-007r-observed-maturation-validator
  workflow_dispatch:

permissions:
  contents: read

env:
  SUBJECT_SHA: 45fbd406a30657f21a8f9e3b8a481ed265ff7dc8
  PARENT_SHA: 52bdd21e1482272e75e122ebcc4a8fac37b2964d

jobs:
  qualify-exact-subject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0

      - name: Verify exact subject and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          mapfile -t changed < <(git diff --name-only "$PARENT_SHA" "$SUBJECT_SHA")
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          expected=(
            "docs/interoperability/scripts/test_validate_myc_int_007q.py"
            "docs/interoperability/scripts/validate_myc_int_007q.py"
          )
          mapfile -t got < <(printf '%s\n' "${changed[@]}" | sort)
          mapfile -t want < <(printf '%s\n' "${expected[@]}" | sort)
          test "${got[*]}" = "${want[*]}"

      - name: Python syntax
        run: |
          python3 -m py_compile \
            docs/interoperability/scripts/validate_myc_int_007q.py \
            docs/interoperability/scripts/test_validate_myc_int_007q.py

      - name: Run 007R mutation suite
        run: |
          python3 -m unittest -v docs/interoperability/scripts/test_validate_myc_int_007q.py

      - name: Validate real 007Q fixtures
        run: |
          python3 docs/interoperability/scripts/validate_myc_int_007q.py \
            docs/interoperability/fixtures/MYC_INT_007Q_OBSERVED_MATURATION_CHECKPOINT.json \
            docs/interoperability/fixtures/MYC_INT_007Q_MATURATION_TRANSITION_RECORD.json \
            docs/interoperability/fixtures/MYC_INT_007Q_HOSTILE_CASES.json

      - name: Create evidence capsule
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification-capsule
          {
            echo "subject_sha=$SUBJECT_SHA"
            echo "parent_sha=$PARENT_SHA"
            echo "head=$(git rev-parse HEAD)"
            python3 --version
            uname -a
          } > qualification-capsule/environment.txt
          sha256sum \
            docs/interoperability/fixtures/MYC_INT_007Q_OBSERVED_MATURATION_CHECKPOINT.json \
            docs/interoperability/fixtures/MYC_INT_007Q_MATURATION_TRANSITION_RECORD.json \
            docs/interoperability/fixtures/MYC_INT_007Q_HOSTILE_CASES.json \
            docs/interoperability/scripts/validate_myc_int_007q.py \
            docs/interoperability/scripts/test_validate_myc_int_007q.py \
            > qualification-capsule/files.sha256
          git diff --name-status "$PARENT_SHA" "$SUBJECT_SHA" > qualification-capsule/exact-scope.txt

      - name: Upload qualification capsule
        uses: actions/upload-artifact@v4
        with:
          name: myc-int-007r-exact-qualification-${{ env.SUBJECT_SHA }}
          path: qualification-capsule/
          if-no-files-found: error
