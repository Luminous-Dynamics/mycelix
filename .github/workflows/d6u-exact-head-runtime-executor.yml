name: D6U Exact-Head Runtime Executor

on:
  workflow_run:
    workflows: ["D6S Canonical Qualification"]
    types: [completed]
    branches:
      - myc-int-demo-d6u-holochain-07-runtime

permissions:
  contents: read

concurrency:
  group: d6u-runtime-reference-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  d6u-runtime:
    name: D6U Holochain 0.7 runtime evidence
    if: >-
      github.event.workflow_run.name == 'D6S Canonical Qualification' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'myc-int-demo-d6u-holochain-07-runtime'
    env:
      QUALIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact qualification subject
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          persist-credentials: false

      - name: Assert exact qualification subject
        run: test "$(git rev-parse HEAD)" = "${{ env.QUALIFIED_SHA }}"

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Assert Rust identity
        run: |
          test "$(rustc +1.96.1 --version | awk '{print $2}')" = "1.96.1"
          test "$(rustc +1.96.1 --version --verbose | sed -n 's/^commit-hash: //p')" = "31fca3adb283cc9dfd56b49cdee9a96eb9c96ffd"
          rustfmt +1.96.1 --version

      - name: Preflight evidence verifiers
        run: python3 -m py_compile scripts/integral/verify_d6u_runtime_manifest.py scripts/integral/verify_d6u_runtime_evidence.py scripts/integral/verify_d6u_runtime_lock.py scripts/integral/verify_d6u_runtime_record.py

      - name: Verify D6U manifest
        run: python3 scripts/integral/verify_d6u_runtime_manifest.py

      - name: Check formatting
        working-directory: d6u-runtime-harness
        run: cargo fmt --all -- --check

      - name: Generate locked dependency graph
        working-directory: d6u-runtime-harness
        run: cargo generate-lockfile

      - name: Verify resolved substrate lock
        working-directory: d6u-runtime-harness
        run: python3 ../scripts/integral/verify_d6u_runtime_lock.py Cargo.lock

      - name: Negative-test substrate lock verifier
        if: success()
        working-directory: d6u-runtime-harness
        run: |
          set -euo pipefail
          tampered_lock=$(mktemp)
          cp Cargo.lock "$tampered_lock"
          python3 - "$tampered_lock" <<'PY'
          import pathlib
          import sys
          
          path = pathlib.Path(sys.argv[1])
          lines = path.read_text(encoding="utf-8").splitlines()
          inside_holochain = False
          for index, line in enumerate(lines):
              if line == "[[package]]":
                  inside_holochain = False
              elif line == 'name = "holochain"':
                  inside_holochain = True
              elif inside_holochain and line == 'version = "0.7.0"':
                  lines[index] = 'version = "0.0.0"'
                  break
          else:
              raise SystemExit("holochain lock package/version not found")
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          if python3 ../scripts/integral/verify_d6u_runtime_lock.py "$tampered_lock"; then
            echo "tampered Cargo.lock version was incorrectly accepted"
            exit 1
          fi

          cp Cargo.lock "$tampered_lock"
          python3 - "$tampered_lock" <<'PY'
          import pathlib
          import sys
          
          path = pathlib.Path(sys.argv[1])
          lines = path.read_text(encoding="utf-8").splitlines()
          inside_holochain = False
          for index, line in enumerate(lines):
              if line == "[[package]]":
                  inside_holochain = False
              elif line == 'name = "holochain"':
                  inside_holochain = True
              elif inside_holochain and line == 'source = "registry+https://github.com/rust-lang/crates.io-index"':
                  lines[index] = 'source = "registry+https://example.invalid/index"'
                  break
          else:
              raise SystemExit("holochain lock package/source not found")
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          if python3 ../scripts/integral/verify_d6u_runtime_lock.py "$tampered_lock"; then
            echo "tampered Cargo.lock registry source was incorrectly accepted"
            exit 1
          fi

          cp Cargo.lock "$tampered_lock"
          python3 - "$tampered_lock" <<'PY'
          import pathlib
          import re
          import sys
          
          path = pathlib.Path(sys.argv[1])
          lines = path.read_text(encoding="utf-8").splitlines()
          inside_holochain = False
          for index, line in enumerate(lines):
              if line == "[[package]]":
                  inside_holochain = False
              elif line == 'name = "holochain"':
                  inside_holochain = True
              elif inside_holochain and re.fullmatch(r'checksum = "[0-9a-f]{64}"', line):
                  lines[index] = 'checksum = "' + ("0" * 64) + '"'
                  break
          else:
              raise SystemExit("holochain lock package/checksum not found")
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          if python3 ../scripts/integral/verify_d6u_runtime_lock.py "$tampered_lock"; then
            echo "tampered Cargo.lock checksum was incorrectly accepted"
            exit 1
          fi
          rm -f "$tampered_lock"

      - name: Test D6U runtime boundary
        working-directory: d6u-runtime-harness
        run: |
          set -o pipefail
          cargo test --locked --test d6u_authority_boundary -- --nocapture 2>&1 | tee d6u-runtime-test.log

      - name: Clippy D6U runtime boundary
        working-directory: d6u-runtime-harness
        run: cargo clippy --locked --test d6u_authority_boundary -- -D warnings

      - name: Verify per-case runtime evidence
        if: success()
        working-directory: d6u-runtime-harness
        run: python3 ../scripts/integral/verify_d6u_runtime_evidence.py d6u-runtime-test.log

      - name: Assert evidence inputs exist
        if: success()
        working-directory: d6u-runtime-harness
        run: |
          test -s d6u-runtime-test.log
          test -s Cargo.lock

      - name: Negative-test runtime evidence verifier
        if: success()
        working-directory: d6u-runtime-harness
        run: |
          set -euo pipefail
          tampered_log=$(mktemp)
          cp d6u-runtime-test.log "$tampered_log"
          python3 - "$tampered_log" <<'PY'
          import pathlib
          import sys
          
          path = pathlib.Path(sys.argv[1])
          lines = path.read_text(encoding="utf-8").splitlines()
          for index, line in enumerate(lines):
              if line.startswith("D6U_CASE\tcanonical-payload-accepted\t"):
                  parts = line.split("\t")
                  parts[2] = "semantic-rejected"
                  lines[index] = "\t".join(parts)
                  break
          else:
              raise SystemExit("canonical acceptance evidence line not found")
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          if python3 ../scripts/integral/verify_d6u_runtime_evidence.py "$tampered_log"; then
            echo "tampered runtime evidence was incorrectly accepted"
            exit 1
          fi
          rm -f "$tampered_log"

      - name: Emit runtime evidence record
        working-directory: d6u-runtime-harness
        run: |
          set -euo pipefail
          {
            echo "D6U HOLOCHAIN 0.7 RUNTIME EVIDENCE"
            echo "status=runtime-reference-evidence"
            echo "source_commit=$(git rev-parse HEAD)"
            echo "workflow_run_id=${{ github.run_id }}"
            echo "workflow_run_attempt=${{ github.run_attempt }}"
            echo "source_branch=${SOURCE_BRANCH}"
            echo "source_repository=${{ github.event.workflow_run.head_repository.full_name }}"
            echo "trigger_workflow_run_id=${{ github.event.workflow_run.id }}"
            echo "trigger_workflow_run_attempt=${{ github.event.workflow_run.run_attempt }}"
            echo "trigger_workflow_name=${{ github.event.workflow_run.name }}"
            echo "trigger_workflow_path=${{ github.event.workflow_run.path }}"
            echo "trigger_workflow_blob_sha=$(git hash-object ../.github/workflows/d6s-canonical-qualification.yml)"
            echo "executor_run_id=${{ github.run_id }}"
            echo "executor_run_attempt=${{ github.run_attempt }}"
            echo "executor_workflow_commit_sha=${{ github.workflow_sha }}"
            echo "executor_workflow_ref=${{ github.workflow_ref }}"
            echo "executor_workflow_file_path=.github/workflows/d6u-exact-head-runtime-executor.yml"
            echo "executor_workflow_repository=${{ github.repository }}"
            echo "attestation_status=deferred-to-trusted-builder"
            echo "d6s2_manifest_git_blob_sha=$(git hash-object ../docs/integral/d6s-canon-2-manifest.json)"
            echo "d6s2_fixture_git_blob_sha=$(git hash-object ../docs/integral/d6s-canon-2-authority-boundary-fixture.json)"
            d6s2_ledger_version=$(python3 -c 'import json; print(json.load(open("../docs/integral/d6s-canon-2-manifest.json"))["version"])')
            echo "d6s2_authority_ledger_schema=v${d6s2_ledger_version}"
            echo "d6s1_corpus_sha256=$(sha256sum ../docs/integral/d6s-canon-1-golden-vectors.json | cut -d' ' -f1)"
            echo "test_log_sha256=$(sha256sum d6u-runtime-test.log | cut -d' ' -f1)"
            echo "manifest_version=$(python3 -c 'import json; print(json.load(open("../docs/integral/d6u-runtime-manifest.json"))["version"])')"
            echo "manifest_git_blob_sha=$(git hash-object ../docs/integral/d6u-runtime-manifest.json)"
            echo "evidence_verifier_git_blob_sha=$(git hash-object ../scripts/integral/verify_d6u_runtime_evidence.py)"
            echo "lock_verifier_git_blob_sha=$(git hash-object ../scripts/integral/verify_d6u_runtime_lock.py)"
            supported_case_count=$(python3 -c 'import json; print(len(json.load(open("../docs/integral/d6u-runtime-manifest.json"))["supported_reference_cases"]))')
            observed_case_count=$(grep -c '^D6U_CASE' d6u-runtime-test.log)
            supplemental_case_count=$(python3 -c 'import json; print(len(json.load(open("../docs/integral/d6u-runtime-manifest.json")).get("supplemental_substrate_checks", [])))')
            observed_supplemental_count=$(grep -c '^D6U_SUBSTRATE_CHECK' d6u-runtime-test.log)
            application_case_count=$(python3 -c 'import json; print(len(json.load(open("../docs/integral/d6u-runtime-manifest.json")).get("supplemental_application_checks", [])))')
            observed_application_count=$(grep -c '^D6U_APPLICATION_CHECK' d6u-runtime-test.log)
            echo "case_coverage=${observed_case_count}-of-${supported_case_count}"
            echo "supplemental_coverage=${observed_supplemental_count}-of-${supplemental_case_count}"
            echo "application_check_coverage=${observed_application_count}-of-${application_case_count}"
            case_outcome_classes=$(python3 -c 'import json; print(",".join(json.load(open("../docs/integral/d6u-runtime-manifest.json"))["evidence_outcome_classes"]))')
            holochain_version=$(python3 -c 'import json; print(json.load(open("../docs/integral/d6u-runtime-manifest.json"))["substrate"]["holochain"])')
            hdk_version=$(python3 -c 'import json; print(json.load(open("../docs/integral/d6u-runtime-manifest.json"))["substrate"]["hdk"])')
            hdi_version=$(python3 -c 'import json; print(json.load(open("../docs/integral/d6u-runtime-manifest.json"))["substrate"]["hdi"])')
            echo "case_outcome_classes=${case_outcome_classes}"
            echo "runtime=holochain-${holochain_version}"
            echo "hdk=${hdk_version}"
            echo "hdi=${hdi_version}"
            echo "rust=$(rustc --version)"
            echo "rust_verbose_commit=$(rustc --version --verbose | sed -n 's/^commit-hash: //p')"
            echo "cargo=$(cargo --version)"
            echo "cargo_lock_sha256=$(sha256sum Cargo.lock | cut -d' ' -f1)"
            echo "test=d6u_authority_boundary:passed"
            echo "supported_cases=${supported_case_count}"
            unsupported_case_list=$(python3 -c 'import json; print(",".join(json.load(open("../docs/integral/d6u-runtime-manifest.json"))["unsupported_reference_cases"]))')
            echo "unsupported_cases=${unsupported_case_list}"
            claim_ceiling=$(python3 -c 'import json; print(json.load(open("../docs/integral/d6u-runtime-manifest.json"))["claim_ceiling"])')
            echo "claim_ceiling=${claim_ceiling}"
          } | tee d6u-runtime-evidence.txt

      - name: Verify emitted runtime evidence record
        if: success()
        run: python3 scripts/integral/verify_d6u_runtime_record.py

      - name: Negative-test runtime record verifier
        if: success()
        working-directory: d6u-runtime-harness
        run: |
          set -euo pipefail
          backup=$(mktemp)
          cp d6u-runtime-evidence.txt "$backup"
          trap 'cp "$backup" d6u-runtime-evidence.txt; rm -f "$backup"' EXIT
          sed -i 's/^claim_ceiling=.*/claim_ceiling=qualified/' d6u-runtime-evidence.txt
          if python3 ../scripts/integral/verify_d6u_runtime_record.py; then
            echo "tampered runtime evidence record was incorrectly accepted"
            exit 1
          fi

      - name: Mark attestation as deferred to trusted builder
        if: success()
        run: echo "attestation is intentionally deferred from this PR-controlled workflow"

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: warn
          name: d6u-runtime-evidence-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            d6u-runtime-harness/d6u-runtime-evidence.txt
            d6u-runtime-harness/d6u-runtime-test.log
            d6u-runtime-harness/Cargo.lock
