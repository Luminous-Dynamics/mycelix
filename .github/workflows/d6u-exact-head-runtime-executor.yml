name: D6U Exact-Head Runtime Executor

on:
  workflow_run:
    workflows: ["D6S Canonical Qualification"]
    types: [completed]
    branches:
      - myc-int-demo-d6u-holochain-07-runtime

permissions:
  actions: read
  contents: read

concurrency:
  group: d6u-runtime-reference-${{ github.workflow_ref }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  d6u-runtime:
    name: D6U Holochain 0.7 runtime evidence
    if: >-
      github.event.workflow_run.name == 'D6S Canonical Qualification' &&
      github.event.workflow_run.path == '.github/workflows/d6s-canonical-qualification.yml' &&
      github.event.workflow_run.workflow_id == 371215723 &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.repository.full_name == github.repository &&
      github.event.repository.id == github.repository_id &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.repository.id == github.repository_id &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.id == github.repository_id &&
      github.event.workflow_run.head_branch == 'myc-int-demo-d6u-holochain-07-runtime'
    env:
      QUALIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact qualification subject
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          persist-credentials: false

      - name: Assert exact qualification subject
        run: test "$(git rev-parse HEAD)" = "${{ env.QUALIFIED_SHA }}"
      - name: Verify exact D6S qualification artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
          D6S_RUN_ID: ${{ github.event.workflow_run.id }}
          D6S_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          D6S_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          D6S_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          D6S_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          EXPECTED_ARTIFACT_NAME: d6s-canonical-reference-${{ env.QUALIFIED_SHA }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import io
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          import zipfile
          from pathlib import Path

          API_HOST = "api.github.com"
          MAX_JSON_BYTES = 8 * 1024 * 1024
          MAX_ARCHIVE_BYTES = 2 * 1024 * 1024
          MAX_MEMBER_BYTES = 256 * 1024

          class StripAuthorizationRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  redirected = super().redirect_request(req, fp, code, msg, headers, newurl)
                  if redirected is not None:
                      parsed = urllib.parse.urlsplit(newurl)
                      assert parsed.scheme == "https"
                      assert parsed.username is None and parsed.password is None
                      redirected.remove_header("Authorization")
                  return redirected

          OPENER = urllib.request.build_opener(StripAuthorizationRedirect())

          def api_get(path: str) -> dict:
              assert path.startswith("/")
              url = f"https://{API_HOST}/repos/{os.environ['GITHUB_REPOSITORY']}{path}"
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "mycelix-d6u-executor-provenance",
                  },
              )
              with OPENER.open(req, timeout=30) as response:
                  final = urllib.parse.urlsplit(response.geturl())
                  assert final.scheme == "https"
                  assert final.hostname == API_HOST
                  assert final.username is None and final.password is None
                  assert final.port in (None, 443)
                  body = response.read(MAX_JSON_BYTES + 1)
                  assert len(body) <= MAX_JSON_BYTES
                  return json.loads(body)

          def artifact_download(url: str) -> bytes:
              parsed = urllib.parse.urlsplit(url)
              assert parsed.scheme == "https"
              assert parsed.hostname == API_HOST
              assert parsed.username is None and parsed.password is None
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "mycelix-d6u-executor-provenance",
                  },
              )
              with OPENER.open(req, timeout=30) as response:
                  body = response.read(MAX_ARCHIVE_BYTES + 1)
                  assert len(body) <= MAX_ARCHIVE_BYTES
                  return body

          def sha256_bytes(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def read_record(data: bytes) -> dict[str, str]:
              assert data.startswith(b"D6S CANONICAL REFERENCE GATE\n")
              text = data.decode("utf-8")
              record: dict[str, str] = {}
              for line in text.splitlines()[1:]:
                  assert "=" in line, f"malformed record line: {line!r}"
                  key, value = line.split("=", 1)
                  assert re.fullmatch(r"[A-Za-z0-9_]+", key), f"invalid record key: {key!r}"
                  assert key not in record, f"duplicate record key: {key!r}"
                  record[key] = value
              return record

          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = int(os.environ["D6S_RUN_ID"])
          run_attempt = int(os.environ["D6S_RUN_ATTEMPT"])
          head_sha = os.environ["D6S_HEAD_SHA"]
          head_branch = os.environ["D6S_HEAD_BRANCH"]
          head_repository = os.environ["D6S_HEAD_REPOSITORY"]
          expected_name = os.environ["EXPECTED_ARTIFACT_NAME"]
          subject_workflow_blob = os.popen("git hash-object .github/workflows/d6s-canonical-qualification.yml").read().strip()

          assert head_repository == repo
          assert head_branch == "myc-int-demo-d6u-holochain-07-runtime"
          assert re.fullmatch(r"[0-9a-f]{40}", head_sha)
          assert run_id > 0 and run_attempt > 0
          assert re.fullmatch(r"[0-9a-f]{40}", subject_workflow_blob)

          name_query = urllib.parse.quote(expected_name, safe="")
          artifacts = api_get(
              f"/actions/runs/{run_id}/artifacts?per_page=100&name={name_query}"
          ).get("artifacts")
          assert isinstance(artifacts, list)
          assert len(artifacts) == 1, f"expected exactly one D6S artifact, observed {len(artifacts)}"
          artifact = artifacts[0]

          assert artifact["name"] == expected_name
          assert artifact.get("expired") is False
          assert int(artifact["size_in_bytes"]) <= MAX_MEMBER_BYTES
          artifact_run = artifact.get("workflow_run") or {}
          assert int(artifact_run["id"]) == run_id
          assert int(artifact_run["repository_id"]) == int(os.environ["GITHUB_REPOSITORY_ID"])
          assert int(artifact_run["head_repository_id"]) == int(os.environ["GITHUB_REPOSITORY_ID"])
          assert artifact_run["head_branch"] == head_branch
          assert artifact_run["head_sha"] == head_sha

          digest = artifact.get("digest", "")
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", digest)
          archive = artifact_download(artifact["archive_download_url"])
          observed_digest = sha256_bytes(archive)
          assert observed_digest == digest.split(":", 1)[1], (
              f"artifact digest mismatch: expected={digest!r} observed=sha256:{observed_digest}"
          )

          with zipfile.ZipFile(io.BytesIO(archive)) as zf:
              infos = zf.infolist()
              assert len(infos) == 1
              info = infos[0]
              assert info.filename == "d6s-canonical-reference-qualification.txt"
              assert info.file_size <= MAX_MEMBER_BYTES
              assert info.compress_type in (zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED)
              assert (info.flag_bits & 0x1) == 0, "encrypted artifact members are forbidden"
              unix_type = (info.external_attr >> 16) & 0o170000
              assert unix_type != 0o120000, "symlink artifact member is forbidden"
              data = zf.read(info)
              assert len(data) == info.file_size

          record = read_record(data)
          required = {
              "status",
              "commit",
              "workflow",
              "workflow_file_commit_sha",
              "workflow_file_blob_sha",
              "run_id",
              "run_attempt",
              "event",
              "claim_ceiling",
          }
          assert required <= set(record), (
              f"D6S provenance fields missing: expected={sorted(required)!r}, observed={sorted(record)!r}"
          )
          assert record["status"] == "reference-gate-passed"
          assert record["commit"] == head_sha
          assert record["workflow"] == "D6S Canonical Qualification"
          workflow_commit = record["workflow_file_commit_sha"]
          assert re.fullmatch(r"[0-9a-f]{40}", workflow_commit)
          assert workflow_commit == workflow_commit.lower()
          assert re.fullmatch(r"[0-9a-f]{40}", record["workflow_file_blob_sha"])
          assert record["workflow_file_blob_sha"] == subject_workflow_blob
          assert record["run_id"] == str(run_id)
          assert record["run_attempt"] == str(run_attempt)
          assert record["event"] == "pull_request"
          assert record["claim_ceiling"] == "ReferenceModelOnly"

          tree = api_get(
              f"/git/trees/{urllib.parse.quote(workflow_commit, safe='')}?recursive=1"
          )
          assert tree.get("truncated") is False
          entries = [
              entry for entry in tree.get("tree", [])
              if entry.get("path") == ".github/workflows/d6s-canonical-qualification.yml"
          ]
          assert len(entries) == 1
          workflow_entry = entries[0]
          assert workflow_entry.get("type") == "blob"
          assert workflow_entry.get("sha") == record["workflow_file_blob_sha"]

          provenance = Path(os.environ["RUNNER_TEMP"]) / "d6s-trigger-workflow-provenance.txt"
          provenance.write_text(
              "\n".join(
                  [
                      "D6S TRIGGER WORKFLOW PROVENANCE",
                      f"trigger_run_id={run_id}",
                      f"trigger_run_attempt={run_attempt}",
                      f"trigger_head_sha={head_sha}",
                      f"trigger_workflow_commit_sha={workflow_commit}",
                      f'trigger_workflow_blob_sha={record["workflow_file_blob_sha"]}',
                      f"artifact_id={artifact['id']}",
                      f"artifact_digest=sha256:{observed_digest}",
                  ]
              )
              + "\n",
              encoding="utf-8",
          )
          Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8").write(
              f"trigger_workflow_commit_sha={workflow_commit}\n"
              f"trigger_workflow_blob_sha={expected_workflow_blob}\n"
              f"d6s_artifact_id={artifact['id']}\n"
              f"d6s_artifact_digest_sha256={observed_digest}\n"
          )
          print(
              "verified D6S workflow provenance: "
              f"run={run_id} attempt={run_attempt} "
              f'workflow_commit={workflow_commit} workflow_blob={record["workflow_file_blob_sha"]}'
          )
          PY

      - name: Isolate Rust and Cargo trust roots
        run: |
          set -euo pipefail
          cargo_home="$RUNNER_TEMP/d6u-cargo-home"
          rustup_home="$RUNNER_TEMP/d6u-rustup-home"
          test ! -e "$cargo_home"
          test ! -e "$rustup_home"
          mkdir -m 700 "$cargo_home"
          mkdir -m 700 "$rustup_home"

      - name: Reject ambient Cargo and Rust overrides
        run: |
          set -euo pipefail
          forbidden=0
          while IFS='=' read -r name _; do
            case "$name" in
              RUSTC|RUSTC_WRAPPER|RUSTC_WORKSPACE_WRAPPER|RUSTDOC|RUSTDOC_WRAPPER|RUSTFLAGS|RUSTDOCFLAGS|\
              RUSTC_BOOTSTRAP|CARGO_HTTP_*|CARGO_NET_GIT_*|CARGO_PROFILE_*|\
              GIT_CONFIG_GLOBAL|GIT_CONFIG_SYSTEM|GIT_CONFIG_NOSYSTEM|GIT_SSH_COMMAND|GIT_PROXY_COMMAND|\
              CARGO_BUILD_RUSTC|CARGO_BUILD_RUSTFLAGS|CARGO_ENCODED_RUSTFLAGS|CARGO_BUILD_RUSTDOCFLAGS|\
              CARGO_ENCODED_RUSTDOCFLAGS|CARGO_BUILD_TARGET|CARGO_NET_OFFLINE|CARGO_NET_GIT_FETCH_WITH_CLI|\
              CARGO_TARGET_DIR|CARGO_TARGET_*_RUNNER|CARGO_TARGET_*_LINKER|CARGO_TARGET_*_RUSTFLAGS|\
              CARGO_TARGET_*_RUSTDOCFLAGS|CARGO_REGISTRY_TOKEN|CARGO_REGISTRIES_*_TOKEN|CARGO_REGISTRIES_*_INDEX|\
              RUSTUP_HOME|RUSTUP_TOOLCHAIN|RUSTUP_DIST_SERVER|RUSTUP_UPDATE_ROOT|\
              CARGO_REGISTRIES_*_CREDENTIAL_PROVIDER)
                echo "forbidden ambient Cargo/Rust environment: $name"
                forbidden=1
                ;;
            esac
          done < <(env)
          test "$forbidden" -eq 0

      - name: Require preinstalled rustup
        env:
          CARGO_HOME: ${{ runner.temp }}/d6u-cargo-home
          RUSTUP_HOME: ${{ runner.temp }}/d6u-rustup-home
        run: |
          set -euo pipefail
          rustup_path="$(command -v rustup)"
          test -n "$rustup_path"
          test -x "$rustup_path"
          case "$rustup_path" in
            "$GITHUB_WORKSPACE"/*)
              echo "rustup path unexpectedly resides in the PR workspace" >&2
              exit 1
              ;;
          esac
          rustup --version

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        env:
          CARGO_HOME: ${{ runner.temp }}/d6u-cargo-home
          RUSTUP_HOME: ${{ runner.temp }}/d6u-rustup-home
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Recheck ambient toolchain state after Rust setup
        run: |
          set -euo pipefail
          forbidden=0
          while IFS='=' read -r name _; do
            case "$name" in
              RUSTC|RUSTC_WRAPPER|RUSTC_WORKSPACE_WRAPPER|RUSTDOC|RUSTDOC_WRAPPER|RUSTFLAGS|RUSTDOCFLAGS|\
              RUSTC_BOOTSTRAP|CARGO_HTTP_*|CARGO_NET_GIT_*|CARGO_PROFILE_*|\
              CARGO_BUILD_RUSTC|CARGO_BUILD_RUSTFLAGS|CARGO_ENCODED_RUSTFLAGS|CARGO_BUILD_RUSTDOCFLAGS|\
              CARGO_ENCODED_RUSTDOCFLAGS|CARGO_BUILD_TARGET|CARGO_NET_OFFLINE|\
              CARGO_TARGET_DIR|CARGO_TARGET_*_RUNNER|CARGO_TARGET_*_LINKER|CARGO_TARGET_*_RUSTFLAGS|\
              CARGO_TARGET_*_RUSTDOCFLAGS|CARGO_REGISTRY_TOKEN|CARGO_REGISTRIES_*_TOKEN|CARGO_REGISTRIES_*_INDEX|\
              RUSTUP_TOOLCHAIN|RUSTUP_DIST_SERVER|RUSTUP_UPDATE_ROOT|RUSTUP_INIT_SKIP_PATH_CHECK|RUSTUP_NO_UPDATE_NOTIFIER|\
              GIT_CONFIG_GLOBAL|GIT_CONFIG_SYSTEM|GIT_CONFIG_NOSYSTEM|GIT_SSH_COMMAND|GIT_PROXY_COMMAND)
                echo "forbidden ambient toolchain environment after setup: $name"
                forbidden=1
                ;;
            esac
          done < <(env)
          test "$forbidden" -eq 0
          test "$CARGO_HOME" = "${{ runner.temp }}/d6u-cargo-home"
          test "$RUSTUP_HOME" = "${{ runner.temp }}/d6u-rustup-home"

      - name: Assert Rust identity
        id: rust_identity
        env:
          CARGO_HOME: ${{ runner.temp }}/d6u-cargo-home
          RUSTUP_HOME: ${{ runner.temp }}/d6u-rustup-home
        run: |
          set -euo pipefail
          rust_version="$(rustc +1.96.1 --version)"
          test "$(printf '%s\n' "$rust_version" | awk '{print $2}')" = "1.96.1"
          rust_verbose_commit="$(rustc +1.96.1 --version --verbose | sed -n 's/^commit-hash: //p')"
          test "$rust_verbose_commit" = "31fca3adb283cc9dfd56b49cdee9a96eb9c96ffd"
          rustfmt_version="$(rustfmt +1.96.1 --version)"
          cargo_version="$(cargo +1.96.1 --version)"
          {
            echo "rust_version=$rust_version"
            echo "rust_verbose_commit=$rust_verbose_commit"
            echo "rustfmt_version=$rustfmt_version"
            echo "cargo_version=$cargo_version"
          } >> "$GITHUB_OUTPUT"
      - name: Assert isolated Rust and Cargo trust roots
        run: |
          set -euo pipefail
          test -d "${{ runner.temp }}/d6u-cargo-home"
          test -d "${{ runner.temp }}/d6u-rustup-home"
          test ! -e "${{ runner.temp }}/d6u-cargo-home/config"
          test ! -e "${{ runner.temp }}/d6u-cargo-home/config.toml"

      - name: Isolate Cargo working directory
        run: |
          set -euo pipefail
          cargo_cwd="$RUNNER_TEMP/d6u-cargo-cwd"
          test ! -e "$cargo_cwd"
          mkdir -m 700 "$cargo_cwd"
          probe="$cargo_cwd"
          while [ "$probe" != "/" ]; do
            test ! -e "$probe/.cargo/config"
            test ! -e "$probe/.cargo/config.toml"
            probe="$(dirname "$probe")"
          done

      - name: Parse D6U manifest data
        run: |
          set -euo pipefail
          jq -e '
            type == "object" and
            (.version | type == "number") and
            (.claim_ceiling | type == "string") and
            (.supported_reference_cases | type == "array") and
            (.unsupported_reference_cases | type == "array") and
            (.evidence_outcome_classes | type == "array") and
            (.substrate | type == "object") and
            (.substrate.holochain | type == "string") and
            (.substrate.hdk | type == "string") and
            (.substrate.hdi | type == "string")
          ' docs/integral/d6u-runtime-manifest.json >/dev/null

      - name: Assert isolated Cargo configuration
        run: |
          set -euo pipefail
          test ! -e "${{ runner.temp }}/d6u-cargo-home/config"
          test ! -e "${{ runner.temp }}/d6u-cargo-home/config.toml"

      - name: Generate dependency graph
        working-directory: ${{ runner.temp }}/d6u-cargo-cwd
        env:
          GIT_CONFIG_NOSYSTEM: 1
          GIT_CONFIG_GLOBAL: /dev/null
          RUSTUP_HOME: ${{ runner.temp }}/d6u-rustup-home
          CARGO_HOME: ${{ runner.temp }}/d6u-cargo-home
        run: cargo +1.96.1 generate-lockfile --manifest-path "${{ github.workspace }}/d6u-runtime-harness/Cargo.toml"
      - name: Capture generated dependency graph identity
        id: generated_graph
        working-directory: ${{ runner.temp }}/d6u-cargo-cwd
        env:
          GIT_CONFIG_NOSYSTEM: 1
          GIT_CONFIG_GLOBAL: /dev/null
          RUSTUP_HOME: ${{ runner.temp }}/d6u-rustup-home
          CARGO_HOME: ${{ runner.temp }}/d6u-cargo-home
        run: |
          set -euo pipefail
          lock_sha="$(sha256sum "${{ github.workspace }}/d6u-runtime-harness/Cargo.lock" | cut -d' ' -f1)"
          printf '%s\n' "$lock_sha" | grep -Eq '^[0-9a-f]{64}$'
          metadata_path="$(mktemp "$RUNNER_TEMP/d6u-cargo-metadata-generated.XXXXXX")"
          trap 'rm -f "$metadata_path"' EXIT
          cargo +1.96.1 metadata --format-version 1 --locked --manifest-path "${{ github.workspace }}/d6u-runtime-harness/Cargo.toml" > "$metadata_path"

          metadata_sha="$(sha256sum "$metadata_path" | cut -d' ' -f1)"
          printf '%s\n' "$metadata_sha" | grep -Eq '^[0-9a-f]{64}$'
          {
            echo "lock_sha=$lock_sha"
            echo "metadata_sha=$metadata_sha"
          } >> "$GITHUB_OUTPUT"
          test ! -s "$GITHUB_ENV"
          test ! -s "$GITHUB_PATH"
      - name: Fetch locked dependency sources
        working-directory: ${{ runner.temp }}/d6u-cargo-cwd
        env:
          GIT_CONFIG_NOSYSTEM: 1
          GIT_CONFIG_GLOBAL: /dev/null
          RUSTUP_HOME: ${{ runner.temp }}/d6u-rustup-home
          CARGO_HOME: ${{ runner.temp }}/d6u-cargo-home
        run: cargo +1.96.1 fetch --locked --manifest-path "${{ github.workspace }}/d6u-runtime-harness/Cargo.toml"

      - name: Prepare pinned Rust compiler container
        id: compiler_image
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/d6u-docker-config
          D6U_COMPILER_IMAGE: rust@sha256:d8f0d5c09580253ecdd6d6894ff112b2b760683ff2a74585e5189f2578728ce4
          EXPECTED_RUST_COMMIT: ${{ steps.rust_identity.outputs.rust_verbose_commit }}
          TOOLCHAIN_ROOT: ${{ runner.temp }}/d6u-rustup-home/toolchains/1.96.1-x86_64-unknown-linux-gnu
        run: |
          set -euo pipefail
          docker_config="$RUNNER_TEMP/d6u-docker-config"
          test ! -e "$docker_config"
          mkdir -m 700 "$docker_config"
          forbidden=0
          while IFS='=' read -r name _; do
            case "$name" in
              DOCKER_HOST|DOCKER_CONTEXT|DOCKER_TLS_VERIFY|DOCKER_CERT_PATH|DOCKER_CUSTOM_HEADERS|DOCKER_API_VERSION|DOCKER_DEFAULT_PLATFORM|BUILDKIT_HOST|CONTAINER_HOST)
                echo "forbidden ambient Docker override: $name" >&2
                forbidden=1
                ;;
            esac
          done < <(env)
          test "$forbidden" -eq 0
          for tool in cargo cargo-clippy clippy-driver rustc rustfmt; do
            test -f "$TOOLCHAIN_ROOT/bin/$tool"
            test ! -L "$TOOLCHAIN_ROOT/bin/$tool"
            test -x "$TOOLCHAIN_ROOT/bin/$tool"
          done
          toolchain_manifest="$RUNNER_TEMP/d6u-toolchain-manifest.sha256"
          test -z "$(find "$TOOLCHAIN_ROOT" -type l -print -quit)"
          (
            cd "$TOOLCHAIN_ROOT"
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > "$toolchain_manifest"
          test -s "$toolchain_manifest"
          docker --context default pull --platform linux/amd64 "$D6U_COMPILER_IMAGE"
          observed="$(docker --context default image inspect "$D6U_COMPILER_IMAGE" --format '{{index .RepoDigests 0}}')"
          test "$observed" = "$D6U_COMPILER_IMAGE"
          test "$EXPECTED_RUST_COMMIT" = "31fca3adb283cc9dfd56b49cdee9a96eb9c96ffd"
          docker --context default run --rm --pull=never --init \
            --platform linux/amd64 --network none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --pids-limit 64 --ulimit nofile=1024:1024 \
            --ulimit core=0 --memory 2g --tmpfs /tmp:rw,nosuid,nodev,noexec,size=1g \
            --mount type=bind,src="$TOOLCHAIN_ROOT",dst=/toolchain,readonly \
            --mount type=bind,src="$toolchain_manifest",dst=/toolchain-manifest,readonly \
            --env PATH=/toolchain/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --env EXPECTED_RUST_COMMIT="$EXPECTED_RUST_COMMIT" "$D6U_COMPILER_IMAGE" \
            sh -eu -c '
              test "$(rustc --version | awk "{print \$2}")" = "1.96.1";
              test "$(rustc --version --verbose | sed -n "s/^commit-hash: //p")" = "$EXPECTED_RUST_COMMIT";
              test "$(cargo --version | awk "{print \$2}")" = "1.96.1";
              test -x /toolchain/bin/cargo-clippy;
              test -x /toolchain/bin/clippy-driver;
              cd /toolchain/bin; sha256sum -c /toolchain-manifest;
              test ! -e /var/run/docker.sock;
              test "$(grep -E "^CapEff:" /proc/self/status | awk "{print \$2}")" = "0000000000000000";
              test "$(grep -E "^CapBnd:" /proc/self/status | awk "{print \$2}")" = "0000000000000000";
              test "$(grep -E "^NoNewPrivs:" /proc/self/status | awk "{print \$2}")" = "1";
              test "$(grep -E "^Seccomp:" /proc/self/status | awk "{print \$2}")" = "2";
            '
          mkdir -m 700 "$RUNNER_TEMP/d6u-container-target"
          mkdir -m 700 "$RUNNER_TEMP/d6u-container-output"
          echo "image=$D6U_COMPILER_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Check formatting inside pinned compiler container
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/d6u-docker-config
          D6U_COMPILER_IMAGE: ${{ steps.compiler_image.outputs.image }}
        run: |
          set -euo pipefail
          docker --context default run --rm --pull=never --init \
            --platform linux/amd64 --network none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --pids-limit 64 --ulimit nofile=1024:1024 \
            --ulimit core=0 --memory 2g --tmpfs /tmp:rw,nosuid,nodev,noexec,size=1g \
            --mount type=bind,src="${{ github.workspace }}",dst=/workspace,readonly \
            --mount type=bind,src="${{ runner.temp }}/d6u-cargo-home",dst=/cargo-home,readonly \
            --mount type=bind,src="${{ runner.temp }}/d6u-rustup-home/toolchains/1.96.1-x86_64-unknown-linux-gnu",dst=/toolchain,readonly \
            --workdir /workspace/d6u-runtime-harness \
            --user "$(id -u):$(id -g)" \
            --env PATH=/toolchain/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --env HOME=/tmp --env TMPDIR=/tmp --env CARGO_HOME=/cargo-home \
            --env CARGO_NET_OFFLINE=true --env GIT_CONFIG_NOSYSTEM=1 --env GIT_CONFIG_GLOBAL=/dev/null \
            --env GIT_TERMINAL_PROMPT=0 --env GITHUB_WORKSPACE=/workspace "$D6U_COMPILER_IMAGE" \
            /toolchain/bin/cargo fmt --all --manifest-path /workspace/d6u-runtime-harness/Cargo.toml -- --check
      - name: Gate compiler image on critical/high CVEs
        env:
          D6U_COMPILER_IMAGE: ${{ steps.compiler_image.outputs.image }}
        run: |
          set -euo pipefail
          command -v docker
          docker scout version
          docker scout cves "$D6U_COMPILER_IMAGE" --only-severity critical,high --exit-code
      - name: Capture runtime source integrity
        id: runtime_source
        working-directory: d6u-runtime-harness
        run: |
          set -euo pipefail
          digest_input="$(mktemp "$RUNNER_TEMP/d6u-runtime-source-hashes.XXXXXX")"
          trap 'rm -f "$digest_input"' EXIT
          sha256sum \
            Cargo.toml \
            rust-toolchain.toml \
            src/lib.rs \
            tests/d6u_authority_boundary.rs \
            ../docs/integral/d6u-runtime-manifest.json \
            ../docs/integral/d6s-canon-2-manifest.json \
            ../docs/integral/d6s-canon-2-authority-boundary-fixture.json \
            ../docs/integral/d6s-canon-1-golden-vectors.json \
            ../scripts/integral/verify_d6u_runtime_evidence.py \
            ../scripts/integral/verify_d6u_runtime_record.py \
            ../scripts/integral/verify_d6u_runtime_lock.py \
            ../.github/workflows/d6s-canonical-qualification.yml \
            > "$digest_input"
          source_sha="$(sha256sum "$digest_input" | cut -d' ' -f1)"
          printf '%s\n' "$source_sha" | grep -Eq '^[0-9a-f]{64}$'
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Clippy D6U runtime boundary inside pinned compiler container
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/d6u-docker-config
          D6U_COMPILER_IMAGE: ${{ steps.compiler_image.outputs.image }}
        run: |
          set -euo pipefail
          test ! -s "$GITHUB_ENV"
          test ! -s "$GITHUB_PATH"
          docker --context default run --rm --pull=never --init \
            --platform linux/amd64 --network none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --pids-limit 128 --ulimit nofile=2048:2048 \
            --ulimit core=0 --memory 8g --tmpfs /tmp:rw,nosuid,nodev,noexec,size=2g \
            --mount type=bind,src="${{ github.workspace }}",dst=/workspace,readonly \
            --mount type=bind,src="${{ runner.temp }}/d6u-cargo-home",dst=/cargo-home,readonly \
            --mount type=bind,src="${{ runner.temp }}/d6u-container-target",dst=/target,rw \
            --mount type=bind,src="${{ runner.temp }}/d6u-rustup-home/toolchains/1.96.1-x86_64-unknown-linux-gnu",dst=/toolchain,readonly \
            --workdir /workspace/d6u-runtime-harness --user "$(id -u):$(id -g)" \
            --env PATH=/toolchain/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --env HOME=/tmp --env TMPDIR=/tmp --env CARGO_HOME=/cargo-home --env CARGO_TARGET_DIR=/target \
            --env CARGO_NET_OFFLINE=true --env GIT_CONFIG_NOSYSTEM=1 --env GIT_CONFIG_GLOBAL=/dev/null \
            --env GIT_TERMINAL_PROMPT=0 --env GITHUB_WORKSPACE=/workspace "$D6U_COMPILER_IMAGE" \
            /toolchain/bin/cargo clippy --locked --offline --test d6u_authority_boundary --manifest-path /workspace/d6u-runtime-harness/Cargo.toml -- -D warnings
          test ! -s "$GITHUB_ENV"
          test ! -s "$GITHUB_PATH"

      - name: Assert pre-runtime inputs after clippy
        if: success()
        working-directory: d6u-runtime-harness
        env:
          EXPECTED_LOCK_SHA: ${{ steps.generated_graph.outputs.lock_sha }}
          EXPECTED_SOURCE_SHA: ${{ steps.runtime_source.outputs.source_sha }}
        run: |
          set -euo pipefail
          probe="${{ runner.temp }}/d6u-cargo-cwd"
          while [ "$probe" != "/" ]; do
            test ! -e "$probe/.cargo/config"
            test ! -e "$probe/.cargo/config.toml"
            probe="$(dirname "$probe")"
          done

          test "$(sha256sum Cargo.lock | cut -d' ' -f1)" = "$EXPECTED_LOCK_SHA"
          digest_input="$(mktemp "$RUNNER_TEMP/d6u-runtime-source-hashes-after-clippy.XXXXXX")"
          trap 'rm -f "$digest_input"' EXIT
          sha256sum \
            Cargo.toml \
            rust-toolchain.toml \
            src/lib.rs \
            tests/d6u_authority_boundary.rs \
            ../docs/integral/d6u-runtime-manifest.json \
            ../docs/integral/d6s-canon-2-manifest.json \
            ../docs/integral/d6s-canon-2-authority-boundary-fixture.json \
            ../docs/integral/d6s-canon-1-golden-vectors.json \
            ../scripts/integral/verify_d6u_runtime_evidence.py \
            ../scripts/integral/verify_d6u_runtime_record.py \
            ../scripts/integral/verify_d6u_runtime_lock.py \
            ../.github/workflows/d6s-canonical-qualification.yml \
            > "$digest_input"
          test "$(sha256sum "$digest_input" | cut -d' ' -f1)" = "$EXPECTED_SOURCE_SHA"

      - name: Assert isolated Cargo configuration after clippy
        if: success()
        run: |
          set -euo pipefail
          test ! -e "${{ runner.temp }}/d6u-cargo-home/config"
          test ! -e "${{ runner.temp }}/d6u-cargo-home/config.toml"

      - name: Build immutable D6U runtime test binary inside pinned compiler container
        id: runtime_binary
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/d6u-docker-config
          D6U_COMPILER_IMAGE: ${{ steps.compiler_image.outputs.image }}
        run: |
          set -euo pipefail
          json_path="${{ runner.temp }}/d6u-container-output/d6u-runtime-artifacts.json"
          binary_path="${{ runner.temp }}/d6u-runtime-test-binary"
          rm -f "$json_path" "$binary_path"
          test ! -s "$GITHUB_ENV"
          test ! -s "$GITHUB_PATH"
          docker --context default run --rm --pull=never --init \
            --platform linux/amd64 --network none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --pids-limit 512 --ulimit nofile=4096:4096 \
            --ulimit core=0 --memory 8g --memory-swap 8g \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=2g --tmpfs /run:rw,nosuid,nodev,size=256m \
            --mount type=bind,src="${{ github.workspace }}",dst=/workspace,readonly \
            --mount type=bind,src="${{ runner.temp }}/d6u-cargo-home",dst=/cargo-home,readonly \
            --mount type=bind,src="${{ runner.temp }}/d6u-container-target",dst=/target,rw \
            --mount type=bind,src="${{ runner.temp }}/d6u-container-output",dst=/output,rw \
            --mount type=bind,src="${{ runner.temp }}/d6u-rustup-home/toolchains/1.96.1-x86_64-unknown-linux-gnu",dst=/toolchain,readonly \
            --workdir /workspace/d6u-runtime-harness --user "$(id -u):$(id -g)" \
            --env PATH=/toolchain/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --env HOME=/tmp --env TMPDIR=/tmp --env CARGO_HOME=/cargo-home --env CARGO_TARGET_DIR=/target \
            --env CARGO_NET_OFFLINE=true --env GIT_CONFIG_NOSYSTEM=1 --env GIT_CONFIG_GLOBAL=/dev/null \
            --env GIT_TERMINAL_PROMPT=0 --env GITHUB_WORKSPACE=/workspace "$D6U_COMPILER_IMAGE" \
            /toolchain/bin/cargo test --locked --offline --no-run --message-format=json-render-diagnostics \
            --test d6u_authority_boundary --manifest-path /workspace/d6u-runtime-harness/Cargo.toml > /output/d6u-runtime-artifacts.json
          test -s "$json_path"
          mapfile -t executables < <(
            jq -r '. | select(.reason == "compiler-artifact" and .target.name == "d6u_authority_boundary" and (.target.kind | index("test")) != null and .executable != null) | .executable' "$json_path"
          )
          test "${#executables[@]}" -eq 1
          source_binary="${executables[0]}"
          test -x "$source_binary"
          case "$source_binary" in
            /target/*) ;;
            *) echo "test executable escaped isolated compiler target" >&2; exit 1 ;;
          esac
          source_sha="$(sha256sum "$source_binary" | cut -d' ' -f1)"
          cp --reflink=auto "$source_binary" "$binary_path"
          chmod 555 "$binary_path"
          test "$source_sha" = "$(sha256sum "$binary_path" | cut -d' ' -f1)"
          printf '%s\n' "$source_sha" | grep -Eq '^[0-9a-f]{64}$'
          echo "binary_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Assert runtime inputs after test binary build
        if: success()
        working-directory: d6u-runtime-harness
        env:
          EXPECTED_LOCK_SHA: ${{ steps.generated_graph.outputs.lock_sha }}
          EXPECTED_SOURCE_SHA: ${{ steps.runtime_source.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(sha256sum Cargo.lock | cut -d' ' -f1)" = "$EXPECTED_LOCK_SHA"
          digest_input="$(mktemp "$RUNNER_TEMP/d6u-runtime-source-hashes-after-build.XXXXXX")"
          trap 'rm -f "$digest_input"' EXIT
          sha256sum \
            Cargo.toml \
            rust-toolchain.toml \
            src/lib.rs \
            tests/d6u_authority_boundary.rs \
            ../docs/integral/d6u-runtime-manifest.json \
            ../docs/integral/d6s-canon-2-manifest.json \
            ../docs/integral/d6s-canon-2-authority-boundary-fixture.json \
            ../scripts/integral/verify_d6u_runtime_evidence.py \
            ../scripts/integral/verify_d6u_runtime_record.py \
            ../scripts/integral/verify_d6u_runtime_lock.py \
            ../.github/workflows/d6s-canonical-qualification.yml \
            > "$digest_input"
          test "$(sha256sum "$digest_input" | cut -d' ' -f1)" = "$EXPECTED_SOURCE_SHA"
          probe="${{ runner.temp }}/d6u-cargo-cwd"
          while [ "$probe" != "/" ]; do
            test ! -e "$probe/.cargo/config"
            test ! -e "$probe/.cargo/config.toml"
            probe="$(dirname "$probe")"
          done
          test ! -e "${{ runner.temp }}/d6u-cargo-home/config"
          test ! -e "${{ runner.temp }}/d6u-cargo-home/config.toml"

      - name: Isolate Docker client state
        run: |
          set -euo pipefail
          docker_config="$RUNNER_TEMP/d6u-docker-config"
          test ! -e "$docker_config"
          mkdir -m 700 "$docker_config"

      - name: Reject ambient Docker overrides
        run: |
          set -euo pipefail
          forbidden=0
          while IFS='=' read -r name _; do
            case "$name" in
              DOCKER_HOST|DOCKER_CONTEXT|DOCKER_TLS_VERIFY|DOCKER_CERT_PATH|DOCKER_CUSTOM_HEADERS|DOCKER_API_VERSION|\
              DOCKER_DEFAULT_PLATFORM|BUILDKIT_HOST|CONTAINER_HOST)
                echo "forbidden ambient Docker override: $name" >&2
                forbidden=1
                ;;
            esac
          done < <(env)
          test "$forbidden" -eq 0

      - name: Prepare isolated runtime container image
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/d6u-docker-config
        run: |
          set -euo pipefail
          docker --context default pull --platform linux/amd64 ubuntu@sha256:f610ab94648195aa356059f5b41d6085c9d4d903c072430cdd1af7bdb646106b
          docker --context default image inspect ubuntu@sha256:f610ab94648195aa356059f5b41d6085c9d4d903c072430cdd1af7bdb646106b \
            --format '{{index .RepoDigests 0}}' \
            | grep -Fx 'ubuntu@sha256:f610ab94648195aa356059f5b41d6085c9d4d903c072430cdd1af7bdb646106b'
      - name: Verify runtime container isolation controls
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/d6u-docker-config
        run: |
          set -euo pipefail
          docker --context default run --rm --pull=never --init \
            --platform linux/amd64 \
            --network none \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit 32 \
            --ulimit nofile=256:256 \
            --ulimit core=0 \
            --memory 512m \
            --tmpfs /tmp:rw,nosuid,nodev,size=2g \
            --env HOME=/tmp \
            --env TMPDIR=/tmp \
            ubuntu@sha256:f610ab94648195aa356059f5b41d6085c9d4d903c072430cdd1af7bdb646106b \
            sh -c 'test "$(cat /proc/sys/kernel/osrelease)" != ""; test -e /sys/class/net/lo; test ! -e /var/run/docker.sock; test -w /tmp; ! touch /etc/d6u-host-write-probe'

      - name: Test D6U runtime boundary
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/d6u-docker-config
          TEST_BINARY_SHA: ${{ steps.runtime_binary.outputs.binary_sha }}
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/d6u-runtime-output"
          mkdir -m 700 "$output_dir"
          test ! -e "$output_dir/d6u-runtime-test.log"
          test "$TEST_BINARY_SHA" = "$(sha256sum "${{ runner.temp }}/d6u-runtime-test-binary" | cut -d' ' -f1)"
          docker --context default run --rm --pull=never --init \
            --platform linux/amd64 \
            --network none \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit 512 \
            --ulimit nofile=4096:4096 \
            --ulimit core=0 \
            --memory 8g \
            --memory-swap 8g \
            --tmpfs /tmp:rw,nosuid,nodev,size=2g \
            --tmpfs /run:rw,nosuid,nodev,size=256m \
            --mount type=bind,src="${{ github.workspace }}",dst="${{ github.workspace }}",readonly \
            --mount type=bind,src="${{ runner.temp }}/d6u-runtime-test-binary",dst=/d6u-runtime-test,readonly \
            --workdir "${{ github.workspace }}/d6u-runtime-harness" \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env TMPDIR=/tmp \
            ubuntu@sha256:f610ab94648195aa356059f5b41d6085c9d4d903c072430cdd1af7bdb646106b \
            /d6u-runtime-test --nocapture 2>&1 | tee "$output_dir/d6u-runtime-test.log"
          test -s "$output_dir/d6u-runtime-test.log"
          cp "$output_dir/d6u-runtime-test.log" "${{ github.workspace }}/d6u-runtime-harness/d6u-runtime-test.log"

      - name: Assert runtime inputs after runtime test
        if: success()
        working-directory: d6u-runtime-harness
        env:
          EXPECTED_LOCK_SHA: ${{ steps.generated_graph.outputs.lock_sha }}
          EXPECTED_SOURCE_SHA: ${{ steps.runtime_source.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(sha256sum Cargo.lock | cut -d' ' -f1)" = "$EXPECTED_LOCK_SHA"
          digest_input="$(mktemp "$RUNNER_TEMP/d6u-runtime-source-hashes-after.XXXXXX")"
          trap 'rm -f "$digest_input"' EXIT
          sha256sum \
            Cargo.toml \
            rust-toolchain.toml \
            src/lib.rs \
            tests/d6u_authority_boundary.rs \
            ../docs/integral/d6u-runtime-manifest.json \
            ../docs/integral/d6s-canon-2-manifest.json \
            ../docs/integral/d6s-canon-2-authority-boundary-fixture.json \
            ../docs/integral/d6s-canon-1-golden-vectors.json \
            ../scripts/integral/verify_d6u_runtime_evidence.py \
            ../scripts/integral/verify_d6u_runtime_record.py \
            ../scripts/integral/verify_d6u_runtime_lock.py \
            ../.github/workflows/d6s-canonical-qualification.yml \
            > "$digest_input"
          test "$(sha256sum "$digest_input" | cut -d' ' -f1)" = "$EXPECTED_SOURCE_SHA"
          test ! -e "${{ runner.temp }}/d6u-cargo-home/config"
          test ! -e "${{ runner.temp }}/d6u-cargo-home/config.toml"
      - name: Assert evidence inputs exist
        if: success()
        working-directory: d6u-runtime-harness
        run: |
          test -s d6u-runtime-test.log
          test -s Cargo.lock

      - name: Emit runtime evidence record
        working-directory: d6u-runtime-harness
        run: |
          set -euo pipefail
          {
            echo "D6U HOLOCHAIN 0.7 RUNTIME EVIDENCE"
            echo "status=runtime-reference-evidence"
            echo "source_commit=${{ github.event.workflow_run.head_sha }}"
            echo "workflow_run_id=${{ github.run_id }}"
            echo "workflow_run_attempt=${{ github.run_attempt }}"
            echo "source_branch=${{ github.event.workflow_run.head_branch }}"
            echo "source_repository=${{ github.event.workflow_run.head_repository.full_name }}"
            echo "trigger_workflow_run_id=${{ github.event.workflow_run.id }}"
            echo "trigger_workflow_run_attempt=${{ github.event.workflow_run.run_attempt }}"
            echo "trigger_workflow_name=${{ github.event.workflow_run.name }}"
            echo "trigger_workflow_path=${{ github.event.workflow_run.path }}"
            echo "trigger_workflow_blob_sha=$(git hash-object ../.github/workflows/d6s-canonical-qualification.yml)"
            echo "executor_run_id=${{ github.run_id }}"
            echo "executor_run_attempt=${{ github.run_attempt }}"
            echo "executor_workflow_commit_sha=${{ github.workflow_sha }}"
            echo "executor_workflow_ref=${{ github.workflow_ref }}"
            echo "executor_workflow_file_path=.github/workflows/d6u-exact-head-runtime-executor.yml"
            echo "executor_workflow_repository=${{ github.repository }}"
            echo "attestation_status=deferred-to-trusted-builder"
            echo "d6s2_manifest_git_blob_sha=$(git hash-object ../docs/integral/d6s-canon-2-manifest.json)"
            echo "d6s2_fixture_git_blob_sha=$(git hash-object ../docs/integral/d6s-canon-2-authority-boundary-fixture.json)"
            d6s2_ledger_version="$(jq -er ".version | tostring" ../docs/integral/d6s-canon-2-manifest.json)"
            echo "d6s2_authority_ledger_schema=v${d6s2_ledger_version}"
            echo "d6s1_corpus_sha256=$(sha256sum ../docs/integral/d6s-canon-1-golden-vectors.json | cut -d' ' -f1)"
            echo "test_log_sha256=$(sha256sum d6u-runtime-test.log | cut -d' ' -f1)"
            echo "manifest_version=$(jq -er ".version | tostring" ../docs/integral/d6u-runtime-manifest.json)"
            echo "manifest_git_blob_sha=$(git hash-object ../docs/integral/d6u-runtime-manifest.json)"
            echo "evidence_verifier_git_blob_sha=$(git hash-object ../scripts/integral/verify_d6u_runtime_evidence.py)"
            echo "lock_verifier_git_blob_sha=$(git hash-object ../scripts/integral/verify_d6u_runtime_lock.py)"
            supported_case_count="$(jq -er ".supported_reference_cases | length | tostring" ../docs/integral/d6u-runtime-manifest.json)"
            observed_case_count=$(grep -c '^D6U_CASE' d6u-runtime-test.log)
            supplemental_case_count="$(jq -er ".supplemental_substrate_checks // [] | length | tostring" ../docs/integral/d6u-runtime-manifest.json)"
            observed_supplemental_count=$(grep -c '^D6U_SUBSTRATE_CHECK' d6u-runtime-test.log)
            application_case_count="$(jq -er ".supplemental_application_checks // [] | length | tostring" ../docs/integral/d6u-runtime-manifest.json)"
            observed_application_count=$(grep -c '^D6U_APPLICATION_CHECK' d6u-runtime-test.log)
            echo "case_coverage=${observed_case_count}-of-${supported_case_count}"
            echo "supplemental_coverage=${observed_supplemental_count}-of-${supplemental_case_count}"
            echo "application_check_coverage=${observed_application_count}-of-${application_case_count}"
            case_outcome_classes="$(jq -er ".evidence_outcome_classes | join(",")" ../docs/integral/d6u-runtime-manifest.json)"
            holochain_version="$(jq -er ".substrate.holochain" ../docs/integral/d6u-runtime-manifest.json)"
            hdk_version="$(jq -er ".substrate.hdk" ../docs/integral/d6u-runtime-manifest.json)"
            hdi_version="$(jq -er ".substrate.hdi" ../docs/integral/d6u-runtime-manifest.json)"
            echo "case_outcome_classes=${case_outcome_classes}"
            echo "runtime=holochain-${holochain_version}"
            echo "hdk=${hdk_version}"
            echo "hdi=${hdi_version}"
            echo "rust=${{ steps.rust_identity.outputs.rust_version }}"
            echo "rust_verbose_commit=${{ steps.rust_identity.outputs.rust_verbose_commit }}"
            echo "cargo=${{ steps.rust_identity.outputs.cargo_version }}"
            echo "cargo_lock_sha256=${{ steps.generated_graph.outputs.lock_sha }}"
            echo "test=d6u_authority_boundary:passed"
            echo "supported_cases=${supported_case_count}"
            unsupported_case_list="$(jq -er ".unsupported_reference_cases | join(",")" ../docs/integral/d6u-runtime-manifest.json)"
            echo "unsupported_cases=${unsupported_case_list}"
            claim_ceiling="$(jq -er ".claim_ceiling" ../docs/integral/d6u-runtime-manifest.json)"
            echo "claim_ceiling=${claim_ceiling}"
          } | tee d6u-runtime-evidence.txt

      - name: Mark attestation as deferred to trusted builder
        if: success()
        run: echo "attestation is intentionally deferred from this PR-controlled workflow"

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: warn
          name: d6u-runtime-evidence-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            d6u-runtime-harness/d6u-runtime-evidence.txt
            d6u-runtime-harness/d6u-runtime-test.log
            d6u-runtime-harness/Cargo.lock
