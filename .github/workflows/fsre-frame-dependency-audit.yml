name: FSRE frame dependency audit

on:
  pull_request:
    paths:
      - 'tools/fsre-frame-dependency-audit/**'
      - 'research/fsre/SOURCE_FRAME_DEPENDENCY_AUDIT_BENCHMARK_V0_1.md'
      - '.github/workflows/fsre-frame-dependency-audit.yml'
  push:
    branches: [main]
    paths:
      - 'tools/fsre-frame-dependency-audit/**'
      - 'research/fsre/SOURCE_FRAME_DEPENDENCY_AUDIT_BENCHMARK_V0_1.md'
      - '.github/workflows/fsre-frame-dependency-audit.yml'

permissions:
  contents: read

jobs:
  frame-dependency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path tools/fsre-frame-dependency-audit/Cargo.toml
      - name: Tests
        run: cargo test --locked --offline --manifest-path tools/fsre-frame-dependency-audit/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --offline --manifest-path tools/fsre-frame-dependency-audit/Cargo.toml --all-targets -- -D warnings
      - name: Deterministic CLI replay
        run: |
          cargo run --quiet --locked --offline --manifest-path tools/fsre-frame-dependency-audit/Cargo.toml -- tools/fsre-frame-dependency-audit/examples/common-root.psv > /tmp/frames-a.txt
          cargo run --quiet --locked --offline --manifest-path tools/fsre-frame-dependency-audit/Cargo.toml -- tools/fsre-frame-dependency-audit/examples/common-root.psv > /tmp/frames-b.txt
          cmp /tmp/frames-a.txt /tmp/frames-b.txt
