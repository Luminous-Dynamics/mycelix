name: Integration Runtime Store Binding Qualification

on:
  pull_request:
    branches:
      - feat/integration-http-issuance-descriptor-v1
      - main
    paths:
      - 'crates/mycelix-integration-runtime-store-binding/**'
      - '.github/workflows/integration-runtime-store-binding-qualification.yml'
  push:
    branches:
      - feat/integration-http-transport-journal-v1
    paths:
      - 'crates/mycelix-integration-runtime-store-binding/**'
      - '.github/workflows/integration-runtime-store-binding-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MANIFEST: crates/mycelix-integration-runtime-store-binding/Cargo.toml
  SOURCE: crates/mycelix-integration-runtime-store-binding/src/lib.rs

concurrency:
  group: integration-runtime-store-binding-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Provisioned exact runtime-store filesystem identity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/mycelix-integration-runtime-store-binding

      - name: Check formatting
        run: cargo fmt --manifest-path "$MANIFEST" --all --check

      - name: Compile tests without running
        run: cargo test --manifest-path "$MANIFEST" --no-run

      - name: Run tests
        run: cargo test --manifest-path "$MANIFEST"

      - name: Clippy
        run: cargo clippy --manifest-path "$MANIFEST" --all-targets -- -D warnings

      - name: Enforce exact provisioned identity and security attributes
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'pub struct RuntimeStoreProvisioningExpectation' "$SOURCE"
          grep -Fq 'pub device: u64' "$SOURCE"
          grep -Fq 'pub inode: u64' "$SOURCE"
          grep -Fq 'pub uid: u32' "$SOURCE"
          grep -Fq 'pub gid: u32' "$SOURCE"
          grep -Fq 'pub mode: u32' "$SOURCE"
          grep -Fq 'fs::symlink_metadata(path)' "$SOURCE"
          grep -Fq 'fs::canonicalize(path)' "$SOURCE"
          grep -Fq 'metadata.dev() != expectation.device' "$SOURCE"
          grep -Fq 'metadata.ino() != expectation.inode' "$SOURCE"
          grep -Fq 'metadata.uid() != expectation.uid' "$SOURCE"
          grep -Fq 'metadata.gid() != expectation.gid' "$SOURCE"
          grep -Fq 'mode != expectation.mode' "$SOURCE"
          grep -Fq 'pub fn revalidate(&self)' "$SOURCE"
          grep -Fq 'current_security_attributes_verified_here(&self) -> bool' "$SOURCE"

      - name: Enforce frozen mode remains owner-rw and not writable by others
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'self.mode & 0o600 != 0o600 || self.mode & 0o022 != 0' "$SOURCE"
          grep -Fq 'mode & 0o600 != 0o600 || mode & 0o022 != 0' "$SOURCE"
          grep -Fq 'StoreSecurityAttributesChanged' "$SOURCE"
          grep -Fq 'UnsafeFileMode' "$SOURCE"

      - name: Enforce binding digest commits identity and security tuple
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '&expectation.device.to_le_bytes()' "$SOURCE"
          grep -Fq '&expectation.inode.to_le_bytes()' "$SOURCE"
          grep -Fq '&expectation.uid.to_le_bytes()' "$SOURCE"
          grep -Fq '&expectation.gid.to_le_bytes()' "$SOURCE"
          grep -Fq '&expectation.mode.to_le_bytes()' "$SOURCE"

      - name: Enforce deployment authority stays external
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'provisioning_ref' "$SOURCE"
          grep -Fq 'provisioning_origin_verified_here(&self) -> bool' "$SOURCE"
          python3 - <<'PY'
          from pathlib import Path
          s = Path('crates/mycelix-integration-runtime-store-binding/src/lib.rs').read_text()
          marker = 'pub const fn provisioning_origin_verified_here(&self) -> bool'
          pos = s.find(marker)
          if pos < 0 or 'false' not in s[pos:pos+180]:
              raise SystemExit('store binding must not claim provisioning-origin verification')
          if 'fs::metadata(&canonical_path)' in s and 'expectation:' not in s:
              raise SystemExit('store binding must not learn its security expectation from the candidate file')
          PY

      - name: Enforce binding never creates or replaces the store
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq 'File::create|OpenOptions|create\(|create_new|truncate|rename\(|remove_file|set_len|set_permissions|chown|chmod' "$SOURCE"; then
            echo 'Runtime-store binding must verify independently provisioned state, never create/replace/repair it.'
            exit 1
          fi

      - name: Enforce pure filesystem theorem
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          meta = json.loads(subprocess.check_output([
              'cargo','metadata','--manifest-path',
              'crates/mycelix-integration-runtime-store-binding/Cargo.toml',
              '--no-deps','--format-version','1'
          ]))
          package = next(p for p in meta['packages'] if p['name'] == 'mycelix-integration-runtime-store-binding')
          direct = {d['name'] for d in package['dependencies']}
          forbidden = {'rusqlite','reqwest','hyper','tokio','rustls','openssl','keyring','vault'}
          hit = sorted(direct & forbidden)
          if hit:
              raise SystemExit(f'non-filesystem runtime dependency entered store binding: {hit}')
          PY
