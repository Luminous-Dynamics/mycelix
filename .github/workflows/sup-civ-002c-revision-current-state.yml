name: SUP-CIV-002C Revision Current State

on:
  pull_request:
    paths:
      - 'mycelix-workspace/docs/civic-resilience/SUP_CIV_002C_REVISION_CURRENT_STATE_V1.md'
      - 'mycelix-workspace/docs/civic-resilience/sup_civ_002c_revision_current_state.json'
      - 'scripts/qualification/sup_civ_002c_revision_current_state_v1.py'
      - '.github/workflows/sup-civ-002c-revision-current-state.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sup-civ-002c-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Revision lineage and admitted current-state boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Exact parent and clean subject
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='1733cb6d6e281e16530335c118d951ad939d45d7'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          printf 'head=%s\nparent=%s\ntree=%s\n' \
            "$(git rev-parse HEAD)" \
            "$(git rev-parse HEAD^)" \
            "$(git rev-parse HEAD^{tree})"
          test -z "$(git status --short)"

      - name: Exact tranche scope
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='1733cb6d6e281e16530335c118d951ad939d45d7'
          test "$(git rev-list --count "$EXPECTED_PARENT"..HEAD)" = '1'
          git diff --check "$EXPECTED_PARENT" HEAD
          mapfile -t changed < <(git diff --name-only "$EXPECTED_PARENT" HEAD | sort)
          expected=(
            '.github/workflows/sup-civ-002c-revision-current-state.yml'
            'mycelix-workspace/docs/civic-resilience/SUP_CIV_002C_REVISION_CURRENT_STATE_V1.md'
            'mycelix-workspace/docs/civic-resilience/sup_civ_002c_revision_current_state.json'
            'scripts/qualification/sup_civ_002c_revision_current_state_v1.py'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")

      - name: Validate revision/current-state contract
        run: python3 scripts/qualification/sup_civ_002c_revision_current_state_v1.py

      - name: Static no-runtime audit
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='1733cb6d6e281e16530335c118d951ad939d45d7'
          changed="$(git diff --name-only "$EXPECTED_PARENT" HEAD)"
          if printf '%s\n' "$changed" | grep -E '\.(rs|toml|lock)$'; then
            echo 'SUP-CIV-002C must remain semantic-contract/manifest/validator/workflow only' >&2
            exit 1
          fi

      - name: Prove conflict and evidence-cut boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('mycelix-workspace/docs/civic-resilience/sup_civ_002c_revision_current_state.json').read_text())
          assert d['runtime_owner'] == 'Deferred'
          assert d['head_policy']['multiple_heads_result'] == 'Conflict'
          assert d['head_policy']['timestamp_auto_winner'] is False
          assert d['head_policy']['action_sequence_auto_winner'] is False
          assert d['index_is_source_of_truth'] is False
          assert d['conflict_history_preserved'] is True
          assert 'NoVisibleCompetingHead != NoCompetingHeadExistsAnywhere' in d['non_equivalences']
          PY

      - name: Immutable checkout postflight
        run: test -z "$(git status --short)"
