name: Security Kernel Qualification — Trusted Dispatcher
run-name: SEC-KERNEL-DISPATCH source=${{ github.event.workflow_run.id }}.${{ github.event.workflow_run.run_attempt }} candidate=${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Security Kernel Qualification"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: security-kernel-trusted-dispatch-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: true

env:
  BASE_REPOSITORY: "Luminous-Dynamics/mycelix"
  BASE_BRANCH: "main"
  SOURCE_WORKFLOW_ID: "372951439"
  SOURCE_WORKFLOW_PATH: ".github/workflows/security-kernel-qualification.yml"
  TRUSTED_INDEPENDENT_WORKFLOW_PATH: ".github/workflows/security-kernel-independent-qualification.yml"
  TRUSTED_INDEPENDENT_WORKFLOW_BLOB_SHA: "f09f0f7a52a880a9bae67e7439c9c1440e890063"
  TRUSTED_DISPATCHER_WORKFLOW_PATH: ".github/workflows/security-kernel-trusted-dispatch.yml"

jobs:
  resolve:
    name: Resolve exact PR subject and source provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate_pr: ${{ steps.resolve.outputs.candidate_pr }}
      candidate_sha: ${{ steps.resolve.outputs.candidate_sha }}
      candidate_repository: ${{ steps.resolve.outputs.candidate_repository }}
    steps:
      - name: Verify trusted dispatcher invocation context
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_WORKFLOW_REF" = "Luminous-Dynamics/mycelix/.github/workflows/security-kernel-trusted-dispatch.yml@refs/heads/main"
          printf '%s' "$GITHUB_WORKFLOW_SHA" | grep -Eq '^[0-9a-f]{40}$'
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ["BASE_REPOSITORY"]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs/{os.environ['RUN_ID']}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              run = json.load(response)
          assert run["id"] == int(os.environ["RUN_ID"])
          assert run["path"] == os.environ["TRUSTED_DISPATCHER_WORKFLOW_PATH"]
          assert run["event"] == "workflow_run"
          assert run["repository"]["full_name"] == repo
          assert run["workflow_ref"] == f"{repo}/{os.environ['TRUSTED_DISPATCHER_WORKFLOW_PATH']}@refs/heads/main"
          assert run["workflow_sha"] == os.environ["GITHUB_WORKFLOW_SHA"]
          print("PASS: trusted dispatcher is executing from the protected default-branch workflow")
          PY

      - name: Verify trusted S1 profile is present at caller commit
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          CALLER_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ["BASE_REPOSITORY"]
          path = os.environ["TRUSTED_INDEPENDENT_WORKFLOW_PATH"]
          ref = os.environ["CALLER_SHA"]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/contents/{path}?ref={ref}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              content = json.load(response)
          assert content["sha"] == os.environ["TRUSTED_INDEPENDENT_WORKFLOW_BLOB_SHA"], (
              "S1 called-workflow blob differs from the registered qualification profile"
          )
          print("PASS: same-commit reusable S1 profile matches the registered blob")
          PY

      - name: Resolve exact source workflow provenance
        id: resolve
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          base = "https://api.github.com"
          repo = os.environ["BASE_REPOSITORY"]
          def get(path):
              req = urllib.request.Request(
                  base + path,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)

          run = get(f"/repos/{repo}/actions/runs/{os.environ['RUN_ID']}")
          assert run["id"] == int(os.environ["RUN_ID"])
          assert run["run_attempt"] == int(os.environ["RUN_ATTEMPT"])
          assert run["status"] == "completed"
          assert run["workflow_id"] == int(os.environ["SOURCE_WORKFLOW_ID"])
          assert run["path"] == os.environ["SOURCE_WORKFLOW_PATH"]
          assert run["event"] == "pull_request"
          assert run["repository"]["full_name"] == repo
          assert run["head_sha"] == os.environ["HEAD_SHA"]
          assert (run.get("head_repository") or {}).get("full_name") == os.environ["HEAD_REPOSITORY"]

          run_prs = run.get("pull_requests") or []
          assert len(run_prs) == 1, f"source workflow run must identify exactly one PR: {len(run_prs)}"
          candidate_pr = run_prs[0]["number"]
          pr = get(f"/repos/{repo}/pulls/{candidate_pr}")
          assert pr["number"] == candidate_pr
          assert pr["state"] == "open"
          assert pr["base"]["repo"]["full_name"] == repo
          assert pr["base"]["ref"] == os.environ["BASE_BRANCH"]
          assert pr["head"]["repo"]["full_name"] == os.environ["HEAD_REPOSITORY"]
          assert pr["head"]["sha"] == os.environ["HEAD_SHA"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"candidate_pr={pr['number']}\n")
              output.write(f"candidate_sha={os.environ['HEAD_SHA']}\n")
              output.write(f"candidate_repository={os.environ['HEAD_REPOSITORY']}\n")
          print("PASS: source workflow, source attempt, candidate repository, SHA, and exact open PR are bound")
          PY

  qualify:
    name: Execute exact candidate qualification
    needs: resolve
    permissions:
      actions: read
      contents: read
      pull-requests: read
    cache-mode: none
    uses: ./.github/workflows/security-kernel-independent-qualification.yml
    with:
      candidate_pr: ${{ needs.resolve.outputs.candidate_pr }}
      candidate_sha: ${{ needs.resolve.outputs.candidate_sha }}
      candidate_repository: ${{ needs.resolve.outputs.candidate_repository }}
      source_run_id: ${{ github.event.workflow_run.id }}
      source_run_attempt: ${{ github.event.workflow_run.run_attempt }}
      trusted_workflow_blob_sha: "f09f0f7a52a880a9bae67e7439c9c1440e890063"
