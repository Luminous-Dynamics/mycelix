name: Security Kernel Qualification — Trusted Dispatcher
run-name: SEC-KERNEL-DISPATCH pr=${{ github.event.pull_request.number }} candidate=${{ github.event.pull_request.head.sha }}

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: security-kernel-trusted-dispatch-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BASE_REPOSITORY: "Luminous-Dynamics/mycelix"
  BASE_BRANCH: "main"
  SOURCE_WORKFLOW_PATH: ".github/workflows/security-kernel-qualification.yml"
  TRUSTED_INDEPENDENT_WORKFLOW_PATH: ".github/workflows/security-kernel-independent-qualification.yml"
  TRUSTED_INDEPENDENT_WORKFLOW_BLOB_SHA: "949443c39bdded6769305e63259e6162694068fd"
  TRUSTED_RESULT_VERIFIER_WORKFLOW_PATH: ".github/workflows/security-kernel-trusted-result-verifier.yml"
  TRUSTED_RESULT_VERIFIER_WORKFLOW_BLOB_SHA: "4c284f328d4f5c0e975bee370bdf9166e514e6a6"
  TRUSTED_DISPATCHER_WORKFLOW_PATH: ".github/workflows/security-kernel-trusted-dispatch.yml"

jobs:
  resolve:
    name: Resolve exact pull request subject
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate_pr: ${{ steps.resolve.outputs.candidate_pr }}
      candidate_sha: ${{ steps.resolve.outputs.candidate_sha }}
      candidate_repository: ${{ steps.resolve.outputs.candidate_repository }}
    steps:
      - name: Verify trusted result verifier profile at caller commit
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          CALLER_SHA: ${{ github.workflow_sha }}
          TRUSTED_RESULT_VERIFIER_WORKFLOW_BLOB_SHA: ${{ env.TRUSTED_RESULT_VERIFIER_WORKFLOW_BLOB_SHA }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ["BASE_REPOSITORY"]
          path=os.environ["TRUSTED_RESULT_VERIFIER_WORKFLOW_PATH"]
          ref=os.environ["CALLER_SHA"]
          req=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/contents/{path}?ref={ref}",
              headers={
                  "Accept":"application/vnd.github+json",
                  "Authorization":f"Bearer {os.environ['TOKEN']}",
                  "X-GitHub-Api-Version":"2022-11-28",
              })
          with urllib.request.urlopen(req, timeout=20) as response:
              content=json.load(response)
          assert content["sha"] == os.environ["TRUSTED_RESULT_VERIFIER_WORKFLOW_BLOB_SHA"], (
              "S2 verifier blob differs from the externally registered trust profile at the S0 commit"
          )
          print("PASS: trusted S2 verifier profile is anchored at the exact S0 commit")
          PY

      - name: Verify trusted dispatcher context and exact PR identity
        id: resolve
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY_EVENT: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_BRANCH_EVENT: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_WORKFLOW_REF" = "Luminous-Dynamics/mycelix/.github/workflows/security-kernel-trusted-dispatch.yml@refs/heads/main"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "pull_request_target"
          printf '%s' "$PR_NUMBER" | grep -Eq '^[0-9]+$'
          printf '%s' "$HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$BASE_REPOSITORY_EVENT" = "$BASE_REPOSITORY"
          test "$BASE_BRANCH_EVENT" = "$BASE_BRANCH"
          test -n "$HEAD_REPOSITORY"
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ["BASE_REPOSITORY"]
          pr_number=int(os.environ["PR_NUMBER"])
          req=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/pulls/{pr_number}",
              headers={
                  "Accept":"application/vnd.github+json",
                  "Authorization":f"Bearer {os.environ['TOKEN']}",
                  "X-GitHub-Api-Version":"2022-11-28",
              })
          with urllib.request.urlopen(req, timeout=20) as response:
              pr=json.load(response)
          assert pr["number"] == pr_number
          assert pr["state"] == "open"
          assert pr["base"]["repo"]["full_name"] == repo
          assert pr["base"]["ref"] == os.environ["BASE_BRANCH"]
          assert pr["head"]["repo"]["full_name"] == os.environ["HEAD_REPOSITORY"]
          assert pr["head"]["sha"] == os.environ["HEAD_SHA"]
          print("PASS: trusted default-branch dispatcher bound the exact current PR repository/SHA")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"candidate_pr={pr_number}\n")
              output.write(f"candidate_sha={os.environ['HEAD_SHA']}\n")
              output.write(f"candidate_repository={os.environ['HEAD_REPOSITORY']}\n")
          PY

  qualify:
    name: Execute exact candidate qualification
    needs: resolve
    permissions:
      actions: read
      contents: read
      pull-requests: read
    cache-mode: none
    uses: ./.github/workflows/security-kernel-independent-qualification.yml
    with:
      candidate_pr: ${{ needs.resolve.outputs.candidate_pr }}
      candidate_sha: ${{ needs.resolve.outputs.candidate_sha }}
      candidate_repository: ${{ needs.resolve.outputs.candidate_repository }}
      trusted_workflow_blob_sha: "949443c39bdded6769305e63259e6162694068fd"
