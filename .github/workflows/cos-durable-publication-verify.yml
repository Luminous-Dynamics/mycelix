name: COS Durable Publication Verify

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published immutable release tag containing the COS durable bundle
        required: true
        type: string
      asset_name:
        description: Exact durable COS bundle asset name
        required: true
        type: string
      expected_main_sha:
        description: Protected-main revision the durable publication claims to represent
        required: true
        type: string
      expected_claim_id:
        description: Exact qualification_claim_id expected in the durable subject
        required: true
        type: string
      expected_manifest_sha256:
        description: Exact qualification-manifest SHA-256
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify durable COS publication
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate inputs and repository identity
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          EXPECTED_CLAIM_ID: ${{ inputs.expected_claim_id }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
          EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          printf '%s\n' "${EXPECTED_MAIN_SHA}" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s\n' "${EXPECTED_CLAIM_ID}" | grep -Eq '^[0-9a-f]{64}$'
          printf '%s\n' "${EXPECTED_MANIFEST_SHA256}" | grep -Eq '^[0-9a-f]{64}$'
          test "${EXPECTED_REPOSITORY_ID}" = "1176351975"

      - name: Read release metadata
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "${RELEASE_TAG}"
          test -n "${ASSET_NAME}"
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json id,tagName,isDraft,isImmutable,isPrerelease,publishedAt,targetCommitish,assets \
            > release.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path("release.json").read_text())
          assert set(data) == {
              "id", "tagName", "isDraft", "isImmutable",
              "isPrerelease", "publishedAt", "targetCommitish", "assets"
          }
          assert data["tagName"] == os.environ["RELEASE_TAG"]
          assert data["isDraft"] is False
          assert data["isImmutable"] is True
          assert data["publishedAt"]
          assert isinstance(data["assets"], list)
          matches = [asset for asset in data["assets"] if asset.get("name") == os.environ["ASSET_NAME"]]
          assert len(matches) == 1
          asset = matches[0]
          assert asset.get("state") == "uploaded"
          assert asset.get("digest", "").startswith("sha256:")
          Path("release-asset-metadata.json").write_text(
              json.dumps(asset, indent=2, sort_keys=True) + "\n"
          )
          print(f"release_id={data['id']}")
          print(f"asset_digest={asset['digest']}")
          PY

      - name: Resolve exact release tag target
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          annotated="$(git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" | awk '{print $1}')"
          lightweight="$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')"
          tag_sha="${annotated:-${lightweight}}"
          printf '%s\n' "${tag_sha}" | grep -Eq '^[0-9a-f]{40}$'
          test "${tag_sha}" = "${EXPECTED_MAIN_SHA}" || {
            echo "durable release tag target mismatch: expected ${EXPECTED_MAIN_SHA}, got ${tag_sha}" >&2
            exit 1
          }
          printf '%s\n' "${tag_sha}" > release-tag-target-sha.txt

      - name: Verify immutable release attestation
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release verify "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --format json > release-attestation-verification.json

      - name: Download exact durable asset
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf durable-publication
          mkdir -p durable-publication
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "${ASSET_NAME}" --dir durable-publication --clobber
          test "$(find durable-publication -maxdepth 1 -type f -printf '%f\n' | wc -l)" = 1

      - name: Verify release asset digest
        env:
          ASSET_NAME: ${{ inputs.asset_name }}
        run: |
          set -euo pipefail
          api_digest="$(python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("release-asset-metadata.json").read_text())
          print(data["digest"])
          PY
          )"
          api_digest="${api_digest#sha256:}"
          actual_digest="$(sha256sum "durable-publication/${ASSET_NAME}" | awk '{print $1}')"
          printf '%s\n' "${api_digest}" | grep -Eq '^[0-9a-f]{64}$'
          test "${api_digest}" = "${actual_digest}" || {
            echo "durable asset digest mismatch" >&2
            exit 1
          }

      - name: Verify immutable release asset attestation
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release verify-asset "${RELEASE_TAG}" "durable-publication/${ASSET_NAME}" \
            --repo "${GITHUB_REPOSITORY}" --format json > release-asset-attestation-verification.json

      - name: Inspect durable bundle safely
        env:
          ASSET_NAME: ${{ inputs.asset_name }}
        run: |
          set -euo pipefail
          case "${ASSET_NAME}" in *.tar.gz) ;; *) echo "durable asset must be .tar.gz" >&2; exit 1 ;; esac
          tar -tzf "durable-publication/${ASSET_NAME}" > durable-members.txt
          if grep -Eq '(^/|(^|/)\.\.?(/|$))' durable-members.txt; then
            echo "durable archive contains unsafe path entries" >&2
            exit 1
          fi
          expected=''
          python - <<'PY'
          from pathlib import Path
          required={
              "durable-publication-manifest-v1.json",
              "qualification-manifest-v1.json",
              "qualification-attestation-predicate-v3.json",
              "attestor-run-receipt.json",
              "qualification-attestation-bundle.json",
              "SHA256SUMS",
          }
          members={line.strip().rstrip('/') for line in Path("durable-members.txt").read_text().splitlines() if line.strip()}
          assert members == required
          PY
          rm -rf durable-extracted
          mkdir durable-extracted
          tar -xzf "durable-publication/${ASSET_NAME}" -C durable-extracted
          (cd durable-extracted && sha256sum --check --strict SHA256SUMS)

      - name: Reconcile archived attestor signer with trust root
        id: reconcile
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s durable-extracted/attestor-run-receipt.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def reject_duplicate_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f'duplicate JSON key: {key}')
                  result[key] = value
              return result

          def reject_nonstandard_constant(value):
              raise ValueError(f'non-standard JSON constant: {value}')

          receipt = json.loads(Path('durable-extracted/attestor-run-receipt.json').read_text(), object_pairs_hook=reject_duplicate_keys, parse_constant=reject_nonstandard_constant)
          assert receipt['repository_id'] == int(os.environ['EXPECTED_REPOSITORY_ID'])
          signer = receipt['attestor']
          expected_ref = f"{os.environ['GITHUB_REPOSITORY']}/.github/workflows/cos-conformance-qualification-attestor.yml@refs/heads/main"
          assert signer['workflow_ref'] == expected_ref
          signer_sha = signer['workflow_sha']
          assert isinstance(signer_sha, str) and len(signer_sha) == 40 and all(ch in '0123456789abcdef' for ch in signer_sha)
          Path('attestor-signer-workflow-sha.txt').write_text(signer_sha + '\n')
          PY
          gh api --method GET "repos/${GITHUB_REPOSITORY}/contents/.github/cos/qualification-trust-root-v2.json" -f "ref=${EXPECTED_MAIN_SHA}" > trust-root-api-response.json
          gh api --method GET "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/cos-conformance-qualification-attestor.yml" -f "ref=$(cat attestor-signer-workflow-sha.txt)" > attestor-workflow-api-response.json
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          def reject_duplicate_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f'duplicate JSON key: {key}')
                  result[key] = value
              return result

          def reject_nonstandard_constant(value):
              raise ValueError(f'non-standard JSON constant: {value}')

          def strict(text):
              return json.loads(text, object_pairs_hook=reject_duplicate_keys, parse_constant=reject_nonstandard_constant)

          root_api = strict(Path('trust-root-api-response.json').read_text())
          workflow_api = strict(Path('attestor-workflow-api-response.json').read_text())
          assert root_api['path'] == '.github/cos/qualification-trust-root-v2.json'
          assert workflow_api['path'] == '.github/workflows/cos-conformance-qualification-attestor.yml'
          root_bytes = base64.b64decode(''.join(root_api['content'].splitlines()), validate=True)
          workflow_bytes = base64.b64decode(''.join(workflow_api['content'].splitlines()), validate=True)
          Path('expected-trust-root.json').write_bytes(root_bytes)
          Path('reconciled-attestor-workflow.yml').write_bytes(workflow_bytes)
          root = strict(root_bytes.decode('utf-8'))
          assert root['schema'] == 'MYCELIX-COS-QUALIFICATION-TRUST-ROOT-V2'
          assert root['repository'] == os.environ['GITHUB_REPOSITORY']
          assert root['repository_id'] == int(os.environ['EXPECTED_REPOSITORY_ID'])
          component = root['components']['qualification_attestor_workflow']
          assert component['path'] == '.github/workflows/cos-conformance-qualification-attestor.yml'
          blob_sha1 = subprocess.check_output(['git', 'hash-object', '--stdin'], input=workflow_bytes).decode().strip()
          content_sha256 = hashlib.sha256(workflow_bytes).hexdigest()
          assert blob_sha1 == component['git_blob_sha1']
          assert content_sha256 == component['content_sha256']
          signer_sha = Path('attestor-signer-workflow-sha.txt').read_text().strip()
          observation = {
              'schema': 'MYCELIX-COS-ATTESTOR-SIGNER-ROOT-RECONCILIATION-V1',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'repository_id': int(os.environ['EXPECTED_REPOSITORY_ID']),
              'attestor_workflow_sha': signer_sha,
              'attestor_workflow_path': component['path'],
              'attestor_workflow_git_blob_sha1': blob_sha1,
              'attestor_workflow_content_sha256': content_sha256,
              'trust_root_main_sha': os.environ['EXPECTED_MAIN_SHA'],
              'state': 'Reconciled',
          }
          Path('attestor-signer-root-reconciliation.json').write_text(json.dumps(observation, indent=2, sort_keys=True) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'attestor_workflow_sha={signer_sha}\n')
              out.write(f'attestor_workflow_git_blob_sha1={blob_sha1}\n')
              out.write(f'attestor_workflow_content_sha256={content_sha256}\n')
          PY

      - name: Verify archived signed qualification attestation
        env:
          EXPECTED_PREDICATE_TYPE: https://luminousdynamics.io/attestations/mycelix-cos-qualification/v1
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/cos-conformance-qualification-attestor.yml
          SIGNER_DIGEST: ${{ steps.reconcile.outputs.attestor_workflow_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify durable-extracted/qualification-manifest-v1.json \
            --repo "${GITHUB_REPOSITORY}" \
            --bundle durable-extracted/qualification-attestation-bundle.json \
            --predicate-type "${EXPECTED_PREDICATE_TYPE}" \
            --signer-workflow "${SIGNER_WORKFLOW}" \
            --signer-digest "${SIGNER_DIGEST}" \
            --deny-self-hosted-runners \
            --format json > archived-attestation-verification.json
          test -s archived-attestation-verification.json

      - name: Validate durable subject semantics
        env:
          EXPECTED_CLAIM_ID: ${{ inputs.expected_claim_id }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
          EXPECTED_PREDICATE_TYPE: https://luminousdynamics.io/attestations/mycelix-cos-qualification/v1
          EXPECTED_ATTESTOR_WORKFLOW_SHA: ${{ steps.reconcile.outputs.attestor_workflow_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
          EXPECTED_ATTESTOR_WORKFLOW_BLOB_SHA1: ${{ steps.reconcile.outputs.attestor_workflow_git_blob_sha1 }}
          EXPECTED_ATTESTOR_WORKFLOW_CONTENT_SHA256: ${{ steps.reconcile.outputs.attestor_workflow_content_sha256 }}
        run: |
          set -euo pipefail
          EXPECTED_CLAIM_ID="${EXPECTED_CLAIM_ID}" EXPECTED_MANIFEST_SHA256="${EXPECTED_MANIFEST_SHA256}" EXPECTED_MAIN_SHA="${EXPECTED_MAIN_SHA}" EXPECTED_REPOSITORY_ID="${EXPECTED_REPOSITORY_ID}" EXPECTED_PREDICATE_TYPE="${EXPECTED_PREDICATE_TYPE}" EXPECTED_ATTESTOR_WORKFLOW_SHA="${EXPECTED_ATTESTOR_WORKFLOW_SHA}" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def strict(text):
              return json.loads(
                  text,
                  object_pairs_hook=lambda pairs: duplicate_reject(pairs),
                  parse_constant=lambda value: (_ for _ in ()).throw(ValueError(f'non-standard JSON constant: {value}'))
              )

          def duplicate_reject(pairs):
              result={}
              for key,value in pairs:
                  if key in result:
                      raise ValueError(f'duplicate JSON key: {key}')
                  result[key]=value
              return result

          root=Path('durable-extracted')
          durable_manifest_path=root/'durable-publication-manifest-v1.json'
          bundle_path=root/'qualification-attestation-bundle.json'
          durable_manifest=strict(durable_manifest_path.read_text())
          bundle_raw=bundle_path.read_bytes()
          bundle_sha256=hashlib.sha256(bundle_raw).hexdigest()
          release=json.loads(Path('release.json').read_text())
          manifest_path=root/'qualification-manifest-v1.json'
          predicate_path=root/'qualification-attestation-predicate-v3.json'
          receipt_path=root/'attestor-run-receipt.json'
          manifest_raw=manifest_path.read_bytes()
          manifest=strict(manifest_raw.decode('utf-8'))
          predicate=strict(predicate_path.read_text())
          receipt=strict(receipt_path.read_text())
          assert receipt['attestation']['bundle_sha256'] == bundle_sha256
          assert set(durable_manifest) == {
              'schema','repository','repository_id','release_tag',
              'asset_name','expected_main_sha','qualification_claim_id',
              'qualification_manifest_sha256','predicate_type','publication_profile',
              'claim_ceiling', 'trust_root_manifest_blob_sha1', 'trust_root_manifest_sha256',
              'trust_root_main_snapshot_sha','publication_handoff_sha256',
              'attestor_run_id','attestor_run_attempt','attestor_artifact_id','attestor_artifact_digest',
              'verifier_run_id','verifier_run_attempt','signing_input_artifact_id','signing_input_artifact_digest',
              'environment_policy_sha256',
              'attestor_workflow_path','attestor_workflow_sha','attestor_workflow_git_blob_sha1','attestor_workflow_content_sha256',
              'signed_attestation_bundle_sha256','files'
          }
          assert durable_manifest['schema'] == 'MYCELIX-COS-DURABLE-PUBLICATION-MANIFEST-V1'
          assert durable_manifest['repository'] == os.environ['GITHUB_REPOSITORY']
          assert durable_manifest['repository_id'] == int(os.environ['EXPECTED_REPOSITORY_ID'])
          assert durable_manifest['release_tag'] == os.environ['RELEASE_TAG']
          assert durable_manifest['release_tag'] == f"cos-qualification-{durable_manifest['qualification_claim_id']}"
          assert durable_manifest['asset_name'] == os.environ['ASSET_NAME']
          assert durable_manifest['expected_main_sha'] == os.environ['EXPECTED_MAIN_SHA']
          assert durable_manifest['qualification_claim_id'] == os.environ['EXPECTED_CLAIM_ID']
          assert durable_manifest['qualification_manifest_sha256'] == os.environ['EXPECTED_MANIFEST_SHA256']
          assert durable_manifest['predicate_type'] == os.environ['EXPECTED_PREDICATE_TYPE']
          # GitHub's numeric release ID is publication-instance metadata, not durable evidence; keep it only in the external observation.
          assert durable_manifest['publication_profile'] == 'CONTENT-ADDRESSED-DURABLE-PUBLICATION-V1'
          assert durable_manifest['claim_ceiling'] == 'ReferenceModelOnly'
          assert durable_manifest['trust_root_manifest_sha256'] == receipt['trust_root']['manifest_sha256']
          assert durable_manifest['trust_root_manifest_blob_sha1'] == receipt['trust_root']['manifest_blob_sha1']
          assert durable_manifest['trust_root_main_snapshot_sha'] == receipt['trust_root']['main_snapshot_sha']
          assert durable_manifest['trust_root_main_snapshot_sha'] == os.environ['EXPECTED_MAIN_SHA']
          handoff_basis={k:durable_manifest[k] for k in (
              'repository','repository_id','expected_main_sha','qualification_claim_id','qualification_manifest_sha256',
              'predicate_type','publication_profile','claim_ceiling','attestor_run_id','attestor_run_attempt',
              'attestor_artifact_id','attestor_artifact_digest','verifier_run_id','verifier_run_attempt',
              'signing_input_artifact_id','signing_input_artifact_digest','attestor_workflow_sha','attestor_workflow_path',
              'trust_root_manifest_sha256','trust_root_manifest_blob_sha1','trust_root_main_snapshot_sha',
              'environment_policy_sha256','asset_name','release_tag'
          )}
          expected_handoff=hashlib.sha256(json.dumps(handoff_basis,sort_keys=True,separators=(',',':')).encode('utf-8')).hexdigest()
          assert expected_handoff==durable_manifest['publication_handoff_sha256']
          assert durable_manifest['attestor_run_id'] == receipt['attestor']['run_id']
          assert durable_manifest['attestor_run_attempt'] == receipt['attestor']['run_attempt']
          assert durable_manifest['verifier_run_id'] == receipt['verifier_run']['id']
          assert durable_manifest['verifier_run_attempt'] == receipt['verifier_run']['attempt']
          assert durable_manifest['signing_input_artifact_id'] == receipt['signing_input_artifact']['id']
          assert durable_manifest['signing_input_artifact_digest'] == receipt['signing_input_artifact']['digest']
          assert durable_manifest['attestor_artifact_id'] > 0
          assert durable_manifest['attestor_artifact_digest'].startswith('sha256:')
          assert len(durable_manifest['environment_policy_sha256']) == 64 and all(ch in '0123456789abcdef' for ch in durable_manifest['environment_policy_sha256'])
          assert durable_manifest['attestor_workflow_git_blob_sha1'] == os.environ['EXPECTED_ATTESTOR_WORKFLOW_BLOB_SHA1']
          assert durable_manifest['attestor_workflow_content_sha256'] == os.environ['EXPECTED_ATTESTOR_WORKFLOW_CONTENT_SHA256']
          assert durable_manifest['attestor_workflow_path'] == receipt['attestor']['workflow_ref']
          assert durable_manifest['attestor_workflow_sha'] == os.environ['EXPECTED_ATTESTOR_WORKFLOW_SHA']
          assert durable_manifest['signed_attestation_bundle_sha256'] == bundle_sha256
          assert durable_manifest['files'] == {
              'qualification-manifest-v1.json': hashlib.sha256((root/'qualification-manifest-v1.json').read_bytes()).hexdigest(),
              'qualification-attestation-predicate-v3.json': hashlib.sha256((root/'qualification-attestation-predicate-v3.json').read_bytes()).hexdigest(),
              'attestor-run-receipt.json': hashlib.sha256((root/'attestor-run-receipt.json').read_bytes()).hexdigest(),
              'qualification-attestation-bundle.json': bundle_sha256,
          }
          assert set(durable_manifest['files']) == {
              'qualification-manifest-v1.json','qualification-attestation-predicate-v3.json',
              'attestor-run-receipt.json','qualification-attestation-bundle.json',
          }
          assert durable_manifest['attestor_workflow_path'] == f"{os.environ['GITHUB_REPOSITORY']}/.github/workflows/cos-conformance-qualification-attestor.yml@refs/heads/main"
          assert durable_manifest['attestor_workflow_sha'] == os.environ['EXPECTED_ATTESTOR_WORKFLOW_SHA']
          assert len(os.environ['EXPECTED_ATTESTOR_WORKFLOW_BLOB_SHA1']) == 40
          assert len(os.environ['EXPECTED_ATTESTOR_WORKFLOW_CONTENT_SHA256']) == 64
          assert os.environ['EXPECTED_ATTESTOR_WORKFLOW_CONTENT_SHA256']
          assert isinstance(json.loads(Path('archived-attestation-verification.json').read_text()), list)

          assert hashlib.sha256(manifest_raw).hexdigest() == os.environ['EXPECTED_MANIFEST_SHA256']
          assert predicate['schema'] == 'MYCELIX-COS-QUALIFICATION-ATTESTATION-PREDICATE-V3'
          assert predicate['predicate_type'] == os.environ['EXPECTED_PREDICATE_TYPE']
          assert predicate['expected_head_sha'] == os.environ['EXPECTED_MAIN_SHA']
          assert predicate['qualification_manifest_sha256'] == os.environ['EXPECTED_MANIFEST_SHA256']
          assert predicate['qualification_claim_id'] == os.environ['EXPECTED_CLAIM_ID']
          assert predicate['publication'] == {
              'profile': 'COS-TERMINAL-ATTESTATION-V1',
              'state': 'preconditions_satisfied_terminal_side_effect',
          }
          assert receipt['schema'] == 'MYCELIX-COS-QUALIFICATION-ATTESTOR-RECEIPT-V3'
          assert receipt['qualification_claim_id'] == os.environ['EXPECTED_CLAIM_ID']
          assert receipt['qualification_manifest_sha256'] == os.environ['EXPECTED_MANIFEST_SHA256']
          assert receipt['repository_id'] == int(os.environ['EXPECTED_REPOSITORY_ID'])
          assert receipt['qualification_topology']['head_sha'] == os.environ['EXPECTED_MAIN_SHA']
          assert receipt['attestor']['workflow_sha'] == os.environ['EXPECTED_ATTESTOR_WORKFLOW_SHA']
          assert receipt['attestor']['workflow_ref'] == f"{os.environ['GITHUB_REPOSITORY']}/.github/workflows/cos-conformance-qualification-attestor.yml@refs/heads/main"
          PY

      - name: Record durable verification state
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
          EXPECTED_CLAIM_ID: ${{ inputs.expected_claim_id }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          ATTESTOR_WORKFLOW_SHA: ${{ steps.reconcile.outputs.attestor_workflow_sha }}
          ATTESTOR_WORKFLOW_BLOB_SHA1: ${{ steps.reconcile.outputs.attestor_workflow_git_blob_sha1 }}
          ATTESTOR_WORKFLOW_CONTENT_SHA256: ${{ steps.reconcile.outputs.attestor_workflow_content_sha256 }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          release=json.loads(Path('release.json').read_text())
          asset=json.loads(Path('release-asset-metadata.json').read_text())
          observation={
              'schema':'MYCELIX-COS-DURABLE-PUBLICATION-VERIFICATION-V1',
              'repository':os.environ['GITHUB_REPOSITORY'],
              'repository_id':int(os.environ['GITHUB_REPOSITORY_ID']),
              'release_tag':os.environ['RELEASE_TAG'],
              'release_id':release['id'],
              'immutable':release['isImmutable'],
              'asset_name':os.environ['ASSET_NAME'],
              'asset_digest':asset['digest'],
              'expected_main_sha':os.environ['EXPECTED_MAIN_SHA'],
              'qualification_claim_id':os.environ['EXPECTED_CLAIM_ID'],
              'signed_attestation_bundle_sha256':hashlib.sha256(Path('durable-extracted/qualification-attestation-bundle.json').read_bytes()).hexdigest(),
              'durable_publication_manifest_sha256':hashlib.sha256(Path('durable-extracted/durable-publication-manifest-v1.json').read_bytes()).hexdigest(),
              'attestor_workflow_sha':os.environ['ATTESTOR_WORKFLOW_SHA'],
              'attestor_workflow_git_blob_sha1':os.environ['ATTESTOR_WORKFLOW_BLOB_SHA1'],
              'attestor_workflow_content_sha256':os.environ['ATTESTOR_WORKFLOW_CONTENT_SHA256'],
              'qualification_manifest_sha256':os.environ['EXPECTED_MANIFEST_SHA256'],
              'state':'DurableAndVerifiable',
          }
          assert set(observation) == {
              'schema','repository','repository_id','release_tag','release_id',
              'immutable','asset_name','asset_digest','expected_main_sha',
              'qualification_claim_id','attestor_workflow_sha','attestor_workflow_git_blob_sha1','attestor_workflow_content_sha256','signed_attestation_bundle_sha256','durable_publication_manifest_sha256','qualification_manifest_sha256','state'
          }
          Path('durable-publication-verification.json').write_text(json.dumps(observation,indent=2,sort_keys=True)+'\n')
          PY

      - name: Preserve verifier observation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a0 # v7.0.1
        with:
          name: cos-durable-publication-verification-${{ inputs.expected_claim_id }}
          path: |
            archived-attestation-verification.json
            attestor-signer-root-reconciliation.json
            attestor-signer-workflow-sha.txt
            expected-trust-root.json
            reconciled-attestor-workflow.yml
            durable-publication-verification.json
            release.json
            release-asset-metadata.json
            release-attestation-verification.json
            release-asset-attestation-verification.json
            release-tag-target-sha.txt
            durable-members.txt
          if-no-files-found: error
          retention-days: 30