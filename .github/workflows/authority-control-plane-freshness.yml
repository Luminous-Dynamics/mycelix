name: Authority Control Plane Freshness

on:
  pull_request:
    paths:
      - 'crates/mycelix-authority-control-plane-freshness/**'
      - 'crates/mycelix-authority-state-bootstrap-root/**'
      - 'crates/mycelix-authority-state-source/**'
      - 'crates/mycelix-authority-state-coverage/**'
      - 'crates/mycelix-authority-state-coverage-context/**'
      - 'crates/mycelix-authority-freshness/**'
      - '.github/workflows/authority-control-plane-freshness.yml'
  push:
    branches:
      - 'security/authority-control-plane-freshness-v0.1'

permissions:
  contents: read

concurrency:
  group: authority-control-plane-freshness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: Root-covered policy freshness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --manifest-path crates/mycelix-authority-control-plane-freshness/Cargo.toml -- --check

      - name: Tests
        run: cargo test --manifest-path crates/mycelix-authority-control-plane-freshness/Cargo.toml --all-targets

      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-authority-control-plane-freshness/Cargo.toml --all-targets -- -D warnings

      - name: Downstream source/coverage compatibility
        run: |
          cargo check --manifest-path crates/mycelix-authority-state-source/Cargo.toml --all-targets
          cargo check --manifest-path crates/mycelix-authority-state-coverage/Cargo.toml --all-targets
          cargo check --manifest-path crates/mycelix-authority-state-coverage-context/Cargo.toml --all-targets

      - name: Control-plane authority audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('crates/mycelix-authority-control-plane-freshness/src/lib.rs').read_text()
          inv = Path('crates/mycelix-authority-control-plane-freshness/INVARIANTS.md').read_text().lower()

          required = [
              'QualifiedAuthorityStateBootstrapRoot',
              'qualify_context_bound_coverage(',
              'project_current_authority_state(',
              'to_current_freshness_receipt()',
              'qualify_current_freshness(',
              'AuthoritySubjectKind::AuthorityCoveragePolicy',
              'AuthoritySubjectKind::CoverageTrustContextPolicy',
              'AuthoritySubjectKind::WitnessTrustPolicy',
              'OperationalSubjectForbidden',
              'freshness.lease_until_ms = freshness.lease_until_ms.min(root.valid_until_ms())',
          ]
          for token in required:
              assert token in src, token

          forbidden = [
              'project_authority_state_as_of(',
              '#[hdk_extern]',
              'hdk::',
              'create_entry(',
              'get_links(',
              'call_remote(',
              'execute_actions',
              'AuthoritySubjectKind::AuthorityGrant => Ok',
              'AuthoritySubjectKind::ThresholdAuthorization => Ok',
              'AuthoritySubjectKind::ExecutorDesignation => Ok',
          ]
          for token in forbidden:
              assert token not in src, token

          assert 'probe is evidence, not policy authority' in inv
          assert 'a valid prefix is not current authority' in inv
          assert 'historical state cannot become live freshness' in inv
          assert 'root lease caps all downstream freshness' in inv
          assert 'no super-authority' in inv
          print('PASS: control-plane policy freshness is constitution-rooted, coverage-complete, current-only, and scope-limited')
          PY
