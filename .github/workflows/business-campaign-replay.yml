name: Business Campaign Replay

on:
  pull_request:
    paths:
      - 'crates/mycelix-business-campaign-replay/**'
      - 'crates/mycelix-business-import-membership/**'
      - 'crates/mycelix-business-import-diagnostics/**'
      - 'crates/mycelix-business-adapter-delimited/**'
      - 'crates/mycelix-business-ingress/**'
      - 'crates/mycelix-business-shadow/**'
      - 'crates/mycelix-business-core/**'
      - '.github/workflows/business-campaign-replay.yml'
  push:
    branches:
      - main
      - feat/business-campaign-replay-v0-1
    paths:
      - 'crates/mycelix-business-campaign-replay/**'
      - 'crates/mycelix-business-import-membership/**'
      - 'crates/mycelix-business-import-diagnostics/**'
      - 'crates/mycelix-business-adapter-delimited/**'
      - 'crates/mycelix-business-ingress/**'
      - 'crates/mycelix-business-shadow/**'
      - 'crates/mycelix-business-core/**'
      - '.github/workflows/business-campaign-replay.yml'

permissions:
  contents: read

jobs:
  campaign-replay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/mycelix-business-campaign-replay
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
