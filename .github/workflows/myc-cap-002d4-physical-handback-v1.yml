name: MYC-CAP-002D4 Physical Handback v1

on:
  pull_request:
    paths:
      - 'scripts/capital/physical_handback_v1.py'
      - 'scripts/capital/test_physical_handback_v1.py'
      - 'docs/capital/evidence/myc-cap-002d4/**'
      - '.github/workflows/myc-cap-002d4-physical-handback-v1.yml'

permissions:
  contents: read

jobs:
  qualify:
    name: Physical condition and handback reserve
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Exact subject, parent, and scope
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "270b852e0ac744dfca3a2cb966bf53fce78f2ab9"
          expected="$(mktemp)"
          actual="$(mktemp)"
          printf '%s\n' \
            '.github/workflows/myc-cap-002d4-physical-handback-v1.yml' \
            'docs/capital/evidence/myc-cap-002d4/PROFILE.md' \
            'docs/capital/evidence/myc-cap-002d4/example_case.json' \
            'docs/capital/evidence/myc-cap-002d4/example_receipt.json' \
            'scripts/capital/physical_handback_v1.py' \
            'scripts/capital/test_physical_handback_v1.py' | sort > "$expected"
          git diff-tree --no-commit-id --name-only -r HEAD | sort > "$actual"
          diff -u "$expected" "$actual"
          test -z "$(git status --porcelain)"

      - name: Python environment
        run: |
          set -euo pipefail
          python3 --version
          python3 -m py_compile scripts/capital/physical_handback_v1.py
          python3 -m py_compile scripts/capital/test_physical_handback_v1.py

      - name: Fail-closed unit suite
        run: |
          set -euo pipefail
          python3 scripts/capital/test_physical_handback_v1.py -v

      - name: Deterministic example receipt
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          python3 scripts/capital/physical_handback_v1.py \
            docs/capital/evidence/myc-cap-002d4/example_case.json \
            --receipt-out "$tmp"
          diff -u docs/capital/evidence/myc-cap-002d4/example_receipt.json "$tmp"
          cp "$tmp" "${tmp}.second"
          python3 scripts/capital/physical_handback_v1.py \
            docs/capital/evidence/myc-cap-002d4/example_case.json \
            --receipt-out "$tmp"
          cmp "$tmp" "${tmp}.second"
          echo '044cd50acb036813e1861de06b0e3221b957cc8a4c7a87d3d05ffb941e627289  docs/capital/evidence/myc-cap-002d4/example_case.json' | sha256sum -c -
          echo '8631c6bd583a4a02115de694325b8e58cbec7fcf9575bb2289e5fc7b7eb3f955  docs/capital/evidence/myc-cap-002d4/example_receipt.json' | sha256sum -c -

      - name: Strong handback nonclaims
        run: |
          set -euo pipefail
          grep -Fq '"physical_state": "PHYSICAL_CONDITION_ACCEPTABLE"' docs/capital/evidence/myc-cap-002d4/example_receipt.json
          grep -Fq '"handover_accepted": false' docs/capital/evidence/myc-cap-002d4/example_receipt.json
          grep -Fq '"legal_transition_complete": false' docs/capital/evidence/myc-cap-002d4/example_receipt.json
          grep -Fq 'reserve sufficiency is not itself proof of physical condition' docs/capital/evidence/myc-cap-002d4/example_receipt.json
