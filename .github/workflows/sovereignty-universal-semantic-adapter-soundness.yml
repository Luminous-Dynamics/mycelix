name: Sovereignty universal semantic adapter soundness candidate

on:
  - push
  - pull_request
  - workflow_dispatch

permissions:
  contents: read

env:
  NIXPKGS_REV: a50bf0c1b07873c1a53892292017041a8f0a1288
  TLA_URL: "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar"
  TLA_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
  ALLOY_URL: "https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/org.alloytools.alloy.dist.jar"
  ALLOY_SHA256: 6b8c1cb5bc93bedfc7c61435c4e1ab6e688a242dc702a394628d9a9801edb78d

jobs:
  universal-semantic-adapter-soundness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact candidate head
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Static matrix and Python syntax
        run: |
          set -euo pipefail
          python3 -m py_compile             mycelix-governance/tools/formal/universal_semantic_adapter_soundness_reference.py             mycelix-governance/tools/formal/test_universal_semantic_adapter_soundness_matrix.py             mycelix-governance/tools/formal/run_universal_semantic_adapter_soundness_matrix.py
          python3 -m json.tool             docs/qualification/SOVEREIGNTY_EVIDENCE_ATTESTATION_UNIVERSAL_SEMANTIC_ADAPTER_SOUNDNESS_CONTROL_MATRIX_V1.json >/dev/null
          python3             mycelix-governance/tools/formal/test_universal_semantic_adapter_soundness_matrix.py             --matrix             docs/qualification/SOVEREIGNTY_EVIDENCE_ATTESTATION_UNIVERSAL_SEMANTIC_ADAPTER_SOUNDNESS_CONTROL_MATRIX_V1.json             --tla             mycelix-governance/specs/EvidenceAttestationUniversalSemanticAdapterSoundnessV1.tla             --negative-tla             mycelix-governance/specs/EvidenceAttestationUniversalSemanticAdapterSoundnessV1NegativeControls.tla             --alloy             mycelix-governance/specs/alloy/EvidenceAttestationUniversalSemanticAdapterSoundnessV1.als             --reference             mycelix-governance/tools/formal/universal_semantic_adapter_soundness_reference.py

      - name: Install pinned Nix toolchain
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Download and hash formal tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/universal-semantic-adapter-soundness-tools"
          nix shell "github:NixOS/nixpkgs/$NIXPKGS_REV#curl" "github:NixOS/nixpkgs/$NIXPKGS_REV#coreutils"             --command bash -euo pipefail -c '
              curl --fail --location --retry 3 --retry-all-errors                 --output "$RUNNER_TEMP/universal-semantic-adapter-soundness-tools/tla2tools.jar"                 "$TLA_URL"
              curl --fail --location --retry 3 --retry-all-errors                 --output "$RUNNER_TEMP/universal-semantic-adapter-soundness-tools/alloy.jar"                 "$ALLOY_URL"
              printf "%s  %s\n" "$TLA_SHA256"                 "$RUNNER_TEMP/universal-semantic-adapter-soundness-tools/tla2tools.jar"                 | sha256sum --check --strict
              printf "%s  %s\n" "$ALLOY_SHA256"                 "$RUNNER_TEMP/universal-semantic-adapter-soundness-tools/alloy.jar"                 | sha256sum --check --strict
            '

      - name: Compile Alloy runner
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/universal-semantic-adapter-soundness-java"
          mkdir -p "$RUNNER_TEMP/universal-semantic-adapter-soundness-evidence"
          nix shell "github:NixOS/nixpkgs/$NIXPKGS_REV#jdk17_headless"             --command bash -euo pipefail -c '
              javac                 -cp "$RUNNER_TEMP/universal-semantic-adapter-soundness-tools/alloy.jar"                 -d "$RUNNER_TEMP/universal-semantic-adapter-soundness-java"                 mycelix-governance/tools/formal/AgentDelegationAuthorityAlloyRunner.java
              java -version 2>&1                 | tee "$RUNNER_TEMP/universal-semantic-adapter-soundness-evidence/java-version.txt"
              javac -version 2>&1                 | tee "$RUNNER_TEMP/universal-semantic-adapter-soundness-evidence/javac-version.txt"
              printf '{"schema":"mycelix.evidence-attestation-capability-formal-runtime.v1","nixpkgs_rev":"%s","jdk_package":"jdk17_headless","java_major":17}\n'                 "$NIXPKGS_REV"                 > "$RUNNER_TEMP/universal-semantic-adapter-soundness-evidence/runtime.json"
            '

      - name: Execute exact formal matrix
        run: |
          set -euo pipefail
          python3             mycelix-governance/tools/formal/run_universal_semantic_adapter_soundness_matrix.py             --matrix             docs/qualification/SOVEREIGNTY_EVIDENCE_ATTESTATION_UNIVERSAL_SEMANTIC_ADAPTER_SOUNDNESS_CONTROL_MATRIX_V1.json             --tla             mycelix-governance/specs/EvidenceAttestationUniversalSemanticAdapterSoundnessV1.tla             --canonical-cfg             mycelix-governance/specs/EvidenceAttestationUniversalSemanticAdapterSoundnessV1.cfg             --negative-tla             mycelix-governance/specs/EvidenceAttestationUniversalSemanticAdapterSoundnessV1NegativeControls.tla             --negative-cfg-dir             mycelix-governance/specs             --alloy             mycelix-governance/specs/alloy/EvidenceAttestationUniversalSemanticAdapterSoundnessV1.als             --runner-class-dir             "$RUNNER_TEMP/universal-semantic-adapter-soundness-java"             --alloy-jar             "$RUNNER_TEMP/universal-semantic-adapter-soundness-tools/alloy.jar"             --tla-jar             "$RUNNER_TEMP/universal-semantic-adapter-soundness-tools/tla2tools.jar"             --reference             mycelix-governance/tools/formal/universal_semantic_adapter_soundness_reference.py             --runtime             "$RUNNER_TEMP/universal-semantic-adapter-soundness-evidence/runtime.json"             --evidence-dir             "$RUNNER_TEMP/universal-semantic-adapter-soundness-evidence"

      - name: Verify repository postflight
        if: always()
        run: |
          set -euo pipefail
          test "$(git status --porcelain)" = ""

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sovereignty-universal-semantic-adapter-soundness-${{ github.run_id }}
          path: ${{ runner.temp }}/universal-semantic-adapter-soundness-evidence
          if-no-files-found: warn
          retention-days: 30
