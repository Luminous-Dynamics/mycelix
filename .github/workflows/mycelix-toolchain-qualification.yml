name: Mycelix Holochain Rust toolchain qualification

on:
  pull_request:
    paths:
      - "mycelix-workspace/rust-toolchain.toml"
      - "mycelix-workspace/mycelix-finance/**"
      - "mycelix-workspace/mycelix-governance/**"
      - "mycelix-workspace/mycelix-core/libs/**"
      - "mycelix-workspace/crates/**"
      - ".github/workflows/mycelix-toolchain-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mycelix-toolchain-qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  qualify:
    name: "${{ matrix.cluster }} / Rust ${{ matrix.rust }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.96.0", "1.99.1", "1.100.0"]
        cluster: ["finance", "governance"]

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install exact Rust toolchain and Holochain WASM target
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Record exact compiler, Cargo and target identity
        shell: bash
        run: |
          set -euo pipefail
          rustc +"${{ matrix.rust }}" -Vv | tee rustc-version.txt
          cargo +"${{ matrix.rust }}" -Vv | tee cargo-version.txt
          grep -F "rustc ${{ matrix.rust }} " rustc-version.txt
          grep -F "cargo ${{ matrix.rust }} " cargo-version.txt
          rustup target list --toolchain "${{ matrix.rust }}" --installed | grep -x wasm32-unknown-unknown
          {
            echo "## Exact qualification identity"
            echo
            echo "- Git head: $(git rev-parse HEAD)"
            echo "- Cluster: ${{ matrix.cluster }}"
            echo "- rustc: $(rustc +"${{ matrix.rust }}" --version)"
            echo "- cargo: $(cargo +"${{ matrix.rust }}" --version)"
            echo "- Target: wasm32-unknown-unknown"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record cluster lockfile identity
        id: lock-before
        shell: bash
        run: |
          set -euo pipefail
          LOCK="mycelix-workspace/mycelix-${{ matrix.cluster }}/Cargo.lock"
          sha256sum "$LOCK" | tee lockfile-before.txt
          echo "sha256=$(sha256sum "$LOCK" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Parse workspace manifests without dependency resolution
        id: metadata
        working-directory: mycelix-workspace/mycelix-${{ matrix.cluster }}
        run: cargo +"${{ matrix.rust }}" metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Resolve the complete locked dependency graph
        id: resolve
        working-directory: mycelix-workspace/mycelix-${{ matrix.cluster }}
        run: cargo +"${{ matrix.rust }}" metadata --locked --format-version 1 > /dev/null

      - name: Compile the cluster workspace
        id: check
        working-directory: mycelix-workspace/mycelix-${{ matrix.cluster }}
        run: cargo +"${{ matrix.rust }}" check --locked --workspace

      - name: Run cluster security and library tests
        id: test
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.cluster }}" == "finance" ]]; then
            cd mycelix-workspace/mycelix-finance
            cargo +"${{ matrix.rust }}" test --locked --lib \
              -p payments_integrity \
              -p credit_scoring_integrity \
              -p lending_integrity \
              -p treasury_integrity \
              -p tend_integrity \
              -p hearth_integrity \
              -p cgc_integrity \
              -p staking_integrity \
              -p recognition_integrity
          else
            cd mycelix-workspace/mycelix-governance
            cargo +"${{ matrix.rust }}" test --locked --workspace --lib
          fi

      - name: Run Clippy on cluster library targets
        id: clippy
        working-directory: mycelix-workspace/mycelix-${{ matrix.cluster }}
        run: cargo +"${{ matrix.rust }}" clippy --locked --workspace --lib

      - name: Build release Holochain WASM zomes
        id: wasm
        shell: bash
        run: |
          set -euo pipefail
          cd "mycelix-workspace/mycelix-${{ matrix.cluster }}"
          if [[ "${{ matrix.cluster }}" == "finance" ]]; then
            cargo +"${{ matrix.rust }}" build --locked --release \
              --target wasm32-unknown-unknown --workspace \
              --exclude finance-leptos-types \
              --message-format=json-render-diagnostics \
              > "$RUNNER_TEMP/cargo-wasm-messages.jsonl" \
              2> "$RUNNER_TEMP/cargo-wasm-diagnostics.log"
          else
            cargo +"${{ matrix.rust }}" build --locked --release \
              --target wasm32-unknown-unknown --workspace \
              --message-format=json-render-diagnostics \
              > "$RUNNER_TEMP/cargo-wasm-messages.jsonl" \
              2> "$RUNNER_TEMP/cargo-wasm-diagnostics.log"
          fi


      - name: Capture WASM package identity, artifact size and SHA-256
        id: wasm-manifest
        shell: bash
        env:
          CLUSTER: ${{ matrix.cluster }}
          RUST_VERSION: ${{ matrix.rust }}
        run: |
          set -Eeuo pipefail
          command -v jq >/dev/null 2>&1
          command -v sha256sum >/dev/null 2>&1
          command -v stat >/dev/null 2>&1
          OUT="$RUNNER_TEMP/mycelix-wasm-evidence"
          mkdir -p "$OUT"
          RAW="$RUNNER_TEMP/cargo-wasm-messages.jsonl"
          MANIFEST="$OUT/wasm-artifacts.jsonl"
          : > "$MANIFEST"

          jq -c '
            select(.reason == "compiler-artifact")
            | . as $artifact
            | .filenames[]?
            | select(endswith(".wasm"))
            | {
                package_id: $artifact.package_id,
                target: $artifact.target,
                filename: .
              }
          ' "$RAW" | while IFS= read -r row; do
            file="$(jq -r '.filename' <<< "$row")"
            [[ -f "$file" ]] || {
              echo "Cargo reported a missing WASM artifact: $file" >&2
              exit 1
            }
            digest="$(sha256sum "$file" | awk '{print $1}')"
            bytes="$(stat -c %s "$file")"
            jq -c \
              --arg sha256 "$digest" \
              --argjson bytes "$bytes" \
              '. + {size_bytes: $bytes, sha256: $sha256}' \
              <<< "$row" >> "$MANIFEST"
          done

          [[ -s "$MANIFEST" ]] || {
            echo "No .wasm compiler-artifact records were emitted." >&2
            cat "$RUNNER_TEMP/cargo-wasm-diagnostics.log" >&2 || true
            exit 1
          }

          {
            echo "## WASM artifact receipt"
            echo
            echo "- Cluster: $CLUSTER"
            echo "- Rust/Cargo: $RUST_VERSION"
            echo "- Exact source: $(git rev-parse HEAD)"
            echo "- Lockfile SHA-256: $(sha256sum "mycelix-workspace/mycelix-$CLUSTER/Cargo.lock" | awk '{print $1}')"
            echo "- Artifact records: $(wc -l < "$MANIFEST" | tr -d ' ')"
            echo
            echo "| Package | Target | Bytes | SHA-256 |"
            echo "|---|---|---:|---|"
            jq -r '[.package_id, .target.name, (.size_bytes|tostring), .sha256] | "| " + join(" | ") + " |"' "$MANIFEST"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "manifest=$MANIFEST" >> "$GITHUB_OUTPUT"

      - name: Upload exact WASM artifact receipts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mycelix-wasm-${{ matrix.cluster }}-rust-${{ matrix.rust }}-${{ github.sha }}
          path: |
            ${{ steps.wasm-manifest.outputs.manifest }}
            ${{ runner.temp }}/cargo-wasm-diagnostics.log
          if-no-files-found: error
          retention-days: 30

      - name: Diagnose lockfile or build failure in disposable source snapshot
        if: failure() && (steps.resolve.outcome == 'failure' || steps.check.outcome == 'failure' || steps.test.outcome == 'failure' || steps.clippy.outcome == 'failure' || steps.wasm.outcome == 'failure')
        shell: bash
        env:
          CLUSTER: ${{ matrix.cluster }}
          RUST_VERSION: ${{ matrix.rust }}
        run: |
          set -Eeuo pipefail
          SNAPSHOT="$RUNNER_TEMP/mycelix-lock-diagnosis"
          mkdir -p "$SNAPSHOT"
          git archive HEAD | tar -x -C "$SNAPSHOT"
          WORKSPACE="$SNAPSHOT/mycelix-workspace/mycelix-$CLUSTER"
          ORIGINAL="$GITHUB_WORKSPACE/mycelix-workspace/mycelix-$CLUSTER/Cargo.lock"
          GENERATED="$WORKSPACE/Cargo.lock"
          set +e
          cargo +"$RUST_VERSION" metadata \
            --manifest-path "$WORKSPACE/Cargo.toml" \
            --format-version 1 > "$RUNNER_TEMP/unlocked-metadata.json" \
            2> "$RUNNER_TEMP/unlocked-metadata.stderr"
          status=$?
          set -e
          {
            echo "## Disposable Cargo.lock diagnosis: $CLUSTER / Rust $RUST_VERSION"
            echo
            echo "- Exact source: $(git rev-parse HEAD)"
            echo "- Diagnostic command exit: $status"
            echo "- Original lock SHA-256: $(sha256sum "$ORIGINAL" | awk '{print $1}')"
            echo "- Generated lock SHA-256: $(sha256sum "$GENERATED" | awk '{print $1}')"
            echo "- Original lock changed in checkout: NO"
            echo
            echo "The unlocked resolution ran only inside a temporary Git archive snapshot. It is diagnostic evidence, not a qualification pass."
            echo
            echo "Cargo diagnostics:"
            tail -n 120 "$RUNNER_TEMP/unlocked-metadata.stderr" || true
            echo
            echo "Cargo-generated lockfile delta (first 320 lines):"
            diff -u "$ORIGINAL" "$GENERATED" | head -n 320 || true
          } >> "$GITHUB_STEP_SUMMARY"
          diff -u "$ORIGINAL" "$GENERATED" | head -n 320 || true
          test "$(sha256sum "$ORIGINAL" | awk '{print $1}')" = "$(sha256sum "$GITHUB_WORKSPACE/mycelix-workspace/mycelix-$CLUSTER/Cargo.lock" | awk '{print $1}')"

      - name: Enforce original lockfile immutability
        if: always()
        shell: bash
        env:
          EXPECTED: ${{ steps.lock-before.outputs.sha256 }}
        run: |
          set -euo pipefail
          LOCK="mycelix-workspace/mycelix-${{ matrix.cluster }}/Cargo.lock"
          ACTUAL="$(sha256sum "$LOCK" | awk '{print $1}')"
          echo "lockfile_before=$EXPECTED"
          echo "lockfile_after=$ACTUAL"
          [[ -n "$EXPECTED" && "$EXPECTED" == "$ACTUAL" ]]
          git diff --exit-code -- "$LOCK"
