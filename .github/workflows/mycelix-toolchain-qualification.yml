name: Mycelix Holochain Rust toolchain qualification

on:
  pull_request:
    paths:
      - "mycelix-workspace/rust-toolchain.toml"
      - "mycelix-workspace/mycelix-finance/**"
      - "mycelix-workspace/mycelix-governance/**"
      - "mycelix-workspace/crates/**"
      - ".github/workflows/mycelix-toolchain-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mycelix-toolchain-qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  baseline-1-96:
    name: Existing pinned baseline (Rust 1.96.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install baseline Rust, Cargo and Holochain WASM target
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Record exact toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv | tee rustc-version.txt
          cargo -Vv | tee cargo-version.txt
          grep -F 'rustc 1.96.0 ' rustc-version.txt
          grep -F 'cargo 1.96.0 ' cargo-version.txt
          rustup target list --installed | grep -x wasm32-unknown-unknown

      - name: Resolve Finance workspace with locked metadata
        working-directory: mycelix-workspace/mycelix-finance
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Resolve Governance workspace with locked metadata
        working-directory: mycelix-workspace/mycelix-governance
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Compile the verified Finance workspace
        working-directory: mycelix-workspace/mycelix-finance
        run: cargo check --locked --workspace

      - name: Compile the verified Governance workspace
        working-directory: mycelix-workspace/mycelix-governance
        run: cargo check --locked --workspace

      - name: Run Finance author-binding security regression tests
        working-directory: mycelix-workspace/mycelix-finance
        run: |
          cargo test --locked --lib \
            -p payments_integrity \
            -p credit_scoring_integrity \
            -p lending_integrity \
            -p treasury_integrity \
            -p tend_integrity \
            -p hearth_integrity \
            -p cgc_integrity \
            -p staking_integrity \
            -p recognition_integrity

      - name: Run Governance workspace library tests
        working-directory: mycelix-workspace/mycelix-governance
        run: cargo test --locked --workspace --lib

      - name: Build Finance release WASM zomes
        working-directory: mycelix-workspace/mycelix-finance
        run: cargo build --locked --release --target wasm32-unknown-unknown --workspace --exclude finance-leptos-types

      - name: Build Governance release WASM zomes
        working-directory: mycelix-workspace/mycelix-governance
        run: cargo build --locked --release --target wasm32-unknown-unknown --workspace --exclude finance-leptos-types

      - name: Enforce Finance and Governance lockfile immutability
        run: git diff --exit-code -- mycelix-workspace/mycelix-finance/Cargo.lock mycelix-workspace/mycelix-governance/Cargo.lock

  candidate-1-99:
    name: Candidate compatibility (Rust 1.99.1)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install candidate Rust, Cargo and Holochain WASM target
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Record exact toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv | tee rustc-version.txt
          cargo -Vv | tee cargo-version.txt
          grep -F 'rustc 1.99.1 ' rustc-version.txt
          grep -F 'cargo 1.99.1 ' cargo-version.txt
          rustup target list --installed | grep -x wasm32-unknown-unknown

      - name: Resolve Finance workspace with locked metadata
        working-directory: mycelix-workspace/mycelix-finance
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Resolve Governance workspace with locked metadata
        working-directory: mycelix-workspace/mycelix-governance
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Compile the verified Finance workspace
        working-directory: mycelix-workspace/mycelix-finance
        run: cargo check --locked --workspace

      - name: Compile the verified Governance workspace
        working-directory: mycelix-workspace/mycelix-governance
        run: cargo check --locked --workspace

      - name: Run Finance author-binding security regression tests
        working-directory: mycelix-workspace/mycelix-finance
        run: |
          cargo test --locked --lib \
            -p payments_integrity \
            -p credit_scoring_integrity \
            -p lending_integrity \
            -p treasury_integrity \
            -p tend_integrity \
            -p hearth_integrity \
            -p cgc_integrity \
            -p staking_integrity \
            -p recognition_integrity

      - name: Run Governance workspace library tests
        working-directory: mycelix-workspace/mycelix-governance
        run: cargo test --locked --workspace --lib

      - name: Build Finance release WASM zomes
        working-directory: mycelix-workspace/mycelix-finance
        run: cargo build --locked --release --target wasm32-unknown-unknown --workspace --exclude finance-leptos-types

      - name: Build Governance release WASM zomes
        working-directory: mycelix-workspace/mycelix-governance
        run: cargo build --locked --release --target wasm32-unknown-unknown --workspace --exclude finance-leptos-types

      - name: Enforce Finance and Governance lockfile immutability
        run: git diff --exit-code -- mycelix-workspace/mycelix-finance/Cargo.lock mycelix-workspace/mycelix-governance/Cargo.lock
