name: Integration HTTP Credential Slot Qualification

on:
  pull_request:
    branches:
      - feat/integration-http-egress-route-v1
      - main
    paths:
      - 'crates/mycelix-integration-http-credential-slot/**'
      - '.github/workflows/integration-http-credential-slot-qualification.yml'
  push:
    branches:
      - feat/integration-http-credential-slot-v1
    paths:
      - 'crates/mycelix-integration-http-credential-slot/**'
      - '.github/workflows/integration-http-credential-slot-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MANIFEST: crates/mycelix-integration-http-credential-slot/Cargo.toml
  SOURCE: crates/mycelix-integration-http-credential-slot/src/lib.rs

concurrency:
  group: integration-http-credential-slot-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Exact-version non-secret credential provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/mycelix-integration-http-credential-slot

      - name: Check formatting
        run: cargo fmt --manifest-path "$MANIFEST" --all --check

      - name: Compile tests without running
        run: cargo test --manifest-path "$MANIFEST" --no-run

      - name: Run tests
        run: cargo test --manifest-path "$MANIFEST"

      - name: Clippy
        run: cargo clippy --manifest-path "$MANIFEST" --all-targets -- -D warnings

      - name: Enforce exact policy slot and provider scope
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'observation.slot_id != policy.credential_slot_id' "$SOURCE"
          grep -Fq 'observation.credential_header_name != policy.credential_header_name' "$SOURCE"
          grep -Fq 'observation.connector_instance != policy.connector_instance' "$SOURCE"
          grep -Fq 'observation.system != policy.system' "$SOURCE"
          grep -Fq '&observation.provider_profile_commitment != transport.provider_profile_commitment()' "$SOURCE"
          grep -Fq 'observation.rotation_generation == 0' "$SOURCE"
          grep -Fq 'observation.handle_commitment.0 == [0; 32]' "$SOURCE"

      - name: Enforce exact version and no fallback semantics
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'exact_version_resolution_required_here(&self) -> bool' "$SOURCE"
          grep -Fq 'fallback_to_latest_allowed_here(&self) -> bool' "$SOURCE"
          grep -Fq 'environment_credential_fallback_allowed_here(&self) -> bool' "$SOURCE"
          grep -Fq 'version_id' "$SOURCE"
          grep -Fq 'rotation_generation' "$SOURCE"
          grep -Fq 'handle_commitment' "$SOURCE"

      - name: Enforce no secret material in qualification
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'credential_material_present_here(&self) -> bool' "$SOURCE"
          grep -Fq 'credential_material_hashed_here(&self) -> bool' "$SOURCE"
          grep -Fq 'credential_material_persisted_here(&self) -> bool' "$SOURCE"
          grep -Fq 'secret_manager_access_performed_here(&self) -> bool' "$SOURCE"
          grep -Fq 'metadata_origin_verified_here(&self) -> bool' "$SOURCE"
          if grep -Eq 'pub (secret|credential_value|api_key|token|password)[[:space:]]*:' "$SOURCE"; then
            echo 'Credential qualifier gained a secret-material field.'
            exit 1
          fi
          if grep -Eq 'pub fn (secret|credential_value|api_key|token|password)\(' "$SOURCE"; then
            echo 'Credential qualifier exposes secret material.'
            exit 1
          fi

      - name: Enforce live window is bounded by transport policy
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'transport.valid_until_ms() <= now_ms' "$SOURCE"
          grep -Fq 'observation.observed_at_ms > now_ms' "$SOURCE"
          grep -Fq 'observation.valid_until_ms <= now_ms' "$SOURCE"
          grep -Fq 'observation.valid_until_ms.min(transport.valid_until_ms())' "$SOURCE"
          grep -Fq 'transport.binding_digest()' "$SOURCE"

      - name: Enforce no secret-manager/runtime capability in pure qualifier
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          meta = json.loads(subprocess.check_output([
              'cargo','metadata','--manifest-path',
              'crates/mycelix-integration-http-credential-slot/Cargo.toml',
              '--no-deps','--format-version','1'
          ]))
          package = next(p for p in meta['packages'] if p['name'] == 'mycelix-integration-http-credential-slot')
          direct = {d['name'] for d in package['dependencies']}
          forbidden = {'keyring','vault','vaultrs','aws-sdk-secretsmanager','secret-service','reqwest','hyper','tokio','openssl'}
          hit = sorted(direct & forbidden)
          if hit:
              raise SystemExit(f'secret/network runtime entered pure credential qualifier: {hit}')
          PY
          if grep -Eq 'std::env|keyring::|vault::|vaultrs::|secret_service::|aws_sdk_secretsmanager|reqwest::|TcpStream|read_to_string' "$SOURCE"; then
            echo 'Credential qualifier crossed into secret/environment/network access.'
            exit 1
          fi
