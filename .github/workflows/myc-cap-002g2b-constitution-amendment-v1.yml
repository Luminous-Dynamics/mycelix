name: MYC-CAP-002G2B Constitution Amendment v1

on:
  pull_request:
    paths:
      - 'scripts/capital/constitution_amendment_v1.py'
      - 'scripts/capital/test_constitution_amendment_v1.py'
      - 'docs/capital/evidence/myc-cap-002g2b/**'
      - '.github/workflows/myc-cap-002g2b-constitution-amendment-v1.yml'

permissions:
  contents: read

jobs:
  qualify:
    name: Authorized non-resetting constitution amendment
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Exact PR head and parent
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD^)" = "6b780ea4deb2b88c2581870134ab889ceb8b7a43"

      - name: Python environment
        run: |
          set -euo pipefail
          python3 --version
          python3 -m py_compile scripts/capital/governance_decision_currentness_v1.py
          python3 -m py_compile scripts/capital/constitution_amendment_v1.py
          python3 -m py_compile scripts/capital/test_constitution_amendment_v1.py

      - name: Fail-closed unit suite
        run: |
          set -euo pipefail
          python3 -m unittest -v scripts/capital/test_constitution_amendment_v1.py

      - name: Deterministic example receipt
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          python3 scripts/capital/constitution_amendment_v1.py docs/capital/evidence/myc-cap-002g2b/example_case.json --receipt-out "$tmp"
          diff -u docs/capital/evidence/myc-cap-002g2b/example_receipt.json "$tmp"
          python3 scripts/capital/constitution_amendment_v1.py docs/capital/evidence/myc-cap-002g2b/example_case.json --receipt-out "${tmp}.second"
          cmp "$tmp" "${tmp}.second"

      - name: Frozen commitments
        run: |
          set -euo pipefail
          echo '6900a6be578b706e7014d5f433352a183bc8b0cb24a5e9e21e44307652b830c6  docs/capital/evidence/myc-cap-002g2b/example_case.json' | sha256sum -c -
          echo 'd26ee8750ef11b23809321501cdd2dc8e7d491b9e12a5baa5ace9afea85b339b  docs/capital/evidence/myc-cap-002g2b/example_receipt.json' | sha256sum -c -
          echo '6ca0fc77a490a5951c72f4627a01a7ecd4eca7d3c5196ead0aa09d2368f5ec0c  scripts/capital/constitution_amendment_v1.py' | sha256sum -c -
          echo 'f5ac64c3d38b9d13b80c6d0d9d05e654f32969b4604603e819b71778b7be0352  scripts/capital/test_constitution_amendment_v1.py' | sha256sum -c -

      - name: Strong nonclaims
        run: |
          set -euo pipefail
          grep -Fq '"transition_state":"ACCEPTED"' docs/capital/evidence/myc-cap-002g2b/example_receipt.json
          grep -Fq '"successor_designation_established":false' docs/capital/evidence/myc-cap-002g2b/example_receipt.json
          grep -Fq '"legal_validity_established":false' docs/capital/evidence/myc-cap-002g2b/example_receipt.json
          grep -Fq '"democratic_legitimacy_established":false' docs/capital/evidence/myc-cap-002g2b/example_receipt.json
