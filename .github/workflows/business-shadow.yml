name: Business Shadow Qualification

on:
  pull_request:
    paths:
      - 'crates/mycelix-business-core/**'
      - 'crates/mycelix-business-decision/**'
      - 'crates/mycelix-business-shadow/**'
      - '.github/workflows/business-shadow.yml'
  push:
    branches:
      - main
      - 'feat/business-shadow-*'
    paths:
      - 'crates/mycelix-business-core/**'
      - 'crates/mycelix-business-decision/**'
      - 'crates/mycelix-business-shadow/**'
      - '.github/workflows/business-shadow.yml'

permissions:
  contents: read

jobs:
  business-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path crates/mycelix-business-shadow/Cargo.toml --all --check
      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-business-shadow/Cargo.toml --all-targets -- -D warnings
      - name: Test shadow qualification contracts
        run: cargo test --manifest-path crates/mycelix-business-shadow/Cargo.toml --all-targets
