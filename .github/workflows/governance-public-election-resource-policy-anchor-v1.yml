name: Governance Public Election Resource Policy Anchor v1

on:
  pull_request:
    paths:
      - '.github/workflows/governance-public-election-resource-policy-anchor-v1.yml'
      - 'mycelix-governance/crates/election-resource-policy-anchor/**'
      - 'mycelix-governance/docs/PUBLIC_ELECTION_RESOURCE_POLICY_ANCHOR_V1.md'

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: '1.96.0'
  BASE_SHA: '383ee4c1b2c3710e3a882266a56d4d1641e69c7d'

jobs:
  qualify:
    name: Qualify non-circular resource-policy anchoring
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/governance-public-election-resource-policy-anchor-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Bind exact ELECT-014 delta
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          test "${#changed[@]}" -eq 4
          printf '%s\n' "${changed[@]}" | sort > /tmp/elect-014-files.txt
          cat > /tmp/elect-014-expected.txt <<'EOF'
          .github/workflows/governance-public-election-resource-policy-anchor-v1.yml
          mycelix-governance/crates/election-resource-policy-anchor/Cargo.toml
          mycelix-governance/crates/election-resource-policy-anchor/src/lib.rs
          mycelix-governance/docs/PUBLIC_ELECTION_RESOURCE_POLICY_ANCHOR_V1.md
          EOF
          sort -o /tmp/elect-014-expected.txt /tmp/elect-014-expected.txt
          diff -u /tmp/elect-014-expected.txt /tmp/elect-014-files.txt
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt,clippy

      - name: Format ELECT-014 crate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path mycelix-governance/crates/election-resource-policy-anchor/Cargo.toml -- --check

      - name: Generate exact dependency lock
        shell: bash
        run: |
          set -euo pipefail
          cd mycelix-governance/crates/election-resource-policy-anchor
          cargo generate-lockfile
          cp Cargo.lock /tmp/elect-014-Cargo.lock
          sha256sum Cargo.lock | tee /tmp/elect-014-lock.sha256
          cargo metadata --locked --format-version 1 > /tmp/elect-014-metadata.json

      - name: Execute resource-policy anchoring tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path mycelix-governance/crates/election-resource-policy-anchor/Cargo.toml --locked 2>&1 | tee /tmp/elect-014-test.log

      - name: Run warning-fatal library Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path mycelix-governance/crates/election-resource-policy-anchor/Cargo.toml --locked --lib -- -D warnings 2>&1 | tee /tmp/elect-014-clippy.log

      - name: Audit anchoring and acyclicity boundaries
        shell: bash
        run: |
          set -euo pipefail
          src='mycelix-governance/crates/election-resource-policy-anchor/src/lib.rs'
          grep -F 'RESOURCE_POLICY_ANCHOR_PROFILE_ID' "$src"
          grep -F 'RESOURCE_POLICY_COMMITMENT_HASH_ID' "$src"
          grep -F 'RESOURCE_POLICY_DOMAIN' "$src"
          grep -F 'CERTIFICATION_BINDING_DOMAIN' "$src"
          grep -F 'Sha256' "$src"
          grep -F 'PreflightResourcePolicyDigestMismatch' "$src"
          grep -F 'ElectionConstitutionArtifactDigestMismatch' "$src"
          grep -F 'CertificationPolicyArtifactDigestMismatch' "$src"
          grep -F 'resource_commitment_is_acyclic_over_downstream_constitution_digests' "$src"
          grep -F 'oversized_but_structurally_valid_preflight_remains_anchorable' "$src"
          if grep -Eq 'SystemTime|thread_rng|std::net|reqwest|tokio::net' "$src"; then
            echo 'ELECT-014 must remain deterministic and offline' >&2
            exit 1
          fi
          if grep -Eq '^use (hdk|hdi|voting_integrity)' "$src"; then
            echo 'ELECT-014 must remain runtime independent' >&2
            exit 1
          fi

      - name: Remove transient lock and prove immutable checkout
        if: always()
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          rm -f mycelix-governance/crates/election-resource-policy-anchor/Cargo.lock
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git status --porcelain=v1 --untracked-files=all > /tmp/elect-014-status.txt
          test ! -s /tmp/elect-014-status.txt

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: elect-014-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: |
            /tmp/elect-014-Cargo.lock
            /tmp/elect-014-lock.sha256
            /tmp/elect-014-metadata.json
            /tmp/elect-014-test.log
            /tmp/elect-014-clippy.log
            /tmp/elect-014-status.txt
          if-no-files-found: warn
          retention-days: 30
