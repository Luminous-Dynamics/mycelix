name: MFG-PROC-001A Typed Reference Qualification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "mycelix-workspace/mycelix-manufacturing/**"
      - ".github/workflows/mfg-proc-001a.yml"
  push:
    branches:
      - "feat/mfg-proc-001a-typed-process-refs-v0.1"
    paths:
      - "mycelix-workspace/mycelix-manufacturing/**"
      - ".github/workflows/mfg-proc-001a.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mfg-proc-001a-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  typed-reference-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-workspace/mycelix-manufacturing
      - name: Apply formatter to affected workspace
        run: |
          cargo fmt --manifest-path mycelix-workspace/mycelix-manufacturing/Cargo.toml \
            --package manufacturing_common \
            --package operations_integrity \
            --package operations \
            --package machines_integrity \
            --package machines
      - name: Check formatting
        run: |
          cargo fmt --manifest-path mycelix-workspace/mycelix-manufacturing/Cargo.toml \
            --package manufacturing_common \
            --package operations_integrity \
            --package operations \
            --package machines_integrity \
            --package machines -- --check
      - name: Capture formatter patch for source review
        if: always()
        run: |
          git diff --binary > mfg-proc-001a-rustfmt.patch
          git diff --name-only > mfg-proc-001a-rustfmt-files.txt
      - name: Upload formatter patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mfg-proc-001a-rustfmt-patch
          path: |
            mfg-proc-001a-rustfmt.patch
            mfg-proc-001a-rustfmt-files.txt
          if-no-files-found: warn
      - name: Test manufacturing common and typed zome contracts
        run: |
          cargo test --manifest-path mycelix-workspace/mycelix-manufacturing/Cargo.toml \
            -p manufacturing_common \
            -p operations_integrity \
            -p operations \
            -p machines_integrity \
            -p machines
      - name: Run strict Clippy on changed Rust packages
        run: |
          cargo clippy --manifest-path mycelix-workspace/mycelix-manufacturing/Cargo.toml \
            -p manufacturing_common \
            -p operations_integrity \
            -p operations \
            -p machines_integrity \
            -p machines \
            --all-targets -- -D warnings
      - name: Validate frozen schema and migration fixtures
        run: |
          python -m json.tool mycelix-workspace/mycelix-manufacturing/schemas/mfg_proc_001a/typed_process_refs_v0_1.schema.json >/dev/null
          python -m json.tool mycelix-workspace/mycelix-manufacturing/schemas/mfg_proc_001a/process_registry_entry_v0_1.schema.json >/dev/null
          python -m json.tool mycelix-workspace/mycelix-manufacturing/tests/fixtures/mfg_proc_001a_typed_process_refs_v0_1.json >/dev/null
