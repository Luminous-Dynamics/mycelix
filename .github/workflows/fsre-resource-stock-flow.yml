name: FSRE resource stock-flow reference
on:
  pull_request:
    paths:
      - "tools/fsre-resource-stock-flow/**"
      - ".github/workflows/fsre-resource-stock-flow.yml"
  push:
    branches:
      - main
      - research/fsre-federated-resilience-v0.1
    paths:
      - "tools/fsre-resource-stock-flow/**"
      - ".github/workflows/fsre-resource-stock-flow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stock-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path tools/fsre-resource-stock-flow/Cargo.toml --all -- --check
      - name: Run deterministic tests
        run: cargo test --locked --offline --manifest-path tools/fsre-resource-stock-flow/Cargo.toml
      - name: Verify CLI golden report
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          cargo run --quiet --locked --offline --manifest-path tools/fsre-resource-stock-flow/Cargo.toml -- tools/fsre-resource-stock-flow/fixtures/synthetic-balanced.psv > "$output"
          diff -u tools/fsre-resource-stock-flow/fixtures/synthetic-balanced.expected.txt "$output"
      - name: Run Clippy
        run: cargo clippy --locked --offline --manifest-path tools/fsre-resource-stock-flow/Cargo.toml --all-targets -- -D warnings
