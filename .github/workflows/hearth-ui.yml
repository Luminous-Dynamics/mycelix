name: Hearth UI

on:
  push:
    branches: [main]
    paths:
      - 'mycelix-hearth/apps/leptos/**'
      - 'mycelix-hearth/crates/hearth-leptos-types/**'
      - 'crates/mycelix-leptos-core/**'
      - 'crates/mycelix-leptos-client/**'
      - 'crates/mycelix-leptos-ui/**'
      - 'mycelix-personal/crates/personal-leptos-types/**'
      - 'mycelix-workspace/mycelix-personal/crates/personal-leptos-types/**'
      - '.github/workflows/hearth-ui.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'mycelix-hearth/apps/leptos/**'
      - 'mycelix-hearth/crates/hearth-leptos-types/**'
      - 'crates/mycelix-leptos-core/**'
      - 'crates/mycelix-leptos-client/**'
      - 'crates/mycelix-leptos-ui/**'
      - 'mycelix-personal/crates/personal-leptos-types/**'
      - 'mycelix-workspace/mycelix-personal/crates/personal-leptos-types/**'
      - '.github/workflows/hearth-ui.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hearth-ui:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            mycelix-hearth/apps/leptos
            crates/mycelix-leptos-ui
            crates/mycelix-leptos-core
            crates/mycelix-leptos-client

      - uses: jetli/trunk-action@v0.5.1
        with:
          version: 'v0.21.14'

      - name: Check frontend formatting
        run: |
          cargo fmt --manifest-path crates/mycelix-leptos-ui/Cargo.toml -- --check
          cargo fmt --manifest-path crates/mycelix-leptos-core/Cargo.toml -- --check
          cargo fmt --manifest-path crates/mycelix-leptos-client/Cargo.toml -- --check
          cargo fmt --manifest-path mycelix-hearth/apps/leptos/Cargo.toml -- --check

      - name: Check shared Leptos UI substrate
        run: |
          cargo check --manifest-path crates/mycelix-leptos-ui/Cargo.toml --target wasm32-unknown-unknown
          cargo check --manifest-path crates/mycelix-leptos-core/Cargo.toml --target wasm32-unknown-unknown

      - name: Build Hearth UI for wasm32
        run: cargo build --manifest-path mycelix-hearth/apps/leptos/Cargo.toml --release --target wasm32-unknown-unknown

      - name: Build Hearth release bundle with Trunk
        working-directory: mycelix-hearth/apps/leptos
        run: trunk build --release
