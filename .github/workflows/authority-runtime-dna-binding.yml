name: Authority Runtime DNA Binding

on:
  pull_request:
    paths:
      - 'crates/mycelix-authority-runtime-dna-binding/**'
      - 'crates/mycelix-authority-current-operational/**'
      - 'crates/mycelix-authority-freshness/**'
      - '.github/workflows/authority-runtime-dna-binding.yml'
  push:
    branches:
      - 'security/authority-runtime-dna-binding-v0.1'

permissions:
  contents: read

concurrency:
  group: authority-runtime-dna-binding-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: Exact local DNA deployment binding
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --manifest-path crates/mycelix-authority-runtime-dna-binding/Cargo.toml -- --check

      - name: Tests
        run: cargo test --manifest-path crates/mycelix-authority-runtime-dna-binding/Cargo.toml --all-targets

      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-authority-runtime-dna-binding/Cargo.toml --all-targets -- -D warnings

      - name: Downstream current-authority compatibility
        run: |
          cargo check --manifest-path crates/mycelix-authority-current-operational/Cargo.toml --all-targets
          cargo check --manifest-path crates/mycelix-authority-freshness/Cargo.toml --all-targets

      - name: Runtime DNA authority audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('crates/mycelix-authority-runtime-dna-binding/src/lib.rs').read_text()
          inv = Path('crates/mycelix-authority-runtime-dna-binding/INVARIANTS.md').read_text().lower()
          cargo = Path('crates/mycelix-authority-runtime-dna-binding/Cargo.toml').read_text()

          required = [
              'VerifiedLocalDnaContext',
              'QualifiedRuntimeDnaAuthority',
              'qualify_current_authority_for_local_dna',
              'verify_exact_dna_match(&evidence.current_constitution.dna_hash, &local_dna.dna_hash)',
              'qualify_current_operational_authority(evidence, now_ms)',
              'deployment_qualification_digest(',
              'deployment_evidence_digest(',
              'current_authority.to_verified_freshness()',
              'DEPLOYMENT_QUALIFICATION_PROFILE',
              'DEPLOYMENT_EVIDENCE_PROFILE',
              'DnaHashMismatch',
          ]
          for token in required:
              assert token in src, token

          # Positive deployment authority is serializable for projection/audit but
          # cannot be recreated merely by deserializing bytes.
          prefix = src.split('pub struct QualifiedRuntimeDnaAuthority', 1)[0]
          assert 'Serialize)]' in prefix[-180:]
          assert 'Deserialize' not in prefix[-180:]

          # Pure layer: the future adapter owns host-local DNA discovery. The pure
          # gate must neither infer DNA from caller/runtime APIs nor weaken equality.
          lowered = src.lower()
          for forbidden in [
              '#[hdk_extern]',
              'hdk::',
              'dna_info(',
              'zome_info(',
              'call_remote(',
              'create_entry(',
              'get_links(',
              'execute_actions',
              'phi',
              'reputation',
              'guardian',
          ]:
              assert forbidden not in lowered, forbidden

          assert 'mycelix-authority-freshness' in cargo
          assert 'exact local dna equality is mandatory' in inv
          assert 'expected dna identity is an independent adapter input' in inv
          assert 'semantic current authority' in inv
          assert 'deployment-bound current authority' in inv
          assert 'must not come from' in inv
          assert 'no caller override path' in inv
          print('PASS: live authority is bound to exact independently supplied local DNA identity')
          PY
