name: Security Kernel Qualification — Trusted Result Verifier

on:
  workflow_run:
    workflows: ["Security Kernel Qualification — Trusted Dispatcher"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: security-kernel-trusted-result-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: true

env:
  BASE_REPOSITORY: "Luminous-Dynamics/mycelix"
  BASE_REPOSITORY_ID: "1176351975"
  BASE_BRANCH: "main"
  TRUSTED_DISPATCHER_WORKFLOW_PATH: ".github/workflows/security-kernel-trusted-dispatch.yml"
  TRUSTED_DISPATCHER_WORKFLOW_BLOB_SHA: "814e357cb63c3fffd7545ec64583cc02d00e1391"
  INDEPENDENT_WORKFLOW_PATH: ".github/workflows/security-kernel-independent-qualification.yml"
  TRUSTED_INDEPENDENT_WORKFLOW_BLOB_SHA: "a7996928ed75fc5245202965c61d1b61490e21d6"
  RETENTION_REFERENCE_VERIFIER_PATH: ".github/security-kernel/reference_verify_evidence_retention_binding.py"
  RETENTION_REFERENCE_VERIFIER_BLOB_SHA: "18dfd77cab186c0f467d81fcd6ce6d6d713795c2"
  EXECUTION_REFERENCE_VERIFIER_PATH: ".github/security-kernel/reference_verify_execution_binding.py"
  EXECUTION_REFERENCE_VERIFIER_BLOB_SHA: "d13c37fdbffff3777f9619eb461c601c4c9abbd2"
  SOURCE_POLICY_VERIFIER_PATH: ".github/security-kernel/reference_verify_source_policy.py"
  SOURCE_POLICY_VERIFIER_BLOB_SHA: "8e0f8151c65bbc2a38af11e0bd4d4540df74eaac"
  EXPECTED_JOB_NAME: "Independent Security Kernel"

jobs:
  verify:
    name: Independently verify qualification result
    runs-on: ubuntu-24.04
    cache-mode: none
    timeout-minutes: 15
    steps:
      - name: Checkout exact verifier workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Audit trusted verifier shell syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, subprocess
          from pathlib import Path

          trusted_s2_workflow = Path(os.environ["GITHUB_WORKSPACE"])/".github/workflows/security-kernel-trusted-result-verifier.yml"
          lines = trusted_s2_workflow.read_text(encoding="utf-8").splitlines()
          blocks = 0
          i = 0
          while i < len(lines):
              if re.fullmatch(r" {8}run:\s*\|", lines[i]):
                  content_indent = 10
                  i += 1
                  script_lines = []
                  while i < len(lines):
                      line = lines[i]
                      if line.strip() and len(line) - len(line.lstrip(" ")) < content_indent:
                          break
                      if line.strip():
                          if len(line) < content_indent:
                              raise AssertionError(f"run block indentation underflow at line {i + 1}")
                          script_lines.append(line[content_indent:])
                      else:
                          script_lines.append("")
                      i += 1
                  script = "\n".join(script_lines).rstrip() + "\n"
                  checked = subprocess.run(
                      ["bash", "-n"],
                      input=script,
                      text=True,
                      capture_output=True,
                  )
                  if checked.returncode != 0:
                      raise AssertionError(checked.stderr)
                  blocks += 1
                  continue
              i += 1

          if blocks != 4:
              raise AssertionError(f"expected exactly four trusted S2 bash run blocks, found {blocks}")
          print("PASS: S2 exact verifier workflow shell syntax is valid")
          PY

      - name: Verify trusted dispatcher, reusable S1, and qualification gates
        id: verify_result
        env:
          TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_WORKFLOW_REF" = "Luminous-Dynamics/mycelix/.github/workflows/security-kernel-trusted-result-verifier.yml@refs/heads/main"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REPOSITORY" = "$BASE_REPOSITORY"
          test "$GITHUB_REPOSITORY_ID" = "$BASE_REPOSITORY_ID"
          test "$GITHUB_REF_PROTECTED" = "true"
          test "${ACTIONS_CACHE_MODE:-}" = "none"
          workflow_blob_sha="$(git ls-tree "$GITHUB_WORKFLOW_SHA" -- ".github/workflows/security-kernel-trusted-result-verifier.yml" | awk '{print $3}')"
          printf "%s" "$workflow_blob_sha" | grep -Eq "^[0-9a-f]{40}$"
          retention_reference_verifier_blob_sha="$(git ls-tree "$GITHUB_WORKFLOW_SHA" -- "$RETENTION_REFERENCE_VERIFIER_PATH" | awk '{print $3}')"
          printf "%s" "$retention_reference_verifier_blob_sha" | grep -Eq "^[0-9a-f]{40}$"
          test "$retention_reference_verifier_blob_sha" = "$RETENTION_REFERENCE_VERIFIER_BLOB_SHA"
          execution_reference_verifier_blob_sha="$(git ls-tree "$GITHUB_WORKFLOW_SHA" -- "$EXECUTION_REFERENCE_VERIFIER_PATH" | awk '{print $3}')"
          printf "%s" "$execution_reference_verifier_blob_sha" | grep -Eq "^[0-9a-f]{40}$"
          test "$execution_reference_verifier_blob_sha" = "$EXECUTION_REFERENCE_VERIFIER_BLOB_SHA"
          test -f "$EXECUTION_REFERENCE_VERIFIER_PATH"
          source_policy_verifier_blob_sha="$(git ls-tree "$GITHUB_WORKFLOW_SHA" -- "$SOURCE_POLICY_VERIFIER_PATH" | awk '{print $3}')"
          printf "%s" "$source_policy_verifier_blob_sha" | grep -Eq "^[0-9a-f]{40}$"
          test "$source_policy_verifier_blob_sha" = "$SOURCE_POLICY_VERIFIER_BLOB_SHA"
          test -f "$SOURCE_POLICY_VERIFIER_PATH"
          export SOURCE_POLICY_VERIFIER_BLOB_SHA="$source_policy_verifier_blob_sha"
          test -f "$RETENTION_REFERENCE_VERIFIER_PATH"
          git fetch --no-tags origin "refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor "$GITHUB_WORKFLOW_SHA" "refs/remotes/origin/main"

          export WORKFLOW_BLOB_SHA="$workflow_blob_sha"
          python3 - <<'PY'
          import base64 as _source_policy_base64
          import base64, datetime, hashlib, io, json, os, re, subprocess, tempfile, urllib.error, urllib.parse, urllib.request, zipfile

          base = "https://api.github.com"
          token = os.environ["TOKEN"]
          repo = os.environ["BASE_REPOSITORY"]
          run_id = os.environ["RUN_ID"]
          run_attempt = int(os.environ["RUN_ATTEMPT"])

          def get(path):
              req = urllib.request.Request(
                  base + path,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)

          repository_obj = get(f"/repos/{repo}")
          assert repository_obj["full_name"] == repo
          assert repository_obj["id"] == int(os.environ["BASE_REPOSITORY_ID"])

          run = get(f"/repos/{repo}/actions/runs/{run_id}")
          assert run["id"] == int(run_id)
          assert run["run_attempt"] == run_attempt
          assert run["status"] == "completed"
          assert run["conclusion"] == "success"
          assert run["event"] in ("pull_request_target", "schedule")
          assert run["ref"] == "refs/heads/main"
          assert run["path"] == os.environ["TRUSTED_DISPATCHER_WORKFLOW_PATH"]
          assert run["repository"]["full_name"] == repo
          assert run["repository"]["id"] == int(os.environ["BASE_REPOSITORY_ID"])
          assert run["workflow_ref"] == f"{repo}/{os.environ['TRUSTED_DISPATCHER_WORKFLOW_PATH']}@refs/heads/main"
          assert run.get("run_attempt") == run_attempt
          assert isinstance(run.get("run_number"), int) and run["run_number"] >= 1

          workflow_sha = run.get("workflow_sha")
          workflow_id = run.get("workflow_id")
          assert isinstance(workflow_id, int) and workflow_id > 0, f"unexpected dispatcher workflow_id: {workflow_id!r}"
          assert re.fullmatch(r"[0-9a-f]{40}", workflow_sha or ""), f"unexpected dispatcher workflow_sha: {workflow_sha!r}"
          verifier_file = get(f"/repos/{repo}/contents/.github/workflows/security-kernel-trusted-result-verifier.yml?ref={os.environ['GITHUB_WORKFLOW_SHA']}")
          assert verifier_file["type"] == "file"
          assert verifier_file["path"] == ".github/workflows/security-kernel-trusted-result-verifier.yml"
          assert verifier_file["sha"] == os.environ["WORKFLOW_BLOB_SHA"], "S2 checked-out verifier blob differs from GitHub API content at the invoked workflow commit"
          print(f"PASS: invoked S2 workflow commit={os.environ['GITHUB_WORKFLOW_SHA']} blob={os.environ['WORKFLOW_BLOB_SHA']} is independently bound to the checked-out file")

          dispatcher_at_run = get(
              f"/repos/{repo}/contents/{os.environ['TRUSTED_DISPATCHER_WORKFLOW_PATH']}?ref={workflow_sha}"
          )
          assert dispatcher_at_run["sha"] == os.environ["TRUSTED_DISPATCHER_WORKFLOW_BLOB_SHA"], (
              "executing S0 dispatcher blob is outside the registered trust profile"
          )
          main_sha = subprocess.check_output(["git", "rev-parse", "origin/main"], text=True).strip()
          subprocess.run(["git", "merge-base", "--is-ancestor", workflow_sha, main_sha], check=True)
          assert workflow_sha == main_sha, (
              "triggering S0 run executed from a stale default-branch workflow commit"
          )
          assert os.environ["GITHUB_WORKFLOW_SHA"] == main_sha, (
              "S2 workflow is not executing from the current default-branch tip"
          )
          current_dispatcher = get(
              f"/repos/{repo}/contents/{os.environ['TRUSTED_DISPATCHER_WORKFLOW_PATH']}?ref={main_sha}"
          )
          assert current_dispatcher["sha"] == os.environ["TRUSTED_DISPATCHER_WORKFLOW_BLOB_SHA"], (
              "registered S0 trust profile is stale relative to current protected main"
          )
          current_s1 = get(
              f"/repos/{repo}/contents/{os.environ['INDEPENDENT_WORKFLOW_PATH']}?ref={main_sha}"
          )
          assert current_s1["sha"] == os.environ["TRUSTED_INDEPENDENT_WORKFLOW_BLOB_SHA"], (
              "registered S1 trust profile is stale relative to current protected main"
          )
          print("PASS: registered S0/S1 workflow trust profile still matches the current protected main tip")

          def decode_file(document):
              assert document.get("type") == "file"
              assert document.get("encoding") == "base64"
              return base64.b64decode(document["content"]).decode("utf-8")

          dispatcher_text = decode_file(dispatcher_at_run)
          registered_s1 = re.findall(
              r'(?m)^\s*TRUSTED_INDEPENDENT_WORKFLOW_BLOB_SHA:\s*"([0-9a-f]{40})"\s*$',
              dispatcher_text,
          )
          delegated_s1 = re.findall(
              r'(?m)^\s*trusted_workflow_blob_sha:\s*"([0-9a-f]{40})"\s*$',
              dispatcher_text,
          )
          assert len(registered_s1) == 1, f"expected exactly one registered S1 blob pin in S0, found {len(registered_s1)}"
          assert len(delegated_s1) == 1, f"expected exactly one delegated S1 blob pin in S0, found {len(delegated_s1)}"
          assert registered_s1[0] == current_s1["sha"], (
              "S0 registered S1 blob pin is inconsistent with the current protected-main S1 workflow"
          )
          assert delegated_s1[0] == current_s1["sha"], (
              "S0 reusable-workflow input pin is inconsistent with the current protected-main S1 workflow"
          )
          print("PASS: S0 registered S1 pin and reusable-workflow input pin are mutually coherent with S1")


          s1_at_run = get(
              f"/repos/{repo}/contents/{os.environ['INDEPENDENT_WORKFLOW_PATH']}?ref={workflow_sha}"
          )
          assert s1_at_run["sha"] == os.environ["TRUSTED_INDEPENDENT_WORKFLOW_BLOB_SHA"], (
              "same-commit S1 reusable workflow blob is outside the registered trust profile"
          )

          trigger_event = run["event"]
          jobs = get(
              f"/repos/{repo}/actions/runs/{run_id}/attempts/{run_attempt}/jobs?per_page=100"
          )["jobs"]
          assert len(jobs) == 3, f"trusted dispatcher must have exactly three jobs: {len(jobs)}"
          assert all(job["run_id"] == int(run_id) for job in jobs)
          assert all(job["status"] == "completed" for job in jobs)
          resolver_jobs = [job for job in jobs if job["name"] == "Resolve exact pull request subject"]
          assert len(resolver_jobs) == 1, f"expected one S0 resolver job, found {len(resolver_jobs)}"
          resolver_job = resolver_jobs[0]
          assert resolver_job["conclusion"] == "success"
          assert resolver_job["id"] > 0
          decision_jobs = [job for job in jobs if job["name"].startswith("Dispatch decision: ")]
          assert len(decision_jobs) == 1, f"expected one S0 decision witness job, found {len(decision_jobs)}"
          decision_job = decision_jobs[0]
          decision_match = re.fullmatch(
              r"Dispatch decision: (trusted-dispatch|scheduled-fallback)/(qualified|suppressed)/eligible=(event|[1-9][0-9]?|0)",
              decision_job["name"],
          )
          assert decision_match, f"unexpected S0 decision witness job name: {decision_job['name']!r}"
          dispatch_invocation_source, dispatch_decision, dispatch_eligible_count = decision_match.groups()
          assert decision_job["conclusion"] == "success"
          assert decision_job["id"] > 0
          if trigger_event == "pull_request_target":
              assert dispatch_invocation_source == "trusted-dispatch"
              assert dispatch_decision == "qualified"
              assert dispatch_eligible_count == "event"
          elif trigger_event == "schedule":
              assert dispatch_invocation_source == "scheduled-fallback"
              if dispatch_decision == "suppressed":
                  assert dispatch_eligible_count == "0"
                  matching_s1_jobs = [
                      job for job in jobs
                      if job["name"] == os.environ["EXPECTED_JOB_NAME"]
                      or job["name"].endswith(" / " + os.environ["EXPECTED_JOB_NAME"])
                  ]
                  assert len(matching_s1_jobs) == 1, f"expected one suppressed S1 job, found {len(matching_s1_jobs)}"
                  assert matching_s1_jobs[0]["status"] == "completed"
                  assert matching_s1_jobs[0]["conclusion"] == "skipped"
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                      output.write("dispatch_decision=suppressed\n")
                      output.write("dispatch_invocation_source=scheduled-fallback\n")
                      output.write("dispatch_eligible_count=0\n")
                  print("SUPPRESSED: scheduled Security Kernel dispatcher completed with no eligible candidate in its bounded discovery window; no candidate qualification was executed")
                  raise SystemExit(0)
              assert dispatch_decision == "qualified"
              assert re.fullmatch(r"[1-9][0-9]?", dispatch_eligible_count)
          else:
              raise AssertionError(f"unexpected trusted dispatcher workflow event: {trigger_event!r}")
          if trigger_event == "pull_request_target":
              title = run.get("display_title", "")
              match = re.fullmatch(
                  r"SEC-KERNEL-DISPATCH event=pull_request_target pr=([0-9]+) candidate=([0-9a-f]{40})",
                  title,
              )
              assert match, f"unexpected trusted-dispatch run name: {title!r}"
              candidate_pr, candidate_sha = match.groups()
              candidate_pr = int(candidate_pr)
              run_prs = run.get("pull_requests") or []
              assert len(run_prs) == 1 and run_prs[0]["number"] == candidate_pr
              pr = get(f"/repos/{repo}/pulls/{candidate_pr}")
              assert pr["number"] == candidate_pr and pr["state"] == "open"
              assert pr["base"]["repo"]["full_name"] == repo and pr["base"]["ref"] == os.environ["BASE_BRANCH"]
              assert pr["head"]["sha"] == candidate_sha
              candidate_repository_obj = pr.get("head", {}).get("repo") or {}
              candidate_repository = candidate_repository_obj.get("full_name")
              candidate_repository_id = candidate_repository_obj.get("id")
              assert candidate_repository and isinstance(candidate_repository_id, int)
              assert candidate_repository_id == int(pr["head"]["repo"]["id"])
          else:
              assert trigger_event == "schedule"
              assert (run.get("pull_requests") or []) == []
              artifacts = get(f"/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100").get("artifacts", [])
              receipts = [
                  item for item in artifacts
                  if re.fullmatch(r"security-kernel-independent-qualification-[0-9a-f]{40}-attempt-[0-9]+\.txt", item.get("name", ""))
                  and (item.get("workflow_run") or {}).get("id") == int(run_id)
              ]
              assert len(receipts) == 1, f"scheduled dispatcher must expose exactly one qualification receipt: {len(receipts)}"
              receipt_artifact = receipts[0]
              candidate_sha = re.fullmatch(r"security-kernel-independent-qualification-([0-9a-f]{40})-attempt-[0-9]+\.txt", receipt_artifact["name"]).group(1)
              archive_url = receipt_artifact.get("archive_download_url")
              assert isinstance(archive_url, str) and archive_url
              request = urllib.request.Request(archive_url,headers={"Accept":"application/octet-stream","Authorization":f"Bearer {token}","X-GitHub-Api-Version":"2026-03-10"})
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, req, fp, code, msg, headers):
                      return None
              try:
                  with urllib.request.build_opener(NoRedirect).open(request,timeout=30) as response:
                      raise AssertionError("scheduled qualification receipt endpoint unexpectedly returned 200")
              except urllib.error.HTTPError as error:
                  assert error.code in (301,302,303,307,308)
                  download_url=error.headers.get("Location")
                  assert isinstance(download_url,str) and download_url
              parsed=urllib.parse.urlparse(download_url)
              assert parsed.scheme=="https" and not parsed.username and not parsed.password and parsed.port in (None,443)
              with urllib.request.build_opener(NoRedirect).open(download_url,timeout=30) as response:
                  payload=response.read(16*1024+1)
              assert payload and len(payload)<=16*1024
              if zipfile.is_zipfile(io.BytesIO(payload)):
                  with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                      infos=archive.infolist()
                      assert len(infos)==1 and not infos[0].is_dir()
                      assert 0<infos[0].file_size<=16*1024 and 0<infos[0].compress_size<=16*1024
                      payload=archive.read(infos[0])
              receipt_fields={}
              for line in payload.decode("utf-8").splitlines():
                  assert "=" in line
                  key,value=line.split("=",1)
                  assert key not in receipt_fields
                  receipt_fields[key]=value
              assert receipt_fields.get("schema")=="security-kernel-independent-qualification-v1"
              assert receipt_fields.get("candidate_sha")==candidate_sha
              assert receipt_fields.get("qualification_invocation_source")=="scheduled-fallback"
              candidate_pr=int(receipt_fields["candidate_pr"])
              candidate_repository=receipt_fields["candidate_repository"]
              candidate_repository_id=int(receipt_fields["candidate_repository_id"])
              pr=get(f"/repos/{repo}/pulls/{candidate_pr}")
              assert pr["number"]==candidate_pr and pr["state"]=="open"
              assert pr["base"]["repo"]["full_name"]==repo and pr["base"]["ref"]==os.environ["BASE_BRANCH"]
              assert pr["head"]["sha"]==candidate_sha
              assert pr["head"]["repo"]["full_name"]==candidate_repository and pr["head"]["repo"]["id"]==candidate_repository_id

          assert resolver_job["name"] == "Resolve exact pull request subject"

          matching = [
              job for job in jobs
              if job["name"] == os.environ["EXPECTED_JOB_NAME"]
              or job["name"].endswith(" / " + os.environ["EXPECTED_JOB_NAME"])
          ]
          assert len(matching) == 1, f"expected one reusable S1 execution job, found {len(matching)}"
          job = matching[0]
          assert job["status"] == "completed"
          assert job["conclusion"] == "success"
          assert job["run_id"] == int(run_id)
          assert job["id"] > 0
          assert job["name"] == os.environ["EXPECTED_JOB_NAME"] or job["name"].endswith(" / " + os.environ["EXPECTED_JOB_NAME"])

          raw_steps = job.get("steps") or []
          step_names = [step.get("name") for step in raw_steps]
          assert all(isinstance(name, str) and name for name in step_names), "S1 job contains unnamed step records"
          assert len(step_names) == len(set(step_names)), "S1 job contains duplicate step names; closed-world census is ambiguous"

          # The reusable job inherits the caller workflow context. S2 binds the called
          # workflow independently by resolving its file at the exact S0 workflow commit
          # above, and requires the S1 caller-context gate to pass inside the job.
          required = (
              "Checkout trusted qualification root",
              "Verify trusted pull-request-target invocation",
              "Resolve exact candidate source",
              "Static trust-surface audit",
              "Snapshot exact candidate source identity",
              "Snapshot locked dependency identity",
              "Pull and preflight pinned sandbox image",
              "Prepare locked dependency subject",
              "Vendor locked dependency closure in fetch sandbox",
              "Execute sandbox negative controls",
              "Upload sandbox negative-control transcript",
              "Execute candidate qualification in disposable networkless sandbox",
              "Verify candidate source immutability",
              "Verify dependency substrate immutability",
              "Emit qualification receipt",
              "Upload qualification receipt",
              "Verify retained qualification receipt",
          )
          step_counts = {name: step_names.count(name) for name in required}
          duplicate_required = {name: count for name, count in step_counts.items() if count != 1}
          assert not duplicate_required, f"required qualification step multiplicity is not exactly one: {duplicate_required}"
          steps = {step["name"]: step["conclusion"] for step in raw_steps}
          missing = [name for name in required if name not in steps]
          assert not missing, f"required qualification steps missing: {missing}"
          failed = {name: steps[name] for name in required if steps[name] != "success"}
          assert not failed, f"independent qualification gate failed: {failed}"

          def execution_binding_document(
              *,
              repository_id, repository, workflow_id, candidate_repository_id, candidate_repository,
              candidate_pr, candidate_sha, dispatcher_workflow_path, dispatcher_workflow_sha,
              s1_workflow_path, s1_workflow_blob_sha, verifier_workflow_path, verifier_workflow_sha,
              verifier_workflow_blob_sha, trigger_event, run_id, run_attempt, run_number, resolver_job_id, s1_job_id,
          ):
              return {
                  "schema": "security-kernel-execution-binding-v4",
                  "repository_id": int(repository_id),
                  "repository": str(repository),
                  "workflow_id": int(workflow_id),
                  "candidate_repository_id": int(candidate_repository_id),
                  "candidate_repository": str(candidate_repository),
                  "candidate_pr": int(candidate_pr),
                  "candidate_sha": str(candidate_sha),
                  "dispatcher_workflow_path": str(dispatcher_workflow_path),
                  "dispatcher_workflow_sha": str(dispatcher_workflow_sha),
                  "s1_workflow_path": str(s1_workflow_path),
                  "s1_workflow_blob_sha": str(s1_workflow_blob_sha),
                  "verifier_workflow_path": str(verifier_workflow_path),
                  "verifier_workflow_sha": str(verifier_workflow_sha),
                  "verifier_workflow_blob_sha": str(verifier_workflow_blob_sha),
                  "run_id": int(run_id),
                  "run_attempt": int(run_attempt),
                  "run_number": int(run_number),
                  "resolver_job_id": int(resolver_job_id),
                  "s1_job_id": int(s1_job_id),
              }

          def execution_binding_digest(binding):
              encoded = json.dumps(binding, sort_keys=True, separators=(",", ":"), ensure_ascii=True).encode("utf-8")
              return hashlib.sha256(encoded).hexdigest()

          binding = execution_binding_document(
              repository_id=repository_obj["id"],
              repository=repository_obj["full_name"],
              workflow_id=workflow_id,
              candidate_repository_id=candidate_repo_id,
              candidate_repository=candidate_repository,
              candidate_pr=candidate_pr,
              candidate_sha=candidate_sha,
              dispatcher_workflow_path=os.environ["TRUSTED_DISPATCHER_WORKFLOW_PATH"],
              dispatcher_workflow_sha=workflow_sha,
              s1_workflow_path=os.environ["INDEPENDENT_WORKFLOW_PATH"],
              s1_workflow_blob_sha=s1_at_run["sha"],
              verifier_workflow_path=".github/workflows/security-kernel-trusted-result-verifier.yml",
              verifier_workflow_sha=os.environ["GITHUB_WORKFLOW_SHA"],
              verifier_workflow_blob_sha=os.environ["WORKFLOW_BLOB_SHA"],
              trigger_event=trigger_event,
              run_id=run_id,
