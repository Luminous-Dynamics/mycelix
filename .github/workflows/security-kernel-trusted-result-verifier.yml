name: Security Kernel Qualification — Trusted Result Verifier

on:
  workflow_run:
    workflows: ["Security Kernel Qualification — Trusted Dispatcher"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: security-kernel-trusted-result-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: true

env:
  BASE_REPOSITORY: "Luminous-Dynamics/mycelix"
  BASE_REPOSITORY_ID: "1176351975"
  BASE_BRANCH: "main"
  TRUSTED_DISPATCHER_WORKFLOW_PATH: ".github/workflows/security-kernel-trusted-dispatch.yml"
  TRUSTED_DISPATCHER_WORKFLOW_BLOB_SHA: "ac91d40e653b1ed2ddeb4b7d7111954d0fa4f4bb"
  INDEPENDENT_WORKFLOW_PATH: ".github/workflows/security-kernel-independent-qualification.yml"
  TRUSTED_INDEPENDENT_WORKFLOW_BLOB_SHA: "42b9bfe548a90475ce1a4dc531c76991facd2111"
  EXPECTED_JOB_NAME: "Independent Security Kernel"

jobs:
  verify:
    name: Independently verify qualification result
    runs-on: ubuntu-24.04
    cache-mode: none
    timeout-minutes: 15
    steps:
      - name: Checkout exact verifier workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted dispatcher, reusable S1, and qualification gates
        id: verify_result
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          test "$GITHUB_WORKFLOW_REF" = "Luminous-Dynamics/mycelix/.github/workflows/security-kernel-trusted-result-verifier.yml@refs/heads/main"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REPOSITORY" = "$BASE_REPOSITORY"
          test "$GITHUB_REPOSITORY_ID" = "$BASE_REPOSITORY_ID"
          test "$GITHUB_REF_PROTECTED" = "true"
          test "${ACTIONS_CACHE_MODE:-}" = "none"
          workflow_blob_sha="$(git ls-tree "$GITHUB_WORKFLOW_SHA" -- ".github/workflows/security-kernel-trusted-result-verifier.yml" | awk '{print $3}')"
          printf "%s" "$workflow_blob_sha" | grep -Eq "^[0-9a-f]{40}$"
          git fetch --no-tags origin "refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor "$GITHUB_WORKFLOW_SHA" "refs/remotes/origin/main"

          export WORKFLOW_BLOB_SHA="$workflow_blob_sha"
          python3 - <<'PY'
          import hashlib, io, json, os, re, subprocess, urllib.error, urllib.parse, urllib.request, zipfile

          base = "https://api.github.com"
          token = os.environ["TOKEN"]
          repo = os.environ["BASE_REPOSITORY"]
          run_id = os.environ["RUN_ID"]
          run_attempt = int(os.environ["RUN_ATTEMPT"])

          def get(path):
              req = urllib.request.Request(
                  base + path,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)

          repository_obj = get(f"/repos/{repo}")
          assert repository_obj["full_name"] == repo
          assert repository_obj["id"] == int(os.environ["BASE_REPOSITORY_ID"])

          run = get(f"/repos/{repo}/actions/runs/{run_id}")
          assert run["id"] == int(run_id)
          assert run["run_attempt"] == run_attempt
          assert run["status"] == "completed"
          assert run["conclusion"] == "success"
          assert run["event"] == "pull_request_target"
          assert run["ref"] == "refs/heads/main"
          assert run["path"] == os.environ["TRUSTED_DISPATCHER_WORKFLOW_PATH"]
          assert run["repository"]["full_name"] == repo
          assert run["repository"]["id"] == int(os.environ["BASE_REPOSITORY_ID"])
          assert run["workflow_ref"] == f"{repo}/{os.environ['TRUSTED_DISPATCHER_WORKFLOW_PATH']}@refs/heads/main"
          assert run.get("run_attempt") == run_attempt
          assert isinstance(run.get("run_number"), int) and run["run_number"] >= 1

          workflow_sha = run.get("workflow_sha")
          assert re.fullmatch(r"[0-9a-f]{40}", workflow_sha or ""), f"unexpected dispatcher workflow_sha: {workflow_sha!r}"
          verifier_file = get(f"/repos/{repo}/contents/.github/workflows/security-kernel-trusted-result-verifier.yml?ref={os.environ['GITHUB_WORKFLOW_SHA']}")
          assert verifier_file["type"] == "file"
          assert verifier_file["path"] == ".github/workflows/security-kernel-trusted-result-verifier.yml"
          assert verifier_file["sha"] == os.environ["WORKFLOW_BLOB_SHA"], "S2 checked-out verifier blob differs from GitHub API content at the invoked workflow commit"
          print(f"PASS: invoked S2 workflow commit={os.environ['GITHUB_WORKFLOW_SHA']} blob={os.environ['WORKFLOW_BLOB_SHA']} is independently bound to the checked-out file")

          dispatcher_at_run = get(
              f"/repos/{repo}/contents/{os.environ['TRUSTED_DISPATCHER_WORKFLOW_PATH']}?ref={workflow_sha}"
          )
          assert dispatcher_at_run["sha"] == os.environ["TRUSTED_DISPATCHER_WORKFLOW_BLOB_SHA"], (
              "executing S0 dispatcher blob is outside the registered trust profile"
          )
          main_sha = subprocess.check_output(["git", "rev-parse", "origin/main"], text=True).strip()
          subprocess.run(["git", "merge-base", "--is-ancestor", workflow_sha, main_sha], check=True)
          assert workflow_sha == main_sha, (
              "triggering S0 run executed from a stale default-branch workflow commit"
          )
          assert os.environ["GITHUB_WORKFLOW_SHA"] == main_sha, (
              "S2 workflow is not executing from the current default-branch tip"
          )
          current_dispatcher = get(
              f"/repos/{repo}/contents/{os.environ['TRUSTED_DISPATCHER_WORKFLOW_PATH']}?ref={main_sha}"
          )
          assert current_dispatcher["sha"] == os.environ["TRUSTED_DISPATCHER_WORKFLOW_BLOB_SHA"], (
              "registered S0 trust profile is stale relative to current protected main"
          )
          current_s1 = get(
              f"/repos/{repo}/contents/{os.environ['INDEPENDENT_WORKFLOW_PATH']}?ref={main_sha}"
          )
          assert current_s1["sha"] == os.environ["TRUSTED_INDEPENDENT_WORKFLOW_BLOB_SHA"], (
              "registered S1 trust profile is stale relative to current protected main"
          )
          print("PASS: registered S0/S1 workflow trust profile still matches the current protected main tip")


          s1_at_run = get(
              f"/repos/{repo}/contents/{os.environ['INDEPENDENT_WORKFLOW_PATH']}?ref={workflow_sha}"
          )
          assert s1_at_run["sha"] == os.environ["TRUSTED_INDEPENDENT_WORKFLOW_BLOB_SHA"], (
              "same-commit S1 reusable workflow blob is outside the registered trust profile"
          )

          title = run.get("display_title", "")
          match = re.fullmatch(
              r"SEC-KERNEL-DISPATCH repo_id=([0-9]+) pr=([0-9]+) candidate=([0-9a-f]{40})",
              title,
          )
          assert match, f"unexpected trusted-dispatch run name: {title!r}"
          candidate_repo_id, candidate_pr, candidate_sha = match.groups()
          candidate_repo_id = int(candidate_repo_id)
          candidate_pr = int(candidate_pr)

          run_prs = run.get("pull_requests") or []
          assert len(run_prs) == 1, f"S0 run must identify exactly one PR: {len(run_prs)}"
          assert run_prs[0]["number"] == candidate_pr

          pr = get(f"/repos/{repo}/pulls/{candidate_pr}")
          assert pr["number"] == candidate_pr
          assert pr["state"] == "open"
          assert pr["base"]["repo"]["full_name"] == repo
          assert pr["base"]["ref"] == os.environ["BASE_BRANCH"]
          assert pr["head"]["sha"] == candidate_sha

          candidate_repository_obj = pr.get("head", {}).get("repo") or {}
          candidate_repository = candidate_repository_obj.get("full_name")
          candidate_repository_id = candidate_repository_obj.get("id")
          assert candidate_repository, "candidate PR is missing head repository identity"
          assert candidate_repository_id == candidate_repo_id, (
              "current PR head repository identity differs from the trusted S0-bound repository"
          )

          jobs = get(
              f"/repos/{repo}/actions/runs/{run_id}/attempts/{run_attempt}/jobs?per_page=100"
          )["jobs"]
          assert len(jobs) == 2, f"trusted dispatcher must have exactly two jobs: {len(jobs)}"
          assert all(job["run_id"] == int(run_id) for job in jobs)
          assert all(job["status"] == "completed" for job in jobs)

          resolver_jobs = [job for job in jobs if job["name"] == "Resolve exact pull request subject"]
          resolver_job = resolver_jobs[0]
          assert len(resolver_jobs) == 1, f"expected one S0 resolver job, found {len(resolver_jobs)}"
          assert resolver_job["conclusion"] == "success"
          assert resolver_job["id"] > 0
          assert resolver_job["name"] == "Resolve exact pull request subject"

          matching = [
              job for job in jobs
              if job["name"] == os.environ["EXPECTED_JOB_NAME"]
              or job["name"].endswith(" / " + os.environ["EXPECTED_JOB_NAME"])
          ]
          assert len(matching) == 1, f"expected one reusable S1 execution job, found {len(matching)}"
          job = matching[0]
          assert job["status"] == "completed"
          assert job["conclusion"] == "success"
          assert job["run_id"] == int(run_id)
          assert job["id"] > 0
          assert job["name"] == os.environ["EXPECTED_JOB_NAME"] or job["name"].endswith(" / " + os.environ["EXPECTED_JOB_NAME"])

          raw_steps = job.get("steps") or []
          step_names = [step.get("name") for step in raw_steps]
          assert all(isinstance(name, str) and name for name in step_names), "S1 job contains unnamed step records"
          assert len(step_names) == len(set(step_names)), "S1 job contains duplicate step names; closed-world census is ambiguous"

          # The reusable job inherits the caller workflow context. S2 binds the called
          # workflow independently by resolving its file at the exact S0 workflow commit
          # above, and requires the S1 caller-context gate to pass inside the job.
          required = (
              "Checkout trusted qualification root",
              "Verify trusted pull-request-target invocation",
              "Resolve exact candidate source",
              "Static trust-surface audit",
              "Snapshot exact candidate source identity",
              "Snapshot locked dependency identity",
              "Pull and preflight pinned sandbox image",
              "Prepare locked dependency subject",
              "Vendor locked dependency closure in fetch sandbox",
              "Execute sandbox negative controls",
              "Execute candidate qualification in disposable networkless sandbox",
              "Verify candidate source immutability",
              "Verify dependency substrate immutability",
              "Emit qualification receipt",
              "Upload qualification receipt",
              "Verify retained qualification receipt",
          )
          step_counts = {name: step_names.count(name) for name in required}
          duplicate_required = {name: count for name, count in step_counts.items() if count != 1}
          assert not duplicate_required, f"required qualification step multiplicity is not exactly one: {duplicate_required}"
          steps = {step["name"]: step["conclusion"] for step in raw_steps}
          assert not missing, f"required qualification steps missing: {missing}"
          failed = {name: steps[name] for name in required if steps[name] != "success"}
          assert not failed, f"independent qualification gate failed: {failed}"

          artifacts = get(f"/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100").get("artifacts", [])
          expected_artifact_name = f"security-kernel-independent-qualification-{candidate_sha}-attempt-{run_attempt}.txt"
          matching_artifacts = [a for a in artifacts if a.get("name") == expected_artifact_name]
          assert len(matching_artifacts) == 1, (
              f"expected exactly one retained qualification receipt artifact: {len(matching_artifacts)}"
          )
          artifact = matching_artifacts[0]
          assert artifact.get("expired") is False, "qualification receipt artifact is expired"
          assert artifact.get("workflow_run", {}).get("id") == int(run_id), (
              "qualification receipt artifact is not bound to the exact trusted dispatcher run"
          )
          assert int(artifact.get("size_in_bytes", 0)) > 0, "qualification receipt artifact is empty"
          artifact_digest = artifact.get("digest")
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", artifact_digest or ""), (
              f"unexpected qualification receipt artifact digest: {artifact_digest!r}"
          )

          archive_url = artifact.get("archive_download_url")
          assert isinstance(archive_url, str) and archive_url, "qualification receipt artifact has no download URL"
          request = urllib.request.Request(
              archive_url,
              headers={
                  "Accept": "application/octet-stream",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2026-03-10",
              },
          )

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers):
                  return None

          try:
              with urllib.request.build_opener(NoRedirect).open(request, timeout=30) as response:
                  raise AssertionError(f"artifact download returned unexpected HTTP {response.status} without redirect")
          except urllib.error.HTTPError as error:
              if error.code not in (301, 302, 303, 307, 308):
                  raise
              download_url = error.headers.get("Location")
              assert isinstance(download_url, str) and download_url, "artifact download redirect did not provide a Location"

          with urllib.request.urlopen(download_url, timeout=30) as response:
              artifact_bytes = response.read(1024 * 1024 + 1)
          assert artifact_bytes, "qualification receipt artifact download is empty"
          assert len(artifact_bytes) <= 1024 * 1024, "qualification receipt artifact exceeds 1 MiB verifier bound"
          assert "sha256:" + hashlib.sha256(artifact_bytes).hexdigest() == artifact_digest, (
              "downloaded qualification receipt bytes do not match GitHub's recorded artifact digest"
          )

          receipt_bytes = artifact_bytes
          if zipfile.is_zipfile(io.BytesIO(artifact_bytes)):
              with zipfile.ZipFile(io.BytesIO(artifact_bytes)) as archive:
                  files = [info for info in archive.infolist() if not info.is_dir()]
                  assert len(files) == 1, f"qualification receipt archive contains {len(files)} files, expected exactly one"
                  receipt_member = files[0].filename
                  assert receipt_member.rsplit("/", 1)[-1] == expected_artifact_name, (
                      f"qualification receipt member name mismatch: {receipt_member!r}"
                  )
                  receipt_bytes = archive.read(files[0])

          receipt_content_sha256 = hashlib.sha256(receipt_bytes).hexdigest()
          assert re.fullmatch(r"[0-9a-f]{64}", receipt_content_sha256)
          receipt_text = receipt_bytes.decode("utf-8")
          receipt = {}
          for line in receipt_text.splitlines():
              assert "=" in line, f"qualification receipt contains malformed line: {line!r}"
              key, value = line.split("=", 1)
              assert re.fullmatch(r"[a-z0-9_]+", key), f"qualification receipt contains invalid key: {key!r}"
              assert key not in receipt, f"qualification receipt contains duplicate key: {key!r}"
              receipt[key] = value

          exact_receipt = {
              "schema": "security-kernel-independent-qualification-v1",
              "candidate_repository": candidate_repository,
              "candidate_repository_id": str(candidate_repo_id),
              "candidate_pr": str(candidate_pr),
              "candidate_sha": candidate_sha,
              "source_event": "pull_request_target",
              "trusted_workflow_sha": workflow_sha,
              "registered_s1_workflow_blob_sha": s1_at_run["sha"],
              "called_workflow_ref": f"{repo}/{os.environ['INDEPENDENT_WORKFLOW_PATH']}@refs/heads/main",
              "called_workflow_sha": workflow_sha,
              "trusted_ref_protected": "true",
              "cache_mode": "none",
              "s1_run_id": run_id,
              "s1_run_attempt": str(run_attempt),
              "sandbox_network": "none",
              "sandbox_rootfs": "read-only",
              "sandbox_user": "non-root",
              "sandbox_capabilities": "all-dropped",
              "sandbox_no_new_privileges": "true",
              "sandbox_negative_controls": "passed",
              "dependency_substrate_postflight": "passed",
              "qualification_pass": "true",
          }
          for key, expected_value in exact_receipt.items():
              assert receipt.get(key) == expected_value, (
                  f"qualification receipt field {key!r} mismatch: "
                  f"{receipt.get(key)!r} != {expected_value!r}"
              )
          for key in ("candidate_cargo_lock_sha256", "candidate_source_digest", "vendor_digest"):
              assert re.fullmatch(r"[0-9a-f]{64}", receipt.get(key, "")), (
                  f"qualification receipt field {key!r} is not a SHA-256 digest"
              )
          print(
              "PASS: downloaded qualification receipt bytes match the recorded artifact digest "
              "and bind the exact candidate/run/trust-gate identity"
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"candidate_sha={candidate_sha}\n")
              output.write(f"candidate_pr={candidate_pr}\n")
              output.write(f"candidate_repository={candidate_repository}\n")
              output.write(f"candidate_repository_id={candidate_repo_id}\n")
              output.write(f"trusted_dispatcher_workflow_sha={workflow_sha}\n")
              output.write(f"trusted_dispatcher_workflow_blob_sha={dispatcher_at_run['sha']}\n")
              output.write(f"trusted_s1_workflow_blob_sha={s1_at_run['sha']}\n")
              output.write(f"trusted_dispatch_run_id={run_id}\n")
              output.write(f"trusted_dispatch_run_attempt={run_attempt}\n")
              output.write(f"artifact_id={artifact['id']}\n")
              output.write(f"artifact_name={expected_artifact_name}\n")
              output.write(f"artifact_digest={artifact_digest}\n")
              output.write(f"artifact_size={artifact['size_in_bytes']}\n")
              output.write(f"verifier_workflow_sha={os.environ['GITHUB_WORKFLOW_SHA']}\n")
              output.write(f"verifier_workflow_blob_sha={os.environ['WORKFLOW_BLOB_SHA']}\n")
          print("PASS: trusted metadata and artifact identity are ready for independent direct-file verification")

          print(json.dumps({
              "candidate_sha": candidate_sha,
              "candidate_pr": candidate_pr,
              "candidate_repository_id": candidate_repo_id,
              "candidate_repository": candidate_repository,
              "trusted_dispatcher_workflow_sha": workflow_sha,
              "trusted_dispatcher_workflow_blob_sha": dispatcher_at_run["sha"],
              "trusted_s1_workflow_blob_sha": s1_at_run["sha"],
              "verifier_workflow_sha": os.environ["GITHUB_WORKFLOW_SHA"],
              "verifier_workflow_blob_sha": os.environ["WORKFLOW_BLOB_SHA"],
              "qualification_receipt_artifact_id": artifact["id"],
              "qualification_receipt_artifact_digest": artifact.get("digest"),
              "qualification_receipt_content_sha256": receipt_content_sha256,
              "independent_qualification": "metadata-pass",
              "status_publication": "deliberately-deferred-to-protected-status-plane",
          }, sort_keys=True))
          PY


      - name: Download retained qualification receipt through official artifact client
        if: success()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.verify_result.outputs.artifact_id }}
          path: ${{ runner.temp }}/security-kernel-official-receipt
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.verify_result.outputs.trusted_dispatch_run_id }}
          digest-mismatch: error

      - name: Verify official receipt transport and publish verified result
        if: success()
        shell: bash
        env:
          RECEIPT_ROOT: ${{ runner.temp }}/security-kernel-official-receipt
          EXPECTED_ARTIFACT_NAME: ${{ steps.verify_result.outputs.artifact_name }}
          EXPECTED_ARTIFACT_DIGEST: ${{ steps.verify_result.outputs.artifact_digest }}
          EXPECTED_ARTIFACT_SIZE: ${{ steps.verify_result.outputs.artifact_size }}
          CANDIDATE_SHA: ${{ steps.verify_result.outputs.candidate_sha }}
          CANDIDATE_PR: ${{ steps.verify_result.outputs.candidate_pr }}
          CANDIDATE_REPOSITORY: ${{ steps.verify_result.outputs.candidate_repository }}
          CANDIDATE_REPOSITORY_ID: ${{ steps.verify_result.outputs.candidate_repository_id }}
          TRUSTED_WORKFLOW_SHA: ${{ steps.verify_result.outputs.trusted_dispatcher_workflow_sha }}
          S0_BLOB_SHA: ${{ steps.verify_result.outputs.trusted_dispatcher_workflow_blob_sha }}
          S1_BLOB_SHA: ${{ steps.verify_result.outputs.trusted_s1_workflow_blob_sha }}
          VERIFIER_WORKFLOW_SHA: ${{ steps.verify_result.outputs.verifier_workflow_sha }}
          VERIFIER_BLOB_SHA: ${{ steps.verify_result.outputs.verifier_workflow_blob_sha }}
          ARTIFACT_ID: ${{ steps.verify_result.outputs.artifact_id }}
        run: |
          set -euo pipefail
          test -d "$RECEIPT_ROOT"
          mapfile -t receipt_files < <(find "$RECEIPT_ROOT" -type f -print)
          test "${#receipt_files[@]}" -eq 1
          receipt_path="${receipt_files[0]}"
          test "$(basename "$receipt_path")" = "$EXPECTED_ARTIFACT_NAME"
          test "$(stat -c %s "$receipt_path")" = "$EXPECTED_ARTIFACT_SIZE"
          actual_digest="$(sha256sum "$receipt_path" | awk '{print $1}')"
          test "sha256:$actual_digest" = "$EXPECTED_ARTIFACT_DIGEST"
          test "$ARTIFACT_ID" -gt 0
          printf '%s\n' "$CANDIDATE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s\n' "$TRUSTED_WORKFLOW_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s\n' "$S0_BLOB_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s\n' "$S1_BLOB_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s\n' "$VERIFIER_WORKFLOW_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s\n' "$VERIFIER_BLOB_SHA" | grep -Eq '^[0-9a-f]{40}$'
          echo "PASS: official artifact client returned exactly one direct-file receipt with exact filename, size, and SHA-256"
          printf 'candidate_sha=%s\ncandidate_pr=%s\ncandidate_repository=%s\ncandidate_repository_id=%s\ntrusted_dispatcher_workflow_sha=%s\ntrusted_dispatcher_workflow_blob_sha=%s\ntrusted_s1_workflow_blob_sha=%s\nverifier_workflow_sha=%s\nverifier_workflow_blob_sha=%s\nqualification_receipt_artifact_id=%s\nqualification_receipt_artifact_digest=%s\nqualification_receipt_content_sha256=%s\nindependent_qualification=verified-pass\nstatus_publication=deliberately-deferred-to-protected-status-plane\n' "$CANDIDATE_SHA" "$CANDIDATE_PR" "$CANDIDATE_REPOSITORY" "$CANDIDATE_REPOSITORY_ID" "$TRUSTED_WORKFLOW_SHA" "$S0_BLOB_SHA" "$S1_BLOB_SHA" "$VERIFIER_WORKFLOW_SHA" "$VERIFIER_BLOB_SHA" "$ARTIFACT_ID" "$EXPECTED_ARTIFACT_DIGEST" "$actual_digest"