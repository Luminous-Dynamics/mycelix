                  "policy": os.environ["SOURCE_POLICY_VERIFIER_PATH"],
              }
              snapshot = {"schema": "security-kernel-source-policy-reference-v1", "files": {}}
              for name, file_path in expected.items():
                  blob_sha = subprocess.check_output(
                      ["git", "ls-tree", os.environ["GITHUB_WORKFLOW_SHA"], "--", file_path],
                      text=True,
                  ).strip().split()[2]
                  raw = subprocess.check_output(["git", "show", f"{os.environ['GITHUB_WORKFLOW_SHA']}:{file_path}"])
                  assert hashlib.sha1(f"blob {len(raw)}\\0".encode("ascii") + raw).hexdigest() == blob_sha
                  snapshot["files"][name] = {
                      "path": file_path,
                      "ref": os.environ["GITHUB_WORKFLOW_SHA"],
                      "sha": blob_sha,
                      "encoding": "base64",
                      "content": _source_policy_base64.b64encode(raw).decode("ascii"),
                  }
              verifier = os.path.join(os.environ["GITHUB_WORKSPACE"], os.environ["SOURCE_POLICY_VERIFIER_PATH"])
              with tempfile.NamedTemporaryFile("w", encoding="utf-8", suffix=".json", delete=False) as handle:
                  json.dump(snapshot, handle, sort_keys=True, separators=(",", ":"), ensure_ascii=True)
                  snapshot_path = handle.name
              try:
                  output = subprocess.check_output(["python3", verifier, snapshot_path], text=True, stderr=subprocess.STDOUT, timeout=20)
              except subprocess.CalledProcessError as exc:
                  raise AssertionError(f"independent source-policy verifier rejected raw snapshot: {exc.output!r}") from exc
              finally:
                  os.unlink(snapshot_path)
              result = json.loads(output)
              expected_keys = {"schema", "policy_result", "workflow_file_count", "reference_file_count", "action_pins_verified", "exact_job_topologies_verified", "exact_trigger_topologies_verified", "exact_step_topologies_verified"}
              assert set(result) == expected_keys, "source-policy reference result schema drift"
              assert result["schema"] == "security-kernel-source-policy-reference-v1"
              assert result["policy_result"] == "verified"
              assert result["workflow_file_count"] == 3
              assert result["reference_file_count"] == 3
              assert result["action_pins_verified"] == 3
              assert result["exact_job_topologies_verified"] == 3
              assert result["exact_trigger_topologies_verified"] == 3
              assert result["exact_step_topologies_verified"] == 3
              return result

          source_policy_reference_result = run_reference_source_policy()
          source_policy_reference_result_sha256 = hashlib.sha256(
              json.dumps(source_policy_reference_result, sort_keys=True, separators=(",", ":"), ensure_ascii=True).encode("utf-8")
          ).hexdigest()
          assert re.fullmatch(r"[0-9a-f]{64}", source_policy_reference_result_sha256)
          PY


      - name: Verify retained negative-control evidence binding
        if: ${{ success() && steps.verify_result.outputs.dispatch_decision == 'qualified' }}
        id: verify_negative_controls_log
        env:
          TOKEN: ${{ github.token }}
          BASE_REPOSITORY: "Luminous-Dynamics/mycelix"
          BASE_REPOSITORY_ID: "1176351975"
          RUN_ID: ${{ steps.verify_result.outputs.trusted_dispatch_run_id }}
          RUN_ATTEMPT: ${{ steps.verify_result.outputs.trusted_dispatch_run_attempt }}
          CANDIDATE_SHA: ${{ steps.verify_result.outputs.candidate_sha }}
          CANDIDATE_PR: ${{ steps.verify_result.outputs.candidate_pr }}
          RECEIPT_LOG_SHA256: ${{ steps.verify_result.outputs.sandbox_negative_controls_log_sha256 }}
          PARENT_EVIDENCE_BINDING_SHA256: ${{ steps.verify_result.outputs.evidence_binding_sha256 }}
          RECEIPT_ARTIFACT_EXPIRES_AT: ${{ steps.verify_result.outputs.receipt_artifact_expires_at }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, hashlib, io, json, os, re, urllib.error, urllib.parse, urllib.request, zipfile

          base = "https://api.github.com"
          token = os.environ["TOKEN"]
          repo = os.environ["BASE_REPOSITORY"]
          repo_id = int(os.environ["BASE_REPOSITORY_ID"])
          run_id = int(os.environ["RUN_ID"])
          run_attempt = int(os.environ["RUN_ATTEMPT"])
          candidate_sha = os.environ["CANDIDATE_SHA"]
          candidate_pr = int(os.environ["CANDIDATE_PR"])
          receipt_log_sha256 = os.environ["RECEIPT_LOG_SHA256"]
          parent_binding = os.environ["PARENT_EVIDENCE_BINDING_SHA256"]
          receipt_expires_at = os.environ["RECEIPT_ARTIFACT_EXPIRES_AT"]

          assert re.fullmatch(r"[0-9a-f]{64}", receipt_log_sha256), "S1 negative-control transcript digest is not canonical"
          assert re.fullmatch(r"[0-9a-f]{64}", parent_binding), "parent evidence binding digest is not canonical"
          assert isinstance(receipt_expires_at, str) and receipt_expires_at, "receipt artifact expiration is missing from S2 step binding"
          receipt_expiry = datetime.datetime.fromisoformat(receipt_expires_at.replace("Z", "+00:00"))
          assert receipt_expiry > datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(days=30), "receipt artifact must retain for at least 30 days after verification"

          def get(path):
              req = urllib.request.Request(
                  base + path,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)

          expected_name = f"security-kernel-negative-controls-{candidate_sha}-attempt-{run_attempt}.log"
          encoded_name = urllib.parse.quote(expected_name, safe="")
          artifact_response = get(
              f"/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100&name={encoded_name}"
          )
          artifacts = artifact_response.get("artifacts", [])
          assert artifact_response.get("total_count") == len(artifacts), "negative-control artifact name-filter count mismatch"
          assert len(artifacts) == 1, f"expected exactly one retained negative-control transcript artifact: {len(artifacts)}"
          artifact = artifacts[0]
          assert artifact.get("expired") is False, "negative-control transcript artifact is expired"
          assert artifact.get("name") == expected_name, "negative-control transcript artifact name mismatch"
          assert int(artifact.get("id", 0)) > 0, "negative-control transcript artifact id is invalid"
          assert artifact.get("workflow_run", {}).get("id") == run_id, "negative-control transcript artifact is not bound to the exact S0 run"
          assert artifact.get("workflow_run", {}).get("repository_id") == repo_id, "negative-control transcript artifact repository identity mismatch"
          assert artifact.get("workflow_run", {}).get("head_sha") == candidate_sha, "negative-control transcript artifact head SHA mismatch"
          artifact_digest = artifact.get("digest")
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", artifact_digest or ""), "negative-control transcript artifact digest is not canonical"
          artifact_size = int(artifact.get("size_in_bytes", 0))
          assert 0 < artifact_size <= 65536, "negative-control transcript artifact size exceeds the 64 KiB capture ceiling"
          transcript_expires_at = artifact.get("expires_at")
          assert isinstance(transcript_expires_at, str) and transcript_expires_at, "negative-control transcript artifact has no expiration timestamp"
          transcript_expiry = datetime.datetime.fromisoformat(transcript_expires_at.replace("Z", "+00:00"))
          assert transcript_expiry > datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(days=30), "negative-control transcript artifact must retain for at least 30 days after verification"

          pr = get(f"/repos/{repo}/pulls/{candidate_pr}")
          assert pr["number"] == candidate_pr
          assert pr["state"] == "open"
          assert pr["base"]["repo"]["id"] == repo_id
          assert pr["base"]["ref"] == "main"
          assert pr["head"]["sha"] == candidate_sha
          assert pr["head"]["repo"]["id"] == artifact.get("workflow_run", {}).get("head_repository_id"), "candidate head repository differs from transcript artifact provenance"

          archive_url = artifact.get("archive_download_url")
          assert isinstance(archive_url, str) and archive_url, "negative-control transcript artifact has no download URL"
          request = urllib.request.Request(
              archive_url,
              headers={
                  "Accept": "application/octet-stream",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2026-03-10",
              },
          )
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers):
                  return None

          try:
              with urllib.request.build_opener(NoRedirect).open(request, timeout=30) as response:
                  raise AssertionError(f"negative-control transcript download returned unexpected HTTP {response.status} without redirect")
          except urllib.error.HTTPError as error:
              if error.code not in (301, 302, 303, 307, 308):
                  raise
              download_url = error.headers.get("Location")
              assert isinstance(download_url, str) and download_url, "negative-control transcript redirect omitted Location"

          parsed_download_url = urllib.parse.urlparse(download_url)
          assert parsed_download_url.scheme == "https", "negative-control transcript redirect URL must use HTTPS"
          assert not parsed_download_url.username and not parsed_download_url.password, "negative-control transcript redirect URL must not contain userinfo"
          assert parsed_download_url.port in (None, 443), "negative-control transcript redirect URL must not use a non-standard port"
          try:
              with urllib.request.build_opener(NoRedirect).open(download_url, timeout=30) as response:
                  assert response.status == 200, f"negative-control transcript redirect target returned HTTP {response.status}"
                  downloaded = response.read(65536 + 1)
          except urllib.error.HTTPError as error:
              raise AssertionError(
                  f"negative-control transcript redirect target performed an unexpected second HTTP redirect/status: {error.code}"
              ) from error
          assert downloaded, "negative-control transcript download is empty"
          assert len(downloaded) <= 1024 * 1024, "negative-control transcript download exceeds verifier bound"
          assert artifact_digest == "sha256:" + hashlib.sha256(downloaded).hexdigest(), "transcript download does not match GitHub artifact digest"

          content = downloaded
          if zipfile.is_zipfile(io.BytesIO(downloaded)):
              with zipfile.ZipFile(io.BytesIO(downloaded)) as archive:
                  infos = archive.infolist()
                  assert len(infos) <= 16, f"negative-control transcript archive contains {len(infos)} entries, exceeding verifier bound"
                  members = [info for info in infos if not info.is_dir()]
                  assert len(members) == 1, f"negative-control transcript archive contains {len(members)} files, expected exactly one"
                  assert 0 < members[0].file_size <= 1024 * 1024, (
                      f"negative-control transcript member expands to {members[0].file_size} bytes, outside verifier bound"
                  )
                  assert 0 < members[0].compress_size <= 1024 * 1024, (
                      f"negative-control transcript member compressed size {members[0].compress_size} is outside verifier bound"
                  )
                  assert members[0].filename.rsplit("/", 1)[-1] == expected_name, "negative-control transcript member name mismatch"
                  content = archive.read(members[0])

          content_sha256 = hashlib.sha256(content).hexdigest()
          assert content_sha256 == receipt_log_sha256, "retained transcript bytes do not match the independently parsed S1 receipt digest"
          text = content.decode("utf-8")
          marker = "PASS: active negative controls rejected writable-root, source/vendor/config mutation, token visibility, device exposure, network access, and untrusted background-process assumptions"
          assert marker in text, "negative-control transcript is missing the required semantic pass marker"
          assert "unexpectedly succeeded" not in text, "negative-control transcript contains an unexpected-success marker"

          binding = {
              "schema": "security-kernel-evidence-retention-binding-v1",
              "parent_evidence_binding_sha256": parent_binding,
              "candidate_pr": candidate_pr,
              "candidate_sha": candidate_sha,
              "run_id": run_id,
              "run_attempt": run_attempt,
              "artifact_name": expected_name,
              "artifact_id": int(artifact["id"]),
              "artifact_digest": artifact_digest,
              "artifact_size": artifact_size,
              "content_sha256": content_sha256,
              "receipt_artifact_expires_at": receipt_expires_at,
              "transcript_artifact_expires_at": transcript_expires_at,
               "reference_verifier_path": os.environ["RETENTION_REFERENCE_VERIFIER_PATH"],
               "reference_verifier_blob_sha": retention_reference_verifier_blob_sha,
          }
          encoded = json.dumps(binding, sort_keys=True, separators=(",", ":"), ensure_ascii=True).encode("utf-8")
          binding_sha256 = hashlib.sha256(encoded).hexdigest()

           expected_retention_binding_keys = {
               "schema", "parent_evidence_binding_sha256", "candidate_pr", "candidate_sha",
               "run_id", "run_attempt", "artifact_name", "artifact_id", "artifact_digest",
               "artifact_size", "content_sha256", "receipt_artifact_expires_at",
               "transcript_artifact_expires_at", "reference_verifier_path", "reference_verifier_blob_sha",
           }
           assert set(binding) == expected_retention_binding_keys, "retention binding schema drift"
           assert binding["reference_verifier_path"] == os.environ["RETENTION_REFERENCE_VERIFIER_PATH"]
           assert binding["reference_verifier_blob_sha"] == retention_reference_verifier_blob_sha

           retention_reference_input = dict(binding)
           with tempfile.NamedTemporaryFile("w", encoding="utf-8", suffix=".json", delete=False) as handle:
               json.dump(retention_reference_input, handle, sort_keys=True, separators=(",", ":"), ensure_ascii=True)
               retention_reference_path = handle.name
           try:
               retention_reference_output = subprocess.check_output(
                   [
                       "python3",
                       os.path.join(os.environ["GITHUB_WORKSPACE"], os.environ["RETENTION_REFERENCE_VERIFIER_PATH"]),
                       retention_reference_path,
                   ],
                   text=True,
                   stderr=subprocess.STDOUT,
                   timeout=20,
               )
           except subprocess.CalledProcessError as exc:
               raise AssertionError(f"independent retention reference verifier rejected binding: {exc.output!r}") from exc
           finally:
               os.unlink(retention_reference_path)
           reference_fields = {}
           for line in retention_reference_output.splitlines():
               assert "=" in line
               key, value = line.split("=", 1)
               assert key not in reference_fields
               reference_fields[key] = value
           assert set(reference_fields) == {"schema", "reference_digest", "mutations_verified"}
           assert reference_fields["schema"] == binding["schema"]
           assert re.fullmatch(r"[0-9a-f]{64}", reference_fields["reference_digest"])
           assert reference_fields["mutations_verified"] == str(len(binding) - 1)
           retention_reference_digest = reference_fields["reference_digest"]

          for field, replacement in (
              ("parent_evidence_binding_sha256", "0" * 64),
              ("candidate_pr", candidate_pr + 1),
              ("candidate_sha", "1" * 40),
              ("run_id", run_id + 1),
              ("run_attempt", run_attempt + 1),
              ("artifact_name", expected_name + ".mutated"),
              ("artifact_id", int(artifact["id"]) + 1),
              ("artifact_digest", "sha256:" + "2" * 64),
              ("artifact_size", artifact_size + 1),
              ("content_sha256", "3" * 64),
              ("receipt_artifact_expires_at", receipt_expires_at + "-mutated"),
              ("transcript_artifact_expires_at", transcript_expires_at + "-mutated"),
               ("reference_verifier_path", os.environ["RETENTION_REFERENCE_VERIFIER_PATH"] + "-mutated"),
               ("reference_verifier_blob_sha", "4" * 40),
          ):
              mutated = dict(binding)
              mutated[field] = replacement
              mutated_sha256 = hashlib.sha256(
                  json.dumps(mutated, sort_keys=True, separators=(",", ":"), ensure_ascii=True).encode("utf-8")
              ).hexdigest()
              assert mutated_sha256 != binding_sha256, f"evidence-retention binding is invariant under mutation of {field}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"negative_controls_log_artifact_id={artifact['id']}\n")
              output.write(f"negative_controls_log_artifact_name={expected_name}\n")
              output.write(f"negative_controls_log_artifact_digest={artifact_digest}\n")
              output.write(f"negative_controls_log_artifact_size={artifact_size}\n")
              output.write(f"negative_controls_log_content_sha256={content_sha256}\n")
              output.write(f"evidence_retention_binding_sha256={binding_sha256}\n")
              output.write(f"retention_reference_binding_sha256={retention_reference_digest}\n")
          print(f"PASS: evidence-retention binding SHA-256={binding_sha256}")
          PY

      - name: Download retained qualification receipt through official artifact client
        if: ${{ success() && steps.verify_result.outputs.dispatch_decision == 'qualified' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.verify_result.outputs.artifact_id }}
          path: ${{ runner.temp }}/security-kernel-official-receipt
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.verify_result.outputs.trusted_dispatch_run_id }}
          digest-mismatch: error

      - name: Download retained sandbox negative-control transcript through official artifact client
        if: ${{ success() && steps.verify_result.outputs.dispatch_decision == 'qualified' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.verify_negative_controls_log.outputs.negative_controls_log_artifact_id }}
          path: ${{ runner.temp }}/security-kernel-official-negative-controls
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.verify_result.outputs.trusted_dispatch_run_id }}
          digest-mismatch: error

      - name: Verify official receipt transport and publish verified result
        if: ${{ !cancelled() && (steps.verify_result.outputs.dispatch_decision == 'qualified' || steps.verify_result.outputs.dispatch_decision == 'suppressed') }}
        env:
          RECEIPT_ROOT: ${{ runner.temp }}/security-kernel-official-receipt
          NEGATIVE_CONTROLS_ROOT: ${{ runner.temp }}/security-kernel-official-negative-controls
          EXPECTED_NEGATIVE_CONTROLS_ARTIFACT_NAME: ${{ steps.verify_negative_controls_log.outputs.negative_controls_log_artifact_name }}
          EXPECTED_NEGATIVE_CONTROLS_ARTIFACT_DIGEST: ${{ steps.verify_negative_controls_log.outputs.negative_controls_log_artifact_digest }}
          EXPECTED_NEGATIVE_CONTROLS_ARTIFACT_SIZE: ${{ steps.verify_negative_controls_log.outputs.negative_controls_log_artifact_size }}
          EXPECTED_NEGATIVE_CONTROLS_LOG_SHA256: ${{ steps.verify_negative_controls_log.outputs.negative_controls_log_content_sha256 }}
          DISPATCH_DECISION: ${{ steps.verify_result.outputs.dispatch_decision }}
          DISPATCH_INVOCATION_SOURCE: ${{ steps.verify_result.outputs.dispatch_invocation_source }}
          DISPATCH_ELIGIBLE_COUNT: ${{ steps.verify_result.outputs.dispatch_eligible_count }}
          EVIDENCE_RETENTION_BINDING_SHA256: ${{ steps.verify_negative_controls_log.outputs.evidence_retention_binding_sha256 }}
          SOURCE_POLICY_REFERENCE_RESULT_SHA256: ${{ steps.verify_result.outputs.source_policy_reference_result_sha256 }}
          EXECUTION_REFERENCE_BINDING_SHA256: ${{ steps.verify_result.outputs.execution_reference_binding_sha256 }}
          RETENTION_REFERENCE_BINDING_SHA256: ${{ steps.verify_negative_controls_log.outputs.retention_reference_binding_sha256 }}
          EXPECTED_ARTIFACT_NAME: ${{ steps.verify_result.outputs.artifact_name }}
          EXPECTED_ARTIFACT_DIGEST: ${{ steps.verify_result.outputs.artifact_digest }}
          EXPECTED_ARTIFACT_SIZE: ${{ steps.verify_result.outputs.artifact_size }}
          CANDIDATE_SHA: ${{ steps.verify_result.outputs.candidate_sha }}
          CANDIDATE_PR: ${{ steps.verify_result.outputs.candidate_pr }}
          CANDIDATE_REPOSITORY: ${{ steps.verify_result.outputs.candidate_repository }}
          CANDIDATE_REPOSITORY_ID: ${{ steps.verify_result.outputs.candidate_repository_id }}
          TRUSTED_WORKFLOW_SHA: ${{ steps.verify_result.outputs.trusted_dispatcher_workflow_sha }}
          S0_BLOB_SHA: ${{ steps.verify_result.outputs.trusted_dispatcher_workflow_blob_sha }}
          S1_BLOB_SHA: ${{ steps.verify_result.outputs.trusted_s1_workflow_blob_sha }}
          VERIFIER_WORKFLOW_SHA: ${{ steps.verify_result.outputs.verifier_workflow_sha }}
          VERIFIER_BLOB_SHA: ${{ steps.verify_result.outputs.verifier_workflow_blob_sha }}
          ARTIFACT_ID: ${{ steps.verify_result.outputs.artifact_id }}
          EXECUTION_BINDING_SHA256: ${{ steps.verify_result.outputs.execution_binding_sha256 }}
          EVIDENCE_BINDING_SHA256: ${{ steps.verify_result.outputs.evidence_binding_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$DISPATCH_DECISION" = "suppressed" ]; then
            test "$DISPATCH_INVOCATION_SOURCE" = "scheduled-fallback"
            test "$DISPATCH_ELIGIBLE_COUNT" = "0"
            echo "SUPPRESSED: trusted S0 decision witness verified; no candidate qualification or evidence-retention path was executed"
            exit 0
          fi
          test "$DISPATCH_DECISION" = "qualified"
          test "$DISPATCH_INVOCATION_SOURCE" = "trusted-dispatch" || test "$DISPATCH_INVOCATION_SOURCE" = "scheduled-fallback"
          test "$DISPATCH_ELIGIBLE_COUNT" != "0"
          test -d "$RECEIPT_ROOT"
          mapfile -t receipt_files < <(find "$RECEIPT_ROOT" -type f -print)
          test "${#receipt_files[@]}" -eq 1
          receipt_path="${receipt_files[0]}"
          test "$(basename "$receipt_path")" = "$EXPECTED_ARTIFACT_NAME"
          test "$(stat -c %s "$receipt_path")" = "$EXPECTED_ARTIFACT_SIZE"
          actual_digest="$(sha256sum "$receipt_path" | awk '{print $1}')"
          test "sha256:$actual_digest" = "$EXPECTED_ARTIFACT_DIGEST"
          test -d "$NEGATIVE_CONTROLS_ROOT"
          mapfile -t negative_controls_files < <(find "$NEGATIVE_CONTROLS_ROOT" -type f -print)
          test "${#negative_controls_files[@]}" -eq 1
          negative_controls_path="${negative_controls_files[0]}"
          test "$(basename "$negative_controls_path")" = "$EXPECTED_NEGATIVE_CONTROLS_ARTIFACT_NAME"
          test "$(stat -c %s "$negative_controls_path")" = "$EXPECTED_NEGATIVE_CONTROLS_ARTIFACT_SIZE"
          negative_controls_digest="$(sha256sum "$negative_controls_path" | awk '{print $1}')"
          test "sha256:$negative_controls_digest" = "$EXPECTED_NEGATIVE_CONTROLS_ARTIFACT_DIGEST"
          test "$negative_controls_digest" = "$EXPECTED_NEGATIVE_CONTROLS_LOG_SHA256"
          grep -Fq 'PASS: active negative controls rejected writable-root, source/vendor/config mutation, token visibility, device exposure, network access, and untrusted background-process assumptions' "$negative_controls_path"
          ! grep -Fq 'unexpectedly succeeded' "$negative_controls_path"
          printf "%s\n" "$EVIDENCE_RETENTION_BINDING_SHA256" | grep -Eq "^[0-9a-f]{64}$"
          echo "PASS: official artifact client returned the retained negative-control transcript with exact filename, size, artifact digest, content digest, and semantic pass marker"
          test "$ARTIFACT_ID" -gt 0
          printf '%s\n' "$CANDIDATE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s\n' "$TRUSTED_WORKFLOW_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s\n' "$S0_BLOB_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s\n' "$S1_BLOB_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s\n' "$VERIFIER_WORKFLOW_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s\n' "$VERIFIER_BLOB_SHA" | grep -Eq '^[0-9a-f]{40}$'
          echo "PASS: official artifact client returned exactly one direct-file receipt with exact filename, size, and SHA-256"
          printf "execution_reference_binding_sha256=%s\n" "$EXECUTION_REFERENCE_BINDING_SHA256"
          printf "retention_reference_binding_sha256=%s\n" "$RETENTION_REFERENCE_BINDING_SHA256"
          printf "evidence_retention_binding_sha256=%s\nnegative_controls_log_artifact_id=%s\nnegative_controls_log_artifact_name=%s\nnegative_controls_log_artifact_digest=%s\nnegative_controls_log_content_sha256=%s\n" "$EVIDENCE_RETENTION_BINDING_SHA256" "${{ steps.verify_negative_controls_log.outputs.negative_controls_log_artifact_id }}" "$EXPECTED_NEGATIVE_CONTROLS_ARTIFACT_NAME" "$EXPECTED_NEGATIVE_CONTROLS_ARTIFACT_DIGEST" "$negative_controls_digest"
          printf "%s\n" "$EXECUTION_BINDING_SHA256" | grep -Eq "^[0-9a-f]{64}$"
          printf "%s\n" "$EVIDENCE_BINDING_SHA256" | grep -Eq "^[0-9a-f]{64}$"
          printf "%s\n" "$EXECUTION_REFERENCE_BINDING_SHA256" | grep -Eq "^[0-9a-f]{64}$"
          printf "%s\n" "$RETENTION_REFERENCE_BINDING_SHA256" | grep -Eq "^[0-9a-f]{64}$"
          printf "%s\n" "$SOURCE_POLICY_REFERENCE_RESULT_SHA256" | grep -Eq "^[0-9a-f]{64}$"
