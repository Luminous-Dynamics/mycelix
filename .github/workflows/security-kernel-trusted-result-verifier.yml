name: Security Kernel Qualification — Trusted Result Verifier

on:
  workflow_run:
    workflows: ["Security Kernel Independent Qualification"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: security-kernel-trusted-result-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: true

env:
  BASE_REPOSITORY: "Luminous-Dynamics/mycelix"
  BASE_BRANCH: "main"
  SOURCE_WORKFLOW_ID: "372951439"
  SOURCE_WORKFLOW_PATH: ".github/workflows/security-kernel-qualification.yml"
  INDEPENDENT_WORKFLOW_PATH: ".github/workflows/security-kernel-independent-qualification.yml"
  TRUSTED_INDEPENDENT_WORKFLOW_BLOB_SHA: "c65c3fbbc7f3db129dd4382d1edce8e13794ce97"
  EXPECTED_JOB_NAME: "Independent Security Kernel"

jobs:
  verify:
    name: Independently verify qualification result
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout trusted result verifier root
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify qualification provenance and gates
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json, os, re, subprocess, urllib.request

          base = "https://api.github.com"
          token = os.environ["TOKEN"]
          repo = os.environ["BASE_REPOSITORY"]
          run_id = os.environ["RUN_ID"]
          run_attempt = int(os.environ["RUN_ATTEMPT"])

          def get(path):
              req = urllib.request.Request(base + path, headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)

          run = get(f"/repos/{repo}/actions/runs/{run_id}")
          assert run["id"] == int(run_id)
          assert run["run_attempt"] == run_attempt
          assert run["status"] == "completed"
          assert run["event"] == "workflow_dispatch"
          assert run["path"] == os.environ["INDEPENDENT_WORKFLOW_PATH"]
          assert run["repository"]["full_name"] == repo
          assert run["workflow_ref"] == f"{repo}/{os.environ['INDEPENDENT_WORKFLOW_PATH']}@refs/heads/main"

          title = run.get("display_title", "")
          match = re.fullmatch(r"SEC-KERNEL-INDEP candidate=([0-9a-f]{40}) pr=([0-9]+) source=([0-9]+)\.([0-9]+)", title)
          assert match, f"unexpected independent qualification run name: {title!r}"
          candidate_sha, candidate_pr, source_run_id, source_run_attempt = match.groups()
          source_run_attempt = int(source_run_attempt)

          workflow_sha = run.get("workflow_sha")
          assert re.fullmatch(r"[0-9a-f]{40}", workflow_sha or ""), f"unexpected workflow_sha: {workflow_sha!r}"

          workflow_at_run = get(
              "/repos/" + repo + "/contents/" + os.environ["INDEPENDENT_WORKFLOW_PATH"]
              + "?ref=" + workflow_sha)
          assert workflow_at_run["sha"] == os.environ["TRUSTED_INDEPENDENT_WORKFLOW_BLOB_SHA"], (
              "S1 workflow executed by this run does not match the registered immutable profile"
          )

          main_sha = subprocess.check_output(["git", "rev-parse", "origin/main"], text=True).strip()
          subprocess.run(["git", "merge-base", "--is-ancestor", workflow_sha, main_sha], check=True)

          source = get(f"/repos/{repo}/actions/runs/{source_run_id}")
          assert source["id"] == int(source_run_id)
          assert source["status"] == "completed"
          assert source["run_attempt"] == source_run_attempt
          assert source["workflow_id"] == int(os.environ["SOURCE_WORKFLOW_ID"])
          assert source["path"] == os.environ["SOURCE_WORKFLOW_PATH"]
          assert source["event"] == "pull_request"
          assert source["repository"]["full_name"] == repo
          assert source["head_sha"] == candidate_sha

          source_head_repository = (source.get("head_repository") or {}).get("full_name")
          assert source_head_repository, "source run missing head repository identity"

          pr = get(f"/repos/{repo}/pulls/{candidate_pr}")
          assert pr["base"]["repo"]["full_name"] == repo
          assert pr["base"]["ref"] == os.environ["BASE_BRANCH"]
          assert pr["state"] == "open"
          assert pr["head"]["repo"]["full_name"] == source_head_repository
          assert pr["head"]["sha"] == candidate_sha

          jobs = get(f"/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100")["jobs"]
          assert len(jobs) == 1, f"expected one independent qualification job, found {len(jobs)}"
          job = jobs[0]
          assert job["name"] == os.environ["EXPECTED_JOB_NAME"]
          assert job["run_id"] == int(run_id)

          required = (
              "Checkout trusted qualification root",
              "Validate dispatch provenance",
              "Resolve exact candidate source",
              "Snapshot trusted candidate source",
              "Static trust-surface audit",
              "Assert Rust toolchain before candidate compilation",
              "Format candidate bridge crate",
              "Assert Rust toolchain before default tests",
              "Test candidate default feature set",
              "Assert Rust toolchain before identity tests",
              "Test candidate identity feature set",
              "Assert Rust toolchain before default Clippy",
              "Clippy candidate default feature set",
              "Assert Rust toolchain before identity Clippy",
              "Clippy candidate identity feature set",
              "Verify candidate source immutability",
              "Emit qualification receipt",
          )
          steps = {step["name"]: step["conclusion"] for step in (job.get("steps") or [])}
          missing = [name for name in required if name not in steps]
          assert not missing, f"required qualification steps missing: {missing}"
          failed = {name: steps[name] for name in required if steps[name] != "success"}
          assert not failed, f"independent qualification gate failed: {failed}"
          assert job["conclusion"] == "success"

          print(json.dumps({
              "candidate_sha": candidate_sha,
              "candidate_pr": int(candidate_pr),
              "source_run_id": int(source_run_id),
              "source_run_attempt": source_run_attempt,
              "trusted_workflow_sha": workflow_sha,
              "trusted_workflow_ref": run["workflow_ref"],
              "independent_qualification": "verified-pass",
              "status_publication": "deliberately-deferred-to-protected-status-plane",
          }, sort_keys=True))
          PY
