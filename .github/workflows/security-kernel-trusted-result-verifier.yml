name: Security Kernel Qualification — Trusted Result Verifier

on:
  workflow_run:
    workflows: ["Security Kernel Qualification — Trusted Dispatcher"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: security-kernel-trusted-result-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: true

env:
  BASE_REPOSITORY: "Luminous-Dynamics/mycelix"
  BASE_REPOSITORY_ID: "1176351975"
  BASE_BRANCH: "main"
  TRUSTED_DISPATCHER_WORKFLOW_PATH: ".github/workflows/security-kernel-trusted-dispatch.yml"
  TRUSTED_DISPATCHER_WORKFLOW_BLOB_SHA: "ac91d40e653b1ed2ddeb4b7d7111954d0fa4f4bb"
  INDEPENDENT_WORKFLOW_PATH: ".github/workflows/security-kernel-independent-qualification.yml"
  TRUSTED_INDEPENDENT_WORKFLOW_BLOB_SHA: "42b9bfe548a90475ce1a4dc531c76991facd2111"
  EXPECTED_JOB_NAME: "Independent Security Kernel"
  REFERENCE_VERIFIER_PATH: ".github/security-kernel/reference_verify_execution_binding.py"
  REFERENCE_VERIFIER_BLOB_SHA: "24b5ea20e3a5946b106c22ece9fedcdb85e9c7db"
  CAUSAL_JOIN_VERIFIER_PATH: ".github/security-kernel/reference_verify_causal_join.py"
  CAUSAL_JOIN_VERIFIER_BLOB_SHA: "23033164c0f9f73fcea4976a02029977538b68e0"
  SOURCE_POLICY_VERIFIER_PATH: ".github/security-kernel/reference_verify_source_policy.py"
  SOURCE_POLICY_VERIFIER_BLOB_SHA: "aee08cb5528d87363aa0d0c635f80c2171fce9ec"
  TRUSTED_RESULT_VERIFIER_WORKFLOW_PATH: ".github/workflows/security-kernel-trusted-result-verifier.yml"

jobs:
  verify:
    name: Independently verify qualification result
    runs-on: ubuntu-24.04
    cache-mode: none
    timeout-minutes: 15
    steps:
      - name: Checkout exact verifier workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted dispatcher, reusable S1, and qualification gates
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          test "$GITHUB_WORKFLOW_REF" = "Luminous-Dynamics/mycelix/.github/workflows/security-kernel-trusted-result-verifier.yml@refs/heads/main"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REPOSITORY" = "$BASE_REPOSITORY"
          test "$GITHUB_REPOSITORY_ID" = "$BASE_REPOSITORY_ID"
          test "$GITHUB_REF_PROTECTED" = "true"
          test "${ACTIONS_CACHE_MODE:-}" = "none"
          workflow_blob_sha="$(git ls-tree "$GITHUB_WORKFLOW_SHA" -- ".github/workflows/security-kernel-trusted-result-verifier.yml" | awk '{print $3}')"
          printf "%s" "$workflow_blob_sha" | grep -Eq "^[0-9a-f]{40}$"
          reference_verifier_blob_sha="$(git ls-tree "$GITHUB_WORKFLOW_SHA" -- "$REFERENCE_VERIFIER_PATH" | awk '{print $3}')"
          printf "%s" "$reference_verifier_blob_sha" | grep -Eq "^[0-9a-f]{40}$"
          test -f "$REFERENCE_VERIFIER_PATH"
          test "$reference_verifier_blob_sha" = "$REFERENCE_VERIFIER_BLOB_SHA"
          causal_join_verifier_blob_sha="$(git ls-tree "$GITHUB_WORKFLOW_SHA" -- "$CAUSAL_JOIN_VERIFIER_PATH" | awk '{print $3}')"
          printf "%s" "$causal_join_verifier_blob_sha" | grep -Eq "^[0-9a-f]{40}$"
          test -f "$CAUSAL_JOIN_VERIFIER_PATH"
          test "$causal_join_verifier_blob_sha" = "$CAUSAL_JOIN_VERIFIER_BLOB_SHA"
          git fetch --no-tags origin "refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor "$GITHUB_WORKFLOW_SHA" "refs/remotes/origin/main"

          export WORKFLOW_BLOB_SHA="$workflow_blob_sha"
          export REFERENCE_VERIFIER_BLOB_SHA="$reference_verifier_blob_sha"
          export CAUSAL_JOIN_VERIFIER_BLOB_SHA="$causal_join_verifier_blob_sha"
          python3 - <<'PY'
          import hashlib, io, json, os, re, subprocess, tempfile, urllib.error, urllib.parse, urllib.request, zipfile

          base = "https://api.github.com"
          token = os.environ["TOKEN"]
          repo = os.environ["BASE_REPOSITORY"]
          run_id = os.environ["RUN_ID"]
          run_attempt = int(os.environ["RUN_ATTEMPT"])

          def get(path):
              req = urllib.request.Request(
                  base + path,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)

          repository_obj = get(f"/repos/{repo}")
          assert repository_obj["full_name"] == repo
          assert repository_obj["id"] == int(os.environ["BASE_REPOSITORY_ID"])

          run = get(f"/repos/{repo}/actions/runs/{run_id}")
          assert run["id"] == int(run_id)
          assert run["run_attempt"] == run_attempt
          assert run["status"] == "completed"
          assert run["conclusion"] == "success"
          assert run["event"] == "pull_request_target"
          assert run["ref"] == "refs/heads/main"
          assert run["path"] == os.environ["TRUSTED_DISPATCHER_WORKFLOW_PATH"]
          assert run["repository"]["full_name"] == repo
          assert run["repository"]["id"] == int(os.environ["BASE_REPOSITORY_ID"])
          assert run["workflow_ref"] == f"{repo}/{os.environ['TRUSTED_DISPATCHER_WORKFLOW_PATH']}@refs/heads/main"
          assert type(run.get("run_attempt")) is int and run["run_attempt"] == run_attempt
          assert type(run.get("run_number")) is int and run["run_number"] >= 1

          workflow_sha = run.get("workflow_sha")
          assert re.fullmatch(r"[0-9a-f]{40}", workflow_sha or ""), f"unexpected dispatcher workflow_sha: {workflow_sha!r}"
          verifier_file = get(f"/repos/{repo}/contents/.github/workflows/security-kernel-trusted-result-verifier.yml?ref={os.environ['GITHUB_WORKFLOW_SHA']}")
          assert verifier_file["type"] == "file"
          assert verifier_file["path"] == ".github/workflows/security-kernel-trusted-result-verifier.yml"
          assert verifier_file["sha"] == os.environ["WORKFLOW_BLOB_SHA"], "S2 checked-out verifier blob differs from GitHub API content at the invoked workflow commit"
          print(f"PASS: invoked S2 workflow commit={os.environ['GITHUB_WORKFLOW_SHA']} blob={os.environ['WORKFLOW_BLOB_SHA']} is independently bound to the checked-out file")

          dispatcher_at_run = get(
              f"/repos/{repo}/contents/{os.environ['TRUSTED_DISPATCHER_WORKFLOW_PATH']}?ref={workflow_sha}"
          )
          assert dispatcher_at_run["sha"] == os.environ["TRUSTED_DISPATCHER_WORKFLOW_BLOB_SHA"], (
              "executing S0 dispatcher blob is outside the registered trust profile"
          )
          assert dispatcher_at_run["type"] == "file"
          assert dispatcher_at_run["encoding"] == "base64"
          assert isinstance(dispatcher_at_run.get("content"), str) and dispatcher_at_run["content"]
          main_sha = subprocess.check_output(["git", "rev-parse", "origin/main"], text=True).strip()
          subprocess.run(["git", "merge-base", "--is-ancestor", workflow_sha, main_sha], check=True)
          assert workflow_sha == main_sha, (
              "triggering S0 run executed from a stale default-branch workflow commit"
          )

          s1_at_run = get(
              f"/repos/{repo}/contents/{os.environ['INDEPENDENT_WORKFLOW_PATH']}?ref={workflow_sha}"
          )
          assert s1_at_run["sha"] == os.environ["TRUSTED_INDEPENDENT_WORKFLOW_BLOB_SHA"], (
              "same-commit S1 reusable workflow blob is outside the registered trust profile"
          )
          assert s1_at_run["type"] == "file"
          assert s1_at_run["encoding"] == "base64"
          assert isinstance(s1_at_run.get("content"), str) and s1_at_run["content"]
          binding_file = get(
              f"/repos/{repo}/contents/{os.environ['REFERENCE_VERIFIER_PATH']}?ref={os.environ['GITHUB_WORKFLOW_SHA']}"
          )
          assert binding_file["type"] == "file"
          assert binding_file["path"] == os.environ["REFERENCE_VERIFIER_PATH"]
          assert binding_file["encoding"] == "base64"
          assert binding_file["sha"] == os.environ["REFERENCE_VERIFIER_BLOB_SHA"]
          assert isinstance(binding_file.get("content"), str) and binding_file["content"]
          causal_file = get(
              f"/repos/{repo}/contents/{os.environ['CAUSAL_JOIN_VERIFIER_PATH']}?ref={os.environ['GITHUB_WORKFLOW_SHA']}"
          )
          assert causal_file["type"] == "file"
          assert causal_file["path"] == os.environ["CAUSAL_JOIN_VERIFIER_PATH"]
          assert causal_file["encoding"] == "base64"
          assert causal_file["sha"] == os.environ["CAUSAL_JOIN_VERIFIER_BLOB_SHA"]
          assert isinstance(causal_file.get("content"), str) and causal_file["content"]
          policy_file = get(
              f"/repos/{repo}/contents/{os.environ['SOURCE_POLICY_VERIFIER_PATH']}?ref={os.environ['GITHUB_WORKFLOW_SHA']}"
          )
          assert policy_file["type"] == "file"
          assert policy_file["path"] == os.environ["SOURCE_POLICY_VERIFIER_PATH"]
          assert policy_file["encoding"] == "base64"
          assert policy_file["sha"] == os.environ["SOURCE_POLICY_VERIFIER_BLOB_SHA"]
          assert isinstance(policy_file.get("content"), str) and policy_file["content"]

          title = run.get("display_title", "")
          match = re.fullmatch(
              r"SEC-KERNEL-DISPATCH repo_id=([0-9]+) pr=([0-9]+) candidate=([0-9a-f]{40})",
              title,
          )
          assert match, f"unexpected trusted-dispatch run name: {title!r}"
          candidate_repo_id, candidate_pr, candidate_sha = match.groups()
          candidate_repo_id = int(candidate_repo_id)
          candidate_pr = int(candidate_pr)

          run_prs = run.get("pull_requests") or []
          assert len(run_prs) == 1, f"S0 run must identify exactly one PR: {len(run_prs)}"
          assert run_prs[0]["number"] == candidate_pr

          pr = get(f"/repos/{repo}/pulls/{candidate_pr}")
          assert pr["number"] == candidate_pr
          assert pr["state"] == "open"
          assert pr["base"]["repo"]["full_name"] == repo
          assert pr["base"]["ref"] == os.environ["BASE_BRANCH"]
          assert pr["head"]["sha"] == candidate_sha

          candidate_repository_obj = pr.get("head", {}).get("repo") or {}
          candidate_repository = candidate_repository_obj.get("full_name")
          candidate_repository_id = candidate_repository_obj.get("id")
          assert candidate_repository, "candidate PR is missing head repository identity"
          assert candidate_repository_id == candidate_repo_id, (
              "current PR head repository identity differs from the trusted S0-bound repository"
          )

          jobs = get(
              f"/repos/{repo}/actions/runs/{run_id}/attempts/{run_attempt}/jobs?per_page=100"
          )["jobs"]
          assert len(jobs) == 2, f"trusted dispatcher must have exactly two jobs: {len(jobs)}"
          assert all(job["run_id"] == int(run_id) for job in jobs)
          assert all(job["status"] == "completed" for job in jobs)

          resolver_jobs = [job for job in jobs if job["name"] == "Resolve exact pull request subject"]
          assert len(resolver_jobs) == 1, f"expected one S0 resolver job, found {len(resolver_jobs)}"
          resolver_job = resolver_jobs[0]
          assert resolver_job["conclusion"] == "success"
          assert resolver_job["id"] > 0
          assert resolver_job["name"] == "Resolve exact pull request subject"

          matching = [
              job for job in jobs
              if job["name"] == os.environ["EXPECTED_JOB_NAME"]
              or job["name"].endswith(" / " + os.environ["EXPECTED_JOB_NAME"])
          ]
          assert len(matching) == 1, f"expected one reusable S1 execution job, found {len(matching)}"
          job = matching[0]
          assert job["status"] == "completed"
          assert job["conclusion"] == "success"
          assert job["run_id"] == int(run_id)
          assert job["id"] > 0
          assert job["name"] == os.environ["EXPECTED_JOB_NAME"] or job["name"].endswith(" / " + os.environ["EXPECTED_JOB_NAME"])

          raw_steps = job.get("steps") or []
          step_names = [step.get("name") for step in raw_steps]
          assert all(isinstance(name, str) and name for name in step_names), "S1 job contains unnamed step records"
          assert len(step_names) == len(set(step_names)), "S1 job contains duplicate step names; closed-world census is ambiguous"

          # The reusable job inherits the caller workflow context. S2 binds the called
          # workflow independently by resolving its file at the exact S0 workflow commit
          # above, and requires the S1 caller-context gate to pass inside the job.
          required = (
              "Checkout trusted qualification root",
              "Verify trusted pull-request-target invocation",
              "Resolve exact candidate source",
              "Static trust-surface audit",
              "Snapshot exact candidate source identity",
              "Snapshot locked dependency identity",
              "Pull and preflight pinned sandbox image",
              "Prepare locked dependency subject",
              "Vendor locked dependency closure in fetch sandbox",
              "Execute sandbox negative controls",
              "Execute candidate qualification in disposable networkless sandbox",
              "Verify candidate source immutability",
              "Verify dependency substrate immutability",
              "Emit qualification receipt",
              "Upload qualification receipt",
              "Verify retained qualification receipt",
          )
          step_counts = {name: step_names.count(name) for name in required}
          duplicate_required = {name: count for name, count in step_counts.items() if count != 1}
          assert not duplicate_required, f"required qualification step multiplicity is not exactly one: {duplicate_required}"
          steps = {step["name"]: step["conclusion"] for step in raw_steps}
          missing = [name for name in required if name not in steps]
          assert not missing, f"required qualification steps missing: {missing}"
          failed = {name: steps[name] for name in required if steps[name] != "success"}
          assert not failed, f"independent qualification gate failed: {failed}"

          def execution_binding_document(
              *,
              repository_id, repository, candidate_repository_id, candidate_repository,
              candidate_pr, candidate_sha, dispatcher_workflow_path, dispatcher_workflow_sha,
              s1_workflow_path, s1_workflow_blob_sha, run_id, run_attempt, run_number,
              resolver_job_id, s1_job_id, reference_verifier_path, reference_verifier_blob_sha,
              causal_join_verifier_path, causal_join_verifier_blob_sha,
              source_policy_verifier_path, source_policy_verifier_blob_sha,
              verifier_workflow_path, verifier_workflow_sha, verifier_workflow_blob_sha,
          ):
              return {
                  "schema": "security-kernel-execution-binding-v1",
                  "repository_id": int(repository_id),
                  "repository": str(repository),
                  "candidate_repository_id": int(candidate_repository_id),
                  "candidate_repository": str(candidate_repository),
                  "candidate_pr": int(candidate_pr),
                  "candidate_sha": str(candidate_sha),
                  "dispatcher_workflow_path": str(dispatcher_workflow_path),
                  "dispatcher_workflow_sha": str(dispatcher_workflow_sha),
                  "s1_workflow_path": str(s1_workflow_path),
                  "s1_workflow_blob_sha": str(s1_workflow_blob_sha),
                  "run_id": int(run_id),
                  "run_attempt": int(run_attempt),
                  "run_number": int(run_number),
                  "resolver_job_id": int(resolver_job_id),
                  "s1_job_id": int(s1_job_id),
                  "reference_verifier_path": str(reference_verifier_path),
                  "reference_verifier_blob_sha": str(reference_verifier_blob_sha),
                  "causal_join_verifier_path": str(causal_join_verifier_path),
                  "causal_join_verifier_blob_sha": str(causal_join_verifier_blob_sha),
                  "source_policy_verifier_path": str(source_policy_verifier_path),
                  "source_policy_verifier_blob_sha": str(source_policy_verifier_blob_sha),
                  "verifier_workflow_path": str(verifier_workflow_path),
                  "verifier_workflow_sha": str(verifier_workflow_sha),
                  "verifier_workflow_blob_sha": str(verifier_workflow_blob_sha),
              }

          def execution_binding_digest(binding):
              encoded = json.dumps(
                  binding, sort_keys=True, separators=(",", ":"), ensure_ascii=True
              ).encode("utf-8")
              return hashlib.sha256(encoded).hexdigest()

          binding = execution_binding_document(
              repository_id=repository_obj["id"],
              repository=repository_obj["full_name"],
              candidate_repository_id=candidate_repo_id,
              candidate_repository=candidate_repository,
              candidate_pr=candidate_pr,
              candidate_sha=candidate_sha,
              dispatcher_workflow_path=os.environ["TRUSTED_DISPATCHER_WORKFLOW_PATH"],
              dispatcher_workflow_sha=workflow_sha,
              s1_workflow_path=os.environ["INDEPENDENT_WORKFLOW_PATH"],
              s1_workflow_blob_sha=s1_at_run["sha"],
              run_id=run_id,
              run_attempt=run_attempt,
              run_number=run["run_number"],
              resolver_job_id=resolver_job["id"],
              s1_job_id=job["id"],
              reference_verifier_path=os.environ["REFERENCE_VERIFIER_PATH"],
              reference_verifier_blob_sha=os.environ["REFERENCE_VERIFIER_BLOB_SHA"],
              causal_join_verifier_path=os.environ["CAUSAL_JOIN_VERIFIER_PATH"],
              causal_join_verifier_blob_sha=os.environ["CAUSAL_JOIN_VERIFIER_BLOB_SHA"],
              source_policy_verifier_path=os.environ["SOURCE_POLICY_VERIFIER_PATH"],
              source_policy_verifier_blob_sha=os.environ["SOURCE_POLICY_VERIFIER_BLOB_SHA"],
              verifier_workflow_path=os.environ["TRUSTED_RESULT_VERIFIER_WORKFLOW_PATH"],
              verifier_workflow_sha=os.environ["GITHUB_WORKFLOW_SHA"],
              verifier_workflow_blob_sha=workflow_blob_sha,
          )
          expected_execution_binding_keys = {
              "schema", "repository_id", "repository", "candidate_repository_id",
              "candidate_repository", "candidate_pr", "candidate_sha",
              "dispatcher_workflow_path", "dispatcher_workflow_sha",
              "s1_workflow_path", "s1_workflow_blob_sha", "run_id", "run_attempt",
              "run_number", "resolver_job_id", "s1_job_id",
              "reference_verifier_path", "reference_verifier_blob_sha",
              "causal_join_verifier_path", "causal_join_verifier_blob_sha",
              "source_policy_verifier_path", "source_policy_verifier_blob_sha",
              "verifier_workflow_path", "verifier_workflow_sha", "verifier_workflow_blob_sha",
          }
          assert set(binding) == expected_execution_binding_keys, "execution binding schema drift"
          assert binding["repository_id"] == int(os.environ["BASE_REPOSITORY_ID"])
          assert binding["repository"] == repository_obj["full_name"]
          assert binding["candidate_repository"] == candidate_repository
          assert binding["candidate_repository_id"] == candidate_repo_id
          assert binding["candidate_pr"] == candidate_pr
          assert binding["candidate_sha"] == candidate_sha
          assert binding["dispatcher_workflow_sha"] == workflow_sha
          assert binding["dispatcher_workflow_path"] == os.environ["TRUSTED_DISPATCHER_WORKFLOW_PATH"]
          assert binding["s1_workflow_blob_sha"] == s1_at_run["sha"]
          assert binding["s1_workflow_path"] == os.environ["INDEPENDENT_WORKFLOW_PATH"]
          assert binding["verifier_workflow_path"] == os.environ["TRUSTED_RESULT_VERIFIER_WORKFLOW_PATH"]
          assert binding["verifier_workflow_sha"] == os.environ["GITHUB_WORKFLOW_SHA"]
          assert binding["verifier_workflow_blob_sha"] == workflow_blob_sha
          assert binding["run_id"] == int(run_id)
          assert binding["run_attempt"] == run_attempt
          assert binding["run_number"] == run["run_number"]
          assert binding["resolver_job_id"] == resolver_job["id"]
          assert binding["s1_job_id"] == job["id"]
          binding_digest = execution_binding_digest(binding)

          # Metamorphic self-test: every identity-bearing field must affect the sealed
          # digest. This executes before artifact parsing so the binding primitive cannot
          # silently collapse two distinct executions into one identity.
          mutations = {
              "repository_id": binding["repository_id"] + 1,
              "repository": binding["repository"] + "-mutated",
              "candidate_repository_id": binding["candidate_repository_id"] + 1,
              "candidate_repository": binding["candidate_repository"] + "-mutated",
              "candidate_pr": binding["candidate_pr"] + 1,
              "candidate_sha": "0" * 40,
              "dispatcher_workflow_path": binding["dispatcher_workflow_path"] + ".mutated",
              "dispatcher_workflow_sha": "1" * 40,
              "s1_workflow_path": binding["s1_workflow_path"] + ".mutated",
              "s1_workflow_blob_sha": "2" * 40,
              "reference_verifier_path": binding["reference_verifier_path"] + ".mutated",
              "reference_verifier_blob_sha": "5" * 40,
              "causal_join_verifier_path": binding["causal_join_verifier_path"] + ".mutated",
              "causal_join_verifier_blob_sha": "6" * 40,
              "source_policy_verifier_path": binding["source_policy_verifier_path"] + ".mutated",
              "source_policy_verifier_blob_sha": "8" * 40,
              "verifier_workflow_path": binding["verifier_workflow_path"] + ".mutated",
              "verifier_workflow_sha": "9" * 40,
              "verifier_workflow_blob_sha": "a" * 40,
              "run_id": binding["run_id"] + 1,
              "run_attempt": binding["run_attempt"] + 1,
              "run_number": binding["run_number"] + 1,
              "resolver_job_id": binding["resolver_job_id"] + 1,
              "s1_job_id": binding["s1_job_id"] + 1,
          }
          for field, replacement in mutations.items():
              mutated = dict(binding)
              mutated[field] = replacement
              assert execution_binding_digest(mutated) != binding_digest, (
                  f"execution binding digest is invariant under mutation of {field}"
              )

          def run_reference_verifier(document):
              workspace = os.environ["GITHUB_WORKSPACE"]
              reference_path = os.path.join(workspace, os.environ["REFERENCE_VERIFIER_PATH"])
              with tempfile.NamedTemporaryFile("w", encoding="utf-8", suffix=".json", delete=False) as handle:
                  json.dump(document, handle, sort_keys=True, separators=(",", ":"))
                  document_path = handle.name
              try:
                  output = subprocess.check_output(
                      ["python3", reference_path, document_path],
                      text=True,
                      stderr=subprocess.STDOUT,
                      timeout=20,
                  )
              except subprocess.CalledProcessError as exc:
                  raise AssertionError(f"independent reference verifier rejected binding: {exc.output!r}") from exc
              finally:
                  os.unlink(document_path)
              fields = {}
              for line in output.splitlines():
                  assert "=" in line, f"reference verifier emitted malformed line: {line!r}"
                  key, value = line.split("=", 1)
                  assert key not in fields, f"reference verifier emitted duplicate key: {key!r}"
                  fields[key] = value
              assert fields.get("schema") == document["schema"]
              digest = fields.get("reference_digest", "")
              assert re.fullmatch(r"[0-9a-f]{64}", digest), "reference verifier did not emit a SHA-256 digest"
              assert fields.get("mutations_verified") == str(len(document) - 1), "reference verifier mutation census drift"
              return digest

          reference_binding_digest = run_reference_verifier(binding)

          expected_artifact_name = f"security-kernel-independent-qualification-{candidate_sha}-attempt-{run_attempt}.txt"
          encoded_artifact_name = urllib.parse.quote(expected_artifact_name, safe="")
          artifact_response = get(
              f"/repos/{repo}/actions/runs/{run_id}/artifacts"
              f"?per_page=100&name={encoded_artifact_name}"
          )
          matching_artifacts = artifact_response.get("artifacts", [])
          assert artifact_response.get("total_count") == 1, (
              "artifact name-filter response did not report exactly one matching artifact"
          )
          assert len(matching_artifacts) == 1, (
              f"expected exactly one retained qualification receipt artifact: {len(matching_artifacts)}"
          )
          artifact = matching_artifacts[0]
          assert artifact.get("name") == expected_artifact_name
          assert isinstance(artifact.get("id"), int) and artifact["id"] > 0
          assert artifact.get("expired") is False, "qualification receipt artifact is expired"
          artifact_run = artifact.get("workflow_run")
