name: Authority Coordinator Stability Fence

on:
  pull_request:
    paths:
      - 'crates/mycelix-authority-coordinator-stability-fence/**'
      - 'crates/mycelix-authority-coordinator-deployment-composer/**'
      - 'crates/mycelix-authority-coordinator-deployment/**'
      - 'mycelix-governance/dna/dna.yaml'
      - '.github/workflows/authority-coordinator-stability-fence.yml'
  push:
    branches:
      - 'security/authority-coordinator-stability-fence-v0.1'

permissions:
  contents: read

concurrency:
  group: authority-coordinator-stability-fence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Strictly later exact deployment observation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --manifest-path crates/mycelix-authority-coordinator-stability-fence/Cargo.toml -- --check

      - name: Tests
        run: cargo test --manifest-path crates/mycelix-authority-coordinator-stability-fence/Cargo.toml --all-targets

      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-authority-coordinator-stability-fence/Cargo.toml --all-targets -- -D warnings

      - name: Trust-boundary audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('crates/mycelix-authority-coordinator-stability-fence')
          src = (root / 'src/lib.rs').read_text()
          inv = (root / 'INVARIANTS.md').read_text().lower()
          cargo = (root / 'Cargo.toml').read_text().lower()
          dna = Path('mycelix-governance/dna/dna.yaml').read_text()

          assert 'hdk' not in cargo
          assert 'holochain_client' not in cargo
          assert 'pub struct CoordinatorAdmissionSubject {' in src
          assert 'pub struct QualifiedCoordinatorStabilityFence {' in src
          positive_prefix = src.split('pub struct QualifiedCoordinatorStabilityFence {', 1)[0].split('\n')[-8:]
          assert not any('Deserialize' in line for line in positive_prefix)

          for token in [
              'post_observation.observed_at_ms <= pre_observed_at_ms',
              'post_observation.observed_at_ms > pre_composition.valid_until_ms()',
              'pre_composition.valid_until_ms() <= now_ms',
              'required_deployment_for_target_agent(',
              'required_digest != pre_composition.required_deployment_digest()',
              'match_required_coordinator_deployment(&required, post_observation, now_ms)',
              'post_match.dna_hash_raw_39() != pre_composition.target_dna_hash_raw_39()',
              'post_match.agent_pub_key_raw_39() != pre_composition.target_agent_pub_key_raw_39()',
              '.max(post_match.observed_at_ms())',
              '.min(post_match.valid_until_ms())',
              'subject.binding_digest()?',
              'pre_composition.composition_digest()',
              'post_match.match_digest()',
          ]:
              assert token in src, token

          for forbidden in [
              'AdminWebsocket',
              'observe_local_coordinator_deployment',
              'get_dna_definition(',
              'update_coordinators',
              'perform_external_effect',
              'call_remote(',
          ]:
              assert forbidden not in src, forbidden

          for invariant in [
              'a deployment match is only a snapshot',
              'the post observation must be strictly later',
              'the post observation must occur inside the pre evidence window',
              'the exact current release and target cellid are preserved',
              '#262 performs the post exact-set match',
              'every fence is bound to one admission subject and one attempt nonce',
              'positive stability fence is non-deserializable',
              'stability is not atomicity',
              'pure fence does not prove native bracketing provenance',
              'no execution/effect authority',
              'provisioning remains blocked',
          ]:
              assert invariant in inv, invariant

          assert 'name: authority_current_freshness_verifier' not in dna
          assert 'name: constitution_currentness_verifier' not in dna

          print('PASS: strictly later matching deployment observation yields a subject-bound stability fence without claiming atomicity/effect authority')
          PY
