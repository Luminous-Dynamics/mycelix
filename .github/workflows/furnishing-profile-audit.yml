name: Furnishing Profile Audit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'mycelix-marketplace/contracts/furnishing-catalog-profile-v0.1.schema.json'
      - 'mycelix-marketplace/contracts/furnishing-adapter-request-v0.1.schema.json'
      - 'mycelix-marketplace/contracts/fixtures/furnishing-catalog-profile-v0.1.json'
      - 'mycelix-marketplace/contracts/fixtures/furnishing-adapter-request-v0.1.json'
      - 'mycelix-marketplace/tools/furnishing-profile-audit/**'
      - '.github/workflows/furnishing-profile-audit.yml'
permissions:
  contents: read

jobs:
  audit:
    name: Exact-head furnishing profile audit
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Assert exact commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.repository }}" = "Luminous-Dynamics/mycelix"
          test "${{ github.repository_id }}" = "1176351975"
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - name: Generate standalone dependency lockfile
        run: cargo generate-lockfile --manifest-path mycelix-marketplace/tools/furnishing-profile-audit/Cargo.toml
      - name: Check formatting
        run: cargo fmt --manifest-path mycelix-marketplace/tools/furnishing-profile-audit/Cargo.toml -- --check
      - name: Run profile and adversarial policy tests
        run: cargo test --manifest-path mycelix-marketplace/tools/furnishing-profile-audit/Cargo.toml
      - name: Run Clippy
        run: cargo clippy --manifest-path mycelix-marketplace/tools/furnishing-profile-audit/Cargo.toml --all-targets -- -D warnings

      - name: Emit temporary lockfile for repository bootstrap
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          lock="mycelix-marketplace/tools/furnishing-profile-audit/Cargo.lock"
          if test -f "$lock"; then
            printf 'FURNISHING_LOCKFILE_B64_BEGIN\n'
            base64 -w 0 "$lock"
            printf '\nFURNISHING_LOCKFILE_B64_END\n'
          else
            echo "FURNISHING_LOCKFILE_MISSING"
          fi
