name: Authority Coordinator Admin Isolation

on:
  pull_request:
    paths:
      - 'crates/mycelix-authority-coordinator-admin-isolation/**'
      - 'crates/mycelix-authority-coordinator-conductor-process/**'
      - '.github/workflows/authority-coordinator-admin-isolation.yml'
  push:
    branches:
      - 'response-authority-10-admin-isolation'

permissions:
  contents: read

concurrency:
  group: authority-coordinator-admin-isolation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Non-host loopback-only broker + conductor namespace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.89.0'
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --manifest-path crates/mycelix-authority-coordinator-admin-isolation/Cargo.toml -- --check

      - name: Tests
        run: cargo test --manifest-path crates/mycelix-authority-coordinator-admin-isolation/Cargo.toml --all-targets

      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-authority-coordinator-admin-isolation/Cargo.toml --all-targets -- -D warnings

      - name: Upstream conductor compatibility
        run: cargo check --manifest-path crates/mycelix-authority-coordinator-conductor-process/Cargo.toml --all-targets

      - name: Trust-boundary audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('crates/mycelix-authority-coordinator-admin-isolation')
          src = (root / 'src/lib.rs').read_text()
          prod = src.split('#[cfg(test)]', 1)[0]
          compact = ''.join(prod.split())
          inv = (root / 'INVARIANTS.md').read_text().lower()
          cargo = (root / 'Cargo.toml').read_text()

          for dep in [
              'libc = "0.2"',
              'mycelix-authority-coordinator-conductor-process = ',
          ]:
              assert dep in cargo, dep

          for token in [
              'pub struct BrokerProcessBinding {',
              'pub struct QualifiedExclusiveAdminIsolation {',
              "pub struct ExclusiveAdminIsolationGuard<'a> {",
              'pub fn begin_exclusive_admin_isolation',
              '.begin_fence()',
              'observe_broker_process(broker_binding)',
              'namespace_identity("/proc/1/ns/net")',
              'namespace_identity("/proc/self/ns/net")',
              'network_interfaces()',
              'namespace_members(',
              'require_loopback_only(',
              '.finish()',
              'conductor_fence.process_snapshot().pid',
              'conductor_fence.binding_digest()',
              'host_loopback_bypass_excluded_here',
              'coordinator_update_excluded_here',
              'grants_execution_authority',
          ]:
              assert token in src, token

          # The live API cannot accept caller-supplied broker PID/netns/process snapshots.
          sig = prod.split('pub fn begin_exclusive_admin_isolation', 1)[1].split(') ->', 1)[0]
          for forbidden in ['BrokerProcessSnapshot', 'NamespaceIdentity', 'u32', 'Vec<u32>']:
              assert forbidden not in sig, forbidden

          # Positive result is non-deserializable.
          prefix = src.split('pub struct QualifiedExclusiveAdminIsolation {', 1)[0].split('\n')[-8:]
          assert not any('Deserialize' in line for line in prefix)

          # #381 must open before namespace evidence; final positive construction follows close + recheck.
          begin_body = prod.split('pub fn begin_exclusive_admin_isolation', 1)[1].split('\n}\n\nimpl ExclusiveAdminIsolationGuard', 1)[0]
          assert begin_body.index('.begin_fence()') < begin_body.index('observe_broker_process(broker_binding)')
          finish_body = prod.split('pub fn finish(self)', 1)[1].split('\n    }\n}\n\nfn observe_broker_process', 1)[0]
          mid = finish_body.index('let broker_mid')
          close = finish_body.index('.finish()')
          post = finish_body.index('let broker_post')
          positive = finish_body.index('Ok(QualifiedExclusiveAdminIsolation {')
          assert mid < close < post < positive

          # No Admin mutation/effect path is allowed in this theorem.
          for forbidden in [
              'AdminWebsocket', 'update_coordinators', 'install_app(', 'uninstall_app(',
              'enable_app(', 'disable_app(', 'perform_external_effect', 'call_zome(',
          ]:
              assert forbidden not in prod, forbidden

          for phrase in [
              'loopback is not isolation',
              'the broker is the live caller',
              '#381 opens before namespace evidence',
              'the admin network namespace must not be the host namespace',
              'the namespace is loopback-only',
              'exact process membership',
              'broker identity is stable over the interval',
              'namespace topology is stable over the interval',
              'positive isolation is non-deserializable',
              'this closes host-loopback bypass, not update atomicity',
              'no admin mutation in this crate',
              'no execution authority',
          ]:
              assert phrase in inv, phrase

          # Exact hard boundary stays mechanically visible.
          assert 'pubconstfncoordinator_update_excluded_here(&self)->bool{false}' in compact
          assert 'pubconstfngrants_execution_authority(&self)->bool{false}' in compact
          print('PASS: Admin loopback is isolated behind a pinned broker+conductor namespace interval; update exclusion/effects remain blocked')
          PY
