name: SAP payment saga trace profile qualification

on:
  pull_request:
    paths:
      - "tools/finance/sap-payment-saga-model/**"
      - "tools/finance/sap-payment-saga-go-verifier/**"
      - ".github/workflows/sap-payment-saga-trace-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sap-payment-saga-trace-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trace-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact subject SHA
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          printf 'QUALIFIED_SUBJECT_SHA=%s\n' "$actual"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Rust formatting
        run: cargo fmt --manifest-path tools/finance/sap-payment-saga-model/Cargo.toml -- --check

      - name: Rust tests
        run: cargo test --manifest-path tools/finance/sap-payment-saga-model/Cargo.toml

      - name: Rust Clippy
        run: cargo clippy --manifest-path tools/finance/sap-payment-saga-model/Cargo.toml --all-targets -- -D warnings

      - name: Install pinned Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
          cache-dependency-path: tools/finance/sap-payment-saga-go-verifier/go.mod

      - name: Go formatting
        working-directory: tools/finance/sap-payment-saga-go-verifier
        run: |
          test -z "$(gofmt -l trace.go trace_test.go oracle.go oracle_test.go shrinker.go shrinker_test.go compensation.go compensation_test.go compensation_benchmark_test.go provider.go provider_test.go)"

      - name: Go tests with race detector
        working-directory: tools/finance/sap-payment-saga-go-verifier
        run: go test -race -count=1 ./...

      - name: Go vet
        working-directory: tools/finance/sap-payment-saga-go-verifier
        run: go vet ./...
