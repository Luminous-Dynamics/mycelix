name: Policy Evidence Waist One-Shot Format Repair

on:
  push:
    branches:
      - foundation/policy-evidence-waist-v0.1

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: foundation/policy-evidence-waist-v0.1
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Apply exact rustfmt
        run: cargo fmt --manifest-path crates/mycelix-policy-evidence/Cargo.toml
      - name: Scope guard
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "crates/mycelix-policy-evidence/src/lib.rs"
      - name: Verify formatted source
        run: cargo fmt --manifest-path crates/mycelix-policy-evidence/Cargo.toml -- --check
      - name: Tests
        run: cargo test --manifest-path crates/mycelix-policy-evidence/Cargo.toml --all-targets
      - name: Clippy warnings denied
        run: cargo clippy --manifest-path crates/mycelix-policy-evidence/Cargo.toml --all-targets -- -D warnings
      - name: Commit exact formatter repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tristan Stoltz"
          git config user.email "tristan.stoltz@evolvingresonantcocreationism.com"
          git add crates/mycelix-policy-evidence/src/lib.rs
          git commit -m "style(core): apply exact rustfmt to policy evidence waist"
          git push origin HEAD:foundation/policy-evidence-waist-v0.1
