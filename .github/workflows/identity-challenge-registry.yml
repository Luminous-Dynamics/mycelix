name: PostgreSQL Verifier Challenge Registry Adapter

on:
  pull_request:
    paths:
      - "mycelix-identity/Cargo.toml"
      - "mycelix-identity/challenge-registry/**"
      - ".github/workflows/identity-challenge-registry.yml"
  push:
    branches:
      - "identity/challenge-registry-sqlx-adapter-2026-11-04"
    paths:
      - "mycelix-identity/Cargo.toml"
      - "mycelix-identity/challenge-registry/**"
      - ".github/workflows/identity-challenge-registry.yml"

permissions:
  contents: read

jobs:
  postgres-challenge-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: challenge_registry_test
          POSTGRES_USER: challenge_test
          POSTGRES_PASSWORD: challenge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U challenge_test -d challenge_registry_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CARGO_TERM_COLOR: always
      DATABASE_URL_ADMIN: postgres://challenge_test:challenge_test@localhost:5432/challenge_registry_test
      DATABASE_URL: postgres://verifier_challenge_runtime:ci-only-verifier-challenge-runtime@localhost:5432/challenge_registry_test
      EXPECTED_SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact subject before execution
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SUBJECT_SHA"
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path mycelix-identity/challenge-registry/service/Cargo.toml --check
      - name: Apply authoritative PostgreSQL migration
        run: psql "$DATABASE_URL_ADMIN" -X -v ON_ERROR_STOP=1 -f mycelix-identity/challenge-registry/migrations/0001_verifier_challenges.sql
      - name: Provision and assert least-privilege runtime role
        run: psql "$DATABASE_URL_ADMIN" -X -v ON_ERROR_STOP=1 -f mycelix-identity/challenge-registry/tests/provision_ci_roles.sql
      - name: Run sequential SQL contract through runtime role
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f mycelix-identity/challenge-registry/tests/consume_once.sql
      - name: Run two-process consume race
        run: sh mycelix-identity/challenge-registry/tests/concurrent_consume.sh
      - name: Run Rust unit and PostgreSQL integration tests
        run: cargo test --manifest-path mycelix-identity/challenge-registry/service/Cargo.toml --all-targets
      - name: Strict Clippy
        run: cargo clippy --manifest-path mycelix-identity/challenge-registry/service/Cargo.toml --all-targets -- -D warnings
      - name: Assert exact subject after execution
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SUBJECT_SHA"
