name: Regenerative Recovery Transition Commitment

on:
  push:
    branches:
      - feat/regenerative-recovery-transition-commitment-v1
  pull_request:
    branches:
      - test/regenerative-recovery-governance-action-conformance-v1

permissions:
  contents: read

concurrency:
  group: regenerative-recovery-transition-commitment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: Exact recovery pre-state to post-state commitment
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Toolchain identity
        run: |
          rustc --version --verbose
          cargo --version
          rustfmt --version
          cargo clippy --version

      - name: Format owned subjects
        run: |
          rustfmt --edition 2024 --check mycelix-commons/crates/commons-types/src/regenerative_recovery_transition_commitment.rs
          rustfmt --edition 2024 --check mycelix-commons/crates/commons-types/src/lib.rs

      - name: Test commons-types
        run: cargo test --manifest-path mycelix-commons/Cargo.toml -p commons-types

      - name: Clippy commons-types; gate owned subjects
        shell: bash
        run: |
          set -euo pipefail
          owned_a='mycelix-commons/crates/commons-types/src/regenerative_recovery_transition_commitment.rs'
          owned_b='mycelix-commons/crates/commons-types/src/lib.rs'
          set +e
          cargo clippy --manifest-path mycelix-commons/Cargo.toml -p commons-types \
            --message-format=json 2>&1 | tee /tmp/recovery-transition-clippy.jsonl
          cargo_status=${PIPESTATUS[0]}
          set -e
          python3 - "$owned_a" "$owned_b" "$cargo_status" <<'PY'
          import json
          import sys

          owned = set(sys.argv[1:3])
          cargo_status = int(sys.argv[3])
          owned_warnings = []
          compiler_errors = []

          with open('/tmp/recovery-transition-clippy.jsonl', encoding='utf-8', errors='replace') as handle:
              for line in handle:
                  try:
                      event = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if event.get('reason') != 'compiler-message':
                      continue
                  message = event.get('message') or {}
                  level = message.get('level')
                  spans = message.get('spans') or []
                  if level == 'error':
                      compiler_errors.append(message.get('message', 'compiler error'))
                  if level != 'warning':
                      continue
                  if any(span.get('is_primary') and span.get('file_name') in owned for span in spans):
                      owned_warnings.append(message.get('message', 'warning'))

          if cargo_status != 0 or compiler_errors:
              print('Whole-package compiler/Clippy failure', file=sys.stderr)
              for error in compiler_errors:
                  print(f'- {error}', file=sys.stderr)
              raise SystemExit(1)
          if owned_warnings:
              print('Owned recovery-transition warnings:', file=sys.stderr)
              for warning in owned_warnings:
                  print(f'- {warning}', file=sys.stderr)
              raise SystemExit(1)
          print('PASS: whole package compiled and owned transition subjects have no Clippy warnings')
          PY

      - name: Transition-boundary audit
        shell: bash
        run: |
          set -euo pipefail
          subject=mycelix-commons/crates/commons-types/src/regenerative_recovery_transition_commitment.rs
          grep -q 'let mut post_head = head.clone()' "$subject"
          grep -q 'verify_regenerative_recovery_fork_resolution' "$subject"
          grep -q 'pre_state_digest' "$subject"
          grep -q 'post_state_digest' "$subject"
          grep -q 'fork_resolution_content_digest' "$subject"
          grep -q 'governance_authority_verified_here' "$subject"
          grep -q 'persistence_authorized_here' "$subject"
          grep -q '^        false$' "$subject"
          ! grep -Eq '\bhdk\b|create_entry|update_entry|delete_entry|CallTargetCell|ZomeName' "$subject"
          ! grep -Eq 'persistence_authorized_here[^\n]*true|governance_authority_verified_here[^\n]*true' "$subject"
