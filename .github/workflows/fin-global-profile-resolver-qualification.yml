name: FIN-GLOBAL-PROFILE-RESOLVER exact-head qualification

on:
  push:
    branches:
      - research/fin-global-profile-resolver-v1
    paths:
      - "mycelix-finance/benchmarks/global-accounting-portability-v1/**"
      - ".github/workflows/fin-global-profile-resolver-qualification.yml"
  pull_request:
    branches:
      - research/fin-global-portability-v1
    paths:
      - "mycelix-finance/benchmarks/global-accounting-portability-v1/**"
      - ".github/workflows/fin-global-profile-resolver-qualification.yml"

permissions:
  contents: read

concurrency:
  group: fin-global-profile-resolver-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Schema, temporal semantics, exact profile resolution
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      QUALIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RESOLVER_DIR: mycelix-finance/benchmarks/global-accounting-portability-v1/rust-resolver
    steps:
      - name: Checkout exact qualification subject
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          persist-credentials: false

      - name: Assert exact checked-out commit
        run: test "$(git rev-parse HEAD)" = "${{ env.QUALIFIED_SHA }}"

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy

      - name: Assert toolchain
        run: test "$(rustc +1.96.1 --version | awk '{print $2}')" = "1.96.1"

      - name: Format
        working-directory: ${{ env.RESOLVER_DIR }}
        run: cargo fmt --all -- --check

      - name: Locked resolver tests
        working-directory: ${{ env.RESOLVER_DIR }}
        run: cargo test --locked

      - name: Warnings-denied Clippy
        working-directory: ${{ env.RESOLVER_DIR }}
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run all declared request dispositions
        working-directory: ${{ env.RESOLVER_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          cargo run --locked -- --request fixtures/synthetic-qualified-request.json --out /tmp/qualified.json
          cargo run --locked -- --request fixtures/synthetic-disabled-request.json --out /tmp/disabled.json
          cargo run --locked -- --request fixtures/reference-only-request.json --out /tmp/reference-only.json
          cargo run --locked -- --request fixtures/missing-dimension-request.json --out /tmp/missing-dimension.json

          jq -e '.disposition == "qualified_for_declared_scope" and .claim_ceiling == "synthetic_fixture_only"' /tmp/qualified.json
          jq -e '.disposition == "unsupported_profile" and .claim_ceiling == "no_qualification_claim"' /tmp/disabled.json
          jq -e '.disposition == "unsupported_profile" and .claim_ceiling == "no_qualification_claim"' /tmp/reference-only.json
          jq -e '.disposition == "indeterminate" and (.missing_dimensions | length) > 0' /tmp/missing-dimension.json

      - name: Assert exact subject and clean source
        run: |
          test "$(git rev-parse HEAD)" = "${{ env.QUALIFIED_SHA }}"
          test -z "$(git status --porcelain)"

      - name: Upload exact-head resolution reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fin-global-profile-resolver-${{ env.QUALIFIED_SHA }}
          path: |
            /tmp/qualified.json
            /tmp/disabled.json
            /tmp/reference-only.json
            /tmp/missing-dimension.json
          if-no-files-found: error
