name: Authority Witness Verifier

on:
  pull_request:
    paths:
      - 'crates/mycelix-authority-witness-verifier/**'
      - 'crates/mycelix-authority-state-coverage/**'
      - 'crates/mycelix-authority-state-coverage-context/**'
      - '.github/workflows/authority-witness-verifier.yml'
  push:
    branches:
      - 'security/authority-witness-proof-split-v0.1'
      - 'security/authority-witness-leased-runtime-v0.1'

permissions:
  contents: read

concurrency:
  group: authority-witness-verifier-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: Split witness proofs with explicit dynamic horizon
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --manifest-path crates/mycelix-authority-witness-verifier/Cargo.toml -- --check

      - name: Tests
        run: cargo test --manifest-path crates/mycelix-authority-witness-verifier/Cargo.toml --all-targets

      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-authority-witness-verifier/Cargo.toml --all-targets -- -D warnings

      - name: Downstream compatibility
        run: |
          cargo check --manifest-path crates/mycelix-authority-state-coverage/Cargo.toml --all-targets
          cargo check --manifest-path crates/mycelix-authority-state-coverage-context/Cargo.toml --all-targets

      - name: Witness authority audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('crates/mycelix-authority-witness-verifier/src/lib.rs').read_text()
          inv = Path('crates/mycelix-authority-witness-verifier/INVARIANTS.md').read_text().lower()

          required = [
              'VerifiedWitnessObservationProof',
              'VerifiedWitnessTrustClassificationProof',
              'QualifiedWitnessEvidence',
              'qualify_witness_evidence(',
              'observation.identity_digest()',
              'context.identity_digest()',
              'challenge.identity_digest()',
              'source_receipt.attestation.identity_digest()',
              '.min(observation_proof.valid_until_ms)',
              '.min(classification_proof.valid_until_ms)',
              'WitnessTrustBinding {',
              'verified_trust_verifier_ref',
              'pub fn valid_until_ms(&self) -> u64',
          ]
          for token in required:
              assert token in src, token

          observation = src.split('pub struct VerifiedWitnessObservationProof {', 1)[1].split('}', 1)[0]
          classification = src.split('pub struct VerifiedWitnessTrustClassificationProof {', 1)[1].split('}', 1)[0]
          assert 'trust_domain_id' not in observation
          assert 'trust_domain_ref' not in observation
          assert 'classification_proof_ref' not in observation
          assert 'observation_digest' not in classification
          assert 'observation_proof_ref' not in classification
          assert 'source_head_digest' not in classification
          assert 'challenge_digest' not in classification
          assert 'LossyWitnessProjection' not in src

          for forbidden in [
              'hdk::',
              '#[hdk_extern]',
              'get_links(',
              'get_details(',
              'create_entry(',
              'call_remote(',
              'execute_actions',
              'reputation',
              'model_score',
              'phi',
          ]:
              assert forbidden.lower() not in src.lower(), forbidden

          assert 'observation authentication is not trust classification' in inv
          assert 'qualification preserves the true verifier horizon' in inv
          assert '#96 trust binding is constructed locally' in inv
          assert 'quorum remains #94/#96' in inv
          assert 'positive result is non-deserializable' in inv
          print('PASS: witness qualification preserves short verifier leases for lease-complete transport')
          PY
