name: Constitutional Temporal Provenance Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - 'mycelix-governance/Cargo.toml'
      - 'mycelix-governance/crates/constitutional-temporal-provenance/**'
      - 'mycelix-governance/specs/ConstitutionalEvidenceClosure*'
      - 'mycelix-governance/docs/CONSTITUTIONAL_TEMPORAL_PROVENANCE*'
      - 'mycelix-governance/tools/formal/pins.json'
      - 'mycelix-governance/tools/formal/qualify_temporal_provenance.py'
      - 'mycelix-governance/tools/formal/qualify_temporal_provenance_v2.py'
      - '.github/workflows/constitutional-temporal-provenance-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: constitutional-temporal-provenance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NIXPKGS_REV: a50bf0c1b07873c1a53892292017041a8f0a1288
  TLA_URL: https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
  TLA_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  qualify:
    name: Rust + TLA+ exact-head temporal provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact raw head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_HEAD }}

      - name: Bind evidence to raw head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD"
          rm -rf temporal-provenance-evidence
          mkdir -p temporal-provenance-evidence
          printf '%s\n' "$EXPECTED_HEAD" > temporal-provenance-evidence/expected-head.txt
          printf '%s\n' "$actual" > temporal-provenance-evidence/actual-head.txt

      - name: Install Nix
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Acquire pinned tools and qualify exact subject
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .temporal-provenance-tools
          mkdir -p .temporal-provenance-tools temporal-provenance-evidence

          nix shell \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#jdk17_headless" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#python312" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#curl" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#coreutils" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#cargo" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#rustc" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#bash" \
            --command bash -euo pipefail -c '
              curl --fail --location --retry 3 --retry-all-errors \
                --output .temporal-provenance-tools/tla2tools.jar "$TLA_URL"
              printf "%s  %s\n" "$TLA_SHA256" .temporal-provenance-tools/tla2tools.jar | sha256sum --check --strict

              python3 mycelix-governance/tools/formal/qualify_temporal_provenance_v2.py \
                --tla-jar "$PWD/.temporal-provenance-tools/tla2tools.jar" \
                --expected-head "$EXPECTED_HEAD" \
                --out "$PWD/temporal-provenance-evidence"
            '

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: constitutional-temporal-provenance-${{ env.EXPECTED_HEAD }}
          path: temporal-provenance-evidence
          if-no-files-found: error
          retention-days: 30
