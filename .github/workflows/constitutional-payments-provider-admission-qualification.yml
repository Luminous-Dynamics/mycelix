name: Constitutional Payments Provider Admission Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - 'mycelix-governance/Cargo.toml'
      - 'mycelix-governance/crates/constitutional-payments-provider-admission/**'
      - 'mycelix-governance/specs/constitutional-payments-provider-admission.v1.json'
      - 'mycelix-governance/specs/constitutional-payments-provider-admission.v1.schema.json'
      - 'mycelix-governance/docs/CONSTITUTIONAL_PAYMENTS_PROVIDER_ADMISSION_V0_1.md'
      - 'mycelix-governance/tools/formal/validate_constitutional_payments_provider_admission.py'
      - '.github/workflows/constitutional-payments-provider-admission-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payments-provider-admission-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NIXPKGS_REV: a50bf0c1b07873c1a53892292017041a8f0a1288
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  EXPECTED_SEMANTIC_HEAD: 1ded163920ef7ea2829a807cf61c89f224751714

jobs:
  qualify:
    name: Exact-head payments provider F1B2
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact raw head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false

      - name: Bind verifier lineage and semantic surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SEMANTIC_HEAD"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/constitutional-payments-provider-admission-qualification.yml"

          rm -rf payments-provider-admission-evidence
          mkdir -p payments-provider-admission-evidence
          printf '%s\n' "$EXPECTED_HEAD" > payments-provider-admission-evidence/expected-head.txt
          printf '%s\n' "$EXPECTED_SEMANTIC_HEAD" > payments-provider-admission-evidence/expected-semantic-head.txt

          cat > payments-provider-admission-evidence/expected-semantic-files.txt <<'EOF'
          mycelix-governance/Cargo.toml
          mycelix-governance/crates/constitutional-payments-provider-admission/Cargo.toml
          mycelix-governance/crates/constitutional-payments-provider-admission/src/lib.rs
          mycelix-governance/docs/CONSTITUTIONAL_PAYMENTS_PROVIDER_ADMISSION_V0_1.md
          mycelix-governance/specs/constitutional-payments-provider-admission.v1.json
          mycelix-governance/specs/constitutional-payments-provider-admission.v1.schema.json
          mycelix-governance/tools/formal/validate_constitutional_payments_provider_admission.py
          EOF
          sed -i 's/^          //' payments-provider-admission-evidence/expected-semantic-files.txt

          git diff --name-only "$EXPECTED_SEMANTIC_HEAD^" "$EXPECTED_SEMANTIC_HEAD" | sort \
            > payments-provider-admission-evidence/actual-semantic-files.txt
          sort payments-provider-admission-evidence/expected-semantic-files.txt \
            > payments-provider-admission-evidence/expected-semantic-files.sorted.txt
          cmp payments-provider-admission-evidence/expected-semantic-files.sorted.txt \
              payments-provider-admission-evidence/actual-semantic-files.txt

          if grep -E '(^|/)(zomes|dnas?)/' payments-provider-admission-evidence/actual-semantic-files.txt; then
            echo "F1B2 semantic head unexpectedly changes zome/DNA files" >&2
            exit 1
          fi

          git hash-object $(cat payments-provider-admission-evidence/expected-semantic-files.txt) \
            > payments-provider-admission-evidence/source-hashes-before.txt

      - name: Install Nix
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Validate closed F1B2 source/profile contract
        shell: bash
        run: |
          set -euo pipefail
          nix shell \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#python3" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#bash" \
            --command bash -euo pipefail -c '
              python3 --version | tee payments-provider-admission-evidence/python-version.txt
              python3 -m py_compile mycelix-governance/tools/formal/validate_constitutional_payments_provider_admission.py
              python3 mycelix-governance/tools/formal/validate_constitutional_payments_provider_admission.py --self-test \
                2>&1 | tee payments-provider-admission-evidence/source-validator.log
            '

      - name: Compile and test exact F1B2 subject
        shell: bash
        run: |
          set -euo pipefail
          nix shell \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#cargo" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#rustc" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#rustfmt" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#clippy" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#coreutils" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#bash" \
            --command bash -euo pipefail -c '
              rustc --version | tee payments-provider-admission-evidence/rustc-version.txt
              cargo --version | tee payments-provider-admission-evidence/cargo-version.txt
              rustfmt --version | tee payments-provider-admission-evidence/rustfmt-version.txt
              cargo clippy --version | tee payments-provider-admission-evidence/clippy-version.txt

              cargo fmt --manifest-path mycelix-governance/Cargo.toml \
                --package constitutional-payments-provider-admission -- --check \
                2>&1 | tee payments-provider-admission-evidence/cargo-fmt.log
              cargo check --manifest-path mycelix-governance/crates/constitutional-payments-provider-admission/Cargo.toml \
                --all-targets 2>&1 | tee payments-provider-admission-evidence/cargo-check.log
              cargo test --manifest-path mycelix-governance/crates/constitutional-payments-provider-admission/Cargo.toml \
                --all-targets 2>&1 | tee payments-provider-admission-evidence/cargo-test.log
              cargo clippy --manifest-path mycelix-governance/crates/constitutional-payments-provider-admission/Cargo.toml \
                --all-targets -- -D warnings \
                2>&1 | tee payments-provider-admission-evidence/cargo-clippy.log

              cp mycelix-governance/Cargo.lock payments-provider-admission-evidence/derived-Cargo.lock
              sha256sum payments-provider-admission-evidence/derived-Cargo.lock \
                > payments-provider-admission-evidence/derived-Cargo.lock.sha256
            '

      - name: Compile-valid F1B2 adversarial mutation controls
        shell: bash
        run: |
          set -euo pipefail
          nix shell \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#python3" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#cargo" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#rustc" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#bash" \
            --command bash -euo pipefail -c '
          python3 - <<"PY"
          from pathlib import Path
          import subprocess

          ROOT = Path.cwd()
          SRC = ROOT / "mycelix-governance/crates/constitutional-payments-provider-admission/src/lib.rs"
          MANIFEST = ROOT / "mycelix-governance/crates/constitutional-payments-provider-admission/Cargo.toml"
          EVIDENCE = ROOT / "payments-provider-admission-evidence"
          original = SRC.read_text()

          def restore():
              SRC.write_text(original)

          def replace(old, new, start=None):
              s = SRC.read_text()
              off = s.index(start) if start else 0
              pos = s.index(old, off)
              SRC.write_text(s[:pos] + new + s[pos + len(old):])

          def run(cmd, log):
              p = subprocess.run(cmd, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              (EVIDENCE / log).write_text(p.stdout)
              return p.returncode

          def mutant(name, mutate, test_filter):
              restore()
              mutate()
              if run(["cargo","check","--manifest-path",str(MANIFEST),"--all-targets"], f"mutant-{name}-check.log") != 0:
                  raise SystemExit(f"{name}: mutant did not compile")
              if run(["cargo","test","--manifest-path",str(MANIFEST),test_filter], f"mutant-{name}-test.log") == 0:
                  raise SystemExit(f"{name}: mutant survived")
              (EVIDENCE / f"mutant-{name}.txt").write_text("PASS\n")

          try:
              mutant(
                  "author-match",
                  lambda: replace(
                      "        if author != self.expected_author {\n",
                      "        if false && author != self.expected_author {\n",
                      "fn authorize(&self, author: &str)",
                  ),
                  "spoofed_author_is_rejected",
              )
              mutant(
                  "pending-authority",
                  lambda: replace(
                      "            ReferenceProviderAuthorityState::Pending => {\n                Err(AdmissionRejection::ProviderAuthorityPending)\n            }\n",
                      "            ReferenceProviderAuthorityState::Pending => Ok(()),\n",
                      "fn verify_for(&self, expected_profile_commitment: &str)",
                  ),
                  "pending_provider_authority_rejects_canonical_create",
              )
              mutant(
                  "predecessor-admission",
                  lambda: replace(
                      "        if candidate.sequence > 0 {\n",
                      "        if false && candidate.sequence > 0 {\n",
                      "pub fn admit_record_create",
                  ),
                  "orphan_non_genesis_record_is_rejected",
              )
              mutant(
                  "exact-projection",
                  lambda: replace(
                      "        if candidate.validate_refines_record(reference_record).is_err() {\n",
                      "        if false && candidate.validate_refines_record(reference_record).is_err() {\n",
                      "pub fn admit_record_create",
                  ),
                  "receipt_transplant_is_rejected",
              )
              mutant(
                  "same-slot-conflict",
                  lambda: replace(
                      "            if existing == &candidate {\n",
                      "            if true || existing == &candidate {\n",
                      "pub fn admit_record_create",
                  ),
                  "same_sequence_changed_content_halts_and_is_sticky",
              )
              mutant(
                  "index-genesis-gate",
                  lambda: replace(
                      "        if !self.admitted_records.contains_key(&0) {\n",
                      "        if false && !self.admitted_records.contains_key(&0) {\n",
                      "pub fn admit_index_create",
                  ),
                  "index_cannot_exist_before_genesis",
              )
              mutant(
                  "conflicting-index",
                  lambda: replace(
                      "            if existing == &candidate {\n",
                      "            if true || existing == &candidate {\n",
                      "pub fn admit_index_create",
                  ),
                  "exact_index_is_idempotent_but_conflicting_index_halts",
              )
              mutant(
                  "immutable-records",
                  lambda: replace(
                      "        AdmissionDecision::Rejected(AdmissionRejection::MutationForbidden)\n",
                      "        AdmissionDecision::Accepted\n",
                      "pub fn admit_record_update(&self)",
                  ),
                  "update_and_delete_attempts_are_forbidden",
              )
          finally:
              restore()
          PY
            '

      - name: Verify exact semantic immutability and postflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git hash-object $(cat payments-provider-admission-evidence/expected-semantic-files.txt) \
            > payments-provider-admission-evidence/source-hashes-after.txt
          cmp payments-provider-admission-evidence/source-hashes-before.txt \
              payments-provider-admission-evidence/source-hashes-after.txt
          git diff --exit-code -- $(cat payments-provider-admission-evidence/expected-semantic-files.txt)
          if git ls-files --error-unmatch mycelix-governance/Cargo.lock >/dev/null 2>&1; then
            git checkout -- mycelix-governance/Cargo.lock
          fi
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: constitutional-payments-provider-admission-${{ env.EXPECTED_HEAD }}
          path: payments-provider-admission-evidence
          if-no-files-found: error
          retention-days: 30
