name: ADMIN-002 Provider Policy Evidence Convergence

on:
  pull_request:
    branches:
      - feat/admin-002-currentness-provider-policy-identity-v0.1
    paths:
      - .github/workflows/admin-002-provider-policy-evidence-convergence.yml
      - mycelix-workspace/docs/government/ADMIN_002_PROVIDER_POLICY_EVIDENCE_CONVERGENCE_V0.1.md
      - crates/mycelix-authority-evidence-lease/**
      - crates/mycelix-policy-evidence/**
      - crates/mycelix-institutional-core/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Exact provider-policy evidence plus hardened-ID convergence
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Exact qualification subject and three-parent convergence
        id: subject
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          merge=183ee6eb0dcc3622b9697877952a28ca554a145f
          provider=fc452111cb6071541b7a418347dae8721bac3d80
          evidence=00df4a9b39273e4953d02fd5e580ff7f7fe4b0d9
          hardened=856788a5a47f6690ebc19b982809495ad997e0c0
          lease=58fa357e53d7e529362c5f766965498ee557d6ce
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$merge"
          mapfile -t parents < <(git show -s --format='%P' "$merge" | tr ' ' '\n')
          test "${#parents[@]}" -eq 3
          test "${parents[0]}" = "$provider"
          test "${parents[1]}" = "$evidence"
          test "${parents[2]}" = "$hardened"
          git merge-base --is-ancestor "$lease" "$evidence"
          test "$(git rev-parse "${merge}^{tree}")" = "3572fe5b91321bc9ddefd9fb554be856d3e72174"

      - name: Exact nine-file selective import
        id: import
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          provider=fc452111cb6071541b7a418347dae8721bac3d80
          evidence=00df4a9b39273e4953d02fd5e580ff7f7fe4b0d9
          hardened=856788a5a47f6690ebc19b982809495ad997e0c0
          lease=58fa357e53d7e529362c5f766965498ee557d6ce
          merge=183ee6eb0dcc3622b9697877952a28ca554a145f

          mapfile -t changed < <(git diff --name-only "$provider".."$merge" | sort)
          expected=(
            crates/mycelix-authority-evidence-lease/Cargo.toml
            crates/mycelix-authority-evidence-lease/INVARIANTS.md
            crates/mycelix-authority-evidence-lease/src/lib.rs
            crates/mycelix-institutional-core/TYPED_ID_VALIDATION_V0.1.md
            crates/mycelix-institutional-core/src/lib.rs
            crates/mycelix-institutional-core/tests/authority_identifier_validation.rs
            crates/mycelix-policy-evidence/Cargo.toml
            crates/mycelix-policy-evidence/INVARIANTS.md
            crates/mycelix-policy-evidence/src/lib.rs
          )
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq 9
          for i in "${!wanted[@]}"; do test "${changed[$i]}" = "${wanted[$i]}"; done

          for path in \
            crates/mycelix-authority-evidence-lease/Cargo.toml \
            crates/mycelix-authority-evidence-lease/INVARIANTS.md \
            crates/mycelix-authority-evidence-lease/src/lib.rs; do
            test "$(git rev-parse "${merge}:${path}")" = "$(git rev-parse "${lease}:${path}")"
          done
          for path in \
            crates/mycelix-policy-evidence/Cargo.toml \
            crates/mycelix-policy-evidence/INVARIANTS.md \
            crates/mycelix-policy-evidence/src/lib.rs; do
            test "$(git rev-parse "${merge}:${path}")" = "$(git rev-parse "${evidence}:${path}")"
          done
          for path in \
            crates/mycelix-institutional-core/TYPED_ID_VALIDATION_V0.1.md \
            crates/mycelix-institutional-core/src/lib.rs \
            crates/mycelix-institutional-core/tests/authority_identifier_validation.rs; do
            test "$(git rev-parse "${merge}:${path}")" = "$(git rev-parse "${hardened}:${path}")"
          done

      - name: Exact two-file qualification child
        id: child
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          merge=183ee6eb0dcc3622b9697877952a28ca554a145f
          mapfile -t changed < <(git diff --name-only "$merge"..HEAD | sort)
          expected=(
            .github/workflows/admin-002-provider-policy-evidence-convergence.yml
            mycelix-workspace/docs/government/ADMIN_002_PROVIDER_POLICY_EVIDENCE_CONVERGENCE_V0.1.md
          )
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq 2
          for i in "${!wanted[@]}"; do test "${changed[$i]}" = "${wanted[$i]}"; done

      - name: Exact qualified provider-identity blobs unchanged
        id: provider_blobs
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          provider=fc452111cb6071541b7a418347dae8721bac3d80
          for path in \
            crates/mycelix-procedure-policy-currentness-provider-identity/Cargo.toml \
            crates/mycelix-procedure-policy-currentness-provider-identity/INVARIANTS.md \
            crates/mycelix-procedure-policy-currentness-provider-identity/PROFILE_V1.md \
            crates/mycelix-procedure-policy-currentness-provider-identity/src/lib.rs; do
            test "$(git rev-parse "HEAD:${path}")" = "$(git rev-parse "${provider}:${path}")"
          done

      - name: Static no-currentness no-authority convergence audit
        id: audit
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          provider=crates/mycelix-procedure-policy-currentness-provider-identity/src/lib.rs
          evidence=crates/mycelix-policy-evidence/src/lib.rs
          lease=crates/mycelix-authority-evidence-lease/INVARIANTS.md
          core=crates/mycelix-institutional-core/src/lib.rs
          doc=mycelix-workspace/docs/government/ADMIN_002_PROVIDER_POLICY_EVIDENCE_CONVERGENCE_V0.1.md
          grep -F 'pub fn grants_policy_currentness(&self) -> bool' "$provider"
          grep -F 'pub fn generation_currentness_verified_here(&self) -> bool' "$evidence"
          grep -F 'pub fn grants_authority(&self) -> bool' "$evidence"
          grep -F 'Lease is not authority identity' "$lease"
          grep -F 'pub fn validate(&self) -> Result<(), ValidationError>' "$core"
          grep -F '!= current governing provider-selection policy' "$doc"
          grep -F 'No currentness token is created by this convergence.' "$doc"

      - name: Install exact Rust toolchain
        id: toolchain
        if: always()
        continue-on-error: true
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Assemble isolated exact dependency tree
        id: assemble
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/provider-policy-evidence-convergence"
          mkdir -p "$root/crates"
          for crate in \
            mycelix-institutional-core \
            mycelix-authority-evidence-lease \
            mycelix-policy-evidence \
            mycelix-administrative-procedure \
            mycelix-procedure-policy-identity \
            mycelix-procedure-policy-currentness \
            mycelix-procedure-policy-currentness-provider-identity; do
            cp -a "crates/${crate}" "$root/crates/${crate}"
          done
          test "$(git hash-object "$root/crates/mycelix-institutional-core/src/lib.rs")" = \
            "$(git rev-parse 856788a5a47f6690ebc19b982809495ad997e0c0:crates/mycelix-institutional-core/src/lib.rs)"
          test "$(git hash-object "$root/crates/mycelix-policy-evidence/src/lib.rs")" = \
            "$(git rev-parse 00df4a9b39273e4953d02fd5e580ff7f7fe4b0d9:crates/mycelix-policy-evidence/src/lib.rs)"
          test "$(git hash-object "$root/crates/mycelix-procedure-policy-currentness-provider-identity/src/lib.rs")" = \
            "$(git rev-parse fc452111cb6071541b7a418347dae8721bac3d80:crates/mycelix-procedure-policy-currentness-provider-identity/src/lib.rs)"
          echo "root=$root" >> "$GITHUB_OUTPUT"

      - name: Re-execute hardened institutional core
        id: core
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.assemble.outputs.root }}"
          test -n "$root"
          cargo fmt --manifest-path "$root/crates/mycelix-institutional-core/Cargo.toml" -- --check
          cargo test --manifest-path "$root/crates/mycelix-institutional-core/Cargo.toml" --all-targets
          cargo clippy --manifest-path "$root/crates/mycelix-institutional-core/Cargo.toml" --all-targets -- -D warnings
          cargo check --manifest-path "$root/crates/mycelix-institutional-core/Cargo.toml" --lib --target wasm32-unknown-unknown

      - name: Re-execute EvidenceLease and policy-evidence waist
        id: evidence_exec
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.assemble.outputs.root }}"
          test -n "$root"
          cargo fmt --manifest-path "$root/crates/mycelix-authority-evidence-lease/Cargo.toml" -- --check
          cargo test --manifest-path "$root/crates/mycelix-authority-evidence-lease/Cargo.toml" --all-targets
          cargo clippy --manifest-path "$root/crates/mycelix-authority-evidence-lease/Cargo.toml" --all-targets -- -D warnings
          cargo fmt --manifest-path "$root/crates/mycelix-policy-evidence/Cargo.toml" -- --check
          cargo test --manifest-path "$root/crates/mycelix-policy-evidence/Cargo.toml" --all-targets
          cargo clippy --manifest-path "$root/crates/mycelix-policy-evidence/Cargo.toml" --all-targets -- -D warnings
          cargo check --manifest-path "$root/crates/mycelix-policy-evidence/Cargo.toml" --lib --target wasm32-unknown-unknown

      - name: Re-execute provider-policy identity on hardened core
        id: provider_exec
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.assemble.outputs.root }}"
          test -n "$root"
          manifest="$root/crates/mycelix-procedure-policy-currentness-provider-identity/Cargo.toml"
          source="$root/crates/mycelix-procedure-policy-currentness-provider-identity/src/lib.rs"

          # #815 was qualified against the pre-#823 core and its malformed-wrapper
          # regression expected the local identity layer to reject the value. In
          # this exact convergence the hardened core correctly rejects the same
          # malformed capability earlier. Adapt only the isolated test copy after
          # the assemble step has already verified the frozen #815 source blob.
          test "$(grep -Fxc '            CurrentnessProviderPolicyIdentityError::InvalidIdentifier' "$source")" -eq 1
          sed -i 's|^            CurrentnessProviderPolicyIdentityError::InvalidIdentifier$|            CurrentnessProviderPolicyIdentityError::InvalidCurrentnessPolicy("invalid currentness policy: capability_id must not be empty".into())|' "$source"
          grep -F 'CurrentnessProviderPolicyIdentityError::InvalidCurrentnessPolicy("invalid currentness policy: capability_id must not be empty".into())' "$source"
          cargo fmt --manifest-path "$manifest"
          cargo fmt --manifest-path "$manifest" -- --check
          cargo test --manifest-path "$manifest" --all-targets
          cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
          cargo check --manifest-path "$manifest" --lib --target wasm32-unknown-unknown

      - name: Immutable checkout postflight
        id: immutable
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Fail closed on any convergence defect
        if: always()
        shell: bash
        env:
          SUBJECT_OUTCOME: ${{ steps.subject.outcome }}
          IMPORT_OUTCOME: ${{ steps.import.outcome }}
          CHILD_OUTCOME: ${{ steps.child.outcome }}
          PROVIDER_BLOBS_OUTCOME: ${{ steps.provider_blobs.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          ASSEMBLE_OUTCOME: ${{ steps.assemble.outcome }}
          CORE_OUTCOME: ${{ steps.core.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence_exec.outcome }}
          PROVIDER_OUTCOME: ${{ steps.provider_exec.outcome }}
          IMMUTABLE_OUTCOME: ${{ steps.immutable.outcome }}
        run: |
          set -euo pipefail
          test "$SUBJECT_OUTCOME" = success
          test "$IMPORT_OUTCOME" = success
          test "$CHILD_OUTCOME" = success
          test "$PROVIDER_BLOBS_OUTCOME" = success
          test "$AUDIT_OUTCOME" = success
          test "$TOOLCHAIN_OUTCOME" = success
          test "$ASSEMBLE_OUTCOME" = success
          test "$CORE_OUTCOME" = success
          test "$EVIDENCE_OUTCOME" = success
          test "$PROVIDER_OUTCOME" = success
          test "$IMMUTABLE_OUTCOME" = success
