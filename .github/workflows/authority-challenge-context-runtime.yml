name: Authority Challenge Context Runtime

on:
  pull_request:
    paths:
      - 'mycelix-governance/zomes/authority-state-context-policy-verifier/**'
      - 'mycelix-governance/Cargo.toml'
      - 'crates/mycelix-authority-challenge-context-verifier/**'
      - 'crates/mycelix-authority-freshness/**'
      - '.github/workflows/authority-challenge-context-runtime.yml'
  push:
    branches:
      - 'security/authority-challenge-context-runtime-v0.1'

permissions:
  contents: read

concurrency:
  group: authority-challenge-context-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: Fail-closed challenge context runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path mycelix-governance/zomes/authority-state-context-policy-verifier/coordinator/Cargo.toml -- --check
      - name: Native check
        run: cargo check --manifest-path mycelix-governance/zomes/authority-state-context-policy-verifier/coordinator/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path mycelix-governance/zomes/authority-state-context-policy-verifier/coordinator/Cargo.toml --all-targets -- -D warnings
      - name: WASM build
        run: cargo build --manifest-path mycelix-governance/zomes/authority-state-context-policy-verifier/coordinator/Cargo.toml --release --target wasm32-unknown-unknown
      - name: Runtime containment audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('mycelix-governance/zomes/authority-state-context-policy-verifier/coordinator/src/lib.rs').read_text()
          inv = Path('mycelix-governance/zomes/authority-state-context-policy-verifier/INVARIANTS.md').read_text()
          dna = Path('mycelix-governance/dna/dna.yaml').read_text()

          required = [
              'authority_coverage_context_verifier',
              'authority_coverage_policy_verifier',
              'authority_witness_trust_policy_verifier',
              'authority_challenge_issuer_grant_verifier',
              'authority_current_freshness_verifier',
              'CallTargetCell::Local',
              'qualify_challenge_context',
              'AuthoritySubjectKind::AuthorityCoveragePolicy',
              'AuthoritySubjectKind::CoverageTrustContextPolicy',
              'AuthoritySubjectKind::WitnessTrustPolicy',
              'FreshnessRequest',
              'providers_probed_without_subject: false',
              'operational: false',
          ]
          for token in required:
              assert token in src, token

          assert 'freshness provider does not choose the authority set' in inv.lower()
          assert 'the only positive path is:' in inv.lower()
          assert 'must not appear in `mycelix-governance/dna/dna.yaml`' in inv.lower()

          # Workspace-buildable, DNA-unprovisioned.
          assert 'zomes/authority-state-context-policy-verifier/coordinator' in Path('mycelix-governance/Cargo.toml').read_text()
          assert 'authority_state_context_policy_verifier' not in dna
          assert 'authority-state-context-policy-verifier' not in dna

          lowered = src.lower()
          for forbidden in ['create_entry(', 'update_entry(', 'delete_entry(', 'call_remote(', 'execute_actions', 'phi', 'reputation', 'guardian']:
              assert forbidden not in lowered, forbidden
          print('PASS: context runtime composes explicit providers and remains unprovisioned/fail-closed')
          PY
