name: Identity Authority Domain Policy V2

on:
  pull_request:
    paths:
      - 'mycelix-workspace/mycelix-identity/Cargo.toml'
      - 'mycelix-workspace/mycelix-identity/crates/identity-authority-domain-policy/**'
      - '.github/workflows/identity-authority-domain-policy-v2.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-workspace/mycelix-identity/Cargo.toml'
      - 'mycelix-workspace/mycelix-identity/crates/identity-authority-domain-policy/**'
      - '.github/workflows/identity-authority-domain-policy-v2.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify-identity-authority-domain-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Assert authority-domain theorem boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          root = Path('mycelix-workspace/mycelix-identity')
          member = 'crates/identity-authority-domain-policy'
          workspace = tomllib.loads((root / 'Cargo.toml').read_text())
          if member not in workspace['workspace']['members']:
              raise SystemExit(f'ERROR: {member} is not an explicit Identity workspace member')

          manifest = tomllib.loads((root / member / 'Cargo.toml').read_text())
          deps = manifest.get('dependencies', {})
          if set(deps) != {'sha2'} or deps['sha2'].get('workspace') is not True:
              raise SystemExit(f'ERROR: authority-domain dependency boundary drifted: {deps}')
          if manifest.get('dev-dependencies'):
              raise SystemExit('ERROR: authority-domain theorem must not need dev dependencies')

          text = (root / member / 'src/lib.rs').read_text()
          required = [
              '#![forbid(unsafe_code)]',
              'AUTHORITY_DOMAIN_ID_MAX_LEN_V2: usize = 128',
              'HOLOCHAIN_DNA_HASH_RAW_LEN_V2: usize = 39',
              'mycelix:identity:authority-domain:v2\\0',
              'IdentityAuthorityDomainStatementV2',
              'QualifiedIdentityAuthorityDomainV2',
              'derive_identity_authority_domain_digest_v2',
              'qualify_identity_authority_domain_v2',
              'authority_domain_epoch == 0',
              'DnaHashLengthInvalid',
              'DnaHashAllZero',
              'same_logical_id_under_different_dna_is_different_domain_identity',
              'epoch_is_part_of_identity',
              'qualified_domain_fields_are_verifier_owned',
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'ERROR: authority-domain theorem missing: {needle!r}')

          result_start = text.index('pub struct QualifiedIdentityAuthorityDomainV2')
          result_end = text.index('impl QualifiedIdentityAuthorityDomainV2', result_start)
          result_body = text[result_start:result_end]
          for public_field in [
              'pub authority_domain_id:',
              'pub authority_domain_epoch:',
              'pub dna_hash_raw_39:',
              'pub digest_sha256:',
          ]:
              if public_field in result_body:
                  raise SystemExit(f'ERROR: authority-domain success field is forgeable: {public_field}')

          lower = text.lower()
          for forbidden in [
              'use hdk',
              'use hdi',
              'hdk::',
              'hdi::',
              'dnainfo',
              'dna_info(',
              'network_seed',
              'sys_time(',
              'std::time',
              'policy_current',
              'policy_accepted',
              '.verify(',
              'positive_evidence',
              'latest',
              'max_by_key',
          ]:
              if forbidden in lower:
                  raise SystemExit(
                      f'ERROR: runtime/currentness/signature authority leaked into pure domain theorem: {forbidden!r}'
                  )
          PY

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-workspace/mycelix-identity

      - name: Check formatting
        run: |
          cargo fmt \
            --manifest-path mycelix-workspace/mycelix-identity/crates/identity-authority-domain-policy/Cargo.toml \
            -- --check

      - name: Test authority-domain theorem
        run: |
          cargo test \
            --manifest-path mycelix-workspace/mycelix-identity/crates/identity-authority-domain-policy/Cargo.toml

      - name: Check authority-domain theorem for wasm32
        run: |
          cargo check \
            --manifest-path mycelix-workspace/mycelix-identity/crates/identity-authority-domain-policy/Cargo.toml \
            --target wasm32-unknown-unknown
