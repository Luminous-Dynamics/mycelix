name: LISE Institutional Assurance

on:
  pull_request:
    paths:
      - "mycelix-governance/crates/institutional-assurance/**"
      - "mycelix-governance/Cargo.toml"
      - "mycelix-governance/Cargo.lock"
      - ".github/workflows/lise-assurance.yml"
  push:
    branches:
      - "research/ipb-s3-institutional-capture-v0"
    paths:
      - "mycelix-governance/crates/institutional-assurance/**"
      - "mycelix-governance/Cargo.toml"
      - "mycelix-governance/Cargo.lock"
      - ".github/workflows/lise-assurance.yml"

permissions:
  contents: read

jobs:
  institutional-assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      EXPECTED_SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact PR subject
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SUBJECT_SHA"
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all --manifest-path mycelix-governance/Cargo.toml --check
      - name: Check all targets with the committed lockfile
        run: cargo check --locked --all-targets --manifest-path mycelix-governance/Cargo.toml -p institutional-assurance
      - name: Show generated lockfile delta
        if: always()
        run: git diff --no-ext-diff -- mycelix-governance/Cargo.lock
      - name: Run institutional assurance tests
        run: cargo test --locked --all-targets --manifest-path mycelix-governance/Cargo.toml -p institutional-assurance
      - name: Execute S3 machine-readable runner
        run: cargo run --locked --manifest-path mycelix-governance/Cargo.toml -p institutional-assurance --bin ipb-s3-run
      - name: Strict Clippy
        run: cargo clippy --locked --all-targets --manifest-path mycelix-governance/Cargo.toml -p institutional-assurance -- -D warnings
      - name: Verify exact subject and clean tracked source
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SUBJECT_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
