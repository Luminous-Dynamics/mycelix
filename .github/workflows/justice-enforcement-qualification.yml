name: Justice Enforcement Qualification

on:
  pull_request:
    paths:
      - 'mycelix-workspace/mycelix-civic/crates/justice-resolution-types/**'
      - 'mycelix-workspace/mycelix-civic/crates/justice-finality-qualification/**'
      - 'mycelix-workspace/mycelix-civic/crates/justice-resolution-verifier/**'
      - 'mycelix-workspace/mycelix-civic/crates/justice-enforcement-qualification/**'
      - 'mycelix-workspace/mycelix-civic/Cargo.toml'
      - 'mycelix-workspace/mycelix-civic/Cargo.lock'
      - '.github/workflows/justice-enforcement-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: justice-enforcement-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Pure Justice enforcement authorization
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Verify workspace and dependency boundary
        run: |
          python3 - <<'PY'
          import pathlib
          import tomllib

          civic_root = pathlib.Path('mycelix-workspace/mycelix-civic')
          workspace_manifest = tomllib.loads((civic_root / 'Cargo.toml').read_text())
          workspace = workspace_manifest['workspace']
          crate = 'crates/justice-enforcement-qualification'
          assert crate in workspace['members'], (
              'Justice enforcement qualifier must be an explicit Civic workspace member'
          )

          workspace_dependencies = workspace_manifest['workspace']['dependencies']
          assert workspace_dependencies['justice-enforcement-qualification']['path'] == crate

          manifest = tomllib.loads((civic_root / crate / 'Cargo.toml').read_text())
          dependencies = manifest.get('dependencies', {})
          assert set(dependencies) == {
              'justice-resolution-types',
              'justice-resolution-verifier',
          }, 'production qualifier may depend only on verified Justice remedy vocabulary/verifier'
          assert dependencies['justice-resolution-types']['path'] == '../justice-resolution-types'
          assert dependencies['justice-resolution-verifier']['path'] == '../justice-resolution-verifier'

          dev_dependencies = manifest.get('dev-dependencies', {})
          assert set(dev_dependencies) == {'justice-finality-qualification'}, (
              'finality minting is test-only; it must not enter the production enforcement surface'
          )
          assert dev_dependencies['justice-finality-qualification']['path'] == '../justice-finality-qualification'
          assert not manifest.get('build-dependencies'), 'qualifier must have zero build dependencies'
          PY

      - name: Verify pure production source boundary
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          path = pathlib.Path('mycelix-workspace/mycelix-civic/crates/justice-enforcement-qualification/src/lib.rs')
          text = path.read_text()
          production = text.split('#[cfg(test)]', 1)[0]

          forbidden = re.compile(
              r'(^|\s)use\s+(hdk|hdi|holochain|mycelix_business|mycelix_finance)'
              r'|hdk::|hdi::|holochain_[A-Za-z0-9_]*::'
              r'|mycelix_business_[A-Za-z0-9_]*::|mycelix_finance_[A-Za-z0-9_]*::'
              r'|std::(time|net|fs|process|env)::|SystemTime::now|Instant::now'
              r'|Command::new|TcpStream|UdpSocket'
          )
          match = forbidden.search(production)
          assert match is None, f'forbidden runtime/ambient coupling: {match.group(0)!r}'

          for term in (
              'justice_finality_qualification',
              'DecisionSnapshotV1',
              'AppealStatus',
              'declared_finalized',
              'Decision.finalized',
          ):
              assert term not in production, (
                  f'enforcement production surface regained raw finality/Decision/Appeal input: {term}'
              )
          PY

      - name: Verify effect and currentness boundaries
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          path = pathlib.Path('mycelix-workspace/mycelix-civic/crates/justice-enforcement-qualification/src/lib.rs')
          text = path.read_text()
          production = text.split('#[cfg(test)]', 1)[0]

          required = (
              'pub verified_remedy: VerifiedJusticeMonetaryRemedyV1',
              'self.verified_remedy.outcome().effect_id()',
              'current_revalidation_required_before_dispatch: true',
              'qualification_time_unix_ms = basis',
              '.receipt()',
          )
          for needle in required:
              assert needle in production, f'missing enforcement boundary: {needle}'

          assert re.search(r'pub\s+effect_id\s*:', production) is None, (
              'qualifier must not accept caller-supplied effect identity'
          )
          assert re.search(r'pub\s+qualification_time_unix_ms\s*:', production) is None, (
              'qualifier must derive time from the verified Justice receipt'
          )
          PY

      - name: Build isolated exact dependency capsule
        run: |
          capsule="$RUNNER_TEMP/justice-enforcement-qualification-capsule"
          rm -rf "$capsule"
          mkdir -p "$capsule"
          cp -R mycelix-workspace/mycelix-civic/crates/justice-resolution-types "$capsule/justice-resolution-types"
          cp -R mycelix-workspace/mycelix-civic/crates/justice-finality-qualification "$capsule/justice-finality-qualification"
          cp -R mycelix-workspace/mycelix-civic/crates/justice-resolution-verifier "$capsule/justice-resolution-verifier"
          cp -R mycelix-workspace/mycelix-civic/crates/justice-enforcement-qualification "$capsule/justice-enforcement-qualification"
          cat > "$capsule/Cargo.toml" <<'EOF'
          [workspace]
          resolver = "2"
          members = [
            "justice-resolution-types",
            "justice-finality-qualification",
            "justice-resolution-verifier",
            "justice-enforcement-qualification",
          ]

          [workspace.package]
          version = "0.1.0"
          edition = "2024"
          license = "AGPL-3.0-or-later"

          [workspace.dependencies]
          serde = { version = "=1.0.228", features = ["derive"] }
          EOF
          cargo generate-lockfile --manifest-path "$capsule/Cargo.toml"
          echo "CAPSULE=$capsule" >> "$GITHUB_ENV"

      - name: Check rustfmt
        run: cargo fmt --manifest-path "$CAPSULE/Cargo.toml" --package justice-enforcement-qualification -- --check

      - name: Test exact enforcement qualifier capsule
        run: cargo test --locked --manifest-path "$CAPSULE/Cargo.toml" -p justice-enforcement-qualification

      - name: Clippy exact enforcement qualifier capsule
        run: cargo clippy --locked --manifest-path "$CAPSULE/Cargo.toml" -p justice-enforcement-qualification --all-targets -- -D warnings

      - name: Verify repository stayed clean
        run: test -z "$(git status --short)"

      - name: Evidence boundary
        run: |
          cat <<'EOF'
          evidence_authority=pure_justice_enforcement_policy_qualification
          input_is_verified_justice_remedy=true
          raw_decision_input=false
          raw_appeal_state_input=false
          raw_finality_input=false
          caller_supplied_effect_id=false
          caller_supplied_qualification_time=false
          logical_effect_id_preserved=true
          new_economic_capacity_minted=false
          ambient_clock_used=false
          current_revalidation_before_dispatch_required=true
          runtime_policy_authentication_assumed=true
          runtime_record_authentication_assumed=true
          dispatch_established=false
          finance_execution_established=false
          reconciliation_established=false
          enforcement_completion_established=false
          business_closure_authorized=false
          EOF
