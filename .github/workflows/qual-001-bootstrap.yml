name: QUAL-001A Verifier Bootstrap

on:
  pull_request:
    paths:
      - '.github/workflows/qual-001-bootstrap.yml'
      - '.github/workflows/qual-001-authoritative.yml'
      - 'qualification/qual-001/**'
      - 'mycelix-workspace/docs/agents/QUAL_001_VERIFIER_V0.1.md'
      - 'mycelix-workspace/docs/agents/qual-001-bootstrap-v0.1.json'

permissions:
  contents: read

concurrency:
  group: qual-001a-bootstrap-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qualify:
    name: QUAL-001A verifier trust-root bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Exact bootstrap subject and main parent
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='31ede2365b81365bb119cd9351b2739119974130'
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          test "$(git rev-list --parents -n1 HEAD | wc -w)" -eq 2
          git rev-parse HEAD
          git rev-parse HEAD^
          git rev-parse HEAD^{tree}

      - name: Exact eight-path bootstrap census
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import subprocess
          expected = {
              ".github/workflows/qual-001-bootstrap.yml",
              ".github/workflows/qual-001-authoritative.yml",
              "qualification/qual-001/gate-manifest-v0.1.json",
              "qualification/qual-001/verifier-bundle-v0.1.json",
              "qualification/qual-001/verifier_v0_1.py",
              "qualification/qual-001/bootstrap_selftest_v0_1.py",
              "mycelix-workspace/docs/agents/QUAL_001_VERIFIER_V0.1.md",
              "mycelix-workspace/docs/agents/qual-001-bootstrap-v0.1.json",
          }
          actual = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "31ede2365b81365bb119cd9351b2739119974130", "HEAD"],
                  text=True,
              ).splitlines()
          )
          if actual != expected:
              raise SystemExit(
                  f"QUAL-001A path census mismatch: missing={sorted(expected-actual)} "
                  f"unexpected={sorted(actual-expected)}"
              )
          print("QUAL-001A exact path census: PASS")
          PY

      - name: Freeze bootstrap verifier bytes and semantic bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum qualification/qual-001/gate-manifest-v0.1.json | awk '{print $1}')" = '60478ceec4b5e5c542a8a66d6e34f13c94eb2048a4f77773100347ba0e859b61'
          test "$(sha256sum qualification/qual-001/verifier-bundle-v0.1.json | awk '{print $1}')" = 'b0281549127d0aa892a347ebffd32c5d9e59f8b6c26b3a478db852dc4366a964'
          test "$(sha256sum qualification/qual-001/verifier_v0_1.py | awk '{print $1}')" = 'ef1cf59d7d96e5689fcfe1f4f873a7cfeefa3c365cd813bd019d7c26952f44d2'
          test "$(git hash-object qualification/qual-001/bootstrap_selftest_v0_1.py)" = '664fd7642c902775af0aa6f3e77778508c44636a'
          test "$(sha256sum .github/workflows/qual-001-authoritative.yml | awk '{print $1}')" = '884f8ea58b5a21d21e9626d463ceabdd2ef01a2df83629a5922ec7945f619ac3'
          test "$(sha256sum mycelix-workspace/docs/agents/qual-001-bootstrap-v0.1.json | awk '{print $1}')" = 'd1f6844960fa195524088d2295df08a838fe737a45cd28f7d5600aab82226e77'
          test "$(sha256sum mycelix-workspace/docs/agents/QUAL_001_VERIFIER_V0.1.md | awk '{print $1}')" = '554e1dcea165c9463e3cf6c614d9f65492a5df0ddee83a5912f101746950e569'

          python3 -B - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          bundle_path = Path("qualification/qual-001/verifier-bundle-v0.1.json")
          bundle = json.loads(bundle_path.read_text())
          expected = {
              ".github/workflows/qual-001-authoritative.yml": "884f8ea58b5a21d21e9626d463ceabdd2ef01a2df83629a5922ec7945f619ac3",
              "qualification/qual-001/gate-manifest-v0.1.json": "60478ceec4b5e5c542a8a66d6e34f13c94eb2048a4f77773100347ba0e859b61",
              "qualification/qual-001/verifier_v0_1.py": "ef1cf59d7d96e5689fcfe1f4f873a7cfeefa3c365cd813bd019d7c26952f44d2",
          }
          actual = {entry["path"]: entry["sha256"] for entry in bundle["files"]}
          if actual != expected:
              raise SystemExit(f"verifier-bundle component census drift: {actual!r}")
          for path, digest in expected.items():
              observed = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if observed != digest:
                  raise SystemExit(f"verifier-bundle byte drift: {path}")
          print("QUAL-001A semantic verifier-bundle freeze: PASS")
          PY

      - name: Hostile-input and authoritative-lane self-tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -B qualification/qual-001/bootstrap_selftest_v0_1.py
          echo "QUAL_001_BOOTSTRAP_PYTHON=$(python3 --version)" >> "$GITHUB_ENV"

      - name: Explicit bootstrap and governance non-claims
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"candidate_owned_bootstrap": true' mycelix-workspace/docs/agents/qual-001-bootstrap-v0.1.json
          grep -Fq '"default_branch_adoption_required": true' mycelix-workspace/docs/agents/qual-001-bootstrap-v0.1.json
          grep -Fq '"repository_protection_required": true' mycelix-workspace/docs/agents/qual-001-bootstrap-v0.1.json
          grep -Fq '"repository_protection_issue": 938' mycelix-workspace/docs/agents/qual-001-bootstrap-v0.1.json
          grep -Fq '"independent_topology_active": false' mycelix-workspace/docs/agents/qual-001-bootstrap-v0.1.json
          grep -Fq 'QUAL-001A bootstrap PASS != protected default branch' mycelix-workspace/docs/agents/QUAL_001_VERIFIER_V0.1.md

      - name: Immutable bootstrap checkout postflight
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --short)"
          printf '%s\n' "$status"
          test -z "$status"

      - name: Emit successful bootstrap receipt
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --short)"
          receipt_json="$(python3 -B - <<'PY'
          import json
          import os
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          receipt = {
              "schema": "mycelix.qual.bootstrap.receipt.v0.1",
              "qualification_pass": True,
              "bootstrap_head": git("rev-parse", "HEAD"),
              "bootstrap_tree": git("rev-parse", "HEAD^{tree}"),
              "bootstrap_parent_main": git("rev-parse", "HEAD^"),
              "gate_manifest_profile": "mycelix.qual.static-subject-independence.v0.1",
              "gate_manifest_sha256": "60478ceec4b5e5c542a8a66d6e34f13c94eb2048a4f77773100347ba0e859b61",
              "verifier_bundle_schema": "mycelix.qual.verifier-bundle.v0.1",
              "verifier_bundle_sha256": "b0281549127d0aa892a347ebffd32c5d9e59f8b6c26b3a478db852dc4366a964",
              "verifier_sha256": "ef1cf59d7d96e5689fcfe1f4f873a7cfeefa3c365cd813bd019d7c26952f44d2",
              "authoritative_workflow_sha256": "884f8ea58b5a21d21e9626d463ceabdd2ef01a2df83629a5922ec7945f619ac3",
              "checkout_action": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
              "python_version": os.environ["QUAL_001_BOOTSTRAP_PYTHON"],
              "github_repository": os.environ["GITHUB_REPOSITORY"],
              "github_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "github_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "runner_os": os.environ["RUNNER_OS"],
              "runner_arch": os.environ["RUNNER_ARCH"],
              "candidate_owned_bootstrap": True,
              "default_branch_adoption_required": True,
              "repository_protection_required": True,
              "repository_protection_issue": 938,
              "independent_topology_active": False,
              "subject_execution_in_static_profile": False,
              "runtime_authority_claimed": False,
          }
          print(json.dumps(receipt, sort_keys=True, separators=(",", ":")))
          PY
          )"
          echo "QUAL_001_BOOTSTRAP_RECEIPT_JSON=$receipt_json"
