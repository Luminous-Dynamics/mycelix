              return result

          def reject_nonstandard_constant(value):
              raise ValueError(f"non-standard JSON constant: {value}")

          def strict_json_loads(text):
              return json.loads(
                  text,
                  object_pairs_hook=reject_duplicate_keys,
                  parse_constant=reject_nonstandard_constant,
              )

          def assert_strict_json_rejects_ambiguous_inputs():
              for payload in (
                  '{"duplicate": 1, "duplicate": 2}',
                  '{"nonstandard": NaN}',
                  '{"nonstandard": Infinity}',
                  '{"nonstandard": -Infinity}',
              ):
                  try:
                      strict_json_loads(payload)
                  except ValueError:
                      continue
                  raise AssertionError(f"ambiguous/non-standard JSON accepted: {payload}")

          assert_strict_json_rejects_ambiguous_inputs()

          manifest = strict_json_loads(path.read_text())
          expected_manifest_keys = {
              "schema", "manifest_scope", "claim_ceiling", "repository",
              "pr_number", "expected_head_sha", "expected_base_sha",
              "tested_commit_sha", "trusted_workflow_sha", "trusted_workflow_ref",
              "trusted_workflow_file_blob_sha", "trigger_run_id",
              "trigger_run_attempt", "trigger_workflow_id", "trigger_workflow_path",
              "trigger_event", "trigger_conclusion", "raw_execution_artifact_id",
              "raw_execution_artifact_digest", "run_id", "run_attempt", "runner_os",
              "candidate_federation_blob_sha", "candidate_federation_git_blob_sha",
              "trusted_federation_manifest_blob_sha",
              "federation_test_body_attestation_sha256", "qualification_result",
              "independent_run_envelope_sha256", "covered_files",
          }
          assert set(manifest) == expected_manifest_keys
          assert manifest["schema"] == "MYCELIX-COS-CONFORMANCE-QUALIFICATION-MANIFEST-V1"
          assert manifest["manifest_scope"] == "validated_independent_evidence_set"
          assert manifest["claim_ceiling"] == "ReferenceModelOnly"
          assert manifest["expected_head_sha"] == manifest["tested_commit_sha"]
          assert manifest["candidate_federation_blob_sha"] == manifest["candidate_federation_git_blob_sha"]
          assert manifest["raw_execution_artifact_digest"].startswith("sha256:")
          assert manifest["trigger_workflow_path"]
          assert isinstance(manifest["trigger_run_attempt"], int) and manifest["trigger_run_attempt"] >= 0
          assert manifest["trigger_event"] in {"pull_request", "workflow_dispatch"}
          if manifest["trigger_event"] == "pull_request":
              assert manifest["trigger_run_id"] > 0
              assert manifest["trigger_run_attempt"] >= 1
          else:
              assert manifest["trigger_run_id"] == 0
              assert manifest["trigger_run_attempt"] == 0
          assert manifest["run_attempt"] >= 1
          envelope_bytes = (evidence / "independent-run-envelope.json").read_bytes()
          assert manifest["independent_run_envelope_sha256"] == hashlib.sha256(envelope_bytes).hexdigest()

          expected = []
          for item in sorted(
              (p for p in evidence.rglob("*") if p.is_file()),
              key=lambda p: p.relative_to(evidence).as_posix(),
          ):
              rel = item.relative_to(evidence).as_posix()
              if rel in {"qualification-manifest-v1.json", "SHA256SUMS"}:
                  continue
              data = item.read_bytes()
              expected.append(
                  {
                      "path": rel,
                      "sha256": hashlib.sha256(data).hexdigest(),
                      "size_bytes": len(data),
                  }
              )
          assert manifest["covered_files"] == expected
          PY

          (
            cd evidence
            LC_ALL=C find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum
          ) > evidence/SHA256SUMS

      - name: Preserve validated independent evidence
        if: always()
        id: evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cos-conformance-independent-evidence-${{ needs.prepare.outputs.expected_head_sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce independent qualification result
        if: always()
        run: |
          result="$(python - <<'PY'
          import json
          print(json.load(open("evidence/independent-run-envelope.json"))["qualification_result"])
          PY
          )"
          test "${result}" = "passed" || {
            echo "independent qualification result: ${result}" >&2
            exit 1
          }


