name: FSRE decision defeater oracle

on:
  pull_request:
    paths:
      - 'tools/fsre-decision-defeater/**'
      - 'research/fsre/DECISION_DEFEATER_ANALYSIS_BENCHMARK_V0_1.md'
      - '.github/workflows/fsre-decision-defeater.yml'
      - 'tools/fsre-decision-defeater-verifier/**'
      - 'tools/fsre-experiment-potency/**'
      - 'tools/fsre-worldset-stability/**'
      - 'tools/fsre-capture-recapture/**'
      - 'tools/fsre-three-list-capture/**'
      - 'tools/fsre-decision-episode/**'
  push:
    branches:
      - main
      - research/fsre-decision-defeater-oracle-v0.1
      - research/fsre-decision-defeater-verifier-v0.1
      - research/fsre-experiment-potency-v0.1-rebased
      - research/fsre-experiment-potency-v0.1-stack3
      - research/fsre-experiment-potency-v0.1-stack4
      - research/fsre-worldset-stability-v0.1
      - research/fsre-capture-recapture-v0.1
      - research/fsre-three-list-capture-v0.1
      - research/fsre-decision-episode-v0.1
    paths:
      - 'tools/fsre-decision-defeater/**'
      - 'research/fsre/DECISION_DEFEATER_ANALYSIS_BENCHMARK_V0_1.md'
      - '.github/workflows/fsre-decision-defeater.yml'
      - 'tools/fsre-decision-defeater-verifier/**'
      - 'tools/fsre-experiment-potency/**'
      - 'tools/fsre-worldset-stability/**'

permissions:
  contents: read

jobs:
  decision-defeater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path tools/fsre-decision-defeater/Cargo.toml -- --check
      - name: Tests
        run: cargo test --locked --offline --manifest-path tools/fsre-decision-defeater/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --offline --manifest-path tools/fsre-decision-defeater/Cargo.toml --all-targets -- -D warnings
      - name: Deterministic CLI golden replay
        run: |
          cargo run --quiet --locked --offline --manifest-path tools/fsre-decision-defeater/Cargo.toml -- tools/fsre-decision-defeater/examples/pump-station.psv > /tmp/defeater-a.txt
          cargo run --quiet --locked --offline --manifest-path tools/fsre-decision-defeater/Cargo.toml -- tools/fsre-decision-defeater/examples/pump-station.psv > /tmp/defeater-b.txt
          cmp /tmp/defeater-a.txt /tmp/defeater-b.txt
          cmp /tmp/defeater-a.txt tools/fsre-decision-defeater/examples/pump-station.expected.txt

  independent-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path tools/fsre-decision-defeater-verifier/Cargo.toml -- --check
      - name: Resolve verifier lockfile from the pinned manifest
        run: cargo generate-lockfile --manifest-path tools/fsre-decision-defeater-verifier/Cargo.toml
      - name: Show resolved verifier lockfile
        run: cat tools/fsre-decision-defeater-verifier/Cargo.lock
      - name: Independent verifier tests
        run: cargo test --locked --manifest-path tools/fsre-decision-defeater-verifier/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --manifest-path tools/fsre-decision-defeater-verifier/Cargo.toml --all-targets -- -D warnings
      - name: Deterministic package verification
        run: |
          cargo run --quiet --locked --manifest-path tools/fsre-decision-defeater-verifier/Cargo.toml -- verify tools/fsre-decision-defeater-verifier/fixtures/pump-station > /tmp/verify-a.txt
          cargo run --quiet --locked --manifest-path tools/fsre-decision-defeater-verifier/Cargo.toml -- verify tools/fsre-decision-defeater-verifier/fixtures/pump-station > /tmp/verify-b.txt
          cmp /tmp/verify-a.txt /tmp/verify-b.txt
          cmp /tmp/verify-a.txt tools/fsre-decision-defeater-verifier/fixtures/pump-station/verification.expected.txt
      - name: Preserve resolved lockfile for source review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fsre-decision-defeater-verifier-lock
          path: tools/fsre-decision-defeater-verifier/Cargo.lock
          if-no-files-found: error
          retention-days: 7

  experiment-potency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path tools/fsre-experiment-potency/Cargo.toml -- --check
      - name: Tests
        run: cargo test --locked --offline --manifest-path tools/fsre-experiment-potency/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --offline --manifest-path tools/fsre-experiment-potency/Cargo.toml --all-targets -- -D warnings
      - name: Deterministic E0 golden
        run: |
          cargo run --quiet --locked --offline --manifest-path tools/fsre-experiment-potency/Cargo.toml -- tools/fsre-experiment-potency/fixtures/complementary-probes.psv > /tmp/potency-a.txt
          cargo run --quiet --locked --offline --manifest-path tools/fsre-experiment-potency/Cargo.toml -- tools/fsre-experiment-potency/fixtures/complementary-probes.psv > /tmp/potency-b.txt
          cmp /tmp/potency-a.txt /tmp/potency-b.txt
          cmp /tmp/potency-a.txt tools/fsre-experiment-potency/fixtures/complementary-probes.expected.txt

  worldset-stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path tools/fsre-worldset-stability/Cargo.toml -- --check
      - name: Tests
        run: cargo test --locked --offline --manifest-path tools/fsre-worldset-stability/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --offline --manifest-path tools/fsre-worldset-stability/Cargo.toml --all-targets -- -D warnings
      - name: Deterministic E0 golden
        run: |
          cargo run --quiet --locked --offline --manifest-path tools/fsre-worldset-stability/Cargo.toml -- tools/fsre-worldset-stability/fixtures/omitted-worlds.psv > /tmp/worldset-a.txt
          cargo run --quiet --locked --offline --manifest-path tools/fsre-worldset-stability/Cargo.toml -- tools/fsre-worldset-stability/fixtures/omitted-worlds.psv > /tmp/worldset-b.txt
          cmp /tmp/worldset-a.txt /tmp/worldset-b.txt
          cmp /tmp/worldset-a.txt tools/fsre-worldset-stability/fixtures/omitted-worlds.expected.txt

  capture-recapture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path tools/fsre-capture-recapture/Cargo.toml -- --check
      - name: Tests
        run: cargo test --locked --offline --manifest-path tools/fsre-capture-recapture/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --offline --manifest-path tools/fsre-capture-recapture/Cargo.toml --all-targets -- -D warnings
      - name: Deterministic E0 golden
        run: |
          cargo run --quiet --locked --offline --manifest-path tools/fsre-capture-recapture/Cargo.toml -- tools/fsre-capture-recapture/fixtures/dependence-strata.psv > /tmp/capture-a.txt
          cargo run --quiet --locked --offline --manifest-path tools/fsre-capture-recapture/Cargo.toml -- tools/fsre-capture-recapture/fixtures/dependence-strata.psv > /tmp/capture-b.txt
          cmp /tmp/capture-a.txt /tmp/capture-b.txt
          cmp /tmp/capture-a.txt tools/fsre-capture-recapture/fixtures/dependence-strata.expected.txt

  decision-episode:
    if: hashFiles('tools/fsre-decision-episode/Cargo.toml') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path tools/fsre-decision-episode/Cargo.toml -- --check
      - name: Tests
        run: cargo test --locked --offline --manifest-path tools/fsre-decision-episode/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --offline --manifest-path tools/fsre-decision-episode/Cargo.toml --all-targets -- -D warnings
      - name: Deterministic E0 golden
        run: |
          cargo run --quiet --locked --offline --manifest-path tools/fsre-decision-episode/Cargo.toml -- tools/fsre-decision-episode/fixtures/complete-episode.psv > /tmp/episode-a.txt
          cargo run --quiet --locked --offline --manifest-path tools/fsre-decision-episode/Cargo.toml -- tools/fsre-decision-episode/fixtures/complete-episode.psv > /tmp/episode-b.txt
          cmp /tmp/episode-a.txt /tmp/episode-b.txt
          cmp /tmp/episode-a.txt tools/fsre-decision-episode/fixtures/complete-episode.expected.txt

  three-list-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path tools/fsre-three-list-capture/Cargo.toml -- --check
      - name: Tests
        run: cargo test --locked --offline --manifest-path tools/fsre-three-list-capture/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --offline --manifest-path tools/fsre-three-list-capture/Cargo.toml --all-targets -- -D warnings
      - name: Deterministic CLI golden replay
        run: |
          cargo run --quiet --locked --offline --manifest-path tools/fsre-three-list-capture/Cargo.toml -- tools/fsre-three-list-capture/fixtures/known-answer.psv > /tmp/three-list-a.txt
          cargo run --quiet --locked --offline --manifest-path tools/fsre-three-list-capture/Cargo.toml -- tools/fsre-three-list-capture/fixtures/known-answer.psv > /tmp/three-list-b.txt
          cmp /tmp/three-list-a.txt /tmp/three-list-b.txt
          cmp /tmp/three-list-a.txt tools/fsre-three-list-capture/fixtures/known-answer.expected.txt
