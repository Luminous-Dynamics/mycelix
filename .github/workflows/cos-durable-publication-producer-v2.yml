              if applicable is True and item_data['enforcement']=='active':
                  assert not actors, f"active main-applicable ruleset has bypass actors: {item_data['id']}"
              item={'id':item_data['id'],'name':item_data['name'],'target':item_data['target'],'source_type':item_data['source_type'],'source':item_data['source'],'enforcement':item_data['enforcement'],'bypass_actors':actors,'conditions':conditions,'rules':item_data['rules'],'created_at':item_data['created_at'],'updated_at':item_data['updated_at'],'applicable_to_main':applicable}
              assert isinstance(item['created_at'],str) and isinstance(item['updated_at'],str)
              current_rulesets.append(item)
          current_rulesets.sort(key=lambda item:(item['source_type'],item['source'],item['id']))
          current_ruleset={'schema':'MYCELIX-COS-MAIN-RULESET-GOVERNANCE-V1','repository':os.environ['GITHUB_REPOSITORY'],'repository_id':int(os.environ['GITHUB_REPOSITORY_ID']),'branch':'refs/heads/main','rulesets':current_rulesets}
          assert current_ruleset==frozen_ruleset, 'main ruleset state or bypass actors changed after evidence capture'
          PY

      - name: Recheck release tag target immediately before immutable publication
        env:
          RELEASE_TAG: cos-qualification-${{ needs.prepare.outputs.claim_id }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          annotated="$(git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" | awk 'NR==1 {print $1}')"
          lightweight="$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | awk 'NR==1 {print $1}')"
          tag_sha="${annotated:-${lightweight}}"
          printf '%s\n' "${tag_sha}" | grep -Eq '^[0-9a-f]{40}$'
          test "${tag_sha}" = "${EXPECTED_MAIN_SHA}" || {
            echo "release tag changed or resolves incorrectly before publication" >&2
            exit 1
          }

      - name: Publish immutable release
        env:
          COS_RELEASE_ADMIN_TOKEN: ${{ secrets.COS_RELEASE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          claim_id="${{ needs.prepare.outputs.claim_id }}"
          GH_TOKEN="${COS_RELEASE_ADMIN_TOKEN}" gh release edit "cos-qualification-${claim_id}" --repo "${GITHUB_REPOSITORY}" --draft=false

      - name: Prove immutable release and asset
        env:
          COS_RELEASE_ADMIN_TOKEN: ${{ secrets.COS_RELEASE_ADMIN_TOKEN }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          claim_id="${{ needs.prepare.outputs.claim_id }}"
          release_tag="cos-qualification-${claim_id}"
          asset_name="cos-durable-${claim_id}.tar.gz"
          GH_TOKEN="${COS_RELEASE_ADMIN_TOKEN}" gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" --json id,tagName,isDraft,isImmutable,isLatest,isPrerelease,publishedAt,targetCommitish > published-release.json
          EXPECTED_MAIN_SHA="${EXPECTED_MAIN_SHA}" python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path('published-release.json').read_text())
          assert d['isDraft'] is False and d['isImmutable'] is True and d['isLatest'] is False and d['isPrerelease'] is False and d['publishedAt']
          assert d['targetCommitish']==os.environ['EXPECTED_MAIN_SHA']
          PY
          GH_TOKEN="${COS_RELEASE_ADMIN_TOKEN}" gh release verify "${release_tag}" --repo "${GITHUB_REPOSITORY}" --format json > release-attestation-verification.json
          rm -rf final-asset && mkdir final-asset
          GH_TOKEN="${COS_RELEASE_ADMIN_TOKEN}" gh release download "${release_tag}" --repo "${GITHUB_REPOSITORY}" --pattern "${asset_name}" --dir final-asset
          GH_TOKEN="${COS_RELEASE_ADMIN_TOKEN}" gh release verify-asset "${release_tag}" "final-asset/${asset_name}" --repo "${GITHUB_REPOSITORY}" --format json > release-asset-attestation-verification.json
          test "$(sha256sum "final-asset/${asset_name}" | awk '{print $1}')" = "$(sha256sum "${asset_name}" | awk '{print $1}')"

      - name: Record durable publication observation
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          facts=json.loads(Path('handoff/source-facts.json').read_text())
          release=json.loads(Path('published-release.json').read_text())
          policy=json.loads(Path('main-branch-policy-v1.json').read_text())
          asset_name='cos-durable-'+facts['claim_id']+'.tar.gz'
          observation={'schema':'MYCELIX-COS-DURABLE-PUBLICATION-VERIFICATION-V1','repository':os.environ['GITHUB_REPOSITORY'],'repository_id':1176351975,'release_tag':release['tagName'],'release_id':release['id'],'immutable':release['isImmutable'],'is_latest':release['isLatest'],'is_prerelease':release['isPrerelease'],'asset_name':asset_name,'asset_digest':'sha256:'+hashlib.sha256(Path(asset_name).read_bytes()).hexdigest(),'expected_main_sha':facts['expected_main_sha'],'qualification_claim_id':facts['claim_id'],'qualification_manifest_sha256':facts['manifest_sha256'],'attestor_workflow_sha':facts['attestor_workflow_sha'],'signed_attestation_bundle_sha256':facts['bundle_sha256'],'publication_handoff_sha256':facts['publication_handoff_sha256'],'environment_policy_sha256':facts['environment_policy_sha256'],'effective_main_rules_sha256':facts['effective_main_rules_sha256'],'main_branch_policy_sha256':policy['sha256'],'state':'DurableAndVerifiable'}
          assert observation['immutable'] is True and observation['is_latest'] is False and observation['is_prerelease'] is False
          Path('durable-publication-verification.json').write_text(json.dumps(observation,indent=2,sort_keys=True)+'\n')
          PY

      - name: Preserve publication observation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a0 # v7.0.1
        with:
          name: cos-durable-publication-verification-${{ needs.prepare.outputs.claim_id }}
          path: |
            durable-publication-verification.json
            published-release.json
            release-attestation-verification.json
            release-asset-attestation-verification.json
            environment-policy-v1.json
            effective-main-rules-v1.json
            main-branch-policy-v1.json
          if-no-files-found: error
          retention-days: 30
