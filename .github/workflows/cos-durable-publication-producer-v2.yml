          gzip -t "${asset_name}"
          rm -rf local-verify && mkdir local-verify
          tar -xzf "${asset_name}" -C local-verify
          (cd local-verify && sha256sum --check --strict SHA256SUMS)
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('local-verify')
          assert {p.name for p in root.iterdir() if p.is_file()} == {'durable-publication-manifest-v1.json','qualification-manifest-v1.json','qualification-attestation-predicate-v3.json','attestor-run-receipt.json','qualification-attestation-bundle.json','environment-policy-v1.json','effective-main-rules-v1.json','main-branch-policy-v1.json','SHA256SUMS'}
          m=json.loads((root/'durable-publication-manifest-v1.json').read_text())
          r=json.loads((root/'attestor-run-receipt.json').read_text())
          p=json.loads((root/'qualification-attestation-predicate-v3.json').read_text())
          env_policy=json.loads((root/'environment-policy-v1.json').read_text())
          effective_rules=json.loads((root/'effective-main-rules-v1.json').read_text())
          main_policy=json.loads((root/'main-branch-policy-v1.json').read_text())
          b=hashlib.sha256((root/'qualification-attestation-bundle.json').read_bytes()).hexdigest()
          assert m['qualification_claim_id']==r['qualification_claim_id'] and m['claim_ceiling']=='ReferenceModelOnly'
          assert m['release_tag']=='cos-qualification-'+m['qualification_claim_id']
          assert m['publication_handoff_sha256']==json.loads(Path('handoff/source-facts.json').read_text())['publication_handoff_sha256']
          assert m['trust_root_main_snapshot_sha']==m['expected_main_sha']
          assert m['signed_attestation_bundle_sha256']==b and r['attestation']['bundle_sha256']==b
          assert m['environment_policy_sha256']==env_policy['sha256']
          assert m['effective_main_rules_sha256']==effective_rules['sha256']
          assert m['main_branch_policy_sha256']==main_policy['sha256']
          assert env_policy['schema']=='MYCELIX-COS-DURABLE-ENVIRONMENT-POLICY-V1'
          assert effective_rules['schema']=='MYCELIX-COS-EFFECTIVE-MAIN-RULES-V1'
          assert main_policy['schema']=='MYCELIX-COS-PROTECTED-MAIN-POLICY-V1'
          for policy, schema in (
              (env_policy,'MYCELIX-COS-DURABLE-ENVIRONMENT-POLICY-V1'),
              (effective_rules,'MYCELIX-COS-EFFECTIVE-MAIN-RULES-V1'),
              (main_policy,'MYCELIX-COS-PROTECTED-MAIN-POLICY-V1'),
          ):
              assert policy['schema']==schema
              reported=policy.pop('sha256')
              canonical=json.dumps(policy,sort_keys=True,separators=(',',':')).encode('utf-8')
              assert reported==hashlib.sha256(canonical).hexdigest()
          assert m['qualification_manifest_sha256']==hashlib.sha256((root/'qualification-manifest-v1.json').read_bytes()).hexdigest()
          assert m['predicate_type']==p['predicate_type']
          expected_files={name:hashlib.sha256((root/name).read_bytes()).hexdigest() for name in ('qualification-manifest-v1.json','qualification-attestation-predicate-v3.json','attestor-run-receipt.json','qualification-attestation-bundle.json','environment-policy-v1.json','effective-main-rules-v1.json','main-branch-policy-v1.json')}
          assert m['files']==expected_files