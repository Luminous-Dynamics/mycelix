      - name: Upload exact durable asset to draft
        env:
          COS_RELEASE_ADMIN_TOKEN: ${{ secrets.COS_RELEASE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          claim_id="${{ needs.prepare.outputs.claim_id }}"
