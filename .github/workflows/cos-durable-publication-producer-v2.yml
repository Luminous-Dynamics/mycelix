name: COS Durable Publication Producer V2

on:
  workflow_dispatch:
    inputs:
      attestor_run_id:
        description: Exact successful COS attestor run
        required: true
        type: string
      expected_main_sha:
        description: Exact main revision represented by the attestor run
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: cos-durable-publication-${{ inputs.expected_main_sha }}-${{ inputs.attestor_run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Read-only qualification handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      claim_id: ${{ steps.claim.outputs.claim_id }}
      handoff_artifact_id: ${{ steps.transport.outputs.artifact-id }}
    steps:
      - name: Checkout producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate inputs
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          printf '%s\n' "${EXPECTED_MAIN_SHA}" | grep -Eq '^[0-9a-f]{40}$'
          test "${EXPECTED_REPOSITORY_ID}" = "1176351975"

      - name: Read and freeze durable-publication environment policy
        run: |
          set -euo pipefail
          GH_TOKEN="${GITHUB_TOKEN}" gh api -H 'X-GitHub-Api-Version: 2026-03-10' "repos/${GITHUB_REPOSITORY}/environments/cos-durable-publication" > environment-policy-api.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          data=json.loads(Path('environment-policy-api.json').read_text())
          assert data['name'].lower()=='cos-durable-publication'
          required=[r for r in data.get('protection_rules',[]) if r.get('type')=='required_reviewers']
          assert len(required)==1
          reviewers=sorted([{'type':x['type'],'id':x['reviewer']['id']} for x in required[0].get('reviewers',[])],key=lambda x:(x['type'],x['id']))
          assert reviewers and required[0].get('prevent_self_review') is True
          branch_policy=data.get('deployment_branch_policy')
          assert branch_policy=={'protected_branches':True,'custom_branch_policies':False}
          projection={'schema':'MYCELIX-COS-DURABLE-ENVIRONMENT-POLICY-V1','name':'cos-durable-publication','required_reviewers':reviewers,'prevent_self_review':True,'deployment_branch_policy':branch_policy,'other_protection_rules':sorted([{'type':r.get('type'),'id':r.get('id'),'wait_timer':r.get('wait_timer')} for r in data.get('protection_rules',[]) if r.get('type')!='required_reviewers'],key=lambda x:(str(x.get('type','')),int(x.get('id',0))))}
          raw=json.dumps(projection,sort_keys=True,separators=(',',':')).encode()
          projection['sha256']=hashlib.sha256(raw).hexdigest()
          Path('environment-policy-v1.json').write_text(json.dumps(projection,indent=2,sort_keys=True)+'\n')
          PY

      - name: Snapshot effective active main rules
        run: |
          set -euo pipefail
          GH_TOKEN="${GITHUB_TOKEN}" gh api -H 'X-GitHub-Api-Version: 2026-03-10' "repos/${GITHUB_REPOSITORY}/rules/branches/main?per_page=100" > effective-main-rules.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          rules=json.loads(Path('effective-main-rules.json').read_text())
          assert isinstance(rules,list)
          canonical=[]
          for rule in rules:
              item={'type':rule.get('type'),'ruleset_id':rule.get('ruleset_id'),'ruleset_source_type':rule.get('ruleset_source_type'),'ruleset_source':rule.get('ruleset_source'),'parameters':rule.get('parameters',{})}
              assert item['type']
              canonical.append(item)
          canonical=sorted(canonical,key=lambda x:(str(x['ruleset_source_type']),str(x['ruleset_source']),int(x['ruleset_id'] or 0),x['type'],json.dumps(x['parameters'],sort_keys=True,separators=(',',':'))))
          projection={'schema':'MYCELIX-COS-EFFECTIVE-MAIN-RULES-V1','branch':'refs/heads/main','rules':canonical}
          raw=json.dumps(projection,sort_keys=True,separators=(',',':')).encode()
          projection['sha256']=hashlib.sha256(raw).hexdigest()
          Path('effective-main-rules-v1.json').write_text(json.dumps(projection,indent=2,sort_keys=True)+'\n')
          PY
      - name: Read exact attestor run
        env:
          RUN_ID: ${{ inputs.attestor_run_id }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          printf '%s\n' "${RUN_ID}" | grep -Eq '^[0-9]+$'
          GH_TOKEN="${GITHUB_TOKEN}" gh api -H 'X-GitHub-Api-Version: 2026-03-10' "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > attestor-run.json
          GH_TOKEN="${GITHUB_TOKEN}" gh api -H 'X-GitHub-Api-Version: 2026-03-10' "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" > attestor-artifacts.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          run=json.loads(Path('attestor-run.json').read_text())
          assert run['status']=='completed' and run['conclusion']=='success'
          assert run['path']=='.github/workflows/cos-conformance-qualification-attestor.yml'
          assert run['head_sha']==os.environ['EXPECTED_MAIN_SHA']
          name=f"cos-conformance-qualification-attestation-{run['head_sha']}"
          rows=[a for a in json.loads(Path('attestor-artifacts.json').read_text())['artifacts'] if a.get('name')==name]
          assert len(rows)==1
          a=rows[0]
          assert a['expired'] is False and a['size_in_bytes']>0
          assert a['digest'].startswith('sha256:')
          Path('attestor-source.json').write_text(json.dumps({'run_id':run['id'],'run_attempt':run['run_attempt'],'head_sha':run['head_sha'],'workflow_path':run['path'],'artifact_name':name,'artifact_id':a['id'],'artifact_digest':a['digest']},indent=2,sort_keys=True)+'\n')
          PY

      - name: Download and hash attestor artifact
        env:
          RUN_ID: ${{ inputs.attestor_run_id }}
        run: |
          set -euo pipefail
          artifact_name="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('attestor-source.json').read_text())['artifact_name'])
          PY
          )"
          GH_TOKEN="${GITHUB_TOKEN}" gh run download "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name "${artifact_name}" --dir attestor-artifact
          artifact_id="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('attestor-source.json').read_text())['artifact_id'])
          PY
          )"
          expected="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('attestor-source.json').read_text())['artifact_digest'].removeprefix('sha256:'))
          PY
          )"
          curl --fail --show-error --silent --location --max-redirs 5 --proto '=https' --tlsv1.2 -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" --output attestor-artifact.zip "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip"
          test "$(sha256sum attestor-artifact.zip | awk '{print $1}')" = "${expected}"

      - name: Resolve and verify exact signing-input artifact
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          receipt_path="$(find attestor-artifact -type f -name attestor-run-receipt.json -print -quit)"
          test -n "${receipt_path}"
          RECEIPT_PATH="${receipt_path}" EXPECTED_MAIN_SHA="${EXPECTED_MAIN_SHA}" python - <<'PY'
          import json,os
          from pathlib import Path
          def reject(pairs):
              out={}
              for k,v in pairs:
                  if k in out: raise ValueError(f'duplicate JSON key: {k}')
                  out[k]=v
              return out
          def reject_constant(v): raise ValueError(v)
          receipt=json.loads(Path(os.environ['RECEIPT_PATH']).read_text(),object_pairs_hook=reject,parse_constant=reject_constant)
          assert receipt['qualification_topology']['head_sha']==os.environ['EXPECTED_MAIN_SHA']
          a=receipt['signing_input_artifact']
          assert isinstance(a['id'],int) and a['id']>0 and a['digest'].startswith('sha256:')
          vr=receipt['verifier_run']['id']
          assert isinstance(vr,int) and vr>0
          Path('signing-input-request.json').write_text(json.dumps({'artifact_id':a['id'],'artifact_digest':a['digest'],'verifier_run_id':vr},indent=2,sort_keys=True)+'\n')
          PY
          artifact_id="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('signing-input-request.json').read_text())['artifact_id'])
          PY
          )"
          GH_TOKEN="${GITHUB_TOKEN}" gh api -H 'X-GitHub-Api-Version: 2026-03-10' "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" > signing-input-artifact.json
          verifier_id="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('signing-input-request.json').read_text())['verifier_run_id'])
          PY
          )"
          GH_TOKEN="${GITHUB_TOKEN}" gh api -H 'X-GitHub-Api-Version: 2026-03-10' "repos/${GITHUB_REPOSITORY}/actions/runs/${verifier_id}" > verifier-run.json
          EXPECTED_MAIN_SHA="${EXPECTED_MAIN_SHA}" python - <<'PY'
          import json,os
          from pathlib import Path
          req=json.loads(Path('signing-input-request.json').read_text())
          art=json.loads(Path('signing-input-artifact.json').read_text())
          run=json.loads(Path('verifier-run.json').read_text())
          assert art['id']==req['artifact_id'] and art['digest']==req['artifact_digest']
          assert art['expired'] is False and art['size_in_bytes']>0
          assert art['workflow_run']['id']==req['verifier_run_id']
          assert run['id']==req['verifier_run_id'] and run['status']=='completed' and run['conclusion']=='success'
          assert run['path']=='.github/workflows/cos-conformance-evidence.yml'
          assert run['head_sha']==os.environ['EXPECTED_MAIN_SHA']
          Path('signing-input-source.json').write_text(json.dumps({'artifact_id':art['id'],'artifact_name':art['name'],'artifact_digest':art['digest'],'workflow_run_id':run['id'],'workflow_run_attempt':run['run_attempt']},indent=2,sort_keys=True)+'\n')
          PY
          signing_name="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('signing-input-source.json').read_text())['artifact_name'])
          PY
          )"
          GH_TOKEN="${GITHUB_TOKEN}" gh run download "${verifier_id}" --repo "${GITHUB_REPOSITORY}" --name "${signing_name}" --dir signing-input-artifact
          expected_signing="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('signing-input-source.json').read_text())['artifact_digest'].removeprefix('sha256:'))
          PY
          )"
          curl --fail --show-error --silent --location --max-redirs 5 --proto '=https' --tlsv1.2 -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" --output signing-input-artifact.zip "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip"
          test "$(sha256sum signing-input-artifact.zip | awk '{print $1}')" = "${expected_signing}"

      - name: Assemble and independently verify source
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          rm -rf durable-source && mkdir durable-source
          python - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path
          def one(root,name):
              xs=list(root.rglob(name)); assert len(xs)==1,(name,xs); return xs[0]
          s=Path('attestor-artifact'); i=Path('signing-input-artifact'); d=Path('durable-source')
          for name,root in [('attestor-run-receipt.json',s),('qualification-attestation-bundle.json',s),('qualification-manifest-v1.json',i),('qualification-attestation-predicate-v3.json',i)]: shutil.copyfile(one(root,name),d/name)
          def reject(pairs):
              out={}
              for k,v in pairs:
                  if k in out: raise ValueError(f'duplicate JSON key: {k}')
                  out[k]=v
              return out
          def reject_constant(v): raise ValueError(v)
          def strict(path): return json.loads(path.read_text(),object_pairs_hook=reject,parse_constant=reject_constant)
          receipt=strict(d/'attestor-run-receipt.json'); predicate=strict(d/'qualification-attestation-predicate-v3.json'); manifest=strict(d/'qualification-manifest-v1.json')
          manifest_sha=hashlib.sha256((d/'qualification-manifest-v1.json').read_bytes()).hexdigest()
          predicate_sha=hashlib.sha256((d/'qualification-attestation-predicate-v3.json').read_bytes()).hexdigest()
          bundle_sha=hashlib.sha256((d/'qualification-attestation-bundle.json').read_bytes()).hexdigest()
          assert manifest['schema']=='MYCELIX-COS-CONFORMANCE-QUALIFICATION-MANIFEST-V1' and manifest['qualification_result']=='passed' and manifest['claim_ceiling']=='ReferenceModelOnly' and manifest['expected_head_sha']==os.environ['EXPECTED_MAIN_SHA']
          assert predicate['schema']=='MYCELIX-COS-QUALIFICATION-ATTESTATION-PREDICATE-V3' and predicate['repository']==os.environ['GITHUB_REPOSITORY'] and predicate['repository_id']==int(os.environ['EXPECTED_REPOSITORY_ID'])
          assert predicate['qualification_result']=='passed' and predicate['claim_ceiling']=='ReferenceModelOnly' and predicate['qualification_manifest_sha256']==manifest_sha
          assert predicate['publication']=={'profile':'COS-TERMINAL-ATTESTATION-V1','state':'preconditions_satisfied_terminal_side_effect'}
          assert receipt['schema']=='MYCELIX-COS-QUALIFICATION-ATTESTOR-RECEIPT-V3' and receipt['repository']==os.environ['GITHUB_REPOSITORY'] and receipt['repository_id']==int(os.environ['EXPECTED_REPOSITORY_ID'])
          assert receipt['qualification_manifest_sha256']==manifest_sha and receipt['predicate_sha256']==predicate_sha and receipt['attestation']['bundle_sha256']==bundle_sha
          assert receipt['qualification_topology']['head_sha']==os.environ['EXPECTED_MAIN_SHA'] and receipt['trust_root']['status']=='candidate_not_authoritative_until_protected_adoption'
          separator=bytes([0])
          canonical=hashlib.sha256(b'MYCELIX-COS-QUALIFICATION-CLAIM-ID-V4'+separator+str(int(os.environ['EXPECTED_REPOSITORY_ID'])).encode('ascii')+separator+predicate['schema'].encode('utf-8')+separator+predicate['predicate_type'].encode('utf-8')+separator+predicate['publication']['profile'].encode('utf-8')+separator+predicate['claim_ceiling'].encode('utf-8')+separator+manifest_sha.encode('ascii')+separator+receipt['trust_root']['manifest_sha256'].encode('ascii')).hexdigest()
          assert canonical==predicate['qualification_claim_id']==receipt['qualification_claim_id']
          assert canonical==hashlib.sha256(b'MYCELIX-COS-QUALIFICATION-CLAIM-ID-V4'+separator+str(int(os.environ['EXPECTED_REPOSITORY_ID'])).encode('ascii')+separator+predicate['schema'].encode('utf-8')+separator+predicate['predicate_type'].encode('utf-8')+separator+predicate['publication']['profile'].encode('utf-8')+separator+predicate['claim_ceiling'].encode('utf-8')+separator+manifest_sha.encode('ascii')+separator+receipt['trust_root']['manifest_sha256'].encode('ascii')).hexdigest()
          signing_meta=json.loads(Path('signing-input-source.json').read_text())
          attestor_meta=json.loads(Path('attestor-source.json').read_text())
          assert receipt['attestor']['run_id']==attestor_meta['run_id'] and receipt['attestor']['run_attempt']==attestor_meta['run_attempt']
          assert receipt['signing_input_artifact']['id']==signing_meta['artifact_id'] and receipt['signing_input_artifact']['digest']==signing_meta['artifact_digest']
          assert receipt['verifier_run']['id']==signing_meta['workflow_run_id'] and receipt['verifier_run']['attempt']==signing_meta['workflow_run_attempt']
          assert receipt['trust_root']['main_snapshot_sha']==os.environ['EXPECTED_MAIN_SHA']
          assert predicate['qualification_manifest_artifact']['id']==signing_meta['artifact_id'] and predicate['qualification_manifest_artifact']['digest']==signing_meta['artifact_digest']
          assert predicate['attestor']['workflow_ref']==receipt['attestor']['workflow_ref'] and predicate['attestor']['workflow_sha']==receipt['attestor']['workflow_sha']
          assert predicate['attestor']['run_id']==receipt['attestor']['run_id'] and predicate['attestor']['run_attempt']==receipt['attestor']['run_attempt']
          env_policy=json.loads(Path('environment-policy-v1.json').read_text())
          effective_rules=json.loads(Path('effective-main-rules-v1.json').read_text())
          facts={
              'claim_id':canonical,'expected_main_sha':os.environ['EXPECTED_MAIN_SHA'],'manifest_sha256':manifest_sha,'predicate_sha256':predicate_sha,'bundle_sha256':bundle_sha,
              'predicate_type':predicate['predicate_type'],'publication_profile':predicate['publication']['profile'],'claim_ceiling':predicate['claim_ceiling'],
              'attestor_run_id':attestor_meta['run_id'],'attestor_run_attempt':attestor_meta['run_attempt'],'attestor_artifact_id':attestor_meta['artifact_id'],'attestor_artifact_digest':attestor_meta['artifact_digest'],
              'verifier_run_id':signing_meta['workflow_run_id'],'verifier_run_attempt':signing_meta['workflow_run_attempt'],'signing_input_artifact_id':signing_meta['artifact_id'],'signing_input_artifact_digest':signing_meta['artifact_digest'],
              'attestor_workflow_sha':receipt['attestor']['workflow_sha'],'attestor_workflow_ref':receipt['attestor']['workflow_ref'],
              'trust_root_manifest_sha256':receipt['trust_root']['manifest_sha256'],'trust_root_manifest_blob_sha1':receipt['trust_root']['manifest_blob_sha1'],'trust_root_main_snapshot_sha':receipt['trust_root']['main_snapshot_sha'],
              'environment_policy_sha256':env_policy['sha256'],'effective_main_rules_sha256':effective_rules['sha256'],
          }
          handoff_basis=json.dumps(facts,sort_keys=True,separators=(',',':')).encode('utf-8')
          facts['publication_handoff_sha256']=hashlib.sha256(handoff_basis).hexdigest()
          Path('source-facts.json').write_text(json.dumps(facts,indent=2,sort_keys=True)+'\n')
          PY

      - name: Reconcile candidate trust root and signer workflow
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          signer_sha="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('source-facts.json').read_text())['attestor_workflow_sha'])
          PY
          )"
          GH_TOKEN="${GITHUB_TOKEN}" gh api -H 'X-GitHub-Api-Version: 2026-03-10' "repos/${GITHUB_REPOSITORY}/contents/.github/cos/qualification-trust-root-v2.json" -f "ref=${EXPECTED_MAIN_SHA}" > trust-root-api.json
          GH_TOKEN="${GITHUB_TOKEN}" gh api -H 'X-GitHub-Api-Version: 2026-03-10' "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/cos-conformance-qualification-attestor.yml" -f "ref=${signer_sha}" > signer-workflow-api.json
          python - <<'PY'
          import base64,hashlib,json,subprocess
          from pathlib import Path
          def strict(path): return json.loads(Path(path).read_text())
          root_api= strict('trust-root-api.json'); signer_api=strict('signer-workflow-api.json')
          root_bytes=base64.b64decode(''.join(root_api['content'].splitlines()),validate=True)
          signer_bytes=base64.b64decode(''.join(signer_api['content'].splitlines()),validate=True)
          root=json.loads(root_bytes.decode('utf-8'))
          assert root['schema']=='MYCELIX-COS-QUALIFICATION-TRUST-ROOT-V2'
          assert root['repository']==os.environ['GITHUB_REPOSITORY']
          assert root['repository_id']==int(os.environ['EXPECTED_REPOSITORY_ID'])
          assert root['status']=='candidate_not_authoritative_until_protected_adoption'
          assert root['claim_ceiling']=='ReferenceModelOnly'
          assert root['activation_rule']=={'authoritative':False,'requires_protected_main_readback':True,'requires_exact_adoption_of_component_bytes':True,'requires_rotation_recovery_path':True,'requires_durable_subject_publication':True,'transient_actions_artifacts_are_insufficient':True,'required_durability_profile':'CONTENT-ADDRESSED-DURABLE-PUBLICATION-V1'}
          component=root['components']['qualification_attestor_workflow']
          assert component['path']=='.github/workflows/cos-conformance-qualification-attestor.yml'
          assert subprocess.check_output(['git','hash-object','--stdin'],input=signer_bytes).decode().strip()==component['git_blob_sha1']
          assert hashlib.sha256(signer_bytes).hexdigest()==component['content_sha256']
          facts=json.loads(Path('source-facts.json').read_text())
          receipt=json.loads(Path('durable-source/attestor-run-receipt.json').read_text())
          assert receipt['trust_root']['main_snapshot_sha']==os.environ['EXPECTED_MAIN_SHA']
          assert hashlib.sha256(root_bytes).hexdigest()==facts['trust_root_manifest_sha256']
          assert subprocess.check_output(['git','hash-object','--stdin'],input=root_bytes).decode().strip()==facts['trust_root_manifest_blob_sha1']
          facts.update({'attestor_workflow_git_blob_sha1':component['git_blob_sha1'],'attestor_workflow_content_sha256':component['content_sha256']})
          Path('source-facts.json').write_text(json.dumps(facts,indent=2,sort_keys=True)+'\n')
          Path('expected-trust-root.json').write_bytes(root_bytes)
          Path('reconciled-attestor-workflow.yml').write_bytes(signer_bytes)
          PY

      - name: Verify signed qualification attestation
        run: |
          set -euo pipefail
          signer_sha="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('source-facts.json').read_text())['attestor_workflow_sha'])
          PY
          )"
          predicate_type="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('source-facts.json').read_text())['predicate_type'])
          PY
          )"
          gh attestation verify durable-source/qualification-manifest-v1.json --repo "${GITHUB_REPOSITORY}" --bundle durable-source/qualification-attestation-bundle.json --predicate-type "${predicate_type}" --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/cos-conformance-qualification-attestor.yml" --signer-digest "${signer_sha}" --deny-self-hosted-runners --format json > source-attestation-verification.json
          test -s source-attestation-verification.json

      - name: Derive handoff identity
        id: claim
        run: |
          set -euo pipefail
          claim_id="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('source-facts.json').read_text())['claim_id'])
          PY
          )"
          echo "claim_id=${claim_id}" >> "$GITHUB_OUTPUT"

      - name: Upload read-only handoff
        id: transport
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a0 # v7.0.1
        with:
          name: cos-durable-publication-handoff-${{ steps.claim.outputs.claim_id }}
          path: |
            durable-source/
            source-facts.json
            source-attestation-verification.json
            expected-trust-root.json
            reconciled-attestor-workflow.yml
            environment-policy-v1.json
            effective-main-rules-v1.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Protected durable publication
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    environment: cos-durable-publication
    permissions:
      actions: read
      contents: read
    timeout-minutes: 30
    steps:
      - name: Require protected publisher ref
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          printf '%s\n' "${GITHUB_WORKFLOW_SHA}" | grep -Eq '^[0-9a-f]{40}$'

      - name: Checkout publisher
