      - name: Revalidate draft and asset digest
        env:
          COS_RELEASE_ADMIN_TOKEN: ${{ secrets.COS_RELEASE_ADMIN_TOKEN }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          claim_id="${{ needs.prepare.outputs.claim_id }}"
          release_tag="cos-qualification-${claim_id}"
          asset_name="cos-durable-${claim_id}.tar.gz"
          GH_TOKEN="${COS_RELEASE_ADMIN_TOKEN}" gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" --json id,tagName,isDraft,isImmutable,targetCommitish,assets > draft-release.json
