name: EPI-001 Evidence Identity Bootstrap

on:
  pull_request:
    paths:
      - 'mycelix-workspace/crates/mycelix-evidence-core/**'
      - '.github/workflows/epi-001-evidence-identities.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Freeze exact EPI-000 parent and scope
        shell: bash
        run: |
          set -euo pipefail
          expected_parent=3449d3ddf73507c24f1b18801059abbf099c5d67
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "${{ github.event.pull_request.base.sha }}" = "$expected_parent"
          fi
          git merge-base --is-ancestor "$expected_parent" HEAD
          changed="$(git diff --name-only "$expected_parent"...HEAD)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(mycelix-workspace/crates/mycelix-evidence-core/|\.github/workflows/epi-001-evidence-identities\.yml$)' || true)"
          test -z "$unexpected" || {
            echo 'unexpected EPI-001 scope:'
            printf '%s\n' "$unexpected"
            exit 1
          }

      - name: Independently rederive canonical vectors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, struct
          from pathlib import Path

          fixture_path = Path('mycelix-workspace/crates/mycelix-evidence-core/vectors/epi_001_identity_v1.json')
          fixture = json.loads(fixture_path.read_text())
          assert fixture['profile'] == 'mycelix:epistemic-identity:v1'
          assert fixture['framing'] == 'u16be-name-len || name || u32be-value-len || value'

          ceiling = fixture['authority_ceiling']
          assert ceiling == {
              'identity_only': True,
              'truth_established': False,
              'source_authenticity_established': False,
              'evidence_validity_established': False,
              'independence_established': False,
              'application_authority_granted': False,
          }

          def field(name: bytes, value: bytes) -> bytes:
              return struct.pack('>H', len(name)) + name + struct.pack('>I', len(value)) + value

          def canonical_bytes(role: str, namespace: str, local_id: str) -> bytes:
              return b''.join([
                  field(b'profile', fixture['profile'].encode()),
                  field(b'role', role.encode()),
                  field(b'namespace', namespace.encode()),
                  field(b'local-id', local_id.encode()),
              ])

          seen = set()
          for vector in fixture['vectors']:
              key = (vector['role'], vector['namespace'], vector['local_id'])
              assert key not in seen
              seen.add(key)
              encoded = canonical_bytes(*key)
              assert encoded.hex() == vector['canonical_hex'], key
              assert hashlib.sha256(encoded).hexdigest() == vector['sha256'], key

          by_role = {v['role']: v for v in fixture['vectors']}
          assert set(by_role) == {'artifact', 'claim'}
          assert by_role['artifact']['sha256'] != by_role['claim']['sha256']
          PY

      - name: Freeze pre-bootstrap source identity
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > /tmp/epi001-head-before
          git status --porcelain=v1
          test -z "$(git status --porcelain=v1)"

      - name: Bootstrap Cargo lock delta
        shell: bash
        run: |
          set -euo pipefail
          cd mycelix-workspace
          cp Cargo.lock /tmp/Cargo.lock.before
          cargo +1.96.0 check -p mycelix-evidence-core
          git diff -- Cargo.lock > /tmp/epi-001-Cargo.lock.patch
          cp Cargo.lock /tmp/Cargo.lock.after
          test -s /tmp/epi-001-Cargo.lock.patch || {
            echo 'No Cargo.lock delta was required.'
            : > /tmp/epi-001-Cargo.lock.patch
          }

      - name: Require lock-only bootstrap mutation
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain=v1 | awk '{print $2}' | grep -v '^mycelix-workspace/Cargo.lock$' || true)"
          test -z "$changed" || {
            echo 'cargo changed source-controlled files other than Cargo.lock:'
            printf '%s\n' "$changed"
            exit 1
          }

      - name: Formatting
        run: cargo +1.96.0 fmt --manifest-path mycelix-workspace/crates/mycelix-evidence-core/Cargo.toml -- --check

      - name: Host tests
        run: cargo +1.96.0 test --manifest-path mycelix-workspace/crates/mycelix-evidence-core/Cargo.toml --all-targets

      - name: WASM check
        run: cargo +1.96.0 check --manifest-path mycelix-workspace/crates/mycelix-evidence-core/Cargo.toml --target wasm32-unknown-unknown

      - name: Strict Clippy
        run: cargo +1.96.0 clippy --manifest-path mycelix-workspace/crates/mycelix-evidence-core/Cargo.toml --all-targets -- -D warnings

      - name: Authority ceiling ratchet
        shell: bash
        run: |
          set -euo pipefail
          file=mycelix-workspace/crates/mycelix-evidence-core/src/lib.rs
          grep -F 'EvidenceAuthorityScopeV1::IdentityOnly' "$file"
          grep -F 'pub const fn establishes_truth' "$file"
          grep -F 'pub const fn establishes_independence' "$file"
          grep -F 'pub const fn grants_application_authority' "$file"
          ! grep -Eq 'TruthScore|truth_score|is_true|VerifiedClaim|ProductionAdmitted' "$file"

      - name: Restore bootstrap lock and prove source immutability
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/Cargo.lock.before mycelix-workspace/Cargo.lock
          test "$(git rev-parse HEAD)" = "$(cat /tmp/epi001-head-before)"
          test -z "$(git status --porcelain=v1)"

      - name: Upload generated lock evidence
        uses: actions/upload-artifact@v4
        with:
          name: epi-001-bootstrap-lock-${{ github.sha }}
          path: |
            /tmp/Cargo.lock.before
            /tmp/Cargo.lock.after
            /tmp/epi-001-Cargo.lock.patch
