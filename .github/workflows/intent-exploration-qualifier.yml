name: Intent Exploration Qualifier

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/research/experience/intent-exploration-*"
      - "tools/intent-exploration-qualifier/**"
      - ".github/workflows/intent-exploration-qualifier.yml"
  push:
    branches: [main]
    paths:
      - "docs/research/experience/intent-exploration-*"
      - "tools/intent-exploration-qualifier/**"
      - ".github/workflows/intent-exploration-qualifier.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run structural qualifier unit tests
        run: cargo test --manifest-path tools/intent-exploration-qualifier/Cargo.toml
      - name: Validate draft manifests
        run: |
          cargo run --manifest-path tools/intent-exploration-qualifier/Cargo.toml -- \
            docs/research/experience/intent-exploration-benchmark-v0.1.json \
            docs/research/experience/intent-exploration-qualification-gates-v0.1.json \\
            docs/research/experience/intent-exploration-trajectory-benchmark-v0.1.json
