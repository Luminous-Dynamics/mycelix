name: Terra Preta correlated metrology BOED reference

on:
  pull_request:
    branches: [main, research/terra-action-conditioned-boed-v0.1]
    paths:
      - 'research/terra-preta/tools/hydraulic-mechanism-discrimination-reference/**'
      - '.github/workflows/terra-preta-correlated-metrology-boed.yml'
  push:
    branches: ['research/terra-correlated-metrology-v0.1']
    paths:
      - 'research/terra-preta/tools/hydraulic-mechanism-discrimination-reference/**'
      - '.github/workflows/terra-preta-correlated-metrology-boed.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terra-correlated-metrology-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  correlated-metrology-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - name: Verify formatting
        run: cargo fmt --manifest-path research/terra-preta/tools/hydraulic-mechanism-discrimination-reference/Cargo.toml -- --check
      - name: Unit and falsification tests
        run: cargo test --manifest-path research/terra-preta/tools/hydraulic-mechanism-discrimination-reference/Cargo.toml --bin terra-correlated-metrology-boed
      - name: Strict Clippy
        run: cargo clippy --manifest-path research/terra-preta/tools/hydraulic-mechanism-discrimination-reference/Cargo.toml --all-targets -- -D warnings
      - name: Run correlated-metrology design comparison
        run: |
          cargo run --quiet --release --manifest-path research/terra-preta/tools/hydraulic-mechanism-discrimination-reference/Cargo.toml --bin terra-correlated-metrology-boed -- \
            research/terra-preta/tools/hydraulic-mechanism-discrimination-reference/fixtures/correlated-metrology.json \
            "$RUNNER_TEMP/terra-correlated-metrology.json"
      - name: Validate joint-covariance and negative-control receipts
        run: |
          jq -e '
            .fixture_status == "synthetic_only_not_empirical_evidence" and
            .mechanism_count == 4 and
            .channel_count == 4 and
            (.input_sha256 | length == 64) and
            (.maximum_absolute_off_diagonal_correlation > 0.5) and
            (.minimum_cholesky_diagonal > 0) and
            (.duplicate_support_pair_rejected == true) and
            (.selected_joint_covariance_pair.expected_posterior_entropy_nats >= 0) and
            (.selected_independent_negative_control_pair.expected_posterior_entropy_nats >= 0) and
            (.independent_selected_pair_evaluated_with_joint_likelihood.expected_posterior_entropy_nats >= 0) and
            (.selected_joint_covariance_pair.first_channel_id != .selected_joint_covariance_pair.second_channel_id) and
            (.selected_joint_covariance_pair.expected_model_information_gain_nats >= 0)
          ' "$RUNNER_TEMP/terra-correlated-metrology.json"
          jq -r '"joint_pair=\(.selected_joint_covariance_pair.first_channel_id)+\(.selected_joint_covariance_pair.second_channel_id) joint_entropy=\(.selected_joint_covariance_pair.expected_posterior_entropy_nats) independent_pick=\(.selected_independent_negative_control_pair.first_channel_id)+\(.selected_independent_negative_control_pair.second_channel_id) independent_pick_true_entropy=\(.independent_selected_pair_evaluated_with_joint_likelihood.expected_posterior_entropy_nats) misspecified_predicted_entropy=\(.selected_independent_negative_control_pair.expected_posterior_entropy_nats) design_penalty=\(.independent_model_selection_penalty_nats) max_abs_correlation=\(.maximum_absolute_off_diagonal_correlation) min_cholesky_diag=\(.minimum_cholesky_diagonal) duplicate_support_rejected=\(.duplicate_support_pair_rejected)"' "$RUNNER_TEMP/terra-correlated-metrology.json"
          sha256sum "$RUNNER_TEMP/terra-correlated-metrology.json"
      - name: Reject output overwrite
        run: |
          if cargo run --quiet --manifest-path research/terra-preta/tools/hydraulic-mechanism-discrimination-reference/Cargo.toml --bin terra-correlated-metrology-boed -- \
            research/terra-preta/tools/hydraulic-mechanism-discrimination-reference/fixtures/correlated-metrology.json \
            "$RUNNER_TEMP/terra-correlated-metrology.json"; then
            echo "expected no-overwrite failure"
            exit 1
          fi
