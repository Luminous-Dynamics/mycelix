name: Temporary Pulse 219 Lock Materialization

on:
  push:
    branches:
      - tmp/pulse-219-lock-materialize

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      ARTIFACT_ID: '10075592501'
      ARTIFACT_ZIP_SHA256: '9316da1ff2ccbc3fe2209fa9acb56a306e1672e42eece3d8639ca141efafcf13'
      LOCK_SHA256: '73f4b3654724c25736db619d41af0c2cb138a46d19c7553983d47885940c9c45'
      ARTIFACT_SOURCE_HEAD: '96e59ec4786b2a573d18cd9cbcefa432f618bf61'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Bind exact materialization branch
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'tmp/pulse-219-lock-materialize'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Download and verify sealed lock artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/pulse-backend-lock.zip"
          evidence="$RUNNER_TEMP/pulse-backend-lock"
          curl --fail-with-body --location \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$zip" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"
          printf '%s  %s\n' "$ARTIFACT_ZIP_SHA256" "$zip" | sha256sum --check -
          mkdir -p "$evidence"
          python3 - "$zip" "$evidence" <<'PY'
          import sys, zipfile
          archive, destination = sys.argv[1:]
          with zipfile.ZipFile(archive) as zf:
              names = set(zf.namelist())
              expected = {
                  'Cargo.lock',
                  'Cargo.lock.sha256',
                  'cargo-metadata.json',
                  'evidence.sha256',
                  'source-head.txt',
              }
              if names != expected:
                  raise SystemExit(f'unexpected artifact members: {sorted(names)}')
              zf.extractall(destination)
          PY
          (
            cd "$evidence"
            sha256sum --check evidence.sha256
            test "$(cat source-head.txt)" = "$ARTIFACT_SOURCE_HEAD"
            test "$(sha256sum Cargo.lock | cut -d' ' -f1)" = "$LOCK_SHA256"
          )
      - name: Materialize exact backend lock bytes
        run: |
          set -euo pipefail
          dest='mycelix-workspace/mycelix-pulse/happ/backend-rs/Cargo.lock'
          test ! -e "$dest"
          install -m 0644 "$RUNNER_TEMP/pulse-backend-lock/Cargo.lock" "$dest"
          test "$(sha256sum "$dest" | cut -d' ' -f1)" = "$LOCK_SHA256"
          git diff --check
          test -z "$(git diff --name-only)"
          test "$(git ls-files --others --exclude-standard)" = "$dest"
      - name: Commit self-cleaned lock materialization
        run: |
          set -euo pipefail
          workflow='.github/workflows/tmp-pulse-219-lock-materialize.yml'
          lock='mycelix-workspace/mycelix-pulse/happ/backend-rs/Cargo.lock'
          git rm "$workflow"
          git add "$lock"
          git diff --cached --check
          git config user.name 'Luminous Dynamics Qualification Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'build(pulse): materialize sealed backend lock'
          git push origin HEAD:tmp/pulse-219-lock-materialize
