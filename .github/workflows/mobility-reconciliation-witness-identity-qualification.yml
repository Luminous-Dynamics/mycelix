name: mobility-reconciliation-witness-identity-qualification

on:
  push:
    paths:
      - "mycelix-commons/crates/mobility-configuration-qualification/**"
      - "tools/mobility_reconciliation_witness_identity_reference.py"
      - "docs/mobility/MOBILITY_RECONCILIATION_WITNESS_IDENTITY_V1.*"
      - ".github/workflows/mobility-reconciliation-witness-identity-qualification.yml"
  pull_request:
    paths:
      - "mycelix-commons/crates/mobility-configuration-qualification/**"
      - "tools/mobility_reconciliation_witness_identity_reference.py"
      - "docs/mobility/MOBILITY_RECONCILIATION_WITNESS_IDENTITY_V1.*"
      - ".github/workflows/mobility-reconciliation-witness-identity-qualification.yml"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check --manifest-path mycelix-commons/crates/mobility-configuration-qualification/Cargo.toml
      - run: cargo test --manifest-path mycelix-commons/crates/mobility-configuration-qualification/Cargo.toml

  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 tools/mobility_reconciliation_witness_identity_reference.py
