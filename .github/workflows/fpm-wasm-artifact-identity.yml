name: FPM Wasm artifact identity

on:
  pull_request:
    paths:
      - "crates/fpm-wasm-artifact-identity/**"
      - ".github/workflows/fpm-wasm-artifact-identity.yml"
  push:
    branches:
      - main
      - hardening/**
      - research/**
    paths:
      - "crates/fpm-wasm-artifact-identity/**"
      - ".github/workflows/fpm-wasm-artifact-identity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    name: SHA-256 and Holochain 0.7 WasmHash crosswalk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates/fpm-wasm-artifact-identity
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.96.1

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Cargo test
        run: cargo test --locked

      - name: Pin substrate versions
        run: |
          grep -Fx 'holo_hash = { version = "=0.7.0", features = ["serialization"] }' Cargo.toml
          grep -Fx 'holochain_serialized_bytes = "=0.0.57"' Cargo.toml
