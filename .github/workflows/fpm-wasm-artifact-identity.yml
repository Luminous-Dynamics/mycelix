name: FPM WASM artifact identity

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# Keep only the newest candidate beacon for each PR; stale dispatch requests are not evidence.
concurrency:
  group: fpm-wasm-artifact-identity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# This workflow is only an untrusted execution-request beacon.
# It deliberately does not execute candidate code. The trusted qualification
# workflow re-checks out the exact candidate and runs it inside the sandbox.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Emit execution-request beacon
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          echo "FPM candidate execution request accepted for exact head $EXPECTED_SHA"
