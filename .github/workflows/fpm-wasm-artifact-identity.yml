name: FPM WASM artifact identity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# This is a qualification workflow, not a supersedable generic CI signal.
# Every candidate head gets its own run so cancellation cannot erase the
# evidence for an exact commit.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates/fpm-wasm-artifact-identity
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact candidate checkout
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "EXACT_HEAD=$actual"

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.96.1
          components: rustfmt

      - name: Verify dependency policy before Cargo execution
        env:
          EXPECTED_MANIFEST_BLOB_SHA: c94b53f61ed8a9bfb6249b1b339550dddd074d6c
        run: |
          set -eu
          test ! -e .cargo/config.toml
          test ! -e .cargo/config
          actual_manifest_sha="$(git hash-object crates/fpm-wasm-artifact-identity/Cargo.toml)"
          test "$actual_manifest_sha" = "$EXPECTED_MANIFEST_BLOB_SHA"
          grep -Fx 'holo_hash = { version = "=0.7.0", default-features = false, features = ["hashing"] }' crates/fpm-wasm-artifact-identity/Cargo.toml
          grep -Fx 'holochain_types = "=0.7.0"' crates/fpm-wasm-artifact-identity/Cargo.toml

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Cargo test
        run: cargo test
