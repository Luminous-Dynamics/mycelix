name: FPM WASM artifact identity

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# This workflow is only an untrusted execution-request beacon.
# It deliberately does not execute candidate code. The trusted qualification
# workflow re-checks out the exact candidate and runs it inside the sandbox.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact candidate checkout
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "EXACT_HEAD=$actual"

      - name: Emit execution-request beacon
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          echo "FPM candidate execution request accepted for exact head $EXPECTED_SHA"
