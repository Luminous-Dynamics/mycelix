name: Pulse Social Semantic Types

on:
  pull_request:
    paths:
      - "mycelix-workspace/mycelix-pulse/crates/pulse-social-types/**"
      - ".github/workflows/pulse-social-types.yml"
  push:
    branches: [main]
    paths:
      - "mycelix-workspace/mycelix-pulse/crates/pulse-social-types/**"
      - ".github/workflows/pulse-social-types.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  social-types:
    name: Semantic social contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-workspace

      - name: Format
        run: cargo fmt --manifest-path mycelix-workspace/mycelix-pulse/crates/pulse-social-types/Cargo.toml -- --check

      - name: Test
        run: rm -rf /tmp/pulse-social-types && mkdir -p /tmp/pulse-social-types
cp mycelix-workspace/mycelix-pulse/crates/pulse-social-types/Cargo.toml /tmp/pulse-social-types/
cp -R mycelix-workspace/mycelix-pulse/crates/pulse-social-types/src /tmp/pulse-social-types/
cargo test --manifest-path /tmp/pulse-social-types/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path /tmp/pulse-social-types/Cargo.toml --all-targets -- -D warnings
