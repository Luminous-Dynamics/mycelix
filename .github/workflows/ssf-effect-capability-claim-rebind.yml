name: SSF Effect Capability Claim Rebind

on:
  pull_request:
    paths:
      - 'mycelix-workspace/crates/mycelix-ssf-durable-effect-capability-claim/**'
      - 'mycelix-workspace/crates/mycelix-ssf-historical-effect-capability-claim/**'
      - 'mycelix-workspace/crates/mycelix-ssf-transient-effect-capability/**'
      - 'mycelix-workspace/crates/mycelix-ssf-effect-capability-claim-rebind/**'
      - '.github/workflows/ssf-effect-capability-claim-rebind.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-workspace/crates/mycelix-ssf-effect-capability-claim-rebind/**'
      - '.github/workflows/ssf-effect-capability-claim-rebind.yml'

permissions:
  contents: read

jobs:
  claim-rebind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Format
        run: cargo fmt --manifest-path mycelix-workspace/crates/mycelix-ssf-effect-capability-claim-rebind/Cargo.toml -- --check
      - name: Native check
        run: cargo check --manifest-path mycelix-workspace/crates/mycelix-ssf-effect-capability-claim-rebind/Cargo.toml --all-targets
      - name: no_std WASM check
        run: cargo check --manifest-path mycelix-workspace/crates/mycelix-ssf-effect-capability-claim-rebind/Cargo.toml --lib --target wasm32-unknown-unknown
      - name: Tests
        run: cargo test --manifest-path mycelix-workspace/crates/mycelix-ssf-effect-capability-claim-rebind/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --manifest-path mycelix-workspace/crates/mycelix-ssf-effect-capability-claim-rebind/Cargo.toml --all-targets -- -D warnings
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --manifest-path mycelix-workspace/crates/mycelix-ssf-effect-capability-claim-rebind/Cargo.toml --no-deps
