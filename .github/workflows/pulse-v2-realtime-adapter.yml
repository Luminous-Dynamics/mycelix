name: Pulse V2 Realtime Adapter

on:
  pull_request:
    paths:
      - 'mycelix-workspace/mycelix-pulse/crates/pulse-realtime-types/**'
      - 'mycelix-workspace/mycelix-pulse/apps/leptos/Cargo.toml'
      - 'mycelix-workspace/mycelix-pulse/apps/leptos/src/holochain.rs'
      - 'mycelix-workspace/mycelix-pulse/holochain/zomes/messages/coordinator/**'
      - '.github/workflows/pulse-v2-realtime-adapter.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-workspace/mycelix-pulse/crates/pulse-realtime-types/**'
      - 'mycelix-workspace/mycelix-pulse/apps/leptos/Cargo.toml'
      - 'mycelix-workspace/mycelix-pulse/apps/leptos/src/holochain.rs'
      - 'mycelix-workspace/mycelix-pulse/holochain/zomes/messages/coordinator/**'
      - '.github/workflows/pulse-v2-realtime-adapter.yml'

permissions:
  contents: read

concurrency:
  group: pulse-v2-realtime-adapter-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CONTRACT_MANIFEST: mycelix-workspace/mycelix-pulse/crates/pulse-realtime-types/Cargo.toml
  UI_MANIFEST: mycelix-workspace/mycelix-pulse/apps/leptos/Cargo.toml
  HOLOCHAIN_RS: mycelix-workspace/mycelix-pulse/apps/leptos/src/holochain.rs

jobs:
  adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact subject checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected" || {
            echo "::error::Expected exact subject $expected, got $actual"
            exit 1
          }
          test -f "$CONTRACT_MANIFEST"
          test -f "$UI_MANIFEST"
          test -f "$HOLOCHAIN_RS"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87b
        with:
          toolchain: 1.96.0
          components: rustfmt,clippy
          targets: wasm32-unknown-unknown

      - name: Resolve exact manifests
        run: |
          cargo metadata --manifest-path "$CONTRACT_MANIFEST" --no-deps --format-version 1 >/dev/null
          cargo metadata --manifest-path "$UI_MANIFEST" --no-deps --format-version 1 >/dev/null

      - name: Check changed adapter formatting
        run: |
          rustfmt --edition 2024 --check "$HOLOCHAIN_RS"
          cargo fmt --manifest-path "$CONTRACT_MANIFEST" -- --check

      - name: Check bounded contract natively
        run: cargo check --manifest-path "$CONTRACT_MANIFEST"

      - name: Check bounded contract for wasm32
        run: cargo check --manifest-path "$CONTRACT_MANIFEST" --target wasm32-unknown-unknown

      - name: Run bounded contract tests
        run: cargo test --manifest-path "$CONTRACT_MANIFEST" --lib

      - name: Clippy bounded contract
        run: cargo clippy --manifest-path "$CONTRACT_MANIFEST" --lib -- -D warnings

      - name: Check Pulse UI adapter for wasm32
        run: cargo check --manifest-path "$UI_MANIFEST" --target wasm32-unknown-unknown

      - name: Prove persistent signal dispatcher shape
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'self.signal_handlers.borrow_mut().push(Rc::new(handler));' "$HOLOCHAIN_RS"
          test "$(grep -c 'ws_transport.set_signal_handler' "$HOLOCHAIN_RS")" -eq 1
          dispatcher_line="$(grep -n 'ws_transport.set_signal_handler' "$HOLOCHAIN_RS" | cut -d: -f1)"
          connected_line="$(grep -n 'set_status.set(ConnectionStatus::Connected)' "$HOLOCHAIN_RS" | tail -1 | cut -d: -f1)"
          test "$dispatcher_line" -lt "$connected_line" || {
            echo '::error::Signal dispatcher must be installed before Connected is published'
            exit 1
          }

      - name: Prove checkout immutability
        run: git diff --exit-code && test -z "$(git status --porcelain)"
