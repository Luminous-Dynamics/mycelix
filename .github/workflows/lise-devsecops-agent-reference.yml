name: LISE DevSecOps Agent Reference

on:
  pull_request:
    branches:
      - main
    paths:
      - "lise-benchmarks/devsecops-agent-reference/**"
      - ".github/workflows/lise-devsecops-agent-reference.yml"

permissions:
  contents: read

jobs:
  devsecops-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      EXPECTED_SUBJECT_SHA: ${{ github.event.pull_request.head.sha }}
      MANIFEST: lise-benchmarks/devsecops-agent-reference/Cargo.toml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact PR subject
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SUBJECT_SHA"
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - name: Validate benchmark JSON
        run: jq empty lise-benchmarks/devsecops-agent-reference/fixtures/*.json
      - name: Check formatting
        run: cargo fmt --manifest-path "$MANIFEST" --check
      - name: Check all targets
        run: cargo check --all-targets --manifest-path "$MANIFEST"
      - name: Run DevSecOps reference tests
        run: cargo test --all-targets --manifest-path "$MANIFEST"
      - name: Strict Clippy
        run: cargo clippy --all-targets --manifest-path "$MANIFEST" -- -D warnings
      - name: Replay frozen scenarios
        run: |
          cargo run --manifest-path "$MANIFEST" --             lise-benchmarks/devsecops-agent-reference/fixtures/cases.json             lise-benchmarks/devsecops-agent-reference/fixtures/oracle.json             /tmp/devsecops-reference-report.json
          jq -e '.conformant == true and .case_count == 15 and .dispatch_eligible == false' /tmp/devsecops-reference-report.json
      - name: Reassert exact subject and tracked source
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SUBJECT_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
