name: Governance Execution Preflight

on:
  pull_request:
    paths:
      - "crates/mycelix-governance-execution-preflight/**"
      - "crates/mycelix-governance-authority/**"
      - "crates/mycelix-governance-constitution/**"
      - "crates/mycelix-institutional-core/**"
      - ".github/workflows/governance-execution-preflight.yml"
  push:
    paths:
      - "crates/mycelix-governance-execution-preflight/**"
      - "crates/mycelix-governance-authority/**"
      - "crates/mycelix-governance-constitution/**"
      - "crates/mycelix-institutional-core/**"
      - ".github/workflows/governance-execution-preflight.yml"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path crates/mycelix-governance-execution-preflight/Cargo.toml -- --check
      - name: Test
        run: cargo test --manifest-path crates/mycelix-governance-execution-preflight/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-governance-execution-preflight/Cargo.toml --all-targets -- -D warnings
