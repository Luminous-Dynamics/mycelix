name: SUP-CIV-000D3B Protected Read Admission Oracle

on:
  pull_request:
    paths:
      - 'mycelix-workspace/docs/civic-resilience/SUP_CIV_000D3B_PROTECTED_READ_ORACLE_V1.md'
      - 'mycelix-workspace/docs/civic-resilience/sup_civ_000d3b_admission_cases.json'
      - 'mycelix-workspace/scripts/sup_civ_protected_read_admission_oracle_v1.py'
      - '.github/workflows/sup-civ-000d3b-admission-oracle.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact stacked subject
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='4ebb8389c1f3a11492ec417a0f1f49ec7a6f8d75'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-list --count "$EXPECTED_PARENT"..HEAD)" = '1'
          mapfile -t changed < <(git diff --name-only "$EXPECTED_PARENT" HEAD | sort)
          expected=(
            '.github/workflows/sup-civ-000d3b-admission-oracle.yml'
            'mycelix-workspace/docs/civic-resilience/SUP_CIV_000D3B_PROTECTED_READ_ORACLE_V1.md'
            'mycelix-workspace/docs/civic-resilience/sup_civ_000d3b_admission_cases.json'
            'mycelix-workspace/scripts/sup_civ_protected_read_admission_oracle_v1.py'
          )
          test "${#changed[@]}" = "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}"
          done

      - name: Prove exact manifest blob
        run: test "$(git hash-object mycelix-workspace/docs/civic-resilience/sup_civ_000d3b_admission_cases.json)" = '81579a1cfa6bd843c7430733492524df186f86db'

      - name: Syntax-check stdlib oracle
        run: python3 -m py_compile mycelix-workspace/scripts/sup_civ_protected_read_admission_oracle_v1.py

      - name: Prove stdlib-only imports
        shell: bash
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          path = Path('mycelix-workspace/scripts/sup_civ_protected_read_admission_oracle_v1.py')
          tree = ast.parse(path.read_text())
          allowed = {'__future__','argparse','json','pathlib','typing'}
          imports = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name.split('.')[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imports.add(node.module.split('.')[0])
          unexpected = imports - allowed
          assert not unexpected, unexpected
          print('stdlib-only:', sorted(imports))
          PY

      - name: Execute closed admission corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 mycelix-workspace/scripts/sup_civ_protected_read_admission_oracle_v1.py \
            --manifest mycelix-workspace/docs/civic-resilience/sup_civ_000d3b_admission_cases.json \
            --receipt /tmp/sup-civ-000d3b-receipt.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('mycelix-workspace/docs/civic-resilience/sup_civ_000d3b_admission_cases.json').read_text())
          r = json.loads(Path('/tmp/sup-civ-000d3b-receipt.json').read_text())
          assert m['schema'] == 'sup-civ-000d3b-admission-oracle-v1'
          assert m['authority'] == 'synthetic-composition-reference-only'
          assert m['parent_contract'] == 'SUP-CIV-000D3A'
          assert m['parent_exact_head'] == '4ebb8389c1f3a11492ec417a0f1f49ec7a6f8d75'
          assert len(m['cases']) == 36
          assert len({c['id'] for c in m['cases']}) == 36
          assert r['schema'] == 'sup-civ-000d3b-admission-oracle-receipt-v1'
          assert r['case_count'] == 36
          assert r['admit_count'] == 4
          assert r['non_admit_count'] == 32
          by_id = {x['id']: x['disposition'] for x in r['results']}
          assert by_id['receipt-allowed-does-not-authorize'] == 'AuthorizationUnproven'
          assert by_id['offline-unproven-cache-present'] == 'OfflineLeaseExpiredOrUnproven'
          assert by_id['emergency-need-without-authority'] == 'BreakGlassAuthorityUnproven'
          assert by_id['public-destination-requires-release'] == 'ReleaseProjectionRequired'
          assert by_id['storage-unavailable-no-public-fallback'] == 'StorageUnavailable'
          assert set(m['required_non_equivalences']) == {
              'ReferenceModelAdmit != RuntimeAuthorization',
              'ReferenceModelAdmit != DependencyQualification',
              'ReferenceModelAdmit != ProtectedDataReleased',
              'ReceiptOutcomeAllowed != AuthorizationSource',
              'OfflineCachePresent != OfflineLeaseValid',
              'EmergencyNeed != BreakGlassAuthority',
              'ProtectedReadAdmitted != PublicReleaseAdmitted',
              'FailureReasonPrecedence != ProofLaterChecksPassed',
          }
          print('PASS_SUP_CIV_000D3B_CLOSED_CORPUS')
          PY

      - name: Refuse runtime/build changes
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='4ebb8389c1f3a11492ec417a0f1f49ec7a6f8d75'
          if git diff --name-only "$EXPECTED_PARENT" HEAD | grep -E '\.(rs|toml|lock|nix)$'; then
            echo 'runtime/build file entered D3B reference-model tranche' >&2
            exit 1
          fi

      - name: Prove checkout remained immutable
        shell: bash
        run: |
          rm -rf mycelix-workspace/scripts/__pycache__
          test -z "$(git status --porcelain)"
