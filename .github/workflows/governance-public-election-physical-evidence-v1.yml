name: Governance Public Election Physical Evidence v1

on:
  pull_request:
    paths:
      - '.github/workflows/governance-public-election-physical-evidence-v1.yml'
      - 'mycelix-governance/crates/election-physical-evidence/**'
      - 'mycelix-governance/docs/PUBLIC_ELECTION_PHYSICAL_EVIDENCE_V1.md'

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: '1.96.0'
  BASE_SHA: '92766c036f508bf2d3c892c7b671daea059c839b'

jobs:
  qualify:
    name: Qualify physical election evidence contract
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/governance-public-election-physical-evidence-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Bind exact ELECT-012 delta
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          test "${#changed[@]}" -eq 4
          printf '%s\n' "${changed[@]}" | sort > /tmp/elect-012-files.txt
          cat > /tmp/elect-012-expected.txt <<'EOF'
          .github/workflows/governance-public-election-physical-evidence-v1.yml
          mycelix-governance/crates/election-physical-evidence/Cargo.toml
          mycelix-governance/crates/election-physical-evidence/src/lib.rs
          mycelix-governance/docs/PUBLIC_ELECTION_PHYSICAL_EVIDENCE_V1.md
          EOF
          sort -o /tmp/elect-012-expected.txt /tmp/elect-012-expected.txt
          diff -u /tmp/elect-012-expected.txt /tmp/elect-012-files.txt
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt,clippy

      - name: Format production library surface
        shell: bash
        run: |
          set -euo pipefail
          src='mycelix-governance/crates/election-physical-evidence/src/lib.rs'
          awk '/^#\[cfg\(test\)\]/{exit} {print}' "$src" > /tmp/elect-012-prod.rs
          perl -0pi -e 's/\n+\z/\n/' /tmp/elect-012-prod.rs
          rustfmt --edition 2024 --check /tmp/elect-012-prod.rs

      - name: Generate and archive exact dependency lock
        shell: bash
        run: |
          set -euo pipefail
          cd mycelix-governance/crates/election-physical-evidence
          cargo generate-lockfile
          cp Cargo.lock /tmp/elect-012-Cargo.lock
          sha256sum Cargo.lock | tee /tmp/elect-012-lock.sha256
          cargo metadata --locked --format-version 1 > /tmp/elect-012-metadata.json

      - name: Run physical evidence theorem tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path mycelix-governance/crates/election-physical-evidence/Cargo.toml --locked 2>&1 | tee /tmp/elect-012-test.log

      - name: Run warning-fatal library Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path mycelix-governance/crates/election-physical-evidence/Cargo.toml --locked --lib -- -D warnings 2>&1 | tee /tmp/elect-012-clippy.log

      - name: Audit physical evidence boundaries
        shell: bash
        run: |
          set -euo pipefail
          src='mycelix-governance/crates/election-physical-evidence/src/lib.rs'
          grep -F 'ConservationFailure' "$src"
          grep -F 'SequenceNotContiguous' "$src"
          grep -F 'ContainerStateDiscontinuity' "$src"
          grep -F 'SiblingFork' "$src"
          grep -F 'FreezePendingEvidenceResolution' "$src"
          grep -F 'CaptureReconciliationDisposition::Discrepant' "$src"
          grep -F 'RiskLimitingAuditMissingRiskLimit' "$src"
          grep -F 'GovernedAdjudicationRequired' "$src"
          grep -F 'anonymized_physical_unit_digest' "$src"
          if grep -Eq 'voter_did|voter_id|elector_id|first_wins|last_wins|arrival_time|dht_order' "$src"; then
            echo 'ELECT-012 must not introduce voter linkage or arrival-order physical authority' >&2
            exit 1
          fi
          if grep -Eq '^use (hdk|hdi|voting_integrity)' "$src"; then
            echo 'ELECT-012 must remain runtime independent' >&2
            exit 1
          fi

      - name: Remove transient lock and prove immutable checkout
        if: always()
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          rm -f mycelix-governance/crates/election-physical-evidence/Cargo.lock
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git status --porcelain=v1 --untracked-files=all > /tmp/elect-012-status.txt
          test ! -s /tmp/elect-012-status.txt

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: elect-012-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: |
            /tmp/elect-012-Cargo.lock
            /tmp/elect-012-lock.sha256
            /tmp/elect-012-metadata.json
            /tmp/elect-012-test.log
            /tmp/elect-012-clippy.log
            /tmp/elect-012-status.txt
          if-no-files-found: warn
          retention-days: 30
