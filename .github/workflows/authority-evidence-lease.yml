name: Authority Evidence Lease

on:
  pull_request:
    paths:
      - 'crates/mycelix-authority-evidence-lease/**'
      - '.github/workflows/authority-evidence-lease.yml'
  push:
    branches:
      - 'security/authority-evidence-lease-v0.1'
      - 'security/authority-evidence-lease-provenance-v0.1'

permissions:
  contents: read

concurrency:
  group: authority-evidence-lease-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: Monotone lease algebra and canonical provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --manifest-path crates/mycelix-authority-evidence-lease/Cargo.toml -- --check

      - name: Tests
        run: cargo test --manifest-path crates/mycelix-authority-evidence-lease/Cargo.toml --all-targets

      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-authority-evidence-lease/Cargo.toml --all-targets -- -D warnings

      - name: Lease and provenance authority audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('crates/mycelix-authority-evidence-lease/src/lib.rs').read_text()
          inv = Path('crates/mycelix-authority-evidence-lease/INVARIANTS.md').read_text().lower()

          required = [
              'pub struct EvidenceLease {',
              'pub struct LeasedEvidence<T> {',
              'pub enum EvidenceLeaseRole {',
              'pub struct EvidenceLeaseContribution {',
              'pub struct QualifiedEvidenceLeaseManifest {',
              'pub fn qualify_evidence_lease_manifest(',
              'self.verified_at_ms.max(other.verified_at_ms)',
              'self.valid_until_ms.min(other.valid_until_ms)',
              'self.valid_until_ms.min(cap_valid_until_ms)',
              'contribution.validate_at(now_ms)?',
              'EvidenceLease::intersect_all(',
              'identities.sort_unstable()',
              'DuplicateContribution',
              'MAX_CONTRIBUTIONS',
              'manifest_digest: *hasher.finalize().as_bytes()',
          ]
          for token in required:
              assert token in src, token

          manifest = src.split('pub fn qualify_evidence_lease_manifest(', 1)[1].split('fn require_ref(', 1)[0]
          validate = manifest.index('contribution.validate_at(now_ms)?')
          identity = manifest.index('let identity = contribution.identity_digest()?')
          sort = manifest.index('identities.sort_unstable()')
          intersect = manifest.index('let aggregate_lease = EvidenceLease::intersect_all(')
          digest = manifest.index('let mut hasher = blake3::Hasher::new()')
          assert validate < identity < sort < intersect < digest

          role_block = src.split('pub enum EvidenceLeaseRole {', 1)[1].split('}', 1)[0]
          for role in [
              'BootstrapRoot',
              'OperationalCoveragePolicy',
              'OperationalContextPolicy',
              'SourceHead',
              'WitnessObservation',
              'WitnessTrustBinding',
              'AuthorityStateTransition',
              'ControlPlaneFreshness',
              'OperationalFreshness',
          ]:
              assert role in role_block, role

          for forbidden in [
              'hdk::',
              '#[hdk_extern]',
              'get_links(',
              'get_details(',
              'create_entry(',
              'call_remote(',
              'execute_actions',
              'reputation',
              'model_score',
              'phi',
          ]:
              assert forbidden.lower() not in src.lower(), forbidden

          assert 'lease is not authority identity' in inv
          assert 'intersections are monotone' in inv
          assert 'expiry cannot be revived' in inv
          assert 'transport envelope grants no authority' in inv
          assert 'provenance manifest is audit evidence, not authority' in inv
          assert 'contributor order has no authority meaning' in inv
          assert 'omission is visible to manifest identity' in inv
          assert 'duplicate contributions are forbidden' in inv
          assert 'manifest aggregate is conservative' in inv
          print('PASS: evidence leases narrow reuse and canonically commit exact provenance contributors')
          PY
