name: D6U Trusted Evidence Attestation

on:
  workflow_run:
    workflows: ["D6U Exact-Head Runtime Executor"]
    types: [completed]
    branches:
      - main

jobs:
  trusted-attestation:
    name: D6U trusted evidence attestation
    if: >-
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout trusted policy root
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Assert trusted workflow root
        run: test "$(git rev-parse HEAD)" = "$GITHUB_WORKFLOW_SHA"

      - name: Preflight trusted verifier
        run: python3 -m py_compile scripts/integral/verify_d6u_trusted_artifacts.py

      - name: Preflight exact artifact metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          event_path = os.environ["GITHUB_EVENT_PATH"]
          with open(event_path, encoding="utf-8") as handle:
              event = json.load(handle)
          workflow_run = event["workflow_run"]
          expected_name = (
              f"d6u-runtime-evidence-run-{workflow_run['id']}-attempt-"
              f"{workflow_run['run_attempt']}"
          )
          with open("docs/integral/d6u-trusted-builder-policy.json", encoding="utf-8") as handle:
              policy = json.load(handle)
          maximum = int(policy["artifact_max_total_bytes"])

          query = urllib.parse.urlencode({"name": expected_name})
          url = (
              f"https://api.github.com/repos/{repo}/actions/runs/"
              f"{workflow_run['id']}/artifacts?{query}"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2026-03-10",
                  "User-Agent": "mycelix-d6u-trusted-attestation",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)

          artifacts = payload.get("artifacts", [])
          assert len(artifacts) == 1, (
              f"expected exactly one trusted-input artifact, observed {len(artifacts)}"
          )
          artifact = artifacts[0]
          assert artifact["name"] == expected_name
          assert artifact["expired"] is False
          assert artifact["workflow_run"]["id"] == workflow_run["id"]
          assert artifact["size_in_bytes"] <= maximum, (
              f"artifact archive exceeds trusted maximum: "
              f"{artifact['size_in_bytes']} > {maximum}"
          )
          print(
              f"trusted artifact metadata accepted: id={artifact['id']} "
              f"size={artifact['size_in_bytes']} maximum={maximum}"
          )
          PY

      - name: Download exact D6U run artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: d6u-runtime-evidence-run-${{ github.event.workflow_run.id }}-attempt-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/d6u-trusted-input
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify untrusted D6U evidence as data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/integral/verify_d6u_trusted_artifacts.py "${{ runner.temp }}/d6u-trusted-input"

      - name: Attest trusted D6U evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/d6u-trusted-input/d6u-runtime-evidence.txt
            ${{ runner.temp }}/d6u-trusted-input/d6u-runtime-test.log
            ${{ runner.temp }}/d6u-trusted-input/Cargo.lock

      - name: Verify trusted D6U attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for subject in             "${{ runner.temp }}/d6u-trusted-input/d6u-runtime-evidence.txt"             "${{ runner.temp }}/d6u-trusted-input/d6u-runtime-test.log"             "${{ runner.temp }}/d6u-trusted-input/Cargo.lock"; do
            gh attestation verify "$subject"               --repo "$GITHUB_REPOSITORY"               --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/d6u-trusted-evidence-attestation.yml"               --signer-digest "$GITHUB_WORKFLOW_SHA"               --source-digest "$GITHUB_SHA"               --source-ref "$GITHUB_REF"               --deny-self-hosted-runners
          done
