name: D6U Trusted Evidence Attestation

on:
  workflow_run:
    workflows: ["D6U Exact-Head Runtime Executor"]
    types: [completed]
    branches:
      - main

jobs:
  trusted-attestation:
    name: D6U trusted evidence attestation
    if: >-
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    env:
      GH_CONFIG_DIR: ${{ runner.temp }}/d6u-gh-config
    steps:
      - name: Checkout trusted policy root
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Assert trusted workflow root
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_WORKFLOW_SHA"
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/d6u-trusted-evidence-attestation.yml@refs/heads/main"

      - name: Assert trusted policy root cohesion
        env:
          TRUSTED_POLICY_VERSION: "29"
        run: |
          set -euo pipefail
          policy_version=$(python3 -c 'import json; print(json.load(open("docs/integral/d6u-trusted-builder-policy.json"))["policy_version"])')
          test "$policy_version" = "$TRUSTED_POLICY_VERSION"
          expected_blob=$(python3 -c 'import json; print(json.load(open("docs/integral/d6u-trusted-builder-policy.json"))["trusted_workflow"]["blob_sha"])')
          observed_blob=$(git hash-object .github/workflows/d6u-trusted-evidence-attestation.yml)
          test "$observed_blob" = "$expected_blob"

      - name: Assert trusted program identities
        run: |
          set -euo pipefail
          trusted_programs=(
            scripts/integral/verify_d6u_trusted_artifacts.py
            scripts/integral/fetch_d6u_trusted_artifact.py
            scripts/integral/verify_d6u_trusted_attestation.py
            scripts/integral/emit_d6u_trusted_attestation_predicate.py
            scripts/integral/verify_d6u_trusted_attestation_retention.py
          )
          for path in "${trusted_programs[@]}"; do
            expected=$(python3 -c 'import json, sys; print(json.load(open("docs/integral/d6u-trusted-builder-policy.json"))["trusted_programs"][sys.argv[1]]["blob_sha"])' "$path")
            index_record=$(git ls-files --stage -- "$path")
            test -n "$index_record"
            mode=$(printf '%s
' "$index_record" | awk '{print $1}')
            observed=$(printf '%s
' "$index_record" | awk '{print $2}')
            test "$mode" = "100644" || test "$mode" = "100755"
            test "$observed" = "$expected"
          done

      - name: Preflight trusted verifier
        run: python3 -m py_compile scripts/integral/verify_d6u_trusted_artifacts.py scripts/integral/fetch_d6u_trusted_artifact.py scripts/integral/verify_d6u_trusted_attestation.py scripts/integral/emit_d6u_trusted_attestation_predicate.py scripts/integral/verify_d6u_trusted_attestation_retention.py

      - name: Fetch and safely extract exact D6U artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/integral/fetch_d6u_trusted_artifact.py "${{ runner.temp }}/d6u-trusted-input"

      - name: Verify untrusted D6U evidence as data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/integral/verify_d6u_trusted_artifacts.py "${{ runner.temp }}/d6u-trusted-input"

      - name: Emit canonical D6U evidence predicate
        run: |
          set -euo pipefail
          python3 scripts/integral/emit_d6u_trusted_attestation_predicate.py \
            "${{ runner.temp }}/d6u-trusted-input" \
            "$RUNNER_TEMP/d6u-trusted-evidence-predicate.json"

      - name: Attest trusted D6U evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/d6u-trusted-input/d6u-runtime-evidence.txt
            ${{ runner.temp }}/d6u-trusted-input/d6u-runtime-test.log
            ${{ runner.temp }}/d6u-trusted-input/Cargo.lock
          predicate-type: https://luminousdynamics.io/attestations/d6u-runtime-evidence/v1
          predicate-path: ${{ runner.temp }}/d6u-trusted-evidence-predicate.json

      - name: Assert GitHub CLI verification environment
        run: |
          set -euo pipefail
          rm -rf "$GH_CONFIG_DIR"
          mkdir -p "$GH_CONFIG_DIR"
          test -z "$(find "$GH_CONFIG_DIR" -mindepth 1 -maxdepth 1 -print -quit)"
          gh_path="$(command -v gh)"
          test -n "$gh_path"
          gh_path="$(readlink -f "$gh_path")"
          case "$gh_path" in
            "$GITHUB_WORKSPACE"/*|"$RUNNER_TEMP"/*)
              echo "GitHub CLI resolves under untrusted workspace/temp path: $gh_path"
              exit 1
              ;;
          esac
          test "$(gh version | sed -n '1s/^gh version \([^ ]*\).*/\1/p')" = "2.101.0"
          for variable in GH_HOST GH_ENTERPRISE_TOKEN GH_REPO; do
            if [ -n "${!variable:-}" ]; then
              echo "unexpected ambient GitHub CLI override: $variable"
              exit 1
            fi
          done

      - name: Verify trusted D6U attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for subject in             "${{ runner.temp }}/d6u-trusted-input/d6u-runtime-evidence.txt"             "${{ runner.temp }}/d6u-trusted-input/d6u-runtime-test.log"             "${{ runner.temp }}/d6u-trusted-input/Cargo.lock"; do
            report="$RUNNER_TEMP/d6u-attestation-$(basename "$subject").json"
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/d6u-trusted-evidence-attestation.yml" \
              --signer-digest "$GITHUB_WORKFLOW_SHA" \
              --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/d6u-trusted-evidence-attestation.yml@refs/heads/main" \
              --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --predicate-type "https://luminousdynamics.io/attestations/d6u-runtime-evidence/v1" \
              --deny-self-hosted-runners \
              --format=json > "$report"
            D6U_ATTESTATION_SUBJECT="$subject" \
            D6U_TRUSTED_EVIDENCE_DIR="$RUNNER_TEMP/d6u-trusted-input" \
            D6U_TRUSTED_POLICY_VERSION="29" \
              python3 scripts/integral/verify_d6u_trusted_attestation.py "$report"
            rm -f "$report"
          done

      - name: Retain and offline-verify trusted attestations
        env:
          GH_TOKEN: ${{ github.token }}
          D6U_TRUSTED_POLICY_VERSION: "29"
        run: |
          set -euo pipefail
          retention_dir="$RUNNER_TEMP/d6u-attestation-retention"
          rm -rf "$retention_dir"
          mkdir -p "$retention_dir"

          gh attestation trusted-root > "$retention_dir/trusted_root.jsonl"
          test -s "$retention_dir/trusted_root.jsonl"
          test "$(stat -c '%s' "$retention_dir/trusted_root.jsonl")" -le 2097152

          subjects=(
            "$RUNNER_TEMP/d6u-trusted-input/d6u-runtime-evidence.txt"
            "$RUNNER_TEMP/d6u-trusted-input/d6u-runtime-test.log"
            "$RUNNER_TEMP/d6u-trusted-input/Cargo.lock"
          )
          names=(
            "d6u-runtime-evidence.txt"
            "d6u-runtime-test.log"
            "Cargo.lock"
          )

          for i in "0" "1" "2"; do
            subject="${subjects[$i]}"
            name="${names[$i]}"
            safe="$(printf '%s' "$name" | tr '.-' '__')"
            work="$RUNNER_TEMP/d6u-attestation-download-$safe"
            rm -rf "$work"
            mkdir -p "$work"
            (
              cd "$work"
              gh attestation download "$subject" \
                --repo "$GITHUB_REPOSITORY" \
                --predicate-type "https://luminousdynamics.io/attestations/d6u-runtime-evidence/v1" \
                --limit 8
            )
            mapfile -t bundles < <(find "$work" -maxdepth 1 -type f -name '*.jsonl' -print)
            test "${#bundles[@]}" -eq 1
            bundle="$retention_dir/$safe.attestation.jsonl"
            cp -- "${bundles[0]}" "$bundle"
            test -s "$bundle"

            report="$retention_dir/$safe.offline.json"
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle "$bundle" \
              --custom-trusted-root "$retention_dir/trusted_root.jsonl" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/d6u-trusted-evidence-attestation.yml" \
              --signer-digest "$GITHUB_WORKFLOW_SHA" \
              --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/d6u-trusted-evidence-attestation.yml@refs/heads/main" \
              --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --predicate-type "https://luminousdynamics.io/attestations/d6u-runtime-evidence/v1" \
              --deny-self-hosted-runners \
              --format=json > "$report"

            set +e
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle "$bundle" \
              --custom-trusted-root "$retention_dir/trusted_root.jsonl" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/d6u-trusted-evidence-attestation.yml" \
              --signer-digest "$GITHUB_WORKFLOW_SHA" \
              --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/d6u-trusted-evidence-attestation.yml@refs/heads/main" \
              --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --predicate-type "https://luminousdynamics.io/attestations/d6u-runtime-evidence/v1" \
              --deny-self-hosted-runners \
              --no-public-good > "$RUNNER_TEMP/no-public-good-$safe.json" 2>&1
            status="$?"
            set -e
            test "$status" -ne 0
          done

          python3 - "$retention_dir/retention-transcript.json" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys

          root = Path(os.environ["RUNNER_TEMP"]) / "d6u-attestation-retention"
          out = Path(sys.argv[1])
          subjects = []
          mapping = {
              "d6u-runtime-evidence.txt": "D6U_SUBJECT_D6U_RUNTIME_EVIDENCE_TXT_SHA256",
              "d6u-runtime-test.log": "D6U_SUBJECT_D6U_RUNTIME_TEST_LOG_SHA256",
              "Cargo.lock": "D6U_SUBJECT_CARGO_LOCK_SHA256",
          }
          evidence_root = Path(os.environ["RUNNER_TEMP"]) / "d6u-trusted-input"
          for name, env_name in mapping.items():
              digest = hashlib.sha256((evidence_root / name).read_bytes()).hexdigest()
              subjects.append({"name": name, "sha256": digest})
              expected = os.environ.get(env_name)
              if expected is not None and expected != digest:
                  raise SystemExit(f"subject digest mismatch for {name}")

          retained = {}
          for path in sorted(root.iterdir()):
              if path.name == "retention-transcript.json":
                  continue
              retained[path.name] = {
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "bytes": path.stat().st_size,
              }

          payload = {
              "schema": "d6u-attestation-retention/v1",
              "policy_version": int(os.environ["D6U_TRUSTED_POLICY_VERSION"]),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_ref": os.environ["GITHUB_REF"],
              "source_digest": os.environ["GITHUB_SHA"],
              "signer_workflow": os.environ["GITHUB_REPOSITORY"] + "/.github/workflows/d6u-trusted-evidence-attestation.yml",
              "signer_workflow_digest": os.environ["GITHUB_WORKFLOW_SHA"],
              "certificate_identity": "https://github.com/" + os.environ["GITHUB_REPOSITORY"] + "/.github/workflows/d6u-trusted-evidence-attestation.yml@refs/heads/main",
              "certificate_oidc_issuer": "https://token.actions.githubusercontent.com",
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "run_invocation_uri": "https://github.com/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"] + "/attempts/" + os.environ["GITHUB_RUN_ATTEMPT"],
              "cli_version": "2.101.0",
              "predicate_type": "https://luminousdynamics.io/attestations/d6u-runtime-evidence/v1",
              "predicate_schema": "d6u-trusted-runtime-evidence/v1",
              "claim_ceiling": "ReferenceModelOnly",
              "public_good_instance_required": True,
              "public_good_instance": "sigstore-public-good",
              "tlog_required": True,
              "offline_verified": True,
              "no_public_good_rejected": True,
              "subjects": subjects,
              "retained_files": retained,
          }
          out.write_text(json.dumps(payload, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY

          D6U_TRUSTED_POLICY_VERSION="$D6U_TRUSTED_POLICY_VERSION" \
          GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
          GITHUB_REF="$GITHUB_REF" \
          GITHUB_SHA="$GITHUB_SHA" \
          GITHUB_WORKFLOW_SHA="$GITHUB_WORKFLOW_SHA" \
          GITHUB_RUN_ID="$GITHUB_RUN_ID" \
          GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
          D6U_SUBJECT_D6U_RUNTIME_EVIDENCE_TXT_SHA256="$(sha256sum "$RUNNER_TEMP/d6u-trusted-input/d6u-runtime-evidence.txt" | awk '{print $1}')" \
          D6U_SUBJECT_D6U_RUNTIME_TEST_LOG_SHA256="$(sha256sum "$RUNNER_TEMP/d6u-trusted-input/d6u-runtime-test.log" | awk '{print $1}')" \
          D6U_SUBJECT_CARGO_LOCK_SHA256="$(sha256sum "$RUNNER_TEMP/d6u-trusted-input/Cargo.lock" | awk '{print $1}')" \
            python3 scripts/integral/verify_d6u_trusted_attestation_retention.py "$retention_dir"

          rm -f "$RUNNER_TEMP"/no-public-good-*.json

      - name: Upload retained trusted attestation packet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d6u-trusted-attestation-retention-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/d6u-attestation-retention
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: false
