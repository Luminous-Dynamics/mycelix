name: Integration HTTP Egress Route Qualification

on:
  pull_request:
    branches:
      - feat/integration-http-transport-admission-v1
      - main
    paths:
      - 'crates/mycelix-integration-http-egress-route/**'
      - '.github/workflows/integration-http-egress-route-qualification.yml'
  push:
    branches:
      - feat/integration-http-egress-route-v1
    paths:
      - 'crates/mycelix-integration-http-egress-route/**'
      - '.github/workflows/integration-http-egress-route-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MANIFEST: crates/mycelix-integration-http-egress-route/Cargo.toml
  SOURCE: crates/mycelix-integration-http-egress-route/src/lib.rs

concurrency:
  group: integration-http-egress-route-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Public resolved-address and TLS-route safety
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/mycelix-integration-http-egress-route

      - name: Check formatting
        run: cargo fmt --manifest-path "$MANIFEST" --all --check

      - name: Compile tests without running
        run: cargo test --manifest-path "$MANIFEST" --no-run

      - name: Run tests
        run: cargo test --manifest-path "$MANIFEST"

      - name: Clippy
        run: cargo clippy --manifest-path "$MANIFEST" --all-targets -- -D warnings

      - name: Enforce exact current policy hostname and route window
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'observation.hostname != policy.endpoint_host' "$SOURCE"
          grep -Fq 'transport.valid_until_ms() <= now_ms' "$SOURCE"
          grep -Fq 'observation.valid_until_ms <= now_ms' "$SOURCE"
          grep -Fq 'observation.observed_at_ms > now_ms' "$SOURCE"
          grep -Fq 'observation.valid_until_ms.min(transport.valid_until_ms())' "$SOURCE"
          grep -Fq 'transport.binding_digest()' "$SOURCE"

      - name: Enforce canonical public-address set
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'strictly_sorted_unique(&observation.addresses)' "$SOURCE"
          grep -Fq 'is_public_unicast(*address)' "$SOURCE"
          grep -Fq 'RFC 6598 shared/CGNAT' "$SOURCE"
          grep -Fq 'IETF protocol assignments' "$SOURCE"
          grep -Fq 'benchmarking' "$SOURCE"
          grep -Fq 'documentation' "$SOURCE"
          grep -Fq 'Require global-unicast 2000::/3' "$SOURCE"
          grep -Fq 'Teredo' "$SOURCE"
          grep -Fq 'deprecated 6to4' "$SOURCE"

      - name: Enforce TLS and egress semantics
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'connect_only_to_qualified_addresses_here(&self) -> bool' "$SOURCE"
          grep -Fq 'webpki_dns_name_verification_required_here(&self) -> bool' "$SOURCE"
          grep -Fq 'sni_equals_policy_hostname_here(&self) -> bool' "$SOURCE"
          grep -Fq 'redirects_allowed_here(&self) -> bool' "$SOURCE"
          grep -Fq 'environment_proxy_allowed_here(&self) -> bool' "$SOURCE"
          grep -Fq 'custom_trust_roots_allowed_here(&self) -> bool' "$SOURCE"

      - name: Enforce resolver observation does not pretend origin verification
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'resolution_evidence_origin_verified_here(&self) -> bool' "$SOURCE"
          grep -Fq 'false' "$SOURCE"
          grep -Fq 'network_io_performed_here(&self) -> bool' "$SOURCE"
          grep -Fq 'grants_execution_authority(&self) -> bool' "$SOURCE"

      - name: Enforce qualifier remains pure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          meta = json.loads(subprocess.check_output([
              'cargo','metadata','--manifest-path',
              'crates/mycelix-integration-http-egress-route/Cargo.toml',
              '--no-deps','--format-version','1'
          ]))
          package = next(p for p in meta['packages'] if p['name'] == 'mycelix-integration-http-egress-route')
          direct = {d['name'] for d in package['dependencies']}
          forbidden = {'reqwest','hyper','tonic','curl','ureq','tokio','async-std','rustls','native-tls','openssl','trust-dns-resolver','hickory-resolver'}
          hit = sorted(direct & forbidden)
          if hit:
              raise SystemExit(f'network/DNS/TLS capability entered pure route qualifier: {hit}')
          PY
          if grep -Eq 'TcpStream|UdpSocket|ToSocketAddrs|lookup_host|reqwest::|hyper::|hickory|trust_dns|rustls::|native_tls' "$SOURCE"; then
            echo 'Route qualifier performed DNS/network/TLS work.'
            exit 1
          fi
