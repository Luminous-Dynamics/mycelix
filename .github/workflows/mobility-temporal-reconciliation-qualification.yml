name: Mobility temporal reconciliation qualification
on:
  push:
    paths:
      - 'mycelix-commons/crates/mobility-configuration-qualification/**'
      - 'tools/mobility_temporal_reconciliation_reference.py'
      - 'docs/mobility/MOBILITY_TEMPORAL_RECONCILIATION_ALGEBRA_V1.*'
      - '.github/workflows/mobility-temporal-reconciliation-qualification.yml'
  pull_request:
    paths:
      - 'mycelix-commons/crates/mobility-configuration-qualification/**'
      - 'tools/mobility_temporal_reconciliation_reference.py'
      - 'docs/mobility/MOBILITY_TEMPORAL_RECONCILIATION_ALGEBRA_V1.*'
      - '.github/workflows/mobility-temporal-reconciliation-qualification.yml'
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
        working-directory: mycelix-commons/crates/mobility-configuration-qualification
      - run: cargo test
        working-directory: mycelix-commons/crates/mobility-configuration-qualification
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 tools/mobility_temporal_reconciliation_reference.py
