name: ROS-004 consent commitments v1

on:
  push:
    branches:
      - feat/ros-004-consent-commitments-v1
    paths:
      - "crates/mycelix-core-types/Cargo.toml"
      - "crates/mycelix-core-types/Cargo.lock"
      - "crates/mycelix-core-types/src/**"
      - ".github/workflows/ros-004-consent-commitments-v1.yml"
  pull_request:
    branches:
      - feat/ros-007-identity-hardening
    paths:
      - "crates/mycelix-core-types/Cargo.toml"
      - "crates/mycelix-core-types/Cargo.lock"
      - "crates/mycelix-core-types/src/**"
      - ".github/workflows/ros-004-consent-commitments-v1.yml"

permissions:
  contents: read

concurrency:
  group: ros-004-consent-commitments-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  QUALIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  exact-head-consent-commitments:
    name: Exact-head ROS-004 consent commitment vectors
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          persist-credentials: false

      - name: Assert exact checkout
        run: test "$(git rev-parse HEAD)" = "${QUALIFIED_SHA}"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy

      - name: Assert pinned toolchain
        run: |
          test "$(rustc --version | awk '{print $2}')" = "1.96.1"
          cargo --version
          rustfmt --version

      - name: Check formatting
        run: cargo fmt --manifest-path crates/mycelix-core-types/Cargo.toml --all -- --check

      - name: Test core types and ROS-004 consent
        run: cargo test --manifest-path crates/mycelix-core-types/Cargo.toml

      - name: Strict Clippy
        run: cargo clippy --manifest-path crates/mycelix-core-types/Cargo.toml --all-targets -- -D warnings
