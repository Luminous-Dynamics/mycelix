name: SUP-CIV-000D1D0 Crypto Profile Registry

on:
  pull_request:
    paths:
      - 'mycelix-workspace/docs/civic-resilience/SUP_CIV_000D1D0_CRYPTO_PROFILE_REGISTRY_V1.md'
      - 'mycelix-workspace/docs/civic-resilience/sup_civ_000d1d0_crypto_profile_registry.json'
      - 'scripts/qualification/sup_civ_000d1d0_crypto_profile_registry_v1.py'
      - '.github/workflows/sup-civ-000d1d0-crypto-profile-registry.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sup-civ-000d1d0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Crypto profile registry semantic boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Prove exact subject
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='a85369699099d4c7524e502e531735eed4ab36f4'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-list --count "$EXPECTED_PARENT"..HEAD)" = '1'
          git diff --check "$EXPECTED_PARENT" HEAD
          mapfile -t changed < <(git diff --name-only "$EXPECTED_PARENT" HEAD | sort)
          expected=(
            '.github/workflows/sup-civ-000d1d0-crypto-profile-registry.yml'
            'mycelix-workspace/docs/civic-resilience/SUP_CIV_000D1D0_CRYPTO_PROFILE_REGISTRY_V1.md'
            'mycelix-workspace/docs/civic-resilience/sup_civ_000d1d0_crypto_profile_registry.json'
            'scripts/qualification/sup_civ_000d1d0_crypto_profile_registry_v1.py'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")

      - name: Prove audited source blobs remain exact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object mycelix-workspace/Cargo.toml)" = '9053f6f0e7a09aa88ed4743df81c4cb06066e3bd'
          test "$(git hash-object mycelix-workspace/mycelix-identity/crates/mycelix-crypto/Cargo.toml)" = 'e49c9fa098b780d2632a03de499e3b2f74ac91fe'
          test "$(git hash-object mycelix-workspace/mycelix-identity/crates/mycelix-crypto/src/envelope.rs)" = 'bf7dd16570817fe29bf2f66d4f60a17e66d1ef5c'
          test "$(git hash-object mycelix-workspace/mycelix-identity/crates/mycelix-crypto/src/hybrid_kem.rs)" = 'b469b16fc51eec39bf9741ec290007409f5d50ea'
          test "$(git hash-object mycelix-workspace/mycelix-identity/crates/mycelix-crypto/src/pulse_v2.rs)" = '11bb5f4cb8ce866aa37c75875ed32ffbf04c9fca'
          test "$(git hash-object mycelix-workspace/mycelix-identity/crates/mycelix-crypto/src/lib.rs)" = '966589dd6111e193a7b55e6b84fd68521ef8d2d3'

      - name: Prove exact manifest and closed profile registry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object mycelix-workspace/docs/civic-resilience/sup_civ_000d1d0_crypto_profile_registry.json)" = 'ba8fcff2f46d990312bf7a592afd8e90c42a5e3f'
          python3 scripts/qualification/sup_civ_000d1d0_crypto_profile_registry_v1.py \
            --manifest mycelix-workspace/docs/civic-resilience/sup_civ_000d1d0_crypto_profile_registry.json

      - name: Syntax-check stdlib validator
        run: python3 -m py_compile scripts/qualification/sup_civ_000d1d0_crypto_profile_registry_v1.py

      - name: Refuse runtime or dependency changes
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='a85369699099d4c7524e502e531735eed4ab36f4'
          if git diff --name-only "$EXPECTED_PARENT" HEAD | grep -E '\.(rs|toml|lock|nix)$'; then
            echo 'runtime/dependency file entered D1D0 semantic registry tranche' >&2
            exit 1
          fi

      - name: Immutable checkout postflight
        shell: bash
        run: |
          rm -rf scripts/qualification/__pycache__
          test -z "$(git status --porcelain)"
