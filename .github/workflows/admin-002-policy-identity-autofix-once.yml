name: ADMIN-002 Policy Identity One-Shot Autofix

on:
  push:
    branches:
      - 'feat/admin-002-canonical-policy-identity-v0.1'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Format exact owned source
        run: |
          rustfmt --edition 2024 crates/mycelix-procedure-policy-identity/src/lib.rs
          git diff --check

      - name: Verify exact identity crate
        run: |
          qroot="$(mktemp -d)"
          mkdir -p "$qroot/crates"
          cp -a crates/mycelix-institutional-core "$qroot/crates/"
          cp -a crates/mycelix-administrative-procedure "$qroot/crates/"
          cp -a crates/mycelix-procedure-policy-identity "$qroot/crates/"
          manifest="$qroot/crates/mycelix-procedure-policy-identity/Cargo.toml"
          cargo test --manifest-path "$manifest" --all-targets
          cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings

      - name: Commit exact format repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/mycelix-procedure-policy-identity/src/lib.rs
          git diff --cached --quiet && exit 1
          git commit -m 'fix(admin): format procedure-policy identity qualifier'
          git push origin HEAD:feat/admin-002-canonical-policy-identity-v0.1
