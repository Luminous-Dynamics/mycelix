name: Payment-channel fork reference

on:
  pull_request:
    paths:
      - "tools/finance/payment-channel-fork-reference/**"
      - ".github/workflows/payment-channel-fork-reference.yml"
  push:
    branches: [main]
    paths:
      - "tools/finance/payment-channel-fork-reference/**"
      - ".github/workflows/payment-channel-fork-reference.yml"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact qualification subject
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact head
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Rust formatting
        run: cargo fmt --manifest-path tools/finance/payment-channel-fork-reference/Cargo.toml --all --check
      - name: Tests
        run: cargo test --manifest-path tools/finance/payment-channel-fork-reference/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path tools/finance/payment-channel-fork-reference/Cargo.toml --all-targets -- -D warnings
