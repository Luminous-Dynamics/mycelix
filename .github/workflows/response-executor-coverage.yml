name: Response Executor Coverage

on:
  pull_request:
    paths:
      - 'crates/mycelix-response-executor-coverage/**'
      - 'crates/mycelix-response-authority-binding/**'
      - 'crates/mycelix-governance-executor-provider-contract/**'
      - 'crates/mycelix-governance-current-executor-authority/**'
      - 'crates/mycelix-authority-freshness/**'
      - '.github/workflows/response-executor-coverage.yml'
  push:
    branches:
      - 'response-authority-3-executor-coverage'

permissions:
  contents: read

concurrency:
  group: response-executor-coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: Response to executor semantic coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path crates/mycelix-response-executor-coverage/Cargo.toml -- --check
      - name: Tests
        run: cargo test --manifest-path crates/mycelix-response-executor-coverage/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-response-executor-coverage/Cargo.toml --all-targets -- -D warnings
      - name: Upstream compatibility
        run: |
          cargo check --manifest-path crates/mycelix-response-authority-binding/Cargo.toml --all-targets
          cargo check --manifest-path crates/mycelix-governance-executor-provider-contract/Cargo.toml --all-targets
      - name: Semantic separation audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('crates/mycelix-response-executor-coverage/src/lib.rs').read_text()
          provider = Path('crates/mycelix-governance-executor-provider-contract/src/lib.rs').read_text()

          required = [
              'match_response_executor_coverage(',
              'receipt.validate_at(now_ms)',
              'projection.proposal_id.as_str() != prepared.proposal_id()',
              'projection.capability_scope.as_str() != prepared.requirement().action',
              'actual_jurisdiction != prepared.requirement().jurisdiction.as_deref()',
              'AuthoritySubjectKind::AuthorityGrant',
              'AuthoritySubjectKind::ThresholdAuthorization',
              'AuthoritySubjectKind::ExecutorDesignation',
              'executor_designation_record_ref',
              'pending_authority_subjects',
              'grants_execution_authority(&self) -> bool',
              'provider_origin_verified_here(&self) -> bool',
              'deployment_bound_here(&self) -> bool',
              'action_bytes_bound_here(&self) -> bool',
          ]
          for token in required:
              assert token in src, token

          # Provider v0.2 must expose the exact designation subject id, not just
          # the generation-sensitive current-authority alias.
          assert 'mycelix-governance-executor-authority-provider-v0.2' in provider
          assert 'pub executor_designation_record_ref: String' in provider
          assert 'designation_receipt.designation_record_ref.clone()' in provider

          # Semantic match result is local/non-deserializable and explicitly not
          # a capability. The wire receipt remains transport data whose origin is
          # outside this pure theorem.
          before = src.split('pub struct MatchedResponseExecutorCoverage', 1)[0][-240:]
          assert 'Serialize)]' in before
          assert 'Deserialize' not in before
          lowered = src.lower()
          for forbidden in [
              '#[hdk_extern]',
              'hdk::',
              'call_remote(',
              'create_entry(',
              'update_entry(',
              'execute_actions',
              'dispatch(',
              'qualify_operational_freshness_for_deployment',
          ]:
              assert forbidden not in lowered, forbidden

          assert 'provider receipt deserialization is not proof of provider origin' in lowered
          assert 'does not bind governance action bytes' in lowered
          print('PASS: response/executor semantic coverage is exact but remains non-authoritative and pre-effect')
          PY
