name: Leptos workspace entrypoint audit

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "mycelix-marketplace/frontend-leptos/Cargo.toml"
      - "mycelix-marketplace/frontend-leptos/apps/marketplace-web/**"
      - "mycelix-marketplace/frontend-leptos/crates/marketplace-client/**"
      - "mycelix-marketplace/frontend-leptos/crates/marketplace-domain/**"
      - ".github/workflows/leptos-workspace-entrypoint-audit.yml"
  push:
    branches:
      - fix/marketplace-web-wasm-entrypoint-20261020

permissions:
  contents: read

jobs:
  workspace-entrypoint:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact pull request head or pushed commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Install pinned Rust and WASM target
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.94.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Assert exact revision and repository
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$expected_head"
          test "${{ github.repository }}" = "Luminous-Dynamics/mycelix"
          echo "Qualified source SHA: $actual_head"
      - name: Validate workspace metadata
        run: cargo metadata --manifest-path mycelix-marketplace/frontend-leptos/Cargo.toml --format-version 1 --no-deps
      - name: Check Marketplace web formatting
        run: cargo fmt --manifest-path mycelix-marketplace/frontend-leptos/Cargo.toml -p marketplace-web -- --check
      - name: Test Marketplace domain
        run: cargo test --manifest-path mycelix-marketplace/frontend-leptos/Cargo.toml -p marketplace-domain
      - name: Test typed client with explicit fixture capability
        run: cargo test --manifest-path mycelix-marketplace/frontend-leptos/Cargo.toml -p marketplace-client --features dev-fixtures
      - name: Check live WASM library entrypoint
        run: cargo check --manifest-path mycelix-marketplace/frontend-leptos/Cargo.toml -p marketplace-web --lib --target wasm32-unknown-unknown
      - name: Check explicit fixture WASM build
        run: cargo check --manifest-path mycelix-marketplace/frontend-leptos/Cargo.toml -p marketplace-web --target wasm32-unknown-unknown --no-default-features --features dev-fixtures
