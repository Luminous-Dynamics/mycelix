name: GOVSYS-003C-VR0 Rust Verifier Convergence

on:
  pull_request:
    branches:
      - feat/govsys-003a-rust-root-conformance-v0.1
    paths:
      - .github/workflows/govsys-003c-vr-convergence.yml
      - mycelix-workspace/docs/government/CONSTITUTIONAL_ROOT_RUST_VERIFIER_CONVERGENCE_V0.1.md
      - .github/workflows/govsys-003c-transition-verifier.yml
      - mycelix-workspace/docs/government/CONSTITUTIONAL_ROOT_TRANSITION_VERIFIER_V0.1.md
      - scripts/qualification/govsys_003c_transition_verifier_vector_v1.json
      - scripts/qualification/govsys_constitutional_transition_verifier_v0_1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Exact Rust Root-A plus verifier theorem convergence
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Exact qualification subject and convergence ancestry
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          merge=11acf9d7f5b84b0ef544efea540f857e1d1e88c7
          rust=9ce4f905d74ab53e414a0f9cce63e8122c84c8cd
          verifier=883aed18e6df3c31dc8e74c780164533c39ede8f
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$merge"
          mapfile -t parents < <(git show -s --format='%P' "$merge" | tr ' ' '\n')
          test "${#parents[@]}" -eq 2
          test "${parents[0]}" = "$rust"
          test "${parents[1]}" = "$verifier"
          test "$(git rev-parse "${merge}^{tree}")" = "11b19e01d45b1bbe945726fb94322b0c90759955"

      - name: Exact selective convergence surface
        shell: bash
        run: |
          set -euo pipefail
          rust=9ce4f905d74ab53e414a0f9cce63e8122c84c8cd
          merge=11acf9d7f5b84b0ef544efea540f857e1d1e88c7
          verifier=883aed18e6df3c31dc8e74c780164533c39ede8f
          mapfile -t changed < <(git diff --name-only "$rust".."$merge" | sort)
          expected=(
            .github/workflows/govsys-003c-transition-verifier.yml
            mycelix-workspace/docs/government/CONSTITUTIONAL_ROOT_TRANSITION_VERIFIER_V0.1.md
            scripts/qualification/govsys_003c_transition_verifier_vector_v1.json
            scripts/qualification/govsys_constitutional_transition_verifier_v0_1.py
          )
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq 4
          for i in "${!wanted[@]}"; do
            test "${changed[$i]}" = "${wanted[$i]}"
            test "$(git rev-parse "${merge}:${wanted[$i]}")" = "$(git rev-parse "${verifier}:${wanted[$i]}")"
          done

      - name: Exact two-file qualification child
        shell: bash
        run: |
          set -euo pipefail
          merge=11acf9d7f5b84b0ef544efea540f857e1d1e88c7
          mapfile -t changed < <(git diff --name-only "$merge"..HEAD | sort)
          expected=(
            .github/workflows/govsys-003c-vr-convergence.yml
            mycelix-workspace/docs/government/CONSTITUTIONAL_ROOT_RUST_VERIFIER_CONVERGENCE_V0.1.md
          )
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq 2
          for i in "${!wanted[@]}"; do test "${changed[$i]}" = "${wanted[$i]}"; done

      - name: Re-execute exact predecessor verifier theorem
        id: verifier
        continue-on-error: true
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/qualification/govsys_constitutional_transition_verifier_v0_1.py

      - name: Independently verify #839 signature with OpenSSL
        id: openssl
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/govsys-003c-vr0-openssl"
          mkdir -p "$tmp"
          python3 - "$tmp" <<'PY'
          import json, sys
          from pathlib import Path
          out = Path(sys.argv[1])
          vector = json.loads(Path('scripts/qualification/govsys_003c_transition_verifier_vector_v1.json').read_text())
          (out/'candidate.bin').write_bytes(bytes.fromhex(vector['expected']['candidate_canonical_bytes_hex']))
          (out/'public.der').write_bytes(bytes.fromhex(vector['authorization_material']['public_key_spki_der_hex']))
          (out/'signature.bin').write_bytes(bytes.fromhex(vector['authorization_proof']['signature_hex']))
          PY
          openssl pkeyutl -verify -pubin -inkey "$tmp/public.der" -keyform DER \
            -rawin -in "$tmp/candidate.bin" -sigfile "$tmp/signature.bin"

      - name: Install exact Rust Root-A toolchain
        id: toolchain
        if: always()
        continue-on-error: true
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Re-execute Rust Root-A theorem
        id: rust_root
        if: always()
        continue-on-error: true
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          crate="$RUNNER_TEMP/mycelix-constitutional-root"
          mkdir -p "$crate"
          cp -a crates/mycelix-constitutional-root/. "$crate/"
          cargo fmt --manifest-path "$crate/Cargo.toml" -- --check
          cargo test --manifest-path "$crate/Cargo.toml" --all-targets
          cargo clippy --manifest-path "$crate/Cargo.toml" --all-targets -- -D warnings
          cargo check --manifest-path "$crate/Cargo.toml" --lib --target wasm32-unknown-unknown
          python3 - <<'PY' > "$RUNNER_TEMP/root-a-python.out"
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/qualification')
          import govsys_constitutional_trust_root_identity_v0_1 as root
          golden=json.loads(Path('scripts/qualification/govsys_003a_root_identity_vector_v1.json').read_text())['root']
          pair=json.loads(Path('crates/mycelix-constitutional-root/vectors/root_a_transition_pair_v1.json').read_text())
          for label,value in [('golden',golden),('predecessor',pair['predecessor']),('successor',pair['successor'])]:
              print(f"{label}.root={root.identity_hex(value)}")
              print(f"{label}.source={root.source_descriptor_hex(value)}")
              print(f"{label}.rotation={root.rotation_authority_hex(value)}")
          PY
          cargo run --quiet --manifest-path "$crate/Cargo.toml" --example conformance > "$RUNNER_TEMP/root-a-rust.out"
          diff -u "$RUNNER_TEMP/root-a-python.out" "$RUNNER_TEMP/root-a-rust.out"

      - name: Immutable checkout postflight
        id: immutable
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Fail closed on any convergence defect
        if: always()
        shell: bash
        env:
          VERIFIER_OUTCOME: ${{ steps.verifier.outcome }}
          OPENSSL_OUTCOME: ${{ steps.openssl.outcome }}
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          RUST_ROOT_OUTCOME: ${{ steps.rust_root.outcome }}
          IMMUTABLE_OUTCOME: ${{ steps.immutable.outcome }}
        run: |
          set -euo pipefail
          test "$VERIFIER_OUTCOME" = success
          test "$OPENSSL_OUTCOME" = success
          test "$TOOLCHAIN_OUTCOME" = success
          test "$RUST_ROOT_OUTCOME" = success
          test "$IMMUTABLE_OUTCOME" = success
