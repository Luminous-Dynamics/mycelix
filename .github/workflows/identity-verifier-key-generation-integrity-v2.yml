name: Identity Verifier Key Generation Integrity V2

on:
  pull_request:
    paths:
      - 'mycelix-workspace/mycelix-identity/Cargo.toml'
      - 'mycelix-workspace/mycelix-identity/zomes/verifier_key_generation/integrity/**'
      - '.github/workflows/identity-verifier-key-generation-integrity-v2.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-workspace/mycelix-identity/Cargo.toml'
      - 'mycelix-workspace/mycelix-identity/zomes/verifier_key_generation/integrity/**'
      - '.github/workflows/identity-verifier-key-generation-integrity-v2.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify-verifier-key-generation-integrity-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Assert append-only key-generation integrity boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          root = Path('mycelix-workspace/mycelix-identity')
          member = 'zomes/verifier_key_generation/integrity'
          workspace = tomllib.loads((root / 'Cargo.toml').read_text())
          if member not in workspace.get('workspace', {}).get('members', []):
              raise SystemExit(f'ERROR: {member} is not an explicit Identity workspace member')

          manifest = tomllib.loads((root / member / 'Cargo.toml').read_text())
          deps = manifest.get('dependencies', {})
          expected = {'hdi', 'holochain_serialized_bytes', 'serde'}
          if set(deps) != expected:
              raise SystemExit(f'ERROR: key-generation integrity dependencies drifted: {sorted(deps)}')
          for name in expected:
              if deps[name].get('workspace') is not True:
                  raise SystemExit(f'ERROR: {name} must use the pinned Identity workspace dependency')

          text = (root / member / 'src/lib.rs').read_text()
          theorem = text[:text.index('#[cfg(test)]')]
          required = [
              '#[hdk_entry_helper]',
              'VerifierKeyGenerationRecord',
              'did_document_action: ActionHash',
              'key_generation: u64',
              'valid_from_micros: i64',
              'valid_until_micros: i64',
              'previous_generation_action: Option<ActionHash>',
              'validate_generation_shape',
              'validate_create_generation',
              'format!("did:mycelix:{}", action.author)',
              'must_get_valid_record(record.did_document_action.clone())?',
              'did_record.action().entry_type() == Some(&action.entry_type)',
              'must_get_valid_record(previous_hash)?',
              'previous_record.action().entry_type() != Some(&action.entry_type)',
              'Action::Create(previous_action)',
              '.checked_add(1)',
              'record.key_generation != expected_generation',
              'record.valid_from_micros < previous.valid_until_micros',
              'verifier-key generation records are append-only and cannot be updated',
              'verifier-key generation records are append-only and cannot be deleted',
              'verifier-key generation discovery links are append-only',
              'Holochain timestamps',
              'not trusted wall-clock activation',
          ]
          for needle in required:
              if needle not in theorem:
                  raise SystemExit(f'ERROR: key-generation integrity theorem missing: {needle!r}')

          entry_start = theorem.index('pub struct VerifierKeyGenerationRecord')
          entry_end = theorem.index('\n}', entry_start)
          entry = theorem[entry_start:entry_end]
          for forbidden_field in ['public_key', 'algorithm:', 'signature_scheme', 'trusted_activation']:
              if forbidden_field in entry:
                  raise SystemExit(
                      f'ERROR: lifecycle entry duplicated downstream key/activation semantics: {forbidden_field!r}'
                  )

          lower = theorem.lower()
          for forbidden in [
              'use hdk',
              'hdk::',
              'sys_time(',
              'std::time',
              '.verify(',
              'signature_validated',
              'policy_current',
              'policy_accepted',
              'qualifiedsignature',
              'positiveevidence',
              '.sort_by(',
              '.max_by(',
              '.max_by_key(',
          ]:
              if forbidden in lower:
                  raise SystemExit(
                      f'ERROR: crypto/currentness/latest-wins semantics leaked into DHT integrity: {forbidden!r}'
                  )

          # This slice is intentionally unprovisioned. Workspace membership lets it compile;
          # DNA packaging must remain absent until observer + trusted activation boundaries exist.
          packaged = []
          for pattern in ('**/dna.yaml', '**/dna.yml'):
              for path in root.glob(pattern):
                  if 'verifier_key_generation' in path.read_text():
                      packaged.append(str(path))
          if packaged:
              raise SystemExit(f'ERROR: unqualified verifier-key generation zome packaged into DNA: {packaged}')
          PY

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-workspace/mycelix-identity

      - name: Check formatting
        run: |
          cargo fmt \
            --manifest-path mycelix-workspace/mycelix-identity/zomes/verifier_key_generation/integrity/Cargo.toml \
            -- --check

      - name: Test verifier-key generation integrity
        run: |
          cargo test \
            --manifest-path mycelix-workspace/mycelix-identity/zomes/verifier_key_generation/integrity/Cargo.toml

      - name: Check verifier-key generation integrity for wasm32
        run: |
          cargo check \
            --manifest-path mycelix-workspace/mycelix-identity/zomes/verifier_key_generation/integrity/Cargo.toml \
            --target wasm32-unknown-unknown
