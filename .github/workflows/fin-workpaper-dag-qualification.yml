name: FIN-ACC workpaper DAG exact-head qualification

on:
  push:
    branches:
      - research/fin-accounting-workpaper-dag-v1
    paths:
      - "mycelix-finance/benchmarks/accounting-evidence-v1/workpapers/**"
      - ".github/workflows/fin-workpaper-dag-qualification.yml"
  pull_request:
    branches:
      - research/fin-acc-close-dag-v0-1
    paths:
      - "mycelix-finance/benchmarks/accounting-evidence-v1/workpapers/**"
      - ".github/workflows/fin-workpaper-dag-qualification.yml"

permissions:
  contents: read

concurrency:
  group: fin-workpaper-dag-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Schema, graph, frontier, recipe and readiness semantics
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      QUALIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VERIFIER_DIR: mycelix-finance/benchmarks/accounting-evidence-v1/workpapers/semantic-verifier
    steps:
      - name: Checkout exact qualification subject
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          persist-credentials: false

      - name: Assert exact checked-out commit
        run: test "$(git rev-parse HEAD)" = "${{ env.QUALIFIED_SHA }}"

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy

      - name: Assert toolchain
        run: test "$(rustc +1.96.1 --version | awk '{print $2}')" = "1.96.1"

      - name: Format
        working-directory: ${{ env.VERIFIER_DIR }}
        run: cargo fmt --all -- --check

      - name: Locked semantic tests
        working-directory: ${{ env.VERIFIER_DIR }}
        run: cargo test --locked

      - name: Warnings-denied Clippy
        working-directory: ${{ env.VERIFIER_DIR }}
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Verify frozen incomplete smoke DAG
        working-directory: ${{ env.VERIFIER_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked -- --input ../examples/acc-syn-0001-minimal-dag-v0.1.json --out /tmp/workpaper-dag-report.json
          cat /tmp/workpaper-dag-report.json
          jq -e '.status == "PASS" and .close_disposition == "not_ready" and (.missing_required_node_kinds | length) > 0' /tmp/workpaper-dag-report.json
          jq -e '.can_post_journals == false and .can_approve_or_close == false' /tmp/workpaper-dag-report.json

      - name: Assert exact subject and clean source
        run: |
          test "$(git rev-parse HEAD)" = "${{ env.QUALIFIED_SHA }}"
          test -z "$(git status --porcelain)"

      - name: Upload exact-head semantic report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fin-workpaper-dag-${{ env.QUALIFIED_SHA }}
          path: /tmp/workpaper-dag-report.json
          if-no-files-found: error
