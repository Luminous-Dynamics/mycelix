name: Local identity posture qualification

on:
  pull_request:
    paths:
      - "crates/mycelix-leptos-core/src/local_identity.rs"
      - "crates/mycelix-leptos-core/src/identity_crypto.rs"
      - "crates/mycelix-leptos-core/src/identity_bootstrap.rs"
      - "crates/mycelix-leptos-core/src/lib.rs"
      - "crates/mycelix-leptos-core/Cargo.toml"
      - "mycelix-personal/apps/leptos/**"
      - "mycelix-finance/apps/leptos/**"
      - "mycelix-climate/apps/leptos/**"
      - "mycelix-workspace/Cargo.toml"
      - "mycelix-workspace/mycelix-personal/apps/leptos/**"
      - "mycelix-workspace/mycelix-finance/apps/leptos/**"
      - "mycelix-workspace/mycelix-climate/apps/leptos/**"
      - ".github/workflows/local-identity-posture.yml"
  push:
    branches: [main]
    paths:
      - "crates/mycelix-leptos-core/src/local_identity.rs"
      - "crates/mycelix-leptos-core/src/identity_crypto.rs"
      - "crates/mycelix-leptos-core/src/identity_bootstrap.rs"
      - "crates/mycelix-leptos-core/src/lib.rs"
      - "crates/mycelix-leptos-core/Cargo.toml"
      - "mycelix-personal/apps/leptos/**"
      - "mycelix-finance/apps/leptos/**"
      - "mycelix-climate/apps/leptos/**"
      - "mycelix-workspace/Cargo.toml"
      - "mycelix-workspace/mycelix-personal/apps/leptos/**"
      - "mycelix-workspace/mycelix-finance/apps/leptos/**"
      - "mycelix-workspace/mycelix-climate/apps/leptos/**"
      - ".github/workflows/local-identity-posture.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-identity-posture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Exact-head identity posture tests and WASM compile
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/mycelix-leptos-core -> target
            crates/mycelix-leptos-client -> target
            mycelix-personal/apps/leptos -> target
            mycelix-finance/apps/leptos -> target
            mycelix-climate/apps/leptos -> target
            mycelix-workspace -> mycelix-workspace/target
      - name: Assert exact source head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_SHA" ]]; then
            echo "Expected source head $EXPECTED_SHA, checked out $actual" >&2
            exit 1
          fi
      - name: Generate and fingerprint app/workspace lockfiles
        run: |
          cargo generate-lockfile --manifest-path crates/mycelix-leptos-core/Cargo.toml
          cargo generate-lockfile --manifest-path mycelix-personal/apps/leptos/Cargo.toml
          cargo generate-lockfile --manifest-path mycelix-finance/apps/leptos/Cargo.toml
          cargo generate-lockfile --manifest-path mycelix-climate/apps/leptos/Cargo.toml
          cargo generate-lockfile --manifest-path mycelix-workspace/Cargo.toml
          sha256sum             crates/mycelix-leptos-core/Cargo.lock             mycelix-personal/apps/leptos/Cargo.lock             mycelix-finance/apps/leptos/Cargo.lock             mycelix-climate/apps/leptos/Cargo.lock             mycelix-workspace/Cargo.lock
      - name: Check formatting of shared identity and all three app shells
        shell: bash
        run: |
          rustfmt --edition 2024 --check --config skip_children=true             crates/mycelix-leptos-core/src/local_identity.rs             crates/mycelix-leptos-core/src/identity_crypto.rs             crates/mycelix-leptos-core/src/identity_bootstrap.rs             crates/mycelix-leptos-core/src/lib.rs
          cargo fmt --manifest-path mycelix-personal/apps/leptos/Cargo.toml -- --check
          cargo fmt --manifest-path mycelix-finance/apps/leptos/Cargo.toml -- --check
          cargo fmt --manifest-path mycelix-climate/apps/leptos/Cargo.toml -- --check
          cargo fmt --manifest-path mycelix-workspace/mycelix-personal/apps/leptos/Cargo.toml -- --check
          cargo fmt --manifest-path mycelix-workspace/mycelix-finance/apps/leptos/Cargo.toml -- --check
          cargo fmt --manifest-path mycelix-workspace/mycelix-climate/apps/leptos/Cargo.toml -- --check
      - name: Ban implicit identity provider calls in app shells
        shell: bash
        run: |
          set -euo pipefail
          files=(
            mycelix-personal/apps/leptos/src/app.rs
            mycelix-finance/apps/leptos/src/app.rs
            mycelix-climate/apps/leptos/src/app.rs
            mycelix-workspace/mycelix-personal/apps/leptos/src/app.rs
            mycelix-workspace/mycelix-finance/apps/leptos/src/app.rs
            mycelix-workspace/mycelix-climate/apps/leptos/src/app.rs
          )
          if rg -n '(^|[^[:alnum:]_])provide_local_identity\s*\(' "${files[@]}"; then
            echo "App shell calls legacy identity provider without typed posture handling." >&2
            exit 1
          fi
          echo "All six app shells use the shared protected-identity gate."
      - name: Run native identity-storage posture tests
        run: cargo test --manifest-path crates/mycelix-leptos-core/Cargo.toml --locked --lib
      - name: Install wasm-pack for browser test execution
        run: cargo install wasm-pack --locked
      - name: Verify browser runner tools are present
        shell: bash
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
          command -v chromedriver
      - name: Execute WebCrypto and identity-storage tests in headless Chrome
        env:
          WASM_BINDGEN_TEST_TIMEOUT: "120"
        run: wasm-pack test --headless --chrome crates/mycelix-leptos-core --locked
      - name: Compile browser-only identity tests for WASM (diagnostic)
        run: cargo test --manifest-path crates/mycelix-leptos-core/Cargo.toml --locked --target wasm32-unknown-unknown --lib --no-run
      - name: Compile shared identity core for WASM
        run: cargo check --manifest-path crates/mycelix-leptos-core/Cargo.toml --locked --target wasm32-unknown-unknown
      - name: Run strict Clippy for Personal, Finance and Climate
        run: |
          cargo clippy --manifest-path mycelix-personal/apps/leptos/Cargo.toml --locked --all-targets -- -D warnings
          cargo clippy --manifest-path mycelix-finance/apps/leptos/Cargo.toml --locked --all-targets -- -D warnings
          cargo clippy --manifest-path mycelix-climate/apps/leptos/Cargo.toml --locked --all-targets -- -D warnings
          cargo clippy --manifest-path mycelix-workspace/mycelix-personal/apps/leptos/Cargo.toml --locked --all-targets -- -D warnings
          cargo clippy --manifest-path mycelix-workspace/mycelix-finance/apps/leptos/Cargo.toml --locked --all-targets -- -D warnings
          cargo clippy --manifest-path mycelix-workspace/mycelix-climate/apps/leptos/Cargo.toml --locked --all-targets -- -D warnings
      - name: Compile Personal, Finance and Climate apps for WASM
        run: |
          cargo check --manifest-path mycelix-personal/apps/leptos/Cargo.toml --locked --target wasm32-unknown-unknown
          cargo check --manifest-path mycelix-finance/apps/leptos/Cargo.toml --locked --target wasm32-unknown-unknown
          cargo check --manifest-path mycelix-climate/apps/leptos/Cargo.toml --locked --target wasm32-unknown-unknown
          cargo check --manifest-path mycelix-workspace/mycelix-personal/apps/leptos/Cargo.toml --locked --target wasm32-unknown-unknown
          cargo check --manifest-path mycelix-workspace/mycelix-finance/apps/leptos/Cargo.toml --locked --target wasm32-unknown-unknown
          cargo check --manifest-path mycelix-workspace/mycelix-climate/apps/leptos/Cargo.toml --locked --target wasm32-unknown-unknown
