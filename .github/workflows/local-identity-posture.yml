name: Local identity posture qualification

on:
  pull_request:
    paths:
      - "crates/mycelix-leptos-core/src/local_identity.rs"
      - "crates/mycelix-leptos-core/src/identity_crypto.rs"
      - "crates/mycelix-leptos-core/src/identity_bootstrap.rs"
      - "crates/mycelix-leptos-core/src/lib.rs"
      - "crates/mycelix-leptos-core/Cargo.toml"
      - "mycelix-personal/apps/leptos/**"
      - "mycelix-finance/apps/leptos/**"
      - "mycelix-climate/apps/leptos/**"
      - ".github/workflows/local-identity-posture.yml"
  push:
    branches: [main]
    paths:
      - "crates/mycelix-leptos-core/src/local_identity.rs"
      - "crates/mycelix-leptos-core/src/identity_crypto.rs"
      - "crates/mycelix-leptos-core/src/identity_bootstrap.rs"
      - "crates/mycelix-leptos-core/src/lib.rs"
      - "crates/mycelix-leptos-core/Cargo.toml"
      - "mycelix-personal/apps/leptos/**"
      - "mycelix-finance/apps/leptos/**"
      - "mycelix-climate/apps/leptos/**"
      - ".github/workflows/local-identity-posture.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-identity-posture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Exact-head identity posture tests, browser checks, and app gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/mycelix-leptos-core -> target
            crates/mycelix-leptos-client -> target
            mycelix-personal/apps/leptos -> target
            mycelix-finance/apps/leptos -> target
            mycelix-climate/apps/leptos -> target
      - name: Assert exact source head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_SHA" ]]; then
            echo "Expected source head $EXPECTED_SHA, checked out $actual" >&2
            exit 1
          fi
      - name: Assert every identity app shell uses the shared gate before identity access
        shell: bash
        run: |
          set -euo pipefail
          for app in finance climate personal; do
            case "$app" in
              finance)
                file="mycelix-finance/apps/leptos/src/app.rs"
                ready="FinanceReadyApp"
                ;;
              climate)
                file="mycelix-climate/apps/leptos/src/app.rs"
                ready="ClimateReadyApp"
                ;;
              personal)
                file="mycelix-personal/apps/leptos/src/app.rs"
                ready="PersonalReadyApp"
                ;;
            esac
            grep -Fq '<IdentityBootstrapGate>' "$file"
            ready_line="$(grep -nF "fn ${ready}()" "$file" | cut -d: -f1)"
            provider_line="$(grep -nF 'provide_local_identity();' "$file" | cut -d: -f1)"
            count="$(grep -Fc 'provide_local_identity();' "$file")"
            if [[ -z "$ready_line" || -z "$provider_line" || "$count" -ne 1 ]]; then
              echo "Expected exactly one local identity provider inside ${ready} in $file" >&2
              exit 1
            fi
            if (( provider_line <= ready_line )); then
              echo "Identity provider is not inside ${ready} in $file" >&2
              exit 1
            fi
            echo "$app identity provider gated at lines $provider_line / $ready_line"
          done
      - name: Generate and fingerprint identity/app locks
        run: |
          cargo generate-lockfile --manifest-path crates/mycelix-leptos-core/Cargo.toml
          cargo generate-lockfile --manifest-path mycelix-personal/apps/leptos/Cargo.toml
          cargo generate-lockfile --manifest-path mycelix-finance/apps/leptos/Cargo.toml
          cargo generate-lockfile --manifest-path mycelix-climate/apps/leptos/Cargo.toml
          sha256sum \
            crates/mycelix-leptos-core/Cargo.lock \
            mycelix-personal/apps/leptos/Cargo.lock \
            mycelix-finance/apps/leptos/Cargo.lock \
            mycelix-climate/apps/leptos/Cargo.lock
      - name: Check formatting of shared identity code and all app shells
        run: |
          rustfmt --edition 2024 --check \
            crates/mycelix-leptos-core/src/local_identity.rs \
            crates/mycelix-leptos-core/src/identity_crypto.rs \
            crates/mycelix-leptos-core/src/identity_bootstrap.rs
          rustfmt --edition 2024 --check --config skip_children=true \
            crates/mycelix-leptos-core/src/lib.rs
          cargo fmt --manifest-path mycelix-personal/apps/leptos/Cargo.toml -- --check
          cargo fmt --manifest-path mycelix-finance/apps/leptos/Cargo.toml -- --check
          cargo fmt --manifest-path mycelix-climate/apps/leptos/Cargo.toml -- --check
      - name: Run native identity-state and bootstrap-policy tests
        run: cargo test --manifest-path crates/mycelix-leptos-core/Cargo.toml --locked --lib
      - name: Install wasm-pack for browser test execution
        run: cargo install wasm-pack --locked
      - name: Verify browser runner tools are present
        shell: bash
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
          command -v chromedriver
      - name: Execute WebCrypto and identity-storage tests in headless Chrome
        env:
          WASM_BINDGEN_TEST_TIMEOUT: "120"
        shell: bash
        run: |
          lock_before="$(sha256sum crates/mycelix-leptos-core/Cargo.lock | cut -d ' ' -f1)"
          wasm-pack test --headless --chrome crates/mycelix-leptos-core
          lock_after="$(sha256sum crates/mycelix-leptos-core/Cargo.lock | cut -d ' ' -f1)"
          if [[ "$lock_before" != "$lock_after" ]]; then
            echo "Browser test changed the generated dependency lockfile" >&2
            exit 1
          fi
      - name: Compile browser-only identity tests for WASM (diagnostic)
        run: cargo test --manifest-path crates/mycelix-leptos-core/Cargo.toml --locked --target wasm32-unknown-unknown --lib --no-run
      - name: Compile shared identity core for WASM
        run: cargo check --manifest-path crates/mycelix-leptos-core/Cargo.toml --locked --target wasm32-unknown-unknown
      - name: Run strict Personal app Clippy
        run: cargo clippy --manifest-path mycelix-personal/apps/leptos/Cargo.toml --locked --all-targets -- -D warnings
      - name: Compile Personal app for WASM
        run: cargo check --manifest-path mycelix-personal/apps/leptos/Cargo.toml --locked --target wasm32-unknown-unknown
      - name: Run strict Finance app Clippy
        run: cargo clippy --manifest-path mycelix-finance/apps/leptos/Cargo.toml --locked --all-targets -- -D warnings
      - name: Compile Finance app for WASM
        run: cargo check --manifest-path mycelix-finance/apps/leptos/Cargo.toml --locked --target wasm32-unknown-unknown
      - name: Run strict Climate app Clippy
        run: cargo clippy --manifest-path mycelix-climate/apps/leptos/Cargo.toml --locked --all-targets -- -D warnings
      - name: Compile Climate app for WASM
        run: cargo check --manifest-path mycelix-climate/apps/leptos/Cargo.toml --locked --target wasm32-unknown-unknown
