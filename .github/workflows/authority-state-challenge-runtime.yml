name: Authority State Probe Runtime

on:
  pull_request:
    paths:
      - 'mycelix-governance/zomes/authority-state-challenge/**'
      - 'mycelix-governance/Cargo.toml'
      - 'mycelix-governance/dna/dna.yaml'
      - 'crates/mycelix-authority-state-coverage-context/**'
      - 'crates/mycelix-authority-state-coverage/**'
      - 'crates/mycelix-authority-freshness/**'
      - '.github/workflows/authority-state-challenge-runtime.yml'
  push:
    branches:
      - 'security/authority-state-probe-runtime-v0.1'

permissions:
  contents: read

concurrency:
  group: authority-state-probe-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: Private entropy probe native + WASM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Format
        working-directory: mycelix-governance
        run: cargo fmt --package authority_state_challenge_integrity --package authority_state_challenge -- --check
      - name: Native tests
        working-directory: mycelix-governance
        run: cargo test --package authority_state_challenge_integrity --package authority_state_challenge --all-targets
      - name: Native clippy
        working-directory: mycelix-governance
        run: cargo clippy --package authority_state_challenge_integrity --package authority_state_challenge --all-targets -- -D warnings
      - name: WASM builds
        working-directory: mycelix-governance
        run: |
          cargo check --release --target wasm32-unknown-unknown --package authority_state_challenge_integrity
          cargo check --release --target wasm32-unknown-unknown --package authority_state_challenge

  containment:
    name: Probe remains private, non-authoritative, and unprovisioned
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Audit probe boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          integrity = Path('mycelix-governance/zomes/authority-state-challenge/integrity/src/lib.rs').read_text()
          coordinator = Path('mycelix-governance/zomes/authority-state-challenge/coordinator/src/lib.rs').read_text()
          invariants = Path('mycelix-governance/zomes/authority-state-challenge/INVARIANTS.md').read_text()
          dna = Path('mycelix-governance/dna/dna.yaml').read_text()

          required_integrity = [
              '#[entry_type(visibility = "private")]',
              'ChallengeEntropyRecord',
              'AuthorityStateChallengeRecord',
              'entropy_nonce_digest',
              'POLICY_IDENTITY_PROFILE',
              'CONTEXT_POLICY_PROFILE',
              'randomness_proof_ref != self.entropy_action.to_string()',
              'authority-state probe records are immutable',
          ]
          for token in required_integrity:
              assert token in integrity, token

          required_coordinator = [
              'pub struct IssueAuthorityStateProbeRequest',
              'issue_authority_state_probe',
              'verify_issued_authority_state_probe',
              'random_bytes(ENTROPY_BYTES)',
              'create_entry(EntryTypes::ChallengeEntropy',
              'get_local_record(&entropy_action)',
              'query(ChainQueryFilter::new().include_entries(true))',
              'verified_nonce_digest: challenge.nonce_digest',
              'verified_randomness_proof_ref: challenge.randomness_proof_ref.clone()',
              'verified_challenge_issuer_ref: challenge.challenge_issuer_ref.clone()',
              'candidate_policy_selection_grants_authority: false',
              'probe_grants_authority: false',
              'operational: false',
          ]
          for token in required_coordinator:
              assert token in coordinator, token

          # The caller may select candidate policy identities/lifetime, but never
          # randomness, proof identity, issue time, or issuer provenance.
          request_body = coordinator.split('pub struct IssueAuthorityStateProbeRequest', 1)[1].split('}', 1)[0].lower()
          for forbidden in ['entropy', 'nonce', 'randomness_proof', 'issued_at', 'issuer']:
              assert forbidden not in request_body, forbidden

          # Probe generation/verification must not recurse into the currentness
          # plane it exists to observe.
          for forbidden in [
              'authority_state_context_policy_verifier',
              'resolve_challenge_context',
              'authority_current_freshness_verifier',
              'resolve_current_freshness',
              'authority_challenge_issuer_grant_verifier',
              'context_verification_ref',
          ]:
              assert forbidden not in coordinator, forbidden

          for name in ['authority_state_challenge_integrity', 'authority_state_challenge']:
              assert f'name: {name}' not in dna, f'unqualified probe zome packaged: {name}'

          lower_inv = invariants.lower()
          assert 'a probe is **not authority**' in invariants
          assert 'bootstrap-cycle rule' in lower_inv
          assert 'probe verification proves randomness/provenance only' in lower_inv
          assert 'deliberately unprovisioned' in lower_inv

          lowered = coordinator.lower()
          for forbidden in ['phi', 'reputation', 'model_score', 'guardian', 'execute_actions']:
              assert forbidden not in lowered, forbidden
          print('PASS: probe uses private host entropy, binds candidate context exactly, grants no authority, and remains unprovisioned')
          PY
