name: CivOS executable qualification contract

on:
  pull_request:
    paths:
      - "docs/research/CIVOS_MULTI_AGENT_QUALIFICATION_V0.md"
      - "docs/research/civos-multi-agent-scenarios-v0.json"
      - "docs/research/civos-multi-agent-scenarios-v0.schema.json"
      - "docs/research/civos-multi-agent-receipt-v0.schema.json"
      - "tools/civos-qualification/**"
      - ".github/workflows/civos-qualification-contract.yml"
  push:
    branches: [main]
    paths:
      - "docs/research/CIVOS_MULTI_AGENT_QUALIFICATION_V0.md"
      - "docs/research/civos-multi-agent-scenarios-v0.json"
      - "docs/research/civos-multi-agent-scenarios-v0.schema.json"
      - "docs/research/civos-multi-agent-receipt-v0.schema.json"
      - "tools/civos-qualification/**"
      - ".github/workflows/civos-qualification-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civos-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Exact-head contract, schema and fail-closed evaluator tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tools/civos-qualification -> target
      - name: Assert exact source head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_SHA" ]]; then
            echo "Expected source head $EXPECTED_SHA, checked out $actual" >&2
            exit 1
          fi
      - name: Generate and fingerprint tool dependency lockfile
        run: |
          cargo generate-lockfile --manifest-path tools/civos-qualification/Cargo.toml
          sha256sum tools/civos-qualification/Cargo.lock
      - name: Check formatting
        run: cargo fmt --manifest-path tools/civos-qualification/Cargo.toml -- --check
      - name: Test schema, duplicate controls, evidence links and fail-closed outcomes
        run: cargo test --manifest-path tools/civos-qualification/Cargo.toml --locked
      - name: Validate shipped CivOS scenario corpus
        run: |
          cargo run --manifest-path tools/civos-qualification/Cargo.toml --locked -- \
            validate-contract \
            --corpus docs/research/civos-multi-agent-scenarios-v0.json \
            --schema docs/research/civos-multi-agent-scenarios-v0.schema.json
      - name: Run strict Clippy
        run: cargo clippy --manifest-path tools/civos-qualification/Cargo.toml --locked --all-targets -- -D warnings
