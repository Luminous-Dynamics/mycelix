name: Identity Historical Activation Time Policy Lineage V2

on:
  pull_request:
    paths:
      - 'mycelix-workspace/mycelix-identity/Cargo.toml'
      - 'mycelix-workspace/mycelix-identity/crates/historical-activation-time-policy-lineage-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/historical-activation-time-policy-transition-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/identity-authority-domain-policy/**'
      - '.github/workflows/identity-historical-activation-time-policy-lineage-v2.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-workspace/mycelix-identity/Cargo.toml'
      - 'mycelix-workspace/mycelix-identity/crates/historical-activation-time-policy-lineage-policy/**'
      - '.github/workflows/identity-historical-activation-time-policy-lineage-v2.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify-time-policy-lineage-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Assert topology-only lineage boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          root = Path('mycelix-workspace/mycelix-identity')
          member = 'crates/historical-activation-time-policy-lineage-policy'
          workspace = tomllib.loads((root / 'Cargo.toml').read_text())['workspace']['members']
          if member not in workspace:
              raise SystemExit(f'ERROR: {member} is not an explicit Identity workspace member')

          manifest = tomllib.loads((root / member / 'Cargo.toml').read_text())
          deps = manifest.get('dependencies', {})
          expected = {
              'mycelix-historical-activation-time-policy-transition-policy',
              'mycelix-identity-authority-domain-policy',
              'sha2',
          }
          if set(deps) != expected:
              raise SystemExit(f'ERROR: lineage runtime dependency drift: {sorted(deps)}')
          expected_paths = {
              'mycelix-historical-activation-time-policy-transition-policy': '../historical-activation-time-policy-transition-policy',
              'mycelix-identity-authority-domain-policy': '../identity-authority-domain-policy',
          }
          for dep, path in expected_paths.items():
              if deps[dep].get('path') != path:
                  raise SystemExit(f'ERROR: {dep} path drifted')
          if deps['sha2'].get('workspace') is not True:
              raise SystemExit('ERROR: lineage theorem must use workspace sha2')

          dev = manifest.get('dev-dependencies', {})
          expected_dev = {
              'mycelix-crypto',
              'mycelix-historical-activation-time-authority-policy',
              'mycelix-historical-activation-time-receipt-policy',
          }
          if set(dev) != expected_dev:
              raise SystemExit(f'ERROR: lineage dev dependency drift: {sorted(dev)}')

          text = (root / member / 'src/lib.rs').read_text()
          required = [
              '#![forbid(unsafe_code)]',
              'QualifiedObservedHistoricalActivationTimePolicyLineageV2',
              'MAX_TIME_POLICY_TRANSITIONS_V2',
              'HISTORICAL_ACTIVATION_TIME_POLICY_LINEAGE_DOMAIN_V2',
              'mycelix:identity:historical-activation-time-policy-lineage:v2\\0',
              'qualify_observed_historical_activation_time_policy_lineage_v2',
              'ordered.sort_by_key(|transition| transition.transition_generation())',
              'let Some(root) = ordered.first().copied()',
              'let Some(terminal) = ordered.last().copied()',
              'DuplicateTransitionGeneration',
              'DuplicateTransitionDigest',
              'RootGenerationMissing',
              'GenerationGap',
              'PredecessorMismatch',
              'AdoptWhilePolicyActive',
              'SupersedePriorPolicyMismatch',
              'RevokePriorPolicyMismatch',
              '0xba, 0x98, 0xf1, 0x02',
              'unordered_adopt_supersede_chain_qualifies_with_frozen_terminal_digest',
              'duplicate_generation_is_a_conflict_not_a_winner_selection',
              'qualified_lineage_fields_are_private',
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'ERROR: lineage invariant missing: {needle!r}')

          adversarial_path = root / member / 'tests/adversarial_lineage.rs'
          if not adversarial_path.is_file():
              raise SystemExit('ERROR: adversarial lineage integration corpus is missing')
          adversarial = adversarial_path.read_text()
          for needle in [
              'generation_gap_fails_closed_even_when_predecessor_digest_points_to_root',
              'predecessor_substitution_fails_closed',
              'terminal_revocation_is_explicit_none_not_positive_policy_authority',
          ]:
              if needle not in adversarial:
                  raise SystemExit(f'ERROR: adversarial lineage vector missing: {needle!r}')

          result_start = text.index('pub struct QualifiedObservedHistoricalActivationTimePolicyLineageV2')
          result_end = text.index('impl QualifiedObservedHistoricalActivationTimePolicyLineageV2', result_start)
          result_body = text[result_start:result_end]
          for field in [
              'pub authority_domain_sha256:',
              'pub terminal_transition_sha256:',
              'pub terminal_policy_sha256:',
              'pub lineage_digest_sha256:',
          ]:
              if field in result_body:
                  raise SystemExit(f'ERROR: lineage capability is caller-forgeable: {field}')

          production = text[:text.index('#[cfg(test)]')]
          lower = production.lower()
          for forbidden in [
              'use hdk', 'hdk::', '#[hdk_extern]', 'get_agent_activity(', 'get_links(',
              'sys_time(', 'std::time', 'max_by_key', 'systemtime', 'instant::now',
              'verify_strict', '.verify(', 'positive_evidence',
              '.expect(', '.unwrap(', 'panic!(', 'unreachable!(',
          ]:
              if forbidden in lower:
                  raise SystemExit(f'ERROR: authority or panic surface leaked into lineage theorem: {forbidden!r}')
          PY

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-workspace/mycelix-identity

      - name: Check formatting
        run: |
          cargo fmt --manifest-path mycelix-workspace/mycelix-identity/crates/historical-activation-time-policy-lineage-policy/Cargo.toml -- --check

      - name: Test transition theorem
        run: |
          cargo test --manifest-path mycelix-workspace/mycelix-identity/crates/historical-activation-time-policy-transition-policy/Cargo.toml

      - name: Test lineage theorem and adversarial corpus
        run: |
          cargo test --manifest-path mycelix-workspace/mycelix-identity/crates/historical-activation-time-policy-lineage-policy/Cargo.toml

      - name: Check lineage theorem for wasm32
        run: |
          cargo check --manifest-path mycelix-workspace/mycelix-identity/crates/historical-activation-time-policy-lineage-policy/Cargo.toml --target wasm32-unknown-unknown
