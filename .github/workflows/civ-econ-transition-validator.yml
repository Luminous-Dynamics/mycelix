name: CIV-ECON Transition Validator

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "mycelix-workspace/simulations/civ-econ-transition-validator/**"
      - "docs/research/civ/CIV-ECON-001A_*"
      - ".github/workflows/civ-econ-transition-validator.yml"

permissions:
  contents: read

concurrency:
  group: civ-econ-transition-validator-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  QUALIFIED_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  reference-validator:
    name: Exact-head Rust reference tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          persist-credentials: false

      - name: Assert exact qualification subject
        run: test "$(git rev-parse HEAD)" = "${QUALIFIED_SHA}"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # master @ 2025-08-23
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Assert Rust toolchain identity
        run: |
          test "$(rustc +1.96.0 --version)" = "rustc 1.96.0 (ac68faa20 2026-05-25)"
          rustc +1.96.0 --version --verbose
          cargo +1.96.0 --version
          rustfmt +1.96.0 --version

      - name: Validate JSON specification artifacts and corpus identity
        run: |
          python3 -m json.tool docs/research/civ/CIV-ECON-001A_TRANSITION_MANIFEST_SCHEMA_V1.json > /dev/null
          python3 -m json.tool docs/research/civ/CIV-ECON-001A_TRANSITION_ADVERSARIAL_CORPUS_V1.json > /dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path

          corpus = json.loads(Path("docs/research/civ/CIV-ECON-001A_TRANSITION_ADVERSARIAL_CORPUS_V1.json").read_text())
          ids = [case["id"] for case in corpus["cases"]]
          assert len(ids) == 24, f"expected 24 cases, got {len(ids)}"
          assert len(set(ids)) == len(ids), "duplicate adversarial case IDs"
          assert all(case.get("expected") and case.get("invariants") for case in corpus["cases"])
          schema = json.loads(Path("docs/research/civ/CIV-ECON-001A_TRANSITION_MANIFEST_SCHEMA_V1.json").read_text())
          assert schema["$schema"] == "https://json-schema.org/draft/2020-12/schema"
          assert len(schema["allOf"]) >= 12, "stage-specific fail-closed constraints missing"
          assert schema["properties"]["scope"]["items"]["type"] == "object"
          assert "kind" in schema["properties"]["scope"]["items"]["required"]
          simulation = schema["properties"]["simulation"]
          assert "output_digest" in simulation["properties"]
          evaluation = schema["properties"]["evaluation"]
          assert "subject_output_digest" in evaluation["properties"]
          assert "report_digest" in evaluation["properties"]
          assert "output_digest" not in evaluation["properties"], "simulation output and evaluator report must remain distinct"
          PY

      - name: Run dependency-free journal source contract preflight
        env:
          JOURNAL_AUDIT_REPORT_PATH: ${{ runner.temp }}/journal-source-contract-report.json
        run: python3 mycelix-workspace/simulations/civ-econ-transition-validator/scripts/audit_journal_source_contract.py

      - name: Validate persisted journal source-contract report JSON
        if: always()
        run: |
          report="${{ runner.temp }}/journal-source-contract-report.json"
          test -s "$report"
          python3 -m json.tool "$report" > /dev/null

      - name: Run dependency-free validator tests
        run: cargo +1.96.0 test --manifest-path mycelix-workspace/simulations/civ-econ-transition-validator/Cargo.toml --locked --all-targets

      - name: Run strict Clippy
        run: cargo +1.96.0 clippy --manifest-path mycelix-workspace/simulations/civ-econ-transition-validator/Cargo.toml --locked --all-targets -- -D warnings

      - name: Check Rust formatting
        run: cargo +1.96.0 fmt --manifest-path mycelix-workspace/simulations/civ-econ-transition-validator/Cargo.toml --all -- --check

      - name: Run journal replay smoke matrix
        run: |
          manifest=mycelix-workspace/simulations/civ-econ-transition-validator/Cargo.toml
          report="$RUNNER_TEMP/journal-replay-smoke.log"
          : > "$report"
          echo "qualified_sha=$QUALIFIED_SHA" | tee -a "$report"
          echo "github_run_id=${GITHUB_RUN_ID:-unknown}" | tee -a "$report"
          cargo +1.96.0 build --release --manifest-path "$manifest" --locked --bin journal-replay-scale 2>&1 | tee -a "$report"
          echo "runner_image=${ImageOS:-unknown} ${ImageVersion:-unknown}" | tee -a "$report"
          echo "kernel=$(uname -a)" | tee -a "$report"
          echo "rustc=$(rustc +1.96.0 --version)" | tee -a "$report"
          df -T "$RUNNER_TEMP" 2>&1 | tee -a "$report"
          bin=mycelix-workspace/simulations/civ-econ-transition-validator/target/release/journal-replay-scale
          for scenario in pending indeterminate acknowledged reconciled; do
            echo "::group::journal replay scale / 10000 effects / $scenario" | tee -a "$report"
            /usr/bin/time -v "$bin" 10000 "$scenario" 2>&1 | tee -a "$report"
            echo "::endgroup::" | tee -a "$report"
          done

      - name: Upload journal qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: journal-qualification-evidence-${{ github.run_id }}-${{ env.QUALIFIED_SHA }}
          path: |
            ${{ runner.temp }}/journal-source-contract-report.json
            ${{ runner.temp }}/journal-replay-smoke.log
          if-no-files-found: warn
          retention-days: 14
