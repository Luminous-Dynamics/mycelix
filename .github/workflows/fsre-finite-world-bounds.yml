name: FSRE finite-world bounds

on:
  pull_request:
    paths:
      - 'tools/fsre-finite-world-bounds/**'
      - 'research/fsre/FINITE_WORLD_PARTIAL_IDENTIFICATION_BENCHMARK_V0_1.md'
      - 'research/fsre/FSRE_INDUSTRY_COMPARISON_AND_BENCHMARK_PROTOCOL_V0_2.md'
      - '.github/workflows/fsre-finite-world-bounds.yml'
  push:
    branches: [main]
    paths:
      - 'tools/fsre-finite-world-bounds/**'
      - 'research/fsre/FINITE_WORLD_PARTIAL_IDENTIFICATION_BENCHMARK_V0_1.md'
      - '.github/workflows/fsre-finite-world-bounds.yml'

permissions:
  contents: read

jobs:
  finite-world:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path tools/fsre-finite-world-bounds/Cargo.toml
      - name: Tests
        run: cargo test --locked --offline --manifest-path tools/fsre-finite-world-bounds/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --offline --manifest-path tools/fsre-finite-world-bounds/Cargo.toml --all-targets -- -D warnings
      - name: Deterministic CLI replay
        run: |
          cargo run --quiet --locked --offline --manifest-path tools/fsre-finite-world-bounds/Cargo.toml -- tools/fsre-finite-world-bounds/examples/water-restoration.psv > /tmp/bounds-a.txt
          cargo run --quiet --locked --offline --manifest-path tools/fsre-finite-world-bounds/Cargo.toml -- tools/fsre-finite-world-bounds/examples/water-restoration.psv > /tmp/bounds-b.txt
          cmp /tmp/bounds-a.txt /tmp/bounds-b.txt
