name: Constitutional Payments Provider Journal Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - 'mycelix-governance/Cargo.toml'
      - 'mycelix-governance/crates/constitutional-payments-provider-journal/**'
      - 'mycelix-governance/specs/constitutional-payments-provider-journal.v1.json'
      - 'mycelix-governance/specs/constitutional-payments-provider-journal.v1.schema.json'
      - 'mycelix-governance/docs/CONSTITUTIONAL_PAYMENTS_PROVIDER_JOURNAL_V0_1.md'
      - 'mycelix-governance/tools/formal/validate_constitutional_payments_provider_journal.py'
      - '.github/workflows/constitutional-payments-provider-journal-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payments-provider-journal-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NIXPKGS_REV: a50bf0c1b07873c1a53892292017041a8f0a1288
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  EXPECTED_SEMANTIC_HEAD: 1d0dc3f07ac29dccba9f33b45aef13380ecdb870

jobs:
  qualify:
    name: Exact-head payments provider F1B0 journal
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact raw head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false

      - name: Bind exact verifier lineage and semantic surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SEMANTIC_HEAD"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/constitutional-payments-provider-journal-qualification.yml"

          rm -rf payments-provider-journal-evidence
          mkdir -p payments-provider-journal-evidence
          printf '%s\n' "$EXPECTED_HEAD" > payments-provider-journal-evidence/expected-head.txt
          printf '%s\n' "$EXPECTED_SEMANTIC_HEAD" > payments-provider-journal-evidence/expected-semantic-head.txt

          cat > payments-provider-journal-evidence/expected-semantic-files.txt <<'EOF'
          mycelix-governance/Cargo.toml
          mycelix-governance/crates/constitutional-payments-provider-journal/Cargo.toml
          mycelix-governance/crates/constitutional-payments-provider-journal/src/lib.rs
          mycelix-governance/docs/CONSTITUTIONAL_PAYMENTS_PROVIDER_JOURNAL_V0_1.md
          mycelix-governance/specs/constitutional-payments-provider-journal.v1.json
          mycelix-governance/specs/constitutional-payments-provider-journal.v1.schema.json
          mycelix-governance/tools/formal/validate_constitutional_payments_provider_journal.py
          EOF
          sed -i 's/^          //' payments-provider-journal-evidence/expected-semantic-files.txt

          git diff --name-only "$EXPECTED_SEMANTIC_HEAD^" "$EXPECTED_SEMANTIC_HEAD" | sort \
            > payments-provider-journal-evidence/actual-semantic-files.txt
          sort payments-provider-journal-evidence/expected-semantic-files.txt \
            > payments-provider-journal-evidence/expected-semantic-files.sorted.txt
          cmp payments-provider-journal-evidence/expected-semantic-files.sorted.txt \
              payments-provider-journal-evidence/actual-semantic-files.txt

          if grep -E '^mycelix-(finance|governance)/.*zomes/' payments-provider-journal-evidence/actual-semantic-files.txt; then
            echo "F1B0 semantic head unexpectedly changes Holochain zomes" >&2
            exit 1
          fi

          git hash-object $(cat payments-provider-journal-evidence/expected-semantic-files.txt) \
            > payments-provider-journal-evidence/source-hashes-before.txt

      - name: Install Nix
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Validate closed F1B0 journal contract
        shell: bash
        run: |
          set -euo pipefail
          nix shell \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#python3" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#git" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#bash" \
            --command bash -euo pipefail -c '
              python3 --version | tee payments-provider-journal-evidence/python-version.txt
              git --version | tee payments-provider-journal-evidence/git-version.txt
              python3 -m py_compile mycelix-governance/tools/formal/validate_constitutional_payments_provider_journal.py
              python3 mycelix-governance/tools/formal/validate_constitutional_payments_provider_journal.py --self-test \
                2>&1 | tee payments-provider-journal-evidence/source-validator.log
            '

      - name: Compile and test exact F1B0 subject
        shell: bash
        run: |
          set -euo pipefail
          nix shell \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#cargo" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#rustc" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#rustfmt" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#clippy" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#coreutils" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#bash" \
            --command bash -euo pipefail -c '
              rustc --version | tee payments-provider-journal-evidence/rustc-version.txt
              cargo --version | tee payments-provider-journal-evidence/cargo-version.txt
              rustfmt --version | tee payments-provider-journal-evidence/rustfmt-version.txt
              cargo clippy --version | tee payments-provider-journal-evidence/clippy-version.txt

              cargo fmt --manifest-path mycelix-governance/Cargo.toml \
                --package constitutional-payments-provider-journal -- --check \
                2>&1 | tee payments-provider-journal-evidence/cargo-fmt.log
              cargo check --manifest-path \
                mycelix-governance/crates/constitutional-payments-provider-journal/Cargo.toml \
                --all-targets 2>&1 | tee payments-provider-journal-evidence/cargo-check.log
              cargo test --manifest-path \
                mycelix-governance/crates/constitutional-payments-provider-journal/Cargo.toml \
                --all-targets 2>&1 | tee payments-provider-journal-evidence/cargo-test.log
              cargo clippy --manifest-path \
                mycelix-governance/crates/constitutional-payments-provider-journal/Cargo.toml \
                --all-targets -- -D warnings \
                2>&1 | tee payments-provider-journal-evidence/cargo-clippy.log

              cp mycelix-governance/Cargo.lock payments-provider-journal-evidence/derived-Cargo.lock
              sha256sum payments-provider-journal-evidence/derived-Cargo.lock \
                > payments-provider-journal-evidence/derived-Cargo.lock.sha256
            '

      - name: Compile-valid F1B0 journal mutation controls
        shell: bash
        run: |
          set -euo pipefail
          nix shell \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#python3" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#cargo" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#rustc" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#bash" \
            --command bash -euo pipefail -c '
          python3 - <<"PY"
          from pathlib import Path
          import subprocess

          ROOT = Path.cwd()
          SRC = ROOT / "mycelix-governance/crates/constitutional-payments-provider-journal/src/lib.rs"
          MANIFEST = ROOT / "mycelix-governance/crates/constitutional-payments-provider-journal/Cargo.toml"
          EVIDENCE = ROOT / "payments-provider-journal-evidence"
          original = SRC.read_text()

          def restore():
              SRC.write_text(original)

          def replace_after(start, old, new, occurrence=1):
              s = SRC.read_text()
              pos = s.index(start)
              search = pos
              found = -1
              for _ in range(occurrence):
                  found = s.index(old, search)
                  search = found + len(old)
              SRC.write_text(s[:found] + new + s[found + len(old):])

          def replace_once(old, new):
              s = SRC.read_text()
              pos = s.index(old)
              SRC.write_text(s[:pos] + new + s[pos + len(old):])

          def run(cmd, log):
              p = subprocess.run(cmd, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              (EVIDENCE / log).write_text(p.stdout)
              return p.returncode

          def mutant(name, mutate, test_filter):
              restore()
              mutate()
              if run(["cargo", "check", "--manifest-path", str(MANIFEST), "--all-targets"], f"mutant-{name}-check.log") != 0:
                  raise SystemExit(f"{name}: mutant did not compile")
              if run(["cargo", "test", "--manifest-path", str(MANIFEST), test_filter], f"mutant-{name}-test.log") == 0:
                  raise SystemExit(f"{name}: mutant survived")
              (EVIDENCE / f"mutant-{name}.txt").write_text("PASS\n")

          try:
              mutant(
                  "wall-clock-record-identity",
                  lambda: replace_after(
                      "fn compute_commitment(&self)",
                      "        h.update(JOURNAL_RECORD_DOMAIN);\n",
                      "        h.update(JOURNAL_RECORD_DOMAIN);\n        h.update(&self.recorded_at_unix_ms.to_be_bytes());\n",
                  ),
                  "journal_record_identity_excludes_wall_clock",
              )

              mutant(
                  "blind-unknown-redispatch",
                  lambda: replace_after(
                      "pub fn append_dispatch",
                      "            ProviderQueryResult::UnknownOutcome { .. } => {\n                return Err(violation(\n                    \"UnknownOutcome blocks another dispatch until qualified replay authority is consumed\",\n                ));\n            }\n",
                      "            ProviderQueryResult::UnknownOutcome { .. } => {}\n",
                  ),
                  "unknown_outcome_blocks_blind_redispatch",
              )

              def mutate_predecessor():
                  replace_after(
                      "fn compute_commitment(&self)",
                      "        push_optional_str(&mut h, self.previous_record_commitment.as_deref());\n",
                      "        push_optional_str(&mut h, None);\n",
                  )
                  replace_after(
                      "fn validate_chain_only(&self)",
                      "                if record.previous_record_commitment.as_deref() != Some(predecessor.as_str()) {\n",
                      "                if false && record.previous_record_commitment.as_deref() != Some(predecessor.as_str()) {\n",
                  )
              mutant(
                  "predecessor-binding",
                  mutate_predecessor,
                  "journal_chain_detects_tampering",
              )

              mutant(
                  "stale-no-effect-demotion",
                  lambda: replace_after(
                      "ProviderOutcomeEvidence::KnownNoEffect {",
                      "                                } => *attempt_ordinal\n                                    > observation.covers_through_attempt_ordinal,\n",
                      "                                } => *attempt_ordinal\n                                    < observation.covers_through_attempt_ordinal,\n",
                      1,
                  ),
                  "stale_no_effect_does_not_demote_newer_in_flight_attempt",
              )

              mutant(
                  "stale-unknown-demotion",
                  lambda: replace_after(
                      "ProviderOutcomeEvidence::UnknownOutcome {",
                      "                                } => *attempt_ordinal\n                                    > observation.covers_through_attempt_ordinal,\n",
                      "                                } => *attempt_ordinal\n                                    < observation.covers_through_attempt_ordinal,\n",
                      1,
                  ),
                  "stale_unknown_does_not_demote_newer_in_flight_attempt",
              )

              mutant(
                  "non-sticky-integrity-halt",
                  lambda: replace_once(
                      "        if let Some(fault) = halt {\n            Ok(ProviderQueryResult::IntegrityHalted { fault })\n",
                      "        if false {\n            let fault: JournalIntegrityFault = unreachable!();\n            Ok(ProviderQueryResult::IntegrityHalted { fault })\n",
                  ),
                  "integrity_halt_is_sticky_under_later_forensic_observation",
              )

              mutant(
                  "late-success-no-effect-conflict",
                  lambda: replace_after(
                      "ProviderOutcomeEvidence::KnownSuccess {",
                      "                                prior.covers_through_attempt_ordinal\n                                    >= observation.covers_through_attempt_ordinal\n",
                      "                                false && prior.covers_through_attempt_ordinal\n                                    >= observation.covers_through_attempt_ordinal\n",
                      1,
                  ),
                  "late_success_for_reconciled_attempt_halts",
              )

              mutant(
                  "conflicting-success-receipts",
                  lambda: replace_after(
                      "ProviderOutcomeEvidence::KnownSuccess {",
                      "                                prior.observation.outcome != observation.observation.outcome\n",
                      "                                false && prior.observation.outcome != observation.observation.outcome\n",
                      1,
                  ),
                  "conflicting_success_receipts_halt",
              )
          finally:
              restore()
          PY
            '

      - name: Verify exact semantic immutability and postflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git hash-object $(cat payments-provider-journal-evidence/expected-semantic-files.txt) \
            > payments-provider-journal-evidence/source-hashes-after.txt
          cmp payments-provider-journal-evidence/source-hashes-before.txt \
              payments-provider-journal-evidence/source-hashes-after.txt
          git diff --exit-code -- $(cat payments-provider-journal-evidence/expected-semantic-files.txt)
          if git ls-files --error-unmatch mycelix-governance/Cargo.lock >/dev/null 2>&1; then
            git checkout -- mycelix-governance/Cargo.lock
          fi
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: constitutional-payments-provider-journal-${{ env.EXPECTED_HEAD }}
          path: payments-provider-journal-evidence
          if-no-files-found: error
          retention-days: 30
