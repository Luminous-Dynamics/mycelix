name: Governance Proposal Authority

on:
  pull_request:
    paths:
      - 'mycelix-governance/zomes/proposal-authority/**'
      - 'mycelix-governance/Cargo.toml'
      - 'mycelix-governance/dna/dna.yaml'
      - 'crates/mycelix-governance-authority/**'
      - 'crates/mycelix-institutional-core/**'
  push:
    branches: [main]
    paths:
      - 'mycelix-governance/zomes/proposal-authority/**'
      - 'mycelix-governance/Cargo.toml'
      - 'mycelix-governance/dna/dna.yaml'
      - 'crates/mycelix-governance-authority/**'
      - 'crates/mycelix-institutional-core/**'

jobs:
  proposal-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-governance

      - name: Format proposal authority zomes
        run: |
          cd mycelix-governance
          cargo fmt --all --check

      - name: Native tests
        run: |
          cd mycelix-governance
          cargo test -p proposal_authority_integrity -p proposal_authority

      - name: WASM checks
        run: |
          cd mycelix-governance
          cargo check -p proposal_authority_integrity --target wasm32-unknown-unknown
          cargo check -p proposal_authority --target wasm32-unknown-unknown
