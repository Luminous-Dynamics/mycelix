name: ADMIN-002 Currentness Provider Policy Identity

on:
  pull_request:
    paths:
      - 'crates/mycelix-procedure-policy-currentness-provider-identity/**'
      - '.github/workflows/admin-002-currentness-provider-policy-identity.yml'
  push:
    branches:
      - 'feat/admin-002-currentness-provider-policy-identity-v0.1'

permissions:
  contents: read

concurrency:
  group: admin-002-currentness-provider-policy-identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Canonical procedure-policy currentness-provider policy identity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Toolchain identity
        run: |
          rustc --version --verbose
          cargo --version

      - name: Preserve exact qualified currentness parent
        run: |
          test "$(git hash-object crates/mycelix-procedure-policy-currentness/src/lib.rs)" = "e58f3c6cfab61a28c8b6980b1439a60a76202d23"
          test "$(git hash-object crates/mycelix-procedure-policy-currentness/Cargo.toml)" = "f11acbfbb88432248336ece35724e46fd83cdf66"
          test "$(git hash-object crates/mycelix-procedure-policy-identity/src/lib.rs)" = "42f1c0fb76a67a993c208866e46111dc11a511be"

      - name: Dependency and identity-profile boundary
        run: |
          manifest=crates/mycelix-procedure-policy-currentness-provider-identity/Cargo.toml
          src=crates/mycelix-procedure-policy-currentness-provider-identity/src/lib.rs
          profile=crates/mycelix-procedure-policy-currentness-provider-identity/PROFILE_V1.md

          grep -F 'mycelix-procedure-policy-currentness = { path = "../mycelix-procedure-policy-currentness" }' "$manifest"
          grep -F 'mycelix-institutional-core = { path = "../mycelix-institutional-core" }' "$manifest"
          grep -F 'mycelix-procedure-policy-currentness-provider-v1-blake3-framed-semantic' "$src"
          grep -F 'mycelix/administrative-procedure/currentness-provider-policy/v1' "$src"
          grep -F 'mycelix-procedure-policy-currentness-provider-v1-blake3-framed-semantic' "$profile"
          grep -F 'u64_le(byte_length) || raw_bytes' "$profile"

      - name: Trust-root and sovereignty separation audit
        run: |
          src=crates/mycelix-procedure-policy-currentness-provider-identity/src/lib.rs
          inv=crates/mycelix-procedure-policy-currentness-provider-identity/INVARIANTS.md

          grep -F 'pub struct CanonicalCurrentnessProviderPolicyIdentity' "$src"
          grep -F 'pub struct QualifiedCurrentnessProviderPolicyIdentity' "$src"
          grep -F 'DuplicateAcceptedIssuer' "$src"
          grep -F 'DuplicateEvidenceRequirement' "$src"
          grep -F 'grants_policy_currentness' "$src"
          grep -F 'grants_administrative_decision_authority' "$src"
          grep -F 'grants_external_effect_authority' "$src"

          ! grep -Eiq 'qualify_current_procedure_policy|evaluate_authority|get_links|get_details|hdk::|hdi::|zome|latest_record|latest-record|dispatch|execute_effect' "$src"
          ! grep -Eiq 'std::fs|std::net|std::process|std::env|SystemTime|thread_rng|rand::' "$src"

          grep -F 'Verifier selection is itself policy' "$inv"
          grep -F 'No recursive bootstrap' "$inv"
          grep -F 'Identity is not adoption/currentness' "$inv"

      - name: Format owned source
        run: |
          cargo fmt --manifest-path crates/mycelix-procedure-policy-currentness-provider-identity/Cargo.toml -- --check

      - name: Isolated executable qualification
        run: |
          qroot="$(mktemp -d)"
          mkdir -p "$qroot/crates"
          cp -a crates/mycelix-institutional-core "$qroot/crates/"
          cp -a crates/mycelix-administrative-procedure "$qroot/crates/"
          cp -a crates/mycelix-procedure-policy-identity "$qroot/crates/"
          cp -a crates/mycelix-procedure-policy-currentness "$qroot/crates/"
          cp -a crates/mycelix-procedure-policy-currentness-provider-identity "$qroot/crates/"
          manifest="$qroot/crates/mycelix-procedure-policy-currentness-provider-identity/Cargo.toml"

          cargo test --manifest-path "$manifest" --all-targets
          cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings

      - name: Immutable checkout postflight
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"
