name: Platform Registry Audit

on:
  pull_request:
    paths:
      - "mycelix-workspace/happs/mycelix-unified-happ.yaml"
      - "mycelix-workspace/happs/mycelix-resilience-happ.yaml"
      - "docs/architecture/mycelix-platform-registry-v0.1.json"
      - "docs/architecture/MYCELIX_OTHERROLE_TOPOLOGY_AUDIT_V0_1.schema.json"
      - "mycelix-workspace/tools/platform-registry-audit/**"
      - ".github/workflows/platform-registry-audit.yml"
  push:
    branches: [main]
    paths:
      - "mycelix-workspace/happs/mycelix-unified-happ.yaml"
      - "mycelix-workspace/happs/mycelix-resilience-happ.yaml"
      - "docs/architecture/mycelix-platform-registry-v0.1.json"
      - "docs/architecture/MYCELIX_OTHERROLE_TOPOLOGY_AUDIT_V0_1.schema.json"
      - "mycelix-workspace/tools/platform-registry-audit/**"
      - ".github/workflows/platform-registry-audit.yml"

permissions:
  contents: read

jobs:
  registry-audit:
    name: Verify manifest-derived topology registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt clippy

      - name: Format audit tool
        run: cargo fmt --manifest-path mycelix-workspace/tools/platform-registry-audit/Cargo.toml -- --check

      - name: Test audit tool
        run: cargo test --manifest-path mycelix-workspace/tools/platform-registry-audit/Cargo.toml

      - name: Verify checked-in registry against exact manifests
        run: cargo run --manifest-path mycelix-workspace/tools/platform-registry-audit/Cargo.toml -- --check

      - name: Generate advisory OtherRole topology inventory
        run: cargo run --manifest-path mycelix-workspace/tools/platform-registry-audit/Cargo.toml -- --audit-otherrole > otherrole-topology-report.json

      - name: Check advisory topology report structure
        run: |
          jq -e '
            .schema_version == "mycelix-otherrole-topology-audit-v0.1" and
            .report_kind == "advisory-static-ast-inventory" and
            (.source.tree_sha | test("^[0-9a-f]{40}$")) and
            .scope.source_selection == "git-tracked-files-only-clean-tracked-worktree" and
            (.scope.excluded_path_components | type == "array") and
            .scope.source_selection == "git-tracked-files-only-clean-tracked-worktree" and
            (.scope.excluded_path_components | type == "array") and
            (.call_sites | type == "array") and
            (.scope.nearest_manifest_context_coverage | type == "number")
          ' otherrole-topology-report.json > /dev/null

      - name: Clippy audit tool
        run: cargo clippy --manifest-path mycelix-workspace/tools/platform-registry-audit/Cargo.toml --all-targets -- -D warnings

      - name: Upload advisory topology inventory
        uses: actions/upload-artifact@v4
        with:
          name: otherrole-topology-report-${{ github.sha }}
          path: otherrole-topology-report.json
          if-no-files-found: error
          retention-days: 30
