name: ZA Fraud Signal Exchange Qualification

on:
  pull_request:
    paths:
      - 'mycelix-finance/docs/ZA_FRAUD_SIGNAL_EXCHANGE_V1.md'
      - 'mycelix-finance/docs/za-fraud-signal-corpus-v1.*'
      - 'tools/finance/za-fraud-signal-evaluator/**'
      - '.github/workflows/za-fraud-signal-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-finance/docs/ZA_FRAUD_SIGNAL_EXCHANGE_V1.md'
      - 'mycelix-finance/docs/za-fraud-signal-corpus-v1.*'
      - 'tools/finance/za-fraud-signal-evaluator/**'
      - '.github/workflows/za-fraud-signal-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust 1.96
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.0
      - name: Format
        run: cargo fmt --manifest-path tools/finance/za-fraud-signal-evaluator/Cargo.toml -- --check
      - name: Schema and semantic tests
        run: cargo test --manifest-path tools/finance/za-fraud-signal-evaluator/Cargo.toml
      - name: Deterministic negative mutation campaign
        run: cargo run --manifest-path tools/finance/za-fraud-signal-evaluator/Cargo.toml -- --self-test
      - name: Clippy
        run: cargo clippy --manifest-path tools/finance/za-fraud-signal-evaluator/Cargo.toml --all-targets -- -D warnings
