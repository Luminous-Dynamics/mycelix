name: One-shot Repair and Format Authority Currentness

on:
  push:
    branches:
      - security/constitution-currentness-contract-v0.1

permissions:
  contents: write

concurrency:
  group: one-shot-format-authority-currentness
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: security/constitution-currentness-contract-v0.1
          fetch-depth: 2

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Repair exact Holochain 0.6 generic bounds
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('mycelix-governance/zomes/authority-current-freshness-verifier/coordinator/src/v04/root.rs')
          text = path.read_text()
          old = 'where\n    I: Serialize,\n    O: DeserializeOwned,\n{'
          new = 'where\n    I: Serialize + std::fmt::Debug,\n    O: DeserializeOwned + std::fmt::Debug,\n{'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one call_local generic-bound block, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format only runner-proven subjects
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path crates/mycelix-governance-constitution-currentness/Cargo.toml
          rustfmt --edition 2024 mycelix-governance/zomes/authority-current-freshness-verifier/coordinator/src/v04/evidence.rs
          rustfmt --edition 2024 mycelix-governance/zomes/authority-current-freshness-verifier/coordinator/src/v04/root.rs
          rustfmt --edition 2024 mycelix-governance/zomes/authority-current-freshness-verifier/coordinator/src/v04/runtime.rs
          rustfmt --edition 2024 mycelix-governance/zomes/authority-current-freshness-verifier/coordinator/src/v04/types.rs
          python3 - <<'PY'
          import subprocess
          allowed = {
              'crates/mycelix-governance-constitution-currentness/src/lib.rs',
              'mycelix-governance/zomes/authority-current-freshness-verifier/coordinator/src/v04/evidence.rs',
              'mycelix-governance/zomes/authority-current-freshness-verifier/coordinator/src/v04/root.rs',
              'mycelix-governance/zomes/authority-current-freshness-verifier/coordinator/src/v04/runtime.rs',
              'mycelix-governance/zomes/authority-current-freshness-verifier/coordinator/src/v04/types.rs',
          }
          changed = set(filter(None, subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()))
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'unexpected repair/formatter scope: {sorted(unexpected)}')
          if 'mycelix-governance/zomes/authority-current-freshness-verifier/coordinator/src/v04/root.rs' not in changed:
              raise SystemExit('root.rs ABI-bound repair is missing from candidate delta')
          print('repair/formatter scope:', sorted(changed))
          PY

      - name: Re-run shared currentness contract tests
        run: cargo test --manifest-path crates/mycelix-governance-constitution-currentness/Cargo.toml --all-targets

      - name: Compile current-freshness runtime before write
        run: cargo check --manifest-path mycelix-governance/zomes/authority-current-freshness-verifier/coordinator/Cargo.toml

      - name: Commit exact repair and formatter delta
        shell: bash
        run: |
          set -euo pipefail
          # Cargo may refresh the governance lock while compiling the Holochain runtime.
          # That generated lock delta is not part of this compatibility repair.
          git checkout -- mycelix-governance/Cargo.lock
          if git diff --quiet; then
            echo 'No repair/formatter delta to commit.'
            exit 0
          fi
          python3 - <<'PY'
          import subprocess
          allowed = {
              'crates/mycelix-governance-constitution-currentness/src/lib.rs',
              'mycelix-governance/zomes/authority-current-freshness-verifier/coordinator/src/v04/evidence.rs',
              'mycelix-governance/zomes/authority-current-freshness-verifier/coordinator/src/v04/root.rs',
              'mycelix-governance/zomes/authority-current-freshness-verifier/coordinator/src/v04/runtime.rs',
              'mycelix-governance/zomes/authority-current-freshness-verifier/coordinator/src/v04/types.rs',
          }
          changed = set(filter(None, subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()))
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'refusing to commit unexpected paths: {sorted(unexpected)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            crates/mycelix-governance-constitution-currentness/src/lib.rs \
            mycelix-governance/zomes/authority-current-freshness-verifier/coordinator/src/v04/evidence.rs \
            mycelix-governance/zomes/authority-current-freshness-verifier/coordinator/src/v04/root.rs \
            mycelix-governance/zomes/authority-current-freshness-verifier/coordinator/src/v04/runtime.rs \
            mycelix-governance/zomes/authority-current-freshness-verifier/coordinator/src/v04/types.rs
          git commit -m 'fix(authority): satisfy currentness runtime ABI bounds'
          git push origin HEAD:security/constitution-currentness-contract-v0.1
