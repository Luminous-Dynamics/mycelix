name: Temporary Pulse 219 Backend Lock Materialization

on:
  push:
    branches:
      - tmp/pulse-219-backend-lock-materialize

permissions:
  actions: read
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Bind exact staging execution
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "tmp/pulse-219-backend-lock-materialize"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base HEAD 0869bc9ba08fda11b9fdf442e7cc06895885ec7a)" = "0869bc9ba08fda11b9fdf442e7cc06895885ec7a"
          test "$(git hash-object mycelix-workspace/mycelix-pulse/happ/backend-rs/Cargo.toml)" = "01b64dc6ddf8e516e9c470254199b170bf86e8c1"
      - name: Download sealed lock artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10075592501/zip" \
            --output "$RUNNER_TEMP/pulse-backend-lock.zip"
          echo "9316da1ff2ccbc3fe2209fa9acb56a306e1672e42eece3d8639ca141efafcf13  $RUNNER_TEMP/pulse-backend-lock.zip" | sha256sum --check -
      - name: Verify and materialize exact Cargo lock
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pulse-backend-lock"
          python3 - "$RUNNER_TEMP/pulse-backend-lock.zip" "$RUNNER_TEMP/pulse-backend-lock" <<'PY'
          import sys, zipfile
          archive, target = sys.argv[1:]
          with zipfile.ZipFile(archive) as zf:
              zf.extractall(target)
          PY
          test "$(cat "$RUNNER_TEMP/pulse-backend-lock/source-head.txt")" = "96e59ec4786b2a573d18cd9cbcefa432f618bf61"
          echo "73f4b3654724c25736db619d41af0c2cb138a46d19c7553983d47885940c9c45  $RUNNER_TEMP/pulse-backend-lock/Cargo.lock" | sha256sum --check -
          cp "$RUNNER_TEMP/pulse-backend-lock/Cargo.lock" mycelix-workspace/mycelix-pulse/happ/backend-rs/Cargo.lock
          echo "73f4b3654724c25736db619d41af0c2cb138a46d19c7553983d47885940c9c45  mycelix-workspace/mycelix-pulse/happ/backend-rs/Cargo.lock" | sha256sum --check -
      - name: Commit self-cleaned lock-only tree
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-pulse-219-backend-lock-materialize.yml
          git add -f mycelix-workspace/mycelix-pulse/happ/backend-rs/Cargo.lock
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/tmp-pulse-219-backend-lock-materialize.yml' \
            'mycelix-workspace/mycelix-pulse/happ/backend-rs/Cargo.lock' | sort)"
          test "$actual" = "$expected"
          git config user.name "Luminous Dynamics Qualification Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "ci(pulse): materialize sealed backend lock"
          git push origin HEAD:tmp/pulse-219-backend-lock-materialize
