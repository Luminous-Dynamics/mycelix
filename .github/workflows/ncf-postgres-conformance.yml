name: NCF PostgreSQL Conformance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "mycelix-workspace/simulations/nested-currency-reference/postgres/**"
      - "mycelix-workspace/simulations/nested-currency-reference/holochain/**"
      - ".github/workflows/ncf-postgres-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-conformance:
    name: PostgreSQL 18 transactional admission and contention
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ncf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ncf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ncf_test
      PGCONNECT_TIMEOUT: "5"
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Record exact server/client runtime
        run: |
          psql "$DATABASE_URL" -XAt -c "SELECT version();"
          psql "$DATABASE_URL" -XAt -c "SELECT current_setting('transaction_isolation'), current_setting('synchronous_commit'), current_setting('fsync');"
      - name: Apply PostgreSQL schema and transaction functions
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f mycelix-workspace/simulations/nested-currency-reference/postgres/001_schema.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f mycelix-workspace/simulations/nested-currency-reference/postgres/002_functions.sql
      - name: Run idempotency, alias, cap, settlement, and outbox smoke tests
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f mycelix-workspace/simulations/nested-currency-reference/postgres/900_smoke_test.sql
      - name: Prepare independent concurrency fixture
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f mycelix-workspace/simulations/nested-currency-reference/postgres/910_concurrent_setup.sql
      - name: Race independent PostgreSQL sessions
        run: bash mycelix-workspace/simulations/nested-currency-reference/postgres/run-concurrency-tests.sh
      - name: Emit explicit claim ceiling and final reconciliation
        if: always()
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "SELECT instrument_id, community_id, cap_units, allocated_units, outstanding_units FROM ncf.community_instrument_cap ORDER BY instrument_id, community_id;"
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "SELECT instrument_id, count(*) AS obligations, coalesce(sum(amount_units),0) AS obligation_units, count(distinct canonical_work_digest) AS unique_work FROM ncf.obligation GROUP BY instrument_id ORDER BY instrument_id;"
