name: Institutional Core Typed-ID One-Shot Repair

on:
  push:
    branches:
      - 'security/institutional-core-id-validation-v0.1'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Require exact inherited authority kernel
        run: |
          test "$(git hash-object crates/mycelix-institutional-core/src/lib.rs)" = "da47978387f9cc167e8b5238e013626adb948fe5"

      - name: Apply constructor-bypass validation hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/mycelix-institutional-core/src/lib.rs')
          text = path.read_text()

          def replace_one(old: str, new: str) -> None:
              global text
              count = text.count(old)
              assert count == 1, f'expected one exact source block, found {count}'
              text = text.replace(old, new, 1)

          replace_one(
          '''            pub fn as_str(&self) -> &str {
                          &self.0
                      }
          ''',
          '''            pub fn as_str(&self) -> &str {
                          &self.0
                      }

                      pub fn validate(&self) -> Result<(), ValidationError> {
                          validate_text(&self.0, $label, MAX_ID_BYTES)
                      }
          ''')

          replace_one(
          '''        if let Some(jurisdiction) = &self.jurisdiction {
                      validate_text(
                          jurisdiction.as_str(),
                          "authority_grant.jurisdiction",
                          MAX_ID_BYTES,
                      )?;
                  }
                  if self.capabilities.is_empty() {
          ''',
          '''        if let Some(jurisdiction) = &self.jurisdiction {
                      validate_text(
                          jurisdiction.as_str(),
                          "authority_grant.jurisdiction",
                          MAX_ID_BYTES,
                      )?;
                  }
                  for role in &self.roles {
                      role.validate()?;
                  }
                  for capability in &self.capabilities {
                      capability.validate()?;
                  }
                  if self.capabilities.is_empty() {
          ''')

          replace_one(
          '''        for source in &self.sources {
                      source.validate()?;
                  }
                  validate_text(
                      &self.grant_proof_ref,
          ''',
          '''        for source in &self.sources {
                      source.validate()?;
                  }
                  if let Some(parent) = &self.delegated_from {
                      parent.validate()?;
                  }
                  validate_text(
                      &self.grant_proof_ref,
          ''')

          replace_one(
          '''        validate_text(&self.evidence_type, "evidence.type", MAX_CODE_BYTES)?;
                  if let Some(digest) = self.digest {
          ''',
          '''        validate_text(&self.evidence_type, "evidence.type", MAX_CODE_BYTES)?;
                  if let Some(issuer) = &self.issuer {
                      issuer.validate()?;
                  }
                  if let Some(digest) = self.digest {
          ''')

          replace_one(
          '''    pub fn validate(&self) -> Result<(), ValidationError> {
                  validate_text(&self.evidence_type, "evidence_requirement.type", MAX_CODE_BYTES)
              }
          ''',
          '''    pub fn validate(&self) -> Result<(), ValidationError> {
                  validate_text(&self.evidence_type, "evidence_requirement.type", MAX_CODE_BYTES)?;
                  for issuer in &self.accepted_issuers {
                      issuer.validate()?;
                  }
                  Ok(())
              }
          ''')

          replace_one(
          '''impl AuthorityRequirement {
              pub fn validate(&self) -> Result<(), ValidationError> {
                  if self.required_capabilities.is_empty() {
                      return Err(ValidationError::NoCapabilities);
                  }
                  self.rulebook.validate()?;
          ''',
          '''impl AuthorityRequirement {
              pub fn validate(&self) -> Result<(), ValidationError> {
                  self.institution.validate()?;
                  if let Some(jurisdiction) = &self.jurisdiction {
                      jurisdiction.validate()?;
                  }
                  if self.required_capabilities.is_empty() {
                      return Err(ValidationError::NoCapabilities);
                  }
                  for capability in &self.required_capabilities {
                      capability.validate()?;
                  }
                  for role in &self.accepted_roles {
                      role.validate()?;
                  }
                  self.rulebook.validate()?;
          ''')

          # Rust 1.98 strict Clippy rejects two inherited nested-if forms in this
          # same source file. Collapse them mechanically without changing logic;
          # this keeps -D warnings intact rather than weakening qualification.
          replace_one(
          '''        if let Some(expires_at_ms) = self.expires_at_ms {
                      if expires_at_ms <= self.granted_at_ms {
                          return Err(ValidationError::InvalidTimeRange("consent"));
                      }
                  }
          ''',
          '''        if let Some(expires_at_ms) = self.expires_at_ms
                      && expires_at_ms <= self.granted_at_ms
                  {
                      return Err(ValidationError::InvalidTimeRange("consent"));
                  }
          ''')

          replace_one(
          '''        if let Some(expires_at_ms) = self.expires_at_ms {
                      if expires_at_ms <= self.generated_at_ms {
                          return Err(ValidationError::InvalidTimeRange("advisory signal"));
                      }
                  }
          ''',
          '''        if let Some(expires_at_ms) = self.expires_at_ms
                      && expires_at_ms <= self.generated_at_ms
                  {
                      return Err(ValidationError::InvalidTimeRange("advisory signal"));
                  }
          ''')

          path.write_text(text)
          PY

          rustfmt --edition 2024 crates/mycelix-institutional-core/src/lib.rs
          git diff --check
          test "$(git diff --name-only)" = "crates/mycelix-institutional-core/src/lib.rs"

      - name: Static authority-boundary assertions
        run: |
          src=crates/mycelix-institutional-core/src/lib.rs
          grep -F 'pub fn validate(&self) -> Result<(), ValidationError>' "$src"
          grep -F 'for role in &self.roles {' "$src"
          grep -F 'for capability in &self.capabilities {' "$src"
          grep -F 'if let Some(parent) = &self.delegated_from {' "$src"
          grep -F 'if let Some(issuer) = &self.issuer {' "$src"
          grep -F 'for issuer in &self.accepted_issuers {' "$src"
          grep -F 'for capability in &self.required_capabilities {' "$src"
          grep -F 'for role in &self.accepted_roles {' "$src"

      - name: Self-verify institutional authority theorem
        run: |
          manifest=crates/mycelix-institutional-core/Cargo.toml
          cargo fmt --manifest-path "$manifest" -- --check
          cargo test --manifest-path "$manifest" --all-targets
          cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings

      - name: Commit exact validated repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/mycelix-institutional-core/src/lib.rs
          git diff --cached --quiet && exit 1
          test "$(git diff --cached --name-only)" = "crates/mycelix-institutional-core/src/lib.rs"
          git commit -m 'fix(core): validate typed authority identifiers at semantic boundary'
          git push origin HEAD:security/institutional-core-id-validation-v0.1
