name: Governance Constitution

on:
  pull_request:
    paths:
      - 'crates/mycelix-governance-constitution/**'
      - 'mycelix-governance/zomes/constitution-authority/**'
      - 'mycelix-governance/Cargo.toml'
      - 'mycelix-governance/dna/**'
      - '.github/workflows/governance-constitution.yml'
  push:
    branches:
      - 'security/governance-constitution-fail-closed-v1'
    paths:
      - 'crates/mycelix-governance-constitution/**'
      - 'mycelix-governance/zomes/constitution-authority/**'
      - 'mycelix-governance/Cargo.toml'
      - 'mycelix-governance/dna/**'
      - '.github/workflows/governance-constitution.yml'

permissions:
  contents: read

jobs:
  portable-constitution:
    name: Portable constitutional lineage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path crates/mycelix-governance-constitution/Cargo.toml -- --check
      - name: Test
        run: cargo test --manifest-path crates/mycelix-governance-constitution/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-governance-constitution/Cargo.toml --all-targets -- -D warnings

  constitution-authority-zomes:
    name: DNA-bound constitution authority zomes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Format zomes
        working-directory: mycelix-governance
        run: cargo fmt --package constitution_authority_integrity --package constitution_authority -- --check
      - name: Native tests
        working-directory: mycelix-governance
        run: cargo test --package constitution_authority_integrity --package constitution_authority --all-targets
      - name: Native clippy
        working-directory: mycelix-governance
        run: cargo clippy --package constitution_authority_integrity --package constitution_authority --all-targets -- -D warnings
      - name: WASM integrity build
        working-directory: mycelix-governance
        run: cargo check --release --target wasm32-unknown-unknown --package constitution_authority_integrity
      - name: WASM coordinator build
        working-directory: mycelix-governance
        run: cargo check --release --target wasm32-unknown-unknown --package constitution_authority
