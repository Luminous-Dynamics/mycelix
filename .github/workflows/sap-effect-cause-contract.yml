name: SAP legacy-writer V2 crosswalk qualification

on:
  pull_request:
    paths:
      - ".github/workflows/sap-effect-cause-contract.yml"
      - "mycelix-finance/docs/research/SAP_LEGACY_WRITER_V2_CROSSWALK_V0_2.md"
      - "mycelix-workspace/mycelix-finance/docs/research/SAP_LEGACY_WRITER_V2_CROSSWALK_V0_2.md"
      - "mycelix-finance/benchmarks/sap/sap-legacy-writer-v2-crosswalk.v0.2.schema.json"
      - "mycelix-workspace/mycelix-finance/benchmarks/sap/sap-legacy-writer-v2-crosswalk.v0.2.schema.json"
      - "mycelix-finance/benchmarks/sap/sap-legacy-writer-v2-crosswalk.v0.2.json"
      - "mycelix-workspace/mycelix-finance/benchmarks/sap/sap-legacy-writer-v2-crosswalk.v0.2.json"
      - "mycelix-finance/benchmarks/sap/sap-effect-cause-known-answer-corpus.v0.1.json"
      - "mycelix-workspace/mycelix-finance/benchmarks/sap/sap-effect-cause-known-answer-corpus.v0.1.json"
  push:
    branches:
      - "research/sap-effect-cause-transition-v0.1-20261123"
    paths:
      - ".github/workflows/sap-effect-cause-contract.yml"
      - "mycelix-finance/docs/research/SAP_LEGACY_WRITER_V2_CROSSWALK_V0_2.md"
      - "mycelix-workspace/mycelix-finance/docs/research/SAP_LEGACY_WRITER_V2_CROSSWALK_V0_2.md"
      - "mycelix-finance/benchmarks/sap/sap-legacy-writer-v2-crosswalk.v0.2.schema.json"
      - "mycelix-workspace/mycelix-finance/benchmarks/sap/sap-legacy-writer-v2-crosswalk.v0.2.schema.json"
      - "mycelix-finance/benchmarks/sap/sap-legacy-writer-v2-crosswalk.v0.2.json"
      - "mycelix-workspace/mycelix-finance/benchmarks/sap/sap-legacy-writer-v2-crosswalk.v0.2.json"
      - "mycelix-finance/benchmarks/sap/sap-effect-cause-known-answer-corpus.v0.1.json"
      - "mycelix-workspace/mycelix-finance/benchmarks/sap/sap-effect-cause-known-answer-corpus.v0.1.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sap-legacy-writer-v2-crosswalk-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify subject and mirrored artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SUBJECT_SHA"
          cmp mycelix-finance/docs/research/SAP_LEGACY_WRITER_V2_CROSSWALK_V0_2.md mycelix-workspace/mycelix-finance/docs/research/SAP_LEGACY_WRITER_V2_CROSSWALK_V0_2.md
          cmp mycelix-finance/benchmarks/sap/sap-legacy-writer-v2-crosswalk.v0.2.schema.json mycelix-workspace/mycelix-finance/benchmarks/sap/sap-legacy-writer-v2-crosswalk.v0.2.schema.json
          cmp mycelix-finance/benchmarks/sap/sap-legacy-writer-v2-crosswalk.v0.2.json mycelix-workspace/mycelix-finance/benchmarks/sap/sap-legacy-writer-v2-crosswalk.v0.2.json
          cmp mycelix-finance/benchmarks/sap/sap-effect-cause-known-answer-corpus.v0.1.json mycelix-workspace/mycelix-finance/benchmarks/sap/sap-effect-cause-known-answer-corpus.v0.1.json

      - name: Validate 16-writer V2 crosswalk and 22-case corpus
        shell: bash
        run: |
          set -euo pipefail
          MAP="mycelix-finance/benchmarks/sap/sap-legacy-writer-v2-crosswalk.v0.2.json"
          SCHEMA="mycelix-finance/benchmarks/sap/sap-legacy-writer-v2-crosswalk.v0.2.schema.json"
          CORPUS="mycelix-finance/benchmarks/sap/sap-effect-cause-known-answer-corpus.v0.1.json"
          jq empty "$MAP"
          jq empty "$SCHEMA"
          jq empty "$CORPUS"

          jq -e '
            .benchmark == "Legacy SAP Writer to Owner-Authored V2 Architecture Crosswalk" and
            .version == "0.2" and
            .base_commit == "e949664ceb2f9ddde26704c70e23a19380f33dde" and
            (.target_architecture | length) >= 12 and
            (.writers | length) == 16 and
            ([.writers[].id] | unique | length) == 16 and
            ([.writers[].id] | sort) == [
              "SAPW-001","SAPW-002","SAPW-003","SAPW-004",
              "SAPW-005","SAPW-006","SAPW-007","SAPW-008",
              "SAPW-009","SAPW-010","SAPW-011","SAPW-012",
              "SAPW-013","SAPW-014","SAPW-015","SAPW-016"
            ] and
            all(.writers[];
              (.entrypoint | length > 0) and
              (.path | length > 0) and
              (.legacy_effect_class | length > 0) and
              (.v2_disposition | length > 0) and
              (.target_theorems | length > 0) and
              (.migration_blockers | length > 0) and
              (.cutover_condition | length > 0)
            ) and
            (.cutover_gates | length) >= 8 and
            (.design_decision | contains("superseded"))
          ' "$MAP" >/dev/null

          jq -e --slurpfile m "$MAP" '
            .properties.benchmark.const == "Legacy SAP Writer to Owner-Authored V2 Architecture Crosswalk" and
            .properties.writers.items["$ref"] == "#/$defs/writer" and
            (.required | index("writers")) != null and
            ([.["$defs"].writer.properties.v2_disposition.enum[]] | sort) ==
              ([$m[0].writers[].v2_disposition] | unique | sort)
          ' "$SCHEMA" >/dev/null

          jq -e '
            .benchmark == "SAP V2 Cross-Layer Assurance Known-Answer and Adversarial Corpus" and
            .version == "0.2" and
            .status == "specified_not_executed" and
            .crosswalk == "sap-legacy-writer-v2-crosswalk.v0.2.json" and
            (.scenarios | length) == 25 and
            ([.scenarios[].id] | unique | length) == 25 and
            ([.scenarios[].id] | sort) == [
              "SCE-001","SCE-002","SCE-003","SCE-004","SCE-005",
              "SCE-006","SCE-007","SCE-008","SCE-009","SCE-010",
              "SCE-011","SCE-012","SCE-013","SCE-014","SCE-015",
              "SCE-016","SCE-017","SCE-018","SCE-019","SCE-020",
              "SCE-021","SCE-022","SCE-023","SCE-024","SCE-025"
            ] and
            all(.scenarios[];
              (.id | test("^SCE-[0-9]{3}$")) and
              (.stimulus | length > 0) and
              (.invariant | length > 0) and
              (.related_tracking | length > 0) and
              (.execution_state == "specified_not_executed")
            )
          ' "$CORPUS" >/dev/null

          if grep -R -n "SapBalanceTransitionV1"             mycelix-finance/docs/research/SAP_LEGACY_WRITER_V2_CROSSWALK_V0_2.md             "$MAP" "$SCHEMA"; then
            echo "Superseded mutable-balance schema must not be presented as the V2 destination."
            exit 1
          fi

          {
            echo "subject_commit=$(git rev-parse HEAD)"
            echo "crosswalk_schema_sha256=$(sha256sum "$SCHEMA" | cut -d' ' -f1)"
            echo "crosswalk_map_sha256=$(sha256sum "$MAP" | cut -d' ' -f1)"
            echo "assurance_corpus_sha256=$(sha256sum "$CORPUS" | cut -d' ' -f1)"
            echo "legacy_writer_count=$(jq '.writers | length' "$MAP")"
            echo "target_theorem_count=$(jq '.target_architecture | length' "$MAP")"
            echo "assurance_case_count=$(jq '.scenarios | length' "$CORPUS")"
          } | tee "$RUNNER_TEMP/sap-v2-crosswalk-manifest.txt" >> "$GITHUB_STEP_SUMMARY"
