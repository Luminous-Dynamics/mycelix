name: D6S Canonical Qualification

on:
  push:
    branches:
      - myc-int-demo-d6t-canonical-encoding
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d6s-canon-reference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:

  d6s-canon-reference:
    name: D6S canonical reference qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QUALIFIED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact qualification subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          persist-credentials: false

      - name: Assert exact qualification subject
        run: test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"
      - name: Determine whether D6S qualification is in scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "D6S qualification is explicitly requested or running on its dedicated branch."
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed="$(git diff --name-only "$BASE_SHA" "$QUALIFIED_SHA")"
          required=false
          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            case "$path" in
              docs/integral/*|scripts/integral/*|.github/workflows/d6s-canonical-qualification.yml|mycelix-manufacturing/Cargo.toml|mycelix-manufacturing/crates/cos_conformance/Cargo.toml|mycelix-manufacturing/crates/cos_conformance/src/*|mycelix-manufacturing/crates/cos_conformance/tests/*)
                required=true
                echo "D6S-relevant change: $path"
                ;;
            esac
          done <<< "$changed"
          echo "required=$required" >> "$GITHUB_OUTPUT"
          echo "d6s_scope_changed=$required"
          if [[ "$required" != true ]]; then
            echo "No D6S corpus, verifier, target, or relevant manifest changed; do not claim D6S qualification."
          fi

      - name: Verify pinned D6S reference assets
        if: steps.scope.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(git hash-object -- "$path")"
            if [[ "$actual" != "$expected" ]]; then
              echo "D6S_BLOB_PIN_MISMATCH path=$path expected=$expected actual=$actual" >&2
              exit 1
            fi
            echo "D6S_BLOB_PIN_OK path=$path blob=$actual"
          }
          # These roots are deliberately repeated here. Updating the corpus,
          # manifest, reference engine, Rust test, or independent verifier requires
          # a visible reviewed update to this pin list in the same change.
          check_blob "docs/integral/d6s-canon-1-golden-vectors.json" "419dfc5b5ab8d7aff98502651fd45b6eca4a5dcb"
          check_blob "docs/integral/d6s-canon-1-manifest.json" "ee4c7851ba375a393e1cbe49f86dacda1d618681"
          check_blob "mycelix-manufacturing/crates/cos_conformance/tests/d6s_canon_1_golden_vectors.rs" "703dc7f41718df40fef4e1a29a074e028af4d3ae"
          check_blob "scripts/integral/verify_d6s_canon_1.py" "13a013d2c112ff97dc50e240d0beca910d978292"
          check_blob "docs/integral/d6s-canon-2-authority-boundary-fixture.json" "aa30f08be279147cf85ecfd64436d1aa546920ba"
          check_blob "docs/integral/d6s-canon-2-manifest.json" "fd43f8255afeba1edaace6519867e20896a3c8f1"
          check_blob "mycelix-manufacturing/crates/cos_conformance/tests/d6s_canon_2_authority_boundary.rs" "4516f7d72308b05de3ea03945ac550bb4628c80d"
          check_blob "scripts/integral/verify_d6s_canon_2_authority_boundary.py" "1a079f3731a485387cf5ead6b5ae8dcbb3782195"
          check_blob "mycelix-manufacturing/crates/cos_conformance/src/lib.rs" "ede59532d3523d6f0d1fa98d0b34b37dfa68eb39"
          check_blob "docs/integral/cos-reference-node-v1.md" "ae0372b65c45b13504c2d2b211bc891b91776026"


      - name: Install pinned Rust
        if: steps.scope.outputs.required == 'true'
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # master @ 2025-08-23
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Assert Rust toolchain identity
        if: steps.scope.outputs.required == 'true'
        run: |
          test "$(rustc +1.96.0 --version)" = "rustc 1.96.0 (ac68faa20 2026-05-25)"
          rustfmt +1.96.0 --version

      # Formatting of the broader manufacturing workspace is deliberately not a
      # D6S qualification invariant. This gate must not fail because of
      # pre-existing, unrelated formatting drift outside the qualification
      # subject; semantic/reference qualification is provided by the locked
      # corpus and independent CANON verifiers below.

      - name: Generate reference-test dependency lock
        if: steps.scope.outputs.required == 'true'
        run: cargo generate-lockfile --manifest-path mycelix-manufacturing/Cargo.toml

      - name: Assert resolved reference-test dependency graph
        if: steps.scope.outputs.required == 'true'
        run: cargo metadata --manifest-path mycelix-manufacturing/Cargo.toml --locked --no-deps --format-version 1 > /dev/null

      # D6S qualification is scoped to the D6S reference contracts. The
      # broader COS workspace contains unrelated suites whose baseline state
      # must not gate this specific reference qualification.
      - name: Run D6S canonical integration suites
        if: steps.scope.outputs.required == 'true'
        run: >-
          cargo test
          --manifest-path mycelix-manufacturing/Cargo.toml
          --locked
          -p cos_conformance
          --test d6s_canon_1_golden_vectors
          --test d6s_canon_2_authority_boundary

      - name: Run independent D6S-CANON-1 verifier
        if: steps.scope.outputs.required == 'true'
        run: python3 scripts/integral/verify_d6s_canon_1.py

      - name: Run D6S-CANON-2 authority-boundary fixture verifier
        if: steps.scope.outputs.required == 'true'
        run: python3 scripts/integral/verify_d6s_canon_2_authority_boundary.py

      - name: Record non-applicability without qualifying D6S
        if: steps.scope.outputs.required != 'true'
        run: |
          {
            echo "D6S CANONICAL REFERENCE GATE"
            echo "status=not-applicable"
            echo "commit=${QUALIFIED_SHA}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "d6s_scope_changed=false"
            echo "claim_ceiling=NotQualified"
          } | tee d6s-canonical-reference-not-applicable.txt

      - name: Emit qualification record
        if: steps.scope.outputs.required == 'true'
        run: |
          {
            echo "D6S CANONICAL REFERENCE GATE"
            echo "status=reference-gate-passed"
            echo "commit=${QUALIFIED_SHA}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "workflow_ref=${GITHUB_WORKFLOW_REF}"
            echo "workflow_sha=$(git hash-object .github/workflows/d6s-canonical-qualification.yml)"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_image=${ImageOS:-unknown}"
            echo "rust_action_sha=e97e2d8cc328f1b50210efc529dca0028893a2d9"
            echo "rust_action_toolchain=1.96.0"
            echo "rust_expected_version=rustc 1.96.0 (ac68faa20 2026-05-25)"
            echo "checkout_action_sha=11bd71901bbe5b1630ceea73d27597364c9af683"
            echo "upload_artifact_action_sha=ea165f8d65b6e75b540449e92b4886f43607fa02"
            echo "rust=$(rustc --version)"
            echo "rust_verbose_commit=$(rustc --version --verbose | sed -n 's/^commit-hash: //p')"
            echo "cargo=$(cargo --version)"
            echo "rustfmt=$(rustfmt --version)"
            echo "python=$(python3 --version)"
            echo "cargo_lock_sha256=$(sha256sum mycelix-manufacturing/Cargo.lock | cut -d' ' -f1)"
            echo "canon1_corpus_sha256=$(sha256sum docs/integral/d6s-canon-1-golden-vectors.json | cut -d' ' -f1)"
            echo "canon1_manifest_sha256=$(sha256sum docs/integral/d6s-canon-1-manifest.json | cut -d' ' -f1)"
            echo "canon2_fixture_sha256=$(sha256sum docs/integral/d6s-canon-2-authority-boundary-fixture.json | cut -d' ' -f1)"
            echo "canon2_fixture_git_blob_sha=$(git hash-object docs/integral/d6s-canon-2-authority-boundary-fixture.json)"
            echo "canon2_manifest_git_blob_sha=$(git hash-object docs/integral/d6s-canon-2-manifest.json)"
            echo "canon1_manifest_git_blob_sha=$(git hash-object docs/integral/d6s-canon-1-manifest.json)"
            echo "canon1_corpus_git_blob_sha=$(git hash-object docs/integral/d6s-canon-1-golden-vectors.json)"
            echo "canon1_corpus_sha256=$(sha256sum docs/integral/d6s-canon-1-golden-vectors.json | cut -d' ' -f1)"
            echo "d6s_authority_ledger_schema=v1"
            echo "d6s_runtime_evidence_status=NotExecuted"
            echo "canon2_runtime_binding_status=ReferenceMappingOnly"
            echo "rust_corpus=PASSED"
            echo "canon1_independent_verifier=PASSED"
            echo "canon2_authority_boundary_fixture=PASSED"
            echo "claim_ceiling=ReferenceModelOnly"
          } | tee d6s-canonical-reference-qualification.txt

      - name: Upload qualification record
        if: steps.scope.outputs.required == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d6s-canonical-reference-${{ env.QUALIFIED_SHA }}
          path: d6s-canonical-reference-qualification.txt
