name: COS Reference Contract Qualification

on:
  push:
    branches:
      - main
      - myc-int-demo-d6t-canonical-encoding
    paths:
      - ".github/workflows/d6s-canonical-qualification.yml"
      - "mycelix-manufacturing/Cargo.toml"
      - "mycelix-manufacturing/crates/cos_conformance/**"
      - "mycelix-manufacturing/crates/manufacturing_common/**"
      - "docs/integral/**"
  pull_request:
    # Keep this specialized gate off unrelated PRs while still qualifying
    # relevant D6S inputs in the canonical branch and on main.
    branches:
      - main
      - myc-int-demo-d6t-canonical-encoding
    paths:
      - "mycelix-manufacturing/Cargo.toml"
      - "mycelix-manufacturing/Cargo.lock"
      - "mycelix-manufacturing/crates/cos_conformance/**"
      - "mycelix-manufacturing/crates/manufacturing_common/**"
      - "docs/integral/d6s-canon-*"
      - "scripts/integral/verify_d6s_canon_*.py"
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/d6s-canonical-qualification.yml"
      - "mycelix-manufacturing/Cargo.toml"
      - "mycelix-manufacturing/crates/cos_conformance/**"
      - "mycelix-manufacturing/crates/manufacturing_common/**"
      - "docs/integral/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cos-reference-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cos-reference-contract:
    name: COS reference contract qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QUALIFIED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact qualification subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          persist-credentials: false

      - name: Assert exact qualification subject
        run: test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # master @ 2025-08-23
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Assert Rust toolchain identity
        run: |
          test "$(rustc +1.96.0 --version)" = "rustc 1.96.0 (ac68faa20 2026-05-25)"
          rustfmt +1.96.0 --version

      # This workspace currently does not contain the former D6S-specific
      # named integration targets/fixtures. Resolve one lock for this run,
      # hash it in the receipt, then keep the test/build steps locked.
      - name: Generate reference-test dependency lock
        run: cargo generate-lockfile --manifest-path mycelix-manufacturing/Cargo.toml

      - name: Assert reference-workspace metadata
        run: cargo metadata --manifest-path mycelix-manufacturing/Cargo.toml --locked --no-deps --format-version 1 > /dev/null

      - name: Run the actual COS conformance test targets
        run: cargo test --manifest-path mycelix-manufacturing/Cargo.toml --locked -p cos_conformance

      - name: Generate and parse the COS reference report
        run: |
          mkdir -p evidence
          cargo run --quiet --manifest-path mycelix-manufacturing/Cargo.toml --locked -p cos_conformance --bin cos-report > evidence/cos-conformance-report.json
          python3 -m json.tool evidence/cos-conformance-report.json > /dev/null

      - name: Emit exact-head qualification record
        run: |
          {
            echo "COS REFERENCE CONTRACT QUALIFICATION"
            echo "status=reference-contract-passed"
            echo "commit=$QUALIFIED_SHA"
            echo "workflow=$GITHUB_WORKFLOW"
            echo "workflow_ref=$GITHUB_WORKFLOW_REF"
            echo "workflow_sha=$(git hash-object .github/workflows/d6s-canonical-qualification.yml)"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "event=$GITHUB_EVENT_NAME"
            echo "runner_os=$RUNNER_OS"
            echo "runner_image=${ImageOS:-unknown}"
            echo "rust_action_sha=e97e2d8cc328f1b50210efc529dca0028893a2d9"
            echo "rust_expected_version=rustc 1.96.0 (ac68faa20 2026-05-25)"
            echo "checkout_action_sha=11bd71901bbe5b1630ceea73d27597364c9af683"
            echo "upload_artifact_action_sha=ea165f8d65b6e75b540449e92b4886f43607fa02"
            echo "rust=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "rustfmt=$(rustfmt --version)"
            echo "cargo_lock_sha256=$(sha256sum mycelix-manufacturing/Cargo.lock | cut -d' ' -f1)"
            echo "cos_manifest_git_blob_sha=$(git hash-object mycelix-manufacturing/crates/cos_conformance/Cargo.toml)"
            echo "cos_test_integral_five_system_sha=$(git hash-object mycelix-manufacturing/crates/cos_conformance/tests/integral_five_system_adversarial.rs)"
            echo "cos_test_productive_loop_sha=$(git hash-object mycelix-manufacturing/crates/cos_conformance/tests/productive_loop_refinement.rs)"
            echo "cos_test_source_refinement_sha=$(git hash-object mycelix-manufacturing/crates/cos_conformance/tests/source_refinement.rs)"
            echo "cos_conformance_tests=PASSED"
            echo "cos_report_json=PASSED"
            echo "claim_ceiling=ReferenceModelOnly"
          } | tee evidence/cos-reference-qualification.txt

      - name: Upload qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cos-reference-qualification-${{ env.QUALIFIED_SHA }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
