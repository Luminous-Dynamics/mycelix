name: D6S Canonical Qualification

on:
  push:
    branches:
      - myc-int-demo-d6t-canonical-encoding
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

# The qualification subject is always the exact branch head, never a synthetic
# pull-request merge ref. Superseded pending runs are disposable because they
# cannot qualify the newer commit.
concurrency:
  group: d6s-canon-1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  d6s-canon-1:
    name: D6S-CANON-1 qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QUALIFIED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact qualification subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.QUALIFIED_SHA }}

      - name: Assert exact qualification subject
        run: test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Check D6S formatting
        run: cargo fmt --manifest-path mycelix-manufacturing/Cargo.toml --all -- --check

      - name: Run complete COS conformance corpus
        run: cargo test --manifest-path mycelix-manufacturing/Cargo.toml -p cos_conformance

      - name: Run independent D6S-CANON-1 verifier
        run: python3 scripts/integral/verify_d6s_canon_1.py

      - name: Emit qualification record
        run: |
          {
            echo "D6S-CANON-1 QUALIFICATION"
            echo "commit=${QUALIFIED_SHA}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "rust=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "python=$(python3 --version)"
            echo "corpus_sha256=$(sha256sum docs/integral/d6s-canon-1-golden-vectors.json | cut -d' ' -f1)"
            echo "manifest_sha256=$(sha256sum docs/integral/d6s-canon-1-manifest.json | cut -d' ' -f1)"
            echo "rust_corpus=PASSED"
            echo "independent_verifier=PASSED"
            echo "corpus_identity=QUALIFIED"
            echo "claim_ceiling=ReferenceModelOnly"
          } | tee d6s-canon-1-qualification.txt

      - name: Upload qualification record
        uses: actions/upload-artifact@v4
        with:
          name: d6s-canon-1-qualification-${{ env.QUALIFIED_SHA }}
          path: d6s-canon-1-qualification.txt
