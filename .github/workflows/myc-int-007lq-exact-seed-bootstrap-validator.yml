name: MYC-INT-007L exact seed-bootstrap validator qualification

on:
  pull_request:
    branches:
      - myc-int-007l-seed-bootstrap-validator
  workflow_dispatch:

permissions:
  contents: read

env:
  SUBJECT_SHA: fb6478ccbfc50f2901116c01080901181a062b38
  PARENT_SHA: 78f77d9b64a77185dc9237befcb01d960802b911

jobs:
  qualify-exact-subject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0

      - name: Verify exact subject and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          mapfile -t changed < <(git diff --name-only "$PARENT_SHA" "$SUBJECT_SHA")
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          expected=(
            "docs/interoperability/scripts/test_validate_myc_int_007k.py"
            "docs/interoperability/scripts/validate_myc_int_007k.py"
          )
          mapfile -t got < <(printf '%s\n' "${changed[@]}" | sort)
          mapfile -t want < <(printf '%s\n' "${expected[@]}" | sort)
          test "${got[*]}" = "${want[*]}"

      - name: Python syntax
        run: |
          python3 -m py_compile \
            docs/interoperability/scripts/validate_myc_int_007k.py \
            docs/interoperability/scripts/test_validate_myc_int_007k.py

      - name: Run 007L mutation suite
        run: |
          python3 -m unittest -v docs/interoperability/scripts/test_validate_myc_int_007k.py

      - name: Validate real 007K fixtures
        run: |
          python3 docs/interoperability/scripts/validate_myc_int_007k.py \
            docs/interoperability/fixtures/MYC_INT_007K_NODE_SEED_PACKAGE_A_TO_B.json \
            docs/interoperability/fixtures/MYC_INT_007K_BOOTSTRAP_RUN_B.json

      - name: Create evidence capsule
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification-capsule
          {
            echo "subject_sha=$SUBJECT_SHA"
            echo "parent_sha=$PARENT_SHA"
            echo "head=$(git rev-parse HEAD)"
            python3 --version
            uname -a
          } > qualification-capsule/environment.txt
          sha256sum \
            docs/interoperability/fixtures/MYC_INT_007K_NODE_SEED_PACKAGE_A_TO_B.json \
            docs/interoperability/fixtures/MYC_INT_007K_BOOTSTRAP_RUN_B.json \
            docs/interoperability/scripts/validate_myc_int_007k.py \
            docs/interoperability/scripts/test_validate_myc_int_007k.py \
            > qualification-capsule/files.sha256
          git diff --name-status "$PARENT_SHA" "$SUBJECT_SHA" > qualification-capsule/exact-scope.txt

      - name: Upload qualification capsule
        uses: actions/upload-artifact@v4
        with:
          name: myc-int-007l-exact-qualification-${{ env.SUBJECT_SHA }}
          path: qualification-capsule/
          if-no-files-found: error
