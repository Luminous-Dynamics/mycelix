name: Authority Currentness Consumer Boundary

on:
  pull_request:
    paths:
      - 'mycelix-governance/zomes/authority-current-freshness-verifier/**'
      - 'crates/mycelix-authority-coordinator-deployment/**'
      - 'mycelix-governance/dna/dna.yaml'
      - '.github/workflows/authority-currentness-consumer-boundary.yml'
  push:
    branches:
      - 'security/authority-currentness-wire-boundary-v0.1'
      - 'security/authority-deployment-constitution-context-v0.1'
      - 'security/deployment-currentness-evidence-context-v0.1'
      - 'security/authority-coordinator-deployment-contract-v0.1'

permissions:
  contents: read

concurrency:
  group: authority-currentness-consumer-boundary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: v0.11 transport receipt never becomes execution authority
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Audit currentness consumer handoff
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('mycelix-governance/zomes/authority-current-freshness-verifier')
          types = (root / 'coordinator/src/v04/types.rs').read_text()
          runtime = (root / 'coordinator/src/v04/runtime.rs').read_text()
          contract = (root / 'CONSUMER_HANDOFF.md').read_text()
          coordinator_gate = (root / 'COORDINATOR_DEPLOYMENT_GATE.md').read_text()
          lower = contract.lower()
          gate_lower = coordinator_gate.lower()
          coordinator_src = Path('crates/mycelix-authority-coordinator-deployment/src/lib.rs').read_text()
          dna = Path('mycelix-governance/dna/dna.yaml').read_text()

          assert 'mycelix-authority-current-freshness-verifier-v0.11' in types
          assert 'pub struct CurrentOperationalFreshnessAuditReceipt {' in types
          assert 'VerifiedCurrentOperationalFreshnessReceipt' not in types
          assert 'ExternResult<CurrentOperationalFreshnessAuditReceipt>' in runtime
          assert 'Ok(CurrentOperationalFreshnessAuditReceipt {' in runtime

          # External request remains target-only; positive receipts never enter the verifier.
          signature = runtime.split('pub fn resolve_current_operational_freshness(', 1)[1].split(') -> ExternResult<', 1)[0]
          assert 'subject: AuthoritySubjectRef' in signature
          assert 'AuditReceipt' not in signature
          assert 'VerifiedAuthorityFreshness' not in signature

          # Composition evidence and later final-currentness evidence are separately visible.
          receipt = types.split('pub struct CurrentOperationalFreshnessAuditReceipt {', 1)[1].split('}', 1)[0]
          for field in [
              'composition_evidence_manifest_digest',
              'composition_evidence_manifest_profile',
              'binding_constitution_context_digest',
              'binding_constitution_context_profile',
              'binding_constitution_currentness_evidence_digest',
              'binding_constitution_currentness_evidence_profile',
              'binding_constitution_verification_ref',
              'binding_constitution_verified_at_ms',
              'binding_constitution_valid_until_ms',
              'deployment_authority_digest',
              'deployment_evidence_digest',
              'deployment_evidence_profile',
              'lease_until_ms',
          ]:
              assert field in receipt, field

          for token in [
              'wire_receipt_transport_only: true',
              'caller_supplied_positive_currentness_accepted: false',
              'wire_receipt_grants_execution_authority: false',
              'final_constitution_context_qualified_locally: true',
              'final_constitution_currentness_evidence_explicit: true',
              'final_constitution_evidence_bound_into_deployment_evidence: true',
              'external_effects_enabled: false',
              'operational: false',
          ]:
              assert token in runtime, token

          # The final dynamic binding key is sourced from the final non-deserializable theorem.
          assert 'binding_constitution_currentness_evidence_digest: deployment' in runtime
          assert 'binding_constitution_currentness_evidence_profile: deployment' in runtime
          assert 'deployment_evidence_digest: deployment.deployment_evidence_digest()' in runtime
          assert 'deployment_evidence_profile: deployment.deployment_evidence_profile().into()' in runtime

          for token in [
              'the wire object is audit/transport data',
              'positive currentness origin is a local verifier call',
              'caller-supplied positive currentness is forbidden',
              'consumer request surfaces are target/action oriented',
              'exact subject and stable deployment binding is mandatory',
              'two dynamic evidence phases are visible',
              'final deployment evidence is the dynamic binding key',
              'lease is checked at the consuming boundary',
              'currentness is necessary but not effect authority',
              'final pre-effect admission must re-resolve currentness',
              'historical verification is separate',
          ]:
              assert token in lower, token

          for positive_name in [
              'CurrentOperationalFreshnessAuditReceipt',
              'VerifiedCurrentOperationalFreshnessReceipt',
              'VerifiedAuthorityFreshness',
              'binding_constitution_currentness_evidence_digest/profile',
          ]:
              assert positive_name in contract, positive_name

          # Same DNA is explicitly insufficient for effect-capable provisioning.
          for gate_token in [
              'same dna != same coordinator implementation',
              'exact installed set, not required-subset matching',
              'unexpected coordinator',
              'observation freshness is bounded but not atomicity',
              'update-race / atomicity policy',
              'caller-supplied coordinator snapshot cannot substitute for a native attestor observation',
          ]:
              assert gate_token in gate_lower, gate_token
          assert 'UnexpectedCoordinator' in coordinator_src
          assert 'MAX_OBSERVATION_REUSE_MS: u64 = 5_000' in coordinator_src

          assert 'directly calling the designated local currentness verifier' in contract
          assert 'final deployment-evidence identity' in lower
          assert '#192 manifest alone as sufficient deployment proof' in contract
          assert 'forged caller-supplied audit receipts are ignored' in lower

          for forbidden in [
              'execute_claimed_',
              'perform_external_effect',
              'automatic_external_effects_enabled = true',
          ]:
              assert forbidden not in runtime

          # Currentness is intentionally not provisioned before conductor-code attestation exists.
          assert 'name: authority_current_freshness_verifier' not in dna
          assert 'name: constitution_currentness_verifier' not in dna

          print('PASS: v0.11 currentness remains transport-only and effect provisioning is blocked until exact native-attested coordinator deployment plus update-race policy are qualified')
          PY
