name: SUP-CIV-000D1C2B2A Exact KEMRecipientInfo DER Vector

on:
  pull_request:
    paths:
      - 'mycelix-workspace/docs/civic-resilience/SUP_CIV_000D1C2B2A_KEMRECIPIENTINFO_DER_V1.md'
      - 'mycelix-workspace/docs/civic-resilience/sup_civ_000d1c2b2a_kemrecipientinfo_der.json'
      - 'mycelix-workspace/docs/civic-resilience/vectors/sup_civ_000d1c2b2a_mlkem768_kemct.bin'
      - 'mycelix-workspace/scripts/sup_civ_kemrecipientinfo_der_vector_v1.py'
      - '.github/workflows/sup-civ-000d1c2b2a-kemrecipientinfo-der.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sup-civ-000d1c2b2a-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Exact KEMRecipientInfo DER syntax vector
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Exact parent and tranche scope
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='dfeff416fa0d3c8be722ac481b31fa361fd7fd5f'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-list --count "$EXPECTED_PARENT"..HEAD)" = '1'
          git diff --check "$EXPECTED_PARENT" HEAD
          mapfile -t changed < <(git diff --name-only "$EXPECTED_PARENT" HEAD | sort)
          expected=(
            '.github/workflows/sup-civ-000d1c2b2a-kemrecipientinfo-der.yml'
            'mycelix-workspace/docs/civic-resilience/SUP_CIV_000D1C2B2A_KEMRECIPIENTINFO_DER_V1.md'
            'mycelix-workspace/docs/civic-resilience/sup_civ_000d1c2b2a_kemrecipientinfo_der.json'
            'mycelix-workspace/docs/civic-resilience/vectors/sup_civ_000d1c2b2a_mlkem768_kemct.bin'
            'mycelix-workspace/scripts/sup_civ_kemrecipientinfo_der_vector_v1.py'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")

      - name: Prove exact vector inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object mycelix-workspace/docs/civic-resilience/sup_civ_000d1c2b2a_kemrecipientinfo_der.json)" = '4ba35bcf55e62852560608c08b15e254f5e4a65d'
          test "$(git hash-object mycelix-workspace/scripts/sup_civ_kemrecipientinfo_der_vector_v1.py)" = '73e83f27df1409764a9d12f0c566ecedde2d85b7'
          test "$(git hash-object mycelix-workspace/docs/civic-resilience/vectors/sup_civ_000d1c2b2a_mlkem768_kemct.bin)" = '47b67c0882f4c2a9ce51c4df8a25627bdc040172'
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          m = json.loads(Path('mycelix-workspace/docs/civic-resilience/sup_civ_000d1c2b2a_kemrecipientinfo_der.json').read_text())
          ct = Path(m['kem_ciphertext']['fixture_path']).read_bytes()
          assert m['schema'] == 'sup-civ-000d1c2b2a-kemrecipientinfo-der-v1'
          assert m['structural_parent'] == 'dfeff416fa0d3c8be722ac481b31fa361fd7fd5f'
          assert m['recipient_identifier']['certificate_binding_proven'] is False
          assert m['recipient_identifier']['authorization_proven'] is False
          assert len(ct) == 1088
          assert hashlib.sha256(ct).hexdigest() == '39826fe40dc54a3fef68b7c228ed8fb22931012b6fa3bd3e7f204d54db0ac1e1'
          assert m['kem']['parameters'] == 'absent'
          assert m['kdf']['parameters'] == 'absent'
          assert m['wrap']['parameters'] == 'absent'
          assert m['expected_kemrecipientinfo']['length'] == 1378
          assert m['expected_kemrecipientinfo']['sha256'] == '2f9b7c9c293fdf4592bd98856f312b7ed2cbc054535e2f5ec1d8a76a299aef02'
          PY

      - name: Syntax-check stdlib DER oracle
        run: python3 -m py_compile mycelix-workspace/scripts/sup_civ_kemrecipientinfo_der_vector_v1.py

      - name: Prove stdlib-only Python imports
        shell: bash
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          path = Path('mycelix-workspace/scripts/sup_civ_kemrecipientinfo_der_vector_v1.py')
          tree = ast.parse(path.read_text())
          allowed = {'__future__','argparse','hashlib','json','pathlib','subprocess','tempfile','dataclasses'}
          imports = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name.split('.')[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imports.add(node.module.split('.')[0])
          unexpected = imports - allowed
          assert not unexpected, unexpected
          print('stdlib-only:', sorted(imports))
          PY

      - name: Execute exact KEMRecipientInfo DER vector
        run: >-
          python3 mycelix-workspace/scripts/sup_civ_kemrecipientinfo_der_vector_v1.py
          --manifest mycelix-workspace/docs/civic-resilience/sup_civ_000d1c2b2a_kemrecipientinfo_der.json

      - name: Refuse runtime and dependency changes
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='dfeff416fa0d3c8be722ac481b31fa361fd7fd5f'
          if git diff --name-only "$EXPECTED_PARENT" HEAD | grep -E '\.(rs|toml|lock|nix)$'; then
            echo 'runtime/dependency file entered C2B2A DER-vector tranche' >&2
            exit 1
          fi

      - name: Immutable checkout postflight
        shell: bash
        run: |
          rm -rf mycelix-workspace/scripts/__pycache__
          test -z "$(git status --porcelain)"
