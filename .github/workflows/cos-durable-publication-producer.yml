name: COS Durable Publication Producer

on:
  workflow_dispatch:
    inputs:
      attestor_run_id:
        description: Exact successful COS qualification attestor run to publish
        required: true
        type: string
      expected_main_sha:
        description: Exact main revision the attestor run must represent
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  prepare:
    name: Prepare deterministic durable publication
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      release_tag: ${{ steps.publish_prep.outputs.release_tag }}
      release_id: ${{ steps.publish_prep.outputs.release_id }}
      asset_name: ${{ steps.publish_prep.outputs.asset_name }}
      asset_sha256: ${{ steps.publish_prep.outputs.asset_sha256 }}
      claim_id: ${{ steps.publish_prep.outputs.claim_id }}
    steps:
      - name: Checkout exact producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate repository identity and inputs
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          printf '%s\n' "${EXPECTED_MAIN_SHA}" | grep -Eq '^[0-9a-f]{40}$'
          test "${EXPECTED_REPOSITORY_ID}" = "1176351975"

      - name: Verify immutable-release capability
        env:
          COS_RELEASE_ADMIN_TOKEN: ${{ secrets.COS_RELEASE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${COS_RELEASE_ADMIN_TOKEN}" || {
            echo "COS_RELEASE_ADMIN_TOKEN is required for immutable-release administration read/write" >&2
            exit 1
          }
          GH_TOKEN="${COS_RELEASE_ADMIN_TOKEN}" gh api "repos/${GITHUB_REPOSITORY}/immutable-releases" > immutable-release-capability.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('immutable-release-capability.json').read_text())
          assert data.get('enabled') is True
          PY

      - name: Read attestor run and exact artifact
        id: source
        env:
          RUN_ID: ${{ inputs.attestor_run_id }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          COS_RELEASE_ADMIN_TOKEN: ${{ secrets.COS_RELEASE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s\n' "${RUN_ID}" | grep -Eq '^[0-9]+$'
          GH_TOKEN="${COS_RELEASE_ADMIN_TOKEN}" gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > attestor-run.json
          GH_TOKEN="${COS_RELEASE_ADMIN_TOKEN}" gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" > attestor-artifacts.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run=json.loads(Path('attestor-run.json').read_text())
          assert run['id'] == int(os.environ['RUN_ID'])
          assert run['status'] == 'completed'
          assert run['conclusion'] == 'success'
          assert run['path'] == '.github/workflows/cos-conformance-qualification-attestor.yml'
          assert run['head_sha'] == os.environ['EXPECTED_MAIN_SHA']
          artifact_name=f"cos-conformance-qualification-attestation-{run['head_sha']}"
          data=json.loads(Path('attestor-artifacts.json').read_text())
          matches=[a for a in data['artifacts'] if a.get('name') == artifact_name]
          assert len(matches) == 1
          artifact=matches[0]
          assert artifact['expired'] is False
          assert artifact['size_in_bytes'] > 0
          assert isinstance(artifact.get('digest'), str) and artifact['digest'].startswith('sha256:')
          Path('attestor-source.json').write_text(json.dumps({
              'run_id': run['id'],
              'run_attempt': run['run_attempt'],
              'head_sha': run['head_sha'],
              'workflow_path': run['path'],
              'artifact_name': artifact_name,
              'artifact_id': artifact['id'],
              'artifact_digest': artifact['digest'],
          },indent=2,sort_keys=True)+'\n')
          PY

      - name: Verify attestor artifact digest
        env:
          COS_RELEASE_ADMIN_TOKEN: ${{ secrets.COS_RELEASE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          artifact_id="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('attestor-source.json').read_text())['artifact_id'])
          PY
          )"
          expected="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('attestor-source.json').read_text())['artifact_digest'].removeprefix('sha256:'))
          PY
          )"
          curl --fail --show-error --silent --location --max-redirs 5 --proto '=https' --tlsv1.2 \
            -H "Authorization: Bearer ${COS_RELEASE_ADMIN_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            --output attestor-artifact.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip"
          actual="$(sha256sum attestor-artifact.zip | awk '{print $1}')"
          test "${actual}" = "${expected}"

      - name: Resolve signing-input artifact from attestor receipt
        env:
          COS_RELEASE_ADMIN_TOKEN: ${{ secrets.COS_RELEASE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          receipt_path="$(find source-artifact -type f -name attestor-run-receipt.json -print -quit)"
          test -n "${receipt_path}"
          RECEIPT_PATH="${receipt_path}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          def reject(pairs):
              out={}
              for key,value in pairs:
                  if key in out:
                      raise ValueError(f'duplicate JSON key: {key}')
                  out[key]=value
              return out

          def reject_constant(value):
              raise ValueError(f'non-standard JSON constant: {value}')

          receipt=json.loads(Path(os.environ['RECEIPT_PATH']).read_text(),object_pairs_hook=reject,parse_constant=reject_constant)
          artifact=receipt['signing_input_artifact']
          assert isinstance(artifact['id'],int) and artifact['id']>0
          assert isinstance(artifact['digest'],str) and artifact['digest'].startswith('sha256:')
          verifier_run_id=receipt['verifier_run']['id']
          assert isinstance(verifier_run_id,int) and verifier_run_id>0
          Path('signing-input-source-request.json').write_text(json.dumps({
              'artifact_id':artifact['id'],
              'artifact_digest':artifact['digest'],
              'verifier_run_id':verifier_run_id
          },indent=2,sort_keys=True)+'\n')
          PY

      - name: Read exact signing-input artifact metadata
        env:
          COS_RELEASE_ADMIN_TOKEN: ${{ secrets.COS_RELEASE_ADMIN_TOKEN }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          artifact_id="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('signing-input-source-request.json').read_text())['artifact_id'])
          PY
          )"
          GH_TOKEN="${COS_RELEASE_ADMIN_TOKEN}" gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" > signing-input-artifact.json
          verifier_run_id="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('signing-input-source-request.json').read_text())['verifier_run_id'])
          PY
          )"
          GH_TOKEN="${COS_RELEASE_ADMIN_TOKEN}" gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${verifier_run_id}" > verifier-run.json
          python - <<'PY'
          import json
          from pathlib import Path
          req=json.loads(Path('signing-input-source-request.json').read_text())
          data=json.loads(Path('signing-input-artifact.json').read_text())
          assert data['id']==req['artifact_id']
          assert data['expired'] is False
          assert data['size_in_bytes']>0
          assert data['digest']==req['artifact_digest']
          assert data['workflow_run']['id']==req['verifier_run_id']
          verifier=json.loads(Path('verifier-run.json').read_text())
          assert verifier['id']==req['verifier_run_id']
          assert verifier['status']=='completed'
          assert verifier['conclusion']=='success'
          assert verifier['path']=='.github/workflows/cos-conformance-evidence.yml'
          assert verifier['head_sha']==__import__('os').environ['EXPECTED_MAIN_SHA']
          Path('signing-input-source.json').write_text(json.dumps({
              'artifact_id':data['id'],
              'artifact_name':data['name'],
              'artifact_digest':data['digest'],
              'workflow_run_id':data['workflow_run']['id']
          },indent=2,sort_keys=True)+'\n')
          PY

      - name: Download exact signing-input artifact
        env:
          COS_RELEASE_ADMIN_TOKEN: ${{ secrets.COS_RELEASE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf signing-input-artifact
          mkdir -p signing-input-artifact
          GH_TOKEN="${COS_RELEASE_ADMIN_TOKEN}" gh run download "$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('signing-input-source.json').read_text())['workflow_run_id'])
          PY
          )" --repo "${GITHUB_REPOSITORY}" --name "$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('signing-input-source.json').read_text())['artifact_name'])
          PY
          )" --dir signing-input-artifact

      - name: Verify signing-input artifact digest
        env:
          COS_RELEASE_ADMIN_TOKEN: ${{ secrets.COS_RELEASE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          artifact_id="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('signing-input-source.json').read_text())['artifact_id'])
          PY
          )"
          expected="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('signing-input-source.json').read_text())['artifact_digest'].removeprefix('sha256:'))
          PY
          )"
          curl --fail --show-error --silent --location --max-redirs 5 --proto '=https' --tlsv1.2 \
            -H "Authorization: Bearer ${COS_RELEASE_ADMIN_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            --output signing-input-artifact.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip"
          actual="$(sha256sum signing-input-artifact.zip | awk '{print $1}')"
          test "${actual}" = "${expected}"

      - name: Extract and validate source evidence
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          rm -rf durable-source
          mkdir -p durable-source
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          def one(root,name):
              matches=list(root.rglob(name))
              assert len(matches)==1, (name,[str(p) for p in matches])
              return matches[0]

          source=Path('source-artifact')
          signing=Path('signing-input-artifact')
          shutil.copyfile(one(source,'attestor-run-receipt.json'),'durable-source/attestor-run-receipt.json')
          shutil.copyfile(one(source,'qualification-attestation-bundle.json'),'durable-source/qualification-attestation-bundle.json')
          shutil.copyfile(one(signing,'qualification-manifest-v1.json'),'durable-source/qualification-manifest-v1.json')
          shutil.copyfile(one(signing,'qualification-attestation-predicate-v3.json'),'durable-source/qualification-attestation-predicate-v3.json')

          def strict(path):
              def reject(pairs):
                  out={}
                  for key,value in pairs:
                      if key in out:
                          raise ValueError(f'duplicate JSON key: {key}')
                      out[key]=value
                  return out
              def reject_constant(value):
                  raise ValueError(f'non-standard JSON constant: {value}')
              return json.loads(path.read_text(),object_pairs_hook=reject,parse_constant=reject_constant)

          receipt=strict(Path('durable-source/attestor-run-receipt.json'))
          predicate=strict(Path('durable-source/qualification-attestation-predicate-v3.json'))
          manifest_raw=Path('durable-source/qualification-manifest-v1.json').read_bytes()
          manifest=strict(Path('durable-source/qualification-manifest-v1.json'))
          bundle=Path('durable-source/qualification-attestation-bundle.json')
          manifest_sha=hashlib.sha256(manifest_raw).hexdigest()
          predicate_sha=hashlib.sha256(Path('durable-source/qualification-attestation-predicate-v3.json').read_bytes()).hexdigest()
          bundle_sha=hashlib.sha256(bundle.read_bytes()).hexdigest()
          assert manifest['schema']=='MYCELIX-COS-CONFORMANCE-QUALIFICATION-MANIFEST-V1'
          assert manifest['claim_ceiling']=='ReferenceModelOnly'
          assert manifest['expected_head_sha']==os.environ['EXPECTED_MAIN_SHA']
          assert receipt['qualification_manifest_sha256']==manifest_sha
          assert predicate['schema']=='MYCELIX-COS-QUALIFICATION-ATTESTATION-PREDICATE-V3'
          assert predicate['qualification_manifest_sha256']==manifest_sha
          assert predicate['qualification_claim_id']==receipt['qualification_claim_id']
          assert receipt['schema']=='MYCELIX-COS-QUALIFICATION-ATTESTOR-RECEIPT-V3'
          assert receipt['predicate_sha256']==predicate_sha
          assert receipt['attestation']['bundle_sha256']==bundle_sha
          assert receipt['repository']==os.environ['GITHUB_REPOSITORY']
          assert receipt['repository_id']==int(os.environ['EXPECTED_REPOSITORY_ID'])
          assert receipt['qualification_topology']['head_sha']==os.environ['EXPECTED_MAIN_SHA']
          assert receipt['trust_root']['status']=='candidate_not_authoritative_until_protected_adoption'
          assert receipt['attestor']['workflow_ref']==f"{os.environ['GITHUB_REPOSITORY']}/.github/workflows/cos-conformance-qualification-attestor.yml@refs/heads/main"
          assert len(receipt['qualification_claim_id'])==64 and all(c in '0123456789abcdef' for c in receipt['qualification_claim_id'])
          signing_meta=json.loads(Path('signing-input-source.json').read_text())
          assert receipt['signing_input_artifact']['id']==signing_meta['artifact_id']
          assert receipt['signing_input_artifact']['digest']==signing_meta['artifact_digest']
          Path('source-facts.json').write_text(json.dumps({
              'claim_id':receipt['qualification_claim_id'],
              'manifest_sha256':manifest_sha,
              'predicate_sha256':predicate_sha,
              'bundle_sha256':bundle_sha,
              'attestor_workflow_sha':receipt['attestor']['workflow_sha'],
              'attestor_workflow_ref':receipt['attestor']['workflow_ref'],
              'trust_root_manifest_sha256':receipt['trust_root']['manifest_sha256'],
              'trust_root_manifest_blob_sha1':receipt['trust_root']['manifest_blob_sha1'],
              'signing_input_artifact_id':receipt['signing_input_artifact']['id'],
              'signing_input_artifact_digest':receipt['signing_input_artifact']['digest']
          },indent=2,sort_keys=True)+'\n')
          PY

      - name: Reconcile signer workflow with exact trust root
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
          COS_RELEASE_ADMIN_TOKEN: ${{ secrets.COS_RELEASE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          signer_sha="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('source-facts.json').read_text())['attestor_workflow_sha'])
          PY
          )"
          GH_TOKEN="${COS_RELEASE_ADMIN_TOKEN}" gh api "repos/${GITHUB_REPOSITORY}/contents/.github/cos/qualification-trust-root-v2.json" -f "ref=${EXPECTED_MAIN_SHA}" > trust-root.json
          GH_TOKEN="${COS_RELEASE_ADMIN_TOKEN}" gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/cos-conformance-qualification-attestor.yml" -f "ref=${signer_sha}" > signer-workflow.json
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          def reject(pairs):
              out={}
              for key,value in pairs:
                  if key in out:
                      raise ValueError(f'duplicate JSON key: {key}')
                  out[key]=value
              return out

          def reject_constant(value):
              raise ValueError(f'non-standard JSON constant: {value}')

          def strict(text):
              return json.loads(text,object_pairs_hook=reject,parse_constant=reject_constant)

          root_api=strict(Path('trust-root.json').read_text())
          workflow_api=strict(Path('signer-workflow.json').read_text())
          assert root_api['path']=='.github/cos/qualification-trust-root-v2.json'
          assert workflow_api['path']=='.github/workflows/cos-conformance-qualification-attestor.yml'
          root_bytes=base64.b64decode(''.join(root_api['content'].splitlines()),validate=True)
          workflow_bytes=base64.b64decode(''.join(workflow_api['content'].splitlines()),validate=True)
          root=strict(root_bytes.decode('utf-8'))
          assert root['schema']=='MYCELIX-COS-QUALIFICATION-TRUST-ROOT-V2'
          assert root['repository']==os.environ['GITHUB_REPOSITORY']
          assert root['repository_id']==int(os.environ['EXPECTED_REPOSITORY_ID'])
          assert root['status']=='candidate_not_authoritative_until_protected_adoption'
          assert root['claim_ceiling']=='ReferenceModelOnly'
          component=root['components']['qualification_attestor_workflow']
          assert component['path']=='.github/workflows/cos-conformance-qualification-attestor.yml'
          root_sha256=hashlib.sha256(root_bytes).hexdigest()
          root_blob_sha1=subprocess.check_output(['git','hash-object','--stdin'],input=root_bytes).decode().strip()
          signer_blob_sha1=subprocess.check_output(['git','hash-object','--stdin'],input=workflow_bytes).decode().strip()
          signer_content_sha256=hashlib.sha256(workflow_bytes).hexdigest()
          receipt=strict(Path('durable-source/attestor-run-receipt.json').read_text())
          assert root_sha256==receipt['trust_root']['manifest_sha256']
          assert root_blob_sha1==receipt['trust_root']['manifest_blob_sha1']
          assert signer_blob_sha1==component['git_blob_sha1']
          assert signer_content_sha256==component['content_sha256']
          facts=json.loads(Path('source-facts.json').read_text())
          facts.update({
              'attestor_workflow_git_blob_sha1':signer_blob_sha1,
              'attestor_workflow_content_sha256':signer_content_sha256,
              'trust_root_manifest_sha256':root_sha256,
              'trust_root_manifest_blob_sha1':root_blob_sha1
          })
          Path('source-facts.json').write_text(json.dumps(facts,indent=2,sort_keys=True)+'\n')
          PY

      - name: Verify signed qualification attestation before publication
        run: |
          set -euo pipefail
          signer_sha="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('source-facts.json').read_text())['attestor_workflow_sha'])
          PY
          )"
          gh attestation verify durable-source/qualification-manifest-v1.json \
            --repo "${GITHUB_REPOSITORY}" \
            --bundle durable-source/qualification-attestation-bundle.json \
            --predicate-type "https://luminousdynamics.io/attestations/mycelix-cos-qualification/v1" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/cos-conformance-qualification-attestor.yml" \
            --signer-digest "${signer_sha}" \
            --deny-self-hosted-runners \
            --format json > source-attestation-verification.json
          python - <<'PY'
          import json
          from pathlib import Path

          def reject(pairs):
              out={}
              for key,value in pairs:
                  if key in out:
                      raise ValueError(f'duplicate JSON key: {key}')
                  out[key]=value
              return out

          def reject_constant(value):
              raise ValueError(f'non-standard JSON constant: {value}')

          data=json.loads(Path('source-attestation-verification.json').read_text(),object_pairs_hook=reject,parse_constant=reject_constant)
          predicate=json.loads(Path('durable-source/qualification-attestation-predicate-v3.json').read_text(),object_pairs_hook=reject,parse_constant=reject_constant)
          expected_subject=json.loads(Path('durable-source/qualification-manifest-v1.json').read_text(),object_pairs_hook=reject,parse_constant=reject_constant)
          assert isinstance(data,list) and data
          manifest_sha=__import__('hashlib').sha256(Path('durable-source/qualification-manifest-v1.json').read_bytes()).hexdigest()
          matches=0
          for item in data:
              statement=item['verificationResult']['statement']
              assert statement['predicateType']=='https://luminousdynamics.io/attestations/mycelix-cos-qualification/v1'
              assert any(subject.get('name')=='qualification-manifest-v1.json' and subject.get('digest',{}).get('sha256')==manifest_sha for subject in statement['subject'])
              assert statement['predicate']==predicate
              matches+=1
          assert matches>=1
          assert expected_subject['qualification_result']=='passed'
          PY
          test -s source-attestation-verification.json

      - name: Create immutable-release draft
        id: draft
        env:
          COS_RELEASE_ADMIN_TOKEN: ${{ secrets.COS_RELEASE_ADMIN_TOKEN }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          claim_id="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('source-facts.json').read_text())['claim_id'])
          PY
          )"
          release_tag="cos-qualification-${claim_id}"
          if git ls-remote --exit-code --refs origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
            echo "release tag already exists: ${release_tag}" >&2
            exit 1
          fi
          if GH_TOKEN="${COS_RELEASE_ADMIN_TOKEN}" gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release already exists: ${release_tag}" >&2
            exit 1
          fi
          GH_TOKEN="${COS_RELEASE_ADMIN_TOKEN}" gh release create "${release_tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${EXPECTED_MAIN_SHA}" \
            --title "COS Qualification ${claim_id}" \
            --notes "Candidate-only content-addressed COS publication. Claim ceiling remains ReferenceModelOnly; no authority is granted by publication alone." \
            --draft
          GH_TOKEN="${COS_RELEASE_ADMIN_TOKEN}" gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" --json id,tagName,isDraft,targetCommitish > draft-release.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          data=json.loads(Path('draft-release.json').read_text())
          assert data['tagName'].startswith('cos-qualification-')
          assert data['isDraft'] is True
          assert data['targetCommitish'] == os.environ['EXPECTED_MAIN_SHA']
          print(f"release_id={data['id']}")
          print(f"release_tag={data['tagName']}")
          PY

      - name: Build deterministic durable asset
        id: package
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          COS_RELEASE_ADMIN_TOKEN: ${{ secrets.COS_RELEASE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          claim_id="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('source-facts.json').read_text())['claim_id'])
          PY
          )"
          release_id="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('draft-release.json').read_text())['id'])
          PY
          )"
          release_tag="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('draft-release.json').read_text())['tagName'])
          PY
          )"
          asset_name="cos-durable-${claim_id}.tar.gz"
          ASSET_NAME="${asset_name}" EXPECTED_MAIN_SHA="${EXPECTED_MAIN_SHA}" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          facts=json.loads(Path('source-facts.json').read_text())
          release=json.loads(Path('draft-release.json').read_text())
          asset_name=os.environ['ASSET_NAME']
          core=['qualification-manifest-v1.json','qualification-attestation-predicate-v3.json','attestor-run-receipt.json','qualification-attestation-bundle.json']
          files={name:hashlib.sha256((Path('durable-source')/name).read_bytes()).hexdigest() for name in core}
          manifest={
              'schema':'MYCELIX-COS-DURABLE-PUBLICATION-MANIFEST-V1',
              'repository':os.environ['GITHUB_REPOSITORY'],
              'repository_id':int(os.environ['GITHUB_REPOSITORY_ID']),
              'release_tag':release['tagName'],
              'release_id':release['id'],
              'asset_name':asset_name,
              'expected_main_sha':os.environ['EXPECTED_MAIN_SHA'],
              'qualification_claim_id':facts['claim_id'],
              'qualification_manifest_sha256':facts['manifest_sha256'],
              'predicate_type':'https://luminousdynamics.io/attestations/mycelix-cos-qualification/v1',
              'publication_profile':'CONTENT-ADDRESSED-DURABLE-PUBLICATION-V1',
              'claim_ceiling':'ReferenceModelOnly',
              'trust_root_manifest_blob_sha1':facts['trust_root_manifest_blob_sha1'],
              'trust_root_manifest_sha256':facts['trust_root_manifest_sha256'],
              'attestor_workflow_path':facts['attestor_workflow_ref'],
              'attestor_workflow_sha':facts['attestor_workflow_sha'],
              'signed_attestation_bundle_sha256':facts['bundle_sha256'],
              'files':files,
          }
          Path('durable-source/durable-publication-manifest-v1.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY
          (
            cd durable-source
            LC_ALL=C sha256sum qualification-manifest-v1.json qualification-attestation-predicate-v3.json attestor-run-receipt.json qualification-attestation-bundle.json durable-publication-manifest-v1.json
          ) > durable-source/SHA256SUMS
          build_asset() {
            local output="$1"
            tar -C durable-source --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf - durable-publication-manifest-v1.json qualification-manifest-v1.json qualification-attestation-predicate-v3.json attestor-run-receipt.json qualification-attestation-bundle.json SHA256SUMS | gzip -n > "${output}"
          }
          build_asset "asset-a.tar.gz"
          build_asset "asset-b.tar.gz"
          sha256_a="$(sha256sum asset-a.tar.gz | awk '{print $1}')"
          sha256_b="$(sha256sum asset-b.tar.gz | awk '{print $1}')"
          test "${sha256_a}" = "${sha256_b}" || {
            echo "deterministic durable asset mismatch: ${sha256_a} != ${sha256_b}" >&2
            exit 1
          }
          mv asset-a.tar.gz "${asset_name}"
          rm -f asset-b.tar.gz
          gzip -t "${asset_name}"
          sha256sum "${asset_name}" | awk '{print $1}' > asset.sha256

          rm -rf local-verify
          mkdir local-verify
          tar -xzf "${asset_name}" -C local-verify
          (cd local-verify && sha256sum --check --strict SHA256SUMS)
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root=Path('local-verify')
          members={p.name for p in root.iterdir() if p.is_file()}
          assert members == {
              'durable-publication-manifest-v1.json',
              'qualification-manifest-v1.json',
              'qualification-attestation-predicate-v3.json',
              'attestor-run-receipt.json',
              'qualification-attestation-bundle.json',
              'SHA256SUMS',
          }
          def strict(path):
              def reject(pairs):
                  out={}
                  for key,value in pairs:
                      if key in out:
                          raise ValueError(f'duplicate JSON key: {key}')
                      out[key]=value
                  return out
              def reject_constant(value):
                  raise ValueError(f'non-standard JSON constant: {value}')
              return json.loads(path.read_text(),object_pairs_hook=reject,parse_constant=reject_constant)
          manifest=strict(root/'durable-publication-manifest-v1.json')
          receipt=strict(root/'attestor-run-receipt.json')
          predicate=strict(root/'qualification-attestation-predicate-v3.json')
          bundle_sha=hashlib.sha256((root/'qualification-attestation-bundle.json').read_bytes()).hexdigest()
          assert manifest['schema']=='MYCELIX-COS-DURABLE-PUBLICATION-MANIFEST-V1'
          assert manifest['claim_ceiling']=='ReferenceModelOnly'
          assert manifest['signed_attestation_bundle_sha256']==bundle_sha
          assert receipt['attestation']['bundle_sha256']==bundle_sha
          assert manifest['qualification_claim_id']==receipt['qualification_claim_id']
          assert manifest['qualification_manifest_sha256']==hashlib.sha256((root/'qualification-manifest-v1.json').read_bytes()).hexdigest()
          assert manifest['predicate_type']==predicate['predicate_type']
          expected_files={
              name:hashlib.sha256((root/name).read_bytes()).hexdigest()
              for name in ('qualification-manifest-v1.json','qualification-attestation-predicate-v3.json','attestor-run-receipt.json','qualification-attestation-bundle.json')
          }
          assert manifest['files']==expected_files
          PY

          GH_TOKEN="${COS_RELEASE_ADMIN_TOKEN}" gh release upload "${release_tag}" "${asset_name}" --repo "${GITHUB_REPOSITORY}"
          GH_TOKEN="${COS_RELEASE_ADMIN_TOKEN}" gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" --json assets > draft-release-with-asset.json
          ASSET_NAME="${asset_name}" python - <<'PY'
          import json
          import os
          from pathlib import Path
          data=json.loads(Path('draft-release-with-asset.json').read_text())
          matches=[a for a in data['assets'] if a.get('name')==os.environ['ASSET_NAME'] and a.get('state')=='uploaded']
          assert len(matches)==1
          assert matches[0].get('digest','').startswith('sha256:')
          PY
          echo "${asset_name}" > prepared-asset-name.txt
          cat asset.sha256 > prepared-asset-sha256.txt

      - name: Export publication outputs
        id: publish_prep
        run: |
          set -euo pipefail
          claim_id="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('source-facts.json').read_text())['claim_id'])
          PY
          )"
          release_tag="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('draft-release.json').read_text())['tagName'])
          PY
          )"
          release_id="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('draft-release.json').read_text())['id'])
          PY
          )"
          asset_name="$(cat prepared-asset-name.txt)"
          asset_sha256="$(cat prepared-asset-sha256.txt)"
          echo "claim_id=${claim_id}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${asset_name}" >> "$GITHUB_OUTPUT"
          echo "asset_sha256=${asset_sha256}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish and prove immutable release
    needs: prepare
    runs-on: ubuntu-24.04
    environment: cos-durable-publication
    timeout-minutes: 15
    steps:
      - name: Validate immutable-release capability again
        env:
          COS_RELEASE_ADMIN_TOKEN: ${{ secrets.COS_RELEASE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          GH_TOKEN="${COS_RELEASE_ADMIN_TOKEN}" gh api "repos/${GITHUB_REPOSITORY}/immutable-releases" > immutable-release-capability.json
          python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('immutable-release-capability.json').read_text()).get('enabled') is True
          PY

      - name: Revalidate draft release and asset before publish
        env:
          COS_RELEASE_ADMIN_TOKEN: ${{ secrets.COS_RELEASE_ADMIN_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          EXPECTED_ASSET_NAME: ${{ needs.prepare.outputs.asset_name }}
          EXPECTED_ASSET_SHA256: ${{ needs.prepare.outputs.asset_sha256 }}
        run: |
          set -euo pipefail
          GH_TOKEN="${COS_RELEASE_ADMIN_TOKEN}" gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json id,tagName,isDraft,targetCommitish,assets > draft-release-final-check.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          data=json.loads(Path('draft-release-final-check.json').read_text())
          assert data['tagName']==os.environ['RELEASE_TAG']
          assert data['isDraft'] is True
          assert data['targetCommitish']==os.environ['EXPECTED_MAIN_SHA']
          matches=[a for a in data['assets'] if a.get('name')==os.environ['EXPECTED_ASSET_NAME'] and a.get('state')=='uploaded']
          assert len(matches)==1
          expected='sha256:'+os.environ['EXPECTED_ASSET_SHA256']
          assert matches[0]['digest']==expected
          PY

      - name: Publish release
        env:
          COS_RELEASE_ADMIN_TOKEN: ${{ secrets.COS_RELEASE_ADMIN_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          GH_TOKEN="${COS_RELEASE_ADMIN_TOKEN}" gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false

      - name: Prove immutable release and release attestation
        env:
          COS_RELEASE_ADMIN_TOKEN: ${{ secrets.COS_RELEASE_ADMIN_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          GH_TOKEN="${COS_RELEASE_ADMIN_TOKEN}" gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json id,tagName,isDraft,isImmutable,publishedAt > published-release.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('published-release.json').read_text())
          assert data['isDraft'] is False
          assert data['isImmutable'] is True
          assert data['publishedAt']
          PY
          status=1
          for _ in 1 2 3 4 5; do
            if GH_TOKEN="${COS_RELEASE_ADMIN_TOKEN}" gh release verify "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --format json > release-attestation-verification.json; then
              status=0
              break
            fi
            sleep 5
          done
          test "${status}" = 0

      - name: Prove final release asset
        env:
          COS_RELEASE_ADMIN_TOKEN: ${{ secrets.COS_RELEASE_ADMIN_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          ASSET_NAME: ${{ needs.prepare.outputs.asset_name }}
        run: |
          set -euo pipefail
          rm -rf final-asset
          mkdir final-asset
          GH_TOKEN="${COS_RELEASE_ADMIN_TOKEN}" gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "${ASSET_NAME}" --dir final-asset
          GH_TOKEN="${COS_RELEASE_ADMIN_TOKEN}" gh release verify-asset "${RELEASE_TAG}" "final-asset/${ASSET_NAME}" --repo "${GITHUB_REPOSITORY}" --format json > release-asset-attestation-verification.json
          final_sha256="$(sha256sum "final-asset/${ASSET_NAME}" | awk '{print $1}')"
          test "${final_sha256}" = "${{ needs.prepare.outputs.asset_sha256 }}"

      - name: Preserve final publication receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a0 # v7.0.1
        with:
          name: cos-durable-publication-receipt-${{ needs.prepare.outputs.claim_id }}
          path: |
            published-release.json
            release-attestation-verification.json
            release-asset-attestation-verification.json
          if-no-files-found: error
          retention-days: 30