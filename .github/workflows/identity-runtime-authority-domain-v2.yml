name: Identity Runtime Authority Domain V2

on:
  pull_request:
    paths:
      - 'mycelix-workspace/mycelix-identity/Cargo.toml'
      - 'mycelix-workspace/mycelix-identity/crates/identity-authority-domain-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/identity-runtime-authority-domain-adapter/**'
      - '.github/workflows/identity-runtime-authority-domain-v2.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-workspace/mycelix-identity/Cargo.toml'
      - 'mycelix-workspace/mycelix-identity/crates/identity-authority-domain-policy/**'
      - 'mycelix-workspace/mycelix-identity/crates/identity-runtime-authority-domain-adapter/**'
      - '.github/workflows/identity-runtime-authority-domain-v2.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify-runtime-authority-domain-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Assert one-way runtime DNA provenance boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          root = Path('mycelix-workspace/mycelix-identity')
          member = 'crates/identity-runtime-authority-domain-adapter'
          workspace = tomllib.loads((root / 'Cargo.toml').read_text())
          if member not in workspace['workspace']['members']:
              raise SystemExit(f'ERROR: {member} is not an explicit Identity workspace member')

          manifest = tomllib.loads((root / member / 'Cargo.toml').read_text())
          deps = manifest.get('dependencies', {})
          expected = {'hdk', 'mycelix-identity-authority-domain-policy'}
          if set(deps) != expected:
              raise SystemExit(f'ERROR: runtime-domain adapter dependency drift: {sorted(deps)}')
          if deps['hdk'].get('workspace') is not True:
              raise SystemExit('ERROR: runtime-domain adapter must use workspace-pinned HDK')
          if deps['mycelix-identity-authority-domain-policy'].get('path') != '../identity-authority-domain-policy':
              raise SystemExit('ERROR: runtime-domain adapter must bind canonical #369 theorem')

          text = (root / member / 'src/lib.rs').read_text()
          required = [
              '#![forbid(unsafe_code)]',
              'pub const RUNTIME_IDENTITY_AUTHORITY_DOMAIN_ID_V2: &str = "mycelix-identity-v2";',
              'pub const RUNTIME_IDENTITY_AUTHORITY_DOMAIN_EPOCH_V2: u32 = 1;',
              'RuntimeQualifiedIdentityAuthorityDomainV2',
              'pub fn qualify_running_identity_authority_domain_v2(',
              'let info = dna_info()?;',
              'dna_hash_raw_39: info.hash.get_raw_39(),',
              'qualify_identity_authority_domain_v2',
              'authority_domain_digest_sha256: *qualified.digest_sha256()',
              'runtime_capability_does_not_expose_raw_dna_or_public_fields',
              'runtime_qualification_has_no_caller_input',
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'ERROR: runtime-domain invariant missing: {needle!r}')

          result_start = text.index('pub struct RuntimeQualifiedIdentityAuthorityDomainV2')
          result_end = text.index('impl RuntimeQualifiedIdentityAuthorityDomainV2', result_start)
          result_body = text[result_start:result_end]
          if 'pub authority_domain_digest_sha256:' in result_body:
              raise SystemExit('ERROR: runtime-domain capability has a public forgeable field')

          impl_start = result_end
          qualify_start = text.index('pub fn qualify_running_identity_authority_domain_v2(', impl_start)
          impl_body = text[impl_start:qualify_start]
          for leaked in ['dna_hash_raw_39', 'qualified_domain', 'DnaHash']:
              if leaked in impl_body:
                  raise SystemExit(f'ERROR: raw/runtime domain material leaked through public capability API: {leaked!r}')

          signature_end = text.index('{', qualify_start)
          signature = text[qualify_start:signature_end]
          if ':' in signature.split('(', 1)[1].split(')', 1)[0]:
              raise SystemExit('ERROR: runtime-domain qualification accepts caller input')

          lower = text.lower()
          for forbidden in [
              '#[hdk_extern]',
              'network_seed',
              'sys_time(',
              'get_agent_activity(',
              'get_details(',
              'get_links(',
              'resolve_did(',
              'policy_current',
              'policy_accepted',
              'signature_verified',
              '.verify(',
              'positive_evidence',
          ]:
              if forbidden in lower:
                  raise SystemExit(f'ERROR: unrelated authority semantics leaked into runtime-domain adapter: {forbidden!r}')
          PY

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-workspace/mycelix-identity

      - name: Check formatting
        run: |
          cargo fmt --manifest-path mycelix-workspace/mycelix-identity/crates/identity-runtime-authority-domain-adapter/Cargo.toml -- --check

      - name: Test pure authority-domain theorem
        run: |
          cargo test --manifest-path mycelix-workspace/mycelix-identity/crates/identity-authority-domain-policy/Cargo.toml

      - name: Test runtime-domain adapter boundary
        run: |
          cargo test --manifest-path mycelix-workspace/mycelix-identity/crates/identity-runtime-authority-domain-adapter/Cargo.toml

      - name: Check runtime-domain adapter for wasm32
        run: |
          cargo check --manifest-path mycelix-workspace/mycelix-identity/crates/identity-runtime-authority-domain-adapter/Cargo.toml --target wasm32-unknown-unknown
