name: Finance Zome Contracts Phase A

on:
  pull_request:
    paths:
      - '.github/workflows/finance-zome-contracts-phase-a.yml'

permissions:
  contents: read

concurrency:
  group: finance-zome-contracts-phase-a
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: '1.96.0'
  SOURCE_SHA: 'ea01f1f02e08b04786bce4e85d50a6a7d1f8408f'

jobs:
  qualify:
    name: Qualify ABI-neutral contract phase A
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ci-fin-safe-024-phase-a'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout frozen FIN-SAFE-020 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Apply FIN-SAFE-021/023/022 prerequisite repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # FIN-SAFE-021: macro-provided traits must not be derived twice.
          for path in [
              Path('mycelix-finance/zomes/collateral-settlement-auth/integrity/src/lib.rs'),
              Path('mycelix-finance/zomes/sap-account-v2/integrity/src/lib.rs'),
              Path('mycelix-finance/zomes/sap-transfer-v2/integrity/src/lib.rs'),
          ]:
              text = path.read_text()
              old = '#[dna_properties]\n#[derive(Clone, Debug, Serialize, Deserialize)]'
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one DNA properties derive pattern')
              path.write_text(text.replace(old, '#[dna_properties]\n#[derive(Clone)]'))

          # FIN-SAFE-023: retain exact AppEntryDef equality through pinned HDI API.
          for path in [
              Path('mycelix-finance/zomes/collateral-issuance-v2/integrity/src/lib.rs'),
              Path('mycelix-finance/zomes/sap-account-v2/integrity/src/lib.rs'),
              Path('mycelix-finance/zomes/sap-transfer-v2/integrity/src/lib.rs'),
          ]:
              text = path.read_text()
              marker = 'fn require_exact_create_entry('
              next_fn = '\nfn decode_entry'
              if text.count(marker) != 1:
                  raise SystemExit(f'{path}: exact-create helper count mismatch')
              start = text.index(marker)
              end = text.index(next_fn, start)
              block = text[start:end]
              for needle in [
                  'record.action().app_entry_def()',
                  'Some(actual) if actual == &expected => Ok(()),',
                  'Some(actual) => Err(format!(',
                  'None => Err(format!("{label} is not an application entry")),',
              ]:
                  if block.count(needle) != 1:
                      raise SystemExit(f'{path}: helper shape mismatch for {needle!r}')
              block = block.replace('record.action().app_entry_def()', 'record.action().entry_type()')
              block = block.replace(
                  'Some(actual) if actual == &expected => Ok(()),',
                  'Some(EntryType::App(actual)) if actual == &expected => Ok(()),',
              )
              block = block.replace(
                  'Some(actual) => Err(format!(',
                  'Some(EntryType::App(actual)) => Err(format!(',
                  1,
              )
              block = block.replace(
                  '        None => Err(format!("{label} is not an application entry")),',
                  '        Some(actual) => Err(format!(\n'
                  '            "{label} is not an application entry: got {actual:?}"\n'
                  '        )),\n'
                  '        None => Err(format!("{label} has no entry type")),',
              )
              path.write_text(text[:start] + block + text[end:])

          # FIN-SAFE-022: this import exists only under #[cfg(test)].
          manifest = Path('mycelix-finance/zomes/collateral-settlement-auth/integrity/Cargo.toml')
          text = manifest.read_text()
          if '[dev-dependencies]' in text:
              raise SystemExit('settlement-auth dev-dependencies unexpectedly already exist')
          manifest.write_text(text.rstrip() + '\n\n[dev-dependencies]\nfinance-collateral-settlement = { path = "../../../crates/finance-collateral-settlement" }\n')
          PY

      - name: Introduce ABI-neutral shared contract crate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mycelix-finance/crates/finance-holochain-contracts/src
          cat > mycelix-finance/crates/finance-holochain-contracts/Cargo.toml <<'EOF'
          [package]
          name = "finance-holochain-contracts"
          version = "0.1.0"
          edition = "2024"
          license.workspace = true
          description = "ABI-neutral shared Holochain entry contracts for Mycelix Finance V2 zomes"

          [dependencies]
          hdi = { workspace = true }
          holochain_serialized_bytes = { workspace = true }
          serde = { workspace = true }
          finance-collateral-deposit = { path = "../finance-collateral-deposit" }
          finance-collateral-auth = { path = "../finance-collateral-auth" }
          EOF

          cat > mycelix-finance/crates/finance-holochain-contracts/src/lib.rs <<'EOF'
          #![deny(unsafe_code)]
          // Copyright (C) 2024-2026 Tristan Stoltz / Luminous Dynamics
          // SPDX-License-Identifier: AGPL-3.0-or-later
          // Commercial licensing: see COMMERCIAL_LICENSE.md at repository root
          //! Shared serialized entry contracts for Finance V2 Holochain zomes.
          //!
          //! This crate deliberately declares no EntryTypes, LinkTypes, callbacks,
          //! externs, or zome authority. It exists so producer and consumer zomes
          //! compile against one canonical payload type without Rust-linking one
          //! integrity zome into another.

          use finance_collateral_auth::{
              CollateralSettlementAuthConfig, CustodyAttestationV1, PriceAttestationV1,
          };
          use finance_collateral_deposit::{
              COLLATERAL_DEPOSIT_NONCE_BYTES, CollateralDepositRequestV2,
          };
          use hdi::prelude::*;

          /// Narrow host-call/commit latency allowance shared by request producer
          /// and exact-action consumers.
          pub const MAX_CREATE_TIMESTAMP_SKEW_MICROS: i64 = 5_000_000;

          #[dna_properties]
          #[derive(Clone)]
          pub struct FinanceCollateralAuthDnaProperties {
              pub collateral_settlement_auth: CollateralSettlementAuthConfig,
          }

          pub fn load_collateral_auth_config() -> ExternResult<CollateralSettlementAuthConfig> {
              Ok(FinanceCollateralAuthDnaProperties::try_from_dna_properties()?
                  .collateral_settlement_auth)
          }

          #[hdk_entry_helper]
          #[derive(Clone, PartialEq)]
          pub struct CollateralDepositRequestV2Entry {
              pub schema_version: u16,
              pub deposit_id: String,
              pub depositor_did: String,
              pub collateral_asset_id: String,
              pub collateral_amount: u64,
              pub quote_asset_id: String,
              pub request_nonce: Vec<u8>,
              pub created_at_micros: i64,
          }

          impl CollateralDepositRequestV2Entry {
              pub fn to_model(&self) -> Result<CollateralDepositRequestV2, String> {
                  let request_nonce: [u8; COLLATERAL_DEPOSIT_NONCE_BYTES] =
                      self.request_nonce.as_slice().try_into().map_err(|_| {
                          format!(
                              "request_nonce must contain exactly {} bytes",
                              COLLATERAL_DEPOSIT_NONCE_BYTES
                          )
                      })?;
                  Ok(CollateralDepositRequestV2 {
                      schema_version: self.schema_version,
                      deposit_id: self.deposit_id.clone(),
                      depositor_did: self.depositor_did.clone(),
                      collateral_asset_id: self.collateral_asset_id.clone(),
                      collateral_amount: self.collateral_amount,
                      quote_asset_id: self.quote_asset_id.clone(),
                      request_nonce,
                      created_at_micros: self.created_at_micros,
                  })
              }
          }

          impl From<CollateralDepositRequestV2> for CollateralDepositRequestV2Entry {
              fn from(value: CollateralDepositRequestV2) -> Self {
                  Self {
                      schema_version: value.schema_version,
                      deposit_id: value.deposit_id,
                      depositor_did: value.depositor_did,
                      collateral_asset_id: value.collateral_asset_id,
                      collateral_amount: value.collateral_amount,
                      quote_asset_id: value.quote_asset_id,
                      request_nonce: value.request_nonce.to_vec(),
                      created_at_micros: value.created_at_micros,
                  }
              }
          }

          #[hdk_entry_helper]
          #[derive(Clone, PartialEq)]
          pub struct PriceAttestationV1Entry {
              pub attestation: PriceAttestationV1,
          }

          #[hdk_entry_helper]
          #[derive(Clone, PartialEq)]
          pub struct CustodyAttestationV1Entry {
              pub attestation: CustodyAttestationV1,
          }
          EOF

      - name: Move deposit and settlement-auth payload ownership into contract crate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # Register the contract crate in the workspace.
          ws = Path('mycelix-finance/Cargo.toml')
          text = ws.read_text()
          needle = '    "crates/finance-collateral-auth",\n'
          if text.count(needle) != 1:
              raise SystemExit('workspace insertion anchor mismatch')
          ws.write_text(text.replace(needle, needle + '    "crates/finance-holochain-contracts",\n'))

          # Deposit integrity now owns only zome authority; payload lives in contracts.
          path = Path('mycelix-finance/zomes/collateral-deposit-v2/integrity/src/lib.rs')
          text = path.read_text()
          start = text.index('/// The coordinator obtains `created_at_micros`')
          end = text.index('#[hdk_entry_types]', start)
          text = text[:start] + text[end:]
          text = text.replace(
              'use finance_collateral_deposit::{COLLATERAL_DEPOSIT_NONCE_BYTES, CollateralDepositRequestV2};\nuse hdi::prelude::*;',
              'use finance_holochain_contracts::{\n    CollateralDepositRequestV2Entry, MAX_CREATE_TIMESTAMP_SKEW_MICROS,\n};\nuse hdi::prelude::*;',
          )
          path.write_text(text)

          manifest = Path('mycelix-finance/zomes/collateral-deposit-v2/integrity/Cargo.toml')
          text = manifest.read_text()
          anchor = 'finance-collateral-deposit = { path = "../../../crates/finance-collateral-deposit" }\n'
          if text.count(anchor) != 1:
              raise SystemExit('deposit manifest anchor mismatch')
          manifest.write_text(text.replace(anchor, anchor + 'finance-holochain-contracts = { path = "../../../crates/finance-holochain-contracts" }\n'))

          # Settlement-auth integrity likewise imports the canonical shared payloads.
          path = Path('mycelix-finance/zomes/collateral-settlement-auth/integrity/src/lib.rs')
          text = path.read_text()
          start = text.index('#[dna_properties]')
          end = text.index('#[hdk_entry_types]', start)
          text = text[:start] + text[end:]
          local_loader = '''pub fn load_collateral_auth_config() -> ExternResult<CollateralSettlementAuthConfig> {
              Ok(FinanceCollateralAuthDnaProperties::try_from_dna_properties()?.collateral_settlement_auth)
          }

          '''
          # Normalize indentation from source before exact removal.
          local_loader = local_loader.replace('          ', '')
          if text.count(local_loader) != 1:
              raise SystemExit('settlement-auth loader block mismatch')
          text = text.replace(local_loader, '')
          text = text.replace(
              'use finance_collateral_auth::{\n    CollateralSettlementAuthConfig, CustodyAttestationV1, PriceAttestationV1,\n};\nuse hdi::prelude::*;',
              'use finance_collateral_auth::{CustodyAttestationV1, PriceAttestationV1};\nuse finance_holochain_contracts::{\n    CustodyAttestationV1Entry, PriceAttestationV1Entry, load_collateral_auth_config,\n};\nuse hdi::prelude::*;',
          )
          path.write_text(text)

          manifest = Path('mycelix-finance/zomes/collateral-settlement-auth/integrity/Cargo.toml')
          text = manifest.read_text()
          anchor = 'finance-collateral-auth = { path = "../../../crates/finance-collateral-auth" }\n'
          if text.count(anchor) != 1:
              raise SystemExit('settlement-auth manifest anchor mismatch')
          manifest.write_text(text.replace(anchor, anchor + 'finance-holochain-contracts = { path = "../../../crates/finance-holochain-contracts" }\n'))
          PY

      - name: Decouple collateral issuance integrity from foreign zome crates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('mycelix-finance/zomes/collateral-issuance-v2/integrity/src/lib.rs')
          text = path.read_text()
          old = '''use collateral_deposit_v2_integrity::{
              CollateralDepositRequestV2Entry, MAX_CREATE_TIMESTAMP_SKEW_MICROS,
          };
          use collateral_settlement_auth_integrity::{
              CustodyAttestationV1Entry, PriceAttestationV1Entry, load_collateral_auth_config,
          };
          '''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit('issuance foreign import block mismatch')
          new = '''use finance_holochain_contracts::{
              CollateralDepositRequestV2Entry, CustodyAttestationV1Entry,
              MAX_CREATE_TIMESTAMP_SKEW_MICROS, PriceAttestationV1Entry,
              load_collateral_auth_config,
          };
          '''.replace('          ', '')
          path.write_text(text.replace(old, new))

          manifest = Path('mycelix-finance/zomes/collateral-issuance-v2/integrity/Cargo.toml')
          text = manifest.read_text()
          for line in [
              'collateral_deposit_v2_integrity = { path = "../../collateral-deposit-v2/integrity" }\n',
              'collateral_settlement_auth_integrity = { path = "../../collateral-settlement-auth/integrity" }\n',
          ]:
              if text.count(line) != 1:
                  raise SystemExit(f'issuance manifest dependency mismatch: {line!r}')
              text = text.replace(line, '')
          anchor = 'finance-collateral-auth = { path = "../../../crates/finance-collateral-auth" }\n'
          if text.count(anchor) != 1:
              raise SystemExit('issuance manifest insertion anchor mismatch')
          text = text.replace(anchor, anchor + 'finance-holochain-contracts = { path = "../../../crates/finance-holochain-contracts" }\n')
          manifest.write_text(text)
          PY

      - name: Format and prove Phase A source boundary
        shell: bash
        run: |
          set -euo pipefail
          cd mycelix-finance
          cargo fmt --all
          cargo fmt --all --check
          cd ..
          git diff --check
          test "$(grep -R --include='Cargo.toml' -F 'collateral_deposit_v2_integrity = { path = "../../collateral-deposit-v2/integrity" }' mycelix-finance/zomes/collateral-issuance-v2/integrity || true)" = ''
          test "$(grep -R --include='Cargo.toml' -F 'collateral_settlement_auth_integrity = { path = "../../collateral-settlement-auth/integrity" }' mycelix-finance/zomes/collateral-issuance-v2/integrity || true)" = ''
          git diff > /tmp/phase-a-source.patch
          test -s /tmp/phase-a-source.patch

      - name: Generate cumulative lock candidate
        shell: bash
        run: |
          set -euo pipefail
          cp mycelix-finance/Cargo.lock /tmp/Cargo.lock.before
          cd mycelix-finance
          cargo metadata --format-version 1 > /tmp/cargo-metadata-generated.json
          cp Cargo.lock /tmp/Cargo.lock.candidate
          sha256sum Cargo.lock > /tmp/Cargo.lock.candidate.sha256
          cargo metadata --locked --format-version 1 > /tmp/cargo-metadata-locked.json
          cargo tree --workspace --locked > /tmp/cargo-tree-locked.txt

      - name: Test V2 integrity chain under generated lock
        shell: bash
        run: |
          set -euo pipefail
          cd mycelix-finance
          cargo test \
            -p collateral_deposit_v2_integrity \
            -p collateral_settlement_auth_integrity \
            -p collateral_issuance_v2_integrity \
            -p sap_account_v2_integrity \
            -p sap_transfer_v2_integrity \
            --locked 2>&1 | tee /tmp/phase-a-targeted-tests.log

      - name: Check Phase A wasm boundaries
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd mycelix-finance
          cargo check \
            -p collateral_deposit_v2_integrity \
            -p collateral_settlement_auth_integrity \
            -p collateral_issuance_v2_integrity \
            --target wasm32-unknown-unknown --lib --locked \
            2>&1 | tee /tmp/phase-a-wasm.log

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: finance-zome-contracts-phase-a-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: |
            /tmp/phase-a-source.patch
            /tmp/Cargo.lock.before
            /tmp/Cargo.lock.candidate
            /tmp/Cargo.lock.candidate.sha256
            /tmp/cargo-metadata-generated.json
            /tmp/cargo-metadata-locked.json
            /tmp/cargo-tree-locked.txt
            /tmp/phase-a-targeted-tests.log
            /tmp/phase-a-wasm.log
          if-no-files-found: warn
          retention-days: 30
