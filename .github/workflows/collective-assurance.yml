name: Collective Assurance Core

on:
  push:
    paths:
      - "research/collective-assurance/**"
      - ".github/workflows/collective-assurance.yml"
  pull_request:
    paths:
      - "research/collective-assurance/**"
      - ".github/workflows/collective-assurance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification-core:
    name: Rust format, Clippy, tests and lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - name: Generate pinned dependency lockfile
        run: cargo generate-lockfile --manifest-path research/collective-assurance/Cargo.toml
      - name: Normalize Rust sources in isolated checkout
        run: cargo fmt --manifest-path research/collective-assurance/Cargo.toml
      - name: Run strict Clippy
        run: cargo clippy --manifest-path research/collective-assurance/Cargo.toml --all-targets -- -D warnings
      - name: Run unit tests
        run: cargo test --manifest-path research/collective-assurance/Cargo.toml
      - name: Export normalized sources and dependency lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collective-assurance-rust-and-lock
          path: |
            research/collective-assurance/src/*.rs
            research/collective-assurance/Cargo.lock
          if-no-files-found: error
