name: Mycelix MPC-002B Semantic Core Exact-Head

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'mycelix-workspace/mycelix-core/libs/mpc-core/**'
      - 'mycelix-workspace/mycelix-core/libs/privacy-computation-core/**'
      - '.github/workflows/mpc-002b-semantic-core-exact-head.yml'
  workflow_dispatch:
    inputs:
      subject_sha:
        description: 'Exact 40-hex qualifier subject'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mpc-002bq-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Exact-head MPC-002B semantic-core qualification
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRODUCT_PARENT: 7da40a3889d2c01af771ea303336315e02da7378
      CARGO_TERM_COLOR: always
    steps:
      - name: Resolve exact subject
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            subject='${{ github.event.pull_request.head.sha }}'
          else
            subject='${{ inputs.subject_sha }}'
          fi
          [[ "$subject" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$subject" >> "$GITHUB_OUTPUT"

      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.subject.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact qualifier shape
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PRODUCT_PARENT"
          test "$(git rev-list --count "$PRODUCT_PARENT"..HEAD)" = 1
          mapfile -t changed < <(git diff --name-only "$PRODUCT_PARENT" HEAD)
          test "${#changed[@]}" = 1
          test "${changed[0]}" = '.github/workflows/mpc-002b-semantic-core-exact-head.yml'
          test -z "$(git status --porcelain)"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: rustfmt,clippy

      - name: Capture source evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/mpc-002bq-evidence"
          mkdir -p "$evidence"
          {
            echo "subject_sha=${{ steps.subject.outputs.sha }}"
            echo 'authority_scope=StructuralOnly'
            echo 'mpc_backend_qualified=false'
            echo 'input_privacy_established=false'
            echo 'malicious_security_established=false'
            echo 'fairness_established=false'
            echo 'guaranteed_output_established=false'
            echo 'application_authority=false'
            rustc -Vv
            cargo -V
          } > "$evidence/execution-capsule.txt"
          find mycelix-workspace/mycelix-core/libs/mpc-core \
               mycelix-workspace/mycelix-core/libs/privacy-computation-core \
               -type f -not -path '*/target/*' -print0 \
            | sort -z | xargs -0 sha256sum > "$evidence/source-sha256.txt"

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt \
            --manifest-path mycelix-workspace/mycelix-core/libs/mpc-core/Cargo.toml \
            --all -- --check

      - name: Prepare isolated dependency graph
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mpc-002bq-graph"
          evidence="$RUNNER_TEMP/mpc-002bq-evidence"
          mkdir -p "$root"
          cp -a mycelix-workspace/mycelix-core/libs/privacy-computation-core "$root/privacy-computation-core"
          cp -a mycelix-workspace/mycelix-core/libs/mpc-core "$root/mpc-core"
          cd "$root/mpc-core"
          cargo generate-lockfile
          sha256sum Cargo.lock > "$evidence/Cargo.lock.sha256"
          cargo metadata --locked --format-version 1 > "$evidence/cargo-metadata.json"
          cargo tree --locked > "$evidence/cargo-tree.txt"

      - name: Execute committed corpus
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mpc-002bq-graph/mpc-core"
          cargo test --locked --all-targets -- --nocapture

      - name: Warnings-denied Clippy
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mpc-002bq-graph/mpc-core"
          cargo clippy --locked --all-targets -- -D warnings

      - name: Postflight immutability and receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.subject.outputs.sha }}"
          test -z "$(git status --porcelain)"
          echo 'MPC-002BQ PASS'
          echo 'authority_scope=StructuralOnly'
          echo 'mpc_backend_qualified=false'
          echo 'input_privacy_established=false'
          echo 'malicious_security_established=false'
          echo 'fairness_established=false'
          echo 'guaranteed_output_established=false'
          echo 'application_authority=false'
