name: Sovereignty formal qualification candidate

on:
  push:
    branches:
      - qual-001-sov-ai-verifier-v1
    paths:
      - 'mycelix-governance/specs/ArtificialSovereigntyV1.tla'
      - 'mycelix-governance/specs/ArtificialSovereigntyV1.cfg'
      - 'mycelix-governance/specs/alloy/ArtificialSovereigntyV1.als'
      - 'mycelix-governance/tools/formal/sovereignty_reference_explorer.py'
      - 'docs/qualification/SOVEREIGNTY_FORMAL_QUALIFICATION_PROFILE_V1.json'
      - 'mycelix-governance/tools/formal/pins.json'
      - '.github/workflows/sovereignty-formal-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NIXPKGS_REV: a50bf0c1b07873c1a53892292017041a8f0a1288
  TLA_URL: https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
  TLA_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
  ALLOY_URL: https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/org.alloytools.alloy.dist.jar
  ALLOY_SHA256: 6b8c1cb5bc93bedfc7c61435c4e1ab6e688a242dc702a394628d9a9801edb78d

jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact verifier head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact verifier head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Run local bounded semantic explorer
        run: |
          set -euo pipefail
          python3 mycelix-governance/tools/formal/sovereignty_reference_explorer.py

      - name: Install pinned Nix
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run exact pinned TLA+ and Alloy models
        run: |
          set -euo pipefail
          rm -rf .sov-formal-tools .sov-formal-evidence
          mkdir -p .sov-formal-tools .sov-formal-evidence

          nix shell             "github:NixOS/nixpkgs/${NIXPKGS_REV}#jdk17_headless"             "github:NixOS/nixpkgs/${NIXPKGS_REV}#curl"             "github:NixOS/nixpkgs/${NIXPKGS_REV}#coreutils"             "github:NixOS/nixpkgs/${NIXPKGS_REV}#bash"             --command bash -euo pipefail -c '
              curl --fail --location --retry 3 --retry-all-errors                 --output .sov-formal-tools/tla2tools.jar "$TLA_URL"
              curl --fail --location --retry 3 --retry-all-errors                 --output .sov-formal-tools/alloy.jar "$ALLOY_URL"

              printf "%s  %s\n" "$TLA_SHA256" .sov-formal-tools/tla2tools.jar | sha256sum --check --strict
              printf "%s  %s\n" "$ALLOY_SHA256" .sov-formal-tools/alloy.jar | sha256sum --check --strict

              cp mycelix-governance/specs/ArtificialSovereigntyV1.tla .sov-formal-evidence/
              cp mycelix-governance/specs/ArtificialSovereigntyV1.cfg .sov-formal-evidence/
              cp mycelix-governance/specs/alloy/ArtificialSovereigntyV1.als .sov-formal-evidence/

              java -cp .sov-formal-tools/tla2tools.jar tlc2.TLC                 -workers 1                 -config mycelix-governance/specs/ArtificialSovereigntyV1.cfg                 mycelix-governance/specs/ArtificialSovereigntyV1.tla                 | tee .sov-formal-evidence/tlc.log

              java -jar .sov-formal-tools/alloy.jar                 exec --solver sat4j --type none                 --output .sov-formal-evidence/alloy                 --force --quiet                 mycelix-governance/specs/alloy/ArtificialSovereigntyV1.als                 | tee .sov-formal-evidence/alloy.log

              sha256sum .sov-formal-evidence/tlc.log .sov-formal-evidence/alloy.log                 > .sov-formal-evidence/log-sha256.txt
            '

      - name: Verify canonical inputs were not modified
        run: |
          set -euo pipefail
          test "$(git status --porcelain)" = ""

      - name: Upload bounded formal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sovereignty-formal-candidate-${{ github.sha }}
          path: .sov-formal-evidence
          if-no-files-found: error
          retention-days: 30
