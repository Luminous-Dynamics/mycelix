name: Sovereignty formal qualification candidate

on:
  push:
    branches: [qual-001-sov-ai-verifier-v1]
    paths:
      - 'mycelix-governance/specs/ArtificialSovereigntyV1.tla'
      - 'mycelix-governance/specs/ArtificialSovereigntyV1.cfg'
      - 'mycelix-governance/specs/ArtificialSovereigntyV1NegativeControls.tla'
      - 'mycelix-governance/specs/alloy/ArtificialSovereigntyV1.als'
      - 'mycelix-governance/tools/formal/sovereignty_reference_explorer.py'
      - 'mycelix-governance/tools/formal/qualify_sovereignty_formal.py'
      - 'mycelix-governance/tools/formal/SovereigntyAlloyQualificationRunner.java'
      - 'mycelix-governance/tools/formal/pins.json'
      - 'docs/qualification/SOVEREIGNTY_FORMAL_QUALIFICATION_PROFILE_V1.json'
      - '.github/workflows/sovereignty-formal-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NIXPKGS_REV: a50bf0c1b07873c1a53892292017041a8f0a1288
  TLA_URL: https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
  TLA_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
  ALLOY_URL: https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/org.alloytools.alloy.dist.jar
  ALLOY_SHA256: 6b8c1cb5bc93bedfc7c61435c4e1ab6e688a242dc702a394628d9a9801edb78d

jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact verifier head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact verifier head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Install pinned Nix tools
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Download and hash exact formal tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sov-formal-tools"
          nix shell "github:NixOS/nixpkgs/$NIXPKGS_REV#jdk17_headless" "github:NixOS/nixpkgs/$NIXPKGS_REV#curl" "github:NixOS/nixpkgs/$NIXPKGS_REV#coreutils" --command bash -euo pipefail -c '
            curl --fail --location --retry 3 --retry-all-errors --output "$RUNNER_TEMP/sov-formal-tools/tla2tools.jar" "$TLA_URL"
            curl --fail --location --retry 3 --retry-all-errors --output "$RUNNER_TEMP/sov-formal-tools/alloy.jar" "$ALLOY_URL"
            printf "%s  %s\n" "$TLA_SHA256" "$RUNNER_TEMP/sov-formal-tools/tla2tools.jar" | sha256sum --check --strict
            printf "%s  %s\n" "$ALLOY_SHA256" "$RUNNER_TEMP/sov-formal-tools/alloy.jar" | sha256sum --check --strict
          '

      - name: Compile machine-readable Alloy runner
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sov-formal-java"
          nix shell "github:NixOS/nixpkgs/$NIXPKGS_REV#jdk17_headless" --command bash -euo pipefail -c '
            javac -cp "$RUNNER_TEMP/sov-formal-tools/alloy.jar" -d "$RUNNER_TEMP/sov-formal-java" mycelix-governance/tools/formal/SovereigntyAlloyQualificationRunner.java
          '

      - name: Execute hardened formal qualification
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sov-formal-evidence"
          nix shell "github:NixOS/nixpkgs/$NIXPKGS_REV#jdk17_headless" "github:NixOS/nixpkgs/$NIXPKGS_REV#coreutils" --command bash -euo pipefail -c '
            python3 mycelix-governance/tools/formal/qualify_sovereignty_formal.py \
              --profile docs/qualification/SOVEREIGNTY_FORMAL_QUALIFICATION_PROFILE_V1.json \
              --pins mycelix-governance/tools/formal/pins.json \
              --tla mycelix-governance/specs/ArtificialSovereigntyV1.tla \
              --cfg mycelix-governance/specs/ArtificialSovereigntyV1.cfg \
              --alloy mycelix-governance/specs/alloy/ArtificialSovereigntyV1.als \
              --negative-tla mycelix-governance/specs/ArtificialSovereigntyV1NegativeControls.tla \
              --alloy-runner-java mycelix-governance/tools/formal/SovereigntyAlloyQualificationRunner.java \
              --alloy-runner-class-dir "$RUNNER_TEMP/sov-formal-java" \
              --tla-jar "$RUNNER_TEMP/sov-formal-tools/tla2tools.jar" \
              --alloy-jar "$RUNNER_TEMP/sov-formal-tools/alloy.jar" \
              --evidence-dir "$RUNNER_TEMP/sov-formal-evidence" \
              --workflow .github/workflows/sovereignty-formal-qualification.yml \
              --reference-explorer mycelix-governance/tools/formal/sovereignty_reference_explorer.py
          '

      - name: Verify repository postflight is clean
        if: always()
        run: |
          set -euo pipefail
          test "$(git status --porcelain)" = ""

      - name: Upload bounded formal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sovereignty-formal-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/sov-formal-evidence
          if-no-files-found: warn
          retention-days: 30
