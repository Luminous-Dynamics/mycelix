name: Life Disclosure Correlation Benchmark

on:
  push:
    branches:
      - main
    paths:
      - "research/life-disclosure-correlated/**"
      - ".github/workflows/life-disclosure-correlated.yml"
  pull_request:
    branches:
      - main
    paths:
      - "research/life-disclosure-correlated/**"
      - ".github/workflows/life-disclosure-correlated.yml"

permissions:
  contents: read

concurrency:
  group: life-disclosure-correlated-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-benchmark:
    name: Exact-head correlated disclosure qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QUALIFIED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout exact benchmark subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          persist-credentials: false

      - name: Assert exact commit
        run: test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # pinned action
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Assert toolchain
        run: |
          test "$(rustc +1.96.0 --version)" = "rustc 1.96.0 (ac68faa20 2026-05-25)"
          cargo +1.96.0 --version
          rustfmt +1.96.0 --version

      - name: Check formatting
        run: cargo +1.96.0 fmt --manifest-path research/life-disclosure-correlated/Cargo.toml --all -- --check

      - name: Run unit and invariant tests
        run: cargo +1.96.0 test --locked --manifest-path research/life-disclosure-correlated/Cargo.toml

      - name: Run strict Clippy
        run: cargo +1.96.0 clippy --locked --manifest-path research/life-disclosure-correlated/Cargo.toml --all-targets -- -D warnings

      - name: Run deterministic benchmark and emit evidence
        run: |
          mkdir -p target/life-disclosure-correlated
          cargo +1.96.0 run --release --locked \
            --manifest-path research/life-disclosure-correlated/Cargo.toml -- \
            --write-corpus-dir target/life-disclosure-correlated/corpus \
            > target/life-disclosure-correlated/metrics-first.csv
          cargo +1.96.0 run --release --locked \
            --manifest-path research/life-disclosure-correlated/Cargo.toml \
            > target/life-disclosure-correlated/metrics-second.csv
          cmp target/life-disclosure-correlated/metrics-first.csv \
            target/life-disclosure-correlated/metrics-second.csv
          mv target/life-disclosure-correlated/metrics-first.csv \
            target/life-disclosure-correlated/report.csv
          rm target/life-disclosure-correlated/metrics-second.csv
          sha256sum target/life-disclosure-correlated/corpus/* \
            > target/life-disclosure-correlated/corpus-sha256.txt
          {
            echo "LIFE DISCLOSURE CORRELATION QUALIFICATION"
            echo "status=synthetic-distribution-reference-passed"
            echo "commit=$QUALIFIED_SHA"
            echo "workflow=$GITHUB_WORKFLOW"
            echo "workflow_ref=$GITHUB_WORKFLOW_REF"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "event=$GITHUB_EVENT_NAME"
            echo "rust=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "manifest_sha256=$(sha256sum research/life-disclosure-correlated/Cargo.toml | cut -d' ' -f1)"
            echo "lock_sha256=$(sha256sum research/life-disclosure-correlated/Cargo.lock | cut -d' ' -f1)"
            echo "report_sha256=$(sha256sum target/life-disclosure-correlated/report.csv | cut -d' ' -f1)"
            echo "claim_ceiling=CorrelationAndPrevalenceSyntheticReference"
          } | tee target/life-disclosure-correlated/qualification.txt
          sha256sum target/life-disclosure-correlated/report.csv \
            target/life-disclosure-correlated/qualification.txt \
            > target/life-disclosure-correlated/sha256sums.txt

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: life-disclosure-correlated-${{ env.QUALIFIED_SHA }}
          path: target/life-disclosure-correlated/
          if-no-files-found: error
