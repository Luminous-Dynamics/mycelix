name: Pulse Independent Trace Verifier

on:
  push:
    branches:
      - "research/pulse-authority-lifecycle-v1-20261104"
    paths:
      - ".github/workflows/pulse-trace-verifier.yml"
      - "mycelix-workspace/mycelix-pulse/holochain/Cargo.toml"
      - "mycelix-workspace/mycelix-pulse/holochain/Cargo.lock"
      - "mycelix-workspace/mycelix-pulse/holochain/tools/pulse-trace-verifier/**"
      - "mycelix-workspace/mycelix-pulse/docs/security/authorization-lifecycle-v1.*"
      - "mycelix-workspace/mycelix-pulse/docs/security/authorization-lifecycle-trace-v1.schema.json"
  pull_request:
    paths:
      - ".github/workflows/pulse-trace-verifier.yml"
      - "mycelix-workspace/mycelix-pulse/holochain/Cargo.toml"
      - "mycelix-workspace/mycelix-pulse/holochain/Cargo.lock"
      - "mycelix-workspace/mycelix-pulse/holochain/tools/pulse-trace-verifier/**"
      - "mycelix-workspace/mycelix-pulse/docs/security/authorization-lifecycle-v1.*"
      - "mycelix-workspace/mycelix-pulse/docs/security/authorization-lifecycle-trace-v1.schema.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulse-trace-verifier-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test independent corpus and trace verifier
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Check formatting
        run: cargo fmt --manifest-path mycelix-workspace/mycelix-pulse/holochain/Cargo.toml --package pulse-trace-verifier -- --check

      - name: Run verifier tests with locked dependencies
        run: cargo test --locked --manifest-path mycelix-workspace/mycelix-pulse/holochain/Cargo.toml -p pulse-trace-verifier

      - name: Validate canonical synthetic corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pulse-trace-receipts"
          cargo run --locked --manifest-path mycelix-workspace/mycelix-pulse/holochain/Cargo.toml -p pulse-trace-verifier -- \
            validate-corpus \
            mycelix-workspace/mycelix-pulse/docs/security/authorization-lifecycle-v1.corpus.json \
            mycelix-workspace/mycelix-pulse/docs/security/authorization-lifecycle-v1.schema.json \
            > "${RUNNER_TEMP}/pulse-trace-receipts/corpus.json"

      - name: Replay valid revocation trace fixture
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --manifest-path mycelix-workspace/mycelix-pulse/holochain/Cargo.toml -p pulse-trace-verifier -- \
            verify-trace \
            mycelix-workspace/mycelix-pulse/docs/security/authorization-lifecycle-v1.corpus.json \
            mycelix-workspace/mycelix-pulse/docs/security/authorization-lifecycle-v1.schema.json \
            mycelix-workspace/mycelix-pulse/holochain/tools/pulse-trace-verifier/fixtures/revocation-valid.json \
            > "${RUNNER_TEMP}/pulse-trace-receipts/revocation-valid.json"

      - name: Require post-revocation authorization mutant rejection
        shell: bash
        run: |
          set -euo pipefail
          set +e
          cargo run --locked --manifest-path mycelix-workspace/mycelix-pulse/holochain/Cargo.toml -p pulse-trace-verifier -- \
            verify-trace \
            mycelix-workspace/mycelix-pulse/docs/security/authorization-lifecycle-v1.corpus.json \
            mycelix-workspace/mycelix-pulse/docs/security/authorization-lifecycle-v1.schema.json \
            mycelix-workspace/mycelix-pulse/holochain/tools/pulse-trace-verifier/fixtures/revocation-authorized-mutant.json \
            > "${RUNNER_TEMP}/pulse-trace-receipts/revocation-mutant.stdout" \
            2> "${RUNNER_TEMP}/pulse-trace-receipts/revocation-mutant.stderr"
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "AUTHORIZED after causally preceding revocation" "${RUNNER_TEMP}/pulse-trace-receipts/revocation-mutant.stderr"

      - name: Record exact verifier receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "checkout_sha=$(git rev-parse HEAD)"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "workflow_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "manifest_sha256=$(sha256sum mycelix-workspace/mycelix-pulse/holochain/Cargo.toml | cut -d' ' -f1)"
            echo "lock_sha256=$(sha256sum mycelix-workspace/mycelix-pulse/holochain/Cargo.lock | cut -d' ' -f1)"
            echo "tool_source_sha256=$(sha256sum mycelix-workspace/mycelix-pulse/holochain/tools/pulse-trace-verifier/src/lib.rs | cut -d' ' -f1)"
            echo "corpus_sha256=$(sha256sum mycelix-workspace/mycelix-pulse/docs/security/authorization-lifecycle-v1.corpus.json | cut -d' ' -f1)"
            echo "corpus_schema_sha256=$(sha256sum mycelix-workspace/mycelix-pulse/docs/security/authorization-lifecycle-v1.schema.json | cut -d' ' -f1)"
            echo "trace_schema_sha256=$(sha256sum mycelix-workspace/mycelix-pulse/docs/security/authorization-lifecycle-trace-v1.schema.json | cut -d' ' -f1)"
          } > "${RUNNER_TEMP}/pulse-trace-receipts/receipt.txt"

      - name: Upload verifier receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-trace-verifier-${{ github.sha }}
          path: ${{ runner.temp }}/pulse-trace-receipts/
          if-no-files-found: error
          retention-days: 30
