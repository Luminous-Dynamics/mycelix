name: COS Conformance Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/cos-conformance.yml"
      - "mycelix-manufacturing/Cargo.toml"
      - "mycelix-manufacturing/Cargo.lock"
      - "mycelix-manufacturing/crates/cos_conformance/**"
      - "mycelix-manufacturing/crates/manufacturing_common/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cos-conformance.yml"
      - "mycelix-manufacturing/Cargo.toml"
      - "mycelix-manufacturing/Cargo.lock"
      - "mycelix-manufacturing/crates/cos_conformance/**"
      - "mycelix-manufacturing/crates/manufacturing_common/**"

permissions:
  contents: read

concurrency:
  group: cos-conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  cos-conformance:
    name: COS conformance package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QUALIFIED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact qualification subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          persist-credentials: false

      - name: Assert exact qualification subject
        run: test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # master @ 2025-08-23
        with:
          toolchain: 1.96.0

      - name: Assert Rust toolchain identity
        run: test "$(rustc +1.96.0 --version)" = "rustc 1.96.0 (ac68faa20 2026-05-25)"

      - name: Assert locked dependency graph
        run: cargo metadata --manifest-path mycelix-manufacturing/Cargo.toml --locked --no-deps --format-version 1 > /dev/null

      - name: Run all COS conformance package tests
        run: cargo test --manifest-path mycelix-manufacturing/Cargo.toml --locked -p cos_conformance

      - name: Emit exact-head test receipt
        run: |
          {
            echo "COS CONFORMANCE PACKAGE TESTS"
            echo "status=package-tests-passed"
            echo "commit=${QUALIFIED_SHA}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "workflow_ref=${GITHUB_WORKFLOW_REF}"
            echo "workflow_sha=$(git hash-object .github/workflows/cos-conformance.yml)"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "rust=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "cargo_lock_sha256=$(sha256sum mycelix-manufacturing/Cargo.lock | cut -d' ' -f1)"
            echo "claim_ceiling=ReferenceModelOnly"
          } | tee cos-conformance-package-qualification.txt

      - name: Upload exact-head test receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cos-conformance-package-${{ env.QUALIFIED_SHA }}
          path: cos-conformance-package-qualification.txt
