name: Authority Coverage Policy Freshness

on:
  pull_request:
    paths:
      - 'crates/mycelix-authority-freshness/**'
      - '.github/workflows/authority-coverage-policy-freshness.yml'
  push:
    branches:
      - 'security/authority-coverage-policy-freshness-v0.1'

permissions:
  contents: read

concurrency:
  group: authority-coverage-policy-freshness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: Coverage policy freshness extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path crates/mycelix-authority-freshness/Cargo.toml -- --check
      - name: Tests
        run: cargo test --manifest-path crates/mycelix-authority-freshness/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-authority-freshness/Cargo.toml --all-targets -- -D warnings
      - name: Subject-code and containment audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('crates/mycelix-authority-freshness/src/lib.rs').read_text()
          contract = Path('crates/mycelix-authority-freshness/COVERAGE_POLICY_FRESHNESS.md').read_text()

          required = {
              'Self::AuthorityGrant => 1': 1,
              'Self::SigningPolicy => 2': 2,
              'Self::ThresholdAuthorization => 3': 3,
              'Self::ExecutorDesignation => 4': 4,
              'Self::EffectSafetyPolicy => 5': 5,
              'Self::Delegation => 6': 6,
              'Self::AuthorityCoveragePolicy => 7': 7,
              'Self::CoverageTrustContextPolicy => 8': 8,
              'Self::WitnessTrustPolicy => 9': 9,
          }
          for token in required:
              assert token in src, token

          assert 'subject_kind_codes_are_stable' in src
          assert 'AuthorityCoveragePolicy = 7' in contract
          assert 'CoverageTrustContextPolicy = 8' in contract
          assert 'WitnessTrustPolicy = 9' in contract
          assert 'policy lifetime is insufficient' in contract.lower()
          assert 'historical snapshot may never be converted into current freshness' in contract.lower()

          # This tranche must remain a pure enum/current-freshness extension.
          lowered = src.lower()
          for forbidden in ['hdk::', '#[hdk_extern]', 'create_entry(', 'call_remote(', 'execute_actions']:
              assert forbidden not in lowered, forbidden
          print('PASS: coverage policies use stable additive generation-bound freshness subject kinds')
          PY
