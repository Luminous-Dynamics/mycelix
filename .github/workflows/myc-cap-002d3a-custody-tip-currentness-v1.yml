name: MYC-CAP-002D3A Custody Tip Currentness v1

on:
  pull_request:
    paths:
      - 'scripts/capital/custody_tip_currentness_v1.py'
      - 'scripts/capital/test_custody_tip_currentness_v1.py'
      - 'docs/capital/evidence/myc-cap-002d3a/**'
      - '.github/workflows/myc-cap-002d3a-custody-tip-currentness-v1.yml'

permissions:
  contents: read

jobs:
  qualify:
    name: Designated-current custody event-chain tip
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Exact subject, qualified D3 parent, and scope
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "1fefe7a313d1cc83f3559d1d9f3223e12b2df019"
          expected="$(mktemp)"
          actual="$(mktemp)"
          printf '%s\n' \
            '.github/workflows/myc-cap-002d3a-custody-tip-currentness-v1.yml' \
            'docs/capital/evidence/myc-cap-002d3a/PROFILE.md' \
            'docs/capital/evidence/myc-cap-002d3a/example_case.json' \
            'docs/capital/evidence/myc-cap-002d3a/example_receipt.json' \
            'scripts/capital/custody_tip_currentness_v1.py' \
            'scripts/capital/test_custody_tip_currentness_v1.py' | sort > "$expected"
          git diff-tree --no-commit-id --name-only -r HEAD | sort > "$actual"
          diff -u "$expected" "$actual"
          test -z "$(git status --porcelain)"

      - name: Exact qualified D3 semantic parent
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path

          def canonical_bytes(v):
              return json.dumps(v, sort_keys=True, separators=(",", ":"), ensure_ascii=False, allow_nan=False).encode("utf-8")

          case = json.loads(Path("docs/capital/evidence/myc-cap-002d3a/example_case.json").read_text(encoding="utf-8"))
          inherited = json.loads(Path("docs/capital/evidence/myc-cap-002d3/example_receipt.json").read_text(encoding="utf-8"))
          parent_raw = subprocess.check_output(["git","show","HEAD^:docs/capital/evidence/myc-cap-002d3/example_receipt.json"], text=True)
          parent = json.loads(parent_raw)
          assert inherited == parent
          assert case["d3_receipt"] == parent
          assert case["profile"]["d3_subject_sha"] == "1fefe7a313d1cc83f3559d1d9f3223e12b2df019"
          digest = hashlib.sha256(canonical_bytes(parent)).hexdigest()
          assert digest == "26f9f23e24d6a120c3cf210e920e6111fdefbd1355fb0069052bdfb5a68f01e1"
          assert case["profile"]["d3_receipt_sha256"] == digest
          assert case["profile"]["d3_profile_sha256"] == "99478af7e37e6d878c42051bb88657feaf083fe9d55afa6726aa8fa78e8fca3a"
          assert case["profile"]["d3_event_history_sha256"] == "5ec741fe98ae16872cd1a6a954b22fa7ea679ff48075cca96a622ed8ee864807"
          assert case["profile"]["d3_event_tip_sha256"] == "82b13fad92801eee7038b237b0a5e47aebb198ef4ec0e63d3f4ed139dfe28744"
          PY

      - name: Python environment
        run: |
          set -euo pipefail
          python3 --version
          python3 -m py_compile scripts/capital/custody_tip_currentness_v1.py
          python3 -m py_compile scripts/capital/test_custody_tip_currentness_v1.py

      - name: Fail-closed unit suite
        run: |
          set -euo pipefail
          python3 -m unittest -v scripts/capital/test_custody_tip_currentness_v1.py

      - name: Deterministic example receipt
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          python3 scripts/capital/custody_tip_currentness_v1.py \
            docs/capital/evidence/myc-cap-002d3a/example_case.json \
            --receipt-out "$tmp"
          diff -u docs/capital/evidence/myc-cap-002d3a/example_receipt.json "$tmp"
          cp "$tmp" "${tmp}.second"
          python3 scripts/capital/custody_tip_currentness_v1.py \
            docs/capital/evidence/myc-cap-002d3a/example_case.json \
            --receipt-out "$tmp"
          cmp "$tmp" "${tmp}.second"
          echo '4193803616f5e10b3a1842f435854f06b3b9f63388f451d757eb86766ba95a4d  docs/capital/evidence/myc-cap-002d3a/example_case.json' | sha256sum -c -
          echo 'fd367546317b03d8ba9458b535fc112b3e59f509dca1c8d6d45acf4db505cbca  docs/capital/evidence/myc-cap-002d3a/example_receipt.json' | sha256sum -c -

      - name: Strong currentness nonclaims
        run: |
          set -euo pipefail
          grep -Fq '"custody_tip_currentness_state": "CURRENT"' docs/capital/evidence/myc-cap-002d3a/example_receipt.json
          grep -Fq '"d3_custody_state": "CURRENT"' docs/capital/evidence/myc-cap-002d3a/example_receipt.json
          grep -Fq '"custody_health_established": false' docs/capital/evidence/myc-cap-002d3a/example_receipt.json
          grep -Fq '"legal_title_transition_established": false' docs/capital/evidence/myc-cap-002d3a/example_receipt.json
          grep -Fq '"constitutional_stewardship_transition_established": false' docs/capital/evidence/myc-cap-002d3a/example_receipt.json
          grep -Fq '"execution_authority_established": false' docs/capital/evidence/myc-cap-002d3a/example_receipt.json
          grep -Fq '"uses_local_wall_clock": false' docs/capital/evidence/myc-cap-002d3a/example_receipt.json
