name: Business Core Contracts

on:
  pull_request:
    paths:
      - 'crates/mycelix-business-core/**'
      - '.github/workflows/business-core.yml'
  push:
    branches: [main]
    paths:
      - 'crates/mycelix-business-core/**'
      - '.github/workflows/business-core.yml'

permissions:
  contents: read

jobs:
  business-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path crates/mycelix-business-core/Cargo.toml --all --check
      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-business-core/Cargo.toml --all-targets -- -D warnings
      - name: Test contracts
        run: cargo test --manifest-path crates/mycelix-business-core/Cargo.toml --all-targets
