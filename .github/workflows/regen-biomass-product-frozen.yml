name: REGEN-011E Biomass ProductFrozen Qualification

on:
  pull_request:
    paths:
      - 'crates/mycelix-regenerative-biomass/**'
      - '.github/workflows/regen-biomass-product-frozen.yml'

permissions:
  contents: read

jobs:
  qualify-product-frozen:
    name: REGEN-011E biomass ProductFrozen qualification
    if: github.event_name == 'pull_request' && github.head_ref == 'qual/regen-011e-biomass-product-frozen-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_PARENT_SHA: 872151cae7bee995b6bfff7867fc40178ad4759e
      CRATE_DIR: crates/mycelix-regenerative-biomass
      PINNED_TOOLCHAIN: 1.96.0
      PREPARATION_SOURCE_HEAD: 0b78308d95a169132d9b3f6de5f11b65f7553ca7
      PREPARATION_RUN: '35313226013'
      PREPARATION_JOB: '105499349684'
      PREPARATION_ARTIFACT: '10537710169'
      PREPARATION_ARCHIVE_SHA256: 2bbc0d08130a24ea7c433c09a717b865274e05e3202691639ee09b204c7625f6
      EXPECTED_MANIFEST_SHA256: 76be59314932609b1e2e0fe318e65be4068463c30a04daa161308495537b3d54
      EXPECTED_LOCK_SHA256: ee5075dd6a27bc78829b04c3581ded9c84a7314368e603e6e132f62afadc9888
      EXPECTED_SOURCE_SHA256: b0be9bf255ca63cf65475e33fab3c7702fbb86c9c62df26a2d5714d123046f26
      EXPECTED_TEST_SHA256: 3367ab6d5bc199d4f3eef47096d1558be680878ff47d6cfa8e0443ed24d4ebc9
      EXPECTED_MANIFEST_BLOB: 3bf62f680ee660bf02c26aa766b6743e257c4273
      EXPECTED_LOCK_BLOB: 77b8dd1d4f05035079a69b9bab453be3e2baee02
      EXPECTED_SOURCE_BLOB: 1ab26a628c4af05159cf30a92d84dd489d8f5a23
      EXPECTED_TEST_BLOB: 97507f83bcb165679089b561deae6b59346e5756
      EXPECTED_Q001_VALIDATOR_BLOB: 653949df6a5dd6f37cb32eff57611a308846cdc7
      EXPECTED_ADMISSION_SOURCE_BLOB: 294b777c95be79a13ca7d0e1e3463d32ff25c8f0
      EXPECTED_ADMISSION_MANIFEST_BLOB: 5073a8ea208d0f615c3d0269c3777c9460826478
      EXPECTED_ADMISSION_LOCK_BLOB: 55ce1ba153982351cce6fd29a2c1174ce40813f1
      EXPECTED_PEF_EVIDENCE_BLOB: 2069d6e56336d05c7bc293abfc5ccdc421ab53cb
      EXPECTED_PEF_LINEAGE_BLOB: e0fda7c4c9e83c46761dae1e4fff2c43e3d6d41b
      EXPECTED_PEF_PRODUCT_BLOB: dedc20b201759883b9c58b39905dfc700c1cfb21
      EXPECTED_CORE_TYPES_LIB_BLOB: 3761f5cfcb6a7c78c7ce829ba4283f7e522aff72

    steps:
      - name: Checkout exact ProductHead
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact ProductHead parent and five-path scope
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$(git rev-list --count "$EXPECTED_PARENT_SHA"..HEAD)" = '1'
          expected="$(printf '%s\n' \
            '.github/workflows/regen-biomass-product-frozen.yml' \
            'crates/mycelix-regenerative-biomass/Cargo.lock' \
            'crates/mycelix-regenerative-biomass/Cargo.toml' \
            'crates/mycelix-regenerative-biomass/src/lib.rs' \
            'crates/mycelix-regenerative-biomass/tests/biomass_core.rs' | sort)"
          actual="$(git diff --name-only "$EXPECTED_PARENT_SHA" HEAD | sort)"
          printf '%s\n' '---BEGIN_011E_SCOPE---' "$actual" '---END_011E_SCOPE---'
          test "$actual" = "$expected"

      - name: Verify exact preparation-derived bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "$CRATE_DIR/Cargo.toml" | awk '{print $1}')" = "$EXPECTED_MANIFEST_SHA256"
          test "$(sha256sum "$CRATE_DIR/Cargo.lock" | awk '{print $1}')" = "$EXPECTED_LOCK_SHA256"
          test "$(sha256sum "$CRATE_DIR/src/lib.rs" | awk '{print $1}')" = "$EXPECTED_SOURCE_SHA256"
          test "$(sha256sum "$CRATE_DIR/tests/biomass_core.rs" | awk '{print $1}')" = "$EXPECTED_TEST_SHA256"
          test "$(git rev-parse HEAD:"$CRATE_DIR/Cargo.toml")" = "$EXPECTED_MANIFEST_BLOB"
          test "$(git rev-parse HEAD:"$CRATE_DIR/Cargo.lock")" = "$EXPECTED_LOCK_BLOB"
          test "$(git rev-parse HEAD:"$CRATE_DIR/src/lib.rs")" = "$EXPECTED_SOURCE_BLOB"
          test "$(git rev-parse HEAD:"$CRATE_DIR/tests/biomass_core.rs")" = "$EXPECTED_TEST_BLOB"

      - name: Verify exact qualified upstream and Q001 anchors
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:qualification/regen-019d/verify-regen-qualification-receipt.py)" = "$EXPECTED_Q001_VALIDATOR_BLOB"
          test "$(git rev-parse HEAD:crates/mycelix-regenerative-admission/src/lib.rs)" = "$EXPECTED_ADMISSION_SOURCE_BLOB"
          test "$(git rev-parse HEAD:crates/mycelix-regenerative-admission/Cargo.toml)" = "$EXPECTED_ADMISSION_MANIFEST_BLOB"
          test "$(git rev-parse HEAD:crates/mycelix-regenerative-admission/Cargo.lock)" = "$EXPECTED_ADMISSION_LOCK_BLOB"
          test "$(git rev-parse HEAD:crates/mycelix-core-types/src/planetary_evidence.rs)" = "$EXPECTED_PEF_EVIDENCE_BLOB"
          test "$(git rev-parse HEAD:crates/mycelix-core-types/src/planetary_lineage.rs)" = "$EXPECTED_PEF_LINEAGE_BLOB"
          test "$(git rev-parse HEAD:crates/mycelix-core-types/src/planetary_product.rs)" = "$EXPECTED_PEF_PRODUCT_BLOB"
          test "$(git rev-parse HEAD:crates/mycelix-core-types/src/lib.rs)" = "$EXPECTED_CORE_TYPES_LIB_BLOB"
          python3 qualification/regen-019d/verify-regen-qualification-receipt.py --self-test

      - name: Verify evaluator-minted reservation type-state boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'pub struct ReservationRequest' "$CRATE_DIR/src/lib.rs"
          grep -F 'pub struct AcceptedReservation' "$CRATE_DIR/src/lib.rs"
          grep -F 'pub fn evaluate_reservation_requests' "$CRATE_DIR/src/lib.rs"
          grep -F 'fn from_request' "$CRATE_DIR/src/lib.rs"
          ! grep -F 'pub struct ProcessInputReservation' "$CRATE_DIR/src/lib.rs"
          grep -F 'fn scope_mismatched_request_is_not_an_accepted_reservation()' "$CRATE_DIR/tests/biomass_core.rs"
          grep -F 'fn evaluator_mints_accepted_reservations_only_after_full_batch_validation()' "$CRATE_DIR/tests/biomass_core.rs"
          python3 - <<'PY'
          from pathlib import Path

          source = Path('crates/mycelix-regenerative-biomass/src/lib.rs').read_text(encoding='utf-8')
          marker = 'impl AcceptedReservation {'
          start = source.find(marker)
          if start < 0:
              raise SystemExit('missing impl AcceptedReservation block')
          brace = source.find('{', start)
          depth = 0
          end = None
          for i in range(brace, len(source)):
              c = source[i]
              if c == '{':
                  depth += 1
              elif c == '}':
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit('unterminated impl AcceptedReservation block')
          block = source[start:end]
          if 'fn from_request' not in block:
              raise SystemExit('AcceptedReservation is not minted from request inside its impl')
          if 'pub fn from_request' in block or 'pub fn new' in block or 'pub(crate) fn from_request' in block:
              raise SystemExit('AcceptedReservation construction authority widened')
          print('accepted_reservation_constructor=EvaluatorMintedPrivate')
          PY

      - name: Install and prove pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$PINNED_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          test "$(rustc +"$PINNED_TOOLCHAIN" --version | awk '{print $2}')" = "$PINNED_TOOLCHAIN"
          test "$(cargo +"$PINNED_TOOLCHAIN" --version | awk '{print $2}')" = "$PINNED_TOOLCHAIN"
          rustc +"$PINNED_TOOLCHAIN" --version --verbose
          cargo +"$PINNED_TOOLCHAIN" --version --verbose
          rustfmt +"$PINNED_TOOLCHAIN" --version

      - name: Format exact frozen source
        run: cargo +"$PINNED_TOOLCHAIN" fmt --manifest-path "$CRATE_DIR/Cargo.toml" -- --check

      - name: Test exact ProductFrozen biomass contract
        run: cargo +"$PINNED_TOOLCHAIN" test --manifest-path "$CRATE_DIR/Cargo.toml" --locked

      - name: Strict Clippy under exact ProductFrozen graph
        run: cargo +"$PINNED_TOOLCHAIN" clippy --manifest-path "$CRATE_DIR/Cargo.toml" --all-targets --locked -- -D warnings

      - name: Verify post-execution byte immutability and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "$CRATE_DIR/Cargo.toml" | awk '{print $1}')" = "$EXPECTED_MANIFEST_SHA256"
          test "$(sha256sum "$CRATE_DIR/Cargo.lock" | awk '{print $1}')" = "$EXPECTED_LOCK_SHA256"
          test "$(sha256sum "$CRATE_DIR/src/lib.rs" | awk '{print $1}')" = "$EXPECTED_SOURCE_SHA256"
          test "$(sha256sum "$CRATE_DIR/tests/biomass_core.rs" | awk '{print $1}')" = "$EXPECTED_TEST_SHA256"
          git diff --check
          status="$(git status --short)"
          printf 'git_status=%s\n' "$status"
          test -z "$status"

      - name: Emit and validate REGEN-Q001 qualification receipt
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/regen011e-receipt
          python3 - <<'PY'
          import json
          import os
          import platform
          import subprocess
          from pathlib import Path

          def out(*args):
              return subprocess.check_output(args, text=True).strip()

          target = os.environ['TARGET_SHA']
          parent = os.environ['EXPECTED_PARENT_SHA']
          tree = out('git', 'rev-parse', 'HEAD^{tree}')
          rustc = out('rustc', '+1.96.0', '--version')
          cargo = out('cargo', '+1.96.0', '--version')
          rustfmt = out('rustfmt', '+1.96.0', '--version')
          receipt = {
              'schema': 'mycelix.regen.qualification-receipt-v1',
              'receipt_id': f"regen-011e-product-head-{target[:8]}-run-{os.environ['GITHUB_RUN_ID']}",
              'subject': {
                  'class': 'ProductHead',
                  'declared_identity': target,
                  'observed_identity': target,
                  'git': {
                      'repository': 'Luminous-Dynamics/mycelix',
                      'commit_sha': target,
                      'tree_sha': tree,
                      'parent_shas': [parent],
                  },
              },
              'campaign': {
                  'provider': 'github-actions',
                  'workflow_ref': '.github/workflows/regen-biomass-product-frozen.yml',
                  'run_ref': os.environ['GITHUB_RUN_ID'],
                  'job_ref': os.environ['GITHUB_JOB'],
                  'executed': True,
              },
              'environment': {
                  'runner': 'github-hosted:ubuntu-24.04',
                  'operating_system': platform.platform(),
                  'toolchains': [rustc, cargo, rustfmt],
              },
              'dependencies': {
                  'state': 'ProductFrozen',
                  'identities': [
                      {'kind': 'cargo-lock', 'digest': f"sha256:{os.environ['EXPECTED_LOCK_SHA256']}"},
                      {'kind': 'upstream-product-head', 'digest': f"git:{parent}"},
                  ],
              },
              'fixtures': [
                  {
                      'name': 'regen-011d1-preparation-capsule',
                      'sha256': os.environ['PREPARATION_ARCHIVE_SHA256'],
                      'git_blob': None,
                  },
                  {
                      'name': 'biomass-core-regression-suite',
                      'sha256': os.environ['EXPECTED_TEST_SHA256'],
                      'git_blob': os.environ['EXPECTED_TEST_BLOB'],
                  },
              ],
              'assertions': [
                  {'id': 'subject.exact-head', 'result': 'pass'},
                  {'id': 'subject.exact-parent', 'result': 'pass'},
                  {'id': 'subject.exact-scope', 'result': 'pass'},
                  {'id': 'preparation.exact-promoted-bytes', 'result': 'pass'},
                  {'id': 'upstream.regen-019d-product-frozen', 'result': 'pass'},
                  {'id': 'upstream.pef-source-anchors', 'result': 'pass'},
                  {'id': 'qualification.q001-validator-exact', 'result': 'pass'},
                  {'id': 'typestate.request-not-accepted', 'result': 'pass'},
                  {'id': 'typestate.accepted-reservation-evaluator-minted', 'result': 'pass'},
                  {'id': 'typestate.batch-validation-atomic', 'result': 'pass'},
                  {'id': 'boundary.accepted-not-consumed-or-executed', 'result': 'pass'},
                  {'id': 'runtime.toolchain-rust-1.96', 'result': 'pass'},
                  {'id': 'runtime.toolchain-cargo-1.96', 'result': 'pass'},
                  {'id': 'dependencies.product-frozen-lock', 'result': 'pass'},
                  {'id': 'tests.biomass-core', 'result': 'pass'},
                  {'id': 'clippy.strict-all-targets', 'result': 'pass'},
                  {'id': 'checkout.immutable-postflight', 'result': 'pass'},
              ],
              'result': 'pass',
              'proposition': 'The exact REGEN-011E mycelix-regenerative-biomass ProductHead satisfies the frozen biomass planning and evaluator-minted reservation type-state contract under the recorded Rust 1.96.0 ProductFrozen Cargo graph.',
              'non_claims': [
                  'No hermetic system-closure, dependency-safety, or bit-reproducible-build claim.',
                  'No real biomass availability, ecological sustainability, rights/custody truth, contamination safety, process suitability, or physical consumption claim.',
                  'No process execution, pyrolysis safety, biochar qualification, agronomic efficacy, carbon-removal, economic-value, governance-authority, or physical-actuation claim.',
              ],
              'evidence_refs': [
                  f"github:run:{os.environ['GITHUB_RUN_ID']}",
                  f"github:preparation-run:{os.environ['PREPARATION_RUN']}",
                  f"github:preparation-job:{os.environ['PREPARATION_JOB']}",
                  f"github:artifact:{os.environ['PREPARATION_ARTIFACT']}",
                  'github:pr:1409',
                  'github:pr:1517',
                  'github:pr:1315',
              ],
          }
          path = Path('/tmp/regen011e-receipt/qualification.json')
          path.write_text(json.dumps(receipt, sort_keys=True, separators=(',', ':')), encoding='utf-8')
          PY
          python3 qualification/regen-019d/verify-regen-qualification-receipt.py /tmp/regen011e-receipt/qualification.json
          sha256sum /tmp/regen011e-receipt/qualification.json

      - name: Upload validated ProductFrozen qualification receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: regen011e-product-frozen-receipt-${{ github.event.pull_request.head.sha }}
          path: /tmp/regen011e-receipt/qualification.json
          if-no-files-found: error
          retention-days: 90
