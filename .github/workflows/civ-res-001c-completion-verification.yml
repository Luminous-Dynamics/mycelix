name: CIV-RES-001C Completion Verification

on:
  pull_request:
    paths:
      - 'mycelix-workspace/docs/civic-resilience/CIV_RES_001C_COMPLETION_VERIFICATION_V1.md'
      - 'mycelix-workspace/docs/civic-resilience/civ_res_001c_completion_verification.json'
      - 'scripts/qualification/civ_res_001c_completion_verification_v1.py'
      - '.github/workflows/civ-res-001c-completion-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civ-res-001c-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Completion evidence and verification boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Exact parent and clean subject
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='c7b6f3ac3113d2eba83b01eeb12ab66c3598ee9f'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          printf 'head=%s\nparent=%s\ntree=%s\n' \
            "$(git rev-parse HEAD)" \
            "$(git rev-parse HEAD^)" \
            "$(git rev-parse HEAD^{tree})"
          test -z "$(git status --short)"

      - name: Exact tranche scope
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='c7b6f3ac3113d2eba83b01eeb12ab66c3598ee9f'
          test "$(git rev-list --count "$EXPECTED_PARENT"..HEAD)" = '1'
          git diff --check "$EXPECTED_PARENT" HEAD
          mapfile -t changed < <(git diff --name-only "$EXPECTED_PARENT" HEAD | sort)
          expected=(
            '.github/workflows/civ-res-001c-completion-verification.yml'
            'mycelix-workspace/docs/civic-resilience/CIV_RES_001C_COMPLETION_VERIFICATION_V1.md'
            'mycelix-workspace/docs/civic-resilience/civ_res_001c_completion_verification.json'
            'scripts/qualification/civ_res_001c_completion_verification_v1.py'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")

      - name: Validate completion contract
        run: python3 scripts/qualification/civ_res_001c_completion_verification_v1.py

      - name: Static no-runtime audit
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='c7b6f3ac3113d2eba83b01eeb12ab66c3598ee9f'
          changed="$(git diff --name-only "$EXPECTED_PARENT" HEAD)"
          if printf '%s\n' "$changed" | grep -E '\.(rs|toml|lock)$'; then
            echo 'CIV-RES-001C must remain semantic-contract/manifest/validator/workflow only' >&2
            exit 1
          fi

      - name: Prove reference-only dependencies and no positive booleans
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('mycelix-workspace/docs/civic-resilience/civ_res_001c_completion_verification.json')
          d = json.loads(p.read_text())
          assert d['runtime_owner'] == 'Deferred'
          assert all(x['dependency_state'] == 'architectural_reference_only' for x in d['architectural_dependencies'])
          assert 'verified' in d['forbidden_caller_selected_positive_fields']
          assert 'independent' in d['forbidden_caller_selected_positive_fields']
          assert 'CompletionVerificationEvidence' in d['artifact_kinds']
          PY

      - name: Immutable checkout postflight
        run: test -z "$(git status --short)"
