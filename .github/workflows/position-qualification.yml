name: Position Qualification

on:
  pull_request:
    paths:
      - 'mycelix-position/**'
      - '.github/workflows/position-qualification.yml'
  push:
    paths:
      - 'mycelix-position/**'
      - '.github/workflows/position-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-position:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Pull requests must qualify the exact branch head, not GitHub's synthetic
      # merge commit. Push/manual runs naturally fall back to github.sha.
      QUALIFICATION_SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      QUALIFICATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    defaults:
      run:
        working-directory: mycelix-position
    steps:
      # Pin every reusable action by full commit SHA. The trailing version
      # comment is informational only; the SHA is the authority.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.QUALIFICATION_SUBJECT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: mycelix-position

      - name: Capture qualification environment
        shell: bash
        run: |
          set -euo pipefail
          echo "qualification_subject_sha=${QUALIFICATION_SUBJECT_SHA}"
          echo "qualification_base_sha=${QUALIFICATION_BASE_SHA}"
          echo "github_runtime_sha=${GITHUB_SHA}"
          echo "qualification_workflow_ref=${GITHUB_WORKFLOW_REF}"
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "pure_wasm_profile=wasm32-unknown-unknown"
          echo "positioning_crypto_wasm_profile=wasm32-unknown-unknown"
          echo "holochain_guest_wasm_profile=wasm32-unknown-unknown+getrandom_backend:custom"
          echo "--- checked out commit ---"
          git rev-parse HEAD
          echo "--- /etc/os-release ---"
          cat /etc/os-release
          echo "--- rustc ---"
          rustc --version --verbose
          echo "--- cargo ---"
          cargo --version --verbose
          echo "--- rustup ---"
          rustup --version
          rustup show active-toolchain
          echo "--- committed inputs ---"
          sha256sum Cargo.lock
          sha256sum rust-toolchain.toml
          sha256sum lib/positioning-crypto/Cargo.toml
          sha256sum ../.github/workflows/position-qualification.yml
          echo "--- positioning-crypto resolved feature graph ---"
          cargo tree -p positioning-crypto -e features --locked

      - name: Verify positioning crypto dependency provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 - <<'PY'
          from pathlib import Path
          import tomllib

          expected_requirement = "=0.10.9"
          expected_version = "0.10.9"
          expected_source = "registry+https://github.com/rust-lang/crates.io-index"
          expected_checksum = "a7507d819769d01a365ab707794a4084392c824f54a7a6a7862f8c3d0892b283"

          def fail(message: str) -> None:
              raise SystemExit(f"positioning-crypto dependency provenance check failed: {message}")

          manifest_path = Path("lib/positioning-crypto/Cargo.toml")
          manifest = tomllib.loads(manifest_path.read_text(encoding="utf-8"))
          dependencies = manifest.get("dependencies")
          if not isinstance(dependencies, dict):
              fail("manifest has no [dependencies] table")

          sha2_dependency = dependencies.get("sha2")
          if not isinstance(sha2_dependency, dict):
              fail("manifest must declare sha2 as an explicit dependency table")

          allowed_dependency_keys = {"version", "default-features", "features"}
          unexpected_keys = sorted(set(sha2_dependency) - allowed_dependency_keys)
          if unexpected_keys:
              fail(f"sha2 manifest declaration contains unapproved keys: {unexpected_keys}")
          if sha2_dependency.get("version") != expected_requirement:
              fail(
                  "sha2 version requirement must be exactly "
                  f"{expected_requirement!r}, got {sha2_dependency.get('version')!r}"
              )
          if sha2_dependency.get("default-features") is not False:
              fail("sha2 default-features must be explicitly false")

          explicit_features = sha2_dependency.get("features", [])
          if explicit_features:
              fail(f"sha2 explicit features are not approved: {explicit_features!r}")

          lock = tomllib.loads(Path("Cargo.lock").read_text(encoding="utf-8"))
          packages = lock.get("package")
          if not isinstance(packages, list):
              fail("Cargo.lock has no package array")

          approved_packages = [
              package
              for package in packages
              if package.get("name") == "sha2"
              and package.get("version") == expected_version
          ]
          if len(approved_packages) != 1:
              fail(
                  "expected exactly one sha2 0.10.9 lock entry, "
                  f"found {len(approved_packages)}"
              )

          approved_package = approved_packages[0]
          if approved_package.get("source") != expected_source:
              fail(
                  "sha2 0.10.9 source mismatch: "
                  f"{approved_package.get('source')!r}"
              )
          if approved_package.get("checksum") != expected_checksum:
              fail(
                  "sha2 0.10.9 checksum mismatch: "
                  f"{approved_package.get('checksum')!r}"
              )

          print(f"approved_sha2_requirement={expected_requirement}")
          print(f"approved_sha2_version={expected_version}")
          print(f"approved_sha2_source={expected_source}")
          print(f"approved_sha2_checksum={expected_checksum}")
          print("manifest_and_lock_provenance=verified")
          PY

          feature_graph="$(cargo tree -p positioning-crypto -e features --locked --color never)"
          printf '%s\n' "--- verified positioning-crypto feature graph ---" "${feature_graph}"

          if ! grep -Fq 'sha2 v0.10.9' <<<"${feature_graph}"; then
            echo "Resolved positioning-crypto graph does not contain approved sha2 v0.10.9." >&2
            exit 1
          fi

          if grep -Fq 'sha2 feature "std"' <<<"${feature_graph}"; then
            echo "Resolved positioning-crypto graph unexpectedly enables sha2 std." >&2
            exit 1
          fi

          echo "resolved_sha2_feature_surface=verified"

      - name: Check formatting of changed Rust files
        shell: bash
        run: |
          set -euo pipefail

          base="${QUALIFICATION_BASE_SHA}"
          if [[ -z "${base}" || "${base}" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^)"
          fi

          # The job runs from mycelix-position/, while Git pathspecs are rooted
          # at the repository. Ask Git from the repository root and emit paths
          # relative to this working directory so both rustfmt and the final
          # diff check operate on the exact changed Position Rust files.
          mapfile -t changed_rs < <(
            git -C .. diff --name-only --diff-filter=ACMR --relative=mycelix-position \
              "${base}" "${QUALIFICATION_SUBJECT_SHA}" -- mycelix-position \
              | grep '\.rs$' || true
          )

          if [[ ${#changed_rs[@]} -eq 0 ]]; then
            echo "No Rust source files changed in this tranche."
            exit 0
          fi

          printf 'Rust files subject to formatting qualification:\n'
          printf '  %s\n' "${changed_rs[@]}"

          cargo fmt --all

          if ! git diff --exit-code -- "${changed_rs[@]}"; then
            echo "Changed Rust files are not formatted by the pinned rustfmt toolchain." >&2
            exit 1
          fi

          # cargo fmt may expose unrelated historical style debt outside this
          # tranche. Restore the exact subject before runtime qualification;
          # those files are not silently included in the code under test.
          git restore --worktree --source=HEAD -- .

      - name: Check native workspace
        run: cargo check --workspace --all-targets --locked

      - name: Test native workspace
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The pure mathematical crate makes a stronger portability claim than the
      # Holochain zomes: it must compile for bare wasm32-unknown-unknown without
      # browser, WASI, or Holochain-specific randomness assumptions.
      - name: Check pure positioning WASM
        run: cargo check -p positioning --target wasm32-unknown-unknown --locked

      # Concrete evidence crypto has the same no-host portability requirement,
      # but remains a separate theorem from the provider-neutral math/core crate.
      - name: Check positioning crypto WASM
        run: cargo check -p positioning-crypto --target wasm32-unknown-unknown --locked

      # Holochain zomes run in the conductor's guest environment, not a browser
      # or WASI runtime. Current Holochain build guidance selects getrandom's
      # custom backend for wasm32-unknown-unknown zome builds. Keep that runtime
      # profile scoped to the Holochain side so it cannot weaken either pure-crate
      # portability theorem above.
      - name: Check Holochain guest WASM
        env:
          RUSTFLAGS: '--cfg getrandom_backend="custom"'
        run: cargo check --workspace --exclude positioning --exclude positioning-crypto --target wasm32-unknown-unknown --locked
