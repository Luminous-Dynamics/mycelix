name: Core Types CI

on:
  push:
    branches: [main]
    paths:
      - 'crates/mycelix-core-types/**'
      - '.github/workflows/core-types-ci.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'crates/mycelix-core-types/**'
      - '.github/workflows/core-types-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core-types:
    name: Core Types evidence-support qualifier
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crates/mycelix-core-types
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/mycelix-core-types

      - name: Exact evidence-support contract (default)
        run: cargo test --test evidence_support_contract --no-default-features

      - name: Exact evidence-support contract (serde)
        run: cargo test --test evidence_support_contract --features serde

      - name: Default crate tests
        run: cargo test --all-targets --no-default-features

      - name: Serde library check
        run: cargo check --lib --features serde

      - name: Format
        run: cargo fmt -p mycelix-core-types -- --check

      - name: Clippy library with serde
        run: cargo clippy --lib --features serde -- -D warnings
