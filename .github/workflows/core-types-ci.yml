name: Core Types CI

on:
  pull_request:
    branches: [myc-sys-001c-explicit-temporal-bounds]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'crates/mycelix-core-types/**'
      - '.github/workflows/core-types-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core-types:
    name: Core Types numeric observation qualifier
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crates/mycelix-core-types
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/mycelix-core-types

      - name: Exact numeric contract (default)
        run: cargo test --test systemic_numeric_validation --no-default-features

      - name: Exact numeric contract (serde)
        run: cargo test --test systemic_numeric_validation --features serde

      - name: Serde library check
        run: cargo check --lib --features serde

      - name: Format
        run: cargo fmt -p mycelix-core-types -- --check
