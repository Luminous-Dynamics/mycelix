name: MoneyAmountV1 Wire Qualification

on:
  pull_request:
    paths:
      - 'mycelix-finance/crates/finance-wire-types/**'
      - 'mycelix-finance/docs/MONEY_AMOUNT_WIRE_V1.md'
      - 'mycelix-finance/docs/money-amount-golden-v1.json'
      - 'mycelix-finance/docs/money-amount-golden-v1.schema.json'
      - 'mycelix-workspace/sdk-ts/src/clients/finance/money-amount.ts'
      - 'mycelix-workspace/sdk-ts/src/clients/finance/index.ts'
      - 'mycelix-workspace/sdk-ts/tests/money-amount.test.ts'
      - '.github/workflows/money-amount-wire-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-finance/crates/finance-wire-types/**'
      - 'mycelix-finance/docs/MONEY_AMOUNT_WIRE_V1.md'
      - 'mycelix-finance/docs/money-amount-golden-v1.json'
      - 'mycelix-finance/docs/money-amount-golden-v1.schema.json'
      - 'mycelix-workspace/sdk-ts/src/clients/finance/money-amount.ts'
      - 'mycelix-workspace/sdk-ts/src/clients/finance/index.ts'
      - 'mycelix-workspace/sdk-ts/tests/money-amount.test.ts'
      - '.github/workflows/money-amount-wire-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-wire:
    name: Rust MoneyAmountV1 golden qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.0
          rustc --version
          cargo --version

      - name: Check formatting
        run: cargo fmt --manifest-path mycelix-finance/Cargo.toml -p finance-wire-types -- --check

      - name: Run Rust golden-vector and arithmetic tests
        run: cargo test --locked --manifest-path mycelix-finance/Cargo.toml -p finance-wire-types

      - name: Run Clippy
        run: cargo clippy --locked --manifest-path mycelix-finance/Cargo.toml -p finance-wire-types --all-targets -- -D warnings

  typescript-sdk:
    name: TypeScript MoneyAmountV1 golden qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mycelix-workspace/sdk-ts/package-lock.json

      - name: Install locked SDK dependencies
        working-directory: mycelix-workspace/sdk-ts
        run: npm ci

      - name: Run MoneyAmountV1 golden tests
        working-directory: mycelix-workspace/sdk-ts
        run: npx vitest run tests/money-amount.test.ts

      - name: Type-check SDK
        working-directory: mycelix-workspace/sdk-ts
        run: npm run typecheck
