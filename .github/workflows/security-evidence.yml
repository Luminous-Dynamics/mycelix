name: Mycelix Security Evidence Qualification

on:
  push:
    branches:
      - main
      - 'security/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve exact qualification commit
        id: target
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${PR_HEAD_SHA}" ]]; then
            printf 'sha=%s\n' "${PR_HEAD_SHA}" >> "${GITHUB_OUTPUT}"
            printf 'source=pull_request.head.sha\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'sha=%s\n' "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
            printf 'source=github.sha\n' >> "${GITHUB_OUTPUT}"
          fi
          printf 'Qualification target: %s (source=%s)\n'             "${PR_HEAD_SHA:-${GITHUB_SHA}}"             "${PR_HEAD_SHA:+pull_request.head.sha}" 

      - name: Check out exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false

      - name: Assert checked-out commit is exact target
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "${actual}" = "${EXPECTED_SHA}"
          printf 'Exact qualification checkout: %s\n' "${actual}"

      - name: Validate contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          platform = json.loads(Path("docs/security/mycelix-platform-evidence-capture-v0.1.json").read_text())
          recon = json.loads(Path("docs/security/mycelix-pc-client-eventlog-reconstruction-v0.1.json").read_text())
          payload = json.loads(Path("docs/security/mycelix-event-payload-digest-coherence-v0.1.json").read_text())
          raw_parser = json.loads(Path("docs/security/mycelix-raw-tpm2-eventlog-parser-v0.1.json").read_text())
          lineage = json.loads(Path("docs/security/mycelix-ak-ek-lineage-v0.1.json").read_text())
          creation = json.loads(Path("docs/security/mycelix-ak-creation-provenance-v0.1.json").read_text())
          public_name = json.loads(Path("docs/security/mycelix-tpm-public-name-coherence-v0.1.json").read_text())
          ak_attributes = json.loads(Path("docs/security/mycelix-ak-public-attributes-coherence-v0.1.json").read_text())
          ek_template = json.loads(Path("docs/security/mycelix-ek-template-appraisal-v0.1.json").read_text())
          assert platform["profile_id"] == "mycelix.security.platform.evidence.capture"
          assert recon["profile_id"] == "mycelix.security.platform.eventlog.reconstruction"
          assert platform["decision_algebra"] == "ANY DENY > ANY INDETERMINATE > ALL PASS"
          assert len(platform["vectors"]) == 33
          assert len(recon["vectors"]) == 25
          assert "eventlog-reconstruction-input.json" in platform["qualification_required_artifacts"]
          assert "verifier_source_sha256" in platform["required_reconstruction_output"]
          assert payload["artifact_type"] == "mycelix-event-payload-digest-coherence-v0.1"
          assert payload["states"] == ["PASS", "DENY", "INDETERMINATE"]
          assert len(payload["expected_vectors"]) == 6
          assert raw_parser["parser_id"] == "mycelix.pc-client.raw-tpm2-eventlog-parser.v0.1"
          assert isinstance(raw_parser["output"], list)
          assert "exact Event payload bytes as payload_hex" in raw_parser["output"]
          assert lineage["profile_id"] == "mycelix.security.tpm.ak-ek-lineage"
          assert lineage["claim_ceiling"] == "ReferenceModelOnly"
          assert lineage["decision_algebra"] == "ANY DENY > ANY INDETERMINATE > ALL PASS"
          assert len(lineage["vectors"]) == 28
          assert creation["profile_id"] == "mycelix.security.tpm.ak-creation-provenance"
          assert creation["claim_ceiling"] == "ReferenceModelOnly"
          assert creation["decision_algebra"] == "ANY DENY > ANY INDETERMINATE > ALL PASS"
          assert len(creation["vectors"]) == 23
          assert public_name["profile_id"] == "mycelix.security.tpm.public-name-coherence"
          assert public_name["claim_ceiling"] == "ReferenceModelOnly"
          assert public_name["decision_algebra"] == "ANY DENY > ANY INDETERMINATE > ALL PASS"
          assert len(public_name["vectors"]) == 13
          assert ak_attributes["profile_id"] == "mycelix.security.tpm.ak-public-attributes"
          assert ak_attributes["claim_ceiling"] == "ReferenceModelOnly"
          assert ak_attributes["decision_algebra"] == "ANY DENY > ANY INDETERMINATE > ALL PASS"
          assert len(ak_attributes["vectors"]) == 16
          cert_spki = json.loads(Path("docs/security/mycelix-ek-cert-spki-binding-v0.1.json").read_text())
          assert cert_spki["profile_id"] == "mycelix.security.tpm.ek-cert-spki-binding"
          assert cert_spki["claim_ceiling"] == "ReferenceModelOnly"
          assert cert_spki["decision_algebra"] == "ANY DENY > ANY INDETERMINATE > ALL PASS"
          assert len(cert_spki["vectors"]) == 16
          assert ek_template["profile_id"] == "mycelix.security.tpm.ek-template-appraisal"
          assert ek_template["claim_ceiling"] == "ReferenceModelOnly"
          assert ek_template["decision_algebra"] == "ANY DENY > ANY INDETERMINATE > ALL PASS"
          assert len(ek_template["vectors"]) == 24
          PY

      - name: Compile security verifiers and bundle regression
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/security/verify_mycelix_platform_evidence_capture_v0_1.py \
            scripts/security/reconstruct_mycelix_pc_client_eventlog_v0_1.py \
            scripts/security/test_mycelix_platform_evidence_bundle_v0_1.py \
            scripts/security/adapt_mycelix_tpm2_eventlog_yaml_v1_v0_1.py \
            scripts/security/test_mycelix_eventlog_adapter_replay_v0_1.py \
            scripts/security/verify_mycelix_event_payload_digest_coherence_v0_1.py \
            scripts/security/parse_mycelix_raw_tpm2_eventlog_v0_1.py \
            scripts/security/test_mycelix_raw_eventlog_yaml_crosscheck_v0_1.py \
            scripts/security/verify_mycelix_ak_ek_lineage_v0_1.py \
            scripts/security/verify_mycelix_ak_creation_provenance_v0_1.py \
            scripts/security/verify_mycelix_tpm_public_name_coherence_v0_1.py \
            scripts/security/verify_mycelix_ek_template_appraisal_v0_1.py \
            scripts/security/verify_mycelix_ak_public_attributes_v0_1.py \
            scripts/security/verify_mycelix_ek_cert_spki_binding_v0_1.py \
            scripts/security/capture_mycelix_ek_certificate_nv_v0_1.py \
            scripts/security/verify_mycelix_ek_cert_chain_policy_v0_1.py \
            scripts/security/verify_mycelix_ek_cert_san_property_binding_v0_1.py

      - name: Run platform Evidence semantic corpus
        run: python3 scripts/security/verify_mycelix_platform_evidence_capture_v0_1.py --self-test

      - name: Run independent PCR reconstruction semantic corpus
        run: python3 scripts/security/reconstruct_mycelix_pc_client_eventlog_v0_1.py --self-test

      - name: Run tpm2_eventlog YAML adapter semantic corpus
        run: python3 scripts/security/adapt_mycelix_tpm2_eventlog_yaml_v1_v0_1.py --self-test

      - name: Run payload coherence semantic corpus
        run: python3 scripts/security/verify_mycelix_event_payload_digest_coherence_v0_1.py --self-test

      - name: Run raw parser semantic corpus
        run: python3 scripts/security/parse_mycelix_raw_tpm2_eventlog_v0_1.py --self-test

      - name: Run AK/EK lineage semantic corpus
        run: python3 scripts/security/verify_mycelix_ak_ek_lineage_v0_1.py --self-test

      - name: Run AK creation provenance semantic corpus
        run: python3 scripts/security/verify_mycelix_ak_creation_provenance_v0_1.py --self-test

      - name: Run TPM public-name coherence semantic corpus
        run: python3 scripts/security/verify_mycelix_tpm_public_name_coherence_v0_1.py --self-test

      - name: Run AK public attributes semantic corpus
        run: python3 scripts/security/verify_mycelix_ak_public_attributes_v0_1.py --self-test

      - name: Run EK certificate SPKI binding semantic corpus
        run: python3 scripts/security/verify_mycelix_ek_cert_spki_binding_v0_1.py --self-test

      - name: Run EK NV-only certificate capture semantic corpus
        run: python3 scripts/security/capture_mycelix_ek_certificate_nv_v0_1.py --self-test

      - name: Run EK certificate chain policy semantic corpus
        run: python3 scripts/security/verify_mycelix_ek_cert_chain_policy_v0_1.py --self-test

      - name: Run EK certificate SAN property binding semantic corpus
        run: python3 scripts/security/verify_mycelix_ek_cert_san_property_binding_v0_1.py --self-test

      - name: Run EK template appraisal semantic corpus
        run: python3 scripts/security/verify_mycelix_ek_template_appraisal_v0_1.py --self-test

      - name: Run representation consistency regression
        run: python3 scripts/security/test_mycelix_raw_eventlog_yaml_crosscheck_v0_1.py

      - name: Run adapter-to-reconstruction composition regression
        run: python3 scripts/security/test_mycelix_eventlog_adapter_replay_v0_1.py

      - name: Run end-to-end bundle false-green regression
        run: python3 scripts/security/test_mycelix_platform_evidence_bundle_v0_1.py

      - name: Confirm claim ceiling remains bounded
        run: |
          set -euo pipefail
          grep -q '"claim_ceiling": "ReferenceModelOnly"' docs/security/mycelix-platform-evidence-capture-v0.1.json
          grep -q 'TPM PLATFORM CAPTURE: NOT EXECUTED' scripts/security/verify_mycelix_platform_evidence_capture_v0_1.py
          grep -q 'reconstruction-result-not-qualified' scripts/security/verify_mycelix_platform_evidence_capture_v0_1.py
