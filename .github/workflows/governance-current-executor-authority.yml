name: Governance Current Executor Authority

on:
  pull_request:
    paths:
      - 'crates/mycelix-governance-current-executor-authority/**'
      - 'crates/mycelix-governance-executor-lineage/**'
      - 'crates/mycelix-governance-executor-designation/**'
      - 'crates/mycelix-authority-delegation/**'
      - 'crates/mycelix-authority-delegation-policy/**'
      - 'crates/mycelix-authority-freshness/**'
      - 'crates/mycelix-authority-identity/**'
      - 'crates/mycelix-governance-threshold-qualification/**'
      - 'crates/mycelix-governance-authority/**'
      - 'crates/mycelix-institutional-core/**'
      - '.github/workflows/governance-current-executor-authority.yml'
  push:
    branches:
      - 'security/governance-current-executor-authority-v0.1'

permissions:
  contents: read

concurrency:
  group: governance-current-executor-authority-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: Current executor authority generations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path crates/mycelix-governance-current-executor-authority/Cargo.toml -- --check
      - name: Tests
        run: cargo test --manifest-path crates/mycelix-governance-current-executor-authority/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-governance-current-executor-authority/Cargo.toml --all-targets -- -D warnings
      - name: Authority-separation audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('crates/mycelix-governance-current-executor-authority/src/lib.rs').read_text()
          invariants = Path('crates/mycelix-governance-current-executor-authority/INVARIANTS.md').read_text()

          required = [
              'qualify_lineage_bound_executor_authority',
              'qualify_current_freshness',
              'AuthoritySubjectKind::AuthorityGrant',
              'AuthoritySubjectKind::ThresholdAuthorization',
              'AuthoritySubjectKind::ExecutorDesignation',
              'threshold_authorization_identity',
              'THRESHOLD_AUTHORIZATION_IDENTITY_PROFILE',
              'CURRENT_EXECUTOR_AUTHORITY_PROFILE',
              'QualifiedCurrentExecutorAuthority',
              'GrantFreshnessMismatch',
              'ThresholdFreshnessMismatch',
              'ExecutorFreshnessMismatch',
          ]
          for token in required:
              assert token in src, token

          assert 'Deserialize)]\npub struct QualifiedCurrentExecutorAuthority' not in src
          assert 'current: bool' not in src
          assert 'trusted: bool' not in src
          lowered = src.lower()
          assert 'phi' not in lowered
          assert 'reputation' not in lowered
          assert 'model_score' not in lowered

          assert 'Threshold freshness is dependency-closure state' in invariants
          assert 'Direct grants receive real revocation semantics too' in invariants
          assert 'Re-verification does not mint new authority' in invariants
          print('PASS: exact executor semantics plus grant/threshold/executor generations are required for current authority')
          PY
