name: Space orbital mechanics

on:
  pull_request:
    paths:
      - "mycelix-workspace/crates/orbital-mechanics/**"
      - "mycelix-workspace/mycelix-space/**"
      - ".github/workflows/space-orbital-mechanics.yml"
  push:
    branches: [main]
    paths:
      - "mycelix-workspace/crates/orbital-mechanics/**"
      - "mycelix-workspace/mycelix-space/**"
      - ".github/workflows/space-orbital-mechanics.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: space-orbital-mechanics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  orbital-mechanics:
    name: Test standalone orbital-mechanics crate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-workspace/crates/orbital-mechanics

      - name: Check formatting
        run: cargo fmt --manifest-path mycelix-workspace/crates/orbital-mechanics/Cargo.toml -- --check

      - name: Run orbital-mechanics unit tests
        run: cargo test --manifest-path mycelix-workspace/crates/orbital-mechanics/Cargo.toml

  space-holochain-contracts:
    name: Test Space shared types and compile coordinator WASM
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-workspace/mycelix-space

      - name: Check Space workspace formatting
        run: cargo fmt --manifest-path mycelix-workspace/mycelix-space/Cargo.toml --all -- --check

      - name: Test shared Space contract
        run: cargo test --manifest-path mycelix-workspace/mycelix-space/Cargo.toml -p mycelix-space-shared

      - name: Compile conjunction coordinator for Holochain WASM
        run: cargo check --manifest-path mycelix-workspace/mycelix-space/Cargo.toml -p conjunctions_coordinator --target wasm32-unknown-unknown

      - name: Compile traffic-control coordinator for Holochain WASM
        run: cargo check --manifest-path mycelix-workspace/mycelix-space/Cargo.toml -p traffic_control --target wasm32-unknown-unknown

      - name: Test traffic-control coordinator contracts
        run: cargo test --manifest-path mycelix-workspace/mycelix-space/Cargo.toml -p traffic_control

      - name: Test traffic-control integrity contracts
        run: cargo test --manifest-path mycelix-workspace/mycelix-space/Cargo.toml -p traffic_control_integrity
