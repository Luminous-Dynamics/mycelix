name: Space orbital mechanics

on:
  pull_request:
    paths:
      - "mycelix-workspace/crates/orbital-mechanics/**"
      - "mycelix-workspace/mycelix-space/**"
      - ".github/workflows/space-orbital-mechanics.yml"
  push:
    branches: [main]
    paths:
      - "mycelix-workspace/crates/orbital-mechanics/**"
      - "mycelix-workspace/mycelix-space/**"
      - ".github/workflows/space-orbital-mechanics.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: space-orbital-mechanics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  orbital-mechanics:
    name: Test standalone orbital-mechanics crate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-workspace/crates/orbital-mechanics

      - name: Check formatting
        run: cargo fmt --manifest-path mycelix-workspace/crates/orbital-mechanics/Cargo.toml -- --check

      - name: Run orbital-mechanics unit tests
        run: cargo test --manifest-path mycelix-workspace/crates/orbital-mechanics/Cargo.toml

  space-holochain-contracts:
    name: Test Space shared types and compile coordinator WASM
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-workspace/mycelix-space

      - name: Check Space workspace formatting
        run: cargo fmt --manifest-path mycelix-workspace/mycelix-space/Cargo.toml --all -- --check

      - name: Test shared Space contract
        run: cargo test --manifest-path mycelix-workspace/mycelix-space/Cargo.toml -p mycelix-space-shared

      - name: Run conjunction coordinator screening parameter tests
        run: cargo test --manifest-path mycelix-workspace/mycelix-space/Cargo.toml -p conjunctions_coordinator

      - name: Compile conjunction coordinator for Holochain WASM
        env:
          # Holochain 0.6 supplies the getrandom 0.3 custom backend at runtime.
          # Do not enable wasm_js: wasm-bindgen is not part of the Holochain host ABI.
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: '--cfg getrandom_backend="custom"'
        run: cargo check --manifest-path mycelix-workspace/mycelix-space/Cargo.toml -p conjunctions_coordinator --target wasm32-unknown-unknown

      - name: Test orbital objects coordinator
        run: cargo test --manifest-path mycelix-workspace/mycelix-space/Cargo.toml -p orbital_objects

      - name: Compile orbital objects coordinator for Holochain WASM
        run: cargo check --manifest-path mycelix-workspace/mycelix-space/Cargo.toml -p orbital_objects --target wasm32-unknown-unknown

      - name: Run Space integration and edge-case contracts
        run: >-
          cargo test
          --manifest-path mycelix-workspace/mycelix-space/tests/Cargo.toml
          --test edge_cases
          --test conjunctions
          --test orbital_objects
          --test space_coordination_e2e
