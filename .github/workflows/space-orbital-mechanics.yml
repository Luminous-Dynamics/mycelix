name: Space orbital mechanics

on:
  pull_request:
    paths:
      - "mycelix-workspace/crates/orbital-mechanics/**"
      - "mycelix-workspace/mycelix-space/**"
      - ".github/workflows/space-orbital-mechanics.yml"
  push:
    branches: [main]
    paths:
      - "mycelix-workspace/crates/orbital-mechanics/**"
      - "mycelix-workspace/mycelix-space/**"
      - ".github/workflows/space-orbital-mechanics.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: space-orbital-mechanics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  orbital-mechanics:
    name: Test standalone orbital-mechanics crate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned NumPy for independent numerical verifier
        run: python -m pip install --disable-pip-version-check numpy==2.3.5

      - name: Recompute correlated Gaussian disk reference
        run: python mycelix-workspace/crates/orbital-mechanics/tools/verify_pc_correlated_gaussian_reference.py

      - name: Recompute correlated disk reference with conditional-normal quadrature
        run: python mycelix-workspace/crates/orbital-mechanics/tools/verify_pc_correlated_gaussian_conditional_reference.py

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-workspace/crates/orbital-mechanics

      - name: Check formatting
        run: cargo fmt --manifest-path mycelix-workspace/crates/orbital-mechanics/Cargo.toml -- --check

      - name: Run orbital-mechanics unit tests
        run: cargo test --manifest-path mycelix-workspace/crates/orbital-mechanics/Cargo.toml

  space-holochain-contracts:
    name: Test Space shared types and compile coordinator WASM
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mycelix-workspace/mycelix-space

      - name: Check Space workspace formatting
        run: cargo fmt --manifest-path mycelix-workspace/mycelix-space/Cargo.toml --all -- --check

      - name: Test shared Space contract
        run: cargo test --manifest-path mycelix-workspace/mycelix-space/Cargo.toml -p mycelix-space-shared

      - name: Run conjunction coordinator screening parameter tests
        run: cargo test --manifest-path mycelix-workspace/mycelix-space/Cargo.toml -p conjunctions_coordinator

      - name: Assert Holochain WASM linker configuration
        working-directory: mycelix-workspace/mycelix-space
        run: |
          grep -Fq 'getrandom_backend="custom"' .cargo/config.toml
          grep -Fq 'link-args=--import-undefined' .cargo/config.toml

      - name: Compile conjunction coordinator for Holochain WASM
        # Run inside this workspace so Cargo discovers its local .cargo/config.toml.
        # That file retains the custom getrandom backend and unresolved host imports.
        working-directory: mycelix-workspace/mycelix-space
        run: cargo build --release -p conjunctions_coordinator --target wasm32-unknown-unknown
