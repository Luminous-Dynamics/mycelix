name: life-civic-reference-contract

on:
  pull_request:
    paths:
      - ".github/workflows/life-civic-reference-contract.yml"
      - "docs/knowledge/LIFE_AND_CIVIC_STANDARDS_PROFILE.md"
      - "schemas/life-civic/**"
      - "tests/reference/life-civic-standards/**"
      - "tests/reference/life-civic-service/**"
      - "tools/life-civic-reference-checker/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/life-civic-reference-contract.yml"
      - "docs/knowledge/LIFE_AND_CIVIC_STANDARDS_PROFILE.md"
      - "schemas/life-civic/**"
      - "tests/reference/life-civic-standards/**"
      - "tests/reference/life-civic-service/**"
      - "tools/life-civic-reference-checker/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: life-civic-reference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-reference-contract:
    name: Life and civic reference contract validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact event revision without an external checkout action
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            test -n "${PR_NUMBER}"
            test -n "${PR_HEAD_SHA}"
            git fetch --no-tags --depth=1 origin "refs/pull/${PR_NUMBER}/head"
            git checkout --detach FETCH_HEAD
            expected_sha="${PR_HEAD_SHA}"
          else
            git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
            git checkout --detach FETCH_HEAD
            expected_sha="${GITHUB_SHA}"
          fi
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${expected_sha}"
          printf 'Qualified source revision: %s\n' "${actual_sha}"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.1 --profile minimal
          rustup component add rustfmt --toolchain 1.96.1
          rustc +1.96.1 --version
          cargo +1.96.1 --version
          cargo +1.96.1 fmt --version

      - name: Check formatting on the exact source revision
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.96.1 fmt --manifest-path tools/life-civic-reference-checker/Cargo.toml -- --check

      - name: Validate schemas and adversarial fixtures on the exact source revision
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.96.1 test --manifest-path tools/life-civic-reference-checker/Cargo.toml --all-targets
