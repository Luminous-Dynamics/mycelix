name: VOEvent header and citations

on:
  push:
    paths:
      - "research/voevent-header/**"
      - ".github/workflows/voevent-header-citations.yml"
  pull_request:
    paths:
      - "research/voevent-header/**"
      - ".github/workflows/voevent-header-citations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voevent-header:
    name: VOEvent packet parser
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Check formatting
        run: cargo +stable fmt --manifest-path research/voevent-header/Cargo.toml --all -- --check
      - name: Run tests
        run: cargo +stable test --manifest-path research/voevent-header/Cargo.toml --all-targets
      - name: Run strict Clippy
        run: cargo +stable clippy --manifest-path research/voevent-header/Cargo.toml --all-targets -- -D warnings
