name: Terra Preta randomized soil intervention causal audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/terra-preta/RANDOMIZED_SOIL_INTERVENTION_CAUSAL_AUDIT_V0.1.md'
      - 'research/terra-preta/schemas/randomized-soil-trial-input.schema.json'
      - 'research/terra-preta/schemas/randomized-soil-trial-report.schema.json'
      - 'research/terra-preta/tools/randomized-soil-trial-audit/**'
      - '.github/workflows/terra-preta-randomized-soil-trial.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  randomized-soil-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path research/terra-preta/tools/randomized-soil-trial-audit/Cargo.toml -- --check
      - name: Tests
        run: cargo test --manifest-path research/terra-preta/tools/randomized-soil-trial-audit/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --manifest-path research/terra-preta/tools/randomized-soil-trial-audit/Cargo.toml --all-targets -- -D warnings
      - name: Install pinned Rust JSON Schema validator
        run: cargo install jsonschema-cli --version 0.61.0 --locked
      - name: Validate fixture and report
        run: |
          schema=research/terra-preta/schemas/randomized-soil-trial-input.schema.json
          fixture=research/terra-preta/tools/randomized-soil-trial-audit/fixtures/synthetic-randomized-trial.json
          jsonschema-cli validate "$schema" --instance "$fixture" --draft 2020 --assert-format
          cargo run --quiet --manifest-path research/terra-preta/tools/randomized-soil-trial-audit/Cargo.toml -- \
            "$fixture" "$RUNNER_TEMP/randomized-trial-report.json"
          jsonschema-cli validate research/terra-preta/schemas/randomized-soil-trial-report.schema.json \
            --instance "$RUNNER_TEMP/randomized-trial-report.json" --draft 2020 --assert-format
          jq -e '
            .fixture_status == "synthetic_only_not_empirical_evidence" and
            .randomized_unit_count == 8 and
            .block_count == 4 and
            .subsample_count_not_in_n == 46 and
            .causal_itt_estimate == 2.5 and
            .exact_two_sided_randomization_p_value == 0.125 and
            .randomization_assignments_enumerated == 16 and
            .causal_claim_status == "causal_itt_qualified_synthetic"
          ' "$RUNNER_TEMP/randomized-trial-report.json"
      - name: Reject incomplete blocks and support mismatch
        run: |
          fixture=research/terra-preta/tools/randomized-soil-trial-audit/fixtures/synthetic-randomized-trial.json
          jq '.units[0].followup_value = null' "$fixture" > "$RUNNER_TEMP/missing-followup.json"
          if cargo run --quiet --manifest-path research/terra-preta/tools/randomized-soil-trial-audit/Cargo.toml -- \
            "$RUNNER_TEMP/missing-followup.json" "$RUNNER_TEMP/missing-followup-report.json"; then
            echo "Expected missing endpoint rejection"
            exit 1
          fi
          jq '.units[0].assignment = "control"' "$fixture" > "$RUNNER_TEMP/bad-block.json"
          if cargo run --quiet --manifest-path research/terra-preta/tools/randomized-soil-trial-audit/Cargo.toml -- \
            "$RUNNER_TEMP/bad-block.json" "$RUNNER_TEMP/bad-block-report.json"; then
            echo "Expected invalid block randomization rejection"
            exit 1
          fi
      - name: Reject output overwrite
        run: |
          fixture=research/terra-preta/tools/randomized-soil-trial-audit/fixtures/synthetic-randomized-trial.json
          report="$RUNNER_TEMP/existing-randomized-report.json"
          printf 'do-not-overwrite\n' > "$report"
          if cargo run --quiet --manifest-path research/terra-preta/tools/randomized-soil-trial-audit/Cargo.toml -- "$fixture" "$report"; then
            echo "Expected create-new output protection"
            exit 1
          fi
          test "$(cat "$report")" = "do-not-overwrite"
