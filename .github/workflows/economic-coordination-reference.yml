name: Economic Coordination Reference

on:
  pull_request:
    paths:
      - ".github/workflows/economic-coordination-reference.yml"
      - "mycelix-finance/tools/economic-coordination-reference/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/economic-coordination-reference.yml"
      - "mycelix-finance/tools/economic-coordination-reference/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: economic-coordination-reference-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reference-contract:
    name: exact-head reference contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 immutable commit
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # immutable commit inspected 2026-10-09
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Assert Rust toolchain identity
        run: |
          test "$(rustc +1.96.0 --version)" = "rustc 1.96.0 (ac68faa20 2026-05-25)"
          rustfmt +1.96.0 --version

      - name: Check formatting of changed Rust sources
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.ref_name }}
        run: |
          set -euo pipefail
          crate_dir="mycelix-finance/tools/economic-coordination-reference"
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            mapfile -t rust_files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" -- "$crate_dir" | grep -E '\\.rs
      - name: Run reference and adversarial tests
        run: cargo test --locked --manifest-path mycelix-finance/tools/economic-coordination-reference/Cargo.toml

      - name: Compile sourcing benchmark harness
        run: cargo check --locked --manifest-path mycelix-finance/tools/economic-coordination-reference/Cargo.toml --example sourcing_benchmark
 || true)
          else
            mapfile -t rust_files < <(git ls-files "$crate_dir" | grep -E '\\.rs
      - name: Run reference and adversarial tests
        run: cargo test --locked --manifest-path mycelix-finance/tools/economic-coordination-reference/Cargo.toml

      - name: Compile sourcing benchmark harness
        run: cargo check --locked --manifest-path mycelix-finance/tools/economic-coordination-reference/Cargo.toml --example sourcing_benchmark
 || true)
          fi
          if [[ ${#rust_files[@]} -eq 0 ]]; then
            echo "No changed Rust sources in the reference crate."
            exit 0
          fi
          rustfmt +1.96.0 --check --edition 2024 --config skip_children=true "${rust_files[@]}"

      - name: Run reference and adversarial tests
        run: cargo test --locked --manifest-path mycelix-finance/tools/economic-coordination-reference/Cargo.toml

      - name: Compile sourcing benchmark harness
        run: cargo check --locked --manifest-path mycelix-finance/tools/economic-coordination-reference/Cargo.toml --example sourcing_benchmark
