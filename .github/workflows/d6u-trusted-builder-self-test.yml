name: D6U Trusted Builder Self-Test

on:
  pull_request:
    paths:
      - ".github/workflows/d6u-trusted-evidence-attestation.yml"
      - ".github/workflows/d6u-trusted-builder-self-test.yml"
      - ".github/workflows/d6u-exact-head-runtime-executor.yml"
      - "docs/integral/d6u-trusted-builder-policy.json"
      - "scripts/integral/verify_d6u_trusted_artifacts.py"
      - "scripts/integral/test_d6u_trusted_artifacts.py"
      - "scripts/integral/fetch_d6u_trusted_artifact.py"
      - "scripts/integral/verify_d6u_trusted_attestation.py"
      - "scripts/integral/emit_d6u_trusted_attestation_predicate.py"
      - "scripts/integral/verify_d6u_trusted_attestation_retention.py"
  workflow_dispatch:

permissions: {}

concurrency:
  group: d6u-trusted-builder-self-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  self-test:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact test head
        env:
          EXPECTED_TEST_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          observed="$(git rev-parse HEAD)"
          test "$observed" = "$EXPECTED_TEST_HEAD"

      - name: Checkout pinned trusted D6S source root
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: 445a84abdaa64f3d05e2d5c51115e4d060b78ec7
          path: _trusted-main
          persist-credentials: false
          fetch-depth: 1

      - name: Assert pinned trusted D6S source root
        env:
          EXPECTED_TRUSTED_ROOT: 445a84abdaa64f3d05e2d5c51115e4d060b78ec7
        run: |
          observed="$(git -C _trusted-main rev-parse HEAD)"
          test "$observed" = "$EXPECTED_TRUSTED_ROOT"

      - name: Compile trusted verifier
        run: python3 -m py_compile scripts/integral/verify_d6u_trusted_artifacts.py scripts/integral/fetch_d6u_trusted_artifact.py scripts/integral/verify_d6u_trusted_attestation.py scripts/integral/emit_d6u_trusted_attestation_predicate.py scripts/integral/verify_d6u_trusted_attestation_retention.py scripts/integral/test_d6u_trusted_artifacts.py

      - name: Run trusted verifier self-tests
        working-directory: scripts/integral
        env:
          D6U_TRUSTED_SOURCE_ROOT: ${{ github.workspace }}/_trusted-main
        run: python3 test_d6u_trusted_artifacts.py
