name: Restore shared Leptos UI package

on:
  pull_request:
    paths:
      - "crates/mycelix-leptos-ui/**"
      - "crates/mycelix-leptos-core/**"
      - "mycelix-commons/apps/leptos/**"
      - ".github/workflows/mycelix-leptos-ui.yml"
  push:
    branches: [main]
    paths:
      - "crates/mycelix-leptos-ui/**"
      - "crates/mycelix-leptos-core/**"
      - "mycelix-commons/apps/leptos/**"
      - ".github/workflows/mycelix-leptos-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mycelix-leptos-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Components, path resolution and WASM consumers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/mycelix-leptos-ui -> target
            crates/mycelix-leptos-core -> target
            mycelix-commons/apps/leptos -> target
      - name: Check Rust formatting
        run: cargo fmt --manifest-path crates/mycelix-leptos-ui/Cargo.toml -- --check
      - name: Test shared UI crate
        run: cargo test --manifest-path crates/mycelix-leptos-ui/Cargo.toml
      - name: Check shared UI crate with Clippy
        run: cargo clippy --manifest-path crates/mycelix-leptos-ui/Cargo.toml --all-targets -- -D warnings
      - name: Resolve shared-core dependency graph from a clean checkout
        run: cargo metadata --manifest-path crates/mycelix-leptos-core/Cargo.toml --format-version 1 > /tmp/mycelix-core-metadata.json
      - name: Compile the shared core for WASM
        run: cargo check --manifest-path crates/mycelix-leptos-core/Cargo.toml --target wasm32-unknown-unknown
      - name: Compile Mycelix Commons for WASM
        run: cargo check --manifest-path mycelix-commons/apps/leptos/Cargo.toml --target wasm32-unknown-unknown
      - name: Record initial standalone lockfile for reproducibility audit
        if: always()
        run: |
          if [ -f crates/mycelix-leptos-ui/Cargo.lock ]; then
            sha256sum crates/mycelix-leptos-ui/Cargo.lock
            cat crates/mycelix-leptos-ui/Cargo.lock
          else
            echo "Cargo.lock was not generated"
          fi
