name: mobility-reconciliation-witness-revision-qualification

on:
  pull_request:
    paths:
      - "docs/mobility/MOBILITY_RECONCILIATION_WITNESS_REVISION_V1.*"
      - "docs/mobility/MOBILITY_RECONCILIATION_WITNESS_REVISION_V1_EXECUTABLE.json"
      - "mycelix-commons/crates/mobility-configuration-qualification/**"
      - "tools/mobility_reconciliation_witness_revision_executable_reference.py"
      - "tools/compare_mobility_reconciliation_witness_revision.py"
      - ".github/workflows/mobility-reconciliation-witness-revision-qualification.yml"
  push:
    branches: [main]
    paths:
      - "docs/mobility/MOBILITY_RECONCILIATION_WITNESS_REVISION_V1.*"
      - "docs/mobility/MOBILITY_RECONCILIATION_WITNESS_REVISION_V1_EXECUTABLE.json"
      - "mycelix-commons/crates/mobility-configuration-qualification/**"
      - "tools/mobility_reconciliation_witness_revision_executable_reference.py"
      - "tools/compare_mobility_reconciliation_witness_revision.py"
      - ".github/workflows/mobility-reconciliation-witness-revision-qualification.yml"

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo test -p mobility-configuration-qualification
      - run: cargo run --quiet --manifest-path mycelix-commons/crates/mobility-configuration-qualification/Cargo.toml --bin mobility-witness-revision-qualification -- docs/mobility/MOBILITY_RECONCILIATION_WITNESS_REVISION_V1_EXECUTABLE.json > /tmp/rust.json
      - uses: actions/upload-artifact@v4
        with:
          name: mobility-witness-revision-rust-normalized
          path: /tmp/rust.json
          if-no-files-found: error
          retention-days: 30

  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 tools/mobility_reconciliation_witness_revision_executable_reference.py > /tmp/python.json
      - uses: actions/upload-artifact@v4
        with:
          name: mobility-witness-revision-python-normalized
          path: /tmp/python.json
          if-no-files-found: error
          retention-days: 30

  differential:
    runs-on: ubuntu-latest
    needs: [rust, reference]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mobility-witness-revision-rust-normalized
          path: /tmp/rust
      - uses: actions/download-artifact@v4
        with:
          name: mobility-witness-revision-python-normalized
          path: /tmp/python
      - run: python3 tools/compare_mobility_reconciliation_witness_revision.py /tmp/rust/rust.json /tmp/python/python.json
      - name: Corruption probe
        run: |
          python3 -c 'import json; p="/tmp/python/python.json"; d=json.load(open(p)); d["cases"][0]["actual"]="rejected"; json.dump(d,open("/tmp/corrupted.json","w"))'
          if python3 tools/compare_mobility_reconciliation_witness_revision.py /tmp/rust/rust.json /tmp/corrupted.json; then
            echo "Comparator accepted corrupted normalized output" >&2
            exit 1
          fi
          echo "Comparator correctly rejected corrupted normalized output"

  corpus-corruption:
    runs-on: ubuntu-latest
    needs: [rust, reference]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Corrupt executable case and require both evaluators to reject
        run: |
          python3 -c 'import json; p="docs/mobility/MOBILITY_RECONCILIATION_WITNESS_REVISION_V1_EXECUTABLE.json"; d=json.load(open(p)); d["cases"][5]["supersession"]["source"]["id"]="w1"; json.dump(d,open("/tmp/corrupted-corpus.json","w"))'
          if python3 tools/mobility_reconciliation_witness_revision_executable_reference.py /tmp/corrupted-corpus.json >/tmp/python-corrupt.out 2>&1; then
            echo "Python accepted corrupted corpus" >&2; exit 1
          fi
          if cargo run --quiet --manifest-path mycelix-commons/crates/mobility-configuration-qualification/Cargo.toml --bin mobility-witness-revision-qualification -- /tmp/corrupted-corpus.json >/tmp/rust-corrupt.out 2>&1; then
            echo "Rust accepted corrupted corpus" >&2; exit 1
          fi
          echo "Both evaluators rejected corrupted corpus"
