name: AeroCommons Adapter Run Receipt

on:
  pull_request:
    paths:
      - "tools/aero-adapter-run-receipt/**"
      - "mycelix-commons/crates/aero-evidence-types/**"
      - "docs/aerocommons/AERO_ADAPTER_RUN_RECEIPT_V1.schema.json"
      - "docs/aerocommons/AERO_ADAPTER_RUN_RECEIPT_001.md"
      - ".github/workflows/aerocommons-adapter-run-receipt.yml"
  push:
    branches:
      - "research/aerocommons-adapter-run-receipt-001"
    paths:
      - "tools/aero-adapter-run-receipt/**"
      - "mycelix-commons/crates/aero-evidence-types/**"
      - "docs/aerocommons/AERO_ADAPTER_RUN_RECEIPT_V1.schema.json"
      - "docs/aerocommons/AERO_ADAPTER_RUN_RECEIPT_001.md"
      - ".github/workflows/aerocommons-adapter-run-receipt.yml"

permissions:
  contents: read

jobs:
  adapter-run-receipt:
    name: Receipt integrity and adversarial replay
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust 1.96.1
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt, clippy
      - name: Ensure Clippy component is installed
        run: rustup component add clippy --toolchain 1.96.1
      - name: Run receipt verifier tests
        run: cargo test --manifest-path tools/aero-adapter-run-receipt/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --manifest-path tools/aero-adapter-run-receipt/Cargo.toml --all-targets -- -D warnings
