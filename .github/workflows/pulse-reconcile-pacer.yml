name: Pulse Reconcile Pacer

on:
  pull_request:
    paths:
      - 'mycelix-workspace/mycelix-pulse/crates/pulse-reconcile-pacer/**'
      - '.github/workflows/pulse-reconcile-pacer.yml'
  push:
    branches: [main]
    paths:
      - 'mycelix-workspace/mycelix-pulse/crates/pulse-reconcile-pacer/**'
      - '.github/workflows/pulse-reconcile-pacer.yml'

permissions:
  contents: read

concurrency:
  group: pulse-reconcile-pacer-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

env:
  MANIFEST: mycelix-workspace/mycelix-pulse/crates/pulse-reconcile-pacer/Cargo.toml
  LOCKFILE: mycelix-workspace/mycelix-pulse/crates/pulse-reconcile-pacer/Cargo.lock

jobs:
  pacer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact subject checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected" || {
            echo "::error::Expected exact subject $expected, got $actual"
            exit 1
          }
          test -f "$MANIFEST"
          test -f "$LOCKFILE"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87b
        with:
          toolchain: 1.96.0
          components: rustfmt,clippy

      - name: Qualify pacing theorem
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path "$MANIFEST" -- --check
          cargo test --locked --manifest-path "$MANIFEST" --all-targets
          cargo clippy --locked --manifest-path "$MANIFEST" --all-targets -- -D warnings

      - name: Prove checkout immutability
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
