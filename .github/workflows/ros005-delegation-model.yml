name: ROS-005 Delegation Model

on:
  pull_request:
    paths:
      - "crates/mycelix-core-types/Cargo.toml"
      - "crates/mycelix-core-types/src/**"
      - ".github/workflows/ros005-delegation-model.yml"
  push:
    branches:
      - main
      - feat/ros-005-parent-chain-hardening
      - research/ros005-model-ci-v0.5
    paths:
      - "crates/mycelix-core-types/Cargo.toml"
      - "crates/mycelix-core-types/src/**"
      - ".github/workflows/ros005-delegation-model.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ros005-delegation-model-v0.5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delegation-model:
    name: Format, test and lint ROS-005 core types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Format check for ROS-005-touched files
        run: rustfmt --edition 2024 --check --config skip_children=true crates/mycelix-core-types/src/delegation.rs crates/mycelix-core-types/src/lib.rs

      - name: Unit and adversarial tests
        run: cargo test --all-targets --manifest-path crates/mycelix-core-types/Cargo.toml

      - name: Package Clippy and strict ROS-005 touched-file gate
        shell: bash
        run: |
          set +e
          mkdir -p target/ros005
          cargo clippy --all-targets --manifest-path crates/mycelix-core-types/Cargo.toml --message-format=json > target/ros005/clippy.jsonl 2> target/ros005/clippy.stderr
          clippy_status=$?
          set -e
          printf '%s\n' "$clippy_status" > target/ros005/clippy.exit-status

          # rustc reports crate-local paths (for example src/delegation.rs),
          # not repository-root paths. Bind diagnostics to this package ID and
          # accept both relative and absolute file names to avoid misclassifying
          # workspace baseline diagnostics as ROS-005 regressions.
          jq -s '
            [
              .[]
              | select(.reason == "compiler-message")
              | select((.package_id // "") | contains("crates/mycelix-core-types#"))
              | select(.message.level == "warning" or .message.level == "error")
              | select(any(
                  .message.spans[]?;
                  .is_primary == true
                  and (
                    (.file_name | endswith("src/delegation.rs"))
                    or
                    (.file_name | endswith("src/lib.rs"))
                  )
                ))
            ]
          ' target/ros005/clippy.jsonl > target/ros005/ros005-touched-diagnostics.json

          if [ "$(jq 'length' target/ros005/ros005-touched-diagnostics.json)" -ne 0 ]; then
            echo "Clippy diagnostics found in ROS-005 touched files:"
            jq -r '.[] | "\(.message.level): \(.message.message) [\(.message.code.code // "no-code")]"' target/ros005/ros005-touched-diagnostics.json
            exit 1
          fi

          echo "ROS-005 touched files are Clippy-clean."
          if [ "$clippy_status" -ne 0 ]; then
            echo "Full-package Clippy returned $clippy_status due to diagnostics outside the ROS-005 touched files."
            echo "Those diagnostics are preserved in the ros005-clippy-diagnostics artifact; no package-wide pass is claimed."
          else
            echo "Full-package Clippy passed."
          fi

      - name: Preserve full package Clippy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ros005-clippy-diagnostics
          path: target/ros005/
          if-no-files-found: warn
