name: ROS-005 Delegation Model

on:
  pull_request:
    paths:
      - "crates/mycelix-core-types/Cargo.toml"
      - "crates/mycelix-core-types/src/**"
      - ".github/workflows/ros005-delegation-model.yml"
  push:
    branches:
      - main
    paths:
      - "crates/mycelix-core-types/Cargo.toml"
      - "crates/mycelix-core-types/src/**"
      - ".github/workflows/ros005-delegation-model.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ros005-delegation-model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delegation-model:
    name: Format, test and lint ROS-005 core types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --manifest-path crates/mycelix-core-types/Cargo.toml -- --check

      - name: Unit and adversarial tests
        run: cargo test --manifest-path crates/mycelix-core-types/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path crates/mycelix-core-types/Cargo.toml --all-targets -- -D warnings
