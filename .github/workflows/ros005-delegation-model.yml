name: ROS-005 Delegation Model

on:
  pull_request:
    paths:
      - "crates/mycelix-core-types/Cargo.toml"
      - "crates/mycelix-core-types/src/**"
      - ".github/workflows/ros005-delegation-model.yml"
  push:
    branches:
      - main
      - feat/ros-005-parent-chain-hardening
      - research/ros005-model-ci-v0.5
    paths:
      - "crates/mycelix-core-types/Cargo.toml"
      - "crates/mycelix-core-types/src/**"
      - ".github/workflows/ros005-delegation-model.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ros005-delegation-model-v0.5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delegation-model:
    name: Format, test and lint ROS-005 core types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Format check for ROS-005-touched files
        run: rustfmt --edition 2024 --check --config skip_children=true crates/mycelix-core-types/src/delegation.rs crates/mycelix-core-types/src/lib.rs

      - name: Unit and adversarial tests
        run: cargo test --all-targets --manifest-path crates/mycelix-core-types/Cargo.toml

      - name: Full-package Clippy with strict ROS-005 diagnostic gate
        shell: bash
        run: |
          mkdir -p target/ros005
          cargo clippy --all-targets --manifest-path crates/mycelix-core-types/Cargo.toml --message-format=json > target/ros005/clippy.jsonl
          if jq -s -e '
            [
              .[]
              | select(.reason == "compiler-message")
              | select(.message.level == "warning" or .message.level == "error")
              | select(any(
                  .message.spans[]?;
                  .is_primary == true
                  and (
                    (.file_name | endswith("crates/mycelix-core-types/src/delegation.rs"))
                    or
                    (.file_name | endswith("crates/mycelix-core-types/src/lib.rs"))
                  )
                ))
            ] | length == 0
          ' target/ros005/clippy.jsonl > /dev/null; then
            echo "ROS-005 touched files are Clippy-clean."
          else
            echo "Clippy diagnostics found in ROS-005 touched files:"
            jq -s -r '
              .[]
              | select(.reason == "compiler-message")
              | select(.message.level == "warning" or .message.level == "error")
              | select(any(
                  .message.spans[]?;
                  .is_primary == true
                  and (
                    (.file_name | endswith("crates/mycelix-core-types/src/delegation.rs"))
                    or
                    (.file_name | endswith("crates/mycelix-core-types/src/lib.rs"))
                  )
                ))
              | .message.message
            ' target/ros005/clippy.jsonl
            exit 1
          fi

      - name: Preserve full package Clippy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ros005-clippy-diagnostics
          path: target/ros005/clippy.jsonl
          if-no-files-found: warn
