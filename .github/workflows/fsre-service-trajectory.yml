name: FSRE service trajectory reference
on:
  pull_request:
    paths:
      - "tools/fsre-service-trajectory/**"
      - ".github/workflows/fsre-service-trajectory.yml"
  push:
    branches:
      - main
    paths:
      - "tools/fsre-service-trajectory/**"
      - ".github/workflows/fsre-service-trajectory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path tools/fsre-service-trajectory/Cargo.toml --all -- --check
      - name: Run deterministic tests
        run: cargo test --locked --manifest-path tools/fsre-service-trajectory/Cargo.toml
      - name: Run Clippy
        run: cargo clippy --locked --manifest-path tools/fsre-service-trajectory/Cargo.toml --all-targets -- -D warnings
