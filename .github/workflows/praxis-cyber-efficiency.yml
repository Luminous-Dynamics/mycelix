name: Praxis Cyber Evidence Acquisition

on:
  pull_request:
    branches: [main, praxis/cyber-evidence-challenges-v1]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "mycelix-praxis/crates/praxis-core/**"
      - "mycelix-praxis/examples/cyber-evidence-efficiency/**"
      - "mycelix-praxis/docs/CYBER_EVIDENCE_EFFICIENCY_V1.md"
      - ".github/workflows/praxis-cyber-efficiency.yml"
  push:
    branches: [main, praxis/cyber-evidence-efficiency-v1]
    paths:
      - "mycelix-praxis/crates/praxis-core/**"
      - "mycelix-praxis/examples/cyber-evidence-efficiency/**"
      - "mycelix-praxis/docs/CYBER_EVIDENCE_EFFICIENCY_V1.md"
      - ".github/workflows/praxis-cyber-efficiency.yml"

permissions:
  contents: read

concurrency:
  group: praxis-cyber-efficiency-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate evidence-acquisition benchmark contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CHECKED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout exact qualification subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CHECKED_SHA }}
          persist-credentials: false

      - name: Assert exact commit identity
        run: test "$(git rev-parse HEAD)" = "$CHECKED_SHA"

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # pinned action
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Assert Rust toolchain identity
        run: test "$(rustc +1.96.0 --version)" = "rustc 1.96.0 (ac68faa20 2026-05-25)"

      - name: Check Praxis Core formatting
        run: cargo +1.96.0 fmt --manifest-path mycelix-praxis/Cargo.toml --package praxis-core -- --check

      - name: Run evidence-acquisition evaluator and adversarial tests
        run: cargo +1.96.0 test --manifest-path mycelix-praxis/Cargo.toml --package praxis-core --test evidence_efficiency -- --nocapture

      - name: Re-run existing cyber corpus contract tests
        run: cargo +1.96.0 test --manifest-path mycelix-praxis/Cargo.toml --package praxis-core --test cyber_challenges -- --nocapture

      - name: Emit qualified subject
        run: echo "Evidence acquisition contract validated for exact commit $CHECKED_SHA"
