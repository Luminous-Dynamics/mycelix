name: Terra Preta soil trial operating characteristics

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/terra-preta/SOIL_TRIAL_OPERATING_CHARACTERISTICS_V0.1.md'
      - 'research/terra-preta/schemas/soil-trial-operating-characteristics-input.schema.json'
      - 'research/terra-preta/schemas/soil-trial-operating-characteristics-report.schema.json'
      - 'research/terra-preta/tools/soil-trial-operating-characteristics/**'
      - '.github/workflows/terra-preta-soil-trial-operating-characteristics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soil-trial-operating-characteristics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path research/terra-preta/tools/soil-trial-operating-characteristics/Cargo.toml -- --check
      - name: Tests
        run: cargo test --manifest-path research/terra-preta/tools/soil-trial-operating-characteristics/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --manifest-path research/terra-preta/tools/soil-trial-operating-characteristics/Cargo.toml --all-targets -- -D warnings
      - name: Install pinned Rust JSON Schema validator
        run: cargo install jsonschema-cli --version 0.61.0 --locked
      - name: Validate suite and report
        run: |
          jsonschema-cli validate research/terra-preta/schemas/soil-trial-operating-characteristics-input.schema.json \
            --instance research/terra-preta/tools/soil-trial-operating-characteristics/fixtures/synthetic-soil-trial-oc.json \
            --draft 2020 --assert-format
          cargo run --quiet --manifest-path research/terra-preta/tools/soil-trial-operating-characteristics/Cargo.toml -- \
            research/terra-preta/tools/soil-trial-operating-characteristics/fixtures/synthetic-soil-trial-oc.json \
            "$RUNNER_TEMP/soil-trial-oc-report.json"
          jsonschema-cli validate research/terra-preta/schemas/soil-trial-operating-characteristics-report.schema.json \
            --instance "$RUNNER_TEMP/soil-trial-oc-report.json" --draft 2020 --assert-format
          jq -e '
            .fixture_status == "synthetic_only_not_empirical_evidence" and
            .scenario_count == 8 and
            .scenarios[0].minimum_attainable_two_sided_p_value == 0.125 and
            .scenarios[0].empirical_rejection_rate == 0 and
            .scenarios[5].qualified_trial_count == 0 and
            .scenarios[5].abstained_missing_outcome_count == 1200 and
            .scenarios[7].qualified_trial_count == 0 and
            .scenarios[7].abstained_interference_count == 1200
          ' "$RUNNER_TEMP/soil-trial-oc-report.json"
      - name: Reject output overwrite
        run: |
          fixture=research/terra-preta/tools/soil-trial-operating-characteristics/fixtures/synthetic-soil-trial-oc.json
          report="$RUNNER_TEMP/existing-oc-report.json"
          printf 'do-not-overwrite\n' > "$report"
          if cargo run --quiet --manifest-path research/terra-preta/tools/soil-trial-operating-characteristics/Cargo.toml -- "$fixture" "$report"; then
            echo "Expected create-new output protection"
            exit 1
          fi
          test "$(cat "$report")" = "do-not-overwrite"
