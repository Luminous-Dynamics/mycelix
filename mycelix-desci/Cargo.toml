[workspace]
members = [
    "src/core",
    "src/api",
    "src/cli",
]
exclude = ["apps/leptos"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Mycelix Contributors"]
repository = "https://github.com/luminousdynamics/mycelix-desci"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.52", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = { version = "2", features = ["serde"] }

# Cryptography
sha2 = "0.10"
blake3 = "1.8"
ed25519-dalek = "2.2"
rand = "0.8"
hex = "0.4"

# Holochain DHT (for P2P data sharing) -- native client. Verified via
# `cargo info` + the holochain_client crate's own published manifest that
# the "stable" numbered lines (0.5.x, 0.6.x, 0.7.x non-dev) are internally
# inconsistent on crates.io today (holochain_client and holochain_types
# each pin a DIFFERENT exact holochain_serialized_bytes -> incompatible
# exact serde versions -- confirmed no committed Cargo.lock anywhere in
# this monorepo has ever actually resolved holochain_client, so those
# pins were untested). The dev-prerelease track is the one that's
# actually self-consistent right now; this is the exact matched set
# holochain_client 0.9.0-dev.32's own Cargo.toml requires internally
# (holochain_types ^0.7.0-dev.31, holochain_zome_types ^0.7.0-dev.20).
# Matches the generation pulse-smtp-gateway already uses (see that
# crate's Cargo.toml comment) -- turns out not to be an unusual
# exception but the only currently-buildable native-client generation.
holochain_client = "=0.9.0-dev.32"
holochain_types = "=0.7.0-dev.31"
holochain_zome_types = "=0.7.0-dev.20"
# For the `holochain_serial!` macro, used to decode zome-call responses
# (Record/Entry payloads) into KnowledgeClaim -- must match whatever
# version holochain_client/holochain_types/holochain_zome_types above
# already resolve to transitively (confirmed 0.0.57 in Cargo.lock).
holochain_serialized_bytes = "=0.0.57"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# UUID and time
uuid = { version = "1.23", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4.6", features = ["derive"] }

# Testing
proptest = "1.11"

# ZKP verification — native Winterfell verifier (no WASM constraints)
mycelix-zkp-core = { path = "../crates/mycelix-zkp-core", features = ["backend-winterfell"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
