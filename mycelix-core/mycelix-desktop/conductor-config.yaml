---
# Mycelix Desktop - Holochain Conductor Configuration
#
# CANONICAL Holochain 0.6.1 schema, taken from `holochain --create-config` run
# against the bundled 0.6.1 binary. Verified to start a real conductor
# ("Conductor ready.", lair-keystore up, admin port honoured).
#
# The previous contents of this file were a 0.5.6 document that Holochain 0.6.1
# REFUSES TO PARSE: `unknown field device_seed_lair_tag`. 0.6 dropped the whole
# `dpki` block and the device-seed fields, and added db_max_readers,
# incoming_request_concurrency_limit, relay_url, request_timeout_s and the
# base64_auth_material_* fields.
#
# This file is a DEV convenience only. The installed app generates its own
# config into the per-user app data directory -- see ensure_conductor_config()
# in src-tauri/src/main.rs. Paths here are relative and only work when the
# conductor is launched from this directory.
#
# NOTE: lair binds a Unix socket at <lair_root>/socket, limited to ~104 bytes.
# Keep these paths short.

tracing_override: null
data_root_path: .holochain
keystore:
  type: lair_server_in_proc
  lair_root: .holochain/ks
admin_interfaces:
- driver:
    type: websocket
    port: 8888
    danger_bind_addr: null
    allowed_origins: '*'
network:
  base64_auth_material_bootstrap: null
  base64_auth_material_relay: null
  bootstrap_url: https://dev-test-bootstrap2.holochain.org/
  signal_url: wss://dev-test-bootstrap2.holochain.org/
  relay_url: https://use1-1.relay.n0.iroh-canary.iroh.link./
  request_timeout_s: 60
  webrtc_config: null
  target_arc_factor: 1
  report: none
  advanced: null
db_sync_strategy: Resilient
db_max_readers: 24
incoming_request_concurrency_limit: 21
tuning_params: null
tracing_scope: null
