[package]
name = "myc-dir-fabric-nats-adapter"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
async-nats = { version = "=0.53.0", features = ["jetstream"] }
async-trait = "=0.1.89"
bytes = "=1.11.1"
futures-util = "=0.3.31"
chrono = "0.4"
serde_json = "1.0"
myc-dir-fabric-nats-reference = { path = "../myc-dir-fabric-nats-reference" }
mycelix-authority-write-lease = { path = "../../mycelix-workspace/crates/mycelix-authority-write-lease" }
sha2 = "=0.10.9"
rustls-tokio-postgres = "=0.5.1"
tokio-postgres = "=0.7.18"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "time"] }

[profile.release]
overflow-checks = true

[dev-dependencies]
ed25519-dalek = "2.1"
uuid = "1.0"
