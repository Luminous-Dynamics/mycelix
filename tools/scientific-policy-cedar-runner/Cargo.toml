[package]
name = "scientific-policy-cedar-runner"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "In-process Cedar 4.14.0 evaluator for the source-pinned Mycelix abstract policy corpus"

[dependencies]
cedar-policy = { version = "=4.14.0", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
hex = "=0.4.3"
sha1 = "=0.10.6"

