\* Certificate-only negative control. This run must violate
\* ExactHistoricalCertificateBinding when an F0 certificate is relabelled.
SPECIFICATION BuggyCertificateSpec

CONSTANTS
    OwnerA = "owner:A"
    OwnerB = "owner:B"
    BaseA = "base-receipt:A:1"
    BaseB = "base-receipt:B:1"
    CorrectionA = "backdated-correction:A:2"
    CorrectionB = "backdated-correction:B:2"
    PolicyEpoch = "policy:epoch:7"
    QueryInstant = 10

INVARIANT TypeOK
INVARIANT ExactHistoricalCertificateBinding
