[package]
name = "emsr-causal-intervention-benchmark"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Controlled-intervention benchmark for hidden common-cause discovery"

[workspace]
resolver = "2"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[dev-dependencies]
jsonschema = { version = "=0.33.0", default-features = false }
