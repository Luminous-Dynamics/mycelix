[package]
name = "building-dcc-evidence"
version = "0.1.0"
edition = "2024"
publish = false
description = "Synthetic trust/applicability state machine for PTB DCC evidence"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

[workspace]
resolver = "3"

[lib]
path = "src/lib.rs"

[[bin]]
name = "building-dcc-evidence"
path = "src/main.rs"
