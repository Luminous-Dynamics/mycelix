[package]
name = "airspace-replay"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Deterministic research fixture for airspace coordination semantics; not operational ATM software"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
sha2 = "0.11.1"

[profile.dev]
overflow-checks = true

[profile.release]
overflow-checks = true
