  - case_id: rem-10-interim-safeguard
    class: positive_control
    expected: interim_safeguard_active
    mutation: prevent_compounding_harm_while_review_is_pending
  - case_id: rem-11-retaliation-protection
    class: negative_control
    expected: adverse_mutation_prohibited_and_protected_route_preserved
    mutation: attempt_to_reduce_future_access_or_benefits_because_good_faith_challenge_was_filed
  - case_id: rem-12-rejected-challenge-with-external-route
    class: positive_control
    expected: decision_upheld_with_reasons_and_external_route_preserved
    mutation: reject_with_reasoned_review_while_preserving_other_remedies
  - case_id: rem-13-remedy-ordered-not-executed
    class: negative_control
    expected: remedy_in_progress_not_completed
    mutation: issue_restoration_order_but_do_not_execute_it
  - case_id: rem-14-restoration-independently-observed
    class: positive_control
