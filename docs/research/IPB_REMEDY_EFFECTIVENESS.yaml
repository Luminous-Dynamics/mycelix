    mutation: execute_restoration_and_attach_independent_observation
  - case_id: rem-15-nonfinancial-remedy-completion
    class: positive_control
    expected: remedy_completed_observed
    mutation: complete_declared_correction_or_rehabilitation_and_observe_result
  - case_id: rem-16-systemic-nonrepetition
    class: positive_control
    expected: systemic_action_verified
    mutation: detect_recurrent_cause_assign_corrective_action_and_verify_effect
  - case_id: rem-17-collective-challenge
    class: positive_control
    expected: representative_authority_valid_group_remedy_visible_privacy_preserved
    mutation: authorized_group_representative_challenges_aggregate_impact
  - case_id: rem-18-external-route-not-waived
    class: negative_control
    expected: coercive_waiver_rejected
    mutation: internal_review_is_conditioned_on_waiving_external_or_collective_remedy
  - case_id: rem-19-incomplete-review-authority
    class: indeterminate_control
    expected: review_indeterminate
    mutation: reviewer_mandate_or_conflict_evidence_unavailable
  - case_id: rem-20-remedy-completion-observation-missing
    class: negative_control
    expected: remedy_completion_not_supported
    mutation: administrator_marks_remedy_done_without_independent_completion_evidence
  - case_id: rem-21-privacy-overdisclosure
    class: negative_control
    expected: unauthorized_disclosure_blocked
    mutation: expose_unrelated_personal_fields_in_challenge_bundle
  - case_id: rem-22-process-delay-without-update
    class: negative_control
    expected: predictability_and_transparency_not_supported
    mutation: exceed_published_stage_deadline_without_status_or_reason

expected_case_count: 22
suite_invariants:
  human_review_without_decision_authority_counts_as_effective_review: false
  remedy_order_equals_remedy_completion: false
  administrator_self_attestation_alone_proves_completion: false
  good_faith_challenge_authorizes_adverse_action: false
  internal_review_can_extinguish_external_remedy: false
  historical_view_can_be_rewritten_by_correction: false
  systemic_policy_change_alone_proves_nonrepetition: false
  missing_reviewer_or_remedy_evidence_is_indeterminate_not_pass: true
  remedy_adequacy_is_scalar_model_output: false
  random_seed: none
  production_authorization: false

evidence_ceiling:
  demonstrates:
    - conformance_to_this_synthetic_remedy_effectiveness_panel
    - correct_distinction_between_review_authority_order_and_completion
  does_not_demonstrate:
    - legal_compliance
    - real_world_accessibility_or_trust
    - substantive_adequacy_of_a_remedy
    - absence_of_retaliation_in_a_real_institution
    - field_effectiveness_or_public_deployment_readiness
